": "<p>Castillo is incorrect with respect to the impact of unanticipated restrictive fiscal policies on the value of the Canadian dollar.<\/p><p>A reduction in the budget deficit means that government borrowing will decline, which reduces interest rates and causes investment funds to flow out of the country. As a result, the value of the Canadian dollar tends to decline.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.3, LOS 10.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 7 through 12 relate to Economics.<\/p><p>Summit Consulting Case Scenario Jill Surratt, CFA, and Elizabeth Castillo, CFA, are analysts for Summit Consulting. Summit provides investment advice to hedge funds and actively managed investment funds throughout the United States and Canada.<\/p><p>Surratt and Castillo have a client, Tom Carr, who is interested in increasing his returns from foreign currency positions. Carr currently has a position in Japanese yen (¥) that he wishes to convert to Taiwanese dollars (NT$) because he thinks the Taiwanese currency will appreciate in the near term. He does not have a quote for yen in terms of the NT$ but has received quotes for both currencies in terms of the U.S. dollar. The quotes are $0.008852-56 for the yen and $0.02874-6 for the Taiwanese dollar. He would like to purchase NT$10 million.<\/p><p>In discussing these quotes, Surratt notes that the bid-ask spread is affected by many factors. She states that if an economic crisis were expected in the Asian markets, then the bid-ask spread of the currency quotes should widen. Castillo states that if a dealer wished to unload an excess inventory of yen, the typical response would be to lower her ask for the yen, thereby narrowing the bid-ask spread.<\/p><p>In regards to changes in currency values, Surratt states that under the Mundell-Fleming model, if the U.S. Federal Reserve restricts the growth of the money supply and foreign interest rates remain constant, then the interest rate differential (U.S. interest rate minus counter currency interest rate) should increase, thereby increasing the value of the dollar.<\/p><p>In addition to using monetary policy, Summit Consulting uses anticipated changes in fiscal policy to forecast exchange rates and the balance of payments for Canada. Castillo states that, under the Mundell-Fleming model, if the Canadian government were to unexpectedly reduce the budget deficit, then this should have a positive impact on the value of the Canadian dollar in the short run because foreigners would have more confidence in the Canadian economy.<\/p><p>Another of Summit&#x27;s clients is Jack Ponder. Ponder would like to investigate the possibility of using covered interest arbitrage to earn risk-free profits over the next three months, assuming initial capital of $1 million. He asks Surratt to gather information on the inflation rates, interest rates, spot rates, and forward rates for the U.S. dollar and the Swiss franc (SF). Surratt has also used technical analysis to obtain a projection of the future spot rate for the two countries&#x27; currencies. The information is presented as follows.<\/p><div class=\"tbl\"><table><tr><td>Spot rate<\/td><td>$0.85 / SF<\/td><\/tr><tr><td>Three-month forward rate (as of today) for SF<\/td><td>$0.80 / SF<\/td><\/tr><tr><td>Expected spot rate three months from now<\/td><td>$0.60 / SF<\/td><\/tr><tr><td>Three-month inflation rate in Switzerland (annualized)<\/td><td>2.0%<\/td><\/tr><tr><td>Three-month inflation rate in the U.S. (annualized)<\/td><td>6.0%<\/td><\/tr><tr><td>Three-month interest rate for SF (annualized)<\/td><td>12.0%<\/td><\/tr><\/table><\/div><p>Three-month interest rate for U.S. dollars (annualized) 18.0%<\/p><p>Ponder has a carry trade open involving the Bun (the currency of Bundovia). Ponder notices that Bundovia has a current account deficit and asks Surrat about the impact of such a deficit on the value of the Bun. Surrat states that the impact on the Bun depends on three factors:<\/p><div class=\"tbl\"><table><tr><td>Factor 1:<\/td><td>The expected size of the current account deficit in the future.<\/td><\/tr><tr><td>Factor 2:<\/td><td>The influence of exchange rates on domestic prices.<\/td><\/tr><tr><td>Factor 3:<\/td><td>The response of import and export demand to changes in import and export prices.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Castillo&#x27;s statements concerning the effect of fiscal policy on currency values, Castillo is:<\/p><\/div>", "subj": "economics"}, {"n": 11, "q": "Which of the following best describes the covered interest arbitrage that Ponder should execute? Borrow in:", "opts": ["Swiss francs to make an arbitrage profit of $80,313.", "U.S. dollars to make an arbitrage profit of $80,313.", "Swiss francs to make an arbitrage profit of $75,588."], "ans": "C", "expl": "The 90-day USD and SF interest rates are 18% / 4 = 4.5% and 12% / 4 = 3% respectively. Using CIRP, F = S (1+R ) / (1+R ) = 0.85 (1.045) / (1.03) = $0.8624 / SF, which is greater than the market forward price $ SF of $0.80/SF. This implies that SF is trading at a bargain price in the forward market—buy it! At t = 0 Cash Flow Buy (i.e., long position in) SF in forward market at $0.80/SF $0 Sell 1,176,471 SF in the spot at $0.85/SF $1,000,000 (1,176,471 SF) Borrow 1,176,471 SF for 90 days @ 12% annual rate 1,176,471 SF Invest $1 million for 90 days @ 18% annual rate ($1,000,000) Total cash flows at t = 0 0 t = 90 Cash Flow Receive USD with interest $1,045,000 Convert USD 969,412* into SF at previously locked-in forward rate of $0.80/SF ($ 969,412) SF 1,211,765 Repay the SF loan taken at t = 0 (1,211,765) Total cash flows at t = 90 $75,588 *This is the amount needed to repay the SF loan (with interest) after conversion. For Further Reference: (Study Session 4, Module 10.2, LOS 10.e)", "explhtml": "<p>The 90-day USD and SF interest rates are 18% / 4 = 4.5% and 12% / 4 = 3% respectively.<\/p><div class=\"tbl\"><table><tr><td>Using CIRP, F = S (1+R ) / (1+R<\/td><td>) = 0.85 (1.045) / (1.03) = $0.8624 / SF, which is greater than the market forward price<\/td><\/tr><tr><td>$<\/td><td>SF<\/td><\/tr><\/table><\/div><p>of $0.80/SF. This implies that SF is trading at a bargain price in the forward market—buy it!<\/p><div class=\"tbl\"><table><tr><td>At t = 0<\/td><td>Cash Flow<\/td><\/tr><tr><td>Buy (i.e., long position in) SF in forward market at $0.80/SF<\/td><td>$0<\/td><\/tr><tr><td>Sell 1,176,471 SF in the spot at $0.85/SF<\/td><td>$1,000,000<\/td><\/tr><tr><td>(1,176,471 SF)<\/td><td><\/td><\/tr><tr><td>Borrow 1,176,471 SF for 90 days @ 12% annual rate<\/td><td>1,176,471 SF<\/td><\/tr><tr><td>Invest $1 million for 90 days @ 18% annual rate<\/td><td>($1,000,000)<\/td><\/tr><tr><td>Total cash flows at t = 0<\/td><td>0<\/td><\/tr><tr><td>t = 90<\/td><td>Cash Flow<\/td><\/tr><tr><td>Receive USD with interest<\/td><td>$1,045,000<\/td><\/tr><tr><td>Convert USD 969,412* into SF at previously locked-in forward rate of $0.80/SF<\/td><td>($ 969,412)<\/td><\/tr><tr><td>SF 1,211,765<\/td><td><\/td><\/tr><tr><td>Repay the SF loan taken at t = 0<\/td><td>(1,211,765)<\/td><\/tr><tr><td>Total cash flows at t = 90<\/td><td>$75,588<\/td><\/tr><\/table><\/div><p>*This is the amount needed to repay the SF loan (with interest) after conversion.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.2, LOS 10.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 7 through 12 relate to Economics.<\/p><p>Summit Consulting Case Scenario Jill Surratt, CFA, and Elizabeth Castillo, CFA, are analysts for Summit Consulting. Summit provides investment advice to hedge funds and actively managed investment funds throughout the United States and Canada.<\/p><p>Surratt and Castillo have a client, Tom Carr, who is interested in increasing his returns from foreign currency positions. Carr currently has a position in Japanese yen (¥) that he wishes to convert to Taiwanese dollars (NT$) because he thinks the Taiwanese currency will appreciate in the near term. He does not have a quote for yen in terms of the NT$ but has received quotes for both currencies in terms of the U.S. dollar. The quotes are $0.008852-56 for the yen and $0.02874-6 for the Taiwanese dollar. He would like to purchase NT$10 million.<\/p><p>In discussing these quotes, Surratt notes that the bid-ask spread is affected by many factors. She states that if an economic crisis were expected in the Asian markets, then the bid-ask spread of the currency quotes should widen. Castillo states that if a dealer wished to unload an excess inventory of yen, the typical response would be to lower her ask for the yen, thereby narrowing the bid-ask spread.<\/p><p>In regards to changes in currency values, Surratt states that under the Mundell-Fleming model, if the U.S. Federal Reserve restricts the growth of the money supply and foreign interest rates remain constant, then the interest rate differential (U.S. interest rate minus counter currency interest rate) should increase, thereby increasing the value of the dollar.<\/p><p>In addition to using monetary policy, Summit Consulting uses anticipated changes in fiscal policy to forecast exchange rates and the balance of payments for Canada. Castillo states that, under the Mundell-Fleming model, if the Canadian government were to unexpectedly reduce the budget deficit, then this should have a positive impact on the value of the Canadian dollar in the short run because foreigners would have more confidence in the Canadian economy.<\/p><p>Another of Summit&#x27;s clients is Jack Ponder. Ponder would like to investigate the possibility of using covered interest arbitrage to earn risk-free profits over the next three months, assuming initial capital of $1 million. He asks Surratt to gather information on the inflation rates, interest rates, spot rates, and forward rates for the U.S. dollar and the Swiss franc (SF). Surratt has also used technical analysis to obtain a projection of the future spot rate for the two countries&#x27; currencies. The information is presented as follows.<\/p><div class=\"tbl\"><table><tr><td>Spot rate<\/td><td>$0.85 / SF<\/td><\/tr><tr><td>Three-month forward rate (as of today) for SF<\/td><td>$0.80 / SF<\/td><\/tr><tr><td>Expected spot rate three months from now<\/td><td>$0.60 / SF<\/td><\/tr><tr><td>Three-month inflation rate in Switzerland (annualized)<\/td><td>2.0%<\/td><\/tr><tr><td>Three-month inflation rate in the U.S. (annualized)<\/td><td>6.0%<\/td><\/tr><tr><td>Three-month interest rate for SF (annualized)<\/td><td>12.0%<\/td><\/tr><\/table><\/div><p>Three-month interest rate for U.S. dollars (annualized) 18.0%<\/p><p>Ponder has a carry trade open involving the Bun (the currency of Bundovia). Ponder notices that Bundovia has a current account deficit and asks Surrat about the impact of such a deficit on the value of the Bun. Surrat states that the impact on the Bun depends on three factors:<\/p><div class=\"tbl\"><table><tr><td>Factor 1:<\/td><td>The expected size of the current account deficit in the future.<\/td><\/tr><tr><td>Factor 2:<\/td><td>The influence of exchange rates on domestic prices.<\/td><\/tr><tr><td>Factor 3:<\/td><td>The response of import and export demand to changes in import and export prices.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the covered interest arbitrage that Ponder should execute? Borrow in:<\/p><\/div>", "subj": "economics"}, {"n": 12, "q": "How many of the factors identified by Surrat regarding Bundovia's current account deficit are accurate?", "opts": ["One factor only.", "Two factors only.", "All three factors."], "ans": "A", "expl": "Only factor 3 is correct. Factor 1 incorrectly specifies the size of expected future deficits rather than size of initial current account deficit. Factor 2 incorrectly specifies influence on domestic prices in general rather than domestic prices of traded goods (i.e., imports/exports). For Further Reference: (Study Session 4, Module 10.3, LOS 10.j)", "explhtml": "<p>Only factor 3 is correct. Factor 1 incorrectly specifies the size of expected future deficits rather than size of initial current account deficit. Factor 2 incorrectly specifies influence on domestic prices in general rather than domestic prices of traded goods (i.e., imports/exports).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.3, LOS 10.j)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 7 through 12 relate to Economics.<\/p><p>Summit Consulting Case Scenario Jill Surratt, CFA, and Elizabeth Castillo, CFA, are analysts for Summit Consulting. Summit provides investment advice to hedge funds and actively managed investment funds throughout the United States and Canada.<\/p><p>Surratt and Castillo have a client, Tom Carr, who is interested in increasing his returns from foreign currency positions. Carr currently has a position in Japanese yen (¥) that he wishes to convert to Taiwanese dollars (NT$) because he thinks the Taiwanese currency will appreciate in the near term. He does not have a quote for yen in terms of the NT$ but has received quotes for both currencies in terms of the U.S. dollar. The quotes are $0.008852-56 for the yen and $0.02874-6 for the Taiwanese dollar. He would like to purchase NT$10 million.<\/p><p>In discussing these quotes, Surratt notes that the bid-ask spread is affected by many factors. She states that if an economic crisis were expected in the Asian markets, then the bid-ask spread of the currency quotes should widen. Castillo states that if a dealer wished to unload an excess inventory of yen, the typical response would be to lower her ask for the yen, thereby narrowing the bid-ask spread.<\/p><p>In regards to changes in currency values, Surratt states that under the Mundell-Fleming model, if the U.S. Federal Reserve restricts the growth of the money supply and foreign interest rates remain constant, then the interest rate differential (U.S. interest rate minus counter currency interest rate) should increase, thereby increasing the value of the dollar.<\/p><p>In addition to using monetary policy, Summit Consulting uses anticipated changes in fiscal policy to forecast exchange rates and the balance of payments for Canada. Castillo states that, under the Mundell-Fleming model, if the Canadian government were to unexpectedly reduce the budget deficit, then this should have a positive impact on the value of the Canadian dollar in the short run because foreigners would have more confidence in the Canadian economy.<\/p><p>Another of Summit&#x27;s clients is Jack Ponder. Ponder would like to investigate the possibility of using covered interest arbitrage to earn risk-free profits over the next three months, assuming initial capital of $1 million. He asks Surratt to gather information on the inflation rates, interest rates, spot rates, and forward rates for the U.S. dollar and the Swiss franc (SF). Surratt has also used technical analysis to obtain a projection of the future spot rate for the two countries&#x27; currencies. The information is presented as follows.<\/p><div class=\"tbl\"><table><tr><td>Spot rate<\/td><td>$0.85 / SF<\/td><\/tr><tr><td>Three-month forward rate (as of today) for SF<\/td><td>$0.80 / SF<\/td><\/tr><tr><td>Expected spot rate three months from now<\/td><td>$0.60 / SF<\/td><\/tr><tr><td>Three-month inflation rate in Switzerland (annualized)<\/td><td>2.0%<\/td><\/tr><tr><td>Three-month inflation rate in the U.S. (annualized)<\/td><td>6.0%<\/td><\/tr><tr><td>Three-month interest rate for SF (annualized)<\/td><td>12.0%<\/td><\/tr><\/table><\/div><p>Three-month interest rate for U.S. dollars (annualized) 18.0%<\/p><p>Ponder has a carry trade open involving the Bun (the currency of Bundovia). Ponder notices that Bundovia has a current account deficit and asks Surrat about the impact of such a deficit on the value of the Bun. Surrat states that the impact on the Bun depends on three factors:<\/p><div class=\"tbl\"><table><tr><td>Factor 1:<\/td><td>The expected size of the current account deficit in the future.<\/td><\/tr><tr><td>Factor 2:<\/td><td>The influence of exchange rates on domestic prices.<\/td><\/tr><tr><td>Factor 3:<\/td><td>The response of import and export demand to changes in import and export prices.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>How many of the factors identified by Surrat regarding Bundovia&#x27;s current account deficit are accurate?<\/p><\/div>", "subj": "economics"}, {"n": 13, "q": "As of December 31, 20X8, the pension plan would be reflected on Iron Parts's balance sheet as:", "opts": ["a $175 million liability.", "a $240 million liability.", "a $183 million asset."], "ans": "B", "expl": "Funded status equals fair value of plan assets minus PBO (395 − 635 = –240). Because the funded status is negative, Iron Parts would report a liability of $240 million. For Further Reference: (Study Session 5, Module 14.2, LOS 14.b)", "explhtml": "<p>Funded status equals fair value of plan assets minus PBO (395 − 635 = –240). Because the funded status is negative, Iron Parts would report a liability of $240 million.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 14.2, LOS 14.b)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Questions 13 through 18 relate to Financial Reporting and Analysis.<\/p><p>DF Investments Case Scenario<\/p><p>Lauren Jacobs, CFA, is an equity analyst for DF Investments. She is evaluating Iron Parts, Inc. Iron Parts is a manufacturer of interior systems and components for automobiles. The company is the world&#x27;s second-largest original equipment auto parts supplier, with a market capitalization of $1.8 billion. Based on Iron Parts&#x27;s low price-to-book value ratio of 0.9× and low price-to-sales ratio of 0.15×, Jacobs believes the stock could be an interesting investment. However, she wants to review the disclosures found in the company&#x27;s financial statements. In particular, Jacobs is concerned about Iron Parts&#x27;s defined benefit pension plan.<\/p><p>The following information for 20X7 and 20X8 is provided.<\/p><div class=\"tbl\"><table><tr><td>In millions, December 31<\/td><td>20X8 20X7<\/td><td><\/td><\/tr><tr><td>Projected benefit obligation (PBO)<\/td><td>$635<\/td><td>$500<\/td><\/tr><tr><td>Current service cost<\/td><td>30<\/td><td>18<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>37<\/td><td>32<\/td><\/tr><tr><td>Benefits paid<\/td><td>22<\/td><td>15<\/td><\/tr><tr><td>Past service cost<\/td><td>80<\/td><td>45<\/td><\/tr><tr><td>Employee contributions<\/td><td>17<\/td><td>15<\/td><\/tr><tr><td>Fair market value of plan assets<\/td><td>395<\/td><td>327<\/td><\/tr><tr><td>Discount rate<\/td><td>6.0% 5.5%<\/td><td><\/td><\/tr><tr><td>Expected return on plan assets<\/td><td>8.2% 7.5%<\/td><td><\/td><\/tr><tr><td>Rate of compensation increase<\/td><td>4.0% 4.0%<\/td><td><\/td><\/tr><\/table><\/div><p>Iron Parts reports under U.S. GAAP.<\/p><p>Jacobs wants to fully understand the impact of changing pension assumptions on Iron Parts&#x27;s balance sheet and income statement. In addition, she would like to compute Iron Parts&#x27;s true pension expense.<\/p><\/div><\/details><div class=\"qtext\"><p>As of December 31, 20X8, the pension plan would be reflected on Iron Parts&#x27;s balance sheet as:<\/p><\/div>", "subj": "fsa"}, {"n": 14, "q": "Which of the following best describes the effects of the change in Iron Parts's discount rate for 20X8, all else being equal?", "opts": ["Service cost decreased and the pension plan appeared more funded.", "Pension expense decreased and the PBO increased.", "Interest cost increased and retained earnings decreased."], "ans": "A", "expl": "The discount rate increased from 5.5% to 6.0%. An increase in the discount rate will result in lower service cost. Lower service cost will result in a lower PBO. A lower PBO will result in a higher funded status (more funded). Lower service cost will result in lower pension expense and higher retained earnings. The impact on interest cost cannot be determined without more information. For Further Reference: (Study Session 5, Module 14.5, LOS 14.d)", "explhtml": "<p>The discount rate increased from 5.5% to 6.0%. An increase in the discount rate will result in lower service cost. Lower service cost will result in a lower PBO. A lower PBO will result in a higher funded status (more funded). Lower service cost will result in lower pension expense and higher retained earnings. The impact on interest cost cannot be determined without more information.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 14.5, LOS 14.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 13 through 18 relate to Financial Reporting and Analysis.<\/p><p>DF Investments Case Scenario<\/p><p>Lauren Jacobs, CFA, is an equity analyst for DF Investments. She is evaluating Iron Parts, Inc. Iron Parts is a manufacturer of interior systems and components for automobiles. The company is the world&#x27;s second-largest original equipment auto parts supplier, with a market capitalization of $1.8 billion. Based on Iron Parts&#x27;s low price-to-book value ratio of 0.9× and low price-to-sales ratio of 0.15×, Jacobs believes the stock could be an interesting investment. However, she wants to review the disclosures found in the company&#x27;s financial statements. In particular, Jacobs is concerned about Iron Parts&#x27;s defined benefit pension plan.<\/p><p>The following information for 20X7 and 20X8 is provided.<\/p><div class=\"tbl\"><table><tr><td>In millions, December 31<\/td><td>20X8 20X7<\/td><td><\/td><\/tr><tr><td>Projected benefit obligation (PBO)<\/td><td>$635<\/td><td>$500<\/td><\/tr><tr><td>Current service cost<\/td><td>30<\/td><td>18<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>37<\/td><td>32<\/td><\/tr><tr><td>Benefits paid<\/td><td>22<\/td><td>15<\/td><\/tr><tr><td>Past service cost<\/td><td>80<\/td><td>45<\/td><\/tr><tr><td>Employee contributions<\/td><td>17<\/td><td>15<\/td><\/tr><tr><td>Fair market value of plan assets<\/td><td>395<\/td><td>327<\/td><\/tr><tr><td>Discount rate<\/td><td>6.0% 5.5%<\/td><td><\/td><\/tr><tr><td>Expected return on plan assets<\/td><td>8.2% 7.5%<\/td><td><\/td><\/tr><tr><td>Rate of compensation increase<\/td><td>4.0% 4.0%<\/td><td><\/td><\/tr><\/table><\/div><p>Iron Parts reports under U.S. GAAP.<\/p><p>Jacobs wants to fully understand the impact of changing pension assumptions on Iron Parts&#x27;s balance sheet and income statement. In addition, she would like to compute Iron Parts&#x27;s true pension expense.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the effects of the change in Iron Parts&#x27;s discount rate for 20X8, all else being equal?<\/p><\/div>", "subj": "fsa"}, {"n": 15, "q": "How much did Iron Parts contribute to its pension plan during 20X8?", "opts": ["$31 million.", "$36 million.", "$53 million."], "ans": "B", "expl": "$327 beginning balance plan assets + $37 actual return + $17 employee contributions + employer contributions − $22 benefits paid = $395 ending balance plan assets. Solving for the contributions, we get $36. For Further Reference: (Study Session 5, Module 14.2, LOS 14.b)", "explhtml": "<p>$327 beginning balance plan assets + $37 actual return + $17 employee contributions + employer contributions − $22 benefits paid = $395 ending balance plan assets. Solving for the contributions, we get $36.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 14.2, LOS 14.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 13 through 18 relate to Financial Reporting and Analysis.<\/p><p>DF Investments Case Scenario<\/p><p>Lauren Jacobs, CFA, is an equity analyst for DF Investments. She is evaluating Iron Parts, Inc. Iron Parts is a manufacturer of interior systems and components for automobiles. The company is the world&#x27;s second-largest original equipment auto parts supplier, with a market capitalization of $1.8 billion. Based on Iron Parts&#x27;s low price-to-book value ratio of 0.9× and low price-to-sales ratio of 0.15×, Jacobs believes the stock could be an interesting investment. However, she wants to review the disclosures found in the company&#x27;s financial statements. In particular, Jacobs is concerned about Iron Parts&#x27;s defined benefit pension plan.<\/p><p>The following information for 20X7 and 20X8 is provided.<\/p><div class=\"tbl\"><table><tr><td>In millions, December 31<\/td><td>20X8 20X7<\/td><td><\/td><\/tr><tr><td>Projected benefit obligation (PBO)<\/td><td>$635<\/td><td>$500<\/td><\/tr><tr><td>Current service cost<\/td><td>30<\/td><td>18<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>37<\/td><td>32<\/td><\/tr><tr><td>Benefits paid<\/td><td>22<\/td><td>15<\/td><\/tr><tr><td>Past service cost<\/td><td>80<\/td><td>45<\/td><\/tr><tr><td>Employee contributions<\/td><td>17<\/td><td>15<\/td><\/tr><tr><td>Fair market value of plan assets<\/td><td>395<\/td><td>327<\/td><\/tr><tr><td>Discount rate<\/td><td>6.0% 5.5%<\/td><td><\/td><\/tr><tr><td>Expected return on plan assets<\/td><td>8.2% 7.5%<\/td><td><\/td><\/tr><tr><td>Rate of compensation increase<\/td><td>4.0% 4.0%<\/td><td><\/td><\/tr><\/table><\/div><p>Iron Parts reports under U.S. GAAP.<\/p><p>Jacobs wants to fully understand the impact of changing pension assumptions on Iron Parts&#x27;s balance sheet and income statement. In addition, she would like to compute Iron Parts&#x27;s true pension expense.<\/p><\/div><\/details><div class=\"qtext\"><p>How much did Iron Parts contribute to its pension plan during 20X8?<\/p><\/div>", "subj": "fsa"}, {"n": 16, "q": "Which of the following best describes the effect(s) of the change in Iron Parts's expected return on the plan assets, all else being equal?", "opts": ["Pension expense decreased and the PBO increased.", "Retained earnings increased and the pension plan appeared more funded.", "Net income increased."], "ans": "C", "expl": "The higher expected return reduces pension expense. Lower pension expense results in higher net income. Higher net income results in higher retained earnings. Neither the PBO nor the funded status is affected by the expected return on plan assets. For Further Reference: (Study Session 5, Module 14.5, LOS 14.d)", "explhtml": "<p>The higher expected return reduces pension expense. Lower pension expense results in higher net income. Higher net income results in higher retained earnings. Neither the PBO nor the funded status is affected by the expected return on plan assets.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 14.5, LOS 14.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 13 through 18 relate to Financial Reporting and Analysis.<\/p><p>DF Investments Case Scenario<\/p><p>Lauren Jacobs, CFA, is an equity analyst for DF Investments. She is evaluating Iron Parts, Inc. Iron Parts is a manufacturer of interior systems and components for automobiles. The company is the world&#x27;s second-largest original equipment auto parts supplier, with a market capitalization of $1.8 billion. Based on Iron Parts&#x27;s low price-to-book value ratio of 0.9× and low price-to-sales ratio of 0.15×, Jacobs believes the stock could be an interesting investment. However, she wants to review the disclosures found in the company&#x27;s financial statements. In particular, Jacobs is concerned about Iron Parts&#x27;s defined benefit pension plan.<\/p><p>The following information for 20X7 and 20X8 is provided.<\/p><div class=\"tbl\"><table><tr><td>In millions, December 31<\/td><td>20X8 20X7<\/td><td><\/td><\/tr><tr><td>Projected benefit obligation (PBO)<\/td><td>$635<\/td><td>$500<\/td><\/tr><tr><td>Current service cost<\/td><td>30<\/td><td>18<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>37<\/td><td>32<\/td><\/tr><tr><td>Benefits paid<\/td><td>22<\/td><td>15<\/td><\/tr><tr><td>Past service cost<\/td><td>80<\/td><td>45<\/td><\/tr><tr><td>Employee contributions<\/td><td>17<\/td><td>15<\/td><\/tr><tr><td>Fair market value of plan assets<\/td><td>395<\/td><td>327<\/td><\/tr><tr><td>Discount rate<\/td><td>6.0% 5.5%<\/td><td><\/td><\/tr><tr><td>Expected return on plan assets<\/td><td>8.2% 7.5%<\/td><td><\/td><\/tr><tr><td>Rate of compensation increase<\/td><td>4.0% 4.0%<\/td><td><\/td><\/tr><\/table><\/div><p>Iron Parts reports under U.S. GAAP.<\/p><p>Jacobs wants to fully understand the impact of changing pension assumptions on Iron Parts&#x27;s balance sheet and income statement. In addition, she would like to compute Iron Parts&#x27;s true pension expense.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the effect(s) of the change in Iron Parts&#x27;s expected return on the plan assets, all else being equal?<\/p><\/div>", "subj": "fsa"}, {"n": 17, "q": "For this question only, assume that Iron Parts reports under IFRS. The amount of periodic pension cost reported on the 20X8 P&L would be closest to:", "opts": ["$48 million.", "$69 million.", "$120 million."], "ans": "C", "expl": "Amount reported under IFRS: Service cost $30 Interest cost 1 $10.4 Past service cost $80 Pension cost on P&L $120.4 million 1 Interest cost = discount rate × beginning funded status = 0.06 × (500 − 327) For Further Reference: (Study Session 5, Module 14.3, LOS 14.c)", "explhtml": "<p>Amount reported under IFRS:<\/p><div class=\"tbl\"><table><tr><td>Service cost<\/td><td>$30<\/td><td><\/td><\/tr><tr><td>Interest cost<\/td><td>1<\/td><td>$10.4<\/td><\/tr><tr><td>Past service cost<\/td><td>$80<\/td><td><\/td><\/tr><tr><td>Pension cost on P&amp;L<\/td><td>$120.4 million<\/td><td><\/td><\/tr><tr><td>1<\/td><td>Interest cost = discount rate × beginning funded status = 0.06 × (500 − 327)<\/td><td><\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 14.3, LOS 14.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 13 through 18 relate to Financial Reporting and Analysis.<\/p><p>DF Investments Case Scenario<\/p><p>Lauren Jacobs, CFA, is an equity analyst for DF Investments. She is evaluating Iron Parts, Inc. Iron Parts is a manufacturer of interior systems and components for automobiles. The company is the world&#x27;s second-largest original equipment auto parts supplier, with a market capitalization of $1.8 billion. Based on Iron Parts&#x27;s low price-to-book value ratio of 0.9× and low price-to-sales ratio of 0.15×, Jacobs believes the stock could be an interesting investment. However, she wants to review the disclosures found in the company&#x27;s financial statements. In particular, Jacobs is concerned about Iron Parts&#x27;s defined benefit pension plan.<\/p><p>The following information for 20X7 and 20X8 is provided.<\/p><div class=\"tbl\"><table><tr><td>In millions, December 31<\/td><td>20X8 20X7<\/td><td><\/td><\/tr><tr><td>Projected benefit obligation (PBO)<\/td><td>$635<\/td><td>$500<\/td><\/tr><tr><td>Current service cost<\/td><td>30<\/td><td>18<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>37<\/td><td>32<\/td><\/tr><tr><td>Benefits paid<\/td><td>22<\/td><td>15<\/td><\/tr><tr><td>Past service cost<\/td><td>80<\/td><td>45<\/td><\/tr><tr><td>Employee contributions<\/td><td>17<\/td><td>15<\/td><\/tr><tr><td>Fair market value of plan assets<\/td><td>395<\/td><td>327<\/td><\/tr><tr><td>Discount rate<\/td><td>6.0% 5.5%<\/td><td><\/td><\/tr><tr><td>Expected return on plan assets<\/td><td>8.2% 7.5%<\/td><td><\/td><\/tr><tr><td>Rate of compensation increase<\/td><td>4.0% 4.0%<\/td><td><\/td><\/tr><\/table><\/div><p>Iron Parts reports under U.S. GAAP.<\/p><p>Jacobs wants to fully understand the impact of changing pension assumptions on Iron Parts&#x27;s balance sheet and income statement. In addition, she would like to compute Iron Parts&#x27;s true pension expense.<\/p><\/div><\/details><div class=\"qtext\"><p>For this question only, assume that Iron Parts reports under IFRS. The amount of periodic pension cost reported on the 20X8 P&amp;L would be closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 18, "q": "For the year ended December 31, 20X8, Iron Parts's total periodic pension cost is closest to:", "opts": ["$67 million.", "$103 million.", "$157 million."], "ans": "B", "expl": "interest cost = beginning PBO × discount rate = 0.06 × 500 = $30. TPPC = current service cost + past service cost + interest cost + losses due to changes in actuarial assumptions affecting PBO − actual return = 30 + 80 + 30 + 0 − 37 = $103 Alternatively, total periodic pension cost is equal to employer contributions of $36 minus the change in funded status. 20X8 funded status was –240 (395 plan assets − 635 PBO) and the funded status for 20X7 was –173 (327 plan assets − 500 PBO), so the change in funded status is –240 − (–173) = –$67. Thus, total periodic pension cost is $103 [36 − (–67)]. For Further Reference: (Study Session 5, Module 14.3, LOS 14.c)", "explhtml": "<p>interest cost = beginning PBO × discount rate = 0.06 × 500 = $30.<\/p><p>TPPC = current service cost + past service cost + interest cost + losses due to changes in actuarial assumptions affecting PBO − actual return = 30 + 80 + 30 + 0 − 37 = $103<\/p><p>Alternatively, total periodic pension cost is equal to employer contributions of $36 minus the change in funded status. 20X8 funded status was –240 (395 plan assets − 635 PBO) and the funded status for 20X7 was –173 (327 plan assets − 500 PBO), so the change in funded status is –240 − (–173) = –$67. Thus, total periodic pension cost is $103 [36 − (–67)].<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 14.3, LOS 14.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 13 through 18 relate to Financial Reporting and Analysis.<\/p><p>DF Investments Case Scenario<\/p><p>Lauren Jacobs, CFA, is an equity analyst for DF Investments. She is evaluating Iron Parts, Inc. Iron Parts is a manufacturer of interior systems and components for automobiles. The company is the world&#x27;s second-largest original equipment auto parts supplier, with a market capitalization of $1.8 billion. Based on Iron Parts&#x27;s low price-to-book value ratio of 0.9× and low price-to-sales ratio of 0.15×, Jacobs believes the stock could be an interesting investment. However, she wants to review the disclosures found in the company&#x27;s financial statements. In particular, Jacobs is concerned about Iron Parts&#x27;s defined benefit pension plan.<\/p><p>The following information for 20X7 and 20X8 is provided.<\/p><div class=\"tbl\"><table><tr><td>In millions, December 31<\/td><td>20X8 20X7<\/td><td><\/td><\/tr><tr><td>Projected benefit obligation (PBO)<\/td><td>$635<\/td><td>$500<\/td><\/tr><tr><td>Current service cost<\/td><td>30<\/td><td>18<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>37<\/td><td>32<\/td><\/tr><tr><td>Benefits paid<\/td><td>22<\/td><td>15<\/td><\/tr><tr><td>Past service cost<\/td><td>80<\/td><td>45<\/td><\/tr><tr><td>Employee contributions<\/td><td>17<\/td><td>15<\/td><\/tr><tr><td>Fair market value of plan assets<\/td><td>395<\/td><td>327<\/td><\/tr><tr><td>Discount rate<\/td><td>6.0% 5.5%<\/td><td><\/td><\/tr><tr><td>Expected return on plan assets<\/td><td>8.2% 7.5%<\/td><td><\/td><\/tr><tr><td>Rate of compensation increase<\/td><td>4.0% 4.0%<\/td><td><\/td><\/tr><\/table><\/div><p>Iron Parts reports under U.S. GAAP.<\/p><p>Jacobs wants to fully understand the impact of changing pension assumptions on Iron Parts&#x27;s balance sheet and income statement. In addition, she would like to compute Iron Parts&#x27;s true pension expense.<\/p><\/div><\/details><div class=\"qtext\"><p>For the year ended December 31, 20X8, Iron Parts&#x27;s total periodic pension cost is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "With respect to the balance sheet accrual ratio, which of the following, other things equal, would most likely lead to an increase in the ratio for a growing company?", "opts": ["Extending the time the firm takes to pay its suppliers.", "A significant build-up of cash.", "A build-up of inventory."], "ans": "C", "expl": "The balance sheet accrual ratio is the year-over-year increase in net operating assets divided by average net operating assets. An increase in payables (a liability) will tend to decrease (reduce the change in) net operating assets, while an increase in inventory will tend to increase (increase the change in) net operating assets. Cash is not an operating asset and does not affect the ratio. For Further Reference: (Study Session 6, Module 18.5, LOS 18.e)", "explhtml": "<p>The balance sheet accrual ratio is the year-over-year increase in net operating assets divided by average net operating assets. An increase in payables (a liability) will tend to decrease (reduce the change in) net operating assets, while an increase in inventory will tend to increase (increase the change in) net operating assets. Cash is not an operating asset and does not affect the ratio.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 6, Module 18.5, LOS 18.e)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Questions 19 through 24 relate to Financial Reporting and Analysis.<\/p><p>Tobin Yoakam Case Scenario<\/p><p>Tobin Yoakam, CFA, is analyzing the financial performance of Konker Industries, a U.S. company which is publicly traded under the ticker KONK. Yoakam is particularly concerned about the quality of Konker&#x27;s financial statements and its choices of accounting methodologies.<\/p><p>Below is a summary of Konker&#x27;s financial statements prepared by Yoakam.<\/p><p>Konker Industries<\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>Balance Sheet<\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X8<\/td><td><\/td><\/tr><tr><td>($ in thousands)<\/td><td>($ in thousands)<\/td><td><\/td><\/tr><tr><td>Gross sales<\/td><td>55,435 Cash and equivalents<\/td><td>457<\/td><\/tr><tr><td>Sales discounts, returns, and allowances<\/td><td>1,352 Short term marketable securities<\/td><td>927<\/td><\/tr><tr><td>Net sales<\/td><td>54,083 Accounts receivable (net)<\/td><td>47,740<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>26,500 Inventories<\/td><td>20,963<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>15,625 PP&amp;E (net of depreciation)<\/td><td>25,371<\/td><\/tr><tr><td>Depreciation expense<\/td><td>1,082 Total assets<\/td><td>95,458<\/td><\/tr><tr><td>Earnings before interest and taxes<\/td><td>10,876<\/td><td><\/td><\/tr><tr><td>Interest expense<\/td><td>693 Accounts payable<\/td><td>24,994<\/td><\/tr><tr><td>Earnings before taxes<\/td><td>10,183 Other current liabilities<\/td><td>1,209<\/td><\/tr><tr><td>Taxes (tax rate 40%)<\/td><td>4,073 Long term debt<\/td><td>21,770<\/td><\/tr><tr><td>Net income<\/td><td>6,110 Total liabilities<\/td><td>47,973<\/td><\/tr><tr><td>Common stock<\/td><td>40,314<\/td><td><\/td><\/tr><tr><td>Dividends<\/td><td>5,046 Retained earnings<\/td><td>7,171<\/td><\/tr><tr><td>Net addition to retained earnings<\/td><td>1,064 Total liabilities and shareholders equity 95,458<\/td><td><\/td><\/tr><\/table><\/div><p>At the beginning of 20X8, Konker formed a qualified special purpose entity (QSPE) and sold a portion of its accounts receivables to the QSPE. Under U.S. GAAP, QSPE was exempt from consolidation requirements. The total amount of accounts receivables sold to the QSPE was $13.5 million. Yoakam has noted in his research that the Financial Accounting Standards Board (FASB) eliminated qualified special purpose entities.<\/p><p>Konker has three major operating divisions: Konker Industrial, Konker Defense, and Konker Capital. Yoakam has computed the EBIT margin for each division over the last three years, as well as the ratio of the percentage of total capital expenditures to the percentage of total assets for each division.<\/p><div class=\"tbl\"><table><tr><td>EBIT / Assets<\/td><td>CapEx % / Assets %<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td><\/td><\/tr><tr><td>Konker Industrial<\/td><td>6.2%<\/td><td>7.5%<\/td><td>6.7%<\/td><td>1.5<\/td><td>1.3<\/td><td>1.2<\/td><\/tr><tr><td>Konker Defense<\/td><td>6.7%<\/td><td>7.2%<\/td><td>6.9%<\/td><td>0.5<\/td><td>0.6<\/td><td>0.7<\/td><\/tr><tr><td>Konker Capital<\/td><td>10.1% 12.1% 11.1%<\/td><td>0.7<\/td><td>0.6<\/td><td>0.5<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Since Yoakam is concerned about the quality of Konker&#x27;s earnings, he decides to analyze the accrual ratios using the balance sheet approach. The table below contains the last three years of accrual ratios for Konker and the industry average.<\/p><div class=\"tbl\"><table><tr><td>Balance Sheet Accrual Ratios 20X8<\/td><td>20X7<\/td><td>20X6<\/td><\/tr><tr><td>Konker<\/td><td>4.5% 15.0% 7.0%<\/td><td><\/td><\/tr><tr><td>Industry average<\/td><td>4.8%<\/td><td>4.4% 5.2%<\/td><\/tr><\/table><\/div><p>Yoakam meets his colleague Sarah for lunch. Sarah specializes in the insurance sector and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>P&amp;C insurers&#x27; liability duration is shorter than that of life insurance companies.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Analysis of a life insurer&#x27;s profitability includes analysis of its loss reserves.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>With respect to the balance sheet accrual ratio, which of the following, other things equal, would most likely lead to an increase in the ratio for a growing company?<\/p><\/div>", "subj": "fsa"}, {"n": 20, "q": "When FASB retroactively eliminated the allowance of QSPEs created for the securitization of receivables, the most likely impact on Konker's financial statements would have been:", "opts": ["an increase in equity and an increase in interest expense.", "no change in assets but an increase in financial leverage ratios.", "an increase in financial leverage ratios and a decrease in the interest coverage ratio."], "ans": "C", "expl": "The elimination of the securitization of receivables as an off-balance-sheet item would result in Konker having to report the transaction as securitized borrowing, replacing the receivables on the balance sheet, and reporting a liability equal to the proceeds of the securitization transaction. The impact on Konker's balance sheet would be an increase in assets, and an increase in liabilities. The change in equity from reporting the transaction in this way is likely to be small. Financial leverage would increase, and the consequent increase in interest expense from the liability would decrease the interest coverage ratio. For Further Reference: (Study Session 5, Module 13.9, LOS 13.c, Study Session 6, Module 18.2, LOS 18.d)", "explhtml": "<p>The elimination of the securitization of receivables as an off-balance-sheet item would result in Konker having to report the transaction as securitized borrowing, replacing the receivables on the balance sheet, and reporting a liability equal to the proceeds of the securitization transaction. The impact on Konker&#x27;s balance sheet would be an increase in assets, and an increase in liabilities. The change in equity from reporting the transaction in this way is likely to be small. Financial leverage would increase, and the consequent increase in interest expense from the liability would decrease the interest coverage ratio.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.9, LOS 13.c, Study Session 6, Module 18.2, LOS 18.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 19 through 24 relate to Financial Reporting and Analysis.<\/p><p>Tobin Yoakam Case Scenario<\/p><p>Tobin Yoakam, CFA, is analyzing the financial performance of Konker Industries, a U.S. company which is publicly traded under the ticker KONK. Yoakam is particularly concerned about the quality of Konker&#x27;s financial statements and its choices of accounting methodologies.<\/p><p>Below is a summary of Konker&#x27;s financial statements prepared by Yoakam.<\/p><p>Konker Industries<\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>Balance Sheet<\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X8<\/td><td><\/td><\/tr><tr><td>($ in thousands)<\/td><td>($ in thousands)<\/td><td><\/td><\/tr><tr><td>Gross sales<\/td><td>55,435 Cash and equivalents<\/td><td>457<\/td><\/tr><tr><td>Sales discounts, returns, and allowances<\/td><td>1,352 Short term marketable securities<\/td><td>927<\/td><\/tr><tr><td>Net sales<\/td><td>54,083 Accounts receivable (net)<\/td><td>47,740<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>26,500 Inventories<\/td><td>20,963<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>15,625 PP&amp;E (net of depreciation)<\/td><td>25,371<\/td><\/tr><tr><td>Depreciation expense<\/td><td>1,082 Total assets<\/td><td>95,458<\/td><\/tr><tr><td>Earnings before interest and taxes<\/td><td>10,876<\/td><td><\/td><\/tr><tr><td>Interest expense<\/td><td>693 Accounts payable<\/td><td>24,994<\/td><\/tr><tr><td>Earnings before taxes<\/td><td>10,183 Other current liabilities<\/td><td>1,209<\/td><\/tr><tr><td>Taxes (tax rate 40%)<\/td><td>4,073 Long term debt<\/td><td>21,770<\/td><\/tr><tr><td>Net income<\/td><td>6,110 Total liabilities<\/td><td>47,973<\/td><\/tr><tr><td>Common stock<\/td><td>40,314<\/td><td><\/td><\/tr><tr><td>Dividends<\/td><td>5,046 Retained earnings<\/td><td>7,171<\/td><\/tr><tr><td>Net addition to retained earnings<\/td><td>1,064 Total liabilities and shareholders equity 95,458<\/td><td><\/td><\/tr><\/table><\/div><p>At the beginning of 20X8, Konker formed a qualified special purpose entity (QSPE) and sold a portion of its accounts receivables to the QSPE. Under U.S. GAAP, QSPE was exempt from consolidation requirements. The total amount of accounts receivables sold to the QSPE was $13.5 million. Yoakam has noted in his research that the Financial Accounting Standards Board (FASB) eliminated qualified special purpose entities.<\/p><p>Konker has three major operating divisions: Konker Industrial, Konker Defense, and Konker Capital. Yoakam has computed the EBIT margin for each division over the last three years, as well as the ratio of the percentage of total capital expenditures to the percentage of total assets for each division.<\/p><div class=\"tbl\"><table><tr><td>EBIT / Assets<\/td><td>CapEx % / Assets %<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td><\/td><\/tr><tr><td>Konker Industrial<\/td><td>6.2%<\/td><td>7.5%<\/td><td>6.7%<\/td><td>1.5<\/td><td>1.3<\/td><td>1.2<\/td><\/tr><tr><td>Konker Defense<\/td><td>6.7%<\/td><td>7.2%<\/td><td>6.9%<\/td><td>0.5<\/td><td>0.6<\/td><td>0.7<\/td><\/tr><tr><td>Konker Capital<\/td><td>10.1% 12.1% 11.1%<\/td><td>0.7<\/td><td>0.6<\/td><td>0.5<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Since Yoakam is concerned about the quality of Konker&#x27;s earnings, he decides to analyze the accrual ratios using the balance sheet approach. The table below contains the last three years of accrual ratios for Konker and the industry average.<\/p><div class=\"tbl\"><table><tr><td>Balance Sheet Accrual Ratios 20X8<\/td><td>20X7<\/td><td>20X6<\/td><\/tr><tr><td>Konker<\/td><td>4.5% 15.0% 7.0%<\/td><td><\/td><\/tr><tr><td>Industry average<\/td><td>4.8%<\/td><td>4.4% 5.2%<\/td><\/tr><\/table><\/div><p>Yoakam meets his colleague Sarah for lunch. Sarah specializes in the insurance sector and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>P&amp;C insurers&#x27; liability duration is shorter than that of life insurance companies.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Analysis of a life insurer&#x27;s profitability includes analysis of its loss reserves.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>When FASB retroactively eliminated the allowance of QSPEs created for the securitization of receivables, the most likely impact on Konker&#x27;s financial statements would have been:<\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "An analyst is considering the effects of income reported under the equity method on certain financial ratios. For a firm that reports equity income as non-operating income (not included in EBIT), removing equity income from the financial statements would most likely result in:", "opts": ["an increase in the tax burden term in the extended Du Pont decomposition of ROE.", "an increase in the asset turnover ratio.", "a decrease in the interest coverage ratio."], "ans": "B", "expl": "Removing the effects of the income reported under the equity method involves removing the income and the equity asset reported on the balance sheet. The decrease in total assets will increase the asset turnover ratio. The tax burden term is net income divided by earnings before tax so that the decrease in net income from removing the equity income will decrease the term. Neither interest expense nor operating earnings (EBIT) are affected by the appropriate adjustments, so the interest coverage ratio is unaffected. For Further Reference: (Study Session 6, Module 18.2, LOS 18.b)", "explhtml": "<p>Removing the effects of the income reported under the equity method involves removing the income and the equity asset reported on the balance sheet. The decrease in total assets will increase the asset turnover ratio. The tax burden term is net income divided by earnings before tax so that the decrease in net income from removing the equity income will decrease the term. Neither interest expense nor operating earnings (EBIT) are affected by the appropriate adjustments, so the interest coverage ratio is unaffected.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 6, Module 18.2, LOS 18.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p ars of accrual ratios for Konker and the industry average.<\/p><div class=\"tbl\"><table><tr><td>Balance Sheet Accrual Ratios 20X8<\/td><td>20X7<\/td><td>20X6<\/td><\/tr><tr><td>Konker<\/td><td>4.5% 15.0% 7.0%<\/td><td><\/td><\/tr><tr><td>Industry average<\/td><td>4.8%<\/td><td>4.4% 5.2%<\/td><\/tr><\/table><\/div><p>Yoakam meets his colleague Sarah for lunch. Sarah specializes in the insurance sector and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>P&amp;C insurers&#x27; liability duration is shorter than that of life insurance companies.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Analysis of a life insurer&#x27;s profitability includes analysis of its loss reserves.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of Sarah&#x27;s statements about insurance companies is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 25, "q": "Using the target payout ratio adjustment model approach to estimate dividend increases, determine which of the following is closest to the target payout ratio estimated by MavsHD's managers.", "opts": ["15%.", "20%.", "25%."], "ans": "A", "expl": "The target payout ratio approach to estimating a company's expected dividend uses the following formula: expected increase in dividends = [(expected earnings × target payout ratio) – previous dividend] × adjustment factor Rearranging the formula to solve for the target payout ratio, we obtain: target payout ratio = [(expected increase in dividends ÷ adjustment factor) + previous dividend] ÷ expected earnings Managers at MavsHD want to move toward the target payout ratio over a period of 8 years, which makes the adjustment factor equal to: 1 / 8 = 0.125. The expected dividend increase is given as $250,000, and the previous dividend is given as $21,750,000. Plugging each of these figures into the previous formula, the target payout ratio is calculated as: target payout ratio = [($250,000 ÷ 0.125) + $21,750,000] ÷ $153,000,000 = 0.1552 = 15.5% For Further Reference: (Study Session 7, Module 21.2, LOS 21.g)", "explhtml": "<p>The target payout ratio approach to estimating a company&#x27;s expected dividend uses the following formula:<\/p><p>expected increase in dividends = [(expected earnings × target payout ratio) – previous dividend] × adjustment factor<\/p><p>Rearranging the formula to solve for the target payout ratio, we obtain:<\/p><p>target payout ratio = [(expected increase in dividends ÷ adjustment factor) + previous dividend] ÷ expected earnings<\/p><p>Managers at MavsHD want to move toward the target payout ratio over a period of 8 years, which makes the adjustment factor equal to: 1 / 8 = 0.125. The expected dividend increase is given as $250,000, and the previous dividend is given as $21,750,000. Plugging each of these figures into the previous formula, the target payout ratio is calculated as:<\/p><p>target payout ratio = [($250,000 ÷ 0.125) + $21,750,000] ÷ $153,000,000 = 0.1552 = 15.5%<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 21.2, LOS 21.g)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Questions 25 through 30 relate to Corporate Finance.<\/p><p>MavsHD Case Scenario<\/p><p>Donnie Nelson, CFA, has just taken over as chief financial officer of MavsHD, a high-tech company that delivers high- definition technology to a broad-based group of sports enthusiasts. MavsHD has 40% debt and 60% equity in its capital structure. For the year just ended, net income and dividends for MavsHD were $145 million and $21.75 million, respectively. The consensus estimate for net income at the end of the current year is $153 million. The company&#x27;s current book value is $550 million. MavsHD&#x27;s stock is currently trading on the NYSE for a price of $50 per share and has been steadily decreasing for the past 12 months.<\/p><p>MavsHD has gone through its pioneer and growth phases and is now settling in to the early stages of maturity. The business model is starting to shift from relying almost exclusively on new customers to retaining and satisfying existing customers. The previously experienced very high growth rate has slowed considerably. Nelson believes that shareholder composition has changed over time as well, favoring shareholders who have a greater interest in dividend stability than in explosive growth. In the past, however, the firm has favored a low dividend rate due to the availability of attractive internal investment opportunities.<\/p><p>Nelson wants to develop an optimal dividend policy for MavsHD that will create the most value for the shareholders and at the same time protect corporate assets. He is concerned, however, that there is sometimes a disconnect between an optimal dividend policy and how actual dividend rates are perceived in the marketplace. Nelson is preparing a recommendation to senior management and the board of directors regarding the firm&#x27;s dividend policy going forward. Nelson is considering recommending that MavsHD engage in a stock repurchase plan and repurchase 1.5 million shares of the 12.75 million shares outstanding. This repurchase would eliminate any need to increase the cash dividend payout. Other managers at the firm, besides Nelson, believe MavsHD should increase its dividend and gravitate toward what they perceive to be the target payout ratio over the next eight years. Thus, at the end of the current year, the firm would increase the dividend payment by $250,000 over the dividend in the prior year.<\/p><p>During the board meeting, two of the directors raised concerns over Nelson&#x27;s proposed repurchase plan. The directors&#x27; comments follow:<\/p><div class=\"tbl\"><table><tr><td>Director 1:<\/td><td>I support the repurchase plan, especially relative to varying our dividend. Firms should not vary<\/td><\/tr><tr><td>dividends—this lowers investors&#x27; confidence and can adversely impact the firm&#x27;s cost of equity<\/td><td><\/td><\/tr><tr><td>and its share price.<\/td><td><\/td><\/tr><tr><td>Director 2:<\/td><td>A share repurchase does not take away the uncertainty associated with future stock value.<\/td><\/tr><tr><td>According to the bird-in-the-hand theory, investors prefer higher dividends because capital gains<\/td><td><\/td><\/tr><tr><td>are uncertain. The theory states that if we increase our dividend payout, the value of MavsHD<\/td><td><\/td><\/tr><tr><td>equity will increase. Thus, I propose a dividend increase rather than a repurchase.<\/td><td><\/td><\/tr><\/table><\/div><p>One of the board members, Jason Neely, proposed an alternative dividend policy plan one week after the meeting at which Nelson presented his plan. Neely&#x27;s proposal involves utilizing a residual dividend model. Neely rationalizes his plan by claiming that relative to a stable dividend policy, his proposal would increase the volatility of dollar dividends paid to shareholders but would simultaneously increase the firm&#x27;s ability to exploit value additive investment projects using internally generated funds. Because of this enhanced access to value additive projects, MavsHD&#x27;s cost of equity capital will experience a marginal decrease, which will further increase the overall value of the firm.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the target payout ratio adjustment model approach to estimate dividend increases, determine which of the following is closest to the target payout ratio estimated by MavsHD&#x27;s managers.<\/p><\/div>", "subj": "corporate"}, {"n": 26, "q": "If the board proceeds with Nelson's proposed stock repurchase plan as suggested, which of the following is least likely to be true? MavsHD:", "opts": ["would be increasing financial leverage.", "is trying to signal the market that despite the declining share price, future prospects for the company are good.", "will reduce the wealth of all
