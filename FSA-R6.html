<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
</style>
</head>
<body>
<header>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "If a firm pledges inventories as collateral for a loan, the firm must:", "opts": ["offset the pledged inventories against current liabilities.", "create a contra asset account in the amount of the pledged inventories.", "disclose the carrying value of the pledged inventories."], "ans": "C", "expl": "Carrying value of inventories pledged as collateral is one of the required disclosures under\nboth IFRS and U.S. GAAP.\n(Module 32.3, LOS 32.c)"}, {"n": 2, "q": "Which of the following circumstances is most likely indicative of an increase in a company's\nfuture earnings?", "opts": ["Finished goods inventory increasing faster than sales.", "Finished goods inventory increasing faster than work-in-process inventory.", "Work-in-process inventory increasing faster than finished goods inventory."], "ans": "C", "expl": "Work-in-process inventory increasing faster than finished goods inventory is a likely\nindicator that a firm expects demand to increase, which should increase future revenues\nand earnings. Finished goods inventory increasing faster than sales or work-in-process\ninventory may indicate that demand is decreasing. Analysts should refer to sources such\nas management's commentary to further examine the reasons for an increase in finished\ngoods inventory.\n(Module 32.3, LOS 32.c)"}, {"n": 3, "q": "Using the lower of cost or market principle under U.S. GAAP, if the market value of inventory\nfalls below its historical cost, the minimum value at which the inventory can be reported in\nthe financial statements is the:", "opts": ["market price minus selling costs minus normal profit margin.", "net realizable value.", "net realizable value minus selling costs."], "ans": "A", "expl": "When inventory is written down to market, the replacement cost of the inventory is its\nmarket value, but the \"market value\" must fall between net realizable value (NRV) and NRV\nless normal profit margin. NRV is the market price of the inventory less selling costs.\nTherefore the minimum value is the market price minus selling costs minus normal profit\nmargin.\n(Module 32.1, LOS 32.a)"}, {"n": 4, "q": "A U.S. GAAP firm writes down inventory to net realizable value. In the period of the\nwritedown, what is the most likely effect on cost of goods sold?", "opts": ["Decrease.", "Increase.", "No effect."], "ans": "B", "expl": "A write-down of inventory to net realizable value is typically recognized under U.S. GAAP as\nan increase in cost of goods sold in the period of the write-down. Consider the inventory\nequation:\nending inventory = beginning inventory + purchases – cost of goods sold\nA write-down to NRV decreases ending inventory, with no effect on beginning inventory or\npurchases. For the inventory equation to hold, cost of goods sold must increase.\n(Module 32.1, LOS 32.a)"}, {"n": 5, "q": "In periods of rising prices and stable or increasing inventory quantities, using the LIFO\nmethod for inventory accounting compared to FIFO will result in:", "opts": ["higher cost of sales, lower income, higher cash flows, and lower inventory.", "higher cost of sales, lower income, lower cash flows, and lower inventory.", "lower cost of sales, higher income, identical cash flows, and lower inventory."], "ans": "A", "expl": "In periods of rising prices and stable or increasing inventory quantities, the LIFO method\nwill result in higher cost of sales, lower taxes, lower net income, lower inventory balances,\nlower working capital, and higher cash flows.\n(Module 32.2, LOS 32.b)"}, {"n": 6, "q": "If all else holds constant in periods of rising prices and inventory levels:", "opts": ["FIFO firms will have greater stockholder's equity than LIFO firms.", "LIFO firms have higher gross profit margins than FIFO firms.", "FIFO firms have higher debt to equity ratios than LIFO firms."], "ans": "A", "expl": "The FIFO method of inventory accounting assigns the cost of the earliest units acquired to\ngoods transferred out and the cost of most recent acquisitions to ending inventory. When\nprices are rising, the cheaper goods in beginning inventory reflecting earlier purchases are\nassigned to COGS (hence, higher income and higher shareholder's equity through retained\nearnings.)\nIn periods of rising prices and inventory levels (all else constant), FIFO firms have lower\ndebt to equity ratios than LIFO firms because stockholder's equity is higher and debt is\nunaffected. LIFO firms have lower gross profit margins because the more expensive last\npurchases are assigned to COGS, decreasing the numerator.\n(Module 32.2, LOS 32.b)"}, {"n": 7, "q": "During periods of declining prices, which inventory method would result in the highest net\nincome?", "opts": ["Average Cost.", "FIFO.", "LIFO."], "ans": "C", "expl": "When prices are declining and LIFO is used the COGS is smaller than if FIFO is used leading\nto a larger net income.\n(Module 32.2, LOS 32.b)"}, {"n": 8, "q": "A company purchased inventory on January 1, 20X2, for $600,000. On December 31, 20X2,\nthe inventory had a net realizable value (NRV) of $550,000 and a replacement cost of\n$525,000, which is also the NRV less the normal profit margin. What would be the carrying\nvalue of the inventory on the company's December 31, 20X2, balance sheet using:\nlower of cost or NRV?:lower of cost or market?", "opts": ["$525,000;$525,000", "$525,000;$550,000", "$550,000;$525,000"], "ans": "C", "expl": "Lower of cost or NRV is $550,000. Using lower of cost or market, the replacement cost of\n$525,000 would be used because it is below NRV and equal to the NRV less the normal\nprofit margin.\n(Module 32.1, LOS 32.a)"}, {"n": 9, "q": "During periods of rising prices and stable or growing inventories, the most informative\ninventory accounting method for income statement purposes is:", "opts": ["FIFO because it allocates historical prices to cost of good sold (COGS) and provides a better measure of current income.", "LIFO because it allocates current prices to cost of good sold (COGS) and provides a better measure of current income.", "weighted average because it allocates average prices to cost of good sold (COGS) and provides a better measure of current income."], "ans": "B", "expl": "LIFO is the most informative inventory accounting method for income statement purposes\nin periods of rising prices and stable or growing inventories. It allocates the most recent\npurchase prices to COGS, and thus provides a better measure of current income and\nfuture profitability.\n(Module 32.2, LOS 32.b)"}, {"n": 10, "q": "In a decreasing price environment, the first-in first-out (FIFO) inventory cost method results\nin:", "opts": ["higher inventory compared to last-in first-out.", "lower gross profit compared to last-in first-out.", "lower cost of goods sold compared to last-in first-out."], "ans": "B", "expl": "If prices are decreasing, FIFO assumes the higher-cost earliest purchases are the first\nitems sold. This results in higher COGS, lower inventory, and lower gross profit compared\nto LIFO.\n(Module 32.2, LOS 32.b)"}, {"n": 11, "q": "Tim Rogers is senior equity analyst with White Capital LLP. While analyzing the inventory\ndisclosures of Drako Toys Inc., a toy manufacturer based in Cleveland, Ohio, Rogers\nconcludes that Drako is expected to see above-average sales growth over the next three\nyears. Which of the following disclosures would most likely support Rogers's conclusion?", "opts": ["Increase in finished goods inventory and corresponding decline in raw-materials and work-in-progress inventory over the last two years.", "Increase in raw-materials and work-in-progress inventory and corresponding decline in finished goods inventory over the last two years.", "Finished goods inventory growing faster than sales in the last two years."], "ans": "B", "expl": "An increase in raw materials and/or work-in-process inventory is likely an indication of an\nexpected increase in demand. Conversely, an increase in finished goods inventory, while\nraw materials and work-in-process are decreasing, may be an indication of decreasing\ndemand. Finished goods inventory that is growing faster than sales may be an indication\nof declining demand.\n(Module 32.3, LOS 32.c)"}, {"n": 12, "q": "In periods of decreasing prices, which of the following statements is most accurate?\nCompared to FIFO, LIFO results in:", "opts": ["higher inventory balances and higher working capital.", "lower COGS, lower taxes and higher net income.", "higher inventory balances and lower working capital."], "ans": "A", "expl": "In periods of decreasing prices, LIFO results in lower COGS, higher taxes, higher net\nincome, higher inventory balances, higher working capital, and lower cash flows compared\nto FIFO.\n(Module 32.2, LOS 32.b)"}, {"n": 13, "q": "A firm determines that inventory of manufactured goods with a cost of €10 million has a net\nrealizable value of €9 million and writes down its carrying value to this amount. One period\nlater, the firm determines that the net realizable value of this inventory has increased to €11\nmillion. Under IFRS, the carrying value of this inventory:", "opts": ["must remain valued at €9 million.", "may be revalued up to €10 million.", "may be revalued up to €11 million."], "ans": "B", "expl": "Under IFRS, inventory is measured at the lower of cost or net realizable value. Inventory\nthat has been written down can later be revalued upward if its net realizable value\nrecovers, but only to the extent that reverses the writedown (i.e., no higher than cost).\nUnder U.S. GAAP, inventory that has been written down may not be revalued upward.\n(Module 32.1, LOS 32.a)"}, {"n": 14, "q": "If prices and inventory quantities are increasing, the last-in first-out (LIFO) inventory cost\nmethod results in:", "opts": ["higher inventory compared to first-in first-out.", "lower cost of goods sold compared to first-in first-out.", "lower gross profit compared to first-in first-out."], "ans": "C", "expl": "In an environment of increasing prices, LIFO results in higher COGS, lower inventory value,\nand lower gross profit compared to FIFO.\n(Module 32.2, LOS 32.b)"}, {"n": 15, "q": "During periods of rising prices, which of the following is most likely to occur?", "opts": ["LIFO cost of sales < FIFO cost of sales, therefore LIFO net income < FIFO net income.", "LIFO cost of sales > FIFO cost of sales, therefore LIFO net income < FIFO net income.", "LIFO cost of sales > FIFO cost of sales, therefore LIFO net income > FIFO net income."], "ans": "B", "expl": "With rising prices and using the LIFO inventory cost method, the most expensive units go\nto cost of sales, resulting in lower net income compared to the FIFO inventory cost\nmethod.\n(Module 32.2, LOS 32.b)"}, {"n": 16, "q": "The most likely effect of a write-down of inventory to net realizable on a firm's total asset\nturnover is:", "opts": ["a decrease.", "an increase.", "no change."], "ans": "B", "expl": "Total asset turnover is revenue divided by total assets. Writing down inventory to NRV\ndecreases total assets and has no effect on revenue. As a result, total asset turnover\nincreases.\n(Module 32.1, LOS 32.a)"}, {"n": 17, "q": "Victor Electronics, a manufacturer of electronic components, reports inventory using the\nFIFO costing method. In the prior period, Victor wrote its inventory down from cost of $2\nmillion to its net realizable value of $1 million. During the current period, net realizable value\nincreased to $4 million because of a shortage of computer chips. For the current period,\nVictor would most appropriately report an inventory value of:", "opts": ["$2 million under both IFRS or U.S. GAAP.", "$2 million under IFRS and $1 million under U.S. GAAP.", "$2 million under U.S. GAAP and $4 million under IFRS."], "ans": "B", "expl": "Under IFRS, a firm that has written down inventory to net realizable value may record any\nsubsequent reversal (limited to the original writedown amount) as a gain on the income\nstatement. Under U.S. GAAP, reversals of inventory writedowns are not permitted. (Module\n32.1, LOS 32.a)"}, {"n": 18, "q": "If prices are decreasing, the best estimates of inventory and cost of goods sold from an\nanalyst's point of view are provided by:", "opts": ["FIFO inventory and FIFO cost of goods sold.", "FIFO inventory and LIFO cost of goods sold.", "LIFO inventory and FIFO cost of goods sold."], "ans": "B", "expl": "Whether prices are increasing or decreasing, LIFO cost of goods sold and FIFO inventory\nare preferred because they are the closest estimates of current costs.\n(Module 32.2, LOS 32.b)"}, {"n": 19, "q": "The effect of an inventory writedown on a firm's return on assets (ROA) is most accurately\ndescribed as:", "opts": ["higher ROA in the current period and lower ROA in later periods.", "lower ROA in the current period and higher ROA in later periods.", "lower ROA in the current period and no effect on ROA in later periods."], "ans": "B", "expl": "Writing down inventory to net realizable value decreases both net income and total assets\nin the period of the writedown. Because net income is most likely less than assets, the\nresult in the period is a decrease in ROA. In later periods, lower-valued inventory will\ndecrease COGS and increase net income. Combined with a lower value of total assets, this\nwill increase ROA.\n(Module 32.1, LOS 32.a)"}, {"n": 20, "q": "Under which financial reporting standards is a firm required to discuss the circumstances\nwhen reversing an inventory writedown?", "opts": ["Both IFRS and U.S. GAAP.", "Neither IFRS nor U.S. GAAP.", "IFRS, but not U.S. GAAP."], "ans": "C", "expl": "Reversals of inventory writedowns are permitted under IFRS but not under U.S. GAAP. If an\nIFRS reporting firm reverses an inventory writedown, the firm is required to discuss the\ncircumstances of the reversal.\n(Module 32.3, LOS 32.c)"}, {"n": 21, "q": "Snow Blower Industries operates in an increasing price environment and uses the FIFO\nmethod for inventory reporting. Compared to the weighted average cost method, Snow\nBlower's use of the FIFO method will most likely decrease:", "opts": ["net income.", "ending inventory.", "cost of goods sold."], "ans": "C", "expl": "Under FIFO, Snow Blower will report lower cost of goods sold because the first items\nbought are assumed to be the units sold, and these have the lowest cost in a rising price\nenvironment. Net income is higher under FIFO in an increasing price environment because\nlower cost of goods sold results in higher income. Ending inventory is higher under FIFO in\nan increasing price environment.\n(Module 32.2, LOS 32.b)"}, {"n": 22, "q": "Which of the following statements about inventory presentation and disclosures is most\naccurate?", "opts": ["An analyst must determine which inventory cost method was used by examining the firm’s current and historical inventory values.", "Changing from FIFO to LIFO is a change in accounting principle that must be applied retrospectively.", "IFRS permits reversals of inventory writedowns but the firm must disclose the circumstances of the reversal in its financial statements."], "ans": "C", "expl": "IFRS requires a firm that reverses an inventory writedown to discuss the circumstances\nthat led to the reversal. Both IFRS and U.S. GAAP require firms to disclose the inventory\ncost flow method they use. While a change to LIFO from another inventory cost method is\na change in accounting principle, under U.S. GAAP this change is not applied\nretrospectively. The carrying value of inventory is considered to be the first LIFO layer.\n(Module 32.3, LOS 32.c)"}, {"n": 23, "q": "The most likely effect of a write-down of inventory to net realizable value on a firm's quick\nratio is:", "opts": ["a decrease.", "an increase.", "no change."], "ans": "C", "expl": "The quick ratio is current assets other than inventories divided by current liabilities.\nNeither the numerator nor the denominator is affected by an inventory writedown.\n(Module 32.1, LOS 32.a)"}, {"n": 24, "q": "Assuming beginning inventory levels are zero, inventory levels increase during the year and\nprices have been stable over time, COGS would be:", "opts": ["higher under LIFO than FIFO or average cost.", "higher under the average cost than LIFO or FIFO.", "the same for both LIFO and FIFO."], "ans": "C", "expl": "Providing beginning inventory is zero and purchase prices are constant over the period,\nthen FIFO, LIFO, and average cost pricing will all generate the same value for ending\ninventory and cost of goods sold (COGS).\nIf beginning inventory is introduced ending inventory and COGS will only be the same\nunder the three methods if the opening inventory had been purchased at the same price\nas purchases in the current period and purchase prices are constant.\n(Module 32.2, LOS 32.b)"}, {"n": 25, "q": "If prices are increasing, the weighted average cost method most likely results in inventory\nvalues that are higher than the inventory values using:", "opts": ["first-in first-out (FIFO).", "last-in first-out (LIFO).", "specific identification."], "ans": "B", "expl": "In an increasing price environment, inventory values reported under LIFO are lower than\nthe values reported under FIFO, and the values that result from weighted average cost are\nbetween the LIFO and FIFO values. Thus, the value of inventory using weighted average\ncost is higher than inventory using LIFO. The value of inventory using specific identification\ndepends on which particular items from inventory are sold, and thus can be higher or\nlower than the inventory values that result from the other methods.\n(Module 32.2, LOS 32.b)"}, {"n": 26, "q": "In an inflationary environment, a company's:", "opts": ["Cost of goods sold will be lower if it uses LIFO than if it uses FIFO.", "assets will be lower if it uses LIFO than if it uses FIFO.", "net income will be larger if it uses LIFO than if it uses FIFO."], "ans": "B", "expl": "In an inflationary period, assets will be lower under LIFO since the last, higher priced items\nare charged to the income statement.\n(Module 32.2, LOS 32.b)"}, {"n": 27, "q": "Judah GmbH. prepares its financial statements under IFRS. On December 31, 20X8, Judah\nhas inventory of manufactured goods with a cost of €720,000. The estimated selling cost of\nthat inventory is €50,000 and its market value is €740,000. By January 31, 20X9, none of the\ninventory has been sold but its market value has increased to €810,000. Selling costs remain\nthe same. Which of the following entries is most likely permissible under IFRS?", "opts": ["Make no adjustments to the valuation of inventory on either date.", "Write down inventory by €30,000 on December 31, 20X8 and write up inventory by €30,000 on January 31, 20X9.", "Write down inventory by €30,000 on December 31, 20X8 and write up inventory by €70,000 on January 31, 20X9."], "ans": "B", "expl": "IFRS rules require inventory to be valued at the lower of cost or net realizable value (NRV).\nNRV is calculated as estimated sales price less estimated selling costs. At December 31,\n20X8, NRV = €740,000 – €50,000 = €690,000. Since cost is €720,000, then the lower of cost\nor NRV is €690,000 and a €30,000 writedown is required.\nAt January 31, 20X9, NRV = €810,000 – €50,000 = €760,000. Under IFRS, when inventory\nrecovers in value after being written down, it may be \"written up\" and a gain recognized in\nthe income statement. The amount of such gain, however, is limited to the amount\npreviously recognized as a loss. Under IFRS it is not permissible to report inventory on the\nbalance sheet at an amount that exceeds original cost, except in the case of some\nagricultural and mineral products. Since cost is €720,000, the lower of cost of NRV is\n€720,000.\n(Module 32.1, LOS 32.a)"}, {"n": 28, "q": "Lincoln Corporation and Continental Incorporated are identical companies except that\nLincoln complies with U.S. Generally Accepted Accounting Principles and Continental\ncomplies with International Financial Reporting Standards. Assuming an inflationary\nenvironment and stable inventory quantities, which permissible cost flow assumption will\nminimize each firm's pre-tax financial income?", "opts": ["Lincoln Corporation: First-in, first-out  |  Continental Incorporated: First-in, first-out", "Lincoln Corporation: Last-in, first-out  |  Continental Incorporated: Average cost", "Lincoln Corporation: Last-in, first-out  |  Continental Incorporated: Last-in, first-out"], "ans": "B", "expl": "LIFO will result in the lowest pre-tax financial income and FIFO will result in the highest\npre-tax income. Average cost pre-tax financial income will fall in the middle. LIFO is\nallowed under U.S. GAAP but is not allowed under IFRS. Thus, Lincoln should choose LIFO\nand Continental should choose average cost in order to minimize pre-tax financial income.\n(Module 32.2, LOS 32.b)"}, {"n": 29, "q": "Barber Inc., which uses LIFO inventory accounting under U.S. GAAP, sells DVD recorders. On\nOctober 14, it purchased a large number of recorders at a cost of $90 each. Due to an\noversupply of recorders remaining in the marketplace due to lower than anticipated demand\nduring the Christmas season, the selling price at December 31 is $80 and the replacement\ncost is $73. The normal profit margin is 5 percent of the selling price and the selling costs are\n$2 per recorder. What is the value of the recorders on December 31?", "opts": ["$74.", "$73.", "$78."], "ans": "A", "expl": "Under U.S. GAAP, a LIFO firm values inventory at the lower of cost or market. Market is\nequal to the replacement cost subject to replacement cost being within a specific range.\nThe upper bound is net realizable value (NRV), which is equal to selling price ($80) less\nselling costs ($2) for an NRV of $78. The lower bound is NRV ($78) less normal profit (5% of\nselling price = $4) for a net amount of $74. Since replacement cost ($73) is less than NRV\nminus normal profit ($74), then market equals NRV minus normal profit ($74). As well, we\nhave to use the lower of cost ($90) or market ($74) principle so the recorders should be\nrecorded at the lower amount of $74.\n(Module 32.1, LOS 32.a)"}, {"n": 30, "q": "During periods of decreasing prices, a firm using a periodic inventory system will report\nhigher gross profit if its inventory cost assumption is:", "opts": ["FIFO because during periods of decreasing prices, COGS will be higher, resulting in a higher gross profit.", "FIFO because during periods of decreasing prices, COGS will be lower, resulting in a higher gross profit.", "LIFO because during periods of decreasing prices, COGS will be lower, resulting in a higher gross profit."], "ans": "C", "expl": "In periods of falling prices, LIFO results in lower COGS, and therefore higher gross profit\nthan FIFO, because LIFO assumes the most recently purchased (lower cost) goods are sold\nfirst.\n(Module 32.2, LOS 32.b)"}, {"n": 31, "q": "Information related to Bledsoe Corporation's inventory, as of December 31, 20x7, follows:\nEstimated selling price$3,500,000\nEstimated disposal costs50,000\nEstimated completion costs300,000\nOriginal FIFO cost3,200,000\nReplacement cost3,300,000\nUsing the appropriate valuation method, what adjustment is necessary to accurately report\nBledsoe's inventory at the end of 20x7, and will this adjustment affect Bledsoe's quick ratio?", "opts": ["Adjustment: $100,000 write-up  |  Quick ratio: No", "Adjustment: $50,000 write-down  |  Quick ratio: No", "Adjustment: $50,000 write-down  |  Quick ratio: Yes"], "ans": "B", "expl": "Inventories are valued on the balance sheet at the lower of cost or net realizable value.\nNet realizable value is equal to $3,150,000 ($3,500,000 selling price – $300,000 completion\ncosts – $50,000 disposal costs). Since the original cost of $3,200,000 exceeds the net\nrealizable value of $3,150,000, a $50,000 write-down is necessary. An inventory write-down\nhas no impact on the quick ratio since inventory is excluded from both the numerator and\ndenominator of the quick ratio.\n(Module 32.1, LOS 32.a)"}];
const CFG = {"title": "Analysis of Inventories", "subtitle": "CFA · Financial Statement Analysis · Reading 32 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + (location.pathname.split("/").pop() || CFG.title || "quiz");
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  answers[i] = L;
  const card = $("q-"+i);
  card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
  $("opt-"+i+"-"+L).classList.add("sel");
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
