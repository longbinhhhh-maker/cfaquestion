<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
  /* two-column question table */
  .q-cols-header{display:flex;margin:6px 0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .q-cols-header span{flex:1;text-align:center;padding:9px 14px;font-weight:700;
    color:var(--accent2);font-size:13.5px;background:var(--panel2)}
  .q-cols-header span+span{border-left:1px solid var(--line)}
  .opt[data-cols="2"]{display:flex;align-items:stretch;padding:0;overflow:hidden;gap:0}
  .opt[data-cols="2"] .lead{display:flex;align-items:center;padding:10px 12px;
    border-right:1px solid var(--line);white-space:nowrap}
  .opt[data-cols="2"] .opt-col{flex:1;padding:10px 14px;text-align:center;font-size:14.5px;line-height:1.4}
  .opt[data-cols="2"] .opt-col+.opt-col{border-left:1px solid var(--line)}
  html[data-theme="light"] .q-cols-header{border-color:var(--line)}
  html[data-theme="light"] .q-cols-header span{background:var(--panel2)}
  html[data-theme="light"] .opt[data-cols="2"] .lead,
  html[data-theme="light"] .opt[data-cols="2"] .opt-col{border-color:var(--line)}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>

<script>
const DATA = [{"n":1,"q":"If a firm pledges inventories as collateral for a loan, the firm must:","opts":["offset the pledged inventories against current liabilities.","create a contra asset account in the amount of the pledged inventories.","disclose the carrying value of the pledged inventories."],"ans":"C","expl":"Giá trị hàng tồn kho được cầm cố làm tài sản thế chấp là một trong những thông tin công bố bắt buộc theo\ncả IFRS và U.S. GAAP.\n(Mô-đun 32.3, LOS 32.c)"},{"n":2,"q":"Which of the following circumstances is most likely indicative of an increase in a company's\nfuture earnings?","opts":["Finished goods inventory increasing faster than sales.","Finished goods inventory increasing faster than work-in-process inventory.","Work-in-process inventory increasing faster than finished goods inventory."],"ans":"C","expl":"Có khả năng tồn kho sản phẩm dở dang tăng nhanh hơn tồn kho thành phẩm\nchỉ báo rằng một công ty kỳ vọng nhu cầu sẽ tăng, điều này sẽ làm tăng doanh thu\nvà thu nhập trong tương lai. Tồn kho thành phẩm tăng nhanh hơn doanh số bán hàng hoặc tồn kho sản phẩm dở dang\ncó thể cho thấy nhu cầu đang giảm. Các nhà phân tích nên tham khảo các nguồn như\nlàm bình luận của ban quản lý để xem xét thêm lý do khiến tồn kho thành phẩm\nhàng hóa thành phẩm tăng.\n(Mô-đun 32.3, LOS 32.c)"},{"n":3,"q":"Using the lower of cost or market principle under U.S. GAAP, if the market value of inventory\nfalls below its historical cost, the minimum value at which the inventory can be reported in\nthe financial statements is the:","opts":["market price minus selling costs minus normal profit margin.","net realizable value.","net realizable value minus selling costs."],"ans":"A","expl":"Khi hàng tồn kho được ghi ra thị trường, giá thay thế của hàng tồn kho là\ngiá trị thị trường của nó, nhưng \"giá trị thị trường\" phải nằm giữa giá trị thuần có thể thực hiện được (NRV) và NRV\ntỷ suất lợi nhuận bình thường ít hơn. NRV là giá thị trường của hàng tồn kho trừ đi chi phí bán hàng.\nDo đó, giá trị tối thiểu là giá thị trường trừ chi phí bán hàng trừ lợi nhuận thông thường\nbiên lợi nhuận.\n(Mô-đun 32.1, LOS 32.a)"},{"n":4,"q":"A U.S. GAAP firm writes down inventory to net realizable value. In the period of the\nwritedown, what is the most likely effect on cost of goods sold?","opts":["Decrease.","Increase.","No effect."],"ans":"B","expl":"Việc ghi giảm hàng tồn kho xuống giá trị thuần có thể thực hiện được thường được ghi nhận theo US GAAP là\nsự gia tăng giá vốn hàng bán trong khoảng thời gian ghi giảm. Hãy xem xét phương trình tồn kho\n:\nhàng tồn kho cuối kỳ = hàng tồn kho đầu kỳ + số lượt mua hàng – giá vốn hàng bán\nViệc ghi giảm vào NRV làm giảm lượng hàng tồn kho cuối kỳ, không ảnh hưởng đến lượng hàng tồn kho đầu kỳ hoặc\nmua hàng. Để giữ nguyên phương trình tồn kho, giá vốn hàng bán phải tăng.\n(Mô-đun 32.1, LOS 32.a)"},{"n":5,"q":"In periods of rising prices and stable or increasing inventory quantities, using the LIFO\nmethod for inventory accounting compared to FIFO will result in:","opts":["higher cost of sales, lower income, higher cash flows, and lower inventory.","higher cost of sales, lower income, lower cash flows, and lower inventory.","lower cost of sales, higher income, identical cash flows, and lower inventory."],"ans":"A","expl":"Trong thời kỳ giá tăng và ổn định hoặc tăng số lượng hàng tồn kho, phương pháp LIFO\nsẽ dẫn đến chi phí bán hàng cao hơn, thuế thấp hơn, thu nhập ròng thấp hơn, số dư hàng tồn kho thấp hơn,\nvốn lưu động thấp hơn và dòng tiền cao hơn.\n(Mô-đun 32.2, LOS 32.b)"},{"n":6,"q":"If all else holds constant in periods of rising prices and inventory levels:","opts":["FIFO firms will have greater stockholder's equity than LIFO firms.","LIFO firms have higher gross profit margins than FIFO firms.","FIFO firms have higher debt to equity ratios than LIFO firms."],"ans":"A","expl":"Phương pháp kế toán hàng tồn kho FIFO chỉ định chi phí của các đơn vị mua sớm nhất cho\nhàng hóa được chuyển đi và chi phí của những lần mua gần đây nhất cho hàng tồn kho cuối kỳ. Khi\ngiá tăng, hàng hóa rẻ hơn trong hàng tồn kho đầu kỳ phản ánh các giao dịch mua trước đó được gán cho giá vốn hàng bán (do đó, thu nhập cao hơn và vốn cổ đông cao hơn thông qua\nthu nhập được giữ lại.)\nTrong thời kỳ giá cả và mức tồn kho tăng (tất cả các yếu tố khác không đổi), các công ty FIFO có tỷ lệ nợ trên vốn chủ sở hữu\nthấp hơn so với các công ty LIFO vì vốn chủ sở hữu của cổ đông cao hơn và nợ\nkhông bị ảnh hưởng. Các công ty LIFO có tỷ suất lợi nhuận gộp thấp hơn vì các giao dịch mua\ncuối cùng đắt hơn được gán cho giá vốn hàng bán, làm giảm tử số.\n(Mô-đun 32.2, LOS 32.b)"},{"n":7,"q":"During periods of declining prices, which inventory method would result in the highest net\nincome?","opts":["Average Cost.","FIFO.","LIFO."],"ans":"C","expl":"Khi giá giảm và sử dụng LIFO, giá vốn hàng bán sẽ nhỏ hơn so với khi sử dụng FIFO, dẫn đến thu nhập ròng lớn hơn.\n(Học phần 32.2, LOS 32.b)"},{"n":8,"q":"A company purchased inventory on January 1, 20X2, for $600,000. On December 31, 20X2,\nthe inventory had a net realizable value (NRV) of $550,000 and a replacement cost of\n$525,000, which is also the NRV less the normal profit margin. What would be the carrying\nvalue of the inventory on the company's December 31, 20X2, balance sheet using:\nlower of cost or NRV?:lower of cost or market?","opts":["$525,000;$525,000","$525,000;$550,000","$550,000;$525,000"],"ans":"C","expl":"Chi phí hoặc NRV thấp hơn là 550.000 USD. Sử dụng chi phí hoặc thị trường thấp hơn, chi phí thay thế\n$525.000 sẽ được sử dụng vì nó thấp hơn NRV và bằng NRV trừ đi\nbiên lợi nhuận thông thường.\n(Mô-đun 32.1, LOS 32.a)"},{"n":9,"q":"During periods of rising prices and stable or growing inventories, the most informative\ninventory accounting method for income statement purposes is:","opts":["FIFO because it allocates historical prices to cost of good sold (COGS) and provides a better measure of current income.","LIFO because it allocates current prices to cost of good sold (COGS) and provides a better measure of current income.","weighted average because it allocates average prices to cost of good sold (COGS) and provides a better measure of current income."],"ans":"B","expl":"LIFO là phương pháp kế toán hàng tồn kho giàu thông tin nhất cho mục đích báo cáo thu nhập\ntrong giai đoạn giá tăng và hàng tồn kho ổn định hoặc ngày càng tăng. Nó phân bổ\ngiá mua gần đây nhất vào giá vốn hàng bán và do đó cung cấp thước đo tốt hơn về thu nhập hiện tại và\nlợi nhuận trong tương lai.\n(Mô-đun 32.2, LOS 32.b)"},{"n":10,"q":"In a decreasing price environment, the first-in first-out (FIFO) inventory cost method results\nin:","opts":["higher inventory compared to last-in first-out.","lower gross profit compared to last-in first-out.","lower cost of goods sold compared to last-in first-out."],"ans":"B","expl":"Nếu giá giảm, FIFO giả định các giao dịch mua sớm nhất có chi phí cao hơn là những mặt hàng\nđầu tiên được bán. Điều này dẫn đến giá vốn hàng bán cao hơn, hàng tồn kho thấp hơn và lợi nhuận gộp thấp hơn so với\nvới LIFO.\n(Mô-đun 32.2, LOS 32.b)"},{"n":11,"q":"Tim Rogers is senior equity analyst with White Capital LLP. While analyzing the inventory\ndisclosures of Drako Toys Inc., a toy manufacturer based in Cleveland, Ohio, Rogers\nconcludes that Drako is expected to see above-average sales growth over the next three\nyears. Which of the following disclosures would most likely support Rogers's conclusion?","opts":["Increase in finished goods inventory and corresponding decline in raw-materials and work-in-progress inventory over the last two years.","Increase in raw-materials and work-in-progress inventory and corresponding decline in finished goods inventory over the last two years.","Finished goods inventory growing faster than sales in the last two years."],"ans":"B","expl":"Sự gia tăng về nguyên liệu thô và/hoặc hàng tồn kho trong quá trình sản xuất có thể là dấu hiệu cho thấy\nnhu cầu dự kiến sẽ tăng. Ngược lại, lượng tồn kho thành phẩm tăng lên, trong khi\nnguyên liệu thô và sản phẩm dở dang đang giảm, có thể là dấu hiệu cho thấy nhu cầu\ngiảm. Tồn kho thành phẩm tăng nhanh hơn doanh số bán hàng có thể là dấu hiệu\nnhu cầu giảm.\n(Mô-đun 32.3, LOS 32.c)"},{"n":12,"q":"In periods of decreasing prices, which of the following statements is most accurate?\nCompared to FIFO, LIFO results in:","opts":["higher inventory balances and higher working capital.","lower COGS, lower taxes and higher net income.","higher inventory balances and lower working capital."],"ans":"A","expl":"Trong giai đoạn giá giảm, LIFO dẫn đến giá vốn hàng bán thấp hơn, thuế cao hơn, thu nhập ròng\nròng cao hơn, số dư hàng tồn kho cao hơn, vốn lưu động cao hơn và dòng tiền thấp hơn so với\nđến FIFO.\n(Mô-đun 32.2, LOS 32.b)"},{"n":13,"q":"A firm determines that inventory of manufactured goods with a cost of €10 million has a net\nrealizable value of €9 million and writes down its carrying value to this amount. One period\nlater, the firm determines that the net realizable value of this inventory has increased to €11\nmillion. Under IFRS, the carrying value of this inventory:","opts":["must remain valued at €9 million.","may be revalued up to €10 million.","may be revalued up to €11 million."],"ans":"B","expl":"Theo IFRS, hàng tồn kho được đo lường ở mức thấp hơn so với chi phí hoặc giá trị thuần có thể thực hiện được. Khoảng không quảng cáo\nđã được ghi lại sau đó có thể được đánh giá lại tăng lên nếu giá trị thuần có thể thực hiện được của nó\nphục hồi, nhưng chỉ trong phạm vi đảo ngược việc ghi giảm (tức là không cao hơn giá thành).\nTheo GAAP của Hoa Kỳ, khoảng không quảng cáo đã được ghi lại có thể không được đánh giá lại tăng lên.\n(Mô-đun 32.1, LOS 32.a)"},{"n":14,"q":"If prices and inventory quantities are increasing, the last-in first-out (LIFO) inventory cost\nmethod results in:","opts":["higher inventory compared to first-in first-out.","lower cost of goods sold compared to first-in first-out.","lower gross profit compared to first-in first-out."],"ans":"C","expl":"Trong môi trường giá tăng, LIFO dẫn đến giá vốn hàng bán cao hơn, giá trị hàng tồn kho thấp hơn\nvà lợi nhuận gộp thấp hơn so với FIFO.\n(Mô-đun 32.2, LOS 32.b)"},{"n":15,"q":"During periods of rising prices, which of the following is most likely to occur?","opts":["LIFO cost of sales < FIFO cost of sales, therefore LIFO net income < FIFO net income.","LIFO cost of sales > FIFO cost of sales, therefore LIFO net income < FIFO net income.","LIFO cost of sales > FIFO cost of sales, therefore LIFO net income > FIFO net income."],"ans":"B","expl":"Khi giá tăng và sử dụng phương pháp chi phí tồn kho LIFO, các đơn vị đắt nhất sẽ tiếp tục\nchi phí bán hàng, dẫn đến thu nhập ròng thấp hơn so với phương pháp chi phí hàng tồn kho FIFO\n.\n(Mô-đun 32.2, LOS 32.b)"},{"n":16,"q":"The most likely effect of a write-down of inventory to net realizable on a firm's total asset\nturnover is:","opts":["a decrease.","an increase.","no change."],"ans":"B","expl":"Tổng doanh thu tài sản là doanh thu chia cho tổng tài sản. Việc ghi hàng tồn kho vào NRV\nlàm giảm tổng tài sản và không ảnh hưởng đến doanh thu. Do đó, vòng quay tổng tài sản\ntăng.\n(Mô-đun 32.1, LOS 32.a)"},{"n":17,"q":"Victor Electronics, a manufacturer of electronic components, reports inventory using the\nFIFO costing method. In the prior period, Victor wrote its inventory down from cost of $2\nmillion to its net realizable value of $1 million. During the current period, net realizable value\nincreased to $4 million because of a shortage of computer chips. For the current period,\nVictor would most appropriately report an inventory value of:","opts":["$2 million under both IFRS or U.S. GAAP.","$2 million under IFRS and $1 million under U.S. GAAP.","$2 million under U.S. GAAP and $4 million under IFRS."],"ans":"B","expl":"Dưới đây IFRS, một công ty đã ghi giảm hàng tồn kho xuống giá trị thuần có thể thực hiện được có thể ghi lại bất kỳ\nsự đảo ngược nào sau đó (giới hạn ở số tiền ghi giảm ban đầu) dưới dạng lợi nhuận trên báo cáo thu nhập\n. Theo GAAP của Hoa Kỳ, không được phép đảo ngược việc ghi giảm hàng tồn kho. (Mô-đun\n32.1, LOS 32.a)"},{"n":18,"q":"If prices are decreasing, the best estimates of inventory and cost of goods sold from an\nanalyst's point of view are provided by:","opts":["FIFO inventory and FIFO cost of goods sold.","FIFO inventory and LIFO cost of goods sold.","LIFO inventory and FIFO cost of goods sold."],"ans":"B","expl":"Cho dù giá đang tăng hay giảm, giá vốn hàng bán LIFO và hàng tồn kho FIFO\nđược ưu tiên vì chúng là ước tính gần nhất về chi phí hiện tại.\n(Mô-đun 32.2, LOS 32.b)"},{"n":19,"q":"The effect of an inventory writedown on a firm's return on assets (ROA) is most accurately\ndescribed as:","opts":["higher ROA in the current period and lower ROA in later periods.","lower ROA in the current period and higher ROA in later periods.","lower ROA in the current period and no effect on ROA in later periods."],"ans":"B","expl":"Việc ghi hàng tồn kho vào giá trị thuần có thể thực hiện được sẽ làm giảm cả thu nhập ròng và tổng tài sản\ntrong khoảng thời gian ghi giảm. Vì thu nhập ròng rất có thể thấp hơn tài sản nên\nkết quả trong kỳ là ROA giảm. Trong các giai đoạn sau, hàng tồn kho có giá trị thấp hơn sẽ\ngiảm giá vốn hàng bán và tăng thu nhập ròng. Kết hợp với giá trị tổng tài sản thấp hơn,\nđiều này sẽ làm tăng ROA.\n(Mô-đun 32.1, LOS 32.a)"},{"n":20,"q":"Under which financial reporting standards is a firm required to discuss the circumstances\nwhen reversing an inventory writedown?","opts":["Both IFRS and U.S. GAAP.","Neither IFRS nor U.S. GAAP.","IFRS, but not U.S. GAAP."],"ans":"C","expl":"Việc đảo ngược khoản ghi giảm hàng tồn kho được cho phép theo IFRS nhưng không được phép theo GAAP của Hoa Kỳ. Nếu một\ncông ty báo cáo IFRS đảo ngược việc ghi giảm hàng tồn kho, công ty đó phải thảo luận về\ncác trường hợp đảo ngược.\n(Mô-đun 32.3, LOS 32.c)"},{"n":21,"q":"Snow Blower Industries operates in an increasing price environment and uses the FIFO\nmethod for inventory reporting. Compared to the weighted average cost method, Snow\nBlower's use of the FIFO method will most likely decrease:","opts":["net income.","ending inventory.","cost of goods sold."],"ans":"C","expl":"Theo FIFO, Snow Blower sẽ báo cáo giá vốn hàng bán thấp hơn vì các mặt hàng đầu tiên\nđã mua được giả định là những đơn vị đã bán và những đơn vị này có chi phí thấp nhất khi giá tăng\nmôi trường. Thu nhập ròng cao hơn theo FIFO trong môi trường giá cả ngày càng tăng vì\ngiá vốn hàng bán thấp hơn dẫn đến thu nhập cao hơn. Hàng tồn kho cuối kỳ cao hơn theo FIFO trong\nmột môi trường giá cả ngày càng tăng.\n(Học ​​phần 32.2, LOS 32.b)"},{"n":22,"q":"Which of the following statements about inventory presentation and disclosures is most\naccurate?","opts":["An analyst must determine which inventory cost method was used by examining the firm’s current and historical inventory values.","Changing from FIFO to LIFO is a change in accounting principle that must be applied retrospectively.","IFRS permits reversals of inventory writedowns but the firm must disclose the circumstances of the reversal in its financial statements."],"ans":"C","expl":"IFRS yêu cầu công ty đảo ngược việc ghi giảm hàng tồn kho để thảo luận về các trường hợp\ndẫn đến việc đảo ngược. Cả IFRS và U.S. GAAP đều yêu cầu các công ty công bố phương pháp lưu chuyển chi phí\nhàng tồn kho mà họ sử dụng. Mặc dù thay đổi đối với LIFO từ một phương pháp chi phí hàng tồn kho khác là\nthay đổi về nguyên tắc kế toán, nhưng theo GAAP của Hoa Kỳ, thay đổi này không được áp dụng hồi tố\n. Giá trị ghi sổ của hàng tồn kho được coi là lớp LIFO đầu tiên.\n(Mô-đun 32.3, LOS 32.c)"},{"n":23,"q":"The most likely effect of a write-down of inventory to net realizable value on a firm's quick\nratio is:","opts":["a decrease.","an increase.","no change."],"ans":"C","expl":"Tỷ lệ thanh toán nhanh là tài sản ngắn hạn không phải hàng tồn kho chia cho hiện tại nợ phải trả.\nCả tử số và mẫu số đều không bị ảnh hưởng bởi việc ghi giảm hàng tồn kho.\n(Mô-đun 32.1, LOS 32.a)"},{"n":24,"q":"Assuming beginning inventory levels are zero, inventory levels increase during the year and\nprices have been stable over time, COGS would be:","opts":["higher under LIFO than FIFO or average cost.","higher under the average cost than LIFO or FIFO.","the same for both LIFO and FIFO."],"ans":"C","expl":"Cung cấp khoảng không quảng cáo đầu kỳ bằng 0 và giá mua không đổi trong suốt khoảng thời gian,\nkhi đó FIFO, LIFO và định giá chi phí trung bình sẽ tạo ra cùng một giá trị cho cuối kỳ\nhàng tồn kho và giá vốn hàng bán (giá vốn hàng bán).\nNếu hàng tồn kho đầu kỳ được đưa vào hàng tồn kho cuối kỳ và giá vốn hàng bán sẽ chỉ giống nhau\ntheo ba phương pháp nếu hàng tồn kho đầu kỳ đã được mua ở cùng mức giá\nkhi mua hàng trong giai đoạn hiện tại và giá mua không đổi.\n(Mô-đun 32.2, LOS 32.b)"},{"n":25,"q":"If prices are increasing, the weighted average cost method most likely results in inventory\nvalues that are higher than the inventory values using:","opts":["first-in first-out (FIFO).","last-in first-out (LIFO).","specific identification."],"ans":"B","expl":"Trong môi trường giá ngày càng tăng, giá trị hàng tồn kho được báo cáo theo LIFO thấp hơn\ngiá trị được báo cáo theo FIFO và các giá trị thu được từ chi phí bình quân gia quyền nằm\ngiữa giá trị LIFO và FIFO. Do đó, giá trị hàng tồn kho sử dụng chi phí\ntrung bình có trọng số sẽ cao hơn giá trị hàng tồn kho sử dụng LIFO. Giá trị của hàng tồn kho sử dụng thông tin nhận dạng cụ thể\ntùy thuộc vào mặt hàng cụ thể nào trong kho được bán và do đó có thể cao hơn hoặc\nthấp hơn giá trị hàng tồn kho thu được từ các phương pháp khác.\n(Mô-đun 32.2, LOS 32.b)"},{"n":26,"q":"In an inflationary environment, a company's:","opts":["Cost of goods sold will be lower if it uses LIFO than if it uses FIFO.","assets will be lower if it uses LIFO than if it uses FIFO.","net income will be larger if it uses LIFO than if it uses FIFO."],"ans":"B","expl":"Trong thời kỳ lạm phát, tài sản sẽ thấp hơn theo LIFO vì các mặt hàng cuối cùng có giá cao hơn\nđược tính vào báo cáo thu nhập.\n(Module 32.2, LOS 32.b)"},{"n":27,"q":"Judah GmbH. prepares its financial statements under IFRS. On December 31, 20X8, Judah\nhas inventory of manufactured goods with a cost of €720,000. The estimated selling cost of\nthat inventory is €50,000 and its market value is €740,000. By January 31, 20X9, none of the\ninventory has been sold but its market value has increased to €810,000. Selling costs remain\nthe same. Which of the following entries is most likely permissible under IFRS?","opts":["Make no adjustments to the valuation of inventory on either date.","Write down inventory by €30,000 on December 31, 20X8 and write up inventory by €30,000 on January 31, 20X9.","Write down inventory by €30,000 on December 31, 20X8 and write up inventory by €70,000 on January 31, 20X9."],"ans":"B","expl":"Quy tắc IFRS yêu cầu hàng tồn kho phải được định giá ở mức thấp hơn giá gốc hoặc giá trị thuần có thể thực hiện được (NRV).\nNRV là được tính bằng giá bán ước tính trừ đi chi phí bán hàng ước tính. Vào ngày 31 tháng 12,\n20X8, NRV = €740.000 – €50.000 = €690.000. Vì chi phí là €720.000, nên chi phí thấp hơn\nhoặc NRV là €690.000 và khoản khấu trừ €30.000 là bắt buộc.\nVào ngày 31 tháng 1 năm 20X9, NRV = €810.000 – €50.000 = €760.000. Theo IFRS, khi hàng tồn kho\nphục hồi về giá trị sau khi được ghi sổ, nó có thể được \"ghi nhận\" và một khoản lãi được ghi nhận trong\nbáo cáo thu nhập. Tuy nhiên, số tiền lãi như vậy được giới hạn ở số tiền\nđược ghi nhận là lỗ trước đó. Theo IFRS, không được phép báo cáo hàng tồn kho trên bảng cân đối kế toán\nvới số tiền vượt quá giá gốc, ngoại trừ trường hợp một số\nsản phẩm nông nghiệp và khoáng sản. Vì chi phí là €720.000 nên chi phí thấp hơn của NRV là\n€720.000.\n(Mô-đun 32.1, LOS 32.a)"},{"n":28,"q":"Lincoln Corporation and Continental Incorporated are identical companies except that\nLincoln complies with U.S. Generally Accepted Accounting Principles and Continental\ncomplies with International Financial Reporting Standards. Assuming an inflationary\nenvironment and stable inventory quantities, which permissible cost flow assumption will\nminimize each firm's pre-tax financial income?","opts":["First-in, first-out | First-in, first-out","Last-in, first-out | Average cost","Last-in, first-out | Last-in, first-out"],"ans":"B","expl":"LIFO sẽ mang lại thu nhập tài chính trước thuế thấp nhất và FIFO sẽ mang lại\nthu nhập trước thuế cao nhất. Chi phí bình quân thu nhập tài chính trước thuế sẽ rơi vào khoảng giữa. LIFO\nđược cho phép theo GAAP của Hoa Kỳ nhưng không được phép theo IFRS. Vì vậy, Lincoln nên chọn LIFO\nvà Continental nên chọn chi phí trung bình để giảm thiểu thu nhập tài chính trước thuế.\n(Module 32.2, LOS 32.b)","cols":["Corporation","Incorporated"],"qhtml":"<p>Lincoln Corporation and Continental Incorporated are identical companies except that Lincoln complies with U.S. Generally Accepted Accounting Principles and Continental complies with International Financial Reporting Standards. Assuming an inflationary environment and stable inventory quantities, which permissible cost flow assumption will minimize each firm's pre-tax financial income?</p><p><em>Options show → <strong>Lincoln (US GAAP)</strong> | <strong>Continental (IFRS)</strong></em></p>"},{"n":29,"q":"Barber Inc., which uses LIFO inventory accounting under U.S. GAAP, sells DVD recorders. On\nOctober 14, it purchased a large number of recorders at a cost of $90 each. Due to an\noversupply of recorders remaining in the marketplace due to lower than anticipated demand\nduring the Christmas season, the selling price at December 31 is $80 and the replacement\ncost is $73. The normal profit margin is 5 percent of the selling price and the selling costs are\n$2 per recorder. What is the value of the recorders on December 31?","opts":["$74.","$73.","$78."],"ans":"A","expl":"Theo GAAP của Hoa Kỳ, công ty LIFO định giá hàng tồn kho ở mức thấp hơn chi phí hoặc thị trường. Thị trường\nbằng với chi phí thay thế tùy theo chi phí thay thế nằm trong một phạm vi cụ thể.\nGiới hạn trên là giá trị thuần có thể thực hiện được (NRV), bằng giá bán ($80) trừ\nchi phí bán ($2) cho một NRV là $78. Giới hạn dưới là NRV ($78) trừ đi lợi nhuận thông thường (5% của\ngiá bán = $4) với số tiền ròng là $74. Vì chi phí thay thế ($73) nhỏ hơn NRV\ntrừ lợi nhuận bình thường ($74), nên thị trường bằng NRV trừ lợi nhuận bình thường ($74). Ngoài ra, chúng tôi\nphải sử dụng nguyên tắc chi phí thấp hơn ($90) hoặc nguyên tắc thị trường ($74) nên máy ghi phải được\nghi ở mức giá thấp hơn là $74.\n(Mô-đun 32.1, LOS 32.a)"},{"n":30,"q":"During periods of decreasing prices, a firm using a periodic inventory system will report\nhigher gross profit if its inventory cost assumption is:","opts":["FIFO because during periods of decreasing prices, COGS will be higher, resulting in a higher gross profit.","FIFO because during periods of decreasing prices, COGS will be lower, resulting in a higher gross profit.","LIFO because during periods of decreasing prices, COGS will be lower, resulting in a higher gross profit."],"ans":"C","expl":"Trong thời kỳ giá giảm, LIFO dẫn đến giá vốn hàng bán thấp hơn và do đó lợi nhuận gộp cao hơn FIFO, vì LIFO giả định hàng hóa được mua gần đây nhất (chi phí thấp hơn) được bán\nfirst.\n(Mô-đun 32.2, LOS 32.b)"},{"n":31,"q":"Information related to Bledsoe Corporation's inventory, as of December 31, 20x7, follows:\nEstimated selling price$3,500,000\nEstimated disposal costs50,000\nEstimated completion costs300,000\nOriginal FIFO cost3,200,000\nReplacement cost3,300,000\nUsing the appropriate valuation method, what adjustment is necessary to accurately report\nBledsoe's inventory at the end of 20x7, and will this adjustment affect Bledsoe's quick ratio?","opts":["$100,000 write-up | No","$50,000 write-down | No","$50,000 write-down | Yes"],"ans":"B","expl":"Hàng tồn kho được định giá trên bảng cân đối kế toán tại thấp hơn giá gốc hoặc giá trị thuần có thể thực hiện được.\nGiá trị thuần có thể thực hiện được bằng 3.150.000 USD (giá bán 3.500.000 USD – chi phí hoàn thành 300.000 USD\n – chi phí thanh lý 50.000 USD). Vì chi phí ban đầu là 3.200.000 USD vượt quá giá trị thuần\ncó thể thực hiện được là 3.150.000 USD nên việc ghi giảm 50.000 USD là cần thiết. Việc ghi giảm hàng tồn kho\nkhông ảnh hưởng đến tỷ lệ thanh toán nhanh vì hàng tồn kho được loại trừ khỏi cả tử số và\nmẫu số của tỷ lệ thanh toán nhanh.\n(Mô-đun 32.1, LOS 32.a)","cols":["Adjustment","Quick ratio"],"qhtml":"<p>Information related to Bledsoe Corporation's inventory, as of December 31, 20x7, follows:</p><table class=\"qtable\"><tbody><tr><td>Estimated selling price</td><td>$3,500,000</td></tr><tr><td>Estimated disposal costs</td><td>50,000</td></tr><tr><td>Estimated completion costs</td><td>300,000</td></tr><tr><td>Original FIFO cost</td><td>3,200,000</td></tr><tr><td>Replacement cost</td><td>3,300,000</td></tr></tbody></table><p>Using the appropriate valuation method, what adjustment is necessary to accurately report Bledsoe's inventory at the end of 20x7, and will this adjustment affect Bledsoe's quick ratio?</p>"}];
const CFG = {"title": "Analysis of Inventories", "subtitle": "CFA · Financial Statement Analysis · Reading 32 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });

  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }

}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";

    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }

    if(q.cols){
      const ch = document.createElement("div");
      ch.className = "q-cols-header";
      q.cols.forEach(h=>{
        const sp = document.createElement("span"); sp.textContent = h;
        ch.appendChild(sp);
      });
      card.appendChild(ch);
    }

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      if(q.cols && t.includes(" | ")){
        b.dataset.cols = "2";
        t.split(" | ").forEach(p=>{
          const sp = document.createElement("span"); sp.className = "opt-col"; sp.textContent = p;
          b.appendChild(sp);
        });
      } else {
        b.appendChild(document.createTextNode(t));
      }
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){

  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;

  function showResult(pass, badgeText){

    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');

      fetchEmoji('face-positive', emoji);

      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}

<script id="baii-calc-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("baiiPanel");}
  window.baiiOpen=function(){
    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }
    P().classList.add("open"); document.getElementById("baiiOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.baiiClose=function(){
    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
