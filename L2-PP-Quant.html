358. The test statistic of the general linear F-test is closest to:","opts":["0.07.","0.93.","14.16."],"ans":"C","expl":"C is correct because, for the multiple linear regression, Yi = b0 + b1X1i + b2X2i + b3X3i + ... + bkXki + εi, where k is the number of independent variables, we can use the general linear F-test to test the null hypothesis that slope coefficients on all variables are equal to zero. The F-statistic is calculated in the same way as in simple regression—the ratio of the mean square regression (MSR) to the mean square error (MSE)—but the degrees of freedom are now k in the numerator and n – k – 1 in the denominator: F = MSR/MSE = 19.234/1.358 = 14.163 ≈ 14.16.","explhtml":"<p>C is correct because, for the multiple linear regression, Yi = b0 + b1X1i + b2X2i + b3X3i + ... + bkXki + εi, where k is the number of independent variables, we can use the general linear F-test to test the null hypothesis that slope coefficients on all variables are equal to zero. The F-statistic is calculated in the same way as in simple regression—the ratio of the mean square regression (MSR) to the mean square error (MSE)—but the degrees of freedom are now k in the numerator and n – k – 1 in the denominator: F = MSR/MSE = 19.234/1.358 = 14.163 ≈ 14.16.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Regression Model Fit and Interpreting Model Results<\/div><div class=\"qtext\"><p>For a multiple linear regression analysis, the mean square regression (MSR) is 19.234 and the mean square error (MSE) is 1.358. The test statistic of the general linear F-test is closest to:<\/p><\/div>","subj":"quant"},{"n":44,"q":"An analyst conducts a joint hypothesis test to determine whether adding two independent variables can improve the fit of a multiple regression model. The null hypothesis is H0: b1 = b2 = 0, where b1 and b2 are the partial regression coefficients of the two additional independent variables. If the F-statistic is less than the critical F-value but greater than zero, the analyst should include:","opts":["none of the additional independent variables in the model.","only one of the additional independent variables in the model.","both of the additional independent variables in the model."],"ans":"A","expl":"A is correct because the test fails to reject the null hypothesis as the calculated F- statistic does not exceed the critical F-value. There is not sufficient evidence to indicate that at least one slope (or partial regression) coefficient is different from zero. Hence, both additional independent variables should be excluded.","explhtml":"<p>A is correct because the test fails to reject the null hypothesis as the calculated F- statistic does not exceed the critical F-value. There is not sufficient evidence to indicate that at least one slope (or partial regression) coefficient is different from zero. Hence, both additional independent variables should be excluded.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Regression Model Fit and Interpreting Model Results<\/div><div class=\"qtext\"><p>An analyst conducts a joint hypothesis test to determine whether adding two independent variables can improve the fit of a multiple regression model. The null hypothesis is H0: b1 = b2 = 0, where b1 and b2 are the partial regression coefficients of the two additional independent variables. If the F-statistic is less than the critical F-value but greater than zero, the analyst should include:<\/p><\/div>","subj":"quant"},{"n":45,"q":"A regression model is estimated using the equation Y = b0 + b1X1 + b2X2 + b3X3 + ε, where regression statistics show that X1 and X2 are highly statistically significant but X3 is not statistically significant. Which of the following statements about the use of this model for prediction is most accurate?","opts":["The model should not be used for prediction because X3 is not statistically significant","X3 should be excluded from the prediction equation since it is not statistically significant","X3 should be included in the prediction equation since it was used in estimating the slope coefficients"],"ans":"C","expl":"C is correct because, if a regression model is estimated using all three independent variables, for example, any prediction of the dependent variable must also include all three variables—even the ones that are not statistically significant. This is because correlations between these variables were used in estimating the slope coefficients.","explhtml":"<p>C is correct because, if a regression model is estimated using all three independent variables, for example, any prediction of the dependent variable must also include all three variables—even the ones that are not statistically significant. This is because correlations between these variables were used in estimating the slope coefficients.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Regression Model Fit and Interpreting Model Results<\/div><div class=\"qtext\"><p>A regression model is estimated using the equation Y = b0 + b1X1 + b2X2 + b3X3 + ε, where regression statistics show that X1 and X2 are highly statistically significant but X3 is not statistically significant. Which of the following statements about the use of this model for prediction is most accurate?<\/p><\/div>","subj":"quant"},{"n":46,"q":"An analyst builds the following multiple regression model for a company's P/E ratio: If Factor 1 and Factor 2 are assumed to be 12.5 and 5.3, respectively, the predicted P/E ratio is closest to:","opts":["20.4.","23.2.","27.4."],"ans":"B","expl":"B is correct because, applying the multiple regression model, we get a predicted P/E ratio of 2.8 + (1.8 × 12.5) + (–0.4 × 5.3) = 23.18 ≈ 23.2.","explhtml":"<p>B is correct because, applying the multiple regression model, we get a predicted P/E ratio of 2.8 + (1.8 × 12.5) + (–0.4 × 5.3) = 23.18 ≈ 23.2.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Regression Model Fit and Interpreting Model Results<\/div><div class=\"qtext\"><p>An analyst builds the following multiple regression model for a company&#x27;s P/E ratio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp008.webp\" style=\"max-width:min(100%,500px)\" alt=\"\"><p>If Factor 1 and Factor 2 are assumed to be 12.5 and 5.3, respectively, the predicted P/E ratio is closest to:<\/p><\/div>","subj":"quant"},{"n":47,"q":"Which of the following failures in regression functional form most likely leads to multicollinearity?","opts":["Inappropriate data pooling","Inappropriate variable scaling","Inappropriate form of variables"],"ans":"B","expl":"B is correct because this refers to the case where one or more regression variables may need to be transformed before estimating the regression, otherwise it may lead to heteroskedasticity or multicollinearity.","explhtml":"<p>B is correct because this refers to the case where one or more regression variables may need to be transformed before estimating the regression, otherwise it may lead to heteroskedasticity or multicollinearity.<\/p>","qhtml":"<div class=\"pp-topic\">Model Misspecification<\/div><div class=\"qtext\"><p>Which of the following failures in regression functional form most likely leads to multicollinearity?<\/p><\/div>","subj":"quant"},{"n":48,"q":"Which of the following is the most appropriate corrective action if the error term in a regression model is correlated with one of the independent variables?","opts":["Use the natural logarithm of the independent variable in the revised model","Include important variables that have been omitted and re-estimate the revised model","Use the subsample of data most representative of conditions during the model forecasting period"],"ans":"B","expl":"B is correct because, if the residuals from a model have a clear linear relationship with the independent variable, the type of misspecification error is the omitted variable bias. The recommended correction for this misspecification error is to include the omitted variable and re-estimate the revised model.","explhtml":"<p>B is correct because, if the residuals from a model have a clear linear relationship with the independent variable, the type of misspecification error is the omitted variable bias. The recommended correction for this misspecification error is to include the omitted variable and re-estimate the revised model.<\/p>","qhtml":"<div class=\"pp-topic\">Model Misspecification<\/div><div class=\"qtext\"><p>Which of the following is the most appropriate corrective action if the error term in a regression model is correlated with one of the independent variables?<\/p><\/div>","subj":"quant"},{"n":49,"q":"A Breusch–Pagan (BP) test is run on the residuals from two regression models to detect heteroskedasticity, with the following results: If the level of significance is 5%, which of the following is the most appropriate conclusion that can be drawn?","opts":["Model 1 has homoskedastic residuals","White's correction should be applied to Model 1","The t-statistics for Model 2 cannot be relied upon"],"ans":"B","expl":"B is correct because a P-value of less than 0.05 on a BP test indicates the presence of heteroskedasticity (at the 5% significance level), and this is the case for Model 1, in which case White's correction should be applied. By applying White's correction for heteroskedasticity, the coefficient standard errors will increase, thereby decreasing estimated t-statistics and increasing corresponding P-values for the independent variables.","explhtml":"<p>B is correct because a P-value of less than 0.05 on a BP test indicates the presence of heteroskedasticity (at the 5% significance level), and this is the case for Model 1, in which case White&#x27;s correction should be applied. By applying White&#x27;s correction for heteroskedasticity, the coefficient standard errors will increase, thereby decreasing estimated t-statistics and increasing corresponding P-values for the independent variables.<\/p>","qhtml":"<div class=\"pp-topic\">Model Misspecification<\/div><div class=\"qtext\"><p>A Breusch–Pagan (BP) test is run on the residuals from two regression models to detect heteroskedasticity, with the following results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp009.webp\" style=\"max-width:min(100%,518px)\" alt=\"\"><p>If the level of significance is 5%, which of the following is the most appropriate conclusion that can be drawn?<\/p><\/div>","subj":"quant"},{"n":50,"q":"Regression errors that are larger for larger values of the independent variable are referred to as:","opts":["homoskedastic errors.","robust standard errors.","heteroskedastic errors."],"ans":"C","expl":"C is correct because, when there are heteroskedastic errors, there is a systematic relationship between the value of the independent variable and the regression residuals: The residuals, which are the distance from the line, are larger for larger values of the independent variable.","explhtml":"<p>C is correct because, when there are heteroskedastic errors, there is a systematic relationship between the value of the independent variable and the regression residuals: The residuals, which are the distance from the line, are larger for larger values of the independent variable.<\/p>","qhtml":"<div class=\"pp-topic\">Model Misspecification<\/div><div class=\"qtext\"><p>Regression errors that are larger for larger values of the independent variable are referred to as:<\/p><\/div>","subj":"quant"},{"n":51,"q":"For an initial regression model with five independent variables and a sample size of 100, a Breusch–Godfrey test is carried out to test for serial correlation in the model's residuals up to lag two. The degrees of freedom of the F-statistic for this test are:","opts":["92 and 2.","93 and 2.","94 and 2."],"ans":"A","expl":"A is correct because, for a Breusch–Godfrey test, the test statistic is approximately F-distributed with n – p – k – 1 and p degrees of freedom, where p is the number of lags, n is the sample size, and k is the number of independent variables. Here, n = 100, p = 2, and k = 5, so n – p – k – 1 = 100 – 2 – 5 – 1 = 92, hence the degrees of freedom are 92 (= n – p – k – 1) and 2 (= p).","explhtml":"<p>A is correct because, for a Breusch–Godfrey test, the test statistic is approximately F-distributed with n – p – k – 1 and p degrees of freedom, where p is the number of lags, n is the sample size, and k is the number of independent variables.<\/p><p>Here, n = 100, p = 2, and k = 5, so n – p – k – 1 = 100 – 2 – 5 – 1 = 92, hence the degrees of freedom are 92 (= n – p – k – 1) and 2 (= p).<\/p>","qhtml":"<div class=\"pp-topic\">Model Misspecification<\/div><div class=\"qtext\"><p>For an initial regression model with five independent variables and a sample size of 100, a Breusch–Godfrey test is carried out to test for serial correlation in the model&#x27;s residuals up to lag two. The degrees of freedom of the F-statistic for this test are:<\/p><\/div>","subj":"quant"},{"n":52,"q":"In time-series analysis, which of the following is most likely a result of positive serial correlation?","opts":["Fewer Type I errors","Underestimated standard errors","An overestimated population error variance"],"ans":"B","expl":"B is correct because positive serial correlation does not affect the consistency of regression coefficients, but it does affect statistical tests. First, the F-statistic may be inflated because the MSE [mean squared error] will tend to underestimate the population error variance. Second, positive serial correlation typically causes standard errors to be underestimated, so t-statistics are inflated, which (as with heteroskedasticity) leads to more Type I errors. A Type I error is a false positive, i.e., rejecting the null hypothesis when it is actually true.","explhtml":"<p>B is correct because positive serial correlation does not affect the consistency of regression coefficients, but it does affect statistical tests. First, the F-statistic may be inflated because the MSE [mean squared error] will tend to underestimate the population error variance. Second, positive serial correlation typically causes standard errors to be underestimated, so t-statistics are inflated, which (as with heteroskedasticity) leads to more Type I errors. A Type I error is a false positive, i.e., rejecting the null hypothesis when it is actually true.<\/p>","qhtml":"<div class=\"pp-topic\">Model Misspecification<\/div><div class=\"qtext\"><p>In time-series analysis, which of the following is most likely a result of positive serial correlation?<\/p><\/div>","subj":"quant"},{"n":53,"q":"In the process of quantifying multicollinearity issues in a multiple regression, the coefficient of determination obtained from regressing Xj on the remaining independent variables is Rj-square = 0.7. The variance inflation factor for Xj is closest to:","opts":["0.67.","1.96.","3.33."],"ans":"B","expl":"B is correct because, by regressing one independent variable (Xj) on the remaining k – 2 1 independent variables, we obtain Rjfor the regression—the variation in Xj explained by the other k – 1 independent variables—from which the VIF for Xj is 22 VIFj = 1/(1 – Rj) = 1/(1 – 0.7) = 1.9608 ≈ 1.96. The variance inflation factor (VIF)is used to quantify multicollinearity issues.","explhtml":"<p>B is correct because, by regressing one independent variable (Xj) on the remaining k – 2 1 independent variables, we obtain Rjfor the regression—the variation in Xj explained by the other k – 1 independent variables—from which the VIF for Xj is 22 VIFj = 1/(1 – Rj) = 1/(1 – 0.7) = 1.9608 ≈ 1.96. The variance inflation factor (VIF)is used to quantify multicollinearity issues.<\/p>","qhtml":"<div class=\"pp-topic\">Model Misspecification<\/div><div class=\"qtext\"><p>In the process of quantifying multicollinearity issues in a multiple regression, the coefficient of determination obtained from regressing Xj on the remaining independent variables is Rj-square = 0.7. The variance inflation factor for Xj is closest to:<\/p><\/div>","subj":"quant"},{"n":54,"q":"An analyst computes the following variance inflation factors (VIFs) for the independent variables in a regression model: Serious multicollinearity issues requiring correction are indicated for:","opts":["Variable 1 only.","Variable 3 only.","Variable 2 and Variable 3."],"ans":"B","expl":"B is correct because the VIF for Variable 3 is higher than 10. VIF increases as the correlation between Variable j and the remaining independent variables increases; the higher the VIF, the more likely a given independent variable can be accurately predicted from the remaining independent variables, making it increasingly redundant. The following are useful rules of thumb: ■ VIFj > 5 warrants further investigation of the given independent variable. ■ VIFj > 10 indicates serious multicollinearity requiring correction.","explhtml":"<p>B is correct because the VIF for Variable 3 is higher than 10. VIF increases as the correlation between Variable j and the remaining independent variables increases; the higher the VIF, the more likely a given independent variable can be accurately predicted from the remaining independent variables, making it increasingly redundant. The following are useful rules of thumb:<\/p><p>■ VIFj &gt; 5 warrants further investigation of the given independent variable.<\/p><p>■ VIFj &gt; 10 indicates serious multicollinearity requiring correction.<\/p>","qhtml":"<div class=\"pp-topic\">Model Misspecification<\/div><div class=\"qtext\"><p>An analyst computes the following variance inflation factors (VIFs) for the independent variables in a regression model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp010.webp\" style=\"max-width:min(100%,524px)\" alt=\"\"><p>Serious multicollinearity issues requiring correction are indicated for:<\/p><\/div>","subj":"quant"},{"n":55,"q":"In a regression analysis using four independent variables and 80 observations, the leverage measure above which an observation is considered potentially influential is closest to:","opts":["0.11.","0.15.","0.19."],"ans":"C","expl":"C is correct because a useful rule of thumb for the leverage measure is that if an observation's leverage exceeds 3(k + 1)/n, where k = number of independent variables and n = number of observations, then it is a potentially influential observation. Here, k = 4 and n = 80, so the threshold is 3(k + 1)/n = 3(4 + 1)/80 = 0.1875 ≈ 0.19.","explhtml":"<p>C is correct because a useful rule of thumb for the leverage measure is that if an observation&#x27;s leverage exceeds 3(k + 1)/n, where k = number of independent variables and n = number of observations, then it is a potentially influential observation.<\/p><p>Here, k = 4 and n = 80, so the threshold is 3(k + 1)/n = 3(4 + 1)/80 = 0.1875 ≈ 0.19.<\/p>","qhtml":"<div class=\"pp-topic\">Extensions of Multiple Regression<\/div><div class=\"qtext\"><p>In a regression analysis using four independent variables and 80 observations, the leverage measure above which an observation is considered potentially influential is closest to:<\/p><\/div>","subj":"quant"},{"n":56,"q":"An analyst estimates a multiple linear regression model with four independent variables using a sample of 100 observations and gathers the following information: Based on the leverage measure, which of the following would most likely be considered influential observations?","opts":["Observation 1 only","Observation 2 only","Observation 2 and Observation 3"],"ans":"C","expl":"C is correct because a useful rule of thumb for the leverage measure is that if an observation's leverage exceeds 3 × (k + 1)/n, where k is the number of independent variables and n is the number of observations, i.e., 3 × (4 + 1)/100 = 0.15, then it is a potentially influential observation. Since the leverage measures for Observation 2 and Observation 3 (0.25 and 0.18, respectively) exceed the threshold of 0.15, these would be considered influential observations.","explhtml":"<p>C is correct because a useful rule of thumb for the leverage measure is that if an observation&#x27;s leverage exceeds 3 × (k + 1)/n, where k is the number of independent variables and n is the number of observations, i.e., 3 × (4 + 1)/100 = 0.15, then it is a potentially influential observation. Since the leverage measures for Observation 2 and Observation 3 (0.25 and 0.18, respectively) exceed the threshold of 0.15, these would be considered influential observations.<\/p>","qhtml":"<div class=\"pp-topic\">Extensions of Multiple Regression<\/div><div class=\"qtext\"><p>An analyst estimates a multiple linear regression model with four independent variables using a sample of 100 observations and gathers the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp011.webp\" style=\"max-width:min(100%,524px)\" alt=\"\"><p>Based on the leverage measure, which of the following would most likely be considered influential observations?<\/p><\/div>","subj":"quant"},{"n":57,"q":"In a regression analysis using a sample of 20 companies, the number of dummy variables needed to distinguish among four different categories of companies is:","opts":["3.","4.","19."],"ans":"A","expl":"A is correct because, if we want to distinguish among n categories, we need n − 1 dummy variables. So, if we use dummy variables to denote companies belonging to one of four categories, we use three dummies. Here n = 4, so the number of dummy variables is n – 1 = 3.","explhtml":"<p>A is correct because, if we want to distinguish among n categories, we need n − 1 dummy variables. So, if we use dummy variables to denote companies belonging to one of four categories, we use three dummies.<\/p><p>Here n = 4, so the number of dummy variables is n – 1 = 3.<\/p>","qhtml":"<div class=\"pp-topic\">Extensions of Multiple Regression<\/div><div class=\"qtext\"><p>In a regression analysis using a sample of 20 companies, the number of dummy variables needed to distinguish among four different categories of companies is:<\/p><\/div>","subj":"quant"},{"n":58,"q":"In a multiple linear regression, how many dummy variables would be required to distinguish among small-cap, mid-cap, and large-cap stocks?","opts":["2","3","4"],"ans":"A","expl":"A is correct because, in a multiple linear regression, if we want to distinguish among n categories, we need n − 1 dummy variables. So, for example, if we use dummy variables to denote companies belonging to one of five industry sectors, we use four dummies. In this case, dummy variables are used to distinguish between three categories, hence two dummy variables should be used.","explhtml":"<p>A is correct because, in a multiple linear regression, if we want to distinguish among n categories, we need n − 1 dummy variables. So, for example, if we use dummy variables to denote companies belonging to one of five industry sectors, we use four dummies. In this case, dummy variables are used to distinguish between three categories, hence two dummy variables should be used.<\/p>","qhtml":"<div class=\"pp-topic\">Extensions of Multiple Regression<\/div><div class=\"qtext\"><p>In a multiple linear regression, how many dummy variables would be required to distinguish among small-cap, mid-cap, and large-cap stocks?<\/p><\/div>","subj":"quant"},{"n":59,"q":"If the probability of an event occurring is estimated as P = 0.618 with a logistic regression, the associated log odds are closest to:","opts":["0.382.","0.481.","1.618."],"ans":"B","expl":"B is correct because logistic regression (logit) uses the logistic transformation of the event probability (P) into the log odds, ln(P/(1 – P)), as the dependent variable. Here P = 0.618, so the associated log odds should be ln(P/(1 – P)) = ln(0.618/(1 – 0.618)) = 0.481.","explhtml":"<p>B is correct because logistic regression (logit) uses the logistic transformation of the event probability (P) into the log odds, ln(P/(1 – P)), as the dependent variable.<\/p><p>Here P = 0.618, so the associated log odds should be ln(P/(1 – P)) = ln(0.618/(1 – 0.618)) = 0.481.<\/p>","qhtml":"<div class=\"pp-topic\">Extensions of Multiple Regression<\/div><div class=\"qtext\"><p>If the probability of an event occurring is estimated as P = 0.618 with a logistic regression, the associated log odds are closest to:<\/p><\/div>","subj":"quant"}];
const CFG = {"title": "Quantitative Methods — Practice Pack", "subtitle": "CFA Level II · 59 câu · EdZeb", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };

  });

function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  if(/portfolio|asset allocation|investment policy statement|\bips\b|behavioral finance|behavioral bias|cognitive error|risk aversion|utility function|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation between|covariance between|portfolio standard deviation|sharpe ratio|treynor ratio|jensen['’]?s alpha|information ratio|two-fund separation|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral investor/.test(prompt)) return "portfolio";
  return "equity";
}

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>

(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

(function(){

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
