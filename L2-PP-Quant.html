<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button id="submitBtn" class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>

    <!--subject-breakdown-panel-start-->
    <div id="subjectBreakdown" class="subject-breakdown" aria-live="polite"></div>
    <!--subject-breakdown-panel-end-->
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"An analyst uses the past two years of monthly data to estimate a linear trend model for the monthly AUD/USD exchange rate, yielding the estimated model Rateₜ = 0.7837 – 0.0050t, where t = 1 corresponds to the start of the 2-year period. The forecasted exchange rate one year from now is closest to:","opts":["0.6037.","0.6637.","0.9637."],"ans":"A","expl":"A is correct because one year from now implies that t is month 36 (= 24 months + 12 months). This implies that the forecasted exchange rate is: 0.7837 – 0.0050 × 36 = 0.6037.","explhtml":"<p>A is correct because one year from now implies that t is month 36 (= 24 months + 12 months). This implies that the forecasted exchange rate is: 0.7837 – 0.0050 × 36 = 0.6037.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst uses the past two years of monthly data to estimate a linear trend model for the monthly AUD/USD exchange rate, yielding the estimated model Rateₜ = 0.7837 – 0.0050t, where t = 1 corresponds to the start of the 2-year period. The forecasted exchange rate one year from now is closest to:<\/p><\/div>","subj":"quant"},{"n":2,"q":"An analyst estimates a linear trend model for the dependent variable y and obtains the following regression results: The predicted value of y given t = 2 is closest to:","opts":["4.03.","4.31.","5.18."],"ans":"C","expl":"C is correct because the predicted (or fitted) value of the dependent variable (yt) given the value of the independent variable (t = 2) is calculated as: yt= b0 + b1(t), where b0 = the estimated y-intercept term = 1.1500, and b1= the estimated slope coefficient = 2.0136. Thus, y2 = 1.1500 + 2.0136(2) = 5.1772 ≈ 5.18. While this predicted value is for the in-sample period, a comparison of this value with the actual value may indicate how well the model fits the data.","explhtml":"<p>C is correct because the predicted (or fitted) value of the dependent variable (yt) given the value of the independent variable (t = 2) is calculated as: yt= b0 + b1(t), where b0 = the estimated y-intercept term = 1.1500, and b1= the estimated slope coefficient = 2.0136. Thus, y2 = 1.1500 + 2.0136(2) = 5.1772 ≈ 5.18.<\/p><p>While this predicted value is for the in-sample period, a comparison of this value with the actual value may indicate how well the model fits the data.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst estimates a linear trend model for the dependent variable y and obtains the following regression results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp001.webp\" style=\"max-width:min(100%,371px)\" alt=\"\"><p>The predicted value of y given t = 2 is closest to:<\/p><\/div>","subj":"quant"},{"n":3,"q":"Which of the following statements about a linear trend model and the Durbin–Watson statistic is most accurate?","opts":["A Durbin–Watson statistic close to 2.0 indicates that the errors in a time-series model are serially uncorrelated","A statistically significantly low value of the Durbin–Watson statistic indicates that the errors in a time-series model are negatively serially correlated","A statistically significantly high value of the Durbin–Watson statistic indicates that the errors in a time-series model are positively serially correlated"],"ans":"A","expl":"A is correct because, if a linear trend model is correctly specified, the Durbin– Watson statistic should not differ significantly from 2.0. Otherwise, the errors in the model are either positively or negatively serially correlated, and that correlation can be used to build a better forecasting model for those time series.","explhtml":"<p>A is correct because, if a linear trend model is correctly specified, the Durbin– Watson statistic should not differ significantly from 2.0. Otherwise, the errors in the model are either positively or negatively serially correlated, and that correlation can be used to build a better forecasting model for those time series.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>Which of the following statements about a linear trend model and the Durbin–Watson statistic is most accurate?<\/p><\/div>","subj":"quant"},{"n":4,"q":"Which of the following trend models are regression models with a single independent variable?","opts":["Linear trend models only","Log-linear trend models only","Both linear trend models and log-linear trend models"],"ans":"C","expl":"C is correct because both the linear trend model and the log-linear trend model are single-variable regression models. The linear trend model is given by yt = b0 + b1t + εt and the log-linear trend model is given by ln(yt) = b0 + b1t + εt. In both models, t (time) is the only independent variable.","explhtml":"<p>C is correct because both the linear trend model and the log-linear trend model are single-variable regression models.<\/p><p>The linear trend model is given by yt = b0 + b1t + εt<\/p><p>and the log-linear trend model is given by ln(yt) = b0 + b1t + εt.<\/p><p>In both models, t (time) is the only independent variable.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>Which of the following trend models are regression models with a single independent variable?<\/p><\/div>","subj":"quant"},{"n":5,"q":"Which of the following is required for a time series to be covariance stationary?","opts":["Only the variance of the time series must be constant and finite in all periods","Only the expected value of the time series must be constant and finite in all periods","Both the variance and the expected value of the time series must be constant and finite in all periods"],"ans":"C","expl":"C is correct because, for a time series to be covariance stationary, the variance of the time series must be constant and finite in all periods, and the expected value of the time series must be constant and finite in all periods.","explhtml":"<p>C is correct because, for a time series to be covariance stationary, the variance of the time series must be constant and finite in all periods, and the expected value of the time series must be constant and finite in all periods.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>Which of the following is required for a time series to be covariance stationary?<\/p><\/div>","subj":"quant"},{"n":6,"q":"An analyst forecasts the R&D spend of a pharmaceutical company using an AR(1) process by modeling the quarterly R&D spend per dollar of revenue. The estimated model is: R&DSpendₜ₊₁ = 0.25 + 0.12(R&DSpendₜ). If the current quarter's R&D spend per dollar of revenue is $0.15, the two-quarter- ahead forecast of the R&D spend based on this model is closest to:","opts":["$0.268.","$0.282.","$0.490."],"ans":"B","expl":"B is correct because, using the chain rule of forecasting, the forecast for the R&D spend in the next quarter is: R&DSpendt+1 = 0.25 + 0.12(0.15) = 0.268. The forecast for the R&D spend in the following quarter is: R&DSpendt+2 = 0.25 + 0.12(0.268) = 0.282.","explhtml":"<p>B is correct because, using the chain rule of forecasting, the forecast for the R&amp;D spend in the next quarter is: R&amp;DSpendt+1 = 0.25 + 0.12(0.15) = 0.268.<\/p><p>The forecast for the R&amp;D spend in the following quarter is: R&amp;DSpendt+2 = 0.25 + 0.12(0.268) = 0.282.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst forecasts the R&amp;D spend of a pharmaceutical company using an AR(1) process by modeling the quarterly R&amp;D spend per dollar of revenue. The estimated model is:<\/p><p>R&amp;DSpendₜ₊₁ = 0.25 + 0.12(R&amp;DSpendₜ).<\/p><p>If the current quarter&#x27;s R&amp;D spend per dollar of revenue is $0.15, the two-quarter- ahead forecast of the R&amp;D spend based on this model is closest to:<\/p><\/div>","subj":"quant"},{"n":7,"q":"A third-order autoregressive model uses:","opts":["three past values of the variable to predict the current value of the variable.","the past value and the current value of the variable to predict the subsequent value of the variable.","the past value of the variable to predict the current value and two subsequent values of the variable."],"ans":"A","expl":"A is correct because a pth-order autoregression, AR(p), for the variable xₜ is shown by xₜ = b₀ + b₁xₜ₋₁ + b₂xₜ₋₂ + . . . + bₚxₜ₋ₚ+ εt. In this equation, p past values of xt are used to predict the current value of xt. Thus, a third-order autoregressive model [AR(3)] uses three past values to predict the current value of the variable.","explhtml":"<p>A is correct because a pth-order autoregression, AR(p), for the variable xₜ is shown by xₜ = b₀ + b₁xₜ₋₁ + b₂xₜ₋₂ + . . . + bₚxₜ₋ₚ+ εt. In this equation, p past values of xt are used to predict the current value of xt. Thus, a third-order autoregressive model [AR(3)] uses three past values to predict the current value of the variable.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>A third-order autoregressive model uses:<\/p><\/div>","subj":"quant"},{"n":8,"q":"Which of the following is most consistent with a correctly specified autoregressive model?","opts":["Residual values are constant and finite","Residual autocorrelations differ significantly from zero","Autocorrelations of the error term are not significantly different from zero"],"ans":"C","expl":"C is correct because we can determine whether we are using the correct time-series model by testing whether the autocorrelations of the error term (error autocorrelations) differ significantly from 0. If they do, the model is not specified correctly. Given that, in our case, the autocorrelations of the error term are not significantly different from zero, this does not suggest misspecification.","explhtml":"<p>C is correct because we can determine whether we are using the correct time-series model by testing whether the autocorrelations of the error term (error autocorrelations) differ significantly from 0. If they do, the model is not specified correctly. Given that, in our case, the autocorrelations of the error term are not significantly different from zero, this does not suggest misspecification.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>Which of the following is most consistent with a correctly specified autoregressive model?<\/p><\/div>","subj":"quant"},{"n":9,"q":"An analyst is comparing the out-of-sample forecasting performance of an AR(1) model and an AR(2) model for monthly inflation rates. Which of the following metrics is the most appropriate for making this comparison?","opts":["R-square","Durbin–Watson statistic","Root mean squared error"],"ans":"C","expl":"C is correct because, typically, we compare the out-of-sample forecasting performance of forecasting models by comparing their root mean squared error (RMSE), which is the square root of the average squared error. The model with the smallest RMSE is judged the most accurate.","explhtml":"<p>C is correct because, typically, we compare the out-of-sample forecasting performance of forecasting models by comparing their root mean squared error (RMSE), which is the square root of the average squared error. The model with the smallest RMSE is judged the most accurate.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst is comparing the out-of-sample forecasting performance of an AR(1) model and an AR(2) model for monthly inflation rates. Which of the following metrics is the most appropriate for making this comparison?<\/p><\/div>","subj":"quant"},{"n":10,"q":"An analyst compares the out-of-sample forecasting performance of three autoregressive models on the same dataset and summarizes the following information: Which of the models is most accurate?","opts":["Model 1","Model 2","Model 3"],"ans":"C","expl":"C is correct because we compare the out-of-sample forecasting performance of forecasting models by comparing their root mean squared error (RMSE), which is the square root of the average squared error. The model with the smallest RMSE is judged the most accurate. Model 3 has the lowest RMSE and thus is the most accurate.","explhtml":"<p>C is correct because we compare the out-of-sample forecasting performance of forecasting models by comparing their root mean squared error (RMSE), which is the square root of the average squared error. The model with the smallest RMSE is judged the most accurate. Model 3 has the lowest RMSE and thus is the most accurate.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst compares the out-of-sample forecasting performance of three autoregressive models on the same dataset and summarizes the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp002.webp\" style=\"max-width:min(100%,433px)\" alt=\"\"><p>Which of the models is most accurate?<\/p><\/div>","subj":"quant"},{"n":11,"q":"Regression coefficient estimates in a time-series model can change substantially due to changes in:","opts":["the length of the sample period only.","the starting point of the sample period only.","both the length and the starting point of the sample period."],"ans":"C","expl":"C is correct because the estimates of regression coefficients of a time-series model can change substantially across different sample periods used for estimating the model. Often, the regression coefficient estimates of a time-series model estimated using an earlier sample period can be quite different from those of a model estimated using a later sample period. Similarly, the estimates can be different between models estimated using relatively shorter and longer sample periods.","explhtml":"<p>C is correct because the estimates of regression coefficients of a time-series model can change substantially across different sample periods used for estimating the model. Often, the regression coefficient estimates of a time-series model estimated using an earlier sample period can be quite different from those of a model estimated using a later sample period. Similarly, the estimates can be different between models estimated using relatively shorter and longer sample periods.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>Regression coefficient estimates in a time-series model can change substantially due to changes in:<\/p><\/div>","subj":"quant"},{"n":12,"q":"A random walk process:","opts":["is a covariance-stationary time series.","has a well-defined mean-reverting level.","is a special case of an AR(1) model with an intercept equal to 0 and a slope equal to 1."],"ans":"C","expl":"C is correct because an AR(1) model is specified as xₜ = b₀ + b₁xₜ + εt and a random walk model is specified as xₜ = xₜ₋₁ + εt. This implies that the random walk model is a special case of an AR(1) model with b0 = 0 and b1 = 1.","explhtml":"<p>C is correct because an AR(1) model is specified as xₜ = b₀ + b₁xₜ + εt and a random walk model is specified as xₜ = xₜ₋₁ + εt. This implies that the random walk model is a special case of an AR(1) model with b0 = 0 and b1 = 1.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>A random walk process:<\/p><\/div>","subj":"quant"},{"n":13,"q":"Random walks are a special case of an autoregressive model of order:","opts":["zero.","one.","two."],"ans":"B","expl":"B is correct because a random walk is a time series in which the value of the series in one period is the value of the series in the previous period plus an unpredictable random error. This equation is a special case of an AR(1) model with b0 = 0 and b1 = 1. A random walk is described by the following equation: xₜ = xₜ₋₁ + εt whereas an AR(1) model is described by the following equation: xₜ = b₀ + b₁xₜ₋₁ + εt.","explhtml":"<p>B is correct because a random walk is a time series in which the value of the series in one period is the value of the series in the previous period plus an unpredictable random error. This equation is a special case of an AR(1) model with b0 = 0 and b1 = 1.<\/p><p>A random walk is described by the following equation: xₜ = xₜ₋₁ + εt<\/p><p>whereas an AR(1) model is described by the following equation: xₜ = b₀ + b₁xₜ₋₁ + εt.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>Random walks are a special case of an autoregressive model of order:<\/p><\/div>","subj":"quant"},{"n":14,"q":"A currency analyst is using simple linear regression analysis to investigate the relationship between the US dollar/Japanese yen exchange rate movements and the risk-free interest rate differential between the two countries. In which of the following situations would the analyst need to examine whether the two time series are cointegrated?","opts":["When both time series have unit roots","When neither time series has a unit root","When one time series has a unit root and the other one does not"],"ans":"A","expl":"A is correct because, if both of the variables have unit roots, then we would need to evaluate whether the variables are cointegrated.","explhtml":"<p>A is correct because, if both of the variables have unit roots, then we would need to evaluate whether the variables are cointegrated.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>A currency analyst is using simple linear regression analysis to investigate the relationship between the US dollar/Japanese yen exchange rate movements and the risk-free interest rate differential between the two countries. In which of the following situations would the analyst need to examine whether the two time series are cointegrated?<\/p><\/div>","subj":"quant"},{"n":15,"q":"Which of the following time-series models have a unit root?","opts":["AR(0) models","Random walks","Covariance-stationary AR(1) models"],"ans":"B","expl":"B is correct because, if the lag coefficient is equal to 1.0, the time series has a unit root. By definition, all random walks, with or without a drift term, have unit roots. A random walk is described by the following equation: xₜ = xₜ₋₁ + εt, where the coefficient corresponding to the lagged value (xₜ₋₁) of a time series (xₜ) is equal to 1.0.","explhtml":"<p>B is correct because, if the lag coefficient is equal to 1.0, the time series has a unit root. By definition, all random walks, with or without a drift term, have unit roots.<\/p><p>A random walk is described by the following equation: xₜ = xₜ₋₁ + εt, where the coefficient corresponding to the lagged value (xₜ₋₁) of a time series (xₜ) is equal to 1.0.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>Which of the following time-series models have a unit root?<\/p><\/div>","subj":"quant"},{"n":16,"q":"An analyst is investigating whether a time series xₜ has a unit root. To implement a Dickey–Fuller test, the analyst must first run a simple linear regression where the dependent variable is the first difference of the time series (xₜ – xₜ₋₁) and the independent variable is the:","opts":["first lag of the time series (xₜ₋₁).","first lag of the time series minus one (xₜ₋₁ – 1).","first lag of the first difference of the time series (xₜ₋₁ – xₜ₋₂)."],"ans":"A","expl":"A is correct because, according to the Dickey–Fuller test, if there is a unit root in the AR(1) model (xₜ – xₜ₋₁ = b₀ + g₁xₜ₋₁ + εt), then g₁ will be 0 in a regression where the dependent variable is the first difference of the time series (xₜ – xₜ₋₁) and the independent variable is the first lag of the time series (xₜ₋₁).","explhtml":"<p>A is correct because, according to the Dickey–Fuller test, if there is a unit root in the AR(1) model (xₜ – xₜ₋₁ = b₀ + g₁xₜ₋₁ + εt), then g₁ will be 0 in a regression where the dependent variable is the first difference of the time series (xₜ – xₜ₋₁) and the independent variable is the first lag of the time series (xₜ₋₁).<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst is investigating whether a time series xₜ has a unit root. To implement a Dickey–Fuller test, the analyst must first run a simple linear regression where the dependent variable is the first difference of the time series (xₜ – xₜ₋₁) and the independent variable is the:<\/p><\/div>","subj":"quant"},{"n":17,"q":"An analyst forecasts the quarterly earnings growth of an airline using ten years of data and an AR(1) process with a fourth-quarter seasonal lag specified as: EarnGrowthₜ = b₀ + b₁(EarnGrowthₜ₋₁) + b₂(EarnGrowthₜ₋₄) + εₜ. The coefficient estimates and t-statistics are as follows: If the earnings growth was 2% in the most recent quarter and 3% four quarters ago, the predicted earnings growth for the current quarter is closest to:","opts":["3.2%.","4.4%.","5.1%."],"ans":"B","expl":"B is correct because the earnings growth is calculated as: 0.025 − 0.320(0.02) + 0.850(0.03) = 0.0441 ≈ 4.4%.","explhtml":"<p>B is correct because the earnings growth is calculated as: 0.025 − 0.320(0.02) + 0.850(0.03) = 0.0441 ≈ 4.4%.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst forecasts the quarterly earnings growth of an airline using ten years of data and an AR(1) process with a fourth-quarter seasonal lag specified as:<\/p><p>EarnGrowthₜ = b₀ + b₁(EarnGrowthₜ₋₁) + b₂(EarnGrowthₜ₋₄) + εₜ.<\/p><p>The coefficient estimates and t-statistics are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp003.webp\" style=\"max-width:min(100%,432px)\" alt=\"\"><p>If the earnings growth was 2% in the most recent quarter and 3% four quarters ago, the predicted earnings growth for the current quarter is closest to:<\/p><\/div>","subj":"quant"},{"n":18,"q":"An analyst is modeling a time series xₜ as an AR(1) process and performs the following regression on the errors of the model, εₜ: where uₜ is an error term. If the coefficient a₁ is found to be positive and statistically significant, the analyst can conclude that xₜ:","opts":["has a unit root.","is mean-reverting.","has heteroskedastic errors."],"ans":"C","expl":"C is correct because heteroskedasticity is the dependence of the error term variance on the independent variable. In 1982, Robert F. Engle suggested a way of testing whether the variance of the error in a particular time-series model in one period depends on the variance of the error in previous periods. He called this type of heteroskedasticity 'autoregressive conditional heteroskedasticity' (ARCH). Engle showed that we can test whether a time series is ARCH(1) by regressing the squared residuals from a previously estimated time-series model [in this case an AR(1) model] on a constant and one lag of the squared residuals. Given the specification of this model in the stem, if the estimate of a1 is statistically significantly different from zero, we conclude that the time series is ARCH(1), and that the time series has heteroskedastic errors.","explhtml":"<p>C is correct because heteroskedasticity is the dependence of the error term variance on the independent variable. In 1982, Robert F. Engle suggested a way of testing whether the variance of the error in a particular time-series model in one period depends on the variance of the error in previous periods. He called this type of heteroskedasticity &#x27;autoregressive conditional heteroskedasticity&#x27; (ARCH). Engle showed that we can test whether a time series is ARCH(1) by regressing the squared residuals from a previously estimated time-series model [in this case an AR(1) model] on a constant and one lag of the squared residuals. Given the specification of this model in the stem, if the estimate of a1 is statistically significantly different from zero, we conclude that the time series is ARCH(1), and that the time series has heteroskedastic errors.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst is modeling a time series xₜ as an AR(1) process and performs the following regression on the errors of the model, εₜ:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp004.webp\" style=\"max-width:min(100%,176px)\" alt=\"\"><p>where uₜ is an error term. If the coefficient a₁ is found to be positive and statistically significant, the analyst can conclude that xₜ:<\/p><\/div>","subj":"quant"},{"n":19,"q":"An analyst models the quarterly sales growth data of an online retailer and observes that the model's error term is heteroskedastic and follows an ARCH(2) process. This implies that the variance of the error term in the current quarter:","opts":["follows an autoregressive moving-average (ARMA) process.","depends linearly on the squared errors from the previous two quarters.","depends linearly on a time trend and the squared error from the previous quarter."],"ans":"B","expl":"B is correct because, in an ARCH(p) model, the variance of the error term in the current period depends linearly on the squared errors from the previous p periods. In the case of an ARCH(2) process, the variance of the error term will depend linearly on the squared errors from the previous two quarters.","explhtml":"<p>B is correct because, in an ARCH(p) model, the variance of the error term in the current period depends linearly on the squared errors from the previous p periods. In the case of an ARCH(2) process, the variance of the error term will depend linearly on the squared errors from the previous two quarters.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst models the quarterly sales growth data of an online retailer and observes that the model&#x27;s error term is heteroskedastic and follows an ARCH(2) process. This implies that the variance of the error term in the current quarter:<\/p><\/div>","subj":"quant"},{"n":20,"q":"An analyst estimates a simple linear regression of a time series yₜ on another time series xₜ. In which of the following situations could the estimates of the regression test statistics be valid?","opts":["Both the dependent variable yₜ and the independent variable xₜ have a unit root","The dependent variable yₜ has a unit root, but the independent variable xₜ does not","The independent variable xₜ has a unit root, but the dependent variable yₜ does not"],"ans":"A","expl":"A is correct because, if both time series have a unit root, we need to establish whether the two time series are cointegrated before we can rely on regression analysis. Moreover, if they are cointegrated, the error term in the linear regression of one time series on the other will be covariance stationary. Accordingly, the regression coefficients and standard errors will be consistent, and we can use them for hypothesis tests. Thus, the regression test statistics will be valid in this situation. If both time series have a unit root but are not cointegrated, the error term in the linear regression will not be covariance stationary, some regression assumptions will be violated, the regression coefficients and standard errors will not be consistent, and we cannot use them for hypothesis tests. Therefore, whether estimates of the regression test statistics would be valid depends on the cointegration of the two time series, which is not stated in the question stem.","explhtml":"<p>A is correct because, if both time series have a unit root, we need to establish whether the two time series are cointegrated before we can rely on regression analysis. Moreover, if they are cointegrated, the error term in the linear regression of one time series on the other will be covariance stationary. Accordingly, the regression coefficients and standard errors will be consistent, and we can use them for hypothesis tests. Thus, the regression test statistics will be valid in this situation.<\/p><p>If both time series have a unit root but are not cointegrated, the error term in the linear regression will not be covariance stationary, some regression assumptions will be violated, the regression coefficients and standard errors will not be consistent, and we cannot use them for hypothesis tests.<\/p><p>Therefore, whether estimates of the regression test statistics would be valid depends on the cointegration of the two time series, which is not stated in the question stem.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst estimates a simple linear regression of a time series yₜ on another time series xₜ. In which of the following situations could the estimates of the regression test statistics be valid?<\/p><\/div>","subj":"quant"},{"n":21,"q":"An analyst regresses changes in an exchange rate over time on the two countries' inflation rate differential. While each of the two time series has a unit root, the time series are not cointegrated. This implies that the error term in the linear regression will:","opts":["be covariance stationary and the regression coefficients will be consistent.","be covariance stationary but the regression coefficients will not be consistent.","not be covariance stationary and the regression coefficients will not be consistent."],"ans":"C","expl":"C is correct because, if both time series have a unit root but they are not cointegrated, the error term in the linear regression will not be covariance stationary, some regression assumptions will be violated, the regression coefficients and standard errors will not be consistent, and we cannot use them for hypothesis tests.","explhtml":"<p>C is correct because, if both time series have a unit root but they are not cointegrated, the error term in the linear regression will not be covariance stationary, some regression assumptions will be violated, the regression coefficients and standard errors will not be consistent, and we cannot use them for hypothesis tests.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst regresses changes in an exchange rate over time on the two countries&#x27; inflation rate differential. While each of the two time series has a unit root, the time series are not cointegrated. This implies that the error term in the linear regression will:<\/p><\/div>","subj":"quant"},{"n":22,"q":"An analyst estimates an AR(2) model for the monthly sales of a company and calculates the squared residuals from this regression. To test for the presence of ARCH(1) in the residuals, the analyst should regress the squared residuals on a constant and:","opts":["a time trend, and test whether the time trend coefficient is statistically different from 0.","one lag of the squared residuals, and test whether the slope coefficient is statistically different from 0.","one lag of the squared residuals, and test whether the slope coefficient is statistically different from 1."],"ans":"B","expl":"B is correct because, to test for ARCH(1), we do the following: Regress the squared residual from your time-series model on a lagged value of the squared residual and test whether the coefficient on the squared lagged residual differs significantly from 0.","explhtml":"<p>B is correct because, to test for ARCH(1), we do the following: Regress the squared residual from your time-series model on a lagged value of the squared residual and test whether the coefficient on the squared lagged residual differs significantly from 0.<\/p>","qhtml":"<div class=\"pp-topic\">Time-Series Analysis<\/div><div class=\"qtext\"><p>An analyst estimates an AR(2) model for the monthly sales of a company and calculates the squared residuals from this regression. To test for the presence of ARCH(1) in the residuals, the analyst should regress the squared residuals on a constant and:<\/p><\/div>","subj":"quant"},{"n":23,"q":"Which of the following statements about machine learning is most accurate?","opts":["Unsupervised machine-learning algorithms do not make use of labeled data","Classification algorithms focus on making predictions of continuous target variables","Clustering algorithms focus on reducing the number of features while retaining variation across observations to preserve the information contained in that variation"],"ans":"A","expl":"A is correct because unsupervised learning is machine learning [ML] that does not make use of labeled data. More formally, in unsupervised learning, we have inputs (Xs) that are used for analysis without any target (Y) being supplied. In unsupervised learning, because the ML algorithm is not given labeled training data, the algorithm seeks to discover structure within the data themselves. As such, unsupervised learning is useful for exploring new datasets because it can provide human experts with insights into a dataset too big or too complex to visualize.","explhtml":"<p>A is correct because unsupervised learning is machine learning [ML] that does not make use of labeled data. More formally, in unsupervised learning, we have inputs (Xs) that are used for analysis without any target (Y) being supplied. In unsupervised learning, because the ML algorithm is not given labeled training data, the algorithm seeks to discover structure within the data themselves. As such, unsupervised learning is useful for exploring new datasets because it can provide human experts with insights into a dataset too big or too complex to visualize.<\/p>","qhtml":"<div class=\"pp-topic\">Machine Learning<\/div><div class=\"qtext\"><p>Which of the following statements about machine learning is most accurate?<\/p><\/div>","subj":"quant"},{"n":24,"q":"Which of the following statements about the sources of out-of- sample error is most accurate?","opts":["Base error occurs due to randomness in the data","Variance error refers to the degree to which a model fits the training data","Bias error refers to how much the model's results change in response to new data from validation and test samples"],"ans":"A","expl":"A is correct because base error is due to randomness in the data.","explhtml":"<p>A is correct because base error is due to randomness in the data.<\/p>","qhtml":"<div class=\"pp-topic\">Machine Learning<\/div><div class=\"qtext\"><p>Which of the following statements about the sources of out-of- sample error is most accurate?<\/p><\/div>","subj":"quant"},{"n":25,"q":"Which of the following statements about the support vector machine algorithm is most accurate?","opts":["Adding more training data away from the support vectors will affect the boundary","The algorithm determines the boundary that is the furthest away from all the observations","In soft margin classification, the discriminant boundary chosen minimizes the total error penalty regardless of margin width"],"ans":"B","expl":"B is correct because the intuitive idea behind the SVM [support vector machine] algorithm is maximizing the probability of making a correct prediction by determining the boundary that is the furthest away from all the observations.","explhtml":"<p>B is correct because the intuitive idea behind the SVM [support vector machine] algorithm is maximizing the probability of making a correct prediction by determining the boundary that is the furthest away from all the observations.<\/p>","qhtml":"<div class=\"pp-topic\">Machine Learning<\/div><div class=\"qtext\"><p>Which of the following statements about the support vector machine algorithm is most accurate?<\/p><\/div>","subj":"quant"},{"n":26,"q":"Which of the following statements about principal components analysis (PCA) is most accurate?","opts":["PCA transforms uncorrelated features of data info a few main, correlated composite variables","An eigenvector gives the proportion of total variance in the initial data that is explained by each eigenvalue","A scree plot is used to show the eigenvectors ordered from highest to lowest according to their eigenvalues"],"ans":"C","expl":"C is correct because the PCA algorithm orders the eigenvectors from highest to lowest according to their eigenvalues—that is, in terms of their usefulness in explaining the total variance in the initial data (this is shown using a scree plot).","explhtml":"<p>C is correct because the PCA algorithm orders the eigenvectors from highest to lowest according to their eigenvalues—that is, in terms of their usefulness in explaining the total variance in the initial data (this is shown using a scree plot).<\/p>","qhtml":"<div class=\"pp-topic\">Machine Learning<\/div><div class=\"qtext\"><p>Which of the following statements about principal components analysis (PCA) is most accurate?<\/p><\/div>","subj":"quant"},{"n":27,"q":"In a neural network, a given link has an initial weight of 0.20. If the learning rate is 0.10 and the partial derivative of the total error with respect to the initial weight is 0.25, the new weight is closest to:","opts":["0.175.","0.195.","0.225."],"ans":"A","expl":"A is correct because the network weights are adjusted to reduce total error of the network and New weight = (Old weight) – (Learning rate) × (Partial derivative of the total error with respect to the old weight) = 0.20 – (0.10)(0.25) = 0.175.","explhtml":"<p>A is correct because the network weights are adjusted to reduce total error of the network and New weight = (Old weight) – (Learning rate) × (Partial derivative of the total error with respect to the old weight) = 0.20 – (0.10)(0.25) = 0.175.<\/p>","qhtml":"<div class=\"pp-topic\">Machine Learning<\/div><div class=\"qtext\"><p>In a neural network, a given link has an initial weight of 0.20. If the learning rate is 0.10 and the partial derivative of the total error with respect to the initial weight is 0.25, the new weight is closest to:<\/p><\/div>","subj":"quant"},{"n":28,"q":"In a data analysis project, data wrangling refers to:","opts":["cleansing and preprocessing raw data.","deriving numeric data from internal and external sources.","exploratory data analysis, feature selection, and feature engineering."],"ans":"A","expl":"A is correct because data preparation and wrangling involves cleansing and preprocessing of the raw data. Cleansing may entail resolving missing values, out-of- range values, and the like. Preprocessing may involve extracting, aggregating, filtering, and selecting relevant data columns.","explhtml":"<p>A is correct because data preparation and wrangling involves cleansing and preprocessing of the raw data. Cleansing may entail resolving missing values, out-of- range values, and the like. Preprocessing may involve extracting, aggregating, filtering, and selecting relevant data columns.<\/p>","qhtml":"<div class=\"pp-topic\">Big Data Projects<\/div><div class=\"qtext\"><p>In a data analysis project, data wrangling refers to:<\/p><\/div>","subj":"quant"},{"n":29,"q":"Aggregation, filtration, and conversion are common transformations carried out as part of:","opts":["data collection.","data wrangling.","data exploration."],"ans":"B","expl":"B is correct because data wrangling (preprocessing) involves making structured data ready for analyses and, to make structured data ready for analyses, the data should be preprocessed. Data preprocessing primarily includes transformations and scaling of the data. These processes are exercised on the cleansed dataset. The following transformations are common in practice: extraction, aggregation, filtration, selection, and conversion.","explhtml":"<p>B is correct because data wrangling (preprocessing) involves making structured data ready for analyses and, to make structured data ready for analyses, the data should be preprocessed. Data preprocessing primarily includes transformations and scaling of the data. These processes are exercised on the cleansed dataset. The following transformations are common in practice: extraction, aggregation, filtration, selection, and conversion.<\/p>","qhtml":"<div class=\"pp-topic\">Big Data Projects<\/div><div class=\"qtext\"><p>Aggregation, filtration, and conversion are common transformations carried out as part of:<\/p><\/div>","subj":"quant"},{"n":30,"q":"Which of the following is a feature engineering technique where multi-word patterns that are particularly discriminative can be identified and their connection kept intact?","opts":["N-grams","Parts of speech","Name entity recognition"],"ans":"A","expl":"A is correct because n-grams is a feature engineering/text processing technique where multi-word patterns that are particularly discriminative can be identified and their connection kept intact. For example, 'market' is a common word that can be indicative of many subjects or classes; the words 'stock market' are used in a particular context and may be helpful to distinguish general texts from finance- related texts.","explhtml":"<p>A is correct because n-grams is a feature engineering/text processing technique where multi-word patterns that are particularly discriminative can be identified and their connection kept intact. For example, &#x27;market&#x27; is a common word that can be indicative of many subjects or classes; the words &#x27;stock market&#x27; are used in a particular context and may be helpful to distinguish general texts from finance- related texts.<\/p>","qhtml":"<div class=\"pp-topic\">Big Data Projects<\/div><div class=\"qtext\"><p>Which of the following is a feature engineering technique where multi-word patterns that are particularly discriminative can be identified and their connection kept intact?<\/p><\/div>","subj":"quant"},{"n":31,"q":"In error analysis for classification problems, a Type I error refers to the situation where:","opts":["both the predicted condition and the actual condition are negative.","the predicted condition is negative but the actual condition is positive.","the predicted condition is positive but the actual condition is negative."],"ans":"C","expl":"C is correct because this is the description of a false positive or Type I error. For classification problems, error analysis involves computing four basic evaluation metrics: true positive (TP), false positive (FP), true negative (TN), and false negative (FN) metrics. FP is also called a Type I error, and FN is also called a Type II error.","explhtml":"<p>C is correct because this is the description of a false positive or Type I error. For classification problems, error analysis involves computing four basic evaluation metrics: true positive (TP), false positive (FP), true negative (TN), and false negative (FN) metrics. FP is also called a Type I error, and FN is also called a Type II error.<\/p>","qhtml":"<div class=\"pp-topic\">Big Data Projects<\/div><div class=\"qtext\"><p>In error analysis for classification problems, a Type I error refers to the situation where:<\/p><\/div>","subj":"quant"},{"n":32,"q":"In textual analysis of data, the inverse document frequency (IDF) measures how unique a term is across the entire corpus. If the entire corpus consists of 2,718 sentences and a particular word occurs in 1,618 sentences, the IDF is closest to:","opts":["0.52.","0.60.","1.68."],"ans":"A","expl":"A is correct because IDF = log(1/DF), where log denotes the natural logarithm and Document Frequency DF = (Sentence count with word) / (Total number of sentences) = 1,618/2,718 = 0.5953, so IDF = log(1/0.5953) = 0.5187 ≈ 0.52.","explhtml":"<p>A is correct because IDF = log(1/DF), where log denotes the natural logarithm and Document Frequency DF = (Sentence count with word) / (Total number of sentences) = 1,618/2,718 = 0.5953, so IDF = log(1/0.5953) = 0.5187 ≈ 0.52.<\/p>","qhtml":"<div class=\"pp-topic\">Big Data Projects<\/div><div class=\"qtext\"><p>In textual analysis of data, the inverse document frequency (IDF) measures how unique a term is across the entire corpus. If the entire corpus consists of 2,718 sentences and a particular word occurs in 1,618 sentences, the IDF is closest to:<\/p><\/div>","subj":"quant"},{"n":33,"q":"In the analysis of textual data, \"noisy features\" refers to:","opts":["the most sparse tokens in the dataset only.","the most frequent tokens in the dataset only.","both the most sparse and the most frequent tokens in the dataset."],"ans":"C","expl":"C is correct because noisy features are both the most frequent and most sparse (or rare) tokens in the dataset. On one end, noisy features can be stop words that are typically present frequently in all the texts across the dataset. On the other end, noisy features can be sparse terms that are present in only a few text cases.","explhtml":"<p>C is correct because noisy features are both the most frequent and most sparse (or rare) tokens in the dataset. On one end, noisy features can be stop words that are typically present frequently in all the texts across the dataset. On the other end, noisy features can be sparse terms that are present in only a few text cases.<\/p>","qhtml":"<div class=\"pp-topic\">Big Data Projects<\/div><div class=\"qtext\"><p>In the analysis of textual data, &quot;noisy features&quot; refers to:<\/p><\/div>","subj":"quant"},{"n":34,"q":"The data points in a given dataset have the following features: If a new data point, Xi, has a value of 149, its normalized value (in the range of [0,1]) is closest to:","opts":["0.16.","0.65.","0.73."],"ans":"B","expl":"B is correct because normalization is the process of rescaling numeric variables in the range of [0, 1] and, to normalize variable X, the minimum value (Xmin) is subtracted from each observation (Xi), and then this value is divided by the difference between the maximum and minimum values of X (Xmax − Xmin) as follows: Xi (normalized) = (Xi – Xmin)/(Xmax – Xmin) = (149 – 32)/(212 – 32) = 117/180 = 0.65.","explhtml":"<p>B is correct because normalization is the process of rescaling numeric variables in the range of [0, 1] and, to normalize variable X, the minimum value (Xmin) is subtracted from each observation (Xi), and then this value is divided by the difference between the maximum and minimum values of X (Xmax − Xmin) as follows: Xi (normalized) = (Xi – Xmin)/(Xmax – Xmin) = (149 – 32)/(212 – 32) = 117/180 = 0.65.<\/p>","qhtml":"<div class=\"pp-topic\">Big Data Projects<\/div><div class=\"qtext\"><p>The data points in a given dataset have the following features: If a new data point, Xi, has a value of 149, its normalized value (in the range of [0,1])<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp005.webp\" style=\"max-width:min(100%,504px)\" alt=\"\"><p>is closest to:<\/p><\/div>","subj":"quant"},{"n":35,"q":"Which of the following statements about the regression process is most accurate?","opts":["The residuals should be analyzed before examining the model's goodness of fit","A model should be used for forecasting after its in-sample performance is deemed acceptable","If the dependent variable is discrete, the model should be estimated as a simple linear regression"],"ans":"A","expl":"A is correct because the residuals should be analyzed to check if the assumptions of regression are satisfied and, if so, then only the goodness of fit of the model should be examined, otherwise the model should be adjusted further.","explhtml":"<p>A is correct because the residuals should be analyzed to check if the assumptions of regression are satisfied and, if so, then only the goodness of fit of the model should be examined, otherwise the model should be adjusted further.<\/p>","qhtml":"<div class=\"pp-topic\">Basics of Multiple Regression and Underlying Assumptions<\/div><div class=\"qtext\"><p>Which of the following statements about the regression process is most accurate?<\/p><\/div>","subj":"quant"},{"n":36,"q":"A logistic regression model is best suited to predict:","opts":["a portfolio's return based on its factor risks.","whether or not a company is a likely takeover target.","the stock market's volatility in different economic conditions."],"ans":"B","expl":"B is correct because, when the dependent variable is discrete—for example, an indicator variable such as whether a company is a takeover target or not a takeover target—then, as we shall see, the model may be estimated as a logistic regression.","explhtml":"<p>B is correct because, when the dependent variable is discrete—for example, an indicator variable such as whether a company is a takeover target or not a takeover target—then, as we shall see, the model may be estimated as a logistic regression.<\/p>","qhtml":"<div class=\"pp-topic\">Basics of Multiple Regression and Underlying Assumptions<\/div><div class=\"qtext\"><p>A logistic regression model is best suited to predict:<\/p><\/div>","subj":"quant"},{"n":37,"q":"Which of the following statements is most accurate with respect to interpreting a multiple regression with the equation","opts":["εi represents the stochastic part of the model","If the change in each of the variables X₁, X₂, and X₃ is zero, the change in Y is b₀","b₃ represents the percentage variation in Y that can be explained by the variable X₃"],"ans":"A","expl":"A is correct because the error term, εi, is the stochastic or random part of the model.","explhtml":"<p>A is correct because the error term, εi, is the stochastic or random part of the model.<\/p>","qhtml":"<div class=\"pp-topic\">Basics of Multiple Regression and Underlying Assumptions<\/div><div class=\"qtext\"><p>Which of the following statements is most accurate with respect to interpreting a multiple regression with the equation<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp006.webp\" style=\"max-width:min(100%,288px)\" alt=\"\"><\/div>","subj":"quant"},{"n":38,"q":"With respect to multiple linear regression, a partial regression coefficient describes the impact of a change in the respective independent variable on the dependent variable, holding:","opts":["the intercept coefficient equal to zero.","all other independent variables constant.","the respective slope coefficient equal to zero."],"ans":"B","expl":"B is correct because a slope coefficient in a multiple regression, known as a partial regression coefficient or a partial slope coefficient, must be interpreted with care. A partial regression coefficient describes the impact of that independent variable on the dependent variable, holding all the other independent variables constant.","explhtml":"<p>B is correct because a slope coefficient in a multiple regression, known as a partial regression coefficient or a partial slope coefficient, must be interpreted with care. A partial regression coefficient describes the impact of that independent variable on the dependent variable, holding all the other independent variables constant.<\/p>","qhtml":"<div class=\"pp-topic\">Basics of Multiple Regression and Underlying Assumptions<\/div><div class=\"qtext\"><p>With respect to multiple linear regression, a partial regression coefficient describes the impact of a change in the respective independent variable on the dependent variable, holding:<\/p><\/div>","subj":"quant"},{"n":39,"q":"An analyst tests the assumptions of a multiple linear regression model by plotting the regression residuals on a normal Q-Q plot. If the data points align along the diagonal, this confirms the:","opts":["linearity assumption.","normality assumption.","independence of errors assumption."],"ans":"B","expl":"B is correct because the normality assumption requires that the regression residuals are normally distributed and we can use a Q-Q plot to compare the model's standardized residuals to a theoretical standard normal distribution. If the residuals are normally distributed, they should align along the diagonal.","explhtml":"<p>B is correct because the normality assumption requires that the regression residuals are normally distributed and we can use a Q-Q plot to compare the model&#x27;s standardized residuals to a theoretical standard normal distribution. If the residuals are normally distributed, they should align along the diagonal.<\/p>","qhtml":"<div class=\"pp-topic\">Basics of Multiple Regression and Underlying Assumptions<\/div><div class=\"qtext\"><p>An analyst tests the assumptions of a multiple linear regression model by plotting the regression residuals on a normal Q-Q plot. If the data points align along the diagonal, this confirms the:<\/p><\/div>","subj":"quant"},{"n":40,"q":"In the context of a multiple linear regression model, which of the following assumptions is required to make valid inferences about the model?","opts":["The independent variables are normally distributed","The regression residuals are positively correlated across observations","The variance of the regression residuals is the same for all observations"],"ans":"C","expl":"C is correct because one of the assumptions of a multiple linear regression model is homoskedasticity, i.e., that the variance of the regression residuals is the same for all observations.","explhtml":"<p>C is correct because one of the assumptions of a multiple linear regression model is homoskedasticity, i.e., that the variance of the regression residuals is the same for all observations.<\/p>","qhtml":"<div class=\"pp-topic\">Basics of Multiple Regression and Underlying Assumptions<\/div><div class=\"qtext\"><p>In the context of a multiple linear regression model, which of the following assumptions is required to make valid inferences about the model?<\/p><\/div>","subj":"quant"},{"n":41,"q":"In multiple regression, the adjusted R-square:","opts":["can take on a negative value.","helps indicate whether the model's predictions are biased.","is a suitable measure to test the significance of the model's fit."],"ans":"A","expl":"A is Correct because, mathematically, the relation between R-sq and Adjusted R-sq is 22 Adjusted R̄ = 1 – [((n – 1)/(n – k – 1)) (1 – R)]. 22 Note that if k ≥ 1, then R is strictly greater than adjusted R. Further, the 22 adjusted R may be negative, whereas the R has a minimum of zero.","explhtml":"<p>A is Correct because, mathematically, the relation between R-sq and Adjusted R-sq is 22 Adjusted R̄ = 1 – [((n – 1)/(n – k – 1)) (1 – R)]. 22 Note that if k ≥ 1, then R is strictly greater than adjusted R. Further, the 22 adjusted R may be negative, whereas the R has a minimum of zero.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Regression Model Fit and Interpreting Model Results<\/div><div class=\"qtext\"><p>In multiple regression, the adjusted R-square:<\/p><\/div>","subj":"quant"},{"n":42,"q":"An analyst gathers the following summary of the goodness-of-fit measures for a dependent variable regressed on alternative sets of factors: Which of the models should be preferred for prediction purposes?","opts":["Model 1","Model 2","Model 3"],"ans":"C","expl":"C is correct because, when developing a model for prediction purposes, then we would likely select the model that AIC indicates, i.e., the model using Factors 1, 2, and 3. AIC is a measure of model parsimony, so a lower AIC indicates a better-fitting model. Model 3 has the lowest AIC value (12.463) among the three models.","explhtml":"<p>C is correct because, when developing a model for prediction purposes, then we would likely select the model that AIC indicates, i.e., the model using Factors 1, 2, and 3. AIC is a measure of model parsimony, so a lower AIC indicates a better-fitting model. Model 3 has the lowest AIC value (12.463) among the three models.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Regression Model Fit and Interpreting Model Results<\/div><div class=\"qtext\"><p>An analyst gathers the following summary of the goodness-of-fit measures for a dependent variable regressed on alternative sets of factors:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp007.webp\" style=\"max-width:min(100%,680px)\" alt=\"\"><p>Which of the models should be preferred for prediction purposes?<\/p><\/div>","subj":"quant"},{"n":43,"q":"For a multiple linear regression analysis, the mean square regression (MSR) is 19.234 and the mean square error (MSE) is 1.
