<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 33 — Hedge Fund Strategies · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<style id="ui-polish">

    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;

    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->

<script>
const DATA = [{"n": 1, "q": "The hedge fund strategy that typically requires the longest time commitment and has the greatest variability of investment returns is:", "opts": ["fixed-income arbitrage.", "distressed securities.", "merger and acquisition funds."], "ans": "B", "expl": "Relative to other hedge fund strategies, distressed debt takes a long time to work out as legal proceedings grind through the system. Distressed debt can generate spectacular investment returns or complete losses.", "explhtml": "<p>Relative to other hedge fund strategies, distressed debt takes a long time to work out as legal proceedings grind through the system. Distressed debt can generate spectacular investment returns or complete losses.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.2, LOS 33.c<\/div><div class=\"qtext\"><p>The hedge fund strategy that typically requires the longest time commitment and has the greatest variability of investment returns is:<\/p><\/div>", "subj": "alternatives"}, {"n": 2, "q": "Based on the data in  Exhibit 1: Conditional Linear Factor Model Coefficients for UNO and the statement from the fund documents regarding UNO's strategy (and assuming that a t-statistic with an absolute value greater than 2 is significant), which of the following statements is most accurate?", "opts": ["The macro analysts have exhibited poor market timing skill with respect to equity risk.", "UNO has been, on average, net short equity market risk during times of market crisis.", "The macro analysts have exhibited good market timing skill with respect to equity risk."], "ans": "C", "expl": "The output of the model shows that UNO has significant long exposure to equity risk during normal market conditions (with a statistically significant coefficient of 0.678). The coefficient of DSNP500 being equal to –0.189 indicates that the manager is less long in market crises (an overall exposure of 0.678 – 0.189 = 0.489). So, there is skill by the macro analysts in reducing market risk during a crisis. The data shows market timing skill in reducing the equity market exposure during a crisis, and the data does not imply that the manager has a negative exposure to market risk during crises (as stated previously, this coefficient remains positive at 0.489).", "explhtml": "<p>The output of the model shows that UNO has significant long exposure to equity risk during normal market conditions (with a statistically significant coefficient of 0.678). The coefficient of DSNP500 being equal to –0.189 indicates that the manager is less long in market crises (an overall exposure of 0.678 – 0.189 = 0.489). So, there is skill by the macro analysts in reducing market risk during a crisis. The data shows market timing skill in reducing the equity market exposure during a crisis, and the data does not imply that the manager has a negative exposure to market risk during crises (as stated previously, this coefficient remains positive at 0.489).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 2–5<\/div> <div class=\"pp-topic\">Module 33.4, LOS 33.h<\/div><div class=\"kq-note\">Câu thuộc item set (câu 2–5). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Based on the data in  Exhibit 1: Conditional Linear Factor Model Coefficients for UNO and the statement from the fund documents regarding UNO&#x27;s strategy (and assuming that a t-statistic with an absolute value greater than 2 is significant), which of the following statements is most accurate?<\/p><\/div>", "subj": "alternatives"}, {"n": 3, "q": "Based on the data in  Exhibit 1: Conditional Linear Factor Model Coefficients for UNO, which of the following statements regarding exposure of UNO to the volatility factor is most accurate?", "opts": ["The manager has destroyed value through poor management of volatility exposure in crisis times versus normal times.", "The manager has negative exposure to volatility in times of market crisis.", "The macro analysts may be controlling for market exposure through long put positions on equity markets."], "ans": "B", "expl": "The data shows that in normal times, the manager is short volatility (with a significant VIX coefficient of –0.183) and that in times of crisis, the volatility exposure becomes less negative (taking a value of –0.183 + 0.054 = –0.129). The manager has negative exposure to volatility in times of market crisis; hence, this is the correct answer. Reducing the negative exposure to volatility in times of crisis when volatility is rising will create value rather than destroy value in the fund. Long put positions will have a positive volatility exposure, which is not evidenced by the negative volatility exposures of the model coefficients.", "explhtml": "<p>The data shows that in normal times, the manager is short volatility (with a significant VIX coefficient of –0.183) and that in times of crisis, the volatility exposure becomes less negative (taking a value of –0.183 + 0.054 = –0.129). The manager has negative exposure to volatility in times of market crisis; hence, this is the correct answer. Reducing the negative exposure to volatility in times of crisis when volatility is rising will create value rather than destroy value in the fund. Long put positions will have a positive volatility exposure, which is not evidenced by the negative volatility exposures of the model coefficients.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 2–5<\/div> <div class=\"pp-topic\">Module 33.4, LOS 33.h<\/div><div class=\"qtext\"><p>Based on the data in  Exhibit 1: Conditional Linear Factor Model Coefficients for UNO, which of the following statements regarding exposure of UNO to the volatility factor is most accurate?<\/p><\/div>", "subj": "alternatives"}, {"n": 4, "q": "A manager with superior market timing skills would exhibit which of the following statistically significant coefficients in the conditional linear factor model?", "opts": ["USD: positive, DUSD: negative, CREDIT: positive, DCREDIT: negative.", "USD: negative, DUSD: negative, CREDIT: positive, DCREDIT: positive.", "USD: negative, DUSD: positive, CREDIT: positive, DCREDIT: negative."], "ans": "C", "expl": "A manager with superior market timing skills in trading the U.S. dollar will be short USD in normal times, when riskier assets are outperforming; they will increase their USD position in times of crisis, when the USD is appreciating. A manager with superior market timing skills in trading credit will be long credit risk in normal times, when spreads are flat/narrowing; they will lower their credit exposure in times of crisis, when spreads are widening.", "explhtml": "<p>A manager with superior market timing skills in trading the U.S. dollar will be short USD in normal times, when riskier assets are outperforming; they will increase their USD position in times of crisis, when the USD is appreciating.<\/p><p>A manager with superior market timing skills in trading credit will be long credit risk in normal times, when spreads are flat/narrowing; they will lower their credit exposure in times of crisis, when spreads are widening.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 2–5<\/div> <div class=\"pp-topic\">Module 33.4, LOS 33.h<\/div><div class=\"qtext\"><p>A manager with superior market timing skills would exhibit which of the following statistically significant coefficients in the conditional linear factor model?<\/p><\/div>", "subj": "alternatives"}, {"n": 5, "q": "Which of the following rationales is least likely to be appropriate when justifying a 20% allocation to hedge funds in a multi-asset portfolio such as a corporate pension plan?", "opts": ["The allocation will increase portfolio risk-adjusted return.", "The allocation will decrease portfolio volatility.", "The allocation will increase portfolio return."], "ans": "C", "expl": "Adding a 20% allocation to a hedge fund strategy in a traditional portfolio typically leads to the portfolio having lower volatility, higher risk-adjusted return as measured as a Sharpe ratio or Sortino ratio, and lower maximum drawdown. It does not typically increase the overall return of the portfolio.", "explhtml": "<p>Adding a 20% allocation to a hedge fund strategy in a traditional portfolio typically leads to the portfolio having lower volatility, higher risk-adjusted return as measured as a Sharpe ratio or Sortino ratio, and lower maximum drawdown. It does not typically increase the overall return of the portfolio.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 2–5<\/div> <div class=\"pp-topic\">Module 33.4, LOS 33.i<\/div><div class=\"qtext\"><p>Which of the following rationales is least likely to be appropriate when justifying a 20% allocation to hedge funds in a multi-asset portfolio such as a corporate pension plan?<\/p><\/div>", "subj": "alternatives"}, {"n": 6, "q": "Long/short equity funds typically:", "opts": ["maintain a net long equity exposure of 40%–60%.", "eliminate market exposure through a net beta of zero.", "reduce standard deviation to zero."], "ans": "A", "expl": "Unlike a market-neutral approach, long/short approaches maintain a net long equity position typically between 40%–60%. The net long equity position would have a positive beta. Managers aspire to have a standard deviation about half of a long-only approach.", "explhtml": "<p>Unlike a market-neutral approach, long/short approaches maintain a net long equity position typically between 40%–60%. The net long equity position would have a positive beta. Managers aspire to have a standard deviation about half of a long-only approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.2, LOS 33.b<\/div><div class=\"qtext\"><p>Long/short equity funds typically:<\/p><\/div>", "subj": "alternatives"}, {"n": 7, "q": "Hedge Fund Z follows a short volatility strategy, while Hedge Fund Y makes insurance investments. Which of the following is most accurate concerning the funds?", "opts": ["Z has a natural hedge against market declines.", "Z’s strategy is neither positively nor negatively correlated with the market.", "Y’s investments will be largely uncorrelated with market movements."], "ans": "C", "expl": "A primary benefit of insurance strategies is the lack of correlation with the market. A short volatility strategy would have poor returns as volatility increases. Because markets tend to fall during volatile periods, it does not provide a hedge. Similarly, the volatility strategy will have a positive correlation with the market.", "explhtml": "<p>A primary benefit of insurance strategies is the lack of correlation with the market. A short volatility strategy would have poor returns as volatility increases. Because markets tend to fall during volatile periods, it does not provide a hedge. Similarly, the volatility strategy will have a positive correlation with the market.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.3, LOS 33.f<\/div><div class=\"qtext\"><p>Hedge Fund Z follows a short volatility strategy, while Hedge Fund Y makes insurance investments. Which of the following is most accurate concerning the funds?<\/p><\/div>", "subj": "alternatives"}, {"n": 8, "q": "The payoff profile of merger arbitrage positions is similar to the return on a:", "opts": ["risky bond, short a call, and long a put.", "riskless bond, short a call, and short a put.", "riskless bond, short a put, and long a call."], "ans": "C", "expl": "The strategy incorporates the time associated between merger announcement and transaction closing, which is discounted at the risk-free rate. M/A hedge funds also earn additional \"premium\" from equity holders, which reflects the potential that the deal may not successfully close. Similarly, hedge funds are in effect, long a call if a higher bid were to surface. All cash flows are discounted at the risk-free rate.", "explhtml": "<p>The strategy incorporates the time associated between merger announcement and transaction closing, which is discounted at the risk-free rate. M/A hedge funds also earn additional &quot;premium&quot; from equity holders, which reflects the potential that the deal may not successfully close. Similarly, hedge funds are in effect, long a call if a higher bid were to surface. All cash flows are discounted at the risk-free rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.2, LOS 33.c<\/div><div class=\"qtext\"><p>The payoff profile of merger arbitrage positions is similar to the return on a:<\/p><\/div>", "subj": "alternatives"}, {"n": 9, "q": "Downing's excitement about FoF investing would least appropriately be based on a belief that:", "opts": ["he may be able to invest in hedge funds closed to new investors.", "his investors will have more transparency in their investments.", "he can provide better liquidity terms to his individual investors."], "ans": "B", "expl": "FoF investments often provide more favorable redemption terms than do individual hedge funds. In addition, an FoF may be able to invest in closed hedge funds, due to previously arranged terms. One disadvantage, however, is that an FoF may not provide the same transparency of investments as individual funds do; this represents additional risk for investors.", "explhtml": "<p>FoF investments often provide more favorable redemption terms than do individual hedge funds. In addition, an FoF may be able to invest in closed hedge funds, due to previously arranged terms. One disadvantage, however, is that an FoF may not provide the same transparency of investments as individual funds do; this represents additional risk for investors.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 9–12<\/div> <div class=\"pp-topic\">Module 33.3, LOS 33.g<\/div><div class=\"kq-note\">Câu thuộc item set (câu 9–12). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Downing&#x27;s excitement about FoF investing would least appropriately be based on a belief that:<\/p><\/div>", "subj": "alternatives"}, {"n": 10, "q": "Copernicus's investment strategy would most accurately be classified as:", "opts": ["event driven.", "opportunistic.", "specialist."], "ans": "B", "expl": "Copernicus would be considered an opportunistic hedge fund because it invests across many asset classes, taking a macro-first, top-down view that considers which investments would be most favorable given current market conditions.", "explhtml": "<p>Copernicus would be considered an opportunistic hedge fund because it invests across many asset classes, taking a macro-first, top-down view that considers which investments would be most favorable given current market conditions.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 9–12<\/div> <div class=\"pp-topic\">Module 33.1, LOS 33.a<\/div><div class=\"qtext\"><p>Copernicus&#x27;s investment strategy would most accurately be classified as:<\/p><\/div>", "subj": "alternatives"}, {"n": 11, "q": "Which claim made by APM is least accurate ?", "opts": ["Claim 3.", "Claim 1.", "Claim 2."], "ans": "B", "expl": "Claim 1 is inaccurate: global macro funds are likely to underperform in low-volatility markets. Claim 2 is accurate; global macro funds also perform worse in mean-reverting markets. Claim 3 is plausible; global macro funds generally apply significant leverage to boost returns (often between 600%–700% of capital).", "explhtml": "<p>Claim 1 is inaccurate: global macro funds are likely to underperform in low-volatility markets. Claim 2 is accurate; global macro funds also perform worse in mean-reverting markets. Claim 3 is plausible; global macro funds generally apply significant leverage to boost returns (often between 600%–700% of capital).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 9–12<\/div> <div class=\"pp-topic\">Module 33.2, LOS 33.c<\/div><div class=\"qtext\"><p>Which claim made by APM is least accurate ?<\/p><\/div>", "subj": "alternatives"}, {"n": 12, "q": "Esoteric's staff's statements regarding its volatility trading are least accurate  regarding:", "opts": ["risk reduction.", "convexity.", "insurance-like returns."], "ans": "B", "expl": "Some long volatility positions (e.g., long positions in variance swaps) exhibit positive (not negative) convexity, which indeed would be an advantage of adding this asset class. Volatility is highly negatively correlated with equity market returns, because spikes in volatility often coincide with sharp movements downward in equity markets. Thus, long-volatility contracts have a high negative correlation with equity. Selling volatility is a way to capture premia and provide regular cash flows, similar to insurance underwriting.", "explhtml": "<p>Some long volatility positions (e.g., long positions in variance swaps) exhibit positive (not negative) convexity, which indeed would be an advantage of adding this asset class. Volatility is highly negatively correlated with equity market returns, because spikes in volatility often coincide with sharp movements downward in equity markets. Thus, long-volatility contracts have a high negative correlation with equity. Selling volatility is a way to capture premia and provide regular cash flows, similar to insurance underwriting.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 9–12<\/div> <div class=\"pp-topic\">Module 33.4, LOS 33.h<\/div><div class=\"qtext\"><p>Esoteric&#x27;s staff&#x27;s statements regarding its volatility trading are least accurate  regarding:<\/p><\/div>", "subj": "alternatives"}, {"n": 13, "q": "Which one of the following is least likely considered to be an argument to include hedge funds in a diversified portfolio?", "opts": ["Greater transparency of investment management decisions and ability to pursue more aggressive strategies.", "Access to a larger investment universe.", "Flexibility to use short selling and derivative contracts and greater use of leverage."], "ans": "A", "expl": "Greater transparency is generally not attributed to hedge funds as many managers attempt to hide their activities for competitive purposes.", "explhtml": "<p>Greater transparency is generally not attributed to hedge funds as many managers attempt to hide their activities for competitive purposes.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.1, LOS 33.a<\/div><div class=\"qtext\"><p>Which one of the following is least likely considered to be an argument to include hedge funds in a diversified portfolio?<\/p><\/div>", "subj": "alternatives"}, {"n": 14, "q": "Which general statement describing key differences between long/short equity (L/S) strategies and equity market neutral (EMN) is most accurate?", "opts": ["EMN strategies are less diversified than L/S strategies but typically use greater amounts of financial leverage to generate returns than L/S strategies.", "EMN strategies rely on selecting securities with sufficient liquidity, have longer security selection time horizons, and usually have greater leverage than L/S equity strategies.", "L/S strategies typically have more concentrated portfolios than EMN strategies, use lower leverage than EMN, and target unlevered returns that are higher than EMN."], "ans": "C", "expl": "L/S strategies are typically more fundamental in nature as they select specific securities to go long and short. L/S funds attempt to earn alpha on both sides of the trade and target a lower beta while achieving returns consistent with long-only equities. EMN strategies have systematic approaches in selecting long and short candidates, trade more frequently, and are close to market neutral. To deliver higher returns, these funds use substantial leverage.", "explhtml": "<p>L/S strategies are typically more fundamental in nature as they select specific securities to go long and short. L/S funds attempt to earn alpha on both sides of the trade and target a lower beta while achieving returns consistent with long-only equities. EMN strategies have systematic approaches in selecting long and short candidates, trade more frequently, and are close to market neutral. To deliver higher returns, these funds use substantial leverage.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.2, LOS 33.b<\/div><div class=\"qtext\"><p>Which general statement describing key differences between long/short equity (L/S) strategies and equity market neutral (EMN) is most accurate?<\/p><\/div>", "subj": "alternatives"}, {"n": 15, "q": "Opportunistic hedge fund strategies employ:", "opts": ["an investment in distressed debt.", "long and short positions in equity.", "a top-down approach."], "ans": "C", "expl": "Opportunistic strategies have a macro focus and generally follow a top-down approach. The other answers are more closely associated with a bottom-up approach.", "explhtml": "<p>Opportunistic strategies have a macro focus and generally follow a top-down approach. The other answers are more closely associated with a bottom-up approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.1, LOS 33.a<\/div><div class=\"qtext\"><p>Opportunistic hedge fund strategies employ:<\/p><\/div>", "subj": "alternatives"}, {"n": 16, "q": "In order to establish a beta-neutral pairs trade, relative to the number of shares bought in the long position in HOM, Shore should short sell:", "opts": ["the same number of shares in SAR.", "double the number of shares in SAR.", "half the number of shares in SAR."], "ans": "A", "expl": "Shore should short sell the same number of shares in SAR as the number of shares held in the long HOM position to establish a beta-neutral trade. Because SAR has a beta equal to half the beta of HOM, on a beta-risk basis alone, the pairs trade will need twice as many shares in SAR as HOM. However, because the share price of SAR is twice the price of shares in HOM, on a market value basis only half the number of shares in SAR are needed with respect to the number of shares of HOM. Therefore, creating a beta-neutral position will involve holding the same number of shares short in SAR as the number of shares bought in the long HOM position.", "explhtml": "<p>Shore should short sell the same number of shares in SAR as the number of shares held in the long HOM position to establish a beta-neutral trade.<\/p><p>Because SAR has a beta equal to half the beta of HOM, on a beta-risk basis alone, the pairs trade will need twice as many shares in SAR as HOM. However, because the share price of SAR is twice the price of shares in HOM, on a market value basis only half the number of shares in SAR are needed with respect to the number of shares of HOM. Therefore, creating a beta-neutral position will involve holding the same number of shares short in SAR as the number of shares bought in the long HOM position.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 16–19<\/div> <div class=\"pp-topic\">Module 33.2, LOS 33.b<\/div><div class=\"kq-note\">Câu thuộc item set (câu 16–19). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>In order to establish a beta-neutral pairs trade, relative to the number of shares bought in the long position in HOM, Shore should short sell:<\/p><\/div>", "subj": "alternatives"}, {"n": 17, "q": "The increase in soft-catalyst trades by the merger arbitrage team will be expected to:", "opts": ["increase both the risk and return of the team.", "increase the return and decrease the risk of the team.", "decrease both the risk and return of the team."], "ans": "A", "expl": "Under a soft-catalyst approach, investments are made based on expected announcements of mergers. Under a hard-catalyst approach, investments are made based on merger announcements that have already been made. Because the soft-catalyst approach involves the extra uncertainty of deals being announced, profits from this approach are expected to be more volatile. However, because they would profit from the large share price movements when deals are announced, there would be higher expected returns.", "explhtml": "<p>Under a soft-catalyst approach, investments are made based on expected announcements of mergers. Under a hard-catalyst approach, investments are made based on merger announcements that have already been made. Because the soft-catalyst approach involves the extra uncertainty of deals being announced, profits from this approach are expected to be more volatile. However, because they would profit from the large share price movements when deals are announced, there would be higher expected returns.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 16–19<\/div> <div class=\"pp-topic\">Module 33.2, LOS 33.c<\/div><div class=\"qtext\"><p>The increase in soft-catalyst trades by the merger arbitrage team will be expected to:<\/p><\/div>", "subj": "alternatives"}, {"n": 18, "q": "The ratio of potential losses if the deal fails versus the potential gains if the deal succeeds for the BIG/SMA merger arbitrage trade is closest to:", "opts": ["3.", "4.", "5."], "ans": "A", "expl": "If Cohen has established a USD 10,000,000 long position in SMA, then they have bought USD 10,000,000 / USD 25 = 400,000 shares in SMA post/after deal announcement. For each one of these SMA shares, they will receive 0.5 shares of BIG if the deal goes through, which sets the size of the short position in BIG as follows: Number of BIG shares to short = 0.5 × 400,000 = 200,000. Short proceeds raised from short selling 200,000 shares of BIG at a price of USD 52 = USD 10,400,000. If the deal goes through the short position in BIG, it can be covered by the BIG shares received in exchange for the long potion in SMA. This leaves the fund with profits of short proceeds – investment in SMA shares = USD 10,400,000 – USD 10,000,000 = USD 400,000. Should the deal fail, then, assuming prices revert to the pre-deal announcement level, the following occur: The loss from a long position in SMA = 400,000 × (USD 25 – USD 23) = USD 800,000. The loss from a short position in BIG = 200,000 × (USD 54 – USD 52) = USD 400,000. Total loss = USD 800,000 + USD 400,000 = USD 1,200,000. Hence, the ratio of potential losses to potential gains = USD 1,200,000 / USD 400,000 = 3x.", "explhtml": "<p>If Cohen has established a USD 10,000,000 long position in SMA, then they have bought USD 10,000,000 / USD 25 = 400,000 shares in SMA post/after deal announcement.<\/p><p>For each one of these SMA shares, they will receive 0.5 shares of BIG if the deal goes through, which sets the size of the short position in BIG as follows:<\/p><p>Number of BIG shares to short = 0.5 × 400,000 = 200,000.<\/p><p>Short proceeds raised from short selling 200,000 shares of BIG at a price of USD 52 = USD 10,400,000. If the deal goes through the short position in BIG, it can be covered by the BIG shares received in exchange for the long potion in SMA. This leaves the fund with profits of short proceeds – investment in SMA shares = USD 10,400,000 – USD 10,000,000 = USD 400,000.<\/p><p>Should the deal fail, then, assuming prices revert to the pre-deal announcement level, the following occur:<\/p><p>The loss from a long position in SMA = 400,000 × (USD 25 – USD 23) = USD 800,000.<\/p><p>The loss from a short position in BIG = 200,000 × (USD 54 – USD 52) = USD 400,000.<\/p><p>Total loss = USD 800,000 + USD 400,000 = USD 1,200,000.<\/p><p>Hence, the ratio of potential losses to potential gains = USD 1,200,000 / USD 400,000 = 3x.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 16–19<\/div> <div class=\"pp-topic\">Module 33.2, LOS 33.c<\/div><div class=\"qtext\"><p>The ratio of potential losses if the deal fails versus the potential gains if the deal succeeds for the BIG/SMA merger arbitrage trade is closest to:<\/p><\/div>", "subj": "alternatives"}, {"n": 19, "q": "Which of the following statements regarding a capital structure arbitrage trade is most accurate?", "opts": ["Capital structure arbitrage trades are not expected to be profitable when the distressed company is forced into liquidation.", "Capital structure arbitrage opportunities usually occur due to equity retail investors being too bearish on the fortunes of a distressed company versus the outlook of debt investors in the company.", "Capital structure arbitrage trades can result in the investor taking an equity stake in new equity of the distressed company post-bankruptcy reorganization."], "ans": "C", "expl": "In a capital structure arbitrage trade, an investor takes a long position in the debt securities of a distressed company and short sells the equity. Should the company enter a bankruptcy reorganization, the investor might swap their debt for equity and become an equity investor in the new post-reorganization company. A capital structure arbitrage opportunity usually occurs when equity retail investors are too bullish on the fortunes of the distressed company, while debt investors are pricing in a higher chance of bankruptcy—thereby making the debt cheap relative to equity. Should the company be forced into liquidation, it is likely the short equity position will be worthless, but the long position in the corporate debt will have some liquidation recovery value; hence, the trade is profitable.", "explhtml": "<p>In a capital structure arbitrage trade, an investor takes a long position in the debt securities of a distressed company and short sells the equity. Should the company enter a bankruptcy reorganization, the investor might swap their debt for equity and become an equity investor in the new post-reorganization company.<\/p><p>A capital structure arbitrage opportunity usually occurs when equity retail investors are too bullish on the fortunes of the distressed company, while debt investors are pricing in a higher chance of bankruptcy—thereby making the debt cheap relative to equity.<\/p><p>Should the company be forced into liquidation, it is likely the short equity position will be worthless, but the long position in the corporate debt will have some liquidation recovery value; hence, the trade is profitable.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 16–19<\/div> <div class=\"pp-topic\">Module 33.2, LOS 33.c<\/div><div class=\"qtext\"><p>Which of the following statements regarding a capital structure arbitrage trade is most accurate?<\/p><\/div>", "subj": "alternatives"}, {"n": 20, "q": "Using the data in Exhibit 1 and assuming that all other features of Insurance Pool A, Insurance Pool B, and Insurance Pool C are equivalent, the life settlement investment opportunity with the best expected return is most likely to be:", "opts": ["Pool B.", "Pool A.", "Pool C."], "ans": "A", "expl": "Life settlement investments involve the hedge fund buying existing insurance policies from insured lives, paying the premium for the remainder of the contract's life, and then receiving the payout of benefits on the death of the original policyholder. Hedge funds will prefer pools of insurance contracts that have a low surrender value (defined as the value the insured lives could receive from the original insurance company if they cancel their contract) because this implies that policyholders would be happy to sell their insurance contracts for a relatively lower amount. Hedge fund managers would prefer insurance pools with a lower premium as a percentage of benefit because they will have to pay this for the remainder of the life of the original policyholder. Hedge funds would also prefer contracts relating to lives with lower life expectancies because they will receive benefit payouts sooner if the original policyholders die earlier. Pool B meets these conditions of lower surrender value, lower annual premium, and shorter life expectancy.", "explhtml": "<p>Life settlement investments involve the hedge fund buying existing insurance policies from insured lives, paying the premium for the remainder of the contract&#x27;s life, and then receiving the payout of benefits on the death of the original policyholder. Hedge funds will prefer pools of insurance contracts that have a low surrender value (defined as the value the insured lives could receive from the original insurance company if they cancel their contract) because this implies that policyholders would be happy to sell their insurance contracts for a relatively lower amount. Hedge fund managers would prefer insurance pools with a lower premium as a percentage of benefit because they will have to pay this for the remainder of the life of the original policyholder. Hedge funds would also prefer contracts relating to lives with lower life expectancies because they will receive benefit payouts sooner if the original policyholders die earlier. Pool B meets these conditions of lower surrender value, lower annual premium, and shorter life expectancy.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 20–23<\/div> <div class=\"pp-topic\">Module 33.3, LOS 33.f<\/div><div class=\"kq-note\">Câu thuộc item set (câu 20–23). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Using the data in Exhibit 1 and assuming that all other features of Insurance Pool A, Insurance Pool B, and Insurance Pool C are equivalent, the life settlement investment opportunity with the best expected return is most likely to be:<\/p><\/div>", "subj": "alternatives"}, {"n": 21, "q": "Considering all the short-term objectives specified in the recent investment committee motion, which of the following style allocation recommendations for CAM is most likely to be appropriate?", "opts": ["Rotate from equity strategies into distressed securities funds.", "Rotate from equity strategies into opportunistic strategies.", "Rotate from relative value strategies into equity strategies."], "ans": "C", "expl": "The first objective is to increase the liquidity of the fund of hedge funds. This is unlikely to be achieved under rotating from equity strategies to distressed securities because equity strategies comprise long/short, short-bias, and market-neutral strategies, all of which are relatively liquid styles—whereas distressed securities funds are likely to be illiquid. The second objective is to decrease the leverage of the fund. This is unlikely to be achieved under rotating from equity strategies into opportunistic strategies because opportunistic funds such as managed futures and global macro funds tend to use high levels of leverage. While equity market neutral funds tend to use high levels of leverage, long/short equity funds vary in their use of leverage, and short-bias funds use low levels of leverage. Hence, moving from equity strategies into opportunistic strategies is most likely to increase the leverage exposure of CAM. The third objective is to lower exposure to significant credit events in the fund. Tail events, such as a credit crunch, can significantly negatively impact convertible arbitrage returns due to their long credit exposure and disrupt the spread strategies employed by fixed-income arbitrage funds. Both styles of fund are relative value funds; hence, allocating away from relative value funds is appropriate. The answer choice to rotate from relative value strategies into equity strategies meets this requirement. Note that this answer choice would also be expected to increase the liquidity of the portfolio because equity strategies are generally liquid, while relative value strategies have variable levels of liquidity. The answer choice also should lead to lower exposure to leverage in the portfolio because relative value funds tend to make extensive use of leverage. Overall, the answer choice to rotate from relative value strategies into equity strategies is the best recommendation to meet the objectives of the investment committee.", "explhtml": "<p>The first objective is to increase the liquidity of the fund of hedge funds. This is unlikely to be achieved under rotating from equity strategies to distressed securities because equity strategies comprise long/short, short-bias, and market-neutral strategies, all of which are relatively liquid styles—whereas distressed securities funds are likely to be illiquid.<\/p><p>The second objective is to decrease the leverage of the fund. This is unlikely to be achieved under rotating from equity strategies into opportunistic strategies because opportunistic funds such as managed futures and global macro funds tend to use high levels of leverage. While equity market neutral funds tend to use high levels of leverage, long/short equity funds vary in their use of leverage, and short-bias funds use low levels of leverage. Hence, moving from equity strategies into opportunistic strategies is most likely to increase the leverage exposure of CAM.<\/p><p>The third objective is to lower exposure to significant credit events in the fund. Tail events, such as a credit crunch, can significantly negatively impact convertible arbitrage returns due to their long credit exposure and disrupt the spread strategies employed by fixed-income arbitrage funds. Both styles of fund are relative value funds; hence, allocating away from relative value funds is appropriate. The answer choice to rotate from relative value strategies into equity strategies meets this requirement. Note that this answer choice would also be expected to increase the liquidity of the portfolio because equity strategies are generally liquid, while relative value strategies have variable levels of liquidity. The answer choice also should lead to lower exposure to leverage in the portfolio because relative value funds tend to make extensive use of leverage.<\/p><p>Overall, the answer choice to rotate from relative value strategies into equity strategies is the best recommendation to meet the objectives of the investment committee.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 20–23<\/div> <div class=\"pp-topic\">Module 33.3, LOS 33.e<\/div><div class=\"qtext\"><p>Considering all the short-term objectives specified in the recent investment committee motion, which of the following style allocation recommendations for CAM is most likely to be appropriate?<\/p><\/div>", "subj": "alternatives"}, {"n": 22, "q": "Based on the fee structure information provided, if CAM allocates equally to two managers— one of which makes a gross return of 8%, while the other manager realizes a gross return of – 8%—the net return to CAM investors is closest to:", "opts": ["-3.1%.", "0.0%.", "-1.5%."], "ans": "A", "expl": "Management fee for the profitable manager = 1.5% Incentive fee for the profitable manager = 0.175 × (8% – 1.5%) = 1.1375% Net return from profitable manager = 8% – 1.5% – 1.1375% = 5.3625% Management fee for the loss-making manager = 1.5% Incentive fee for the loss-making manager = 0% Net return from profitable manager = –8% – 1.5%= –9.5% Hence, the gross return to CAM investors = (0.5 × 5.3625%) + (0.5 × –9.5%) = –2.06875% Management fee payable by CAM investors = 1% Incentive fee payable by CAM investors = 0% So, the gross return earned by CAM investors = –2.06875% – 1% = –3.06875%", "explhtml": "<p>Management fee for the profitable manager = 1.5%<\/p><p>Incentive fee for the profitable manager = 0.175 × (8% – 1.5%) = 1.1375%<\/p><p>Net return from profitable manager = 8% – 1.5% – 1.1375% = 5.3625%<\/p><p>Management fee for the loss-making manager = 1.5%<\/p><p>Incentive fee for the loss-making manager = 0%<\/p><p>Net return from profitable manager = –8% – 1.5%= –9.5%<\/p><p>Hence, the gross return to CAM investors = (0.5 × 5.3625%) + (0.5 × –9.5%) = –2.06875%<\/p><p>Management fee payable by CAM investors = 1%<\/p><p>Incentive fee payable by CAM investors = 0%<\/p><p>So, the gross return earned by CAM investors = –2.06875% – 1% = –3.06875%<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 20–23<\/div> <div class=\"pp-topic\">Module 33.3, LOS 33.g<\/div><div class=\"qtext\"><p>Based on the fee structure information provided, if CAM allocates equally to two managers— one of which makes a gross return of 8%, while the other manager realizes a gross return of – 8%—the net return to CAM investors is closest to:<\/p><\/div>", "subj": "alternatives"}, {"n": 23, "q": "How many of the three factors listed by the client of CAM would a fund-of-funds (FoF) structure be preferred to a multi-manager structure from the point of view of investors in the fund?", "opts": ["One.", "None.", "Two."], "ans": "A", "expl": "Only the operational risk factor is favorable for the FoF structure versus a multi-manager fund structure. Fewer FoFs fail due to operational risk factors due to the diversification of the structure over multiple underlying funds with different operational risk exposures, and the lower level of leverage in FoFs versus multi-manager funds. Hence, from an operational risk perspective, FoFs are preferable to multi-manager funds. Multi-manager funds are able to reallocate funds to different styles tactically faster than FoFs because multi-manager funds are not subject to the notice periods or lockups of external underlying funds. Hence, from a speed of tactical asset allocation perspective, the multi-manager structure is preferred. Incentive fees are more likely to be able to be netted off across the performance of different teams in a single multi-manager structure rather than in an FoF, where external managers will take incentive fees on positive performance regardless of whether the overall FoF is profitable.", "explhtml": "<p>Only the operational risk factor is favorable for the FoF structure versus a multi-manager fund structure.<\/p><p>Fewer FoFs fail due to operational risk factors due to the diversification of the structure over multiple underlying funds with different operational risk exposures, and the lower level of leverage in FoFs versus multi-manager funds. Hence, from an operational risk perspective, FoFs are preferable to multi-manager funds.<\/p><p>Multi-manager funds are able to reallocate funds to different styles tactically faster than FoFs because multi-manager funds are not subject to the notice periods or lockups of external underlying funds. Hence, from a speed of tactical asset allocation perspective, the multi-manager structure is preferred.<\/p><p>Incentive fees are more likely to be able to be netted off across the performance of different teams in a single multi-manager structure rather than in an FoF, where external managers will take incentive fees on positive performance regardless of whether the overall FoF is profitable.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 20–23<\/div> <div class=\"pp-topic\">Module 33.3, LOS 33.g<\/div><div class=\"qtext\"><p>How many of the three factors listed by the client of CAM would a fund-of-funds (FoF) structure be preferred to a multi-manager structure from the point of view of investors in the fund?<\/p><\/div>", "subj": "alternatives"}, {"n": 24, "q": "Which of the following is a disadvantage of a multistrategy fund as opposed to a fund-of-funds?", "opts": ["Operational risk.", "Fee structure.", "Volatility of returns."], "ans": "A", "expl": "Because the funds in a multistrategy fund are operated by the same firm, any operational flaws would not be diversified away as with a fund-of-funds. Fees are likely more attractive for a multistrategy fund due to netting, and both types of funds would seek to limit volatility.", "explhtml": "<p>Because the funds in a multistrategy fund are operated by the same firm, any operational flaws would not be diversified away as with a fund-of-funds. Fees are likely more attractive for a multistrategy fund due to netting, and both types of funds would seek to limit volatility.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.3, LOS 33.g<\/div><div class=\"qtext\"><p>Which of the following is a disadvantage of a multistrategy fund as opposed to a fund-of-funds?<\/p><\/div>", "subj": "alternatives"}, {"n": 25, "q": "A convertible bond arbitrage portfolio has begun implementing a strategy by purchasing convertible bonds with conversion prices substantially below the current stock price. The convertible bonds will:", "opts": ["behave most like the underlying equity.", "be impossible to hedge, given the low delta.", "behave most like a straight bond."], "ans": "A", "expl": "Because the convertible bond's current conversion price is well below the current stock price, the convertible bonds are substantially in the money, and the convertible bonds will behave like the underlying equity. In contrast, if the convertible bond's current conversion price is well above the current stock price, the convertible bonds are substantially out of the money, and the convertible bonds will behave like straight bonds. Even with a low delta, the delta risk (and gamma risk) can be hedged and is a typical strategy for a convertible arbitrage portfolio.", "explhtml": "<p>Because the convertible bond&#x27;s current conversion price is well below the current stock price, the convertible bonds are substantially in the money, and the convertible bonds will behave like the underlying equity.<\/p><p>In contrast, if the convertible bond&#x27;s current conversion price is well above the current stock price, the convertible bonds are substantially out of the money, and the convertible bonds will behave like straight bonds.<\/p><p>Even with a low delta, the delta risk (and gamma risk) can be hedged and is a typical strategy for a convertible arbitrage portfolio.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.2, LOS 33.d<\/div><div class=\"qtext\"><p>A convertible bond arbitrage portfolio has begun implementing a strategy by purchasing convertible bonds with conversion prices substantially below the current stock price. The convertible bonds will:<\/p><\/div>", "subj": "alternatives"}, {"n": 26, "q": "Which of the following is a characteristic of a managed futures strategy as a result of crowding?", "opts": ["Execution slippage.", "Price inefficiency.", "High leverage."], "ans": "A", "expl": "Execution slippage is the result of crowding as participants pursue similar strategies. While high leverage is a feature of managed futures, it is not specifically related to crowding. While exploiting pricing inefficiencies are often an objective of hedge funds, that characteristic is not specifically related to the question either.", "explhtml": "<p>Execution slippage is the result of crowding as participants pursue similar strategies. While high leverage is a feature of managed futures, it is not specifically related to crowding. While exploiting pricing inefficiencies are often an objective of hedge funds, that characteristic is not specifically related to the question either.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.3, LOS 33.e<\/div><div class=\"qtext\"><p>Which of the following is a characteristic of a managed futures strategy as a result of crowding?<\/p><\/div>", "subj": "alternatives"}, {"n": 27, "q": "The key factors that an insurance settlements portfolio manager must successfully analyze include:", "opts": ["the probability that the insurance company will face financial pressure, the demeanor of the policyholder, and the age of the policyholder.", "the underlying interest rate on the policy, the early termination provisions of the contract, and the government bond yield curve.", "expected policy cash flows, ongoing premium payment obligations, and the eventual death benefit to be received."], "ans": "C", "expl": "Insurance settlement managers must be able to create a discounted cash flow analysis of all future cash flows. Continuing premium payments owed, buyout terms for the existing holder, and eventual death benefits to be received at an uncertain point in the future are key factors they must consider.", "explhtml": "<p>Insurance settlement managers must be able to create a discounted cash flow analysis of all future cash flows. Continuing premium payments owed, buyout terms for the existing holder, and eventual death benefits to be received at an uncertain point in the future are key factors they must consider.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.3, LOS 33.f<\/div><div class=\"qtext\"><p>The key factors that an insurance settlements portfolio manager must successfully analyze include:<\/p><\/div>", "subj": "alternatives"}, {"n": 28, "q": "Because convertible securities are issued sporadically by smaller companies in small offering sizes with unrated debt, the value of the embedded option tends to trade at:", "opts": ["a discount to the implied equity volatility of the underlying equity.", "a premium to implied volatility of the underlying equity.", "relatively low implied volatility levels compared with realized volatility for the underlying equity."], "ans": "C", "expl": "Negative issues for investors like small issue size, poor covenant protection, lack of institutional familiarity with the issue, and no-rated credits result in contraction in overall valuation, which represents itself as lower implied volatility compared with historic observations. These factors contribute to the convertible option being undervalued.", "explhtml": "<p>Negative issues for investors like small issue size, poor covenant protection, lack of institutional familiarity with the issue, and no-rated credits result in contraction in overall valuation, which represents itself as lower implied volatility compared with historic observations. These factors contribute to the convertible option being undervalued.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.2, LOS 33.d<\/div><div class=\"qtext\"><p>Because convertible securities are issued sporadically by smaller companies in small offering sizes with unrated debt, the value of the embedded option tends to trade at:<\/p><\/div>", "subj": "alternatives"}, {"n": 29, "q": "Which of the following best represents the net short position of a short-biased hedge fund strategy?", "opts": ["50%.", "100%.", "0%."], "ans": "A", "expl": "The short-biased strategy does have some long exposure, leaving the net short exposure typically 30%–60% of the portfolio. The 100% net short would be indicative of a dedicated short strategy, and a market-neutral strategy may have a net short of 0%.", "explhtml": "<p>The short-biased strategy does have some long exposure, leaving the net short exposure typically 30%–60% of the portfolio. The 100% net short would be indicative of a dedicated short strategy, and a market-neutral strategy may have a net short of 0%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.2, LOS 33.b<\/div><div class=\"qtext\"><p>Which of the following best represents the net short position of a short-biased hedge fund strategy?<\/p><\/div>", "subj": "alternatives"}, {"n": 30, "q": "Hedge Fund T is a hedge fund that employs market-neutral, opportunistic, and specialist strategies as part of its operations. A hospital endowment fund hires Hedge Fund T to manage part of its portfolio. This situation is best described as a:", "opts": ["fund-of-funds.", "multistrategy fund.", "global macro fund."], "ans": "B", "expl": "Because the hedge fund is operating several strategies, the best description is a multistrategy fund. The fund-of-funds would best relate to different hedge funds each employing a different strategy. A global macro is a type of opportunistic strategy.", "explhtml": "<p>Because the hedge fund is operating several strategies, the best description is a multistrategy fund. The fund-of-funds would best relate to different hedge funds each employing a different strategy. A global macro is a type of opportunistic strategy.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.3, LOS 33.g<\/div><div class=\"qtext\"><p>Hedge Fund T is a hedge fund that employs market-neutral, opportunistic, and specialist strategies as part of its operations. A hospital endowment fund hires Hedge Fund T to manage part of its portfolio. This situation is best described as a:<\/p><\/div>", "subj": "alternatives"}, {"n": 31, "q": "Managed futures strategies are typically characterized as a(n):", "opts": ["highly liquid strategy, active across a wide range of asset classes, and able to go long or short with relative ease.", "diversifying strategy to consider in rising markets, as they outperform equity markets in rising markets.", "strategy with a return profile that tends to be very countercyclical."], "ans": "A", "expl": "Managed futures strategies are typically characterized as highly liquid, active across a wide range of asset classes, and able to go long or short with relative ease. High liquidity results from futures markets being among the most actively traded markets in the world. Futures contracts also provide highly liquid exposures to a wide range of asset classes that can be traded across the globe 24 hours a day. Because futures contracts require relatively little collateral to take positions as a result of the exchanges' central clearinghouse management of margin and risk, it is easier to take long and short positions with higher leverage than traditional instruments. The returns of managed futures tend to be very cyclical. Between 2011 and 2018, the directionality of foreign exchange and fixed-income markets deteriorated, volatility levels in many markets dissipated, and periods of acute market stress temporarily disappeared. Except for equity markets in some developed countries, many markets became range bound or mean reverting, which hurt managed futures. The diversifying benefit of trend-following strong equity markets is also less diversifying to traditional portfolios than if such trends existed in other non-equity markets. The value added from managed futures has typically been demonstrated during periods of market stress; for example, in 2007–2009, managers using this strategy benefited from short positions in equity futures and long positions in fixed-income futures at a time when equity indices were falling and fixed-income indices were rising.", "explhtml": "<p>Managed futures strategies are typically characterized as highly liquid, active across a wide range of asset classes, and able to go long or short with relative ease. High liquidity results from futures markets being among the most actively traded markets in the world. Futures contracts also provide highly liquid exposures to a wide range of asset classes that can be traded across the globe 24 hours a day. Because futures contracts require relatively little collateral to take positions as a result of the exchanges&#x27; central clearinghouse management of margin and risk, it is easier to take long and short positions with higher leverage than traditional instruments.<\/p><p>The returns of managed futures tend to be very cyclical. Between 2011 and 2018, the directionality of foreign exchange and fixed-income markets deteriorated, volatility levels in many markets dissipated, and periods of acute market stress temporarily disappeared. Except for equity markets in some developed countries, many markets became range bound or mean reverting, which hurt managed futures. The diversifying benefit of trend-following strong equity markets is also less diversifying to traditional portfolios than if such trends existed in other non-equity markets.<\/p><p>The value added from managed futures has typically been demonstrated during periods of market stress; for example, in 2007–2009, managers using this strategy benefited from short positions in equity futures and long positions in fixed-income futures at a time when equity indices were falling and fixed-income indices were rising.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.3, LOS 33.e<\/div><div class=\"qtext\"><p>Managed futures strategies are typically characterized as a(n):<\/p><\/div>", "subj": "alternatives"}, {"n": 32, "q": "A conditional-factor risk model is used in analyzing hedge fund returns. The purpose of the dummy variable in that model is to distinguish between:", "opts": ["periods of normal market activity and financial crises.", "managed funds and passive funds.", "funds in countries with high inflation and low inflation."], "ans": "A", "expl": "The dummy variable is employed in the model because factors may have different influence during normal periods and financial crises. Such a model is termed a conditional linear factor model, where the dummy variable allows for the conditional analysis.", "explhtml": "<p>The dummy variable is employed in the model because factors may have different influence during normal periods and financial crises. Such a model is termed a conditional linear factor model, where the dummy variable allows for the conditional analysis.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.4, LOS 33.h<\/div><div class=\"qtext\"><p>A conditional-factor risk model is used in analyzing hedge fund returns. The purpose of the dummy variable in that model is to distinguish between:<\/p><\/div>", "subj": "alternatives"}, {"n": 33, "q": "Two key advantages of multistrategy hedge funds over fund-of-funds (FoF) managers are:", "opts": ["more attractive fees for investors than FoF managers, and a greater level of diversification than FoFs provide.", "economies of scale as different hedge fund strategies share the same administrative costs, and greater left-tail risk than FoF.", "the ability and knowledge to rapidly make tactical reallocation decisions to the firm’s strategic allocation based on changing market conditions, and greater visibility to assess the overall risk exposure."], "ans": "C", "expl": "Multistrategy managers operate multiple strategies under one organization and can react or adjust to anticipated market conditions more rapidly than FoF managers—they frequently have lockups and gates to negotiate when making allocation changes.", "explhtml": "<p>Multistrategy managers operate multiple strategies under one organization and can react or adjust to anticipated market conditions more rapidly than FoF managers—they frequently have lockups and gates to negotiate when making allocation changes.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.3, LOS 33.g<\/div><div class=\"qtext\"><p>Two key advantages of multistrategy hedge funds over fund-of-funds (FoF) managers are:<\/p><\/div>", "subj": "alternatives"}, {"n": 34, "q": "Which of the following is least likely included in the four-factor, conditional linear model used to quantify hedge fund strategies' risk exposures?", "opts": ["Credit risk.", "Volatility risk.", "Interest rate risk."], "ans": "C", "expl": "The four risk factors are credit risk, volatility risk, equity risk, and currency risk.", "explhtml": "<p>The four risk factors are credit risk, volatility risk, equity risk, and currency risk.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.4, LOS 33.h<\/div><div class=\"qtext\"><p>Which of the following is least likely included in the four-factor, conditional linear model used to quantify hedge fund strategies&#x27; risk exposures?<\/p><\/div>", "subj": "alternatives"}, {"n": 35, "q": "Compared to the Sharpe ratio, the Sortino ratio may be preferred when comparing hedge funds due to which of the following?", "opts": ["The right-tail risk of hedge funds.", "The high volatility of hedge funds.", "The left-tail risk of hedge funds."], "ans": "C", "expl": "Due to the left-tail risk of hedge funds, the Sortino ratio may be superior in defining risk because it only considers downside deviation. Both measures would reflect high volatility through their risk measures.", "explhtml": "<p>Due to the left-tail risk of hedge funds, the Sortino ratio may be superior in defining risk because it only considers downside deviation. Both measures would reflect high volatility through their risk measures.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.4, LOS 33.i<\/div><div class=\"qtext\"><p>Compared to the Sharpe ratio, the Sortino ratio may be preferred when comparing hedge funds due to which of the following?<\/p><\/div>", "subj": "alternatives"}, {"n": 36, "q": "Top-down analysis is the key driver behind which of the following hedge fund strategies?", "opts": ["Global macro.", "Fixed-income arbitrage.", "Merger and acquisition."], "ans": "A", "expl": "Global macro is focused on getting the big picture right on interest rate and equity market movements around the globe.", "explhtml": "<p>Global macro is focused on getting the big picture right on interest rate and equity market movements around the globe.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.3, LOS 33.e<\/div><div class=\"qtext\"><p>Top-down analysis is the key driver behind which of the following hedge fund strategies?<\/p><\/div>", "subj": "alternatives"}, {"n": 37, "q": "An advantage and a disadvantage of using fund-of-funds (FoF) for access to hedge funds are the:", "opts": ["advantage of lower overall fee structures and the disadvantage of a lack of research capability.", "advantage of access to top-ranked managers with smaller investment bite sizes and the disadvantage of no netting of performance fees.", "advantage of being able to access best-of-breed managers in each class of hedge fund and the disadvantage of negative economies of scale for monitoring."], "ans": "B", "expl": "Smaller family offices and high-net-worth investors benefit from FoFs as they enable access to top managers with smaller bite sizes and provide investment allocation guidance. Fees are substantially higher for FoFs, transparency is generally lower, and there is no netting of performance fees, unlike multistrategy funds. Netting of performance fees is an advantage because it may deny incentive payments to successful underlying funds when the overall performance of the FoF is poor. Therefore, not having netting is a disadvantage. Additionally, one of the advantages of FoFs is the economies of scale for monitoring.", "explhtml": "<p>Smaller family offices and high-net-worth investors benefit from FoFs as they enable access to top managers with smaller bite sizes and provide investment allocation guidance. Fees are substantially higher for FoFs, transparency is generally lower, and there is no netting of performance fees, unlike multistrategy funds. Netting of performance fees is an advantage because it may deny incentive payments to successful underlying funds when the overall performance of the FoF is poor. Therefore, not having netting is a disadvantage. Additionally, one of the advantages of FoFs is the economies of scale for monitoring.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 33.3, LOS 33.g<\/div><div class=\"qtext\"><p>An advantage and a disadvantage of using fund-of-funds (FoF) for access to hedge funds are the:<\/p><\/div>", "subj": "alternatives"}, {"n": 38, "q": "To capture the pricing discrepancy between the Treasury bond market and the swaps market, Winstanton should execute which of the following trades?", "opts": ["Buy Treasuries, Sell TIPS, pay fixed under inflation swap.", "Sell Treasuries, sell TIPS, receive fixed under inflation swap.", "Buy Treasuries, buy TIPS, pay fixed under inflation swap."], "ans": "A", "expl": "The manager can earn excess return as follows: Buy Treasuries, locking in a fixed inflow coupon of 3% Short sell TIPS, locking in coupon outflow of 1% + future realized inflation Pay fixed leg of 1.5% and receive future realized inflation under an inflation swap Net exposure = 3% – (1% – inflation) – (1.5% – inflation) = 0.5%", "explhtml": "<p>The manager can earn excess return as follows:<\/p><p>Buy Treasuries, locking in a fixed inflow coupon of 3% Short sell TIPS, locking in coupon outflow of 1% + future realized inflation Pay fixed leg of 1.5% and receive future realized inflation under an inflation swap<\/p><p>Net exposure = 3% – (1% – inflation) – (1.5% – inflation) = 0.5%<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 38–41<\/div> <div class=\"pp-topic\">Module 33.3, LOS 33.e<\/div><div class=\"kq-note\">Câu thuộc item set (câu 38–41). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>To capture the pricing discrepancy between the Treasury bond market and the swaps market, Winstanton should execute which of the following trades?<\/p><\/div>", "subj": "alternatives"}, {"n": 39, "q": "The immediate arbitrage profit from buying the TST convertible bond and converting into shares is closest to:", "opts": ["USD 4 per share.", "USD 10 per share.", "USD 6 per share."], "ans": "A", "expl": "Purchasing USD 1,000 par of the bond at a price of 115 per cent of par costs USD 1,000 × (115 / 100) = USD 1,150. The cost per share of owning the shares through buying the convertible bond and converting is, therefore, USD 1,150 / 25 = USD 46. The current shares are worth USD 50 in equity markets; hence, investors can lock in a USD 4 gain immediately from buying the convertible and short selling the shares today.", "explhtml": "<p>Purchasing USD 1,000 par of the bond at a price of 115 per cent of par costs USD 1,000 × (115 / 100) = USD 1,150.<\/p><p>The cost per share of owning the shares through buying the convertible bond and converting is, therefore, USD 1,150 / 25 = USD 46.<\/p><p>The current shares are worth USD 50 in equity markets; hence, investors can lock in a USD 4 gain immediately from buying the convertible and short selling the shares today.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 38–41<\/div> <div class=\"pp-topic\">Module 33.2, LOS 33.d<\/div><div class=\"qtext\"><p>The immediate arbitrage profit from buying the TST convertible bond and converting into shares is closest to:<\/p><\/div>", "subj": "alternatives"}, {"n": 40, "q": "Introducing the costs and benefits of carrying the convertible arbitrage trade through time will:", "opts": ["decrease the profitability of the trade.", "increase the profitability of the trade.", "have no impact on the profitability of the trade."], "ans": "C", "expl": "Annual coupon income from the long convertible bond position will be USD 1,000 × 4% = USD 40 per USD 1,000 par. The annual cost of borrowing and dividend that needs to be paid to the stock lender equals USD 0.60 + USD 1 = USD 1.60 per share. In total, this will cost USD 1.60 × 25 = USD 40 per USD 1,000 of par. The coupon income is equal to the outflows of costs of borrowing and dividends; hence, carrying the position through time will not affect the overall profitability of the trade.", "explhtml": "<p>Annual coupon income from the long convertible bond position will be USD 1,000 × 4% = USD 40 per USD 1,000 par.<\/p><p>The annual cost of borrowing and dividend that needs to be paid to the stock lender equals USD 0.60 + USD 1 = USD 1.60 per share. In total, this will cost USD 1.60 × 25 = USD 40 per USD 1,000 of par.<\/p><p>The coupon income is equal to the outflows of costs of borrowing and dividends; hence, carrying the position through time will not affect the overall profitability of the trade.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 38–41<\/div> <div class=\"pp-topic\">Module 33.2, LOS 33.d<\/div><div class=\"qtext\"><p>Introducing the costs and benefits of carrying the convertible arbitrage trade through time will:<\/p><\/div>", "subj": "alternatives"}, {"n": 41, "q": "Considering the objective of the new volatility trader, which of the following volatility trading strategies would most likely be appropriate for adding to the fund?", "opts": ["Long positions in OTC options.", "Roll down using VIX futures.", "Relative value volatility arbitrage using exchange-traded options."], "ans": "A", "expl": "In times of market stress, volatility increases—hence, to meet the objective of providing protection in times of market stress, the volatility trader should execute a long volatility strategy. The only strategy lis
