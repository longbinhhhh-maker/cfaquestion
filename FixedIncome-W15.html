<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

const DATA = [{"n": 1, "q": "Compared to default risk, spread risk is a more important consideration for a US-based investor evaluating which of the following bonds?", "opts": ["US Treasury bonds", "High-yield corporate bonds", "Investment-grade corporate bonds"], "ans": "C", "expl": "Spread risk represents the potential for the yield spread to change while an investor owns a bond. The two key components of spread risk are as\nfollows:\nMarket liquidity risk: The risk that due to market illiquidity a bond can be bought (sold) at a price significantly different than the market\nprice. Liquidity risk is most often reflected in the bid-ask spread. For example, a bond may have a market price of 100 but can be sold for\nonly 98 (ie, bid) or bought for no less than 102 (ie, ask). The more acute the bond's liquidity situation, the greater the spread required to\ncompensate the investor for the risk.\nCredit migration risk: The risk that a bond's credit rating is downgraded, resulting in a greater probability of default, which is reflected in\nhigher yield spreads. A default is the ultimate negative outcome of credit migration risk.\nVirtually all bonds are evaluated on the basis of yield spread. However, spread risk is considered a relatively greater risk than default risk for\ninvestment-grade bonds since their risk of default is remote (<1%). In contrast, the probability of default risk, compared to the probability of a\ndowngrade (ie, credit migration risk), is much more significant in the evaluation of high-yield debt; therefore, for high-yield bonds, the emphasis on\ndefault risk is relatively greater than spread risk (Choice B).\n(Choice A) Very high-quality sovereign bonds, such as US Treasury bonds, are considered free of default risk and are used as the basis to\ndetermine yield spread (as in the image above). Therefore, they do not have spread risk.\nThings to remember:\nCompared to high-yield credit analysis, investment-grade debt analysis relies more on spread o repay debt\ndenominated in their own currency.\nExplain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA7gAAAGACAIAAAAI7VnlAAB1j0lEQVR42u29TXBbZ5bffWjT7faou3ilmWSiybzipbRKu1oCl+5uDi927Q5dBFZpl11FYGWnvSCwsdPqBYHFaOLegKiKne4VgCqp5Nm8AMuajx3AZmemekWQLjs7EVAlqcxUSrx8E6XHlmy+i7945tFzP3ABgp/6/xYu+uriuc/nueee55zzTOzv7wshhBBCCCHkWV5gFxBCCCGEEEJFmRBCCCGEECrKhBBCCCGEUFEmhBBCCCGEijIhhBBCCCFUlAkhhBBCCKGiTAghhBBCCBVlQgghhBBCqCgTQgghhBBCRZkQQgghhBAqyoQQQgghhFBRJoQQQgghhIoyIYQQQgghVJQJIYQQQgghVJQJIYQQQgihokwIIYQQQggVZUIIIYQQQqgoE0IIIYQQQkWZEEIIIYQQKsqEEEIIIYRQUSaEEEIIIYSKMiGEEEIIIVSUCSGEEEIIoaJMCCGEEEIIFWVCCCGEEEKoKBNCCCGEEEJFmRBCCCGEECrKhBBCCCGEECrKhBBCCCGEUFEmhBBCCCFkJCbZBeRE8H2/Xq+LyPr6Ov4X11Op1OLiooh4nvecd1G9Xu/3+/h7ZWXlbNVcRMZS+cMXhanlOM4hG9Xr9RqNBv6en58fyxRdXV1dW1vD367risjS0tKxzXxzgkX17bh678zR6XRUOmFcMEADKZfL+GN6elpEcrncqZXA1shqzVH5U1tzQoQWZUIIIYQQQk6cif39ffYCOU663a6IpNNptSKHksvlarXa89xR6XQaZi0ROVvrNJ1Oy4FN7pCVP2RRq6ursJPt7u7KoU2MqIyIlEolOZylvFgsonrW9Wazmclkjn+CWX3b6/VEJJ/Pw7x9tjY0xgKmDQZaRNrtdkJL/8TEBP7A/e12W06fIblcLkMOm9XTmqPyp63mhAhdL8hzQjabNX0t8DrxPA9XWq0WXtL1eh17nc/hS1oOvFA4Ww45zVqt1umsnqrI2Puu1Wr4I+H+/lF/ys7OzprL8zkEjhPa/HPjfDIzMwPxGxxZ8wqFDyFC1wtCCCGEEEKEFmUip8bvAgZjESkUCiJSqVTMG5aXl2HzkINArufWomz1DJHht5jljOwbHJu7xXnquiMFoWznL6AtZnDpa0GI0KJMCCGEEEKI0KJM5HTbM9S0bOK6LmL4zMRVEpa5qVqtqgcqPDth/lleXlaHQoRMIWxFwkwmUTegntVqFVbtXq+HMjOZDCzcli9psVjUQmAJzmazaKAGfsWUiRtiyrRqjpKLxSJ6wHEctB2Z9TTN09LSkprErJY2m02zBN/3tRrJ3RPhaFutVlEl1H+gIdz3ffykXq+jIY7j6NPj/XRR/2KxiDmgDV9ZWdFBR8idttS8mMRs1uv10Fc6u8y+ldhsa2iXPjqTySwvL4vh/an1D8a2otsrlQrmidbBzJyIMcVWjJVBT1PXVSoVHUHrcUtLS/FWUhSFVphXOp3OwN+aa7NcLmuYICqzvLwc9Vt9qPab/iT0iea60Gls9pUuUmsmBwfIcRyNVgzeHNWrmMNYZfV6HQ/1PG/gzA8KLlQy2NLQgdva2sKKc10X09h1Xa2GKVFd19UFhXXR7XbNWRc68XSNoFbB5gRHKqr+1qLTqYvatlotFX14ii7eoJA0Jbx28nOYr5CcJPuEHCO7u7uO45hiDv9bKBSazWaz2dzd3Y0vYWAqjFQqtbu7i3JqtZp5Px5hVkaMndZcLqf/lEql ot mean that investors will always be repaid in full, only that legal remedies (eg, bankruptcy laws) are available.\nThings to remember:\nA unique feature of sovereign credits is the concept of sovereign immunity, which is the inability of investors to force debt repayment through legal\nmeans.\nExplain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues.", "qhtml": null, "explfigs": null}, {"n": 4, "q": "The credit risk of nonsovereign government revenue bonds is most likely based on:", "opts": ["project net operating cash flow.", "a full faith and credit guarantee.", "income and sales tax revenues."], "ans": "A", "expl": "Most nonsovereign government debt is issued by regional (eg, Canadian provinces, US states) or local (eg, Prefecture of Tokyo) governments.\nThese securities are usually categorized as either general obligation bonds or revenue bonds. General obligation debt typically carries a full faith\nand credit pledge.\nDespite being issued in the name of a regional or local government, revenue bonds are secured only by the revenues of the project (eg,\nairports, toll roads or bridges). Most often, the payments to the bondholders are obtained only through the fees or user charges generated by the\nproject. The requirement to pay debt service on revenue bonds extends only to funds generated by the source(s) identified in the bond's\nindenture.\n(Choices B and C) General obligation bonds are usually safer than revenue bonds, as the full faith and credit pledge means the debt service is\nsupported by all sources of revenue received by the issuer (ie, taxing authority).\nThings to remember:\nMost nonsovereign government debt issues are categorized as either general obligation (GO) or revenue bonds. GO debt is backed by the\nissuer's taxing authority. Revenue bonds are usually riskier because they are secured only by the revenues of the project financed by the bond\noffering.\nExplain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAx0AAAEwCAIAAABdVosFAABN4klEQVR42u29T1BbV7bvv0jsTqf9bklJ30pXKilJTmadMpaHN7HKYmialGFmClchRiEwAE2CzQQ0kU1PEANoMkJ0WUUmv4dcrXKGyCXHPUTgcoaxpOo76AzC0X3P1e3ENr/BN6y3vc/RkcQ/A/5+Bi75sM/+f85Ze6211+7Y3t4WQgghhBCyZ95gFxBCCCGEUK4ihBBCCKFcRQghhBBCuYoQQgghhFCuIoQQQgihXEUIIYQQQrmKEEIIIYRyFSGEEEIIoVxFCCGEEEK5ihBCCCGEchUhhBBCCOUqQgghhBBCuYoQQgghhHIVIYQQQgjlKkIIIYQQQrmKEEIIIYRyFSGEEEII5SpCCCGEEMpVhBBCCCGEchUhhBBCCOUqQgghhBDKVYQQQgghlKsIIYQQQgjlKkIIIYQQylWEEEIIIZSrCCGEEEII5SpCCCGEEMpVhBBCCCGUqwghhBBCTjin2AVk12Sz2Wq1it+Dg4MiEolE3GlERJNNTU2x347mUHKYyFHAcRwRCQaDTVOmUin9HQ6HE4nEsX6F8qE7MXRsb2+zF8ju6OrqKhaL+B2Px0VkbW3NnUZENBnn25EdSg4TeYVUKhURGRoawpukFSGjo6NDf8fjcffL53i9QvnQCe2AhBBCCCFEaAck+w5WXfl8XkR6e3vZIceLaDTKTiCvinK5fOHCBTE034QI9VWEEEIIIUJ9FSH7RTKZxIqzFbdTcnSYnZ1lJxB5pb7qhFCuIkQ8nU/n5uZa39sCA+Lc3BxsiLKzqRC7e8bGxiwRLZvNLi8vmwLBnTt3cB2lR6NRlG6ZI4vF4tzcnOwYK8UwOoyNjTUyX2KjHG4sl8uyYzXDLeYWJMiUmsbtRdsoAT4qc3NzKKtSqaDJqM/U1JS1yzKZTGom6IG+vj7cOD09jVvceYpIMBj0ybNR5XEvEuTzedQtkUhcuXJFjD1Zg4ODVm9obqurq7iCnkfdent7MUytmyAzmQwGolKp4C6Ig3fu3PHpdp1g5tBHIhHPCWZWey8j6N/bSKbTeGpqCt1YLBYxIWdnZ1GW9i0qmUqlULrW33rQPLsdxYFEIoFOK5fLWqiOKTK0njj3g4POHxsbs7bglcvldqttPl/mlWKxiC3Gre/yQ/WSyST6PxKJ4CEdHx9v9OZxzwqUiButiWEOvXtK61h7zmdz6qIUn5WM53TS6sXjcdzLtavQDkgIIYQQcsLZJmS3+HiYPn78+PHjx0hjJrNyWFpakmb+1FtbW1tbW3oLVDKtOFyjAtvb22tra63swV5dXbWq13StnEgkzLaYzVldXTUz3NraanRjNBr1aUUwGNTO9Ox2UxcyPT09PT29uzw9h2lraysYDHqujCORiFV0o7nRqDLIoZWZhnY1ao5ZjT1OsMMZQas5Zv0xENZ09ckcs66tbvev7fj4uOaGHvDpvfHxcTP9LqrtM7I6mRthdXKjstyZWI9qoy4yXzvWA+Izpduauma1G5XVqHr8AB1ZKFeR/ZGr8Ia1Pg8+H2x8acw3hX57ZmdnTSW59e62XlKRSGR9fX19fX1ra6u3t9e05c3OzuIW6/r6+rp+BkyhwXwnWm/eRCKRSCS2djDlLf364k+aIW5p9IFfW1vDdbOl+iGxBEErK/c7F+/ZSCSCynjmaX323Hl6DpNlQ9FbrK7zl6uQ+dbWFobYEsh0OBphCjQoFMONgbBkX58Jhjnm7nZzgu3XCPr3tvtbiz6JRqOojHsZoNPMuhdz27Pb8aetrS08INZ44U/4q/Wl19z0FlTv8ePHuMV6oMwFTLvVxjCZ ions should be\nperformed for every debt class.\nSecured creditors (eg, first and second lien) have the most senior claims on a company's cash flows and assets and rank ahead of all unsecured\ncreditors. High-yield issuers with a large proportion of secured debt are considered \"top-heavy.\"\nFor top-heavy issuers, secured debt is often in the form of bank debt with stringent loan covenants, short maturities, and little room to access\nadditional bank lines of credit. In the event of financial distress, such companies have limited ability to refinance or raise additional debt capital,\nleading to a higher risk of default and lower rate of recovery for creditors with a lower priority of claims (eg, senior unsecured debt) (Choices\nA and C).\nThings to remember:\nHigh-yield issuers with a large proportion of secured debt are considered \"top-heavy,\" resulting in a higher risk of default and lower rate of recovery\nfor creditors with a lower priority of claims.\nExplain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues.", "qhtml": null, "explfigs": null}, {"n": 6, "q": "Compared with yield spreads between investment-grade bonds and government bonds, yield spreads between high-yield bonds and governments are most likely:", "opts": ["wider and less volatile.", "wider and more volatile.", "narrower and more volatile."], "ans": "B", "expl": "Corporate bonds trade at higher yields than same-maturity government bonds due to greater credit and liquidity risks. High-yield bonds expose\ninvestors to more of both risks, so their yields must reflect a larger risk premium (ie, wider yield spreads) to governments. Greater uncertainty\nregarding the impact of credit and liquidity risks on high-yield returns results in more volatile yield spreads.\nThe wider and more volatile spreads for high-yield bonds are illustrated in the graph above, which shows that high-yield spreads were always at\nleast double those for investment-grade bonds for the years shown. At times of economic weakness (ie, shaded areas marking recessions), many\nfixed-income investors seek the safety of government bonds. This can cause government yields to fall even as corporate yields rise (eg, 2008–\n2009 in the top diagram in the image). Sometimes, high-yield spreads to governments can widen to more than four times the spread for\ninvestment-grade bonds.\nThings to remember:\nCorporate bonds trade at higher yields than government bonds due to greater credit and liquidity risks. High-yield bonds expose investors to more\nof both risks, so such securities must trade at even wider yield spreads to governments. Greater uncertainty regarding the impact of those risks\nresults in more volatile yield spreads.\nExplain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABBwAAASdCAIAAABsFdgvAAEAAElEQVR42uz9fXycZ5XnCR/ZTuwQG5Ux4CTTsUuTEPeGEJchZGfbBEvDEmYIjaWk2YeQJpJmm08gk15J0J0Hlt6Wqrd7YMKLpGk6dJ6wIyndCXkeIJLyQm/CMionuIcJAZdCwrRN0i6Z7iQGEpdim8ivev74SSeX77uqVHovyd/vxx9/SqX79bqv69Z1rvM751SNj48bAAAAAADATFlBEwAAAAAAAEYFAAAAAABgVAAAAAAAAEYFAAAAAABgVAAAAAAAAGBUAAAAAAAARgUAAAAAAGBUAAAAAAAARgUAAAAAAABGBQAAAAAAYFQAAAAAAABGBQAAAAAAYFQAAAAAAABgVAAAAAAAAEYFAAAAAABgVAAAAAAAAEYFAAAAAAAARgUAAAAAAGBUAAAAAAAARgUAAAAAAGBUAAAAAAAARgUAAAAAAABGBQAAAAAAYFQAAAAAAABGBQAAAAAAYFQAAAAAAABgVAAAAAAAAEYFAAAAAABgVAAAAAAAAEYFAAAAAAAARgUAzJ5cLrd+/fr169dXVVXpQy6Xy+Vy8S0HBgaqArZt25bJZDKZjH/T0dEx48vo6Ojo6OjwQ2UymTJ39F3q6urq6uqW5TOKt/NsmrrMxpzDqy1zx7q6urCDMTan1eYL0D0AAKMCAAAAAABgGqyiCQCgfJLJZEtLi5ml0+l8Pq8PZtbT0xPZsq2tLfyxs7OT1gMAAMCoAAAwM5NYYnBwMJvNmllvb6+ZNTY21tbWhhu4Jqq1tdXMamtrZYQMDQ25fUJjLmn8USYSCVoDAMCQPwEAAAAAABieCgBYSDo7O8Pw3HQ6LU9FPp/v7u62YAG7vb19WkceGBiQD8TM6uvrzSyVStn0A8p1KLlHamtr3ZFSDG05MDDgPhb5UrTjtPwq5R9KW/r96lfJZHJgYEDf65v6+vpi3gDtq+3NrKmpyaYfths+r3hrR2LxU6lUma6JbDbrF6bD6oFOi0hjJpPJGdxjsasSxbpHeONhs/ const CFG = {"title": "Wiley · Credit Analysis for Government Issuers", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 6 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<!--qnote-feature-start-->
<style id="qnote-css">
  main#quiz{max-width:1180px}
  .qrow{display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
  .qrow > .card{flex:1 1 auto;min-width:0;margin:0}
  .qnote{flex:0 0 300px;align-self:stretch;display:flex;flex-direction:column;
    border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{flex:1 1 auto;width:100%;resize:vertical;min-height:96px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
  @media (max-width:860px){
    .qrow{flex-direction:column;gap:10px}
    .qnote{flex-basis:auto;width:100%;align-self:auto}
    .qnote textarea{min-height:52px}
  }
</style>
<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
</body>
</html>
