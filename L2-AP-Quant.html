 growth changes, it could significantly alter the impact of market return on the investment return.<\/p><p><b>A is incorrect<\/b>. Wallace&#x27;s statement about the comparison of returns only being affected by the market return is misleading because it ignores the influence of other variables in the regression model, specifically the GDP growth. The return on investment is dependent on multiple factors, and any change in these factors can alter the outcome. Therefore, stating that a 1% change in market return directly results in a 2.245% increase in investment return without considering the potential variability in GDP growth or other factors oversimplifies the dynamics of the investment&#x27;s return.<\/p><p><b>B is incorrect<\/b>. Wallace&#x27;s reference to the F-statistic is also incorrect. He suggests using the F-statistic to verify if the change in market return significantly affects the investment return. However, the F-statistic in a multiple regression context is generally used to test the joint significance of all regression coefficients in the model, not just a single coefficient. To assess the impact of the market return independently, a t-test should be used to determine if the coefficient for the market return is significantly different from zero, assuming other factors are held constant. Wallace&#x27;s suggestion of using the F-statistic for this purpose indicates a misunderstanding of the appropriate statistical tests used in regression analysis. <\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Evaluating Regression Model Fit and Interpreting Model Results, LOS 2(c) Calculate and interpret a predicted value for the dependent variable, given the estimated regression model and assumed values for the independent variable.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Quality Investment Advisory<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Quality Investment Advisory (QIA) is a U.S. based asset management firm providing financial advice and portfolio management services to private and institutional clients. Rob Wallace works as the chief portfolio manager at QIA’s headquarters in Chicago, USA. Wallace is currently managing a $5 million portfolio of John Mackintosh - one of the firm’s oldest high net worth clients. The portfolio invests a significant portion in the stocks of emerging markets, like those of Russia and Brazil.To estimate the returns to Brazilian stock investments, Wallace used a regression model with the dependent variable measuring the Brazilian stock return and the independent variables measuring (I) the growth in the Brazilian GDP and (II) the return on a Brazilian market index. Exhibit 1 displays the results to estimating this regression.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0009.webp\" style=\"max-width:min(100%,558px)\" alt=\"Exhibit 1 Regression Analysis Results Coefficient Standard Error Intercept 0.0095 0.013 Annual % increase in GDP 0.667 0.337 Annual return to Brazilian market index 2.245 0.245\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0010.webp\" style=\"max-width:min(100%,400px)\" alt=\"ANOVA Regression Sum of Squares 0.9436 Residual Sum of Squares 0.3426 Observations 60\"><p>While talking to Mackintosh about the results of the regression, Wallace made the following comment:<\/p><p>“The interpretation of the slope coefficient of the annual percentage increase in GDP is that for every 1 unit increase in GDP, we would expect your return to increase by 0.667 units. The coefficient value of 0.667 will remain constant even if we remove the second independent variable.”<\/p><p>Mackintosh requested to know exactly how changes in market return would impact the return on his Brazilian investment. Wallace gave the following response:<\/p><p>“Let’s assume the change in market return over a year is 1%. If we compared the return on your investment at the beginning of the year with the return at the end of the year, we would expect an increase of 2.245%. However, to ensure that this holds, we would have to calculate the F-statistic using data from the regression, particularly the sum of squared residuals and the regression sum of squares.”<\/p><p>After he met with Mackintosh, Wallace met with Colin Edwards - a statistician at QIA’s headquarters - with whom he had been managing a multimillion dollar institutional fund. Edwards suggested using a multiple regression model to determine whether (I) an increase in the U.S. literacy rate and (II) an improvement in technology would affect the stocks’ P/E.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to the effect of change in market return on the Brazilian investment return, Wallace is least accurate with respect to:<\/p><\/div>", "subj": "quant"}, {"n": 9, "q": "Sweet is most accurate with respect to:", "opts": ["Statement 1 only.", "Statement 2 only.", "Both statements 1 and 2."], "ans": "A", "expl": "Statement 1 accurately describes the implications of using a log-linear trend model for predicting sales growth. In a log-linear model, the coefficient of the trend variable represents the continuous growth rate, which can be transformed into an annual growth rate by using the exponential function. Specifically, the coefficient of 0.0965 in the model implies an annual growth rate of sales calculated as This calculation is based on the exponential growth formula, where the exponentiation of the trend coefficient minus one gives the percentage growth. This model contrasts with the previous linear trend model, which predicted a constant dollar increase in sales year over year, specifically by $1154.78. The log-linear model instead provides a percentage growth rate, which is more appropriate for long-term forecasts where growth compounding is expected. B is incorrect. Statement 2 misinterprets the output of the log-linear model. The predicted sales for the next year cannot be directly stated as $977.99 million without proper calculation from the model's output. To find the predicted sales, we use the regression equation from the log-linear model: Solving this equation gives the natural logarithm of the predicted sales. To find the sales in actual dollars, we must exponentiate the result: This calculation involves using the exponential function to convert the logarithmic forecast back to a dollar amount, which does not simplistically equate to $977.99 million without performing the necessary exponential calculation. The incorrect statement likely arises from a misunderstanding of how to apply and interpret the coefficients in a log-linear regression model. C is incorrect. Choosing both statements as accurate is incorrect because, as explained. ", "explhtml": "<p>Statement 1 accurately describes the implications of using a log-linear trend model for predicting sales growth. In a log-linear model, the coefficient of the trend variable represents the continuous growth rate, which can be transformed into an annual growth rate by using the exponential function. Specifically, the coefficient of 0.0965 in the model implies an annual growth rate of sales calculated as<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0020.webp\" style=\"max-width:min(100%,171px)\" alt=\"e0.0965 −1 ≈10.13%.\"><p>This calculation is based on the exponential growth formula, where the exponentiation of the trend coefficient minus one gives the percentage growth. This model contrasts with the previous linear trend model, which predicted a constant dollar increase in sales year over year, specifically by $1154.78. The log-linear model instead provides a percentage growth rate, which is more appropriate for long-term forecasts where growth compounding is expected.<\/p><p><b>B is incorrect<\/b>. Statement 2 misinterprets the output of the log-linear model. The predicted sales for the next year cannot be directly stated as $977.99 million without proper calculation from the model&#x27;s output. To find the predicted sales, we use the regression equation from the log-linear model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0021.webp\" style=\"max-width:min(100%,259px)\" alt=\"ln(Sales) = 6.789+ 0.0965 × 21.\"><p>Solving this equation gives the natural logarithm of the predicted sales. To find the sales in actual dollars, we must exponentiate the result:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0022.webp\" style=\"max-width:min(100%,124px)\" alt=\"e6.789+0.0965×21.\"><p>This calculation involves using the exponential function to convert the logarithmic forecast back to a dollar amount, which does not simplistically equate to $977.99 million without performing the necessary exponential calculation. The incorrect statement likely arises from a misunderstanding of how to apply and interpret the coefficients in a log-linear regression model.<\/p><p><b>C is incorrect<\/b>. Choosing both statements as accurate is incorrect because, as explained. <\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(a): calculate and evaluate the predicted trend value for a time series, modeled as either a linear trend or a log-linear trend, given the estimated trend coefficients<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Jack Blessing<\/summary><div class=\"vig-body\"><p>Jack Blessing, a portfolio manager, follows stocks in the telecommunication industry. Currently, Blessing is researching TeleBrand Enterprises (TBE), a leading competitor in the industry. Initially, Blessing estimated a linear trend model, with a trend coefficient of 1154.78, to fit the data on annual sales of TBE, but found out that the regression errors were correlated across observations. He, therefore, rejected the model and estimated a linear trend in lognormal TeleBrand sales. Exhibit 1 displays some information related to the current regression. Blessing used the most recent 20-year data to estimate the regression coefficients.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0015.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 1 Regression Statistics R-squared 0.9588 Standard error 0.1563 Observations 20\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0016.webp\" style=\"max-width:min(100%,430px)\" alt=\"Coefficient Standard error Intercept 6.789 0.02745 Trend 0.0965 0.01301\"><p>Blessing invited Shane Sweet, his colleague, to discuss the output of his analysis. Sweet made the following comments:<\/p><p>Statement 1: &quot;Based on your current model, the sales of TeleBrand Enterprises are expected to grow at a constant rate of 10.13% per year. In contrast, the previous model predicted that sales would increase by $1154.78 from one year to the next.&quot;<\/p><p>Statement 2: &quot;Using the current model, the predicted sales for next year are approximately $977.99 million.&quot;<\/p><p>Blessing has short-listed another company -- CareLink Ltd -- for inclusion in his portfolio. Blessing plans to use a time-series model to predict CareLink&#x27;s profit margin for future periods. He believes that the current period&#x27;s profit margin is significantly related to the most recent profit margin. To test this, Blessing uses figures for the quarterly profit margin from the second quarter of 2005 through the fourth quarter of 2019. He estimated the intercept and coefficient to be 0.0934 and 0.7986, respectively and concluded that the two were statistically significant. However, Sweet told Blessing to test the residual autocorrelations to determine whether the model is correctly specified. She made the following comment:<\/p><p>Statement 3: “In a regression such as this one, serial correlation in the error term is much more critical in its consequences than for cross-sectional models since it causes estimates of the intercept and slope coefficient to be inconsistent. Also, if CareLink&#x27;s profit margin has always been more volatile in certain periods than in others, likely, the profit margin is not covariance stationary.&quot;<\/p><p>Following Sweet’s advice, Blessing calculated the following autocorrelations:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0017.webp\" style=\"max-width:min(100%,199px)\" alt=\"Exhibit 2 Lag Autocorrelations 1 0.0986 2 0.0438 3 -0.1743 4 -0.2319\"><p>Blessing uses his estimated regression equation to predict CareLink’s profit margin in six months. The current profit margin is 35%.<\/p><p>Sweet manages the fixed income allocation of an institutional fund. Since bond returns largely depend on current and future inflation rates, Sweet is building a time-series model for U.S. inflation, using monthly observations. She has estimated two models, an AR (1) and an AR (2) model. Exhibit 3 presents a contrast between the regression statistics of the two models.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0018.webp\" style=\"max-width:min(100%,89px)\" alt=\"Exhibit 3\"><p><b>Regression statistics AR(1) AR(2)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0019.webp\" style=\"max-width:min(100%,307px)\" alt=\"R-squared 0.586 0.657 Standard error 3.129 3.325 Observations 249 248\"><p>Average squared error 15.963 15.158<\/p><p>Sweet is assessing the predictive capabilities of the models to determine their real-world contribution.<\/p><\/div><\/details><div class=\"qtext\"><p>Sweet is most accurate with respect to:<\/p><\/div>", "subj": "quant"}, {"n": 10, "q": "Is Sweet most likely correct with respect to statement 3, and is the time-series model for estimating CareLink’s profit margin correctly specified?", "opts": ["Yes.", "Statement 3 is correct, but the model is misspecified.", "Statement 3 is incorrect, but the model is correctly specified."], "ans": "A", "expl": "Shane Sweet's statement about the importance of serial correlation in the error term for time-series models is accurate. In autoregressive models, such as the one used by Jack Blessing for CareLink's profit margins, the presence of serial correlation can lead to inconsistent estimates of the model parameters (intercept and slope). This inconsistency arises because the error terms are not independent from one period to another, violating one of the key assumptions of classical linear regression models. Furthermore, Sweet's comment about the potential non-stationarity of the profit margin series is crucial. If the profit margin exhibits volatility that varies over time, it suggests that the series may not have a constant mean and variance, a condition known as covariance stationarity. This lack of stationarity can further complicate the model's ability to provide reliable forecasts. B is incorrect. While statement 3 is indeed correct, the conclusion that the model is misspecified is not supported by the data. The autocorrelation values calculated by Blessing, as shown in Exhibit 2, are used to test for serial correlation in the residuals of the model. These autocorrelations are 0.0986, 0.0438, -0.1743, and -0.2319 for lags 1 through 4, respectively. To determine if these autocorrelations are significantly different from zero, we calculate the t-statistics using the formula where the standard error is given by The resulting t-statistics are 0.7574, 0.3364, -1.3388, and -1.7813 for lags 1 through 4. None of these t-statistics exceed the critical value of approximately 2.0 at a 0.05 level of significance, indicating that there is no significant serial correlation. C is incorrect. This option incorrectly states that statement 3 is incorrect. As explained, statement 3 is correct in highlighting the critical consequences of serial correlation in time-series models and the potential issues with non-stationarity in the data series. ", "explhtml": "<p>Shane Sweet&#x27;s statement about the importance of serial correlation in the error term for time-series models is accurate. In autoregressive models, such as the one used by Jack Blessing for CareLink&#x27;s profit margins, the presence of serial correlation can lead to inconsistent estimates of the model parameters (intercept and slope). This inconsistency arises because the error terms are not independent from one period to another, violating one of the key assumptions of classical linear regression models. Furthermore, Sweet&#x27;s comment about the potential non-stationarity of the profit margin series is crucial. If the profit margin exhibits volatility that varies over time, it suggests that the series may not have a constant mean and variance, a condition known as covariance stationarity. This lack of stationarity can further complicate the model&#x27;s ability to provide reliable forecasts.<\/p><p><b>B is incorrect<\/b>. While statement 3 is indeed correct, the conclusion that the model is misspecified is not supported by the data. The autocorrelation values calculated by Blessing, as shown in Exhibit 2, are used to test for serial correlation in the residuals of the model. These autocorrelations are 0.0986, 0.0438, -0.1743, and -0.2319 for lags 1 through 4, respectively. To determine if these autocorrelations are significantly different from zero, we calculate the t-statistics using the formula<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0023.webp\" style=\"max-width:min(100%,160px)\" alt=\"autocorrelation t = standard error\"><p>where the standard error is given by<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0024.webp\" style=\"max-width:min(100%,307px)\" alt=\"1 1 standard error = = = 0.1302. √T √59\"><p>The resulting t-statistics are 0.7574, 0.3364, -1.3388, and -1.7813 for lags 1 through 4. None of these t-statistics exceed the critical value of approximately 2.0 at a 0.05 level of significance, indicating that there is no significant serial correlation.<\/p><p><b>C is incorrect<\/b>. This option incorrectly states that statement 3 is incorrect. As explained, statement 3 is correct in highlighting the critical consequences of serial correlation in time-series models and the potential issues with non-stationarity in the data series. <\/p><p class=\"los\">Quantitative Methods, Reading 3: Time-Series Analysis, LOS 3(c): explain the requirement for a time series to be covariance stationary and describe the significance of a series that is not stationary Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(e): explain how autocorrelations of the residuals can be used to test whether the autoregressive model fits the time series<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Jack Blessing<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jack Blessing, a portfolio manager, follows stocks in the telecommunication industry. Currently, Blessing is researching TeleBrand Enterprises (TBE), a leading competitor in the industry. Initially, Blessing estimated a linear trend model, with a trend coefficient of 1154.78, to fit the data on annual sales of TBE, but found out that the regression errors were correlated across observations. He, therefore, rejected the model and estimated a linear trend in lognormal TeleBrand sales. Exhibit 1 displays some information related to the current regression. Blessing used the most recent 20-year data to estimate the regression coefficients.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0015.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 1 Regression Statistics R-squared 0.9588 Standard error 0.1563 Observations 20\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0016.webp\" style=\"max-width:min(100%,430px)\" alt=\"Coefficient Standard error Intercept 6.789 0.02745 Trend 0.0965 0.01301\"><p>Blessing invited Shane Sweet, his colleague, to discuss the output of his analysis. Sweet made the following comments:<\/p><p>Statement 1: &quot;Based on your current model, the sales of TeleBrand Enterprises are expected to grow at a constant rate of 10.13% per year. In contrast, the previous model predicted that sales would increase by $1154.78 from one year to the next.&quot;<\/p><p>Statement 2: &quot;Using the current model, the predicted sales for next year are approximately $977.99 million.&quot;<\/p><p>Blessing has short-listed another company -- CareLink Ltd -- for inclusion in his portfolio. Blessing plans to use a time-series model to predict CareLink&#x27;s profit margin for future periods. He believes that the current period&#x27;s profit margin is significantly related to the most recent profit margin. To test this, Blessing uses figures for the quarterly profit margin from the second quarter of 2005 through the fourth quarter of 2019. He estimated the intercept and coefficient to be 0.0934 and 0.7986, respectively and concluded that the two were statistically significant. However, Sweet told Blessing to test the residual autocorrelations to determine whether the model is correctly specified. She made the following comment:<\/p><p>Statement 3: “In a regression such as this one, serial correlation in the error term is much more critical in its consequences than for cross-sectional models since it causes estimates of the intercept and slope coefficient to be inconsistent. Also, if CareLink&#x27;s profit margin has always been more volatile in certain periods than in others, likely, the profit margin is not covariance stationary.&quot;<\/p><p>Following Sweet’s advice, Blessing calculated the following autocorrelations:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0017.webp\" style=\"max-width:min(100%,199px)\" alt=\"Exhibit 2 Lag Autocorrelations 1 0.0986 2 0.0438 3 -0.1743 4 -0.2319\"><p>Blessing uses his estimated regression equation to predict CareLink’s profit margin in six months. The current profit margin is 35%.<\/p><p>Sweet manages the fixed income allocation of an institutional fund. Since bond returns largely depend on current and future inflation rates, Sweet is building a time-series model for U.S. inflation, using monthly observations. She has estimated two models, an AR (1) and an AR (2) model. Exhibit 3 presents a contrast between the regression statistics of the two models.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0018.webp\" style=\"max-width:min(100%,89px)\" alt=\"Exhibit 3\"><p><b>Regression statistics AR(1) AR(2)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0019.webp\" style=\"max-width:min(100%,307px)\" alt=\"R-squared 0.586 0.657 Standard error 3.129 3.325 Observations 249 248\"><p>Average squared error 15.963 15.158<\/p><p>Sweet is assessing the predictive capabilities of the models to determine their real-world contribution.<\/p><\/div><\/details><div class=\"qtext\"><p>Is Sweet most likely correct with respect to statement 3, and is the time-series model for estimating CareLink’s profit margin correctly specified?<\/p><\/div>", "subj": "quant"}, {"n": 11, "q": "Which of the following about the regression estimating CareLink’s profit margin is most accurate?", "opts": ["If the current profit margin is 44.62%, the regression estimates that the profit margin will fall in the next period.", "If the current profit margin is 48.33%, the regression estimates that the profit margin will rise in the next period.", "If the current profit margin is 43.09%, the regression estimates that the profit margin will rise in the next period."], "ans": "C", "expl": "Option C aligns with the mean-reverting level calculated from the regression equation. The regression equation provided by Blessing for CareLink's profit margin is given by the intercept (0.0934) and the coefficient (0.7986). The mean-reverting level, which is the equilibrium point where the profit margin tends to stabilize, can be calculated using the formula This calculation indicates that if the current profit margin is below 46.37%, the model predicts an increase in the profit margin in the next period. Since option C states that the current profit margin is 43.09%, which is below the mean-reverting level, the model would predict a rise in the profit margin. A is incorrect. It suggests that if the current profit margin is 44.62%, the profit margin will fall in the next period. However, since 44.62% is below the mean-reverting level of 46.37%, according to the regression model, the profit margin is expected to rise, not fall. This misunderstanding of the mean-reverting level's implications leads to the incorrect conclusion in option A. B is incorrect. It posits that if the current profit margin is 48.33%, the profit margin will rise in the next period. This is incorrect because 48.33% is above the mean-reverting level of 46.37%. According to the regression model's dynamics, when the profit margin is above the mean-reverting level, it is expected to decrease towards this level in subsequent periods, not increase. Therefore, the prediction in option B contradicts the model's implications. ", "explhtml": "<p>Option C aligns with the mean-reverting level calculated from the regression equation. The regression equation provided by Blessing for CareLink&#x27;s profit margin is given by the intercept (0.0934) and the coefficient (0.7986). The mean-reverting level, which is the equilibrium point where the profit margin tends to stabilize, can be calculated using the formula<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0025.webp\" style=\"max-width:min(100%,493px)\" alt=\"B0 0.0934 Mean-reverting level = 1 −B1 = 1 −0.7986 = 0.4637 = 46.37%.\"><p>This calculation indicates that if the current profit margin is below 46.37%, the model predicts an increase in the profit margin in the next period. Since option C states that the current profit margin is 43.09%, which is below the mean-reverting level, the model would predict a rise in the profit margin.<\/p><p><b>A is incorrect<\/b>. It suggests that if the current profit margin is 44.62%, the profit margin will fall in the next period. However, since 44.62% is below the mean-reverting level of 46.37%, according to the regression model, the profit margin is expected to rise, not fall. This misunderstanding of the mean-reverting level&#x27;s implications leads to the incorrect conclusion in option A.<\/p><p><b>B is incorrect<\/b>. It posits that if the current profit margin is 48.33%, the profit margin will rise in the next period. This is incorrect because 48.33% is above the mean-reverting level of 46.37%. According to the regression model&#x27;s dynamics, when the profit margin is above the mean-reverting level, it is expected to decrease towards this level in subsequent periods, not increase. Therefore, the prediction in option B contradicts the model&#x27;s implications. <\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(f): explain mean reversion and calculate a mean-reverting level<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Jack Blessing<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jack Blessing, a portfolio manager, follows stocks in the telecommunication industry. Currently, Blessing is researching TeleBrand Enterprises (TBE), a leading competitor in the industry. Initially, Blessing estimated a linear trend model, with a trend coefficient of 1154.78, to fit the data on annual sales of TBE, but found out that the regression errors were correlated across observations. He, therefore, rejected the model and estimated a linear trend in lognormal TeleBrand sales. Exhibit 1 displays some information related to the current regression. Blessing used the most recent 20-year data to estimate the regression coefficients.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0015.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 1 Regression Statistics R-squared 0.9588 Standard error 0.1563 Observations 20\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0016.webp\" style=\"max-width:min(100%,430px)\" alt=\"Coefficient Standard error Intercept 6.789 0.02745 Trend 0.0965 0.01301\"><p>Blessing invited Shane Sweet, his colleague, to discuss the output of his analysis. Sweet made the following comments:<\/p><p>Statement 1: &quot;Based on your current model, the sales of TeleBrand Enterprises are expected to grow at a constant rate of 10.13% per year. In contrast, the previous model predicted that sales would increase by $1154.78 from one year to the next.&quot;<\/p><p>Statement 2: &quot;Using the current model, the predicted sales for next year are approximately $977.99 million.&quot;<\/p><p>Blessing has short-listed another company -- CareLink Ltd -- for inclusion in his portfolio. Blessing plans to use a time-series model to predict CareLink&#x27;s profit margin for future periods. He believes that the current period&#x27;s profit margin is significantly related to the most recent profit margin. To test this, Blessing uses figures for the quarterly profit margin from the second quarter of 2005 through the fourth quarter of 2019. He estimated the intercept and coefficient to be 0.0934 and 0.7986, respectively and concluded that the two were statistically significant. However, Sweet told Blessing to test the residual autocorrelations to determine whether the model is correctly specified. She made the following comment:<\/p><p>Statement 3: “In a regression such as this one, serial correlation in the error term is much more critical in its consequences than for cross-sectional models since it causes estimates of the intercept and slope coefficient to be inconsistent. Also, if CareLink&#x27;s profit margin has always been more volatile in certain periods than in others, likely, the profit margin is not covariance stationary.&quot;<\/p><p>Following Sweet’s advice, Blessing calculated the following autocorrelations:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0017.webp\" style=\"max-width:min(100%,199px)\" alt=\"Exhibit 2 Lag Autocorrelations 1 0.0986 2 0.0438 3 -0.1743 4 -0.2319\"><p>Blessing uses his estimated regression equation to predict CareLink’s profit margin in six months. The current profit margin is 35%.<\/p><p>Sweet manages the fixed income allocation of an institutional fund. Since bond returns largely depend on current and future inflation rates, Sweet is building a time-series model for U.S. inflation, using monthly observations. She has estimated two models, an AR (1) and an AR (2) model. Exhibit 3 presents a contrast between the regression statistics of the two models.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0018.webp\" style=\"max-width:min(100%,89px)\" alt=\"Exhibit 3\"><p><b>Regression statistics AR(1) AR(2)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0019.webp\" style=\"max-width:min(100%,307px)\" alt=\"R-squared 0.586 0.657 Standard error 3.129 3.325 Observations 249 248\"><p>Average squared error 15.963 15.158<\/p><p>Sweet is assessing the predictive capabilities of the models to determine their real-world contribution.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following about the regression estimating CareLink’s profit margin is most accurate?<\/p><\/div>", "subj": "quant"}, {"n": 12, "q": "The estimated profit margin of CareLink Ltd in two quarters (six months) is closest to:", "opts": ["37.29%.", "39.12%.", "40.58%."], "ans": "B", "expl": "Option B predicts that the estimated profit margin of CareLink Ltd in two quarters (six months) is closest to 39.12%. To understand this, we start with the current profit margin of 35%. Using the regression equation provided, the profit margin for the next quarter (M1) can be calculated as follows: This result represents the estimated profit margin at the end of the first quarter. To find the profit margin for the second quarter (M2), we use the profit margin from the first quarter as the input for the regression equation: This step-by-step calculation clearly shows how the profit margin is expected to evolve over the two quarters, leading to an estimated profit margin of 39.12% at the end of the second quarter. A is incorrect. It suggests that the profit margin after two quarters would be 37.29%. This calculation appears to be a misunderstanding, as it only accounts for the profit margin after the first quarter, not taking into consideration the compounding effect of the regression model applied to the subsequent quarter. The correct approach, as shown, requires using the output of the first quarter as a new input to the regression model to calculate the second quarter's profit margin. C is incorrect. It estimates the profit margin to be 40.58%, which is not supported by the calculations based on the regression model provided. The error in this option likely stems from an incorrect application or misunderstanding of the model's coefficients or the compounding nature of applying the model sequentially across multiple periods. The detailed calculations clearly show that the correct estimate for the second quarter's profit margin is 39.12%, not 40.58%. ", "explhtml": "<p>Option B predicts that the estimated profit margin of CareLink Ltd in two quarters (six months) is closest to 39.12%. To understand this, we start with the current profit margin of 35%. Using the regression equation provided, the profit margin for the next quarter (M1) can be calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0026.webp\" style=\"max-width:min(100%,394px)\" alt=\"M1 = 0.0934 + 0.7986 × 0.35 = 0.3729 or 37.29%\"><p>This result represents the estimated profit margin at the end of the first quarter. To find the profit margin for the second quarter (M2), we use the profit margin from the first quarter as the input for the regression equation:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0027.webp\" style=\"max-width:min(100%,412px)\" alt=\"M2 = 0.0934 + 0.7986 × 0.3729 = 0.3912 or 39.12%\"><p>This step-by-step calculation clearly shows how the profit margin is expected to evolve over the two quarters, leading to an estimated profit margin of 39.12% at the end of the second quarter.<\/p><p><b>A is incorrect<\/b>. It suggests that the profit margin after two quarters would be 37.29%. This calculation appears to be a misunderstanding, as it only accounts for the profit margin after the first quarter, not taking into consideration the compounding effect of the regression model applied to the subsequent quarter. The correct approach, as shown, requires using the output of the first quarter as a new input to the regression model to calculate the second quarter&#x27;s profit margin.<\/p><p><b>C is incorrect<\/b>. It estimates the profit margin to be 40.58%, which is not supported by the calculations based on the regression model provided. The error in this option likely stems from an incorrect application or misunderstanding of the model&#x27;s coefficients or the compounding nature of applying the model sequentially across multiple periods. The detailed calculations clearly show that the correct estimate for the second quarter&#x27;s profit margin is 39.12%, not 40.58%. <\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(a): calculate and evaluate the predicted trend value for a time series, modeled as either a linear trend or a log-linear trend, given the estimated trend coefficients<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Jack Blessing<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jack Blessing, a portfolio manager, follows stocks in the telecommunication industry. Currently, Blessing is researching TeleBrand Enterprises (TBE), a leading competitor in the industry. Initially, Blessing estimated a linear trend model, with a trend coefficient of 1154.78, to fit the data on annual sales of TBE, but found out that the regression errors were correlated across observations. He, therefore, rejected the model and estimated a linear trend in lognormal TeleBrand sales. Exhibit 1 displays some information related to the current regression. Blessing used the most recent 20-year data to estimate the regression coefficients.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0015.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 1 Regression Statistics R-squared 0.9588 Standard error 0.1563 Observations 20\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0016.webp\" style=\"max-width:min(100%,430px)\" alt=\"Coefficient Standard error Intercept 6.789 0.02745 Trend 0.0965 0.01301\"><p>Blessing invited Shane Sweet, his colleague, to discuss the output of his analysis. Sweet made the following comments:<\/p><p>Statement 1: &quot;Based on your current model, the sales of TeleBrand Enterprises are expected to grow at a constant rate of 10.13% per year. In contrast, the previous model predicted that sales would increase by $1154.78 from one year to the next.&quot;<\/p><p>Statement 2: &quot;Using the current model, the predicted sales for next year are approximately $977.99 million.&quot;<\/p><p>Blessing has short-listed another company -- CareLink Ltd -- for inclusion in his portfolio. Blessing plans to use a time-series model to predict CareLink&#x27;s profit margin for future periods. He believes that the current period&#x27;s profit margin is significantly related to the most recent profit margin. To test this, Blessing uses figures for the quarterly profit margin from the second quarter of 2005 through the fourth quarter of 2019. He estimated the intercept and coefficient to be 0.0934 and 0.7986, respectively and concluded that the two were statistically significant. However, Sweet told Blessing to test the residual autocorrelations to determine whether the model is correctly specified. She made the following comment:<\/p><p>Statement 3: “In a regression such as this one, serial correlation in the error term is much more critical in its consequences than for cross-sectional models since it causes estimates of the intercept and slope coefficient to be inconsistent. Also, if CareLink&#x27;s profit margin has always been more volatile in certain periods than in others, likely, the profit margin is not covariance stationary.&quot;<\/p><p>Following Sweet’s advice, Blessing calculated the following autocorrelations:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0017.webp\" style=\"max-width:min(100%,199px)\" alt=\"Exhibit 2 Lag Autocorrelations 1 0.0986 2 0.0438 3 -0.1743 4 -0.2319\"><p>Blessing uses his estimated regression equation to predict CareLink’s profit margin in six months. The current profit margin is 35%.<\/p><p>Sweet manages the fixed income allocation of an institutional fund. Since bond returns largely depend on current and future inflation rates, Sweet is building a time-series model for U.S. inflation, using monthly observations. She has estimated two models, an AR (1) and an AR (2) model. Exhibit 3 presents a contrast between the regression statistics of the two models.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0018.webp\" style=\"max-width:min(100%,89px)\" alt=\"Exhibit 3\"><p><b>Regression statistics AR(1) AR(2)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0019.webp\" style=\"max-width:min(100%,307px)\" alt=\"R-squared 0.586 0.657 Standard error 3.129 3.325 Observations 249 248\"><p>Average squared error 15.963 15.158<\/p><p>Sweet is assessing the predictive capabilities of the models to determine their real-world contribution.<\/p><\/div><\/details><div class=\"qtext\"><p>The estimated profit margin of CareLink Ltd in two quarters (six months) is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 13, "q": "In Richard's first project on fuel efficiency, the standard error of the estimate in the regression is closest to:", "opts": ["1.3177", "1.5247", "1.736"], "ans": "A", "expl": "The correct answer is option A, which calculates the standard error of the estimate for the regression model used in Lily Richards' first project on fuel efficiency. The standard error of the estimate measures the typical distance that the observed values fall from the regression line. It is calculated using the formula for the root mean square error (RMSE), which is the square root of the mean of the squared residuals. In mathematical terms, the formula is expressed as: where n is the number of observations and k is the number of parameters estimated (including the intercept). In this case, the unexplained variation, which is equivalent to the sum of squared residuals (SSR), is 100.70, the number of observations n is 60, and k is 2 (including the intercept and one slope coefficient). Plugging these values into the formula gives: This calculation confirms that option A is correct as it closely matches the computed value. B is incorrect. Option B suggests a standard error of 1.5247, which does not match the calculated value. The discrepancy arises because this value likely assumes incorrect inputs for either the number of observations, the number of parameters, or the sum of squared residuals. Ensuring accurate inputs is crucial as they directly affect the calculation of the standard error, which is a key measure of the model's accuracy in predicting the dependent variable. C is incorrect. Option C proposes a standard error of 1.736, which is also incorrect. This value is even further from the calculated standard error of 1.3177. The error in this option could stem from an even greater misestimation of the inputs used in the formula. It is essential to use precise data for the sum of squared residuals, the number of observations, and the number of estimated parameters to accurately compute the standard error, reflecting the model's predictive performance.", "explhtml": "<p>The correct answer is option A, which calculates the standard error of the estimate for the regression model used in Lily Richards&#x27; first project on fuel efficiency. The standard error of the estimate measures the typical distance that the observed values fall from the regression line. It is calculated using the formula for the root mean square error (RMSE), which is the square root of the mean of the squared residuals. In mathematical terms, the formula is expressed as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0035.webp\" style=\"max-width:min(100%,500px)\" alt=\"Sum of Squared Residuals (SSR) Standard Error of Estimate = √ n −k\"><p>where n is the number of observations and k is the number of parameters estimated (including the intercept). In this case, the unexplained variation, which is equivalent to the sum of squared residuals (SSR), is 100.70, the number of observations n is 60, and k is 2 (including the intercept and one slope coefficient). Plugging these values into the formula gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0036.webp\" style=\"max-width:min(100%,373px)\" alt=\"100.70 Standard Error of Estimate = √ 60 −2 = 1.3177\"><p>This calculation confirms that option A is correct as it closely matches the computed value.<\/p><p><b>B is incorrect<\/b>. Option B suggests a standard error of 1.5247, which does not match the calculated value. The discrepancy arises because this value likely assumes incorrect inputs for either the number of observations, the number of parameters, or the sum of squared residuals. Ensuring accurate inputs is crucial as they directly affect the calculation of the standard error, which is a key measure of the model&#x27;s accuracy in predicting the dependent variable.<\/p><p><b>C is incorrect<\/b>. Option C proposes a standard error of 1.736, which is also incorrect. This value is even further from the calculated standard error of 1.3177. The error in this option could stem from an even greater misestimation of the inputs used in the formula. It is essential to use precise data for the sum of squared residuals, the number of observations, and the number of estimated parameters to accurately compute the standard error, reflecting the model&#x27;s predictive performance.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0037.webp\" style=\"max-width:min(100%,553px)\" alt=\"1 ⎡ n (Yi −^ b 0 −^ b 1Xi) 2 ⎤ 2 unexplained variation 1 2 100.70 0.5 ⎢⎢⎢ ⎣ ∑ i=1 n −2 ⎥⎥⎥ ⎦ = ( n −2 ) = ( 60 −2 ) = 1.3177\"><p class=\"los\">Quantitative Methods, Learning Module 1: Basics of Multiple Regression and Underlying Assumptions, LOS 1 (b): formulate a multiple linear regression model, describe the relation between the dependent variable and several independent variables, and interpret estimated regression coefficients.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Lily Richards<\/summary><div class=\"vig-body\"><p>Lily Richards, CFA, is a quantitative analyst at Gateway Constructors (GC). GC specializes in the construction of national highways.<\/p><p>In recent times, Richards has been involved in two specific projects. As part of her first project, she has been looking at ways to increase efficiency in the construction process, especially regarding fuel consumption. She ran a regression explaining the variation in fuel consumption as a function of distance. The total variation of the dependent variable was 160.85, the explained variation was 80.15, and the unexplained variation was 100.70. She had 60 monthly observations. <\/p><p>In the other project, she has been asked to look into a contract agreement CG has with a third party valuation firm. The contract is near expiration and GC is contemplating the development of its project price-forecasting model. It has tasked Richards with building the model.<\/p><p>To develop the model, Richards intends to use linear regression. Each project is expected to be priced by multiplying a margin percentage by net construction costs and adding a base price; the base price is the minimum project price. The regression model will be based on several projects&#x27; prices from 2005 to 2010. She justifies her data selection technique with the following statement:<\/p><p>Statement 1: “Industry conditions were significantly different during the pre-2005 era.”<\/p><p>Her regression model is as follows: Forecasted project price = Base Price + Margin(Construction costs)<\/p><p>Two years after her model&#x27;s implementation, Richards conducts various tests. She gathers the following data for analysis (Exhibits 1 and 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0028.webp\" style=\"max-width:min(100%,440px)\" alt=\"Exhibit 1 Regression Data and Analysis of Variance (ANOVA)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0029.webp\" style=\"max-width:min(100%,308px)\" alt=\"Multiple R 0.8821 R-squared 0.7651 Standard Error of Estimate 0.6346 Observations 60\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0030.webp\" style=\"max-width:min(100%,494px)\" alt=\"Coefficients Standard Error Base Price 950 8.535 Margin 0.10 0.429\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0031.webp\" style=\"max-width:min(100%,76px)\" alt=\"ANOVA\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0032.webp\" style=\"max-width:min(100%,515px)\" alt=\"df Sum of Squares (SS) Regression 1 0.1856 Residual 58 0.0268 Total 59 0.2124\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0033.webp\" style=\"max-width:min(100%,175px)\" alt=\"Exhibit 2 Significance Levels \"><p>df p= 0.10 p= 0.05 p= 0.025<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0034.webp\" style=\"max-width:min(100%,251px)\" alt=\"2 1.886 2.920 4.303 60 1.296 1.671 2.000 70 1.294 1.667 1.994\"><p>To uncover potential assumption violations and to better understand the data outliers, Richards intends to plot her results in a scatter plot. She discusses the scatter plot results with fellow manager Earl Matthews upon completing them. <\/p><p>The two employees arrive at the following conclusions concerning the regression analysis. Conclusion 1: Upon visual inspection, it appears that there is no directional relationship between the residuals and the predicted values from the regression model since the line is centered near 0.00. It is a good outcome since residuals are expected to behave independently of the model, suggesting that regression errors are uncorrelated and have a constant variance. Hence, multiple linear regression meets several of its underlying assumptions. <\/p><p>Conclusion 2: Three residuals appear to be outliers in the scatter plot. Thus, these data cannot be used to determine whether shocks from factors not included in the model occurred at these points.<\/p><\/div><\/details><div class=\"qtext\"><p>In Richard&#x27;s first project on fuel efficiency, the standard error of the estimate in the regression is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 14, "q": "Based on Exhibit 1. The F-test statistic is closest to:", "opts": ["114.44.", "401.73.", "885.00."], "ans": "B", "expl": "The F-test statistic is calculated to determine if there is a statistically significant relationship between the dependent variable and the independent variables in a regression model. The formula for the F-test statistic is the ratio of the mean regression sum of squares (MSSR) to the mean squared errors (MSE). In this case, the MSSR is derived from the regression sum of squares divided by its degrees of freedom, which is 1 (since there is only one independent variable in the model). The regression sum of squares is given as 0.1856, so the MSSR is The MSE is calculated by dividing the residual sum of squares by its degrees of freedom. The residual degrees of freedom are the total number of observations minus the number of parameters estimated (including the intercept), which is The residual sum of squares is 0.0268, so the MSE is Thus, the F-test statistic is calculated as This calculation shows that option B is the correct answer as it closely matches the computed value of the F-test statistic. A is incorrect. The value 114.44 significantly underestimates the F-test statistic. This discrepancy arises because the calculation for option A likely involves an error in either the degrees of freedom used or a misunderstanding of the sums of squares. The correct calculation involves accurately dividing the regression sum of squares by its degrees of freedom and the residual sum of squares by its correct degrees of freedom, leading to a much higher F-test statistic than what is suggested by option A. C is incorrect. The value 885.00 is an overestimation of the F-test statistic. This error could stem from an incorrect division of the regression sum of squares or an incorrect calculation of the mean squared errors, possibly using fewer degrees of freedom than available. The precise calculation, as shown, yields a value much closer to 401.73, indicating that any significantly higher value like 885.00 likely results from computational errors in handling the degrees of freedom or the sums of squares. ", "explhtml": "<p>The F-test statistic is calculated to determine if there is a statistically significant relationship between the dependent variable and the independent variables in a regression model. The formula for the F-test statistic is the ratio of the mean regression sum of squares (MSSR) to the mean squared errors (MSE). In this case, the MSSR is derived from the regression sum of squares divided by its degrees of freedom, which is 1 (since there is only one independent variable in the model). The regression sum of squares is given as 0.1856, so the MSSR is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0038.webp\" style=\"max-width:min(100%,139px)\" alt=\"0.1856 = 0.1856. 1\"><p>The MSE is calculated by dividing the residual sum of squares by its degrees of freedom. The residual degrees of freedom are the total number of observations minus the number of parameters estimated (including the intercept), which is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0039.webp\" style=\"max-width:min(100%,133px)\" alt=\"60−1 −1 = 58.\"><p>The residual sum of squares is 0.0268, so the MSE is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0040.webp\" style=\"max-width:min(100%,157px)\" alt=\"0.0268 = 0.000462. 58\"><p>Thus, the F-test statistic is calculated as<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0041.webp\" style=\"max-width:min(100%,153px)\" alt=\"0.1856 ≈401.73. 0.000462\"><p>This calculation shows that option B is the correct answer as it closely matches the computed value of the F-test statistic.<\/p><p><b>A is incorrect<\/b>. The value 114.44 significantly underestimates the F-test statistic. This discrepancy arises because the calculation for option A likely involves an error in either the degrees of freedom used or a misunderstanding of the sums of squares. The correct calculation involves accurately dividing the regression sum of squares by its degrees of freedom and the residual sum of squares by its correct degrees of freedom, leading to a much higher F-test statistic than what is suggested by option A.<\/p><p><b>C is incorrect<\/b>. The value 885.00 is an overestimation of the F-test statistic. This error could stem from an incorrect division of the regression sum of squares or an incorrect calculation of the mean squared errors, possibly using fewer degrees of freedom than available. The precise calculation, as shown, yields a value much closer to 401.73, indicating that any significantly higher value like 885.00 likely results from computational errors in handling the degrees of freedom or the sums of squares. <\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Evaluating Regression Model Fit and Interpreting Model Results, LOS 2(e): evaluate how well a multiple regression model explains the dependent variable by analyzing ANOVA table results and measures of goodness of fit.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Lily Richards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lily Richards, CFA, is a quantitative analyst at Gateway Constructors (GC). GC specializes in the construction of national highways.<\/p><p>In recent times, Richards has been involved in two specific projects. As part of her first project, she has been looking at ways to increase efficiency in the construction process, especially regarding fuel consumption. She ran a regression explaining the variation in fuel consumption as a function of distance. The total variation of the dependent variable was 160.85, the explained variation was 80.15, and the unexplained variation was 100.70. She had 60 monthly observations. <\/p><p>In the other project, she has been asked to look into a contract agreement CG has with a third party valuation firm. The contract is near expiration and GC is contemplating the development of its project price-forecasting model. It has tasked Richards with building the model.<\/p><p>To develop the model, Richards intends to use linear regression. Each project is expected to be priced by multiplying a margin percentage by net construction costs and adding a base price; the base price is the minimum project price. The regression model will be based on several projects&#x27; prices from 2005 to 2010. She justifies her data selection technique with the following statement:<\/p><p>Statement 1: “Industry conditions were significantly different during the pre-2005 era.”<\/p><p>Her regression model is as follows: Forecasted project price = Base Price + Margin(Construction costs)<\/p><p>Two years after her model&#x27;s implementation, Richards conducts various tests. She gathers the following data for analysis (Exhibits 1 and 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0028.webp\" style=\"max-width:min(100%,440px)\" alt=\"Exhibit 1 Regression Data and Analysis of Variance (ANOVA)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0029.webp\" style=\"max-width:min(100%,308px)\" alt=\"Multiple R 0.8821 R-squared 0.7651 Standard Error of Estimate 0.6346 Observations 60\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0030.webp\" style=\"max-width:min(100%,494px)\" alt=\"Coefficients Standard Error Base Price 950 8.535 Margin 0.10 0.429\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0031.webp\" style=\"max-width:min(100%,76px)\" alt=\"ANOVA\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0032.webp\" style=\"max-width:min(100%,515px)\" alt=\"df Sum of Squares (SS) Regression 1 0.1856 Residual 58 0.0268 Total 59 0.2124\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0033.webp\" style=\"max-width:min(100%,175px)\" alt=\"Exhibit 2 Significance Levels \"><p>df p= 0.10 p= 0.05 p= 0.025<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0034.webp\" style=\"max-width:min(100%,251px)\" alt=\"2 1.886 2.920 4.303 60 1.296 1.671 2.000 70 1.294 1.667 1.994\"><p>To uncover potential assumption violations and to better understand the data outliers, Richards intends to plot her results in a scatter plot. She discusses the scatter plot results with fellow manager Earl Matthews upon completing them. <\/p><p>The two employees arrive at the following conclusions concerning the regression analysis. Conclusion 1: Upon visual inspection, it appears that there is no directional relationship between the residuals and the predicted values from the regression model since the line is centered near 0.00. It is a good outcome since residuals are expected to behave independently of the model, suggesting that regression errors are uncorrelated and have a constant variance. Hence, multiple linear regression meets several of its underlying assumptions. <\/p><p>Conclusion 2: Three residuals appear to be outliers in the scatter plot. Thus, these data cannot be used to determine whether shocks from factors not included in the model occurred at these points.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1. The F-test statistic is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 15, "q": "Which of the two conclusions arrived at by both employees is most accurate :", "opts": ["Conclusion 1", "Conclusion 2", "Both Conclusions 1 and 2."], "ans": "A", "expl": "Conclusion 1 is the most accurate because it correctly interprets the behavior of residuals in a regression analysis. When residuals are centered around zero and do not show any directional relationship with the predicted values, it indicates that the errors in the regression model are randomly distributed. This random distribution is crucial because it suggests that the model's errors are uncorrelated and have constant variance, which are key assumptions for the validity of a linear regression model. The absence of patterns or trends in the residuals relative to the predicted values supports the conclusion that the model is well-specified and that the independent variables included in the model are appropriate for predicting the dependent variable. This outcome is desirable as it implies that the model captures the essential factors influencing the dependent variable, leading to reliable and unbiased predictions. B is incorrect. Conclusion 2 is less accurate because identifying outliers in the residuals does not necessarily indicate shocks from unconsidered factors. While outliers may suggest potential anomalies or extreme values that could be influenced by external factors not included in the model, they do not provide definitive evidence of such shocks. Outliers could also result from data entry errors, unusual but valid data points, or other anomalies that do not relate to model misspecification or external shocks. Therefore, while it is important to investigate outliers, they alone cannot conclusively determine the presence of shocks due to unconsidered factors in the model. C is incorrect. Choosing both conclusions as equally accurate is incorrect because Conclusion 2 does not hold the same level of analytical validity as Conclusion 1. While Conclusion 1 correctly assesses the behavior of residuals in line with the assumptions of linear regression, Conclusion 2 makes an assumption about the cause of outliers without sufficient evidence. Outliers in regression analysis require further investigation and cannot alone be used to assert the influence of unconsidered external shocks. Thus, stating that both conclusions are equally accurate overlooks the nuanced understanding required to interpret outliers in regression analysis. ", "explhtml": "<p>Conclusion 1 is the most accurate because it correctly interprets the behavior of residuals in a regression analysis. When residuals are centered around zero and do not show any directional relationship with the predicted values, it indicates that the errors in the regression model are randomly distributed. This random distribution is crucial because it suggests that the model&#x27;s errors are uncorrelated and have constant variance, which are key assumptions for the validity of a linear regression model. The absence of patterns or trends in the residuals relative to the predicted values supports the conclusion that the model is well-specified and that the independent variables included in the model are appropriate for predicting the dependent variable. This outcome is desirable as it implies that the model captures the essential factors influencing the dependent variable, leading to reliable and unbiased predictions.<\/p><p><b>B is incorrect<\/b>. Conclusion 2 is less accurate because identifying outliers in the residuals does not necessarily indicate shocks from unconsidered factors. While outliers may suggest potential anomalies or extreme values that could be influenced by external factors not included in the model, they do not provide definitive evidence of such shocks. Outliers could also result from data entry errors, unusual but valid data points, or other anomalies that do not relate to model misspecification or external shocks. Therefore, while it is important to investigate outliers, they alone cannot conclusively determine the presence of shocks due to unconsidered factors in the model.<\/p><p><b>C is incorrect<\/b>. Choosing both conclusions as equally accurate is incorrect because Conclusion 2 does not hold the same level of analytical validity as Conclusion 1. While Conclusion 1 correctly assesses the behavior of residuals in line with the assumptions of linear regression, Conclusion 2 makes an assumption about the cause of outliers without sufficient evidence. Outliers in regression analysis require further investigation and cannot alone be used to assert the influence of unconsidered external shocks. Thus, stating that both conclusions are equally accurate overlooks the nuanced understanding required to interpret outliers in regression analysis. <\/p><p class=\"los\">CFA Level II, Study Session 1, Learning Module 1: Basics of Multiple Regression and Underlying Assumptions, LOS 1(c): Explain the assumptions underlying a multiple linear regression model and interpret residual plots indicating potential violations of these assumptions.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Lily Richards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lily Richards, CFA, is a quantitative analyst at Gateway Constructors (GC). GC specializes in the construction of national highways.<\/p><p>In recent times, Richards has been involved in two specific projects. As part of her first project, she has been looking at ways to increase efficiency in the construction process, especially regarding fuel consumptio =\"lazy\" src=\"l2img/ap01/f0032.webp\" style=\"max-width:min(100%,515px)\" alt=\"df Sum of Squares (SS) Regression 1 0.1856 Residual 58 0.0268 Total 59 0.2124\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0033.webp\" style=\"max-width:min(100%,175px)\" alt=\"Exhibit 2 Significance Levels \"><p>df p= 0.10 p= 0.05 p= 0.025<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0034.webp\" style=\"max-width:min(100%,251px)\" alt=\"2 1.886 2.920 4.303 60 1.296 1.671 2.000 70 1.294 1.667 1.994\"><p>To uncover potential assumption violations and to better understand the data outliers, Richards intends to plot her results in a scatter plot. She discusses the scatter plot results with fellow manager Earl Matthews upon completing them. <\/p><p>The two employees arrive at the following conclusions concerning the regression analysis. Conclusion 1: Upon visual inspection, it appears that there is no directional relationship between the residuals and the predicted values from the regression model since the line is centered near 0.00. It is a good outcome since residuals are expected to behave independently of the model, suggesting that regression errors are uncorrelated and have a constant variance. Hence, multiple linear regression meets several of its underlying assumptions. <\/p><p>Conclusion 2: Three residuals appear to be outliers in the scatter plot. Thus, these data cannot be used to determine whether shocks from factors not included in the model occurred at these points.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the two conclusions arrived at by both employees is most accurate :<\/p><\/div>", "subj": "quant"}, {"n": 16, "q": "From data available in Exhibit 1, the value of adjusted R2 is closestto:", "opts": ["0.111", "0.8694", "0.7611"], "ans": "C", "expl": "The adjusted R2 value is a refinement of the R2 value that accounts for the number of predictors in the model. It is particularly useful because it adjusts the R2 value based on the number of variables, preventing overestimation that might occur with the inclusion of additional predictors. The formula for adjusted R2 is given by: where n is the number of observations, k is the number of independent variables, and R2 is the coefficient of determination. In this case, n = 60 (the number of observations), k = 1 (the number of predictors, which is the margin), and R2 = 0.7651 (as given in Exhibit 1). Plugging these values into the formula, we get: A is incorrect. The calculation for option A seems to be a misunderstanding or misapplication of the formula for adjusted R2. The value of 0.111 does not logically follow from any correct application of the adjusted R2 formula given the data provided. It appears to be a miscalculation or typo, as the correct application of the formula does not yield this result. B is incorrect. The calculation for option B incorrectly assumes an additional degree of freedom for the predictors (using k = 2 instead of k = 1). This assumption leads to a different divisor in the formula, which is not supported by the information given in the problem statement. The correct number of predictors, as per the regression model provided, is one (the margin), and thus the calculation using k = 2 leads to an incorrect adjusted R2 value. ", "explhtml": "<p>The adjusted R<sup>2<\/sup> value is a refinement of the R<sup>2<\/sup> value that accounts for the number of predictors in the model. It is particularly useful because it adjusts the R<sup>2<\/sup> value based on the number of variables, preventing overestimation that might occur with the inclusion of additional predictors. The formula for adjusted R<sup>2<\/sup> is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0042.webp\" style=\"max-width:min(100%,235px)\" alt=\"¯R 2 = 1 −[ (n −1) ][1 −R2] (n −k −1)\"><p>where n is the number of observations, k is the number of independent variables, and R<sup>2<\/sup> is the coefficient of determination. In this case, n = 60 (the number of observations), k = 1 (the number of predictors, which is the margin), and R<sup>2<\/sup> = 0.7651 (as given in Exhibit 1).<\/p><p>Plugging these values into the formula, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0043.webp\" style=\"max-width:min(100%,262px)\" alt=\"¯R 2 = 1 −[ 60 −1 −1 60 −1 ] [1 −0.7651] ¯R 2 = 1 −[ 59 ][0.2349] 58 ¯R 2 = 1 −[0.2349 × 1.0172] ¯R 2 = 1 −0.2389 = 0.7611\"><p><b>A is incorrect<\/b>. The calculation for option A seems to be a misunderstanding or misapplication of the formula for adjusted R<sup>2<\/sup>. The value of 0.111 does not logically follow from any correct application of the adjusted R<sup>2<\/sup> formula given the data provided. It appears to be a miscalculation or typo, as the correct application of the formula does not yield this result.<\/p><p><b>B is incorrect<\/b>. The calculation for option B incorrectly assumes an additional degree of freedom for the predictors (using k = 2 instead of k = 1). This assumption leads to a different divisor in the formula, which is not supported by the information given in the problem statement. The correct number of predictors, as per the regression model provided, is one (the margin), and thus the calculation using k = 2 leads to an incorrect adjusted R<sup>2<\/sup> value. <\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Evaluating Regression Model Fit and Interpreting Model Results, LOS 2(a): Evaluate how well a multiple regression model explains the dependent variable by analyzing ANOVA table results and measures of goodness of fit.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Lily Richards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lily Richards, CFA, is a quantitative analyst at Gateway Constructors (GC). GC specializes in the construction of national highways.<\/p><p>In recent times, Richards has been involved in two specific p l used to forecast the sales of Smart Inc. is given by the equation where b0 is the intercept, b1 is the coefficient for the lagged sales, and ϵt is the error term. Plugging in the values from the regression output, the intercept b0 is 313.24 and the coefficient  b1 is 0.67. Using the sales data from Q1, which is 1,137, the forecast for Q2 sales can be calculated as follows: This calculation shows that the forecasted sales for Q2 are approximately 1,075, which corresponds to option B. A is incorrect. The calculation for option A suggests a forecast of 762 sales for Q2, which does not align with the output from the regression model. Using the model's parameters, the intercept and the coefficient applied to the Q1 sales data do not mathematically result in a forecast of 762. The correct calculation, as shown above, leads to a forecast of approximately 1,075 sales, not 762. This discrepancy indicates a misunderstanding or misapplication of the regression model's coefficients and intercept in option A. C is incorrect. Option C suggests that the number of sales forecasted for Q2 would be the same as Q1, 1,137. This is incorrect because it ignores the effect of the regression model, particularly the coefficients and the intercept that influence the forecast based on previous sales data. The model explicitly includes a dependency on the sales from the previous quarter (lagged sales), which in this case significantly alters the forecast. The correct application of the model parameters to the Q1 sales data results in a forecast that deviates from the simple repetition of the Q1 sales figure, leading to a forecast of approximately 1,075 instead of 1,137. ", "explhtml": "<p>The regression model used to forecast the sales of Smart Inc. is given by the equation<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0048.webp\" style=\"max-width:min(100%,226px)\" alt=\"Salest = b0 + b1Salest−1 + ϵt\"><p>where b<sub>0<\/sub> is the intercept, b<sub>1<\/sub> is the coefficient for the lagged sales, and ϵ<sub>t<\/sub> is the error term. Plugging in the values from the regression output, the intercept b<sub>0<\/sub> is 313.24 and the coefficient  b<sub>1<\/sub> is 0.67. Using the sales data from Q1, which is 1,137, the forecast for Q2 sales can be calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0049.webp\" style=\"max-width:min(100%,496px)\" alt=\"SalesQ2 = 313.24 + 0.67 × 1, 137 = 313.24 + 762.79 = 1, 075.03\"><p>This calculation shows that the forecasted sales for Q2 are approximately 1,075, which corresponds to option B.<\/p><p><b>A is incorrect<\/b>. The calculation for option A suggests a forecast of 762 sales for Q2, which does not align with the output from the regression model. Using the model&#x27;s parameters, the intercept and the coefficient applied to the Q1 sales data do not mathematically result in a forecast of 762. The correct calculation, as shown above, leads to a forecast of approximately 1,075 sales, not 762. This discrepancy indicates a misunderstanding or misapplication of the regression model&#x27;s coefficients and intercept in option A.<\/p><p><b>C is incorrect<\/b>. Option C suggests that the number of sales forecasted for Q2 would be the same as Q1, 1,137. This is incorrect because it ignores the effect of the regression model, particularly the coefficients and the intercept that influence the forecast based on previous sales data. The model explicitly includes a dependency on the sales from the previous quarter (lagged sales), which in this case significantly alters the forecast. The correct application of the model parameters to the Q1 sales data results in a forecast that deviates from the simple repetition of the Q1 sales figure, leading to a forecast of approximately 1,075 instead of 1,137. <\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Evaluating Regression Model Fit and Interpreting Model Results, LOS 2(c): Calculate and interpret a predicted value for the dependent variable, given the estimated regression model and assumed values for the independent variable<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Tabitha Meng<\/summary><div class=\"vig-body\"><p>Tabitha Meng, CFA, is a quantitative analyst with Hafei Securities Ltd, a company based in Bangkok, Thailand. Haifei has built a reputation providing stock brokering and investment advisory services to large institutional investors. In the recent past, the company expanded its portfolio and brought in a team of equity and fixed income analysts. Meng is a member of this team.<\/p><p>Meng is forecasting quarterly sales of Smart Inc., a smart TV manufacturer based in Thailand. The regression model is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0044.webp\" style=\"max-width:min(100%,226px)\" alt=\"Salest = b0 + b1Salest−1 + ϵt\"><p>The regression results for the smart TV sales model are presented in the exhibits below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0045.webp\" style=\"max-width:min(100%,556px)\" alt=\"Exhibit 1: Regression statistics for smart TV sales model R-squared 0.7436 Observations 120 Coefficient Standard Error Intercept 313.24 99.43 Lag 1 0.67 0.16 Exhibit 2: Autocorrelation of Residuals for smart TV sales model Lag Autocorrelation 1 -0.083 2 0.092 3 0.075 4 0.117 5 0.068 6 -0.125\"><p>*The critical values, assuming 5% significance level and 118 degrees of freedom, are 1.980 for a two-tail t-test and 1.658 for a one-tail t-test.<\/p><p>Thai National Oil Limited (TNOL) is a state-owned, giant oil exploration, refining and marketing company with a presence across East Asia. TNOL is planning to issue bonds with an 15-year maturity. Several of Haifei’s investment clients are intent on subscribing to the issue. Meng starts working on a quantitative model to forecast changes in quarterly profit of TNOL based on several macroeconomic variables. The regression model formulated is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0046.webp\" style=\"max-width:min(100%,358px)\" alt=\"ΔProfit = b0 + b1ΔGDP + b2ΔFX + b3ΔInt + ϵ\"><p>Where,<\/p><p>ΔP rofit=change in quarterly profit of TNOL<\/p><p>ΔGDP =change in quarterly GDP for Thailand<\/p><p>ΔFX=change in foreign exchange rate THB/USD<\/p><p>ΔInt=change in policy interest rate of Thai Central Bank<\/p><p>For the model to forecast change in profit of TNOL, regression results are as follows:<\/p><p><b>Exhibit 3: Regression statistics for quarterly profit model<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0047.webp\" style=\"max-width:min(100%,480px)\" alt=\"R-squared 0.8921 Observations 48 SEE 0.7978 Degree of ANOVA SS Freedom Regression 3 231.54 Residual 44 ? Total 47 ? Coefficient Standard Error Intercept 2.75 0.83 ΔGDP 2.38 0.62 ΔFX 0.51 0.15 ΔInt 1.07 0.31\"><p>Note: The critical values, assuming 5% significance level and 46 degrees of freedom, are 2.013 for a two-tail t-test and 1.679 for a one-tail t-test. The critical value for an F-test is 2.816.<\/p><\/div><\/details><div class=\"qtext\"><p>If TV sales in Q1 were 1,137, the number of sales forecasted for Q2 is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 18, "q": "The mean reverting level of the autoregressive time series to predict sales of Smart Inc. is closest to:", "opts": ["313", "467", "949"], "ans": "C", "expl": "The mean reverting level of an autoregressive time series model can be calculated using the formula where b0 is the intercept and b1 is the coefficient of the first lag variable in the model. In the given regression model for Smart Inc., the intercept b0 is 313.24 and the coefficient b1 for the lagged sales (Salest−1) is 0.67. Plugging these values into the formula gives This calculation shows that the mean reverting level, which is the level to which the series tends to return over time, is approximately 949.21. This value is closest to option C, which i he mean reverting level is 313. This interpretation might arise from a misunderstanding that the intercept b<sub>0<\/sub> itself represents the mean reverting level. However, the intercept alone does not account for the influence of the lagged variable in the autoregressive model. The correct approach requires the application of the formula for the mean reverting level, which incorporates both the intercept and the coefficient of the lagged term, leading to a significantly higher value than just the intercept.<\/p><p><b>B is incorrect<\/b>. It suggests a mean reverting level of 467. This value does not align with the calculated mean reverting level using the correct formula. The error in this option could stem from an incorrect calculation or a misinterpretation of the model&#x27;s parameters. It is essential to apply the formula accurately, considering both the intercept and the coefficient of the lagged sales, to arrive at the correct mean reverting level, which is approximately 949.21, not 467. <\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(f): Explain mean reversion and calculate a mean-reverting level<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Tabitha Meng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tabitha Meng, CFA, is a quantitative analyst with Hafei Securities Ltd, a company based in Bangkok, Thailand. Haifei has built a reputation providing stock brokering and investment advisory services to large institutional investors. In the recent past, the company expanded its portfolio and brought in a team of equity and fixed income analysts. Meng is a member of this team.<\/p><p>Meng is forecasting quarterly sales of Smart Inc., a smart TV manufacturer based in Thailand. The regression model is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0044.webp\" style=\"max-width:min(100%,226px)\" alt=\"Salest
