ta using the equation  e<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>X<sub>t<\/sub> , where e represents the residual terms from the original regression and X represents the sales data, and if b<sub>1<\/sub> is statistically different from zero, then the regression model contains an ARCH process.<\/p><p>Thomas is also evaluating the performance of the 10-year Indian and Chinese Stock indexes based on the U.S. Federal Funds rate. He uses the following regression models:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0102.webp\" style=\"max-width:min(100%,197px)\" alt=\"BYIndia,t = b0 + b1FFUS,t BYChina,t = b0 + b1FFUS,t\"><p>Before running the regression, he says:<\/p><p>Time series for the U.S. federal funds rate has a unit root.<\/p><p>Time series for the stock index in China has a unit root.<\/p><p>Time series for the U.S. federal funds rate and the Chinese stock index are<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0103.webp\" style=\"max-width:min(100%,115px)\" alt=\"cointegrated.\"><p>Time series for the stock index in India does not have a unit root.<\/p><p>Time series for the U.S. federal funds rate and the stock index in India are not<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0104.webp\" style=\"max-width:min(100%,115px)\" alt=\"cointegrated.\"><\/div><\/details><div class=\"qtext\"><p>Which of the lags should Gary include in the regression of MUS data:<\/p><\/div>", "subj": "quant"}, {"n": 45, "q": "Which statement made by Smith’s colleague about the constitution of a good generalization in a machine learning model is most likely accurate:", "opts": ["Statement 1", "Statement 2", "Statement 3"], "ans": "A", "expl": "Generalization in machine learning refers to the ability of a model to apply what it has learned from the training data to new, unseen data. A model that generalizes well performs similarly on both the training data and the new data. This is crucial because the ultimate goal of a machine learning model is to make accurate predictions on new data, not just to fit the training data well. Statement 1 correctly captures this essence by stating that a model retains its explanatory power when predicting using new data. This means that the model does not just memorize the training data but understands the underlying patterns, which it can then apply to new data. This is the hallmark of a well-generalized model, which is why Statement 1 is correct. B is incorrect. Statement 2 suggests that the model shows low explanatory power after training using training data, which indicates a problem of underfitting. Underfitting occurs when a model is too simple to learn the underlying pattern in the data. Such a model will perform poorly on both the training data and new data because it hasn't captured the necessary details to make accurate predictions. This statement does not describe good generalization; instead, it highlights a deficiency in the model's ability to capture and learn from the training data. C is incorrect. Statement 3 describes a scenario where the model loses its explanatory power when predicting using new data, which is indicative of overfitting. Overfitting occurs when a model is too complex and learns the noise in the training data as if it were a true signal. This leads to excellent performance on the training data but poor performance on new, unseen data because the noise does not generalize. This statement clearly points to a failure in generalization due to the model being overly tailored to the specifics of the training data, rather than learning the general trends that apply more broadly.", "explhtml": "<p>Generalization in machine learning refers to the ability of a model to apply what it has learned from the training data to new, unseen data. A model that generalizes well performs similarly on both the training data and the new data. This is crucial because the ultimate goal of a machine learning model is to make accurate predictions on new data, not just to fit the training data well. Statement 1 correctly captures this essence by stating that a model retains its explanatory power when predicting using new data. This means that the model does not just memorize the training data but understands the underlying patterns, which it can then apply to new data. This is the hallmark of a well-generalized model, which is why Statement 1 is correct.<\/p><p><b>B is incorrect.<\/b> Statement 2 suggests that the model shows low explanatory power after training using training data, which indicates a problem of underfitting. Underfitting occurs when a model is too simple to learn the underlying pattern in the data. Such a model will perform poorly on both the training data and new data because it hasn&#x27;t captured the necessary details to make accurate predictions. This statement does not describe good generalization; instead, it highlights a deficiency in the model&#x27;s ability to capture and learn from the training data.<\/p><p><b>C is incorrect.<\/b> Statement 3 describes a scenario where the model loses its explanatory power when predicting using new data, which is indicative of overfitting. Overfitting occurs when a model is too complex and learns the noise in the training data as if it were a true signal. This leads to excellent performance on the training data but poor performance on new, unseen data because the noise does not generalize. This statement clearly points to a failure in generalization due to the model being overly tailored to the specifics of the training data, rather than learning the general trends that apply more broadly.<\/p><p class=\"los\">Quantitative Methods, Learning Module 6: Machine Learning, LOS 6 (b): Describe overfitting and identify methods of addressing it.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Peter Smith<\/summary><div class=\"vig-body\"><p>Peter Smith is a newly hired data analyst at ABC Investment Company. Smith is also an experienced stock market trader. Paul Adam is the CEO of ABC Investment Company. In a lunch meeting with Adams, Smith mentions that machine learning plays an integral role in the financial markets, specifically the stock markets. At the end of their discussion, Adams did not sound convinced about the possibility of accurately identifying stocks and trading them without human error and interference of personal sentiments to reap better returns. He based his argument on the reality that the stock market fluctuates randomly from day to day. In other words, he was not convinced about the predictive power and accuracy of machine learning.<\/p><p>To demonstrate the robust application of machine learning in stock markets, Smith decides to<\/p><p>launch a project to illustrate the ability of machine learning techniques to retrieve information<\/p><p>from past prices and predict price movement and future trends in the stock market. He wants to<\/p><p>convince Adams that to artificial intelligence and machine can help select top-performing stock<\/p><p>portfolios that outperform the stock market. This way, Smith positions himself to apply ML<\/p><p>techniques to refine ABC’s investment processes as time passes.<\/p><p>Smith focuses on a portfolio of Small-Cap Stocks that ABC Investment Company maintains that<\/p><p>trade on the London Stock Exchange (LSE). He chooses Small-Cap Stocks because he believes<\/p><p>that they have the most growth potential and would like to focus on one month&#x27;s short-term<\/p><p>trading. Since these stocks have a higher risk, he manages this risk by using financially healthy<\/p><p>stocks for trading. Since these stocks have a higher risk, he manages this risk by using<\/p><p>financially healthy stocks for trading.<\/p><p>Smith virtually traded the three top training stocks from March 2018 to April 2018. Similarly, he<\/p><p>virtually traded the three top training stocks from April 2018 to May 2018, and finally, he<\/p><p>virtually trades the three top training stocks from May 2018 to June 2018 to give substance to<\/p><p>the selection of good profitable stock portfolios and the consistent and reliable methodology.<\/p><p>He downloads historical daily stock data such as open, high, low, close, and volume from the<\/p><p>company’s website. Notably, he downloads a dataset of 2,000 stocks for the period of 30 January<\/p><p>2018 to 30 June 2019.<\/p><p>He combines technical and fundamental data using machine learning applications and a<\/p><p>proprietary trading method. His goal is to determine whether a data-driven machine learning<\/p><p>approach could be used to select good stocks that will outperform the stock market index.<\/p><p>Smith resolves to split the stocks into three portfolios. He employs three machine learning<\/p><p>models, including Logistic Regression, Decision Tree, and Neural Network, to identify top-<\/p><p>performing stock portfolios that outperform the stock market.<\/p><p>After training each model, Smith discovers that while they are good at correctly classifying using<\/p><p>the training sample, they perform poorly using new data. In consulting his colleague about this<\/p><p>issue, Smith hears conflicting explanations about what constitutes good generalization in an ML<\/p><p>model:<\/p><p><b>Statement 1<\/b><\/p><p>The model retains its explanatory power when predicting using new data<\/p><p><b>Statement 2<\/b><\/p><p>The model shows low explanatory power after training using training data<\/p><p><b>Statement 3<\/b><\/p><p>The model loses its explanatory power when predicting using new data In virtual stock trading,<\/p><p>each stock portfolio had an investment of $5,000, with each stock having almost $8,000 invested.<\/p><p>At the end of each month, he sells the stocks and computes the return on investment for the<\/p><p>portfolio. He then compares it with the stock market performance.<\/p><p>Smith compares the results for the virtual trading of the three stock portfolios, Neural Networks,<\/p><p>Decision Trees, and Logistic Regression, with the stock market performance. He finds out that<\/p><p>the decision tree portfolio outperformed the performance of the stock market. Nevertheless, the<\/p><p>Logistic Regression and Neural Network Model Portfolios were less than the market<\/p><p>performance but not significantly different from the market performance for all the three<\/p><p>periods, April 2019, May 2019, and June 2019.<\/p><p>Smith concludes that a data-driven approach could be used for selecting good Small-Cap stocks<\/p><p>that will outperform the stock market index. Further, machine learning models such as the<\/p><p>Logistic Regression, Decision Tree, and Neural Network were employed, and the experimental<\/p><p>results confirmed that these models are suitable for identifying top-performing stock portfolios<\/p><p>that exceed the stock market performance. In all the three consecutive periods, stock portfolio performance was positive.<\/p><p>Therefore, Smith convinces Adams that data-driven approaches such as machine learning<\/p><p>techniques can accurately predict which stocks are likely to increase. He also mentions<\/p><p>additional ways of applying ML techniques in investment processes, which he will be willing to<\/p><p>implement in ABC Investment Company with time.<\/p><p>Adams had attended multiple workshops on digital disruption and its implications, which were<\/p><p>mandatory to all the employees of the company. One of those workshops was on data science,<\/p><p>and he had grasped the concept of dimension reduction. However, Smith did not mention<\/p><p>dimension reduction when delivering a high-level presentation of his project. Adams was<\/p><p>concerned about this because he thought machine learning should revolve around dimension<\/p><p>reduction, a crucial concept.<\/p><\/div><\/details><div class=\"qtext\"><p>Which statement made by Smith’s colleague about the constitution of a good generalization in a machine learning model is most likely accurate:<\/p><\/div>", "subj": "quant"}, {"n": 46, "q": "Assuming that Smith applies regularization in the machine learning models, which of the following ML models is most likely to be the least appropriate for the linear regression algorithm?", "opts": ["LASSO with lambda (λ) equal to 0", "LASSO with lambda (λ)between 0.5 and 1", "Regression tree with pruning"], "ans": "A", "expl": "LASSO (Least Absolute Shrinkage and Selection Operator) is a regression analysis method that performs both variable selection and regularization in order to enhance the prediction accuracy and interpretability of the statistical model it produces. A key component of LASSO is the regularization parameter, λ, which imposes a penalty on the absolute size of the regression coefficients. When λ = 0, the penalty effect disappears, and the LASSO model reduces to an ordinary least squares (OLS) regression. This means that all features are included in the model without any form of shrinkage or selection, which can lead to overfitting especially in scenarios with many predictors or multicollinearity among the variables. Therefore, LASSO with λ = 0 is essentially not performing its primary function of regularization, making it the least appropriate choice for scenarios where regularization is beneficial. B is incorrect. When λ is set between 0.5 and 1, LASSO effectively shrinks the coefficients of less important variables towards zero and can completely remove some variables by setting their coefficients to zero. This introduces sparsity into the model, which means that only the most significant variables are retained. This level of λ helps in preventing overfitting, enhancing the model's generalization ability, and improving interpretability by eliminating irrelevant variables. Thus, LASSO with λ between 0.5 and 1 is more appropriate as it utilizes the regularization capability to optimize model performance. C is incorrect. A regression tree with pruning is another form of regularization technique where the complexity of a decision tree model is reduced. Pruning involves removing parts of the tree that provide little power in predicting the target variable, thus reducing overfitting and simplifying the model. This method is fundamentally different from LASSO but serves a similar purpose in terms of regularization. Pruning a regression tree helps in focusing the model on the most significant splits and can be very effective in managing variance and bias. Therefore, it remains an appropriate choice for scenarios requiring a non-linear model with regularization. ", "explhtml": "<p>LASSO (Least Absolute Shrinkage and Selection Operator) is a regression analysis method that performs both variable selection and regularization in order to enhance the prediction accuracy and interpretability of the statistical model it produces. A key component of LASSO is the regularization parameter, λ, which imposes a penalty on the absolute size of the regression coefficients. When λ = 0, the penalty effect disappears, and the LASSO model reduces to an ordinary least squares (OLS) regression. This means that all features are included in the model without any form of shrinkage or selection, which can lead to overfitting especially in scenarios with many predictors or multicollinearity among the variables. Therefore, LASSO with λ = 0 is essentially not performing its primary function of regularization, making it the least appropriate choice for scenarios where regularization is beneficial.<\/p><p><b>B is incorrect<\/b>. When λ is set between 0.5 and 1, LASSO effectively shrinks the coefficients of less important variables towards zero and can completely remove some variables by setting their coefficients to zero. This introduces sparsity into the model, which means that only the most significant variables are retained. This level of λ helps in preventing overfitting, enhancing the model&#x27;s generalization ability, and improving interpretability by eliminating irrelevant variables. Thus, LASSO with λ between 0.5 and 1 is more appropriate as it utilizes the regularization capability to optimize model performance.<\/p><p><b>C is incorrect<\/b>. A regression tree with pruning is another form of regularization technique where the complexity of a decision tree model is reduced. Pruning involves removing parts of the tree that provide little power in predicting the target variable, thus reducing overfitting and simplifying the model. This method is fundamentally different from LASSO but serves a similar purpose in terms of regularization. Pruning a regression tree helps in focusing the model on the most significant splits and can be very effective in managing variance and bias. Therefore, it remains an appropriate choice for scenarios requiring a non-linear model with regularization. <\/p><p class=\"los\">Quantitative Methods, Learning Module 6: Machine Learning, LOS 6 ( b): Describe overfitting and identify methods of addressing it.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Peter Smith<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Peter Smith is a newly hired data analyst at ABC Investment Company. Smith is also an experienced stock market trader. Paul Adam is the CEO of ABC Investment Company. In a lunch meeting with Adams, Smith mentions that machine learning plays an integral role in the financial markets, specifically the stock markets. At the end of their discussion, Adams did not sound convinced about the possibility of accurately identifying stocks and trading them without human error and interference of personal sentiments to reap better returns. He based his argument on the reality that the stock market fluctuates randomly from day to day. In other words, he was not convinced about the predictive power and accuracy of machine learning.<\/p><p>To demonstrate the robust application of machine learning in stock markets, Smith decides to<\/p><p>launch a project to illustrate the ability of machine learning techniques to retrieve information<\/p><p>from past prices and predict price movement and future trends in the stock market. He wants to<\/p><p>convince Adams that to artificial intelligence and machine can help select top-performing stock<\/p><p>portfolios that outperform the stock market. This way, Smith positions himself to apply ML<\/p><p>techniques to refine ABC’s investment processes as time passes.<\/p><p>Smith focuses on a portfolio of Small-Cap Stocks that ABC Investment Company maintains that<\/p><p>trade on the London Stock Exchange (LSE). He chooses Small-Cap Stocks because he believes<\/p><p>that they have the most growth potential and would like to focus on one month&#x27;s short-term<\/p><p>trading. Since these stocks have a higher risk, he manages this risk by using financially healthy<\/p><p>stocks for trading. Since these stocks have a higher risk, he manages this risk by using<\/p><p>financially healthy stocks for trading.<\/p><p>Smith virtually traded the three top training stocks from March 2018 to April 2018. Similarly, he<\/p><p>virtually traded the three top training stocks from April 2018 to May 2018, and finally, he<\/p><p>virtually trades the three top training stocks from May 2018 to June 2018 to give substance to<\/p><p>the selection of good profitable stock portfolios and the consistent and reliable methodology.<\/p><p>He downloads historical daily stock data such as open, high, low, close, and volume from the<\/p><p>company’s website. Notably, he downloads a dataset of 2,000 stocks for the period of 30 January<\/p><p>2018 to 30 June 2019.<\/p><p>He combines technical and fundamental data using machine learning applications and a<\/p><p>proprietary trading method. His goal is to determine whether a data-driven machine learning<\/p><p>approach could be used to select good stocks that will outperform the stock market index.<\/p><p>Smith resolves to split the stocks into three portfolios. He employs three machine learning<\/p><p>models, including Logistic Regression, Decision Tree, and Neural Network, to identify top-<\/p><p>performing stock portfolios that outperform the stock market.<\/p><p>After training each model, Smith discovers that while they are good at correctly classifying using<\/p><p>the training sample, they perform poorly using new data. In consulting his colleague about this<\/p><p>issue, Smith hears conflicting explanations about what constitutes good generalization in an ML<\/p><p>model:<\/p><p><b>Statement 1<\/b><\/p><p>The model retains its explanatory power when predicting using new data<\/p><p><b>Statement 2<\/b><\/p><p>The model shows low explanatory power after training using training data<\/p><p><b>Statement 3<\/b><\/p><p>The model loses its explanatory power when predicting using new data In virtual stock trading,<\/p><p>each stock portfolio had an investment of $5,000, with each stock having almost $8,000 invested.<\/p><p>At the end of each month, he sells the stocks and computes the return on investment for the<\/p><p>portfolio. He then compares it with the stock market performance.<\/p><p>Smith compares the results for the virtual trading of the three stock portfolios, Neural Networks,<\/p><p>Decision Trees, and Logistic Regression, with the stock market performance. He finds out that<\/p><p>the decision tree portfolio outperformed the performance of the stock market. Nevertheless, the<\/p><p>Logistic Regression and Neural Network Model Portfolios were less than the market<\/p><p>performance but not significantly different from the market performance for all the three<\/p><p>periods, April 2019, May 2019, and June 2019.<\/p><p>Smith concludes that a data-driven approach could be used for selecting good Small-Cap stocks<\/p><p>that will outperform the stock market index. Further, machine learning models such as the<\/p><p>Logistic Regression, Decision Tree, and Neural Network were employed, and the experimental<\/p><p>results confirmed that these models are suitable for identifying top-performing stock portfolios<\/p><p>that exceed the stock market performance. In all the three consecutive periods, stock portfolio performance was positive.<\/p><p>Therefore, Smith convinces Adams that data-driven approaches such as machine learning<\/p><p>techniques can accurately predict which stocks are likely to increase. He also mentions<\/p><p>additional ways of applying ML techniques in investment processes, which he will be willing to<\/p><p>implement in ABC Investment Company with time.<\/p><p>Adams had attended multiple workshops on digital disruption and its implications, which were<\/p><p>mandatory to all the employees of the company. One of those workshops was on data science,<\/p><p>and he had grasped the concept of dimension reduction. However, Smith did not mention<\/p><p>dimension reduction when delivering a high-level presentation of his project. Adams was<\/p><p>concerned about this because he thought machine learning should revolve around dimension<\/p><p>reduction, a crucial concept.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming that Smith applies regularization in the machine learning models, which of the following ML models is most likely to be the least appropriate for the linear regression algorithm?<\/p><\/div>", "subj": "quant"}, {"n": 47, "q": "What is the most likely explanation that Smith gave Adams regarding his concern on dimension reduction? Dimension reduction is an ML algorithm that applies to:", "opts": ["Supervised ML algorithm", "Unsupervised ML algorithm", "Deep learning ML algorithms"], "ans": "B", "expl": "Dimension reduction primarily pertains to unsupervised machine learning algorithms. Unsupervised learning involves algorithms that operate on data without explicit labels, meaning they are not told the correct answer or outcome beforehand. Instead, these algorithms identify patterns and structures from the data itself. Dimension reduction is a technique used in unsupervised learning to simplify the dataset by reducing the number of random variables under consideration, via methods such as Principal Component Analysis (PCA) or Singular Value Decomposition (SVD). These methods help in reducing the feature space while retaining the variation in the data that is most significant for analysis. This is crucial in handling high-dimensional data, where many features may be correlated or redundant. By focusing on unsupervised learning, dimension reduction techniques aim to improve the interpretability of the data without much loss of information, making it easier to perform further analysis like clustering. A is incorrect. Supervised learning algorithms function by learning from a labeled dataset, where the outcome or target variable is specified. This approach is fundamentally different from dimension reduction in unsupervised learning, where the goal is to reduce the number of features by finding patterns within the data itself without any guidance from a target variable. Supervised learning models, such as regression and classification, aim to predict an output based on input variables. Techniques like LASSO (Least Absolute Shrinkage and Selection Operator) and SVM (Support Vector Machines) are more about selecting features or adjusting complexity to improve prediction accuracy rather than reducing dimensionality for exploratory data analysis. C is incorrect. Deep learning algorithms, which are a subset of machine learning, focus on learning data representations through layers of abstraction. These models, particularly in fields such as image and speech recognition, rely on large amounts of labeled data and involve complex structures like neural networks that learn from a vast number of parameters. While deep learning can involve some form of dimensionality reduction internally, such as through convolutional layers in neural networks, the primary goal is not dimension reduction but rather achieving high-level, accurate predictions and classifications on tasks that require the analysis of large-scale and complex data patterns. ", "explhtml": "<p>Dimension reduction primarily pertains to unsupervised machine learning algorithms. Unsupervised learning involves algorithms that operate on data without explicit labels, meaning they are not told the correct answer or outcome beforehand. Instead, these algorithms identify patterns and structures from the data itself. Dimension reduction is a technique used in unsupervised learning to simplify the dataset by reducing the number of random variables under consideration, via methods such as Principal Component Analysis (PCA) or Singular Value Decomposition (SVD). These methods help in reducing the feature space while retaining the variation in the data that is most significant for analysis. This is crucial in handling high-dimensional data, where many features may be correlated or redundant. By focusing on unsupervised learning, dimension reduction techniques aim to improve the interpretability of the data without much loss of information, making it easier to perform further analysis like clustering.<\/p><p><b>A is incorrect<\/b>. Supervised learning algorithms function by learning from a labeled dataset, where the outcome or target variable is specified. This approach is fundamentally different from dimension reduction in unsupervised learning, where the goal is to reduce the number of features by finding patterns within the data itself without any guidance from a target variable. Supervised learning models, such as regression and classification, aim to predict an output based on input variables. Techniques like LASSO (Least Absolute Shrinkage and Selection Operator) and SVM (Support Vector Machines) are more about selecting features or adjusting complexity to improve prediction accuracy rather than reducing dimensionality for exploratory data analysis.<\/p><p><b>C is incorrect<\/b>. Deep learning algorithms, which are a subset of machine learning, focus on learning data representations through layers of abstraction. These models, particularly in fields such as image and speech recognition, rely on large amounts of labeled data and involve complex structures like neural networks that learn from a vast number of parameters. While deep learning can involve some form of dimensionality reduction internally, such as through convolutional layers in neural networks, the primary goal is not dimension reduction but rather achieving high-level, accurate predictions and classifications on tasks that require the analysis of large-scale and complex data patterns. <\/p><p class=\"los\">Quantitative Methods, Learning Module 6: Machine Learning, LOS 6 (a) Describe supervised machine learning, unsupervised machine learning, and deep learning.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Peter Smith<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Peter Smith is a newly hired data analyst at ABC Investment Company. Smith is also an experienced stock market trader. Paul Adam is the CEO of ABC Investment Company. In a lunch meeting with Adams, Smith mentions that machine learning plays an integral role in the financial markets, specifically the stock markets. At the end of their discussion, Adams did not sound convinced about the possibility of accurately identifying stocks and trading them without human error and interference of personal sentiments to reap better returns. He based his argument on the reality that the stock market fluctuates randomly from day to day. In other words, he was not convinced about the predictive power and accuracy of machine learning.<\/p><p>To demonstrate the robust application of machine learning in stock markets, Smith decides to<\/p><p>launch a project to illustrate the ability of machine learning techniques to retrieve information<\/p><p>from past prices and predict price movement and future trends in the stock market. He wants to<\/p><p>convince Adams that to artificial intelligence and machine can help select top-performing stock<\/p><p>portfolios that outperform the stock market. This way, Smith positions himself to apply ML<\/p><p>techniques to refine ABC’s investment processes as time passes.<\/p><p>Smith focuses on a portfolio of Small-Cap Stocks that ABC Investment Company maintains that<\/p><p>trade on the London Stock Exchange (LSE). He chooses Small-Cap Stocks because he believes<\/p><p>that they have the most growth potential and would like to focus on one month&#x27;s short-term<\/p><p>trading. Since these stocks have a higher risk, he manages this risk by using financially healthy<\/p><p>stocks for trading. Since these stocks have a higher risk, he manages this risk by using<\/p><p>financially healthy stocks for trading.<\/p><p>Smith virtually traded the three top training stocks from March 2018 to April 2018. Similarly, he<\/p><p>virtually traded the three top training stocks from April 2018 to May 2018, and finally, he<\/p><p>virtually trades the three top training stocks from May 2018 to June 2018 to give substance to<\/p><p>the selection of good profitable stock portfolios and the consistent and reliable methodology.<\/p><p>He downloads historical daily stock data such as open, high, low, close, and volume from the<\/p><p>company’s website. Notably, he downloads a dataset of 2,000 stocks for the period of 30 January<\/p><p>2018 to 30 June 2019.<\/p><p>He combines technical and fundamental data using machine learning applications and a<\/p><p>proprietary trading method. His goal is to determine whether a data-driven machine learning<\/p><p>approach could be used to select good stocks that will outperform the stock market index.<\/p><p>Smith resolves to split the stocks into three portfolios. He employs three machine learning<\/p><p>models, including Logistic Regression, Decision Tree, and Neural Network, to identify top-<\/p><p>performing stock portfolios that outperform the stock market.<\/p><p>After training each model, Smith discovers that while they are good at correctly classifying using<\/p><p>the training sample, they perform poorly using new data. In consulting his colleague about this<\/p><p>issue, Smith hears conflicting explanations about what constitutes good generalization in an ML<\/p><p>model:<\/p><p><b>Statement 1<\/b><\/p><p>The model retains its explanatory power when predicting using new data<\/p><p><b>Statement 2<\/b><\/p><p>The model shows low explanatory power after training using training data<\/p><p><b>Statement 3<\/b><\/p><p>The model loses its explanatory power when predicting using new data In virtual stock trading,<\/p><p>each stock portfolio had an investment of $5,000, with each stock having almost $8,000 invested.<\/p><p>At the end of each month, he sells the stocks and computes the return on investment for the<\/p><p>portfolio. He then compares it with the stock market performance.<\/p><p>Smith compares the results for the virtual trading of the three stock portfolios, Neural Networks,<\/p><p>Decision Trees, and Logistic Regression, with the stock market performance. He finds out that<\/p><p>the decision tree portfolio outperformed the performance of the stock market. Nevertheless, the<\/p><p>Logistic Regression and Neural Network Model Portfolios were less than the market<\/p><p>performance but not significantly different from the market performance for all the three<\/p><p>periods, April 2019, May 2019, and June 2019.<\/p><p>Smith concludes that a data-driven approach could be used for selecting good Small-Cap stocks<\/p><p>that will outperform the stock market index. Further, machine learning models such as the<\/p><p>Logistic Regression, Decision Tree, and Neural Network were employed, and the experimental<\/p><p>results confirmed that these models are suitable for identifying top-performing stock portfolios<\/p><p>that exceed the stock market performance. In all the three consecutive periods, stock portfolio performance was positive.<\/p><p>Therefore, Smith convinces Adams that data-driven approaches such as machine learning<\/p><p>techniques can accurately predict which stocks are likely to increase. He also mentions<\/p><p>additional ways of applying ML techniques in investment processes, which he will be willing to<\/p><p>implement in ABC Investment Company with time.<\/p><p>Adams had attended multiple workshops on digital disruption and its implications, which were<\/p><p>mandatory to all the employees of the company. One of those workshops was on data science,<\/p><p>and he had grasped the concept of dimension reduction. However, Smith did not mention<\/p><p>dimension reduction when delivering a high-level presentation of his project. Adams was<\/p><p>concerned about this because he thought machine learning should revolve around dimension<\/p><p>reduction, a crucial concept.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the most likely explanation that Smith gave Adams regarding his concern on dimension reduction? Dimension reduction is an ML algorithm that applies to:<\/p><\/div>", "subj": "quant"}, {"n": 48, "q": "Smith has been brainstorming on the applications of neural networks (NNs) and deep learning (DL) to investment management. Which of the given statements is most likely to be incorrect:", "opts": ["NNs and DL are well-suited for image and speech recognition, and natural language processing.", "NNs and DL are well-suited for developing single variable ordinary least squares regression models.", "NNs and DL are well-suited for modeling non-linearity and complex interactions among many features."], "ans": "B", "expl": "Neural networks (NNs) and deep learning (DL) are advanced machine learning techniques designed to handle and model complex patterns and relationships within large datasets. These techniques are particularly effective in environments where the relationships between inputs and outputs are non-linear and where the data involves a high degree of interconnectivity and complexity. This makes NNs and DL ideal for tasks such as image and speech recognition, and natural language processing, where the input data is multi-dimensional and rich in hierarchical features. B is incorrect. Neural networks and deep learning are generally considered overkill for simple tasks such as developing single variable ordinary least squares regression models. Ordinary least squares regression involving a single variable is a straightforward statistical method that models the relationship between two variables by fitting a linear equation to observed data. The simplicity of this task does not require the sophisticated architecture of NNs or DL, as these techniques are designed to uncover complex patterns and interactions in large datasets. Using NNs and DL for such a simple regression would not only be inefficient in terms of computational resources but also could lead to model overfitting, where the model learns the noise in the training data as if it were a signal, thus performing poorly on new, unseen data. A is incorrect. Neural networks and deep learning are exceptionally well-suited for tasks like image and speech recognition, and natural language processing. These areas benefit from NNs and DL because they involve analyzing and processing large and complex datasets with many variables and intricate structures. For instance, in image recognition, NNs can identify and differentiate patterns and features in images, such as edges and shapes, which are crucial for recognizing objects. Similarly, in natural language processing, DL can understand and generate human language by learning from vast amounts of text data, capturing nuances that simpler models might miss. C is incorrect. The strength of neural networks and deep learning lies in their ability to model non-linearity and complex interactions among a large number of features, which is essential in many real-world applications. For example, in financial modeling, stock market prediction, or advanced robotics, these models can capture and analyze the relationships between various inputs that are not apparent through traditional linear models. This capability allows NNs and DL to provide more accurate predictions and insights in scenarios where the underlying patterns are highly complex and interconnected. ", "explhtml": "<p>Neural networks (NNs) and deep learning (DL) are advanced machine learning techniques designed to handle and model complex patterns and relationships within large datasets. These techniques are particularly effective in environments where the relationships between inputs and outputs are non-linear and where the data involves a high degree of interconnectivity and complexity. This makes NNs and DL ideal for tasks such as image and speech recognition, and natural language processing, where the input data is multi-dimensional and rich in hierarchical features.<\/p><p><b>B is incorrect<\/b>. Neural networks and deep learning are generally considered overkill for simple tasks such as developing single variable ordinary least squares regression models. Ordinary least squares regression involving a single variable is a straightforward statistical method that models the relationship between two variables by fitting a linear equation to observed data. The simplicity of this task does not require the sophisticated architecture of NNs or DL, as these techniques are designed to uncover complex patterns and interactions in large datasets. Using NNs and DL for such a simple regression would not only be inefficient in terms of computational resources but also could lead to model overfitting, where the model learns the noise in the training data as if it were a signal, thus performing poorly on new, unseen data.<\/p><p><b>A is incorrect<\/b>. Neural networks and deep learning are exceptionally well-suited for tasks like image and speech recognition, and natural language processing. These areas benefit from NNs and DL because they involve analyzing and processing large and complex datasets with many variables and intricate structures. For instance, in image recognition, NNs can identify and differentiate patterns and features in images, such as edges and shapes, which are crucial for recognizing objects. Similarly, in natural language processing, DL can understand and generate human language by learning from vast amounts of text data, capturing nuances that simpler models might miss.<\/p><p><b>C is incorrect<\/b>. The strength of neural networks and deep learning lies in their ability to model non-linearity and complex interactions among a large number of features, which is essential in many real-world applications. For example, in financial modeling, stock market prediction, or advanced robotics, these models can capture and analyze the relationships between various inputs that are not apparent through traditional linear models. This capability allows NNs and DL to provide more accurate predictions and insights in scenarios where the underlying patterns are highly complex and interconnected. <\/p><p class=\"los\">Quantitative Methods, Learning Module 6: Machine Learning, LOS 6 ( e): Describe neural networks, deep learning nets, and reinforcement learning.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Peter Smith<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Peter Smith is a newly hired data analyst at ABC Investment Company. Smith is also an experienced stock market trader. Paul Adam is the CEO of ABC Investment Company. In a lunch meeting with Adams, Smith mentions that machine learning plays an integral role in the financial markets, specifically the stock markets. At the end of their discussion, Adams did not sound convinced about the possibility of accurately identifying stocks and trading them without human error and interference of personal sentiments to reap better returns. He based his argument on the reality that the stock market fluctuates randomly from day to day. In other words, he was not convinced about the predictive power and accuracy of machine learning.<\/p><p>To demonstrate the robust application of machine learning in stock markets, Smith decides to<\/p><p>launch a project to illustrate the ability of machine learning techniques to retrieve information<\/p><p>from past prices and predict price movement and future trends in the stock market. He wants to<\/p><p>convince Adams that to artificial intelligence and machine can help select top-performing stock<\/p><p>portfolios that outperform the stock market. This way, Smith positions himself to apply ML<\/p><p>techniques to refine ABC’s investment processes as time passes.<\/p><p>Smith focuses on a portfolio of Small-Cap Stocks that ABC Investment Company maintains that<\/p><p>trade on the London Stock Exchange (LSE). He chooses Small-Cap Stocks because he believes<\/p><p>that they have the most growth potential and would like to focus on one month&#x27;s short-term<\/p><p>trading. Since these stocks have a higher risk, he manages this risk by using financially healthy<\/p><p>stocks for trading. Since these stocks have a higher risk, he manages this risk by using<\/p><p>financially healthy stocks for trading.<\/p><p>Smith virtually traded the three top training stocks from March 2018 to April 2018. Similarly, he<\/p><p>virtually traded the three top training stocks from April 2018 to May 2018, and finally, he<\/p><p>virtually trades the three top training stocks from May 2018 to June 2018 to give substance to<\/p><p>the selection of good profitable stock portfolios and the consistent and reliable methodology.<\/p><p>He downloads historical daily stock data such as open, high, low, close, and volume from the<\/p><p>company’s website. Notably, he downloads a dataset of 2,000 stocks for the period of 30 January<\/p><p>2018 to 30 June 2019.<\/p><p>He combines technical and fundamental data using machine learning applications and a<\/p><p>proprietary trading method. His goal is to determine whether a data-driven machine learning<\/p><p>approach could be used to select good stocks that will outperform the stock market index.<\/p><p>Smith resolves to split the stocks into three portfolios. He employs three machine learning<\/p><p>models, including Logistic Regression, Decision Tree, and Neural Network, to identify top-<\/p><p>performing stock portfolios that outperform the stock market.<\/p><p>After training each model, Smith discovers that while they are good at correctly classifying using<\/p><p>the training sample, they perform poorly using new data. In consulting his colleague about this<\/p><p>issue, Smith hears conflicting explanations about what constitutes good generalization in an ML<\/p><p>model:<\/p><p><b>Statement 1<\/b><\/p><p>The model retains its explanatory power when predicting using new data<\/p><p><b>Statement 2<\/b><\/p><p>The model shows low explanatory power after training using training data<\/p><p><b>Statement 3<\/b><\/p><p>The model loses its explanatory power when predicting using new data In virtual stock trading,<\/p><p>each stock portfolio had an investment of $5,000, with each stock having almost $8,000 invested.<\/p><p>At the end of each month, he sells the stocks and computes the return on investment for the<\/p><p>portfolio. He then compares it with the stock market performance.<\/p><p>Smith compares the results for the virtual trading of the three stock portfolios, Neural Networks,<\/p><p>Decision Trees, and Logistic Regression, with the stock market performance. He finds out that<\/p><p>the decision tree portfolio outperformed the performance of the stock market. Nevertheless, the<\/p><p>Logistic Regression and Neural Network Model Portfolios were less than the market<\/p><p>performance but not significantly different from the market performance for all the three<\/p><p>periods, April 2019, May 2019, and June 2019.<\/p><p>Smith concludes that a data-driven approach could be used for selecting good Small-Cap stocks<\/p><p>that will outperform the stock market index. Further, machine learning models such as the<\/p><p>Logistic Regression, Decision Tree, and Neural Network were employed, and the experimental<\/p><p>results confirmed that these models are suitable for identifying top-performing stock portfolios<\/p><p>that exceed the stock market performance. In all the three consecutive periods, stock portfolio performance was positive.<\/p><p>Therefore, Smith convinces Adams that data-driven approaches such as machine learning<\/p><p>techniques can accurately predict which stocks are likely to increase. He also mentions<\/p><p>additional ways of applying ML techniques in investment processes, which he will be willing to<\/p><p>implement in ABC Investment Company with time.<\/p><p>Adams had attended multiple workshops on digital disruption and its implications, which were<\/p><p>mandatory to all the employees of the company. One of those workshops was on data science,<\/p><p>and he had grasped the concept of dimension reduction. However, Smith did not mention<\/p><p>dimension reduction when delivering a high-level presentation of his project. Adams was<\/p><p>concerned about this because he thought machine learning should revolve around dimension<\/p><p>reduction, a crucial concept.<\/p><\/div><\/details><div class=\"qtext\"><p>Smith has been brainstorming on the applications of neural networks (NNs) and deep learning (DL) to investment management. Which of the given statements is most likely to be incorrect:<\/p><\/div>", "subj": "quant"}, {"n": 49, "q": "The data that is shown for Ms. Tau and Mr. Rho, respectively, contain what is most likely to be described as:", "opts": ["Invalidity and duplication errors.", "Invalidity and incompleteness errors.", "Inaccuracy and duplication errors."], "ans": "A", "expl": "Ms. Tau's data exhibits an invalidity error, which is evident from the negative income value listed in the dataset. In financial datasets, income figures should logically be non-negative as they represent earnings, not debts. This negative value suggests a possible data entry error or misrepresentation, which can significantly impact the accuracy of any creditworthiness model that relies on income as a key variable. The presence of such an error necessitates thorough data cleansing to ensure that the model built by Patrick and his team at XYZ Bank accurately assesses borrower creditworthiness based on valid financial representations. B is incorrect. The option suggests that the errors are due to invalidity and incompleteness. While Ms. Tau's data indeed has an invalidity error, Mr. Rho's data does not exhibit incompleteness but rather duplication. Incompleteness would imply missing values or gaps in the data provided, which is not the case here. Mr. Rho's records are fully populated with data; however, the issue lies in the repeated entries under IDs 5 and 6, which leads to redundancy rather than incompleteness. This distinction is crucial for accurately diagnosing data quality issues and applying the appropriate data preprocessing techniques. C is incorrect. This option misidentifies the nature of the errors by suggesting inaccuracy and duplication. While duplication is correctly identified in Mr. Rho's case, inaccuracy is not applicable to the issues observed. Inaccuracy would involve incorrect data that does not reflect the true scenario, such as a wrong loan amount or misstated income that does not match reality but is still within a plausible range. Ms. Tau's negative income, however, is not just inaccurate but invalid, as it falls outside plausible financial data ranges, thus necessitating a different approach to correction during data preprocessing. ", "explhtml": "<p>Ms. Tau&#x27;s data exhibits an invalidity error, which is evident from the negative income value listed in the dataset. In financial datasets, income figures should logically be non-negative as they represent earnings, not debts. This negative value suggests a possible data entry error or misrepresentation, which can significantly impact the accuracy of any creditworthiness model that relies on income as a key variable. The presence of such an error necessitates thorough data cleansing to ensure that the model built by Patrick and his team at XYZ Bank accurately assesses borrower creditworthiness based on valid financial representations.<\/p><p><b>B is incorrect<\/b>. The option suggests that the errors are due to invalidity and incompleteness. While Ms. Tau&#x27;s data indeed has an invalidity error, Mr. Rho&#x27;s data does not exhibit incompleteness but rather duplication. Incompleteness would imply missing values or gaps in the data provided, which is not the case here. Mr. Rho&#x27;s records are fully populated with data; however, the issue lies in the repeated entries under IDs 5 and 6, which leads to redundancy rather than incompleteness. This distinction is crucial for accurately diagnosing data quality issues and applying the appropriate data preprocessing techniques.<\/p><p><b>C is incorrect<\/b>. This option misidentifies the nature of the errors by suggesting inaccuracy and duplication. While duplication is correctly identified in Mr. Rho&#x27;s case, inaccuracy is not applicable to the issues observed. Inaccuracy would involve incorrect data that does not reflect the true scenario, such as a wrong loan amount or misstated income that does not match reality but is still within a plausible range. Ms. Tau&#x27;s negative income, however, is not just inaccurate but invalid, as it falls outside plausible financial data ranges, thus necessitating a different approach to correction during data preprocessing. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects, LOS 7(b): Describe objectives, steps, and examples of preparing and wrangling data<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Billie Beth<\/summary><div class=\"vig-body\"><p>Billie Beth is the credit manager at XYZ Bank. Beth assigns John Patrick, the bank’s data scientist, a project of building the bank’s first machine learning model for classifying prospective borrowers’ creditworthiness. Patrick decides to follow a phased approach beginning with traditional (structured) data sources and then eventually incorporating textual (unstructured) big data sources.<\/p><p>Patrick asks Paul Jones, one of the work experience interns, who has a solid background in data<\/p><p>science, to perform a preliminary assessment of the data cleansing and preprocessing tasks to be<\/p><p>carried out for the project. Jones pulls the following sample of data for manual examination,<\/p><p>which he brings to Patrick to discuss.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0112.webp\" style=\"max-width:min(100%,601px)\" alt=\"Table 1: Sample of Raw Structured Data before Cleansing ID Name Gender Income Loan Loan Loan Amount Outcome Type 1 Ms. Phi F 100,000 47, 500 No default Car 2 Mr. Psi M 80, 000 Unknown No default Student loan 3 Ms. Tau F −60,000 14, 000 No default Mortgage 4 Mr. Epsilon F 70, 000 30, 000 Defaulted Ca\"><p>During the discussion, Jones makes the following suggestions:<\/p><p><b>Suggestion 1:<\/b><\/p><p>“Let us keep the ID column and remove the column for Name from the dataset.”<\/p><p><b>Suggestion 2:<\/b><\/p><p>“Let us create a new feature, “Loan Amount as a percentage of income,” to use as an additional<\/p><p>feature.<\/p><p>Having reviewed the initial data preparation and wrangling processes related to the ML building<\/p><p>project, Patrick further asks Jones to investigate the available structured data sources to see<\/p><p>what types of exploratory data analysis might make sense. Jones must report to Patrick on high-<\/p><p>level patterns and trends in the data and the variables that seem interesting. Greater situational awareness about the data can inform the team’s decisions regarding model training and whether<\/p><p>to incorporate big textual data in conjunction with the structured data inputs. Jones pulls the<\/p><p>following file from XYZ’s database.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0113.webp\" style=\"max-width:min(100%,698px)\" alt=\"Table 2: Textual Feature Representation for ML Building I Salary Loan Loan Loan Credit Free Responses to  D ($) Amount Outcome Type Score explain credit score ($) 1 100, 000 47, 500 No default Car 800 I have a perfect credit  score. I have a payment plan which I stick to. This helps me maintain such\"><p>Jones first focuses on the textual data, i.e., free responses. He begins by cleansing the raw text<\/p><p>data. Jones performs this by eliminating punctuations, and extra white spaces from the data<\/p><p>before normalizing it. He then divides the cleansed data into a collection of words, normalizes it,<\/p><p>and create a distinct set of tokens from the normalized words. In the next step, Jones performs<\/p><p>exploratory data analysis followed by feature selection of the most interesting features to report<\/p><p>to Patrick.<\/p><p>Patrick then analyzes the visualization created by Jones, identifies and eliminates tokens that are<\/p><p>likely to be noise features for ML model training. Patrick stresses the importance of feature<\/p><p>selection and feature engineering in ML model training. He tells Jones: “Suitable feature<\/p><p>selection is a key factor in minimizing model overfitting, whereas feature engineering prevents<\/p><p>model underfitting.”<\/p><p>Patrick then picks out and runs a model on the training set that classifies the text as having<\/p><p>either a positive sentiment (Class “1” or negative sentiment (Class “0”). He then evaluates its<\/p><p>performance using error analysis. The resulting confusion matrix is as shown below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0114.webp\" style=\"max-width:min(100%,433px)\" alt=\"Table 3: Confusion Matrix Actual Training Labels Class “1.” Class “0.” Predicted Results Class “1” TP = 164 FP = 57 Class “0” FN =28  TN = 108\"><\/div><\/details><div class=\"qtext\"><p>The data that is shown for Ms. Tau and Mr. Rho, respectively, contain what is most likely to be described as:<\/p><\/div>", "subj": "quant"}, {"n": 50, "q": "The processes that Jones mention in the first and second suggestions, respectively, are most likely:", "opts": ["Feature selection and feature extraction", "Feature extraction and feature engineering", "Feature selection and feature engineering"], "ans": "C", "expl": "This is determined by analyzing the specific nature of Jones's two suggestions. His first suggestion to remove the \"Name\" column while keeping the \"ID\" column is a clear example of feature selection. This process involves selecting a subset of relevant existing features for model training. In this case, \"Name\" is likely removed due to its irrelevance for predictive analysis and privacy concerns. His second suggestion to create a new \"Loan Amount as a percentage of income\" feature is a classic example of feature engineering. This process involves using domain knowledge to create new, more informative features from existing ones. Here, it combines \"Loan Amount\" and \"Income\" to potentially better capture a borrower's debt burden. A is incorrect. This option is incorrect because the second suggestion is not feature extraction. Feature Extraction is a specific technique that transforms a large set of raw data (often high-dimensional) into a smaller, more manageable set of features while retaining most of the essential information. Common examples include Principal Component Analysis (PCA) for numerical data or converting text into a numerical vector (e.g., using TF-IDF or word embeddings). Jones's action of creating a single, human-interpretable feature (\"Loan Amount as a percentage of income\") from existing features is an act of feature engineering, not the dimensionality reduction or automated transformation characteristic of feature extraction. B is incorrect. Feature extraction involves creating new data points from existing ones, which is not what is being described in the first suggestion. While the second suggestion does involve creating a new feature (\"Loan Amount as a percentage of income\"), this is a transformation of existing data rather than the extraction of additional data from external sources or derived datasets. Feature extraction would involve more complex processes such as dimensionality reduction techniques or deriving new variables by combining existing variables in a non-linear way, which is not the case here. ", "explhtml": "<p>This is determined by analyzing the specific nature of Jones&#x27;s two suggestions. His first suggestion to remove the &quot;Name&quot; column while keeping the &quot;ID&quot; column is a clear example of feature selection. This process involves selecting a subset of relevant existing features for model training. In this case, &quot;Name&quot; is likely removed due to its irrelevance for predictive analysis and privacy concerns. His second suggestion to create a new &quot;Loan Amount as a percentage of income&quot; feature is a classic example of feature engineering. This process involves using domain knowledge to create new, more informative features from existing ones. Here, it combines &quot;Loan Amount&quot; and &quot;Income&quot; to potentially better capture a borrower&#x27;s debt burden.<\/p><p><b>A is incorrect<\/b>. This option is incorrect because the second suggestion is not feature extraction. Feature Extraction is a specific technique that transforms a large set of raw data (often high-dimensional) into a smaller, more manageable set of features while retaining most of the essential information. Common examples include Principal Component Analysis (PCA) for numerical data or converting text into a numerical vector (e.g., using TF-IDF or word embeddings). Jones&#x27;s action of creating a single, human-interpretable feature (&quot;Loan Amount as a percentage of income&quot;) from existing features is an act of feature engineering, not the dimensionality reduction or automated transformation characteristic of feature extraction.<\/p><p><b>B is incorrect<\/b>. Feature extraction involves creating new data points from existing ones, which is not what is being described in the first suggestion. While the second suggestion does involve creating a new feature (&quot;Loan Amount as a percentage of income&quot;), this is a transformation of existing data rather than the extraction of additional data from external sources or derived datasets. Feature extraction would involve more complex processes such as dimensionality reduction techniques or deriving new variables by combining existing variables in a non-linear way, which is not the case here. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects, LOS 7(f): Describe methods for extracting, selecting and engineering features from textual data<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Billie Beth<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Billie Beth is the credit manager at XYZ Bank. Beth assigns John Patrick, the bank’s data scientist, a project of building the bank’s first machine learning model for classifying prospective borrowers’ creditworthiness. Patrick decides to follow a phased approach beginning with traditional (structured) data sources and then eventually incorporating textual (unstructured) big data sources.<\/p><p>Patrick asks Paul Jones, one of the work experience interns, who has a solid background in data<\/p><p>science, to perform a preliminary assessment of the data cleansing and preprocessing tasks to be<\/p><p>carried out for the project. Jones pulls the following sample of data for manual examination,<\/p><p>which he brings to Patrick to discuss.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0112.webp\" style=\"max-width:min(100%,601px)\" alt=\"Table 1: Sample of Raw Structured Data before Cleansing ID Name Gender Income Loan Loan Loan Amount Outcome Type 1 Ms. Phi F 100,000 47, 500 No default Car 2 Mr. Psi M 80, 000 Unknown No default Student loan 3 Ms. Tau F −60,000 14, 000 No default Mortgage 4 Mr. Epsilon F 70, 000 30, 000 Defaulted Ca\"><p>During the discussion, Jones makes the following suggestions:<\/p><p><b>Suggestion 1:<\/b><\/p><p>“Let us keep the ID column and remove the column for Name from the dataset.”<\/p><p><b>Suggestion 2:<\/b><\/p><p>“Let us create a new feature, “Loan Amount as a percentage of income,” to use as an additional<\/p><p>feature.<\/p><p>Having reviewed the initial data preparation and wrangling processes related to the ML building<\/p><p>project, Patrick further asks Jones to investigate the available structured data sources to see<\/p><p>what types of exploratory data analysis might make sense. Jones must report to Patrick on high-<\/p><p>level patterns and trends in the data and the variables that seem interesting. Greater situational awareness about the data can inform the team’s decisions regarding model training and whether<\/p><p>to incorporate big textual data in conjunction with the structured data inputs. Jones pulls the<\/p><p>following file from XYZ’s database.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0113.webp\" style=\"max-width:min(100%,698px)\" alt=\"Table 2: Textual Feature Representation for ML Building I Salary Loan Loan Loan Credit Free Responses to  D ($) Amount Outcome Type Score explain credit score ($) 1 100, 000 47, 500 No default Car 800 I have a perfect credit  score. I have a payment plan which I stick to. This helps me maintain such\"><p>Jones first focuses on the textual data, i.e., free responses. He begins by cleansing the raw text<\/p><p>data. Jones performs this by eliminating punctuations, and extra white spaces from the data<\/p><p>before normalizing it. He then divides the cleansed data into a collection of words, normalizes it,<\/p><p>and create a distinct set of tokens from the normalized words. In the next step, Jones performs<\/p><p>exploratory data analysis followed by feature selection of the most interesting features to report<\/p><p>to Patrick.<\/p><p>Patrick then analyzes the visualization created by Jones, identifies and eliminates tokens that are<\/p><p>likely to be noise features for ML model training. Patrick stresses the importance of feature<\/p><p>selection and feature engineering in ML model training. He tells Jones: “Suitable feature<\/p><p>selection is a key factor in minimizing model overfitting, whereas feature engineering prevents<\/p><p>model underfitting.”<\/p><p>Patrick then picks out and runs a model on the training set that classifies the text as having<\/p><p>either a positive sentiment (Class “1” or negative sentiment (Class “0”). He then evaluates its<\/p><p>performance using error analysis. The resulting confusion matrix is as shown below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0114.webp\" style=\"max-width:min(100%,433px)\" alt=\"Table 3: Confusion Matrix Actual Training Labels Class “1.” Class “0.” Predicted Results Class “1” TP = 164 FP = 57 Class “0” FN =28  TN = 108\"><\/div><\/details><div class=\"qtext\"><p>The processes that Jones mention in the first and second suggestions, respectively, are most likely:<\/p><\/div>", "subj": "quant"}, {"n": 51, "q": "Based on Table 3, the model’s F1 score is most likely:", "opts": ["0.74", "0.76", "0.79"], "ans": "C", "expl": "The F1 score is a harmonic mean of precision and recall, providing a balance between these two metrics. It is particularly useful when the class distribution is uneven. Precision is the ratio of true positives to the sum of true and false positives, indicating the accuracy of positive predictions. Recall, or sensitivity, measures the ability of a model to find all relevant cases (true positives) within a dataset. In this scenario, the precision (P) is calculated as follows: Recall (R) is calculated by: The F1 score is then calculated using the formula: A is incorrect. The value given in option A is 0.74, which is actually the calculated precision, not the F1 score. The F1 score considers both precision and recall for its calculation, leading to a higher value than just precision alone, thus making option A incorrect. B is incorrect. It suggests an F1 score of 0.76, which is lower than the calculated F1 score of approximately 0.79. This discrepancy indicates that option B underestimates the balance between precision and recall achieved by the model, thus making it an incorrect choice. ", "explhtml": "<p>The F1 score is a harmonic mean of precision and recall, providing a balance between these two metrics. It is particularly useful when the class distribution is uneven. Precision is the ratio of true positives to the sum of true and false positives, indicating the accuracy of positive predictions. Recall, or sensitivity, measures the ability of a model to find all relevant cases (true positives) within a dataset.<\/p><p>In this scenario, the precision (P) is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0115.webp\" style=\"max-width:min(100%,418px)\" alt=\"TP 164 Precision (P) = TP + FP = 164 + 57 = 0.742 or 74.2%\"><p>Recall (R) is calculated by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0116.webp\" style=\"max-width:min(100%,397px)\" alt=\"TP 164 Recall (R) = TP + FN = 164 + 28 = 0.854 or 85.4%\"><p>The F1 score is then calculated using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0117.webp\" style=\"max-width:min(100%,530px)\" alt=\"Precision × Recall 0.742 × 0.854 F1 score = 2 × Precision + Recall = 2 × 0.742 + 0.854 = 0.794 or 79.4%\"><p><b>A is incorrect<\/b>. The value given in option A is 0.74, which is actually the calculated precision, not the F1 score. The F1 score considers both precision and recall for its calculation, leading to a higher value than just precision alone, thus making option A incorrect.<\/p><p><b>B is incorrect<\/b>. It suggests an F1 score of 0.76, which is lower than the calculated F1 score of approximately 0.79. This discrepancy indicates that option B underestimates the balance between precision and recall achieved by the model, thus making it an incorrect choice. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects, LOS 7(g): Evaluate the fit of a machine learning algorithm<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Billie Beth<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Billie Beth is the credit manager at XYZ Bank. Beth assigns John Patrick, the bank’s data scientist, a project of building the bank’s first machine learning model for classifying prospective borrowers’ creditworthiness. Patrick decides to follow a phased approach beginning with traditional (structured) data sources and then eventually incorporating textual (unstructured) big data sources.<\/p><p>Patrick asks Paul Jones, one of the work experience interns, who has a solid background in data<\/p><p>science, to perform a preliminary assessment of the data cleansing and preprocessing tasks to be<\/p><p>carried out for the project. Jones pulls the following sample of data for manual examination,<\/p><p>which he brings to Patrick to discuss.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0112.webp\" style=\"max-width:min(100%,601px)\" alt=\"Table 1: Sample of Raw Structured Data before Cleansing ID Name Gender Income Loan Loan Loan Amount Outcome s<\/p><p>exploratory data analysis followed by feature selection of the most interesting features to report<\/p><p>to Patrick.<\/p><p>Patrick then analyzes the visualization created by Jones, identifies and eliminates tokens that are<\/p><p>likely to be noise features for ML model training. Patrick stresses the importance of feature<\/p><p>selection and feature engineering in ML model training. He tells Jones: “Suitable feature<\/p><p>selection is a key factor in minimizing model overfitting, whereas feature engineering prevents<\/p><p>model underfitting.”<\/p><p>Patrick then picks out and runs a model on the training set that classifies the text as having<\/p><p>either a positive sentiment (Class “1” or negative sentiment (Class “0”). He then evaluates its<\/p><p>performance using error analysis. The resulting confusion matrix is as shown below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0114.webp\" style=\"max-width:min(100%,433px)\" alt=\"Table 3: Confusion Matrix Actual Training Labels Class “1.” Class “0.” Predicted Results Class “1” TP = 164 FP = 57 Class “0” FN =28  TN = 108\"><\/div><\/details><div class=\"qtext\"><p>Based on Table 3, the model’s F1 score is most likely:<\/p><\/div>", "subj": "quant"}, {"n": 52, "q": "Based on Table 3, the model’s accuracy metric is most likely:", "opts": ["0.74", "0.76", "0.85"], "ans": "B", "expl": "The accuracy of a model is calculated by the formula: where TP represents true positives, TN represents true negatives, FP represents false positives, and FN represents false negatives. In the context of the provided confusion matrix, the values are TP = 164, TN = 108, FP = 57, and FN = 28. Plugging these values into the formula gives: This calculation confirms that the model's accuracy is approximately 76%, which corresponds to option B. A is incorrect. It suggests an accuracy of 0.74. This is incorrect as the actual calculation based on the confusion matrix data (TP = 164, TN = 108, FP = 57, FN = 28) results i
