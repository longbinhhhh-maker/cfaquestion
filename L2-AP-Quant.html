<\/b>. It suggests an accuracy of 0.85. This value is significantly higher than the calculated accuracy of 0.76. To achieve an accuracy of 0.85, the sum of TP and TN would need to be much higher relative to the sum of FP and FN than what is presented in the confusion matrix. This discrepancy indicates that the model does not perform as well as option C suggests, making this option incorrect based on the actual data provided. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects, LOS 7(g): Evaluate the fit of a machine learning algorithm<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Billie Beth<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Billie Beth is the credit manager at XYZ Bank. Beth assigns John Patrick, the bank’s data scientist, a project of building the bank’s first machine learning model for classifying prospective borrowers’ creditworthiness. Patrick decides to follow a phased approach beginning with traditional (structured) data sources and then eventually incorporating textual (unstructured) big data sources.<\/p><p>Patrick asks Paul Jones, one of the work experience interns, who has a solid background in data<\/p><p>science, to perform a preliminary assessment of the data cleansing and preprocessing tasks to be<\/p><p>carried out for the project. Jones pulls the following sample of data for manual examination,<\/p><p>which he brings to Patrick to discuss.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0112.webp\" style=\"max-width:min(100%,601px)\" alt=\"Table 1: Sample of Raw Structured Data before Cleansing ID Name Gender Income Loan Loan Loan Amount Outcome Type 1 Ms. Phi F 100,000 47, 500 No default Car 2 Mr. Psi M 80, 000 Unknown No default Student loan 3 Ms. Tau F −60,000 14, 000 No default Mortgage 4 Mr. Epsilon F 70, 000 30, 000 Defaulted Ca\"><p>During the discussion, Jones makes the following suggestions:<\/p><p><b>Suggestion 1:<\/b><\/p><p>“Let us keep the ID column and remove the column for Name from the dataset.”<\/p><p><b>Suggestion 2:<\/b><\/p><p>“Let us create a new feature, “Loan Amount as a percentage of income,” to use as an additional<\/p><p>feature.<\/p><p>Having reviewed the initial data preparation and wrangling processes related to the ML building<\/p><p>project, Patrick further asks Jones to investigate the available structured data sources to see<\/p><p>what types of exploratory data analysis might make sense. Jones must report to Patrick on high-<\/p><p>level patterns and trends in the data and the variables that seem interesting. Greater situational awareness about the data can inform the team’s decisions regarding model training and whether<\/p><p>to incorporate big textual data in conjunction with the structured data inputs. Jones pulls the<\/p><p>following file from XYZ’s database.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0113.webp\" style=\"max-width:min(100%,698px)\" alt=\"Table 2: Textual Feature Representation for ML Building I Salary Loan Loan Loan Credit Free Responses to  D ($) Amount Outcome Type Score explain credit score ($) 1 100, 000 47, 500 No default Car 800 I have a perfect credit  score. I have a payment plan which I stick to. This helps me maintain such\"><p>Jones first focuses on the textual data, i.e., free responses. He begins by cleansing the raw text<\/p><p>data. Jones performs this by eliminating punctuations, and extra white spaces from the data<\/p><p>before normalizing it. He then divides the cleansed data into a collection of words, normalizes it,<\/p><p>and create a distinct set of tokens from the normalized words. In the next step, Jones performs<\/p><p>exploratory data analysis followed by feature selection of the most interesting features to report<\/p><p>to Patrick.<\/p><p>Patrick then analyzes the visualization created by Jones, identifies and eliminates tokens that are<\/p><p>likely to be noise features for ML model training. Patrick stresses the importance of feature<\/p><p>selection and feature engineering in ML model training. He tells Jones: “Suitable feature<\/p><p>selection is a key factor in minimizing model overfitting, whereas feature engineering prevents<\/p><p>model underfitting.”<\/p><p>Patrick then picks out and runs a model on the training set that classifies the text as having<\/p><p>either a positive sentiment (Class “1” or negative sentiment (Class “0”). He then evaluates its<\/p><p>performance using error analysis. The resulting confusion matrix is as shown below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0114.webp\" style=\"max-width:min(100%,433px)\" alt=\"Table 3: Confusion Matrix Actual Training Labels Class “1.” Class “0.” Predicted Results Class “1” TP = 164 FP = 57 Class “0” FN =28  TN = 108\"><\/div><\/details><div class=\"qtext\"><p>Based on Table 3, the model’s accuracy metric is most likely:<\/p><\/div>", "subj": "quant"}, {"n": 53, "q": "In the exploratory data analysis step, which visualization is Khan most likely to consider suitable depending on her objective:", "opts": ["Document term matrix.", "Scatter plot.", "Word cloud."], "ans": "C", "expl": "Khan's primary goal in the exploratory data analysis step is to identify and visualize the most informative words in the dataset based on their term frequency (TF) values. A word cloud is particularly suited for this purpose because it visually represents text data with the size of each word proportional to its frequency. This makes it easier to identify the most common words at a glance, which are likely the most informative in the context of the dataset. Additionally, word clouds can be customized with colors and orientations, which can represent different dimensions of data, such as word length or part of speech, providing a richer visual analysis. A is incorrect. A document term matrix, while useful in text analysis, primarily serves as a structured tabular format to represent the frequency of terms in the document corpus. It is not inherently a visualization tool but rather a way to organize data, which can then be used for further analysis or as input for machine learning algorithms. The matrix format does not facilitate immediate visual interpretation of the data in terms of identifying the most informative or frequent terms, as it does not provide any visual emphasis on term frequency or importance. B is incorrect. Scatter plots are generally used for visualizing relationships between two numerical variables, allowing for the observation of how one variable is affected by another. In the context of text analysis, especially when the objective is to visualize term frequencies, scatter plots are not suitable. They do not provide a clear method for representing textual data where the primary interest is in the frequency and prominence of individual terms. Scatter plots are better suited for structured, continuous data and are less effective for the categorical and textual nature of the data in this scenario. ", "explhtml": "<p>Khan&#x27;s primary goal in the exploratory data analysis step is to identify and visualize the most informative words in the dataset based on their term frequency (TF) values. A word cloud is particularly suited for this purpose because it visually represents text data with the size of each word proportional to its frequency. This makes it easier to identify the most common words at a glance, which are likely the most informative in the context of the dataset. Additionally, word clouds can be customized with colors and orientations, which can represent different dimensions of data, such as word length or part of speech, providing a richer visual analysis.<\/p><p><b>A is incorrect<\/b>. A document term matrix, while useful in text analysis, primarily serves as a structured tabular format to represent the frequency of terms in the document corpus. It is not inherently a visualization tool but rather a way to organize data, which can then be used for further analysis or as input for machine learning algorithms. The matrix format does not facilitate immediate visual interpretation of the data in terms of identifying the most informative or frequent terms, as it does not provide any visual emphasis on term frequency or importance.<\/p><p><b>B is incorrect<\/b>. Scatter plots are generally used for visualizing relationships between two numerical variables, allowing for the observation of how one variable is affected by another. In the context of text analysis, especially when the objective is to visualize term frequencies, scatter plots are not suitable. They do not provide a clear method for representing textual data where the primary interest is in the frequency and prominence of individual terms. Scatter plots are better suited for structured, continuous data and are less effective for the categorical and textual nature of the data in this scenario. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(b): Describe objectives, methods, and examples of data exploration;<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Aditya Khan<\/summary><div class=\"vig-body\"><p>Aditya Khan is a junior data scientist based in the New York City (NYC) headquarters office of the investment firm in the previous case. Nadia Rahma supervises Khan. Rahma instructs Khan to handle the big data step of the impact model building. The impact model predicts whether the companies&#x27; stock prices in the S&amp;P 500 index, listed on the New York Stock Exchange (NYSE), significantly diverge due to press releases.<\/p><p>Khan employs Press Release Crawler to populate the database, using Rich Site Summary (RSS)<\/p><p>feeds to collect news articles. Almost all press releases name the company symbol in the format<\/p><p>(Exchange, Symbol). He filters the company symbol and tags the press releases with the<\/p><p>corresponding company using a regular expression. He also mines the stock prices using the<\/p><p>stock price crawler, passing a CSV file containing all companies traded at NYSE. The data has<\/p><p>fields such as symbol, company, Last Sale, Market Cap, IPO year, Sector, Industry, Summary, etc.<\/p><p>The crawler then iterates over all stock symbols and downloads the previous week’s stock prices<\/p><p>from the Google stock API endpoint for each iteration. The result is then dumped into a CSV file.<\/p><p>The press release crawler provides HTML, which requires preprocessing. First, he extracts the<\/p><p>text from the HTML code. He then performs text cleansing to the raw text. Afterward, he applies<\/p><p>the following preprocessing steps to the corpus to pass the result to other machine learning<\/p><p>algorithms. These preprocessing steps are:<\/p><p>1. Tokenization 2. Lowercasing the alphabet 3. Removal of stop words and punctuation 4. Part-of-speech tagging 5. Lemmatization<\/p><p>Since he cannot pass press releases directly to the machine learning algorithms, Khan<\/p><p>transforms them into a vector representation by creating a distinct set of tokens from the<\/p><p>normalized words.<\/p><p>Khan then performs exploratory data analysis. He creates a visualization that shows the most<\/p><p>informative words in the dataset based on their term frequency (TF) values. After creating and<\/p><p>analyzing the visualization, Khan is concerned that some tokens are likely to be noise features<\/p><p>for ML model training; therefore, He wants to remove them.<\/p><p>Once satisfied with the final set of features, Khan applies the CART algorithm to address the<\/p><p>classification problem on the training set. This algorithm classifies the text as having an impact<\/p><p>(Class “1” or no impact (Class “0”).<\/p><p>After training his model, Khan discovers that while it is good at correctly classifying using the in-<\/p><p>sample, it does not perform well using new data. He then evaluates its performance using error<\/p><p>analysis. The resulting confusion matrix is presented in the table below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0120.webp\" style=\"max-width:min(100%,384px)\" alt=\"Prediction Outcome Class &quot;1&quot; Class &quot;0&quot; Actual Value Class &quot;1&quot; TP = 90 FN = 17 Class &quot;0&quot; FP =28 TN = 79\"><p>Khan also plans to employ a neural network algorithm to compare the model performance with<\/p><p>the CART algorithm.<\/p><\/div><\/details><div class=\"qtext\"><p>In the exploratory data analysis step, which visualization is Khan most likely to consider suitable depending on her objective:<\/p><\/div>", "subj": "quant"}, {"n": 54, "q": "Based on the confusion matrix, the model’s precision and recall, respectively, is most likely:", "opts": ["76% and 84%", "76% and 79%", "80% and 84%"], "ans": "A", "expl": "To determine the precision and recall of Khan's model from the provided confusion matrix, we need to use the formulas for precision and recall. Precision is calculated as the ratio of true positives (TP) to the sum of true positives and false positives (FP). This measures the accuracy of the positive predictions made by the model. In this case, the precision calculation is: This indicates that 76% of the instances predicted as Class \"1\" by the model were indeed Class \"1\". Recall (R), also known as sensitivity, measures the model's ability to identify all actual positives. It is calculated as the ratio of true positives to the sum of true positives and false negatives (FN). The recall calculation for Khan's model is: This indicates that the model successfully identified 84% of all actual Class \"1\" instances. B is incorrect. It suggests the recall is 79%, which does not align with the calculations based on the confusion matrix. The recall calculation, as shown above, results in approximately 84%, not 79%. This discrepancy indicates a misunderstanding or misinterpretation of the confusion matrix data. The correct recall calculation clearly shows that the model identifies 84% of actual positives, not 79%. C is incorrect. It suggests a precision of 80%, which is incorrect as per the calculations derived from the confusion matrix. The precision, as calculated, is approximately 76%, not 80%. This error could stem from an incorrect summation of TP and FP or a simple miscalculation. Precision is critical in evaluating how many of the predicted positive cases were actually positive, and in this scenario, the model's precision is lower than what is suggested in option C. ", "explhtml": "<p>To determine the precision and recall of Khan&#x27;s model from the provided confusion matrix, we need to use the formulas for precision and recall. Precision is calculated as the ratio of true positives (TP) to the sum of true positives and false positives (FP). This measures the accuracy of the positive predictions made by the model. In this case, the precision calculation is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0121.webp\" style=\"max-width:min(100%,518px)\" alt=\"TP 90 Precision (P) = TP + FP = 90 + 28 = 0.7627 or approximately 76%\"><p>This indicates that 76% of the instances predicted as Class &quot;1&quot; by the model were indeed Class &quot;1&quot;.<\/p><p><b>Recall (R)<\/b>, also known as sensitivity, measures the model&#x27;s ability to identify all actual positives. It is calculated as the ratio of true positives to the sum of true positives and false negatives (FN). The recall calculation for Khan&#x27;s model is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0122.webp\" style=\"max-width:min(100%,497px)\" alt=\"TP 90 Recall (R) = TP + FN = 90 + 17 = 0.8411 or approximately 84%\"><p>This indicates that the model successfully identified 84% of all actual Class &quot;1&quot; instances.<\/p><p><b>B is incorrect<\/b>. It suggests the recall is 79%, which does not align with the calculations based on the confusion matrix. The recall calculation, as shown above, results in approximately 84%, not 79%. This discrepancy indicates a misunderstanding or misinterpretation of the confusion matrix data. The correct recall calculation clearly shows that the model identifies 84% of actual positives, not 79%.<\/p><p><b>C is incorrect<\/b>. It suggests a precision of 80%, which is incorrect as per the calculations derived from the confusion matrix. The precision, as calculated, is approximately 76%, not 80%. This error could stem from an incorrect summation of TP and FP or a simple miscalculation. Precision is critical in evaluating how many of the predicted positive cases were actually positive, and in this scenario, the model&#x27;s precision is lower than what is suggested in option C. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(g) Evaluate the fit of a machine learning algorithm<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Aditya Khan<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Aditya Khan is a junior data scientist based in the New York City (NYC) headquarters office of the investment firm in the previous case. Nadia Rahma supervises Khan. Rahma instructs Khan to handle the big data step of the impact model building. The impact model predicts whether the companies&#x27; stock prices in the S&amp;P 500 index, listed on the New York Stock Exchange (NYSE), significantly diverge due to press releases.<\/p><p>Khan employs Press Release Crawler to populate the database, using Rich Site Summary (RSS)<\/p><p>feeds to collect news articles. Almost all press releases name the company symbol in the format<\/p><p>(Exchange, Symbol). He filters the company symbol and tags the press releases with the<\/p><p>corresponding company using a regular expression. He also mines the stock prices using the<\/p><p>stock price crawler, passing a CSV file containing all companies traded at NYSE. The data has<\/p><p>fields such as symbol, company, Last Sale, Market Cap, IPO year, Sector, Industry, Summary, etc.<\/p><p>The crawler then iterates over all stock symbols and downloads the previous week’s stock prices<\/p><p>from the Google stock API endpoint for each iteration. The result is then dumped into a CSV file.<\/p><p>The press release crawler provides HTML, which requires preprocessing. First, he extracts the<\/p><p>text from the HTML code. He then performs text cleansing to the raw text. Afterward, he applies<\/p><p>the following preprocessing steps to the corpus to pass the result to other machine learning<\/p><p>algorithms. These preprocessing steps are:<\/p><p>1. Tokenization 2. Lowercasing the alphabet 3. Removal of stop words and punctuation 4. Part-of-speech tagging 5. Lemmatization<\/p><p>Since he cannot pass press releases directly to the machine learning algorithms, Khan<\/p><p>transforms them into a vector representation by creating a distinct set of tokens from the<\/p><p>normalized words.<\/p><p>Khan then performs exploratory data analysis. He creates a visualization that shows the most<\/p><p>informative words in the dataset based on their term frequency (TF) values. After creating and<\/p><p>analyzing the visualization, Khan is concerned that some tokens are likely to be noise features<\/p><p>for ML model training; therefore, He wants to remove them.<\/p><p>Once satisfied with the final set of features, Khan applies the CART algorithm to address the<\/p><p>classification problem on the training set. This algorithm classifies the text as having an impact<\/p><p>(Class “1” or no impact (Class “0”).<\/p><p>After training his model, Khan discovers that while it is good at correctly classifying using the in-<\/p><p>sample, it does not perform well using new data. He then evaluates its performance using error<\/p><p>analysis. The resulting confusion matrix is presented in the table below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0120.webp\" style=\"max-width:min(100%,384px)\" alt=\"Prediction Outcome Class &quot;1&quot; Class &quot;0&quot; Actual Value Class &quot;1&quot; TP = 90 FN = 17 Class &quot;0&quot; FP =28 TN = 79\"><p>Khan also plans to employ a neural network algorithm to compare the model performance with<\/p><p>the CART algorithm.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the confusion matrix, the model’s precision and recall, respectively, is most likely:<\/p><\/div>", "subj": "quant"}, {"n": 55, "q": "Based on the confusion matrix, the model’s F1score and accuracy, respectively, are most likely:", "opts": ["76% and 79%", "80% and 79%", "80% and 76%"], "ans": "B", "expl": "The correct answer is option B, which states that the model's F1 score and accuracy are 80% and 79%, respectively. To understand why this is the correct answer, we need to calculate both the F1 score and the accuracy from the provided confusion matrix. The F1 score is a harmonic mean of precision and recall, calculated as follows: The accuracy of the model is calculated by summing the true positives and true negatives and dividing by the total number of cases: A is incorrect. It suggests that the F1 score and accuracy are 76% and 79%, respectively. However, the calculation of the F1 score from the confusion matrix yields an F1 score of 80%, not 76%. The accuracy part of the answer is correct at 79%, but the F1 score is incorrect, making option A incorrect overall. C is incorrect. It proposes that the F1 score and accuracy are 80% and 76%, respectively. While the F1 score calculation is correct at 80%, the accuracy calculation is incorrect. The correct accuracy, as derived from the confusion matrix, is 79%, not 76%. Therefore, the inaccuracy in the accuracy calculation renders option C incorrect. ", "explhtml": "<p>The correct answer is option B, which states that the model&#x27;s F1 score and accuracy are 80% and 79%, respectively. To understand why this is the correct answer, we need to calculate both the F1 score and the accuracy from the provided confusion matrix. The F1 score is a harmonic mean of precision and recall, calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0123.webp\" style=\"max-width:min(100%,518px)\" alt=\"TP 90 Precision = TP + FP = 90 + 28 = 0.7627 TP 90 Recall = TP + FN = 90 + 17 = 0.8412 2 × Precision × Recall 2 × 0.7627 × 0.8412 F1 score = Precision + Recall = 0.7627 + 0.8412 = 0.80 or 80%\"><p>The accuracy of the model is calculated by summing the true positives and true negatives and dividing by the total number of cases:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0124.webp\" style=\"max-width:min(100%,502px)\" alt=\"TP + TN 90 + 79 Accuracy = TP + FP+ TN + FN = 90 + 28 + 79 + 17 = 0.79 or 79%\"><p><b>A is incorrect<\/b>. It suggests that the F1 score and accuracy are 76% and 79%, respectively. However, the calculation of the F1 score from the confusion matrix yields an F1 score of 80%, not 76%. The accuracy part of the answer is correct at 79%, but the F1 score is incorrect, making option A incorrect overall.<\/p><p><b>C is incorrect<\/b>. It proposes that the F1 score and accuracy are 80% and 76%, respectively. While the F1 score calculation is correct at 80%, the accuracy calculation is incorrect. The correct accuracy, as derived from the confusion matrix, is 79%, not 76%. Therefore, the inaccuracy in the accuracy calculation renders option C incorrect. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(g): Evaluate the fit of a machine learning algorithm<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Aditya Khan<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Aditya Khan is a junior data scientist based in the New York City (NYC) headquarters office of the investment firm in the previous case  across various machine learning algorithms by ensuring that each feature contributes equally to the analysis and helps in speeding up the convergence of the training process.<\/p><p><b>A is incorrect<\/b>. The Receiver Operating Characteristic (ROC) curve is indeed a performance measurement for classification problems at various threshold settings. ROC is a probability curve, and the area under the ROC curve (AUC) represents the degree to which the model is capable of distinguishing between classes. The higher the AUC, the better the model is at predicting 0s as 0s and 1s as 1s. By plotting the true positive rate (TPR) against the false positive rate (FPR) at various threshold values, the ROC curve provides a tool to select possibly optimal models and discard suboptimal ones independently from the class distribution or error costs.<\/p><p><b>B is incorrect<\/b>. Root Mean Squared Error (RMSE) is a standard way to measure the error of a model in predicting quantitative data. It is particularly useful in regression analysis to verify the extent to which predicted values deviate from the actual values. The formula for RMSE is given by<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0125.webp\" style=\"max-width:min(100%,296px)\" alt=\"1 n RMSE = ⎷ n ∑ i=1 (predictedi −actuali)2\"><p>where n is the number of observations. A lower RMSE value indicates a better fit of the model to the data. Although RMSE is commonly used for regression models, it provides a clear indication of model accuracy by measuring the magnitude of prediction errors. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(g): Evaluate the fit of a machine learning algorithm<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Aditya Khan<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Aditya Khan is a junior data scientist based in the New York City (NYC) headquarters office of the investment firm in the previous case. Nadia Rahma supervises Khan. Rahma instructs Khan to handle the big data step of the impact model building. The impact model predicts whether the companies&#x27; stock prices in the S&amp;P 500 index, listed on the New York Stock Exchange (NYSE), significantly diverge due to press releases.<\/p><p>Khan employs Press Release Crawler to populate the database, using Rich Site Summary (RSS)<\/p><p>feeds to collect news articles. Almost all press releases name the company symbol in the format<\/p><p>(Exchange, Symbol). He filters the company symbol and tags the press releases with the<\/p><p>corresponding company using a regular expression. He also mines the stock prices using the<\/p><p>stock price crawler, passing a CSV file containing all companies traded at NYSE. The data has<\/p><p>fields such as symbol, company, Last Sale, Market Cap, IPO year, Sector, Industry, Summary, etc.<\/p><p>The crawler then iterates over all stock symbols and downloads the previous week’s stock prices<\/p><p>from the Google stock API endpoint for each iteration. The result is then dumped into a CSV file.<\/p><p>The press release crawler provides HTML, which requires preprocessing. First, he extracts the<\/p><p>text from the HTML code. He then performs text cleansing to the raw text. Afterward, he applies<\/p><p>the following preprocessing steps to the corpus to pass the result to other machine learning<\/p><p>algorithms. These preprocessing steps are:<\/p><p>1. Tokenization 2. Lowercasing the alphabet 3. Removal of stop words and punctuation 4. Part-of-speech tagging 5. Lemmatization<\/p><p>Since he cannot pass press releases directly to the machine learning algorithms, Khan<\/p><p>transforms them into a vector representation by creating a distinct set of tokens from the<\/p><p>normalized words.<\/p><p>Khan then performs exploratory data analysis. He creates a visualization that shows the most<\/p><p>informative words in the dataset based on their term frequency (TF) values. After creating and<\/p><p>analyzing the visualization, Khan is concerned that some tokens are likely to be noise features<\/p><p>for ML model training; therefore, He wants to remove them.<\/p><p>Once satisfied with the final set of features, Khan applies the CART algorithm to address the<\/p><p>classification problem on the training set. This algorithm classifies the text as having an impact<\/p><p>(Class “1” or no impact (Class “0”).<\/p><p>After training his model, Khan discovers that while it is good at correctly classifying using the in-<\/p><p>sample, it does not perform well using new data. He then evaluates its performance using error<\/p><p>analysis. The resulting confusion matrix is presented in the table below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0120.webp\" style=\"max-width:min(100%,384px)\" alt=\"Prediction Outcome Class &quot;1&quot; Class &quot;0&quot; Actual Value Class &quot;1&quot; TP = 90 FN = 17 Class &quot;0&quot; FP =28 TN = 79\"><p>Khan also plans to employ a neural network algorithm to compare the model performance with<\/p><p>the CART algorithm.<\/p><\/div><\/details><div class=\"qtext\"><p>Khan is most likely to use the following alternative methods to measure his model’s performance, except:<\/p><\/div>", "subj": "quant"}, {"n": 57, "q": "Which of the following best describes comment 1:", "opts": ["Conversion", "Standardization", "Tokenization"], "ans": "C", "expl": "Tokenization is the process of breaking down a stream of text into words, phrases, symbols, or other meaningful elements called tokens. In the context of natural language processing (NLP), tokenization is a crucial step because it involves parsing and segmenting text into discrete pieces, which can then be analyzed or processed further. Comment 1 describes this process as it involves splitting the cleansed data into a collection of words for normalization. This step is essential for preparing the text for subsequent tasks like stemming, lemmatization, and eventually for creating a bag-of-words model, which is used in feature extraction for machine learning algorithms. The description in Comment 1 aligns perfectly with the definition and purpose of tokenization, making option C the correct answer. A is incorrect. Conversion generally refers to the process of changing the format, structure, or values of data. In the context of data processing, conversion might involve transforming data types, modifying data attributes, or converting files from one format to another. However, Comment 1 specifically talks about splitting text into words and normalizing them, which is distinct from merely converting data from one form to another without breaking it into smaller linguistic units. Therefore, option A does not accurately describe the process outlined in Comment 1. B is incorrect. Standardization in the context of data processing typically refers to the process of bringing data into a uniform format that allows analysts to make meaningful comparisons. This process often involves scaling data to a zero mean and unit variance, or applying a similar transformation to ensure consistency across datasets. Comment 1, however, deals with the breaking down of text into tokens and normalizing these tokens, which is a specific procedure in text preprocessing distinct from the general concept of standardization. Thus, option B does not correctly describe the activities mentioned in Comment 1. ", "explhtml": "<p>Tokenization is the process of breaking down a stream of text into words, phrases, symbols, or other meaningful elements called tokens. In the context of natural language processing (NLP), tokenization is a crucial step because it involves parsing and segmenting text into discrete pieces, which can then be analyzed or processed further. Comment 1 describes this process as it involves splitting the cleansed data into a collection of words for normalization. This step is essential for preparing the text for subsequent tasks like stemming, lemmatization, and eventually for creating a bag-of-words model, which is used in feature extraction for machine learning algorithms. The description in Comment 1 aligns perfectly with the definition and purpose of tokenization, making option C the correct answer.<\/p><p><b>A is incorrect<\/b>. Conversion generally refers to the process of changing the format, structure, or values of data. In the context of data processing, conversion might involve transforming data types, modifying data attributes, or converting files from one format to another. However, Comment 1 specifically talks about splitting text into words and normalizing them, which is distinct from merely converting data from one form to another without breaking it into smaller linguistic units. Therefore, option A does not accurately describe the process outlined in Comment 1.<\/p><p><b>B is incorrect<\/b>. Standardization in the context of data processing typically refers to the process of bringing data into a uniform format that allows analysts to make meaningful comparisons. This process often involves scaling data to a zero mean and unit variance, or applying a similar transformation to ensure consistency across datasets. Comment 1, however, deals with the breaking down of text into tokens and normalizing these tokens, which is a specific procedure in text preprocessing distinct from the general concept of standardization. Thus, option B does not correctly describe the activities mentioned in Comment 1. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(b): Describe objectives, steps, and examples of preparing and wrangling data<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Adam Smith #1<\/summary><div class=\"vig-body\"><p>Three months ago, Adan Smith, the Head of Operations at XYZ Investment Bank, set up a team comprising of two senior and three junior data scientists. They were tasked with creating a machine learning program, that uses natural language processing (NLP) to monitor, filter, and conduct sentiment analysis of news articles to automatically derive relevant information and help the investment managers derive actionable insights.<\/p><p>The team appointed Joe Cane, one of the junior data scientists, to conduct preliminary research<\/p><p>to help them further understand the project and deliverables.<\/p><p>During the inception meeting, Cane presented the following:<\/p><p>When making investment decisions, the news is always a fundamental factor. It is orthodox that<\/p><p>company-specific, macroeconomic, and political news robustly influence the financial markets. In<\/p><p>the most recent past, there has been a great technological advancement, making market<\/p><p>participants more connected, and the rapid growth of news and other data in terms of volume<\/p><p>and frequency.<\/p><p>Our task, therefore, entails utilizing this burgeoning abundance of news data to develop an<\/p><p>effective NLP model that reacts to the vast amount of data available every second. Investors will<\/p><p>then rely on this model to extract, process, and interpret vast amounts of data in real-time. This<\/p><p>programmed solution will help investors to make informed and timely decisions.<\/p><p>Smith requests the team to come up with the steps that they will follow to complete the project<\/p><p>successfully.<\/p><p>The team begins by identifying the different sources of news data, including mainstream news<\/p><p>such as Bloomberg, primary source news, and social media.<\/p><p>They agree on the following steps:<\/p><p><b>Step 1: Collecting data<\/b><\/p><p>We will collect data by:<\/p><p>1. Subscribing to the news feeds of primary information providers, including Reuters and<\/p><p>Bloomberg.<\/p><p>2. Web-crawling uses custom scripts to extract textual and metadata regarding historical<\/p><p>news.<\/p><p>3. Requesting data from the news providers&#x27; or regulators&#x27; publicly available archives.<\/p><p><b>Step 2: Preprocessing and cleaning data<\/b><\/p><p><b>Comment 1:<\/b><\/p><p>In order to feed news data into the computer, we need to split the cleansed data into a collection<\/p><p>of words for them to be normalized.<\/p><p>The cleansed text will be normalized by:<\/p><p>1. Lowercasing of all text to consolidate duplicate words 2. Stemming 3. Lemmatization<\/p><p>Widen Keller, one of the junior data scientists, wants to understand the difference between<\/p><p>stemming and lemmatization. He receives the following responses from the other members:<\/p><p><b>Response 1:<\/b><\/p><p>Stemming is the process of converting inflected forms of a word into its base word. At the same<\/p><p>time, lemmatization is the process of converting inflected forms of a word into its morphological<\/p><p>root.<\/p><p><b>Response 2:<\/b><\/p><p>Stemming is rule-based, and the results need not necessarily be linguistically sensible. On the<\/p><p>other hand, lemmatization is an algorithmic approach and depends on the knowledge of the word<\/p><p>and language structure.<\/p><p><b>Response 3:<\/b><\/p><p>The stem of the words &quot;analyzed&quot; and &quot;analyzing&quot; is &quot;analys.&quot; While the lemma is &quot;analyze.&quot;<\/p><p><b>Step 3: Exploratory data analysis, feature selection, and feature<\/b> <b>engineering<\/b><\/p><p><b>Comment 2:<\/b><\/p><p>At this step, the preprocessed tokens will be translated into predictive features for the<\/p><p>information content to be conveyed to the machine learning algorithm.<\/p><p><b>Comment 3:<\/b><\/p><p>The bag-of-words (BOW) is the most commonly used feature representation technique in NLP.<\/p><p>After the text is transformed into a &#x27;bag of words,&#x27; various measures can be calculated to<\/p><p>generate the predictive features.<\/p><p><b>Comment 4:<\/b><\/p><p>We will employ feature selection for text data to keep the useful tokens in the BOW that are<\/p><p>informative and discriminate between different classes of texts—those with positive sentiment<\/p><p>and those with negative sentiment.<\/p><p>Keller is struggling to understand feature selection. To explain the concept of feature selection,<\/p><p>Cane assembles a BOW from a hypothetical corpus of text and pulls the following abbreviated<\/p><p>term frequency measures table:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0126.webp\" style=\"max-width:min(100%,678px)\" alt=\"Exhibit 1: Feature Selection Sentence TotalWords Word TotalWords WordCount SentenceCount InSentence Count InSentence WithWord &lt; int &gt; &lt; int &gt; &lt; chr &gt; &lt; int &gt; &lt; int &gt; &lt; int &gt; 1800 30 the 2500 4 1400 220 37 a 2397 5 1453 28 7 increase 3 1 3 1368 9 unemployment 1 1 1 1912 8 persist 4 1 4\"><p>The text file has a total of 52,100 non-unique tokens that are in 5,000 sentences.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes comment 1:<\/p><\/div>", "subj": "quant"}, {"n": 58, "q": "Which of the responses relating to stemming and lemmatization is most accurate:", "opts": ["Response 1 and 2", "Response 2 and 3", "All of the above"], "ans": "C", "expl": "The correct answer is option C, which states that all of the provided responses about stemming and lemmatization are accurate. Each response contributes a unique and correct perspective on the differences and functionalities of stemming and lemmatization, which are crucial techniques in natural language processing (NLP). Response 1 highlights the basic definitions and differences between stemming and lemmatization. Stemming simplifies words to their base forms, which might not always be meaningful words, whereas lemmatization reduces words to their dictionary forms, which are valid linguistic units. Response 2 elaborates on the methodologies behind these processes, explaining that stemming is rule-based and may not consider the context of the word, leading to less accurate but faster results. Lemmatization, on the other hand, uses a vocabulary and morphological analysis of words, making it more accurate but computationally expensive. Response 3 provides a practical example showing how the words \"analyzed\" and \"analyzing\" are stemmed to \"analys\" and lemmatized to \"analyze,\" illustrating the practical application and outcome of each technique. A is incorrect. It suggests that only Responses 1 and 2 are accurate. However, this excludes Response 3, which is also correct and provides an essential example that illustrates the practical differences between stemming and lemmatization. By omitting Response 3, the explanation of how these techniques apply in real scenarios, particularly in processing text for NLP tasks, would be incomplete. Practical examples, as given in Response 3, are crucial for understanding the implications of choosing one technique over the other in specific contexts. B is incorrect. It selects Responses 2 and 3 as accurate. While these responses are indeed correct and provide valuable insights into the process and practical application of stemming and lemmatization, excluding Response 1 omits the foundational definitions and distinctions between the two techniques. Understanding the basic conceptual differences is critical for anyone learning about or working with text processing and NLP, as it sets the stage for more detailed discussions on methodology and application, as covered in Responses 2 and 3. ", "explhtml": "<p>The correct answer is option C, which states that all of the provided responses about stemming and lemmatization are accurate. Each response contributes a unique and correct perspective on the differences and functionalities of stemming and lemmatization, which are crucial techniques in natural language processing (NLP). Response 1 highlights the basic definitions and differences between stemming and lemmatization. Stemming simplifies words to their base forms, which might not always be meaningful words, whereas lemmatization reduces words to their dictionary forms, which are valid linguistic units. Response 2 elaborates on the methodologies behind these processes, explaining that stemming is rule-based and may not consider the context of the word, leading to less accurate but faster results. Lemmatization, on the other hand, uses a vocabulary and morphological analysis of words, making it more accurate but computationally expensive. Response 3 provides a practical example showing how the words &quot;analyzed&quot; and &quot;analyzing&quot; are stemmed to &quot;analys&quot; and lemmatized to &quot;analyze,&quot; illustrating the practical application and outcome of each technique.<\/p><p><b>A is incorrect<\/b>. It suggests that only Responses 1 and 2 are accurate. However, this excludes Response 3, which is also correct and provides an essential example that illustrates the practical differences between stemming and lemmatization. By omitting Response 3, the explanation of how these techniques apply in real scenarios, particularly in processing text for NLP tasks, would be incomplete. Practical examples, as given in Response 3, are crucial for understanding the implications of choosing one technique over the other in specific contexts.<\/p><p><b>B is incorrect<\/b>. It selects Responses 2 and 3 as accurate. While these responses are indeed correct and provide valuable insights into the process and practical application of stemming and lemmatization, excluding Response 1 omits the foundational definitions and distinctions between the two techniques. Understanding the basic conceptual differences is critical for anyone learning about or working with text processing and NLP, as it sets the stage for more detailed discussions on methodology and application, as covered in Responses 2 and 3. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(b) describe objectives, steps, and examples of preparing and wrangling data<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Adam Smith #1<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Three months ago, Adan Smith, the Head of Operations at XYZ Investment Bank, set up a team comprising of two senior and three junior data scientists. They were tasked with creating a machine learning program, that uses natural language processing (NLP) to monitor, filter, and conduct sentiment analysis of news articles to automatically derive relevant information and help the investment managers derive actionable insights.<\/p><p>The team appointed Joe Cane, one of the junior data scientists, to conduct preliminary research<\/p><p>to help them further understand the project and deliverables.<\/p><p>During the inception meeting, Cane presented the following:<\/p><p>When making investment decisions, the news is always a fundamental factor. It is orthodox that<\/p><p>company-specific, macroeconomic, and political news robustly influence the financial markets. In<\/p><p>the most recent past, there has been a great technological advancement, making market<\/p><p>participants more connected, and the rapid growth of news and other data in terms of volume<\/p><p>and frequency.<\/p><p>Our task, therefore, entails utilizing this burgeoning abundance of news data to develop an<\/p><p>effective NLP model that reacts to the vast amount of data available every second. Investors will<\/p><p>then rely on this model to extract, process, and interpret vast amounts of data in real-time. This<\/p><p>programmed solution will help investors to make informed and timely decisions.<\/p><p>Smith requests the team to come up with the steps that they will follow to complete the project<\/p><p>successfully.<\/p><p>The team begins by identifying the different sources of news data, including mainstream news<\/p><p>such as Bloomberg, primary source news, and social media.<\/p><p>They agree on the following steps:<\/p><p><b>Step 1: Collecting data<\/b><\/p><p>We will collect data by:<\/p><p>1. Subscribing to the news feeds of primary information providers, including Reuters and<\/p><p>Bloomberg.<\/p><p>2. Web-crawling uses custom scripts to extract textual and metadata regarding historical<\/p><p>news.<\/p><p>3. Requesting data from the news providers&#x27; or regulators&#x27; publicly available archives.<\/p><p><b>Step 2: Preprocessing and cleaning data<\/b><\/p><p><b>Comment 1:<\/b><\/p><p>In order to feed news data into the computer, we need to split the cleansed data into a collection<\/p><p>of words for them to be normalized.<\/p><p>The cleansed text will be normalized by:<\/p><p>1. Lowercasing of all text to consolidate duplicate words 2. Stemming 3. Lemmatization<\/p><p>Widen Keller, one of the junior data scientists, wants to understand the difference between<\/p><p>stemming and lemmatization. He receives the following responses from the other members:<\/p><p><b>Response 1:<\/b><\/p><p>Stemming is the process of converting inflected forms of a word into its base word. At the same<\/p><p>time, lemmatization is the process of converting inflected forms of a word into its morphological<\/p><p>root.<\/p><p><b>Response 2:<\/b><\/p><p>Stemming is rule-based, and the results need not necessarily be linguistically sensible. On the<\/p><p>other hand, lemmatization is an algorithmic approach and depends on the knowledge of the word<\/p><p>and language structure.<\/p><p><b>Response 3:<\/b><\/p><p>The stem of the words &quot;analyzed&quot; and &quot;analyzing&quot; is &quot;analys.&quot; While the lemma is &quot;analyze.&quot;<\/p><p><b>Step 3: Exploratory data analysis, feature selection, and feature<\/b> <b>engineering<\/b><\/p><p><b>Comment 2:<\/b><\/p><p>At this step, the preprocessed tokens will be translated into predictive features for the<\/p><p>information content to be conveyed to the machine learning algorithm.<\/p><p><b>Comment 3:<\/b><\/p><p>The bag-of-words (BOW) is the most commonly used feature representation technique in NLP.<\/p><p>After the text is transformed into a &#x27;bag of words,&#x27; various measures can be calculated to<\/p><p>generate the predictive features.<\/p><p><b>Comment 4:<\/b><\/p><p>We will employ feature selection for text data to keep the useful tokens in the BOW that are<\/p><p>informative and discriminate between different classes of texts—those with positive sentiment<\/p><p>and those with negative sentiment.<\/p><p>Keller is struggling to understand feature selection. To explain the concept of feature selection,<\/p><p>Cane assembles a BOW from a hypothetical corpus of text and pulls the following abbreviated<\/p><p>term frequency measures table:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0126.webp\" style=\"max-width:min(100%,678px)\" alt=\"Exhibit 1: Feature Selection Sentence TotalWords Word TotalWords WordCount SentenceCount InSentence Count InSentence WithWord &lt; int &gt; &lt; int &gt; &lt; chr &gt; &lt; int &gt; &lt; int &gt; &lt; int &gt; 1800 30 the 2500 4 1400 220 37 a 2397 5 1453 28 7 increase 3 1 3 1368 9 unemployment 1 1 1 1912 8 persist 4 1 4\"><p>The text file has a total of 52,100 non-unique tokens that are in 5,000 sentences.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the responses relating to stemming and lemmatization is most accurate:<\/p><\/div>", "subj": "quant"}, {"n": 59, "q": "According to comment 3, which of the following is the most common measure generated by a bag-of-words model:", "opts": ["Term frequency", "Document term matrix", "Word cloud"], "ans": "A", "expl": "Term frequency is the correct answer because it is a fundamental measure used in the bag-of-words (BOW) model for text analysis. In the context of NLP, term frequency quantifies how often a specific word appears in a document relative to the total number of words in that document. This measure is crucial because it helps in understanding the importance or relevance of a word within the document. By converting text data into a numerical format through term frequency, machine learning algorithms can more effectively process and analyze the data. This is particularly important in sentiment analysis, where the frequency of certain words can indicate positive or negative sentiment. Additionally, term frequency is a building block for other text representation techniques such as TF-IDF (Term Frequency-Inverse Document Frequency), which are used to weigh the words depending on their importance across multiple documents. B is incorrect. Document term matrix is indeed a structure used in text mining and NLP, but it is not a measure; rather, it is a matrix representation of the frequency of terms that occur in a collection of documents. It organizes the text data in a structured form where rows typically represent documents and columns represent terms, with matrix values being the term frequencies. While it is crucial for analyzing relationships between documents and terms, it is not a measure generated by the bag-of-words model itself but a format for organizing the data derived from measures such as term frequency. C is incorrect. A word cloud is a visual representation of text data where the size of each word indicates its frequency or importance in the dataset. Although it is a useful tool for quickly perceiving the most prominent words within a text, it is not a measure but a visualization technique. Word clouds are often generated after analytical measures like term frequency have been calculated, serving more as a supplementary visual aid rather than a primary analytical measure used by NLP models. ", "explhtml": "<p>Term frequency is the correct answer because it is a fundamental measure used in the bag-of-words (BOW) model for text analysis. In the context of NLP, term frequency quantifies how often a specific word appears in a document relative to the total number of words in that document. This measure is crucial because it helps in understanding the importance or relevance of a word within the document. By converting text data into a numerical format through term frequency, machine learning algorithms can more effectively process and analyze the data. This is particularly important in sentiment analysis, where the frequency of certain words can indicate positive or negative sentiment. Additionally, term frequency is a building block for other text representation techniques such as TF-IDF (Term Frequency-Inverse Document Frequency), which are used to weigh the words depending on their importance across multiple documents.<\/p><p><b>B is incorrect<\/b>. Document term matrix is indeed a structure used in text mining and NLP, but it is not a measure; rather, it is a matrix representation of the frequency of terms that occur in a collection of documents. It organizes the text data in a structured form where rows typically represent documents and columns represent terms, with matrix values being the term frequencies. While it is crucial for analyzing relationships between documents and terms, it is not a measure generated by the bag-of-words model itself but a format for organizing the data derived from measures such as term frequency.<\/p><p><b>C is incorrect<\/b>. A word cloud is a visual representation of text data where the size of each word indicates its frequency or importance in the dataset. Although it is a useful tool for quickly perceiving the most prominent words within a text, it is not a measure but a visualization technique. Word clouds are often generated after analytical measures like term frequency have been calculated, serving more as a supplementary visual aid rather than a primary analytical measure used by NLP models. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(e): Describe preparing, wrangling, and exploring text-based data for financial forecasting<\/p>", "qhtml": "<details class=\"vig\  TF specific to the sentence.<\/p><p><b>B is incorrect<\/b>. Option B indicates a TF-IDF value of 13.3%, which corresponds only to the term frequency (TF) of &quot;the&quot; in sentence 1800. This option fails to incorporate the inverse document frequency (IDF), which adjusts the term frequency based on how common the word is across all documents. Without this adjustment, the TF-IDF calculation is incomplete and thus incorrect. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(f): Describe methods for extracting, selecting and engineering features from textual data<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Adam Smith #1<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Three months ago, Adan Smith, the Head of Operations at XYZ Investment Bank, set up a team comprising of two senior and three junior data scientists. They were tasked with creating a machine learning program, that uses natural language processing (NLP) to monitor, filter, and conduct sentiment analysis of news articles to automatically derive relevant information and help the investment managers derive actionable insights.<\/p><p>The team appointed Joe Cane, one of the junior data scientists, to conduct preliminary research<\/p><p>to help them further understand the project and deliverables.<\/p><p>During the inception meeting, Cane presented the following:<\/p><p>When making investment decisions, the news is always a fundamental factor. It is orthodox that<\/p><p>company-specific, macroeconomic, and political news robustly influence the financial markets. In<\/p><p>the most recent past, there has been a great technological advancement, making market<\/p><p>participants more connected, and the rapid growth of news and other data in terms of volume<\/p><p>and frequency.<\/p><p>Our task, therefore, entails utilizing this burgeoning abundance of news data to develop ization is an algorithmic approach and depends on the knowledge of the word<\/p><p>and language structure.<\/p><p><b>Response 3:<\/b><\/p><p>The stem of the words &quot;analyzed&quot; and &quot;analyzing&quot; is &quot;analys.&quot; While the lemma is &quot;analyze.&quot;<\/p><p><b>Step 3: Exploratory data analysis, feature selection, and feature<\/b> <b>engineering<\/b><\/p><p><b>Comment 2:<\/b><\/p><p>At this step, the preprocessed tokens will be translated into predictive features for the<\/p><p>information content to be conveyed to the machine learning algorithm.<\/p><p><b>Comment 3:<\/b><\/p><p>The bag-of-words (BOW) is the most commonly used feature representation technique in NLP.<\/p><p>After the text is transformed into a &#x27;bag of words,&#x27; various measures can be calculated to<\/p><p>generate the predictive features.<\/p><p><b>Comment 4:<\/b><\/p><p>We will employ feature selection for text data to keep the useful tokens in the BOW that are<\/p><p>informative and discriminate between different classes of texts—those with positive sentiment<\/p><p>and those with negative sentiment.<\/p><p>Keller is struggling to understand feature selection. To explain the concept of feature selection,<\/p><p>Cane assembles a BOW from a hypothetical corpus of text and pulls the following abbreviated<\/p><p>term frequency measures table:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0126.webp\" style=\"max-width:min(100%,678px)\" alt=\"Exhibit 1: Feature Selection Sentence TotalWords Word TotalWords WordCount SentenceCount InSentence Count InSentence WithWord &lt; int &gt; &lt; int &gt; &lt; chr &gt; &lt; int &gt; &lt; int &gt; &lt; int &gt; 1800 30 the 2500 4 1400 220 37 a 2397 5 1453 28 7 increase 3 1 3 1368 9 unemployment 1 1 1 1912 8 persist 4 1 4\"><p>The text file has a total of 52,100 non-unique tokens that are in 5,000 sentences.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, determine the TF–IDF (term frequency-inverse document frequency) for the token &quot;the&quot; in sentence 1800 in Exhibit 1:<\/p><\/div>", "subj": "quant"}, {"n": 61, "q": "Based on Exhibit 1, the model's precision metric is closest to:", "opts": ["73%.", "86%.", "89%."], "ans": "B", "expl": "Precision is a key metric in evaluating the performance of a classification model, particularly in the context of binary classification tasks. It is defined as the ratio of true positives (TP) to the sum of true positives and false positives (FP). This metric essentially measures the accuracy of the positive predictions made by the model. In the given scenario, the precision of the model can be calculated using the values from the provided confusion matrix. The formula for precision is: Substituting the values from the confusion matrix: This calculation shows that the model correctly predicts the positive class 86.25% of the time when it predicts a positive class, which rounds to approximately 86%. Hence, option B is the correct answer. A is incorrect. It suggests that the model's precision is 73%, which significantly underestimates the actual precision calculated from the confusion matrix. The calculation of precision directly from the matrix values (301 true positives and 48 false positives) clearly results in a precision of approximately 86.25%, not 73%. This discrepancy indicates a misunderstanding or miscalculation of the precision formula, which is critical in assessing the model's performance in correctly predicting positive cases out of all its positive predictions. C is incorrect. It estimates the model's precision to be 89%, which is an overestimation compared to the calculated precision of approximately 86.25%. This overestimation could lead to an overly optimistic assessment of the model's performance. Precision is a crucial metric in scenarios where the cost of a false positive is high, and overestimating this value could result in poor decision-making based on incorrect assumptions about the model's accuracy in predicting positive classes. The correct calculation using the provided confusion matrix values clearly shows that the precision is closer to 86%, not 89%. ", "explhtml": "<p>Precision is a key metric in evaluating the performance of a classification model, particularly in the context of binary classification tasks. It is defined as the ratio of true positives (TP) to the sum of true positives and false positives (FP). This metric essentially measures the accuracy of the positive predictions made by the model. In the given scenario, the precision of the model can be calculated using the values from the provided confusion matrix. The formula for precision is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0132.webp\" style=\"max-width:min(100%,193px)\" alt=\"TP Precision(P) = TP + FP\"><p>Substituting the values from the confusion matrix:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0133.webp\" style=\"max-width:min(100%,323px)\" alt=\"301 Precision = 301 + 48 = 0.8625 or 86.25%\"><p>This calculation shows that the model correctly predicts the positive class 86.25% of the time when it predicts a positive class, which rounds to approximately 86%. Hence, option B is the correct answer.<\/p><p><b>A is incorrect<\/b>. It suggests that the model&#x27;s precision is 73%, which significantly underestimates the actual precision calculated from the confusion matrix. The calculation of precision directly from the matrix values (301 true positives and 48 false positives) clearly results in a precision of approximately 86.25%, not 73%. This discrepancy indicates a misunderstanding or miscalculation of the precision formula, which is critical in assessing the model&#x27;s performance in correctly predicting positive cases out of all its positive predictions.<\/p><p><b>C is incorrect<\/b>. It estimates the model&#x27;s precision to be 89%, which is an overestimation compared to the calculated precision of approximately 86.25%. This overestimation could lead to an overly optimistic assessment of the model&#x27;s performance. Precision is a crucial metric in scenarios where the cost of a false positive is high, and overestimating this value could result in poor decision-making based on incorrect assumptions about the model&#x27;s accuracy in predicting positive classes. The correct calculation using the provided confusion matrix values clearly shows that the precision is closer to 86%, not 89%. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(g): Evaluate the fit of a machine learning algorithm<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Adam Smith #2<\/summary><div class=\"vig-body\"><p>Three months ago, Adan Smith, the Head of Operations at XYZ Investment Bank, set up a team comprising of two senior and three junior data scientists. They were tasked with creating a machine learning program, that uses natural language processing (NLP) to monitor, filter, and conduct sentiment analysis of news articles to automatically derive relevant information and help the investment managers derive actionable insights.<\/p><p>The team has completed the first three steps of the project:<\/p><p><b>Step 1:<\/b> Collecting data.<\/p><p><b>Step 2:<\/b> Preprocessing and cleaning data.<\/p><p><b>Step 3:<\/b> Exploratory data analysis, feature selection, and feature engineering.<\/p><p>In the next meeting, they will discuss the remaining steps as follows:<\/p><p><b>Step 4:<\/b> Model training<\/p><p>Shera Noorbhai, one of the senior data scientists, highlights that the team will need to remove<\/p><p>any noise or random fluctuations in the training data. The problem is that these aspects do not<\/p><p>apply to any new data the algorithm receives, and will negatively impact the model&#x27;s ability to<\/p><p>generalize.<\/p><p><b>Step 5:<\/b> Performance evaluation and Tuning<\/p><p>We will carry out an error analysis for our model, create a confusion matrix, and determine true<\/p><p>positives (TPs), false positives (FPs), true negatives (TNs) and false negatives (FNs). Then, we<\/p><p>will calculate the following performance metrics: accuracy, F1 score, precision, and recall.<\/p><p>Jane Kubai, one of the senior data scientists, pulls the following confusion matrix from the<\/p><p>internet for illustration.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0131.webp\" style=\"max-width:min(100%,547px)\" alt=\"Exhibit 1: Confusion Matrix Actual Training Labels Class &quot;1.&quot; Class &quot;1.&quot; Predicted results Class &quot;1&quot; TP 301 FP 48 Class &quot;1&quot; FN 37 TN 130\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the model&#x27;s precision metric is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 62, "q": "Based on Exhibit 1, the model's F1 score is closest to:", "opts": ["88%.", "89%.", "90%."], "ans": "A", "expl": "The F1 score is a crucial metric in evaluating the accuracy of a model, particularly in scenarios where the balance between precision and recall is essential. In this case, the F1 score is calculated using the formula: Where precision (P) and recall (R) are defined as follows: Substituting these values into the F1 score formula gives: This value, when rounded to the nearest whole number, is closest to 88%, making option A the correct answer. B is incorrect.It suggests that the F1 score is closest to 89%. However, the calculated F1 score of 87.63% is closer to 88% than to 89%. This discrepancy arises from the mathematical calculation of the F1 score, which balances precision and recall. The slight difference in the percentage points, although minor, is significant enough to make option B incorrect. C is incorrect. Option C, which suggests an F1 score closest to 90%, is incorrect due to the actual calculations derived from the confusion matrix. The precision and recall values, when used to compute the F1 score, result in a value significantly lower than 90%. This option overestimates the model's performance based on the given data. The error in this option highlights the importance of accurately calculating performance metrics to avoid optimistic biases in model evaluation. ", "explhtml": "<p>The F1 score is a crucial metric in evaluating the accuracy of a model, particularly in scenarios where the balance between precision and recall is essential. In this case, the F1 score is calculated using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0134.webp\" style=\"max-width:min(100%,173px)\" alt=\"2 × P × R F1 score = P + R\"><p>Where precision (P) and recall (R) are defined as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0135.webp\" style=\"max-width:min(100%,440px)\" alt=\"TP 301 Precision (P) = TP + FP = 301 + 48 = 0.8625 or 86.25% TP 301 Recall (R) = TP + FN = 301 + 37 = 0.8905 or 89.05%\"><p>Substituting these values into the F1 score formula gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0136.webp\" style=\"max-width:min(100%,391px)\" alt=\"2 × 0.8625 × 0.8905 F1 score = 0.8625 + 0.8905 = 0.8763 or 87.63%\"><p>This value, when rounded to the nearest whole number, is closest to 88%, making option A the correct answer.<\/p><p><b>B is incorrect<\/b>.It suggests that the F1 score is closest to 89%. However, the calculated F1 score of 87.63% is closer to 88% than to 89%. This discrepancy arises from the mathematical calculation of the F1 score, which balances precision and recall. The slight difference in the percentage points, although minor, is significant enough to make option B incorrect.<\/p><p><b>C is incorrect<\/b>. Option C, which suggests an F1 score closest to 90%, is incorrect due to the actual calculations derived from the confusion matrix. The precision and recall values, when used to compute the F1 score, result in a value significantly lower than 90%. This option overestimates the model&#x27;s performance based on the given data. The error in this option highlights the importance of accurately calculating performance metrics to avoid optimistic biases in model evaluation. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(g): Evaluate the fit of a machine learning algorithm<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Adam Smith #2<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Three months ago, Adan Smith, the Head of Operations at XYZ Investment Bank, set up a team comprising of two senior and three junior data scientists. They were tasked with creating a machine learning program, that uses natural language processing (NLP) to monitor, filter, and conduct sentiment analysis of news articles to automatically derive relevant information and help the investment managers derive actionable insights.<\/p><p>The team has completed the first three steps of the project:<\/p><p><b>Step 1:<\/b> Collecting data.<\/p><p><b>Step 2:<\/b> Preprocessing and cleaning data.<\/p><p><b>Step 3:<\/b> Exploratory data analysis, feature selection, and feature engineering.<\/p><p>In the next meeting, they will discuss the remaining steps as follows:<\/p><p><b>Step 4:<\/b> Model training<\/p><p>Shera Noorbhai, one of the senior data scientists, highlights that the team will need to remove<\/p><p>any noise or random fluctuations in the training data. The problem is that these aspects do not<\/p><p>apply to any new data the algorithm receives, and will negatively impact the model&#x27;s ability to<\/p><p>generalize.<\/p><p><b>Step 5:<\/b> Performance evaluation and Tuning<\/p><p>We will carry out an error analysis for our model, create a confusion matrix, and determine true<\/p><p>positives (TPs), false positives (FPs), true negatives (TNs) and false negatives (FNs). Then, we<\/p><p>will calculate the following performance metrics: accuracy, F1 score, precision, and recall.<\/p><p>Jane Kubai, one of the senior data scientists, pulls the following confusion matrix from the<\/p><p>internet for illustration.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0131.webp\" style=\"max-width:min(100%,547px)\" alt=\"Exhibit 1: Confusion Matrix Actual Training Labels Class &quot;1.&quot; Class &quot;1.&quot; Predicted results Class &quot;1&quot; TP 301 FP 48 Class &quot;1&quot; FN 37 TN 130\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the model&#x27;s F1 score is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 63, "q": "Based on step 4, Noorbhai's highlight best describes:", "opts": ["Overfitting.", "Bias error.", "Underfitting."], "ans": "A", "expl": "Shira Noorbhai's emphasis on the need to remove noise or random fluctuations from the training data directly addresses the issue of overfitting in machine learning models. Overfitting occurs when a model learns not only the underlying patterns in the training data but also the noise and random fluctuations that are not generally representative of the data as a whole. This results in a model that performs exceptionally well on its training data but poorly on any unseen data. The noise that Noorbhai refers to can cause the model to detect false patterns that do not actually exist, leading to predictions that are accurate within the training set but inaccurate when the model is applied in real-world scenarios. This is why overfitting is a critical concern in model training, as it severely hampers the model's ability to generalize, which is the ultimate goal of any predictive model. B is incorrect. Bias error, often simply called bias, is a different concept from what Noorbhai described. Bias error occurs when a model is too simple to capture the complexity of the data's underlying pattern. This simplicity typically results from assumptions in the model that do not fit the data well. A high bias error leads to underfitting, where the model fails to capture important trends in the data, resulting in poor performance on both training and new data. Noorbhai's focus was on the model capturing too much detail including noise, not on it missing out on underlying patterns due to simplicity, which is what characterizes high bias. C is incorrect. Underfitting, which is often a result of a model being too simple or not having enough parameters, was not the issue highlighted by Noorbhai. Underfitting occurs when a model is unable to capture the underlying pattern of the data and, as a result, may not perform well even on the training data. This typically happens when the model does not have enough complexity to learn from the data. Noorbhai's concern was about the model learning too much from the data, including the noise, which is a sign of overfitting, not underfitting. ", "explhtml": "<p>Shira Noorbhai&#x27;s emphasis on the need to remove noise or random fluctuations from the training data directly addresses the issue of overfitting in machine learning models. Overfitting occurs when a model learns not only the underlying patterns in the training data but also the noise and random fluctuations that are not generally representative of the data as a whole. This results in a model that performs exceptionally well on its training data but poorly on any unseen data. The noise that Noorbhai refers to can cause the model to detect false patterns that do not actually exist, leading to predictions that are accurate within the training set but inaccurate when the model is applied in real-world scenarios. This is why overfitting is a critical concern in model training, as it severely hampers the model&#x27;s ability to generalize, which is the ultimate goal of any predictive model.<\/p><p><b>B is incorrect<\/b>. Bias error, often simply called bias, is a different concept from what Noorbhai described. Bias error occurs when a model is too simple to capture the complexity of the data&#x27;s underlying pattern. This simplicity typically results from assumptions in the model that do not fit the data well. A high bias error leads to underfitting, where the model fails to capture important trends in the data, resulting in poor performance on both training and new data. Noorbhai&#x27;s focus was on the model capturing too much detail including noise, not on it missing out on underlying patterns due to simplicity, which is what characterizes high bias.<\/p><p><b>C is incorrect<\/b>. Underfitting, which is often a result of a model being too simple or not having enough parameters, was not the issue highlighted by Noorbhai. Underfitting occurs when a model is unable to capture the underlying pattern of the data and, as a result, may not perform well even on the training data. This typically happens when the model does not have enough complexity to learn from the data. Noorbhai&#x27;s concern was about the model learning too much from the data, including the noise, which is a sign of overfitting, not underfitting. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(g): Evaluate the fit of a machine learning algorithm<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Adam Smith #2<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Three months ago, Adan Smith, the Head of Operations at XYZ Investment Bank, set up a team comprising of two senior and three junior data scientists. They were tasked with creating a machine learning program, that uses natural language processing (NLP) to monitor, filter, and conduct sentiment analysis of news articles to automatically derive relevant information and help the investment managers derive actionable insights.<\/p><p>The team has completed the first three steps of the project:<\/p><p><b>Step 1:<\/b> Collecting data.<\/p><p><b>Step 2:<\/b> Preprocessing and cleaning data.<\/p><p><b>Step 3:<\/b> Exploratory data analysis, feature selection, and feature engineering.<\/p><p>In the next meeting, they will discuss the remaining steps as follows:<\/p><p><b>Step 4:<\/b> Model training<\/p><p>Shera Noorbhai, one of the senior data scientists, highlights that the team will need to remove<\/p><p>any noise or random fluctuations in the training data. The problem is that these aspects do not<\/p><p>apply to any new data the algorithm receives, and will negatively impact the model&#x27;s ability to<\/p><p>generalize.<\/p><p><b>Step 5:<\/b> Performance evaluation and Tuning<\/p><p>We will carry out an error analysis for our model, create a confusion matrix, and determine true<\/p><p>positives (TPs), false positives (FPs), true negatives (TNs) and false negatives (FNs). Then, we<\/p><p>will calculate the following performance metrics: accuracy, F1 score, precision, and recall.<\/p><p>Jane Kubai, one of the senior data scientists, pulls the following confusion matrix from the<\/p><p>internet for illustration.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0131.webp\" style=\"max-width:min(100%,547px)\" alt=\"Exhibit 1: Confusion Matrix Actual Training Labels Class &quot;1.&quot; Class &quot;1.&quot; Predicted results Class &quot;1&quot; TP 301 FP 48 Class &quot;1&quot; FN 37 TN 130\"><\/div><\/details><div class=\"qtext\"><p>Based on step 4, Noorbhai&#x27;s highlight best describes:<\/p><\/div>", "subj": "quant"}, {"n": 64, "q": "The error, which is high when a model is overly simplified and does not sufficiently learn from the patterns in the training data, is best known as:", "opts": ["bias error.", "variance error.", "inaccuracy error."], "ans": "A", "expl": "Bias error occurs when a model is too simple, which means it does not capture the underlying patterns and complexities of the data. This simplicity leads to underfitting, where the model fails to make accurate predictions because it cannot generalize well from its training data to unseen data. In the context of the machine learning program being developed by Adan Smith's team at XYZ Investment Bank, a high bias error would mean that the model is not sufficiently sophisticated to understand and interpret the nuances in the sentiment of news articles. This would result in poor performance when trying to provide actionable insights to investment managers, as the model would not accurately reflect the true sentiments expressed in the news articles. B is incorrect. Variance error, on the other hand, occurs when a model is too complex, incorporating too much noise and details from the training data. This complexity can lead to overfitting, where the model performs well on its training data but poorly on new, unseen data because it is too tailored to the specific examples it was trained on. High variance means the model is sensitive to small fluctuations in the training data, which can result in significant changes in the model's predictions. This is not ideal for the project at XYZ Investment Bank, as the model needs to generalize well to new articles and data that were not part of the training set. C is incorrect. Inaccuracy error is not a standard term used in machine learning or statistics to describe a specific type of error related to model performance. Typically, errors are categorized as bias or variance. The term \"inaccuracy error\" might be confused with general inaccuracies in predictions, which can result from either bias, variance, or both, but it is not a recognized category of error in the context of evaluating machine learning models. Therefore, referring to inaccuracy error can lead to confusion without providing a clear, technical explanation of what specifically is wrong with the model's predictions. ", "explhtml": "<p>Bias error occurs when a model is too simple, which means it does not capture the underlying patterns and complexities of the data. This simplicity leads to underfitting, where the model fails to make accurate predictions because it cannot generalize well from its training data to unseen data.
