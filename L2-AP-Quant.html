Regression Model Fit and Interpreting Model Results. LOS 2(b): Formulate hypotheses on the significance of two or more coefficients in a multiple regression model and interpret the results of the joint hypothesis tests<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Chang Zeng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chang Zeng is a candidate for Level II of the CFA program and a quantitative analyst with Oriental Investment Management Co., based in Shanghai, China. To assess the contagion effect or spread of market disturbances in financial markets, Zeng has been entrusted with calculating monthly returns of various stock indices for the last 5 years and checking whether the correlation among stock indices returns is significant. Zeng picks up four globally recognized indices and prepares a correlation matrix as shown below: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0081.webp\" style=\"max-width:min(100%,554px)\" alt=\"DJIA S&amp;P 500 FTSE 100 CAC 40 DJIA 1.00 S&amp;P 500 0.78 1.00 FTSE 100 0.43 0.66 1.00 CAC 40 0.38 0.33 0.80 1.00\"><p>Looking at the high correlation coefficient between DJIA and the S&amp;P 500, Zeng decides to develop a simple linear regression model to explain movement in the S&amp;P 500 using the DJIA. He decides upon the following model.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0082.webp\" style=\"max-width:min(100%,243px)\" alt=\"S&amp;P 500 = β0 + β1 (DJIA) + ε\"><p>Chao Lee, a colleague of Zeng and a senior quantitative analyst, looks at the model and tells Zeng the model is incorrect. According to Lee, Zeng ignores some of the most important limitations of correlation analysis.<\/p><p>Next, Zeng turns his attention to developing a regression model to predict stock market returns using the GDP growth rate. He considers quarterly returns of the S&amp;P 500 (S&amp;P) as a proxy for stock market returns and quarterly changes in GDP as GDP growth rate (GDP Growth). The linear regression model is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0083.webp\" style=\"max-width:min(100%,269px)\" alt=\"S&amp;P = β0 + β1 (GDP Growth) + ε\"><p>Zeng develops the following partial ANOVA table and regression statistics based on the last 10 years of quarterly data about the S&amp;P 500 and GDP. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0084.webp\" style=\"max-width:min(100%,76px)\" alt=\"ANOVA\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0085.webp\" style=\"max-width:min(100%,442px)\" alt=\"DF SS Regression 1 108 Residuals 38 To be calculated Total 39 155.5 Regression Statistics Coefficient Std Error Intercept 0.5125 0.0366 Slope 3.8426 0.0534\"><p>Zeng draws inferences using the following values from the t-distribution and F-distribution. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0086.webp\" style=\"max-width:min(100%,559px)\" alt=\"One-tailed t-distribution table df p=0.005 p=0.01 p=0.025 p=0.05 p=0.10 56 2.6665 2.3948 2.0032 1.6725 1.2969 57 2.6649 2.3936 2.0025 1.6720 1.2966 58 2.6633 2.3924 2.0017 1.6716 1.2963 59 2.6618 2.3912 2.0010 1.6711 1.2961 60 2.6603 2.3901 2.0003 1.6706 1.2958 F-table\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0087.webp\" style=\"max-width:min(100%,561px)\" alt=\"df1=1 df2 P=0.005 P=0.01 P=0.025 P=0.05 P=0.1 36 8.9430 7.3956 5.4712 4.1132 2.8503 38 8.8821 7.3525 5.4463 4.0982 2.8424 40 8.8279 7.3141 5.4239 4.0847 2.8354 42 8.7791 7.2796 5.4039 4.0727 2.8290 44 8.7352 7.2484 5.3857 4.0617 2.8232 48 8.6590 7.1942 5.3541 4.0427 2.8131 50 8.6258 7.1706 5.3403 4.\"><\/div><\/details><div class=\"qtext\"><p>The significance of Zeng’s model for predicting the S&amp;P 500 return using the GDP growth rate can be tested by:<\/p><\/div>", "subj": "quant"}, {"n": 37, "q": "Which of the properties described by Mike does not satisfy the principal requirements of a covariance-stationary series:", "opts": ["Property 1", "Property 2", "Property 3"], "ans": "B", "expl": "A covariance stationary series must satisfy three principal requirements: The expected value of the time series must be constant and finite in all periods. The variance of the time series must be constant and finite in all periods. The covariance of the time series with itself for a fixed number of periods in the past or future must be constant and finite in all periods.", "explhtml": "<p>A covariance stationary series must satisfy three principal requirements:<\/p><p>The expected value of the time series must be constant and finite in all periods.<\/p><p>The variance of the time series must be <b>constant<\/b> and finite in all periods.<\/p><p>The covariance of the time series with itself for a fixed number of periods in the past or<\/p><p>future must be constant and finite in all periods.<\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(c): Explain the requirement for a time series to be covariance stationary and describe the significance of a series that is not stationary<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Mike Watson<\/summary><div class=\"vig-body\"><p>Mike Watson is a financial analyst at a Hong Kong-based hedge fund. He is currently working on analyzing WLL Industries, an auto parts manufacturer. Mike wants to do statistical analysis to predict the company&#x27;s net income margin using quarterly data. He believes that the company’s net income margin is a function of the net income margin from the previous period, so he builds a first-order autoregressive model, AR(1):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0091.webp\" style=\"max-width:min(100%,204px)\" alt=\"NIMt = b0 + b1 × NIMt−1\"><p>He collects data from the first quarter of 2001 to the third quarter of 2015 with the following regression results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0092.webp\" style=\"max-width:min(100%,582px)\" alt=\"Exhibit 1: AR (1) Results Regression Statistics Multiple R 0.75 R Square 0.65 Adjusted R Square 0.58 Standard Error 2.45 Observations 59 Coefficients Standard Error Intercept 0.42 0.03 NIMt-1 0.91 0.25\"><p>*Critical value of t-statistic is 2 for 57 degrees of freedom and a 5% significance level<\/p><p>The following exhibit shows the autocorrelation of the residuals:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0093.webp\" style=\"max-width:min(100%,341px)\" alt=\"Exhibit 2: Autocorrelation of Residuals Lag Autocorrelation 1 0.2349 2 0.2154 3 0.1984 4 0.4561\"><p>Mike includes the lag 3 and lag 4 terms in his original AR(1) model.<\/p><p>Mike calculates that the time series for the net income margin has a mean reverting level of 1.57. He says the time series would tend to stay the same if its current value is 1.57, increase if its current value is below 1.57, and decrease if its current value is above 1.57.<\/p><p>Mike also observes that the time series he is modeling has the following properties:<\/p><p>Property 1: The expected value of the time series is constant and finite in all periods.<\/p><p>Property 2: The variance of the time series changes and is finite in all periods.<\/p><p>Property 3: The covariance of the time series for a fixed number of periods in the past or future must be constant and finite in all periods.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the properties described by Mike does not satisfy the principal requirements of a covariance-stationary series:<\/p><\/div>", "subj": "quant"}, {"n": 38, "q": "Based on Exhibit 1, which of the following is most likely to be correct:", "opts": ["Neither the intercept nor the NIM coefficient is statistically significant.", "Only the intercept is statistically significant.", "Both the intercept and the NIM coefficient are statistically significant."], "ans": "C", "expl": "t − statistic = ^bsi^b−ibi t − statistic for intercept = (0.42 − 0)/0.03 = 14.00 t − statistic for N IMt−1 = (0.91 − 0)/0.25 = 3.64 Since the test statistics for intercept and NIM are greater than the critical value of 2.0, Mike must reject the null hypotheses that the intercept is equal to zero and that the coefficient of the NIM is equal to zero. Hence, the intercept and NIM coefficients are statistically significant.", "explhtml": "<p>t − statistic =<sup> ^<\/sup><sup>b<\/sup><sub>s<\/sub><sup>i<\/sup><sub>^<\/sub><sub>b<\/sub><sup>−<\/sup><sub>i<\/sub><sup>b<\/sup><sup>i<\/sup><\/p><p>t − statistic for intercept = (0.42 − 0)/0.03 = 14.00<\/p><p>t − statistic for N IM<sub>t−1<\/sub> = (0.91 − 0)/0.25 = 3.64<\/p><p>Since the test statistics for intercept and NIM are greater than the critical value of 2.0, Mike must reject the null hypotheses that the intercept is equal to zero and that the coefficient of the NIM is equal to zero.<\/p><p>Hence, the intercept and NIM coefficients are statistically significant.<\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Regression Model Fit and Interpreting Model Results, LOS 2 ( b) Formulate hypotheses on the significance of two or more coefficients in a multiple regression model and interpret the results of the joint hypothesis tests.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Mike Watson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mike Watson is a financial analyst at a Hong Kong-based hedge fund. He is currently working on analyzing WLL Industries, an auto parts manufacturer. Mike wants to do statistical analysis to predict the company&#x27;s net income margin using quarterly data. He believes that the company’s net income margin is a function of the net income margin from the previous period, so he builds a first-order autoregressive model, AR(1):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0091.webp\" style=\"max-width:min(100%,204px)\" alt=\"NIMt = b0 + b1 × NIMt−1\"><p>He collects data from the first quarter of 2001 to the third quarter of 2015 with the following regression results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0092.webp\" style=\"max-width:min(100%,582px)\" alt=\"Exhibit 1: AR (1) Results Regression Statistics Multiple R 0.75 R Square 0.65 Adjusted R Square 0.58 Standard Error 2.45 Observations 59 Coefficients Standard Error Intercept 0.42 0.03 NIMt-1 0.91 0.25\"><p>*Critical value of t-statistic is 2 for 57 degrees of freedom and a 5% significance level<\/p><p>The following exhibit shows the autocorrelation of the residuals:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0093.webp\" style=\"max-width:min(100%,341px)\" alt=\"Exhibit 2: Autocorrelation of Residuals Lag Autocorrelation 1 0.2349 2 0.2154 3 0.1984 4 0.4561\"><p>Mike includes the lag 3 and lag 4 terms in his original AR(1) model.<\/p><p>Mike calculates that the time series for the net income margin has a mean reverting level of 1.57. He says the time series would tend to stay the same if its current value is 1.57, increase if its current value is below 1.57, and decrease if its current value is above 1.57.<\/p><p>Mike also observes that the time series he is modeling has the following properties:<\/p><p>Property 1: The expected value of the time series is constant and finite in all periods.<\/p><p>Property 2: The variance of the time series changes and is finite in all periods.<\/p><p>Property 3: The covariance of the time series for a fixed number of periods in the past or future must be constant and finite in all periods.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which of the following is most likely to be correct:<\/p><\/div>", "subj": "quant"}, {"n": 39, "q": "With respect to the mean reverting level, Mike is most likely:", "opts": ["Correct", "Incorrect with regard to the value of the mean level", "Incorrect with regard to the increase and decrease in the value of the time series"], "ans": "B", "expl": "Mean reverting level is given by It is correct that a time series shows mean reversion if it tends to fall when its level is above its mean and rise when its level is below its mean.", "explhtml": "<p>Mean reverting level is given by<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0094.webp\" style=\"max-width:min(100%,202px)\" alt=\"b0 0.42 (1 −b1) = 1 −0.91 = 4.67\"><p>It is correct that a time series shows mean reversion if it tends to fall when its level is above its mean and rise when its level is below its mean.<\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(f): Explain mean reversion and calculate a mean-reverting level<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Mike Watson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mike Watson is a financial analyst at a Hong Kong-based hedge fund. He is currently working on analyzing WLL Industries, an auto parts manufacturer. Mike wants to do statistical analysis to predict the company&#x27;s net income margin using quarterly data. He believes that the company’s net income margin is a function of the net income margin from the previous period, so he builds a first-order autoregressive model, AR(1):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0091.webp\" style=\"max-width:min(100%,204px)\" alt=\"NIMt = b0 + b1 × NIMt−1\"><p>He collects data from the first quarter of 2001 to the third quarter of 2015 with the following regression results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0092.webp\" style=\"max-width:min(100%,582px)\" alt=\"Exhibit 1: AR (1) Results Regression Statistics Multiple R 0.75 R Square 0.65 Adjusted R Square 0.58 Standard Error 2.45 Observations 59 Coefficients Standard Error Intercept 0.42 0.03 NIMt-1 0.91 0.25\"><p>*Critical value of t-statistic is 2 for 57 degrees of freedom and a 5% significance level<\/p><p>The following exhibit shows the autocorrelation of the residuals:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0093.webp\" style=\"max-width:min(100%,341px)\" alt=\"Exhibit 2: Autocorrelation of Residuals Lag Autocorrelation 1 0.2349 2 0.2154 3 0.1984 4 0.4561\"><p>Mike includes the lag 3 and lag 4 terms in his original AR(1) model.<\/p><p>Mike calculates that the time series for the net income margin has a mean reverting level of 1.57. He says the time series would tend to stay the same if its current value is 1.57, increase if its current value is below 1.57, and decrease if its current value is above 1.57.<\/p><p>Mike also observes that the time series he is modeling has the following properties:<\/p><p>Property 1: The expected value of the time series is constant and finite in all periods.<\/p><p>Property 2: The variance of the time series changes and is finite in all periods.<\/p><p>Property 3: The covariance of the time series for a fixed number of periods in the past or future must be constant and finite in all periods.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to the mean reverting level, Mike is most likely:<\/p><\/div>", "subj": "quant"}, {"n": 40, "q": "Mike’s lag inclusion is most likely :", "opts": ["Correct", "Incorrect with regard to lag 3", "Incorrect with regard to lag 4"], "ans": "B", "expl": "We can determine if the original model is correctly specified by testing whether the autocorrelations of the error term differ significantly from 0. If they do, the model needs to be modified. A test of the null hypothesis that error autocorrelation at a specified lag equals 0 is based on the residual autocorrelation for that lag and the standard error of the residual correlation. The standard error is equal to the inverse of the square root of the number of the observations. The t-statistic is then calculated by dividing the residual autocorrelation by the standard error. The standard error in this case is √519 = 0.1302 The test statistic for lag 4 is greater than the critical value of 2.0 for a two-tailed t-test. This indicates that the autocorrelation is significantly different from zero for lag 4, so lag 4 should be included. However, the test statistic for lag 3 is less than the critical value of 2.0 for a two-tailed t-test. This indicates that the autocorrelation is not significantly different from zero for lag 3, so lag 3 should not be included.", "explhtml": "<p>We can determine if the original model is correctly specified by testing whether the autocorrelations of the error term differ significantly from 0. If they do, the model needs to be modified. A test of the null hypothesis that error autocorrelation at a specified lag equals 0 is based on the residual autocorrelation for that lag and the standard error of the residual correlation. The standard error is equal to the inverse of the square root of the number of the observations. The t-statistic is then calculated by dividing the residual autocorrelation by the standard error. The standard error in this case is √<sub>5<\/sub><sup>1<\/sup><sub>9<\/sub> = 0.1302<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0095.webp\" style=\"max-width:min(100%,538px)\" alt=\"Lag Autocorrelation Standard Error t Test –Stat 1 0.2349 0.1302 1.8043 2 0.2154 0.1302 1.6544 3 0.1984 0.1302 1.5238 4 0.4561 0.1302 3.5031\"><p>The test statistic for lag 4 is greater than the critical value of 2.0 for a two-tailed t-test. This indicates that the autocorrelation is significantly different from zero for lag 4, so lag 4 should be included.<\/p><p>However, the test statistic for lag 3 is less than the critical value of 2.0 for a two-tailed t-test. This indicates that the autocorrelation is not significantly different from zero for lag 3, so lag 3 should not be included.<\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(e): Explain how autocorrelations of the residuals can be used to test whether the autoregressive model fits the time series<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Mike Watson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mike Watson is a financial analyst at a Hong Kong-based hedge fund. He is currently working on analyzing WLL Industries, an auto parts manufacturer. Mike wants to do statistical analysis to predict the company&#x27;s net income margin using quarterly data. He believes that the company’s net income margin is a function of the net income margin from the previous period, so he builds a first-order autoregressive model, AR(1):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0091.webp\" style=\"max-width:min(100%,204px)\" alt=\"NIMt = b0 + b1 × NIMt−1\"><p>He collects data from the first quarter of 2001 to the third quarter of 2015 with the following regression results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0092.webp\" style=\"max-width:min(100%,582px)\" alt=\"Exhibit 1: AR (1) Results Regression Statistics Multiple R 0.75 R Square 0.65 Adjusted R Square 0.58 Standard Error 2.45 Observations 59 Coefficients Standard Error Intercept 0.42 0.03 NIMt-1 0.91 0.25\"><p>*Critical value of t-statistic is 2 for 57 degrees of freedom and a 5% significance level<\/p><p>The following exhibit shows the autocorrelation of the residuals:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0093.webp\" style=\"max-width:min(100%,341px)\" alt=\"Exhibit 2: Autocorrelation of Residuals Lag Autocorrelation 1 0.2349 2 0.2154 3 0.1984 4 0.4561\"><p>Mike includes the lag 3 and lag 4 terms in his original AR(1) model.<\/p><p>Mike calculates that the time series for the net income margin has a mean reverting level of 1.57. He says the time series would tend to stay the same if its current value is 1.57, increase if its current value is below 1.57, and decrease if its current value is above 1.57.<\/p><p>Mike also observes that the time series he is modeling has the following properties:<\/p><p>Property 1: The expected value of the time series is constant and finite in all periods.<\/p><p>Property 2: The variance of the time series changes and is finite in all periods.<\/p><p>Property 3: The covariance of the time series for a fixed number of periods in the past or future must be constant and finite in all periods.<\/p><\/div><\/details><div class=\"qtext\"><p>Mike’s lag inclusion is most likely :<\/p><\/div>", "subj": "quant"}, {"n": 41, "q": "The estimate of forecasted MUS sales for this quarter using the model Thomas suggested is closest to :", "opts": ["$5,900", "$6,100", "$6,300"], "ans": "A", "expl": "The correct forecast of MUS sales for this quarter using the model suggested by Thomas is calculated using the natural log transformation of the sales data. The model equation provided is where b0 is the intercept and b1 is the coefficient for the lag 1 sales. Plugging in the values from the table, we have b0 = 2.768 and b1 = 0.675. The actual sales from one quarter ago, Salest−1, is \\$6,390. Therefore, the forecast equation becomes: Calculating ln(6390) gives approximately 8.762. Substituting this back into the forecast equation gives: To convert this log value back to the actual sales forecast in dollars, we use the exponential function: This calculation shows that the forecasted sales for this quarter are closest to \\$5,900, confirming that option A is correct. B is incorrect. It suggests a forecast of \\$6,100. Using the model and calculations provided, the natural log of the forecasted sales was calculated to be 8.683, which when converted back to the dollar amount using the exponential function, results in approximately \\$5,900. This value does not round to \\$6,100, nor does it approach this figure closely enough to be considered a rounding error. The mathematical computation clearly supports a forecast closer to \\$5,900 rather than \\$6,100, making option B incorrect. C is incorrect. It suggests a forecast of \\$6,300. Similar to the reasoning for option B, the calculated forecast using the exponential transformation of the log value (8.683) results in approximately \\$5,900. This forecast is significantly lower than \\$6,300, and there is no rounding or approximation that would justifiably increase the forecast to \\$6,300. The discrepancy between the calculated forecast and the value suggested in option C confirms that this option is incorrect.", "explhtml": "<p>The correct forecast of MUS sales for this quarter using the model suggested by Thomas is calculated using the natural log transformation of the sales data. The model equation provided is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0105.webp\" style=\"max-width:min(100%,250px)\" alt=\"ln(Salest) = b0 + b1 ln(Salest−1)\"><p>where b<sub>0<\/sub> is the intercept and b<sub>1<\/sub> is the coefficient for the lag 1 sales. Plugging in the values from the table, we have b<sub>0<\/sub> = 2.768 and b<sub>1<\/sub> = 0.675. The actual sales from one quarter ago, Sales<sub>t−1<\/sub>, is \\$6,390. Therefore, the forecast equation becomes:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0106.webp\" style=\"max-width:min(100%,295px)\" alt=\"ln(Salest) = 2.768 + 0.675× ln(6390)\"><p>Calculating ln(6390) gives approximately 8.762. Substituting this back into the forecast equation gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0107.webp\" style=\"max-width:min(100%,337px)\" alt=\"ln(Salest) = 2.768 + 0.675 × 8.762 = 8.683\"><p>To convert this log value back to the actual sales forecast in dollars, we use the exponential function:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0108.webp\" style=\"max-width:min(100%,196px)\" alt=\"Salest = e8.683 ≈$5, 900\"><p>This calculation shows that the forecasted sales for this quarter are closest to \\$5,900, confirming that option A is correct.<\/p><p><b>B is incorrect<\/b>. It suggests a forecast of \\$6,100. Using the model and calculations provided, the natural log of the forecasted sales was calculated to be 8.683, which when converted back to the dollar amount using the exponential function, results in approximately \\$5,900. This value does not round to \\$6,100, nor does it approach this figure closely enough to be considered a rounding error. The mathematical computation clearly supports a forecast closer to \\$5,900 rather than \\$6,100, making option B incorrect.<\/p><p><b>C is incorrect<\/b>. It suggests a forecast of \\$6,300. Similar to the reasoning for option B, the calculated forecast using the exponential transformation of the log value (8.683) results in approximately \\$5,900. This forecast is significantly lower than \\$6,300, and there is no rounding or approximation that would justifiably increase the forecast to \\$6,300. The discrepancy between the calculated forecast and the value suggested in option C confirms that this option is incorrect.<\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(d): Describe the structure of an autoregressive (AR) model of order p and calculate one- and two-period- ahead forecasts given the estimated coefficients<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Thomas Anderson<\/summary><div class=\"vig-body\"><p>Thomas Anderson, CFA, is a research analyst at Frank Capital Consultants, a provider of statistical modeling and financial advice to clients spread out across the world. Thomas is working on analyzing a company, RWC Inc., a manufacturer of water pipes. He examines the company’s sales and runs an autoregressive model to identify any observable pattern in the sales data for the past five years. The model uses a lag one variable. The regression results are given below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0096.webp\" style=\"max-width:min(100%,592px)\" alt=\"Exhibit 1 - RWC Inc. Autoregressive Model with Lag 1 Regression Statistics Multiple R 0.9800 R Squared 0.8300 Adjusted R Square 0.8300 Standard Error 12,000 Observations 100 Standard Coefficients t Test Stat P-value Error Intercept 124.3000 58.9000 2.1104 0.04 Lag 1 0.9000 0.0500 18.0000 0.00\"><p>He also runs an autoregressive model by including Lag 1 and Lag 4 and gets the following results: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0097.webp\" style=\"max-width:min(100%,547px)\" alt=\"Exhibit 2: RWC Inc. Autoregressive Model with Lag 1 and Lag 4\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0098.webp\" style=\"max-width:min(100%,589px)\" alt=\"Regression Statistics Multiple R 0.9800 R Square 0.9200 Adjusted R Square 0.8800 Standard Error 10,000 Observations 100 Standard t Test Coefficients P-value Error Stat Intercept -11.4200 3.1000 -3.6839 0.0025 Lag 1 0.3400 0.0500 6.8000 0.0012 Lag 4 0.4000 0.0500 8.0000 0.0018\"><p>One of Thomas’s colleagues, Gary Miller, is also working on a similar task with a different company, MUS Inc. Thomas suggests that Gary use a natural log transformation of MUS data with the following model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0099.webp\" style=\"max-width:min(100%,256px)\" alt=\"In (Salest) = b0 + b1In (Salest−1)\"><p>The Lag 1 independent variable is statistically different from zero. However, Gary wonders whether he should include Lag 2 and Lag 4 terms. The following exhibit gives the autocorrelation of the residuals (based on 49 observations).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0100.webp\" style=\"max-width:min(100%,343px)\" alt=\"Exhibit 3: MUS’s Autoregressive Model Lag Autocorrelation 1 0.2349 2 0.2154 3 0.1984 4 0.4561\"><p>*The critical values, assuming 5% significance level and 47 degrees of freedom, are 2.012 for a two-tail t-test and 1.678 for a one-tail t-test.<\/p><p>Parameter estimates for this autoregressive model and the actual data for the two most recent quarters are shown in the following exhibit: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0101.webp\" style=\"max-width:min(100%,525px)\" alt=\"Intercept 2.768 Lag 1 coefficient 0.675 Actual sales one quarter ago $6,390 Actual sales two quarters ago $6,120\"><p>Gary thinks that the MUS sales may be more appropriately modeled with an ARCH model, so he says:<\/p><p>Comment 1: We can test whether a time series is ARCH by regressing the squared residuals from a previously estimated time-series model on a constant and one lag of the squared residuals.<\/p><p>Comment 2: If the residuals are regressed against the MUS sales data using the equation  e<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>X<sub>t<\/sub> , where e represents the residual terms from the original regression and X represents the sales data, and if b<sub>1<\/sub> is statistically different from zero, then the regression model contains an ARCH process.<\/p><p>Thomas is also evaluating the performance of the 10-year Indian and Chinese Stock indexes based on the U.S. Federal Funds rate. He uses the following regression models:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0102.webp\" style=\"max-width:min(100%,197px)\" alt=\"BYIndia,t = b0 + b1FFUS,t BYChina,t = b0 + b1FFUS,t\"><p>Before running the regression, he says:<\/p><p>Time series for the U.S. federal funds rate has a unit root.<\/p><p>Time series for the stock index in China has a unit root.<\/p><p>Time series for the U.S. federal funds rate and the Chinese stock index are<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0103.webp\" style=\"max-width:min(100%,115px)\" alt=\"cointegrated.\"><p>Time series for the stock index in India does not have a unit root.<\/p><p>Time series for the U.S. federal funds rate and the stock index in India are not<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0104.webp\" style=\"max-width:min(100%,115px)\" alt=\"cointegrated.\"><\/div><\/details><div class=\"qtext\"><p>The estimate of forecasted MUS sales for this quarter using the model Thomas suggested is closest to :<\/p><\/div>", "subj": "quant"}, {"n": 42, "q": "Which of the following models would best describe the sales of RWC:", "opts": ["Xt = b0 + b1Xt−1", "Xt = b0 + b1Xt−1 + b2Xt−4", "Xt = b0 + b1Xt−4"], "ans": "B", "expl": "The correct model to describe the sales of RWC Inc. is Option B: Xt = b0 + b1Xt−1 + b2Xt−4. This model is superior because it includes both Lag 1 and Lag 4, which are statistically significant in predicting the sales of RWC Inc. The inclusion of these lags is justified by the results from the autoregressive model with Lag 1 and Lag 4, where both coefficients for Lag 1 and Lag 4 are statistically significant with p-values well below the 0.05 threshold, indicating strong evidence against the null hypothesis of no effect. Furthermore, the adjusted R2 value for this model is 0.8800, which is higher than the adjusted R2 of 0.8300 for the model including only Lag 1. This increase in R2 suggests that the model with both lags explains a greater proportion of the variance in sales data, making it a more reliable and effective model for forecasting. A is incorrect. Option A, which models sales as Xt = b0 + b1Xt−1, only includes Lag 1. While the Lag 1 variable itself is statistically significant, this model does not account for additional autocorrelation that might be present at other lags. The adjusted R2 for this model is 0.8300, which is lower than the model that also includes Lag 4. This indicates that while the model is somewhat effective, it does not capture as much of the variability in sales data as the model that also includes Lag 4, leading to potentially less accurate forecasts. C is incorrect. Option C, which suggests using Xt = b0 + b1Xt−4 and excludes Lag 1, is not supported by the statistical evidence. The significance of Lag 1 in predicting sales is clear from its low p-value and high t-statistic in both models where it is included. Ignoring this lag would omit a crucial part of the sales dynamics, as indicated by the significant decrease in model fit when Lag 1 is not included. This model would likely lead to inferior predictive performance compared to the models that include Lag 1. ", "explhtml": "<p>The correct model to describe the sales of RWC Inc. is <b>Option B<\/b>: X<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>X<sub>t−1<\/sub> + b<sub>2<\/sub>X<sub>t−4<\/sub>. This model is superior because it includes both Lag 1 and Lag 4, which are statistically significant in predicting the sales of RWC Inc. The inclusion of these lags is justified by the results from the autoregressive model with Lag 1 and Lag 4, where both coefficients for Lag 1 and Lag 4 are statistically significant with p-values well below the 0.05 threshold, indicating strong evidence against the null hypothesis of no effect. Furthermore, the adjusted R<sup>2<\/sup> value for this model is 0.8800, which is higher than the adjusted R<sup>2<\/sup> of 0.8300 for the model including only Lag 1. This increase in R<sup>2<\/sup> suggests that the model with both lags explains a greater proportion of the variance in sales data, making it a more reliable and effective model for forecasting.<\/p><p><b>A is incorrect<\/b>. Option A, which models sales as X<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>X<sub>t−1<\/sub>, only includes Lag 1. While the Lag 1 variable itself is statistically significant, this model does not account for additional autocorrelation that might be present at other lags. The adjusted R<sup>2<\/sup> for this model is 0.8300, which is lower than the model that also includes Lag 4. This indicates that while the model is somewhat effective, it does not capture as much of the variability in sales data as the model that also includes Lag 4, leading to potentially less accurate forecasts.<\/p><p><b>C is incorrect<\/b>. Option C, which suggests using X<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>X<sub>t−4<\/sub> and excludes Lag 1, is not supported by the statistical evidence. The significance of Lag 1 in predicting sales is clear from its low p-value and high t-statistic in both models where it is included. Ignoring this lag would omit a crucial part of the sales dynamics, as indicated by the significant decrease in model fit when Lag 1 is not included. This model would likely lead to inferior predictive performance compared to the models that include Lag 1. <\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(e): Explain how autocorrelations of the residuals can be used to test whether the autoregressive model fits the time series<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Thomas Anderson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Thomas Anderson, CFA, is a research analyst at Frank Capital Consultants, a provider of statistical modeling and financial advice to clients spread out across the world. Thomas is working on analyzing a company, RWC Inc., a manufacturer of water pipes. He examines the company’s sales and runs an autoregressive model to identify any observable pattern in the sales data for the past five years. The model uses a lag one variable. The regression results are given below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0096.webp\" style=\"max-width:min(100%,592px)\" alt=\"Exhibit 1 - RWC Inc. Autoregressive Model with Lag 1 Regression Statistics Multiple R 0.9800 R Squared 0.8300 Adjusted R Square 0.8300 Standard Error 12,000 Observations 100 Standard Coefficients t Test Stat P-value Error Intercept 124.3000 58.9000 2.1104 0.04 Lag 1 0.9000 0.0500 18.0000 0.00\"><p>He also runs an autoregressive model by including Lag 1 and Lag 4 and gets the following results: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0097.webp\" style=\"max-width:min(100%,547px)\" alt=\"Exhibit 2: RWC Inc. Autoregressive Model with Lag 1 and Lag 4\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0098.webp\" style=\"max-width:min(100%,589px)\" alt=\"Regression Statistics Multiple R 0.9800 R Square 0.9200 Adjusted R Square 0.8800 Standard Error 10,000 Observations 100 Standard t Test Coefficients P-value Error Stat Intercept -11.4200 3.1000 -3.6839 0.0025 Lag 1 0.3400 0.0500 6.8000 0.0012 Lag 4 0.4000 0.0500 8.0000 0.0018\"><p>One of Thomas’s colleagues, Gary Miller, is also working on a similar task with a different company, MUS Inc. Thomas suggests that Gary use a natural log transformation of MUS data with the following model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0099.webp\" style=\"max-width:min(100%,256px)\" alt=\"In (Salest) = b0 + b1In (Salest−1)\"><p>The Lag 1 independent variable is statistically different from zero. However, Gary wonders whether he should include Lag 2 and Lag 4 terms. The following exhibit gives the autocorrelation of the residuals (based on 49 observations).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0100.webp\" style=\"max-width:min(100%,343px)\" alt=\"Exhibit 3: MUS’s Autoregressive Model Lag Autocorrelation 1 0.2349 2 0.2154 3 0.1984 4 0.4561\"><p>*The critical values, assuming 5% significance level and 47 degrees of freedom, are 2.012 for a two-tail t-test and 1.678 for a one-tail t-test.<\/p><p>Parameter estimates for this autoregressive model and the actual data for the two most recent quarters are shown in the following exhibit: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0101.webp\" style=\"max-width:min(100%,525px)\" alt=\"Intercept 2.768 Lag 1 coefficient 0.675 Actual sales one quarter ago $6,390 Actual sales two quarters ago $6,120\"><p>Gary thinks that the MUS sales may be more appropriately modeled with an ARCH model, so he says:<\/p><p>Comment 1: We can test whether a time series is ARCH by regressing the squared residuals from a previously estimated time-series model on a constant and one lag of the squared residuals.<\/p><p>Comment 2: If the residuals are regressed against the MUS sales data using the equation  e<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>X<sub>t<\/sub> , where e represents the residual terms from the original regression and X represents the sales data, and if b<sub>1<\/sub> is statistically different from zero, then the regression model contains an ARCH process.<\/p><p>Thomas is also evaluating the performance of the 10-year Indian and Chinese Stock indexes based on the U.S. Federal Funds rate. He uses the following regression models:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0102.webp\" style=\"max-width:min(100%,197px)\" alt=\"BYIndia,t = b0 + b1FFUS,t BYChina,t = b0 + b1FFUS,t\"><p>Before running the regression, he says:<\/p><p>Time series for the U.S. federal funds rate has a unit root.<\/p><p>Time series for the stock index in China has a unit root.<\/p><p>Time series for the U.S. federal funds rate and the Chinese stock index are<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0103.webp\" style=\"max-width:min(100%,115px)\" alt=\"cointegrated.\"><p>Time series for the stock index in India does not have a unit root.<\/p><p>Time series for the U.S. federal funds rate and the stock index in India are not<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0104.webp\" style=\"max-width:min(100%,115px)\" alt=\"cointegrated.\"><\/div><\/details><div class=\"qtext\"><p>Which of the following models would best describe the sales of RWC:<\/p><\/div>", "subj": "quant"}, {"n": 43, "q": "Which of the comments regarding ARCH is/are most likely correct:", "opts": ["Comment 1 only", "Comment 2 only", "Both comments are correct"], "ans": "A", "expl": "Comment 1 is correct because it accurately describes the methodology for testing whether a time series exhibits autoregressive conditional heteroskedasticity (ARCH). In this approach, the squared residuals from a previously estimated time-series model are regressed on a constant and one lag of the squared residuals. This method is a standard procedure in econometrics to detect ARCH effects, where the presence of significant coefficients in such a regression indicates volatility clustering, a key characteristic of ARCH. The equation used in this test is where ϵt are the residuals from the original model, α0 is the constant, α1 is the coefficient of the lagged squared residual, and ut is the error term. If α1 is statistically significant, it suggests that past volatility (squared residuals) has a positive effect on current volatility, confirming the presence of ARCH. Comment 2 is incorrect because it mischaracterizes the method for detecting an ARCH process. The comment suggests using a regression model where the residuals et from the original regression are regressed against the sales data Xt. This approach is incorrect for diagnosing ARCH effects because ARCH is concerned with the autoregressive nature of volatility (squared residuals), not with the relationship between residuals and independent variables. The correct approach to test for an ARCH process involves examining the autocorrelation of squared residuals, not the correlation between residuals and independent variables. The appropriate model for detecting ARCH should be focused on the squared residuals as described in Comment 1, not on the residuals regressed against other types of data. The correct specification for testing ARCH in a regression framework would involve regressing the squared residuals on their own past values, not on the values of the independent variables from the original regression model. ", "explhtml": "<p>Comment 1 is <b>correct<\/b> because it accurately describes the methodology for testing whether a time series exhibits autoregressive conditional heteroskedasticity (ARCH). In this approach, the squared residuals from a previously estimated time-series model are regressed on a constant and one lag of the squared residuals. This method is a standard procedure in econometrics to detect ARCH effects, where the presence of significant coefficients in such a regression indicates volatility clustering, a key characteristic of ARCH. The equation used in this test is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0109.webp\" style=\"max-width:min(100%,172px)\" alt=\"ϵ2t = α0 + α1ϵ2t−1 + ut ,\"><p>where ϵ<sub>t<\/sub> are the residuals from the original model, α<sub>0<\/sub> is the constant, α<sub>1<\/sub> is the coefficient of the lagged squared residual, and u<sub>t<\/sub> is the error term. If α<sub>1<\/sub> is statistically significant, it suggests that past volatility (squared residuals) has a positive effect on current volatility, confirming the presence of ARCH.<\/p><p><b>Comment 2 is incorrect<\/b> because it mischaracterizes the method for detecting an ARCH process. The comment suggests using a regression model where the residuals e<sub>t<\/sub> from the original regression are regressed against the sales data X<sub>t<\/sub>. This approach is incorrect for diagnosing ARCH effects because ARCH is concerned with the autoregressive nature of volatility (squared residuals), not with the relationship between residuals and independent variables. The correct approach to test for an ARCH process involves examining the autocorrelation of squared residuals, not the correlation between residuals and independent variables. The appropriate model for detecting ARCH should be focused on the squared residuals as described in Comment 1, not on the residuals regressed against other types of data. The correct specification for testing ARCH in a regression framework would involve regressing the squared residuals on their own past values, not on the values of the independent variables from the original regression model. <\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(m): Explain au US Inc. Thomas suggests that Gary use a natural log transformation of MUS data with the following model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0099.webp\" style=\"max-width:min(100%,256px)\" alt=\"In (Salest) = b0 + b1In (Salest−1)\"><p>The Lag 1 independent variable is statistically different from zero. However, Gary wonders whether he should include Lag 2 and Lag 4 terms. The following exhibit gives the autocorrelation of the residuals (based on 49 observations).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0100.webp\" style=\"max-width:min(100%,343px)\" alt=\"Exhibit 3: MUS’s Autoregressive Model Lag Autocorrelation 1 0.2349 2 0.2154 3 0.1984 4 0.4561\"><p>*The critical values, assuming 5% significance level and 47 degrees of freedom, are 2.012 for a two-tail t-test and 1.678 for a one-tail t-test.<\/p><p>Parameter estimates for this autoregressive model and the actual data for the two most recent quarters are shown in the following exhibit: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0101.webp\" style=\"max-width:min(100%,525px)\" alt=\"Intercept 2.768 Lag 1 coefficient 0.675 Actual sales one quarter ago $6,390 Actual sales two quarters ago $6,120\"><p>Gary thinks that the MUS sales may be more appropriately modeled with an ARCH model, so he says:<\/p><p>Comment 1: We can test whether a time series is ARCH by regressing the squared residuals from a previously estimated time-series model on a constant and one lag of the squared residuals.<\/p><p>Comment 2: If the residuals are regressed against the MUS sales data using the equation  e<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>X<sub>t<\/sub> , where e represents the residual terms from the original regression and X represents the sales data, and if b<sub>1<\/sub> is statistically different from zero, then the regression model contains an ARCH process.<\/p><p>Thomas is also evaluating the performance of the 10-year Indian and Chinese Stock indexes based on the U.S. Federal Funds rate. He uses the following regression models:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0102.webp\" style=\"max-width:min(100%,197px)\" alt=\"BYIndia,t = b0 + b1FFUS,t BYChina,t = b0 + b1FFUS,t\"><p>Before running the regression, he says:<\/p><p>Time series for the U.S. federal funds rate has a unit root.<\/p><p>Time series for the stock index in China has a unit root.<\/p><p>Time series for the U.S. federal funds rate and the Chinese stock index are<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0103.webp\" style=\"max-width:min(100%,115px)\" alt=\"cointegrated.\"><p>Time series for the stock index in India does not have a unit root.<\/p><p>Time series for the U.S. federal funds rate and the stock index in India are not<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0104.webp\" style=\"max-width:min(100%,115px)\" alt=\"cointegrated.\"><\/div><\/details><div class=\"qtext\"><p>Which of the comments regarding ARCH is/are most likely correct:<\/p><\/div>", "subj": "quant"}, {"n": 44, "q": "Which of the lags should Gary include in the regression of MUS data:", "opts": ["Lag 2 only", "Lag 4 only", "Both Lag 2 and Lag 4"], "ans": "B", "expl": "The decision on which lags to include in the regression model for MUS data should be based on the statistical significance of the autocorrelations at those lags. The autocorrelation of a lag measures the correlation of the series with its own past values, and significant autocorrelation at a particular lag suggests that the model could be improved by including that lag as a regressor. In this case, we are examining the autocorrelations at lags 2 and 4. The standard error for testing the significance of autocorrelation in a sample of 49 observations is calculated as Using this standard error, the t-statistic for each lag can be computed by dividing the autocorrelation by the standard error. The t-statistics for lags 2 and 4 are calculated as follows: The critical value for a two-tailed t-test at a 5% significance level with 47 degrees of freedom is 2.012. Comparing the t-statistics with the critical value, we find that the t-statistic for Lag 4 (3.1927) is greater than the critical value, indicating that the autocorrelation at Lag 4 is statistically significant. However, the t-statistic for Lag 2 (1.5078) does not exceed the critical value, suggesting that the autocorrelation at Lag 2 is not statistically significant. Including only Lag 4 in the regression model is appropriate because its autocorrelation is statistically significant, indicating that past values at this lag have a predictive relationship with the current value of the series. This inclusion could potentially improve the model's accuracy in forecasting future values. A is incorrect. Including only Lag 2 in the regression model is not justified as its autocorrelation is not statistically significant. This implies that Lag 2 does not provide additional predictive power beyond what is already captured by other included variables, and including it might unnecessarily complicate the model without improving its predictive capability. C is incorrect. Including both Lag 2 and Lag 4 is not the best choice because the autocorrelation at Lag 2 is not statistically significant. Including a non-significant lag could lead to overfitting, where the model becomes too closely fitted to the idiosyncrasies of the sample data, potentially impairing its performance on new data. Therefore, it is more prudent to include only those lags that have shown significant autocorrelation. ", "explhtml": "<p>The decision on which lags to include in the regression model for MUS data should be based on the statistical significance of the autocorrelations at those lags. The autocorrelation of a lag measures the correlation of the series with its own past values, and significant autocorrelation at a particular lag suggests that the model could be improved by including that lag as a regressor. In this case, we are examining the autocorrelations at lags 2 and 4.<\/p><p>The standard error for testing the significance of autocorrelation in a sample of 49 observations is calculated as<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0110.webp\" style=\"max-width:min(100%,142px)\" alt=\"1 √ = 0.142857. 49\"><p>Using this standard error, the t-statistic for each lag can be computed by dividing the autocorrelation by the standard error. The t-statistics for lags 2 and 4 are calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0111.webp\" style=\"max-width:min(100%,206px)\" alt=\"0.2154 tLag2 = 0.142857 = 1.5078 0.4561 tLag4 = 0.142857 = 3.1927\"><p>The critical value for a two-tailed t-test at a 5% significance level with 47 degrees of freedom is 2.012. Comparing the t-statistics with the critical value, we find that the t-statistic for Lag 4 (3.1927) is greater than the critical value, indicating that the autocorrelation at Lag 4 is statistically significant. However, the t-statistic for Lag 2 (1.5078) does not exceed the critical value, suggesting that the autocorrelation at Lag 2 is not statistically significant.<\/p><p>Including only Lag 4 in the regression model is appropriate because its autocorrelation is statistically significant, indicating that past values at this lag have a predictive relationship with the current value of the series. This inclusion could potentially improve the model&#x27;s accuracy in forecasting future values.<\/p><p><b>A is incorrect<\/b>. Including only Lag 2 in the regression model is not justified as its autocorrelation is not statistically significant. This implies that Lag 2 does not provide additional predictive power beyond what is already captured by other included variables, and including it might unnecessarily complicate the model without improving its predictive capability.<\/p><p><b>C is incorrect<\/b>. Including both Lag 2 and Lag 4 is not the best choice because the autocorrelation at Lag 2 is not statistically significant. Including a non-significant lag could lead to overfitting, where the model becomes too closely fitted to the idiosyncrasies of the sample data, potentially impairing its performance on new data. Therefore, it is more prudent to include only those lags that have shown significant autocorrelation. <\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(e): Explain how autocorrelations of the residuals can be used to test whether the autoregressive model fits the time series<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Thomas Anderson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Thomas Anderson, CFA, is a research analyst at Frank Capital Consultants, a provider of statistical modeling and financial advice to clients spread out across the world. Thomas is working on analyzing a company, RWC Inc., a manufacturer of water pipes. He examines the company’s sales and runs an autoregressive model to identify any observable pattern in the sales data for the past five years. The model uses a lag one variable. The regression results are given below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0096.webp\" style=\"max-width:min(100%,592px)\" alt=\"Exhibit 1 - RWC Inc. Autoregressive Model with Lag 1 Regression Statistics Multiple R 0.9800 R Squared 0.8300 Adjusted R Square 0.8300 Standard Error 12,000 Observations 100 Standard Coefficients t Test Stat P-value Error Intercept 124.3000 58.9000 2.1104 0.04 Lag 1 0.9000 0.0500 18.0000 0.00\"><p>He also runs an autoregressive model by including Lag 1 and Lag 4 and gets the following results: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0097.webp\" style=\"max-width:min(100%,547px)\" alt=\"Exhibit 2: RWC Inc. Autoregressive Model with Lag 1 and Lag 4\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0098.webp\" style=\"max-widt
