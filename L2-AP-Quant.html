suring that each step of the calculation is followed meticulously is crucial to avoid such overestimations and to align the computed F-statistic with the correct value derived from the regression data.", "explhtml": "<p>The calculation of the F-statistic for the model to forecast TNOL profit change involves several steps, each based on the regression output provided. First, we calculate the Total Sum of Squares (TSS) using the formula<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0052.webp\" style=\"max-width:min(100%,103px)\" alt=\"TSS = RSS R2\"><p>where RSS is the Regression Sum of Squares and R<sup>2<\/sup> is the coefficient of determination. Given  RSS = 231.54 and R<sup>2<\/sup> = 0.8921, we find T SS as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0053.webp\" style=\"max-width:min(100%,194px)\" alt=\"231.54 TSS = = 259.55. 0.8921\"><p>Next, we determine the Error Sum of Squares (SSE) by subtracting RSS from T SS:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0054.webp\" style=\"max-width:min(100%,366px)\" alt=\"SSE = TSS −RSS = 259.55 −231.54 = 28.01.\"><p>The Mean Square Error (MSE) is calculated by dividing SSE by the degrees of freedom, which is  n − k − 1 where n is the number of observations and k is the number of predictors. Here, n = 48 and k = 3, so:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0055.webp\" style=\"max-width:min(100%,297px)\" alt=\"MSE = SSE = 28.01 = 0.6365. (48 −3 −1) 44\"><p>The Mean Square Regression (MSR) is found by dividing RSS by k:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0056.webp\" style=\"max-width:min(100%,247px)\" alt=\"MSR = RSS = 231.54 = 77.18. k 3\"><p>Finally, the F-statistic is calculated by dividing MS R by M SE:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0057.webp\" style=\"max-width:min(100%,316px)\" alt=\"F −statistic = MSR = 77.18 = 121.26. MSE 0.6365\"><p>This value is closest to option B, which is 121.<\/p><p><b>A is incorrect<\/b>. The value of 86 is significantly lower than the calculated F-statistic of 121.26. This discrepancy arises because the calculation for option A likely involves incorrect assumptions or errors in the computation of either RSS, MSE, or MSR. It is essential to follow the correct formulas and use the accurate values provided in the regression output to compute the F-statistic accurately.<\/p><p><b>C is incorrect<\/b>. The value of 136 is higher than the calculated F-statistic of 121.26. This indicates an overestimation which could be due to incorrect division or misinterpretation of the regression output values. Ensuring that each step of the calculation is followed meticulously is crucial to avoid such overestimations and to align the computed F-statistic with the correct value derived from the regression data.<\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Regression Model Fit and Interpreting Model Results, LOS 2(c) Calculate and interpret a predicted value for the dependent variable, given the estimated regression model and assumed values for the independent variable.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Tabitha Meng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tabitha Meng, CFA, is a quantitative analyst with Hafei Securities Ltd, a company based in Bangkok, Thailand. Haifei has built a reputation providing stock brokering and investment advisory services to large institutional investors. In the recent past, the company expanded its portfolio and brought in a team of equity and fixed income analysts. Meng is a member of this team.<\/p><p>Meng is forecasting quarterly sales of Smart Inc., a smart TV manufacturer based in Thailand. The regression model is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0044.webp\" style=\"max-width:min(100%,226px)\" alt=\"Salest = b0 + b1Salest−1 + ϵt\"><p>The regression results for the smart TV sales model are presented in the exhibits below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0045.webp\" style=\"max-width:min(100%,556px)\" alt=\"Exhibit 1: Regression statistics for smart TV sales model R-squared 0.7436 Observations 120 Coefficient Standard Error Intercept 313.24 99.43 Lag 1 0.67 0.16 Exhibit 2: Autocorrelation of Residuals for smart TV sales model Lag Autocorrelation 1 -0.083 2 0.092 3 0.075 4 0.117 5 0.068 6 -0.125\"><p>*The critical values, assuming 5% significance level and 118 degrees of freedom, are 1.980 for a two-tail t-test and 1.658 for a one-tail t-test.<\/p><p>Thai National Oil Limited (TNOL) is a state-owned, giant oil exploration, refining and marketing company with a presence across East Asia. TNOL is planning to issue bonds with an 15-year maturity. Several of Haifei’s investment clients are intent on subscribing to the issue. Meng starts working on a quantitative model to forecast changes in quarterly profit of TNOL based on several macroeconomic variables. The regression model formulated is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0046.webp\" style=\"max-width:min(100%,358px)\" alt=\"ΔProfit = b0 + b1ΔGDP + b2ΔFX + b3ΔInt + ϵ\"><p>Where,<\/p><p>ΔP rofit=change in quarterly profit of TNOL<\/p><p>ΔGDP =change in quarterly GDP for Thailand<\/p><p>ΔFX=change in foreign exchange rate THB/USD<\/p><p>ΔInt=change in policy interest rate of Thai Central Bank<\/p><p>For the model to forecast change in profit of TNOL, regression results are as follows:<\/p><p><b>Exhibit 3: Regression statistics for quarterly profit model<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0047.webp\" style=\"max-width:min(100%,480px)\" alt=\"R-squared 0.8921 Observations 48 SEE 0.7978 Degree of ANOVA SS Freedom Regression 3 231.54 Residual 44 ? Total 47 ? Coefficient Standard Error Intercept 2.75 0.83 ΔGDP 2.38 0.62 ΔFX 0.51 0.15 ΔInt 1.07 0.31\"><p>Note: The critical values, assuming 5% significance level and 46 degrees of freedom, are 2.013 for a two-tail t-test and 1.679 for a one-tail t-test. The critical value for an F-test is 2.816.<\/p><\/div><\/details><div class=\"qtext\"><p>The value of the F-statistic for the model to forecast TNOL profit change is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 20, "q": "Is Meng’s concern that the model exhibits multicollinearity substantiated by statistical results:", "opts": ["Yes, multicollinearity is a problem because of a very high R-squared", "Yes, multicollinearity is a problem because of a high F-test value", "No, multicollinearity is not a problem because the t-tests for regression parameters are significant"], "ans": "C", "expl": "Multicollinearity in regression analysis occurs when two or more predictors are highly correlated, making it difficult to isolate the individual effects of each predictor on the dependent variable. In the case of Meng's model for forecasting TNOL’s quarterly profit changes, the concern for multicollinearity would be substantiated if the t-statistics on the estimated coefficients were not significant, despite a high R-squared and a significant F-test. However, the statistical results from the regression analysis show that each coefficient's t-test value is significant, exceeding the critical value of 2.013 for a two-tail t-test at a 5% significance level. Specifically, the t-test values for the intercept, , , and are 3.31, 3.84, 3.40, and 3.45 respectively, all of which are significantly greater than the critical value. This indicates that each predictor significantly contributes to the model, suggesting that multicollinearity is not adversely affecting the regression estimates. A is incorrect. The statement that multicollinearity is a problem because of a very high R-squared is misleading. While a high R-squared value indicates that the model explains a large proportion of the variance in the dependent variable, it does not necessarily imply multicollinearity. Multicollinearity is specifically about the correlation between independent variables, not just the fit of the model to the data. In this case, the significant t-test results for each coefficient suggest that despite the high R-squared, the predictors are providing unique and significant contributions to the model. B is incorrect. The statement that multicollinearity is a problem because of a high F-test value is incorrect. A high F-test value indicates that the model as a whole is statistically significant, meaning that it provides a better fit to the data than a model with no predictors. This does not directly indicate multicollinearity. Multicollinearity would be a concern if the individual predictors were not statistically significant, which is contradicted by the significant t-test results for the coefficients in Meng’s model. ", "explhtml": "<p>Multicollinearity in regression analysis occurs when two or more predictors are highly correlated, making it difficult to isolate the individual effects of each predictor on the dependent variable. In the case of Meng&#x27;s model for forecasting TNOL’s quarterly profit changes, the concern for multicollinearity would be substantiated if the t-statistics on the estimated coefficients were not significant, despite a high R-squared and a significant F-test. However, the statistical results from the regression analysis show that each coefficient&#x27;s t-test value is significant, exceeding the critical value of 2.013 for a two-tail t-test at a 5% significance level. Specifically, the t-test values for the intercept,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0058.webp\" style=\"max-width:min(100%,59px)\" alt=\"ΔGDP\"><p>,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0059.webp\" style=\"max-width:min(100%,47px)\" alt=\"ΔFX\"><p>, and<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0060.webp\" style=\"max-width:min(100%,47px)\" alt=\"ΔInt\"><p>are 3.31, 3.84, 3.40, and 3.45 respectively, all of which are significantly greater than the critical value. This indicates that each predictor significantly contributes to the model, suggesting that multicollinearity is not adversely affecting the regression estimates.<\/p><p><b>A is incorrect<\/b>. The statement that multicollinearity is a problem because of a very high R-squared is misleading. While a high R-squared value indicates that the model explains a large proportion of the variance in the dependent variable, it does not necessarily imply multicollinearity. Multicollinearity is specifically about the correlation between independent variables, not just the fit of the model to the data. In this case, the significant t-test results for each coefficient suggest that despite the high R-squared, the predictors are providing unique and significant contributions to the model.<\/p><p><b>B is incorrect<\/b>. The statement that multicollinearity is a problem because of a high F-test value is incorrect. A high F-test value indicates that the model as a whole is statistically significant, meaning that it provides a better fit to the data than a model with no predictors. This does not directly indicate multicollinearity. Multicollinearity would be a concern if the individual predictors were not statistically significant, which is contradicted by the significant t-test results for the coefficients in Meng’s model. <\/p><p class=\"los\">Quantitative Methods, Learning Module 3: Model Misspecification, LOS 3(d) Explain multicollinearity and how it affects regression analysis.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Tabitha Meng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tabitha Meng, CFA, is a quantitative analyst with Hafei Securities Ltd, a company based in Bangkok, Thailand. Haifei has built a reputation providing stock brokering and investment advisory services to large institutional investors. In ows:<\/p><p><b>Exhibit 3: Regression statistics for quarterly profit model<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0047.webp\" style=\"max-width:min(100%,480px)\" alt=\"R-squared 0.8921 Observations 48 SEE 0.7978 Degree of ANOVA SS Freedom Regression 3 231.54 Residual 44 ? Total 47 ? Coefficient Standard Error Intercept 2.75 0.83 ΔGDP 2.38 0.62 ΔFX 0.51 0.15 ΔInt 1.07 0.31\"><p>Note: The critical values, assuming 5% significance level and 46 degrees of freedom, are 2.013 for a two-tail t-test and 1.679 for a one-tail t-test. The critical value for an F-test is 2.816.<\/p><\/div><\/details><div class=\"qtext\"><p>Is Meng’s concern that the model exhibits multicollinearity substantiated by statistical results:<\/p><\/div>", "subj": "quant"}, {"n": 21, "q": "According to Smith’s regression results shown in Exhibit 2, the expected maintenance costs (in thousands of EUR) over the prior calendar year of the final car reported by the engineers closest to:", "opts": ["4.642.", "5.238.", "5.951."], "ans": "C", "expl": "To determine the expected maintenance costs for the final car reported by the engineers, we use the regression equation provided in Exhibit 2. The regression equation is given by: Where b0 (intercept) is -4.5243 and b1 (slope coefficient for Odometer) is 0.1223. Substituting the odometer reading of 85.650 into the equation, we calculate: This calculation shows that the expected maintenance costs for the car with an odometer reading of 85.650 thousand kilometers is approximately 5.951 thousand EUR. The high R2 value of 0.9421 from the regression statistics indicates a strong linear relationship between the odometer readings and the maintenance costs, supporting the reliability of this prediction. A is incorrect. It suggests that the expected maintenance costs are 4.642 thousand EUR. This does not align with the regression calculation. Using the regression model, substituting the odometer reading of 85.650 into the equation yields a result of 5.951 thousand EUR, not 4.642. The discrepancy arises because the calculation based on the regression coefficients directly contradicts this value, demonstrating that the relationship between the odometer readings and maintenance costs, as modeled, does not support this lower estimate. B is incorrect. It proposes that the expected maintenance costs are 5.238 thousand EUR. This result is also inconsistent with the regression output. The correct calculation using the provided odometer reading of 85.650 and the regression coefficients results in a maintenance cost of 5.951 thousand EUR. The option of 5.238 thousand EUR underestimates the costs as calculated by the regression equation, which accurately reflects the relationship established by the collected data and analyzed through the regression model. The error in this option likely stems from an incorrect application or misunderstanding of the regression coefficients or the odometer value. ", "explhtml": "<p>To determine the expected maintenance costs for the final car reported by the engineers, we use the regression equation provided in Exhibit 2. The regression equation is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0063.webp\" style=\"max-width:min(100%,232px)\" alt=\"Costsi = b0 + b1 × Odometeri\"><p>Where b<sub>0<\/sub> (intercept) is -4.5243 and b<sub>1<\/sub> (slope coefficient for Odometer) is 0.1223. Substituting the odometer reading of 85.650 into the equation, we calculate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0064.webp\" style=\"max-width:min(100%,350px)\" alt=\"Costsi = −4.5243 + 0.1223 × 85.650 = 5.951\"><p>This calculation shows that the expected maintenance costs for the car with an odometer reading of 85.650 thousand kilometers is approximately 5.951 thousand EUR. The high R<sup>2<\/sup> value of 0.9421 from the regression statistics indicates a strong linear relationship between the odometer readings and the maintenance costs, supporting the reliability of this prediction.<\/p><p><b>A is incorrect<\/b>. It suggests that the expected maintenance costs are 4.642 thousand EUR. This does not align with the regression calculation. Using the regression model, substituting the odometer reading of 85.650 into the equation yields a result of 5.951 thousand EUR, not 4.642. The discrepancy arises because the calculation based on the regression coefficients directly contradicts this value, demonstrating that the relationship between the odometer readings and maintenance costs, as modeled, does not support this lower estimate.<\/p><p><b>B is incorrect<\/b>. It proposes that the expected maintenance costs are 5.238 thousand EUR. This result is also inconsistent with the regression output. The correct calculation using the provided odometer reading of 85.650 and the regression coefficients results in a maintenance cost of 5.951 thousand EUR. The option of 5.238 thousand EUR underestimates the costs as calculated by the regression equation, which accurately reflects the relationship established by the collected data and analyzed through the regression model. The error in this option likely stems from an incorrect application or misunderstanding of the regression coefficients or the odometer value. <\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Regression Model Fit and Interpreting Model Results, LOS 2(c): Calculate and interpret a predicted value for the dependent variable, given an estimated regression model and assumed values for the independent variables<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Quincy Zane<\/summary><div class=\"vig-body\"><p>Quincy Zane, an experienced financial analyst, is studying the durability of MotorGo’s new product in the shape of hybrid cars. In particular, she would like to understand exactly how the maintenance costs of this car related to the distance driving.<\/p><p>Zane asks her junior assistant, Ray Smith, to collect data for her and conduct statistical tests to facilitate the analysis. Smith collects data from the use of these new cars. Zane tells him to be cautious about interpreting the results, as she tells him, “I am concerned that the annual maintenance costs might increase more for cars with higher odometer readings.”<\/p><p>Nevertheless, after asking for help from his company’s engineers, Smith collects 25 data points and conducts a linear regression, summarizing them in a few tables. He notices that the final car reported by the engineers had an odometer reading of 85.650 (in thousands of kilometers) as of the end of the last calendar year.<\/p><p>Smith defines the dependent variable as Costs, or maintenance costs (in thousands of EUR) for the last calendar year for a given car. He defines the independent variable as the Odometer, or the distance that has been driven (in thousands of kilometers) at the end of the last completed calendar year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0061.webp\" style=\"max-width:min(100%,589px)\" alt=\"Exhibit 1: Descriptive Statistics Statistic Costs Odometer Mean 10.575 123.4 Sum of squared deviations 1,850.4 116,487 Sample covariance 593.75 Exhibit 2: Regression Statistics Regression statistics R2 0.9421 Standard error of estimate 2.1581 Observations 25 Standard Coefficients t-statistic p-value\"><p>Smith states the following about the regression results:<\/p><p>Statement 1: The value of the coefficient of determination is 0.9421.<\/p><p>Statement 2: Since there are 25 observations and 1 independent variable, there are 24 degrees of freedom for the t-test of the slope coefficient.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0062.webp\" style=\"max-width:min(100%,590px)\" alt=\"Exhibit 3: ANOVA Degrees of Sum of Squares Mean Sum of Freedom (df) (SS) Squares (MSS) Regression 1 1,743 1,743 Residual 23 107.1 4.6576 Total 24 1,850.4\"><\/div><\/details><div class=\"qtext\"><p>According to Smith’s regression results shown in Exhibit 2, the expected maintenance costs (in thousands of EUR) over the prior calendar year of the final car reported by the engineers closest to:<\/p><\/div>", "subj": "quant"}, {"n": 22, "q": "Based on Exhibit 3, the F-statistic for testing whether the Odometer coefficient is equal to zero is closest to:", "opts": ["19.35.", "212.34.", "374.23."], "ans": "C", "expl": "The F-statistic is calculated to test the hypothesis that the coefficient of the independent variable in a regression model is zero. In this case, the independent variable is the Odometer reading. The formula for the F-statistic is the ratio of the mean regression sum of squares (MSS) to the mean square error (MSE). From Exhibit 3, the mean regression sum of squares for the regression is 1,743 and the mean square error is 4.6576. Therefore, the F-statistic is calculated as follows: This value indicates a very strong relationship between the odometer readings and the maintenance costs, suggesting that the model explains a significant portion of the variability in maintenance costs based on odometer readings. A is incorrect. It suggests that the F-statistic is 19.35, which is incorrect. This confusion might arise from misinterpreting the t-statistic for the Odometer coefficient, which is indeed around 19.3464 as shown in Exhibit 2. However, the F-statistic is a different measure used to assess the overall significance of the regression model, not just the significance of individual predictors. The calculation of the F-statistic involves the entire model's fit rather than the individual parameter estimates, thus making 19.35 an incorrect value for the F-statistic. B is incorrect. It suggests that the F-statistic is 212.34, which is also incorrect. This value does not correspond to any calculation derived from the given data. It seems to be a random value with no basis in the regression analysis provided. The correct F-statistic, as calculated from the mean regression sum of squares and the mean square error, is 374.23. Therefore, 212.34 is not supported by any data or formula in the context of this regression analysis. ", "explhtml": "<p>The F-statistic is calculated to test the hypothesis that the coefficient of the independent variable in a regression model is zero. In this case, the independent variable is the Odometer reading. The formula for the F-statistic is the ratio of the mean regression sum of squares (MSS) to the mean square error (MSE). From Exhibit 3, the mean regression sum of squares for the regression is 1,743 and the mean square error is 4.6576. Therefore, the F-statistic is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0065.webp\" style=\"max-width:min(100%,397px)\" alt=\"Mean regression sum of square1s743 F = = = 374.23 Mean square error 4.6576\"><p>This value indicates a very strong relationship between the odometer readings and the maintenance costs, suggesting that the model explains a significant portion of the variability in maintenance costs based on odometer readings.<\/p><p><b>A is incorrect<\/b>. It suggests that the F-statistic is 19.35, which is incorrect. This confusion might arise from misinterpreting the t-statistic for the Odometer coefficient, which is indeed around 19.3464 as shown in Exhibit 2. However, the F-statistic is a different measure used to assess the overall significance of the regression model, not just the significance of individual predictors. The calculation of the F-statistic involves the entire model&#x27;s fit rather than the individual parameter estimates, thus making 19.35 an incorrect value for the F-statistic.<\/p><p><b>B is incorrect<\/b>. It suggests that the F-statistic is 212.34, which is also incorrect. This value does not correspond to any calculation derived from the given data. It seems to be a random value with no basis in the regression analysis provided. The correct F-statistic, as calculated from the mean regression sum of squares and the mean square error, is 374.23. Therefore, 212.34 is not supported by any data or formula in the context of this regression analysis. <\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Regression Model Fit and Interpreting Model Results, LOS 2(c) Calculate and interpret a predicted value for the dependent variable, given the estimated regression model and assumed values for the independent variable.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Quincy Zane<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Quincy Zane, an experienced financial analyst, is studying the durability of MotorGo’s new product in the shape of hybrid cars. In particular, she would like to understand exactly how the maintenance costs of this car related to the distance driving.<\/p><p>Zane asks her junior assistant, Ray Smith, to collect data for her and conduct statistical tests to facilitate the analysis. Smith collects data from the use of these new cars. Zane tells him to be cautious about interpreting the results, as she tells him, “I am concerned that the annual maintenance costs might increase more for cars with higher odometer readings.”<\/p><p>Nevertheless, after asking for help from his company’s engineers, Smith collects 25 data points and conducts a linear regression, summarizing them in a few tables. He notices that the final car reported by the engineers had an odometer reading of 85.650 (in thousands of kilometers) as of the end of the last calendar year.<\/p><p>Smith defines the dependent variable as Costs, or maintenance costs (in thousands of EUR) for the last calendar year for a given car. He defines the independent variable as the Odometer, or the distance that has been driven (in thousands of kilometers) at the end of the last completed calendar year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0061.webp\" style=\"max-width:min(100%,589px)\" alt=\"Exhibit 1: Descriptive Statistics Statistic Costs Odometer Mean 10.575 123.4 Sum of squared deviations 1,850.4 116,487 Sample covariance 593.75 Exhibit 2: Regression Statistics Regression statistics R2 0.9421 Standard error of estimate 2.1581 Observations 25 Standard Coefficients t-statistic p-value\"><p>Smith states the following about the regression results:<\/p><p>Statement 1: The value of the coefficient of determination is 0.9421.<\/p><p>Statement 2: Since there are 25 observations and 1 independent variable, there are 24 degrees of freedom for the t-test of the slope coefficient.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0062.webp\" style=\"max-width:min(100%,590px)\" alt=\"Exhibit 3: ANOVA Degrees of Sum of Squares Mean Sum of Freedom (df) (SS) Squares (MSS) Regression 1 1,743 1,743 Residual 23 107.1 4.6576 Total 24 1,850.4\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, the F-statistic for testing whether the Odometer coefficient is equal to zero is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 23, "q": "Based on Exhibit 1 and Exhibit 2, the correlation between the variables Costs and Odometer is closest to:", "opts": ["0.8919", "0.9421", "0.9706"], "ans": "C", "expl": "The correct answer is option C, which states that the correlation between the variables Costs and Odometer is 0.9706. This conclusion can be reached through two methods of calculation. The first method involves the coefficient of determination (R2) from the regression analysis provided in Exhibit 2. The R2 value is 0.9421, which measures the proportion of variance in the dependent variable that is predictable from the independent variable. The correlation coefficient (r) is the square root of R2, calculated as follows: The second method uses the sample covariance and the standard deviations of Costs and Odometer. The correlation coefficient can also be calculated using the formula: where Cov(X,Y) is the sample covariance, and SX and SY are the sample standard deviations of X and Y, respectively. Plugging in the values: This confirms that the correlation coefficient is indeed 0.9706, matching the calculation from the R2 value. A is incorrect. It suggests that the correlation coefficient is 0.8919. This value is actually the standard error of the intercept from the regression analysis, not a measure of correlation between Costs and Odometer. The standard error of the intercept indicates the average distance that the observed values fall from the regression line; it does not provide information about the strength or direction of the relationship between the variables. B is incorrect. It proposes that the correlation coefficient is 0.9421, which is actually the R2 value from the regression analysis. While R2 does provide information on the proportion of variance in the dependent variable explained by the independent variable, it is not the correlation coefficient itself. The correlation coefficient is the square root of R2, which in this case is 0.9706, not 0.9421. ", "explhtml": "<p>The correct answer is option C, which states that the correlation between the variables Costs and Odometer is 0.9706. This conclusion can be reached through two methods of calculation. The first method involves the coefficient of determination (R<sup>2<\/sup>) from the regression analysis provided in Exhibit 2. The R<sup>2<\/sup> value is 0.9421, which measures the proportion of variance in the dependent variable that is predictable from the independent variable. The correlation coefficient (r) is the square root of R<sup>2<\/sup>, calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0066.webp\" style=\"max-width:min(100%,176px)\" alt=\"r = √0.9421 = 0.9706\"><p>The second method uses the sample covariance and the standard deviations of Costs and Odometer. The correlation coefficient can also be calculated using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0067.webp\" style=\"max-width:min(100%,115px)\" alt=\"Cov(X, Y) r = SXSY\"><p>where Cov(X,Y) is the sample covariance, and S<sub>X<\/sub> and S<sub>Y<\/sub> are the sample standard deviations of X and Y, respectively. Plugging in the values:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0068.webp\" style=\"max-width:min(100%,224px)\" alt=\"593.75 r = = 0.9706 √ 1850.4 24 √ 116487 24\"><p>This confirms that the correlation coefficient is indeed 0.9706, matching the calculation from the R<sup>2<\/sup> value.<\/p><p><b>A is incorrect<\/b>. It suggests that the correlation coefficient is 0.8919. This value is actually the standard error of the intercept from the regression analysis, not a measure of correlation between Costs and Odometer. The standard error of the intercept indicates the average distance that the observed values fall from the regression line; it does not provide information about the strength or direction of the relationship between the variables.<\/p><p><b>B is incorrect<\/b>. It proposes that the correlation coefficient is 0.9421, which is actually the R<sup>2<\/sup> value from the regression analysis. While R<sup>2<\/sup> does provide information on the proportion of variance in the dependent variable explained by the independent variable, it is not the correlation coefficient itself. The correlation coefficient is the square root of R<sup>2<\/sup>, which in this case is 0.9706, not 0.9421. <\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Regression Model Fit and Interpreting Model Results, LOS 2(c) Calculate and interpret a predicted value for the dependent variable, given the estimated regression model and assumed values for the independent variable.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Quincy Zane<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Quincy Zane, an experienced financial analyst, is studying the durability of MotorGo’s new product in the shape of hybrid cars. In particular, she would like to understand exactly how the maintenance costs of this car related to the distance driving.<\/p><p>Zane asks her junior assistant, Ray Smith, to collect data for her and conduct statistical tests to facilitate the analysis. Smith collects data from the use of these new cars. Zane tells him to be cautious about interpreting the results, as she tells him, “I am concerned that the annual maintenance costs might increase more for cars with higher odometer readings.”<\/p><p>Nevertheless, after asking for help from his company’s engineers, Smith collects 25 data points and conducts a linear regression, summarizing them in a few tables. He notices that the final car reported by the engineers had an odometer reading of 85.650 (in thousands of kilometers) as of the end of the last calendar year.<\/p><p>Smith defines the dependent variable as Costs, or maintenance costs (in thousands of EUR) for the last calendar year for a given car. He defines the independent variable as the Odometer, or the distance that has been driven (in thousands of kilometers) at the end of the last completed calendar year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0061.webp\" style=\"max-width:min(100%,589px)\" alt=\"Exhibit 1: Descriptive Statistics Statistic Costs Odometer Mean 10.575 123.4 Sum of squared deviations 1,850.4 116,487 Sample covariance 593.75 Exhibit 2: Regression Statistics Regression statistics R2 0.9421 Standard error of estimate 2.1581 Observations 25 Standard Coefficients t-statistic p-value\"><p>Smith states the following about the regression results:<\/p><p>Statement 1: The value of the coefficient of determination is 0.9421.<\/p><p>Statement 2: Since there are 25 observations and 1 independent variable, there are 24 degrees of freedom for the t-test of the slope coefficient.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0062.webp\" style=\"max-width:min(100%,590px)\" alt=\"Exhibit 3: ANOVA Degrees of Sum of Squares Mean Sum of Freedom (df) (SS) Squares (MSS) Regression 1 1,743 1,743 Residual 23 107.1 4.6576 Total 24 1,850.4\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Exhibit 2, the correlation between the variables Costs and Odometer is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 24, "q": "Which of the following is most accurate regarding Smith’s statements about the regression results:", "opts": ["Statement 1 and Statement 2 are both correct", "Statement 1 is correct and Statement 2 is incorrect", "Statement 2 is correct and Statement 1 is incorrect"], "ans": "B", "expl": "Statement 1 is correct. the coefficient of determination, represented as R2, quantifies the proportion of the variance in the dependent variable that is predictable from the independent variable. In this case, the R2 value is 0.9421, indicating that approximately 94.21% of the variance in the maintenance costs can be explained by the odometer readings of the cars. This high R2 value suggests a strong linear relationship between the distance driven and the maintenance costs, which is consistent with the data presented in the regression statistics. The value directly matches the reported R2 in the regression output, confirming the accuracy of Statement 1. Statement 2 is incorrect. The error in Statement 2 arises from a misunderstanding of how degrees of freedom are calculated in the context of regression analysis. Degrees of freedom in regression are determined by subtracting the number of parameters estimated from the total number of observations. In this scenario, Smith estimates two parameters: the intercept and the slope of the odometer readings. Therefore, with 25 total observations, the correct calculation for degrees of freedom should be , not 24 as stated. This miscalculation suggests a fundamental error in understanding the degrees of freedom applicable in the t-test for the slope coefficient, which impacts the validity of any statistical inferences made about the relationship between odometer readings and maintenance costs. ", "explhtml": "<p><b>Statement 1 is correct<\/b>. the coefficient of determination, represented as R<sup>2<\/sup>, quantifies the proportion of the variance in the dependent variable that is predictable from the independent variable. In this case, the R<sup>2<\/sup> value is 0.9421, indicating that approximately 94.21% of the variance in the maintenance costs can be explained by the odometer readings of the cars. This high R<sup>2<\/sup> value suggests a strong linear relationship between the distance driven and the maintenance costs, which is consistent with the data presented in the regression statistics. The value directly matches the reported R<sup>2<\/sup> in the regression output, confirming the accuracy of Statement 1.<\/p><p><b>Statement 2 is incorrect<\/b>. The error in Statement 2 arises from a misunderstanding of how degrees of freedom are calculated in the context of regression analysis. Degrees of freedom in regression are determined by subtracting the number of parameters estimated from the total number of observations. In this scenario, Smith estimates two parameters: the intercept and the slope of the odometer readings. Therefore, with 25 total observations, the correct calculation for degrees of freedom should be<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0069.webp\" style=\"max-width:min(100%,101px)\" alt=\"25 −2 = 23\"><p>, not 24 as stated. This miscalculation suggests a fundamental error in understanding the degrees of freedom applicable in the t-test for the slope coefficient, which impacts the validity of any statistical inferences made about the relationship between odometer readings and maintenance costs. <\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Regression Model Fit and Interpreting Model Results, LOS 2(c) Calculate and interpret a predicted value for the dependent variable, given the estimated regression model and assumed values for the independent variable.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Quincy Zane<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Quincy Zane, an experienced financial analyst, is studying the durability of MotorGo’s new product in the shape of hybrid cars. In particular, she would like to understand exactly how the maintenance costs of this car related to the distance driving.<\/p><p>Zane asks her junior assistant, Ray Smith, to collect data for her and conduct statistical tests to facilitate the analysis. Smith collects data from the use of these new cars. Zane tells him to be cautious about interpreting the results, as she tells him, “I am concerned that the annual maintenance costs might increase more for cars with higher odometer readings.”<\/p><p>Nevertheless, after asking for help from his company’s engineers, Smith collects 25 data points and conducts a linear regression, summarizing them in a few tables. He notices that the final car reported by the engineers had an odometer reading of 85.650 (in thousands of kilometers) as of the end of the last calendar year.<\/p><p>Smith defines the dependent variable as Costs, or maintenance costs (in thousands of EUR) for the last calendar year for a given car. He defines the independent variable as the Odometer, or the distance that has been driven (in thousands of kilometers) at the end of the last completed calendar year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0061.webp\" style=\"max-width:min(100%,589px)\" alt=\"Exhibit 1: Descriptive Statistics Statistic Costs Odometer Mean 10.575 123.4 Sum of squared deviations 1,850.4 116,487 Sample covariance 593.75 Exhibit 2: Regression Statistics Regression statistics R2 0.9421 Standard error of estimate 2.1581 Observations 25 Standard Coefficients t-statistic p-value\"><p>Smith states the following about the regression results:<\/p><p>Statement 1: The value of the coefficient of determination is 0.9421.<\/p><p>Statement 2: Since there are 25 observations and 1 independent variable, there are 24 degrees of freedom for the t-test of the slope coefficient.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0062.webp\" style=\"max-width:min(100%,590px)\" alt=\"Exhibit 3: ANOVA Degrees of Sum of Squares Mean Sum of Freedom (df) (SS) Squares (MSS) Regression 1 1,743 1,743 Residual 23 107.1 4.6576 Total 24 1,850.4\"><\/div><\/details><div class=\"qtext\"><p>Which of the following is most accurate regarding Smith’s statements about the regression results:<\/p><\/div>", "subj": "quant"}, {"n": 25, "q": "Which of the following is Yen concerned about when he mentions that the test statistic for the independent variable may be inflated because regression errors may be correlated across observations?", "opts": ["Heteroskedasticity", "Serial correlation", "Multicollinearity"], "ans": "B", "expl": "Yen's concern about the inflation of the test statistic for the independent variable due to correlated regression errors directly points to the issue of serial correlation. Serial correlation occurs when the residuals (errors) from a regression model are not independent across observations. In simpler terms, the error for one observation is related to the error for a previous observation. This correlation can lead to biased and inefficient estimates of regression coefficients and can inflate the statistical significance of predictors in the model. In the context provided, Yen is worried that the presence of serial correlation might be causing the coefficient of the independent variable (volume traded) to appear more significant than it actually is. This is evident from the discussion about the Durbin-Watson statistic, which is used to detect the presence of serial correlation in the residuals from a regression analysis. The value of 1.89, close to the lower bound of the critical values (1.65 - 1.69), suggests potential negative serial correlation, although it is not conclusive without further testing. A is incorrect. Heteroskedasticity refers to the condition where the variance of the residuals is not constant across observations in a regression model. It affects the efficiency of the coefficient estimates, making them less reliable. However, Yen's concern was specifically about the correlation of errors across observations, not the variance of those errors. Heteroskedasticity does not directly cause the inflation of test statistics for independent variables due to error correlation, which is why it is not the correct answer in this context. C is incorrect. Multicollinearity occurs when two or more independent variables in a regression model are highly correlated. This can make it difficult to determine the individual effect of each independent variable on the dependent variable. While multicollinearity does affect the precision and reliability of the coefficient estimates, Yen's concern was about the correlation of errors, not the correlation between independent variables. Therefore, multicollinearity is not relevant to the issue of inflated test statistics due to correlated errors as described in the scenario. ", "explhtml": "<p>Yen&#x27;s concern about the inflation of the test statistic for the independent variable due to correlated regression errors directly points to the issue of serial correlation. Serial correlation occurs when the residuals (errors) from a regression model are not independent across observations. In simpler terms, the error for one observation is related to the error for a previous observation. This correlation can lead to biased and inefficient estimates of regression coefficients and can inflate the statistical significance of predictors in the model. In the context provided, Yen is worried that the presence of serial correlation might be causing the coefficient of the independent variable (volume traded) to appear more significant than it actually is. This is evident from the discussion about the Durbin-Watson statistic, which is used to detect the presence of serial correlation in the residuals from a regression analysis. The value of 1.89, close to the lower bound of the critical values (1.65 - 1.69), suggests potential negative serial correlation, although it is not conclusive without further testing.<\/p><p><b>A is incorrect<\/b>. Heteroskedasticity refers to the condition where the variance of the residuals is not constant across observations in a regression model. It affects the efficiency of the coefficient estimates, making them less reliable. However, Yen&#x27;s concern was specifically about the correlation of errors across observations, not the variance of those errors. Heteroskedasticity does not directly cause the inflation of test statistics for independent variables due to error correlation, which is why it is not the correct answer in this context.<\/p><p><b>C is incorrect<\/b>. Multicollinearity occurs when two or more independent variables in a regression model are highly correlated. This can make it difficult to determine the individual effect of each independent variable on the dependent variable. While multicollinearity does affect the precision and reliability of the coefficient estimates, Yen&#x27;s concern was about the correlation of errors, not the correlation between independent variables. Therefore, multicollinearity is not relevant to the issue of inflated test statistics due to correlated errors as described in the scenario. <\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Model Misspecification, LOS 5(c) Explain serial correlation and how it affects statistical inference. Learning Module 5: Model Misspecification , LOS 5(d) Explain multicollinearity and how it affects regression analysis.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Conrad Jing<\/summary><div class=\"vig-body\"><p> etails><div class=\"qtext\"><p>Which of the following is Yen concerned about when he mentions that the test statistic for the independent variable may be inflated because regression errors may be correlated across observations?<\/p><\/div>", "subj": "quant"}, {"n": 26, "q": "Based on Exhibit 1, the 95% confidence interval for the regression coefficient for the volume traded (rounded off to 2 decimal places) is closest to:", "opts": ["-0.95 to 1.65.", "-0.93 to 1.63.", "-0.71 to 1.41."], "ans": "A", "expl": "The correct answer is option A, which states the 95% confidence interval for the regression coefficient for the volume traded is -0.95 to 1.65. To understand why this is correct, we start by calculating the standard error of the estimated coefficient for volume traded, ^b 1. The regression results provide ^b 1 = 0.350 and a t-statistic of 0.534. The t-statistic is calculated as the ratio of The critical value for a 95% confidence interval with a significance level of 0.05 (two-tailed) is 1.984. Using this critical value, the lower and upper bounds of the confidence interval are calculated as follows: Thus, the confidence interval is approximately -0.95 to 1.65, matching option A. B is incorrect. It suggests a confidence interval of -0.93 to 1.63. This result is close but slightly different from the correct interval calculated. The discrepancy arises from the rounding or calculation errors in determining the standard error or the critical value application. As shown in the calculations above, using the exact values from the regression output and the correct critical value leads to the interval -0.95 to 1.65, not -0.93 to 1.63. C is incorrect. It proposes a confidence interval of -0.71 to 1.41. This interval is significantly narrower than the correct interval calculated. The error in this option likely stems from using an incorrect standard error or critical value. As demonstrated, the correct application of the standard error (0.655) and the critical value (1.984) for a 95% confidence level results in a wider interval, specifically -0.95 to 1.65. The narrower interval in option C does not encompass the variability indicated by the correct standard error and critical value. ", "explhtml": "<p>The correct answer is option A, which states the 95% confidence interval for the regression coefficient for the volume traded is -0.95 to 1.65. To understand why this is correct, we start by calculating the standard error of the estimated coefficient for volume traded, ^b<sub> 1<\/sub>. The regression results provide ^b<sub> 1<\/sub> = 0.350 and a t-statistic of 0.534. The t-statistic is calculated as the ratio of<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0072.webp\" style=\"max-width:min(100%,757px)\" alt=\"the estimated coefficient to its standard error, which can be expressed as  standard error, we get  s^ b 1 = 0.350 0.534 ≈0.655 . t = s^ ^ b1 b 1 . Solving for the\"><p>The critical value for a 95% confidence interval with a significance level of 0.05 (two-tailed) is 1.984. Using this critical value, the lower and upper bounds of the confidence interval are calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0073.webp\" style=\"max-width:min(100%,379px)\" alt=\"Lower bound = 0.350 −(1.984 × 0.655) ≈−0.95 Upper bound = 0.350+ (1.984 × 0.655) ≈1.65\"><p>Thus, the confidence interval is approximately -0.95 to 1.65, matching option A.<\/p><p><b>B is incorrect<\/b>. It suggests a confidence interval of -0.93 to 1.63. This result is close but slightly different from the correct interval calculated. The discrepancy arises from the rounding or calculation errors in determining the standard error or the critical value application. As shown in the calculations above, using the exact values from the regression output and the correct critical value leads to the interval -0.95 to 1.65, not -0.93 to 1.63.<\/p><p><b>C is incorrect<\/b>. It proposes a confidence interval of -0.71 to 1.41. This interval is significantly narrower than the correct interval calculated. The error in this option likely stems from using an incorrect standard error or critical value. As demonstrated, the correct application of the standard error (0.655) and the critical value (1.984) for a 95% confidence level results in a wider interval, specifically -0.95 to 1.65. The narrower interval in option C does not encompass the variability indicated by the correct standard error and critical value. <\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Regression Model Fit and Interpreting Model Results, LOS 2(c)Calculate and interpret a predicted value for the dependent variable, given the estimated regression model and assumed values for the independent variable.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Conrad Jing<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Conrad Jing is the Chief Investment Officer (CIO) at a China-based Capital Management Fund. During a financial symposium held at a local university, a student makes the following comments about the probit model:<\/p><p>Comment 1:<\/p><p>“For example, to predict whether or not a company will go bankrupt, we need to use a linear regression model with qualitative dependent variable (bankrupt or not) as the dependent variable and use data on the company’s financial performance as independent variables.”<\/p><p>Yen has asked one of his associates, Kevin Sui, to identify the variable that explains the performance of a stock. Sui believes the stock&#x27;s performance is a function of its trading volume. He conducts a regression analysis of volume traded and gets the following results.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0070.webp\" style=\"max-width:min(100%,590px)\" alt=\"Exhibit 1: Regression Results Performance (P) = b0 + b1× Volume Traded Coefficient t-statistic Intercept (b0) 0.015 0.076 Volume traded (b1) 0.350 0.534 Number of observations used 100\"><p>Critical value at 2.5% significance (one-<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0071.webp\" style=\"max-width:min(100%,470px)\" alt=\"1.984 tailed t-test) R2 0.549 F-Statistic 119.29 Significance of F &lt; 0.01 Durbin-Watson Statistic 1.89 Durbin-Watson  critical  values  (5% 1.65 - 1.69 significance)\"><p>Sui presents these results to Yen and mentions that the coefficient of the independent variable is positive and significant at the 0.05 level. Yen reads the result and mentions a concern that the test statistic for the independent variable may be inflated because regression errors may be correlated across observations.<\/p><p>Yen says the Durbin–Watson (DW) statistic indicates that the regression residuals are negatively correlated without performing a statistical test. Sui replies that a statistical test does not show serial correlation for the error term.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the 95% confidence interval for the regression coefficient for the volume traded (rounded off to 2 decimal places) is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 27, "q": "Who is most likely to be correct with respect to the serial correlation of the error term:", "opts": ["Sui", "Yen", "Both Sui and Yen"], "ans": "A", "expl": "The Durbin-Watson (DW) statistic is a measure used to detect the presence of autocorrelation (a relationship between values separated from each other by a given time lag) in the residuals from a regression analysis. The DW statistic ranges from 0 to 4, where a value near 2 suggests no autocorrelation, values approaching 0 indicate positive autocorrelation, and values toward 4 suggest negative autocorrelation. In this case, the DW statistic reported is 1.89, which is closer to 2 than to either extreme of 0 or 4. This suggests that there is no strong evidence of either positive or negative autocorrelation in the residuals of the regression model used by Sui. Yen is incorrect. Yen's concern about the test statistic for the independent variable being inflated due to correlated errors across observations is based on the assumption of negative correlation in the residuals. However, the DW statistic of 1.89 does not support this claim. According to the Durbin-Watson critical values for 100 observations at a 5% significance level, which range from 1.65 to 1.69, a DW statistic greater than 1.69 suggests that we fail to reject the null hypothesis of no positive serial correlation. Since 1.89 is greater than 1.69, there is no statistical evidence to support the presence of positive serial correlation, let alone negative. Therefore, Yen's statement of negatively correlated residuals is not supported by the statistical evidence provided. Sui is correct. Sui's statement that there is no evidence of serial correlation in the error term is supported by the DW statistic of 1.89. This value falls within the range where the null hypothesis of no autocorrelation (neither positive nor negative) is not rejected. The critical values for detecting positive serial correlation (d1 = 1.65 and d2 = 1.69) further validate this point, as the DW statistic does not fall below these thresholds. Therefore, Sui's interpretation of the regression analysis is correct, indicating that the regression model's residuals do not exhibit serial correlation, and thus, the reliability of the regression coefficients is not compromised by autocorrelation issues. ", "explhtml": "<p>The Durbin-Watson (DW) statistic is a measure used to detect the presence of autocorrelation (a relationship between values separated from each other by a given time lag) in the residuals from a regression analysis. The DW statistic ranges from 0 to 4, where a value near 2 suggests no autocorrelation, values approaching 0 indicate positive autocorrelation, and values toward 4 suggest negative autocorrelation. In this case, the DW statistic reported is 1.89, which is closer to 2 than to either extreme of 0 or 4. This suggests that there is no strong evidence of either positive or negative autocorrelation in the residuals of the regression model used by Sui.<\/p><p><b>Yen is incorrect<\/b>. Yen&#x27;s concern about the test statistic for the independent variable being inflated due to correlated errors across observations is based on the assumption of negative correlation in the residuals. However, the DW statistic of 1.89 does not support this claim. According to the Durbin-Watson critical values for 100 observations at a 5% significance level, which range from 1.65 to 1.69, a DW statistic greater than 1.69 suggests that we fail to reject the null hypothesis of no positive serial correlation. Since 1.89 is greater than 1.69, there is no statistical evidence to support the presence of positive serial correlation, let alone negative. Therefore, Yen&#x27;s statement of negatively correlated residuals is not supported by the statistical evidence provided.<\/p><p><b>Sui is correct<\/b>. Sui&#x27;s statement that there is no evidence of serial correlation in the error term is supported by the DW statistic of 1.89. This value falls within the range where the null hypothesis of no autocorrelation (neither positive nor negative) is not rejected. The critical values for detecting positive serial correlation (d<sub>1<\/sub> = 1.65 and d<sub>2<\/sub> = 1.69) further validate this point, as the DW statistic does not fall below these thresholds. Therefore, Sui&#x27;s interpretation of the regression analysis is correct, indicating that the regression model&#x27;s residuals do not exhibit serial correlation, and thus, the reliability of the regression coefficients is not compromised by autocorrelation issues. <\/p><p class=\"los\">Quantitative Methods, Learning Module 3: Model Misspecification , LOS 3(c) Explain serial correlation and how it affects statistical inference. Quantitative Methods, Learning Module 3: Model Misspecification , LOS 3(d) Explain multicollinearity and how it affects regression analysis.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Conrad Jing<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Conrad Jing is the Chief Investment Officer (CIO) at a China-based Capital Management Fund. During a financial symposium held at a local university, a student makes the following comments about the probit model:<\/p><p>Comment 1:<\/p><p>“For example, to predict whether or not a company will go bankrupt, we need to use a linear regression model with qualitative dependent variable (bankrupt or not) as the dependent variable and use data on the company’s financial performance as independent variables.”<\/p><p>Yen has asked one of his associates, Kevin Sui, to identify the variable that explains the performance of a stock. Sui believes the stock&#x27;s performance is a function of its trading volume. He conducts a regression analysis of volume traded and gets the following results.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0070.webp\" style=\"max-width:min(100%,590px)\" alt=\"Exhibit 1: Regression Results Performance (P) = b0 + b1× Volume Traded Coefficient t-statistic Intercept (b0) 0.015 0.076 Volume traded (b1) 0.350 0.534 Number of observations used 100\"><p>Critical value at 2.5% significance (one-<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0071.webp\" style=\"max-width:min(100%,470px)\" alt=\"1.984 tailed t-test) R2 0.549 F-Statistic 119.29 Significance of F &lt; 0.01 Durbin-Watson Statistic 1.89 Durbin-Watson  critical  values  (5% 1.65 - 1.69 significance)\"><p>Sui presents these results to Yen and mentions that the coefficient of the independent variable is positive and significant at the 0.05 level. Yen reads the result and mentions a concern that the test statistic for the independent variable may be inflated because regression errors may be correlated across observations.<\/p><p>Yen says the Durbin–Watson (DW) statistic indicates that the regression residuals are negatively correlated without performing a statistical test. Sui replies that a statistical test does not show serial correlation for the error term.<\/p><\/div><\/details><div class=\"qtext\"><p>Who is most likely to be correct with respect to the serial correlation of the error term:<\/p><\/div>", "subj": "quant"}, {"n": 28, "q": "The sample correlation between the regression residual from one period and the previous period is closest to:", "opts": ["0.044", "0.055", "0.053"], "ans": "B", "expl": "The Durbin-Watson (DW) statistic is a measure used to detect the presence of autocorrelation at lag 1 in the residuals from a regression analysis. The formula to approximate the sample correlation between the regression residuals from one period and those from the previous period using the DW statistic is given by: Given that the DW statistic from the regression results is 1.89, we can substitute this value into the formula to estimate the sample correlation: This calculation shows that the sample correlation between the regression residuals from one period and the previous period is approximately 0.055, which supports the selection of option B as the correct answer. A is incorrect. It suggests that the sample correlation is 0.044. Using the formula for estimating the sample correlation based on the DW statistic, we find that the correlation is approximately 0.055, not 0.044. The discrepancy arises because the calculation based on the DW statistic directly leads to an estimate of 0.055, which does not align with the value given in option A. This demonstrates that the calculation and the corresponding interpretation of the DW statistic do not support option A. C is incorrect. It proposes a sample correlation of 0.053. Although this value is close to the calculated value of 0.055, it is not exact. The formula used to derive the correlation from the DW statistic provides a clear and direct calculation that leads to a result of 0.055. Since precision is key in statistical analysis and the calculated correlation does not round to 0.053, option C is not supported by the DW statistic calculation. This highlights the importance of accurate computation and interpretation in statistical methods. ", "explhtml": "<p>The Durbin-Watson (DW) statistic is a measure used to detect the presence of autocorrelation at lag 1 in the residuals from a regression analysis. The formula to approximate the sample correlation between the regression residuals from one period and those from the previous period using the DW statistic is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0074.webp\" style=\"max-width:min(100%,104px)\" alt=\"r ≈1 −DW 2\"><p>Given that the DW statistic from the regression results is 1.89, we can substitute this value into the formula to estimate the sample correlation:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0075.webp\" style=\"max-width:min(100%,259px)\" alt=\"1.89 r ≈1 − = 1 −0.945 = 0.055 2\"><p>This calculation shows that the sample correlation between the regression residuals from one period and the previous period is approximately 0.055, which supports the selection of option B as the correct answer.<\/p><p><b>A is incorrect<\/b>. It suggests that the sample correlation is 0.044. Using the formula for estimating the sample correlation based on the DW statistic, we find that the correlation is approximately 0.055, not 0.044. The discrepancy arises because the calculation based on the DW statistic directly leads to an estimate of 0.055, which does not align with the value given in option A. This demonstrates that the calculation and the corresponding interpretation of the DW statistic do not support option A.<\/p><p><b>C is incorrect<\/b>. It proposes a sample correlation of 0.053. Although this value is close to the calculated value of 0.055, it is not exact. The formula used to derive the correlation from the DW statistic provides a clear and direct calculation that leads to a result of 0.055. Since precision is key in statistical analysis and the calculated correlation does not round to 0.053, option C is not supported by the DW statistic calculation. This highlights the importance of accurate computation and interpretation in statistical methods. <\/p><p class=\"los\">Quantitative Methods, Learning Module 3: Model Misspecification, LOS 3( b) Explain the types of heteroskedasticity and how it affects statistical inference<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Conrad Jing<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Conrad Jing is the Chief Investment Officer (CIO) at a China-based Capital Management Fund. During a financial symposium held at a local university, a student makes the following comments about the probit model:<\/p><p>Comment 1:<\/p><p>“For example, to predict whether or not a company will go bankrupt, we need to use a linear regression model with qualitative dependent variable (bankrupt or not) as the dependent variable and use data on the company’s financial performance as independent variables.”<\/p><p>Yen has asked one of his associates, Kevin Sui, to identify the variable that explains the performance of a stock. Sui believes the stock&#x27;s performance is a function of its trading volume. He conducts a regression analysis of volume traded and gets the following results.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0070.webp\" style=\"max-width:min(100%,590px)\" alt=\"Exhibit 1: Regression Results Performance (P) = b0 + b1× Volume Traded Coefficient t-statistic Intercept (b0) 0.015 0.076 Volume traded (b1) 0.350 0.534 Number of observations used 100\"><p>Critical value at 2.5% significance (one-<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0071.webp\" style=\"max-width:min(100%,470px)\" alt=\"1.984 tailed t-test) R2 0.549 F-Statistic 119.29 Significance of F &lt; 0.01 Durbin-Watson Statistic 1.89 Durbin-Watson  critical  values  (5% 1.65 - 1.69 significance)\"><p>Sui presents these results to Yen and mentions that the coefficient of the independent variable is positive and significant at the 0.05 level. Yen reads the result and mentions a concern that the test statistic for the independent variable may be inflated because regression errors may be correlated across observations.<\/p><p>Yen says the Durbin–Watson (DW) statistic indicates that the regression residuals are negatively correlated without performing a statistical test. Sui replies that a statistical test does not show serial correlation for the error term.<\/p><\/div><\/details><div class=\"qtext\"><p>The sample correlation between the regression residual from one period and the previous period is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 29, "q": "In expanding his model to account for the day of the week on which sales occur, Archer has most likely provided an example of:", "opts": ["A dummy variable.", "Time-series analysis.", "Single variable linear regression."], "ans": "A", "expl": "A dummy variable assigns a value of 1 if a condition is true and a value of 0 if that condition is not true. In this example, Archer believes that weekday sales are higher than weekend sales and has assigned a value of 1 to sales that occur from Monday to Friday and a value of 0 to sales that occur on Saturday and Sunday. B is incorrect Archer has performed a cross-sectional analysis (weekends vs. weekdays), not a time series analysis.  C is incorrect. The addition of a dummy variable to account for the day of the week on which sales occurred makes this an example of multiple linear regression with more than one independent variable.", "explhtml": "<p>A dummy variable assigns a value of 1 if a condition is true and a value of 0 if that condition is not true. In this example, Archer believes that weekday sales are higher than weekend sales and has assigned a value of 1 to sales that occur from Monday to Friday and a value of 0 to sales that occur on Saturday and Sunday.<\/p><p><b>B is incorrect<\/b> Archer has performed a cross-sectional analysis (weekends vs. weekdays), not a time series analysis. <\/p><p><b>C is incorrect. <\/b>The addition of a dummy variable to account for the day of the week on which sales occurred makes this an example of multiple linear regression with more than one independent variable.<\/p><p class=\"los\">Quantitative Methods, Learning Module 1: Basics of Multiple Regression and Underlying Assumptions, LOS 1(b) Formulate a multiple linear regression model, describe the relation between the dependent variable and several independent variables and interpret estimated regression coefficients<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Harold Archer<\/summary><div class=\"vig-body\"><p>Harold Archer, CFA, provides consulting services to family-owned retailers in his community. Archer is meeting with Penelope Cooper, owner of the Sunnydale Cafe, a popular coffee shop located in the central business district.<\/p><p>Based on his analysis of sales data from the past several years, Archer notes that coffee sales are higher on cold days, whereas lemonade sales are higher on warm days. Archer produces the following regression models for unit sales of coffee (Y<sub>c<\/sub>) and unit sales of lemonade (Y<sub>L<\/sub>):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0076.webp\" style=\"max-width:min(100%,208px)\" alt=\"YC = 208 −0.46t + 13.7w YL = 132 + 0.72t + 8.3w\"><p>Where,<\/p><p>T = outdoor temperature in degrees Fahrenheit (<sup>°<\/sup>F)<\/p><p>W = day of week (1 for Monday to Friday, 0 for Saturday and Sunday)<\/p><p>Penelope Cooper, the Sunnydale Café&#x27;s owner, notes that only temperature had been used as an independent variable in earlier versions of these models. By adding a variable to account for the day of the week sales occurred, Archer states that he could produce higher values for the R-squared and adjusted R-squared measures. Cooper is interested to learn more about the assumptions on which regression analysis is based. In particular, she has recently read about the homoskedasticity assumption.<\/p><p>Archer then presents his analysis of apple pie and chocolate cake sales, summarized below. Archer notes that he discovered a very high correlation, 0.9683, between these two menu item sales.<\/p><p><b>Exhibit 1. Average daily unit sales data for apple pie and chocolate cake<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0077.webp\" style=\"max-width:min(100%,551px)\" alt=\"Apple Pie Chocolate Cake Mean 64.3 112.0 Standard Deviation 9.3 14.4\"><p>Toward the end of their meeting, Penelope Cooper asks Archer asks her to evaluate a potential investment opportunity in Smooth Mount (SM), a relatively smaller fast-food company based in the US. Cooper even suggests using regression analysis to examine the relation between Smooth Mount&#x27;s shares and returns on Coffee. Archer runs a regression of SM&#x27;s share returns on coffee returns using the data she collected over 36 months. Selected regression output is presented in Exhibit 2:<\/p><p><b>Exhibit 2: Selected Regression Output with SM share return as the<\/b> <b>dependent Variable<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0078.webp\" style=\"max-width:min(100%,355px)\" alt=\"Coefficient Standard error Intercept 0.0085 0.0068 Coffee return 0.2124 0.0680\"><p>Archer expects the coffee return next month, Month 37, to be 0.02. He computes the variance of the prediction error to be 0.0015<\/p><\/div><\/details><div class=\"qtext\"><p>In expanding his model to account for the day of the week on which sales occur, Archer has most likely provided an example of:<\/p><\/div>", "subj": "quant"}, {"n": 30, "q": "Based on Exhibit 2, Arc s for the last 5 years, n = 60. Then, the critical value of the t-test (at the 0.005 significance level, with 60 − 2 = 58 degrees of freedom) is 2.6633. We formulate the null hypothesis that the coefficient = 0 and reject the null when the computed test statistic is outside the range ±2.6633<\/p><p>CAC 40 and DJIA: Correlation = 0.38<\/p><p>The correlation coefficient between CAC 40 and DJIA is 0.38 and test statistic<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0088.webp\" style=\"max-width:min(100%,200px)\" alt=\"0.38√60 −2 t = = 3.1287 √1 −0.382\"><p>Hence, the correlation coefficient between CAC 40 and DJIA is statistically significant.<\/p><p>FTSE 100 and DJIA: Correlation = 0.43<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0089.webp\" style=\"max-width:min(100%,280px)\" alt=\"r√n −2 0.43√60 −2 t = = = 3.6272 √1 −r2 √1 −0.432\"><p>Hence, the correlation coefficient between FTSE 100 and DJIA is statistically significant.<\/p><p>CAC 40 and S&amp;P 500: Correlation = 0.33<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0090.webp\" style=\"max-width:min(100%,199px)\" alt=\"0.33√60 −2 t = = 2.6623 √1 −0.332\"><p>2.6623 <b>is less than<\/b> the upper 99.9% point of the t-distribution with 58 degrees of freedom, i.e., 2.6633<\/p><p>Hence, the correlation coefficient between CAC 40 and S&amp;P 500 is not statistically significant.<\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Evaluating Regression Model Fit and Interpreting Model Results. LOS 2(b): Formulate hypotheses on the significance of two or more coefficients in a multiple regression model and interpret the results of the joint hypothesis tests<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Chang Zeng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chang Zeng is a candidate for Level II of the CFA program and a quantitative analyst with Oriental Investment Man
