 In the context of the machine learning program being developed by Adan Smith&#x27;s team at XYZ Investment Bank, a high bias error would mean that the model is not sufficiently sophisticated to understand and interpret the nuances in the sentiment of news articles. This would result in poor performance when trying to provide actionable insights to investment managers, as the model would not accurately reflect the true sentiments expressed in the news articles.<\/p><p><b>B is incorrect<\/b>. Variance error, on the other hand, occurs when a model is too complex, incorporating too much noise and details from the training data. This complexity can lead to overfitting, where the model performs well on its training data but poorly on new, unseen data because it is too tailored to the specific examples it was trained on. High variance means the model is sensitive to small fluctuations in the training data, which can result in significant changes in the model&#x27;s predictions. This is not ideal for the project at XYZ Investment Bank, as the model needs to generalize well to new articles and data that were not part of the training set.<\/p><p><b>C is incorrect<\/b>. Inaccuracy error is not a standard term used in machine learning or statistics to describe a specific type of error related to model performance. Typically, errors are categorized as bias or variance. The term &quot;inaccuracy error&quot; might be confused with general inaccuracies in predictions, which can result from either bias, variance, or both, but it is not a recognized category of error in the context of evaluating machine learning models. Therefore, referring to inaccuracy error can lead to confusion without providing a clear, technical explanation of what specifically is wrong with the model&#x27;s predictions. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7, Big Data Projects LOS 7(d): Describe objectives, steps, and techniques in model training<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Adam Smith #2<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Three months ago, Adan Smith, the Head of Operations at XYZ Investment Bank, set up a team comprising of two senior and three junior data scientists. They were tasked with creating a machine learning program, that uses natural language processing (NLP) to monitor, filter, and conduct sentiment analysis of news articles to automatically derive relevant information and help the investment managers derive actionable insights.<\/p><p>The team has completed the first three steps of the project:<\/p><p><b>Step 1:<\/b> Collecting data.<\/p><p><b>Step 2:<\/b> Preprocessing and cleaning data.<\/p><p><b>Step 3:<\/b> Exploratory data analysis, feature selection, and feature engineering.<\/p><p>In the next meeting, they will discuss the remaining steps as follows:<\/p><p><b>Step 4:<\/b> Model training<\/p><p>Shera Noorbhai, one of the senior data scientists, highlights that the team will need to remove<\/p><p>any noise or random fluctuations in the training data. The problem is that these aspects do not<\/p><p>apply to any new data the algorithm receives, and will negatively impact the model&#x27;s ability to<\/p><p>generalize.<\/p><p><b>Step 5:<\/b> Performance evaluation and Tuning<\/p><p>We will carry out an error analysis for our model, create a confusion matrix, and determine true<\/p><p>positives (TPs), false positives (FPs), true negatives (TNs) and false negatives (FNs). Then, we<\/p><p>will calculate the following performance metrics: accuracy, F1 score, precision, and recall.<\/p><p>Jane Kubai, one of the senior data scientists, pulls the following confusion matrix from the<\/p><p>internet for illustration.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0131.webp\" style=\"max-width:min(100%,547px)\" alt=\"Exhibit 1: Confusion Matrix Actual Training Labels Class &quot;1.&quot; Class &quot;1.&quot; Predicted results Class &quot;1&quot; TP 301 FP 48 Class &quot;1&quot; FN 37 TN 130\"><\/div><\/details><div class=\"qtext\"><p>The error, which is high when a model is overly simplified and does not sufficiently learn from the patterns in the training data, is best known as:<\/p><\/div>", "subj": "quant"}, {"n": 65, "q": "Considering regularization as a machine learning technique, which ML models would be least appropriate for Phase 1:", "opts": ["Regression tree with pruning.", "LASSO with lambda (λ) equivalent to 0.", "LASSO with lambda (λ) between 0.5 and 1."], "ans": "B", "expl": "In the context of Phase 1 of PEL Investments' proposed strategy, where machine learning models are used to estimate the returns of stocks and identify the lowest performing ones for replacement, the appropriateness of different regularization techniques in machine learning models becomes crucial. Regularization helps in preventing overfitting by penalizing larger coefficients in the model, thus ensuring that the model generalizes well on unseen data. LASSO (Least Absolute Shrinkage and Selection Operator) with lambda (λ) set to 0 effectively turns the regularization term in the LASSO equation to zero. Mathematically, the LASSO formula with λ = 0 is: where RSS is the residual sum of squares and βi are the coefficients. When λ = 0, the equation simplifies to just the RSS, which is equivalent to performing ordinary least squares regression. This means there is no penalty applied to the size of the coefficients, which can lead to a model that fits the training data very well but may perform poorly on unseen data due to overfitting. Hence, in the scenario where robust and generalizable models are needed for accurate stock return estimation, using LASSO with λ = 0 is least appropriate as it does not utilize the benefits of regularization. A is incorrect. Regression trees with pruning are a form of regularization where branches of the tree that contribute little to the prediction power of the model are removed. This pruning helps in reducing the complexity of the model, thereby making it more generalizable to new data. In the context of PEL Investments, where the goal is to create a model that accurately identifies underperforming stocks across a diverse global portfolio, the use of pruning in regression trees can be beneficial. It helps in avoiding overfitting by simplifying the model while still maintaining sufficient predictive accuracy. C is incorrect. LASSO with a lambda (λ) value between 0.5 and 1 applies a moderate level of regularization. This introduces a penalty for larger coefficients in the model, effectively shrinking them towards zero unless they contribute significantly to the model's performance. This level of regularization can help in creating a model that balances between fitting the training data well and maintaining good performance on unseen data. For PEL Investments, using LASSO with a moderate λ helps in building a robust model that can reliably identify stocks with the lowest estimated returns, which is critical for the success of their investment strategy.", "explhtml": "<p>In the context of Phase 1 of PEL Investments&#x27; proposed strategy, where machine learning models are used to estimate the returns of stocks and identify the lowest performing ones for replacement, the appropriateness of different regularization techniques in machine learning models becomes crucial. Regularization helps in preventing overfitting by penalizing larger coefficients in the model, thus ensuring that the model generalizes well on unseen data.<\/p><p>LASSO (Least Absolute Shrinkage and Selection Operator) with lambda (λ) set to 0 effectively turns the regularization term in the LASSO equation to zero. Mathematically, the LASSO formula with λ = 0 is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0137.webp\" style=\"max-width:min(100%,238px)\" alt=\"Cost Function = RSS + λ ∑|βi|\"><p>where RSS is the residual sum of squares and β<sub>i<\/sub> are the coefficients. When λ = 0, the equation simplifies to just the RSS, which is equivalent to performing ordinary least squares regression. This means there is no penalty applied to the size of the coefficients, which can lead to a model that fits the training data very well but may perform poorly on unseen data due to overfitting. Hence, in the scenario where robust and generalizable models are needed for accurate stock return estimation, using LASSO with λ = 0 is least appropriate as it does not utilize the benefits of regularization.<\/p><p><b>A is incorrect.<\/b> Regression trees with pruning are a form of regularization where branches of the tree that contribute little to the prediction power of the model are removed. This pruning helps in reducing the complexity of the model, thereby making it more generalizable to new data. In the context of PEL Investments, where the goal is to create a model that accurately identifies underperforming stocks across a diverse global portfolio, the use of pruning in regression trees can be beneficial. It helps in avoiding overfitting by simplifying the model while still maintaining sufficient predictive accuracy.<\/p><p><b>C is incorrect.<\/b> LASSO with a lambda (λ) value between 0.5 and 1 applies a moderate level of regularization. This introduces a penalty for larger coefficients in the model, effectively shrinking them towards zero unless they contribute significantly to the model&#x27;s performance. This level of regularization can help in creating a model that balances between fitting the training data well and maintaining good performance on unseen data. For PEL Investments, using LASSO with a moderate λ helps in building a robust model that can reliably identify stocks with the lowest estimated returns, which is critical for the success of their investment strategy.<\/p><p class=\"los\">CFA Level II, Study Session 1, Learning Module 6: Machine Learning, LOS 6(b): Describe overfitting and identify methods of addressing it.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · PEL Investments Ltd<\/summary><div class=\"vig-body\"><p>PEL Investments Limited manages a long-only fund that focuses on small-cap equities worldwide.<\/p><p>With about 40,000 eligible stocks, PEL maintains a portfolio of 300 stocks. Based on several<\/p><p>ratios derived from the readily accessible market and accounting data, some of these holdings<\/p><p>result from screening the universe for attractive stocks.Others come from investments generated<\/p><p>by PEL&#x27;s professional staff of five securities analysts and two portfolio managers.<\/p><p>Peter Andre, PEL&#x27;s Chief Investment Officer, is considering a change in investing procedures to<\/p><p>achieve better revenues despite its good performance. Several workshops Anndre attended and<\/p><p>his discussions with data vendors led him to conclude that data science should play a role in the<\/p><p>choice of investments for PEL. Also, he has noticed that a large portion of PEL&#x27;s past<\/p><p>outperformance can be attributed to stocks that became targets for takeovers. After some<\/p><p>reflection and investigations, Andre sends the following report to PEL&#x27;s CEO.<\/p><p>“As a result of my exploration of possible shifts to stock selection, I have been considering<\/p><p>initiating some changes. The fact that PEL Investments is in a solid financial position due to our<\/p><p>past successes makes the present moment an excellent time to invest in our future. Our portfolio<\/p><p>is presently composed of 300 small-cap stocks across the globe. Therefore, I propose that we<\/p><p>streamline our process to make good use of machine learning (ML). Despite the technological<\/p><p>revolution occasioned by ML, human understanding is still a vital factor, for example, in<\/p><p>providing domain data. Additionally, let&#x27;s identify acquisition-probable companies. My<\/p><p>recommendation would be to follow the four phases below every quarter.<\/p><p><b>Phase 1:<\/b> Each of the 300 stocks in our portfolio is modeled using machine learning techniques.<\/p><p>A model includes fundamental and technical variables (features). For replacing the 40 stocks<\/p><p>with the lowest estimated return, we identify those with the lowest estimated return.<\/p><p><b>Phase 2:<\/b> Grounded on various applicable financial and non-financial features, we split our<\/p><p>investable universe of over 40,000 stocks into 10 clusters using ML techniques. We aim to<\/p><p>prevent unintended portfolio concentration by selecting stocks from these groups.<\/p><p><b>Phase 3:<\/b> Our model predicts the five stocks that will be acquisition targets in 1 year for each of<\/p><p>the 10 groups based on labeled data.<\/p><p><b>Phase 4:<\/b> In each of our 5 experienced teams of security analysts, there are four groups from<\/p><p>which each analyst selects the best stock pick. The 10 stocks that we have “high conviction” in<\/p><p>will be added to our portfolio (instead of the 10 stocks that are relatively underperforming and<\/p><p>will be sold in Phase 1).<\/p><p>In addition, I would like to make the following comments:<\/p><p><b>Comment 1:<\/b> There will be a need for vast quantities of data for the ML systems to administer.<\/p><p>Before deciding whether to use subscription-based data, we must first appraise the practicality<\/p><p>of free or inexpensive historical data for the ML-based stock selection processes.<\/p><p><b>Comment 2:<\/b> In the future, PEL expects to refine its investment processes with the help of ML<\/p><p>techniques.<\/p><\/div><\/details><div class=\"qtext\"><p>Considering regularization as a machine learning technique, which ML models would be least appropriate for Phase 1:<\/p><\/div>", "subj": "quant"}, {"n": 66, "q": "Phase 2 should most appropriately be executed using which of the following machine learning techniques:", "opts": ["K-Means Clustering.", "Principal Components Analysis (PCA).", "Classification and Regression Trees (CART)."], "ans": "A", "expl": "K-Means Clustering is an unsupervised machine learning technique that organizes a given dataset into a specified number of clusters, in this case, the dataset being the universe of over 40,000 stocks. The algorithm assigns each data point to the nearest cluster while keeping the centroids as small as possible. It iteratively assigns each stock to one of the K clusters based on the features that are closest to the centroid of a cluster. This method is particularly useful in Phase 2 of PEL Investments' proposed strategy, where the goal is to categorize the vast universe of stocks into distinct groups to ensure diversified investment selections and avoid concentration in similar stock profiles. By using K-Means Clustering, PEL can effectively manage and categorize these stocks into 10 distinct clusters based on their financial and non-financial characteristics, which aligns perfectly with their strategic objectives. B is incorrect. Principal Components Analysis (PCA) is primarily a dimensionality reduction technique, not a clustering method. It transforms a large set of variables into a smaller one that still contains most of the information in the large set. This reduction is achieved by identifying directions, called principal components, along which the variation in the data is maximized. PCA is useful for reducing the dimensionality of large datasets, increasing interpretability while minimizing information loss. However, it does not classify or divide data into groups, which is the primary requirement in Phase 2 of PEL's strategy. Therefore, PCA would not fulfill the need to segment the stock universe into actionable clusters for investment decisions. C is incorrect. Classification and Regression Trees (CART) is a technique used for constructing prediction models from data. The models are in the form of a decision tree that can be used for both classification and regression. In classification, it predicts the category of the target variable based on input variables, while in regression, it predicts a continuous value. Although CART could theoretically categorize stocks based on features, it is fundamentally different from clustering as it requires a predefined target variable for training. CART's approach to data segmentation is based on maximizing information gain from splits and not on grouping similar items together as required in Phase 2 for creating diversified investment clusters. ", "explhtml": "<p>K-Means Clustering is an unsupervised machine learning technique that organizes a given dataset into a specified number of clusters, in this case, the dataset being the universe of over 40,000 stocks. The algorithm assigns each data point to the nearest cluster while keeping the centroids as small as possible. It iteratively assigns each stock to one of the K clusters based on the features that are closest to the centroid of a cluster. This method is particularly useful in Phase 2 of PEL Investments&#x27; proposed strategy, where the goal is to categorize the vast universe of stocks into distinct groups to ensure diversified investment selections and avoid concentration in similar stock profiles. By using K-Means Clustering, PEL can effectively manage and categorize these stocks into 10 distinct clusters based on their financial and non-financial characteristics, which aligns perfectly with their strategic objectives.<\/p><p><b>B is incorrect<\/b>. Principal Components Analysis (PCA) is primarily a dimensionality reduction technique, not a clustering method. It transforms a large set of variables into a smaller one that still contains most of the information in the large set. This reduction is achieved by identifying directions, called principal components, along which the variation in the data is maximized. PCA is useful for reducing the dimensionality of large datasets, increasing interpretability while minimizing information loss. However, it does not classify or divide data into groups, which is the primary requirement in Phase 2 of PEL&#x27;s strategy. Therefore, PCA would not fulfill the need to segment the stock universe into actionable clusters for investment decisions.<\/p><p><b>C is incorrect<\/b>. Classification and Regression Trees (CART) is a technique used for constructing prediction models from data. The models are in the form of a decision tree that can be used for both classification and regression. In classification, it predicts the category of the target variable based on input variables, while in regression, it predicts a continuous value. Although CART could theoretically categorize stocks based on features, it is fundamentally different from clustering as it requires a predefined target variable for training. CART&#x27;s approach to data segmentation is based on maximizing information gain from splits and not on grouping similar items together as required in Phase 2 for creating diversified investment clusters. <\/p><p class=\"los\">Quantitative Methods, Learning Module 6, Machine Learning, LOS 6(c): Describe supervised machine learning algorithms—including penalized regression, support vector machine, k-nearest neighbor, classification and regression tree, ensemble learning, and random forest—and determine the problems for which they are best suited.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · PEL Investments Ltd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>PEL Investments Limited manages a long-only fund that focuses on small-cap equities worldwide.<\/p><p>With about 40,000 eligible stocks, PEL maintains a portfolio of 300 stocks. Based on several<\/p><p>ratios derived from the readily accessible market and accounting data, some of these holdings<\/p><p>result from screening the universe for attractive stocks.Others come from investments generated<\/p><p>by PEL&#x27;s professional staff of five securities analysts and two portfolio managers.<\/p><p>Peter Andre, PEL&#x27;s Chief Investment Officer, is considering a change in investing procedures to<\/p><p>achieve better revenues despite its good performance. Several workshops Anndre attended and<\/p><p>his discussions with data vendors led him to conclude that data science should play a role in the<\/p><p>choice of investments for PEL. Also, he has noticed that a large portion of PEL&#x27;s past<\/p><p>outperformance can be attributed to stocks that became targets for takeovers. After some<\/p><p>reflection and investigations, Andre sends the following report to PEL&#x27;s CEO.<\/p><p>“As a result of my exploration of possible shifts to stock selection, I have been considering<\/p><p>initiating some changes. The fact that PEL Investments is in a solid financial position due to our<\/p><p>past successes makes the present moment an excellent time to invest in our future. Our portfolio<\/p><p>is presently composed of 300 small-cap stocks across the globe. Therefore, I propose that we<\/p><p>streamline our process to make good use of machine learning (ML). Despite the technological<\/p><p>revolution occasioned by ML, human understanding is still a vital factor, for example, in<\/p><p>providing domain data. Additionally, let&#x27;s identify acquisition-probable companies. My<\/p><p>recommendation would be to follow the four phases below every quarter.<\/p><p><b>Phase 1:<\/b> Each of the 300 stocks in our portfolio is modeled using machine learning techniques.<\/p><p>A model includes fundamental and technical variables (features). For replacing the 40 stocks<\/p><p>with the lowest estimated return, we identify those with the lowest estimated return.<\/p><p><b>Phase 2:<\/b> Grounded on various applicable financial and non-financial features, we split our<\/p><p>investable universe of over 40,000 stocks into 10 clusters using ML techniques. We aim to<\/p><p>prevent unintended portfolio concentration by selecting stocks from these groups.<\/p><p><b>Phase 3:<\/b> Our model predicts the five stocks that will be acquisition targets in 1 year for each of<\/p><p>the 10 groups based on labeled data.<\/p><p><b>Phase 4:<\/b> In each of our 5 experienced teams of security analysts, there are four groups from<\/p><p>which each analyst selects the best stock pick. The 10 stocks that we have “high conviction” in<\/p><p>will be added to our portfolio (instead of the 10 stocks that are relatively underperforming and<\/p><p>will be sold in Phase 1).<\/p><p>In addition, I would like to make the following comments:<\/p><p><b>Comment 1:<\/b> There will be a need for vast quantities of data for the ML systems to administer.<\/p><p>Before deciding whether to use subscription-based data, we must first appraise the practicality<\/p><p>of free or inexpensive historical data for the ML-based stock selection processes.<\/p><p><b>Comment 2:<\/b> In the future, PEL expects to refine its investment processes with the help of ML<\/p><p>techniques.<\/p><\/div><\/details><div class=\"qtext\"><p>Phase 2 should most appropriately be executed using which of the following machine learning techniques:<\/p><\/div>", "subj": "quant"}, {"n": 67, "q": "For Phase 2, what hyperparameter should most likely be used in the ML model:", "opts": ["PEL's portfolio contains 300 small-cap stocks.", "There are 40,000 small-cap stocks eligible to be invested in by PEL.", "Small-cap stocks will be divided into 10 groups (or clusters) based on their eligibility."], "ans": "C", "expl": "In Phase 2 of the proposed investment strategy, the most relevant hyperparameter for the machine learning model is the number of clusters into which the stocks are to be divided. This is directly related to option C, which states that small-cap stocks will be divided into 10 groups (or clusters) based on their eligibility. The number of clusters, in this case, 10, is a crucial hyperparameter in clustering algorithms such as K-Means. This parameter determines how the over 40,000 stocks are grouped, which impacts the diversity and risk management of the investment portfolio. By setting the number of clusters to 10, the model can categorize stocks into distinct groups, each representing different characteristics or sectors, thereby aiding in balanced and informed investment decisions. A is incorrect. The fact that PEL's portfolio contains 300 small-cap stocks is merely a description of the current portfolio size and does not influence the machine learning model as a hyperparameter. Hyperparameters are values used to control the learning process and must be set before training the model. The number of stocks in the portfolio does not dictate any aspect of the model's learning process or structure, but rather, it is a result of investment choices and does not provide any intrinsic information for the clustering algorithm. B is incorrect. Although the information that there are 40,000 small-cap stocks eligible for investment by PEL provides context on the scope of the investment universe, it does not serve as a hyperparameter. Hyperparameters are typically values that influence the model's architecture or learning process, such as the number of clusters in a clustering algorithm. The total number of eligible stocks is a dataset characteristic and does not inherently affect how the model learns or operates, except in defining the dataset's boundary for the model's application. ", "explhtml": "<p>In Phase 2 of the proposed investment strategy, the most relevant hyperparameter for the machine learning model is the number of clusters into which the stocks are to be divided. This is directly related to option C, which states that small-cap stocks will be divided into 10 groups (or clusters) based on their eligibility. The number of clusters, in this case, 10, is a crucial hyperparameter in clustering algorithms such as K-Means. This parameter determines how the over 40,000 stocks are grouped, which impacts the diversity and risk management of the investment portfolio. By setting the number of clusters to 10, the model can categorize stocks into distinct groups, each representing different characteristics or sectors, thereby aiding in balanced and informed investment decisions.<\/p><p><b>A is incorrect<\/b>. The fact that PEL&#x27;s portfolio contains 300 small-cap stocks is merely a description of the current portfolio size and does not influence the machine learning model as a hyperparameter. Hyperparameters are values used to control the learning process and must be set before training the model. The number of stocks in the portfolio does not dictate any aspect of the model&#x27;s learning process or structure, but rather, it is a result of investment choices and does not provide any intrinsic information for the clustering algorithm.<\/p><p><b>B is incorrect<\/b>. Although the information that there are 40,000 small-cap stocks eligible for investment by PEL provides context on the scope of the investment universe, it does not serve as a hyperparameter. Hyperparameters are typically values that influence the model&#x27;s architecture or learning process, such as the number of clusters in a clustering algorithm. The total number of eligible stocks is a dataset characteristic and does not inherently affect how the model learns or operates, except in defining the dataset&#x27;s boundary for the model&#x27;s application. <\/p><p class=\"los\">Quantitative Methods, Learning Module 7: Machine Learning, LOS 7(b): Big Data Projects: Describe objectives, steps, and examples of preparing and wrangling data.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · PEL Investments Ltd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>PEL Investments Limited manages a long-only fund that focuses on small-cap equities worldwide.<\/p><p>With about 40,000 eligible stocks, PEL maintains a portfolio of 300 stocks. Based on several<\/p><p>ratios derived from the readily accessible market and accounting data, some of these holdings<\/p><p>result from screening the universe for attractive stocks.Others come from investments generated<\/p><p>by PEL&#x27;s professional staff of five securities analysts and two portfolio managers.<\/p><p>Peter Andre, PEL&#x27;s Chief Investment Officer, is considering a change in investing procedures to<\/p><p>achieve better revenues despite its good performance. Several workshops Anndre attended and<\/p><p>his discussions with data vendors led him to conclude that data science should play a role in the<\/p><p>choice of investments for PEL. Also, he has noticed that a large portion of PEL&#x27;s past<\/p><p>outperformance can be attributed to stocks that became targets for takeovers. After some<\/p><p>reflection and investigations, Andre sends the following report to PEL&#x27;s CEO.<\/p><p>“As a result of my exploration of possible shifts to stock selection, I have been considering<\/p><p>initiating some changes. The fact that PEL Investments is in a solid financial position due to our<\/p><p>past successes makes the present moment an excellent time to invest in our future. Our portfolio<\/p><p>is presently composed of 300 small-cap stocks across the globe. Therefore, I propose that we<\/p><p>streamline our process to make good use of machine learning (ML). Despite the technological<\/p><p>revolution occasioned by ML, human understanding is still a vital factor, for example, in<\/p><p>providing domain data. Additionally, let&#x27;s identify acquisition-probable companies. My<\/p><p>recommendation would be to follow the four phases below every quarter.<\/p><p><b>Phase 1:<\/b> Each of the 300 stocks in our portfolio is modeled using machine learning techniques.<\/p><p>A model includes fundamental and technical variables (features). For replacing the 40 stocks<\/p><p>with the lowest estimated return, we identify those with the lowest estimated return.<\/p><p><b>Phase 2:<\/b> Grounded on various applicable financial and non-financial features, we split our<\/p><p>investable universe of over 40,000 stocks into 10 clusters using ML techniques. We aim to<\/p><p>prevent unintended portfolio concentration by selecting stocks from these groups.<\/p><p><b>Phase 3:<\/b> Our model predicts the five stocks that will be acquisition targets in 1 year for each of<\/p><p>the 10 groups based on labeled data.<\/p><p><b>Phase 4:<\/b> In each of our 5 experienced teams of security analysts, there are four groups from<\/p><p>which each analyst selects the best stock pick. The 10 stocks that we have “high conviction” in<\/p><p>will be added to our portfolio (instead of the 10 stocks that are relatively underperforming and<\/p><p>will be sold in Phase 1).<\/p><p>In addition, I would like to make the following comments:<\/p><p><b>Comment 1:<\/b> There will be a need for vast quantities of data for the ML systems to administer.<\/p><p>Before deciding whether to use subscription-based data, we must first appraise the practicality<\/p><p>of free or inexpensive historical data for the ML-based stock selection processes.<\/p><p><b>Comment 2:<\/b> In the future, PEL expects to refine its investment processes with the help of ML<\/p><p>techniques.<\/p><\/div><\/details><div class=\"qtext\"><p>For Phase 2, what hyperparameter should most likely be used in the ML model:<\/p><\/div>", "subj": "quant"}, {"n": 68, "q": "In Phase 3, which of the following is most likely the target variable for the labeled training data?", "opts": ["An ordinal target variable.", "A categorical target variable.", "A continuous target variable."], "ans": "B", "expl": "In Phase 3 of the proposed changes by PEL Investments, the machine learning model is tasked with predicting which stocks will become acquisition targets within a year. This prediction is inherently a classification problem where each stock is labeled as either a target for acquisition or not. Therefore, the target variable for the labeled training data used in this phase is a categorical one. Categorical variables are those that represent a quality or characteristic in a data set, typically taking on two or more categories but having no intrinsic ordering to those categories. In this context, the categories would likely be '0' for 'not an acquisition target' and '1' for 'an acquisition target'. This binary categorization makes the target variable ideal for classification algorithms in machine learning, which are designed to handle such data effectively. A is incorrect. An ordinal target variable implies a natural order among the categories, such as rankings or levels (e.g., low, medium, high). In the scenario described for PEL Investments, the prediction of whether a stock is an acquisition target does not fit into an ordinal framework because being an acquisition target is not a matter of degree but a distinct state. Thus, labeling stocks as '0' or '1' does not imply any order but merely distinguishes between two states, making the target variable categorical rather than ordinal. C is incorrect. A continuous target variable would imply that the model outputs a continuous range of values, which is typical for regression problems. For example, predicting the price of a stock or the percentage change in its value would require a continuous target variable. However, in Phase 3, the task is to classify stocks into discrete categories (target or not a target), not to measure an attribute of the stocks on a continuum. Therefore, the use of a categorical target variable is appropriate, not a continuous one. ", "explhtml": "<p>In Phase 3 of the proposed changes by PEL Investments, the machine learning model is tasked with predicting which stocks will become acquisition targets within a year. This prediction is inherently a classification problem where each stock is labeled as either a target for acquisition or not. Therefore, the target variable for the labeled training data used in this phase is a categorical one. Categorical variables are those that represent a quality or characteristic in a data set, typically taking on two or more categories but having no intrinsic ordering to those categories. In this context, the categories would likely be &#x27;0&#x27; for &#x27;not an acquisition target&#x27; and &#x27;1&#x27; for &#x27;an acquisition target&#x27;. This binary categorization makes the target variable ideal for classification algorithms in machine learning, which are designed to handle such data effectively.<\/p><p><b>A is incorrect<\/b>. An ordinal target variable implies a natural order among the categories, such as rankings or levels (e.g., low, medium, high). In the scenario described for PEL Investments, the prediction of whether a stock is an acquisition target does not fit into an ordinal framework because being an acquisition target is not a matter of degree but a distinct state. Thus, labeling stocks as &#x27;0&#x27; or &#x27;1&#x27; does not imply any order but merely distinguishes between two states, making the target variable categorical rather than ordinal.<\/p><p><b>C is incorrect<\/b>. A continuous target variable would imply that the model outputs a continuous range of values, which is typical for regression problems. For example, predicting the price of a stock or the percentage change in its value would require a continuous target variable. However, in Phase 3, the task is to classify stocks into discrete categories (target or not a target), not to measure an attribute of the stocks on a continuum. Therefore, the use of a categorical target variable is appropriate, not a continuous one. <\/p><p class=\"los\">Quantitative Methods, Learning Module 6: Machine Learning, LOS 6(a) Describe supervised machine learning, unsupervised machine learning, and deep learning.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · PEL Investments Ltd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>PEL Investments Limited manages a long-only fund that focuses on small-cap equities worldwide.<\/p><p>With about 40,000 eligible stocks, PEL maintains a portfolio of 300 stocks. Based on several<\/p><p>ratios derived from the readily accessible market and accounting data, some of these holdings<\/p><p>result from screening the universe for attractive stocks.Others come from investments generated<\/p><p>by PEL&#x27;s professional staff of five securities analysts and two portfolio managers.<\/p><p>Peter Andre, PEL&#x27;s Chief Investment Officer, is considering a change in investing procedures to<\/p><p>achieve better revenues despite its good performance. Several workshops Anndre attended and<\/p><p>his discussions with data vendors led him to conclude that data science should play a role in the<\/p><p>choice of investments for PEL. Also, he has noticed that a large portion of PEL&#x27;s past<\/p><p>outperformance can be attributed to stocks that became targets for takeovers. After some<\/p><p>reflection and investigations, Andre sends the following report to PEL&#x27;s CEO.<\/p><p>“As a result of my exploration of possible shifts to stock selection, I have been considering<\/p><p>initiating some changes. The fact that PEL Investments is in a solid financial position due to our<\/p><p>past successes makes the present moment an excellent time to invest in our future. Our portfolio<\/p><p>is presently composed of 300 small-cap stocks across the globe. Therefore, I propose that we<\/p><p>streamline our process to make good use of machine learning (ML). Despite the technological<\/p><p>revolution occasioned by ML, human understanding is still a vital factor, for example, in<\/p><p>providing domain data. Additionally, let&#x27;s identify acquisition-probable companies. My<\/p><p>recommendation would be to follow the four phases below every quarter.<\/p><p><b>Phase 1:<\/b> Each of the 300 stocks in our portfolio is modeled using machine learning techniques.<\/p><p>A model includes fundamental and technical variables (features). For replacing the 40 stocks<\/p><p>with the lowest estimated return, we identify those with the lowest estimated return.<\/p><p><b>Phase 2:<\/b> Grounded on various applicable financial and non-financial features, we split our<\/p><p>investable universe of over 40,000 stocks into 10 clusters using ML techniques. We aim to<\/p><p>prevent unintended portfolio concentration by selecting stocks from these groups.<\/p><p><b>Phase 3:<\/b> Our model predicts the five stocks that will be acquisition targets in 1 year for each of<\/p><p>the 10 groups based on labeled data.<\/p><p><b>Phase 4:<\/b> In each of our 5 experienced teams of security analysts, there are four groups from<\/p><p>which each analyst selects the best stock pick. The 10 stocks that we have “high conviction” in<\/p><p>will be added to our portfolio (instead of the 10 stocks that are relatively underperforming and<\/p><p>will be sold in Phase 1).<\/p><p>In addition, I would like to make the following comments:<\/p><p><b>Comment 1:<\/b> There will be a need for vast quantities of data for the ML systems to administer.<\/p><p>Before deciding whether to use subscription-based data, we must first appraise the practicality<\/p><p>of free or inexpensive historical data for the ML-based stock selection processes.<\/p><p><b>Comment 2:<\/b> In the future, PEL expects to refine its investment processes with the help of ML<\/p><p>techniques.<\/p><\/div><\/details><div class=\"qtext\"><p>In Phase 3, which of the following is most likely the target variable for the labeled training data?<\/p><\/div>", "subj": "quant"}, {"n": 69, "q": "Which of the following statements about the regression on South African stocks return is most accurate:", "opts": ["The South African stock return is unrelated to both the annual return on the South African market index and the annual percentage increase in GDP.", "The South African stock return is closely related to the annual percentage increase in GDP.", "The South African stock's return is very closely related to the annual return on the South African market index."], "ans": "C", "expl": "The regression analysis results show a strong and statistically significant relationship between the South African stock return and the annual return on the South African market index. The coefficient for the annual return on the South African market index is 3.543 with a standard error of 0.360. To determine the significance of this coefficient, we calculate the t-statistic as follows: With 77 degrees of freedom (80 observations minus 3 for the intercept and two predictors), the critical t-value at the 0.05 significance level is approximately 2.00. Since 9.841 is significantly greater than 2.00, we conclude that the coefficient is statistically significant, indicating a strong relationship between the market index return and the stock return. A is incorrect. This statement is incorrect because the regression analysis results show that there is a statistically significant relationship between the South African stock return and the annual return on the South African market index. The t-statistic calculated for the coefficient of the market index return is 9.841, which is much greater than the critical t-value of 2.00. This indicates a strong relationship. Additionally, there is also some relationship between the stock return and the annual percentage increase in GDP, although it may not be as strong as the relationship with the market index return. B is incorrect. This statement is partially correct but not the most accurate. While there is a relationship between the South African stock return and the annual percentage increase in GDP, as indicated by the coefficient of 0.766 with a standard error of 0.238, the strength of this relationship is not as strong as that with the annual return on the South African market index. The t-statistic for the GDP increase is lower compared to that of the market index return, indicating that the relationship with the market index is stronger and more significant.", "explhtml": "<p>The regression analysis results show a strong and statistically significant relationship between the South African stock return and the annual return on the South African market index. The coefficient for the annual return on the South African market index is 3.543 with a standard error of 0.360. To determine the significance of this coefficient, we calculate the t-statistic as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0139.webp\" style=\"max-width:min(100%,115px)\" alt=\"3.543 = 9.841 0.360\"><p>With 77 degrees of freedom (80 observations minus 3 for the intercept and two predictors), the critical t-value at the 0.05 significance level is approximately 2.00. Since 9.841 is significantly greater than 2.00, we conclude that the coefficient is statistically significant, indicating a strong relationship between the market index return and the stock return.<\/p><p><b>A is incorrect.<\/b> This statement is incorrect because the regression analysis results show that there is a statistically significant relationship between the South African stock return and the annual return on the South African market index. The t-statistic calculated for the coefficient of the market index return is 9.841, which is much greater than the critical t-value of 2.00. This indicates a strong relationship. Additionally, there is also some relationship between the stock return and the annual percentage increase in GDP, although it may not be as strong as the relationship with the market index return.<\/p><p><b>B is incorrect.<\/b> This statement is partially correct but not the most accurate. While there is a relationship between the South African stock return and the annual percentage increase in GDP, as indicated by the coefficient of 0.766 with a standard error of 0.238, the strength of this relationship is not as strong as that with the annual return on the South African market index. The t-statistic for the GDP increase is lower compared to that of the market index return, indicating that the relationship with the market index is stronger and more significant.<\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Evaluating Regression Model Fit and Interpreting Model Results, LOS 2(b): formulate hypotheses on the significance of two or more coefficients in a multiple regression model and interpret the results of the joint hypothesis tests.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Hannes &amp; Blair Ltd (HB)<\/summary><div class=\"vig-body\"><p>Hannes &amp; Blair Ltd (HB) is a US-based investment bank providing financial advice and portfolio<\/p><p>management services to private and institutional clients. Xavier Gibson CFA is the head of<\/p><p>portfolio management at HB. Gibson manages the portfolio of Jim Evans worth $ 10 million. The<\/p><p>Evans&#x27; portfolio has a significant allocation of stocks from emerging markets such as South<\/p><p>Africa and Brazil. To estimate the returns to the South African stock investments, Gibson uses a<\/p><p>regression model with an independent variable measuring (I) the growth in the South African<\/p><p>GDP and (II) the return on a South African market index and the dependent variable measuring<\/p><p>the South African stock return. The results of the regression are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0138.webp\" style=\"max-width:min(100%,584px)\" alt=\"Exhibit 1: Regression Analysis Results Coefficient Standard Error Intercept 0.0097 0.014 Annual GDP Increase (%) 0.766 0.238 Annual South African Market Index Return 3.543 0.360 ANOVA Table Regression Sum of Squares 0.9622 Residual Sum of Squares 0.4362 Observations 80\"><p>During his meeting with Evans, Gibson presents the regression results. Evans, interpreting the<\/p><p>results, makes the following comments:<\/p><p>&quot;The slope coefficient for the annual percentage increase in GDP suggests that for each 1-unit<\/p><p>rise in GDP, the expected increase in return is 0.766 units. This coefficient value of 0.766<\/p><p>remains unchanged even when the second independent variable is excluded.”<\/p><p>Evans then inquired about how fluctuations in market return might influence the return on the<\/p><p>South African investment. He added, &quot;Assuming the market return changes by 1% over a year,<\/p><p>we would anticipate the investment return to increase by 3.543% if we compare the returns at<\/p><p>the start and end of the year. However, to confirm this, we need to calculate the F-statistic using<\/p><p>regression data, especially focusing on the sum of squared residuals and the regression sum of<\/p><p>squares.&quot;<\/p><p>Following his meeting with Evans, Gibson consulted Markus Ruhl, a statistician at HB’s<\/p><p>headquarters, with whom he had been co-managing a multimillion-dollar institutional fund. Ruhl<\/p><p>proposed using a multiple regression model to evaluate whether (I) an increase in the U.S.<\/p><p>literacy rate and (II) advancements in technology would impact the stocks’ P/E ratios.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements about the regression on South African stocks return is most accurate:<\/p><\/div>", "subj": "quant"}, {"n": 70, "q": "Based on Exhibit 1, the F statistic is closest to:", "opts": ["85.0", "2.764", "86.7"], "ans": "A", "expl": "The F-statistic is calculated to assess the overall significance of a regression model. It is derived by dividing the mean square due to regression (MSR) by the mean square error (MSE). In this case, the regression sum of squares (SSR) is 0.9622 and the residual sum of squares (SSE) is 0.4362 with a total of 80 observations and 2 predictors. The formula for the F-statistic is: Where k is the number of predictors (2 in this case) and n is the total number of observations (80). Plugging in the values: B is incorrect. This value is significantly smaller than the correct F-statistic. Given that the mean square due to regression (MSR) is 0.4811 and the mean square error (MSE) is 0.00566, the resulting F-statistic from dividing MSR by MSE is 85. A value of 2.764 would imply an incorrect calculation or misunderstanding of the relationship between the sums of squares and their respective degrees of freedom. C is incorrect. While this value is relatively close to 85, it is still not the most accurate based on the calculations provided. The correct F-statistic, derived from the given regression and residual sums of squares, is precisely 85 when calculated using the formula. The discrepancy with 86.7 might stem from rounding errors or misinterpretation of the data, but 85 is the correct and accurate F-statistic based on the given information.", "explhtml": "<p>The F-statistic is calculated to assess the overall significance of a regression model. It is derived by dividing the mean square due to regression (MSR) by the mean square error (MSE). In this case, the regression sum of squares (SSR) is 0.9622 and the residual sum of squares (SSE) is 0.4362 with a total of 80 observations and 2 predictors. The formula for the F-statistic is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0140.webp\" style=\"max-width:min(100%,235px)\" alt=\"SSR MSR K F −Statistic = MSE = SSE n−k−1\"><p>Where k is the number of predictors (2 in this case) and n is the total number of observations (80). Plugging in the values:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0141.webp\" style=\"max-width:min(100%,223px)\" alt=\"0.9622 MSR = 2 = 0.4811 0.4362 MSE = = 0.00566 77 0.4811 F −Statistic = 0.00566 = 85\"><p><b>B is incorrect.<\/b> This value is significantly smaller than the correct F-statistic. Given that the mean square due to regression (MSR) is 0.4811 and the mean square error (MSE) is 0.00566, the resulting F-statistic from dividing MSR by MSE is 85. A value of 2.764 would imply an incorrect calculation or misunderstanding of the relationship between the sums of squares and their respective degrees of freedom.<\/p><p><b>C is incorrect.<\/b> While this value is relatively close to 85, it is still not the most accurate based on the calculations provided. The correct F-statistic, derived from the given regression and residual sums of squares, is precisely 85 when calculated using the formula. The discrepancy with 86.7 might stem from rounding errors or misinterpretation of the data, but 85 is the correct and accurate F-statistic based on the given information.<\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Evaluating Regression Model Fit and Interpreting Model Results, LOS 2(c) Calculate and interpret a predicted value for the dependent variable, given the estimated regression model and assumed values for the independent variable.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Hannes &amp; Blair Ltd (HB)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hannes &amp; Blair Ltd (HB) is a US-based investment bank providing financial advice and portfolio<\/p><p>management services to private and institutional clients. Xavier Gibson CFA is the head of<\/p><p>portfolio management at HB. Gibson manages the portfolio of Jim Evans worth $ 10 million. The<\/p><p>Evans&#x27; portfolio has a significant allocation of stocks from emerging markets such as South<\/p><p>Africa and Brazil. To estimate the returns to the South African stock investments, Gibson uses a<\/p><p>regression model with an independent variable measuring (I) the growth in the South African<\/p><p>GDP and (II) the return on a South African market index and the dependent variable measuring<\/p><p>the South African stock return. The results of the regression are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0138.webp\" style=\"max-width:min(100%,584px)\" alt=\"Exhibit 1: Regression Analysis Results Coefficient Standard Error Intercept 0.0097 0.014 Annual GDP Increase (%) 0.766 0.238 Annual South African Market Index Return 3.543 0.360 ANOVA Table Regression Sum of Squares 0.9622 Residual Sum of Squares 0.4362 Observations 80\"><p>During his meeting with Evans, Gibson presents the regression results. Evans, interpreting the<\/p><p>results, makes the following comments:<\/p><p>&quot;The slope coefficient for the annual percentage increase in GDP suggests that for each 1-unit<\/p><p>rise in GDP, the expected increase in return is 0.766 units. This coefficient value of 0.766<\/p><p>remains unchanged even when the second independent variable is excluded.”<\/p><p>Evans then inquired about how fluctuations in market return might influence the return on the<\/p><p>South African investment. He added, &quot;Assuming the market return changes by 1% over a year,<\/p><p>we would anticipate the investment return to increase by 3.543% if we compare the returns at<\/p><p>the start and end of the year. However, to confirm this, we need to calculate the F-statistic using<\/p><p>regression data, especially focusing on the sum of squared residuals and the regression sum of<\/p><p>squares.&quot;<\/p><p>Following his meeting with Evans, Gibson consulted Markus Ruhl, a statistician at HB’s<\/p><p>headquarters, with whom he had been co-managing a multimillion-dollar institutional fund. Ruhl<\/p><p>proposed using a multiple regression model to evaluate whether (I) an increase in the U.S.<\/p><p>literacy rate and (II) advancements in technology would impact the stocks’ P/E ratios.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the F statistic is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 71, "q": "Concerning his comment, Evans will most likely be correct only if the:", "opts": ["The second independent variable and the intercept are uncorrelated with the annual % increase in GDP.", "The second independent variable is uncorrelated with the annual % increase in GDP.", "Residuals of the regression represent the expected net effect on South African stock returns of a 1 unit increase in annual GDP after removing that part of GDP that is correlated with the market index return."], "ans": "B", "expl": "If the second independent variable is uncorrelated with the annual % increase in GDP, the coefficient for the annual GDP increase remains consistent regardless of whether the second variable is included in the regression model. This scenario ensures that the effect of annual GDP increase on returns is isolated and accurately measured. A is incorrect. It includes an additional condition about the intercept being uncorrelated with the annual % increase in GDP. The intercept does not need to be uncorrelated; only the second independent variable needs to be uncorrelated with GDP for Evans' comment to hold. C is incorrect. It discusses the residuals of the regression and their relation to South African stock returns and the market index return. This is irrelevant to the condition required for Evans' comment to be valid. The correct answer focuses solely on the correlation between the second independent variable and GDP, not on the interpretation of the residuals.", "explhtml": "<p>If the second independent variable is uncorrelated with the annual % increase in GDP, the coefficient for the annual GDP increase remains consistent regardless of whether the second variable is included in the regression model. This scenario ensures that the effect of annual GDP increase on returns is isolated and accurately measured.<\/p><p><b>A is incorrect.<\/b> It includes an additional condition about the intercept being uncorrelated with the annual % increase in GDP. The intercept does not need to be uncorrelated; only the second independent variable needs to be uncorrelated with GDP for Evans&#x27; comment to hold.<\/p><p><b>C is incorrect.<\/b> It discusses the residuals of the regression and their relation to South African stock returns and the market index return. This is irrelevant to the condition required for Evans&#x27; comment to be valid. The correct answer focuses solely on the correlation between the second independent variable and GDP, not on the interpretation of the residuals.<\/p><p class=\"los\">Quantitative Methods, Learning Module 1: Basics of Multiple Regression and Underlying Assumptions, LOS 1(b) Formulate a multiple linear regression model, describe the relation between the dependent variable and several independent variables and interpret estimated regression coefficients<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Hannes &amp; Blair Ltd (HB)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hannes &amp; Blair Ltd (HB) is a US-based investment bank providing financial advice and portfolio<\/p><p>management services to private and institutional clients. Xavier Gibson CFA is the head of<\/p><p>portfolio management at HB. Gibson manages the portfolio of Jim Evans worth $ 10 million. The<\/p><p>Evans&#x27; portfolio has a significant allocation of stocks from emerging markets such as South<\/p><p>Africa and Brazil. To estimate the returns to the South African stock investments, Gibson uses a<\/p><p>regression model with an independent variable measuring (I) the growth in the South African<\/p><p>GDP and (II) the return on a South African market index and the dependent variable measuring<\/p><p>the South African stock return. The results of the regression are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0138.webp\" style=\"max-width:min(100%,584px)\" alt=\"Exhibit 1: Regression Analysis Results Coefficient Standard Error Intercept 0.0097 0.014 Annual GDP Increase (%) 0.766 0.238 Annual South African Market Index Return 3.543 0.360 ANOVA Table Regression Sum of Squares 0.9622 Residual Sum of Squares 0.4362 Observations 80\"><p>During his meeting with Evans, Gibson presents the regression results. Evans, interpreting the<\/p><p>results, makes the following comments:<\/p><p>&quot;The slope coefficient for the annual percentage increase in GDP suggests that for each 1-unit<\/p><p>rise in GDP, the expected increase in return is 0.766 units. This coefficient value of 0.766<\/p><p>remains unchanged even when the second independent variable is excluded.”<\/p><p>Evans then inquired about how fluctuations in market return might influence the return on the<\/p><p>South African investment. He added, &quot;Assuming the market return changes by 1% over a year,<\/p><p>we would anticipate the investment return to increase by 3.543% if we compare the returns at<\/p><p>the start and end of the year. However, to confirm this, we need to calculate the F-statistic using<\/p><p>regression data, especially focusing on the sum of squared residuals and the regression sum of<\/p><p>squares.&quot;<\/p><p>Following his meeting with Evans, Gibson consulted Markus Ruhl, a statistician at HB’s<\/p><p>headquarters, with whom he had been co-managing a multimillion-dollar institutional fund. Ruhl<\/p><p>proposed using a multiple regression model to evaluate whether (I) an increase in the U.S.<\/p><p>literacy rate and (II) advancements in technology would impact the stocks’ P/E ratios.<\/p><\/div><\/details><div class=\"qtext\"><p>Concerning his comment, Evans will most likely be correct only if the:<\/p><\/div>", "subj": "quant"}, {"n": 72, "q": "Concerning the effect of change in market return on the South African investment return, Evans is least accurate regarding:", "opts": ["Both the comparison of returns and the F-statistic.", "The comparison of returns only.", "Neither the comparison of returns nor the F-statistic."], "ans": "A", "expl": "Evans' statement about the market return influencing South African investment return by 3.543% if we compare returns at the start and end of the year is overly simplistic. The accurate measurement of this effect should involve a detailed regression analysis and calculation of the F-statistic to understand the relationship between variables and their significance. Without this, the comparison of returns alone is not reliable, nor is the conclusion drawn from the F-statistic. B is incorrect. It claims that only the comparison of returns is inaccurate. While Evans' comparison of returns is indeed flawed, this option overlooks the importance of the F-statistic in validating the model. The F-statistic helps assess the overall significance of the regression model, and without its proper calculation, Evans' statement lacks statistical rigour. C is incorrect. It suggests that neither the comparison of returns nor the F-statistic is inaccurate. This option implies that Evans' statement is entirely accurate, which is not true. The comparison of returns without proper regression analysis and the calculation of the F-statistic does not provide a complete picture of the effect of market return changes on South African investment return.", "explhtml": "<p>Evans&#x27; statement about the market return influencing South African investment return by 3.543% if we compare returns at the start and end of the year is overly simplistic. The accurate measurement of this effect should involve a detailed regression analysis and calculation of the F-statistic to understand the relationship between variables and their significance. Without this, the comparison of returns alone is not reliable, nor is the conclusion drawn from the F-statistic.<\/p><p><b>B is incorrect.<\/b> It claims that only the comparison of returns is inaccurate. While Evans&#x27; comparison of returns is indeed flawed, this option overlooks the importance of the F-statistic in validating the model. The F-statistic helps assess the overall significance of the regression model, and without its proper calculation, Evans&#x27; statement lacks statistical rigour.<\/p><p><b>C is incorrect.<\/b> It suggests that neither the comparison of returns nor the F-statistic is inaccurate. This option implies that Evans&#x27; statement is entirely accurate, which is not true. The comparison of returns without proper regression analysis and the calculation of the F-statistic does not provide a complete picture of the effect of market return changes on South African investment return.<\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Evaluating Regression Model Fit and Interpreting Model Results, LOS 2(c) Calculate and interpret a predicted value for the dependent variable, given the estimated regression model and assumed values for the independent variable.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Hannes &amp; Blair Ltd (HB)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hannes &amp; Blair Ltd (HB) is a US-based investment bank providing financial advice and portfolio<\/p><p>management services to private and institutional clients. Xavier Gibson CFA is the head of<\/p><p>portfolio management at HB. Gibson manages the portfolio of Jim Evans worth $ 10 million. The<\/p><p>Evans&#x27; portfolio has a significant allocation of stocks from emerging markets such as South<\/p><p>Africa and Brazil. To estimate the returns to the South African stock investments, Gibson uses a<\/p><p>regression model with an independent variable measuring (I) the growth in the South African<\/p><p>GDP and (II) the return on a South African market index and the dependent variable measuring<\/p><p>the South African stock return. The results of the regression are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0138.webp\" style=\"max-width:min(100%,584px)\" alt=\"Exhibit 1: Regression Analysis Results Coefficient Standard Error Intercept 0.0097 0.014 Annual GDP Increase (%) 0.766 0.238 Annual South African Market Index Return 3.543 0.360 ANOVA Table Regression Sum of Squares 0.9622 Residual Sum of Squares 0.4362 Observations 80\"><p>During his meeting with Evans, Gibson presents the regression results. Evans, interpreting the<\/p><p>results, makes the following comments:<\/p><p>&quot;The slope coefficient for the annual percentage increase in GDP suggests that for each 1-unit<\/p><p>rise in GDP, the expected increase in return is 0.766 units. This coefficient value of 0.766<\/p><p>remains unchanged even when the second independent variable is excluded.”<\/p><p>Evans then inquired about how fluctuations in market return might influence the return on the<\/p><p>South African investment. He added, &quot;Assuming the market return changes by 1% over a year,<\/p><p>we would anticipate the investment return to increase by 3.543% if we compare the returns at<\/p><p>the start and end of the year. However, to confirm this, we need to calculate the F-statistic using<\/p><p>regression data, especially focusing on the sum of squared residuals and the regression sum of<\/p><p>squares.&quot;<\/p><p>Following his meeting with Evans, Gibson consulted Markus Ruhl, a statistician at HB’s<\/p><p>headquarters, with whom he had been co-managing a multimillion-dollar institutional fund. Ruhl<\/p><p>proposed using a multiple regression model to evaluate whether (I) an increase in the U.S.<\/p><p>literacy rate and (II) advancements in technology would impact the stocks’ P/E ratios.<\/p><\/div><\/details><div class=\"qtext\"><p>Concerning the effect of change in market return on the South African investment return, Evans is least accurate regarding:<\/p><\/div>", "subj": "quant"}, {"n": 73, "q": "Based on Exhibit 1 and Exhibit 2, the correlation between the variables Costs and Cardiovascular disease is closest to:", "opts": ["0", "0.8942", "0.9456"], "ans": "C", "expl": "This conclusion can be reached through the two methods. The first method involves the coefficient of determination (R2) from the regression analysis provided in Exhibit 2. The R2 value is 0.8942, which measures the proportion of variance in the dependent variable that is predictable from the independent variable. The correlation coefficient (r) is the square root of R2, calculated as follows: The second method uses the sample covariance and the standard deviations of Costs and Cardiovascular disease. The correlation coefficient can also be calculated using the formula: where Cov(X, Y ) is the sample covariance, and Sx and Sy are the sample standard deviations of X and Y, respectively. Plugging in the values: This confirms that the correlation coefficient is indeed 0.9456, matching the calculation from the R2 value. A is incorrect. A correlation coefficient (r) of 0 implies no linear relationship between the variables Costs and Cardiovascular disease. Based on the data provided in Exhibit 1 and Exhibit 2, there is clearly a strong association between the variables, as evidenced by the high R2 value of 0.8942. This disproves the possibility of 0 being the correct answer. B is incorrect. The value 0.8942 represents the coefficient of determination (R2), not the correlation coefficient (r). The correlation coefficient (r) is derived by taking the square root of  R2. Since R2 = 0.8942, we calculate: Therefore, 0.8942 is incorrect because it confuses R2 with r.", "explhtml": "<p>This conclusion can be reached through the two methods. The first method involves the coefficient of determination (R<sup>2<\/sup>) from the regression analysis provided in Exhibit 2. The R<sup>2<\/sup> value is 0.8942, which measures the proportion of variance in the dependent variable that is predictable from the independent variable. The correlation coefficient (r) is the square root of R<sup>2<\/sup>, calculated as follows:<\/p><img class=\"pi  assumed values for the independent variable.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Spencer Porter<\/summary><div class=\"vig-body\"><p>Spencer Porter is a senior financial analyst at Madison Pharmaceuticals, which has been working<\/p><p>on a breakthrough drug to manage diabetes. Porter would like to understand the relationship<\/p><p>between the cost of the drug and patient hospitalization rates. Porter asks his junior analyst,<\/p><p>Kareem Bhandari to collect data and conduct statistical tests to facilitate the analysis. Bhandari<\/p><p>collects data on the use of this new drug. Porter instructs him to be cautious about interpreting<\/p><p>the result, as he mentions, “ I am concerned that the cost of the drug might increase at a higher<\/p><p>rate for patients with cardiovascular diseases.”<\/p><p>With the help of the researchers in the company, Bhandari collects 30 data points and conducts a<\/p><p>linear regression, summarizing them in the tables below. Bhandari noticed that the last patient<\/p><p>had been suffering from cardiovascular disease for 25 years. Porter defines cost (in USD) as the<\/p><p>dependent variable and the prevalence of cardiovascular diseases as the independent variable.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0142.webp\" style=\"max-width:min(100%,604px)\" alt=\"Exhibit 1: Descriptive Statistics Statistic Cost Cardiovascular Disease Mean 180.76 15 Sum of Squared Deviations 1678.7 23.5 Sample Covariance 6.476 Exhibit 2: Regression Statistics R2 0.8942 Standard Error of Estimate 3.4324 Observations 30 Coefficients Standard Error t-Statistic P-Value Intercept \"><p>Bhandari states the following about the regression results:<\/p><p>Statement 1: The value of the coefficient of determination is 0.8942.<\/p><p>Statement 2: Since there are 30 observations and 1 independent variable, there are 29 degrees<\/p><p>of freedom for the t-test of the slope c const CFG = {"title": "AnalystPrep — Quantitative Methods", "subtitle": "CFA Level II · 76 câu · 19 item sets · AnalystPrep 2026", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}
