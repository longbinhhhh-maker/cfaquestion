<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalystPrep — Quantitative Methods</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">

  #resultOverlay h3.pass{color:var(--ok)}

</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);

  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
  .expl-html .los{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:12px}
  .expl-html b{color:var(--txt)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);

const DATA = [{"n": 1, "q": "Webb is most accurate with respect to:", "opts": ["Conclusion 1 and conclusion 2.", "Conclusion 2 only.", "Neither conclusion 1 nor conclusion 2."], "ans": "A", "expl": "Conclusion 1 is correct because it accurately identifies the appropriate model for the data presented in Exhibit 1. The autocorrelations at lags 1 and 2 are 0.1320 and 0.1856 respectively, which are significantly different from zero given the critical t-value of 1.96 and the standard error calculated as . Autocorrelations at higher lags (3, 4, and 5) are very close to zero, indicating no significant autocorrelation at these lags. This pattern suggests that the time series has short-term dependencies that can be captured by a moving average model with two lags (MA(2)), rather than a longer or indefinite series of dependencies that would suggest an autoregressive model. The significant autocorrelations at the first two lags and the insignificance of higher lags support the use of an MA(2) model. Conclusion 2 correctly differentiates between a simple moving average and a moving average model like MA(2). A simple moving average assigns equal weights to all observations within the window (the number of lags considered), and it only considers the observed values of the time series. In contrast, a moving average model like MA(2) can assign different weights to different lags and these weights are determined statistically based on the data to best forecast future values. This distinction is crucial for accurate modeling and forecasting, especially in financial time series where recent values might have more predictive power than older values. B is incorrect. Although Conclusion 2 is correct, option B suggests that only Conclusion 2 is accurate, which is not the case as Conclusion 1 is also correct. C is incorrect. This option suggests that neither Conclusion 1 nor Conclusion 2 is correct, which is not accurate as both conclusions are correct.", "explhtml": "<p>Conclusion 1 is correct because it accurately identifies the appropriate model for the data presented in Exhibit 1. The autocorrelations at lags 1 and 2 are 0.1320 and 0.1856 respectively, which are significantly different from zero given the critical t-value of 1.96 and the standard error calculated as<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0008.webp\" style=\"max-width:min(100%,135px)\" alt=\"1 ≈0.05012 √398\"><p>. Autocorrelations at higher lags (3, 4, and 5) are very close to zero, indicating no significant autocorrelation at these lags. This pattern suggests that the time series has short-term dependencies that can be captured by a moving average model with two lags (MA(2)), rather than a longer or indefinite series of dependencies that would suggest an autoregressive model. The significant autocorrelations at the first two lags and the insignificance of higher lags support the use of an MA(2) model.<\/p><p>Conclusion 2 correctly differentiates between a simple moving average and a moving average model like MA(2). A simple moving average assigns equal weights to all observations within the window (the number of lags considered), and it only considers the observed values of the time series. In contrast, a moving average model like MA(2) can assign different weights to different lags and these weights are determined statistically based on the data to best forecast future values. This distinction is crucial for accurate modeling and forecasting, especially in financial time series where recent values might have more predictive power than older values.<\/p><p><b>B is incorrect<\/b>. Although Conclusion 2 is correct, option B suggests that only Conclusion 2 is accurate, which is not the case as Conclusion 1 is also correct.<\/p><p><b>C is incorrect<\/b>. This option suggests that neither Conclusion 1 nor Conclusion 2 is correct, which is not accurate as both conclusions are correct.<\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(e): explain how autocorrelations of the residuals can be used to test whether the autoregressive model fits the time series Study Session 1, Learning Module 5: Time-Series Analysis, LOS 5(o): determine an appropriate time-series model to analyze a given investment problem and justify that choice<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Brittany Ruiz<\/summary><div class=\"vig-body\"><p>Brittany Ruiz is the chief investment officer (CIO) at Black-Mount Capital Advisory Firm (BMCA), a leading U.S. based money management firm. Last year, BMCA launched the BMCA Equity Fund that invested in domestic and international markets stocks, including those of Russia, Brazil, Canada, and the U.K. During its annual performance review, Ruiz discovered that the fund earned a considerably less return than that of its benchmark. Concerned with the outcome, Ruiz called a meeting with the fund’s portfolio management team to discuss key issues related to the quantitative analysis of the fund’s investments. A leading quantitative expert, Anthony Webb, was invited to chair the meeting. While analyzing the regression models used by the PM team to predict stock returns, Webb requested the information provided in Exhibit 1. The information relates to a time-series model for annualized monthly returns to a Brazilian stock index.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0006.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit 1: Annualized Monthly Returns to a Brazilian Stock Index Lag Autocorrelation 1 0.1320 2 0.1856 3 -0.0098 4 0.0056 5 -0.0062\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0007.webp\" style=\"max-width:min(100%,315px)\" alt=\"Critical t-value 1.96 Number of observations 398\"><p>After his analysis, Webb presented the following conclusions to the portfolio management team:<\/p><p>Conclusion 1: “This time series can be best modeled using a moving average (2) model rather than an autoregressive model.”<\/p><p>Conclusion 2: “A moving average (2) model would be different from a simple moving average because the former would place different weights on the terms in the moving average. And unlike the MA(2), a simple moving average is based on observed time series values.”<\/p><p>Since 10% of the BMCA Equity Fund was invested in large-cap Russian stocks, Webb considered it crucial to study the characteristics of the Russian capital markets. While reviewing BMCA’s autoregressive (1) model used to predict the Russian inflation rate, Webb suspected that the model might have a unit root. To accurately test for the presence of a unit root in the time series, Webb decided to regress the first difference of the time series on the first lag of the time series. After obtaining the regression results, Webb calculated the t-statistic conventionally for the coefficient. He then used the critical t-values computed by Dickey and Fuller to determine significance. Since he could not reject the null hypothesis at the 5% significance level, Webb concluded that the series did not have a unit root and was stationary.<\/p><p>When talking to Ruiz about ‘random walks’ Webb stated that a time-series that was a random walk could not be analyzed using standard regression analysis. He made the following statements:<\/p><p>Statement 1: “There is no finite mean-reverting level for a random walk. In addition, the variance of the time-series increases or decreases as we go further into the future without any lower or upper bound. This violates the assumption of a finite variance for the time-series.”<\/p><p>Statement 2: “To model a random walk, we should first-difference it. This results in a mean-reverting level of 0. In addition, the variance of a first-differenced time-series is not only finite, but is also constant. The time-series then becomes covariance stationary.”<\/p><p>Webb continued by stating that if a time-series is a random walk, it is best to model the first-differenced series with an autoregressive model to predict future movements in the time-series. He also stated that the key to choosing the correct model was to analyze each model’s R<sup>2<\/sup>: the first-differenced AR model would generally have an R<sup>2<\/sup> greater than the R<sup>2<\/sup> of the original AR model for a random walk, since the first-differenced model better fits the data.<\/p><\/div><\/details><div class=\"qtext\"><p>Webb is most accurate with respect to:<\/p><\/div>", "subj": "quant"}, {"n": 2, "q": "Is Webb’s conclusion regarding the presence of a unit root in the inflation rate time-series most likely correct:", "opts": ["Yes.", "No, because the regression variables that he used and his computed t-statistic were incorrect.", "No, because his application of the regression-based unit root test was incorrect."], "ans": "C", "expl": "Webb's conclusion that the inflation rate time-series does not have a unit root is incorrect because his interpretation of the test results from the regression-based unit root test was flawed. In the context of unit root testing, particularly using the Dickey-Fuller test, the null hypothesis posits that the time series has a unit root, implying it is non-stationary. To reject this hypothesis, the test statistic calculated (t-statistic) must be more negative than the critical values provided by Dickey and Fuller. If the t-statistic is not sufficiently negative, the null hypothesis cannot be rejected, suggesting that the series likely has a unit root and is non-stationary. Webb's conclusion that the series did not have a unit root because he could not reject the null hypothesis at the 5% significance level indicates a misunderstanding. Not being able to reject the null hypothesis implies that there is not enough statistical evidence to conclude that the series is stationary; hence, it should be assumed to have a unit root. A is incorrect. Option A is not supported by the methodology of unit root testing. In these tests, failing to reject the null hypothesis (that the series has a unit root) at a conventional significance level (like 5%) means that there is insufficient evidence to conclude the series is stationary. Therefore, the correct interpretation should be that the series likely does have a unit root, contrary to Webb's conclusion. Thus, option A is incorrect because it incorrectly affirms Webb's flawed conclusion. B is incorrect. Option B states that Webb's conclusion is incorrect due to the use of wrong regression variables and an incorrectly computed t-statistic. While it is crucial to use appropriate variables and accurately compute the t-statistic in a regression-based unit root test, the information provided does not indicate any errors in the selection of variables or in the computation of the t-statistic. Webb's primary error was in the interpretation of the test results, not in the technical execution of the test. Therefore, while option B correctly identifies an issue with Webb's conclusion, it inaccurately attributes the error to factors that are not supported by the provided information. ", "explhtml": "<p>Webb&#x27;s conclusion that the inflation rate time-series does not have a unit root is incorrect because his interpretation of the test results from the regression-based unit root test was flawed. In the context of unit root testing, particularly using the Dickey-Fuller test, the null hypothesis posits that the time series has a unit root, implying it is non-stationary. To reject this hypothesis, the test statistic calculated (t-statistic) must be more negative than the critical values provided by Dickey and Fuller. If the t-statistic is not sufficiently negative, the null hypothesis cannot be rejected, suggesting that the series likely has a unit root and is non-stationary. Webb&#x27;s conclusion that the series did not have a unit root because he could not reject the null hypothesis at the 5% significance level indicates a misunderstanding. Not being able to reject the null hypothesis implies that there is not enough statistical evidence to conclude that the series is stationary; hence, it should be assumed to have a unit root.<\/p><p><b>A is incorrect<\/b>. Option A is not supported by the methodology of unit root testing. In these tests, failing to reject the null hypothesis (that the series has a unit root) at a conventional significance level (like 5%) means that there is insufficient evidence to conclude the series is stationary. Therefore, the correct interpretation should be that the series likely does have a unit root, contrary to Webb&#x27;s conclusion. Thus, option A is incorrect because it incorrectly affirms Webb&#x27;s flawed conclusion.<\/p><p><b>B is incorrect<\/b>. Option B states that Webb&#x27;s conclusion is incorrect due to the use of wrong regression variables and an incorrectly computed t-statistic. While it is crucial to use appropriate variables and accurately compute the t-statistic in a regression-based unit root test, the information provided does not indicate any errors in the selection of variables or in the computation of the t-statistic. Webb&#x27;s primary error was in the interpretation of the test results, not in the technical execution of the test. Therefore, while option B correctly identifies an issue with Webb&#x27;s conclusion, it inaccurately attributes the error to factors that are not supported by the provided information. <\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5 (j): describe implications of unit roots for time-series analysis, explain when unit roots are likely to occur and how to test for them, and demonstrate how a time series with a unit root can be transformed so it can be analyzed with an AR model Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(k): describe the steps of the unit root test for nonstationarity and explain the relation of the test to autoregressive time-series models<\/p> sup>2<\/sup> greater than the R<sup>2<\/sup> of the original AR model for a random walk, since the first-differenced model better fits the data.<\/p><\/div><\/details><div class=\"qtext\"><p>Is Webb’s conclusion regarding the presence of a unit root in the inflation rate time-series most likely correct:<\/p><\/div>", "subj": "quant"}, {"n": 3, "q": "Webb is most accurate with respect to:", "opts": ["Statement 1 only.", "Statement 2 only.", "Neither statement 1 nor statement 2."], "ans": "B", "expl": "Webb's accuracy in his statements about modeling random walks can be assessed by understanding the fundamental properties of random walks and the implications for statistical modeling. Statement 2 is correct because it accurately describes the process and benefits of first-differencing a random walk time series. When a time series is a random walk, it means that each value is a random step from the previous one, leading to non-stationarity due to the variance depending on time. By first-differencing the series, each value represents the change from the previous value, effectively eliminating the trend and stabilizing the variance. This transformation results in a series with a mean of zero and constant variance, making it stationary and suitable for further analysis with autoregressive models. The first-differenced series does not depend on time, allowing for consistent application of statistical methods and hypothesis testing. A is incorrect. Statement 1 is incorrect because it mischaracterizes the behavior of variance in a random walk. In a random walk, the variance indeed increases over time, but it does not have bounds—neither lower nor upper. The statement incorrectly suggests that there is no lower bound on the variance, which is misleading because the concept of bounds does not apply in this context. The variance of a random walk is theoretically infinite as time progresses, reflecting the cumulative nature of random fluctuations over time. This characteristic of increasing variance without bounds is precisely why standard regression techniques, which assume finite variance, are not suitable for analyzing random walks directly without transformations such as first-differencing. C is incorrect. Choosing option C would imply that both statements made by Webb are incorrect. However, as analyzed, Statement 2 is indeed correct in its description of how to handle a random walk for statistical analysis. The process of first-differencing a random walk addresses the non-stationarity issue by stabilizing the variance and centering the mean at zero, which contradicts the choice of option C. Therefore, this option is not the correct choice as it inaccurately dismisses the validity of Statement 2. ", "explhtml": "<p>Webb&#x27;s accuracy in his statements about modeling random walks can be assessed by understanding the fundamental properties of random walks and the implications for statistical modeling. Statement 2 is correct because it accurately describes the process and benefits of first-differencing a random walk time series. When a time series is a random walk, it means that each value is a random step from the previous one, leading to non-stationarity due to the variance depending on time. By first-differencing the series, each value represents the change from the previous value, effectively eliminating the trend and stabilizing the variance. This transformation results in a series with a mean of zero and constant variance, making it stationary and suitable for further analysis with autoregressive models. The first-differenced series does not depend on time, allowing for consistent application of statistical methods and hypothesis testing.<\/p><p><b>A is incorrect<\/b>. Statement 1 is incorrect because it mischaracterizes the behavior of variance in a random walk. In a random walk, the variance indeed increases over time, but it does not have bounds—neither lower nor upper. The statement incorrectly suggests that there is no lower bound on the variance, which is misleading because the concept of bounds does not apply in this context. The variance of a random walk is theoretically infinite as time progresses, reflecting the cumulative nature of random fluctuations over time. This characteristic of increasing variance without bounds is precisely why standard regression techniques, which assume finite variance, are not suitable for analyzing random walks directly without transformations such as first-differencing.<\/p><p><b>C is incorrect<\/b>. Choosing option C would imply that both statements made by Webb are incorrect. However, as analyzed, Statement 2 is indeed correct in its description of how to handle a random walk for statistical analysis. The process of first-differencing a random walk addresses the non-stationarity issue by stabilizing the variance and centering the mean at zero, which contradicts the choice of option C. Therefore, this option is not the correct choice as it inaccurately dismisses the validity of Statement 2. <\/p><p class=\"los\">Quantitative Methods, Learning Module 5: Time-Series Analysis, LOS 5(i): describe characteristics of random walk processes and contrast them to covariance stationary processes<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Brittany Ruiz<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Brittany Ruiz is the chief investment officer (CIO) at Black-Mount Capital Advisory Firm (BMCA), a leading U.S. based money management firm. Last year, BMCA launched the BMCA Equity Fund that invested in domestic and international markets stocks, including those of Russia, Brazil, Canada, and the U.K. During its annual performance review, Ruiz discovered that the fund earned a considerably less return than that of its benchmark. Concerned with the outcome, Ruiz called a meeting with the fund’s portfolio management team to discuss key issues related to the quantitative analysis of the fund’s investments. A leading quantitative expert, Anthony Webb, was invited to chair the meeting. While analyzing the regression models used by the PM team to predict stock returns, Webb requested the information provided in Exhibit 1. The information relates to a time-series model for annualized monthly returns to a Brazilian stock index.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0006.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit 1: Annualized Monthly Returns to a Brazilian Stock Index Lag Autocorrelation 1 0.1320 2 0.1856 3 -0.0098 4 0.0056 5 -0.0062\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0007.webp\" style=\"max-width:min(100%,315px)\" alt=\"Critical t-value 1.96 Number of observations 398\"><p>After his analysis, Webb presented the following conclusions to the portfolio management team:<\/p><p>Conclusion 1: “This time series can be best modeled using a moving average (2) model rather than an autoregressive model.”<\/p><p>Conclusion 2: “A moving average (2) model would be different from a simple moving average because the former would place different weights on the terms in the moving average. And unlike the MA(2), a simple moving average is based on observed time series values.”<\/p><p>Since 10% of the BMCA Equity Fund was invested in large-cap Russian stocks, Webb considered it crucial to study the characteristics of the Russian capital markets. While reviewing BMCA’s autoregressive (1) model used to predict the Russian inflation rate, Webb suspected that the model might have a unit root. To accurately test for the presence of a unit root in the time series, Webb decided to regress the first difference of the time series on the first lag of the time series. After obtaining the regression results, Webb calculated the t-statistic conventionally for the coefficient. He then used the critical t-values computed by Dickey and Fuller to determine significance. Since he could not reject the null hypothesis at the 5% significance level, Webb concluded that the series did not have a unit root and was stationary.<\/p><p>When talking to Ruiz about ‘random walks’ Webb stated that a time-series that was a random walk could not be analyzed using standard regression analysis. He made the following statements:<\/p><p>Statement 1: “There is no finite mean-reverting level for a random walk. In addition, the variance of the time-series increases or decreases as we go further into the future without any lower or upper bound. This violates the assumption of a finite variance for the time-series.”<\/p><p>Statement 2: “To model a random walk, we should first-difference it. This results in a mean-reverting level of 0. In addition, the variance of a first-differenced time-series is not only finite, but is also constant. The time-series then becomes covariance stationary.”<\/p><p>Webb continued by stating that if a time-series is a random walk, it is best to model the first-differenced series with an autoregressive model to predict future movements in the time-series. He also stated that the key to choosing the correct model was to analyze each model’s R<sup>2<\/sup>: the first-differenced AR model would generally have an R<sup>2<\/sup> greater than the R<sup>2<\/sup> of the original AR model for a random walk, since the first-differenced model better fits the data.<\/p><\/div><\/details><div class=\"qtext\"><p>Webb is most accurate with respect to:<\/p><\/div>", "subj": "quant"}, {"n": 4, "q": "With regards to his comments about random walks, Webb is most likely:", "opts": ["Correct.", "Incorrect about the criterion of choosing the correct model.", "Incorrect about the use of first-differenced AR models and about the criterion of choosing the correct model."], "ans": "C", "expl": "Webb's statement that a time-series which is a random walk should be modeled using a first-differenced autoregressive (AR) model to predict future movements, and that the correct model can be chosen by comparing the R2 values, is flawed. First, while first-differencing a random walk time-series does indeed transform it into a stationary series, this does not necessarily mean that an AR model is the best predictive model. The effectiveness of an AR model in forecasting depends on the specific characteristics and structure of the time-series data after differencing. Moreover, the use of R2 as a criterion for model selection in time-series analysis is limited. R2 measures the proportion of variance explained by the model in-sample, but it does not necessarily indicate the model's predictive accuracy out-of-sample. Therefore, relying solely on R2 to choose between models can be misleading, as it might favor more complex models without genuinely providing better predictive performance. A is incorrect. Webb's statements about the properties of random walks and the transformation achieved by first-differencing are essentially correct. A random walk is characterized by non-stationarity, with no tendency to return to a long-term mean and an unbounded variance over time. First-differencing a random walk results in a stationary series with a constant mean and variance, which are critical assumptions for many standard time-series models. Therefore, stating that Webb is entirely correct overlooks the nuances and inaccuracies in his approach to model selection and the limitations of using R2 for this purpose. B is incorrect. While Webb's comments about the use of first-differenced AR models are not entirely off-base, his suggestion that the correct model can be chosen based solely on the R2 values is incorrect. The choice of a model in time-series forecasting should consider several factors, including the model's ability to capture the dynamics of the data, its simplicity, its interpretability, and its predictive performance on new, unseen data. R2 alone does not provide a comprehensive measure of a model's suitability for forecasting, as it does not account for the potential overfitting of data or the model's performance outside the sample used for estimation. This makes option B incorrect as it does not fully capture the extent of Webb's inaccuracies. ", "explhtml": "<p>Webb&#x27;s statement that a time-series which is a random walk should be modeled using a first-differenced autoregressive (AR) model to predict future movements, and that the correct model can be chosen by comparing the R<sup>2<\/sup> values, is flawed. First, while first-differencing a random walk time-series does indeed transform it into a stationary series, this does not necessarily mean that an AR model is the best predictive model. The effectiveness of an AR model in forecasting depends on the specific characteristics and structure of the time-series data after differencing. Moreover, the use of R<sup>2<\/sup> as a criterion for model selection in time-series analysis is limited. R<sup>2<\/sup> measures the proportion of variance explained by the model in-sample, but it does not necessarily indicate the model&#x27;s predictive accuracy out-of-sample. Therefore, relying solely on R<sup>2<\/sup> to choose between models can be misleading, as it might favor more complex models without genuinely providing better predictive performance.<\/p><p><b>A is incorrect<\/b>. Webb&#x27;s statements about the properties of random walks and the transformation achieved by first-differencing are essentially correct. A random walk is characterized by non-stationarity, with no tendency to return to a long-term mean and an unbounded variance over time. First-differencing a random walk results in a stationary series with a constant mean and variance, which are critical assumptions for many standard time-series models. Therefore, stating that Webb is entirely correct overlooks the nuances and inaccuracies in his approach to model selection and the limitations of using R<sup>2<\/sup> for this purpose.<\/p><p><b>B is incorrect<\/b>. While Webb&#x27;s comments about the use of first-differenced AR models are not entirely off-base, his suggestion that the correct model can be chosen based solely on the R<sup>2<\/sup> values is incorrect. The choice of a model in time-series forecasting should consider several factors, including the model&#x27;s ability to capture the dynamics of the data, its simplicity, its interpretability, and its predictive performance on new, unseen data. R<sup>2<\/sup> alone does not provide a comprehensive measure of a model&#x27;s suitability for forecasting, as it does not account for the potential overfitting of data or the model&#x27;s performance outside the sample used for estimation. This makes option B incorrect as it does not fully capture the extent of Webb&#x27;s inaccuracies. <\/p><p class=\"los\">Quantitative Methods, Learning Module 5 Time-Series Analysis, LOS 5(i): describe characteristics of random walk processes and contrast them to covariance stationary processes<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Brittany Ruiz<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Brittany Ruiz is the chief investment officer (CIO) at Black-Mount Capital Advisory Firm (BMCA), a leading U.S. based money management firm. Last year, BMCA launched the BMCA Equity Fund that invested in domestic and international markets stocks, including those of Russia, Brazil, Canada, and the U.K. During its annual performance review, Ruiz discovered that the fund earned a considerably less return than that of its benchmark. Concerned with the outcome, Ruiz called a meeting with the fund’s portfolio management team to discuss key issues related to the quantitative analysis of the fund’s investments. A leading quantitative expert, Anthony Webb, was invited to chair the meeting. While analyzing the regression models used by the PM team to predict stock returns, Webb requested the information provided in Exhibit 1. The information relates to a time-series model for annualized monthly returns to a Brazilian stock index.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0006.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit 1: Annualized Monthly Returns to a Brazilian Stock Index Lag Autocorrelation 1 0.1320 2 0.1856 3 -0.0098 4 0.0056 5 -0.0062\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0007.webp\" style=\"max-width:min(100%,315px)\" alt=\"Critical t-value 1.96 Number of observations 398\"><p>After his analysis, Webb presented the following conclusions to the portfolio management team:<\/p><p>Conclusion 1: “This time series can be best modeled using a moving average (2) model rather than an autoregressive model.”<\/p><p>Conclusion 2: “A moving average (2) model would be different from a simple moving average because the former would place different weights on the terms in the moving average. And unlike the MA(2), a simple moving average is based on observed time series values.”<\/p><p>Since 10% of the BMCA Equity Fund was invested in large-cap Russian stocks, Webb considered it crucial to study the characteristics of the Russian capital markets. While reviewing BMCA’s autoregressive (1) model used to predict the Russian inflation rate, Webb suspected that the model might have a unit root. To accurately test for the presence of a unit root in the time series, Webb decided to regress the first difference of the time series on the first lag of the time series. After obtaining the regression results, Webb calculated the t-statistic conventionally for the coefficient. He then used the critical t-values computed by Dickey and Fuller to determine significance. Since he could not reject the null hypothesis at the 5% significance level, Webb concluded that the series did not have a unit root and was stationary.<\/p><p>When talking to Ruiz about ‘random walks’ Webb stated that a time-series that was a random walk could not be analyzed using standard regression analysis. He made the following statements:<\/p><p>Statement 1: “There is no finite mean-reverting level for a random walk. In addition, the variance of the time-series increases or decreases as we go further into the future without any lower or upper bound. This violates the assumption of a finite variance for the time-series.”<\/p><p>Statement 2: “To model a random walk, we should first-difference it. This results in a mean-reverting level of 0. In addition, the variance of a first-differenced time-series is not only finite, but is also constant. The time-series then becomes covariance stationary.”<\/p><p>Webb continued by stating that if a time-series is a random walk, it is best to model the first-differenced series with an autoregressive model to predict future movements in the time-series. He also stated that the key to choosing the correct model was to analyze each model’s R<sup>2<\/sup>: the first-differenced AR model would generally have an R<sup>2<\/sup> greater than the R<sup>2<\/sup> of the original AR model for a random walk, since the first-differenced model better fits the data.<\/p><\/div><\/details><div class=\"qtext\"><p>With regards to his comments about random walks, Webb is most likely:<\/p><\/div>", "subj": "quant"}, {"n": 5, "q": "Which of the following statements about the regression on Brazilian stocks return is most accurate :", "opts": ["The Brazilian stocks return is very closely related to the annual return on the Brazilian market index.", "The Brazilian stocks return is closely related to the annual percentage increase in GDP.", "The Brazilian stocks return is unrelated to both the annual return on the Brazilian market index and the annual percentage increase in GDP."], "ans": "A", "expl": "The regression analysis results show a strong and statistically significant relationship between the Brazilian stocks return and the annual return on the Brazilian market index. The coefficient for the annual return on the Brazilian market index is 2.245 with a standard error of 0.245. To determine the significance of this coefficient, we calculate the t-statistic as follows: With 57 degrees of freedom (60 observations minus 3 for the intercept and two predictors), the critical t-value at the 0.05 significance level is approximately 2.00. Since 9.163 is significantly greater than 2.00, we conclude that the coefficient is statistically significant, indicating a strong relationship between the market index return and the stocks return. B is incorrect. While the coefficient for the annual percentage increase in GDP is positive (0.667), its statistical significance is questionable. The t-statistic for this coefficient is calculated as follows: This value is slightly below the critical t-value of 2.00 at the 0.05 significance level, suggesting that the relationship between GDP growth and Brazilian stocks return is not statistically significant at conventional levels. Therefore, we cannot confidently assert that the stocks return is closely related to GDP growth based on this analysis. C is incorrect. Claiming that the Brazilian stocks return is unrelated to both the annual return on the Brazilian market index and the annual percentage increase in GDP is contradicted by the regression results. As discussed, the coefficient for the annual return on the Brazilian market index is highly significant, indicating a strong relationship. Although the GDP growth's coefficient is not statistically significant, the presence of a significant relationship with the market index return is enough to refute the claim that the stocks return is unrelated to both predictors. ", "explhtml": "<p>The regression analysis results show a strong and statistically significant relationship between the Brazilian stocks return and the annual return on the Brazilian market index. The coefficient for the annual return on the Brazilian market index is 2.245 with a standard error of 0.245. To determine the significance of this coefficient, we calculate the t-statistic as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0011.webp\" style=\"max-width:min(100%,121px)\" alt=\"2.245 = 9.163. 0.245\"><p>With 57 degrees of freedom (60 observations minus 3 for the intercept and two predictors), the critical t-value at the 0.05 significance level is approximately 2.00. Since 9.163 is significantly greater than 2.00, we conclude that the coefficient is statistically significant, indicating a strong relationship between the market index return and the stocks return.<\/p><p><b>B is incorrect<\/b>. While the coefficient for the annual percentage increase in GDP is positive (0.667), its statistical significance is questionable. The t-statistic for this coefficient is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0012.webp\" style=\"max-width:min(100%,121px)\" alt=\"0.667 = 1.979. 0.337\"><p>This value is slightly below the critical t-value of 2.00 at the 0.05 significance level, suggesting that the relationship between GDP growth and Brazilian stocks return is not statistically significant at conventional levels. Therefore, we cannot confidently assert that the stocks return is closely related to GDP growth based on this analysis.<\/p><p><b>C is incorrect<\/b>. Claiming that the Brazilian stocks return is unrelated to both the annual return on the Brazilian market index and the annual percentage increase in GDP is contradicted by the regression results. As discussed, the coefficient for the annual return on the Brazilian market index is highly significant, indicating a strong relationship. Although the GDP growth&#x27;s coefficient is not statistically significant, the presence of a significant relationship with the market index return is enough to refute the claim that the stocks return is unrelated to both predictors. <\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Evaluating Regression Model Fit and Interpreting Model Results, LOS 2(b): formulate hypotheses on the significance of two or more coefficients in a multiple regression model and interpret the results of the joint hypothesis tests.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Quality Investment Advisory<\/summary><div class=\"vig-body\"><p>Quality Investment Advisory (QIA) is a U.S. based asset management firm providing financial advice and portfolio management services to private and institutional clients. Rob Wallace works as the chief portfolio manager at QIA’s headquarters in Chicago, USA. Wallace is currently managing a $5 million portfolio of John Mackintosh - one of the firm’s oldest high net worth clients. The portfolio invests a significant portion in the stocks of emerging markets, like those of Russia and Brazil.To estimate the returns to Brazilian stock investments, Wallace used a regression model with the dependent variable measuring the Brazilian stock return and the independent variables measuring (I) the growth in the Brazilian GDP and (II) the return on a Brazilian market index. Exhibit 1 displays the results to estimating this regression.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0009.webp\" style=\"max-width:min(100%,558px)\" alt=\"Exhibit 1 Regression Analysis Results Coefficient Standard Error Intercept 0.0095 0.013 Annual % increase in GDP 0.667 0.337 Annual return to Brazilian market index 2.245 0.245\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0010.webp\" style=\"max-width:min(100%,400px)\" alt=\"ANOVA Regression Sum of Squares 0.9436 Residual Sum of Squares 0.3426 Observations 60\"><p>While talking to Mackintosh about the results of the regression, Wallace made the following comment:<\/p><p>“The interpretation of the slope coefficient of the annual percentage increase in GDP is that for every 1 unit increase in GDP, we would expect your return to increase by 0.667 units. The coefficient value of 0.667 will remain constant even if we remove the second independent variable.”<\/p><p>Mackintosh requested to know exactly how changes in market return would impact the return on his Brazilian investment. Wallace gave the following response:<\/p><p>“Let’s assume the change in market return over a year is 1%. If we compared the return on your investment at the beginning of the year with the return at the end of the year, we would expect an increase of 2.245%. However, to ensure that this holds, we would have to calculate the F-statistic using data from the regression, particularly the sum of squared residuals and the regression sum of squares.”<\/p><p>After he met with Mackintosh, Wallace met with Colin Edwards - a statistician at QIA’s headquarters - with whom he had been managing a multimillion dollar institutional fund. Edwards suggested using a multiple regression model to determine whether (I) an increase in the U.S. literacy rate and (II) an improvement in technology would affect the stocks’ P/E.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements about the regression on Brazilian stocks return is most accurate :<\/p><\/div>", "subj": "quant"}, {"n": 6, "q": "Using the information provided in Exhibits 1, the F-statistic is closest to:", "opts": ["2.754.", "78.49.", "79.87."], "ans": "B", "expl": "The F-statistic is calculated to assess the overall significance of a regression model. It is derived by dividing the mean square due to regression (MSR) by the mean square error (MSE). In this case, the regression sum of squares (SSR) is 0.9436 and the residual sum of squares (SSE) is 0.3426 with a total of 60 observations and 2 predictors. The formula for the F-statistic is: Where k is the number of predictors (2 in this case) and n is the total number of observations (60). Plugging in the values: A is incorrect. The value 2.754 does not correspond to the correct calculation of the F-statistic based on the given data. The correct F-statistic calculation, as shown above, results in 78.49. The value 2.754 might result from an incorrect application of the formula, perhaps by misplacing the values of SSR or SSE, or incorrect division of these sums by their respective degrees of freedom. It is essential to accurately apply the formula and use the correct values to ensure the validity of the statistical inference of the regression model. C is incorrect. The value 79.87 is close to the correct F-statistic but is not accurate. This discrepancy could arise from a minor miscalculation or rounding error in the final steps of computing the F-statistic. It is crucial to follow the mathematical calculations meticulously to avoid such errors, especially in statistical analysis, where precision is key to deriving valid conclusions. The correct F-statistic, as calculated, should be 78.49, not 79.87. ", "explhtml": "<p>The F-statistic is calculated to assess the overall significance of a regression model. It is derived by dividing the mean square due to regression (MSR) by the mean square error (MSE). In this case, the regression sum of squares (SSR) is 0.9436 and the residual sum of squares (SSE) is 0.3426 with a total of 60 observations and 2 predictors. The formula for the F-statistic is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0013.webp\" style=\"max-width:min(100%,217px)\" alt=\"SSR MSR k F-Statistic = MSE = SSE n−k−1\"><p>Where k is the number of predictors (2 in this case) and n is the total number of observations (60). Plugging in the values:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0014.webp\" style=\"max-width:min(100%,232px)\" alt=\"0.9436 MSR = = 0.4718 2 0.3426 MSE = = 0.00601 57 0.4718 F-Statistic = = 78.49 0.00601\"><p><b>A is incorrect<\/b>. The value 2.754 does not correspond to the correct calculation of the F-statistic based on the given data. The correct F-statistic calculation, as shown above, results in 78.49. The value 2.754 might result from an incorrect application of the formula, perhaps by misplacing the values of SSR or SSE, or incorrect division of these sums by their respective degrees of freedom. It is essential to accurately apply the formula and use the correct values to ensure the validity of the statistical inference of the regression model.<\/p><p><b>C is incorrect<\/b>. The value 79.87 is close to the correct F-statistic but is not accurate. This discrepancy could arise from a minor miscalculation or rounding error in the final steps of computing the F-statistic. It is crucial to follow the mathematical calculations meticulously to avoid such errors, especially in statistical analysis, where precision is key to deriving valid conclusions. The correct F-statistic, as calculated, should be 78.49, not 79.87. <\/p><p class=\"los\">Quantitative Methods, Learning Module 2: Evaluating Regression Model Fit and Interpreting Model Results, LOS 2(c) Calculate and interpret a predicted value for the dependent variable, given the estimated regression model and assumed values for the independent variable.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Quality Investment Advisory<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Quality Investment Advisory (QIA) is a U.S. based asset management firm providing financial advice and portfolio management services to private and institutional clients. Rob Wallace works as the chief portfolio manager at QIA’s headquarters in Chicago, USA. Wallace is currently managing a $5 million portfolio of John Mackintosh - one of the firm’s oldest high net worth clients. The portfolio invests a significant portion in the stocks of emerging markets, like those of Russia and Brazil.To estimate the returns to Brazilian stock investments, Wallace used a regression model with the dependent variable measuring the Brazilian stock return and the independent variables measuring (I) the growth in the Brazilian GDP and (II) the return on a Brazilian market index. Exhibit 1 displays the results to estimating this regression.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0009.webp\" style=\"max-width:min(100%,558px)\" alt=\"Exhibit 1 Regression Analysis Results Coefficient Standard Error Intercept 0.0095 0.013 Annual % increase in GDP 0.667 0.337 Annual return to Brazilian market index 2.245 0.245\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0010.webp\" style=\"max-width:min(100%,400px)\" alt=\"ANOVA Regression Sum of Squares 0.9436 Residual Sum of Squares 0.3426 Observations 60\"><p>While talking to Mackintosh about the results of the regression, Wallace made the following comment:<\/p><p>“The interpretation of the slope coefficient of the annual percentage increase in GDP is that for every 1 unit increase in GDP, we would expect your return to increase by 0.667 units. The coefficient value of 0.667 will remain constant even if we remove the second independent variable.”<\/p><p>Mackintosh requested to know exactly how changes in market return would impact the return on his Brazilian investment. Wallace gave the following response:<\/p><p>“Let’s assume the change in market return over a year is 1%. If we compared the return on your investment at the beginning of the year with the return at the end of the year, we would expect an increase of 2.245%. However, to ensure that this holds, we would have to calculate the F-statistic using data from the regression, particularly the sum of squared residuals and the regression sum of squares.”<\/p><p>After he met with Mackintosh, Wallace met with Colin Edwards - a statistician at QIA’s headquarters - with whom he had been managing a multimillion dollar institutional fund. Edwards suggested using a multiple regression model to determine whether (I) an increase in the U.S. literacy rate and (II) an improvement in technology would affect the stocks’ P/E.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information provided in Exhibits 1, the F-statistic is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 7, "q": "With respect to his comment, Wallace will most likely be correct only if the:", "opts": ["Second independent variable is uncorrelated with the annual % increase in GDP.", "Intercept and the second independent variable are uncorrelated with the annual % increase in GDP.", "Residuals of the regression represent the expected net effect on Brazilian stock returns of a 1 unit increase in annual GDP after removing that part of GDP that is correlated with the market index return."], "ans": "A", "expl": "Rob Wallace's statement that the coefficient value of 0.667 for the annual percentage increase in GDP will remain constant even if the second independent variable is removed is contingent on the lack of correlation between the two independent variables. In regression analysis, the stability of a coefficient when another variable is removed depends on the independence of the variables involved. If the second variable, which in this case is the annual return to the Brazilian market index, is uncorrelated with the GDP growth, removing it from the model will not affect the coefficient estimate for GDP growth. This is because the unique contribution of GDP growth to the model's explanation of Brazilian stock returns is isolated from the influence of the market index return. Therefore, Wallace's statement holds true under the condition that there is no multicollinearity between the GDP growth and the market index return. B is incorrect. It suggests that both the intercept and the second independent variable need to be uncorrelated with the annual percentage increase in GDP for the coefficient to remain constant. However, the intercept in a regression model does not typically correlate with the independent variables as it represents the expected value of the dependent variable when all independent variables are zero. The stability of the GDP growth coefficient is primarily concerned with the relationship between the two independent variables, not the intercept. Therefore, the correlation status of the intercept is irrelevant to the constancy of the GDP growth coefficient when the market index return is removed. C is incorrect. Option C describes a scenario where the residuals of the regression represent the net effect on Brazilian stock returns of a GDP increase, adjusted for any correlation with the market index return. This option misinterprets the nature of regression residuals, which actually represent the portion of the dependent variable not explained by the model rather than a direct effect of adjusting for correlated independent variables. Furthermore, the statement in option C does not directly address the issue of whether the GDP growth coefficient remains constant when the market index return is removed, which is the core of Wallace's statement. ", "explhtml": "<p>Rob Wallace&#x27;s statement that the coefficient value of 0.667 for the annual percentage increase in GDP will remain constant even if the second independent variable is removed is contingent on the lack of correlation between the two independent variables. In regression analysis, the stability of a coefficient when another variable is removed depends on the independence of the variables involved. If the second variable, which in this case is the annual return to the Brazilian market index, is uncorrelated with the GDP growth, removing it from the model will not affect the coefficient estimate for GDP growth. This is because the unique contribution of GDP growth to the model&#x27;s explanation of Brazilian stock returns is isolated from the influence of the market index return. Therefore, Wallace&#x27;s statement holds true under the condition that there is no multicollinearity between the GDP growth and the market index return.<\/p><p><b>B is incorrect<\/b>. It suggests that both the intercept and the second independent variable need to be uncorrelated with the annual percentage increase in GDP for the coefficient to remain constant. However, the intercept in a regression model does not typically correlate with the independent variables as it represents the expected value of the dependent variable when all independent variables are zero. The stability of the GDP growth coefficient is primarily concerned with the relationship between the two independent variables, not the intercept. Therefore, the correlation status of the intercept is irrelevant to the constancy of the GDP growth coefficient when the market index return is removed.<\/p><p><b>C is incorrect<\/b>. Option C describes a scenario where the residuals of the regression represent the net effect on Brazilian stock returns of a GDP increase, adjusted for any correlation with the market index return. This option misinterprets the nature of regression residuals, which actually represent the portion of the dependent variable not explained by the model rather than a direct effect of adjusting for correlated independent variables. Furthermore, the statement in option C does not directly address the issue of whether the GDP growth coefficient remains constant when the market index return is removed, which is the core of Wallace&#x27;s statement. <\/p><p class=\"los\">Quantitative Methods, Learning Module 1: Basics of Multiple Regression and Underlying Assumptions, LOS 1(b) Formulate a multiple linear regression model, describe the relation between the dependent variable and several independent variables and interpret estimated regression coefficients<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Quality Investment Advisory<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Quality Investment Advisory (QIA) is a U.S. based asset management firm providing financial advice and portfolio management services to private and institutional clients. Rob Wallace works as the chief portfolio manager at QIA’s headquarters in Chicago, USA. Wallace is currently managing a $5 million portfolio of John Mackintosh - one of the firm’s oldest high net worth clients. The portfolio invests a significant portion in the stocks of emerging markets, like those of Russia and Brazil.To estimate the returns to Brazilian stock investments, Wallace used a regression model with the dependent variable measuring the Brazilian stock return and the independent variables measuring (I) the growth in the Brazilian GDP and (II) the return on a Brazilian market index. Exhibit 1 displays the results to estimating this regression.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0009.webp\" style=\"max-width:min(100%,558px)\" alt=\"Exhibit 1 Regression Analysis Results Coefficient Standard Error Intercept 0.0095 0.013 Annual % increase in GDP 0.667 0.337 Annual return to Brazilian market index 2.245 0.245\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap01/f0010.webp\" style=\"max-width:min(100%,400px)\" alt=\"ANOVA Regression Sum of Squares 0.9436 Residual Sum of Squares 0.3426 Observations 60\"><p>While talking to Mackintosh about the results of the regression, Wallace made the following comment:<\/p><p>“The interpretation of the slope coefficient of the annual percentage increase in GDP is that for every 1 unit increase in GDP, we would expect your return to increase by 0.667 units. The coefficient value of 0.667 will remain constant even if we remove the second independent variable.”<\/p><p>Mackintosh requested to know exactly how changes in market return would impact the return on his Brazilian investment. Wallace gave the following response:<\/p><p>“Let’s assume the change in market return over a year is 1%. If we compared the return on your investment at the beginning of the year with the return at the end of the year, we would expect an increase of 2.245%. However, to ensure that this holds, we would have to calculate the F-statistic using data from the regression, particularly the sum of squared residuals and the regression sum of squares.”<\/p><p>After he met with Mackintosh, Wallace met with Colin Edwards - a statistician at QIA’s headquarters - with whom he had been managing a multimillion dollar institutional fund. Edwards suggested using a multiple regression model to determine whether (I) an increase in the U.S. literacy rate and (II) an improvement in technology would affect the stocks’ P/E.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to his comment, Wallace will most likely be correct only if the:<\/p><\/div>", "subj": "quant"}, {"n": 8, "q": "With respect to the effect of change in market return on the Brazilian investment return, Wallace is least accurate with respect to:", "opts": ["The comparison of returns only.", "Neither the comparison of returns nor the F-statistic.", "Both the comparison of returns and the F-statistic."], "ans": "C", "expl": "Wallace's explanation regarding the impact of a change in market return on the Brazilian investment return is inaccurate in both the aspects he discussed: the comparison of returns and the calculation of the F-statistic. Firstly, Wallace suggests that a 1% increase in the market return would lead to a 2.245% increase in the investment return. This statement oversimplifies the relationship because it assumes that other variables, particularly the GDP growth, remain constant. However, in a multiple regression model like the one used, the effect of one independent variable on the dependent variable is contingent on the values of other variables in the model. The coefficient of 2.245 for the market return is an estimate based on the specific data set and model used, including the presence of the GDP growth variable. If the GDP growth changes, it could significantly alter the impact of market return on the investment return. A is incorrect. Wallace's statement about the comparison of returns only being affected by the market return is misleading because it ignores the influence of other variables in the regression model, specifically the GDP growth. The return on investment is dependent on multiple factors, and any change in these factors can alter the outcome. Therefore, stating that a 1% change in market return directly results in a 2.245% increase in investment return without considering the potential variability in GDP growth or other factors oversimplifies the dynamics of the investment's return. B is incorrect. Wallace's reference to the F-statistic is also incorrect. He suggests using the F-statistic to verify if the change in market return significantly affects the investment return. However, the F-statistic in a multiple regression context is generally used to test the joint significance of all regression coefficients in the model, not just a single coefficient. To assess the impact of the market return independently, a t-test should be used to determine if the coefficient for the market return is significantly different from zero, assuming other factors are held constant. Wallace's suggestion of using the F-statistic for this purpose indicates a misunderstanding of the appropriate statistical tests used in regression analysis. ", "explhtml": "<p>Wallace&#x27;s explanation regarding the impact of a change in market return on the Brazilian investment return is inaccurate in both the aspects he discussed: the comparison of returns and the calculation of the F-statistic. Firstly, Wallace suggests that a 1% increase in the market return would lead to a 2.245% increase in the investment return. This statement oversimplifies the relationship because it assumes that other variables, particularly the GDP growth, remain constant. However, in a multiple regression model like the one used, the effect of one independent variable on the dependent variable is contingent on the values of other variables in the model. The coefficient of 2.245 for the market return is an estimate based on the specific data set and model used, including the presence of the GDP growth variable. If the GDP
