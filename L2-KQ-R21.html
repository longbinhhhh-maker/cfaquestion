<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 21 — Residual Income Valuation · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}

  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}

    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>

  .expl{padding:0!important;white-space:normal!important;overflow:hidden;

  .expl-shell{display:flex;flex-direction:column}

<style id="l2-css">

</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";

}

const DATA = [{"n": 1, "q": "Continuing residual income is defined as the:", "opts": ["residual income that is expected beyond the initial forecast time horizon.", "residual income that forces the net present value to zero.", "permanent as opposed to the transitory part of residual income."], "ans": "A", "expl": "Continuing residual income is defined as the residual income that is expected beyond the initial forecast time horizon. It comes into play when RI is forecast for a defined time horizon and a terminal value based on continuing RI is estimated at the end of that time frame.", "explhtml": "<p>Continuing residual income is defined as the residual income that is expected beyond the initial forecast time horizon. It comes into play when RI is forecast for a defined time horizon and a terminal value based on continuing RI is estimated at the end of that time frame.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.4, LOS 21.h<\/div><div class=\"qtext\"><p>Continuing residual income is defined as the:<\/p><\/div>", "subj": "equity"}, {"n": 2, "q": "Travel Advisors has earnings before interest and taxes (EBIT) of $200 million, interest expense of $83 million, taxes of $46.8 million, and total debt of $125 million. It is also financed with total equity of $850 million, which has a required rate of return of 12%. What is Travel Advisors' residual income?", "opts": ["A profit of $31.8 million.", "A profit of $70.2 million.", "A loss of $31.8 million."], "ans": "C", "expl": "Net income = 200,000,000 – 83,000,000 – 46,800,000 = $70,200,000. The equity capital charge is 850,000,000 × 0.12 = $102,000,000. Thus, residual income = 70,200,000 – 102,000,000 = – $31,800,000.", "explhtml": "<p>Net income = 200,000,000 – 83,000,000 – 46,800,000 = $70,200,000. The equity capital charge is 850,000,000 × 0.12 = $102,000,000. Thus, residual income = 70,200,000 – 102,000,000 = – $31,800,000.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Travel Advisors has earnings before interest and taxes (EBIT) of $200 million, interest expense of $83 million, taxes of $46.8 million, and total debt of $125 million. It is also financed with total equity of $850 million, which has a required rate of return of 12%. What is Travel Advisors&#x27; residual income?<\/p><\/div>", "subj": "equity"}, {"n": 3, "q": "SmallCo has the following characteristics: Long-term debt = $55 million Equity = $45 million WACC = 11% EBIT = $10 million Marginal tax rate = 30% SmallCo's economic value added is closest to:", "opts": ["-$1 million.", "+$1 million.", "-$4 million."], "ans": "C", "expl": "Economic value added (EVA) measures the value added for shareholders by management during a given year. A company must produce EVA in order to increase its market value. EVA is calculated as: EBIT(1 − t) − $WACC 10(1 − 0.30) − 0.11(55 + 45) 7 − 11 -4", "explhtml": "<p>Economic value added (EVA) measures the value added for shareholders by management during a given year. A company must produce EVA in order to increase its market value. EVA is calculated as:<\/p><p>EBIT(1 − t) − $WACC<\/p><p>10(1 − 0.30) − 0.11(55 + 45)<\/p><p>7 − 11<\/p><p>-4<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>SmallCo has the following characteristics:<\/p><p>Long-term debt = $55 million Equity = $45 million WACC = 11% EBIT = $10 million Marginal tax rate = 30%<\/p><p>SmallCo&#x27;s economic value added is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 4, "q": "Calculate the total value of the common stock in Busicomb Inc. at 31 December 20x5 using the constant growth residual income valuation model. Work to the nearest $m.", "opts": ["$836m.", "$579m.", "$708m."], "ans": "B", "expl": "Equity value using the residual income model: (ROE−r) MV₀ = B₀ + [B₀ ×  ] (r−g) MV₀ = 707.5 + [707.5 ×  ] 0.12−0.13 0.13−0.075 MV₀ = 578.86m Note that residual income is negative due to the negative ROE – r spread. This therefore gives us a value lower than current book value of equity. It is important to note that residual income models were developed to appraise management and not to specifically value equity. In this case, we can see that the management of Busicomb are not earning returns sufficient to satisfy the equity investors required returns. This would lead us to question the current business strategy and the effectiveness of management. It should also be noted that asset based valuation (i.e., the value of net assets adjusted to fair market value) will often act as a minimum valuation on the company. The fair value of net assets could be realized by liquidating the company.", "explhtml": "<p>Equity value using the residual income model:<\/p><p>(ROE−r) MV<sub>0<\/sub> = B<sub>0<\/sub> + [B<sub>0<\/sub> × &nbsp; ]<\/p><p>(r−g) MV<sub>0<\/sub> = 707.5 + [707.5 × &nbsp; ]<\/p><p>0.12−0.13 0.13−0.075<\/p><p>MV<sub>0<\/sub> = 578.86m<\/p><p>Note that residual income is negative due to the negative ROE – r spread. This therefore gives us a value lower than current book value of equity. It is important to note that residual income models were developed to appraise management and not to specifically value equity. In this case, we can see that the management of Busicomb are not earning returns sufficient to satisfy the equity investors required returns. This would lead us to question the current business strategy and the effectiveness of management.<\/p><p>It should also be noted that asset based valuation (i.e., the value of net assets adjusted to fair market value) will often act as a minimum valuation on the company. The fair value of net assets could be realized by liquidating the company.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 4–9<\/summary><div class=\"vig-body\"><p>Jon Binkster, CFA, has decided to determine the value of the equity in Busicomb Inc. using the residual income method, Binkster has obtained financial statements for the year ended December 20x5. These financial statements are included in Exhibits 1-3 below.<\/p><p>Exhibit 1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v001.webp\" style=\"max-width:min(100%,405px)\" alt=\"Busicomb Inc. Annual Income Statement For the Year Ended December 31, 20x5 (in $ millions) 721.9 Sales (417.0) Operating expenses 304.9 Operating profit 9.6 Gain on sale of fixed assets Depreciation (170.8) Earnings before interest and tax 143.7 Interest expense (40.3) Pre-tax income 103.4 Income taxes (31.0) Net income 72.4\"><p>Exhibit 2<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v002.webp\" style=\"max-width:min(100%,382px)\" alt=\"Busicomb Inc. Balance Sheet As of December 31 (in $ millions) 20x5 20x4\"><p>Current Asset<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v003.webp\" style=\"max-width:min(100%,366px)\" alt=\"31.2 Cash and equivalents 14.0 72.0 Accounts receivable 64.8 501.7 453.7 Inventories Total current assets 604.9 532.5\"><p>Non-Current Assets<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v004.webp\" style=\"max-width:min(100%,368px)\" alt=\"Property, plant, and equipment 1138.7 982.7 Less: Accumulated depreciation (370.0) (216.0)\"><p>Net property, plant, and equipment 768.7 766.7<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v005.webp\" style=\"max-width:min(100%,370px)\" alt=\"Total assets 1373.6 1299.2\"><p>Current Liabilities<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v006.webp\" style=\"max-width:min(100%,360px)\" alt=\"Accounts payable 60.1 62.5\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v007.webp\" style=\"max-width:min(100%,362px)\" alt=\"Notes payable 30.0 20.0 82.5 90.1 Total current liabilities\"><p>Non-Current Liabilities<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v008.webp\" style=\"max-width:min(100%,367px)\" alt=\"Long term debt 576.0 588.0 Total liabilities 666.1 670.5\"><p>Shareholders' Equity<  7.5%.<\/p><p>Binkster is concerned about the rate of growth he has assumed for the model and is aware that the residual income model can be used to calculate the implied rate of growth. He has compiled the following data for Entrebus Inc., a competitor, and wants to use this to calculate the implied rate of growth for Entrebus Inc.:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v016.webp\" style=\"max-width:min(100%,252px)\" alt=\"2.50 The price to book ratio ROE 13%\"><p>Current book value per share $8.00<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v017.webp\" style=\"max-width:min(100%,252px)\" alt=\"11% Cost of equity\"><p>Despite the issues encountered with post levered residual income Binkster is convinced that value based management approaches will prove beneficial in the analysis of Busicomb. His attention alights on another method referred to as Economic Value Added (EVA). Binkster makes the following estimates for Busicomb Inc. for 20x6:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v018.webp\" style=\"max-width:min(100%,162px)\" alt=\"EBIT $150m\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v019.webp\" style=\"max-width:min(100%,145px)\" alt=\"30 Tax rate\"><p>Cost of equity 12% Cost of debt 7% The target debt to equity ratio for next year will be 1. The invested capital is to be calculated as long-term debt plus stockholders' equity (using the information from the Exhibits 1-3). Jon Binkster and a colleague, Bob Slacker, were discussing the merits of the residual income approach. Bob commented that the unrealized gains or losses relating to available for sale securities are reported in comprehensive income and not the income statement and that this results in earnings being an inaccurate measure of returns to investors. Bob states that the book value of equity is not affected.<\/p><p>Binkster commented that including the gains or losses from one-off asset sales in income would distort the estimation of future residual earnings and therefore these gains and losses should be excluded. However, there is no need to adjust the book value of equity.<\/p><\/div><\/details><div class=\"pp-topic\">Module 21.3, LOS 21.f<\/div><div class=\"qtext\"><p>Calculate the total value of the common stock in Busicomb Inc. at 31 December 20x5 using the constant growth residual income valuation model. Work to the nearest $m.<\/p><\/div>", "subj": "equity"}, {"n": 5, "q": "Jon is comparing the different equity valuation models. He believes that the residual income model offers some advantages to the analyst over the other models. Which of the following is an advantage of the residual income model?", "opts": ["It does not require the clean surplus relationship to hold.", "The intrinsic value is not dominated by the terminal value.", "No adjustments to the financial data is required."], "ans": "B", "expl": "The fact that the terminal value does not dominate the intrinsic value is a major advantage of the RI model.", "explhtml": "<p>The fact that the terminal value does not dominate the intrinsic value is a major advantage of the RI model.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 4–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Binkster, CFA, has decided to determine the value of the equity in Busicomb Inc. using the residual income method, Binkster has obtained financial statements for the year ended December 20x5. These financial statements are included in Exhibits 1-3 below.<\/p><p>Exhibit 1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v001.webp\" style=\"max-width:min(100%,405px)\" alt=\"Busicomb Inc. Annual Income Statement For the Year Ended December 31, 20x5 (in $ millions) 721.9 Sales (417.0) Operating expenses 304.9 Operating profit 9.6 Gain on sale of fixed assets Depreciation (170.8) Earnings before interest and tax 143.7 Interest expense (40.3) Pre-tax in e requirements of the providers of finance. Negative residual income means that the model will not yield meaningful results from a valuation perspective. This does not prevent the model being a useful tool for managerial appraisal.", "explhtml": "<p>EVA = NOPAT – (invested capital × WACC)<\/p><p>NOPAT = EBIT(1 – T)<\/p><div class=\"tbl\"><table><tr><td>100<\/td><td>100<\/td><\/tr><tr><td>WACC = (12% ×<\/td><td>) + (7% (1 −0.3) ×<\/td><td>) = 8.45%<\/td><\/tr><tr><td>200<\/td><td>200<\/td><\/tr><\/table><\/div><p>EVA = 150 × (1 – 0.3) – [(707.5 + 576) × 0.0845] = –3.46<\/p><p>Note that EVA (Economic Value Added) is a pre-levered version of residual income.<\/p><p>A negative result means that returns are not sufficient to meet the requirements of the providers of finance. Negative residual income means that the model will not yield meaningful results from a valuation perspective. This does not prevent the model being a useful tool for managerial appraisal.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 4–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Binkster, CFA, has decided to determine the value of the equity in Busicomb Inc. using the residual income method, Binkster has obtained financial statements for the year ended December 20x5. These financial statements are included in Exhibits 1-3 below.<\/p><p>Exhibit 1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v001.webp\" style=\"max-width:min(100%,405px)\" alt=\"Busicomb Inc. Annual Income Statement For the Year Ended December 31, 20x5 (in $ millions) 721.9 Sales (417.0) Operating expenses 304.9 Operating profit 9.6 Gain on sale of fixed assets Depreciation (170.8) Earnings before interest and tax 143.7 Interest expense (40.3) Pre-tax income 103.4 Income taxes (31.0) Net income 72.4\"><p>Exhibit 2<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v002.webp\" style=\"max-width:min(100%,382px)\  in Working Capital<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v012.webp\" style=\"max-width:min(100%,432px)\" alt=\"(Increase) Decrease in accounts receivable (7.2) (Increase) Decrease in inventories (48.0) (2.4) Increase (Decrease) in accounts payable Net change in working capital (57.6) Net cash from operating activities 176.0\"><p>Cash Flow from Investing Activities<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v013.webp\" style=\"max-width:min(100%,434px)\" alt=\"Purchase of property, plant, and equipment (183.2) Proceeds on disposal of plant and equipment 20.0 Net cash from investing activities (163.2) 12.8\"><p>Cash Flow from Financing Activities<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v014.webp\" style=\"max-width:min(100%,370px)\" alt=\"(2.0) Change in debt outstanding 24.0 Change in common stock\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v015.webp\" style=\"max-width:min(100%,664px)\" alt=\"(17.6) Payment of cash dividend 4.4 Net cash from financing activities 17.2 Net change in cash and cash equivalents 14.0 Cash at beginning of period 31.2 Cash at end of period\"><p>You can assume for the following question that the ROE of Busicomb Inc. is 12% and the cost of equity is 13% and the long-term sustainable rate of growth is 7.5%.<\/p><p>Binkster is concerned about the rate of growth he has assumed for the model and is aware that the residual income model can be used to calculate the implied rate of growth. He has compiled the following data for Entrebus Inc., a competitor, and wants to use this to calculate the implied rate of growth for Entrebus Inc.:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v016.webp\" style=\"max-width:min(100%,252px)\" alt=\"2.50 The price to book ratio ROE 13%\"><p>Current book value per share $8.00<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v017.webp\" style=\"max-width:min(100%,252px)\" alt=\"11% Cost of equity\"><p>Despite the issues encountered with post levered residual income Binkster is convinced that value based management approaches will prove beneficial in the analysis of Busicomb. His attention alights on another method referred to as Economic Value Added (EVA). Binkster makes the following estimates for Busicomb Inc. for 20x6:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v018.webp\" style=\"max-width:min(100%,162px)\" alt=\"EBIT $150m\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v019.webp\" style=\"max-width:min(100%,145px)\" alt=\"30 Tax rate\"><p>Cost of equity 12% Cost of debt 7% The target debt to equity ratio for next year will be 1. The invested capital is to be calculated as long-term debt plus stockholders' equity (using the information from the Exhibits 1-3). Jon Binkster and a colleague, Bob Slacker, were discussing the merits of the residual income approach. Bob commented that the unrealized gains or losses relating to available for sale securities are reported in comprehensive income and not the income statement and that this results in earnings being an inaccurate measure of returns to investors. Bob states that the book value of equity is not affected.<\/p><p>Binkster commented that including the gains or losses from one-off asset sales in income would distort the estimation of future residual earnings and therefore these gains and losses should be excluded. However, there is no need to adjust the book value of equity.<\/p><\/div><\/details><div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>What is the best estimate of the EVA for Busicomb for 20x6?<\/p><\/div>", "subj": "equity"}, {"n": 8, "q": "Bob's comment is best described as:", "opts": ["correct.", "incorrect as unrealized gains or losses are reported in the income statement.", "incorrect as both the net income and book value of equity are incorrect stated."], "ans": "A", "expl": "The unrealized gains or losses relating to fair value through other comprehensive income securities (FVOCI) are reported in comprehensive income and not the income statement. The book value of equity (Net Assets) does include the FVOCI securities. The problem is therefore that our measure of investor return (if net income is used) will not be matched with our balance sheet measure of equity. We are missing these returns in our computation of ROE. Items, which bypass the income statement, being taken directly to comprehensive income (within stockholders equity), are referred to as dirty surplus items. In the presence of dirty surplus items (unlikely to reverse in the near future) the forecast of ROE should be amended, replacing earnings with comprehensive income. Comprehensive income = net income + OCI.", "explhtml": "<p>The unrealized gains or losses relating to fair value through other comprehensive income securities (FVOCI) are reported in comprehensive income and not the income statement. The book value of equity (Net Assets) does include the FVOCI securities. The problem is therefore that our measure of investor return (if net income is used) will not be matched with our balance sheet measure of equity. We are missing these returns in our computation of ROE. Items, which bypass the income statement, being taken directly to comprehensive income (within stockholders equity), are referred to as dirty surplus items. In the presence of dirty surplus items (unlikely to reverse in the near future) the forecast of ROE should be amended, replacing earnings with comprehensive income. Comprehensive income = net income + OCI.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 4–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Binkster, CFA, has decided to determine the value of the equity in Busicomb Inc. using the residual income method, Binkster has obtained financial statements for the year ended December 20x5. These financial statements are included in Exhibi its free cash flow is often negative. The company pays no dividends. Glitter and Gold, a maker of girls' clothing, has a fairly steady stream of earnings and cash flows but takes a lot of charges against equity. Is the residual income model suitable for valuing the two companies? Happy Cow Glitter and Gold Dairies", "opts": ["Yes No", "No No", "No Yes"], "ans": "A", "expl": "Residual income models work for companies with no dividends and volatile or negative cash flows. They do not work, however, when the clean surplus relation does not hold, as is the case when companies take charges against equity.", "explhtml": "<p>Residual income models work for companies with no dividends and volatile or negative cash flows. They do not work, however, when the clean surplus relation does not hold, as is the case when companies take charges against equity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.j<\/div><div class=\"qtext\"><p>Analyst Brett Melton, CFA, is looking at two companies. Happy Cow Dairies has volatile cash flows, and its free cash flow is often negative. The company pays no dividends. Glitter and Gold, a maker of girls&#x27; clothing, has a fairly steady stream of earnings and cash flows but takes a lot of charges against equity. Is the residual income model suitable for valuing the two companies?<\/p><p>Happy Cow<\/p><p>Glitter and Gold<\/p><p>Dairies<\/p><\/div>", "subj": "equity"}, {"n": 11, "q": "Cognitive Products (CP) designs decision-making software. The book value of its assets is $3.2 billion, which is financed with $2.0 billion in equity and $1.2 billion in debt. Its before-tax cost of debt is 6.5%, while its relevant tax rate is 34%. CP has a cost of equity of 12.46%. Its abbreviated income statement is: Earnings before interest and taxes\n(EBIT) $213,000,000 Interest expense (30,000,000) Pretax income 183,000,000 Income tax expense (62,220,000) Net income $120,780,000 The residual income (RI) for CP is closest to:", "opts": ["– $128,420,000.", "– $128,369,000.", "– $128,471,000."], "ans": "A", "expl": "The dollar-based equity charge is: equity charge = equity capital × cost of equity = $2.0 billion × 0.1246 = $249,200,000. RI is calculated as: Net Income $120,780,000 (Less) Equity\ncharge (249,200,000) RI −$128,420,000", "explhtml": "<p>The dollar-based equity charge is:<\/p><p>equity charge = equity capital × cost of equity = $2.0 billion × 0.1246 = $249,200,000.<\/p><p>RI is calculated as:<\/p><div class=\"tbl\"><table><tr><td>Net Income<\/td><td>$120,780,000<\/td><\/tr><tr><td>(Less) Equity<br>charge<\/td><td>(249,200,000)<\/td><\/tr><tr><td>RI<\/td><td>−$128,420,000<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Cognitive Products (CP) designs decision-making software. The book value of its assets is $3.2 billion, which is financed with $2.0 billion in equity and $1.2 billion in debt. Its before-tax cost of debt is 6.5%, while its relevant tax rate is 34%. CP has a cost of equity of 12.46%. Its abbreviated income statement is:<\/p><div class=\"tbl\"><table><tr><td>Earnings before interest and taxes<br>(EBIT)<\/td><td>$213,000,000<\/td><\/tr><tr><td>Interest expense<\/td><td>(30,000,000)<\/td><\/tr><tr><td>Pretax income<\/td><td>183,000,000<\/td><\/tr><tr><td>Income tax expense<\/td><td>(62,220,000)<\/td><\/tr><tr><td>Net income<\/td><td>$120,780,000<\/td><\/tr><\/table><\/div><p>The residual income (RI) for CP is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 12, "q": "Krieger String & Twine expects to generate a return on equity (ROE) of 13.6% in each of the next five years. The required ROE is 8.7%. Current book value is $12.40 per share and the firm pays no dividends. Krieger previously assumed residual income falls to zero immediately after five years, but has now decided to recalculate its estimated value using a persistence factor of 35%. The difference between the new valuation and the old one is closest to:", "opts": ["$0.32 per share.", "$0.64 per share.", "$0.16 per share."], "ans": "A", "expl": "To answer this question, we need to establish the residual values using the following equations: Earnings = prior year book value × ROE Equity charge = prior year book value × required ROE Residual income = earnings − equity charge Here is a table containing the relevant values. Year Earnings (ROE\n= 13.60%) Book Value Equity Charge\n(Required ROE =\n8.70%) Residual\nIncome PV of Residual\nIncome 0  $12.40    1 $1.69 $14.09 $1.08 $0.61 $0.56 2 $1.92 $16.00 $1.23 $0.69 $0.58 3 $2.18 $18.18 $1.39 $0.78 $0.61 4 $2.47 $20.65 $1.58 $0.89 $0.64 5 $2.81 $23.46 $1.80 $1.01 $0.67 Company value = $12.40 + the sum of the residual incomes Assuming residual value drops to zero after year five, the company is valued at $15.46 per share. Now, we modify the model to reflect the persistence factor of 35%. The only value that persistence factor effects is the terminal value. Instead of discounting the Year 5 residual income by 1 + required ROE, we discount it by 1 + required ROE − persistence factor. The new values are as follows:  Book Value Year 1 Year 2 Year 3 Year 4 Value $12.40 $0.56 $0.58 $0.61 $1.62 Year 4 CF = Residual income in year 4 + PV Continuing residual income = 0.89 + 1.37 = 2.26 PV of continuing residual income (T=4) = RI(year 5)/1+r-w = 1.01/(1+0.087-0.35) = 1.37 PV(T=0) of 2.26(T=4)=1.62 For a total value of $15.78 per share, or $0.32 higher than the original value.", "explhtml": "<p>To answer this question, we need to establish the residual values using the following equations:<\/p><p>Earnings = prior year book value × ROE<\/p><p>Equity charge = prior year book value × required ROE<\/p><p>Residual income = earnings − equity charge<\/p><p>Here is a table containing the relevant values.<\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>Earnings (ROE<br>= 13.60%)<\/td><td>Book Value<\/td><td>Equity Charge<br>(Required ROE =<br>8.70%)<\/td><td>Residual<br>Income<\/td><td>PV of Residual<br>Income<\/td><\/tr><tr><td>0<\/td><td><\/td><td>$12.40<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>1<\/td><td>$1.69<\/td><td>$14.09<\/td><td>$1.08<\/td><td>$0.61<\/td><td>$0.56<\/td><\/tr><tr><td>2<\/td><td>$1.92<\/td><td>$16.00<\/td><td>$1.23<\/td><td>$0.69<\/td><td>$0.58<\/td><\/tr><tr><td>3<\/td><td>$2.18<\/td><td>$18.18<\/td><td>$1.39<\/td><td>$0.78<\/td><td>$0.61<\/td><\/tr><tr><td>4<\/td><td>$2.47<\/td><td>$20.65<\/td><td>$1.58<\/td><td>$0.89<\/td><td>$0.64<\/td><\/tr><tr><td>5<\/td><td>$2.81<\/td><td>$23.46<\/td><td>$1.80<\/td><td>$1.01<\/td><td>$0.67<\/td><\/tr><\/table><\/div><p>Company value = $12.40 + the sum of the residual incomes<\/p><p>Assuming residual value drops to zero after year five, the company is valued at $15.46 per share.<\/p><p>Now, we modify the model to reflect the persistence factor of 35%. The only value that persistence factor effects is the terminal value. Instead of discounting the Year 5 residual income by 1 + required ROE, we discount it by 1 + required ROE − persistence factor. The new values are as follows:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Book Value<\/td><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><\/tr><tr><td>Value<\/td><td>$12.40<\/td><td>$0.56<\/td><td>$0.58<\/td><td>$0.61<\/td><td>$1.62<\/td><\/tr><\/table><\/div><p>Year 4 CF = Residual income in year 4 + PV Continuing residual income = 0.89 + 1.37 = 2.26<\/p><p>PV of continuing residual income (T=4) = RI(year 5)/1+r-w = 1.01/(1+0.087-0.35) = 1.37<\/p><p>PV(T=0) of 2.26(T=4)=1.62<\/p><p>For a total value of $15.78 per share, or $0.32 higher than the original value.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.2, LOS 21.c<\/div><div class=\"qtext\"><p>Krieger String &amp; Twine expects to generate a return on equity (ROE) of 13.6% in each of the next five years. The required ROE is 8.7%. Current book value is $12.40 per share and the firm pays no dividends. Krieger previously assumed residual income falls to zero immediately after five years, but has now decided to recalculate its estimated value using a persistence factor of 35%. The difference between the new valuation and the old one is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 13, "q": "In general, firms making aggressive accounting decisions will report future earnings that are:", "opts": ["lower.", "higher.", "inflation-adjusted."], "ans": "A", "expl": "In general, firms making aggressive (conservative) accounting decisions will report higher (lower) book values and lower (higher) future earnings. Firms may adopt aggressive accounting practices that overstate the value of earnings by, for example, accelerating revenues to the current period or deferring expenses to a later period. Current earnings will be higher, but future earnings will be lower.", "explhtml": "<p>In general, firms making aggressive (conservative) accounting decisions will report higher (lower) book values and lower (higher) future earnings.<\/p><p>Firms may adopt aggressive accounting practices that overstate the value of earnings by, for example, accelerating revenues to the current period or deferring expenses to a later period. Current earnings will be higher, but future earnings will be lower.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.k<\/div><div class=\"qtext\"><p>In general, firms making aggressive accounting decisions will report future earnings that are:<\/p><\/div>", "subj": "equity"}, {"n": 14, "q": "Reported accounting data are most likely to bias an estimate of residual income when:", "opts": ["standards allow charges directly to stockholders' equity while bypassing the income statement.", "the clean surplus relation holds.", "standards allow charges directly to stockholders' equity that are also reflected on the income statement."], "ans": "A", "expl": "Bias is likely when standards allow charges directly to stockholders' equity while bypassing the income statement. Both remaining responses are consistent with the use of data that will not introduce a bias.", "explhtml": "<p>Bias is likely when standards allow charges directly to stockholders&#x27; equity while bypassing the income statement. Both remaining responses are consistent with the use of data that will not introduce a bias.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.k<\/div><div class=\"qtext\"><p>Reported accounting data are most likely to bias an estimate of residual income when:<\/p><\/div>", "subj": "equity"}, {"n": 15, "q": "If a multistage residual income model incorporates a persistence factor of zero, the analyst is most likely assuming that residual income will:", "opts": ["persist at the current level forever.", "fall to zero immediately.", "decline to zero over time."], "ans": "B", "expl": "A persistence factor of zero is used when residual income is expected to drop immediately to zero. A persistence factor of one is used when residual income is expected to persist at the current level forever. A persistence factor between zero and one is used when residual income is expected to decline over time.", "explhtml": "<p>A persistence factor of zero is used when residual income is expected to drop immediately to zero. A persistence factor of one is used when residual income is expected to persist at the current level forever. A persistence factor between zero and one is used when residual income is expected to decline over time.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.4, LOS 21.h<\/div><div class=\"qtext\"><p>If a multistage residual income model incorporates a persistence factor of zero, the analyst is most likely assuming that residual income will:<\/p><\/div>", "subj": "equity"}, {"n": 16, "q": "Midland Semiconductor has a book value of $10.50 per share. The company's return on equity is 20%, and its required return on equity is 17%. The dividend payout ratio is 30%. What is the value of the shares using a single-stage residual income model?", "opts": ["$10.50.", "$31.50.", "$21. on<\/p><p>EPS = After tax earnings/shares outstanding = $5.59 million / 8 million = $0.70<\/p><p>Retention ratio = (0.70 − 0.35) / 0.70 = 0.50 or 50%<\/p><p>Beginning Equity = Assets − liabilities = $53.2 million − $27.8 million = $25.4 million<\/p><p>Book value per share<sub>0<\/sub> = Total equity/shares outstanding = $25.4 million / 8 million = $3.18<\/p><p>ROE = $0.70 / $3.18 = 0.22 or 22%<\/p><p>g = retention ratio × ROE = (0.50) × 0.22 = 0.11 or 11.00%<\/p><p>Expected return = 0.045 + [0.125 − 0.045]1.2 = 0.1410 or 14.10%<\/p><p>0.22 - 0.141 V<sub>0<\/sub> = $3.18 +  ( &nbsp;  × $3.18)  = $11.28<\/p><p>0.141 - 0.11<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.3, LOS 21.f<\/div><div class=\"qtext\"><p>Big Sky Ranches reported the following for the end of its fiscal year:<\/p><p>Revenues = $40.8 million. Pretax income = $8.6 million. (beginning-of-the year) Assets = $53.2 million. (beginning-of-the year) Liabilities = $27.8 million. Dividends per share = $0.35. Shares outstanding = 8 million. Tax rate = 35%.<\/p><p>The beta for Big Sky Ranches is 1.2, the current risk-free rate is 4.5%, and the expected return on the market is 12.5%. What is the value of the shares using a single-stage residual income model?<\/p><\/div>", "subj": "equity"}, {"n": 18, "q": "Professor Cliff Webley made the following statements in his asset-valuation class: \"Residual income approaches generally model ROE as approaching zero over Statement 1: time.\" \"If actual return on equity equals required return on equity, the residual Statement 2:  income model sets the company's proper market value equal to its book value.\" \"Using consistent assumptions, the single-stage residual income model Statement 3:  should give you the same valuation as the Gordon Growth Dividend-discount model.\" Which of Webley's statements is least accurate?", "opts": ["Statement 3.", "Statement 2.", "Statement 1."], "ans": "C", "expl": "In a competitive market, ROE has been found to decline over time -- not to zero but to the cost of equity. Thus, residual income approaches often model ROE fading toward the cost of equity. As ROE approaches the cost of equity, residual income approaches zero. The other two statements are accurate.", "explhtml": "<p>In a competitive market, ROE has been found to decline over time -- not to zero but to the cost of equity. Thus, residual income approaches often model ROE fading toward the cost of equity. As ROE approaches the cost of equity, residual income approaches zero. The other two statements are accurate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.2, LOS 21.d<\/div><div class=\"qtext\"><p>Professor Cliff Webley made the following statements in his asset-valuation class:<\/p><p>&quot;Residual income approaches generally model ROE as approaching zero over<\/p><p>Statement 1:<\/p><p>time.&quot;<\/p><p>&quot;If actual return on equity equals required return on equity, the residual Statement 2: &nbsp; income model sets the company&#x27;s proper market value equal to its book<\/p><p>value.&quot;<\/p><p>&quot;Using consistent assumptions, the single-stage residual income model Statement 3: &nbsp; should give you the same valuation as the Gordon Growth Dividend-discount<\/p><p>model.&quot;<\/p><p>Which of Webley&#x27;s statements is least accurate?<\/p><\/div>", "subj": "equity"}, {"n": 19, "q": "Assuming that the growth rate is less than the required rate of return (r), a decrease in initial book value will cause value in a residual income (RI) model to:", "opts": ["increase.", "decrease.", "there is insufficient information to determine the effect on RI."], "ans": "B", "expl": "A decrease (increase) in initial book value decreases (increases) value. This is revealed by the RI valuation expression: V₀ = B₀ + [(ROE – r) / (r – g)]B₀", "explhtml": "<p>A decrease (increase) in initial book value decreases (increases) value. This is revealed by the RI valuation expression:<\/p><p>V<sub>0<\/sub> = B<sub>0<\/sub> + [(ROE – r) / (r – g)]B<sub>0<\/sub><\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.2, LOS 21.e<\/div><div class=\"qtext\"><p>Assuming that the growth rate is less than the required rate of return (r), a decrease in initial book value will cause value in a residual income (RI) model to:<\/p><\/div>", "subj": "equity"}, {"n": 20, "q": "In general, firms making aggressive accounting decisions will report book values that are:", "opts": ["higher.", "lower.", "consistent with fair market value."], "ans": "A", "expl": "In general, firms making aggressive (conservative) accounting decisions will report higher (lower) book values and lower (higher) future earnings.", "explhtml": "<p>In general, firms making aggressive (conservative) accounting decisions will report higher (lower) book values and lower (higher) future earnings.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.k<\/div><div class=\"qtext\"><p>In general, firms making aggressive accounting decisions will report book values that are:<\/p><\/div>", "subj": "equity"}, {"n": 21, "q": "Residual income is defined as:", "opts": ["operating income plus depreciation and amortization.", "net income less a charge that measures stockholders' opportunity cost in generating that income.", "net income less a charge for capital investment."], "ans": "B", "expl": "Residual income is defined as net income less a charge that measures stockholders' opportunity cost in generating that income.", "explhtml": "<p>Residual income is defined as net income less a charge that measures stockholders&#x27; opportunity cost in generating that income.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Residual income is defined as:<\/p><\/div>", "subj": "equity"}, {"n": 22, "q": "Economic value added (EVA®) is calculated as net operating profit after taxes minus:", "opts": ["a charge for equity capital.", "capital expenditures.", "a charge for total capital."], "ans": "C", "expl": "EVA = NOPAT – (C% × TC), where NOPAT is a firm's net operating profit after taxes, C% is the cost of capital, and TC is total capital.", "explhtml": "<p>EVA = NOPAT – (C% × TC), where NOPAT is a firm&#x27;s net operating profit after taxes, C% is the cost of capital, and TC is total capital.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Economic value added (EVA<sup>®<\/sup>) is calculated as net operating profit after taxes minus:<\/p><\/div>", "subj": "equity"}, {"n": 23, "q": "An argument against using the residual income (RI) valuation approach is that:", "opts": ["terminal value does not dominate total present value as is the case in dividend and free cash flow valuation models.", "the models rely on accounting data that can be manipulated by management.", "the models focus on economic rather than just on accounting profitability."], "ans": "B", "expl": "An argument against using the RI approach is that the models rely on accounting data that can be manipulated by management. Both remaining responses are arguments in favor of the approach.", "explhtml": "<p>An argument against using the RI approach is that the models rely on accounting data that can be manipulated by management. Both remaining responses are arguments in favor of the approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.j<\/div><div class=\"qtext\"><p>An argument against using the residual income (RI) valuation approach is that:<\/p><\/div>", "subj": "equity"}, {"n": 24, "q": "A use of the residual income (RI) valuation approach is:", "opts": ["providing a check of consistency between competing approaches like free cash flow of equity (FCFE) and dividend discount model (DDM).", "deferring value more than in competing valuation approaches.", "providing more reliable estimates of terminal value."], "ans": "A", "expl": "A RI model can be used along with other models to assess the consistency of results. FCFE and DDM models forecast future cash flows while RI models start with a balance sheet measure of equity and add the present value of expected future RI.", "explhtml": "<p>A RI model can be used along with other models to assess the consistency of results. FCFE and DDM models forecast future cash flows while RI models start with a balance sheet measure of equity and add the present value of expected future RI.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.i<\/div><div class=\"qtext\"><p>A use of the residual income (RI) valuation approach is:<\/p><\/div>", "subj": "equity"}, {"n": 25, "q": "A common assumption regarding continuing residual income (RI) is that RI:", "opts": ["manifests a generally increasing trend indefinitely.", "declines to zero as return on equity (ROE) drops to the cost of equity over time.", "falls to the average industry level."], "ans": "B", "expl": "It is common to assume that RI declines to zero as ROE drops to the cost of equity over time. Other assumptions analysts may make include RI continues indefinitely at a positive level or RI reflects a decline in ROE to a long-run average level.", "explhtml": "<p>It is common to assume that RI declines to zero as ROE drops to the cost of equity over time. Other assumptions analysts may make include RI continues indefinitely at a positive level or RI reflects a decline in ROE to a long-run average level.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.4, LOS 21.h<\/div><div class=\"qtext\"><p>A common assumption regarding continuing residual income (RI) is that RI:<\/p><\/div>", "subj": "equity"}, {"n": 26, "q": "Calculate the \"traditional\" measure of Return on (opening) Equity for 20x6.", "opts": ["10.9%.", "13.2%.", "14.7%."], "ans": "C", "expl": "Return on starting equity = 12.5 / 85.2 = 14.7% Note we are using the start of year equity.", "explhtml": "<p>Return on starting equity = 12.5 / 85.2 = 14.7%<\/p><p>Note we are using the start of year equity.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\ ng book value.<\/p><p>Fernandez is concerned over what persistence factor to use for the residual income valuation and so consults his colleague Oliver Chippy who makes the following comments:<\/p><p>Comment 1: The persistence factor needs to be between -1 and +1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v026.webp\" style=\"max-width:min(100%,646px)\" alt=\"The persistence factor will be higher if there is a high dividend payout ratio and\"><p>Comment 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v027.webp\" style=\"max-width:min(100%,646px)\" alt=\"historically high residual income persistence in the industry.\"><p>As part of the valuation exercise Fernandez consults DAB's valuation handbook, which outlines when it is appropriate to use the residual income method and some of the necessary adjustments:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v028.webp\" style=\"max-width:min(100%,651px)\" alt=\"Due to the clean surplus violation, it is important to adjust net income for items that are charged directly to shareholders&#x27; equity. Such items include foreign\"><p>Statement 1: currency translation gains and losses under the all- current method. If this<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v029.webp\" style=\"max-width:min(100%,638px)\" alt=\"cumulative translation adjustment (CTA) does not reverse over time then ROE can be forecasted without taking in to account the CTA.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v030.webp\" style=\"max-width:min(100%,637px)\" alt=\"The residual income model is appropriate when the terminal value forecast is\"><p>Statement 2: highly uncertain and the expected free cash flows are negative for the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v031.webp\" style=\"max-width:min(100%,586px)\" alt=\"foreseeable future.\"><\/div><\/details><div class=\"pp-topic\">Module 21.4, LOS 21.h<\/div><div class=\"qtext\"><p>Calculate the intrinsic value of the company using a residual income model, assuming that after four years, Silo&#x27;s residual income will decay over time to zero with a persistence factor of 0.3.<\/p><\/div>", "subj": "equity"}, {"n": 33, "q": "Calculate the intrinsic value of the company using a residual income model, assuming that after four years, Silo's residual income will remain constant forever.", "opts": ["$8.8.", "$11.4.", "$10.7."], "ans": "C", "expl": "0.31 = 2.82 PV of terminal value at T₃ =  0.11 V₀ = $8.00 + [  ] = $10.70 | 0.24  0.29+2.82 0.26 +  + | 1.11²  1.11³ 1.11", "explhtml": "<p>0.31<\/p><p>= 2.82<\/p><p>PV of terminal value at T<sub>3<\/sub> = <\/p><p>0.11<\/p><div class=\"tbl\"><table><tr><td>V<sub>0<\/sub> = $8.00 + [<\/td><td>] = $10.70<\/td><\/tr><tr><td>0.24<\/td><td>0.29+2.82<\/td><\/tr><\/table><\/div><p>0.26<\/p><div class=\"tbl\"><table><tr><td>+<\/td><td>+<\/td><\/tr><tr><td>1.11<sup>2<\/sup><\/td><td>1.11<sup>3<\/sup><\/td><\/tr><\/table><\/div><p>1.11<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 32–35<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pedro Fernandez, CFA, is part of a team of analysts working for DAB Inc. He is currently analyzing the equity value of Silo Inc., which he believes is under threat of takeover by its main rival Cart Inc. Fernandez decides to use a residual income model to value the company using the following information:<\/p><p>Silo Inc. is expecting a return on equity (ROE) of 14% over each of the next four years. Its current book value is $8.00 per share. Its dividend payout ratio is 40%. The required return on equity is 11%. Forecasted earnings in years 1 through 4 are equal to ROE times the beginning book value.<\/p><p>Fernandez is concerned over what persistence factor to use for the residual income valuation and so consults his colleague Oliver Chippy who makes the following comments:<\/p><p>Comment 1: The persistence factor needs to be between -1 and +1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v026.webp\" style=\"max-width:min(100%,646px)\" alt=\"The persistence factor will be higher if there is a high dividend payout ratio and\"><p>Comment 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v027.webp\" style=\"max-width:min(100%,646px)\" alt=\"historically high residual income persistence in the industry.\"><p>As part of the valuation exercise Fernandez consults DAB's valuation handbook, which outlines when it is appropriate to use the residual income method and some of the necessary adjustments:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v028.webp\" style=\"max-width:min(100%,651px)\" alt=\"Due to the clean surplus violation, it is important to adjust net income for items that are charged directly to shareholders&#x27; equity. Such items include foreign\"><p>Statement 1: currency translation gains and losses under the all- current method. If this<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v029.webp\" style=\"max-width:min(100%,638px)\" alt=\"cumulative translation adjustment (CTA) does not reverse over time then ROE can be forecasted without taking in to account the CTA.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v030.webp\" style=\"max-width:min(100%,637px)\" alt=\"The residual income model is appropriate when the terminal value forecast is\"><p>Statement 2: highly uncertain and the expected free cash flows are negative for the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v031.webp\" style=\"max-width:min(100%,586px)\" alt=\"foreseeable future.\"><\/div><\/details><div class=\"pp-topic\">Module 21.4, LOS 21.h<\/div><div class=\"qtext\"><p>Calculate the intrinsic value of the company using a residual income model, assuming that after four years, Silo&#x27;s residual income will remain constant forever.<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "Regarding Oliver Chippy's comments on persistence factors: Comment 1  Comment 2", "opts": ["Incorrect Correct", "Incorrect Incorrect", "Correct Incorrect"], "ans": "B", "expl": "The projected rate at which residual income is expected to fade over the life cycle of the firm is captured by the persistence factor, which is between zero and one. Higher persistence factors will be associated with low dividend payouts (high reinvestment) and historically high residual income persistence in the industry.", "explhtml": "<p>The projected rate at which residual income is expected to fade over the life cycle of the firm is captured by the persistence factor, which is between zero and one.<\/p><p>Higher persistence factors will be associated with low dividend payouts (high reinvestment) and historically high residual income persistence in the industry.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 32–35<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pedro Fernandez, CFA, is part of a team of analysts working for DAB Inc. He is currently analyzing the equity value of Silo Inc., which he believes is under threat of takeover by its main rival Cart Inc. Fernandez decides to use a residual income model to value the company using the following information:<\/p><p>Silo Inc. is expecting a return on equity (ROE) of 14% over each of the next four years. Its current book value is $8.00 per share. Its dividend payout ratio is 40%. The required return on equity is 11%. Forecasted earnings in years 1 through 4 are equal to ROE times the beginning book value.<\/p><p>Fernandez is concerned over what persistence factor to use for the residual income valuation and so consults his colleague Oliver Chippy who makes the following comments:<\/p><p>Comment 1: The persistence factor needs to be between -1 and +1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v026.webp\" style=\"max-width:min(100%,646px)\" alt=\"The persistence factor will be higher if there is a high dividend payout ratio and\"><p>Comment 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v027.webp\" style=\"max-width:min(100%,646px)\" alt=\"historically high residual income persistence in the industry.\"><p>As part of the valuation exercise Fernandez consults DAB's valuation handbook, which outlines when it is appropriate to use the residual income method and some of the necessary adjustments:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v028.webp\" style=\"max-width:min(100%,651px)\" alt=\"Due to the clean surplus violation, it is important to adjust net income for items that are charged directly to shareholders&#x27; equity. Such items include foreign\"><p>Statement 1: currency translation gains and losses under the all- current method. If this<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v029.webp\" style=\"max-width:min(100%,638px)\" alt=\"cumulative translation adjustment (CTA) does not reverse over time then ROE can be forecasted without taking in to account the CTA.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v030.webp\" style=\"max-width:min(100%,637px)\" alt=\"The residual income model is appropriate when the terminal value forecast is\"><p>Statement 2: highly uncertain and the expected free cash flows are negative for the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v031.webp\" style=\"max-width:min(100%,586px)\" alt=\"foreseeable future.\"><\/div><\/details><div class=\"pp-topic\">Module 21.4, LOS 21.h<\/div><div class=\"qtext\"><p>Regarding Oliver Chippy&#x27;s comments on persistence factors: Comment 1 &nbsp; Comment 2<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "Regarding the handbook's statements on residual income: Statement 1  Statement 2", "opts": ["Correct Correct", "Correct Incorrect", "Incorrect Correct"], "ans": "C", "expl": "If the CTA tends to reverse over time and is not consistently positive or negative, the ROE can be forecasted without taking in to account the CTA.", "explhtml": "<p>If the CTA tends to reverse over time and is not consistently positive or negative, the ROE can be forecasted without taking in to account the CTA.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 32–35<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pedro Fernandez, CFA, is part of a team of analysts working for DAB Inc. He is currently analyzing the equity value of Silo Inc., which he believes is under threat of takeover by its main rival Cart Inc. Fernandez decides to use a residual income model to value the company using the following information:<\/p><p>Silo Inc. is expecting a return on equity (ROE) of 14% over each of the next four years. Its current book value is $8.00 per share. Its dividend payout ratio is 40%. The required return on equity is 11%. Forecasted earnings in years 1 through 4 are equal to ROE times the beginning book value.<\/p><p>Fernandez is concerned over what persistence factor to use for the residual income valuation and so consults his colleague Oliver Chippy who makes the following comments:<\/p><p>Comment 1: The persistence factor needs to be between -1 and +1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v026.webp\" style=\"max-width:min(100%,646px)\" alt=\"The persistence factor will be higher if there is a high dividend payout ratio and\"><p>Comment 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v027.webp\" style=\"max-width:min(100%,646px)\" alt=\"historically high residual income persistence in the industry.\"><p>As part of the valuation exercise Fernandez consults DAB's valuation handbook, which outlines when it is appropriate to use the residual income method and some of the necessary adjustments:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v028.webp\" style=\"max-width:min(100%,651px)\" alt=\"Due to the clean surplus violation, it is important to adjust net income for items that are charged directly to shareholders&#x27; equity. Such items include foreign\"><p>Statement 1: currency translation gains and losses under the all- current method. If this<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v029.webp\" style=\"max-width:min(100%,638px)\" alt=\"cumulative translation adjustment (CTA) does not reverse over time then ROE can be forecasted without taking in to account the CTA.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v030.webp\" style=\"max-width:min(100%,637px)\" alt=\"The residual income model is appropriate when the terminal value forecast is\"><p>Statement 2: highly uncertain and the expected free cash flows are negative for the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v031.webp\" style=\"max-width:min(100%,586px)\" alt=\"foreseeable future.\"><\/div><\/details><div class=\"pp-topic\">Module 21.5, LOS 21.k<\/div><div class=\"qtext\"><p>Regarding the handbook&#x27;s statements on residual income: Statement 1 &nbsp; Statement 2<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "An analyst is considering the purchase of Delphos Machinery, which has a price-to-book value (P/B) ratio of 8.00. Return on equity (ROE) is expected to be 14%, current book value per share is $12.00, and the cost of equity is 11%. What growth rate is implied by the current P/B rate?", "opts": ["11.00%.", "8.43%.", "10.57%."], "ans": "C", "expl": "The P/B ratio of 8.00 and the current book value per share of $12.00 imply a current market price of $96.00. This implies a growth rate of: g = r − [B₀(ROE − r)] / (V₀ − B₀) = 0.11 − [12.00(0.14 − 0.11)] / (96.00 − 12.00) = 0.1057 = 10.57%. (Note: the curriculum does not provide this expression directly.)", "explhtml": "<p>The P/B ratio of 8.00 and the current book value per share of $12.00 imply a current market price of $96.00. This implies a growth rate of:<\/p><p>g = r − [B<sub>0<\/sub>(ROE − r)] / (V<sub>0<\/sub> − B<sub>0<\/sub>) = 0.11 − [12.00(0.14 − 0.11)] / (96.00 − 12.00) = 0.1057 = 10.57%.<\/p><p>(Note: the curriculum does not provide this expression directly.)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.3, LOS 21.g<\/div><div class=\"qtext\"><p>An analyst is considering the purchase of Delphos Machinery, which has a price-to-book value (P/B) ratio of 8.00. Return on equity (ROE) is expected to be 14%, current book value per share is $12.00, and the cost of equity is 11%. What growth rate is implied by the current P/B rate?<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "Which of the following characteristics of a company would make it unsuitable for residual income valuation analysis?", "opts": ["Book-value estimates are not reliable.", "Free cash flows are negative and likely to remain so for some time.", "The forecast of terminal value is not reliable."], "ans": "A", "expl": "Residual income models can handle negative free cash flows and poor forecasts for terminal value. However, poor book-value estimates render the statistic less useful.", "explhtml": "<p>Residual income models can handle negative free cash flows and poor forecasts for terminal value. However, poor book-value estimates render the statistic less useful.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.j<\/div><div class=\"qtext\"><p>Which of the following characteristics of a company would make it unsuitable for residual income valuation analysis?<\/p><\/div>", "subj": "equity"}, {"n": 38, "q": "Among the various price multiples, the residual income model is most closely linked to which of the following?", "opts": ["Price to book value (P/B).", "Price to free cash flow (P/FCF).", "Price to earnings (P/E)."], "ans": "A", "expl": "The residual income model is most closely linked to P/B because justified P/B is directly linked to expected residual future income.", "explhtml": "<p>The residual income model is most closely linked to P/B because justified P/B is directly linked to expected residual future income.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.2, LOS 21.e<\/div><div class=\"qtext\"><p>Among the various price multiples, the residual income model is most closely linked to which of the following?<\/p><\/div>", "subj": "equity"}, {"n": 39, "q": "When a company's ROE is the same as the return required by the market, the stock's justified market value is closest to the:", "opts": ["book value plus residual income.", "actual market value plus residual income.", "book value."], "ans": "C", "expl": "When ROE is equal to the required return on equity, the justified market value of a share of stock is equal to its book value. In this case, there is no residual income.", "explhtml": "<p>When ROE is equal to the required return on equity, the justified market value of a share of stock is equal to its book value. In this case, there is no residual income.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 39–42<\/summary><div class=\"vig-body\"><p>Sue Clifton, CFA, is a senior portfolio manager at Lewiston Investments, a small research firm. Clifton has been assigned to help new hire Ralph Rawls get acclimated to his new job as a stock analyst. She discovers early on that Rawls is not too familiar with residual income valuation, a tool for determining economic profitability.<\/p><p>Clifton explains the basics of the residual-income model and the clean surplus relationship that underpins the system.<\/p><p>Clifton explains to Rawls that analysts use assumptions to make the residual-income models easier to interpret. She goes on to identify four commonly used assumptions: Residual income can be expected to:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v032.webp\" style=\"max-width:min(100%,382px)\" alt=\"• disappear immediately • decline gradually as return on equity (ROE) declines • stay at the same level indefinitely • decline to the market average\"><p>After her initial review of residual income, Clifton gives Rawls a test. The answers depend on the use of the following information about CR Industries in Year X (in $ millions):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v033.webp\" style=\"max-width:min(100%,480px)\" alt=\"$225 Invested capital $231 Market capitalization $130 Debt\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v034.webp\" style=\"max-width:min(100%,480px)\" alt=\"$90 Sales $26 Cost of goods sold (COGS) $10 Selling, general &amp; administrative (SG&amp;A) expense $25 Depreciation and amortization expense $6.5 Interest expense $6 Dividend expense 40.0% Tax rate 11.4% Pretax cost of equity 5.00% Pretax cost of debt\"><\/div><\/details><div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>When a company&#x27;s ROE is the same as the return required by the market, the stock&#x27;s justified market value is closest to the:<\/p><\/div>", "subj": "equity"}, {"n": 40, "q": "Which of the following assumptions is not commonly used to simplify the calculation of residual income? Continuing residual income is expected to:", "opts": ["disappear immediately.", "decline to the market average.", "decline gradually as ROE declines."], "ans": "B", "expl": "A common assumption involves residual income declining to an average level consistent with a mature industry. This assumption makes sense, considering that we generally calculate residual income for an individual company, and the company's industry average is quite possibly the best benchmark for its future income-generation potential. The market average is not generally used as a proxy. Both remaining assumptions are commonly used.", "explhtml": "<p>A common assumption involves residual income declining to an average level consistent with a mature industry. This assumption makes sense, considering that we generally calculate residual income for an individual company, and the company&#x27;s industry average is quite possibly the best benchmark for its future income-generation potential. The market average is not generally used as a proxy. Both remaining assumptions are commonly used.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 39–42<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sue Clifton, CFA, is a senior portfolio manager at Lewiston Investments, a small research firm. Clifton has been assigned to help new hire Ralph Rawls get acclimated to his new job as a stock analyst. She discovers early on that Rawls is not too familiar with residual income valuation, a tool for determining economic profitability.<\/p><p>Clifton explains the basics of the residual-income model and the clean surplus relationship that underpins the system.<\/p><p>Clifton explains to Rawls that analysts use assumptions to make the residual-income models easier to interpret. She goes on to identify four commonly used assumptions: Residual income can be expected to:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v032.webp\" style=\"max-width:min(100%,382px)\" alt=\"• disappear immediately • decline gradually as return on equity (ROE) declines • stay at the same level indefinitely • decline to the market average\"><p>After her initial review of residual income, Clifton gives Rawls a test. The answers depend on the use of the following information about CR Industries in Year X (in $ millions):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v033.webp\" style=\"max-width:min(100%,480px)\" alt=\"$225 Invested capital $231 Market capitalization $130 Debt\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v034.webp\" style=\"max-width:min(100%,480px)\" alt=\"$90 Sales $26 Cost of goods sold (COGS) $10 Selling, general &amp; administrative (SG&amp;A) expense $25 Depreciation and amortization expense $6.5 Interest expense $6 Dividend expense 40.0% Tax rate 11.4% Pretax cost of equity 5.00% Pretax cost of debt\"><\/div><\/details><div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Which of the following assumptions is not commonly used to simplify the calculation of residual income? Continuing residual income is expected to:<\/p><\/div>", "subj": "equity"}, {"n": 41, "q": "Which of the following scenarios represents a violation of the clean surplus relationship?", "opts": ["A company stops paying dividends suddenly.", "Unusual charges against income.", "The market value of securities available for sale changes."], "ans": "C", "expl": "The clean surplus relationship holds that ending book value equals the beginning book value plus earnings minus dividends, excluding ownership transactions. The relationship is violated when charges skip the income statement and go directly to equity. Changes in the market value of debt and equity classified as available for sale can affect equity without affecting earnings. Unusual charges should not be included in residual-value calculations because they are not expected to recur. Charges that do not affect equity will not violate the relationship. Cessation of dividends also does not violate the relationship.", "explhtml": "<p>The clean surplus relationship holds that ending book value equals the beginning book value plus earnings minus dividends, excluding ownership transactions. The relationship is violated when charges skip the income statement and go directly to equity. Changes in the market value of debt and equity classified as available for sale can affect equity without affecting earnings. Unusual charges should not be included in residual-value calculations because they are not expected to recur. Charges that do not affect equity will not violate the relationship. Cessation of dividends also does not violate the relationship.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 39–42<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div cla
