ss=\"vig-body\"><p>Sue Clifton, CFA, is a senior portfolio manager at Lewiston Investments, a small research firm. Clifton has been assigned to help new hire Ralph Rawls get acclimated to his new job as a stock analyst. She discovers early on that Rawls is not too familiar with residual income valuation, a tool for determining economic profitability.<\/p><p>Clifton explains the basics of the residual-income model and the clean surplus relationship that underpins the system.<\/p><p>Clifton explains to Rawls that analysts use assumptions to make the residual-income models easier to interpret. She goes on to identify four commonly used assumptions: Residual income can be expected to:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v032.webp\" style=\"max-width:min(100%,382px)\" alt=\"• disappear immediately • decline gradually as return on equity (ROE) declines • stay at the same level indefinitely • decline to the market average\"><p>After her initial review of residual income, Clifton gives Rawls a test. The answers depend on the use of the following information about CR Industries in Year X (in $ millions):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v033.webp\" style=\"max-width:min(100%,480px)\" alt=\"$225 Invested capital $231 Market capitalization $130 Debt\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v034.webp\" style=\"max-width:min(100%,480px)\" alt=\"$90 Sales $26 Cost of goods sold (COGS) $10 Selling, general &amp; administrative (SG&amp;A) expense $25 Depreciation and amortization expense $6.5 Interest expense $6 Dividend expense 40.0% Tax rate 11.4% Pretax cost of equity 5.00% Pretax cost of debt\"><\/div><\/details><div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Which of the following scenarios represents a violation of the clean surplus relationship?<\/p><\/div>", "subj": "equity"}, {"n": 42, "q": "The economic value added (EVA) of CR Industries is closest to:", "opts": ["−$4.53 million.", "−$8.13 million.", "$2.67 million."], "ans": "C", "expl": "EVA = NOPAT − (WACC × invested capital). NOPAT = (sales − COGS − SG&A expense − depreciation and amortization expense) × (1 − tax rate) = $17.40 million. To calculate the weighted average cost of capital (WACC), start by determining the percentage of equity and debt. $130 million in debt represented 57.78% of total capital. The remaining 42.22% is the equity portion. Don't forget to adjust the cost of debt for taxes. WACC = 57.78% × (5% × [1 − 40%]) + (42.22% × 11.4%) = 6.55%. EVA = $17.40 million − ($225 million × 6.55%) = $2.67 million. Note that in this problem residual income and EVA are the same. This is true in a \"perfect world\" but you should not assume this will always be true on exam problems.", "explhtml": "<p>EVA = NOPAT − (WACC × invested capital).<\/p><p>NOPAT = (sales − COGS − SG&amp;A expense − depreciation and amortization expense) × (1 − tax rate) = $17.40 million.<\/p><p>To calculate the weighted average cost of capital (WACC), start by determining the percentage of equity and debt. $130 million in debt represented 57.78% of total capital. The remaining 42.22% is the equity portion. Don&#x27;t forget to adjust the cost of debt for taxes.<\/p><p>WACC = 57.78% × (5% × [1 − 40%]) + (42.22% × 11.4%) = 6.55%.<\/p><p>EVA = $17.40 million − ($225 million × 6.55%) = $2.67 million.<\/p><p>Note that in this problem residual income and EVA are the same. This is true in a &quot;perfect world&quot; but you should not assume this will always be true on exam problems.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 39–42<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sue Clifton, CFA, is a senior portfolio manager at Lewiston Investments, a small research firm. Clifton has been assigned to help new hire Ralph Rawls get acclimated to his new job as a stock analyst. She discovers early on that Rawls is not too familiar with residual income valuation, a tool for determining economic profitability.<\/p><p>Clifton explains the basics of the residual-income model and the clean surplus relationship that underpins the system.<\/p><p>Clifton explains to Rawls that analysts use assumptions to make the residual-income models easier to interpret. She goes on to identify four commonly used assumptions: Residual income can be expected to:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v032.webp\" style=\"max-width:min(100%,382px)\" alt=\"• disappear immediately • decline gradually as return on equity (ROE) declines • stay at the same level indefinitely • decline to the market average\"><p>After her initial review of residual income, Clifton gives Rawls a test. The answers depend on the use of the following information about CR Industries in Year X (in $ millions):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v033.webp\" style=\"max-width:min(100%,480px)\" alt=\"$225 Invested capital $231 Market capitalization $130 Debt\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v034.webp\" style=\"max-width:min(100%,480px)\" alt=\"$90 Sales $26 Cost of goods sold (COGS) $10 Selling, general &amp; administrative (SG&amp;A) expense $25 Depreciation and amortization expense $6.5 Interest expense $6 Dividend expense 40.0% Tax rate 11.4% Pretax cost of equity 5.00% Pretax cost of debt\"><\/div><\/details><div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>The economic value added (EVA) of CR Industries is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 43, "q": "Which of the following statements least accurately explains the relationship between the residual income (RI) model, the dividend discount model (DDM), and free cash flow to equity (FCFE):", "opts": ["RI models use an equity value from the balance sheet plus the present value of expected future residual income.", "FCFE models use historical cash flows.", "All the models discount future cash flows or income at the required rate of return."], "ans": "B", "expl": "In theory, the same value or total present value should be derived using expected dividends, expected FCFE, or book value plus expected residual income if the underlying assumptions are the same. However, the recognition of value is different because FCFE and DDM models forecast future cash flows, while residual income models start with a balance sheet measure of equity and add the present value of expected future residual income. A residual income model can be used along with other models to assess the consistency of results.", "explhtml": "<p>In theory, the same value or total present value should be derived using expected dividends, expected FCFE, or book value plus expected residual income if the underlying assumptions are the same. However, the recognition of value is different because FCFE and DDM models forecast future cash flows, while residual income models start with a balance sheet measure of equity and add the present value of expected future residual income. A residual income model can be used along with other models to assess the consistency of results.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.i<\/div><div class=\"qtext\"><p>Which of the following statements least accurately explains the relationship between the residual income (RI) model, the dividend discount model (DDM), and free cash flow to equity (FCFE):<\/p><\/div>", "subj": "equity"}, {"n": 44, "q": "An argument for using the residual income (RI) valuation approach is that residual income valuation:", "opts": ["reduces the problem of terminal value dominating total value.", "encourages company managers to maximize ROI.", "facilitates comparisons between divisions."], "ans": "A", "expl": "Terminal value does not dominate total present value as is the case in dividend and free cash flow valuation models. Both remaining responses are arguments against using the RI approach.", "explhtml": "<p>Terminal value does not dominate total present value as is the case in dividend and free cash flow valuation models. Both remaining responses are arguments against using the RI approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.i<\/div><div class=\"qtext\"><p>An argument for using the residual income (RI) valuation approach is that residual income valuation:<\/p><\/div>", "subj": "equity"}, {"n": 45, "q": "Travel Advisors has earnings before interest and taxes (EBIT) of $200 million, interest expense of $83 million, taxes of $46.8 million, and total debt of $125 million. It is also financed with total equity of $650 million, which has a required rate of return of 12 percent. What is Travel Advisors' residual income? A:", "opts": ["loss of $70.2 million.", "loss of $7.8 million.", "profit of $70.2 million."], "ans": "B", "expl": "Net income = 200,000,000 – 83,000,000 – 46,800,000 = $70,200,000. The equity capital charge is 650,000,000 × 0.12 = $78,000,000. Thus, residual income = 70,200,000 – 78,000,000 = – $7,800,000.", "explhtml": "<p>Net income = 200,000,000 – 83,000,000 – 46,800,000 = $70,200,000. The equity capital charge is 650,000,000 × 0.12 = $78,000,000. Thus, residual income = 70,200,000 – 78,000,000 = – $7,800,000.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Travel Advisors has earnings before interest and taxes (EBIT) of $200 million, interest expense of $83 million, taxes of $46.8 million, and total debt of $125 million. It is also financed with total equity of $650 million, which has a required rate of return of 12 percent. What is Travel Advisors&#x27; residual income? A:<\/p><\/div>", "subj": "equity"}, {"n": 46, "q": "Creative Gardening is expected to have a return on equity (ROE) of 13% for the next five years and slightly lower thereafter. Its current book value per share as of the beginning of year 1 (i.e., the end of year 0) is $7.50 per share and its required rate of return is 10%. The premium over book value at the end of five years is expected to be 30%. All earnings are reinvested. The sum of the present values of the residual income estimates over the next five years is $1.10. The projected ending book value in year 5 is $13.83. What is the value of Creative Gardening using these inputs?", "opts": ["$11.18.", "$8.60.", "$13.83."], "ans": "A", "expl": "Applying the residual income valuation model: V₀ = B₀ + sum of discounted RIs + discounted premium = 7.50 + 1.10 + [(0.30)(13.83)/(1.10)⁵] = $11.18", "explhtml": "<p>Applying the residual income valuation model:<\/p><p>V<sub>0<\/sub> = B<sub>0<\/sub> + sum of discounted RIs + discounted premium<\/p><p>= 7.50 + 1.10 + [(0.30)(13.83)/(1.10)<sup>5<\/sup>] = $11.18<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.2, LOS 21.c<\/div><div class=\"qtext\"><p>Creative Gardening is expected to have a return on equity (ROE) of 13% for the next five years and slightly lower thereafter. Its current book value per share as of the beginning of year 1 (i.e., the end of year 0) is $7.50 per share and its required rate of return is 10%. The premium over book value at the end of five years is expected to be 30%. All earnings are reinvested. The sum of the present values of the residual income estimates over the next five years is $1.10. The projected ending book value in year 5 is $13.83. What is the value of Creative Gardening using these inputs?<\/p><\/div>", "subj": "equity"}, {"n": 47, "q": "Using the assumptions given for RI Inc., and using a single stage (constant growth) model the hypothetical company shares would be valued at:", "opts": ["$12.61.", "$9.78.", "$10.86."], "ans": "A", "expl": "V₀ = B₀ + [(ROE – r) × B₀ / (r – g)] g = rr × roe = 0.6 × 0.046 = 0.0276 V₀ = $8.50 + [(0.046 – 0.04) × $8.50 / (0.04 – 0.0276)] V₀ = $12.61", "explhtml": "<p>V<sub>0<\/sub> = B<sub>0<\/sub> + [(ROE – r) × B<sub>0<\/sub> / (r – g)]<\/p><p>g = rr × roe = 0.6 × 0.046 = 0.0276<\/p><p>V<sub>0<\/sub> = $8.50 + [(0.046 – 0.04) × $8.50 / (0.04 – 0.0276)]<\/p><p>V<sub>0<\/sub> = $12.61<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 47–50<\/summary><div class=\"vig-body\"><p>llias Chair has read a recent article on the internet which championed the benefits of using a residual income model to calculate company valuations. He is having trouble understanding the model, and has presented you with the following assumptions for a hypothetical company that the article used, and would like to know the valuation it results in.<\/p><p>RI Inc.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v035.webp\" style=\"max-width:min(100%,344px)\" alt=\"4.6% Return on equity 0.6 Retention rate Current book value per share $8.50\"><p>Required rate of return for equity holders 4% Chair currently uses dividend valuation methodology to compute intrinsic value. He is interested to know if residual income models could be adapted and used instead of the dividend discount model (DDM). Chair has two main concerns about using it instead of the DDM:<\/p><p>Concern 1: The residual income model seems to be to some extent dependent on book value<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v036.webp\" style=\"max-width:min(100%,652px)\" alt=\"per share, which may be calculated differently according to the accounting policy choices a firm makes.\"><p>Concern 2:It's a shame that all residual income models assume constant growth in economic<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v037.webp\" style=\"max-width:min(100%,654px)\" alt=\"profit. It seems unreasonable to assume that economic profits can be sustained let alone grow at a constant rate. The models don&#x27;t seem to factor in the impact of competition on future residual income.\"><p>llias is also trying to assess a fundamental value of yet another company in the sector, Topper Inc., using the residual income model. He believes that the current value of Topper is primarily based on the current book value plus the present value of residual income for the next three years.<\/p><p>Ilias estimates the required return to equity holders to be 4% pa. The current book value per share is $8.50.<\/p><p>He has estimated the EPS forecasts for the next three years to be $1.50, $1.40, and $1.35 respectively. Her estimates for the dividend per share for the next three years are 50.70, $0.75, and $0.80 respectively.<\/p><p>Chair does have concerns about the use of a residual income model for Topper.<\/p><p>Ilias has extracted the following from the Accounting Policies Note in Topper's most recent annual report:<\/p><p>Foreign Subsidiaries:<\/p><p>Topper Inc. has two foreign subsidiaries which are both based in Europe and for the purposes of the group accounts, Topper has assumed that the Euro is the functional currency for both, and hence, used the current rate method for translation into the group reporting currency (U.S. dollars).<\/p><p>Financial Instruments:<\/p><p>Topper Inc. owns $3 million of par value bonds issued by Pastini Inc., which are due to mature in 2x18. The group intends to hold the bonds until 2x18 and hence they have been classed as amortized cost on the Group Balance Sheet.<\/p><\/div><\/details><div class=\"pp-topic\">Module 21.3, LOS 21.f<\/div><div class=\"qtext\"><p>Using the assumptions given for RI Inc., and using a single stage (constant growth) model the hypothetical company shares would be valued at:<\/p><\/div>", "subj": "equity"}, {"n": 48, "q": "Is Chair correct in his stated concerns?", "opts": ["Incorrect in both.", "Correct in Statement 1 only.", "Correct in Statement 2 only."], "ans": "B", "expl": "Residual income is dependent on book value, which is an accounting based figure. The residual income constant growth formula can, however, be used to calculate implied growth given a market to book value ratio.", "explhtml": "<p>Residual income is dependent on book value, which is an accounting based figure. The residual income constant growth formula can, however, be used to calculate implied growth given a market to book value ratio.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 47–50<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>llias Chair has read a recent article on the internet which championed the benefits of using a residual income model to calculate company valuations. He is having trouble understanding the model, and has presented you with the following assumptions for a hypothetical company that the article used, and would like to know the valuation it results in.<\/p><p>RI Inc.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v035.webp\" style=\"max-width:min(100%,344px)\" alt=\"4.6% Return on equity 0.6 Retention rate Current book value per share $8.50\"><p>Required rate of return for equity holders 4% Chair currently uses dividend valuation methodology to compute intrinsic value. He is interested to know if residual income models could be adapted and used instead of the dividend discount model (DDM). Chair has two main concerns about using it instead of the DDM:<\/p><p>Concern 1: The residual income model seems to be to some extent dependent on book value<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v036.webp\" style=\"max-width:min(100%,652px)\" alt=\"per share, which may be calculated differently according to the accounting policy choices a firm makes.\"><p>Concern 2:It's a shame that all residual income models assume constant growth in economic<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v037.webp\" style=\"max-width:min(100%,654px)\" alt=\"profit. It seems unreasonable to assume that economic profits can be sustained let alone grow at a constant rate. The models don&#x27;t seem to factor in the impact of competition on future residual income.\"><p>llias is also trying to assess a fundamental value of yet another company in the sector, Topper Inc., using the residual income model. He believes that the current value of Topper is primarily based on the current book value plus the present value of residual income for the next three years.<\/p><p>Ilias estimates the required return to equity holders to be 4% pa. The current book value per share is $8.50.<\/p><p>He has estimated the EPS forecasts for the next three years to be $1.50, $1.40, and $1.35 respectively. Her estimates for the dividend per share for the next three years are 50.70, $0.75, and $0.80 respectively.<\/p><p>Chair does have concerns about the use of a residual income model for Topper.<\/p><p>Ilias has extracted the following from the Accounting Policies Note in Topper's most recent annual report:<\/p><p>Foreign Subsidiaries:<\/p><p>Topper Inc. has two foreign subsidiaries which are both based in Europe and for the purposes of the group accounts, Topper has assumed that the Euro is the functional currency for both, and hence, used the current rate method for translation into the group reporting currency (U.S. dollars).<\/p><p>Financial Instruments:<\/p><p>Topper Inc. owns $3 million of par value bonds issued by Pastini Inc., which are due to mature in 2x18. The group intends to hold the bonds until 2x18 and hence they have been classed as amortized cost on the Group Balance Sheet.<\/p><\/div><\/details><div class=\"pp-topic\">Module 21.3, LOS 21.g<\/div><div class=\"qtext\"><p>Is Chair correct in his stated concerns?<\/p><\/div>", "subj": "equity"}, {"n": 49, "q": "Using Chair's estimates and assumptions, what would the value per share of Topper be estimated at, using the residual income model:", "opts": ["$9.23.", "$10.20.", "$11.41."], "ans": "C", "expl": " Year 1 Year 2 Year 3 BVt–1  $8.50  $9.30  $9.95 EPS  $1.50  $1.40  $1.35 DPS  $0.70  $0.75  $0.80 r × BVt–1  $0.34  $0.37  $0.40 RI forecast  $1.16  $1.03  $0.95 Value = $8.50 + $1.16 / 1.04 + $1.03 / 1.04² + $0.95 / 1.04³ Value = $11.41", "explhtml": "<div class=\"tbl\"><table><tr><td><\/td><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><\/tr><\/table><\/div><p>BVt–1 &nbsp; $8.50 &nbsp; $9.30 &nbsp; $9.95 EPS &nbsp; $1.50 &nbsp; $1.40 &nbsp; $1.35 DPS &nbsp; $0.70 &nbsp; $0.75 &nbsp; $0.80 r × BV<sub>t–1<\/sub> &nbsp; $0.34 &nbsp; $0.37 &nbsp; $0.40 RI forecast &nbsp; $1.16 &nbsp; $1.03 &nbsp; $0.95<\/p><p>Value = $8.50 + $1.16 / 1.04 + $1.03 / 1.04<sup>2<\/sup> + $0.95 / 1.04<sup>3<\/sup><\/p><p>Value = $11.41<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 47–50<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>llias Chair has read a recent article on the internet which championed the benefits of using a residual income model to calculate company valuations. He is having trouble understanding the model, and has presented you with the following assumptions for a hypothetical company that the article used, and would like to know the valuation it results in.<\/p><p>RI Inc.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v035.webp\" style=\"max-width:min(100%,344px)\" alt=\"4.6% Return on equity 0.6 Retention rate Current book value per share $8.50\"><p>Required rate of return for equity holders 4% Chair currently uses dividend valuation methodology to compute intrinsic value. He is interested to know if residual income models could be adapted and used instead of the dividend discount model (DDM). Chair has two main concerns about using it instead of the DDM:<\/p><p>Concern 1: The residual income model seems to be to some extent dependent on book value<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v036.webp\" style=\"max-width:min(100%,652px)\" alt=\"per share, which may be calculated differently according to the accounting policy choices a firm makes.\"><p>Concern 2:It's a shame that all residual income models assume constant growth in economic<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v037.webp\" style=\"max-width:min(100%,654px)\" alt=\"profit. It seems unreasonable to assume that economic profits can be sustained let alone grow at a constant rate. The models don&#x27;t seem to factor in the impact of competition on future residual income.\"><p>llias is also trying to assess a fundamental value of yet another company in the sector, Topper Inc., using the residual income model. He believes that the current value of Topper is primarily based on the current book value plus the present value of residual income for the next three years.<\/p><p>Ilias estimates the required return to equity holders to be 4% pa. The current book value per share is $8.50.<\/p><p>He has estimated the EPS forecasts for the next three years to be $1.50, $1.40, and $1.35 respectively. Her estimates for the dividend per share for the next three years are 50.70, $0.75, and $0.80 respectively.<\/p><p>Chair does have concerns about the use of a residual income model for Topper.<\/p><p>Ilias has extracted the following from the Accounting Policies Note in Topper's most recent annual report:<\/p><p>Foreign Subsidiaries:<\/p><p>Topper Inc. has two foreign subsidiaries which are both based in Europe and for the purposes of the group accounts, Topper has assumed that the Euro is the functional currency for both, and hence, used the current rate method for translation into the group reporting currency (U.S. dollars).<\/p><p>Financial Instruments:<\/p><p>Topper Inc. owns $3 million of par value bonds issued by Pastini Inc., which are due to mature in 2x18. The group intends to hold the bonds until 2x18 and hence they have been classed as amortized cost on the Group Balance Sheet.<\/p><\/div><\/details><div class=\"pp-topic\">Module 21.2, LOS 21.c<\/div><div class=\"qtext\"><p>Using Chair&#x27;s estimates and assumptions, what would the value per share of Topper be estimated at, using the residual income model:<\/p><\/div>", "subj": "equity"}, {"n": 50, "q": "Which of the accounting policy note extracts identified by Chair would cause an issue with the \"clean surplus relationship\" when using the residual income model for Topper Inc.?", "opts": ["Foreign Subsidiaries note.", "Financial Instruments note.", "Both the Foreign Subsidiaries and the Financial Instruments note."], "ans": "A", "expl": "Foreign exchange gains and losses calculated under the current rate method are taken directly to shareholders' equity (CTA). This violates the clean surplus relationship and should be adjusted for unless they are expected to reverse in the near future. Only assets held as \"fair value through other comprehensive income (FVOCI)\" would cause an issue in the financial instruments note.", "explhtml": "<p>Foreign exchange gains and losses calculated under the current rate method are taken directly to shareholders&#x27; equity (CTA). This violates the clean surplus relationship and should be adjusted for unless they are expected to reverse in the near future.<\/p><p>Only assets held as &quot;fair value through other comprehensive income (FVOCI)&quot; would cause an issue in the financial instruments note.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 47–50<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>llias Chair has read a recent article on the internet which championed the benefits of using a residual income model to calculate company valuations. He is having trouble understanding the model, and has presented you with the following assumptions for a hypothetical company that the article used, and would like to know the valuation it results in.<\/p><p>RI Inc.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v035.webp\" style=\"max-width:min(100%,344px)\" alt=\"4.6% Return on equity 0.6 Retention rate Current book value per share $8.50\"><p>Required rate of return for equity holders 4% Chair currently uses dividend valuation methodology to compute intrinsic value. He is interested to know if residual income models could be adapted and used instead of the dividend discount model (DDM). Chair has two main concerns about using it instead of the DDM:<\/p><p>Concern 1: The residual income model seems to be to some extent dependent on book value<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v036.webp\" style=\"max-width:min(100%,652px)\" alt=\"per share, which may be calculated differently according to the accounting policy choices a firm makes.\"><p>Concern 2:It's a shame that all residual income models assume constant growth in economic<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v037.webp\" style=\"max-width:min(100%,654px)\" alt=\"profit. It seems unreasonable to assume that economic profits can be sustained let alone grow at a constant rate. The models don&#x27;t seem to factor in the impact of competition on future residual income.\"><p>llias is also trying to assess a fundamental value of yet another company in the sector, Topper Inc., using the residual income model. He believes that the current value of Topper is primarily based on the current book value plus the present value of residual income for the next three years.<\/p><p>Ilias estimates the required return to equity holders to be 4% pa. The current book value per share is $8.50.<\/p><p>He has estimated the EPS forecasts for the next three years to be $1.50, $1.40, and $1.35 respectively. Her estimates for the dividend per share for the next three years are 50.70, $0.75, and $0.80 respectively.<\/p><p>Chair does have concerns about the use of a residual income model for Topper.<\/p><p>Ilias has extracted the following from the Accounting Policies Note in Topper's most recent annual report:<\/p><p>Foreign Subsidiaries:<\/p><p>Topper Inc. has two foreign subsidiaries which are both based in Europe and for the purposes of the group accounts, Topper has assumed that the Euro is the functional currency for both, and hence, used the current rate method for translation into the group reporting currency (U.S. dollars).<\/p><p>Financial Instruments:<\/p><p>Topper Inc. owns $3 million of par value bonds issued by Pastini Inc., which are due to mature in 2x18. The group intends to hold the bonds until 2x18 and hence they have been classed as amortized cost on the Group Balance Sheet.<\/p><\/div><\/details><div class=\"pp-topic\">Module 21.5, LOS 21.k<\/div><div class=\"qtext\"><p>Which of the accounting policy note extracts identified by Chair would cause an issue with the &quot;clean surplus relationship&quot; when using the residual income model for Topper Inc.?<\/p><\/div>", "subj": "equity"}, {"n": 51, "q": "An investor is considering the purchase of Microscopics, which has a price to book value (P/B) ratio of 4.00. Return on equity (ROE) is expected to be 12%, current book value per share is $12.00, and the cost of equity is 10%. What growth rate is implied by the current P/B rate?", "opts": ["9.33%.", "10.00%.", "0.67%."], "ans": "A", "expl": "The P/B ratio of 4.00 and the current book value per share of $12.00 imply a current market price of $48.00. This implies a growth rate of: g = r – [{B₀(ROE – r)} / {V₀ – B₀}] = 0.10 – [{12.00(0.12 – 0.10)} / {48.00 – 12.00}] = 0.0933 = 9.33%. Note that the reading in the curriculum does not provide this expression directly.", "explhtml": "<p>The P/B ratio of 4.00 and the current book value per share of $12.00 imply a current market price of $48.00. This implies a growth rate of:<\/p><p>g = r – [{B<sub>0<\/sub>(ROE – r)} / {V<sub>0<\/sub> – B<sub>0<\/sub>}] = 0.10 – [{12.00(0.12 – 0.10)} / {48.00 – 12.00}] = 0.0933 = 9.33%.<\/p><p>Note that the reading in the curriculum does not provide this expression directly.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.3, LOS 21.g<\/div><div class=\"qtext\"><p>An investor is considering the purchase of Microscopics, which has a price to book value (P/B) ratio of 4.00. Return on equity (ROE) is expected to be 12%, current book value per share is $12.00, and the cost of equity is 10%. What growth rate is implied by the current P/B rate?<\/p><\/div>", "subj": "equity"}, {"n": 52, "q": "The total cumulative present value of Raver Industries' projected residual income (RI) over the next five years is £60 per share. Beyond that time horizon, a key analyst projects that the firm will sustain a RI of £11 per share, which is the RI for year 5. Given a cost of equity of 12%, what is the terminal value of the stock as of year 5?", "opts": ["£91.67.", "£560.00.", "£500.00."], "ans": "A", "expl": "The stock's terminal value as of year 5 is: TV = 11.00 / 0.12 = 91.67", "explhtml": "<p>The stock&#x27;s terminal value as of year 5 is:<\/p><p>TV = 11.00 / 0.12 = 91.67<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.4, LOS 21.h<\/div><div class=\"qtext\"><p>The total cumulative present value of Raver Industries&#x27; projected residual income (RI) over the next five years is £60 per share. Beyond that time horizon, a key analyst projects that the firm will sustain a RI of £11 per share, which is the RI for year 5. Given a cost of equity of 12%, what is the terminal value of the stock as of year 5?<\/p><\/div>", "subj": "equity"}, {"n": 53, "q": "Which of the following is the most appropriate tool to measure managerial effectiveness, goodwill impairment, and equity value?", "opts": ["Residual income.", "Free cash flow to the firm.", "Gordon growth model."], "ans": "A", "expl": "Residual income is commonly used to measure managerial effectiveness, goodwill impairment and equity value. The Gordon Growth Model (GGM) would not be appropriate in instances where the underlying assumptions (such as stable growth in perpetuity) do not apply. Free cash flow to the firm and price to sales would often not be appropriate tools to measure goodwill impairment.", "explhtml": "<p>Residual income is commonly used to measure managerial effectiveness, goodwill impairment and equity value. The Gordon Growth Model (GGM) would not be appropriate in instances where the underlying assumptions (such as stable growth in perpetuity) do not apply. Free cash flow to the firm and price to sales would often not be appropriate tools to measure goodwill impairment.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.1, LOS 21.b<\/div><div class=\"qtext\"><p>Which of the following is the most appropriate tool to measure managerial effectiveness, goodwill impairment, and equity value?<\/p><\/div>", "subj": "equity"}, {"n": 54, "q": "The single-stage residual income model values a company at:", "opts": ["book value plus the present value of the firm’s expected economic profits.", "book value plus the terminal value discounted at the weighted average cost of capital.", "book value times a factor determined by the discount rate."], "ans": "A", "expl": "The single-stage residual income model values a company at book value plus the present value of the firm's economic profits, or the additional value generated by the firm's ability to produce returns higher than the cost of equity.", "explhtml": "<p>The single-stage residual income model values a company at book value plus the present value of the firm&#x27;s economic profits, or the additional value generated by the firm&#x27;s ability to produce returns higher than the cost of equity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.2, LOS 21.d<\/div><div class=\"qtext\"><p>The single-stage residual income model values a company at:<\/p><\/div>", "subj": "equity"}, {"n": 55, "q": "Which statement best describes the relationship between the residual income model and the free cash flow to equity model?", "opts": ["Intrinsic value calculated by both should be the same if the assumptions are the same.", "They do not rely on accounting assumptions.", "They both discount a future stream of cash flows."], "ans": "A", "expl": "Theoretically the intrinsic value calculated by both should be the same, but since they use different approaches the values are often different in practice. Residual income relies on book value and discounts income, not cash flow.", "explhtml": "<p>Theoretically the intrinsic value calculated by both should be the same, but since they use different approaches the values are often different in practice. Residual income relies on book value and discounts income, not cash flow.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.i<\/div><div class=\"qtext\"><p>Which statement best describes the relationship between the residual income model and the free cash flow to equity model?<\/p><\/div>", "subj": "equity"}, {"n": 56, "q": "An argument for using the residual income (RI) valuation approach is that:", "opts": ["the clean surplus relation fails to hold.", "the models rely on accounting data that can be manipulated by management.", "the models focus on economic rather than just on accounting profitability."], "ans": "C", "expl": "The models focus on economic rather than just on accounting profitability. Both remaining responses are arguments against using the RI approach.", "explhtml": "<p>The models focus on economic rather than just on accounting profitability. Both remaining responses are arguments against using the RI approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.i<\/div><div class=\"qtext\"><p>An argument for using the residual income (RI) valuation approach is that:<\/p><\/div>", "subj": "equity"}, {"n": 57, "q": "A residual income model would be least appropriate as a tool to measure which of the following?", "opts": ["Operating leverage.", "Economic income.", "Goodwill impairment."], "ans": "A", "expl": "Operating leverage is not measured directly by residual income models, although operating leverage may have an effect on the residual income measured. Residual income models are intended as a measure of economic income, and are often used to measure goodwill impairment.", "explhtml": "<p>Operating leverage is not measured directly by residual income models, although operating leverage may have an effect on the residual income measured. Residual income models are intended as a measure of economic income, and are often used to measure goodwill impairment.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.1, LOS 21.b<\/div><div class=\"qtext\"><p>A residual income model would be least appropriate as a tool to measure which of the following?<\/p><\/div>", "subj": "equity"}, {"n": 58, "q": "An investor is considering the purchase of Robust Econometrics, Inc., which has a price-to-book (P/B) value ratio of 4.50. Return on equity (ROE) is expected to be 14%, the current book value per share (BVPS) is Sf22.50, and the cost of equity is 12%. The growth rate implied by the current P/B ratio is closest to:", "opts": ["12.57%.", "8.00%.", "11.43%."], "ans": "C", "expl": "The P/B ratio of 4.50 and the current BVPS of Sf22.50 imply a market price of Sf101.25(4.5 × 22.5). This implies a growth rate of:", "explhtml": "<p>The P/B ratio of 4.50 and the current BVPS of Sf22.50 imply a market price of Sf101.25(4.5 × 22.5). This implies a growth rate of:<\/p><img class=\"pimg\" src=\"l2img/kq/r21-be2ea469b0.png\" style=\"max-width:min(100%,618px)\" loading=\"lazy\" alt=\"\">", "qhtml": "<div class=\"pp-topic\">Module 21.3, LOS 21.g<\/div><div class=\"qtext\"><p>An investor is considering the purchase of Robust Econometrics, Inc., which has a price-to-book (P/B) value ratio of 4.50. Return on equity (ROE) is expected to be 14%, the current book value per share (BVPS) is Sf22.50, and the cost of equity is 12%. The growth rate implied by the current P/B ratio is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 59, "q": "Assuming that the growth rate is less than the required rate of return (r), an increase in return on equity (ROE) will cause value in a residual income (RI) model to:", "opts": ["there is insufficient information to derive the effects of increasing ROE on RI.", "decrease if ROE is greater than the required rate of return.", "increase if ROE is greater than the required rate of return."], "ans": "C", "expl": "An increase (decrease) in ROE increases (decreases) value if the ROE exceeds the required rate of return. This is revealed by the RI valuation expression: V₀ = B₀ + [(ROE – r) / (r – g)]B₀", "explhtml": "<p>An increase (decrease) in ROE increases (decreases) value if the ROE exceeds the required rate of return. This is revealed by the RI valuation expression:<\/p><p>V<sub>0<\/sub> = B<sub>0<\/sub> + [(ROE – r) / (r – g)]B<sub>0<\/sub><\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.2, LOS 21.d<\/div><div class=\"qtext\"><p>Assuming that the growth rate is less than the required rate of return (r), an increase in return on equity (ROE) will cause value in a residual income (RI) model to:<\/p><\/div>", "subj": "equity"}, {"n": 60, "q": "Advanced Instruments reported the following for the end of its fiscal year: Revenues = $50.3 million. Earnings per share = $0.68. Dividends per share = $0.17. Shares outstanding = 5 million. Tax rate = 40%. Book value per share was $4 at the beginning of the year. If the required rate of return is 15%, what is the value of the shares using a single-stage residual income model?", "opts": ["$4.78.", "$7.56.", "$6.01."], "ans": "B", "expl": "Retention ratio = (0.68 – 0.17) / 0.68 = 0.75 or 75% ROE = $0.68 / $4.00 = 0.17 or 17% g = retention ratio × ROE = (0.75) × 0.17 = 0.1275 or 12.75% 0.17 - 0.15 V₀ = $4.00 +  (   × $4.00)  = $7.56 0.15 - 0.1275", "explhtml": "<p>Retention ratio = (0.68 – 0.17) / 0.68 = 0.75 or 75%<\/p><p>ROE = $0.68 / $4.00 = 0.17 or 17%<\/p><p>g = retention ratio × ROE = (0.75) × 0.17 = 0.1275 or 12.75%<\/p><p>0.17 - 0.15 V<sub>0<\/sub> = $4.00 +  ( &nbsp;  × $4.00)  = $7.56<\/p><p>0.15 - 0.1275<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.3, LOS 21.f<\/div><div class=\"qtext\"><p>Advanced Instruments reported the following for the end of its fiscal year:<\/p><p>Revenues = $50.3 million. Earnings per share = $0.68. Dividends per share = $0.17. Shares outstanding = 5 million. Tax rate = 40%.<\/p><p>Book value per share was $4 at the beginning of the year. If the required rate of return is 15%, what is the value of the shares using a single-stage residual income model?<\/p><\/div>", "subj": "equity"}, {"n": 61, "q": "The present value of Forman Electronics' projected residual income (RI) for the next five years is £80 per share. Beyond that time horizon a key analyst projects that the firm will sustain a RI of £17 per share, which is the RI for year 5. Given a cost of equity of 13%, what is the terminal value of the stock as of year 5?", "opts": ["£130.77.", "£19.96.", "£500.00."], "ans": "A", "expl": "The stock's terminal value as of year 5 is: TV = 17.00 / 0.13 = 130.77", "explhtml": "<p>The stock&#x27;s terminal value as of year 5 is:<\/p><p>TV = 17.00 / 0.13 = 130.77<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.4, LOS 21.h<\/div><div class=\"qtext\"><p>The present value of Forman Electronics&#x27; projected residual income (RI) for the next five years is £80 per share. Beyond that time horizon a key analyst projects that the firm will sustain a RI of £17 per share, which is the RI for year 5. Given a cost of equity of 13%, what is the terminal value of the stock as of year 5?<\/p><\/div>", "subj": "equity"}, {"n": 62, "q": "The residual income approach is NOT appropriate when:", "opts": ["the clean surplus accounting relation is violated significantly.", "expected free cash flows are negative for the foreseeable future.", "a firm does not pay dividends or the stream of payments is too volatile to be sufficiently predictable."], "ans": "A", "expl": "The residual income approach is not appropriate when the clean surplus accounting relation is violated significantly. Both remaining responses describe circumstances in which the approach is appropriate.", "explhtml": "<p>The residual income approach is not appropriate when the clean surplus accounting relation is violated significantly. Both remaining responses describe circumstances in which the approach is appropriate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.j<\/div><div class=\"qtext\"><p>The residual income approach is NOT appropriate when:<\/p><\/div>", "subj": "equity"}, {"n": 63, "q": "Red Shoes's recent financial statements reported a book value of $11.00 per share; its required rate of return is 9%. Analyst Tony Giancola, CFA, wants to calculate the company's intrinsic value using a multistage residual income with a high-growth RI for the next 5 years. Giancola creates the following estimates: PV of interim high-growth RI for the next 5 years is $ 2.90 At the end of year 5, the PV of continuing RI is $7.00 Estimated Book Value in 5 years is $14.00 Which of the following is closest to the current intrinsic value of Red Shoes?", "opts": ["$9.90.", "$18.45.", "$20.90."], "ans": "B", "expl": "Applying the multistage residual income model: V₀ = B₀ + PV of interim high-growth RI + PV of continuing RI = 11.00 + 2.90 + [(7.00) / (1.09)⁵] = $18.45", "explhtml": "<p>Applying the multistage residual income model:<\/p><p>V<sub>0<\/sub> = B<sub>0<\/sub> + PV of interim high-growth RI + PV of continuing RI<\/p><p>= 11.00 + 2.90 + [(7.00) / (1.09)<sup>5<\/sup>] = $18.45<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.2, LOS 21.c<\/div><div class=\"qtext\"><p>Red Shoes&#x27;s recent financial statements reported a book value of $11.00 per share; its required rate of return is 9%. Analyst Tony Giancola, CFA, wants to calculate the company&#x27;s intrinsic value using a multistage residual income with a high-growth RI for the next 5 years. Giancola creates the following estimates:<\/p><p>PV of interim high-growth RI for the next 5 years is $ 2.90 At the end of year 5, the PV of continuing RI is $7.00 Estimated Book Value in 5 years is $14.00<\/p><p>Which of the following is closest to the current intrinsic value of Red Shoes?<\/p><\/div>", "subj": "equity"}, {"n": 64, "q": "In a single-stage residual income model for a firm with return on equity (ROE) greater than the required rate of return, which statement is least accurate?", "opts": ["The justified price-to-book value (P/B) ratio will be greater than one.", "Market value will be greater than book value.", "Free cash flow to equity will be positive."], "ans": "C", "expl": "In a single-stage residual income model with ROE greater than the required rate of return, justified P/B will be greater than one and market value will be greater than book. There is no clear relationship with free cash flow to equity.", "explhtml": "<p>In a single-stage residual income model with ROE greater than the required rate of return, justified P/B will be greater than one and market value will be greater than book. There is no clear relationship with free cash flow to equity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.2, LOS 21.e<\/div><div class=\"qtext\"><p>In a single-stage residual income model for a firm with return on equity (ROE) greater than the required rate of return, which statement is least accurate?<\/p><\/div>", "subj": "equity"}, {"n": 65, "q": "An analyst is considering the purchase of Rylinks, Inc., which has a price to book value (P/B) ratio of 6.00. Return on equity (ROE) is expected to be 13%, current book value per share is $13.00, and the cost of equity is 11%. What growth rate is implied by the current P/B rate?", "opts": ["0.40%.", "11.00%.", "10.60%."], "ans": "C", "expl": "The P/B ratio of 6.00 and the current book value per share of $13.00 imply a current market price of $78.00. This implies a growth rate of: g = r – [{B₀(ROE – r)} / {V₀ – B₀}] = 0.11 – [{13.00(0.13 – 0.11)} / {78.00 – 13.00}] = 0.1060 = 10.60%. Note that the reading in the curriculum does not provide this expression directly.", "explhtml": "<p>The P/B ratio of 6.00 and the current book value per share of $13.00 imply a current market price of $78.00. This implies a growth rate of:<\/p><p>g = r – [{B<sub>0<\/sub>(ROE – r)} / {V<sub>0<\/sub> – B<sub>0<\/sub>}] = 0.11 – [{13.00(0.13 – 0.11)} / {78.00 – 13.00}] = 0.1060 = 10.60%.<\/p><p>Note that the reading in the curriculum does not provide this expression directly.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.3, LOS 21.g<\/div><div class=\"qtext\"><p>An analyst is considering the purchase of Rylinks, Inc., which has a price to book value (P/B) ratio of 6.00. Return on equity (ROE) is expected to be 13%, current book value per share is $13.00, and the cost of equity is 11%. What growth rate is implied by the current P/B rate?<\/p><\/div>", "subj": "equity"}, {"n": 66, "q": "The present value of GB Industries' projected residual income (RI) for the next five years is 70 per share. Beyond that time horizon, a key analyst projects that the firm will sustain a RI of 15 per share, which is the RI for year 5. Given a cost of equity of 12%, what is the terminal value of the stock as of year 5?", "opts": ["£560.00.", "£125.00.", "£500.00."], "ans": "B", "expl": "The stock's terminal value as of year 5 is: TV = 15.00/0.12 = 125.00", "explhtml": "<p>The stock&#x27;s terminal value as of year 5 is:<\/p><p>TV = 15.00/0.12 = 125.00<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.4, LOS 21.h<\/div><div class=\"qtext\"><p>The present value of GB Industries&#x27; projected residual income (RI) for the next five years is 70 per share. Beyond that time horizon, a key analyst projects that the firm will sustain a RI of 15 per share, which is the RI for year 5. Given a cost of equity of 12%, what is the terminal value of the stock as of year 5?<\/p><\/div>", "subj": "equity"}, {"n": 67, "q": "The residual income approach is appropriate when:", "opts": ["expected free cash flows are negative for the foreseeable future.", "a firm pays high dividends that are quite stable.", "the clean surplus accounting relation is violated significantly."], "ans": "A", "expl": "The residual income approach is appropriate when expected free cash flows are negative for the foreseeable future. It is not appropriate when the clean surplus accounting relation is violated significantly. A firm that pays high dividends that are quite stable is also a poor candidate for the approach.", "explhtml": "<p>The residual income approach is appropriate when expected free cash flows are negative for the foreseeable future. It is not appropriate when the clean surplus accounting relation is violated significantly. A firm that pays high dividends that are quite stable is also a poor candidate for the approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.j<\/div><div class=\"qtext\"><p>The residual income approach is appropriate when:<\/p><\/div>", "subj": "equity"}, {"n": 68, "q": "The residual income approach is appropriate when:", "opts": ["a firm does not pay dividends or the payments are too volatile to be sufficiently predictable.", "a firm pays high dividends that are quite stable.", "the clean surplus accounting relation is violated significantly."], "ans": "A", "expl": "The residual income approach is appropriate when a firm does not pay dividends or the payments are too volatile to be sufficiently predictable. It is not appropriate when the clean surplus accounting relation is violated significantly. A firm that pays high dividends that are quite stable is also a poor candidate for the approach.", "explhtml": "<p>The residual income approach is appropriate when a firm does not pay dividends or the payments are too volatile to be sufficiently predictable. It is not appropriate when the clean surplus accounting relation is violated significantly. A firm that pays high dividends that are quite stable is also a poor candidate for the approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.1, LOS 21.b<\/div><div class=\"qtext\"><p>The residual income approach is appropriate when:<\/p><\/div>", "subj": "equity"}, {"n": 69, "q": "Market value added is calculated as:", "opts": ["market value of the company minus total capital.", "net operating profit after taxes minus a charge for total capital.", "market value of the company minus a charge for equity capital."], "ans": "A", "expl": "Market value added is the market value of the company minus total capital. It is used to measure the effect on value of management's decisions since the firm's inception.", "explhtml": "<p>Market value added is the market value of the company minus total capital. It is used to measure the effect on value of management&#x27;s decisions since the firm&#x27;s inception.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Market value added is calculated as:<\/p><\/div>", "subj": "equity"}, {"n": 70, "q": "Which description of the relationship among residual income, dividend discount (DDM) and free cash flow to equity (FCFE) models is least accurate?", "opts": ["The different models should result in different intrinsic values because of the theoretical differences in the models.", "Residual income differs from DDM and FCFE in that residual income starts with book value.", "Residual income differs from DDM and FCFE in that it discounts income rather than cash."], "ans": "A", "expl": "The three models should all produce the same intrinsic value as long as the underlying assumptions are the same. The differences in intrinsic values arise from difficulty in estimating the inputs, not from theoretical differences in the models. Since they should produce the same results, they can be used to assess consistency. Residual income differs from DDM and FCFE in the use of accounting assumptions, including book value and discounting income.", "explhtml": "<p>The three models should all produce the same intrinsic value as long as the underlying assumptions are the same. The differences in intrinsic values arise from difficulty in estimating the inputs, not from theoretical differences in the models. Since they should produce the same results, they can be used to assess consistency. Residual income differs from DDM and FCFE in the use of accounting assumptions, including book value and discounting income.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.5, LOS 21.i<\/div><div class=\"qtext\"><p>Which description of the relationship among residual income, dividend discount (DDM) and free cash flow to equity (FCFE) models is least accurate?<\/p><\/div>", "subj": "equity"}, {"n": 71, "q": "Brown Manufacturing's recent financial statements reported a book value of $9.50 per share; its required rate of return is 10%. Analyst Tony Giancola, CFA, wants to calculate the company's intrinsic value using a multistage residual income with a high-growth RI for the next 5 years. Giancola creates the following estimates: PV of interim high-growth RI for the next 5 years is $3.10 At the end of year 5, the PV of continuing RI is $10.00 Estimated Book Value in 5 years is $25.00 Which of the following is closest to the current intrinsic value of Brown Manufacturing?", "opts": ["$22.60.", "$13.10.", "$18.81."], "ans": "C", "expl": "Applying the multistage residual income model: V₀ = B₀ + PV of interim high-growth RI + PV of continuing RI = 9.50 + 3.10 + [(10.00) / (1.10)⁵] = $18.81", "explhtml": "<p>Applying the multistage residual income model:<\/p><p>V<sub>0<\/sub> = B<sub>0<\/sub> + PV of interim high-growth RI + PV of continuing RI<\/p><p>= 9.50 + 3.10 + [(10.00) / (1.10)<sup>5<\/sup>] = $18.81<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.2, LOS 21.c<\/div><div class=\"qtext\"><p>Brown Manufacturing&#x27;s recent financial statements reported a book value of $9.50 per share; its required rate of return is 10%. Analyst Tony Giancola, CFA, wants to calculate the company&#x27;s intrinsic value using a multistage residual income with a high-growth RI for the next 5 years. Giancola creates the following estimates:<\/p><p>PV of interim high-growth RI for the next 5 years is $3.10 At the end of year 5, the PV of continuing RI is $10.00 Estimated Book Value in 5 years is $25.00<\/p><p>Which of the following is closest to the current intrinsic value of Brown Manufacturing?<\/p><\/div>", "subj": "equity"}, {"n": 72, "q": "A common adjustment in calculating economic value added (EVA®) is to:", "opts": ["treat capital leases as operating leases.", "capitalize and amortize research and development expenses.", "add back deferred taxes."], "ans": "B", "expl": "It is common to capitalize and amortize research and development (R&D) expenses and add R&D expenses back to earnings. Deferred taxes are eliminated to pick up only cash taxes. Operating leases are treated as capital leases.", "explhtml": "<p>It is common to capitalize and amortize research and development (R&amp;D) expenses and add R&amp;D expenses back to earnings. Deferred taxes are eliminated to pick up only cash taxes. Operating leases are treated as capital leases.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>A common adjustment in calculating economic value added (EVA<sup>®<\/sup>) is to:<\/p><\/div>", "subj": "equity"}, {"n": 73, "q": "Regarding their statements about the forecast error in residual income models and when they recognize value, who is correct? LaMarre  Hofstedt", "opts": ["Incorrect Incorrect", "Correct Correct", "Correct Incorrect"], "ans": "A", "expl": "LaMarre is incorrect that residual income models are less subject to forecast error in terminal value estimates than FCFE models because a large portion of intrinsic value in a residual income model is current book value. Hofstedt is incorrect because residual income models tend to recognize value earlier, not later, than other present value based approaches.", "explhtml": "<p>LaMarre is incorrect that residual income models are less subject to forecast error in terminal value estimates than FCFE models because a large portion of intrinsic value in a residual income model is current book value. Hofstedt is incorrect because residual income models tend to recognize value earlier, not later, than other present value based approaches.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 73–76<\/summary><div class=\"vig-body\"><p>Geremiah Analytics provides litigation consulting services to the intellectual property industry. They specialize in patent infringement liability and software valuation. Mariah Hofstedt, CFO of Geremiah, projects that the firm will earn $3 million pre-tax income this year. Additional selected financial data on Geremiah are presented below.<\/p><p>Table 1: Selected Financial Data for Geremiah Analytics<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v038.webp\" style=\"max-width:min(100%,359px)\" alt=\"Total assets $40 million 60% Debt/assets Average coupon on 8% debt 12% Cost of equity 40% Tax rate\"><p>Hofstedt has not been happy with the firm's financial performance. She would like to increase return on equity (ROE) and improve revenue growth, and is considering various ways to deploy Geremiah's cash flow in order to meet these two goals. One possibility is using some of Geremiah's cash flow to make a strategic acquisition.<\/p><p>Hofstedt has been looking at a smaller boutique firm, Logiciels LaMarre, which provides consulting services to the software industry. Hofstedt and a Geremiah Analytics valuation team have performed a preliminary valuation on Logiciels LaMarre using a free cash flow to equity (FCFE) model. However, Theodore LaMarre, CEO of Logiciels LaMarre, is not pleased with the resultant valuation that Geremiah has placed on his firm.<\/p><p>Rather than argue about the inputs of the free cash flow (FCF) model, LaMarre takes the position that FCFE is an inappropriate model for valuing Logiciels LaMarre. He cites the firm's rapid growth and resultant need for capital investment as reasons that valuing the firm on projections of FCFE is not reliable.<\/p><p>LaMarre wants Geremiah to value Logiciels LaMarre using the residual income approach.<\/p><p>LaMarre asserts, \"The fact that our terminal value can be calculated with a high degree of certainty makes the use of a residual value model more appropriate than use of a FCFE model.\" Hofstedt counters that the residual income approach is not in LaMarre's interest. She points out, \"Value tends to be recognized later in a residual income approach than in a FCFE approach.\" There is, however, one point on which LaMarre and Hofstedt agree. They both recognize that competitive forces in the industry will drive the current high ROE of Logiciels LaMarre down to the cost of equity capital over time. Hofstedt concludes, \"Given the assumption of a decline in ROE, we should use a persistence factor between zero and one.\" LaMarre disagrees, saying. \"The assumption about ROE means that the present value of the continuing residual income at Logiciels LaMarre is the current residual income divided by the cost of equity capital.<\/p><\/div><\/details><div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Regarding their statements about the forecast error in residual income models and when they recognize value, who is correct? LaMarre &nbsp; Hofstedt<\/p><\/div>", "subj": "equity"}, {"n": 74, "q": "Which of the following is least likely to characterize the difference between a residual income model and a FCFE model?", "opts": ["Terminal value represents a higher proportion of intrinsic value in a residual income model than in a dividend discount model (DDM).", "A residual income model is applicable to a firm that does not have FCF.", "Inputs to a residual income model are more easily manipulated by management."], "ans": "A", "expl": "Terminal value represents a lower, not higher, proportion of intrinsic value in a residual income model than in other present value based approaches. A residual income model is applicable to a firm that does not have FCF and relies on accounting data that is generally easily found. However, the accounting data used in a residual income model are more easily manipulated by management than cash flow data.", "explhtml": "<p>Terminal value represents a lower, not higher, proportion of intrinsic value in a residual income model than in other present value based approaches. A residual income model is applicable to a firm that does not have FCF and relies on accounting data that is generally easily found. However, the accounting data used in a residual income model are more easily manipulated by management than cash flow data.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 73–76<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Geremiah Analytics provides litigation consulting services to the intellectual property industry. They specialize in patent infringement liability and software valuation. Mariah Hofstedt, CFO of Geremiah, projects that the firm will earn $3 million pre-tax income this year. Additional selected financial data on Geremiah are presented below.<\/p><p>Table 1: Selected Financial Data for Geremiah Analytics<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v038.webp\" style=\"max-width:min(100%,359px)\" alt=\"Total assets $40 million 60% Debt/assets Average coupon on 8% debt 12% Cost of equity 40% Tax rate\"><p>Hofstedt has not been happy with the firm's financial performance. She would like to increase return on equity (ROE) and improve revenue growth, and is considering various ways to deploy Geremiah's cash flow in order to meet these two goals. One possibility is using some of Geremiah's cash flow to make a strategic acquisition.<\/p><p>Hofstedt has been looking at a smaller boutique firm, Logiciels LaMarre, which provides consulting services to the software industry. Hofstedt and a Geremiah Analytics valuation team have performed a preliminary valuation on Logiciels LaMarre using a free cash flow to equity (FCFE) model. However, Theodore LaMarre, CEO of Logiciels LaMarre, is not pleased with the resultant valuation that Geremiah has placed on his firm.<\/p><p>Rather than argue about the inputs of the free cash flow (FCF) model, LaMarre takes the position that FCFE is an inappropriate model for valuing Logiciels LaMarre. He cites the firm's rapid growth and resultant need for capital investment as reasons that valuing the firm on projections of FCFE is not reliable.<\/p><p>LaMarre wants Geremiah to value Logiciels LaMarre using the residual income approach.<\/p><p>LaMarre asserts, \"The fact that our terminal value can be calculated with a high degree of certainty makes the use of a residual value model more appropriate than use of a FCFE model.\" Hofstedt counters that the residual income approach is not in LaMarre's interest. She points out, \"Value tends to be recognized later in a residual income approach than in a FCFE approach.\" There is, however, one point on which LaMarre and Hofstedt agree. They both recognize that competitive forces in the industry will drive the current high ROE of Logiciels LaMarre down to the cost of equity capital over time. Hofstedt concludes, \"Given the assumption of a decline in ROE, we should use a persistence factor between zero and one.\" LaMarre disagrees, saying. \"The assumption about ROE means that the present value of the continuing residual income at Logiciels LaMarre is the current residual income divided by the cost of equity capital.<\/p><\/div><\/details><div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Which of the following is least likely to characterize the difference between a residual income model and a FCFE model?<\/p><\/div>", "subj": "equity"}, {"n": 75, "q": "The residual income of Geremiah Analytics is closest to:", "opts": ["−$120,000.", "$120,000.", "$1,080,000.00"], "ans": "A", "expl": "Geremiah's after-tax income is ($3 × (1 − 0.40)) = $1.8 million. They have ($40 × 0.60) = $24 million in debt and ($40 × (1 − 0.60)) = $16 million in equity. Their equity charge is ($16 × 0.12) = $1.92 million. Their residual income is ($1.8 − $1.92) = −$0.12 million, or −$120,000.", "explhtml": "<p>Geremiah&#x27;s after-tax income is ($3 × (1 − 0.40)) = $1.8 million. They have ($40 × 0.60) = $24 million in debt and ($40 × (1 − 0.60)) = $16 million in equity. Their equity charge is ($16 × 0.12) = $1.92 million. Their residual income is ($1.8 − $1.92) = −$0.12 million, or −$120,000.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 73–76<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Geremiah Analytics provides litigation consulting services to the intellectual property industry. They specialize in patent infringement liability and software valuation. Mariah Hofstedt, CFO of Geremiah, projects that the firm will earn $3 million pre-tax income this year. Additional selected financial data on Geremiah are presented below.<\/p><p>Table 1: Selected Financial Data for Geremiah Analytics<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v038.webp\" style=\"max-width:min(100%,359px)\" alt=\"Total assets $40 million 60% Debt/assets Average coupon on 8% debt 12% Cost of equity 40% Tax rate\"><p>Hofstedt has not been happy with the firm's financial performance. She would like to increase return on equity (ROE) and improve revenue growth, and is considering various ways to deploy Geremiah's cash flow in order to meet these two goals. One possibility is using some of Geremiah's cash flow to make a strategic acquisition.<\/p><p>Hofstedt has been looking at a smaller boutique firm, Logiciels LaMarre, which provides consulting services to the software industry. Hofstedt and a Geremiah Analytics valuation team have performed a preliminary valuation on Logiciels LaMarre using a free cash flow to equity (FCFE) model. However, Theodore LaMarre, CEO of Logiciels LaMarre, is not pleased with the resultant valuation that Geremiah has placed on his firm.<\/p><p>Rather than argue about the inputs of the free cash flow (FCF) model, LaMarre takes the position that FCFE is an inappropriate model for valuing Logiciels LaMarre. He cites the firm's rapid growth and resultant need for capital investment as reasons that valuing the firm on projections of FCFE is not reliable.<\/p><p>LaMarre wants Geremiah to value Logiciels LaMarre using the residual income approach.<\/p><p>LaMarre asserts, \"The fact that our terminal value can be calculated with a high degree of certainty makes the use of a residual value model more appropriate than use of a FCFE model.\" Hofstedt counters that the residual income approach is not in LaMarre's interest. She points out, \"Value tends to be recognized later in a residual income approach than in a FCFE approach.\" There is, however, one point on which LaMarre and Hofstedt agree. They both recognize that competitive forces in the industry will drive the current high ROE of Logiciels LaMarre down to the cost of equity capital over time. Hofstedt concludes, \"Given the assumption of a decline in ROE, we should use a persistence factor between zero and one.\" LaMarre disagrees, saying. \"The assumption about ROE means that the present value of the continuing residual income at Logiciels LaMarre is the current residual income divided by the cost of equity capital.<\/p><\/div><\/details><div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>The residual income of Geremiah Analytics is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 76, "q": "Regarding their statements about ROE and residual income, who is correct? LaMarre  Hofstedt", "opts": ["Correct Incorrect", "Incorrect Correct", "Correct Correct"], "ans": "B", "expl": "LaMarre is incorrect because the present value of the continuing residual income for a firm is equal to the current value divided by the return on equity when residual income continues indefinitely, which is not the case if ROE declines to the return on equity capital. Hofstedt is correct that ROE declining to the cost of equity capital implies a decline in residual income and thus a persistence factor between zero and one.", "explhtml": "<p>LaMarre is incorrect because the present value of the continuing residual income for a firm is equal to the current value divided by the return on equity when residual income continues indefinitely, which is not the case if ROE declines to the return on equity capital. Hofstedt is correct that ROE declining to the cost of equity capital implies a decline in residual income and thus a persistence factor between zero and one.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 73–76<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Geremiah Analytics provides litigation consulting services to the intellectual property industry. They specialize in patent infringement liability and software valuation. Mariah Hofstedt, CFO of Geremiah, projects that the firm will earn $3 million pre-tax income this year. Additional selected financial data on Geremiah are presented below.<\/p><p>Table 1: Selected Financial Data for Geremiah Analytics<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r21/v038.webp\" style=\"max-width:min(100%,359px)\" alt=\"Total assets $40 million 60% Debt/assets Average coupon on 8% debt 12% Cost of equity 40% Tax rate\"><p>Hofstedt has not been happy with the firm's financial performance. She would like to increase return on equity (ROE) and improve revenue growth, and is considering various ways to deploy Geremiah's cash flow in order to meet these two goals. One possibility is using some of Geremiah's cash flow to make a strategic acquisition.<\/p><p>Hofstedt has been looking at a smaller boutique firm, Logiciels LaMarre, which provides consulting services to the software industry. Hofstedt and a Geremiah Analytics valuation team have performed a preliminary valuation on Logiciels LaMarre using a free cash flow to equity (FCFE) model. However, Theodore LaMarre, CEO of Logiciels LaMarre, is not pleased with the resultant valuation that Geremiah has placed on his firm.<\/p><p>Rather than argue about the inputs of the free cash flow (FCF) model, LaMarre takes the position that FCFE is an inappropriate model for valuing Logiciels LaMarre. He cites the firm's rapid growth and resultant need for capital investment as reasons that valuing the firm on projections of FCFE is not reliable.<\/p><p>LaMarre wants Geremiah to value Logiciels LaMarre using the residual income approach.<\/p><p>LaMarre asserts, \"The fact that our terminal value can be calculated with a high degree of certainty makes the use of a residual value model more appropriate than use of a FCFE model.\" Hofstedt counters that the residual income approach is not in LaMarre's interest. She points out, \"Value tends to be recognized later in a residual income approach than in a FCFE approach.\" There is, however, one point on which LaMarre and Hofstedt agree. They both recognize that competitive forces in the industry will drive the current high ROE of Logiciels LaMarre down to the cost of equity capital over time. Hofstedt concludes, \"Given the assumption of a decline in ROE, we should use a persistence factor between zero and one.\" LaMarre disagrees, saying. \"The assumption about ROE means that the present value of the continuing residual income at Logiciels LaMarre is the current residual income divided by the cost of equity capital.<\/p><\/div><\/details><div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Regarding their statements about ROE and residual income, who is correct? LaMarre &nbsp; Hofstedt<\/p><\/div>", "subj": "equity"}];
const CFG = {"title": "Reading 21 — Residual Income Valuation", "subtitle": "CFA Level II · 76 câu · Kaplan Schweser QBank 2025 (48 câu đơn · 28 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
