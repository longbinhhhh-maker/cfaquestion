đây là\nnhững gì bạn nên sử dụng. Ngoài ra, nếu biết số dư vốn chủ sở hữu đầu kỳ và cuối kỳ, hãy sử dụng giá trị trung bình trong\nmẫu số.\ng = (0,6)(0,2) = 0,12 hoặc 12%\n(Mô-đun 46.2, LOS 46.h)"},{"n":100,"q":"According to the earnings multiplier model, which of the following factors is the least\nimportant in estimating a stock's price-to-earnings ratio? The:","opts":["historical dividend payout ratio.","expected dividend payout ratio.","estimated required rate of return on the stock."],"ans":"A","expl":"P/E = (D/E)/(k - g)\n11\ntrong đó:\nD/E = tỷ lệ chi trả cổ tức dự kiến\n11\nk = tỷ suất lợi nhuận yêu cầu ước tính trên cổ phiếu\ng = tốc độ tăng trưởng cổ tức dự kiến của cổ phiếu\nP/E nhạy cảm nhất với biến động của mẫu số.\n(Mô-đun 46.3, LOS 46.k)"},{"n":101,"q":"What is the value of a stock that paid a $0.25 dividend last year, if dividends are expected to\ngrow at a rate of 6% forever? Assume that the risk-free rate is 5%, the expected return on\nthe market is 10%, and the stock's beta is 0.5.","opts":["$3.53.","$16.67.","$17.67."],"ans":"C","expl":"Tỷ lệ chiết khấu là k = 0,05 + 0,5(0,10 – 0,05) = 0,075. Sử dụng mô hình chiết khấu cổ tức trong thời gian vô hạn\ne\nđể định giá cổ phiếu. Giá trị cổ phiếu = D / (k – g) = (0,25 × 1,06) / (0,075 – 0,06)\n1e\n= $17,67.\n(Mô-đun 46.2, LOS 46.h)"},{"n":102,"q":"Utilizing the infinite period dividend discount model, all else held equal, if the required rate\nof return (K) decreases, the model yields a price that is:\ne","opts":["increased, due to a smaller spread between required return and growth.","reduced, due to increased spread between growth and required return.","reduced, due to the reduction in discount rate."],"ans":"A","expl":"Mẫu số của DDM một giai đoạn là chênh lệch giữa lợi nhuận yêu cầu K và\ne\ntốc độ tăng trưởng dự kiến, g. Mẫu số càng nhỏ thì tất cả các giá trị khác đều bằng nhau thì giá trị tính toán\n càng lớn.\n(Mô-đun 46.2, LOS 46.h)"},{"n":103,"q":"Use the following data to analyze a stock's price earnings ratio (P/E ratio):\nThe stock's beta is 1.2.\nThe dividend payout ratio is 60%.\nThe stock's expected growth rate is 7%.\nThe risk free rate is 6% and the expected rate of return on the market is 13%.\nUsing the dividend discount model, the expected P/E ratio of the stock is closest to:","opts":["10.0.","5.4.","8.1."],"ans":"C","expl":"k = ER = Rf + Beta(RM – Rf) = 0,06 + (1,2)(0,13 – 0,06) = 0,144\nTỷ lệ chi trả cổ tức = 0,60\nP/E = div chi trả / (k – g) = 0,6 / (0,144 – 0,07) = 8,1\n(Mô-đun 46.3, LOS 46.k)"},{"n":104,"q":"Donna Drake is interested in a stock that is expected to pay a dividend of $1.50 in one year,\n$1.75 in two years, and $2.05 in three years. Drake expects to sell the stock for $43.87 after\nthree years, after which the dividend will grow at 7% annually. If Drake requires a 12% return\non the stock, the price she is willing to pay today is closest to:","opts":["$34.","$36.","$38."],"ans":"B","expl":"Tìm giá trị hiện tại của dòng tiền và cộng chúng lại với nhau.\nN = 1; I/Y = 12; FV = 1,50; CPT PV = 1,34\n→\nN = 2; I/Y = 12; FV = 1,75; CPT PV = 1,40\n→\nN = 3; I/Y = 12; FV = 2,05 + 43,87 = 45,92; CPT PV = 32,68\n→\ngiá cổ phiếu = $1,34 + $1,40 + $32,68 = $35,42\n(Mô-đun 46.2, LOS 46.h)"},{"n":105,"q":"Because of dividend displacement of earnings, the net effect on firm value of increasing the\ndividend payout ratio is:","opts":["indeterminate.","to decrease firm value.","to increase firm value."],"ans":"A","expl":"Tác động ròng lên giá trị công ty của việc tăng tỷ lệ chi trả cổ tức là không rõ ràng vì\ntác động tích cực của cổ tức lớn hơn có thể bị bù đắp bởi tác động tiêu cực đến tính bền vững của công ty\ntốc độ tăng trưởng. Nếu việc tăng tỷ lệ chi trả luôn làm tăng giá trị công ty thì tất cả các công ty sẽ có\ntỷ lệ chi trả 100%.\n(Module 46.3, LOS 46.k)"},{"n":106,"q":"A preferred stock's dividend is $5 and the firm's bonds currently yield 6.25%. The preferred\nshares are priced to yield 75 basis points below the bond yield. The price of the preferred is\nclosest to:","opts":["$5.00.","$80.00.","$90.91."],"ans":"C","expl":"Lợi suất cổ phiếu ưu đãi (K) = lợi suất trái phiếu – 0,75% = 6,25% – 0,75% = 5,5%\np\nGiá trị = cổ tức / K = $5 / 0,055 = $90,91.\np\n(Mô-đun 46.2, LOS 46.g)"},{"n":107,"q":"If a stock sells for $50 that has an expected annual dividend of $2 and has a sustainable\ngrowth rate of 5%, what is the market discount rate for this stock?","opts":["10.0%.","7.5%.","9.0%."],"ans":"C","expl":"k = [(D / P) + g] = [(2/50) + 0,05] = 0,09 hoặc 9,00%.\n(Mô-đun 46.2, LOS 46.h)"},{"n":108,"q":"Use the following information and the multi-period dividend discount model to find the\nvalue of Computech's common stock.\nLast year's dividend was $1.62.\nThe dividend is expected to grow at 12% for three years.\nThe growth rate of dividends after three years is expected to stabilize at 4%.\nThe required return for Computech's common stock is 15%.\nWhich of the following statements about Computech's stock is least accurate?","opts":["At the end of three years, Computech's stock will sell for $21.45.","The dividend at the end of year three is expected to be $2.28.","Computech's stock is currently worth $17.46."],"ans":"C","expl":"Cổ tức cho năm 1, 2 và 3 dự kiến ​​là ($1,62)(1,12) = $1,81; ($1,81)(1,12) =\n$2,03; và ($2,03)(1,12) = $2,27.\nCổ tức đầu tiên của giai đoạn tăng trưởng không đổi dự kiến ​​là $2,27(1,04) = $2,36. Vào\ncuối Năm 3, giá trị của cổ phiếu sẽ là:\n2,36\nP==21,45\n3\n0,15–0,04\nCổ phiếu hiện nên bán với giá:\n1.812.032.28+21.45\nP=++=18.71\n0\n1.15\n23\n1.151.15\n(Mô-đun 46.2, LOS 46.h)"},{"n":109,"q":"Given the following information, compute price/book value.\nBook value of assets = $550,000\nTotal sales = $200,000\nNet income = $20,000\nDividend payout ratio = 30%\nOperating cash flow = $40,000\nPrice per share = $100\nShares outstanding = 1000\nBook value of liabilities = $500,000","opts":["2.0X.","2.5X.","5.5X."],"ans":"A","expl":"Giá trị sổ sách của vốn chủ sở hữu = $550.000 - $500.000 = $50.000\nGiá trị thị trường của vốn chủ sở hữu = ($100)(1000) = $100.000\nGiá/Sách = $100.000/$50.000 = 2,0X\n(Mô-đun 46.3, LOS 46.k)"},{"n":110,"q":"Yong Kim, CFA, buys a preferred stock that has a 6% dividend yield (defined as the ratio of\nthe preferred dividend to the market price of the preferred stock). One year later, Kim sells\nthe stock when it is selling at a 5% dividend yield. The preferred stock pays a fixed annual\ndividend, which Kim received right before selling. What rate of return did Kim realize on his\ninvestment?","opts":["14%.","20%.","26%."],"ans":"C","expl":"Tiền cổ tức có thể ở bất kỳ mức nào. Giả sử nó là 1,00 USD.\nGiá mua là 1,00 / 0,06 = 16,667.\nGiá bán là 1,00 / 0,05 = 20.\nKim trả 16,667 và nhận 20,00 cộng với 1,00 cổ tức một năm sau đó. Tỷ lệ lợi nhuận là\n[(20 + 1)/16.667] − 1 = 26%.\n(Mô-đun 46.2, LOS 46.g)"},{"n":111,"q":"Use the following information to determine the value of River Gardens' common stock:\nExpected dividend payout ratio is 45%.\nExpected dividend growth rate is 6.5%.\nRiver Gardens' required return is 12.4%.\nExpected earnings per share next year are $3.25.","opts":["$27.25.","$30.12.","$24.80."],"ans":"C","expl":"Đầu tiên, hãy ước tính tỷ lệ giá trên thu nhập (P/E) là: (0,45) / (0,124 – 0,065) = 7,63. Sau đó, nhân\nthu nhập dự kiến với tỷ lệ P/E ước tính: ($3,25)(7,63) = $24,80.\n(Mô-đun 46.3, LOS 46.k)"},{"n":112,"q":"According to the earnings multiplier model, all else equal, as the required rate of return on a\nstock increases, the:","opts":["P/E ratio will decrease.","P/E ratio will increase.","earnings per share will increase."],"ans":"A","expl":"Theo mô hình hệ số nhân thu nhập, tỷ lệ P/E bằng P/E = (D/E)/(k – g). Khi\n0111e\nk tăng, P/E sẽ giảm, tất cả các yếu tố khác đều bằng nhau.\ne01\n(Mô-đun 46.3, LOS 46.k)"},{"n":113,"q":"A firm is expected to have four years of growth with a retention ratio of 100%. Afterwards\nthe firm's dividends are expected to grow 4% annually, and the dividend payout ratio will be\nset at 50%. If earnings per share (EPS) = $2.4 in year 5 and the required return on equity is\n10%, what is the stock's value today?","opts":["$13.66.","$30.00.","$20.00."],"ans":"A","expl":"Cổ tức năm 5 = (EPS)(tỷ lệ chi trả) = 2,4 × 0,5 = 1,2\nP = 1,2 / (0,1 – 0,04) = 1,2 / 0,06 = $20\n4\n4\nP = PV (P) = $20 / (1,10) = $13,66\n04\n(Mô-đun 46.2, LOS 46.h)"},{"n":114,"q":"Beth Knight, CFA, and David Royal, CFA, are independently analyzing the value of Bishop,\nInc., stock. Bishop paid a dividend of $1 last year. Knight expects the dividend to grow by\n10% in each of the next three years, after which it will grow at a constant rate of 4% per year.\nRoyal also expects a temporary growth rate of 10% followed by a constant growth rate of 4%,\nbut he expects the supernormal growth to last for only two years. Knight estimates that the\nrequired return on Bishop stock is 9%, but Royal believes the required return is 10%. Royal's\nvaluation of Bishop stock is approximately:","opts":["equal to Knight’s valuation.","$5 greater than Knight’s valuation.","$5 less than Knight’s valuation."],"ans":"C","expl":"Bạn có thể chọn câu trả lời đúng mà không cần tính giá trị chia sẻ. Royal đang sử dụng\nthời kỳ tăng trưởng siêu thường ngắn hơn và tỷ suất lợi nhuận yêu cầu cao hơn đối với cổ phiếu. Cả hai\ncủa những yếu tố này sẽ góp phần tạo ra giá trị thấp hơn khi sử dụng DDM nhiều tầng.\n3\n[$1(1.10)(1.04)]/(0,09–0,04)\n23\n$1(1.10)$1(1.10)$1(1.10)\nKnight: +++=$24.43\n1.09\n233\n1.091.091.09\n2\n[$1(1.10)(1.04)]/(0.10–0.04)\n2\n$1(1.10)$1(1.10)\nRoyal:++=$19.33\n1.10\n22\n1.101.10\nĐịnh giá của Royal thấp hơn 5,10 USD so với định giá của Knight.\n(Mô-đun 46.2, LOS 46.h)"},{"n":115,"q":"One advantage of using price-to-book value (PBV) multiples for stock valuation is that:","opts":["book value of a firm can never be negative.","most of the time it is close to the market value.","it is a stable and simple benchmark for comparison to the market price."],"ans":"C","expl":"Giá trị sổ sách cung cấp thước đo giá trị tương đối ổn định có thể so sánh với giá thị trường\n. Đối với những nhà đầu tư không tin tưởng vào ước tính giá trị của dòng tiền chiết khấu, nó cung cấp một\nđiểm chuẩn đơn giản hơn nhiều để so sánh. Giá trị sổ sách có thể gần hoặc không gần với giá trị thị trường\n. Một công ty có thể có giá trị sổ sách âm nếu nó thể hiện các khoản lỗ kế toán một cách nhất quán.\n(Module 46.3, LOS 46.j)"},{"n":116,"q":"The free cash flow to equity model is best described as a(n):","opts":["enterprise value model.","present value model.","single-factor model."],"ans":"B","expl":"Mô hình dòng tiền tự do đến vốn chủ sở hữu là một loại mô hình giá trị hiện tại hoặc mô hình dòng tiền chiết khấu\n. Nó ước tính giá trị của một cổ phiếu là giá trị hiện tại của tiền mặt có sẵn cho các cổ đông phổ thông\n. Mô hình giá trị doanh nghiệp là một ví dụ về mô hình cấp số nhân.\n(Mô-đun 46.1, LOS 46.b)"},{"n":117,"q":"Assume the Wansch Corporation is expected to pay a dividend of $2.25 per share this year.\nSales and profit for Wansch are forecasted to grow at a rate of 20% for two years after that,\nthen grow at 5% per year forever. Dividend and sales growth are expected to be equal. If\nWansch's shareholders require a 15% return, the per-share value of Wansch's common stock\nbased on the dividend discount model is closest to:","opts":["$22.75.","$28.50.","$26.00."],"ans":"B","expl":"2\n$2,25(1,2)(1,05)\nD\n4\nP===$34,02\n3k–g0,15–0,05\n2\n$2,25(1,2)\n$2,25(1,2)+$34,02\n$2,25\nP=++=$28,50\n01,15\n23\n1.151.15\n(Mô-đun 46.2, LOS 46.h)"},{"n":118,"q":"Other things equal, the effect of a stock split on shareholder wealth is to:","opts":["decrease it.","leave it unchanged.","increase it."],"ans":"B","expl":"Việc chia tách cổ phiếu chia mỗi cổ phiếu hiện có thành nhiều cổ phiếu. Các điều kiện khác không đổi, giá của\nmỗi cổ phiếu giảm tỷ lệ thuận với số lượng cổ phiếu được tạo ra, dẫn đến tài sản của chủ sở hữu không thay đổi\n.\n(Module 46.1, LOS 46.c)"},{"n":119,"q":"Bybee is expected to have a temporary supernormal growth period and then level off to a\n\"normal,\" sustainable growth rate forever. The supernormal growth is expected to be 25\npercent for 2 years, 20 percent for one year and then level off to a normal growth rate of 8\npercent forever. The market requires a 14 percent return on the company and the company\nlast paid a $2.00 dividend. What would the market be willing to pay for the stock today?","opts":["$52.69.","$67.50.","$47.09."],"ans":"A","expl":"Đầu tiên, hãy tìm cổ tức trong tương lai ở (các) tốc độ tăng trưởng siêu thường. Tiếp theo, sử dụng mô hình chiết khấu cổ tức trong khoảng thời gian vô hạn\nđể tìm mức giá dự kiến ​​sau khi giai đoạn tăng trưởng bất thường\nkết thúc. Thứ ba, tìm giá trị hiện tại của dòng tiền.\nD = 2,00(1,25) = 2,50\nD = 2,50(1,25) = 3,125\n2\nD = 3,125(1,20) = 3,75\n3\nD = 3,75(1,08) = 4,05\n4\n4,05\nP==67,50\n3\n(0,14–0,08)\n3,75+67,50\n2.503.125\nP=++=52.69\n0\n1.1423\n1.141.14\n(Mô-đun 46.2, LOS 46.h)"},{"n":120,"q":"A valuation model based on the cash flows that a firm will have available to pay dividends in\nthe future is best characterized as a(n):","opts":["free cash flow to equity model.","free cash flow to the firm model.","infinite period dividend discount model."],"ans":"A","expl":"Dòng tiền tự do vào vốn chủ sở hữu thể hiện khả năng trả cổ tức trong tương lai của một công ty. Dòng tiền tự do\nmô hình vốn chủ sở hữu ước tính FCFE của công ty trong các giai đoạn trong tương lai và định giá cổ phiếu là\ngiá trị hiện tại của FCFE tương lai trên mỗi cổ phiếu của công ty.\n(Module 46.2, LOS 46.e)"},{"n":121,"q":"Asset-based models are most appropriate when examining firms:","opts":["with the same stock prices.","that hold primarily liquid assets.","with older assets compared to those with newer assets."],"ans":"B","expl":"Phân tích dựa trên tài sản phù hợp nhất với các công ty chủ yếu nắm giữ tài sản ngắn hạn hữu hình và\ntài sản có giá trị thị trường sẵn có.\n(Học phần 46.3, LOS 46.f)"},{"n":122,"q":"The constant-growth dividend discount model would typically be most appropriate in valuing\na stock of a:","opts":["company in a mature-stage industry.","rapidly growing company.","new venture expected to retain all earnings for several years."],"ans":"A","expl":"Các công ty đang ở giai đoạn trưởng thành của vòng đời ngành có nhiều khả năng phù hợp nhất với\ngiả định về mô hình chiết khấu cổ tức tăng trưởng liên tục.\nDDM tăng trưởng không đổi có các giả định sau:\nCổ phiếu trả cổ tức với tốc độ không đổi.\nTốc độ tăng trưởng không đổi, g, tiếp tục trong một khoảng thời gian vô hạn.\nLợi nhuận yêu cầu trên vốn chủ sở hữu, k, phải lớn hơn g.\nDDM tăng trưởng không đổi dường như không phù hợp để định giá các công ty tăng trưởng. Một\nmô hình chiết khấu cổ tức nhiều tầng tính đến giai đoạn tăng trưởng bất thường có thể\nphù hợp hơn.\n(Mô-đun 46.2, LOS 46.i)"},{"n":123,"q":"A firm pays an annual dividend of $1.15. The risk-free rate (RF) is 2.5%, and the total risk\npremium (RP) for the stock is 7%. What is the value of the stock, if the dividend is expected\nto remain constant?","opts":["$25.00.","$12.10.","$16.03."],"ans":"B","expl":"Nếu cổ tức không đổi, g = 0.\nP = D / (k-g) = 1,15 / (0,095 - 0) = $12,10\n(Mô-đun 46.2, LOS 46.h)"},{"n":124,"q":"A firm has a return on equity (ROE) of 15% and a dividend payout rate of 80%. If last year's\ndividend was $0.80 and the required return on equity is 10%, the stock price today is closest\nto:","opts":["$10.87.","$9.96.","$11.77."],"ans":"C","expl":"Tốc độ tăng trưởng cổ tức dự kiến ​​là tỷ lệ giữ lại (RR) nhân với lợi tức trên\nphần vốn chủ sở hữu của các khoản đầu tư mới (ROE), g = (RR)(ROE). Tỷ lệ duy trì là 1 trừ đi\ntỷ lệ xuất chi.\nRR = 1 – 0,80 = 0,20.\ng = (0,20)(0,15)= 3,0%.\nGiá trị của cổ phiếu sẽ là cổ tức được trả vào năm tới chia cho tỷ lệ lợi nhuận\nyêu cầu trừ đi mức tăng trưởng tỷ lệ. Cổ tức năm tới là 0,80 USD × 1,03 = 0,824 USD. Vì vậy giá trị là\n0,824 / (0,10 – 0,03) = 0,824 / 0,07 = $11,77.\n(Mô-đun 46.2, LOS 46.h)"},{"n":125,"q":"If the expected dividend payout ratio of a firm is expected to rise from 50 percent to 55\npercent, the cost of equity is expected to increase from 10 percent to 11 percent, and the\nfirm's growth rate remains at 5 percent, what will happen to the firm's price-to-equity (P/E)\nratio? It will:","opts":["be unchanged.","increase.","decline."],"ans":"C","expl":"Tiền xuất chi tăng từ 50% lên 55%, chi phí vốn cổ phần tăng từ 10% lên 11% và tốc độ tăng trưởng cổ tức\nvẫn ở mức 5%, P/E sẽ thay đổi từ 10 thành 9,16:\nP/E = (D/E) / (k – g).\nP/E = 0,50 / (0,10 – 0,05) = 10.\n0\nP/E = 0,55 / (0,11 – 0,05) = 9.16.\n(Mô-đun 46.3, LOS 46.k)"},{"n":126,"q":"All else equal, if a firm's return on equity (ROE) increases, the stock's value as estimated by\nthe constant growth dividend discount model (DDM) will most likely:","opts":["decrease.","not change.","increase."],"ans":"C","expl":"Tăng ROE: ROE là một thành phần của g. Khi g tăng, chênh lệch giữa k và g, hay\ne\nmẫu số P/E sẽ giảm và tỷ lệ P/E sẽ tăng.\n(Mô-đun 46.3, LOS 46.k)"},{"n":127,"q":"The yield on a company's 7.5%, $50 par preferred stock is 6%. The value of the preferred\nstock is closest to:","opts":["$12.50.","$50.00.","$62.50."],"ans":"C","expl":"Cổ tức ưu đãi là 0,075($50) = 3,75 USD. Giá trị ưu tiên = $3,75 / 0,06 =\n$62,50.\n(Mô-đun 46.2, LOS 46.g)"},{"n":128,"q":"A stock is expected to pay a dividend of $1.50 at the end of each of the next three years. At\nthe end of three years the stock price is expected to be $25. The equity discount rate is 16\npercent. What is the current stock price?","opts":["$19.39.","$17.18.","$24.92."],"ans":"A","expl":"Giá trị của cổ phiếu hôm nay là giá trị hiện tại của cổ tức và giá cổ phiếu dự kiến\n, được chiết khấu theo tỷ lệ chiết khấu vốn cổ phần:\n233\n$1,50/1,16 + $1,50/1,16 + $1,50/1,16 + $25,00/1,16 = $19,39\n(Mô-đun 46.2, LOS 46.h)"},{"n":129,"q":"James Fry, CFA, is evaluating the potential investment merit of Cushing Corporation. Fry\nforecasts that Cushing's earnings next year will be $4.70 and it will pay a $1.65 dividend. Fry\nestimates Cushing's future growth rate will be 10%, with a required rate of return of 12%.\nBased on the information provided, Cushing's leading price to earnings (P/E) ratio is closest\nto:","opts":["15.0.","15.9.","17.6."],"ans":"C","expl":"D = 1,5 × 1,1 = 1,65\nD\n()\n1,65\n⎛⎞\nP\n0,351\nE\n0\n14,70\n==⎜⎟=()=17.6\n0,02\nE(k−g)(0,12−0,10)\n⎝⎠\n(Mô-đun 46.3, LOS 46.k)"},{"n":130,"q":"The preferred stock of the Delco Investments Company has a par value of $150 and a\ndividend of $11.50. A shareholder's required return on this stock is 14%. What is the\nmaximum price he would pay?","opts":["$150.00.","$54.76.","$82.14."],"ans":"C","expl":"Giá trị ưu tiên = D / kp = $11,50 / 0,14 = $82,14\n(Mô-đun 46.2, LOS 46.g)"},{"n":131,"q":"The last dividend paid on a common stock was $2.00, the growth rate is 5% and investors\nrequire a 10% return. Using the infinite period dividend discount model, calculate the value\nof the stock.","opts":["$13.33.","$42.00.","$40.00."],"ans":"B","expl":"2(1,05) / (0,10 - 0,05) = $42,00\n(Mô-đun 46.2, LOS 46.h)"},{"n":132,"q":"A company's payout ratio is 0.45 and its expected return on equity (ROE) is 23%. What is the\ncompany's implied growth rate in dividends?","opts":["10.35%.","12.65%.","4.16%."],"ans":"B","expl":"Tốc độ tăng trưởng = (ROE)(1 – Tỷ lệ chi trả) = (0,23)(0,55) = 12,65%\n(Mô-đun 46.2, LOS 46.h)"},{"n":133,"q":"Jaylin Company declares a dividend that will be paid on August 28. The holder-of-record date\nis August 16. Will an investor who buys Jaylin stock on August 15 receive this dividend?","opts":["No.","Yes, because the purchase occurs before the payment date.","Yes, because the purchase occurs before the holder-of-record date."],"ans":"A","expl":"Cổ phiếu sẽ giao dịch không hưởng cổ tức một hoặc hai ngày làm việc trước đó ngày lưu giữ hồ sơ.\n(Mô-đun 46.1, LOS 46.d)"},{"n":134,"q":"One advantage to using the price/book value (P/B) ratio over using the price/earnings (P/E)\nratio is that P/B can be used when:","opts":["earnings are negative.","the firm is in a slow growth phase.","stock markets are volatile."],"ans":"A","expl":"Khi thu nhập âm, không thể sử dụng tỷ lệ P/E nhưng Tỷ lệ P/B có thể được sử dụng.\ntốc độ tăng trưởng và sự biến động của thị trường không cho thấy lợi ích của việc sử dụng tỷ lệ P/B\nhơn là tỷ lệ P/E.\n(Module 46.3, LOS 46.f)"},{"n":135,"q":"Shareholders selling shares between the ex-dividend date and holder-of-record date:","opts":["do not receive the dividend, which is paid to the share buyer.","do not receive the dividend, which stays with the company.","receive the dividend."],"ans":"C","expl":"Ngày lưu giữ hồ sơ là ngày mà các cổ đông trong hồ sơ được chỉ định\nnhận cổ tức. Cổ phiếu được bán vào hoặc sau ngày không hưởng cổ tức sẽ được bán mà không yêu cầu\ncổ tức, ngay cả khi chúng được bán trước ngày ghi nhận cổ tức. Cổ tức sẽ được trả cho\nngười sở hữu kể từ khi kết thúc giao dịch vào ngày trước ngày không hưởng cổ tức.\n(Mô-đun 46.1, LOS 46.d)"},{"n":136,"q":"A company's required return on equity is 15% and its dividend payout ratio is 55%. If its\nreturn on equity (ROE) is 17% and its beta is 1.40, then its sustainable growth rate is closest\nto:","opts":["7.65%.","9.35%.","6.75%."],"ans":"A","expl":"Tốc độ tăng trưởng = (ROE)(Tỷ lệ duy trì)\n= (0,17)(0,45)\n= 0,0765 hoặc 7,65%\n(Mô-đun 46.2, LOS 46.h)"},{"n":137,"q":"The Sustainable Growth Rate is equal to:","opts":["(ROE) × (RR).","(ROE) × (1-RR).","(ROE) × (1+RR)."],"ans":"A","expl":"Tốc độ tăng trưởng bền vững bằng lợi tức trên phần vốn chủ sở hữu của các khoản đầu tư mới\n(ROE) nhân với tỷ lệ giữ lại (RR) của công ty.\n(Module 46.2, LOS 46.h)"}];
const CFG = {"title": "Equity Valuation Concepts and Basic Tools", "subtitle": "CFA · Equity Investments · Reading 46 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;

        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';

      .catch(function(){});

    for(var i=0;i<70;i++){(function(){

})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
