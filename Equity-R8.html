<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Baker Computer earned $6.00 per share last year, has a retention ratio of 55%, and a return\non equity (ROE) of 20%. Assuming their required rate of return is 15%, how much would an\ninvestor pay for Baker on the basis of the earnings multiplier model?","opts":["$74.93.","$40.00.","$173.90."],"ans":"A","expl":"g = Tỷ lệ giữ chân × ROE = (0,55) × (0,2) = 0,11\nP/E = 0,45 / (0,15) – 0,11) = 11,25\n01\nThu nhập năm tới E = E × (1 + g) = (6,00) × (1,11) = $6,66\n10\nP = 11,25($6,66) = $74,93\n0\n(Mô-đun 46.3, LOS 46.k)"},{"n":2,"q":"According to the earnings multiplier model, a stock's P/E ratio (P/E) is affected by all of the\n01\nfollowing EXCEPT the:","opts":["expected stock price in one year.","required return on equity.","expected dividend payout ratio."],"ans":"A","expl":"Theo mô hình hệ số nhân thu nhập, tỷ lệ P/E bằng P/E = (D/E)/(k - g).\n0111e\nDo đó, tỷ lệ P/E được xác định bởi:\nTỷ lệ chi trả cổ tức dự kiến (D/E).\n11\nTỷ suất lợi nhuận yêu cầu trên cổ phiếu (k).\ne\nTốc độ tăng trưởng cổ tức dự kiến (g).\n(Học phần 46.3, LOS 46.k)"},{"n":3,"q":"Which of the following shows the dividend payment chronology in its proper sequence?","opts":["Declaration date, ex-dividend date, holder-of-record date, payment date.","Declaration date, holder-of-record date, ex-dividend date, payment date.","Ex-dividend date, holder-of-record date, declaration date, payment date."],"ans":"A","expl":"Tiến trình thanh toán cổ tức bắt đầu bằng việc ban giám đốc\ntuyên bố chia cổ tức. Ngày giao dịch không hưởng quyền cổ tức xảy ra một hoặc hai ngày làm việc trước ngày\ncủa người nắm giữ hồ sơ.\n(Mô-đun 46.1, LOS 46.d)"},{"n":4,"q":"An asset-based valuation model is most appropriate for a company that:","opts":["has a high proportion of intangible assets among its total assets.","is expected to remain profitable for the foreseeable future.","is likely to be liquidated."],"ans":"C","expl":"Đối với các công ty có khả năng bị thanh lý, phương pháp dựa trên tài sản có thể là\ngiá trị phù hợp nhất vì tài sản có thể có giá trị hơn đối với một thực thể khác. Các mô hình định giá dựa trên tài sản\nkhông hoạt động tốt đối với các công ty có số lượng lớn tài sản vô hình. Bởi vì\nđịnh giá dựa trên tài sản không mang tính hướng tới tương lai nên cách tiếp cận dựa trên tài sản có thể đánh giá thấp\ngiá trị của các công ty dự kiến sẽ sinh lời.\n(Học phần 46.3, LOS 46.m)"},{"n":5,"q":"If the return on equity for a firm is 15% and the retention rate is 40%, the firm's sustainable\ngrowth rate is closest to:","opts":["6%.","9%.","15%."],"ans":"A","expl":"g = (RR)(ROE)\n= (0,15)(0,40)\n= 0,06 hoặc 6%\n(Mô-đun 46.2, LOS 46.h)"},{"n":6,"q":"An analyst gathered the following information about an industry. The industry beta is 0.9.\nThe industry profit margin is 8%, the total asset turnover ratio is 1.5, and the leverage\nmultiplier is 2. The dividend payout ratio of the industry is 50%. The risk-free rate is 7% and\nthe expected market return is 15%. The industry P/E is closest to:","opts":["12.00.","14.20.","22.73."],"ans":"C","expl":"Sử dụng CAPM: k = 7% + 0,9(0,15 – 0,07) = 14,2%.\nSử dụng phương trình DuPont: ROE = 8% × 1,5 × 2 = 24%.\ng = tỷ lệ giữ chân × ROE = 0,50 × 24% = 12%.\nP/E = 0,5/(0,142 – 0,12) = 22.73.\n(Mô-đun 46.3, LOS 46.k)"},{"n":7,"q":"Given the following estimated financial results for the next period, value the stock of\nFishnChips, Inc., using the infinite period dividend discount model (DDM).\nSales of $1,000,000.\nEarnings of $150,000.\nTotal assets of $800,000.\nEquity of $400,000.\nDividend payout ratio of 60.0%.\nAverage shares outstanding of 75,000.\nReal risk free interest rate of 4.0%.\nExpected inflation rate of 3.0%.\nExpected market return of 13.0%.\nStock Beta at 2.1.\nThe per share value of FishnChips stock is approximately: (Note: Carry calculations out to at\nleast 3 decimal places.)","opts":["$17.91.","$26.86.","$30.89."],"ans":"B","expl":"Tại đây, chúng tôi được cung cấp tất cả thông tin đầu vào mà chúng tôi cần. Hãy sử dụng các bước sau để tính giá trị của\nstock:\nĐầu tiên, mở rộng khoảng thời gian vô hạn DDM:\nCông thức DDM: P = D / (k – g)\n01e\nD\n= (Thu nhập × Tỷ lệ xuất chi) / số lượng cổ phiếu lưu hành trung bình\n= ($150.000 × 0,60) / 75.000 = $1,20\nk\n= lãi suất phi rủi ro danh nghĩa + [beta × (lợi nhuận thị trường dự kiến – lãi suất phi rủi ro danh nghĩa)]\ne\nLưu ý: Lãi suất phi rủi ro danh nghĩa= (1 + lãi suất phi rủi ro thực) × (1 + lạm phát dự kiến) – 1\n= (1,04)×(1,03) – 1 = 0,0712 hoặc 7,12%.\nk\n= 7,12% + [2,1 × (13,0% − 7,12%)] = 0,19468\ne\ng= (tỷ lệ giữ lại × ROE)\nTỷ lệ giữ lại= (1 – Xuất chi) = 1 – 0,60 = 0,40.\nROE= (thu nhập ròng / doanh thu)(doanh thu / tổng tài sản)(tổng tài sản / vốn chủ sở hữu)\n= (150.000 / 1.000.000)(1.000.000 / 800.000)(800.000 /\n400.000)\n= 0,375\ng= 0,375 × 0,40 = 0,15\nSau đó, tính: P = D / (k – g) = $1,20 / (0,19468 – 0,15) = 26,86.\n01e\n(Mô-đun 46.2, LOS 46.h)"},{"n":8,"q":"An equity valuation model that values a firm based on the market value of its outstanding\ndebt and equity securities, relative to a firm fundamental, is best described as:","opts":["an asset-based model.","an enterprise value model.","a discounted cash flow model."],"ans":"B","expl":"Mô hình giá trị doanh nghiệp liên quan đến giá trị doanh nghiệp của một công ty (giá trị thị trường của\ncổ phiếu tồn đọng và chứng khoán nợ trừ đi tiền mặt và chứng khoán có thể bán được) với\ncủa công ty đó EBITDA, thu nhập hoạt động hoặc doanh thu.\n(Mô-đun 46.1, LOS 46.b)"},{"n":9,"q":"An analyst gathered the following data:\nAn earnings retention rate of 40%.\nAn ROE of 12%.\nThe stock's beta is 1.2.\nThe nominal risk free rate is 6%.\nThe expected market return is 11%.\nAssuming next year's earnings will be $4 per share, the stock's current value is closest to:","opts":["$33.32.","$45.45.","$26.67."],"ans":"A","expl":"Chi trả cổ tức = 1 – tỷ lệ duy trì thu nhập = 1 – 0,4 = 0,6\nR = R + β(R – R) = 0,06 + 1,2(0,11 – 0,06) = 0,12\nSfMf\ng = (tỷ lệ duy trì)(ROE) = (0,4)(0,12) = 0,048\nD = E × tỷ lệ thanh toán = 4,00 USD × 0,60 = 2,40 USD\n11\nGiá = D / (k – g) = 2,40 USD / (0,12 – 0,048) = 33,32 USD\n(Mô-đun 46.3, LOS 46.k)"},{"n":10,"q":"Assume that at the end of the next year, Company A will pay a $2.00 dividend per share, an\nincrease from the current dividend of $1.50 per share. After that, the dividend is expected to\nincrease at a constant rate of 5%. If an investor requires a 12% return on the stock, what is\nthe value of the stock?","opts":["$28.57.","$30.00.","$31.78."],"ans":"A","expl":"P = D / k – g\n01\nD = $2\ng = 0,05\nk = 0,12\nP = 2 / 0,12 – 0,05 = 2 / 0,07 = $28,57\n0\n(Mô-đun 46.2, LOS 46.h)"},{"n":11,"q":"A firm will not pay dividends until four years from now. Starting in year four dividends will be\n$2.20 per share, the retention ratio will be 40%, and ROE will be 15%. If k = 10%, what should\nbe the value of the stock?","opts":["$41.32.","$55.25.","$58.89."],"ans":"A","expl":"g = ROE × tỷ lệ giữ chân = ROE × b = 15 × 0,4 = 6%\nDựa trên tốc độ tăng trưởng, chúng tôi có thể tính giá dự kiến trong năm 3:\nP = D / (k – g) = 2,2 / (0,10 – 0,06) = $55\n34\nGiá trị cổ phiếu hôm nay là:\nP = PV (55) ở mức 10% trong 3 kỳ = $41,32\n0\n(Mô-đun 46.2, LOS 46.h)"},{"n":12,"q":"Given the following information, compute price/sales.\nBook value of assets = $550,000.\nTotal sales = $200,000.\nNet income = $20,000.\nDividend payout ratio = 30%.\nOperating cash flow = $40,000.\nPrice per share = $100.\nShares outstanding = 1,000.\nBook value of liabilities = $500,000.","opts":["2.50X.","2.00X.","0.50X."],"ans":"C","expl":"Giá trị thị trường của vốn chủ sở hữu = ($100)(1000) = $100.000\nGiá / Doanh số = $100.000 / $200.000 = 0,5X\n(Mô-đun 46.3, LOS 46.k)"},{"n":13,"q":"Which of the following statements about the constant growth dividend discount model\n(DDM) in its application to investment analysis is least accurate? The model:","opts":["can’t be applied when g > K.","is best applied to young, rapidly growing firms.","is inappropriate for firms with variable dividend growth."],"ans":"B","expl":"Mô hình này được sử dụng phù hợp nhất khi công ty đã trưởng thành, với tốc độ tăng trưởng vừa phải,\ntrả một dòng cổ tức liên tục. Để mô hình tạo ra kết quả hữu hạn,\ntốc độ tăng trưởng của công ty không được vượt quá tỷ suất lợi nhuận yêu cầu.\n(Mô-đun 46.2, LOS 46.i)"},{"n":14,"q":"When a company's return on equity (ROE) is 12% and the dividend payout ratio is 60%, what\nis the implied sustainable growth rate of earnings and dividends?","opts":["4.0%.","4.8%.","7.8%."],"ans":"B","expl":"g = ROE × tỷ lệ giữ chân = ROE × (1 – tỷ lệ chi trả) = 12 (0,4) = 4,8%\n(Mô-đun 46.2, LOS 46.h)"},{"n":15,"q":"A payment to shareholders in the form of additional shares instead of cash is most\naccurately characterized as a:","opts":["private placement.","stock dividend.","stock split."],"ans":"B","expl":"Cổ tức bằng cổ phiếu là cổ tức được trả bằng cổ phiếu mới thay vì tiền mặt. Mặc dù việc chia tách cổ phiếu\nvề cơ bản có tác động tương tự như chia cổ tức bằng cổ phiếu, nhưng nó được thực hiện bằng cách tuyên bố rằng\nmỗi cổ phiếu hiện tại sẽ trở thành một số lượng cổ phiếu mới (ví dụ: chia tách 2:1). A\nphát hành riêng lẻ là việc phát hành cổ phiếu mới cho một hoặc một nhóm nhà đầu tư để đổi lấy\ntiền mặt, khi việc phát hành không được thực hiện dưới dạng chào bán ra công chúng.\n(Mô-đun 46.1, LOS 46.c)"},{"n":16,"q":"An analyst gathered the following data for the Parker Corp. for the year ended December 31,\n2005:\nEPS = $1.75\n2005\nDividends = $1.40\n2005\nBeta = 1.17\nParker\nLong-term bond rate = 6.75%\nRate of return S&P 500 = 12.00%\nThe firm is expected to continue their dividend policy in future. If the long-term growth rate\nin earnings and dividends is expected to be 6%, the forward P/E ratio for Parker Corp. will\nbe:","opts":["11.61.","21.54.","12.31."],"ans":"A","expl":"Tỷ lệ lợi nhuận yêu cầu trên vốn chủ sở hữu của Parker sẽ là 12,89% = 6,75% + 1,17(12,00% – 6,75%)\nvà công ty trả 80% (1,40 / 1,75) thu nhập của mình dưới dạng cổ tức.\nTỷ lệ P/E kỳ hạn = 0,80 / (0,1289 - 0,0600) = 11,61\nTrong đó r = tỷ suất lợi nhuận trên vốn chủ sở hữu yêu cầu, g = tốc độ tăng trưởng cổ tức (mãi mãi).\nn\n(Mô-đun 46.3, LOS 46.k)"},{"n":17,"q":"A stock has a required return of 14% percent, a constant growth rate of 5% and a retention\nrate of 60%. The firm's P/E ratio should be:","opts":["4.44.","5.55.","6.66."],"ans":"A","expl":"P/E = (1 - RR) / (k - g) = 0,4 / (0,14 - 0,05) = 4,44\n(Mô-đun 46.3, LOS 46.k)"},{"n":18,"q":"At the end of the last 12-month period, Romano's Italian Foods had net income of $16.68\nmillion and equity of $115 million. Romano's declared a $7.5 million dividend for the year.\nUsing internally generated funds, Romano's can grow its equity by approximately:","opts":["14.5% per year.","8.0% per year.","10.0% per year."],"ans":"B","expl":"g = ROE × tỷ lệ duy trì = [16,68 / 115] × [1 − (7,5 / 16,68)] = 0,145 × (1 − 0,45) = 7,975%.\ntốc độ tăng trưởng này thể hiện tốc độ mà một công ty có thể tăng vốn sở hữu của mình bằng cách sử dụng\nnguồn vốn được tạo ra nội bộ.\n(Học phần 46.2, LOS 46.h)"},{"n":19,"q":"Assume a company has earnings per share of $5 and pays out 40% in dividends. The\nearnings growth rate for the next 3 years will be 20%. At the end of the third year the\ncompany will start paying out 100% of earnings in dividends and earnings will increase at an\nannual rate of 5% thereafter. If a 12% rate of return is required, the value of the company is\nclosest to:","opts":["$55.70.","$102.80.","$92.90."],"ans":"B","expl":"Đầu tiên, hãy tính cổ tức trong các năm từ 0 đến 3:\nD = (0,4)(5) = 2\n0\nD = (2)(1.2) = 2,40\nD = (2.4)(1.2) = 2,88\n2\n3\nD = E = 5(1.2) = 8,64\n33\nĐầu tiên cổ tức của giai đoạn tăng trưởng không đổi là:\nD = 8,64(1,05) = 9,07\n4\nSử dụng D để ước tính giá trị cổ phiếu tại t = 3:\n4\nD\n9.07\n4\nP===129.57\n3\nk–g0.12–0.05\nGiá trị của cổ phiếu là giá trị hiện tại của dòng tiền trong tương lai:\n8.64+129.57\n2.402.88\nP=++=102.81\n0\n1.12\n23\n1.121.12\n(Mô-đun 46.2, LOS 46.h)"},{"n":20,"q":"A firm has an expected dividend payout ratio of 48 percent and an expected future growth\nrate of 8 percent. What should the firm's price to earnings ratio (P/E) be if the required rate\nof return on stocks of this type is 14 percent and what is the retention ratio of the firm?\nP/E ratioRetention ratio","opts":["8.0 | 52%","6.5 | 52%","6.5 | 48%"],"ans":"A","expl":"P/E = (tỷ lệ chi trả cổ tức)/(k - g)\nP/E = 0,48/(0,14 - 0,08) = 8\nTỷ lệ giữ chân = (1 - chi trả cổ tức) = (1 - 0,48) = 52%\n(Mô-đun 46.3, LOS 46.k)","qhtml":"<p>A firm has an expected dividend payout ratio of 48 percent and an expected future growth rate of 8 percent. What should the firm's price to earnings ratio (P/E) be if the required rate of return on stocks of this type is 14 percent and what is the retention ratio of the firm?</p><p><em>Options show → <strong>P/E Ratio</strong> | <strong>Retention Ratio</strong></em></p>"},{"n":21,"q":"The rationale for using dividend discount models to value equity is that the:","opts":["inputs are easily estimated and the model’s estimates are robust.","intrinsic value of a stock is the present value of its future dividends.","model works well for the finite period of time over which dividends are paid."],"ans":"B","expl":"Lý do cơ bản cho mô hình chiết khấu cổ tức là giá trị cơ bản hoặc nội tại của cổ phiếu\nlà giá trị hiện tại của tất cả cổ tức trong tương lai của nó. Các mô hình chiết khấu cổ tức có thể được áp dụng\ncho dòng cổ tức hữu hạn hoặc vô hạn. Có nhiều cách để tính toán đầu vào\nvà giá trị tồn kho ước tính có thể thay đổi đáng kể chỉ với những thay đổi nhỏ trong đầu vào.\n(Mô-đun 46.2, LOS 46.e)"},{"n":22,"q":"The current price of XYZ, Inc., is $40 per share with 1,000 shares of equity outstanding. Sales\nare $4,000 and the book value of the firm is $10,000. What is the price/sales ratio of XYZ,\nInc.?","opts":["10.000.","0.010.","4.000."],"ans":"A","expl":"Tỷ lệ giá/doanh thu là (giá mỗi cổ phiếu)/(doanh số mỗi cổ phiếu) = (40)/(4.000/1.000) = 10,0.\nNgoài ra, tỷ lệ giá/doanh thu có thể được coi là giá trị thị trường của công ty\nchia cho doanh số bán hàng của công ty hoặc (40 × 1.000)/4.000 hoặc lại là 10,0.\n(Mô-đun 46.3, LOS 46.k)"},{"n":23,"q":"Which of the following is least likely an assumption of the constant growth dividend discount\nmodel (DDM)?","opts":["Dividend payout is constant.","ROE is constant.","The growth rate of the firm is higher than the overall growth rate of the economy."],"ans":"C","expl":"Các giả định khác của DDM là: cổ tức tăng trưởng với tốc độ không đổi và tốc độ tăng trưởng\ntiếp tục trong một khoảng thời gian vô hạn.\n(Module 46.2, LOS 46.i)"},{"n":24,"q":"General, Inc., has net income of $650,000 and one million shares outstanding. The profit\nmargin is 6 percent and General, Inc., is selling for $30.00. The price/sales ratio is equal to:","opts":["10.83.","2.77.","0.65."],"ans":"B","expl":"Biên lợi nhuận 6% = 650.000 USD/x; x (doanh số) = $10.833.333.\nDoanh số trên mỗi cổ phiếu = $10,83 M/1.000.000 = $10,83 mỗi cổ phiếu.\nP/Sales = $30,00/$10,83 = 2,77.\n(Mô-đun 46.3, LOS 46.k)"},{"n":25,"q":"Which type of cash dividend is most likely to be declared by a cyclical firm during good\ntimes?","opts":["Regular dividend.","Special dividend.","Stock dividend."],"ans":"B","expl":"Cổ tức đặc biệt được sử dụng khi hoàn cảnh thuận lợi cho phép công ty thanh toán một lần\ntiền mặt cho cổ đông, bên cạnh bất kỳ khoản cổ tức thông thường nào của công ty trả tiền. Nhiều\ncác công ty có tính chu kỳ (ví dụ: các nhà sản xuất ô tô) sẽ sử dụng cổ tức đặc biệt để chia sẻ lợi nhuận với các cổ đông\nkhi thời điểm thuận lợi nhưng vẫn duy trì tính linh hoạt để bảo toàn tiền mặt khi lợi nhuận giảm.\n(Module 46.1, LOS 46.c)"},{"n":26,"q":"Which of the following statements concerning security valuation is least accurate?","opts":["A firm with a $1.50 dividend last year, a dividend payout ratio of 40%, a return on equity of 12%, and a 15% required return is worth $18.24.","The best way to value a company with high and unsustainable growth that exceeds the required return is to use the temporary supernormal growth (multistage) model.","The best way to value a company expecting to pay a constantly growing dividend as from the third year is to use the Gordon growth model."],"ans":"A","expl":"Một công ty có cổ tức $1,50 vào năm ngoái, tỷ lệ chi trả cổ tức là 40%, lợi tức đầu tư\nmới là 12% và lợi tức yêu cầu 15% trị giá 20,64 USD. Tốc độ tăng trưởng là (1 – 0,40) ×\n0,12 = 7,2%. Khi đó cổ tức dự kiến ​​là ($1,50)(1,072) = $1,61. Khi đó giá trị là (1,61) /\n(0,15 – 0,072) = $20,64.\n(Mô-đun 46.2, LOS 46.i)"},{"n":27,"q":"Assuming all other factors remain unchanged, which of the following would most likely lead\nto a decrease in the market P/E ratio?","opts":["An increase in the dividend payout ratio.","A decline in the risk-free rate.","A rise in the stock risk premium."],"ans":"C","expl":"P/E = (1 - RR)/(k - g)\nĐể giảm P/E: RR tăng, g giảm và hoặc k tăng. Cả sự suy giảm tỷ lệ RF và sự suy giảm tỷ lệ lạm phát đều sẽ làm giảm k. Phần bù rủi ro của cổ phiếu tăng sẽ\ntăng k.\n(Mô-đun 46.3, LOS 46.k)"},{"n":28,"q":"A stock has a required rate of return of 15%, a constant growth rate of 10%, and a dividend\npayout ratio of 45%. The stock's justified price-earnings ratio is closest to:","opts":["3.0 times.","4.5 times.","9.0 times."],"ans":"C","expl":"Mô hình chiết khấu cổ tức tăng trưởng không đổi có thể được thể hiện dưới dạng tỷ lệ thu nhập giá-\ncủa công ty:\nP/E = (D/E) / (k – g)\n0111\ntrong đó P/E là tỷ lệ P/E hợp lý và D/E là tỷ lệ trả cổ tức dự kiến.\n0111\nỞ đây, D/E = 0,45, tỷ suất lợi nhuận yêu cầu k = 0,15 và tốc độ tăng trưởng không đổi của\n11\ncổ tức g = 0,10.\nP/E = 0,45 / (0,15 – 0,10)\n01\n= 0,45 / 0,05 = 9,0\n(Module 46.3, LOS 46.k)"},{"n":29,"q":"A high growth rate of dividends is most likely to be consistent with:","opts":["a high dividend payout ratio.","a high ROE.","a low retention rate."],"ans":"B","expl":"Tốc độ tăng trưởng cổ tức có thể được ước tính là tỷ lệ duy trì × ROE hoặc (1 – tỷ lệ chi trả) ×\nROE. Do đó ROE cao đồng nghĩa với tốc độ tăng trưởng cao. Tỷ lệ chi trả cổ tức cao (\ngiống như tỷ lệ giữ chân thấp) có nhiều khả năng phù hợp với tốc độ tăng trưởng thấp của\ncổ tức.\n(Mô-đun 46.2, LOS 46.h)"},{"n":30,"q":"An analyst gathered the following data for the Parker Corp. for the year ended December 31,\n2005:\nEPS = $1.75\n2005\nDividends = $1.40\n2005\nBeta = 1.17\nParker\nLong-term bond rate = 6.75%\nRate of return S&P = 12.00%\n500\nThe firm has changed its dividend policy and now plans to pay out 60% of its earnings as\ndividends in the future. If the long-term growth rate in earnings and dividends is expected to\nbe 5%, the appropriate price to earnings (P/E) ratio for Parker will be:","opts":["7.98.","7.60.","9.14."],"ans":"B","expl":"Tỷ lệ lợi nhuận yêu cầu trên vốn chủ sở hữu sẽ là 12,89% = 6,75% + 1,17(12,00% - 6,75).\nTỷ lệ P/E = 0,60 / (0,1289 - 0,0500) = 7,60.\n(Mô-đun 46.3, LOS 46.k)"},{"n":31,"q":"An enterprise value multiple is typically calculated as the ratio of enterprise value to a\nmeasure of:","opts":["pretax income.","net income.","operating income."],"ans":"C","expl":"Bội số giá trị doanh nghiệp thường được tính bằng tỷ lệ giá trị doanh nghiệp với EBITDA\nhoặc một số thước đo khác về thu nhập hoạt động. Thu nhập ròng hoặc thu nhập trước thuế thường không được sử dụng\nvì chúng phản ánh cấu trúc vốn hiện tại và các khoản phí không dùng tiền mặt của công ty, đồng thời\nvì tỷ lệ này trở nên vô nghĩa khi thu nhập âm.\n(Mô-đun 46.3, LOS 46.l)"},{"n":32,"q":"A stock's price currently is $100. An analyst forecasts the following for the stock:\nThe normalized trailing price earnings (P/E) ratio will be 12×.\nThe stock is expected to pay a $5 dividend this coming year on projected earnings of\n$10 per share.\nIf the analyst were to buy and hold the stock for the year, the projected rate of return based\non these forecasts is closest to:","opts":["25%.","15%.","20%."],"ans":"A","expl":"Giá dự báo cuối năm, P, là:\n/\nP\nP=EPS×()=10(12)=120\nE\ncổ tức+(giá kết thúc−giá bắt đầu)\nlợi nhuận dự kiến=\ngiá khởi điểm\n$5+$120−$100\n=\n$100\n=0,25 hoặc 25%\n(Mô-đun 46.3, LOS 46.k)"},{"n":33,"q":"Assume the following information for a stock:\nBeta coefficient= 1.50\nRisk-free rate= 6%\nExpected rate of return on market= 14%\nDividend payout ratio= 30%\nExpected dividend growth rate= 11%\nThe estimated earnings multiplier (P/E ratio) is closest to:","opts":["4.29.","3.33.","10.00."],"ans":"A","expl":"P/E = D/E1 / (k – g)\nD/E1 = Tỷ lệ chi trả cổ tức = 0,3\ng = 0,11\nk = 6 + (1,5)(14 – 6) = 18%\nP/E = 0,3 / (0,18 – 0,11) = 0,3 / 0,07 = 4,29\n(Mô-đun 46.3, LOS 46.k)"},{"n":34,"q":"What is the value of a preferred stock that is expected to pay a $5.00 annual dividend per\nyear forever if similar risk securities are now yielding 8%?","opts":["$40.00.","$60.00.","$62.50."],"ans":"C","expl":"$5,00/0,08 = $62,50.\n(Mô-đun 46.2, LOS 46.g)"},{"n":35,"q":"Gwangwa Gold, a South African gold producer, has as its primary asset a mine which is\nshown on the balance sheet with a value of R100 million. An analyst estimates the market\nvalue of this mine to be 90% of book value. The company's balance sheet shows other assets\nof R20 million and liabilities of R40 million, and the analyst feels that the book value of these\nitems reflects their market values. Using the asset-based valuation approach, what should\nthe analyst estimate the value of the company to be?","opts":["R110 million.","R70 million.","R80 million."],"ans":"B","expl":"Giá trị thị trường của tài sản = 0,9(R100 triệu) + R20 triệu = R110 triệu\nGiá trị thị trường của nợ phải trả = R40 triệu\nGiá trị ròng ước tính của công ty = R110 triệu – R40 triệu = R70 triệu.\n(Mô-đun 46.3, LOS 46.m)"},{"n":36,"q":"A stock has a steady 5% growth rate in dividends. The required rate of return for stocks of\nthis risk class is 15%. The stock is expected to pay a $1 dividend this coming year. The\nexpected value of the stock at the end of the fourth year is:","opts":["$12.16.","$16.32.","$14.21."],"ans":"A","expl":"n4\nGiải bài đầu tiên cho D: D = (D)(1 + g) = $1(1,05) = $1,216\n551\nD\n$1,216\n5\nP===$12,16\n4\n(k−g)(0,15−0,05)\nhoặc\nP==10\n0\n0,15−0,05\n4\nP=10(1,05)=$12,16\n4\n(Mô-đun 46.2, LOS 46.h)"},{"n":37,"q":"The following data pertains to a common stock:\nIt will pay no dividends for two years.\nThe dividend three years from now is expected to be $1.\nDividends are expected to grow at a 7% rate from that point onward.\nIf an investor requires a 17% return on this stock, what will they be willing to pay for this\nstock now?","opts":["$ 6.24.","$ 7.30.","$10.00."],"ans":"B","expl":"dòng thời gian = $0 bây giờ; $0 vào năm 1; $0 vào năm thứ 2; $1 vào năm 3.\nP= D/(k - g) = 1/(.17 - .07) = $10\n2 3\nLưu ý phép toán. Giá luôn là một năm trước ngày chia cổ tức.\nGiải để có được PV là $10 trong hai năm.\nFV = 10; n = 2; tôi = 17; tính toán PV = $7,30\n(Mô-đun 46.2, LOS 46.h)"},{"n":38,"q":"If a company has a \"0\" earnings retention rate, the firm's P/E ratio will equal:","opts":["1 / k.","D/P + g.","k + g."],"ans":"A","expl":"P/E = tỷ lệ chi trả div / (k – g)\ntrong đó g = (tỷ lệ giữ lại)(ROE) = (0)(ROE) = 0\nChi trả cổ tức = 1 – tỷ lệ giữ lại = 1 – 0 = 1\nP/E = 1 / (k – 0) = 1 / k\n(Học phần 46.3, LOS 46.k)"},{"n":39,"q":"Assuming the risk-free rate is 5% and the expected return on the market is 12%, what is the\nvalue of a stock with a beta of 1.5 that paid a $2 dividend last year if dividends are expected\nto grow at a 5% rate forever?","opts":["$12.50.","$17.50.","$20.00."],"ans":"C","expl":"P = D / (k – g)\n01\nR = R + β(R – R) = 0,05 + 1,5(0,12 – 0,05) = 0,155\nsfMf\nD = D(1 + g) = 2 × (1,05) = 2,10\n10\nP = 2,10 / (0,155 – 0,05) = $20,00\n0\n(Mô-đun 46.2, LOS 46.h)"},{"n":40,"q":"A company has an 8 percent preferred stock outstanding with a par value of $100. The\nrequired return on the preferred is 5 percent. What is the value of the preferred stock?","opts":["$100.00.","$152.81.","$160.00."],"ans":"C","expl":"Cổ tức hàng năm của cổ phiếu ưu đãi là $100(0,08) = $8,00. Giá trị ưu tiên là\n$8,00/0,05 = $160,00.\n(Mô-đun 46.2, LOS 46.g)"},{"n":41,"q":"Which of the following is least likely an advantage of using price-to-book value (PBV)\nmultiples in stock valuation?","opts":["PBV ratios can be compared across similar firms if accounting standards are consistent.","Book value is often positive, even when earnings are negative.","Book values are highly useful measures for firms in service industries."],"ans":"C","expl":"Giá trị sổ sách có xu hướng không phải là thước đo định giá hữu ích cho các công ty trong ngành dịch vụ vì\nhọ thường có ít tài sản hữu hình trên bảng cân đối kế toán hơn các công ty trong\nngành khác.\nHai trong số những lợi thế của việc sử dụng tỷ lệ P/BV để định giá vốn cổ phần là tỷ lệ P/BV có thể được\nso sánh giữa các công ty tương tự nếu tiêu chuẩn kế toán nhất quán và giá trị sổ sách\nthường dương ngay cả khi thu nhập âm và tỷ lệ P/E không có ý nghĩa.\n(Module 46.3, LOS 46.f)"},{"n":42,"q":"If an analyst estimates the intrinsic value for a security that is different from its market\nvalue, the analyst should most likely take an investment position based on this difference if:","opts":["many analysts independently evaluate the security.","the model used is not highly sensitive to its input values.","the security lacks a liquid market and trades infrequently."],"ans":"B","expl":"Nói chung, nhà phân tích có thể tự tin hơn về ước tính giá trị nội tại nếu mô hình\nđược sử dụng không quá nhạy cảm với những thay đổi trong đầu vào của nó. Nếu một số lượng lớn các nhà phân tích tuân theo chứng khoán\n, thì giá trị thị trường của nó có nhiều khả năng là ước tính đáng tin cậy về giá trị nội tại của nó. Một\nchứng khoán không giao dịch thường xuyên hoặc trong thị trường thanh khoản có thể vẫn bị định giá sai trong một thời gian dài\nvà do đó có thể không mang lại lợi nhuận trong khoảng thời gian đầu tư ngay cả khi ước tính của\nvề giá trị nội tại của nhà phân tích là chính xác.\n(Mô-đun 46.1, LOS 46.a)"},{"n":43,"q":"The risk-free rate is 5%, and the expected return on the market index is 15%. A stock has a:\nBeta of 1.0.\nDividend payout ratio of 40%.\nReturn on equity (ROE) of 15%.\nIf the stock is expected to pay a $2.50 dividend, its intrinsic value using dividend discount\nmodel is closest to:","opts":["$53.33.","$27.77.","$41.67."],"ans":"C","expl":"E(R) = R + beta(R − R)\nfMf\nk = E(R) = 0,05 + 1(0,15 − 0,05) = 0,15\nTỷ lệ giữ lại (b) = (1 − tỷ lệ chi trả cổ tức) = 1 − 0,4 = 0,6\ng = (ROE)(b) = (0,15)(0,6) = 0,09\nD\n$2,50\nValue===$41,67\nk−g0.15−0,09\n(Mô-đun 46.2, LOS 46.h)"},{"n":44,"q":"All else equal, an increase in a company's growth rate will most likely cause its P/E ratio to:","opts":["decrease.","either increase or decrease.","increase."],"ans":"C","expl":"Tăng g: Khi g tăng, chênh lệch giữa k và g hoặc mẫu số P/E sẽ\ne\ngiảm và P/E tỷ lệ sẽ tăng.\n(Mô-đun 46.3, LOS 46.k)"},{"n":45,"q":"A company with a return on equity (ROE) of 27%, required return on equity (k) of 20%, and a\ne\ndividend payout ratio of 40% has an implied sustainable growth rate closest to:","opts":["10.80%.","12.00%.","16.20%."],"ans":"C","expl":"g = (RR)(ROE)\n= (.60)(.27)\n= 0,162 hoặc 16,2%\n(Mô-đun 46.2, LOS 46.h)"},{"n":46,"q":"A firm has a profit margin of 10%, an asset turnover of 1.2, an equity multiplier of 1.3, and an\nearnings retention ratio of 0.5. What is the firm's internal growth rate?","opts":["4.5%.","6.7%.","7.8%."],"ans":"C","expl":"ROE = (Thu nhập ròng / Doanh thu)(Doanh thu / Tổng tài sản)(Tổng tài sản / Tổng vốn chủ sở hữu)\nROE = (0,1)(1,2)(1,3) = 0,156\ng = (tỷ lệ duy trì)(ROE) = 0,5(0,156) = 0,078 hoặc 7,8%\n(Mô-đun 46.2, LOS 46.h)"},{"n":47,"q":"All else equal, the price-to-earnings (P/E) ratio of a stable firm will increase if the:","opts":["dividend payout is decreased.","long-term growth rate is decreased.","ROE is increased."],"ans":"C","expl":"Tốc độ tăng trưởng tăng sẽ làm tăng tỷ lệ P/E của một công ty ổn định và tốc độ tăng trưởng có thể được\ntính theo công thức g = ROE × tỷ lệ duy trì. Tất cả những điều khác đều không đổi, việc tăng ROE\ndo đó sẽ làm tăng tỷ lệ P/E. Lưu ý rằng việc giảm tỷ lệ chi trả cổ tức và\ngiảm tốc độ tăng trưởng dài hạn đều sẽ làm giảm tỷ lệ P/E.\n(Học phần 46.3, LOS 46.k)"},{"n":48,"q":"Gourmet and Company has the following information:\nCurrent market value = $250 million\nCurrent book value = $225 million\nSales = $750 million\nEarnings = $75 million\nCash flow = $125 million\nStock price = $7.50\nWhich of the following statements regarding Gourmet and Company is most accurate?","opts":["The price/book ratio is 0.90.","The price/sales ratio is 0.33.","The price/earnings ratio is 33.3."],"ans":"B","expl":"Tỷ lệ giá/doanh thu là $250/$750 = 0,33. Giá/cuốn sách = $250/$225 = 1,11.\nGiá/thu nhập = $250/$75 = 3,33.\n(Mô-đun 46.3, LOS 46.k)"},{"n":49,"q":"The earnings multiplier model, derived from the dividend discount model, expresses a\nstock's P/E ratio (P/E) as the :\n01","opts":["expected dividend in one year divided by the difference between the required return on equity and the expected dividend growth rate.","expected dividend payout ratio divided by the difference between the required return on equity and the expected dividend growth rate.","expected dividend payout ratio divided by the sum of the expected dividend growth rate and the required return on equity."],"ans":"B","expl":"Bắt đầu với mô hình chiết khấu cổ tức P = D/(k – g) và chia cả hai vế cho E\n01e1\nmang lại: P/E = (D/E)/(k – g)\n0111e\nDo đó, tỷ lệ P/E được xác định bởi:\nTỷ lệ trả cổ tức dự kiến (D/E).\n11\nTỷ suất lợi nhuận yêu cầu trên cổ phiếu (k).\ne\nTăng trưởng dự kiến tỷ lệ cổ tức (g).\n(Mô-đun 46.3, LOS 46.k)"},{"n":50,"q":"If a preferred stock that pays a $11.50 dividend is trading at $88.46, what is the market's\nrequired rate of return for this security?","opts":["7.69%.","11.76%.","13.00%."],"ans":"C","expl":"Từ công thức: Value = D / k, ta suy ra k = D / Value = 11,50 /\nStock ưa thíchppPreferred Stock\n88,46 = 0,1300 hoặc 13,00%.\n(Mô-đun 46.2, LOS 46.g)"},{"n":51,"q":"Preferred stock most likely has a:","opts":["variable dividend and no maturity.","fixed dividend and maturity.","fixed dividend and no maturity."],"ans":"C","expl":"Cổ phiếu ưu đãi thường trả cổ tức cố định và không đáo hạn.\n(Mô-đun 46.2, LOS 46.g)"},{"n":52,"q":"Day and Associates is experiencing a period of abnormal growth. The last dividend paid by\nDay was $0.75. Next year, they anticipate growth in dividends and earnings of 25% followed\nby negative 5% growth in the second year. The company will level off to a normal growth\nrate of 8% in year three and is expected to maintain an 8% growth rate for the foreseeable\nfuture. Investors require a 12% rate of return on Day. The value of Day stock today is closest\nto:","opts":["$18.65.","$24.05.","$20.70."],"ans":"C","expl":"Trước tiên hãy tìm cổ tức bất thường:\nD = $0,75 × 1,25 = $0,9375\nD = $0,9375 × 0,95 = $0,8906\n2\nTiếp theo, tìm cổ tức đầu tiên của giai đoạn tăng trưởng không đổi:\nD = $0,8906 × 1,08 = $0,9619\n3\nChúng ta có thể sử dụng cổ tức này trong DDM tăng trưởng không đổi để nhận được giá trị cho cổ phiếu trong kỳ 2:\n$0,9619\nP==$24,0469\n2\n(0,12–0,08)\n$0,9375$0,8906+$24,0469\nGiá trị của cổ phiếu hôm nay=+=$20,7171\n1,12\n2\n1,12\n(Mô-đun 46.2, LOS 46.h)"},{"n":53,"q":"Which of the following statements regarding price multiples is most accurate?","opts":["A disadvantage of the price/book value ratio is that it is not an appropriate measure for firms that primarily hold liquid assets.","An advantage of the price/sales ratio is that it is meaningful even for distressed firms.","A rationale for using the price/cash flow ratio is that there is only one clear definition of cash flow."],"ans":"B","expl":"Tỷ lệ P/S có ý nghĩa ngay cả đối với các công ty đang gặp khó khăn, vì doanh thu bán hàng luôn dương.\nĐiều này không đúng với tỷ lệ P/E và P/BV, điều này có thể xảy ra âm.\nTrong giá trị sổ sách của tỷ lệ P/BV là thước đo thích hợp về giá trị tài sản ròng cho các công ty\nchủ yếu nắm giữ tài sản lưu động.\nCác nhà phân tích sử dụng một số định nghĩa khác nhau về dòng tiền (CFO, CFO đã điều chỉnh, FCFE, EBITDA, v.v.)\nđể tính tỷ lệ P/CF.\nKhi thu nhập âm, Tỷ lệ P/E là vô nghĩa.\n(Mô-đun 46.3, LOS 46.j)"},{"n":54,"q":"Using an infinite period dividend discount model, find the value of a stock that last paid a\ndividend of $1.50. Dividends are expected to grow at 6 percent forever, the expected return\non the market is 12 percent and the stock's beta is 0.8. The risk-free rate of return is 5\npercent.","opts":["$26.50.","$32.61.","$34.57."],"ans":"C","expl":"Trước tiên, hãy tìm tỷ suất lợi nhuận yêu cầu bằng cách sử dụng CAPM phương trình.\nk = 0,05 + 0,8(0,12 - 0,05) = 10,6%\n$1,50(1,06) /(0,106 - 0,06) = $34,57\n(Mô-đun 46.2, LOS 46.h)"},{"n":55,"q":"An enterprise value model for equity valuation is most accurately described as a(n):","opts":["asset-based model.","discounted cash flow model.","multiplier model."],"ans":"C","expl":"Mô hình giá trị doanh nghiệp là một ví dụ về mô hình cấp số nhân. Giá trị doanh nghiệp được phân tích dưới dạng\nbội số của doanh thu hoặc thu nhập và được so sánh giữa các công ty trong nhóm ngang hàng.\n(Mô-đun 46.1, LOS 46.b)"},{"n":56,"q":"A stock has the following data associated with it:\nA required rate of return of 14%.\nA return on equity of 15%.\nAn earnings retention rate of 40%.\nThe stock's justified price-to-earnings ratio is closest to:","opts":["5.0.","7.5.","6.7."],"ans":"B","expl":"tỷ lệ chi trả cổ tức\nP/E=\nk−g\ntỷ lệ chi trả cổ tức = 1 − tỷ lệ duy trì = 1 − 0,4 = 0,6\ntốc độ tăng trưởng (g) = tỷ lệ duy trì × ROE = 0,4 × 15% = 6%\n0,6\nP/E==7,5\n0,14−0,06\n(Học phần 46.3, LOS 46.k)"},{"n":57,"q":"Assume that a stock paid a dividend of $1.50 last year. Next year, an investor believes that\nthe dividend will be 20% higher and that the stock will be selling for $50 at year-end. Assume\na beta of 2.0, a risk-free rate of 6%, and an expected market return of 15%. What is the value\nof the stock?","opts":["$40.32.","$41.77.","$45.00."],"ans":"B","expl":"Sử dụng Mô hình định giá tài sản vốn, chúng ta có thể xác định tỷ lệ chiết khấu bằng 0,06 +\n2(0,15 – 0,06) = 0,24. Cổ tức năm tới dự kiến ​​sẽ là 1,50 USD × 1,2 = 1,80 USD.\ngiá trị hiện tại của giá cổ phiếu trong tương lai và cổ tức trong tương lai được xác định bằng cách chiết khấu\ndòng tiền dự kiến với tỷ lệ chiết khấu 24%: (50 + 1,8) / 1,24 = $41,77.\n(Mô-đun 46.2, LOS 46.h)"},{"n":58,"q":"A stock has the following elements: last year's dividend = $1, next year's dividend is 10%\nhigher, the price will be $25 at year-end, the risk-free rate is 5%, the market risk premium is\n5%, and the stock's beta is 1.5. The stock's price is closest to:","opts":["$20.20.","$23.20.","$23.50."],"ans":"B","expl":"Chi phí vốn cổ phần = 5% + 1,5(5%) = 12,5%\nP = (1,1 / 1,125) + (25 / 1,125) = $23,20.\n0\n(Mô-đun 46.2, LOS 46.h)"},{"n":59,"q":"Robert Higgins is estimating the price-earnings (P/E) ratio that will be appropriate for an\nindex at the end of next year. He has estimated that:\nExpected annual dividends will increase by 10% compared to this year.\nExpected earnings per share will increase by 10% compared to this year.\nThe expected growth rate of dividends will be the same as the current estimate of 5%.\nThe required rate of return will rise from 8% to 11%.\nCompared to the current P/E, the end-of-the-year P/E will be:","opts":["50% lower.","10% higher.","2% higher."],"ans":"A","expl":"Tử số của công thức tính P/E là tỷ lệ chi trả, không thay đổi (cả\nthu nhập dự kiến và cổ tức đều tăng theo cùng một tỷ lệ phần trăm). Mẫu số (k − g)\ntăng gấp đôi từ 3% lên 6%, điều này sẽ làm giảm P/E xuống một nửa.\n(Học phần 46.3, LOS 46.k)"},{"n":60,"q":"Company B paid a $1.00 dividend per share last year and is expected to continue to pay out\n40% of its earnings as dividends for the foreseeable future. If the firm is expected to earn a\n10% return on equity in the future, and if an investor requires a 12% return on the stock, the\nstock's value is closest to:","opts":["$16.67.","$12.50.","$17.67."],"ans":"C","expl":"P = Giá trị cổ phiếu = D / (k – g)\n01\ng = (RR)(ROE)\nRR = 1 – trả cổ tức = 1 – 0,4 = 0,6\nROE = 0,1\ng = (0,6)(0,1) = 0,06\nD = (D)(1 + g) = (1)(1 + 0,06) = $1,06\n10\nP = 1,06 / (0,12 – 0,06) = 1,06 / 0,06 = $17,67\n0\n(Mô-đun 46.2, LOS 46.h)"},{"n":61,"q":"Asset-based valuation models are most appropriate for a firm that:","opts":["has cyclical earnings.","has significant intangible assets.","is being liquidated."],"ans":"C","expl":"Các mô hình định giá dựa trên tài sản phù hợp với một công ty đang được thanh lý vì\nkhi một công ty ngừng hoạt động liên tục, giá trị của nó đối với chủ sở hữu vốn cổ phần phụ thuộc vào\nchênh lệch giữa giá trị hợp lý của tài sản và nợ phải trả. Các mô hình dựa trên tài sản dường như\nkhông đáng tin cậy để ước tính giá trị của các công ty có tài sản vô hình đáng kể vì\ngiá trị hợp lý của những tài sản đó thường khó xác định. Một công ty như vậy có thể có hoặc không có\nthu nhập theo chu kỳ.\n(Module 46.3, LOS 46.m)"},{"n":62,"q":"Assume that the expected dividend growth rate (g) for a firm decreased from 5% to zero.\nFurther, assume that the firm's cost of equity (k) and dividend payout ratio will maintain\ntheir historic levels. The firm's P/E ratio will most likely:","opts":["increase.","decrease.","become undefined."],"ans":"B","expl":"P/E tỷ lệ có thể được định nghĩa là: Tỷ lệ xuất chi / (k - g), vì vậy nếu k không đổi và g về 0,\nP/E sẽ giảm.\n(Module 46.3, LOS 46.k)"},{"n":63,"q":"An investor is considering acquiring a common stock that he would like to hold for one year.\nAt the end of the year he expects to receive both $1.50 in dividends and $26 from the sale of\nthe stock. What is the maximum price he should pay for the stock today to earn a 15 percent\nreturn?","opts":["$23.91.","$24.11.","$27.30."],"ans":"A","expl":"Với tỷ lệ lợi nhuận yêu cầu là 15%, số tiền tối đa mà nhà đầu tư phải trả cho cổ phiếu hôm nay là\n(26 + 1,50) / 1,15 = $23,91.\n(Mô-đun 46.2, LOS 46.h)"},{"n":64,"q":"Given the following information, compute the implied dividend growth rate.\nProfit margin = 10.0%\nTotal asset turnover = 2.0 times\nFinancial leverage = 1.5 times\nDividend payout ratio = 40.0%","opts":["12.0%.","18.0%.","4.5%."],"ans":"B","expl":"Tỷ lệ duy trì bằng 1 – 0,40 hoặc 0,60.\nLợi nhuận trên vốn chủ sở hữu bằng (10,0%)(2,0)(1,5) = 30,0%.\nTốc độ tăng trưởng cổ tức bằng (0,60)(30,0%) = 18,0%.\n(Mô-đun 46.2, LOS 46.h)"},{"n":65,"q":"Which of the following is least likely a reason the price to cash flow (P/CF) model has grown\nin popularity?","opts":["CFs are generally more difficult to manipulate than earnings.","CFs are used extensively in valuation models.","CFs are more easily estimated than future dividends."],"ans":"C","expl":"CF không dễ ước tính hơn cổ tức.\n(Mô-đun 46.3, LOS 46.j)"},{"n":66,"q":"Rock, Inc. maintains a policy of paying 30% of earnings to its investors in the form of\ndividends. Rock is expected to generate a return on equity of 9.3%. Rock's beta is 1.5. The\nmarket risk premium is 6% and the risk-free rate is 3%. Rock's required rate of return is\nclosest to:","opts":["9.0%.","9.3%.","12.0%."],"ans":"C","expl":"Trả về bắt buộc = R + β(R – R) = 0,03 + 1,5(0,06) = 0,12\nfMf\n(Mô-đun 46.2, LOS 46.h)"},{"n":67,"q":"Enterprise value is most accurately described as a firm's:","opts":["market value of assets minus market value of liabilities, plus cash and short-term investments.","market value of stock plus cash and short-term investments, minus market value of debt.","market value of stock plus market value of debt, minus cash and short-term investments."],"ans":"C","expl":"Giá trị doanh nghiệp = giá trị thị trường của cổ phiếu phổ thông và cổ phiếu ưu đãi + giá trị thị trường của nợ – tiền mặt\nvà các khoản đầu tư ngắn hạn.\n(Mô-đun 46.3, LOS 46.l)"},{"n":68,"q":"The purchaser of a stock will receive the next dividend if the order is filled before the:","opts":["ex-dividend date.","holder-of-record date.","payment date."],"ans":"A","expl":"Ngày không hưởng cổ tức là ngày ngày hết hạn để nhận cổ tức và xảy ra một hoặc hai\nngày làm việc trước ngày lưu giữ hồ sơ. Nhà đầu tư mua cổ phiếu vào hoặc sau\nngày không hưởng cổ tức sẽ không nhận được cổ tức.\n(Mô-đun 46.1, LOS 46.d)"},{"n":69,"q":"A company's growth rate in dividends and earnings can be estimated as the:","opts":["difference between the retention ratio and the return on equity.","product of the retention ratio and the return on equity.","product of the return on equity and the dividend payout ratio."],"ans":"B","expl":"Giả sử các khoản đầu tư trong quá khứ ổn định và thu nhập được tính toán để cho phép duy trì\nsức mạnh thu nhập trong quá khứ, thì tốc độ tăng trưởng cổ tức dự kiến (g) của công ty có thể được xác định là\ncông ty có tỷ lệ hoàn vốn hoặc tỷ lệ giữ lại (RR) nhân với phần lợi nhuận trên vốn chủ sở hữu (ROE) của\ncác khoản đầu tư mới. Tốc độ tăng trưởng này còn được gọi là tốc độ tăng trưởng bền vững.\n(Module 46.2, LOS 46.h)"},{"n":70,"q":"A company has just paid a $2.00 dividend per share and dividends are expected to grow at a\nrate of 6% indefinitely. If the required return is 13%, what is the value of the stock today?","opts":["$34.16.","$32.25.","$30.29."],"ans":"C","expl":"Cổ tức vừa trả là D. Để sử dụng mô hình chiết khấu cổ tức tăng trưởng không đổi, chúng ta cần\n0\ncổ tức của kỳ tiếp theo, D:\nD = $2,00 × 0,06 = $2,12\nP = D / (k – g) = 2,12 / (0,13 – 0,06) = $30,29\n01\n(Mô-đun 46.2, LOS 46.h)"},{"n":71,"q":"Which of the following is least likely an advantage of using price/sales (P/S) multiple to value\nan equity security, as compared to using price/earnings (P/E) multiples?","opts":["P/S multiples are not as volatile as P/E multiples and hence may be more reliable in valuation analysis.","P/S multiples provide a meaningful framework for evaluating distressed firms when negative earnings prevent the use of P/E multiples.","P/S multiples are more reliable than P/E multiples because sales data cannot be distorted by management."],"ans":"C","expl":"Bởi vì các hoạt động ghi nhận doanh thu mạnh mẽ có thể ảnh hưởng đến doanh số bán hàng được báo cáo nên\nkhông phải trường hợp mà dữ liệu bán hàng không thể bị ban quản lý bóp méo.\nP/S có xu hướng bội số đối với tôi, ít biến động hơn bội số P/E và có thể được sử dụng để định giá vốn chủ sở hữu\nchứng khoán của các công ty có thu nhập âm.\n(Module 46.3, LOS 46.f)"},{"n":72,"q":"Holding all else equal, if the beta of a stock increases, the stock's price will:","opts":["be unaffected.","decrease.","increase."],"ans":"B","expl":"Khi beta của một cổ phiếu tăng, lợi tức yêu cầu của nó sẽ tăng. Điều này làm tăng\ntỷ lệ chiết khấu mà các nhà đầu tư sử dụng để ước tính giá trị hiện tại của dòng tiền trong tương lai của cổ phiếu,\nlàm giảm giá trị của cổ phiếu.\n(Mô-đun 46.2, LOS 46.e)"},{"n":73,"q":"A firm has an expected dividend payout ratio of 50 percent, a required rate of return of 18\npercent, and an expected dividend growth rate of 3 percent. The firm's price to earnings\nratio (P/E) is:","opts":["3.33.","6.66.","2.78."],"ans":"A","expl":"P/E = .5 / (18%-3%) = 3,33.\n(Mô-đun 46.3, LOS 46.k)"},{"n":74,"q":"A firm has a constant growth rate of 7% and just paid a dividend of $6.25. If the required rate\nof return is 12%, what will the stock sell for two years from now based on the dividend\ndiscount model?","opts":["$149.80.","$133.75.","$153.13."],"ans":"C","expl":"33\nD(1+g)$6,25(1,07)\nD\n0\n3\ngiá trị @ t=2====$153.13\nk−gk−g0.12−0.07\n(Mô-đun 46.2, LOS 46.h)"},{"n":75,"q":"Use the following information and the dividend discount model to find the value of\nGoFlower, Inc.'s, common stock.\nLast year's dividend was $3.10 per share.\nThe growth rate in dividends is estimated to be 10% forever.\nThe return on the market is expected to be 12%.\nThe risk-free rate is 4%.\nGoFlower's beta is 1.1.","opts":["$26.64.","$34.95.","$121.79."],"ans":"C","expl":"Tiền lãi yêu cầu cho GoFlow là 0,04 + 1,1(0,12 – 0,04) = 0,128 hoặc 12,8%. Cổ tức dự kiến\nlà ($3,10)(1,10) = $3,41. Sau đó, cổ phiếu phổ thông của GoFlow được định giá bằng cách sử dụng mô hình chiết khấu cổ tức (DDM) theo kỳ\nvô hạn là ($3,41) / (0,128 – 0,10) = $121,79.\n(Module 46.2, LOS 46.h)"},{"n":76,"q":"A company last paid a $1.00 dividend, the current market price of the stock is $20 per share\nand the dividends are expected to grow at 5 percent forever. What is the required rate of\nreturn on the stock?","opts":["10.00%.","10.25%.","9.78%."],"ans":"B","expl":"D (1 + g) / P + g = k\n00\n1,00 (1,05) / 20 + 0,05 = 10,25%.\n(Mô-đun 46.2, LOS 46.h)"},{"n":77,"q":"Use the following information on Brown Partners, Inc. to compute the current stock price.\nDividend just paid = $6.10\nExpected dividend growth rate = 4%\nExpected stock price in one year = $60\nRisk-free rate = 3%\nRisk premium on the stock = 12%","opts":["$57.48.","$59.55.","$57.70."],"ans":"C","expl":"Giá cổ phiếu hiện tại bằng (D + P) / (1 + k). D bằng $6,10(1,04) = $6,34. Tỷ lệ chiết khấu vốn chủ sở hữu\n11e1\nlà 3% + 12% = 15%. Do đó, giá cổ phiếu hiện tại là ($6,34 + $60)/(1,15) =\n$57,70\n(Mô-đun 46.2, LOS 46.h)"},{"n":78,"q":"Which valuation method is most appropriate to estimate a floor value for a firm being\nliquidated?","opts":["Asset-based.","Discounted cash flow.","Multiple based on fundamentals."],"ans":"A","expl":"Mô hình dựa trên tài sản có thể là phù hợp nhất để ước tính giá trị sàn cho một công ty\nđang chuẩn bị thanh lý. Dòng tiền trong tương lai và các yếu tố cơ bản của công ty như thu nhập hoặc doanh thu\nkhông liên quan đến một công ty không hoạt động liên tục.\n(Module 46.3, LOS 46.f)"},{"n":79,"q":"An analyst has gathered the following data for Webco, Inc:\nRetention = 40%\nROE = 25%\nk = 14%\nUsing the infinite period, or constant growth, dividend discount model, calculate the price of\nWebco's stock assuming that next year's earnings will be $4.25.","opts":["$125.00.","$55.00.","$63.75."],"ans":"C","expl":"g = (ROE)(RR) = (0,25)(0,4) = 10%\nV = D / (k – g)\nD = 4,25 (1 – 0,4) = 2,55\nG = 0,10\nK – g = 0,14 – 0,10 = 0,04\nV = 2,55 / 0,04 = 63,75\n(Mô-đun 46.2, LOS 46.h)","qhtml":"<p>An analyst has gathered the following data for Webco, Inc:</p><table class=\"qtable\"><tbody><tr><td>Retention =</td><td>40%</td></tr><tr><td>ROE =</td><td>25%</td></tr><tr><td>k =</td><td>14%</td></tr></tbody></table><p>Using the infinite period, or constant growth, dividend discount model, calculate the price of</p><p>Webco's stock assuming that next year's earnings will be $4.25.</p>"},{"n":80,"q":"Given the following information for EAV Technology, a U.S. GAAP reporting firm:\nNet income per share = $6\nPrice per share = $100\nDepreciation per share = $2\nInterest expense per share = $4\nMarginal tax rate = 25%\nWorking capital investment = $0\nThe price/cash flow ratio is closest to:","opts":["8.3X.","9.1X.","12.5X."],"ans":"C","expl":"Dòng tiền hoạt động = Thu nhập ròng trên mỗi cổ phiếu + Khấu hao trên mỗi cổ phiếu = $6 + $2 = $8\nGiá/dòng tiền = $100 / $8,0X = 12,5X\n(Mô-đun 46.3, LOS 46.k)"},{"n":81,"q":"If all other factors remain unchanged, which of the following would most likely reduce a\ncompany's price/earnings ratio?","opts":["The dividend payout ratio increases, and the dividend growth rate increases.","The dividend growth rate increases, and the required rate of return decreases.","The required rate of return increases, and the dividend payout ratio decreases."],"ans":"C","expl":"chi trả cổ tức tỷ lệ\nP/E=\nk−g\ng=ROE×tỷ lệ duy trì\nTăng k làm giảm P/E. Tăng g hoặc tỷ lệ chi trả cổ tức tăng P/E.\n(Mô-đun 46.2, LOS 46.h và Mô-đun 46.3, LOS 46.k)"},{"n":82,"q":"What value would be placed on a stock that currently pays no dividend but is expected to\nstart paying a $1 dividend five years from now? Once the stock starts paying dividends, the\ndividend is expected to grow at a 5 percent annual rate. The appropriate discount rate is 12\npercent.","opts":["$9.08.","$8.11.","$14.29."],"ans":"A","expl":"P = D5/(k-g) = 1/(.12-.05) = 14,29\n4\nP = [FV = 14,29; n = 4; i = 12] = $9,08.\n0\n(Mô-đun 46.2, LOS 46.h)"},{"n":83,"q":"Assume that a firm has an expected dividend payout ratio of 20%, a required rate of return\nof 9%, and an expected dividend growth of 5%. What is the firm's estimated price-to-\nearnings (P/E) ratio?","opts":["20.00.","5.00.","2.22."],"ans":"B","expl":"Tỷ lệ giá trên thu nhập (P/E) bằng (D/E)/(k – g) = 0,2/(0,09 – 0,05) = 5,00.\n11\n(Mô-đun 46.3, LOS 46.k)"},{"n":84,"q":"All of the following factors affects the firm's P/E ratio EXCEPT:","opts":["growth rates of dividends.","the expected interest rate on the bonds of the firm.","the required rate of return."],"ans":"B","expl":"Các yếu tố ảnh hưởng đến tỷ lệ P/E cũng giống như các yếu tố ảnh hưởng đến giá trị của một công ty trong\nmô hình chiết khấu cổ tức tăng trưởng vô hạn. Lãi suất dự kiến ​​của trái phiếu không phải là\nyếu tố quan trọng ảnh hưởng đến tỷ lệ P/E.\n(Module 46.3, LOS 46.k)"},{"n":85,"q":"The capital asset pricing model can be used to estimate which of the following inputs to the\ndividend discount model?","opts":["The expected inflation rate.","The expected growth rate in dividends.","The required return on equity."],"ans":"C","expl":"Mô hình định giá tài sản vốn là mô hình tỷ suất lợi nhuận có thể được sử dụng để ước tính\ntỷ suất lợi nhuận yêu cầu của một cổ phiếu, với lãi suất phi rủi ro danh nghĩa, phần bù rủi ro thị trường và the\nbeta của cổ phiếu:\nk = R + (beta)(R - R).\ntỷ giá phi rủi ro danh nghĩatỷ giá phi rủi ro danh nghĩa thị trường\n(Mô-đun 46.2, LOS 46.h)"},{"n":86,"q":"If the payout ratio increases, the justified P/E multiple will:","opts":["decrease, if we assume that the growth rate remains constant.","always increase.","increase, if we assume that the growth rate remains constant."],"ans":"C","expl":"Khi tỷ lệ chi trả tăng, hệ số P/E hợp lý chỉ tăng nếu chúng tôi giả định rằng\ntốc độ tăng trưởng sẽ không thay đổi.\n(Module 46.3, LOS 46.k)"},{"n":87,"q":"Witronix is a rapidly growing U.S. company that has increased free cash flow to equity and\ndividends at an average rate of 25% per year for the last four years. The present value model\nthat is most appropriate for estimating the value of this company is a:","opts":["Gordon growth model.","multistage dividend discount model.","single stage free cash flow to equity model."],"ans":"B","expl":"Mô hình nhiều giai đoạn là mô hình phù hợp nhất vì công ty đang tăng cổ tức\nvới tốc độ cao hơn mức có thể duy trì trong về lâu dài. Mặc dù công ty có thể\ntăng cổ tức với tỷ lệ hàng năm cao hơn mức bền vững 25% trong một khoảng thời gian hữu hạn, nhưng đến một lúc nào đó\ntăng trưởng cổ tức sẽ phải chậm lại ở mức thấp hơn, bền vững hơn. Mô hình tăng trưởng Gordon\nthích hợp để sử dụng cho các công ty trưởng thành có lịch sử tăng\ncổ tức với tốc độ ổn định và bền vững. Mô hình dòng tiền tự do chuyển sang vốn chủ sở hữu một giai đoạn\ntương tự như mô hình tăng trưởng Gordon, nhưng đánh giá cao dòng tiền tự do trong tương lai của vốn chủ sở hữu hơn là\ncổ tức.\n(Học phần 46.2, LOS 46.e)"},{"n":88,"q":"Of the following types of firm, which is most suitable for P/B ratio analysis?","opts":["A service industry firm without significant fixed assets.","A firm with accounting standards consistent to other firms.","A firm with accounting standards different from other firms."],"ans":"B","expl":"Giả sử các tiêu chuẩn kế toán nhất quán giữa các công ty, tỷ lệ P/B có thể tiết lộ dấu hiệu\nđánh giá sai giữa các công ty.\n(Học phần 46.3, LOS 46.j)"},{"n":89,"q":"If a firm's growth rate is 12% and its dividend payout ratio is 30%, its current return on\nequity (ROE) is closest to:","opts":["40.00%.","17.14%.","36.00%."],"ans":"B","expl":"g = (RR)(ROE)\ng / RR = ROE\n0,12 / (1 - 0,30) = 0,12 / 0,70 = 0,1714 hoặc 17,14%\n(Mô-đun 46.2, LOS 46.h)"},{"n":90,"q":"A company has 6% preferred stock outstanding with a par value of $100. The required return\non the preferred is 8%. What is the value of the preferred stock?","opts":["$100.00.","$75.00.","$92.59."],"ans":"B","expl":"Cổ tức hàng năm của cổ phiếu ưu đãi là $100(0,06) = $6,00. Giá trị ưu tiên là\n$6,00/0,08 = $75,00.\n(Mô-đun 46.2, LOS 46.g)"},{"n":91,"q":"An analyst projects the following pro forma financial results for Magic Holdings, Inc., in the\nnext year:\nSales of $1,000,000\nEarnings of $200,000\nTotal assets of $750,000\nEquity of $500,000\nDividend payout ratio of 62.5%\nShares outstanding of 50,000\nRisk free interest rate of 7.5%\nExpected market return of 13.0%\nStock Beta at 1.8\nIf the analyst assumes Magic Holdings, Inc. will produce a constant rate of dividend growth,\nthe value of the stock is closest to:","opts":["$44.","$104.","$19."],"ans":"B","expl":"Thời gian vô hạn DDM: P = D / (k – g)\n01e\nD= (Thu nhập × Tỷ lệ xuất chi) / số lượng cổ phiếu trung bình chưa thanh toán\n= ($200.000 × 0,625) / 50.000 = $2,50.\nk\n= lãi suất phi rủi ro + [beta × (lợi nhuận thị trường dự kiến – lãi suất phi rủi ro)]\ne\nk\n= 7,5% + [1,8 × (13,0% - 7,5%)] = 17,4%.\ne\ng= (tỷ lệ giữ chân × ROE)\nGiữ chân = (1 – Xuất chi) = 1 – 0,625 = 0,375.\nROE = thu nhập ròng/vốn chủ sở hữu\n= 200.000/500.000 = 0,4\ng= 0,375 × 0,4 = 0,15.\nP = D / (k – g) = $2,50 / (0,174 - 0,15) = 104,17.\n01e\n(Mô-đun 46.2, LOS 46.h)"},{"n":92,"q":"An analyst studying Albion Industries determines that the average EV/EBITDA ratio for\nAlbion's industry is 10. The analyst obtains the following information from Albion's financial\nstatements:\nEBITDA = £11,000,000\nMarket value of debt = £30,000,000\nCash = £1,000,000\nBased on the industry's average enterprise value multiple, what is the equity value of Albion\nIndustries?","opts":["£110,000,000.","£80,000,000.","£81,000,000."],"ans":"C","expl":"Giá trị doanh nghiệp = EV/EBITDA trung bình × EBITDA của công ty = 10 × £11.000.000 = £110.000.000\nGiá trị doanh nghiệp = Giá trị vốn sở hữu + nợ – tiền mặt\nGiá trị vốn chủ sở hữu = Giá trị doanh nghiệp – nợ + tiền mặt = £110.000.000 – £30.000.000 + £1.000.000 =\n£81.000.000\n(Mô-đun 46.3, LOS 46.l)"},{"n":93,"q":"Calculate the value of a preferred stock that pays an annual dividend of $5.50 if the current\nmarket yield on AAA rated preferred stock is 75 basis points above the current T-Bond rate\nof 7%.","opts":["$42.63.","$70.97.","$78.57."],"ans":"B","expl":"k = lãi suất cơ bản + phí bảo hiểm rủi ro = 0,07 + 0,0075 = 0,0775\nưu tiên\nGiá trị = Cổ tức / k\nƯu tiên\nGiá trị = 5,50 / 0,0775 = $70,97\n(Mô-đun 46.2, LOS 46.g)"},{"n":94,"q":"An analyst gathered the following information about a company:\nThe stock is currently trading at $31.00 per share.\nEstimated growth rate for the next three years is 25%.\nBeginning in the year 4, the growth rate is expected to decline and stabilize at 8%.\nThe required return for this type of company is estimated at 15%.\nThe dividend in year 1 is estimated at $2.00.\nThe stock is undervalued by approximately:","opts":["$0.00.","$15.70.","$6.40."],"ans":"C","expl":"Mức tăng trưởng \"bất thường\" cao trong ba năm đầu tiên và mức tăng trưởng giảm sau đó\ncho thấy chúng ta nên sử dụng mô hình tăng trưởng cổ tức nhiều giai đoạn (DDM) để định giá stock.\nBước 1: Xác định dòng cổ tức qua năm 4\nD = $2,00 (đã cho)\nD = D × (1 + g) = 2,00 × (1,25) = $2,50\n21\nD = D × (1 + g) = $2,50 × (1,25) = $3,13\n32\nD = D × (1 + g) = $3,13 × (1,08) = $3,38\n43\nBước 2: Tính giá trị cổ phiếu vào cuối năm 3 (sử dụng D)\n4\nP = D / (k – g) = $3,38 / (0,15 – 0,08) = $48,29\n34e\nBước 3: Tính PV của từng dòng tiền tại k = 15% và tính tổng các dòng tiền. Lưu ý:\ne\nChúng tôi khuyên bạn nên xóa sổ đăng ký bộ nhớ máy tính tài chính trước khi tính giá trị.\nGiá trị hiện tại của:\nD = 1,74 = 2,00 / (1,15) hoặc FV = -2,00, N = 1, I/Y = 15, PV = 1,74\n2\nD = 1,89 = 2,50 / (1,15), hoặc FV = -2,50, N = 2, I/Y = 15, PV = 1,89\n2\n3\nD = 2,06 = 3,13 / (1,15), hoặc FV = -3,13, N = 3, I/Y = 15, PV = 2,06\n3\n3\nP = 31,75 = 48,29 / (1,15), hoặc FV = -48,29, N = 3, I/Y = 15, PV = 31,75\n3\nTổng dòng tiền = 37,44.\nDo đó, cổ phiếu bị định giá thấp 37,44 – 31,00 = khoảng 6,40.\nLưu ý: Các giá trị trong tương lai được nhập vào máy tính tài chính dưới dạng số âm để đảm bảo rằng kết quả PV\nlà dương. Điều đó không có nghĩa là dòng tiền âm. Ngoài ra, các phép tính\ncủa bạn có thể hơi khác do làm tròn. Hãy nhớ rằng câu hỏi yêu cầu bạn chọn\ncâu trả lời gần nhất.\n(Mô-đun 46.2, LOS 46.h)"},{"n":95,"q":"Which of the following statements concerning security valuation is least accurate?","opts":["A stock with a dividend last year of $3.25 per share, an expected dividend growth rate of 3.5%, and a required return of 12.5% is estimated to be worth $36.11.","A stock to be held for two years with a year-end dividend of $2.20 per share, an estimated value of $20.00 at the end of two years, and a required return of 15% is estimated to be worth $18.70 currently.","A stock with an expected dividend payout ratio of 30%, a required return of 8%, an expected dividend growth rate of 4%, and expected earnings of $4.15 per share is estimated to be worth $31.13 currently."],"ans":"A","expl":"Một cổ phiếu với cổ tức năm ngoái là 3,25 USD trên mỗi cổ phiếu, tốc độ tăng trưởng cổ tức dự kiến là 3,5%,\nvà lợi nhuận yêu cầu 12,5% được ước tính trị giá 37,33 USD khi sử dụng DDM trong đó P = D\no1\n/ (k – g). Chúng ta có D = $3,25, g = 3,5% và k = 12,5%. Cái chúng ta cần tìm là D mà\no1\nbằng D × (1 + g) do đó D = $3,25 × 1,035 = $3,36 do đó P = 3,36 / (0,125 – 0,035) =\no1o\n$37,33.\nTrong lựa chọn trả lời có giá trị cổ phiếu là $18,70, việc chiết khấu dòng tiền trong tương lai trở về\nhiện tại sẽ cho ra giá trị hiện tại của cổ phiếu. dòng tiền trong tương lai là cổ tức trong\nnăm 1 cộng với cổ tức và giá trị của cổ phiếu trong năm 2, do đó phương trình trở thành: V = 2,2 /\no\n2\n1,15 + (2,2 + 20) / 1,15 = $18,70\nĐối với lựa chọn câu trả lời trong đó giá trị cổ phiếu là $31,13, hãy sử dụng DDM là P = D / (k – g).\no1\nChúng ta có k = 0,08, g = 0,04 và những gì chúng ta cần tìm là cổ tức của năm tới hoặc D. D =\n11\nThu nhập dự kiến × tỷ lệ chi trả = $4,15 × 0,3 = $1,245 do đó P = $1,245 / (0,08 – 0,04) =\no\n$31,13\n(Mô-đun 46.2, LOS 46.h)"},{"n":96,"q":"REM Corp.'s return on equity (ROE) is 19.5% and its dividend payout rate is 45%. What is the\ncompany's implied dividend growth rate?","opts":["8.78%.","19.5%.","10.73%."],"ans":"C","expl":"g = (ROE)(RR)\ng = (19,5)(1 – 0,45)\ng = (0,195)(0,55)\n= 0,1073 hoặc 10,73%\n(Mô-đun 46.2, LOS 46.h)"},{"n":97,"q":"Assuming a discount rate of 15%, the price of a preferred stock with a dividend of $10 is\nclosest to:","opts":["$150.","$67.","$105."],"ans":"B","expl":"Công thức tính giá trị cổ phiếu ưu đãi trả cổ tức vĩnh viễn là: D / kp. Trong trường hợp này,\n10,0 / 0,15 = $66,67.\n(Mô-đun 46.2, LOS 46.g)"},{"n":98,"q":"A firm has an expected dividend payout ratio of 50%, a required rate of return of 12% and a\nconstant growth rate of 6%. If earnings for the next year are expected to be $4.50, the value\nof the stock today is closest to:","opts":["$33.50.","$37.50.","$39.75."],"ans":"B","expl":"Cổ tức dự kiến = 4,50 USD × 0,50 = 2,25 USD\nGiá trị hôm nay = 2,25 USD / (0,12 – 0,06) = $37,50\n(Mô-đun 46.2, LOS 46.h)"},{"n":99,"q":"In its latest annual report, a company reported the following:\nNet income= $1,000,000\nTotal equity= $5,000,000\nTotal assets= $10,000,000\nDividend payout ratio= 40%\nBased on the sustainable growth model, the most likely forecast of the company's future\nearnings growth rate is:","opts":["12%.","8%.","6%."],"ans":"A","expl":"g = (RR)(ROE)\nRR = 1 – tỷ lệ chi trả cổ tức = 1 – 0,4 = 0,6\nROE = NI / Tổng vốn chủ sở hữu = 1.000.000 / 5.000.000 = 1 / 5 = 0,2\nLưu ý: Đây là phép tính ROE \"đơn giản\". Vì chúng tôi chỉ được cung cấp những dữ liệu đầu vào này nên
