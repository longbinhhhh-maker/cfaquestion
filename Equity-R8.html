<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Baker Computer earned $6.00 per share last year, has a retention ratio of 55%, and a return\non equity (ROE) of 20%. Assuming their required rate of return is 15%, how much would an\ninvestor pay for Baker on the basis of the earnings multiplier model?", "opts": ["$74.93.", "$40.00.", "$173.90."], "ans": "A", "expl": "g = Retention × ROE = (0.55) × (0.2) = 0.11\nP/E = 0.45 / (0.15 – 0.11) = 11.25\n01\nNext year's earnings E = E × (1 + g) = (6.00) × (1.11) = $6.66\n10\nP = 11.25($6.66) = $74.93\n0\n(Module 46.3, LOS 46.k)"}, {"n": 2, "q": "According to the earnings multiplier model, a stock's P/E ratio (P/E) is affected by all of the\n01\nfollowing EXCEPT the:", "opts": ["expected stock price in one year.", "required return on equity.", "expected dividend payout ratio."], "ans": "A", "expl": "According to the earnings multiplier model, the P/E ratio is equal to P/E = (D/E)/(k - g).\n0111e\nThus, the P/E ratio is determined by:\nThe expected dividend payout ratio (D/E).\n11\nThe required rate of return on the stock (k).\ne\nThe expected growth rate of dividends (g).\n(Module 46.3, LOS 46.k)"}, {"n": 3, "q": "Which of the following shows the dividend payment chronology in its proper sequence?", "opts": ["Declaration date, ex-dividend date, holder-of-record date, payment date.", "Declaration date, holder-of-record date, ex-dividend date, payment date.", "Ex-dividend date, holder-of-record date, declaration date, payment date."], "ans": "A", "expl": "The dividend payment chronology begins with the declaration of a dividend by the board of\ndirectors. The ex-dividend date occurs one or two business days before the holder-of-record\ndate.\n(Module 46.1, LOS 46.d)"}, {"n": 4, "q": "An asset-based valuation model is most appropriate for a company that:", "opts": ["has a high proportion of intangible assets among its total assets.", "is expected to remain profitable for the foreseeable future.", "is likely to be liquidated."], "ans": "C", "expl": "For companies that are likely to be liquidated, the asset-based approach may be the most\nappropriate value as the assets may be worth more to another entity. Asset-based valuation\nmodels do not work well for companies that have large amounts of intangible assets. Because\nasset-based valuation is not forward-looking, an asset-based approach may underestimate\nthe value of companies that are expected to be profitable.\n(Module 46.3, LOS 46.m)"}, {"n": 5, "q": "If the return on equity for a firm is 15% and the retention rate is 40%, the firm's sustainable\ngrowth rate is closest to:", "opts": ["6%.", "9%.", "15%."], "ans": "A", "expl": "g = (RR)(ROE)\n= (0.15)(0.40)\n= 0.06 or 6%\n(Module 46.2, LOS 46.h)"}, {"n": 6, "q": "An analyst gathered the following information about an industry. The industry beta is 0.9.\nThe industry profit margin is 8%, the total asset turnover ratio is 1.5, and the leverage\nmultiplier is 2. The dividend payout ratio of the industry is 50%. The risk-free rate is 7% and\nthe expected market return is 15%. The industry P/E is closest to:", "opts": ["12.00.", "14.20.", "22.73."], "ans": "C", "expl": "Using the CAPM: k = 7% + 0.9(0.15 – 0.07) = 14.2%.\ni\nUsing the DuPont equation: ROE = 8% × 1.5 × 2 = 24%.\ng = retention ratio × ROE = 0.50 × 24% = 12%.\nP/E = 0.5/(0.142 – 0.12) = 22.73.\n(Module 46.3, LOS 46.k)"}, {"n": 7, "q": "Given the following estimated financial results for the next period, value the stock of\nFishnChips, Inc., using the infinite period dividend discount model (DDM).\nSales of $1,000,000.\nEarnings of $150,000.\nTotal assets of $800,000.\nEquity of $400,000.\nDividend payout ratio of 60.0%.\nAverage shares outstanding of 75,000.\nReal risk free interest rate of 4.0%.\nExpected inflation rate of 3.0%.\nExpected market return of 13.0%.\nStock Beta at 2.1.\nThe per share value of FishnChips stock is approximately: (Note: Carry calculations out to at\nleast 3 decimal places.)", "opts": ["$17.91.", "$26.86.", "$30.89."], "ans": "B", "expl": "Here, we are given all the inputs we need. Use the following steps to calculate the value of the\nstock:\nFirst, expand the infinite period DDM:\nDDM formula: P = D / (k – g)\n01e\nD\n= (Earnings × Payout ratio) / average number of shares outstanding\n1\n= ($150,000 × 0.60) / 75,000 = $1.20\nk\n= nominal risk free rate + [beta × (expected market return – nominal risk free rate)]\ne\nNote: Nominal risk-free rate= (1 + real risk free rate) × (1 + expected inflation) – 1\n= (1.04)×(1.03) – 1 = 0.0712, or 7.12%.\nk\n= 7.12% + [2.1 × (13.0% − 7.12%)] = 0.19468\ne\ng= (retention rate × ROE)\nRetention= (1 – Payout) = 1 – 0.60 = 0.40.\nROE= (net income / sales)(sales / total assets)(total assets / equity)\n= (150,000 / 1,000,000)(1,000,000 / 800,000)(800,000 /\n400,000)\n= 0.375\ng= 0.375 × 0.40 = 0.15\nThen, calculate: P = D / (k – g) = $1.20 / (0.19468 – 0.15) = 26.86.\n01e\n(Module 46.2, LOS 46.h)"}, {"n": 8, "q": "An equity valuation model that values a firm based on the market value of its outstanding\ndebt and equity securities, relative to a firm fundamental, is best described as:", "opts": ["an asset-based model.", "an enterprise value model.", "a discounted cash flow model."], "ans": "B", "expl": "An enterprise value model relates a firm's enterprise value (the market value of its\noutstanding equity and debt securities minus its cash and marketable securities holdings) to\nits EBITDA, operating earnings, or revenue.\n(Module 46.1, LOS 46.b)"}, {"n": 9, "q": "An analyst gathered the following data:\nAn earnings retention rate of 40%.\nAn ROE of 12%.\nThe stock's beta is 1.2.\nThe nominal risk free rate is 6%.\nThe expected market return is 11%.\nAssuming next year's earnings will be $4 per share, the stock's current value is closest to:", "opts": ["$33.32.", "$45.45.", "$26.67."], "ans": "A", "expl": "Dividend payout = 1 – earnings retention rate = 1 – 0.4 = 0.6\nR = R + β(R – R) = 0.06 + 1.2(0.11 – 0.06) = 0.12\nSfMf\ng = (retention rate)(ROE) = (0.4)(0.12) = 0.048\nD = E × payout ratio = $4.00 × 0.60 = $2.40\n11\nPrice = D / (k – g) = $2.40 / (0.12 – 0.048) = $33.32\n1\n(Module 46.3, LOS 46.k)"}, {"n": 10, "q": "Assume that at the end of the next year, Company A will pay a $2.00 dividend per share, an\nincrease from the current dividend of $1.50 per share. After that, the dividend is expected to\nincrease at a constant rate of 5%. If an investor requires a 12% return on the stock, what is\nthe value of the stock?", "opts": ["$28.57.", "$30.00.", "$31.78."], "ans": "A", "expl": "P = D / k – g\n01\nD = $2\n1\ng = 0.05\nk = 0.12\nP = 2 / 0.12 – 0.05 = 2 / 0.07 = $28.57\n0\n(Module 46.2, LOS 46.h)"}, {"n": 11, "q": "A firm will not pay dividends until four years from now. Starting in year four dividends will be\n$2.20 per share, the retention ratio will be 40%, and ROE will be 15%. If k = 10%, what should\nbe the value of the stock?", "opts": ["$41.32.", "$55.25.", "$58.89."], "ans": "A", "expl": "g = ROE × retention ratio = ROE × b = 15 × 0.4 = 6%\nBased on the growth rate we can calculate the expected price in year 3:\nP = D / (k – g) = 2.2 / (0.10 – 0.06) = $55\n34\nThe stock value today is:\nP = PV (55) at 10% for 3 periods = $41.32\n0\n(Module 46.2, LOS 46.h)"}, {"n": 12, "q": "Given the following information, compute price/sales.\nBook value of assets = $550,000.\nTotal sales = $200,000.\nNet income = $20,000.\nDividend payout ratio = 30%.\nOperating cash flow = $40,000.\nPrice per share = $100.\nShares outstanding = 1,000.\nBook value of liabilities = $500,000.", "opts": ["2.50X.", "2.00X.", "0.50X."], "ans": "C", "expl": "Market value of equity = ($100)(1000) = $100,000\nPrice / Sales = $100,000 / $200,000 = 0.5X\n(Module 46.3, LOS 46.k)"}, {"n": 13, "q": "Which of the following statements about the constant growth dividend discount model\n(DDM) in its application to investment analysis is least accurate? The model:", "opts": ["can’t be applied when g > K.", "is best applied to young, rapidly growing firms.", "is inappropriate for firms with variable dividend growth."], "ans": "B", "expl": "The model is most appropriately used when the firm is mature, with a moderate growth rate,\npaying a constant stream of dividends. In order for the model to produce a finite result, the\ncompany's growth rate must not exceed the required rate of return.\n(Module 46.2, LOS 46.i)"}, {"n": 14, "q": "When a company's return on equity (ROE) is 12% and the dividend payout ratio is 60%, what\nis the implied sustainable growth rate of earnings and dividends?", "opts": ["4.0%.", "4.8%.", "7.8%."], "ans": "B", "expl": "g = ROE × retention ratio = ROE × (1 – payout ratio) = 12 (0.4) = 4.8%\n(Module 46.2, LOS 46.h)"}, {"n": 15, "q": "A payment to shareholders in the form of additional shares instead of cash is most\naccurately characterized as a:", "opts": ["private placement.", "stock dividend.", "stock split."], "ans": "B", "expl": "Stock dividends are dividends paid out in new shares of stock instead of cash. While a stock\nsplit has essentially the same effects as a stock dividend, it is carried out by declaring that\neach existing share will become some number of new shares (for example a 2-for-1 split). A\nprivate placement is an issuance of new shares to one or a group of investors in exchange for\ncash, when the issuance is not carried out as a public offering.\n(Module 46.1, LOS 46.c)"}, {"n": 16, "q": "An analyst gathered the following data for the Parker Corp. for the year ended December 31,\n2005:\nEPS = $1.75\n2005\nDividends = $1.40\n2005\nBeta = 1.17\nParker\nLong-term bond rate = 6.75%\nRate of return S&P 500 = 12.00%\nThe firm is expected to continue their dividend policy in future. If the long-term growth rate\nin earnings and dividends is expected to be 6%, the forward P/E ratio for Parker Corp. will\nbe:", "opts": ["11.61.", "21.54.", "12.31."], "ans": "A", "expl": "The required rate of return on equity for Parker will be 12.89% = 6.75% + 1.17(12.00% – 6.75%)\nand the firm pays 80% (1.40 / 1.75) of its earnings as dividends.\nForward P/E ratio = 0.80 / (0.1289 - 0.0600) = 11.61\nWhere r = required rate of return on equity, g = growth rate in dividends (forever).\nn\n(Module 46.3, LOS 46.k)"}, {"n": 17, "q": "A stock has a required return of 14% percent, a constant growth rate of 5% and a retention\nrate of 60%. The firm's P/E ratio should be:", "opts": ["4.44.", "5.55.", "6.66."], "ans": "A", "expl": "P/E = (1 - RR) / (k - g) = 0.4 / (0.14 - 0.05) = 4.44\n(Module 46.3, LOS 46.k)"}, {"n": 18, "q": "At the end of the last 12-month period, Romano's Italian Foods had net income of $16.68\nmillion and equity of $115 million. Romano's declared a $7.5 million dividend for the year.\nUsing internally generated funds, Romano's can grow its equity by approximately:", "opts": ["14.5% per year.", "8.0% per year.", "10.0% per year."], "ans": "B", "expl": "g = ROE × retention rate = [16.68 / 115] × [1 − (7.5 / 16.68)] = 0.145 × (1 − 0.45) = 7.975%. This\ngrowth rate represents the rate at which a company can grow its equity using internally\ngenerated funds.\n(Module 46.2, LOS 46.h)"}, {"n": 19, "q": "Assume a company has earnings per share of $5 and pays out 40% in dividends. The\nearnings growth rate for the next 3 years will be 20%. At the end of the third year the\ncompany will start paying out 100% of earnings in dividends and earnings will increase at an\nannual rate of 5% thereafter. If a 12% rate of return is required, the value of the company is\nclosest to:", "opts": ["$55.70.", "$102.80.", "$92.90."], "ans": "B", "expl": "First, calculate the dividends in years 0 through 3:\nD = (0.4)(5) = 2\n0\nD = (2)(1.2) = 2.40\n1\nD = (2.4)(1.2) = 2.88\n2\n3\nD = E = 5(1.2) = 8.64\n33\nThe first dividend of the constant growth period is:\nD = 8.64(1.05) = 9.07\n4\nUse D to estimate the stock's value at t = 3:\n4\nD\n9.07\n4\nP===129.57\n3\nk–g0.12–0.05\nThe value of the stock is the present value of its future cash flows:\n8.64+129.57\n2.402.88\nP=++=102.81\n0\n1.12\n23\n1.121.12\n(Module 46.2, LOS 46.h)"}, {"n": 20, "q": "A firm has an expected dividend payout ratio of 48 percent and an expected future growth\nrate of 8 percent. What should the firm's price to earnings ratio (P/E) be if the required rate\nof return on stocks of this type is 14 percent and what is the retention ratio of the firm?\nP/E ratioRetention ratio", "opts": ["8.052%", "6.552%", "6.548%"], "ans": "A", "expl": "P/E = (dividend payout ratio)/(k - g)\nP/E = 0.48/(0.14 - 0.08) = 8\nThe retention ratio = (1 - dividend payout) = (1 - 0.48) = 52%\n(Module 46.3, LOS 46.k)", "qhtml": "<p>A firm has an expected dividend payout ratio of 48 percent and an expected future growth rate of 8 percent. What should the firm's price to earnings ratio (P/E) be if the required rate of return on stocks of this type is 14 percent and what is the retention ratio of the firm?</p><p><em>Options show → <strong>P/E Ratio</strong> | <strong>Retention Ratio</strong></em></p>"}, {"n": 21, "q": "The rationale for using dividend discount models to value equity is that the:", "opts": ["inputs are easily estimated and the model’s estimates are robust.", "intrinsic value of a stock is the present value of its future dividends.", "model works well for the finite period of time over which dividends are paid."], "ans": "B", "expl": "The rationale for dividend discount models is that the fundamental or intrinsic value of a\nstock is the present value of all its future dividends. Dividend discount models can be applied\nto either a finite or infinite stream of dividends. There are many ways to calculate the inputs\nand the estimated stock values may vary significantly with small changes in the inputs.\n(Module 46.2, LOS 46.e)"}, {"n": 22, "q": "The current price of XYZ, Inc., is $40 per share with 1,000 shares of equity outstanding. Sales\nare $4,000 and the book value of the firm is $10,000. What is the price/sales ratio of XYZ,\nInc.?", "opts": ["10.000.", "0.010.", "4.000."], "ans": "A", "expl": "The price/sales ratio is (price per share)/(sales per share) = (40)/(4,000/1,000) = 10.0.\nAlternatively, the price/sales ratio may be thought of as the market value of the company\ndivided by its sales, or (40 × 1,000)/4,000, or 10.0 again.\n(Module 46.3, LOS 46.k)"}, {"n": 23, "q": "Which of the following is least likely an assumption of the constant growth dividend discount\nmodel (DDM)?", "opts": ["Dividend payout is constant.", "ROE is constant.", "The growth rate of the firm is higher than the overall growth rate of the economy."], "ans": "C", "expl": "Other assumptions of the DDM are: dividends grow at a constant rate and the growth rate\ncontinues for an infinite period.\n(Module 46.2, LOS 46.i)"}, {"n": 24, "q": "General, Inc., has net income of $650,000 and one million shares outstanding. The profit\nmargin is 6 percent and General, Inc., is selling for $30.00. The price/sales ratio is equal to:", "opts": ["10.83.", "2.77.", "0.65."], "ans": "B", "expl": "6% profit margin = $650,000/x; x (sales) = $10,833,333.\nSales per share = $10.83 M/1,000,000 = $10.83 per share.\nP/Sales = $30.00/$10.83 = 2.77.\n(Module 46.3, LOS 46.k)"}, {"n": 25, "q": "Which type of cash dividend is most likely to be declared by a cyclical firm during good\ntimes?", "opts": ["Regular dividend.", "Special dividend.", "Stock dividend."], "ans": "B", "expl": "Special dividends are used when favorable circumstances allow the firm to make a one-time\ncash payment to shareholders, in addition to any regular dividends the firm pays. Many\ncyclical firms (e.g., automakers) will use a special dividend to share profits with shareholders\nwhen times are good but maintain the flexibility to conserve cash when profits are down.\n(Module 46.1, LOS 46.c)"}, {"n": 26, "q": "Which of the following statements concerning security valuation is least accurate?", "opts": ["A firm with a $1.50 dividend last year, a dividend payout ratio of 40%, a return on equity of 12%, and a 15% required return is worth $18.24.", "The best way to value a company with high and unsustainable growth that exceeds the required return is to use the temporary supernormal growth (multistage) model.", "The best way to value a company expecting to pay a constantly growing dividend as from the third year is to use the Gordon growth model."], "ans": "A", "expl": "A firm with a $1.50 dividend last year, a dividend payout ratio of 40%, a return on new\ninvestment of 12%, and a 15% required return is worth $20.64. The growth rate is (1 – 0.40) ×\n0.12 = 7.2%. The expected dividend is then ($1.50)(1.072) = $1.61. The value is then (1.61) /\n(0.15 – 0.072) = $20.64.\n(Module 46.2, LOS 46.i)"}, {"n": 27, "q": "Assuming all other factors remain unchanged, which of the following would most likely lead\nto a decrease in the market P/E ratio?", "opts": ["An increase in the dividend payout ratio.", "A decline in the risk-free rate.", "A rise in the stock risk premium."], "ans": "C", "expl": "P/E = (1 - RR)/(k - g)\nTo lower P/E: RR increases, g decreases and or k increases. Both a decline in the RF rate and a\ndecline in the rate of inflation will reduce k. An increase in the stock's risk premium will\nincrease k.\n(Module 46.3, LOS 46.k)"}, {"n": 28, "q": "A stock has a required rate of return of 15%, a constant growth rate of 10%, and a dividend\npayout ratio of 45%. The stock's justified price-earnings ratio is closest to:", "opts": ["3.0 times.", "4.5 times.", "9.0 times."], "ans": "C", "expl": "The constant growth dividend discount model can be stated in terms of a company's price-\nearnings ratio:\nP/E = (D/E) / (k – g)\n0111\nwhere P/E is the justified P/E ratio and D/E is the expected dividend payout ratio.\n0111\nHere, D/E = 0.45, the required rate of return k = 0.15, and the constant growth rate of\n11\ndividends g = 0.10.\nP/E = 0.45 / (0.15 – 0.10)\n01\n= 0.45 / 0.05 = 9.0\n(Module 46.3, LOS 46.k)"}, {"n": 29, "q": "A high growth rate of dividends is most likely to be consistent with:", "opts": ["a high dividend payout ratio.", "a high ROE.", "a low retention rate."], "ans": "B", "expl": "The growth rate of dividends can be estimated as retention rate × ROE, or (1 – payout ratio) ×\nROE. Thus high ROE is consistent with a high growth rate. A high dividend payout ratio (which\nis the same as a low retention rate) is more likely to be consistent with a low growth rate of\ndividends.\n(Module 46.2, LOS 46.h)"}, {"n": 30, "q": "An analyst gathered the following data for the Parker Corp. for the year ended December 31,\n2005:\nEPS = $1.75\n2005\nDividends = $1.40\n2005\nBeta = 1.17\nParker\nLong-term bond rate = 6.75%\nRate of return S&P = 12.00%\n500\nThe firm has changed its dividend policy and now plans to pay out 60% of its earnings as\ndividends in the future. If the long-term growth rate in earnings and dividends is expected to\nbe 5%, the appropriate price to earnings (P/E) ratio for Parker will be:", "opts": ["7.98.", "7.60.", "9.14."], "ans": "B", "expl": "Required rate of return on equity will be 12.89% = 6.75% + 1.17(12.00% - 6.75).\nP/E Ratio = 0.60 / (0.1289 - 0.0500) = 7.60.\n(Module 46.3, LOS 46.k)"}, {"n": 31, "q": "An enterprise value multiple is typically calculated as the ratio of enterprise value to a\nmeasure of:", "opts": ["pretax income.", "net income.", "operating income."], "ans": "C", "expl": "An enterprise value multiple is typically calculated as the ratio of enterprise value to EBITDA\nor some other measure of operating income. Net income or pretax income are not typically\nused because they reflect a firm's current capital structure and non-cash charges, and\nbecause the ratio becomes meaningless when income is negative.\n(Module 46.3, LOS 46.l)"}, {"n": 32, "q": "A stock's price currently is $100. An analyst forecasts the following for the stock:\nThe normalized trailing price earnings (P/E) ratio will be 12×.\nThe stock is expected to pay a $5 dividend this coming year on projected earnings of\n$10 per share.\nIf the analyst were to buy and hold the stock for the year, the projected rate of return based\non these forecasts is closest to:", "opts": ["25%.", "15%.", "20%."], "ans": "A", "expl": "The forecast year-end price, P, is:\n/\nP\nP=EPS×()=10(12)=120\nE\ndividend+(ending price−beginning price)\nexpected return=\nbeginning price\n$5+$120−$100\n=\n$100\n=0.25 or 25%\n(Module 46.3, LOS 46.k)"}, {"n": 33, "q": "Assume the following information for a stock:\nBeta coefficient= 1.50\nRisk-free rate= 6%\nExpected rate of return on market= 14%\nDividend payout ratio= 30%\nExpected dividend growth rate= 11%\nThe estimated earnings multiplier (P/E ratio) is closest to:", "opts": ["4.29.", "3.33.", "10.00."], "ans": "A", "expl": "P/E = D/E1 / (k – g)\nD/E1 = Dividend payout ratio = 0.3\ng = 0.11\nk = 6 + (1.5)(14 – 6) = 18%\nP/E = 0.3 / (0.18 – 0.11) = 0.3 / 0.07 = 4.29\n(Module 46.3, LOS 46.k)"}, {"n": 34, "q": "What is the value of a preferred stock that is expected to pay a $5.00 annual dividend per\nyear forever if similar risk securities are now yielding 8%?", "opts": ["$40.00.", "$60.00.", "$62.50."], "ans": "C", "expl": "$5.00/0.08 = $62.50.\n(Module 46.2, LOS 46.g)"}, {"n": 35, "q": "Gwangwa Gold, a South African gold producer, has as its primary asset a mine which is\nshown on the balance sheet with a value of R100 million. An analyst estimates the market\nvalue of this mine to be 90% of book value. The company's balance sheet shows other assets\nof R20 million and liabilities of R40 million, and the analyst feels that the book value of these\nitems reflects their market values. Using the asset-based valuation approach, what should\nthe analyst estimate the value of the company to be?", "opts": ["R110 million.", "R70 million.", "R80 million."], "ans": "B", "expl": "Market value of assets = 0.9(R100 million) + R20 million = R110 million\nMarket value of liabilities = R40 million\nEstimated net value of company = R110 million – R40 million = R70 million.\n(Module 46.3, LOS 46.m)"}, {"n": 36, "q": "A stock has a steady 5% growth rate in dividends. The required rate of return for stocks of\nthis risk class is 15%. The stock is expected to pay a $1 dividend this coming year. The\nexpected value of the stock at the end of the fourth year is:", "opts": ["$12.16.", "$16.32.", "$14.21."], "ans": "A", "expl": "n4\nFirst solve for D: D = (D)(1 + g) = $1(1.05) = $1.216\n551\nD\n$1.216\n5\nP===$12.16\n4\n(k−g)(0.15−0.05)\nor\n1\nP==10\n0\n0.15−0.05\n4\nP=10(1.05)=$12.16\n4\n(Module 46.2, LOS 46.h)"}, {"n": 37, "q": "The following data pertains to a common stock:\nIt will pay no dividends for two years.\nThe dividend three years from now is expected to be $1.\nDividends are expected to grow at a 7% rate from that point onward.\nIf an investor requires a 17% return on this stock, what will they be willing to pay for this\nstock now?", "opts": ["$ 6.24.", "$ 7.30.", "$10.00."], "ans": "B", "expl": "time line = $0 now; $0 in yr 1; $0 in yr 2; $1 in yr 3.\nP= D/(k - g) = 1/(.17 - .07) = $10\n2 3\nNote the math. The price is always one year before the dividend date.\nSolve for the PV of $10 to be received in two years.\nFV = 10; n = 2; i = 17; compute PV = $7.30\n(Module 46.2, LOS 46.h)"}, {"n": 38, "q": "If a company has a \"0\" earnings retention rate, the firm's P/E ratio will equal:", "opts": ["1 / k.", "D/P + g.", "k + g."], "ans": "A", "expl": "P/E = div payout ratio / (k – g)\nwhere g = (retention rate)(ROE) = (0)(ROE) = 0\nDividend payout = 1 – retention ratio = 1 – 0 = 1\nP/E = 1 / (k – 0) = 1 / k\n(Module 46.3, LOS 46.k)"}, {"n": 39, "q": "Assuming the risk-free rate is 5% and the expected return on the market is 12%, what is the\nvalue of a stock with a beta of 1.5 that paid a $2 dividend last year if dividends are expected\nto grow at a 5% rate forever?", "opts": ["$12.50.", "$17.50.", "$20.00."], "ans": "C", "expl": "P = D / (k – g)\n01\nR = R + β(R – R) = 0.05 + 1.5(0.12 – 0.05) = 0.155\nsfMf\nD = D(1 + g) = 2 × (1.05) = 2.10\n10\nP = 2.10 / (0.155 – 0.05) = $20.00\n0\n(Module 46.2, LOS 46.h)"}, {"n": 40, "q": "A company has an 8 percent preferred stock outstanding with a par value of $100. The\nrequired return on the preferred is 5 percent. What is the value of the preferred stock?", "opts": ["$100.00.", "$152.81.", "$160.00."], "ans": "C", "expl": "The annual dividend on the preferred is $100(.08) = $8.00. The value of the preferred is\n$8.00/0.05 = $160.00.\n(Module 46.2, LOS 46.g)"}, {"n": 41, "q": "Which of the following is least likely an advantage of using price-to-book value (PBV)\nmultiples in stock valuation?", "opts": ["PBV ratios can be compared across similar firms if accounting standards are consistent.", "Book value is often positive, even when earnings are negative.", "Book values are highly useful measures for firms in service industries."], "ans": "C", "expl": "Book values tend not to be useful valuation measures for firms in service industries because\nthey typically have fewer tangible assets on their balance sheets than firms in other\nindustries.\nTwo of the advantages of using P/BV ratios for equity valuation are that P/BV ratios can be\ncompared across similar firms if accounting standards are consistent, and that book value is\ntypically positive even when earnings are negative and P/E ratios are not meaningful.\n(Module 46.3, LOS 46.f)"}, {"n": 42, "q": "If an analyst estimates the intrinsic value for a security that is different from its market\nvalue, the analyst should most likely take an investment position based on this difference if:", "opts": ["many analysts independently evaluate the security.", "the model used is not highly sensitive to its input values.", "the security lacks a liquid market and trades infrequently."], "ans": "B", "expl": "In general, an analyst can be more confident about an estimate of intrinsic value if the model\nused is not highly sensitive to changes in its inputs. If a large number of analysts follow a\nsecurity, its market value is more likely to be a reliable estimate of its intrinsic value. A\nsecurity that does not trade frequently or in a liquid market may remain mispriced for an\nextended time, and thus may not result in a profit within the investment horizon even if the\nanalyst's estimate of intrinsic value is correct.\n(Module 46.1, LOS 46.a)"}, {"n": 43, "q": "The risk-free rate is 5%, and the expected return on the market index is 15%. A stock has a:\nBeta of 1.0.\nDividend payout ratio of 40%.\nReturn on equity (ROE) of 15%.\nIf the stock is expected to pay a $2.50 dividend, its intrinsic value using dividend discount\nmodel is closest to:", "opts": ["$53.33.", "$27.77.", "$41.67."], "ans": "C", "expl": "E(R) = R + beta(R − R)\nfMf\nk = E(R) = 0.05 + 1(0.15 − 0.05) = 0.15\nRetention (b) = (1 − dividend payout ratio) = 1 − 0.4 = 0.6\ng = (ROE)(b) = (0.15)(0.6) = 0.09\nD\n$2.50\n1\nValue===$41.67\nk−g0.15−0.09\n(Module 46.2, LOS 46.h)"}, {"n": 44, "q": "All else equal, an increase in a company's growth rate will most likely cause its P/E ratio to:", "opts": ["decrease.", "either increase or decrease.", "increase."], "ans": "C", "expl": "Increase in g: As g increases, the spread between k and g, or the P/E denominator, will\ne\ndecrease, and the P/E ratio will increase.\n(Module 46.3, LOS 46.k)"}, {"n": 45, "q": "A company with a return on equity (ROE) of 27%, required return on equity (k) of 20%, and a\ne\ndividend payout ratio of 40% has an implied sustainable growth rate closest to:", "opts": ["10.80%.", "12.00%.", "16.20%."], "ans": "C", "expl": "g = (RR)(ROE)\n= (.60)(.27)\n= 0.162 or 16.2%\n(Module 46.2, LOS 46.h)"}, {"n": 46, "q": "A firm has a profit margin of 10%, an asset turnover of 1.2, an equity multiplier of 1.3, and an\nearnings retention ratio of 0.5. What is the firm's internal growth rate?", "opts": ["4.5%.", "6.7%.", "7.8%."], "ans": "C", "expl": "ROE = (Net Income / Sales)(Sales / Total Assets)(Total Assets / Total Equity)\nROE = (0.1)(1.2)(1.3) = 0.156\ng = (retention ratio)(ROE) = 0.5(0.156) = 0.078 or 7.8%\n(Module 46.2, LOS 46.h)"}, {"n": 47, "q": "All else equal, the price-to-earnings (P/E) ratio of a stable firm will increase if the:", "opts": ["dividend payout is decreased.", "long-term growth rate is decreased.", "ROE is increased."], "ans": "C", "expl": "The increase in growth rate will increase the P/E ratio of a stable firm and growth rate can be\ncalculated by the formula g = ROE × retention ratio. All else being equal an increase in ROE\nwill therefore increase the P/E ratio. Note that decreasing the dividend payout ratio and\ndecreasing the long term growth rate will both serve to decrease the P/E ratio.\n(Module 46.3, LOS 46.k)"}, {"n": 48, "q": "Gourmet and Company has the following information:\nCurrent market value = $250 million\nCurrent book value = $225 million\nSales = $750 million\nEarnings = $75 million\nCash flow = $125 million\nStock price = $7.50\nWhich of the following statements regarding Gourmet and Company is most accurate?", "opts": ["The price/book ratio is 0.90.", "The price/sales ratio is 0.33.", "The price/earnings ratio is 33.3."], "ans": "B", "expl": "The price/sales ratio is $250/$750 = 0.33. Price/book = $250/$225 = 1.11.\nPrice/earnings = $250/$75 = 3.33.\n(Module 46.3, LOS 46.k)"}, {"n": 49, "q": "The earnings multiplier model, derived from the dividend discount model, expresses a\nstock's P/E ratio (P/E) as the :\n01", "opts": ["expected dividend in one year divided by the difference between the required return on equity and the expected dividend growth rate.", "expected dividend payout ratio divided by the difference between the required return on equity and the expected dividend growth rate.", "expected dividend payout ratio divided by the sum of the expected dividend growth rate and the required return on equity."], "ans": "B", "expl": "Starting with the dividend discount model P = D/(k – g), and dividing both sides by E\n01e1\nyields: P/E = (D/E)/(k – g)\n0111e\nThus, the P/E ratio is determined by:\nThe expected dividend payout ratio (D/E).\n11\nThe required rate of return on the stock (k).\ne\nThe expected growth rate of dividends (g).\n(Module 46.3, LOS 46.k)"}, {"n": 50, "q": "If a preferred stock that pays a $11.50 dividend is trading at $88.46, what is the market's\nrequired rate of return for this security?", "opts": ["7.69%.", "11.76%.", "13.00%."], "ans": "C", "expl": "From the formula: Value = D / k, we derive k = D / Value = 11.50 /\nPreferred StockppPreferred Stock\n88.46 = 0.1300, or 13.00%.\n(Module 46.2, LOS 46.g)"}, {"n": 51, "q": "Preferred stock most likely has a:", "opts": ["variable dividend and no maturity.", "fixed dividend and maturity.", "fixed dividend and no maturity."], "ans": "C", "expl": "Preferred stock typically pays a fixed dividend and does not mature.\n(Module 46.2, LOS 46.g)"}, {"n": 52, "q": "Day and Associates is experiencing a period of abnormal growth. The last dividend paid by\nDay was $0.75. Next year, they anticipate growth in dividends and earnings of 25% followed\nby negative 5% growth in the second year. The company will level off to a normal growth\nrate of 8% in year three and is expected to maintain an 8% growth rate for the foreseeable\nfuture. Investors require a 12% rate of return on Day. The value of Day stock today is closest\nto:", "opts": ["$18.65.", "$24.05.", "$20.70."], "ans": "C", "expl": "First find the abnormal dividends:\nD = $0.75 × 1.25 = $0.9375\n1\nD = $0.9375 × 0.95 = $0.8906\n2\nNext find the first dividend of the constant growth period:\nD = $0.8906 × 1.08 = $0.9619\n3\nWe can use this dividend in the constant growth DDM to get a value for the stock in period 2:\n$0.9619\nP==$24.0469\n2\n(0.12–0.08)\n$0.9375$0.8906+$24.0469\nValue of the stock today=+=$20.7171\n1.12\n2\n1.12\n(Module 46.2, LOS 46.h)"}, {"n": 53, "q": "Which of the following statements regarding price multiples is most accurate?", "opts": ["A disadvantage of the price/book value ratio is that it is not an appropriate measure for firms that primarily hold liquid assets.", "An advantage of the price/sales ratio is that it is meaningful even for distressed firms.", "A rationale for using the price/cash flow ratio is that there is only one clear definition of cash flow."], "ans": "B", "expl": "The P/S ratio is meaningful even for distressed firms, since sales revenue is always positive.\nThis is not the case for the P/E and P/BV ratios, which can be negative.\nIn the P/BV ratio book value is an appropriate measure of net asset value for firms that\nprimarily hold liquid assets.\nAnalysts use several different definitions of cash flow (CFO, adjusted CFO, FCFE, EBITDA, etc.)\nto calculate P/CF ratios.\nWhen earnings are negative, the P/E ratio is meaningless.\n(Module 46.3, LOS 46.j)"}, {"n": 54, "q": "Using an infinite period dividend discount model, find the value of a stock that last paid a\ndividend of $1.50. Dividends are expected to grow at 6 percent forever, the expected return\non the market is 12 percent and the stock's beta is 0.8. The risk-free rate of return is 5\npercent.", "opts": ["$26.50.", "$32.61.", "$34.57."], "ans": "C", "expl": "First find the required rate of return using the CAPM equation.\nk = 0.05 + 0.8(0.12 - 0.05) = 10.6%\n$1.50(1.06) /(0.106 - 0.06) = $34.57\n(Module 46.2, LOS 46.h)"}, {"n": 55, "q": "An enterprise value model for equity valuation is most accurately described as a(n):", "opts": ["asset-based model.", "discounted cash flow model.", "multiplier model."], "ans": "C", "expl": "An enterprise value model is an example of a multiplier model. Enterprise value is analyzed as\na multiple of revenue or earnings and compared among firms in a peer group.\n(Module 46.1, LOS 46.b)"}, {"n": 56, "q": "A stock has the following data associated with it:\nA required rate of return of 14%.\nA return on equity of 15%.\nAn earnings retention rate of 40%.\nThe stock's justified price-to-earnings ratio is closest to:", "opts": ["5.0.", "7.5.", "6.7."], "ans": "B", "expl": "dividend payout ratio\nP/E=\nk−g\ndividend payout ratio = 1 − retention ratio = 1 − 0.4 = 0.6\ngrowth rate (g) = retention rate × ROE = 0.4 × 15% = 6%\n0.6\nP/E==7.5\n0.14−0.06\n(Module 46.3, LOS 46.k)"}, {"n": 57, "q": "Assume that a stock paid a dividend of $1.50 last year. Next year, an investor believes that\nthe dividend will be 20% higher and that the stock will be selling for $50 at year-end. Assume\na beta of 2.0, a risk-free rate of 6%, and an expected market return of 15%. What is the value\nof the stock?", "opts": ["$40.32.", "$41.77.", "$45.00."], "ans": "B", "expl": "Using the Capital Asset Pricing Model, we can determine the discount rate equal to 0.06 +\n2(0.15 – 0.06) = 0.24. The dividends next year are expected to be $1.50 × 1.2 = $1.80. The\npresent value of the future stock price and the future dividend are determined by discounting\nthe expected cash flows at the discount rate of 24%: (50 + 1.8) / 1.24 = $41.77.\n(Module 46.2, LOS 46.h)"}, {"n": 58, "q": "A stock has the following elements: last year's dividend = $1, next year's dividend is 10%\nhigher, the price will be $25 at year-end, the risk-free rate is 5%, the market risk premium is\n5%, and the stock's beta is 1.5. The stock's price is closest to:", "opts": ["$20.20.", "$23.20.", "$23.50."], "ans": "B", "expl": "Cost of equity capital = 5% + 1.5(5%) = 12.5%\nP = (1.1 / 1.125) + (25 / 1.125) = $23.20.\n0\n(Module 46.2, LOS 46.h)"}, {"n": 59, "q": "Robert Higgins is estimating the price-earnings (P/E) ratio that will be appropriate for an\nindex at the end of next year. He has estimated that:\nExpected annual dividends will increase by 10% compared to this year.\nExpected earnings per share will increase by 10% compared to this year.\nThe expected growth rate of dividends will be the same as the current estimate of 5%.\nThe required rate of return will rise from 8% to 11%.\nCompared to the current P/E, the end-of-the-year P/E will be:", "opts": ["50% lower.", "10% higher.", "2% higher."], "ans": "A", "expl": "The numerator of the formula for the P/E is the payout ratio, which is unchanged (both\nexpected earnings and dividends increase by the same percentage). The denominator (k − g)\ndoubles from 3% to 6%, which will decrease the P/E by half.\n(Module 46.3, LOS 46.k)"}, {"n": 60, "q": "Company B paid a $1.00 dividend per share last year and is expected to continue to pay out\n40% of its earnings as dividends for the foreseeable future. If the firm is expected to earn a\n10% return on equity in the future, and if an investor requires a 12% return on the stock, the\nstock's value is closest to:", "opts": ["$16.67.", "$12.50.", "$17.67."], "ans": "C", "expl": "P = Value of the stock = D / (k – g)\n01\ng = (RR)(ROE)\nRR = 1 – dividend payout = 1 – 0.4 = 0.6\nROE = 0.1\ng = (0.6)(0.1) = 0.06\nD = (D)(1 + g) = (1)(1 + 0.06) = $1.06\n10\nP = 1.06 / (0.12 – 0.06) = 1.06 / 0.06 = $17.67\n0\n(Module 46.2, LOS 46.h)"}, {"n": 61, "q": "Asset-based valuation models are most appropriate for a firm that:", "opts": ["has cyclical earnings.", "has significant intangible assets.", "is being liquidated."], "ans": "C", "expl": "Asset-based valuation models are appropriate for a firm that is being liquidated because\nwhen a firm ceases to operate as a going concern, its value to equity owners depends on the\ndifference between the fair value of its assets and liabilities. Asset-based models are unlikely\nto be reliable for estimating the value of firms that have significant intangible assets because\nfair values of such assets are often difficult to determine. Such a firm may or may not have\ncyclical earnings.\n(Module 46.3, LOS 46.m)"}, {"n": 62, "q": "Assume that the expected dividend growth rate (g) for a firm decreased from 5% to zero.\nFurther, assume that the firm's cost of equity (k) and dividend payout ratio will maintain\ntheir historic levels. The firm's P/E ratio will most likely:", "opts": ["increase.", "decrease.", "become undefined."], "ans": "B", "expl": "The P/E ratio may be defined as: Payout ratio / (k - g), so if k is constant and g goes to zero,\nthe P/E will decrease.\n(Module 46.3, LOS 46.k)"}, {"n": 63, "q": "An investor is considering acquiring a common stock that he would like to hold for one year.\nAt the end of the year he expects to receive both $1.50 in dividends and $26 from the sale of\nthe stock. What is the maximum price he should pay for the stock today to earn a 15 percent\nreturn?", "opts": ["$23.91.", "$24.11.", "$27.30."], "ans": "A", "expl": "With a required rate of return of 15%, the most the investor should pay for the stock today is\n(26 + 1.50) / 1.15 = $23.91.\n(Module 46.2, LOS 46.h)"}, {"n": 64, "q": "Given the following information, compute the implied dividend growth rate.\nProfit margin = 10.0%\nTotal asset turnover = 2.0 times\nFinancial leverage = 1.5 times\nDividend payout ratio = 40.0%", "opts": ["12.0%.", "18.0%.", "4.5%."], "ans": "B", "expl": "Retention ratio equals 1 – 0.40, or 0.60.\nReturn on equity equals (10.0%)(2.0)(1.5) = 30.0%.\nDividend growth rate equals (0.60)(30.0%) = 18.0%.\n(Module 46.2, LOS 46.h)"}, {"n": 65, "q": "Which of the following is least likely a reason the price to cash flow (P/CF) model has grown\nin popularity?", "opts": ["CFs are generally more difficult to manipulate than earnings.", "CFs are used extensively in valuation models.", "CFs are more easily estimated than future dividends."], "ans": "C", "expl": "CFs are not easier to estimate than dividends.\n(Module 46.3, LOS 46.j)"}, {"n": 66, "q": "Rock, Inc. maintains a policy of paying 30% of earnings to its investors in the form of\ndividends. Rock is expected to generate a return on equity of 9.3%. Rock's beta is 1.5. The\nmarket risk premium is 6% and the risk-free rate is 3%. Rock's required rate of return is\nclosest to:", "opts": ["9.0%.", "9.3%.", "12.0%."], "ans": "C", "expl": "Required return = R + β(R – R) = 0.03 + 1.5(0.06) = 0.12\nfMf\n(Module 46.2, LOS 46.h)"}, {"n": 67, "q": "Enterprise value is most accurately described as a firm's:", "opts": ["market value of assets minus market value of liabilities, plus cash and short-term investments.", "market value of stock plus cash and short-term investments, minus market value of debt.", "market value of stock plus market value of debt, minus cash and short-term investments."], "ans": "C", "expl": "Enterprise value = market value of common and preferred stock + market value of debt – cash\nand short-term investments.\n(Module 46.3, LOS 46.l)"}, {"n": 68, "q": "The purchaser of a stock will receive the next dividend if the order is filled before the:", "opts": ["ex-dividend date.", "holder-of-record date.", "payment date."], "ans": "A", "expl": "The ex-dividend date is the cutoff date for receiving the dividend and occurs one or two\nbusiness days before the holder-of-record date. An investor who buys a share on or after the\nex-dividend date will not receive the dividend.\n(Module 46.1, LOS 46.d)"}, {"n": 69, "q": "A company's growth rate in dividends and earnings can be estimated as the:", "opts": ["difference between the retention ratio and the return on equity.", "product of the retention ratio and the return on equity.", "product of the return on equity and the dividend payout ratio."], "ans": "B", "expl": "Assuming past investments are stable and earnings are calculated to allow for maintenance of\npast earnings power, then the firm's expected dividend growth rate (g) can be defined as the\nfirm's earnings plowback or retention rate (RR) times the return on the equity (ROE) portion of\nnew investments. This growth rate is also called the sustainable growth rate.\n(Module 46.2, LOS 46.h)"}, {"n": 70, "q": "A company has just paid a $2.00 dividend per share and dividends are expected to grow at a\nrate of 6% indefinitely. If the required return is 13%, what is the value of the stock today?", "opts": ["$34.16.", "$32.25.", "$30.29."], "ans": "C", "expl": "The dividend just paid is D. To use the constant growth dividend discount model, we need\n0\nthe next period's dividend, D:\n1\nD = $2.00 × 0.06 = $2.12\n1\nP = D / (k – g) = 2.12 / (0.13 – 0.06) = $30.29\n01\n(Module 46.2, LOS 46.h)"}, {"n": 71, "q": "Which of the following is least likely an advantage of using price/sales (P/S) multiple to value\nan equity security, as compared to using price/earnings (P/E) multiples?", "opts": ["P/S multiples are not as volatile as P/E multiples and hence may be more reliable in valuation analysis.", "P/S multiples provide a meaningful framework for evaluating distressed firms when negative earnings prevent the use of P/E multiples.", "P/S multiples are more reliable than P/E multiples because sales data cannot be distorted by management."], "ans": "C", "expl": "Because aggressive revenue recognition practices can influence reported sales, it is not the\ncase that sales data cannot be distorted by management.\nP/S multiples tend to me less volatile than P/E multiples and can be used to value the equity\nsecurities of firms with negative earnings.\n(Module 46.3, LOS 46.f)"}, {"n": 72, "q": "Holding all else equal, if the beta of a stock increases, the stock's price will:", "opts": ["be unaffected.", "decrease.", "increase."], "ans": "B", "expl": "When the beta of a stock increases, its required return will increase. This increases the\ndiscount rate investors use to estimate the present value of the stock's future cash flows,\nwhich decreases the value of the stock.\n(Module 46.2, LOS 46.e)"}, {"n": 73, "q": "A firm has an expected dividend payout ratio of 50 percent, a required rate of return of 18\npercent, and an expected dividend growth rate of 3 percent. The firm's price to earnings\nratio (P/E) is:", "opts": ["3.33.", "6.66.", "2.78."], "ans": "A", "expl": "P/E = .5 / (18%-3%) = 3.33.\n(Module 46.3, LOS 46.k)"}, {"n": 74, "q": "A firm has a constant growth rate of 7% and just paid a dividend of $6.25. If the required rate\nof return is 12%, what will the stock sell for two years from now based on the dividend\ndiscount model?", "opts": ["$149.80.", "$133.75.", "$153.13."], "ans": "C", "expl": "33\nD(1+g)$6.25(1.07)\nD\n0\n3\nvalue @ t=2====$153.13\nk−gk−g0.12−0.07\n(Module 46.2, LOS 46.h)"}, {"n": 75, "q": "Use the following information and the dividend discount model to find the value of\nGoFlower, Inc.'s, common stock.\nLast year's dividend was $3.10 per share.\nThe growth rate in dividends is estimated to be 10% forever.\nThe return on the market is expected to be 12%.\nThe risk-free rate is 4%.\nGoFlower's beta is 1.1.", "opts": ["$26.64.", "$34.95.", "$121.79."], "ans": "C", "expl": "The required return for GoFlower is 0.04 + 1.1(0.12 – 0.04) = 0.128 or 12.8%. The expect\ndividend is ($3.10)(1.10) = $3.41. GoFlower's common stock is then valued using the infinite\nperiod dividend discount model (DDM) as ($3.41) / (0.128 – 0.10) = $121.79.\n(Module 46.2, LOS 46.h)"}, {"n": 76, "q": "A company last paid a $1.00 dividend, the current market price of the stock is $20 per share\nand the dividends are expected to grow at 5 percent forever. What is the required rate of\nreturn on the stock?", "opts": ["10.00%.", "10.25%.", "9.78%."], "ans": "B", "expl": "D (1 + g) / P + g = k\n00\n1.00 (1.05) / 20 + 0.05 = 10.25%.\n(Module 46.2, LOS 46.h)"}, {"n": 77, "q": "Use the following information on Brown Partners, Inc. to compute the current stock price.\nDividend just paid = $6.10\nExpected dividend growth rate = 4%\nExpected stock price in one year = $60\nRisk-free rate = 3%\nRisk premium on the stock = 12%", "opts": ["$57.48.", "$59.55.", "$57.70."], "ans": "C", "expl": "The current stock price is equal to (D + P) / (1 + k). D equals $6.10(1.04) = $6.34. The equity\n11e1\ndiscount rate is 3% + 12% = 15%. Therefore the current stock price is ($6.34 + $60)/(1.15) =\n$57.70\n(Module 46.2, LOS 46.h)"}, {"n": 78, "q": "Which valuation method is most appropriate to estimate a floor value for a firm being\nliquidated?", "opts": ["Asset-based.", "Discounted cash flow.", "Multiple based on fundamentals."], "ans": "A", "expl": "An asset-based model would likely be most appropriate to estimate a floor value for a firm\nentering liquidation. Future cash flows and firm fundamentals such as earnings or sales are\nnot relevant for a firm that is not a going concern.\n(Module 46.3, LOS 46.f)"}, {"n": 79, "q": "An analyst has gathered the following data for Webco, Inc:\nRetention = 40%\nROE = 25%\nk = 14%\nUsing the infinite period, or constant growth, dividend discount model, calculate the price of\nWebco's stock assuming that next year's earnings will be $4.25.", "opts": ["$125.00.", "$55.00.", "$63.75."], "ans": "C", "expl": "g = (ROE)(RR) = (0.25)(0.4) = 10%\nV = D / (k – g)\n1\nD = 4.25 (1 – 0.4) = 2.55\n1\nG = 0.10\nK – g = 0.14 – 0.10 = 0.04\nV = 2.55 / 0.04 = 63.75\n(Module 46.2, LOS 46.h)", "qhtml": "<p>An analyst has gathered the following data for Webco, Inc:</p><table class=\"qtable\"><tbody><tr><td>Retention =</td><td>40%</td></tr><tr><td>ROE =</td><td>25%</td></tr><tr><td>k =</td><td>14%</td></tr></tbody></table><p>Using the infinite period, or constant growth, dividend discount model, calculate the price of</p><p>Webco's stock assuming that next year's earnings will be $4.25.</p>"}, {"n": 80, "q": "Given the following information for EAV Technology, a U.S. GAAP reporting firm:\nNet income per share = $6\nPrice per share = $100\nDepreciation per share = $2\nInterest expense per share = $4\nMarginal tax rate = 25%\nWorking capital investment = $0\nThe price/cash flow ratio is closest to:", "opts": ["8.3X.", "9.1X.", "12.5X."], "ans": "C", "expl": "Operating cash flow = Net income per share + Depreciation per share = $6 + $2 = $8\nPrice/cash flow = $100 / $8.0X = 12.5X\n(Module 46.3, LOS 46.k)"}, {"n": 81, "q": "If all other factors remain unchanged, which of the following would most likely reduce a\ncompany's price/earnings ratio?", "opts": ["The dividend payout ratio increases, and the dividend growth rate increases.", "The dividend growth rate increases, and the required rate of return decreases.", "The required rate of return increases, and the dividend payout ratio decreases."], "ans": "C", "expl": "dividend payout ratio\nP/E=\nk−g\ng=ROE×retention rate\nIncreases in k reduce P/E. Increases in g or the dividend payout ratio increase P/E.\n(Module 46.2, LOS 46.h and Module 46.3, LOS 46.k)"}, {"n": 82, "q": "What value would be placed on a stock that currently pays no dividend but is expected to\nstart paying a $1 dividend five years from now? Once the stock starts paying dividends, the\ndividend is expected to grow at a 5 percent annual rate. The appropriate discount rate is 12\npercent.", "opts": ["$9.08.", "$8.11.", "$14.29."], "ans": "A", "expl": "P = D5/(k-g) = 1/(.12-.05) = 14.29\n4\nP = [FV = 14.29; n = 4; i = 12] = $9.08.\n0\n(Module 46.2, LOS 46.h)"}, {"n": 83, "q": "Assume that a firm has an expected dividend payout ratio of 20%, a required rate of return\nof 9%, and an expected dividend growth of 5%. What is the firm's estimated price-to-\nearnings (P/E) ratio?", "opts": ["20.00.", "5.00.", "2.22."], "ans": "B", "expl": "The price-to-earnings (P/E) ratio is equal to (D/E)/(k – g) = 0.2/(.09 – 0.05) = 5.00.\n11\n(Module 46.3, LOS 46.k)"}, {"n": 84, "q": "All of the following factors affects the firm's P/E ratio EXCEPT:", "opts": ["growth rates of dividends.", "the expected interest rate on the bonds of the firm.", "the required rate of return."], "ans": "B", "expl": "The factors that affect the P/E ratio are the same factors that affect the value of a firm in the\ninfinite growth dividend discount model. The expected interest rate on the bonds is not a\nsignificant factor affecting the P/E ratio.\n(Module 46.3, LOS 46.k)"}, {"n": 85, "q": "The capital asset pricing model can be used to estimate which of the following inputs to the\ndividend discount model?", "opts": ["The expected inflation rate.", "The expected growth rate in dividends.", "The required return on equity."], "ans": "C", "expl": "The capital asset pricing model is a rate of return model that can be used to estimate a stock's\nrequired rate of return, given the nominal risk-free rate, the market risk premium, and the\nstock's beta:\nk = R + (beta)(R - R).\nnominal risk free ratemarketnominal risk free rate\n(Module 46.2, LOS 46.h)"}, {"n": 86, "q": "If the payout ratio increases, the justified P/E multiple will:", "opts": ["decrease, if we assume that the growth rate remains constant.", "always increase.", "increase, if we assume that the growth rate remains constant."], "ans": "C", "expl": "When payout ratio increases, the justified P/E multiple increases only if we assume that the\ngrowth rate will not change as a result.\n(Module 46.3, LOS 46.k)"}, {"n": 87, "q": "Witronix is a rapidly growing U.S. company that has increased free cash flow to equity and\ndividends at an average rate of 25% per year for the last four years. The present value model\nthat is most appropriate for estimating the value of this company is a:", "opts": ["Gordon growth model.", "multistage dividend discount model.", "single stage free cash flow to equity model."], "ans": "B", "expl": "A multistage model is the most appropriate model because the company is growing dividends\nat a higher rate than can be sustained in the long run. Though the company may be able to\ngrow dividends at a higher-than-sustainable 25% annual rate for a finite period, at some point\ndividend growth will have to slow to a lower, more sustainable rate. The Gordon growth\nmodel is appropriate to use for mature companies that have a history of increasing their\ndividend at a steady and sustainable rate. A single stage free cash flow to equity model is\nsimilar to the Gordon growth model, but values future free cash flow to equity rather than\ndividends.\n(Module 46.2, LOS 46.e)"}, {"n": 88, "q": "Of the following types of firm, which is most suitable for P/B ratio analysis?", "opts": ["A service industry firm without significant fixed assets.", "A firm with accounting standards consistent to other firms.", "A firm with accounting standards different from other firms."], "ans": "B", "expl": "Assuming consistent accounting standards across firms, P/B ratios can reveal signs of\nmisvaluation across firms.\n(Module 46.3, LOS 46.j)"}, {"n": 89, "q": "If a firm's growth rate is 12% and its dividend payout ratio is 30%, its current return on\nequity (ROE) is closest to:", "opts": ["40.00%.", "17.14%.", "36.00%."], "ans": "B", "expl": "g = (RR)(ROE)\ng / RR = ROE\n0.12 / (1 - 0.30) = 0.12 / 0.70 = 0.1714 or 17.14%\n(Module 46.2, LOS 46.h)"}, {"n": 90, "q": "A company has 6% preferred stock outstanding with a par value of $100. The required return\non the preferred is 8%. What is the value of the preferred stock?", "opts": ["$100.00.", "$75.00.", "$92.59."], "ans": "B", "expl": "The annual dividend on the preferred is $100(.06) = $6.00. The value of the preferred is\n$6.00/0.08 = $75.00.\n(Module 46.2, LOS 46.g)"}, {"n": 91, "q": "An analyst projects the following pro forma financial results for Magic Holdings, Inc., in the\nnext year:\nSales of $1,000,000\nEarnings of $200,000\nTotal assets of $750,000\nEquity of $500,000\nDividend payout ratio of 62.5%\nShares outstanding of 50,000\nRisk free interest rate of 7.5%\nExpected market return of 13.0%\nStock Beta at 1.8\nIf the analyst assumes Magic Holdings, Inc. will produce a constant rate of dividend growth,\nthe value of the stock is closest to:", "opts": ["$44.", "$104.", "$19."], "ans": "B", "expl": "Infinite period DDM: P = D / (k – g)\n01e\nD= (Earnings × Payout ratio) / average number of shares outstanding\n1\n= ($200,000 × 0.625) / 50,000 = $2.50.\nk\n= risk free rate + [beta × (expected market return – risk free rate)]\ne\nk\n= 7.5% + [1.8 × (13.0% - 7.5%)] = 17.4%.\ne\ng= (retention rate × ROE)\nRetention = (1 – Payout) = 1 – 0.625 = 0.375.\nROE = net income/equity\n= 200,000/500,000 = 0.4\ng= 0.375 × 0.4 = 0.15.\nP = D / (k – g) = $2.50 / (0.174 - 0.15) = 104.17.\n01e\n(Module 46.2, LOS 46.h)"}, {"n": 92, "q": "An analyst studying Albion Industries determines that the average EV/EBITDA ratio for\nAlbion's industry is 10. The analyst obtains the following information from Albion's financial\nstatements:\nEBITDA = £11,000,000\nMarket value of debt = £30,000,000\nCash = £1,000,000\nBased on the industry's average enterprise value multiple, what is the equity value of Albion\nIndustries?", "opts": ["£110,000,000.", "£80,000,000.", "£81,000,000."], "ans": "C", "expl": "Enterprise value = Average EV/EBITDA × company EBITDA = 10 × £11,000,000 = £110,000,000\nEnterprise value = Equity value + debt – cash\nEquity value = Enterprise value – debt + cash = £110,000,000 – £30,000,000 + £1,000,000 =\n£81,000,000\n(Module 46.3, LOS 46.l)"}, {"n": 93, "q": "Calculate the value of a preferred stock that pays an annual dividend of $5.50 if the current\nmarket yield on AAA rated preferred stock is 75 basis points above the current T-Bond rate\nof 7%.", "opts": ["$42.63.", "$70.97.", "$78.57."], "ans": "B", "expl": "k = base yield + risk premium = 0.07 + 0.0075 = 0.0775\npreferred\nValue = Dividend / k\nPreferredpreferred\nValue = 5.50 / 0.0775 = $70.97\n(Module 46.2, LOS 46.g)"}, {"n": 94, "q": "An analyst gathered the following information about a company:\nThe stock is currently trading at $31.00 per share.\nEstimated growth rate for the next three years is 25%.\nBeginning in the year 4, the growth rate is expected to decline and stabilize at 8%.\nThe required return for this type of company is estimated at 15%.\nThe dividend in year 1 is estimated at $2.00.\nThe stock is undervalued by approximately:", "opts": ["$0.00.", "$15.70.", "$6.40."], "ans": "C", "expl": "The high \"supernormal\" growth in the first three years and the decrease in growth thereafter\nsignals that we should use a multi-period dividend growth model (DDM) to value the stock.\nStep 1: Determine the dividend stream through year 4\nD = $2.00 (given)\n1\nD = D × (1 + g) = 2.00 × (1.25) = $2.50\n21\nD = D × (1 + g) = $2.50 × (1.25) = $3.13\n32\nD = D × (1 + g) = $3.13 × (1.08) = $3.38\n43\nStep 2: Calculate the value of the stock at the end of year 3 (using D)\n4\nP = D / (k – g) = $3.38 / (0.15 – 0.08) = $48.29\n34e\nStep 3: Calculate the PV of each cash flow stream at k = 15%, and sum the cash flows. Note:\ne\nWe suggest you clear the financial calculator memory registers before calculating the value.\nThe present value of:\n1\nD = 1.74 = 2.00 / (1.15), or FV = -2.00, N = 1, I/Y = 15, PV = 1.74\n1\n2\nD = 1.89 = 2.50 / (1.15), or FV = -2.50, N = 2, I/Y = 15, PV = 1.89\n2\n3\nD = 2.06 = 3.13 / (1.15), or FV = -3.13, N = 3, I/Y = 15, PV = 2.06\n3\n3\nP = 31.75 = 48.29 / (1.15), or FV = -48.29, N = 3, I/Y = 15, PV = 31.75\n3\nSum of cash flows = 37.44.\nThus, the stock is undervalued by 37.44 – 31.00 = approximately 6.40.\nNote: Future values are entered in a financial calculator as negatives to ensure that the PV\nresult is positive. It does not mean that the cash flows are negative. Also, your calculations\nmay differ slightly due to rounding. Remember that the question asks you to select the closest\nanswer.\n(Module 46.2, LOS 46.h)"}, {"n": 95, "q": "Which of the following statements concerning security valuation is least accurate?", "opts": ["A stock with a dividend last year of $3.25 per share, an expected dividend growth rate of 3.5%, and a required return of 12.5% is estimated to be worth $36.11.", "A stock to be held for two years with a year-end dividend of $2.20 per share, an estimated value of $20.00 at the end of two years, and a required return of 15% is estimated to be worth $18.70 currently.", "A stock with an expected dividend payout ratio of 30%, a required return of 8%, an expected dividend growth rate of 4%, and expected earnings of $4.15 per share is estimated to be worth $31.13 currently."], "ans": "A", "expl": "A stock with a dividend last year of $3.25 per share, an expected dividend growth rate of 3.5%,\nand a required return of 12.5% is estimated to be worth $37.33 using the DDM where P = D\no1\n/ (k – g). We are given D = $3.25, g = 3.5%, and k = 12.5%. What we need to find is D which\no1\nequals D × (1 + g) therefore D = $3.25 × 1.035 = $3.36 thus P = 3.36 / (0.125 – 0.035) =\no1o\n$37.33.\nIn the answer choice where the stock value is $18.70, discounting the future cash flows back\nto the present gives the present value of the stock. the future cash flows are the dividend in\nyear 1 plus the dividend and value of the stock in year 2 thus the equation becomes: V = 2.2 /\no\n2\n1.15 + (2.2 + 20) / 1.15 = $18.70\nFor the answer choice where the stock value is $31.13 use the DDM which is P = D / (k – g).\no1\nWe are given k = 0.08, g = 0.04, and what we need to find is next year's dividend or D. D =\n11\nExpected earnings × payout ratio = $4.15 × 0.3 = $1.245 thus P = $1.245 / (0.08 – 0.04) =\no\n$31.13\n(Module 46.2, LOS 46.h)"}, {"n": 96, "q": "REM Corp.'s return on equity (ROE) is 19.5% and its dividend payout rate is 45%. What is the\ncompany's implied dividend growth rate?", "opts": ["8.78%.", "19.5%.", "10.73%."], "ans": "C", "expl": "g = (ROE)(RR)\ng = (19.5)(1 – 0.45)\ng = (0.195)(0.55)\n= 0.1073 or 10.73%\n(Module 46.2, LOS 46.h)"}, {"n": 97, "q": "Assuming a discount rate of 15%, the price of a preferred stock with a dividend of $10 is\nclosest to:", "opts": ["$150.", "$67.", "$105."], "ans": "B", "expl": "The formula for the value of preferred stock with a perpetual dividend is: D / kp. In this case,\n10.0 / 0.15 = $66.67.\n(Module 46.2, LOS 46.g)"}, {"n": 98, "q": "A firm has an expected dividend payout ratio of 50%, a required rate of return of 12% and a\nconstant growth rate of 6%. If earnings for the next year are expected to be $4.50, the value\nof the stock today is closest to:", "opts": ["$33.50.", "$37.50.", "$39.75."], "ans": "B", "expl": "Expected dividend = $4.50 × 0.50 = $2.25\nValue today = $2.25 / (0.12 – 0.06) = $37.50\n(Module 46.2, LOS 46.h)"}, {"n": 99, "q": "In its latest annual report, a company reported the following:\nNet income= $1,000,000\nTotal equity= $5,000,000\nTotal assets= $10,000,000\nDividend payout ratio= 40%\nBased on the sustainable growth model, the most likely forecast of the company's future\nearnings growth rate is:", "opts": ["12%.", "8%.", "6%."], "ans": "A", "expl": "g = (RR)(ROE)\nRR = 1 – dividend payout ratio = 1 – 0.4 = 0.6\nROE = NI / Total Equity = 1,000,000 / 5,000,000 = 1 / 5 = 0.2\nNote: This is the \"simple\" calculation of ROE. Since we are only given these inputs, these are\nwhat you should use. Also, if given beginning and ending equity balances, use the average in\nthe denominator.\ng = (0.6)(0.2) = 0.12 or 12%\n(Module 46.2, LOS 46.h)"}, {"n": 100, "q": "According to the earnings multiplier model, which of the following factors is the least\nimportant in estimating a stock's price-to-earnings ratio? The:", "opts": ["historical dividend payout ratio.", "expected dividend payout ratio.", "estimated required rate of return on the stock."], "ans": "A", "expl": "P/E = (D/E)/(k - g)\n11\nwhere:\nD/E = the expected dividend payout ratio\n11\nk = estimated required rate of return on the stock\ng = expected growth rate of dividends for the stock\nThe P/E is most sensitive to movements in the denominator.\n(Module 46.3, LOS 46.k)"}, {"n": 101, "q": "What is the value of a stock that paid a $0.25 dividend last year, if dividends are expected to\ngrow at a rate of 6% forever? Assume that the risk-free rate is 5%, the expected return on\nthe market is 10%, and the stock's beta is 0.5.", "opts": ["$3.53.", "$16.67.", "$17.67."], "ans": "C", "expl": "The discount rate is k = 0.05 + 0.5(0.10 – 0.05) = 0.075. Use the infinite period dividend\ne\ndiscount model to value the stock. The stock value = D / (k – g) = (0.25 × 1.06) / (0.075 – 0.06)\n1e\n= $17.67.\n(Module 46.2, LOS 46.h)"}, {"n": 102, "q"
