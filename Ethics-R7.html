<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "A CFA charterholder may disclose confidential information about a client when:", "opts": ["the information is nonmaterial.", "the CFA Institute Professional Conduct Program requests it.", "it is a necessary step in proceeding with research on client preferences."], "ans": "B", "expl": "According to Standard III(E) Preservation of Confidentiality, members and candidates must\npreserve the confidentiality of client information received in the process of performing\nservices for them, except when related to an illegal action or when requested by the CFA\nInstitute Professional Conduct Program."}, {"n": 2, "q": "Paula Munson, CFA, manages a mutual fund with an objective to emphasize income over\ncapital gains. Magic Technologies is a growth stock that pays no dividend, but Republic's\nresearch department believes the stock will dramatically outperform the S&P 500 over the\nnext 12 to 18 months. Based on this strong recommendation and believing Magic stock will\nimprove the fund's diversification, Munson adds the stock to her fund's portfolio. Munson\nhas:", "opts": ["violated the Standards by failing to comply with her portfolio’s style mandate.", "violated the Standards by relying on research that she did not perform herself.", "not violated the Standards because she is making investment decisions in a portfolio context."], "ans": "A", "expl": "Standard III(C) Suitability requires that members managing portfolios take investment\nactions that are consistent with their portfolio's stated objectives and constraints. The\nfund's mandate emphasizes income over capital gains. Adding a non-dividend paying stock\nto the portfolio is a departure from that mandate.\n(Module 91.5, LOS 91: III(C))"}, {"n": 3, "q": "Nancy Korthauer, CFA, has launched a new hedge fund called the Korthauer Tautology Fund\nand is actively soliciting clients from competitor's firms. Client presentations are necessarily\nbrief and often take place with the prospective client's current investment advisor in the\nroom. The Code and Standards require that:", "opts": ["member or candidate provide (on request) additional detail information which supports the abbreviated presentation.", "all client presentations provide a thorough review of all elements of the investment management process. Abbreviated presentations are forbidden.", "a prospective client’s current investment advisor not participate in meetings."], "ans": "A", "expl": "See Standard III(D). When presentations are brief, additional detail which supports the\nabbreviated presentation information must be provided on request. Best practice dictates\nthat the member or candidate should make reference to the abbreviated nature of the\npresentation."}, {"n": 4, "q": "Paul Salyer, a portfolio manager, is making a presentation to a prospective client. Paul says\nthat as a new portfolio manager, he made an average annual rate of return of 50% in the last\ntwo years at his previous firm and that based on this, he can guarantee a 50% return to the\nclient. Which of the following statements is in accordance with Standard III(D), Performance\nPresentation?", "opts": ["Imputing his past performance to future performance.", "Implying that he can guarantee a return.", "Stating his past performance as long as it is fact."], "ans": "C", "expl": "There is no evidence that he's lying about his past performance. He is in violation for\nimplying that he can guarantee performance, for using short-term performance, and for\nimputing the manager's past performance to future performance."}, {"n": 5, "q": "A money manager, who is a member of CFA Institute, states that, \"Our aggressive growth\nfund produced a 12% annualized return last quarter. This illustrates the superior results our\nfirm produces.\" The fund return stated by the manager is accurate. Is this a violation of\nStandard III(D) Performance Presentation?", "opts": ["No, because a brief summary of results is acceptable as long as more complete information is made available.", "No, because the manager has stated a fact.", "Yes."], "ans": "C", "expl": "Standard III(D) requires that members communicate performance in a fair, accurate, and\ncomplete fashion, and covers both written and oral communication. Implying that the\nreturn produced by a single fund during one quarter is typical of a firm's performance is a\nviolation of this Standard.\n(Module 91.5, LOS 91: III(D))"}, {"n": 6, "q": "Janet Reilly has just approached Betty Miller, CFA, about purchasing 10,000 shares of\nBrookshire Co., a newly incorporated real estate development firm. Reilly is a retired\nschoolteacher living off the income from her late husband's life insurance policy. This\ninvestment will represent a significant shift in her investment portfolio. Miller believes this\ntrade is unsuitable with respect to Reilly's investment policy statement. Consistent with the\nStandards, Miller should most appropriately:", "opts": ["discuss with Reilly whether she wishes to update her investment policy statement.", "follow her firm’s procedures for obtaining Reilly’s approval to carry out the unsolicited trade request.", "not accept the order, because it is not a suitable investment for Reilly."], "ans": "A", "expl": "According to the guidance for Standard III(C) Suitability, a member who receives an\nunsolicited trade request that is not suitable for the client should discuss the trade with\nthe client before carrying it out. The nature of this discussion depends on whether the\ntrade has a material effect on the client's portfolio. Because this trade will have a material\neffect, Miller's most appropriate action is to discuss with the client whether this trade\nrequest reflects a change in her investment objectives and risk tolerance and thus whether\nshe wishes to update her IPS."}, {"n": 7, "q": "The Standard concerning preservation of confidentiality states that members and candidates\nmust keep information confidential about:", "opts": ["current and former clients, but not prospective clients.", "prospective and current clients, but not former clients.", "current clients, former clients, and prospective clients."], "ans": "C", "expl": "Standard III(E) Preservation of Confidentiality applies to information about current, former,\nand prospective clients.\n(Module 91.5, LOS 91: III(E))"}, {"n": 8, "q": "Millie Walker, CFA, established an aggressive growth portfolio for her client, Jesse Wilmer,\nover three years ago. Wilmer was placed on Walker's employer's client mailing list, and\nreceived monthly account statements and the firm's newsletter, which regularly informed\nclients that they should contact their account representative with any change in their\npersonal circumstances or investment objectives. As of January, of this year, Walker had not\nspoken to Wilmer nor received any correspondence from Wilmer since the account was\nestablished. Walker has:", "opts": ["not violated the Code and Standards because Wilmer has been reminded regularly about the opportunity to inform Walker about any changes.", "violated the Code and Standards because the manager has not performed an update of Wilmer's financial situation and investment objectives.", "not violated the Code and Standards because there has been regular correspondence from Walker's firm to Wilmer."], "ans": "B", "expl": "Standard III(C) Suitability requires members to update a client's financial situation and\ninvestment objectives at least annually. Wilmer's account has existed for more than three\nyears, and an update is long overdue. Generally offering to do an update is not sufficient\nto comply with the Standard.\n(Module 91.5, LOS 91: III(C))"}, {"n": 9, "q": "While servicing his clients' accounts, an analyst who is a CFA charterholder, determines that\none client is probably involved in illegal activities. According to Standard III(E), Preservation\nof Confidentiality, the analyst may NOT do which of the following?", "opts": ["Contact the appropriate governmental authorities about the determination.", "There are no exceptions in this list.", "Contact CFA Institute about the determination."], "ans": "B", "expl": "Standard III(E) allows an analyst to reveal information about a client to CFA Institute since\nCFA Institute will keep the information confidential. If the analyst is reasonably certain a\nlaw has been violated, an analyst may have an obligation to report the activities to the\nappropriate authorities. Therefore, neither of the listed actions are exceptions from the\nanalyst's options."}, {"n": 10, "q": "A money manager is meeting with a prospect. She gives the client a list of stocks and says,\n\"These are the winners I picked this past year for my clients. Their double-digit returns\nindicate the type of returns I can earn for you.\" The list includes stocks the manager had\npicked for her clients, and each stock has listed with it an accurately measured return that\nexceeds 10%. Is this a violation of Standard III(D), Performance Presentation?", "opts": ["No, because the manager had the historical information in writing.", "Yes, because the manager cannot reveal historical returns of recent stock picks.", "Yes, unless the positions listed constitute a complete presentation (i.e., there were no stocks omitted that did not perform in the double digits)."], "ans": "C", "expl": "Standard III(D) requires fair representations concerning past and potential future\nperformance. Unless the list of the \"winners\" includes all the positions that the firm held,\nthe manager is misrepresenting past performance. The following statement is\nquestionable: \"Their double-digit returns indicate the type of returns I can earn for you,\"\nbut the action of submitting a partial list is clearly a violation. The manager should have\ninformation on past performance in writing."}, {"n": 11, "q": "Greg Stiles, CFA, is liquidating a large portion of a client's portfolio because the client is\nplanning to buy a vacation home. Stiles informs one of his colleagues at the firm that the\nclient is looking for a vacation home, because the colleague's wife is a licensed real estate\nbroker. Does this violate the Standard concerning preservation of confidentiality?", "opts": ["No, because his colleague is also working on the client’s behalf.", "Yes.", "No, because he did not disclose any details about the client’s portfolio or other financial resources."], "ans": "B", "expl": "Stiles violated Standard III(E) Preservation of Confidentiality because the colleague was not\ninvolved in the firm's work for his client. Stiles must keep client information confidential\nand limit the information to others in his firm that are involved in the work being\nperformed for the client. The confidentiality standard applies to any information that a\nmember has learned in the performance of his duties for the client.\n(Module 91.5, LOS 91: III(E))"}, {"n": 12, "q": "Greg Stiles, CFA, may withhold from CFA Institute information about a client acquired in the\nregular performance of his duties:", "opts": ["only if Stiles is a relative of the client.", "for neither of the reasons listed.", "only if Stiles has a special confidentiality agreement with the client."], "ans": "B", "expl": "According to Standard III(E), Preservation of Confidentiality, Stiles may not withhold\ninformation under any of the listed reasons. The reason is that CFA Institute will keep the\ninformation confidential."}, {"n": 13, "q": "Compliance with the Standard concerning suitability least likely includes determining a\nclient's:", "opts": ["return objectives.", "social habits and interests.", "liquidity needs."], "ans": "B", "expl": "The procedures for compliance with Standard III(C) Suitability include determining a\nclient's investment objectives and constraints, but do not include gathering information\nabout the client's social habits and interests.\n(Module 91.5, LOS 91: III(C))"}, {"n": 14, "q": "A candidate or member is least likely violating the Standard regarding the confidentiality of\nclient information if he shares confidential client information, when not required by law,\nwith:", "opts": ["the CFA Institute Professional Conduct Program.", "the client’s attorney.", "the co-owner of the client’s account."], "ans": "A", "expl": "Standard III(E) Preservation of Confidentiality states that sharing information with the PCP\nwhen requested as part of an investigation is not a violation unless it is prohibited by law.\nDisclosure to those outside the firm in other cases is a violation unless the client has given\nspecific permission or disclosure is required by law.\n(Module 91.5, LOS 91: III(E))"}, {"n": 15, "q": "According to Standard III(C) Suitability, which of the following is least likely to be considered\na relevant factor in determining the appropriateness and suitability of investment\nrecommendations or actions for each portfolio or client?", "opts": ["Best interests of the investment professional.", "Needs and circumstances of the portfolio or client.", "Basic characteristics of the total portfolio."], "ans": "A", "expl": "Determining appropriateness and suitability focuses on the portfolio or client, not on the\ninvestment professional. Investment professionals should take particular care to ensure\nthat their goals in selling products or executing security transactions do not conflict with\nthe best interests of the client.\n(Module 91.5, LOS 91: III(C))"}, {"n": 16, "q": "Bob Hatfield, CFA, has his own money management firm with two clients. The accounts of\nthe two clients are equal in value. One of the clients gets married and the assets of the new\nspouse and the client are combined. With the larger portfolio of the now married client,\nHatfield determines that they can assume a higher level of risk and begins a change in the\npolicy concerning that portfolio. Which of the following would violate Standard III(C),\nSuitability?", "opts": ["Assess the time horizon of the newly married client and his spouse.", "Assess the return objectives of the newly married client and his spouse.", "Implement a similar policy for the other client who did not just get married."], "ans": "C", "expl": "According to Standard III(C), Suitability, the analyst must assess the time horizon, return\nobjectives, tax considerations, and liquidity needs of a client before changing an\ninvestment policy. The analyst must notify the client of the new policy. Implementing the\npolicy for the other client may be a violation of the Standard unless that client's needs are\ntotally reassessed and determined to be identical to the needs of the newly married client."}, {"n": 17, "q": "A money management firm creates a new high-yield bond fund. The firm accurately\ncomputed the returns from the past three years for each of the bonds in the fund. The firm\nuses the current portfolio weights to determine an average annual historical return equal to\n18%. When the firm advertises the new fund at its issuance, they state an 18% annual\nhistorical return. With respect to performance presentation, this is:", "opts": ["a violation of the Standards because they prohibit advertising historical returns on high-risk assets.", "in compliance with the Standards.", "a violation of the Standards because the advertisement implies the firm generated this return."], "ans": "C", "expl": "Reporting the historical returns of all assets now in the fund introduces survivorship bias.\nAlso, the advertisement is misleading because the fund just came into existence and has\nno historical record. Thus, the firm has misled the public as to their performance history."}, {"n": 18, "q": "The O'Douls (husband and wife) have decided to work with Jane Mack, CFA, to have her\nrecommend an investment portfolio for them. The O'Douls are novice investors and Mack\nhas determined their asset allocation model falls into the conservative category. After\nresearching various investment options for the O'Douls, Mack has made a recommendation\nthat they divide their account on a 25%/75% basis between shares of a computer peripherals\nmanufacturing company her brokerage firm is underwriting and investment grade corporate\nbonds. The O'Douls are not aware that Mack's firm is underwriting an offering of the\ncompany in question. Which CFA Institute Standard(s) has Mack violated given her actions?", "opts": ["Standard III(B), Fair Dealing, and III(A), Loyalty, Prudence, and Care.", "Standard V(A), Diligence and Reasonable Basis, and I(D), Misconduct.", "Standard VI(A), Avoid or Disclose Conflicts, and III(C), Suitability."], "ans": "C", "expl": "Mack is obliged to disclose the conflict of interest regarding her company's IPO and to\nconsider both the appropriateness and the suitability of the investment for her client. She\nhas apparently failed in both respects.\n(Module 91.5, LOS 91: III(C))"}, {"n": 19, "q": "Greg Stiles, CFA, keeps a list of his clients' birthdays and has personally sent them a birthday\ncard each year at the appropriate time. With respect to this action, which of the following\nmay be a violation of Standard III(E), Preservation of Confidentiality?", "opts": ["Hiring a company outside the firm to perform the task.", "Sending a gift along with the card.", "The mere act of sending a birthday card each year."], "ans": "A", "expl": "According to Standard III(E), an analyst should limit the number of persons who have\naccess to clients' personal information. Allowing a company outside the firm to send\nbirthday cards could be a violation. Sending a birthday card is not a violation, nor is\nsending a gift of reasonable value."}];
const CFG = {"title": "Guidance for Standards III(C), III(D), and III(E)", "subtitle": "CFA · Ethical & Professional Standards · Reading 91.5 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const day = new Date().toISOString().slice(0,10);
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#6d5efc','#9d8bff','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
</html>
