<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "All else equal, an option-free bond's effective duration and approximate modified duration are closest when the benchmark par bond curve:", "opts": ["is flat.", "is steeply sloped.", "makes a parallel shift."], "ans": "A", "expl": "Approximate modified duration (ModDur) and effective duration (EffDur) both measure the sensitivity of bond prices to changes in yields:\nModDur measures sensitivity as the slope of a bond's price-yield curve, derived by calculating the bond's price at lower and higher YTMs.\nEffDur measures sensitivity based on parallel downward and upward shifts of the benchmark yield curve.\nIf the government par bond (ie, benchmark) curve is flat, the spot rate curve derived from it is also flat, and the spot rates and YTMs are equal\nwith the same value across all maturities. Therefore, if the basis point change in YTM and the shift in the benchmark yield curve are equal, the\nsame PV and PV will be used to calculate both ModDur and EffDur since all cash flows are discounted by the same interest rate. This results in\n+ −\nModDur and EffDur being closest to each other (ie, they are equal).\nRegardless of the yield curve's shape, PV and PV for ModDur are calculated by using a single interest rate to discount bond cash flows.\n+ −\nHowever, if the benchmark curve is not flat, the PV and PV used to determine EffDur are calculated by discounting each cash flow by a different\n+ −\nspot rate. If the benchmark curve's slope diverges only slightly from flat, the two duration measures will be almost equal. As the curve's slope\nsteepens, the divergence of spot rates used to calculate PV and PV will increase, leading to larger differences between ModDur and EffDur\n+ −\n(Choice B).\n(Choice C) Neither duration measure is based on actual movements of the yield curve. Effective duration is based on assumed downward and\nupward parallel shifts of the yield curve.\nThings to remember:\nModDur and EffDur measure the sensitivity of bond prices to interest rate changes. A flat benchmark yield curve results in the two duration\nmeasures being equal. As the slope of the curve steepens, the difference between the two measures will increase.\nExplain why effective duration and effective convexity are the most appropriate measures of interest rate risk for bonds with embedded options.", "qhtml": null}, {"n": 2, "q": "Shaping risk is most appropriately assessed by measuring the change in a bond's price that results from a:", "opts": ["change in the bond's yield-to-maturity.", "shift in the entire benchmark yield curve.", "shift in a portion of the benchmark yield curve."], "ans": "C", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to parallel\nEffective All\nshift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate All\nwithin a portion of benchmark yield curve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nEstimating the interest rate risk of bonds with embedded options involves measuring changes in the prices of those bonds based on shifts in the\nbenchmark yield curve. This can be done using effective duration or key rate duration. Effective duration measures changes in bond prices based\non shifts in the entire benchmark yield curve.\nIn contrast, a change in rates within only some portion of the benchmark yield curve indicates a shift in one or more key rates. Key rate duration\nassesses price changes based on changes to rates within a portion of the benchmark yield curve.\nWhen only a portion of the benchmark yield curve changes, the shape of the curve changes. For example, if rates for maturities less than two\nyears decrease, this causes a steepening of the overall curve:\nFor this reason, key rate duration is said to measure the shaping risk of a bond—the interest rate risk that arises from changes to the shape of\nthe yield curve.\n(Choice A) Modified duration involves assessing interest rate risk by measuring changes in a bond's price based on changes to its yield-to-\nmaturity, not based on changes to a portion of the benchmark yield curve.\n(Choice B) Effective duration measures changes in a bond's price based on a shift in the entire benchmark yield curve.\nThings to remember:\nKey rate duration measures bond price changes based on rate changes within a portion of the benchmark yield curve that have caused a change\nin the shape of the curve. Therefore, it can be said that key rate duration is used to assess the shaping risk of a bond. Effective duration\nmeasures bond price changes based on shifts in the entire benchmark yield curve.\nDefine key rate duration and describe its use to measure price sensitivity of fixed-income instruments to benchmark yield curve changes.", "qhtml": null}, {"n": 3, "q": "An investor is evaluating several callable bonds. The investor believes short-term interest rates are likely to rise significantly, but intermediate and long-term rates will be stable. Which of the following types of duration would be most appropriate for evaluating the risk of the bonds given the expected flattening of the yield curve?", "opts": ["Key rate", "Modified", "Effective"], "ans": "A", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to parallel\nEffective All\nshift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate All\nwithin a portion of benchmark yield curve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nKey rate duration is used to assess the impact on bond values of a movement of rates along a portion of the yield curve (eg, ten-year rate or\nfrom zero to three years to maturity). This allows key rate duration to measure the impact of changes in the shape of the yield curve (ie,\nshaping risk) on the value of callable bonds.\nA callable bond has uncertain future cash flows since it may be called and retired before maturity. Investors use effective duration to try to account\nfor the cash flow uncertainty by assuming parallel shifts of the benchmark yield curve (Choice C).\nIf short-term rates rise and the yield curve flattens as anticipated, a key rate duration calculated on such an assumption produces a better estimate\nof the bond's change in value. Under such circumstances, a key rate duration more accurately assesses an issuer's incentive to call the bond and\nthe future cash flow uncertainty.\n(Choice B) Modified duration measures the sensitivity of a bond's price to a change in its yield-to-maturity. Since it is based on a change in that\nsingle interest rate, modified duration cannot be used to assess the impact of a shift in rates over a portion of a benchmark yield curve.\nThings to remember:\nKey rate duration is used to assess the impact on bond values of a movement of rates along a portion of the yield curve. It measures the impact\non bond values of changes in the shape of the yield curve (ie, shaping risk).\nDefine key rate duration and describe its use to measure price sensitivity of fixed-income instruments to benchmark yield curve changes.", "qhtml": null}, {"n": 4, "q": "Effective duration is the most appropriate duration measure for bonds with:", "opts": ["embedded options.", "predictable cash flows.", "a well-defined yield-to-maturity."], "ans": "A", "expl": "Effective duration estimates how much a bond's total price will change in response to a parallel shift of the benchmark yield curve. Since\neffective duration uses the yield curve instead of the YTM, it is a more appropriate measure of interest rate risk for bonds that have embedded\noptions, such as callable and putable bonds. Those bonds have unpredictable cash flows due to the possibility of option exercise and thus lack a\nwell-defined YTM.\n(Choices B and C) For bonds that have predictable cash flows, and thus a well-defined YTM, interest rate risk can be measured using\napproximate modified duration, which is based on YTM.\nThings to remember:\nSince it uses the yield curve instead of YTM in its calculation, effective duration can measure the interest rate risk of bonds with embedded\noptions, which have uncertain future cash flows and thus lack a well-defined YTM.\nExplain why effective duration and effective convexity are the most appropriate measures of interest rate risk for bonds with embedded options.", "qhtml": null}, {"n": 5, "q": "Compared with analytical duration, empirical duration is the more appropriate measure to estimate the impact of benchmark interest rate changes for a bond portfolio of:", "opts": ["US agency bonds.", "global high-yield corporate bonds.", "highly rated European covered bonds."], "ans": "B", "expl": "Duration is a linear estimate of the change in a bond's price given a change in its yield.\nAnalytical duration (eg, modified duration) estimates price and yield changes given a change in benchmark interest rates, based on current\nmarket information.\nEmpirical duration estimates a bond's interest rate sensitivity using the correlations between benchmark yields and yield spreads based\non historical data and statistical relationships with other factors (eg, credit, liquidity).\nEmpirical and analytical duration will be very similar for bonds that have similar risks as benchmark securities, but will differ for bonds with\nconsiderable spread risk, such as credit, liquidity, or country risk, etc. The more types of risk a bond is exposed to, besides interest rate risk, the\nmore relevant its empirical duration will be. Empirical duration is particularly useful in predicting price changes during periods of financial stress\n(eg, flight to quality), as correlations among risky assets increase dramatically.\nGlobal high-yield corporate bonds represent a wide variety of credit, country, and liquidity risks, in addition to interest rate risk, so empirical\nduration can be expected to be a more appropriate predictor of their prices than analytical duration.\n(Choices A and B) US agency and highly rated (eg, AAA, AA+) European covered bonds carry little credit risk; therefore, both duration measures\nwill be very similar.\nThings to remember:\nEmpirical duration estimates a bond's interest rate sensitivity using historical data and statistical relationships with other factors, quantifying the\ncorrelations between benchmark yields and yield spreads. Empirical duration is relevant for bonds with considerable spread risk, particularly\nduring periods when benchmark yields and spreads may be correlated, as it can provide a more accurate measure of risk.\nDescribe the difference between empirical duration and analytical duration", "qhtml": null}, {"n": 6, "q": "Which of the following is most appropriate to measure the interest rate risk of a bond with an embedded call option? A measure of:", "opts": ["yield duration.", "curve duration.", "modified duration."], "ans": "B", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to parallel\nEffective All\nshift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate All\nwithin a portion of benchmark yield curve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nBonds are valued at the present value of their cash flows until maturity, using the YTM as the discount rate. When a bond is issued with an\nembedded call option, the possibility of option exercise makes the cash flows uncertain. This results in the bond lacking a well-defined YTM.\nTherefore, it is most appropriate to measure a callable bond's interest rate risk using effective duration, which is a curve duration statistic.\nTo measure interest rate risk, effective duration shifts a benchmark yield curve up and down by the same number of basis points, rather than\nchanging a specific YTM. This method better captures the way cash flows vary under different interest rate scenarios for bonds without well-\ndefined YTMs (eg, callable bonds).\n(Choices A and C) Yield durations (eg, Macaulay duration, modified duration) measure interest rate risk based on a single interest rate, the\nbond's YTM. Yield durations are appropriate for bonds without embedded options since such bonds have well-defined YTMs.\nThings to remember:\nWhen a bond is issued with an embedded call option, its cash flows are uncertain, and thus its YTM is not well-defined. Effective duration\nmeasures bond price changes relative to a change in the benchmark yield curve, rather than a change in a specific YTM. Therefore, it is more\nappropriate for bonds without well-defined YTMs (eg, a bond with an embedded call option).\nExplain why effective duration and effective convexity are the most appropriate measures of interest rate risk for bonds with embedded options.", "qhtml": null}, {"n": 7, "q": "A bond matures in 20 years and is callable at the issuer's option any time after the first call date in 3 years. Which of the following types of duration is most appropriate for quantifying the bond's interest rate risk? ", "opts": ["Effective", "Modified", "Macaulay"], "ans": "A", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to parallel\nEffective All\nshift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate All\nwithin a portion of benchmark yield curve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nA callable bond can be analyzed as a package comprising two elements: the schedule of coupon and principal payments over the bond's\nscheduled life and a call option giving the issuer the right to purchase (ie, call) the bond prior to its maturity. The option creates uncertainty about\nthe bond's future cash flows.\nEven assuming no default, the cash flows on a callable bond are uncertain due to the possibility of early retirement. Of the choices, only effective\nduration addresses the uncertainty regarding the length of time over which the bond will pay cash flows. It is necessary to value the embedded\noption to address how future interest rate fluctuations may impact the bond's cash flows.\n(Choices B and C) Modified and Macaulay durations can be calculated only for a stream of cash flows for a fixed time period. These duration\nmeasures are not accurate measures for callable bonds, given the cash flow uncertainty introduced by the embedded call option.\nThings to remember:\nEffective duration is the appropriate measure for a bond with an embedded option, as it addresses the uncertainty regarding the bond's future\ncash flows. Macaulay and modified durations can be calculated only for bonds with a known stream of contractual cash flows.\nExplain why effective duration and effective convexity are the most appropriate measures of interest rate risk for bonds with embedded options.", "qhtml": null}, {"n": 8, "q": "All else being equal, key rate duration is most appropriate for assessing the interest rate risk of callable bonds if:", "opts": ["yield volatility is increasing.", "yield spreads are widening.", "the yield curve is steepening."], "ans": "C", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to parallel\nEffective All\nshift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate All\nwithin a portion of benchmark yield curve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nThe early retirement option embedded in callable bonds creates uncertainty about future cash flows. Two types of duration are used to evaluate\nthe effect of early retirement options on cash flows payable over an uncertain time horizon:\nEffective duration assumes parallel shifts in the benchmark yield curve, and\nkey rate duration is based on a change in the shape (ie, shaping risk) of the benchmark yield curve.\nA bond's key rate duration is calculated by assuming changes in one or more yields on the benchmark yield curve. A steepening of the yield curve\ncould result from a decrease in short-term rates, an increase in long-term rates, or a combination of both. The assumed change in the benchmark\ncurve is used to evaluate the effect on the embedded call option and cash flows over the life of the bond.\n(Choice A) Yield volatility affects bond values but is not a factor measured by key rate duration.\n(Choice B) Corporate bond yields reflect a benchmark government bond yield and a yield spread over that benchmark. The spread reflects the\nissuer's credit risk and the bond issue's liquidity risk. Key rate duration is based on changes in the benchmark yield curve, so it does not directly\nincorporate changes in yield spreads.\nThings to remember:\nKey rate duration measures the effect on a callable bond's value caused by changes in one or more yields on a benchmark yield curve. The\nshape or slope of the yield curve reflects the impact of those changes.\nDefine key rate duration and describe its use to measure price sensitivity of fixed-income instruments to benchmark yield curve changes.", "qhtml": null}];
const CFG = {"title": "Wiley · Curve-Based and Empirical Fixed-Income Risk Measures", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 8 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
