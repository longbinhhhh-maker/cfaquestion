cluded within operating profit.<\/p><p>Finally, the board is concerned about future adjustments that may be required to deal with the amortization of the remeasurement gains that have accumulated in Clear&#x27;s pension scheme. Baragutti intends to perform the following calculations to deal with each issue independently:<\/p><p>Issue 1<\/p><p>Recalculate pension expense included in the income statement under U.S. GAAP. Baragutti has observed that companies reporting pension expense under U.S. GAAP have used an average of 3% for the expected return on plan assets and he intends to apply this rate where applicable. He does not intend to amortize any of this year&#x27;s prior service cost.<\/p><p>Issue 2<\/p><p>Assuming IFRS, recalculate the local currency (€) operating margin excluding any pension scheme interest element. The current income statement before Baragutti&#x27;s adjustments is shown in Exhibit 2.<\/p><p>Issue 3<\/p><p>Baragutti prepares the following note containing two statements to advise the board on the future amortization of actuarial gains and losses:<\/p><p>Statement 1<\/p><p>&quot;Under IFRS, when cumulative remeasurement gains/losses are large enough, they will be amortized through the income statement over the average service life of the employees, reducing net income if net losses are amortized, and increasing net income if net gains are amortized.&quot;<\/p><p>Statement 2<\/p><p>&quot;Under U.S. GAAP, the amortization of net actuarial losses will increase leverage (i.e., debt-to-equity ratio), whereas the amortization of net actuarial gains will decrease leverage.&quot;<\/p><p>Exhibit 2: Income Statement (Extracts)<\/p><p>20X5<\/p><p>€ million<\/p><p>Revenue<\/p><div class=\"tbl\"><table><tr><td>Passenger<\/td><td>9,321<\/td><\/tr><tr><td>Cargo<\/td><td>456<\/td><\/tr><tr><td>Total<\/td><td>9,777<\/td><\/tr><tr><td>Employee costs<\/td><td>3,654<\/td><\/tr><tr><td>Depreciation, amortization<\/td><td>894<\/td><\/tr><tr><td>Aircraft operating lease costs<\/td><td>156<\/td><\/tr><tr><td>Fuel and oil costs<\/td><td>1,853<\/td><\/tr><tr><td>Engineering and other aircraft costs<\/td><td>542<\/td><\/tr><tr><td>Landing fees<\/td><td>1,458<\/td><\/tr><tr><td>Exchange rate losses<\/td><td>221<\/td><\/tr><tr><td>Ground equipment costs<\/td><td>765<\/td><\/tr><tr><td>Total operating costs<\/td><td>9,543<\/td><\/tr><tr><td>Operating profit<\/td><td>234<\/td><\/tr><tr><td>Fuel derivative losses<\/td><td>32<\/td><\/tr><tr><td>Finance costs<\/td><td>193<\/td><\/tr><tr><td>Finance income<\/td><td>89<\/td><\/tr><tr><td>Profit before tax<\/td><td>98<\/td><\/tr><\/table><\/div><p>Note: Employee costs include the defined benefit pension expense for the period.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Baragutti&#x27;s statements on the amortization of actuarial gains and losses in response to Issue 3 are most likely correct?<\/p><\/div>","subj":"fsa"},{"n":57,"q":"Regarding the statements made by Grange, it is most accurate to state that:","opts":["both statements are correct.","both statements are incorrect.","only one statement is correct."],"ans":"B","expl":"Economies of scale in R&D expense are evidenced by lower R&D expense as a proportion of sales for larger companies.\nFirms with commodity-type inputs that cannot easily pass on higher input costs to their customers often hedge their future input costs by using forward contracts or other derivative securities. (If the input costs can be passed on to the customer, the producer does not have a pricing risk that needs to be hedged.)\n(Module 14.1, LOS 14.e)","explhtml":"<p>Economies of scale in R&amp;D expense are evidenced by lower R&amp;D expense as a proportion of sales for larger companies.<\/p><p>Firms with commodity-type inputs that cannot easily pass on higher input costs to their customers often hedge their future input costs by using forward contracts or other derivative securities. (If the input costs can be passed on to the customer, the producer does not have a pricing risk that needs to be hedged.)<\/p><p>(Module 14.1, LOS 14.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Jessica Goodfellow is an asset manager in The United Kingdom. In early 2021, Goodfellow was investigating the Dorset engine, a product recently launched by Sutton-Phelps Holdings PLC in a new class of twin-spool, high bypass turbofan engines. As of 2021, the Dorset engine has only one direct competitor in its class: the RAnx engine, developed by U.S.-based propulsion company RA Aviation Systems, LLC. The Dorset engine has a few benefits over the RAnx engine; most notably, it has a 3% fuel consumption advantage.<\/p><p>Janet Grange, CFA, a junior analyst makes the following statements about the industry:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>There is considerable economy of scale for R&amp;D expense as evidenced by larger R&amp;D expenditures (as a proportion of revenues) for larger companies.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Firms with commodity-type inputs that can pass higher material costs on to their customers often hedge their future input costs by using forward contracts or other derivative securities.<\/td><\/tr><\/table><\/div><p>RA Aviation Systems reported their global sales of RAnx engines in US dollars. Goodfellow converted these figures to pound sterling using the average USD/GBP exchange rate for each year, and compiled the following table comparing sales of the Dorset engine with sales of the RAnx engine, measured in millions of pound sterling.<\/p><p>Exhibit 1: Twin-spool, high bypass turbofan engine sales by year (in millions of £)<\/p><div class=\"tbl\"><table><tr><td>2018<\/td><td>2019<\/td><td>2020<\/td><td><\/td><\/tr><tr><td>Sutton-Phelps Dorset engine<\/td><td>12<\/td><td>84<\/td><td>2,177<\/td><\/tr><tr><td>RA Aviation RAnx engine<\/td><td>3,591<\/td><td>4,011<\/td><td>3,991<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding the statements made by Grange, it is most accurate to state that:<\/p><\/div>","subj":"fsa"},{"n":58,"q":"The percentage of turbofan engine sales growth in this class in 2020 can be attributed to the Dorset engine is closest to:","opts":["1%.","51%.","101%."],"ans":"C","expl":"Total turbofan engine sales increased by £2,073 million (from £4,095 million to £6,168 million), whereas Dorset engine sales increased by £2,093 million (from £84 million to £2,177 million). Thus, the Dorset engine accounted for approximately 101% of the growth in sales of this engine class (= 2,093/2,073 – 1 ≈ 1.01, or 101%). Note that the Dorset engine accounted for more than 100% of the total growth in sales of this engine class because the other engine in the class had a decline in sales.\n(Module 14.2, LOS 14.g)","explhtml":"<p>Total turbofan engine sales increased by £2,073 million (from £4,095 million to £6,168 million), whereas Dorset engine sales increased by £2,093 million (from £84 million to £2,177 million). Thus, the Dorset engine accounted for approximately 101% of the growth in sales of this engine class (= 2,093/2,073 – 1 ≈ 1.01, or 101%). Note that the Dorset engine accounted for more than 100% of the total growth in sales of this engine class because the other engine in the class had a decline in sales.<\/p><p>(Module 14.2, LOS 14.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jessica Goodfellow is an asset manager in The United Kingdom. In early 2021, Goodfellow was investigating the Dorset engine, a product recently launched by Sutton-Phelps Holdings PLC in a new class of twin-spool, high bypass turbofan engines. As of 2021, the Dorset engine has only one direct competitor in its class: the RAnx engine, developed by U.S.-based propulsion company RA Aviation Systems, LLC. The Dorset engine has a few benefits over the RAnx engine; most notably, it has a 3% fuel consumption advantage.<\/p><p>Janet Grange, CFA, a junior analyst makes the following statements about the industry:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>There is considerable economy of scale for R&amp;D expense as evidenced by larger R&amp;D expenditures (as a proportion of revenues) for larger companies.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Firms with commodity-type inputs that can pass higher material costs on to their customers often hedge their future input costs by using forward contracts or other derivative securities.<\/td><\/tr><\/table><\/div><p>RA Aviation Systems reported their global sales of RAnx engines in US dollars. Goodfellow converted these figures to pound sterling using the average USD/GBP exchange rate for each year, and compiled the following table comparing sales of the Dorset engine with sales of the RAnx engine, measured in millions of pound sterling.<\/p><p>Exhibit 1: Twin-spool, high bypass turbofan engine sales by year (in millions of £)<\/p><div class=\"tbl\"><table><tr><td>2018<\/td><td>2019<\/td><td>2020<\/td><td><\/td><\/tr><tr><td>Sutton-Phelps Dorset engine<\/td><td>12<\/td><td>84<\/td><td>2,177<\/td><\/tr><tr><td>RA Aviation RAnx engine<\/td><td>3,591<\/td><td>4,011<\/td><td>3,991<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The percentage of turbofan engine sales growth in this class in 2020 can be attributed to the Dorset engine is closest to:<\/p><\/div>","subj":"fsa"},{"n":59,"q":"Goodfellow projects that the growth rate of the market for this turbofan engine class will slow to 19% in 2021. She also expects the Dorset engine to improve its market share by 9 percentage points. Based on these estimates, Goodfellow's estimate of 2021 Dorset engine sales should be closest to:","opts":["£2,591 million.","£2,732 million.","£3,251 million."],"ans":"C","expl":"Based on 2020 sales of £6,168 million and an expected growth rate of 19%, Goodfellow should project the total turbofan engine market in this class to be worth about 6,168 × 1.19 ≈ £7,340 million in 2021. The Dorset engine's market share in 2020 was around 35.3%, which Goodfellow projects to improve by 9 percentage points, resulting in a 44.3% market share in this class in 2021. Goodfellow will thus project 2021 Dorset engine sales to be around 7,340 × 0.443 ≈ £3,251 million.\n(Module 14.2, LOS 14.g)","explhtml":"<p>Based on 2020 sales of £6,168 million and an expected growth rate of 19%, Goodfellow should project the total turbofan engine market in this class to be worth about 6,168 × 1.19 ≈ £7,340 million in 2021. The Dorset engine&#x27;s market share in 2020 was around 35.3%, which Goodfellow projects to improve by 9 percentage points, resulting in a 44.3% market share in this class in 2021. Goodfellow will thus project 2021 Dorset engine sales to be around 7,340 × 0.443 ≈ £3,251 million.<\/p><p>(Module 14.2, LOS 14.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jessica Goodfellow is an asset manager in The United Kingdom. In early 2021, Goodfellow was investigating the Dorset engine, a product recently launched by Sutton-Phelps Holdings PLC in a new class of twin-spool, high bypass turbofan engines. As of 2021, the Dorset engine has only one direct competitor in its class: the RAnx engine, developed by U.S.-based propulsion company RA Aviation Systems, LLC. The Dorset engine has a few benefits over the RAnx engine; most notably, it has a 3% fuel consumption advantage.<\/p><p>Janet Grange, CFA, a junior analyst makes the following statements about the industry:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>There is considerable economy of scale for R&amp;D expense as evidenced by larger R&amp;D expenditures (as a proportion of revenues) for larger companies.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Firms with commodity-type inputs that can pass higher material costs on to their customers often hedge their future input costs by using forward contracts or other derivative securities.<\/td><\/tr><\/table><\/div><p>RA Aviation Systems reported their global sales of RAnx engines in US dollars. Goodfellow converted these figures to pound sterling using the average USD/GBP exchange rate for each year, and compiled the following table comparing sales of the Dorset engine with sales of the RAnx engine, measured in millions of pound sterling.<\/p><p>Exhibit 1: Twin-spool, high bypass turbofan engine sales by year (in millions of £)<\/p><div class=\"tbl\"><table><tr><td>2018<\/td><td>2019<\/td><td>2020<\/td><td><\/td><\/tr><tr><td>Sutton-Phelps Dorset engine<\/td><td>12<\/td><td>84<\/td><td>2,177<\/td><\/tr><tr><td>RA Aviation RAnx engine<\/td><td>3,591<\/td><td>4,011<\/td><td>3,991<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Goodfellow projects that the growth rate of the market for this turbofan engine class will slow to 19% in 2021. She also expects the Dorset engine to improve its market share by 9 percentage points. Based on these estimates, Goodfellow&#x27;s estimate of 2021 Dorset engine sales should be closest to:<\/p><\/div>","subj":"fsa"},{"n":60,"q":"Goodfellow's approach to modeling Sutton-Phelps's 2021 Dorset engine sales would be best described as:","opts":["bottom-up.","hybrid.","time series."],"ans":"B","expl":"Top-down approaches usually begin at the level of the overall economy, while bottom-up approaches begin at the level of the individual company or unit within the company (for example, a business segment). Goodfellow bases her estimates on market growth and market share, which would typically imply a top-down approach. The analysis, however, is applied to an individual product class, which points to a bottom-up approach. Therefore, Goodfellow's approach to forecasting 2021 Dorset engine sales is most accurately described as a hybrid approach.\n(Module 14.1, LOS 14.a)","explhtml":"<p>Top-down approaches usually begin at the level of the overall economy, while bottom-up approaches begin at the level of the individual company or unit within the company (for example, a business segment). Goodfellow bases her estimates on market growth and market share, which would typically imply a top-down approach. The analysis, however, is applied to an individual product class, which points to a bottom-up approach. Therefore, Goodfellow&#x27;s approach to forecasting 2021 Dorset engine sales is most accurately described as a hybrid approach.<\/p><p>(Module 14.1, LOS 14.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jessica Goodfellow is an asset manager in The United Kingdom. In early 2021, Goodfellow was investigating the Dorset engine, a product recently launched by Sutton-Phelps Holdings PLC in a new class of twin-spool, high bypass turbofan engines. As of 2021, the Dorset engine has only one direct competitor in its class: the RAnx engine, developed by U.S.-based propulsion company RA Aviation Systems, LLC. The Dorset engine has a few benefits over the RAnx engine; most notably, it has a 3% fuel consumption advantage.<\/p><p>Janet Grange, CFA, a junior analyst makes the following statements about the industry:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>There is considerable economy of scale for R&amp;D expense as evidenced by larger R&amp;D expenditures (as a proportion of revenues) for larger companies.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Firms with commodity-type inputs that can pass higher material costs on to their customers often hedge their future input costs by using forward contracts or other derivative securities.<\/td><\/tr><\/table><\/div><p>RA Aviation Systems reported their global sales of RAnx engines in US dollars. Goodfellow converted these figures to pound sterling using the average USD/GBP exchange rate for each year, and compiled the following table comparing sales of the Dorset engine with sales of the RAnx engine, measured in millions of pound sterling.<\/p><p>Exhibit 1: Twin-spool, high bypass turbofan engine sales by year (in millions of £)<\/p><div class=\"tbl\"><table><tr><td>2018<\/td><td>2019<\/td><td>2020<\/td><td><\/td><\/tr><tr><td>Sutton-Phelps Dorset engine<\/td><td>12<\/td><td>84<\/td><td>2,177<\/td><\/tr><tr><td>RA Aviation RAnx engine<\/td><td>3,591<\/td><td>4,011<\/td><td>3,991<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Goodfellow&#x27;s approach to modeling Sutton-Phelps&#x27;s 2021 Dorset engine sales would be best described as:<\/p><\/div>","subj":"fsa"},{"n":61,"q":"Which of the credit analysis models shown in Exhibit 1 can only be used under the assumption that the issuing company's assets trade in a frictionless market?","opts":["Structural models.","Reduced form models.","Both structural models and reduced form models."],"ans":"A","expl":"Structural models require that the company's assets trade in a frictionless arbitrage free market.\n(Module 28.4, LOS 28.d)","explhtml":"<p>Structural models require that the company&#x27;s assets trade in a frictionless arbitrage free market.<\/p><p>(Module 28.4, LOS 28.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Fixed Income<\/summary><div class=\"vig-body\"><p>Jon Stevenson, CFA, is an experienced equity fund manager who has recently taken a position with Lohsi Clearview, a UK-based hedge fund that has combined a wide range of strategies to deliver impressive returns over the last five years. One of the fund&#x27;s strategies is to invest in high-credit-risk fixed income instruments. The fund has an excellent track record of identifying bonds in this sector that subsequently outperform the market.<\/p><p>Stevenson wishes to familiarize himself with the fund&#x27;s strategies and has started by looking at some of the techniques used in analyzing fixed income instruments. Exhibit 1 shows the firm&#x27;s approach to analyzing credit risk.<\/p><p>Exhibit 1: Credit Analysis Tools<\/p><p>Credit Ratings<\/p><p>Before undertaking any level of detailed analysis, the credit rating from the three major agencies should be obtained. Typically an instrument that is investment grade according to all three agencies will not be worthy of further consideration.<\/p><p>Structural Models<\/p><p>An initial analysis using a simple structural model should be undertaken to calculate the present value of the expected loss.<\/p><p>Reduced Form Models<\/p><p>Detailed analysis should be undertaken using the reduced form models used by the fixed income team. This analysis should only be undertaken once the structural model analysis has been completed.<\/p><p>Stevenson has no experience with structural models and is interested in learning more. He finds an analysis that has been completed for a recent bond issue. The results are shown in Exhibit 2.<\/p><p>Exhibit 2: IMC Bond Issue (ID 062014555612) Structural Model Results<\/p><div class=\"tbl\"><table><tr><td>Asset value<\/td><td>At<\/td><td>1,200<\/td><\/tr><tr><td>Expected return on assets<\/td><td>μ<\/td><td>0.04<\/td><\/tr><tr><td>Risk free rate<\/td><td>r<\/td><td>0.02<\/td><\/tr><tr><td>Face value<\/td><td>K<\/td><td>850<\/td><\/tr><tr><td>Time to maturity<\/td><td>T−t<\/td><td>1.5<\/td><\/tr><tr><td>Return volatility<\/td><td>σ<\/td><td>0.28<\/td><\/tr><tr><td>d1<\/td><td>1.26452<\/td><td><\/td><\/tr><tr><td>d2<\/td><td>0.92159<\/td><td><\/td><\/tr><tr><td>N(–d1)<\/td><td>0.1030<\/td><td><\/td><\/tr><tr><td>N(–d2)<\/td><td>0.1784<\/td><td><\/td><\/tr><tr><td>e1<\/td><td>1.35200<\/td><td><\/td><\/tr><tr><td>e2<\/td><td>1.00907<\/td><td><\/td><\/tr><tr><td>N(–e1)<\/td><td>0.0882<\/td><td><\/td><\/tr><tr><td>N(–e2)<\/td><td>0.1565<\/td><td><\/td><\/tr><tr><td>Expected loss<\/td><td>23.86<\/td><td><\/td><\/tr><tr><td>PV expected loss<\/td><td>23.51<\/td><td><\/td><\/tr><\/table><\/div><p>Stevenson next turns his attention to DEP Bond, one of the fund&#x27;s holdings. The bond was purchased today, immediately after it paid its annual coupon. Stevenson obtains the file for DEP and finds out that the bond was evaluated using a risk-neutral probability of default (POD) as shown in Exhibit 3.<\/p><p>Exhibit 3: DEP Bond Issue (ID 071443274112)<\/p><div class=\"tbl\"><table><tr><td>Rating<\/td><td>B<\/td><td>Modified duration<\/td><td>2.80<\/td><td>POD<\/td><td>2.50%<\/td><\/tr><tr><td>Purchase price<\/td><td>$104.85<\/td><td>Coupon (just paid)<\/td><td>5%<\/td><td>Recovery rate<\/td><td>50%<\/td><\/tr><tr><td>Par value<\/td><td>$100<\/td><td>Maturity<\/td><td>3 years<\/td><td>Risk-free rate<\/td><td>2%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the credit analysis models shown in Exhibit 1 can only be used under the assumption that the issuing company&#x27;s assets trade in a frictionless market?<\/p><\/div>","subj":"fixed"},{"n":62,"q":"According to the structural model shown in Exhibit 2, the maximum amount an investor holding the bond would pay to a third party to remove the risk of default would be:","opts":["$0.65.","$22.86.","$23.51."],"ans":"C","expl":"The maximum amount an investor would to pay to remove the credit risk is the present value of the expected loss.\n(Module 28.4, LOS 28.d)","explhtml":"<p>The maximum amount an investor would to pay to remove the credit risk is the present value of the expected loss.<\/p><p>(Module 28.4, LOS 28.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Stevenson, CFA, is an experienced equity fund manager who has recently taken a position with Lohsi Clearview, a UK-based hedge fund that has combined a wide range of strategies to deliver impressive returns over the last five years. One of the fund&#x27;s strategies is to invest in high-credit-risk fixed income instruments. The fund has an excellent track record of identifying bonds in this sector that subsequently outperform the market.<\/p><p>Stevenson wishes to familiarize himself with the fund&#x27;s strategies and has started by looking at some of the techniques used in analyzing fixed income instruments. Exhibit 1 shows the firm&#x27;s approach to analyzing credit risk.<\/p><p>Exhibit 1: Credit Analysis Tools<\/p><p>Credit Ratings<\/p><p>Before undertaking any level of detailed analysis, the credit rating from the three major agencies should be obtained. Typically an instrument that is investment grade according to all three agencies will not be worthy of further consideration.<\/p><p>Structural Models<\/p><p>An initial analysis using a simple structural model should be undertaken to calculate the present value of the expected loss.<\/p><p>Reduced Form Models<\/p><p>Detailed analysis should be undertaken using the reduced form models used by the fixed income team. This analysis should only be undertaken once the structural model analysis has been completed.<\/p><p>Stevenson has no experience with structural models and is interested in learning more. He finds an analysis that has been completed for a recent bond issue. The results are shown in Exhibit 2.<\/p><p>Exhibit 2: IMC Bond Issue (ID 062014555612) Structural Model Results<\/p><div class=\"tbl\"><table><tr><td>Asset value<\/td><td>At<\/td><td>1,200<\/td><\/tr><tr><td>Expected return on assets<\/td><td>μ<\/td><td>0.04<\/td><\/tr><tr><td>Risk free rate<\/td><td>r<\/td><td>0.02<\/td><\/tr><tr><td>Face value<\/td><td>K<\/td><td>850<\/td><\/tr><tr><td>Time to maturity<\/td><td>T−t<\/td><td>1.5<\/td><\/tr><tr><td>Return volatility<\/td><td>σ<\/td><td>0.28<\/td><\/tr><tr><td>d1<\/td><td>1.26452<\/td><td><\/td><\/tr><tr><td>d2<\/td><td>0.92159<\/td><td><\/td><\/tr><tr><td>N(–d1)<\/td><td>0.1030<\/td><td><\/td><\/tr><tr><td>N(–d2)<\/td><td>0.1784<\/td><td><\/td><\/tr><tr><td>e1<\/td><td>1.35200<\/td><td><\/td><\/tr><tr><td>e2<\/td><td>1.00907<\/td><td><\/td><\/tr><tr><td>N(–e1)<\/td><td>0.0882<\/td><td><\/td><\/tr><tr><td>N(–e2)<\/td><td>0.1565<\/td><td><\/td><\/tr><tr><td>Expected loss<\/td><td>23.86<\/td><td><\/td><\/tr><tr><td>PV expected loss<\/td><td>23.51<\/td><td><\/td><\/tr><\/table><\/div><p>Stevenson next turns his attention to DEP Bond, one of the fund&#x27;s holdings. The bond was purchased today, immediately after it paid its annual coupon. Stevenson obtains the file for DEP and finds out that the bond was evaluated using a risk-neutral probability of default (POD) as shown in Exhibit 3.<\/p><p>Exhibit 3: DEP Bond Issue (ID 071443274112)<\/p><div class=\"tbl\"><table><tr><td>Rating<\/td><td>B<\/td><td>Modified duration<\/td><td>2.80<\/td><td>POD<\/td><td>2.50%<\/td><\/tr><tr><td>Purchase price<\/td><td>$104.85<\/td><td>Coupon (just paid)<\/td><td>5%<\/td><td>Recovery rate<\/td><td>50%<\/td><\/tr><tr><td>Par value<\/td><td>$100<\/td><td>Maturity<\/td><td>3 years<\/td><td>Risk-free rate<\/td><td>2%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>According to the structural model shown in Exhibit 2, the maximum amount an investor holding the bond would pay to a third party to remove the risk of default would be:<\/p><\/div>","subj":"fixed"},{"n":63,"q":"Based on information in Exhibit 3, if Stevenson determines that the recovery rate appropriate for DEP is 45%, the probability of default (POD) would most likely:","opts":["increase.","remain the same.","decrease."],"ans":"C","expl":"In general, given the market price of the bond, the estimated risk neutral probabilities of default and recovery rates are positively correlated. In this instance, we are given in the question that the recovery rate of 45% is determined to be appropriate (as opposed to the 50% rate used) to estimate the risk-neutral probability of default of 2.50% given in Exhibit 3. The lower the recovery rate assumed, the lower the risk-neutral probability of default (POD).\n(Module 28.1, LOS 28.a)","explhtml":"<p>In general, given the market price of the bond, the estimated risk neutral probabilities of default and recovery rates are positively correlated. In this instance, we are given in the question that the recovery rate of 45% is determined to be appropriate (as opposed to the 50% rate used) to estimate the risk-neutral probability of default of 2.50% given in Exhibit 3. The lower the recovery rate assumed, the lower the risk-neutral probability of default (POD).<\/p><p>(Module 28.1, LOS 28.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Stevenson, CFA, is an experienced equity fund manager who has recently taken a position with Lohsi Clearview, a UK-based hedge fund that has combined a wide range of strategies to deliver impressive returns over the last five years. One of the fund&#x27;s strategies is to invest in high-credit-risk fixed income instruments. The fund has an excellent track record of identifying bonds in this sector that subsequently outperform the market.<\/p><p>Stevenson wishes to familiarize himself with the fund&#x27;s strategies and has started by looking at some of the techniques used in analyzing fixed income instruments. Exhibit 1 shows the firm&#x27;s approach to analyzing credit risk.<\/p><p>Exhibit 1: Credit Analysis Tools<\/p><p>Credit Ratings<\/p><p>Before undertaking any level of detailed analysis, the credit rating from the three major agencies should be obtained. Typically an instrument that is investment grade according to all three agencies will not be worthy of further consideration.<\/p><p>Structural Models<\/p><p>An initial analysis using a simple structural model should be undertaken to calculate the present value of the expected loss.<\/p><p>Reduced Form Models<\/p><p>Detailed analysis should be undertaken using the reduced form models used by the fixed income team. This analysis should only be undertaken once the structural model analysis has been completed.<\/p><p>Stevenson has no experience with structural models and is interested in learning more. He finds an analysis that has been completed for a recent bond issue. The results are shown in Exhibit 2.<\/p><p>Exhibit 2: IMC Bond Issue (ID 062014555612) Structural Model Results<\/p><div class=\"tbl\"><table><tr><td>Asset value<\/td><td>At<\/td><td>1,200<\/td><\/tr><tr><td>Expected return on assets<\/td><td>μ<\/td><td>0.04<\/td><\/tr><tr><td>Risk free rate<\/td><td>r<\/td><td>0.02<\/td><\/tr><tr><td>Face value<\/td><td>K<\/td><td>850<\/td><\/tr><tr><td>Time to maturity<\/td><td>T−t<\/td><td>1.5<\/td><\/tr><tr><td>Return volatility<\/td><td>σ<\/td><td>0.28<\/td><\/tr><tr><td>d1<\/td><td>1.26452<\/td><td><\/td><\/tr><tr><td>d2<\/td><td>0.92159<\/td><td><\/td><\/tr><tr><td>N(–d1)<\/td><td>0.1030<\/td><td><\/td><\/tr><tr><td>N(–d2)<\/td><td>0.1784<\/td><td><\/td><\/tr><tr><td>e1<\/td><td>1.35200<\/td><td><\/td><\/tr><tr><td>e2<\/td><td>1.00907<\/td><td><\/td><\/tr><tr><td>N(–e1)<\/td><td>0.0882<\/td><td><\/td><\/tr><tr><td>N(–e2)<\/td><td>0.1565<\/td><td><\/td><\/tr><tr><td>Expected loss<\/td><td>23.86<\/td><td><\/td><\/tr><tr><td>PV expected loss<\/td><td>23.51<\/td><td><\/td><\/tr><\/table><\/div><p>Stevenson next turns his attention to DEP Bond, one of the fund&#x27;s holdings. The bond was purchased today, immediately after it paid its annual coupon. Stevenson obtains the file for DEP and finds out that the bond was evaluated using a risk-neutral probability of default (POD) as shown in Exhibit 3.<\/p><p>Exhibit 3: DEP Bond Issue (ID 071443274112)<\/p><div class=\"tbl\"><table><tr><td>Rating<\/td><td>B<\/td><td>Modified duration<\/td><td>2.80<\/td><td>POD<\/td><td>2.50%<\/td><\/tr><tr><td>Purchase price<\/td><td>$104.85<\/td><td>Coupon (just paid)<\/td><td>5%<\/td><td>Recovery rate<\/td><td>50%<\/td><\/tr><tr><td>Par value<\/td><td>$100<\/td><td>Maturity<\/td><td>3 years<\/td><td>Risk-free rate<\/td><td>2%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on information in Exhibit 3, if Stevenson determines that the recovery rate appropriate for DEP is 45%, the probability of default (POD) would most likely:<\/p><\/div>","subj":"fixed"},{"n":64,"q":"Based on the information in Exhibit 3, if the bond defaults 2 years after purchase, the IRR for the investment in the bond would be closest to:","opts":["–16.67%.","–18.43%.","–25.83%."],"ans":"C","expl":"After two years, exposure = $5 + 105 / 1.02 = $107.94. Recovery rate (given in Exhibit 3) = 50%. Hence, recovery = 50% of $107.94 = $53.97. CF0 = –104.85, C01 = 5.0, C02 = $53.97. IRR = –25.83%\n(Module 28.1, LOS 28.a)","explhtml":"<p>After two years, exposure = $5 + 105 / 1.02 = $107.94. Recovery rate (given in Exhibit 3) = 50%. Hence, recovery = 50% of $107.94 = $53.97. CF0 = –104.85, C01 = 5.0, C02 = $53.97. IRR = –25.83%<\/p><p>(Module 28.1, LOS 28.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Stevenson, CFA, is an experienced equity fund manager who has recently taken a position with Lohsi Clearview, a UK-based hedge fund that has combined a wide range of strategies to deliver impressive returns over the last five years. One of the fund&#x27;s strategies is to invest in high-credit-risk fixed income instruments. The fund has an excellent track record of identifying bonds in this sector that subsequently outperform the marke
