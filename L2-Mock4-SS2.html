<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n":45,"q":"The estimate of forecasted sales for the United States this month, using Sims's model, is closest to:","opts":["$6,329.","$6,453.","$6,667."],"ans":"C","expl":"To forecast the sales this month, we first calculate the change in the log of sales last month:\nΔln salest–1 = ln(6,270) − ln(6,184) = 8.7435 − 8.7297 = 0.0138 Next, use this change in the regression model to obtain the forecasted change for this month:\nΔln salest = 0.052 + 0.684(0.0138) = 0.0614 Add the forecasted change to last month's log sales to obtain this month's forecasted log sales:\nln salest = 0.0614 + 8.7435 = 8.8049 Lastly, convert the forecasted log value to a dollar value by taking its antilog: 8.8049\nsalest = e | = $6,667\n(Module 2.2, LOS 2.d)","explhtml":"<p>To forecast the sales this month, we first calculate the change in the log of sales last month:<\/p><p>Δln salest–1 = ln(6,270) − ln(6,184) = 8.7435 − 8.7297 = 0.0138 Next, use this change in the regression model to obtain the forecasted change for this month:<\/p><p>Δln salest = 0.052 + 0.684(0.0138) = 0.0614 Add the forecasted change to last month&#x27;s log sales to obtain this month&#x27;s forecasted log sales:<\/p><p>ln salest = 0.0614 + 8.7435 = 8.8049 Lastly, convert the forecasted log value to a dollar value by taking its antilog: <sup>8.8049<\/sup><\/p><div class=\"tbl\"><table><tr><td>salest = e<\/td><td> = $6,667<\/td><\/tr><\/table><\/div><p>(Module 2.2, LOS 2.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Ernie Smith and Jamal Sims are analysts with the firm of Madison Consultants. Madison provides statistical modeling advice to portfolio managers throughout the United States and Canada.<\/p><p>Sims has been assigned the task of valuing the U.S. stock market. He decides that the sales data should be transformed. He takes the natural log of the data and uses it in the following model:<\/p><p>∆ln salest = b0 + b1∆ln salest − 1<\/p><p>Parameter estimates for the autoregressive model and the actual data for the two most recent months are shown in Exhibit 1.<\/p><p>Exhibit 1: U.S. Autoregressive Model<\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>0.052<\/td><\/tr><tr><td>Lag 1 coefficient<\/td><td>0.684<\/td><\/tr><tr><td>Actual sales one month ago (–1)<\/td><td>6,270<\/td><\/tr><tr><td>Actual sales two months ago (–2)<\/td><td>6,184<\/td><\/tr><\/table><\/div><p>Smith and Sims originally modeled Canadian retail sales using the equation Xt = b0 + b1Xt–1 + b2Xt–12 but now believe that Canadian retail sales may be more appropriately modeled with an ARCH process.<\/p><p>Smith states that, in order to find out, he would take the residuals from the original autoregressive model for Canadian retail sales and then square them.<\/p><p>Sims states that these residuals would then be regressed against the Canadian retail sales data using the following equation: et = b0 + b1Xt, where e represents the residual terms from the original regression and X represents the Canadian retail sales data. If b1 is statistically different from zero, then the regression model contains an ARCH process.<\/p><p>Sims is also investigating the performance of 5-year European and British bonds versus the actions of the U.S. Federal Reserve. He uses the U.S. Federal Funds rate. The two regressions he uses are:<\/p><p>BYE,t = b0 + b1FFUS,t<\/p><p>BYB,t = b0 + b1FFUS,t<\/p><p>where: FF is the Federal Funds rate in the United States (US), and BY is the bond yield in the European Union (E) and Great Britain (B).<\/p><p>Before he runs this regression, he investigates the characteristics of the dependent and independent variables. He finds that the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root, but that the bond yield in the European Union does not. Furthermore, the Federal Funds rate in the United States and the bond yield in Great Britain are cointegrated, but the Federal Funds rate in the United States and the bond yield in the European Union are not.<\/p><\/div><\/details><div class=\"qtext\"><p>The estimate of forecasted sales for the United States this month, using Sims&#x27;s model, is closest to:<\/p><\/div>","subj":"quant"},{"n":46,"q":"Are the comments of Smith and Sims on the construction of an ARCH model correct?","opts":["Both comments are correct.","Only Smith is correct.","Only Sims is correct."],"ans":"B","expl":"Smith is correct. The first step in testing for an ARCH process is to take the residuals from the original autoregressive model and then square them.\nSims is incorrect. The next step in determining whether an ARCH process exists is to regress the squared residuals from this period against the squared residuals from the previous period as follows:\n2 | 2\nε | = b0 + b1ε\nt | t−1\nIf b1 is statistically different from zero, then we conclude that the regression model contains an ARCH process.\n(Module 2.5, LOS 2.m)","explhtml":"<p>Smith is correct. The first step in testing for an ARCH process is to take the residuals from the original autoregressive model and then square them.<\/p><p>Sims is incorrect. The next step in determining whether an ARCH process exists is to regress the squared residuals from this period against the squared residuals from the previous period as follows:<\/p><div class=\"tbl\"><table><tr><td><sup>2<\/sup><\/td><td><sup>2<\/sup><\/td><\/tr><tr><td>ε<\/td><td><sup>= b<\/sup><sup>0<\/sup><sup> + b<\/sup><sup>1<\/sup><sup>ε<\/sup><\/td><\/tr><tr><td>t<\/td><td>t−1<\/td><\/tr><\/table><\/div><p>If b1 is statistically different from zero, then we conclude that the regression model contains an ARCH process.<\/p><p>(Module 2.5, LOS 2.m)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ernie Smith and Jamal Sims are analysts with the firm of Madison Consultants. Madison provides statistical modeling advice to portfolio managers throughout the United States and Canada.<\/p><p>Sims has been assigned the task of valuing the U.S. stock market. He decides that the sales data should be transformed. He takes the natural log of the data and uses it in the following model:<\/p><p>∆ln salest = b0 + b1∆ln salest − 1<\/p><p>Parameter estimates for the autoregressive model and the actual data for the two most recent months are shown in Exhibit 1.<\/p><p>Exhibit 1: U.S. Autoregressive Model<\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>0.052<\/td><\/tr><tr><td>Lag 1 coefficient<\/td><td>0.684<\/td><\/tr><tr><td>Actual sales one month ago (–1)<\/td><td>6,270<\/td><\/tr><tr><td>Actual sales two months ago (–2)<\/td><td>6,184<\/td><\/tr><\/table><\/div><p>Smith and Sims originally modeled Canadian retail sales using the equation Xt = b0 + b1Xt–1 + b2Xt–12 but now believe that Canadian retail sales may be more appropriately modeled with an ARCH process.<\/p><p>Smith states that, in order to find out, he would take the residuals from the original autoregressive model for Canadian retail sales and then square them.<\/p><p>Sims states that these residuals would then be regressed against the Canadian retail sales data using the following equation: et = b0 + b1Xt, where e represents the residual terms from the original regression and X represents the Canadian retail sales data. If b1 is statistically different from zero, then the regression model contains an ARCH process.<\/p><p>Sims is also investigating the performance of 5-year European and British bonds versus the actions of the U.S. Federal Reserve. He uses the U.S. Federal Funds rate. The two regressions he uses are:<\/p><p>BYE,t = b0 + b1FFUS,t<\/p><p>BYB,t = b0 + b1FFUS,t<\/p><p>where: FF is the Federal Funds rate in the United States (US), and BY is the bond yield in the European Union (E) and Great Britain (B).<\/p><p>Before he runs this regression, he investigates the characteristics of the dependent and independent variables. He finds that the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root, but that the bond yield in the European Union does not. Furthermore, the Federal Funds rate in the United States and the bond yield in Great Britain are cointegrated, but the Federal Funds rate in the United States and the bond yield in the European Union are not.<\/p><\/div><\/details><div class=\"qtext\"><p>Are the comments of Smith and Sims on the construction of an ARCH model correct?<\/p><\/div>","subj":"quant"},{"n":47,"q":"Is Sims's regressions of European and British bond yields on the U.S. Federal Funds rate likely to produce valid results?","opts":["Neither Regression is valid.","Only Regression 1 is valid.","Only Regression 2 is valid."],"ans":"C","expl":"In the first regression, the Federal Funds rate in the United States has a unit root, but the bond yield in the European Union does not. So the former data series is not covariance stationary, but the latter is. In this case, the regression results will not be valid.\nIn the second regression, both the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root. So both data series are not covariance stationary. However, because they are cointegrated, the regression results will be valid.\nTo sum up the possibilities you may face on exam day:\nIf neither data series has a unit root, the regression results are valid. If only one data series has a unit root, the regression results are invalid. If both data series have a unit root and they are cointegrated, the regression results are valid.\nIf both data series have a unit root and they are not cointegrated, the regression results are not valid.\n(Module 2.5, LOS 2.n)","explhtml":"<p>In the first regression, the Federal Funds rate in the United States has a unit root, but the bond yield in the European Union does not. So the former data series is not covariance stationary, but the latter is. In this case, the regression results will not be valid.<\/p><p>In the second regression, both the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root. So both data series are not covariance stationary. However, because they are cointegrated, the regression results will be valid.<\/p><p>To sum up the possibilities you may face on exam day:<\/p><p>If neither data series has a unit root, the regression results are valid. If only one data series has a unit root, the regression results are invalid. If both data series have a unit root and they are cointegrated, the regression results are valid.<\/p><p>If both data series have a unit root and they are not cointegrated, the regression results are not valid.<\/p><p>(Module 2.5, LOS 2.n)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ernie Smith and Jamal Sims are analysts with the firm of Madison Consultants. Madison provides statistical modeling advice to portfolio managers throughout the United States and Canada.<\/p><p>Sims has been assigned the task of valuing the U.S. stock market. He decides that the sales data should be transformed. He takes the natural log of the data and uses it in the following model:<\/p><p>∆ln salest = b0 + b1∆ln salest − 1<\/p><p>Parameter estimates for the autoregressive model and the actual data for the two most recent months are shown in Exhibit 1.<\/p><p>Exhibit 1: U.S. Autoregressive Model<\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>0.052<\/td><\/tr><tr><td>Lag 1 coefficient<\/td><td>0.684<\/td><\/tr><tr><td>Actual sales one month ago (–1)<\/td><td>6,270<\/td><\/tr><tr><td>Actual sales two months ago (–2)<\/td><td>6,184<\/td><\/tr><\/table><\/div><p>Smith and Sims originally modeled Canadian retail sales using the equation Xt = b0 + b1Xt–1 + b2Xt–12 but now believe that Canadian retail sales may be more appropriately modeled with an ARCH process.<\/p><p>Smith states that, in order to find out, he would take the residuals from the original autoregressive model for Canadian retail sales and then square them.<\/p><p>Sims states that these residuals would then be regressed against the Canadian retail sales data using the following equation: et = b0 + b1Xt, where e represents the residual terms from the original regression and X represents the Canadian retail sales data. If b1 is statistically different from zero, then the regression model contains an ARCH process.<\/p><p>Sims is also investigating the performance of 5-year European and British bonds versus the actions of the U.S. Federal Reserve. He uses the U.S. Federal Funds rate. The two regressions he uses are:<\/p><p>BYE,t = b0 + b1FFUS,t<\/p><p>BYB,t = b0 + b1FFUS,t<\/p><p>where: FF is the Federal Funds rate in the United States (US), and BY is the bond yield in the European Union (E) and Great Britain (B).<\/p><p>Before he runs this regression, he investigates the characteristics of the dependent and independent variables. He finds that the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root, but that the bond yield in the European Union does not. Furthermore, the Federal Funds rate in the United States and the bond yield in Great Britain are cointegrated, but the Federal Funds rate in the United States and the bond yield in the European Union are not.<\/p><\/div><\/details><div class=\"qtext\"><p>Is Sims&#x27;s regressions of European and British bond yields on the U.S. Federal Funds rate likely to produce valid results?<\/p><\/div>","subj":"quant"},{"n":48,"q":"Which of the following is the most appropriate test for cointegration?","opts":["Breusch-Pagan.","Durbin-Watson.","Engle-Granger."],"ans":"C","expl":"To test whether two variables are cointegrated, we regress one data series on the other and examine the residuals for a unit root using the Dickey-Fuller/Engle-Granger test. If we reject the null hypothesis, the error terms of the two data series are covariance stationary and cointegrated. The regression results will be valid.\n(Module 2.5, LOS 2.n)","explhtml":"<p>To test whether two variables are cointegrated, we regress one data series on the other and examine the residuals for a unit root using the Dickey-Fuller/Engle-Granger test. If we reject the null hypothesis, the error terms of the two data series are covariance stationary and cointegrated. The regression results will be valid.<\/p><p>(Module 2.5, LOS 2.n)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ernie Smith and Jamal Sims are analysts with the firm of Madison Consultants. Madison provides statistical modeling advice to portfolio managers throughout the United States and Canada.<\/p><p>Sims has been assigned the task of valuing the U.S. stock market. He decides that the sales data should be transformed. He takes the natural log of the data and uses it in the following model:<\/p><p>∆ln salest = b0 + b1∆ln salest − 1<\/p><p>Parameter estimates for the autoregressive model and the actual data for the two most recent months are shown in Exhibit 1.<\/p><p>Exhibit 1: U.S. Autoregressive Model<\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>0.052<\/td><\/tr><tr><td>Lag 1 coefficient<\/td><td>0.684<\/td><\/tr><tr><td>Actual sales one month ago (–1)<\/td><td>6,270<\/td><\/tr><tr><td>Actual sales two months ago (–2)<\/td><td>6,184<\/td><\/tr><\/table><\/div><p>Smith and Sims originally modeled Canadian retail sales using the equation Xt = b0 + b1Xt–1 + b2Xt–12 but now believe that Canadian retail sales may be more appropriately modeled with an ARCH process.<\/p><p>Smith states that, in order to find out, he would take the residuals from the original autoregressive model for Canadian retail sales and then square them.<\/p><p>Sims states that these residuals would then be regressed against the Canadian retail sales data using the following equation: et = b0 + b1Xt, where e represents the residual terms from the original regression and X represents the Canadian retail sales data. If b1 is statistically different from zero, then the regression model contains an ARCH process.<\/p><p>Sims is also investigating the performance of 5-year European and British bonds versus the actions of the U.S. Federal Reserve. He uses the U.S. Federal Funds rate. The two regressions he uses are:<\/p><p>BYE,t = b0 + b1FFUS,t<\/p><p>BYB,t = b0 + b1FFUS,t<\/p><p>where: FF is the Federal Funds rate in the United States (US), and BY is the bond yield in the European Union (E) and Great Britain (B).<\/p><p>Before he runs this regression, he investigates the characteristics of the dependent and independent variables. He finds that the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root, but that the bond yield in the European Union does not. Furthermore, the Federal Funds rate in the United States and the bond yield in Great Britain are cointegrated, but the Federal Funds rate in the United States and the bond yield in the European Union are not.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is the most appropriate test for cointegration?<\/p><\/div>","subj":"quant"},{"n":49,"q":"Which country will experience a higher growth rate in potential GDP due to capital deepening and due to removal of restrictions on inflow of foreign capital?\nCapital deepening | Removal of restrictions on inflow of capital","opts":["Alicia Felicia","Felicia Felicia","Felicia Alicia"],"ans":"B","expl":"Felicia has lower capital to labor ratio and would benefit more from capital deepening. Removal of restrictions on the inflow of capital would lead to more investment and hence capital deepening—again benefiting Felicia more.\n(Module 6.1, LOS 6.d)","explhtml":"<p>Felicia has lower capital to labor ratio and would benefit more from capital deepening. Removal of restrictions on the inflow of capital would lead to more investment and hence capital deepening—again benefiting Felicia more.<\/p><p>(Module 6.1, LOS 6.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Economics<\/summary><div class=\"vig-body\"><p>Frank Hoskins and Paul Lanning are economists for a large U.S. investment advisory firm, Platinum Advisors. Hoskins and Lanning use their independent research on U.S. stocks and international stocks to provide advice for the firm&#x27;s network of advisors. As the senior economist at Platinum, Hoskins is a partner in the firm and is Lanning&#x27;s supervisor. Lanning has worked for Platinum for four years. At a lunch meeting, the two economists discuss the usefulness of economic theory, economic data, and the resulting forecasts of the global economic and stock market activity.<\/p><p>Lanning is examining the historical record of economic growth in Petra. He has gathered the data in Exhibit 1 to determine potential economic growth.<\/p><p>Exhibit 1: Economic Data for Petra from 20X1 to 20X7<\/p><div class=\"tbl\"><table><tr><td>Real GDP growth rate<\/td><td>3.9%<\/td><\/tr><tr><td>Growth rate in capital<\/td><td>1.4%<\/td><\/tr><tr><td>Growth rate in labor force<\/td><td>1.9%<\/td><\/tr><tr><td>Labor cost/total factor cost<\/td><td>0.52<\/td><\/tr><\/table><\/div><p>Lanning then turns his attention to the countries of Alicia and Felicia. He notes that the GDP growth rate in both countries is comparable. Alicia&#x27;s capital to labor ratio is USD 5,000. Felicia&#x27;s capital to labor ratio is USD 2,800. Alicia has a relatively younger labor force and the labor cost represents 35% of total factor cost. Both countries have extensive restrictions on foreign direct investments in their economy.<\/p><p>It has long been Platinum&#x27;s policy for its economists to use long-term economic growth trends to forecast future economic growth, stock returns, and dividends in a country. Lanning also examines the economy of Tiberia. Tiberia has a population of 11 million and is located in northern Africa. Its economy is diversified, and its main exports are agricultural products and heavy machinery. The country&#x27;s economy has been growing at an annual rate of 6.2% for the past 10 years, in part because of technological advances in the manufacturing of heavy equipment. These advances involve the use of computer-operated welding machines that have made the manufacturing process more efficient. Lanning is worried, however, that the current GDP growth rate may not be sustainable and is considering advising Platinum&#x27;s portfolio managers to decrease their portfolio allocations to the country. Before doing so, he will consult with Hoskins.<\/p><\/div><\/details><div class=\"qtext\"><p>Which country will experience a higher growth rate in potential GDP due to capital deepening and due to removal of restrictions on inflow of foreign capital?<\/p><div class=\"tbl\"><table><tr><td>Capital deepening<\/td><td>Removal of restrictions on inflow of capital<\/td><\/tr><\/table><\/div><\/div>","subj":"economics"},{"n":50,"q":"Petra's GDP growth rate attributable to growth in total factor productivity is closest to:","opts":["0.6%.","1.6%.","2.2%."],"ans":"C","expl":"GDP growth rate = growth rate in TFP + α (long-term growth rate of capital) + (1 − α) (long-term growth rate of labor). (1 − α) = 0.52 and thus α = 0.48 3.9% = ΔTFP + (0.48)(1.4) + (0.52)(1.9) →ΔTFP = 2.24% (Module 6.2, LOS 6.e)","explhtml":"<p>GDP growth rate = growth rate in TFP + α (long-term growth rate of capital) + (1 − α) (long-term growth rate of labor). (1 − α) = 0.52 and thus α = 0.48 3.9% = ΔTFP + (0.48)(1.4) + (0.52)(1.9) →ΔTFP = 2.24% (Module 6.2, LOS 6.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frank Hoskins and Paul Lanning are economists for a large U.S. investment advisory firm, Platinum Advisors. Hoskins and Lanning use their independent research on U.S. stocks and international stocks to provide advice for the firm&#x27;s network of advisors. As the senior economist at Platinum, Hoskins is a partner in the firm and is Lanning&#x27;s supervisor. Lanning has worked for Platinum for four years. At a lunch meeting, the two economists discuss the usefulness of economic theory, economic data, and the resulting forecasts of the global economic and stock market activity.<\/p><p>Lanning is examining the historical record of economic growth in Petra. He has gathered the data in Exhibit 1 to determine potential economic growth.<\/p><p>Exhibit 1: Economic Data for Petra from 20X1 to 20X7<\/p><div class=\"tbl\"><table><tr><td>Real GDP growth rate<\/td><td>3.9%<\/td><\/tr><tr><td>Growth rate in capital<\/td><td>1.4%<\/td><\/tr><tr><td>Growth rate in labor force<\/td><td>1.9%<\/td><\/tr><tr><td>Labor cost/total factor cost<\/td><td>0.52<\/td><\/tr><\/table><\/div><p>Lanning then turns his attention to the countries of Alicia and Felicia. He notes that the GDP growth rate in both countries is comparable. Alicia&#x27;s capital to labor ratio is USD 5,000. Felicia&#x27;s capital to labor ratio is USD 2,800. Alicia has a relatively younger labor force and the labor cost represents 35% of total factor cost. Both countries have extensive restrictions on foreign direct investments in their economy.<\/p><p>It has long been Platinum&#x27;s policy for its economists to use long-term economic growth trends to forecast future economic growth, stock returns, and dividends in a country. Lanning also examines the economy of Tiberia. Tiberia has a population of 11 million and is located in northern Africa. Its economy is diversified, and its main exports are agricultural products and heavy machinery. The country&#x27;s economy has been growing at an annual rate of 6.2% for the past 10 years, in part because of technological advances in the manufacturing of heavy equipment. These advances involve the use of computer-operated welding machines that have made the manufacturing process more efficient. Lanning is worried, however, that the current GDP growth rate may not be sustainable and is considering advising Platinum&#x27;s portfolio managers to decrease their portfolio allocations to the country. Before doing so, he will consult with Hoskins.<\/p><\/div><\/details><div class=\"qtext\"><p>Petra&#x27;s GDP growth rate attributable to growth in total factor productivity is closest to:<\/p><\/div>","subj":"economics"},{"n":51,"q":"The classical growth theory predicts that Tiberia's long-run future GDP per capita is most likely to:","opts":["decline due to diminishing marginal productivity of capital.","settle at subsistence level due to adjustments in the population.","remain unchanged from the current levels unless the government increases the budget deficit."],"ans":"B","expl":"Under the classical growth theory, the Tiberian economy will settle at a subsistence level. The high growth in the economy will result in a higher population. The higher population will eventually result in decreased returns to labor and decreased labor productivity. No permanent increase in labor productivity will result and per capita GDP will settle at a subsistence level.\n(Module 6.3, LOS 6.i)","explhtml":"<p>Under the classical growth theory, the Tiberian economy will settle at a subsistence level. The high growth in the economy will result in a higher population. The higher population will eventually result in decreased returns to labor and decreased labor productivity. No permanent increase in labor productivity will result and per capita GDP will settle at a subsistence level.<\/p><p>(Module 6.3, LOS 6.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frank Hoskins and Paul Lanning are economists for a large U.S. investment advisory firm, Platinum Advisors. Hoskins and Lanning use their independent research on U.S. stocks and international stocks to provide advice for the firm&#x27;s network of advisors. As the senior economist at Platinum, Hoskins is a partner in the firm and is Lanning&#x27;s supervisor. Lanning has worked for Platinum for four years. At a lunch meeting, the two economists discuss the usefulness of economic theory, economic data, and the resulting forecasts of the global economic and stock market activity.<\/p><p>Lanning is examining the historical record of economic growth in Petra. He has gathered the data in Exhibit 1 to determine potential economic growth.<\/p><p>Exhibit 1: Economic Data for Petra from 20X1 to 20X7<\/p><div class=\"tbl\"><table><tr><td>Real GDP growth rate<\/td><td>3.9%<\/td><\/tr><tr><td>Growth rate in capital<\/td><td>1.4%<\/td><\/tr><tr><td>Growth rate in labor force<\/td><td>1.9%<\/td><\/tr><tr><td>Labor cost/total factor cost<\/td><td>0.52<\/td><\/tr><\/table><\/div><p>Lanning then turns his attention to the countries of Alicia and Felicia. He notes that the GDP growth rate in both countries is comparable. Alicia&#x27;s capital to labor ratio is USD 5,000. Felicia&#x27;s capital to labor ratio is USD 2,800. Alicia has a relatively younger labor force and the labor cost represents 35% of total factor cost. Both countries have extensive restrictions on foreign direct investments in their economy.<\/p><p>It has long been Platinum&#x27;s policy for its economists to use long-term economic growth trends to forecast future economic growth, stock returns, and dividends in a country. Lanning also examines the economy of Tiberia. Tiberia has a population of 11 million and is located in northern Africa. Its economy is diversified, and its main exports are agricultural products and heavy machinery. The country&#x27;s economy has been growing at an annual rate of 6.2% for the past 10 years, in part because of technological advances in the manufacturing of heavy equipment. These advances involve the use of computer-operated welding machines that have made the manufacturing process more efficient. Lanning is worried, however, that the current GDP growth rate may not be sustainable and is considering advising Platinum&#x27;s portfolio managers to decrease their portfolio allocations to the country. Before doing so, he will consult with Hoskins.<\/p><\/div><\/details><div class=\"qtext\"><p>The classical growth theory predicts that Tiberia&#x27;s long-run future GDP per capita is most likely to:<\/p><\/div>","subj":"economics"},{"n":52,"q":"The endogenous growth theory predicts that the Tiberian GDP growth rate is most likely to:","opts":["settle at a long-run steady state because of diminishing marginal productivity of capital.","continue to increase because technological advances will be shared by many sectors of the economy.","decline because the current GDP growth rate is not sustainable."],"ans":"B","expl":"Under the endogenous growth theory, the Tiberian GDP growth rate can continue to increase because technological advances will be shared by many sectors of the economy. Increasing R&D investment, for example, results in benefits not just to the firm making the investment but also to other firms. As these benefits flow to other firms, the economy becomes more productive and the long-term economic growth rate can continue to increase.\n(Module 6.3, LOS 6.i)","explhtml":"<p>Under the endogenous growth theory, the Tiberian GDP growth rate can continue to increase because technological advances will be shared by many sectors of the economy. Increasing R&amp;D investment, for example, results in benefits not just to the firm making the investment but also to other firms. As these benefits flow to other firms, the economy becomes more productive and the long-term economic growth rate can continue to increase.<\/p><p>(Module 6.3, LOS 6.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frank Hoskins and Paul Lanning are economists for a large U.S. investment advisory firm, Platinum Advisors. Hoskins and Lanning use their independent research on U.S. stocks and international stocks to provide advice for the firm&#x27;s network of advisors. As the senior economist at Platinum, Hoskins is a partner in the firm and is Lanning&#x27;s supervisor. Lanning has worked for Platinum for four years. At a lunch meeting, the two economists discuss the usefulness of economic theory, economic data, and the resulting forecasts of the global economic and stock market activity.<\/p><p>Lanning is examining the historical record of economic growth in Petra. He has gathered the data in Exhibit 1 to determine potential economic growth.<\/p><p>Exhibit 1: Economic Data for Petra from 20X1 to 20X7<\/p><div class=\"tbl\"><table><tr><td>Real GDP growth rate<\/td><td>3.9%<\/td><\/tr><tr><td>Growth rate in capital<\/td><td>1.4%<\/td><\/tr><tr><td>Growth rate in labor force<\/td><td>1.9%<\/td><\/tr><tr><td>Labor cost/total factor cost<\/td><td>0.52<\/td><\/tr><\/table><\/div><p>Lanning then turns his attention to the countries of Alicia and Felicia. He notes that the GDP growth rate in both countries is comparable. Alicia&#x27;s capital to labor ratio is USD 5,000. Felicia&#x27;s capital to labor ratio is USD 2,800. Alicia has a relatively younger labor force and the labor cost represents 35% of total factor cost. Both countries have extensive restrictions on foreign direct investments in their economy.<\/p><p>It has long been Platinum&#x27;s policy for its economists to use long-term economic growth trends to forecast future economic growth, stock returns, and dividends in a country. Lanning also examines the economy of Tiberia. Tiberia has a population of 11 million and is located in northern Africa. Its economy is diversified, and its main exports are agricultural products and heavy machinery. The country&#x27;s economy has been growing at an annual rate of 6.2% for the past 10 years, in part because of technological advances in the manufacturing of heavy equipment. These advances involve the use of computer-operated welding machines that have made the manufacturing process more efficient. Lanning is worried, however, that the current GDP growth rate may not be sustainable and is considering advising Platinum&#x27;s portfolio managers to decrease their portfolio allocations to the country. Before doing so, he will consult with Hoskins.<\/p><\/div><\/details><div class=\"qtext\"><p>The endogenous growth theory predicts that the Tiberian GDP growth rate is most likely to:<\/p><\/div>","subj":"economics"},{"n":53,"q":"Due to its employee incentive stock option plan only, if Clear had presented its financial statements under U.S. GAAP, it would have reported:","opts":["the same net income but higher stockholders' equity.","higher net income but the same stockholders' equity.","lower net income and lower stockholders' equity."],"ans":"B","expl":"Under U.S. GAAP, a tax windfall would reduce tax expense in the income statement and hence result in a higher net income. Tax windfalls would go directly into equity via OCI under IFRS. Either way, the stockholders' equity would be the same.\n(Module 9.1, LOS 9.b)","explhtml":"<p>Under U.S. GAAP, a tax windfall would reduce tax expense in the income statement and hence result in a higher net income. Tax windfalls would go directly into equity via OCI under IFRS. Either way, the stockholders&#x27; equity would be the same.<\/p><p>(Module 9.1, LOS 9.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>John Baragutti, CFA, works in the transaction services arm of HLBB, a large accountancy firm with a substantial advisory business on the east coast of the United States. He is currently advising on a potential M&amp;A transaction between two airlines. Tarpon Airlines, Inc. (Tarpon), which operates out of the east coast of the United States, is the larger of the two companies and its board has entered into discussions with the smaller Clear Air S.A. (Clear). Clear, based in France, would provide Tarpon access to a significant number of landing slots in major European airports.<\/p><p>Baragutti is currently reviewing the income statement of Clear in order to address some concerns raised by Tarpon&#x27;s board. Merger discussions had initially progressed rapidly after an initial review of Clear&#x27;s last five years&#x27; income statements, which revealed an operating profit margin that was in line with that of Tarpon. The board has historically been extremely cautious about acquiring any potential target with a profit margin lower than its own. However, further investigation has revealed concerns regarding the treatment of pension costs in the income statement.<\/p><p>Tarpon runs only a defined contribution pension scheme for its employees and an employee incentive stock option scheme. Clear, however, has a defined benefit scheme that is currently overfunded. Additionally, because of the rise in the value of Clear&#x27;s stock price, in 20X5 there was a tax windfall from the employee incentive stock option scheme. Extracts from the pension note included in Clear&#x27;s annual report are shown in Exhibit 1.<\/p><p>Exhibit 1: Pension Note (Extracts)<\/p><p>Present Value of Fair Value of Plan Defined Benefit Assets Obligations<\/p><div class=\"tbl\"><table><tr><td>€ million<\/td><td>€ million<\/td><td><\/td><td><\/td><\/tr><tr><td>As at 1 January<\/td><td>As at 1<\/td><td><\/td><td><\/td><\/tr><tr><td>8,110<\/td><td>8,920<\/td><td><\/td><td><\/td><\/tr><tr><td>20X5<\/td><td>January 20X5<\/td><td><\/td><td><\/td><\/tr><tr><td>Current service<\/td><td>Return on<\/td><td><\/td><td><\/td><\/tr><tr><td>170<\/td><td>145<\/td><td><\/td><td><\/td><\/tr><tr><td>cost<\/td><td>plan assets Employer<\/td><td><\/td><td><\/td><\/tr><tr><td>Past service cost<\/td><td>15 contributions<\/td><td>306<\/td><td><\/td><\/tr><tr><td>Interest cost<\/td><td>365<\/td><td>Benefits paid<\/td><td>(202)<\/td><\/tr><tr><td>Benefits paid<\/td><td>(202)<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Remeasurement 218 (gains)/loss<\/p><p>As at 31 As at 31<\/p><div class=\"tbl\"><table><tr><td>8,676<\/td><td>December<\/td><td>9,169<\/td><\/tr><\/table><\/div><p>December 20X5 20X5<\/p><p>Notes:<\/p><p>Pension benefit obligation has been calculated using the average yield on high-quality corporate bonds with similar durations to the benefits in the scheme, currently 4.5%.<\/p><p>Due to turbulent economic conditions in the eurozone, return on plan assets was only 1.63%.<\/p><p>Remeasurement gains at the start of the year totaled €231 million.<\/p><p>Having never accounted for a defined benefit scheme, in its initial review, the board of Tarpon did not consider the impact of the defined benefit plan on the operating margin. As a result, Baragutti has been asked to address three issues.<\/p><p>First, Clear prepares its financial statements using IFRS whereas Tarpon reports under U.S. GAAP. The board wants to gain an understanding of Clear&#x27;s pension expense for 20X5 as computed under U.S. GAAP. Secondly, the disclosure of certain elements of the pension cost has confused the board. Although the notes to the income statement identify that the pension cost has an interest element, this has been included within operating profit.<\/p><p>Finally, the board is concerned about future adjustments that may be required to deal with the amortization of the remeasurement gains that have accumulated in Clear&#x27;s pension scheme. Baragutti intends to perform the following calculations to deal with each issue independently:<\/p><p>Issue 1<\/p><p>Recalculate pension expense included in the income statement under U.S. GAAP. Baragutti has observed that companies reporting pension expense under U.S. GAAP have used an average of 3% for the expected return on plan assets and he intends to apply this rate where applicable. He does not intend to amortize any of this year&#x27;s prior service cost.<\/p><p>Issue 2<\/p><p>Assuming IFRS, recalculate the local currency (€) operating margin excluding any pension scheme interest element. The current income statement before Baragutti&#x27;s adjustments is shown in Exhibit 2.<\/p><p>Issue 3<\/p><p>Baragutti prepares the following note containing two statements to advise the board on the future amortization of actuarial gains and losses:<\/p><p>Statement 1<\/p><p>&quot;Under IFRS, when cumulative remeasurement gains/losses are large enough, they will be amortized through the income statement over the average service life of the employees, reducing net income if net losses are amortized, and increasing net income if net gains are amortized.&quot;<\/p><p>Statement 2<\/p><p>&quot;Under U.S. GAAP, the amortization of net actuarial losses will increase leverage (i.e., debt-to-equity ratio), whereas the amortization of net actuarial gains will decrease leverage.&quot;<\/p><p>Exhibit 2: Income Statement (Extracts)<\/p><p>20X5<\/p><p>€ million<\/p><p>Revenue<\/p><div class=\"tbl\"><table><tr><td>Passenger<\/td><td>9,321<\/td><\/tr><tr><td>Cargo<\/td><td>456<\/td><\/tr><tr><td>Total<\/td><td>9,777<\/td><\/tr><tr><td>Employee costs<\/td><td>3,654<\/td><\/tr><tr><td>Depreciation, amortization<\/td><td>894<\/td><\/tr><tr><td>Aircraft operating lease costs<\/td><td>156<\/td><\/tr><tr><td>Fuel and oil costs<\/td><td>1,853<\/td><\ djusted operating profit:<\/td><td>198.22<\/td><\/tr><tr><td>Adjusted margin:<\/td><td>198.22 / 9777 = 2.02%<\/td><\/tr><\/table><\/div><p>(Module 9.2, LOS 9.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Baragutti, CFA, works in the transaction services arm of HLBB, a large accountancy firm with a substantial advisory business on the east coast of the United States. He is currently advising on a potential M&amp;A transaction between two airlines. Tarpon Airlines, Inc. (Tarpon), which operates out of the east coast of the United States, is the larger of the two companies and its board has entered into discussions with the smaller Clear Air S.A. (Clear). Clear, based in France, would provide Tarpon access to a significant number of landing slots in major European airports.<\/p><p>Baragutti is currently reviewing the income statement of Clear in order to address some concerns raised by Tarpon&#x27;s board. Merger discussions had initially progressed rapidly after an initial review of Clear&#x27;s last five years&#x27; income statements, which revealed an operating profit margin that was in line with that of Tarpon. The board has historically been extremely cautious about acquiring any potential target with a profit margin lower than its own. However, further investigation has revealed concerns regarding the treatment of pension costs in the income statement.<\/p><p>Tarpon runs only a defined contribution pension scheme for its employees and an employee incentive stock option scheme. Clear, however, has a defined benefit scheme that is currently overfunded. Additionally, because of the rise in the value of Clear&#x27;s stock price, in 20X5 there was a tax windfall from the employee incentive stock option scheme. Extracts from the pension note included in Clear&#x27;s annual report are shown  the notes to the income statement identify that the pension cost has an interest element, this has been included within operating profit.<\/p><p>Finally, the board is concerned about future adjustments that may be required to deal with the amortization of the remeasurement gains that have accumulated in Clear&#x27;s pension scheme. Baragutti intends to perform the following calculations to deal with each issue independently:<\/p><p>Issue 1<\/p><p>Recalculate pension expense included in the income statement under U.S. GAAP. Baragutti has observed that companies reporting pension expense under U.S. GAAP have used an average of 3% for the expected return on plan assets and he intends to apply this rate where applicable. He does not intend to amortize any of this year&#x27;s prior service cost.<\/p><p>Issue 2<\/p><p>Assuming IFRS, recalculate the local currency (€) operating margin excluding any pension scheme interest element. The current income statement before Baragutti&#x27;s adjustments is shown in Exhibit 2.<\/p><p>Issue 3<\/p><p>Baragutti prepares the following note containing two statements to advise the board on the future amortization of actuarial gains and losses:<\/p><p>Statement 1<\/p><p>&quot;Under IFRS, when cumulative remeasurement gains/losses are large enough, they will be amortized through the income statement over the average service life of the employees, reducing net income if net losses are amortized, and increasing net income if net gains are amortized.&quot;<\/p><p>Statement 2<\/p><p>&quot;Under U.S. GAAP, the amortization of net actuarial losses will increase leverage (i.e., debt-to-equity ratio), whereas the amortization of net actuarial gains will decrease leverage.&quot;<\/p><p>Exhibit 2: Income Statement (Extracts)<\/p><p>20X5<\/p><p>€ million<\/p><p>Revenue<\/p><div class=\"tbl\"><table><tr><td>Passenger<\/td><td>9,321<\/td><\/tr><tr><td>Cargo<\/td><td>456<\/td><\/tr><tr><td>Total<\/td><td>9,777<\/td><\/tr><tr><td>Employee costs<\/td><td>
