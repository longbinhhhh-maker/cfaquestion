on the value of the calls in the binomial model, so he also calculates the value of a one-period European style call option on Arbor stock with a strike price of 40.<\/p><\/div><\/details><div class=\"qtext\"><p>The value of a two-period 40 call on Arbor Industries stock is closest to:<\/p><\/div>","subj":"derivatives"},{"n":66,"q":"The position in calls necessary to hedge a long position in 1,000 shares of stock over the first period is closest to:","opts":["short 830 calls.","short 1,150 calls.","short 1,205 calls."],"ans":"C","expl":"1,000\nTo form a delta neutral portfolio Loper needs to write  0.83 | = 1,204.82, or 1,205\ncalls.\n(Module 31.7, LOS 31.l)","explhtml":"<p>1,000<\/p><div class=\"tbl\"><table><tr><td>To form a delta neutral portfolio Loper needs to write  0.83<\/td><td> = 1,204.82, or 1,205<\/td><\/tr><\/table><\/div><p>calls.<\/p><p>(Module 31.7, LOS 31.l)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stan Loper is unfamiliar with the Black-Scholes-Merton (BSM) option pricing model and plans to use a two-period binomial model to value some call options. The stock of Arbor Industries pays no dividends and currently trades for $45. The up-move factor for the stock is 1.15, while the down factor is 0.87, and the risk-free rate is 4%. He is considering buying two-period European style options on Arbor Industries with a strike price of $40. The delta of these options over the first period is 0.83. Loper is curious about the effect of time on the value of the calls in the binomial model, so he also calculates the value of a one-period European style call option on Arbor stock with a strike price of 40.<\/p><\/div><\/details><div class=\"qtext\"><p>The position in calls necessary to hedge a long position in 1,000 shares of stock over the first period is closest to:<\/p><\/div>","subj":"derivatives"},{"n":67,"q":"The value of the one-period 40 call on Arbor stock is closest to:","opts":["$6.65.","$6.86.","$7.15."],"ans":"B","expl":"The payoff is zero for a down-move and 11.75 for an up-move. Since the probability (0.607)11.75\nof an up-move is 0.607, the present value is  1.04 | = $6.86.\n(Module 31.1, LOS 31.d)","explhtml":"<p>The payoff is zero for a down-move and 11.75 for an up-move. Since the probability (0.607)11.75<\/p><div class=\"tbl\"><table><tr><td>of an up-move is 0.607, the present value is  1.04<\/td><td>= $6.86.<\/td><\/tr><\/table><\/div><p>(Module 31.1, LOS 31.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stan Loper is unfamiliar with the Black-Scholes-Merton (BSM) option pricing model and plans to use a two-period binomial model to value some call options. The stock of Arbor Industries pays no dividends and currently trades for $45. The up-move factor for the stock is 1.15, while the down factor is 0.87, and the risk-free rate is 4%. He is considering buying two-period European style options on Arbor Industries with a strike price of $40. The delta of these options over the first period is 0.83. Loper is curious about the effect of time on the value of the calls in the binomial model, so he also calculates the value of a one-period European style call option on Arbor stock with a strike price of 40.<\/p><\/div><\/details><div class=\"qtext\"><p>The value of the one-period 40 call on Arbor stock is closest to:<\/p><\/div>","subj":"derivatives"},{"n":68,"q":"The difference in value between the European 40 calls and otherwise identical American 40 calls is closest to:","opts":["–$1.43.","$0.00.","$1.92."],"ans":"B","expl":"The possibility of early exercise is not valuable for call options on non-dividend paying stocks, so the value of the American call is the same as the value of the European call, and the difference in value is zero.\n(Module 31.1, LOS 31.d)","explhtml":"<p>The possibility of early exercise is not valuable for call options on non-dividend paying stocks, so the value of the American call is the same as the value of the European call, and the difference in value is zero.<\/p><p>(Module 31.1, LOS 31.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stan Loper is unfamiliar with the Black-Scholes-Merton (BSM) option pricing model and plans to use a two-period binomial model to value some call options. The stock of Arbor Industries pays no dividends and currently trades for $45. The up-move factor for the stock is 1.15, while the down factor is 0.87, and the risk-free rate is 4%. He is considering buying two-period European style options on Arbor Industries with a strike price of $40. The delta of these options over the first period is 0.83. Loper is curious about the effect of time on the value of the calls in the binomial model, so he also calculates the value of a one-period European style call option on Arbor stock with a strike price of 40.<\/p><\/div><\/details><div class=\"qtext\"><p>The difference in value between the European 40 calls and otherwise identical American 40 calls is closest to:<\/p><\/div>","subj":"derivatives"},{"n":69,"q":"Regarding the long forward position in Specialty Retail, Inc., the position is most likely to lose value as a result of:","opts":["an increase in the risk-free rate.","an increase in the current stock price of Specialty Retail.","an extra dividend payment during the contract interval."],"ans":"C","expl":"Long forward contract positions increase in value when the forward price increases. Forward price is positively related to the spot price, time to maturity, and risk-free rate. Equity forward price is negatively related to dividend yield. An extra dividend payment during the contract interval would reduce the forward price and lead to a decline in the value of a long forward position.\n(Module 30.2, LOS 30.a)","explhtml":"<p>Long forward contract positions increase in value when the forward price increases. Forward price is positively related to the spot price, time to maturity, and risk-free rate. Equity forward price is negatively related to dividend yield. An extra dividend payment during the contract interval would reduce the forward price and lead to a decline in the value of a long forward position.<\/p><p>(Module 30.2, LOS 30.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Derivatives<\/summary><div class=\"vig-body\"><p>Ben Smart heads the trading department for Blue Sigma. Smart is reviewing some of the outstanding derivatives contracts. Specifically, Smart locates a long position in a forward contract on 10,000 shares of Specialty Retail, Inc.<\/p><p>Smart then directs his attention to a particular T-bond futures contract. The cheapest-to-deliver is a 2.50% semi-annual coupon bond that last paid a coupon two months ago. The bond trades at $103.14 (clean price) and has a conversion factor of 0.8125. The futures contract matures in 3 months. The current 3-month risk-free rate is 0.25%.<\/p><p>Smart is also interested in using the BSM model to price European and American call and put options.<\/p><p>He is concerned, however, about whether the assumptions necessary to use the model are realistic. The assumptions he is particularly concerned about are:<\/p><p>The volatility of the option value is known and constant. Stock returns are normally distributed.<\/p><p>The continuous risk-free rate is known and constant.<\/p><p>Smart would like to value options on Rapid Repair, Inc., common stock, but Rapid pays dividends, so Smart is uncertain about the effect on the value of the options. Smart uses a two-period binomial model to value long positions in the Rapid Repair call and put options without accounting for the fact that Rapid Repair pays dividends.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the long forward position in Specialty Retail, Inc., the position is most likely to lose value as a result of:<\/p><\/div>","subj":"derivatives"},{"n":70,"q":"The no-arbitrage T-bond futures price is closest to:","opts":["102.74.","114.59.","126.25."],"ans":"C","expl":"The clean price is $103.14. Accrued interest at inception = AI0 = (2 / 6) × (2.50 / 2) = 0.4167 (Semi-annual coupon is 2.50 / 2 = 1.25 and it has been 2 months since the last coupon). Accrued interest at maturity of futures contract = AIT = (5 / 6) × (2.50 / 2) = 1.04 Because there is no coupon paid during the three months of the futures contract, FVC = 0.\n(3/12)\nQFP = (1 / CF) [(Clean price + AI0)×(1 + Rf) 0.25 | − AIT − FVC] = (1 / 0.8125) × [(103.14\n+0.4167) × (1.0025) | – 1.04 − 0] = 126.25\n(Module 30.3, LOS 30.d)","explhtml":"<p>The clean price is $103.14. Accrued interest at inception = AI0 = (2 / 6) × (2.50 / 2) = 0.4167 (Semi-annual coupon is 2.50 / 2 = 1.25 and it has been 2 months since the last coupon). Accrued interest at maturity of futures contract = AIT = (5 / 6) × (2.50 / 2) = 1.04 Because there is no coupon paid during the three months of the futures contract, FVC = 0.<\/p><p><sup>(3/12)<\/sup><\/p><div class=\"tbl\"><table><tr><td>QFP = (1 / CF) [(Clean price + AI0)×(1 + Rf) <sup>0.25<\/sup><\/td><td> − AIT − FVC] = (1 / 0.8125) × [(103.14<\/td><\/tr><tr><td>+0.4167) × (1.0025)<\/td><td> – 1.04 − 0] = 126.25<\/td><\/tr><\/table><\/div><p>(Module 30.3, LOS 30.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ben Smart heads the trading department for Blue Sigma. Smart is reviewing some of the outstanding derivatives contracts. Specifically, Smart locates a long position in a forward contract on 10,000 shares of Specialty Retail, Inc.<\/p><p>Smart then directs his attention to a particular T-bond futures contract. The cheapest-to-deliver is a 2.50% semi-annual coupon bond that last paid a coupon two months ago. The bond trades at $103.14 (clean price) and has a conversion factor of 0.8125. The futures contract matures in 3 months. The current 3-month risk-free rate is 0.25%.<\/p><p>Smart is also interested in using the BSM model to price European and American call and put options.<\/p><p>He is concerned, however, about whether the assumptions necessary to use the model are realistic. The assumptions he is particularly concerned about are:<\/p><p>The volatility of the option value is known and constant. Stock returns are normally distributed.<\/p><p>The continuous risk-free rate is known and constant.<\/p><p>Smart would like to value options on Rapid Repair, Inc., common stock, but Rapid pays dividends, so Smart is uncertain about the effect on the value of the options. Smart uses a two-period binomial model to value long positions in the Rapid Repair call and put options without accounting for the fact that Rapid Repair pays dividends.<\/p><\/div><\/details><div class=\"qtext\"><p>The no-arbitrage T-bond futures price is closest to:<\/p><\/div>","subj":"derivatives"},{"n":71,"q":"Are the BSM assumptions listed correctly?","opts":["No, because stock prices are assumed to be normally distributed.","No, because the expected return on the stock is assumed to be known and constant.","No, because the volatility of the return on the underlying stock is assumed to be known and constant."],"ans":"C","expl":"The first assumption listed in the vignette should read, \"The volatility of the return on the underlying stock is known and constant.\" The other listed assumptions are correct.\n(Module 31.6, LOS 31.f)","explhtml":"<p>The first assumption listed in the vignette should read, &quot;The volatility of the return on the underlying stock is known and constant.&quot; The other listed assumptions are correct.<\/p><p>(Module 31.6, LOS 31.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ben Smart heads the trading department for Blue Sigma. Smart is reviewing some of the outstanding derivatives contracts. Specifically, Smart locates a long position in a forward contract on 10,000 shares of Specialty Retail, Inc.<\/p><p>Smart then directs his attention to a particular T-bond futures contract. The cheapest-to-deliver is a 2.50% semi-annual coupon bond that last paid a coupon two months ago. The bond trades at $103.14 (clean price) and has a conversion factor of 0.8125. The futures contract matures in 3 months. The current 3-month risk-free rate is 0.25%.<\/p><p>Smart is also interested in using the BSM model to price European and American call and put options.<\/p><p>He is concerned, however, about whether the assumptions necessary to use the model are realistic. The assumptions he is particularly concerned about are:<\/p><p>The volatility of the option value is known and constant. Stock returns are normally distributed.<\/p><p>The continuous risk-free rate is known and constant.<\/p><p>Smart would like to value options on Rapid Repair, Inc., common stock, but Rapid pays dividends, so Smart is uncertain about the effect on the value of the options. Smart uses a two-period binomial model to value long positions in the Rapid Repair call and put options without accounting for the fact that Rapid Repair pays dividends.<\/p><\/div><\/details><div class=\"qtext\"><p>Are the BSM assumptions listed correctly?<\/p><\/div>","subj":"derivatives"},{"n":72,"q":"When Smart failed to account for Rapid Repair dividends, did he likely overvalue the calls or the puts?","opts":["The calls and the puts are overvalued.","Only the calls are overvalued.","Only the puts are overvalued."],"ans":"B","expl":"Dividends on the underlying stock decrease the value of call options and increase the value of put options, all else equal. By ignoring them in his valuation, Smart will likely overvalue a long call option and undervalue a long put.\n(Module 31.6, LOS 31.h)","explhtml":"<p>Dividends on the underlying stock decrease the value of call options and increase the value of put options, all else equal. By ignoring them in his valuation, Smart will likely overvalue a long call option and undervalue a long put.<\/p><p>(Module 31.6, LOS 31.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ben Smart heads the trading department for Blue Sigma. Smart is reviewing some of the outstanding derivatives contracts. Specifically, Smart locates a long position in a forward contract on 10,000 shares of Specialty Retail, Inc.<\/p><p>Smart then directs his attention to a particular T-bond futures contract. The cheapest-to-deliver is a 2.50% semi-annual coupon bond that last paid a coupon two months ago. The bond trades at $103.14 (clean price) and has a conversion factor of 0.8125. The futures contract matures in 3 months. The current 3-month risk-free rate is 0.25%.<\/p><p>Smart is also interested in using the BSM model to price European and American call and put options.<\/p><p>He is concerned, however, about whether the assumptions necessary to use the model are realistic. The assumptions he is particularly concerned about are:<\/p><p>The volatility of the option value is known and constant. Stock returns are normally distributed.<\/p><p>The continuous risk-free rate is known and constant.<\/p><p>Smart would like to value options on Rapid Repair, Inc., common stock, but Rapid pays dividends, so Smart is uncertain about the effect on the value of the options. Smart uses a two-period binomial model to value long positions in the Rapid Repair call and put options without accounting for the fact that Rapid Repair pays dividends.<\/p><\/div><\/details><div class=\"qtext\"><p>When Smart failed to account for Rapid Repair dividends, did he likely overvalue the calls or the puts?<\/p><\/div>","subj":"derivatives"},{"n":73,"q":"The value of REIT M based on its P/AFFO multiple is closest to:","opts":["$19.27.","$46.85","$70.91"],"ans":"A","expl":"AFFO = FFO – non-cash rent – recurring maintenance-type capex = 182,200 – 45,000 – 81,000 = $56,200 = 182,200 – 45,000 – 81,000 = $56,200 AFFO per share = $56,200 / 35,000 = $1.606 Applying the multiple: Value per share = $1.606 × 12 = $19.27 (Module 33.2, LOS 33.i)","explhtml":"<p>AFFO = FFO – non-cash rent – recurring maintenance-type capex = 182,200 – 45,000 – 81,000 = $56,200 = 182,200 – 45,000 – 81,000 = $56,200 AFFO per share = $56,200 / 35,000 = $1.606 Applying the multiple: Value per share = $1.606 × 12 = $19.27 (Module 33.2, LOS 33.i)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Rita Larson, CFA, is an investment analyst for the Siprah family office. Larson is tasked with evaluating two REITs currently being considered for investment. Exhibit 1 provides selected information for these REITs.<\/p><p>Exhibit 1: Selected REIT Information(in $ thousands, except number of shares outstanding)<\/p><div class=\"tbl\"><table><tr><td>REIT M<\/td><td>REIT N<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Forecast Cash NOI<\/td><td>$<\/td><td>333.00<\/td><td>$<\/td><td>288.00<\/td><\/tr><tr><td>FFO<\/td><td>$<\/td><td>182.20<\/td><td>$<\/td><td>179.00<\/td><\/tr><tr><td>Cash &amp; Equivalents<\/td><td>$<\/td><td>14.09<\/td><td>$<\/td><td>15.91<\/td><\/tr><tr><td>Accounts Receivable<\/td><td>$<\/td><td>25.22<\/td><td>$<\/td><td>33.44<\/td><\/tr><tr><td>Debt<\/td><td>$<\/td><td>118.92<\/td><td>$<\/td><td>182.34<\/td><\/tr><tr><td>Other Liabilities<\/td><td>$<\/td><td>11.23<\/td><td>$<\/td><td>9.90<\/td><\/tr><tr><td>Recurring maintenance type-capital expenditures<\/td><td>$<\/td><td>81.00<\/td><td>$<\/td><td>32.00<\/td><\/tr><tr><td>Non-cash rents<\/td><td>$<\/td><td>45.00<\/td><td>$<\/td><td>33.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>35,000<\/td><td>25,000<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Larson has determined that similar REITs are trading at a P/FFO multiple of 9 and a P/AFFO multiple of 12. Furthermore, Larson has determined the appropriate cap rate to be 8%.<\/p><p>Larson&#x27;s colleague Peter Mullins makes the following statements about the use of multiples in REIT valuation:<\/p><p>Statement 1: Valuing REITs using multiples is considered relative valuation, while the NAVPS approach would be viewed as an absolute valuation.<\/p><p>Statement 2: Compared to AFFO, FFO is considered a better indicator of the dividend paying ability of a REIT. However, AFFO is a better indicator of a REIT&#x27;s economic income.<\/p><p>Statement 3: It is important to consider leverage differences between REITs while using multiples based on FFO, while AFFO based multiples adjusts for leverage differences.<\/p><p>Statement 4: REITs are more tax efficient than both REOCs and direct investments in real estate<\/p><\/div><\/details><div class=\"qtext\"><p>The value of REIT M based on its P/AFFO multiple is closest to:<\/p><\/div>","subj":"alternatives"},{"n":74,"q":"The value of REIT N based on NAVPS is closest to:","opts":["$138.28.","$149.72.","$152.87."],"ans":"A","expl":"RE = Cash NOI/0.08 | $ 3,600.00\n(+) Cash & Equivalents | $ 15.91\n(+) Accounts Receivable | $ 33.44\n(-) Debt | $ 182.34\n(-) Other Liabilities | $ 9.90\nNAV | $ 3,457.11\n÷ Shares | 25.00\nNAVPS | $138.28\n(Module 33.2, LOS 33.i)","explhtml":"<div class=\"tbl\"><table><tr><td>RE = Cash NOI/0.08<\/td><td>$ 3,600.00<\/td><\/tr><tr><td>(+) Cash &amp; Equivalents<\/td><td>$ 15.91<\/td><\/tr><tr><td>(+) Accounts Receivable<\/td><td>$ 33.44<\/td><\/tr><tr><td>(-) Debt<\/td><td>$ 182.34<\/td><\/tr><tr><td>(-) Other Liabilities<\/td><td>$ 9.90<\/td><\/tr><tr><td>NAV<\/td><td>$ 3,457.11<\/td><\/tr><tr><td>÷ Shares<\/td><td>25.00<\/td><\/tr><tr><td>NAVPS<\/td><td>$138.28<\/td><\/tr><\/table><\/div><p>(Module 33.2, LOS 33.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rita Larson, CFA, is an investment analyst for the Siprah family office. Larson is tasked with evaluating two REITs currently being considered for investment. Exhibit 1 provides selected information for these REITs.<\/p><p>Exhibit 1: Selected REIT Information(in $ thousands, except number of shares outstanding)<\/p><div class=\"tbl\"><table><tr><td>REIT M<\/td><td>REIT N<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Forecast Cash NOI<\/td><td>$<\/td><td>333.00<\/td><td>$<\/td><td>288.00<\/td><\/tr><tr><td>FFO<\/td><td>$<\/td><td>182.20<\/td><td>$<\/td><td>179.00<\/td><\/tr><tr><td>Cash &amp; Equivalents<\/td><td>$<\/td><td>14.09<\/td><td>$<\/td><td>15.91<\/td><\/tr><tr><td>Accounts Receivable<\/td><td>$<\/td><td>25.22<\/td><td>$<\/td><td>33.44<\/td><\/tr><tr><td>Debt<\/td><td>$<\/td><td>118.92<\/td><td>$<\/td><td>182.34<\/td><\/tr><tr><td>Other Liabilities<\/td><td>$<\/td><td>11.23<\/td><td>$<\/td><td>9.90<\/td><\/tr><tr><td>Recurring maintenance type-capital expenditures<\/td><td>$<\/td><td>81.00<\/td><td>$<\/td><td>32.00<\/td><\/tr><tr><td>Non-cash rents<\/td><td>$<\/td><td>45.00<\/td><td>$<\/td><td>33.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>35,000<\/td><td>25,000<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Larson has determined that similar REITs are trading at a P/FFO multiple of 9 and a P/AFFO multiple of 12. Furthermore, Larson has determined the appropriate cap rate to be 8%.<\/p><p>Larson&#x27;s colleague Peter Mullins makes the following statements about the use of multiples in REIT valuation:<\/p><p>Statement 1: Valuing REITs using multiples is considered relative valuation, while the NAVPS approach would be viewed as an absolute valuation.<\/p><p>Statement 2: Compared to AFFO, FFO is considered a better indicator of the dividend paying ability of a REIT. However, AFFO is a better indicator of a REIT&#x27;s economic income.<\/p><p>Statement 3: It is important to consider leverage differences between REITs while using multiples based on FFO, while AFFO based multiples adjusts for leverage differences.<\/p><p>Statement 4: REITs are more tax efficient than both REOCs and direct investments in real estate<\/p><\/div><\/details><div class=\"qtext\"><p>The value of REIT N based on NAVPS is closest to:<\/p><\/div>","subj":"alternatives"},{"n":75,"q":"Regarding Mullin's Statements 1 and 2:","opts":["Only Statement 1 is correct.","Only Statement 2 is correct.","Both Statements are incorrect."],"ans":"A","expl":"Statement 1 is correct. Relative valuation techniques (such as employing multiples) assess fair value by comparing an asset to similar assets, while absolute valuation approaches (such as NAVPS) seek to determine the intrinsic value of an asset independent of its current market price. Statement 2 is incorrect. AFFO is considered to be a better indicator of dividend paying ability of the REIT, because it adjusts for a REIT's holdings required maintenance expenditures.\n(Module 33.2, LOS 33.h)","explhtml":"<p>Statement 1 is correct. Relative valuation techniques (such as employing multiples) assess fair value by comparing an asset to similar assets, while absolute valuation approaches (such as NAVPS) seek to determine the intrinsic value of an asset independent of its current market price. Statement 2 is incorrect. AFFO is considered to be a better indicator of dividend paying ability of the REIT, because it adjusts for a REIT&#x27;s holdings required maintenance expenditures.<\/p><p>(Module 33.2, LOS 33.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rita Larson, CFA, is an investment analyst for the Siprah family office. Larson is tasked with evaluating two REITs currently being considered for investment. Exhibit 1 provides selected information for these REITs.<\/p><p>Exhibit 1: Selected REIT Information(in $ thousands, except number of shares outstanding)<\/p><div class=\"tbl\"><table><tr><td>REIT M<\/td><td>REIT N<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Forecast Cash NOI<\/td><td>$<\/td><td>333.00<\/td><td>$<\/td><td>288.00<\/td><\/tr><tr><td>FFO<\/td><td>$<\/td><td>182.20<\/td><td>$<\/td><td>179.00<\/td><\/tr><tr><td>Cash &amp; Equivalents<\/td><td>$<\/td><td>14.09<\/td><td>$<\/td><td>15.91<\/td><\/tr><tr><td>Accounts Receivable<\/td><td>$<\/td><td>25.22<\/td><td>$<\/td><td>33.44<\/td><\/tr><tr><td>Debt<\/td><td>$<\/td><td>118.92<\/td><td>$<\/td><td>182.34<\/td><\/tr><tr><td>Other Liabilities<\/td><td>$<\/td><td>11.23<\/td><td>$<\/td><td>9.90<\/td><\/tr><tr><td>Recurring maintenance type-capital expenditures<\/td><td>$<\/td><td>81.00<\/td><td>$<\/td><td>32.00<\/td><\/tr><tr><td>Non-cash rents<\/td><td>$<\/td><td>45.00<\/td><td>$<\/td><td>33.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>35,000<\/td><td>25,000<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Larson has determined that similar REITs are trading at a P/FFO multiple of 9 and a P/AFFO multiple of 12. Furthermore, Larson has determined the appropriate cap rate to be 8%.<\/p><p>Larson&#x27;s colleague Peter Mullins makes the following statements about the use of multiples in REIT valuation:<\/p><p>Statement 1: Valuing REITs using multiples is considered relative valuation, while the NAVPS approach would be viewed as an absolute valuation.<\/p><p>Statement 2: Compared to AFFO, FFO is considered a better indicator of the dividend paying ability of a REIT. However, AFFO is a better indicator of a REIT&#x27;s economic income.<\/p><p>Statement 3: It is important to consider leverage differences between REITs while using multiples based on FFO, while AFFO based multiples adjusts for leverage differences.<\/p><p>Statement 4: REITs are more tax efficient than both REOCs and direct investments in real estate<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Mullin&#x27;s Statements 1 and 2:<\/p><\/div>","subj":"alternatives"},{"n":76,"q":"Regarding Mullin's Statements 3 and 4:","opts":["Only Statement 3 is correct.","Only Statement 4 is correct.","Both statements are incorrect."],"ans":"C","expl":"Both statements are incorrect. Both FFO and AFFO start with net income (a post-interest-expense metric), and hence leverage differences between REITs need to be accounted for when using both FFO and AFFO. While REITs are more tax efficient than REOCs are, direct investment in real estate can be more tax efficient than REITs by allowing setoff of real-estate related losses against other income.\n(Module 33.2, LOS 33.j), (Module 33.2, LOS 33.h)","explhtml":"<p>Both statements are incorrect. Both FFO and AFFO start with net income (a post-interest-expense metric), and hence leverage differences between REITs need to be accounted for when using both FFO and AFFO. While REITs are more tax efficient than REOCs are, direct investment in real estate can be more tax efficient than REITs by allowing setoff of real-estate related losses against other income.<\/p><p>(Module 33.2, LOS 33.j), (Module 33.2, LOS 33.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rita Larson, CFA, is an investment analyst for the Siprah family office. Larson is tasked with evaluating two REITs currently being considered for investment. Exhibit 1 provides selected information for these REITs.<\/p><p>Exhibit 1: Selected REIT Information(in $ thousands, except number of shares outstanding)<\/p><div class=\"tbl\"><table><tr><td>REIT M<\/td><td>REIT N<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Forecast Cash NOI<\/td><td>$<\/td><td>333.00<\/td><td>$<\/td><td>288.00<\/td><\/tr><tr><td>FFO<\/td><td>$<\/td><td>182.20<\/td><td>$<\/td><td>179.00<\/td><\/tr><tr><td>Cash &amp; Equivalents<\/td><td>$<\/td><td>14.09<\/td><td>$<\/td><td>15.91<\/td><\/tr><tr><td>Accounts Receivable<\/td><td>$<\/td><td>25.22<\/td><td>$<\/td><td>33.44<\/td><\/tr><tr><td>Debt<\/td><td>$<\/td><td>118.92<\/td><td>$<\/td><td>182.34<\/td><\/tr><tr><td>Other Liabilities<\/td><td>$<\/td><td>11.23<\/td><td>$<\/td><td>9.90<\/td><\/tr><tr><td>Recurring maintenance type-capital expenditures<\/td><td>$<\/td><td>81.00<\/td><td>$<\/td><td>32.00<\/td><\/tr><tr><td>Non-cash rents<\/td><td>$<\/td><td>45.00<\/td><td>$<\/td><td>33.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>35,000<\/td><td>25,000<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Larson has determined that similar REITs are trading at a P/FFO multiple of 9 and a P/AFFO multiple of 12. Furthermore, Larson has determined the appropriate cap rate to be 8%.<\/p><p>Larson&#x27;s colleague Peter Mullins makes the following statements about the use of multiples in REIT valuation:<\/p><p>Statement 1: Valuing REITs using multiples is considered relative valuation, while the NAVPS approach would be viewed as an absolute valuation.<\/p><p>Statement 2: Compared to AFFO, FFO is considered a better indicator of the dividend paying ability of a REIT. However, AFFO is a better indicator of a REIT&#x27;s economic income.<\/p><p>Statement 3: It is important to consider leverage differences between REITs while using multiples based on FFO, while AFFO based multiples adjusts for leverage differences.<\/p><p>Statement 4: REITs are more tax efficient than both REOCs and direct investments in real estate<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Mullin&#x27;s Statements 3 and 4:<\/p><\/div>","subj":"alternatives"},{"n":77,"q":"Considering Gomez's Statements 1 and 2:","opts":["only Statement 1 is accurate.","only Statement 2 is accurate.","both statements are accurate."],"ans":"B","expl":"ETFs trade on both primary and secondary markets. Primary market trades occur between authorized participants and an ETF sponsor or manager. The ETF manager discloses a list of securities on a daily basis as part of the creation basket.\n(Module 35.1, LOS 35.a)","explhtml":"<p>ETFs trade on both primary and secondary markets. Primary market trades occur between authorized participants and an ETF sponsor or manager. The ETF manager discloses a list of securities on a daily basis as part of the creation basket.<\/p><p>(Module 35.1, LOS 35.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Seva Wolff has just inherited $1.2 million. She meets with Roberta Gomez, her financial advisor, about changes to her investment policy statement—and hence, her portfolio—due to this major life event.<\/p><p>Gomez recommends that Wolff consider exchange-traded funds (ETFs) for her portfolio and suggests that she can compile a list of ETFs suitable for Wolff.<\/p><p>Wolff is uncertain about this class of investment product and asks several questions. In her response, Gomez makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>ETFs represent shares in a portfolio. The fund manager must disclose the holdings on an annual basis.<\/td><\/tr><tr><td>Statement 2:<\/td><td>ETFs trade on both primary and secondary markets.<\/td><\/tr><tr><td>Statement 3:<\/td><td>Market makers known as authorized participants keep ETF prices in line with a fund&#x27;s NAV per share through a process known as creation/redemption. The costs of creation/redemption are borne by all of the fund&#x27;s shareholders.<\/td><\/tr><tr><td>Statement 4:<\/td><td>Relative to traditional mutual funds, ETFs tend to distribute less in capital gains to their shareholders.<\/td><\/tr><\/table><\/div><p>Gomez then mentions that Wolff should consider other asset classes that form part of a well-diversified portfolio. She says the expected return on an asset is affected by the investor&#x27;s intertemporal rate of substitution. She makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 5:<\/td><td>Typically, the covariance between a risk-averse investor&#x27;s intertemporal rate of substitution and the current asset price is negative.<\/td><\/tr><tr><td>Statement 6:<\/td><td>An investor&#x27;s breakeven inflation rate is the expected future inflation minus the risk premium for future inflation.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Considering Gomez&#x27;s Statements 1 and 2:<\/p><\/div>","subj":"portfolio"},{"n":78,"q":"Considering Gomez's Statements 3 and 4:","opts":["only Statement 3 is accurate.","only Statement 4 is accurate.","neither statement is accurate."],"ans":"B","expl":"Authorized participants pass on the creation/redemption costs in the form of bid-ask spreads, which means that only transacting shareholders pay these costs, unlike with mutual funds where all shareholders bear this cost. Similarly, unlike mutual funds, ETFs are tax fair because redemptions are in-kind and do not affect the nontransacting shareholders; hence, capital gains distributions tend to be lower for ETFs compared to traditional mutual funds.\n(Module 35.1, LOS 35.a)","explhtml":"<p>Authorized participants pass on the creation/redemption costs in the form of bid-ask spreads, which means that only transacting shareholders pay these costs, unlike with mutual funds where all shareholders bear this cost. Similarly, unlike mutual funds, ETFs are tax fair because redemptions are in-kind and do not affect the nontransacting shareholders; hence, capital gains distributions tend to be lower for ETFs compared to traditional mutual funds.<\/p><p>(Module 35.1, LOS 35.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Seva Wolff has just inherited $1.2 million. She meets with Roberta Gomez, her financial advisor, about changes to her investment policy statement—and hence, her portfolio—due to this major life event.<\/p><p>Gomez recommends that Wolff consider exchange-traded funds (ETFs) for her portfolio and suggests that she can compile a list of ETFs suitable for Wolff.<\/p><p>Wolff is uncertain about this class of investment product and asks several questions. In her response, Gomez makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>ETFs represent shares in a portfolio. The fund manager must disclose the holdings on an annual basis.<\/td><\/tr><tr><td>Statement 2:<\/td><td>ETFs trade on both primary and secondary markets.<\/td><\/tr><tr><td>Statement 3:<\/td><td>Market makers known as authorized participants keep ETF prices in line with a fund&#x27;s NAV per share through a process known as creation/redemption. The costs of creation/redemption are borne by all of the fund&#x27;s shareholders.<\/td><\/tr><tr><td>Statement 4:<\/td><td>Relative to traditional mutual funds, ETFs tend to distribute less in capital gains to their shareholders.<\/td><\/tr><\/table><\/div><p>Gomez then mentions that Wolff should consider other asset classes that form part of a well-diversified portfolio. She says the expected return on an asset is affected by the investor&#x27;s intertemporal rate of substitution. She makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 5:<\/td><td>Typically, the covariance between a risk-averse investor&#x27;s intertemporal rate of substitution and the current asset price is negative.<\/td><\/tr><tr><td>Statement 6:<\/td><td>An investor&#x27;s breakeven inflation rate is the expected future inflation minus the risk premium for future inflation.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Considering Gomez&#x27;s Statements 3 and 4:<\/p><\/div>","subj":"portfolio"},{"n":79,"q":"Gomez's Statement 5 is best described as:","opts":["correct.","incorrect about the covariance between the intertemporal rate of substitution and the current asset price.","incorrect about covariance being a factor in the pricing of securities."],"ans":"B","expl":"The covariance between a risk-averse investor's intertemporal rate of substitution and expected future price is negative.\n(Module 39.1, LOS 39.c)","explhtml":"<p>The covariance between a risk-averse investor&#x27;s intertemporal rate of substitution and expected future price is negative.<\/p><p>(Module 39.1, LOS 39.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Seva Wolff has just inherited $1.2 million. She meets with Roberta Gomez, her financial advisor, about changes to her investment policy statement—and hence, her portfolio—due to this major life event.<\/p><p>Gomez recommends that Wolff consider exchange-traded funds (ETFs) for her portfolio and suggests that she can compile a list of ETFs suitable for Wolff.<\/p><p>Wolff is uncertain about this class of investment product and asks several questions. In her response, Gomez makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>ETFs represent shares in a portfolio. The fund manager must disclose the holdings on an annual basis.<\/td><\/tr><tr><td>Statement 2:<\/td><td>ETFs trade on both primary and secondary markets.<\/td><\/tr><tr><td>Statement 3:<\/td><td>Market makers known as authorized participants keep ETF prices in line with a fund&#x27;s NAV per share through a process known as creation/redemption. The costs of creation/redemption are borne by all of the fund&#x27;s shareholders.<\/td><\/tr><tr><td>Statement 4:<\/td><td>Relative to traditional mutual funds, ETFs tend to distribute less in capital gains to their shareholders.<\/td><\/tr><\/table><\/div><p>Gomez then mentions that Wolff should consider other asset classes that form part of a well-diversified portfolio. She says the expected return on an asset is affected by the investor&#x27;s intertemporal rate of substitution. She makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 5:<\/td><td>Typically, the covariance between a risk-averse investor&#x27;s intertemporal rate of substitution and the current asset price is negative.<\/td><\/tr><tr><td>Statement 6:<\/td><td>An investor&#x27;s breakeven inflation rate is the expected future inflation minus the risk premium for future inflation.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Gomez&#x27;s Statement 5 is best described as:<\/p><\/div>","subj":"portfolio"},{"n":80,"q":"Gomez's Statement 6 is best described as:","opts":["correct.","incorrect, because breakeven inflation is equal to expected inflation plus a risk premium for inflation uncertainty.","incorrect, because breakeven inflation is equal to expected inflation minus actual inflation."],"ans":"B","expl":"The breakeven inflation rate equals expected inflation plus a risk premium for inflation uncertainty.\n(Module 39.1, LOS 39.e)","explhtml":"<p>The breakeven inflation rate equals expected inflation plus a risk premium for inflation uncertainty.<\/p><p>(Module 39.1, LOS 39.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Seva Wolff has just inherited $1.2 million. She meets with Roberta Gomez, her financial advisor, about changes to her investment policy statement—and hence, her portfolio—due to this major life event.<\/p><p>Gomez recommends that Wolff consider exchange-traded funds (ETFs) for her portfolio and suggests that she can compile a list of ETFs suitable for Wolff.<\/p><p>Wolff is uncertain about this class of investment product and asks several questions. In her response, Gomez makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>ETFs represent shares in a portfolio. The fund manager must disclose the holdings on an annual basis.<\/td><\/tr><tr><td>Statement 2:<\/td><td>ETFs trade on both primary and secondary markets.<\/td><\/tr><tr><td>Statement 3:<\/td><td>Market makers known as authorized participants keep ETF prices in line with a fund&#x27;s NAV per share through a process known as creation/redemption. The costs of creation/redemption are borne by all of the fund&#x27;s shareholders.<\/td><\/tr><tr><td>Statement 4:<\/td><td>Relative to traditional mutual funds, ETFs tend to distribute less in capital gains to their shareholders.<\/td><\/tr><\/table><\/div><p>Gomez then mentions that Wolff should consider other asset classes that form part of a well-diversified portfolio. She says the expected return on an asset is affected by the investor&#x27;s intertemporal rate of substitution. She makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 5:<\/td><td>Typically, the covariance between a risk-averse investor&#x27;s intertemporal rate of substitution and the current asset price is negative.<\/td><\/tr><tr><td>Statement 6:<\/td><td>An investor&#x27;s breakeven inflation rate is the expected future inflation minus the risk premium for future inflation.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Gomez&#x27;s Statement 6 is best described as:<\/p><\/div>","subj":"portfolio"},{"n":81,"q":"According to the CFA Institute Standards of Professional Conduct, the trading arrangement between Burton and Security Bank is most likely:","opts":["a violation because the practice of directed brokerage violates the member’s duty of loyalty to the client.","a violation because although Security Bank’s execution is competitive, Burton will not be able to always obtain the best execution for his client.","not a violation because the brokerage is the property of the client."],"ans":"C","expl":"According to CFA Institute Standards of Professional Conduct, client brokerage is the property of the client; client-directed brokerage does not violate the duty of loyalty to clients. Members should disclose to the clients if such arrangements does not result in best execution for the clients (but this stipulation is not applicable in this case).\n(Module 42.4, LOS 42.a)","explhtml":"<p>According to CFA Institute Standards of Professional Conduct, client brokerage is the property of the client; client-directed brokerage does not violate the duty of loyalty to clients. Members should disclose to the clients if such arrangements does not result in best execution for the clients (but this stipulation is not applicable in this case).<\/p><p>(Module 42.4, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Connor Burton, CFA, is the managing partner for United Partners, a small investment advisory firm that employs three investment professionals and currently has approximately $250 million of assets under management. The client base of United Partners is varied, and accounts range in size from small retirement accounts to a $30 million private school endowment. In addition to Burton&#x27;s administrative responsibilities as the managing partner at United, he also serves as an investment advisor to several clients. Because United Partners is a small firm, the company does not employ any research analysts but instead obtains its investment research products and services from two national brokerage firms, which in turn execute all client trades for United Partners. The arrangement with the two brokers has enabled United to assure its clients that the firm will always seek the best execution for them by having both brokers competitively bid for United&#x27;s business.<\/p><p>A prospective client, Harold Crossley, has approached Burton about shifting some of his personal assets under management from MoneyCorp to United Partners.<\/p><p>As a condition of moving his account to United Partners, Crossley insists that all of his trades be executed through his brother-in-law, a broker for Security Bank. Security Bank is a large, New York-based broker/dealer but is not one of the two brokerage firms with which United currently does business. Burton contacts Crossley&#x27;s brother-in-law and determines that Security Bank&#x27;s trade execution is competitive, but Crossley&#x27;s account alone would not generate enough volume to warrant any soft dollar arrangement for research materials. However, Crossley&#x27;s brother-in-law does offer for Security Bank to pay a referral fee to Burton for directing any of United&#x27;s clients to Security Bank&#x27;s retail banking division. To bring Crossley on as a client, Burton agrees to the arrangement. Going forward, Burton will use Security Bank to execute all of Crossley&#x27;s trades.<\/p><p>United Partners currently has no formal policy on proxy voting. Burton wants to develop a policy that conforms to the Code and Standards.<\/p><p>Several months later, Burton is invited to a road show for an initial public offering (IPO) for SolutionWare, a software company. Security Bank is serving as lead underwriter on SolutionWare&#x27;s IPO. Burton attends the meeting, which is led by two investment bankers and one software industry research analyst from Security Bank who covers SolutionWare. Burton notes that the bankers from Security Bank have included detailed financial statements for SolutionWare in the offering prospectus and also disclosed that Security Bank provides a warehouse line of credit to SolutionWare. After the meeting, Burton calls Crossley to recommend the purchase of SolutionWare equity. Crossley heeds Burton&#x27;s advice and tells him to purchase 5,000 shares.<\/p><\/div><\/details><div class=\"qtext\"><p>According to the CFA Institute Standards of Professional Conduct, the trading arrangement between Burton and Security Bank is most likely:<\/p><\/div>","subj":"ethics"},{"n":82,"q":"According to CFA Institute Standards of Professional Conduct, which of the following statements best describes the circumstances under which Burton may enter into the referral agreement with Security Bank? Burton may enter into the agreement:","opts":["under no circumstances.","only after receiving written permission from clients.","only after fully disclosing the referral arrangement to clients and prospective clients."],"ans":"C","expl":"Standard VI(C) Referral Fees states that members and candidates must disclose to their clients and prospective clients any compensation or benefit received for the recommendation of services. In this case, Burton may accept a referral fee if he discloses it to the client so that the client may evaluate any partiality shown in the recommendation.\n(Module 42.9, LOS 42.a)","explhtml":"<p>Standard VI(C) Referral Fees states that members and candidates must disclose to their clients and prospective clients any compensation or benefit received for the recommendation of services. In this case, Burton may accept a referral fee if he discloses it to the client so that the client may evaluate any partiality shown in the recommendation.<\/p><p>(Module 42.9, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Connor Burton, CFA, is the managing partner for United Partners, a small investment advisory firm that employs three investment professionals and currently has approximately $250 million of assets under management. The client base of United Partners is varied, and accounts range in size from small retirement accounts to a $30 million private school endowment. In addition to Burton&#x27;s administrative responsibilities as the managing partner at United, he also serves as an investment advisor to several clients. Because United Partners is a small firm, the company does not employ any research analysts but instead obtains its investment research products and services from two national brokerage firms, which in turn execute all client trades for United Partners. The arrangement with the two brokers has enabled United to assure its clients that the firm will always seek the best execution for them by having both brokers competitively bid for United&#x27;s business.<\/p><p>A prospective client, Harold Crossley, has approached Burton about shifting some of his personal assets under management from MoneyCorp to United Partners.<\/p><p>As a condition of moving his account to United Partners, Crossley insists that all of his trades be executed through his brother-in-law, a broker for Security Bank. Security Bank is a large, New York-based broker/dealer but is not one of the two brokerage firms with which United currently does business. Burton contacts Crossley&#x27;s brother-in-law and determines that Security Bank&#x27;s trade execution is competitive, but Crossley&#x27;s account alone would not generate enough volume to warrant any soft dollar arrangement for research materials. However, Crossley&#x27;s brother-in-law does offer for Security Bank to pay a referral fee to Burton for directing any of United&#x27;s clients to Security Bank&#x27;s retail banking division. To bring Crossley on as a client, Burton agrees to the arrangement. Going forward, Burton will use Security Bank to execute all of Crossley&#x27;s trades.<\/p><p>United Partners currently has no formal policy on proxy voting. Burton wants to develop a policy that conforms to the Code and Standards.<\/p><p>Several months later, Burton is invited to a road show for an initial public offering (IPO) for SolutionWare, a software company. Security Bank is serving as lead underwriter on SolutionWare&#x27;s IPO. Burton attends the meeting, which is led by two investment bankers and one software industry research analyst from Security Bank who covers SolutionWare. Burton notes that the bankers from Security Bank have included detailed financial statements for SolutionWare in the offering prospectus and also disclosed that Security Bank provides a warehouse line of credit to SolutionWare. After the meeting, Burton calls Crossley to recommend the purchase of SolutionWare equity. Crossley heeds Burton&#x27;s advice and tells him to purchase 5,000 shares.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, which of the following statements best describes the circumstances under which Burton may enter into the referral agreement with Security Bank? Burton may enter into the agreement:<\/p><\/div>","subj":"ethics"},{"n":83,"q":"When formulating the proxy voting policy, which of the following is least appropriate for Burton to include?","opts":["Determine the economic impact of non-routine proxy votes.","Treat all proposals equally as far as proxy voting goes.","If the client preference differs from the proxy voter's preference, defer to client wishes."],"ans":"B","expl":"Standard III(A) Loyalty, Prudence, and Care. Unusual proposals, such as hostile takeovers and executive changes, may require more review than routine matters such as renewing stock-repurchase agreements. Money managers should provide a means to review complex proxies. Establishing evaluation criteria and disclosing the firm's proxy voting policies and procedures to clients are basic elements of a proxy-voting policy. Client wishes regarding proxy voting should always be followed.\n(Module 42.4, LOS 42.a)","explhtml":"<p>Standard III(A) Loyalty, Prudence, and Care. Unusual proposals, such as hostile takeovers and executive changes, may require more review than routine matters such as renewing stock-repurchase agreements. Money managers should provide a means to review complex proxies. Establishing evaluation criteria and disclosing the firm&#x27;s proxy voting policies and procedures to clients are basic elements of a proxy-voting policy. Client wishes regarding proxy voting should always be followed.<\/p><p>(Module 42.4, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Connor Burton, CFA, is the managing partner for United Partners, a small investment advisory firm that employs three investment professionals and currently has approximately $250 million of assets under management. The client base of United Partners is varied, and accounts range in size from small retirement accounts to a $30 million private school endowment. In addition to Burton&#x27;s administrative responsibilities as the managing partner at United, he also serves as an investment advisor to several clients. Because United Partners is a small firm, the company does not employ any research analysts but instead obtains its investment research products and services from two national brokerage firms, which in turn execute all client trades for United Partners. The arrangement with the two brokers has enabled United to assure its clients that the firm will always seek the best execution for them by having both brokers competitively bid for United&#x27;s business.<\/p><p>A prospective client, Harold Crossley, has approached Burton about shifting some of his personal assets under management from MoneyCorp to United Partners.<\/p><p>As a condition of moving his account to United Partners, Crossley insists that all of his trades be executed through his brother-in-law, a broker for Security Bank. Security Bank is a large, New York-based broker/dealer but is not one of the two brokerage firms with which United currently does business. Burton contacts Crossley&#x27;s brother-in-law and determines that Security Bank&#x27;s trade execution is competitive, but Crossley&#x27;s account alone would not generate enough volume to warrant any soft dollar arrangement for research materials. However, Crossley&#x27;s brother-in-law does offer for Security Bank to pay a referral fee to Burton for directing any of United&#x27;s clients to Security Bank&#x27;s retail banking division. To bring Crossley on as a client, Burton agrees to the arrangement. Going forward, Burton will use Security Bank to execute all of Crossley&#x27;s trades.<\/p><p>United Partners currently has no formal policy on proxy voting. Burton wants to develop a policy that conforms to the Code and Standards.<\/p><p>Several months later, Burton is invited to a road show for an initial public offering (IPO) for SolutionWare, a software company. Security Bank is serving as lead underwriter on SolutionWare&#x27;s IPO. Burton attends the meeting, which is led by two investment bankers and one software industry research analyst from Security Bank who covers SolutionWare. Burton notes that the bankers from Security Bank have included detailed financial statements for SolutionWare in the offering prospectus and also disclosed that Security Bank provides a warehouse line of credit to SolutionWare. After the meeting, Burton calls Crossley to recommend the purchase of SolutionWare equity. Crossley heeds Burton&#x27;s advice and tells him to purchase 5,000 shares.<\/p><\/div><\/details><div class=\"qtext\"><p>When formulating the proxy voting policy, which of the following is least appropriate for Burton to include?<\/p><\/div>","subj":"ethics"},{"n":84,"q":"According to CFA Institute Standards of Professional Conduct, Burton's recommendation to Crossley that he purchase shares of the SolutionWare initial public offering is most likely:","opts":["in violation of Standard III(C) Suitability for not determining the appropriateness of the investment for the portfolio and Standard I(B) Independence and Objectivity for not making the investment recommendation to all of his clients at the same time.","in violation of Standard V(A) Diligence and Reasonable Basis for not thoroughly analyzing the investment before making a recommendation and in violation of Standard III(C) Suitability for not determining the appropriateness of the investment for the portfolio.","in violation of Standard V(A) Diligence and Reasonable Basis for not thoroughly analyzing the investment before making a recommendation and in violation of Standard I(B) Independence and Objectivity for not making the investment recommendation to all of his clients at the same time."],"ans":"B","expl":"Standard V(A) Diligence and Reasonable Basis states that the member or candidate must exercise diligence, independence, and thoroughness before making an investment recommendation. The Standard also requires that members and candidates have a reasonable and adequate basis supported by research and investigation for any investment recommendations or actions. Burton made his purchase recommendation to Crossley purely on the basis of the Security Bank road show and did not perform his own evaluation to determine whether or not the SolutionWare IPO was a good investment opportunity. Burton has therefore violated Standard V(A). Standard III(C) Suitability was also violated because there is no indication that Burton made any effort to determine if the investment was appropriate for Crossley's portfolio. Burton should have determined that the investment was consistent with Crossley's written objectives and constraints before he recommended the investment. Standard III(B) Fair Dealing (and not Standard I(B) Independence and Objectivity) would also be violated if Burton did not afford all the clients for whom the IPO was suitable to participate in the offering. Standard III(B) Fair Dealing (and not Standard I(B)) would also be violated if Burton did not extend IPO participation to all portfolios meeting suitability criteria.\n(Module 42.8, LOS 42.a)","explhtml":"<p>Standard V(A) Diligence and Reasonable Basis states that the member or candidate must exercise diligence, independence, and thoroughness before making an investment recommendation. The Standard also requires that members and candidates have a reasonable and adequate basis supported by research and investigation for any investment recommendations or actions. Burton made his purchase recommendation to Crossley purely on the basis of the Security Bank road show and did not perform his own evaluation to determine whether or not the SolutionWare IPO was a good investment opportunity. Burton has therefore violated Standard V(A). Standard III(C) Suitability was also violated because there is no indication that Burton made any effort to determine if the investment was appropriate for Crossley&#x27;s portfolio. Burton should have determined that the investment was consistent with Crossley&#x27;s written objectives and constraints before he recommended the investment. Standard III(B) Fair Dealing (and not Standard I(B) Independence and Objectivity) would also be violated if Burton did not afford all the clients for whom the IPO was suitable to participate in the offering. Standard III(B) Fair Dealing (and not Standard I(B)) would also be violated if Burton did not extend IPO participation to all portfolios meeting suitability criteria.<\/p><p>(Module 42.8, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Connor Burton, CFA, is the managing partner for United Partners, a small investment advisory firm that employs three investment professionals and currently has approximately $250 million of assets under management. The client base of United Partners is varied, and accounts range in size from small retirement accounts to a $30 million private school endowment. In addition to Burton&#x27;s administrative responsibilities as the managing partner at United, he also serves as an investment advisor to several clients. Because United Partners is a small firm, the company does not employ any research analysts but instead obtains its investment research products and services from two national brokerage firms, which in turn execute all client trades for United Partners. The arrangement with the two brokers has enabled United to assure its clients that the firm will always seek the best execution for them by having both brokers competitively bid for United&#x27;s business.<\/p><p>A prospective client, Harold Crossley, has approached Burton about shifting some of his personal assets under management from MoneyCorp to United Partners.<\/p><p>As a condition of moving his account to United Partners, Crossley insists that all of his trades be executed through his brother-in-law, a broker for Security Bank. Security Bank is a large, New York-based broker/dealer but is not one of the two brokerage firms with which United currently does business. Burton contacts Crossley&#x27;s brother-in-law and determines that Security Bank&#x27;s trade execution is competitive, but Crossley&#x27;s account alone would not generate enough volume to warrant any soft dollar arrangement for research materials. However, Crossley&#x27;s brother-in-law does offer for Security Bank to pay a referral fee to Burton for directing any of United&#x27;s clients to Security Bank&#x27;s retail banking division. To bring Crossley on as a client, Burton agrees to the arrangement. Going forward, Burton will use Security Bank to execute all of Crossley&#x27;s trades.<\/p><p>United Partners currently has no formal policy on proxy voting. Burton wants to develop a policy that conforms to the Code and Standards.<\/p><p>Several months later, Burton is invited to a road show for an initial public offering (IPO) for SolutionWare, a software company. Security Bank is serving as lead underwriter on SolutionWare&#x27;s IPO. Burton attends the meeting, which is led by two investment bankers and one software industry research analyst from Security Bank who covers SolutionWare. Burton notes that the bankers from Security Bank have included detailed financial statements for SolutionWare in the offering prospectus and also disclosed that Security Bank provides a warehouse line of credit to SolutionWare. After the meeting, Burton calls Crossley to recommend the purchase of SolutionWare equity. Crossley heeds Burton&#x27;s advice and tells him to purchase 5,000 shares.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, Burton&#x27;s recommendation to Crossley that he purchase shares of the SolutionWare initial public offering is most likely:<\/p><\/div>","subj":"ethics"},{"n":85,"q":"In applying the MDT model exclusively to the accounts of Matematicasa's insurance company clients, and not offering it to Matematicasa's family office customers, does Esposito violate the CFA Institute Code and Standards?","opts":["No.","Yes, because Esposito is obligated to disclose the existence of the model when speaking to high-net worth families","Yes, because the model may be suitable for some non-insurance clients."],"ans":"A","expl":"There is no requirement under Standard III(B): Duties to Clients–Fair Dealing to apply identical investment techniques to different kinds of clients. It is quite possible that the MDT model is not applicable to the needs of Matematicasa's family offices customers, while it is suitable for insurance companies (which are likely to have different risk and liquidity requirements). Standard III(B) requires members and candidates to treat all clients fairly, however each client is likely to have unique needs and objectives. There is no requirement under the Code and Standards to disclose to all clients all of the investment models that a firm uses.\n(Module 43.1, LOS 43.a)","explhtml":"<p>There is no requirement under Standard III(B): Duties to Clients–Fair Dealing to apply identical investment techniques to different kinds of clients. It is quite possible that the MDT model is not applicable to the needs of Matematicasa&#x27;s family offices customers, while it is suitable for insurance companies (which are likely to have different risk and liquidity requirements). Standard III(B) requires members and candidates to treat all clients fairly, however each client is likely to have unique needs and objectives. There is no requirement under the Code and Standards to disclose to all clients all of the investment models that a firm uses.<\/p><p>(Module 43.1, LOS 43.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Matematicasa is a medium-sized asset management firm that uses various machine learning techniques to make investment decisions. Last year, Matematicasa brought Antonio Esposito, CFA, CPA, on-board. Espositio is admired in the investment management industry for his use of machine learning techniques. At Matematicasa, Esposito maintains an existing machine learning model called MDT that selects investments based on a large amount of textual information from various online sources, and recommends an optimal portfolio based on a client&#x27;s selected benchmark. Esposito uses the model exclusively for Matematicasa&#x27;s insurance company clients, but does not offer it to Matematicasa&#x27;s family office customers.<\/p><p>Over the past several months, one of Matematicasa&#x27;s insurance company clients has begun raising concerns about underperformance of their portfolio versus its benchmark. In response, Sofia Rossi, CFA (Esposito&#x27;s supervisor, and Matematicasa&#x27;s head of research) requests that Esposito review the model. Esposito finds that this\\e machine learning model is incorrectly classifying text, resulting in inappropriate investment recommendations.<\/p><p>After discovering the cause of the error, Esposito meets with Rossi to present his findings. Esposito expresses his opinion that Matematicasa should correct the problem immediately. However Rossi disagrees: she requests that Esposito update the model at the end of the quarter during the normal upgrade cycle. Furthermore, Rossi requests that Esposito keep the situation quiet for the time being, and assures Esposito that appropriate disclosures to their senior management and to their clients will be made at the end of the quarter, once they have had the opportunity to fix the model.<\/p><p>After a few more weeks of customer complaints without action from Rossi (who still refuses to disclose the error to customers), Esposito becomes disgruntled with Matematicasa. Esposito agrees to a job interview with Algoritmo A.I. Sgr (AAIS), which is Matematicasa&#x27;s closest competitor. During his interview with AAIS&#x27;s asset management team, Esposito demonstrates a machine learning model called AzionarioStella that Esposito has created in his spare time at home over the past several months of evenings and weekends. Esposito first used historical data to tune and back-test the model, and then put the model to work managing his personal portfolio and then the portfolios of his siblings. The team at Algoritmo is excited by Esposito&#x27;s ideas and his model. The Algoritmo team offers Esposito a position on the spot, and also expresses interest in licensing the AzionarioStella model from him. Esposito accepts and resigns from Matematicasa that same day.<\/p><\/div><\/details><div class=\"qtext\"><p>In applying the MDT model exclusively to the accounts of Matematicasa&#x27;s insurance company clients, and not offering it to Matematicasa&#x27;s family office customers, does Esposito violate the CFA Institute Code and Standards?<\/p><\/div>","subj":"ethics"},{"n":86,"q":"By not fixing the error in the MDT model promptly, did Esposito violate the CFA Institute Code and Standards?","opts":["Yes.","No, because the Code and Standards does not specify a timeframe for fixing errors.","No, because it was Rossi’s responsibility as supervisor to ensure compliance with the Code and Standards."],"ans":"A","expl":"Members and candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgement. By not promptly fixing the error in the model, Esposito is not acting for the benefit of clients, nor is he placing client interests before his employer's and his own interests. Esposito is thus violating Standard III(A): Duties to Clients–Loyalty, Prudence, and Care. While the Code and Standards does not specify a timeframe for fixing errors, the error clearly should have been fixed promptly. While Rossi also has a responsibility as supervisor to ensure that Esposito complies with the Code and Standards, this does not absolve Esposito of his responsibility.\n(Module 43.1, LOS 43.a)","explhtml":"<p>Members and candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgement. By not promptly fixing the error in the model, Esposito is not acting for the benefit of clients, nor is he placing client interests before his employer&#x27;s and his own interests. Esposito is thus violating Standard III(A): Duties to Clients–Loyalty, Prudence, and Care. While the Code and Standards does not specify a timeframe for fixing errors, the error clearly should have been fixed promptly. While Rossi also has a responsibility as supervisor to ensure that Esposito complies with the Code and Standards, this does not absolve Esposito of his responsibility.<\/p><p>(Module 43.1, LOS 43.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Matematicasa is a medium-sized asset management firm that uses various machine learning techniques to make investment decisions. Last year, Matematicasa brought Antonio Esposito, CFA, CPA, on-board. Espositio is admired in the investment management industry for his use of machine learning techniques. At Matematicasa, Esposito maintains an existing machine learning model called MDT that selects investments based on a large amount of textual information from various online sources, and recommends an optimal portfolio based on a client&#x27;s selected benchmark. Esposito uses the model exclusively for Matematicasa&#x27;s insurance company clients, but does not offer it to Matematicasa&#x27;s family office customers.<\/p><p>Over the past several months, one of Matematicasa&#x27;s insurance company clients has begun raising concerns about underperformance of their portfolio versus its benchmark. In response, Sofia Rossi, CFA (Esposito&#x27;s supervisor, and Matematicasa&#x27;s head of research) requests that Esposito review the model. Esposito finds that this\\e machine learning model is incorrectly classifying text, resulting in inappropriate investment recommendations.<\/p><p>After discovering the cause of the error, Esposito meets with Rossi to present his findings. Esposito expresses his opinion that Matematicasa should correct the problem immediately. However Rossi disagrees: she requests that Esposito update the model at the end of the quarter during the normal upgrade cycle. Furthermore, Rossi requests that Esposito keep the situation quiet for the time being, and assures Esposito that appropriate disclosures to their senior management and to their clients will be made at the end of the quarter, once they have had the opportunity to fix the model.<\/p><p>After a few more weeks of customer complaints without action from Rossi (who still refuses to disclose the error to customers), Esposito becomes disgruntled with Matematicasa. Esposito agrees to a job interview with Algoritmo A.I. Sgr (AAIS), which is Matematicasa&#x27;s closest competitor. During his interview with AAIS&#x27;s asset management team, Esposito demonstrates a machine learning model called AzionarioStella that Esposito has created in his spare time at home over the past several months of evenings and weekends. Esposito first used historical data to tune and back-test the model, and then put the model to work managing his personal portfolio and then the portfolios of his siblings. The team at Algoritmo is excited by Esposito&#x27;s ideas and his model. The Algoritmo team offers Esposito a position on the spot, and also expresses interest in licensing the AzionarioStella model from him. Esposito accepts and resigns from Matematicasa that same day.<\/p><\/div><\/details><div class=\"qtext\"><p>By not fixing the error in the MDT model promptly, did Esposito violate the CFA Institute Code and Standards?<\/p><\/div>","subj":"ethics"},{"n":87,"q":"Following his unsuccessful attempts to convince Rossi that the model error needs to be fixed immediately, and according to the CFA Institute Code and Standards, the most appropriate next step that Esposito should take is to:","opts":["dissociate from Matematicasa.","alert Matematicasa’s senior management.","contact Matematicasa’s clients."],"ans":"B","expl":"Before contacting Matematicasa clients about the error or immediately dissociating himself from Matematicasa, Esposito should bring the model error to the attention of his senior management. According to Standard I(A): Professionalism–Knowledge of the Law, \"If a member or candidate has reasonable grounds to believe that imminent or ongoing client or employer activities are illegal or unethical… The first step should be to attempt to stop the behavior by bringing it to the attention of the employer through a supervisor or the firm's compliance department.\" The model needs to be fixed immediately in order to minimize the negative impact on Matematicasa clients, rather than being left until the next software upgrade cycle. Because Rossi is resistant to promptly correcting the error, Esposito's next step should be to make his senior management (including Rossi's manager) aware of the situation. Standard I(A) does not recommend contacting a firm's clients.\n(Module 43.1, LOS 43.b)","explhtml":"<p>Before contacting Matematicasa clients about the error or immediately dissociating himself from Matematicasa, Esposito should bring the model error to the attention of his senior management. According to Standard I(A): Professionalism–Knowledge of the Law, &quot;If a member or candidate has reasonable grounds to believe that imminent or ongoing client or employer activities are illegal or unethical… The first step should be to attempt to stop the behavior by bringing it to the attention of the employer through a supervisor or the firm&#x27;s compliance department.&quot; The model needs to be fixed immediately in order to minimize the negative impact on Matematicasa clients, rather than being left until the next software upgrade cycle. Because Rossi is resistant to promptly correcting the error, Esposito&#x27;s next step should be to make his senior management (including Rossi&#x27;s manager) aware of the situation. Standard I(A) does not recommend contacting a firm&#x27;s clients.<\/p><p>(Module 43.1, LOS 43.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span cla
