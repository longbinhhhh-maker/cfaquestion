<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"According to CFA Institute Standards of Professional Conduct, which of the following\nstatements about the prohibition against plagiarism is most accurate? The prohibition\nagainst plagiarism applies to written materials:","opts":["and oral communications only.","only.","oral communications, and telecommunications."],"ans":"C","expl":"Việc cấm đạo văn áp dụng cho cả ba lĩnh vực.\n(Học phần 91.2, LOS 91: I(C))"},{"n":2,"q":"Which of the following is most likely permitted under Standard I(C), Misrepresentation?","opts":["Using excerpts from reports prepared by others without acknowledgement.","Including data showing the current government bond yield curve in a report to a client without stating its source.","Citing quotes attributed to \"investment experts\" without specific reference."],"ans":"B","expl":"Đường cong lãi suất trái phiếu chính phủ là thông tin thực tế có sẵn từ nhiều\ncác dịch vụ báo cáo tài chính hoặc thống kê được công nhận.\n(Module 91.2, LOS 91: I(C))"},{"n":3,"q":"According to CFA Institute Standards of Professional Conduct, which of the following is least\nlikely a form of misrepresentation?","opts":["Attributing specific quotations to \"leading analysts\" and \"investment experts\" without specific reference.","Using factual information published by recognized financial and statistical reporting services or similar sources without acknowledgment.","Presenting statistical estimates of forecasts prepared by others with the source identified, but without qualifying statements or caveats that may have been used."],"ans":"B","expl":"Tiêu chuẩn I(C) quy định rằng \"thông tin thực tế được công bố bởi báo cáo thống kê và tài chính được công nhận\n dịch vụ hoặc các nguồn tương tự\" có thể được sử dụng mà không cần xác nhận.\n(Mô-đun 91.2, LOS 91: I(C))"},{"n":4,"q":"According to Standard I(E) Competence, a member or candidate who fails to acquire the\ncapabilities to complete role-specific tasks has violated the Standard by lacking:","opts":["abilities.","knowledge.","skills."],"ans":"C","expl":"Năng lực tiêu chuẩn I(E) xác định các kỹ năng là \"khả năng thực hiện một hành động hoặc chức năng theo vai trò cụ thể để hoàn thành các nhiệm vụ cụ thể và đạt được các mục tiêu nghề nghiệp;\" định nghĩa kiến ​​thức là\n\"nội dung thông tin được áp dụng trực tiếp để thực hiện một chức năng và\nnó được áp dụng hiệu quả như thế nào;\" và định nghĩa khả năng là \"khả năng và thái độ hỗ trợ\nhành vi dẫn đến kết quả có thể quan sát được.\"\n(Học phần 91.2, LOS 91: I(E))"},{"n":5,"q":"A CFA charterholder in a managerial position is in the process of hiring new analysts. If the\ncharterholder conducts background checks on the job applicants with respect to their\ncharacter, the charterholder has:","opts":["complied with Standard I(D) concerning professional misconduct.","complied with Standard VII(A) concerning conduct of members and candidates in the CFA Program.","violated the Code of Ethics by invading the applicants' privacy."],"ans":"A","expl":"Để tránh các vấn đề tiềm ẩn và tuân thủ Tiêu chuẩn I(D), người sử dụng lao động được khuyến khích\ntiến hành kiểm tra lý lịch đối với nhân viên tiềm năng.\n(Module 91.2, LOS 91: I(D))"},{"n":6,"q":"An analyst belongs to a nationally recognized charitable organization, which requires dues\nfor membership. The analyst has worked out a deal under which he provides money\nmanagement advice in lieu of paying dues. While performing services for the organization,\nthe analyst discovers some useful computer programs that his predecessor developed and\nleft as the property of the organization. The analyst decides to use the computer programs\nin his consulting business. This action is:","opts":["a violation of Standard I(D) concerning misconduct.","a violation of Standard III(B) concerning fair dealing.","appropriate since the analyst is technically an employee of the organization."],"ans":"A","expl":"Vì các chương trình là tài sản của tổ chức nên nhà phân tích chỉ có thể sử dụng chúng cho\ntổ chức. Việc nhà phân tích có phải là nhân viên hay không không quan trọng. Cá nhân\nviệc sử dụng các chương trình mà không có sự cho phép của tổ chức từ thiện là không trung thực và\nbị cấm.\n(Mô-đun 91.2, LOS 91: I(D))"},{"n":7,"q":"Sandra Bulow, CFA, is responsible for updating her employing firm's website to include\nchanges in analysis techniques and trading procedures. She is often very delinquent in\nmaking these changes, despite working extensive hours. She is aware clients are using the\nwebsite to make investment decisions, and has received complaints from the sales\ndepartment as the information on the website if often different from what is presented in\nsales meetings. Bulow is most likely:","opts":["in violation of Standard I(C) \"Misrepresentation.\"","in violation of Standard III(B) \"Fair Dealing.\"","not in violation of any Standard."],"ans":"A","expl":"Bulow rất có thể đã vi phạm Tiêu chuẩn I(C) \"Trình bày sai\". Thông tin trên trang web\ncó sai sót và cần được cập nhật để phù hợp với thông lệ hiện tại của công ty.\n(Mô-đun 91.2, LOS 91: I(C))"},{"n":8,"q":"Jerry Brock, CFA, is a partner in a small investment advisory firm that caters to high net\nworth individuals. He has experienced a number of financial setbacks in his personal life\nover the past two years and has filed for bankruptcy protection. Brock does not inform his\nclients of this. Has Brock violated CFA Institute Standards of Professional Conduct?","opts":["Yes, because a member must conduct both personal and professional business in a manner that protects their reputation and integrity.","Yes, because he must disclose the bankruptcy filing to his clients.","No."],"ans":"C","expl":"Bản thân việc tuyên bố phá sản cá nhân không phản ánh bất lợi đối với thành viên hoặc\ntính chính trực hoặc độ tin cậy của ứng viên. Chỉ khi các trường hợp phá sản\nbao gồm gian lận hoặc không trung thực từ phía thành viên thì điều đó mới vi phạm Tiêu chuẩn I(D)\nHành vi sai trái. Tiêu chuẩn VI(A) Tránh hoặc Tiết lộ Xung đột không yêu cầu các thành viên và\ntiết lộ các vấn đề cá nhân trừ khi họ tạo ra biểu hiện xung đột lợi ích\n.\n(Mô-đun 91.2, LOS 91: I(D))"},{"n":9,"q":"Hillary Jones, CFA, sometimes promises clients that she will allocate more shares from\noversubscribed initial public offerings (IPOs) than she knows she will actually be able to\ndeliver. Her employer has reprimanded her in the past for similar behavior. Which of the\nfollowing statements is least accurate regarding Jones' behavior?","opts":["Her actions are a violation of the standard concerning misrepresentation, because she promised something she knew the firm could not deliver.","Her actions are a violation of the Standards only if prosecution results in a felony conviction.","Her actions are a violation of the standard concerning professional misconduct because she deceived her clients."],"ans":"B","expl":"Jones đã vi phạm Tiêu chuẩn I(C) xuyên tạc bằng cách hứa với khách hàng rằng cô sẽ phân bổ\nnhiều cổ phiếu hơn mức cô có thể phân phối. Hành động của cô ấy cũng vi phạm Hành vi sai trái Tiêu chuẩn I(D)\nliên quan đến hành vi không trung thực, gian lận hoặc lừa dối gây ảnh hưởng tiêu cực đến\ndanh tiếng, tính chính trực hoặc năng lực chuyên môn của thành viên. Cô ấy cũng vi phạm Quy tắc đạo đức\ntrong đó quy định rằng các thành viên và ứng cử viên phải hành động một cách liêm chính, có năng lực,\nsiêng năng, tôn trọng và có đạo đức với công chúng, khách hàng và khách hàng\ntương lai. Hình phạt cụ thể cho các hành động này là không liên quan.\n(Mô-đun 91.2, LOS 91: I(D))"},{"n":10,"q":"Which of the following least likely violates the Standard concerning misconduct? Roland\nLawson, a financial analyst:","opts":["is arrested for participating in a nonviolent protest.","drinks excessively during business meetings with clients and returns to work under the influence of alcohol.","committed perjury in connection with a lawsuit against his firm."],"ans":"A","expl":"Hướng dẫn về Tiêu chuẩn I(D) Hành vi sai trái coi bất tuân dân sự là một hoạt động\nkhông vi phạm. Trọng tâm của Tiêu chuẩn là về hành vi chuyên nghiệp chứ không phải hành vi\ncá nhân, trừ khi hành vi cá nhân liên quan đến hành vi không trung thực, gian lận hoặc lừa dối.\n(Mô-đun 91.2, LOS 91: I(D))"},{"n":11,"q":"Based on CFA Institute Standards of Professional Conduct, which of the following statements\nis a violation of Standard I(C), Misrepresentation?","opts":["A broker says XYZ stock is very likely to double in value over the next six months.","A young trainee bond trader tells a prospective client that she can assist the client in all the client's investment needs: equity, fixed income, and derivatives, and based on her years of experience as an analyst in the business, that an investment looks like it has lots of potential.","An investment manager recommends to a prospective client an investment in GNMA bonds because they are guaranteed by the federal government."],"ans":"B","expl":"Thành viên Viện CFA, chủ sở hữu CFA và ứng viên CFA đều bị cấm\ntrình bày sai về dịch vụ hoặc bằng cấp của họ cũng như những đảm bảo không phù hợp về bất kỳ\nđầu tư hoặc sự trở lại của nó.\n(Mô-đun 91.2, LOS 91: I(C))"},{"n":12,"q":"Wes Smith, CFA, has been working toward the completion of a Master of Science in Finance.\nHe has passed all the necessary courses and written the necessary thesis. He still must\ndefend the thesis in one month. Smith's thesis advisor assures him that he will pass the\nthesis defense. Smith has new business cards printed with \"M.S. in Finance\" after his name.\nThis is a violation of:","opts":["none of the Standards if Smith does not make the cards public until after he defends his thesis and receives his degree.","Standard I(C), Misrepresentation.","Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program."],"ans":"A","expl":"Nếu thẻ được phân phát ngày hôm nay, anh ta sẽ vi phạm Tiêu chuẩn I(C),\nTrình bày sai. Tuy nhiên, nếu Smith không công khai các thẻ cho đến sau khi anh ấy\nnhận được bằng thì không có vi phạm nào.\n(Mô-đun 91.2, LOS 91: I(C))"},{"n":13,"q":"All of the following violate Standard I(C), Misrepresentation, EXCEPT:","opts":["copying a proprietary computerized spreadsheet without seeking authorization from the creators.","presenting factual information published by recognized statistical reporting services without acknowledgment.","citing quotes attributable to \"investment experts\" without specific references."],"ans":"B","expl":"Tiêu chuẩn I(C), Trình bày sai, cho phép sử dụng thông tin thực tế từ các dịch vụ báo cáo thống kê và tài chính được công nhận\nmà không cần xác nhận.\n(Mô-đun 91.2, LOS 91: I(C))"},{"n":14,"q":"Marc Randall, CFA, is an investment analyst. During a meeting with a potential client,\nRandall's boss states that, \"You can be sure our investments will always outperform Treasury\nBonds because of our fine research staff members, like Marc.\" Randall knows that this\nstatement is:","opts":["a violation of fiduciary duties owed to clients under the Standards.","a violation of the Standard concerning prohibition against misrepresentation.","not in violation of the Code and Standards."],"ans":"B","expl":"Theo Tiêu chuẩn I(C), các thành viên bị cấm đảm bảo tỷ lệ lợi nhuận cụ thể\nvề các khoản đầu tư không ổn định. Do đó, tuyên bố này vi phạm Tiêu chuẩn.\n(Mô-đun 91.2, LOS 91: I(C))"},{"n":15,"q":"Which of the following are recommended procedures of compliance according to Standard\nI(D), Misconduct?","opts":["Conduct background checks on potential employees to ensure that they are of good character.","Enroll employees in a continuing education program that would provide updates on required ethical behavior.","Refer to the Professional Conduct Program for arbitration of disputes with other members or candidates."],"ans":"A","expl":"Theo Tiêu chuẩn I(D) Hành vi sai trái - Thủ tục tuân thủ: Các thành viên nên\nkhuyến khích người sử dụng lao động của mình tiến hành kiểm tra lý lịch đối với các nhân viên tiềm năng để\nđảm bảo rằng họ có tư cách tốt và đủ điều kiện làm việc trong ngành đầu tư.\n(Mô-đun 91.2, LOS 91: I(D))"},{"n":16,"q":"An analyst preparing a report needs to cite which of the following?","opts":["Estimates of betas provided by Standard & Poor's.","The individual who developed a chart from the same firm.","A recent quote from the Federal Reserve Chairman."],"ans":"C","expl":"Thống kê do một cơ quan được công nhận cung cấp, chẳng hạn như Standard and Poor's, không cần phải được\ntrích dẫn. Các biểu đồ, trích dẫn và thuật toán do công ty phát triển sẽ cần phải được trích dẫn khi\nchúng được sử dụng nhưng (những) cá nhân phát triển tài liệu trong công ty thì không\ncần được trích dẫn.\n(Mô-đun 91.2, LOS 91: I(C))"},{"n":17,"q":"A money manager works for a full-service brokerage firm. After meeting with a new client\nand gathering all relevant information, the money manager says that she thinks her firm can\nperform all the financial services the new client needs. With respect to the Standard on\nmisrepresentation, this statement:","opts":["is not a violation if it is based on the factual information gathered.","would only be a violation if it is made in writing.","is a violation."],"ans":"A","expl":"Không có vi phạm nếu ý kiến ​​dựa trên thông tin thực tế được thu thập và\nkhả năng thực tế của công ty. Điều này đúng cho dù việc trình bày bằng văn bản, miệng,\nhay điện tử hay không.\n(Mô-đun 91.2, LOS 91: I(C))"},{"n":18,"q":"Which of the following actions most likely violates Standard I(D) Misconduct?","opts":["A Level I candidate submits a request to her employer for auto travel reimbursement using inflated mileage totals.","A member pursues an employment opportunity with a competing firm, primarily as a means of securing a salary increase from her current employer.","An analyst is arrested for trespassing while participating in an anti-abortion protest."],"ans":"A","expl":"Bất kỳ hoạt động nào phản ánh bất lợi đến danh tiếng nghề nghiệp, tính liêm chính hoặc\nnăng lực của thành viên đều là vi phạm Hành vi sai trái Tiêu chuẩn I(D). Tiêu chuẩn I(D) nói chung không\ncó mục đích mở rộng sang các hành vi vi phạm pháp luật do hành vi bất tuân dân sự nhằm ủng hộ\nniềm tin cá nhân. Thành viên có thể theo đuổi cơ hội việc làm với một\nđối thủ cạnh tranh miễn là thành viên đó tuân thủ các Tiêu chuẩn liên quan đến Nghĩa vụ đối với Người sử dụng lao động.\n(Mô-đun 91.2, LOS 91: I(D))"},{"n":19,"q":"A CFA charterholder who comes to work intoxicated is:","opts":["in violation of Standard I(D) concerning professional misconduct.","not in violation of the standards.","in violation of Standard IV(A) concerning duties to employer."],"ans":"A","expl":"Say rượu tại nơi làm việc là hành vi cá nhân kém cỏi. Điều này vi phạm Tiêu chuẩn I(D), trong đó\nbao gồm năng lực chuyên môn và tính chính trực.\n(Mô-đun 91.2, LOS 91: I(D))"},{"n":20,"q":"A CFA charterholder is caught shoplifting and is sentenced to nine months in prison. Is this a\nviolation of Standard I(D) Misconduct?","opts":["No, because the crime does not relate to the investment profession.","Yes, because the crime involved stealing.","Yes, because the prison sentence is more than six months."],"ans":"B","expl":"Bất kỳ hành động nào liên quan đến nói dối, gian lận, trộm cắp hoặc hành vi không trung thực khác phản ánh tiêu cực\nđến hoạt động nghề nghiệp của chủ thuê tàu đều là vi phạm Tiêu chuẩn I(D).\nMặc dù tội phạm không liên quan đến nghề đầu tư nhưng chắc chắn nó đã phản ánh bất lợi\nvề mặt chuyên môn đối với người thuê tàu.\n(Module 91.2, LOS 91: I(D))"},{"n":21,"q":"Timothy Hooper, CFA, is a security analyst at an investment firm. In his spare time, Hooper\nserves as a volunteer for City Pride, which collects clothes for the homeless. Hooper has\noccasionally given some of the clothes to his friends or sold the clothes instead of returning\nall of the clothing to City Pride. City Pride discovers what he has been doing and dismisses\nhim. Later, City Pride learns that other volunteer organizations have dismissed Hooper for\nsimilar actions. Has Hooper violated Standard I(D) on professional misconduct in the CFA\nInstitute Standards of Professional Conduct?","opts":["No, because Hooper volunteers his services to City Pride.","No, because Hooper's conduct is unrelated to his professional activities as a security analyst.","Yes."],"ans":"C","expl":"Hooper đã vi phạm Tiêu chuẩn I(D) vì anh ta liên tục thực hiện hành vi liên quan đến\nhành vi không trung thực. Hành vi vi phạm này xảy ra bất chấp thực tế là hành vi phạm tội của anh ta không liên quan trực tiếp\nđến hoạt động nghề nghiệp của anh ta. Tuy nhiên, hành vi của Hooper phản ánh không tốt về\ndanh tiếng và tính chính trực nghề nghiệp của anh ta.\n(Mô-đun 91.2, LOS 91: I(D))"},{"n":22,"q":"A CFA charterholder takes a trip for which his firm will pay the expenses. Upon his return, he\nalters some of the numbers on restaurant receipts to inflate the expenses by about one half\nof a percent. Is this a violation of the Code and Standards?","opts":["Yes, because it reflects dishonesty.","Yes, because the charterholder should have paid his own expenses.","This is a violation only if the amount in question is material."],"ans":"A","expl":"Bất kỳ hành động nào của thành viên hoặc ứng viên liên quan đến hành vi không trung thực, gian lận hoặc lừa dối đều vi phạm\nHành vi sai trái Tiêu chuẩn I(D).\n(Mô-đun 91.2, LOS 91: I(D))"},{"n":23,"q":"Mark Acevedo, CFA, issues a \"buy\" recommendation on Rucker Company shares, based on a\ndividend discount model with inputs supported by Acevedo's industry and company analysis.\nOver the next year, Rucker's share price decreases by 10% while the overall market\nincreases by 5%. With respect to the Code and Standards, Acevedo has most likely:","opts":["violated the Standard concerning diligence and reasonable basis.","not violated any Standards.","violated the Standard concerning competence."],"ans":"B","expl":"Thành viên không vi phạm Năng lực Tiêu chuẩn I(E) hoặc Tiêu chuẩn V(A) Sự siêng năng và\nCơ sở hợp lý do sai lầm về triển vọng giá của một chứng khoán. Kết quả\ntiêu cực không nhất thiết ngụ ý sự thiếu năng lực hoặc thiếu siêng năng.\n(Mô-đun 91.2, LOS 91: I(E))"},{"n":24,"q":"Paul Thomas, CFA, is designing a new layout for research reports his firm writes and issues\non individual stocks. In his design, Thomas includes a stock chart on the first page of each\nreport. He does not reference that the charts are copied from the Standard & Poor's\nwebsite. Thomas has:","opts":["violated CFA Institute Standards of Professional Conduct because he did not make sure that the information in these charts is accurate.","not violated CFA Institute Standards of Professional Conduct because these charts are widely available over the internet.","violated CFA Institute Standards of Professional Conduct because he did not state the source of the charts."],"ans":"C","expl":"Trình bày sai tiêu chuẩn I(C). Các thành viên không nên sao chép hoặc sử dụng tài liệu do\nngười khác chuẩn bị mà không thừa nhận và xác định nguồn gốc của tài liệu đó. Sử dụng biểu đồ\nvà đồ thị mà không nêu rõ nguồn là vi phạm Tiêu chuẩn. Dữ liệu từ\ncác dịch vụ báo cáo thống kê được công nhận có thể được sử dụng mà không cần ghi công, nhưng biểu đồ,\nphân tích và nội dung sáng tạo khác thì không được phép.\n(Mô-đun 91.2, LOS 91: I(C))"},{"n":25,"q":"The following information involves two research analysts at a brokerage firm.\nErik Bagenot, CFA, is preparing a research report on Global Enterprises, Inc. In\npreparing the report, he uses materials from many sources. For example, he uses\nfactual information published by Standard & Poor's Corporation without\nacknowledging the source. He also uses excerpts from a research report prepared by\nanother analyst. Bagenot makes only a slight change in wording for these excerpts,\nbut acknowledges the source.\nSally Wain, who is currently enrolled in the CFA program, is preparing a research\nreport on Manson Telecommunications. She attends a conference in which several\ninvestment experts provide their views about the future prospects of this company.\nWain cites several quotations from these investment experts in her report without\nspecific reference.\nAccording to CFA Institute Standards of Professional Conduct involving prohibition against\nplagiarism, which of the following statements is CORRECT?","opts":["Bagenot violated the Standards, but Wain did not.","Wain violated the Standards, but Bagenot did not.","Both Bagenot and Wain violated the Standards."],"ans":"B","expl":"Bagenot tuân thủ Tiêu chuẩn I(C), cho phép xuất bản thông tin thực tế từ\nStandard & Poor's mà không cần xác nhận và sử dụng các đoạn trích có xác nhận.\nWain phạm tội đạo văn vì cô ấy không đưa ra tài liệu tham khảo cụ thể cho\ncác trích dẫn mà cô ấy đã sử dụng.\n(Module 91.2, LOS 91: I(C))"},{"n":26,"q":"Which of the following would be permissible under Standard I(C), Misrepresentation?","opts":["Reporting statistics prepared by an outside firm, identifying the source but omitting caveats and qualifying statements.","Using excerpts from a report prepared by a well known outside research firm without acknowledgement.","Including a graph showing the central bank’s discount rates over the previous 12 months in a report that goes to clients, without citing the source from which the data were gathered."],"ans":"C","expl":"Hành động được phép duy nhất trong danh sách trên là bao gồm biểu đồ lãi suất chiết khấu của Fed\ntrong 12 tháng qua vì đây là thông tin thực tế được công bố bởi một cơ quan có thể nhận biết\ndịch vụ báo cáo thống kê và tài chính.\n(Mô-đun 91.2, LOS 91: I(C))"},{"n":27,"q":"All of the following are violations of Standard I(D), Misconduct, EXCEPT:","opts":["conviction of a misdemeanor involving civil disobedience in support of one’s personal beliefs.","conviction of a crime involving fraud.","any conduct that undermines confidence that the CFA charter represents a level of achievement based on merit and ethical conduct."],"ans":"A","expl":"Quy tắc và Tiêu chuẩn không tập trung vào hành vi cá nhân miễn là hành vi đó\nkhông phản ánh kém về danh tiếng nghề nghiệp, tính chính trực hoặc năng lực của một người.\n(Mô-đun 91.2, LOS 91: I(D))"}];

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");

      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)

<script>

(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qcheck-js">
/* Kiểm tra đáp án từng câu (chỉ áp dụng cho các đề Ethics theo Reading). */
(function(){
  function idx(card){ return (card.id && card.id.indexOf("q-")===0) ? +card.id.slice(2) : -1; }
  function addBtn(card){
    if(!card.classList || !card.classList.contains("card")) return;
    if(card.querySelector(".qcheck-wrap")) return;
    var i = idx(card); if(i<0) return;
    if(typeof CFG!=="undefined" && CFG && CFG.hasAnswers===false) return; // không có đáp án -> bỏ qua
    var wrap=document.createElement("div"); wrap.className="qcheck-wrap";
    var btn=document.createElement("button"); btn.type="button"; btn.className="qcheck-btn";
    btn.textContent="Kiểm tra đáp án";
    var msg=document.createElement("span"); msg.className="qcheck-msg";
    btn.onclick=function(){ checkOne(i, card, btn, msg); };
    wrap.appendChild(btn); wrap.appendChild(msg);
    var expl=card.querySelector(".expl");
    if(expl) card.insertBefore(wrap, expl); else card.appendChild(wrap);
  }
  function checkOne(i, card, btn, msg){
    if(typeof graded!=="undefined" && graded) return;      // đã nộp cả bài
    if(btn.classList.contains("done")) return;             // đã kiểm tra câu này
    var pick = (typeof answers!=="undefined") ? answers[i] : undefined;
    if(pick===undefined){
      msg.textContent="Hãy chọn một đáp án để kiểm tra."; msg.className="qcheck-msg warn";
      return;
    }
    var ans = (typeof DATA!=="undefined" && DATA[i]) ? DATA[i].ans : null;
    if(ans){
      var cb=document.getElementById("opt-"+i+"-"+ans);
      if(cb) cb.classList.add("correct");
      if(pick===ans){
        msg.textContent="Chính xác ✓"; msg.className="qcheck-msg ok";
      }else{
        var wb=document.getElementById("opt-"+i+"-"+pick);
        if(wb) wb.classList.add("wrong");
        msg.textContent="Chưa đúng — đáp án đúng là "+ans; msg.className="qcheck-msg bad";
      }
    }
    var e=document.getElementById("expl-"+i); if(e) e.classList.add("show");
    card.classList.add("qc-locked");
    btn.classList.add("done"); btn.textContent="Đã kiểm tra";
  }
  function scan(){
    if(document.body.classList.contains("qc-graded")) return;
    var cards=document.querySelectorAll("#quiz .card");
    for(var k=0;k<cards.length;k++) addBtn(cards[k]);
  }
  // Sau khi NỘP CẢ BÀI: ẩn nút kiểm tra từng câu (bài đã được chấm toàn bộ).
  if(typeof grade==="function"){
    var _g=grade;
    grade=function(a){ _g(a); document.body.classList.add("qc-graded"); };
  }
  // LÀM LẠI: bỏ trạng thái đã-chấm để nút kiểm tra từng câu hiện lại.
  if(typeof restart==="function"){
    var _r=restart;
    restart=function(){ document.body.classList.remove("qc-graded"); _r(); };
  }
  var quiz=document.getElementById("quiz");
  if(quiz){
    scan();
    new MutationObserver(function(){ scan(); }).observe(quiz,{childList:true});
  }
})();
</script>
<!--qcheck-end-->

<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
