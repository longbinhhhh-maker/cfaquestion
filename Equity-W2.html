nt the index value from being impacted by stock price changes that do not reflect changes\nin the fundamental values of the component companies. This makes an index's value over time more easily comparable. Divisors are adjusted\nfor:\nStock splits\nStock dividends\nIndex reconstitutions (ie, changes to constituent stocks).\nThe divisor adjustment for stock splits is illustrated above. A similar process is followed when adjusting for stock dividends and index\nreconstitutions.\n(Choice B) Price appreciation of a constituent stock increases the value of a price-weighted stock index but does not impact the index divisor.\n(Choice C) All else equal, stock prices fall by the amount of cash dividends paid; therefore, cash dividends impact the value of a price-weighted\nindex but do not affect the divisor.\nThings to remember:\nPrice-weighted index divisors are adjusted for stock splits, stock dividends, and index reconstitutions (ie, changes to constituent stocks). The\nadjustments prevent the index value from being impacted by stock price changes that do not reflect changes in the fundamental values of the\ncomponent companies, improving comparability over time.\nCompare the different weighting methods used in index construction", "qhtml": null}, {"n": 32, "q": "Which of the following best describes security market indexes? Security market indexes:", "opts": ["are valued no more often than daily.", "can only be valued using actual asset prices.", "represent a security market, market segment, or asset class."], "ans": "C", "expl": "Characteristics of security market indexes\nRepresent and track the value of a given security market, market\nsegment, or asset class\nTypically constructed as a portfolio of marketable securities\nValued on a regular basis using actual or estimated prices of\nconstituent securities\nA security market index (eg, S&P 500, Hang Seng) is a representation of specified security market, a market segment, or an asset class.\nIndexes can be designed to represent a broad universe of securities (eg, the equity market) or a narrow subsection of a specific security market\n(eg, U.S. mid-cap growth stocks).\nAn index is usually constructed and managed as a portfolio of individual marketable securities (ie, constituent securities). The value of an\nindex is the combination of the value of the constituent securities, weighted by the creator of the index. The securities may represent nearly all of\nthe index's universe or just a sample.\n(Choice A) Security market indexes are valued on a regular basis. Most high-profile indexes are updated in real time as the prices of the\nunderlying securities update.\n(Choice B) Security market indexes can be valued using constituent securities' estimated prices when actual prices are not available. Estimated\nprices are more likely to be used for assets that are not priced regularly or are illiquid (eg, bonds).\nThings to remember:\nA security market index is usually constructed as a portfolio of individual marketable securities to represent a security market, a market segment,\nor an asset class. It can represent a broad security market or a narrow subsection of a market.\nDescribe a security market index", "qhtml": null}, {"n": 33, "q": "An exchange-traded fund (ETF) has been created to replicate the performance of a broad market index. In the design of the ETF, the index was most likely used as a: ", "opts": ["model portfolio.", "asset class proxy.", "performance benchmark."], "ans": "A", "expl": "Investment management companies create index funds, including mutual funds and exchange-traded funds (ETFs), to track indexes. ETFs and\nmutual funds contain similar index-based portfolios, but ETFs are more liquid since they trade like equities.\nBy design, the ETF in this scenario uses the index as a model portfolio. It either holds all securities in proportion to their index weights or uses\nstatistical techniques to identify a subset of securities whose returns will replicate index returns. Once established, the ETF attempts to match the\nreturns on its model index.\n(Choice B) Indexes are used as asset class proxies in asset allocation models, providing historical data for model inputs.\n(Choice C) Indexes are used as performance benchmarks to assess actively managed portfolio returns. Index funds are passive investments;\nmanagers try to minimize any divergence between portfolio and model index returns (ie, tracking error).\nThings to remember:\nInvestment management companies create index funds, including mutual funds and exchange-traded funds (ETFs), to track indexes. By design,\nthe ETF in this scenario uses the index as a model portfolio. Once established, an ETF attempts to match the returns on its model index.\nDescribe uses of security market indexes", "qhtml": null}, {"n": 34, "q": "An analyst uses the return on the Tokyo Stock Price Index over the last 10 years as an input to the CAPM to determine the expected return of a stock. This is an example of using a securities market index as a(n):", "opts": ["indicator of market sentiment.", "model portfolio for investment products.", "proxy to model risk, return, or risk-adjusted performance."], "ans": "C", "expl": "A market index is a collection of assets intended to represent a larger group of assets. The Tokyo Stock Price Index (TOPIX) is a group of nearly\n2,000 stocks that represents the entire Japanese stock market. Initially, market indexes served as indicators of market sentiment, but their uses\nhave evolved over time. Currently, indexes are used in five different ways, listed above.\nOne such use is to model risk, return, or risk-adjusted performance. The CAPM is used to model the expected return of a stock based on its beta,\nthe market portfolio's expected return, and the risk-free rate. Since the market portfolio consists of every risky asset, measuring its return is not\npossible. The analyst in this scenario uses the return on the TOPIX as a proxy for the market portfolio return. This allows the analyst to model\nthe expected return of the stock.\n(Choice A) Market indexes are often used as indicators of market sentiment; analysts look at up or down trends to understand how most\ninvestors feel about the overall market or a particular asset class. However, in this scenario, the index return is used as a proxy for the return on\nthe market to calculate a stock's expected return using the CAPM.\n(Choice B) Some mutual funds and exchange-traded funds (ETFs) are designed to mimic the performance of indexes. For example, the iShares\nTOPIX ETF aims to track the performance of the TOPIX. However, in this scenario, there is no product being created to perform like the index.\nThings to remember:\nThere are five uses of market indexes. An analyst may use a broad market index as an input to a pricing model to calculate a stock's expected\nreturn. This scenario is an example of using a market index as a proxy to model risk, return, or risk-adjusted performance.\nDescribe uses of security market indexes", "qhtml": null}, {"n": 35, "q": "Two market-cap weighted indexes are created with the same stocks and stock weights, one as a total return index and one as a price return index. If the stocks repurchase shares instead of paying dividends, after 1 year, which index will most likely have the greater return?", "opts": ["The total return index", "The price return index", "The indexes will have the same return"], "ans": "C", "expl": "Return indexes\nPrice return Total return\nReflects only prices of securities Reflects both prices and income of securities\nEqual to total return if no securities Greater than price return if securities generate\ngenerate income income\nThe return on an index can be calculated as a price return index or a total return index.\nA price return index reflects the price change of each constituent security.\nA total return index reflects both the price change of each constituent security and any dividend and/or interest income from that security.\nThe difference between a total return index and a price return index is the return on dividend and/or interest income.\nThe value of share repurchases is reflected in a stock's price. Repurchases have the same effect on both types of return index since they both\ncapture price changes. In this scenario, the two indexes have the same constituent stocks held in the same proportions, and no dividends are\npaid; therefore, they will have the same return (Choices A and B).\nThings to remember:\nA price return index reflects the change in price of each constituent security, while a total return index also includes any income (eg, dividends,\ninterest) from the securities. Share repurchases are reflected in a stock's price and price changes are captured by both price return and total\nreturn, repurchases would have the same effect on both return measures.\nCalculate and interpret the value, price return, and total return of an index", "qhtml": null}, {"n": 36, "q": "Changing the constituent stocks in a broad market index to reflect changes in the relative economic importance of different industry sectors is best described as a:", "opts": ["rebalancing.", "reconstitution.", "reorganization."], "ans": "B", "expl": "Index construction requires decisions regarding three characteristics: target market (eg, sector or asset class), security selection (eg,\nrepresentative stocks), and weighting (ie, portion of index in each security). Once created, the index must be managed over time to maintain\nconsistency with the characteristics established at index construction. Index management actions are categorized as:\nRebalancing: adjusting the weights of constituent securities to maintain consistency with index weighting methodology\nReconstitution: adding and/or removing securities to maintain consistency with the target market\nSecurities are added or removed for a variety of reasons: new exchange listings or delistings, whether securities newly meet or no longer meet\nindex criteria, or companies no longer existing due to acquisitions or bankruptcies. Some indexes (eg, S&P 500) are designed to reflect the\nrelative importance of different industry sectors. Selection committees sometimes alter index composition to reflect shifts in economic\nsignificance. Changes in the constituent stocks for these reasons are characterized as a reconstitution.\n(Choice A) Rebalancing refers to changes in the weights given to the constituent securities. Index reconstitution sometimes necessitates\nrebalancing, but the two are separate aspects of index management.\n(Choice C) Reorganization is not used to describe actions related to index management. It describes certain corporate restructurings related to\nbankruptcies.\nThings to remember:\nRebalancing and reconstitution are two aspects of index management. Rebalancing is adjusting the weights of constituent securities.\nReconstitution is adding and/or removing securities to maintain consistency with the target market.\nDescribe rebalancing and reconstitution of an index", "qhtml": null}, {"n": 37, "q": "An analyst designing a security market index who wants to minimize the need to actively rebalance the index would most appropriately choose: ", "opts": ["price weighting.", "equal weighting.", "float-adjusted market-capitalization weighting."], "ans": "A", "expl": "Security index rebalancing\nActive rebalancing\nIndex weighting method Rationale\nfrequency\nWeights adjust as asset prices\nPrice weighting Never\nchange\nAny price changes result in\nEqual weighing Periodically\nunequal weights\nFloat-adjusted market- Adjusted to reflect holdings of\nPeriodically\ncapitalization weighting controlling shareholders\nIndex design entails assigning weights to constituent securities. Price weighting, equal weighting, and float-adjusted market-capitalization\nweighing are the three most common methods. As index constituents and prices change over time, an index may need to be rebalanced to\nmaintain its weighting. Each weighting method has different rebalancing requirements to maintain consistency with the index's weighting.\nPrice-weighted indexes require no active rebalancing. The weight of each constituent security is based on its price, so weights automatically\nadjust as prices change. Ease of maintaining the index over time (ie, managing the index) is a major advantage of price weighting.\n(Choice B) Equal weighting assumes an equal value is invested in each constituent security at index inception. Any price changes result in the\nweights no longer being equal. Equal weighting generally requires the most frequent rebalancing.\n(Choice C) Float-adjusted market-capitalization weighting is based on the market value (ie, number of shares × market price per share) of the\nshares available to public investors. Those are the shares not held by controlling shareholders or other corporations. Periodic adjustments are\nmade to the number of shares to account for transactions by controlling shareholders.\nThings to remember:\nPrice weighting, equal weighting, and float-adjusted market-capitalization weighing are three common index weighting methods. Price-weighted\nindexes require no active rebalancing. The weight of each constituent security is based on its price, so weights automatically adjust as prices\nchange.\nDescribe the choices and issues in index construction and management", "qhtml": null}, {"n": 38, "q": "The weight of individual stocks in a float-adjusted market capitalization–weighted index is most likely based on:", "opts": ["shares sold to investors through public offerings.", "issued shares less shares repurchased by the company.", "outstanding shares less shares owned by controlling shareholders."], "ans": "C", "expl": "Market capitalization weighting accurately reflects the relative market values of an index's constituent stocks. It also accurately captures the\nchange in the market value of the entire index when constituent stock prices change. However, market capitalization–weighted indexes may not\nbe best for measuring changes in value of shares available for investors to trade. Float-adjusted market capitalization weighting attempts to\naddress this issue.\nControlling shareholders are individual or institutional investors with significant holdings of a company's stock. These are not passive investments\nbut are used to influence a company's strategic direction or to exercise outright control (eg, elect members of the board, select senior managers).\nConsequently, controlling shareholders are unlikely to sell their holdings. Float-adjusted market capitalization weighting uses the shares available\nto public investors (ie, outstanding shares less shares owned by controlling shareholders) to establish the weights of constituent stocks. Most\nmajor market capitalization–weighted indexes are float adjusted.\n(Choice A) Shares sold to investors through public offerings are only a portion of issued shares and are not the basis for float-adjusted market\ncapitalization weighting. Adjustments for other share distributions (eg, private placements), treasury stock, and controlling shares are used to\ndetermine the float-adjusted market capitalization.\n(Choice B) Issued shares less shares repurchased by the company (ie, treasury stock) equals the number of shares outstanding. The market\nvalue of the outstanding shares is a company's market capitalization and the basis for weighting market capitalization–weighted indexes, not float-\nadjusted market capitalization–weighted indexes.\nThings to remember:\nFloat-adjusted market capitalization weighting uses the shares available to public investors (ie, outstanding shares less shares owned by\ncontrolling shareholders) to establish the weights of constituent stocks in an index.\nCompare the different weighting methods used in index construction", "qhtml": null}, {"n": 39, "q": "The performance of which of the following indexes for alternative investments is most likely to reflect the spot prices of the asset class it represents?", "opts": ["Hedge fund index", "Commodities index", "Real estate investment trust index"], "ans": "C", "expl": "Although the larger category of real estate indexes (ie, indexes that include directly owned real estate) can suffer from pricing problems due to\ninfrequent transaction information and illiquid assets, real estate investment trust (REIT) indexes are based on publicly traded securities and\ntherefore reflect current prices.\n(Choice A) Since hedge funds are required to report performance only to their investors, funds that perform poorly or fail may not report results to\nthe index. This leads to survivorship bias. Moreover, differences in the composition of hedge fund indexes precludes their use as a representative\nof the hedge fund asset class.\n(Choice B) Commodities indexes are based on futures contracts, which differ from commodities' spot prices. The result is that index returns do\nnot reflect changes in commodity spot prices.\nThings to remember:\nReal estate investment trust (REIT) indexes reflect the prices of publicly traded REITs. Hedge fund indexes and commodities indexes may reflect\nperformance that diverges greatly from the prices of their represented asset classes.\nDescribe indexes representing alternative investments", "qhtml": null}];
const CFG = {"title": "Wiley · Security Market Indexes", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Equity Investments · 39 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
