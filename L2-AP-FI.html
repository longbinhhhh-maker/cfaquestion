kes the following statements,<\/p><p>Statement 1: The CIR model will provide the most accurate modelling of the term structure<\/p><p>observed in the Eurex exchange compared to the Ho-Lee model.<\/p><p>Statement 2: The Vasicek model is an equilibrium term structure model that includes mean<\/p><p>reversion.<\/p><p>Page also states that” to determine how the value of a security is affected, we can simulate 500<\/p><p>paths of interest rates, generate spot rates from the simulated future interest rates, compute the<\/p><p>cash flows along each interest rate path, compute the present value and average present value<\/p><p>across all paths.”<\/p><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1, determine the best action that an investor should take if they are to take advantage of the arbitrage opportunity and make a profit:<\/p><\/div>", "subj": "fixed"}, {"n": 66, "q": "From Exhibits 1 and 2, the exchange with the arbitrage-free price of the bond is most likely:", "opts": ["Frankfurt", "Eurex", "None of the markets"], "ans": "B", "expl": "The bond from Exhibit 1 is trading at its calculated value on the NYSE Euronext exchange. The arbitrage-free value of a bond is determined by calculating the present value of its cash flows, using the spot rates for zero-coupon bonds maturing on the exact dates as the bond's cash flows. The value of this bond, 109.1932, is calculated as follows: Note: We calculate the spot rates using bootstrapping, i.e., A is incorrect. The price on the Frankfurt exchange is $109.7972. This is higher than the arbitrage-free value of $109.1932, meaning the bond is overpriced on the Frankfurt exchange. Therefore, buying the bond in Frankfurt does not align with the arbitrage-free pricing, making it an incorrect choice. C is incorrect. The bond's price on Eurex matches the calculated arbitrage-free value of 109.1932. Hence, at least one market where the bond is priced correctly invalidates the \"None of the markets\" option.", "explhtml": "<p>The bond from Exhibit 1 is trading at its calculated value on the NYSE Euronext exchange. The arbitrage-free value of a bond is determined by calculating the present value of its cash flows, using the spot rates for zero-coupon bonds maturing on the exact dates as the bond&#x27;s cash flows. The value of this bond, 109.1932, is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0113.webp\" style=\"max-width:min(100%,504px)\" alt=\"Year 1 Year 2 Year 3 Total PV Yield-to-maturity 1.5000% 1.6500% 1.8200% Spot rate 1.5000% 1.6535% 1.8340% Cash flow $5 $5 $105 PV of payment $4.926 $4.8387 $99.4285 $109.1932\"><p>Note: We calculate the spot rates using bootstrapping, i.e.,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0114.webp\" style=\"max-width:min(100%,302px)\" alt=\"0.0165 1.0165 1 = + = Z2 = 1.6535% 1.015 (1 + Z2)2\"><p><b>A is incorrect.<\/b> The price on the Frankfurt exchange is $109.7972. This is higher than the arbitrage-free value of $109.1932, meaning the bond is overpriced on the Frankfurt exchange. Therefore, buying the bond in Frankfurt does not align with the arbitrage-free pricing, making it an incorrect choice.<\/p><p><b>C is incorrect.<\/b> The bond&#x27;s price on Eurex matches the calculated arbitrage-free value of 109.1932. Hence, at least one market where the bond is priced correctly invalidates the &quot;None of the markets&quot; option.<\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(c): Calculate the arbitrage-free value of an option-free, fixed-rate coupon bond.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · John Hagin<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Hagin is a Fixed-Income Fund Manager at Equinox Financial Management Ltd. Jessica Page<\/p><p>is a junior analyst under Hagin&#x27;s supervision. Hagin explains the mechanics of the firm&#x27;s<\/p><p>arbitrage-free valuation framework. Using a fictitious bond traded in three exchanges, shown in<\/p><p>Exhibit 1, Hagin requests Page while ignoring transaction costs to identify the bond&#x27;s arbitrage<\/p><p>opportunity.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0111.webp\" style=\"max-width:min(100%,570px)\" alt=\"Exhibit 1: Three-Year, $100 par, 5.00% Coupon, Annual Option-free Bond Frankfurt Eurex NYSE Euronext Price $109.7972 $109.1932 $108.7665\"><p>Hagin also presents the yield to maturity of a one-year, two-year and three-year Exhibit 2.<\/p><p>Exhibit 2: Yield-to-Maturity Par Rates for One-, Two-, and Three-year Annual <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0112.webp\" style=\"max-width:min(100%,596px)\" alt=\"Pay Option-Free Bonds One –year Two-year Three-year 1.50% 1.65% 1.82%\"><p>Hagin also asks Page which term structure model he should use to determine how interest rates<\/p><p>move. Page makes the following statements,<\/p><p>Statement 1: The CIR model will provide the most accurate modelling of the term structure<\/p><p>observed in the Eurex exchange compared to the Ho-Lee model.<\/p><p>Statement 2: The Vasicek model is an equilibrium term structure model that includes mean<\/p><p>reversion.<\/p><p>Page also states that” to determine how the value of a security is affected, we can simulate 500<\/p><p>paths of interest rates, generate spot rates from the simulated future interest rates, compute the<\/p><p>cash flows along each interest rate path, compute the present value and average present value<\/p><p>across all paths.”<\/p><\/div><\/details><div class=\"qtext\"><p>From Exhibits 1 and 2, the exchange with the arbitrage-free price of the bond is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 67, "q": "Page is most likely correct regarding statement:", "opts": ["Statement 1.", "Statement 2.", "Both Statements."], "ans": "B", "expl": "The Vasicek model is an equilibrium model that accounts for mean reversion, where interest rates tend to return to a long-term average over time. It’s well-known for incorporating this feature, making Statement 2 accurate. A and C are incorrect. The CIR (Cox-Ingersoll-Ross) model, while an equilibrium model incorporating mean reversion like the Vasicek model, is not necessarily more accurate than the Ho-Lee model for all term structures. The Ho-Lee model is a no-arbitrage model used for fitting current term structures and can be very accurate in different contexts. Therefore, claiming the CIR model is definitively more accurate for the Eurex exchange's term structure is incorrect without additional context or evidence.", "explhtml": "<p>The Vasicek model is an equilibrium model that accounts for mean reversion, where interest rates tend to return to a long-term average over time. It’s well-known for incorporating this feature, making Statement 2 accurate.<\/p><p><b>A and C are incorrect.<\/b><\/p><p>The CIR (Cox-Ingersoll-Ross) model, while an equilibrium model incorporating mean reversion like the Vasicek model, is not necessarily more accurate than the Ho-Lee model for all term structures. The Ho-Lee model is a no-arbitrage model used for fitting current term structures and can be very accurate in different contexts. Therefore, claiming the CIR model is definitively more accurate for the Eurex exchange&#x27;s term structure is incorrect without additional context or evidence.<\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(i): Describe term structure models and their use.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · John Hagin<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Hagin is a Fixed-Income Fund Manager at Equinox Financial Management Ltd. Jessica Page<\/p><p>is a junior analyst under Hagin&#x27;s supervision. Hagin explains the mechanics of the firm&#x27;s<\/p><p>arbitrage-free valuation framework. Using a fictitious bond traded in three exchanges, shown in<\/p><p>Exhibit 1, Hagin requests Page while ignoring transaction costs to identify the bond&#x27;s arbitrage<\/p><p>opportunity.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0111.webp\" style=\"max-width:min(100%,570px)\" alt=\"Exhibit 1: Three-Year, $100 par, 5.00% Coupon, Annual Option-free Bond Frankfurt Eurex NYSE Euronext Price $109.7972 $109.1932 $108.7665\"><p>Hagin also presents the yield to maturity of a one-year, two-year and three-year Exhibit 2.<\/p><p>Exhibit 2: Yield-to-Maturity Par Rates for One-, Two-, and Three-year Annual <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0112.webp\" style=\"max-width:min(100%,596px)\" alt=\"Pay Option-Free Bonds One –year Two-year Three-year 1.50% 1.65% 1.82%\"><p>Hagin also asks Page which term structure model he should use to determine how interest rates<\/p><p>move. Page makes the following statements,<\/p><p>Statement 1: The CIR model will provide the most accurate modelling of the term structure<\/p><p>observed in the Eurex exchange compared to the Ho-Lee model.<\/p><p>Statement 2: The Vasicek model is an equilibrium term structure model that includes mean<\/p><p>reversion.<\/p><p>Page also states that” to determine how the value of a security is affected, we can simulate 500<\/p><p>paths of interest rates, generate spot rates from the simulated future interest rates, compute the<\/p><p>cash flows along each interest rate path, compute the present value and average present value<\/p><p>across all paths.”<\/p><\/div><\/details><div class=\"qtext\"><p>Page is most likely correct regarding statement:<\/p><\/div>", "subj": "fixed"}, {"n": 68, "q": "The method described in Page’s final statement is closely related to:", "opts": ["Monte Carlo Method.", "Bootstrapping.", "Binomial interest rate framework."], "ans": "A", "expl": "The method described in Page’s final statement involves simulating 500 paths of interest rates, generating spot rates from these simulated future interest rates, computing cash flows along each interest rate path, and then calculating and averaging the present value across all paths. This process is characteristic of the Monte Carlo Method, which uses random sampling to obtain numerical results and simulate various scenarios, making it particularly useful for valuing complex securities. B is incorrect. Bootstrapping is a method used to construct a zero-coupon yield curve (spot rate curve) from the prices of coupon-bearing bonds. This process involves deriving spot rates from the yields of these bonds. Still, it does not involve simulating multiple paths of future interest rates or averaging present values across those paths. Therefore, it does not match the method described in Page’s statement. C is incorrect. The binomial interest rate framework uses a binomial tree to model the possible future movements of interest rates and their corresponding effects on bond prices. While it involves some form of simulation and scenario analysis, it is typically more structured, with predetermined up-and-down movements at each node rather than the random sampling approach of the Monte Carlo Method. Hence, it does not fit the method described by Page.", "explhtml": "<p>The method described in Page’s final statement involves simulating 500 paths of interest rates, generating spot rates from these simulated future interest rates, computing cash flows along each interest rate path, and then calculating and averaging the present value across all paths. This process is characteristic of the Monte Carlo Method, which uses random sampling to obtain numerical results and simulate various scenarios, making it particularly useful for valuing complex securities.<\/p><p><b>B is incorrect.<\/b> Bootstrapping is a method used to construct a zero-coupon yield curve (spot rate curve) from the prices of coupon-bearing bonds. This process involves deriving spot rates from the yields of these bonds. Still, it does not involve simulating multiple paths of future interest rates or averaging present values across those paths. Therefore, it does not match the method described in Page’s statement.<\/p><p><b>C is incorrect.<\/b> The binomial interest rate framework uses a binomial tree to model the possible future movements of interest rates and their corresponding effects on bond prices. While it involves some form of simulation and scenario analysis, it is typically more structured, with predetermined up-and-down movements at each node rather than the random sampling approach of the Monte Carlo Method. Hence, it does not fit the method described by Page.<\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(h): describe a Monte Carlo forward-rate simulation and its application.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · John Hagin<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Hagin is a Fixed-Income Fund Manager at Equinox Financial Management Ltd. Jessica Page<\/p><p>is a junior analyst under Hagin&#x27;s supervision. Hagin explains the mechanics of the firm&#x27;s<\/p><p>arbitrage-free valuation framework. Using a fictitious bond traded in three exchanges, shown in<\/p><p>Exhibit 1, Hagin requests Page while ignoring transaction costs to identify the bond&#x27;s arbitrage<\/p><p>opportunity.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0111.webp\" style=\"max-width:min(100%,570px)\" alt=\"Exhibit 1: Three-Year, $100 par, 5.00% Coupon, Annual Option-free Bond Frankfurt Eurex NYSE Euronext Price $109.7972 $109.1932 $108.7665\"><p>Hagin also presents the yield to maturity of a one-year, two-year and three-year Exhibit 2.<\/p><p>Exhibit 2: Yield-to-Maturity Par Rates for One-, Two-, and Three-year Annual <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0112.webp\" style=\"max-width:min(100%,596px)\" alt=\"Pay Option-Free Bonds One –year Two-year Three-year 1.50% 1.65% 1.82%\"><p>Hagin also asks Page which term structure model he should use to determine how interest rates<\/p><p>move. Page makes the following statements,<\/p><p>Statement 1: The CIR model will provide the most accurate modelling of the term structure<\/p><p>observed in the Eurex exchange compared to the Ho-Lee model.<\/p><p>Statement 2: The Vasicek model is an equilibrium term structure model that includes mean<\/p><p>reversion.<\/p><p>Page also states that” to determine how the value of a security is affected, we can simulate 500<\/p><p>paths of interest rates, generate spot rates from the simulated future interest rates, compute the<\/p><p>cash flows along each interest rate path, compute the present value and average present value<\/p><p>across all paths.”<\/p><\/div><\/details><div class=\"qtext\"><p>The method described in Page’s final statement is closely related to:<\/p><\/div>", "subj": "fixed"}, {"n": 69, "q": "Based on Exhibit 1, the likelihood of Suarez finding an arbitrage opportunity is:", "opts": ["Low.", "High based on the principle of value additivity.", "High based on the principle of dominance."], "ans": "C", "expl": "According to the dominance principle, an arbitrage opportunity arises. This principle states that a financial asset with a risk-free future payoff must have a favourable price today. Since assets A and B are risk-free, they should share the same discount rate. However, Asset 1 is priced at  0.923 ($$660500) relative to its payoff, while Asset 2 is priced at 0.909 ($$11,,230200). With its higher implied discount rate of 10% and lower price, Asset 2 is undervalued compared to Asset 1, which has a lower discount rate of 8% and a higher price. The arbitrage strategy here is to sell two units of Asset 1 for $1,200 and purchase one unit of Asset 2. This requires no initial cash outlay, and after one year, the portfolio generates a net cash inflow of  $20($1, 320 − (2 × $650)). A is incorrect. The data indicates an arbitrage opportunity due to the difference in implied discount rates and prices between Asset 1 and Asset 2. Such a discrepancy provides a high likelihood of arbitrage, contradicting the option that suggests a low likelihood. B is incorrect. The principle of value additivity refers to the idea that the value of a portfolio of financial assets is equal to the sum of the values of the individual assets. The situation described relies on the principle of dominance, where one asset is undervalued compared to another, providing an arbitrage opportunity. Value additivity does not explicitly address the undervaluation or overvaluation of individual assets about each other as the dominance principle does.", "explhtml": "<p>According to the dominance principle, an arbitrage opportunity arises. This principle states that a financial asset with a risk-free future payoff must have a favourable price today. Since assets A and B are risk-free, they should share the same discount rate. However, Asset 1 is priced at  0.923 (<sup>$<\/sup><sub>$<\/sub><sup>6<\/sup><sub>6<\/sub><sup>0<\/sup><sub>5<\/sub><sup>0<\/sup><sub>0<\/sub>) relative to its payoff, while Asset 2 is priced at 0.909 (<sup>$<\/sup><sub>$<\/sub><sup>1<\/sup><sub>1<\/sub><sup>,<\/sup><sub>,<\/sub><sup>2<\/sup><sub>3<\/sub><sup>0<\/sup><sub>2<\/sub><sup>0<\/sup><sub>0<\/sub>).<\/p><p>With its higher implied discount rate of 10% and lower price, Asset 2 is undervalued compared to Asset 1, which has a lower discount rate of 8% and a higher price. The arbitrage strategy here is to sell two units of Asset 1 for $1,200 and purchase one unit of Asset 2. This requires no initial cash outlay, and after one year, the portfolio generates a net cash inflow of  $20($1, 320 − (2 × $650)).<\/p><p><b>A is incorrect.<\/b> The data indicates an arbitrage opportunity due to the difference in implied discount rates and prices between Asset 1 and Asset 2. Such a discrepancy provides a high likelihood of arbitrage, contradicting the option that suggests a low likelihood.<\/p><p><b>B is incorrect.<\/b> The principle of value additivity refers to the idea that the value of a portfolio of financial assets is equal to the sum of the values of the individual assets. The situation described relies on the principle of dominance, where one asset is undervalued compared to another, providing an arbitrage opportunity. Value additivity does not explicitly address the undervaluation or overvaluation of individual assets about each other as the dominance principle does.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Arbitrage Free Valuation Framework, LOS 1(c): Calculate the arbitrage-free value of an option-free, fixed-rate coupon bond.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Maxine Suarez<\/summary><div class=\"vig-body\"><p>Maxine Suarez is a senior fixed-income analyst at Madiera Asset Management (MAM). She<\/p><p>supervises Tracy Meng, a junior fixed-income analyst who recently joined the company. Suarez<\/p><p>requests that Meng review the payoff and asset price data presented in Exhibit 1 to determine<\/p><p>whether an arbitrage opportunity exists.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0115.webp\" style=\"max-width:min(100%,416px)\" alt=\"Exhibit 1: Payoffs and Price for Two Risk-Free Assets Asset The payoff in One Year Current Price Asset 1 $650 $600 Asset 2 $1320 $1200\"><p>Suarez also shares with Meng an extract of a bond that trades in three different markets,<\/p><p>presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0116.webp\" style=\"max-width:min(100%,461px)\" alt=\"Exhibit 2: Five-Year Maturity, 3% Coupon Annual Pay Bond Tokyo Frankfurt New York Yield-to Maturity 2.2% 2.4% 1.7%\"><p>Suarez requested Meng to determine the value of two bonds (Bond Q and Bond X) using the<\/p><p>binomial tree presented in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0117.webp\" style=\"max-width:min(100%,470px)\" alt=\"Exhibit 3: Binomial Interest Rate Tree with Volatility of 23% Time 0 Time 1 Time 2 3.872% 3.9964% 1.600% 1.7592% 1.8650% 1.5000%\"><p>Suarez also provides select data on bonds Q and X, presented in Exhibit 4.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0118.webp\" style=\"max-width:min(100%,280px)\" alt=\"Bond Coupon Rate Maturity Bond Q 3.5% 3 years Bond X 4.0% 5 years\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the likelihood of Suarez finding an arbitrage opportunity is:<\/p><\/div>", "subj": "fixed"}, {"n": 70, "q": "Using the data from Exhibit 2, the least profitable arbitrage opportunity an investor can expect is closest to:", "opts": ["Buy in New York and sell in Tokyo.", "Buy in Tokyo and sell in New York.", "Buy in Frankfurt and sell in New York."], "ans": "A", "expl": "To identify the least profitable arbitrage opportunity, we need to consider the bond prices implied by the yield-to-maturity (YTM) rates. The bond prices are inversely related to the YTM; a lower YTM implies a higher bond price, and a higher YTM implies a lower bond price. New York YTM: 1.7% (lowest YTM -> highest bond price) Frankfurt YTM: 2.4% (highest YTM -> lowest bond price) Buying in New York (where the bond price is highest) and selling in Tokyo (where the bond price is lower) offers the least profitable arbitrage opportunity because the price differential between the two markets is smaller than other pairs. B is incorrect. Buying in Tokyo (where the YTM is higher and the bond price is lower) and selling in New York (where the YTM is lower and the bond price is higher). This creates a more significant arbitrage profit than option A, as the price differential between Tokyo and New York is larger. C is incorrect. Buying in Frankfurt (where the YTM is highest and the bond price is lowest) and selling in New York (where the YTM is lowest and the bond price is highest). This creates the most significant arbitrage profit among the options, as the price differential between Frankfurt and New York is the largest.", "explhtml": "<p>To identify the least profitable arbitrage opportunity, we need to consider the bond prices implied by the yield-to-maturity (YTM) rates. The bond prices are inversely related to the YTM; a lower YTM implies a higher bond price, and a higher YTM implies a lower bond price.<\/p><p>New York YTM: 1.7% (lowest YTM -&gt; highest bond price)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0119.webp\" style=\"max-width:min(100%,180px)\" alt=\"Tokyo YTM: 2.2%\"><p>Frankfurt YTM: 2.4% (highest YTM -&gt; lowest bond price)<\/p><p>Buying in New York (where the bond price is highest) and selling in Tokyo (where the bond price is lower) offers the least profitable arbitrage opportunity because the price differential between the two markets is smaller than other pairs.<\/p><p><b>B is incorrect.<\/b> Buying in Tokyo (where the YTM is higher and the bond price is lower) and selling in New York (where the YTM is lower and the bond price is higher). This creates a more significant arbitrage profit than option A, as the price differential between Tokyo and New York is larger.<\/p><p><b>C is incorrect.<\/b> Buying in Frankfurt (where the YTM is highest and the bond price is lowest) and selling in New York (where the YTM is lowest and the bond price is highest). This creates the most significant arbitrage profit among the options, as the price differential between Frankfurt and New York is the largest.<\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(c): Calculate the arbitrage-free value of an option-free, fixed-rate coupon bond.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Maxine Suarez<span class=\"vig-hint\">bấm để x  time 3 is 103.5 (100 par value + 3.5 coupon payment). We calculate the present value of the bond at the lower node of time 1 using backward induction, B is incorrect. It calculates the bond's present value at the upper node of time 1 using backward induction. C is incorrect. It does not match the proper backward induction calculation for the lower node at Time 1. It appears to be a miscalculation or use of an incorrect discount rate. The correct calculation using the proper discount rate yields 101.605, not 98.6782.", "explhtml": "<p>The cash flow at time 3 is 103.5 (100 par value + 3.5 coupon payment). We calculate the present value of the bond at the lower node of time 1 using backward induction,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0120.webp\" style=\"max-width:min(100%,158px)\" alt=\"103.5 = 101.605 1.018650\"><p><b>B is incorrect.<\/b> It calculates the bond&#x27;s present value at the upper node of time 1 using backward induction.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0121.webp\" style=\"max-width:min(100%,158px)\" alt=\"103.5 = 99.5226 1.039964\"><p><b>C is incorrect.<\/b> It does not match the proper backward induction calculation for the lower node at Time 1. It appears to be a miscalculation or use of an incorrect discount rate. The correct calculation using the proper discount rate yields 101.605, not 98.6782.<\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(e): Describe the backward induction valuation methodology and calculate the value of a fixed-income instrument given its cash flow at each node.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Maxine Suarez<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maxine Suarez is a senior fixed-income analyst at Madiera Asset Management (MAM). She<\/p><p>supervises Tracy Meng, a junior fixed-income analyst who recently joined the company. Suarez<\/p><p>requests that Meng review the payoff and asset price data presented in Exhibit 1 to determine<\/p><p>whether an arbitrage opportunity exists.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0115.webp\" style=\"max-width:min(100%,416px)\" alt=\"Exhibit 1: Payoffs and Price for Two Risk-Free Assets Asset The payoff in One Year Current Price Asset 1 $650 $600 Asset 2 $1320 $1200\"><p>Suarez also shares with Meng an extract of a bond that trades in three different markets,<\/p><p>presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0116.webp\" style=\"max-width:min(100%,461px)\" alt=\"Exhibit 2: Five-Year Maturity, 3% Coupon Annual Pay Bond Tokyo Frankfurt New York Yield-to Maturity 2.2% 2.4% 1.7%\"><p>Suarez requested Meng to determine the value of two bonds (Bond Q and Bond X) using the<\/p><p>binomial tree presented in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0117.webp\" style=\"max-width:min(100%,470px)\" alt=\"Exhibit 3: Binomial Interest Rate Tree with Volatility of 23% Time 0 Time 1 Time 2 3.872% 3.9964% 1.600% 1.7592% 1.8650% 1.5000%\"><p>Suarez also provides select data on bonds Q and X, presented in Exhibit 4.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0118.webp\" style=\"max-width:min(100%,280px)\" alt=\"Bond Coupon Rate Maturity Bond Q 3.5% 3 years Bond X 4.0% 5 years\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 3 and 4, Bond Q’s value at the lower node at Time 1 is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 72, "q": "Based on Exhibits 3 and 4, Bond X’s value at the upper node at Time 2 is closest to:", "opts": ["100.1232", "102.4630", "100.0034"], "ans": "A", "expl": "The cash flow at time 5 is 104 (100 par value + 4 coupon payment). We determine the bond's present value at the upper node at Time 2 by applying backward induction. B is incorrect. It calculates the bond's present value at the lower node of time 2. C is incorrect. It calculates the bond's present value at the upper node of time 1", "explhtml": "<p>The cash flow at time 5 is 104 (100 par value + 4 coupon payment). We determine the bond&#x27;s present value at the upper node at Time 2 by applying backward induction.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0122.webp\" style=\"max-width:min(100%,160px)\" alt=\"104 = 100.1232 1.03872\"><p><b>B is incorrect.<\/b> It calculates the bond&#x27;s present value at the lower node of time 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0123.webp\" style=\"max-width:min(100%,160px)\" alt=\"104 = 102.4630 1.01500\"><p><b>C is incorrect.<\/b> It calculates the bond&#x27;s present value at the upper node of time 1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0124.webp\" style=\"max-width:min(100%,169px)\" alt=\"104 = 100.0034 1.039964\"><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(e): Describe the backward induction valuation methodology and calculate the value of a fixed-income instrument given its cash flow at each node.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Maxine Suarez<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maxine Suarez is a senior fixed-income analyst at Madiera Asset Management (MAM). She<\/p><p>supervises Tracy Meng, a junior fixed-income analyst who recently joined the company. Suarez<\/p><p>requests that Meng review the payoff and asset price data presented in Exhibit 1 to determine<\/p><p>whether an arbitrage opportunity exists.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0115.webp\" style=\"max-width:min(100%,416px)\" alt=\"Exhibit 1: Payoffs and Price for Two Risk-Free Assets Asset The payoff in One Year Current Price Asset 1 $650 $600 Asset 2 $1320 $1200\"><p>Suarez also shares with Meng an extract of a bond that trades in three different markets,<\/p><p>presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0116.webp\" style=\"max-width:min(100%,461px)\" alt=\"Exhibit 2: Five-Year Maturity, 3% Coupon Annual Pay Bond Tokyo Frankfurt New York Yield-to Maturity 2.2% 2.4% 1.7%\"><p>Suarez requested Meng to determine the value of two bonds (Bond Q and Bond X) using the<\/p><p>binomial tree presented in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0117.webp\" style=\"max-width:min(100%,470px)\" alt=\"Exhibit 3: Binomial Interest Rate Tree with Volatility of 23% Time 0 Time 1 Time 2 3.872% 3.9964% 1.600% 1.7592% 1.8650% 1.5000%\"><p>Suarez also provides select data on bonds Q and X, presented in Exhibit 4.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0118.webp\" style=\"max-width:min(100%,280px)\" alt=\"Bond Coupon Rate Maturity Bond Q 3.5% 3 years Bond X 4.0% 5 years\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 3 and 4, Bond X’s value at the upper node at Time 2 is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 73, "q": "Pasqualone is incorrect regarding the statement:", "opts": ["Statement 1", "Statement 2", "Statement 3"], "ans": "B", "expl": "Pasqualone is incorrect in this statement because a bond’s value determined using a binomial interest rate tree should not differ from the value obtained by discounting the bond’s cash flows using current spot rates, assuming that the interest rate tree is calibrated correctly. A properly calibrated binomial interest rate tree matches current market spot rates, ensuring that the valuation aligns with the present value of discounted cash flows. If the bond values differ, it suggests either a miscalibration of the tree or incorrect assumptions. A is incorrect. To construct a binomial interest rate tree, it is indeed necessary to have: 1. Current benchmark interest rates to serve as a baseline. 2. An assumption about interest rate volatility to determine the range of potential future rates. 3. A defined process for how interest rates move to establish the tree's branching structure. This statement is correct because these are essential for accurately modeling future interest rate paths. C is incorrect. Interest rate volatility in a binomial tree can indeed be estimated using two valid approaches: 1. Historical volatility data, which reflects past interest rate behaviour. 2. Market prices of interest rate derivatives, such as caps, floors, or swaptions, provide implied volatility based on current market conditions.", "explhtml": "<p>Pasqualone is incorrect in this statement because a bond’s value determined using a binomial interest rate tree should not differ from the value obtained by discounting the bond’s cash flows using current spot rates, assuming that the interest rate tree is calibrated correctly.<\/p><p>A properly calibrated binomial interest rate tree matches current market spot rates, ensuring that the valuation aligns with the present value of discounted cash flows. If the bond values differ, it suggests either a miscalibration of the tree or incorrect assumptions.<\/p><p><b>A is incorrect.<\/b> To construct a binomial interest rate tree, it is indeed necessary to have:<\/p><p>1. Current benchmark interest rates to serve as a baseline. 2. An assumption about interest rate volatility to determine the range of potential future<\/p><p>rates.<\/p><p>3. A defined process for how interest rates move to establish the tree&#x27;s branching structure.<\/p><p>This statement is correct because these are essential for accurately modeling future interest rate paths.<\/p><p><b>C is incorrect.<\/b><\/p><p>Interest rate volatility in a binomial tree can indeed be estimated using two valid approaches:<\/p><p>1. <b>Historical volatility data,<\/b> which reflects past interest rate behaviour. 2. <b>Market prices of interest rate derivatives,<\/b> such as caps, floors, or swaptions, provide<\/p><p>implied volatility based on current market conditions.<\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(e): Describe the backward induction valuation methodology and calculate the value of a fixed-income instrument given its cash flow at each node.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Vito Pasqualone<\/summary><div class=\"vig-body\"><p>Vito Pasqualone is a Fund Manager at Vito Asset Management Ltd (VAM). Sylvia Scarletta is a<\/p><p>fixed-income analyst who recently joined the company. Pasqualone and Scarletta for lunch and<\/p><p>discuss the conditions underlying binomial interest rates. Pasqualone makes the following<\/p><p>statements:<\/p><p>Statement 1: To create a binomial interest rate tree, it is essential to have the following: current<\/p><p>benchmark interest rates, an assumption about interest rate volatility, and a defined process for<\/p><p>interest rate movements. These elements are crucial for accurately modeling future interest rate<\/p><p>paths and valuing interest rate-sensitive securities.<\/p><p>Statement 2: A bond&#x27;s value, determined using a binomial interest rate tree with a relatively high<\/p><p>volatility assumption, will differ from the value obtained by discounting the bond’s cash flows<\/p><p>using current spot rates.<\/p><p>Statement 3: Interest rate volatility in a binomial interest rate tree can be estimated using<\/p><p>historical interest rate volatility data or market prices observed from interest rate derivatives.<\/p><p>After lunch, Pasqualone presents Scarletta with data for a binomial interest rate tree and<\/p><p>calibrations of the binomial interest rate tree shown in exhibits 1 and 2, respectively. He asks<\/p><p>Scarletta to begin calibrating a binomial interest rate tree by first calculating the implied<\/p><p>forward rates using data presented in Exhibits 1 and 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0125.webp\" style=\"max-width:min(100%,559px)\" alt=\"Exhibit 1: Selected Binomial Interest Rate Tree Data Maturity Spot Rate Par Rate 1 3.6000% 3.6000% 2 4.7234% 4.7000% Exhibit 2: Binomial Interest Rate Tree Calibration with Volatility = 30% Time 0 Time 1 6.7836% 3.500% Lower one-period forward rate\"><p>Pasqualone enquires about the benefits of using the Monte Carlo simulation method to simulate<\/p><p>many potential interest rate paths to determine the value of a bond. Scarletta makes the following comments in response:<\/p><p>Comment 1: A Monte Carlo simulation will more accurately determine the bond&#x27;s value,<\/p><p>reflecting its actual fundamental value.<\/p><p>Comment 2: Enhancing the number of paths improves the statistical accuracy of the estimate.<\/p><p>Finally, Pasqualone asks Scarletta which term structure model is calibrated to the current term<\/p><p>structure.<\/p><\/div><\/details><div class=\"qtext\"><p>Pasqualone is incorrect regarding the statement:<\/p><\/div>", "subj": "fixed"}, {"n": 74, "q": "Using Date from Exhibit 1 and 2, the value of the lower one-period forward rate is closest to:", "opts": ["6.7836 %", "4.7234 %", "3.7229 %"], "ans": "C", "expl": "The lower one-period forward rate is calculated by multiplying e−2σ by the higher one-period forward rate of 6.7836%, A is incorrect. 6.7836% represents the higher one-period forward rate at Time 1, not the lower one-period forward rate. The problem specifically asks for a lower rate, which requires the adjustment by  B is incorrect. 4.7234% is the 2-year spot rate shown in Exhibit 1, not the lower one-period forward rate. The lower one-period forward rate is derived from the higher one-period forward rate and the volatility, not directly from the spot rates.", "explhtml": "<p>The lower one-period forward rate is calculated by multiplying e<sup>−2σ<\/sup> by the higher one-period forward rate of 6.7836%,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0126.webp\" style=\"max-width:min(100%,319px)\" alt=\"0.067836 × e−0.6 = 0.037229 = 3.7229%\"><p><b>A is incorrect.<\/b><\/p><p>6.7836% represents the higher one-period forward rate at Time 1, not the lower one-period forward rate. The problem specifically asks for a lower rate, which requires the adjustment by <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0127.webp\" style=\"max-width:min(100%,750px)\" alt=\"e−2σ .\"><p><b>B is incorrect.<\/b><\/p><p>4.7234% is the 2-year spot rate shown in Exhibit 1, not the lower one-period forward rate. The lower one-period forward rate is derived from the higher one-period forward rate and the volatility, not directly from the spot rates.<\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(g): Describe pathwise valuation in a binomial interest rate framework and calculate the value of a fixed-income instrument given its cash flows along each path.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Vito Pasqualone<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Vito Pasqualone is a Fund Manager at Vito Asset Management Ltd (VAM). Sylvia Scarletta is a<\/p><p>fixed-income analyst who recently joined the company. Pasqualone and Scarletta for lunch and<\/p><p>discuss the conditions underlying binomial interest rates. Pasqualone makes the following<\/p><p>statements:<\/p><p>Statement 1: To create a binomial interest rate tree, it is essential to have the following: current<\/p><p>benchmark interest rates, an assumption about interest rate volatility, and a defined process for<\/p><p>interest rate movements. These elements are crucial for accurately modeling future interest rate<\/p><p>paths and valuing interest rate-sensitive securities.<\/p><p>Statement 2: A bond&#x27;s value, determined using a binomial interest rate tree with a relatively high<\/p><p>volatility assumption, will differ from the value obtained by discounting the bond’s cash flows<\/p><p>using current spot rates.<\/p><p>Statement 3: Interest rate volatility in a binomial interest rate tree can be estimated using<\/p><p>historical interest rate volatility data or market prices observed from interest rate derivatives.<\/p><p>After lunch, Pasqualone presents Scarletta with data for a binomial interest rate tree and<\/p><p>calibrations of the binomial interest rate tree shown in exhibits 1 and 2, respectively. He asks<\/p><p>Scarletta to begin calibrating a binomial interest rate tree by first calculating the implied<\/p><p>forward rates using data presented in Exhibits 1 and 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0125.webp\" style=\"max-width:min(100%,559px)\" alt=\"Exhibit 1: Selected Binomial Interest Rate Tree Data Maturity Spot Rate Par Rate 1 3.6000% 3.6000% 2 4.7234% 4.7000% Exhibit 2: Binomial Interest Rate Tree Calibration with Volatility = 30% Time 0 Time 1 6.7836% 3.500% Lower one-period forward rate\"><p>Pasqualone enquires about the benefits of using the Monte Carlo simulation method to simulate<\/p><p>many potential interest rate paths to determine the value of a bond. Scarletta makes the following comments in response:<\/p><p>Comment 1: A Monte Carlo simulation will more accurately determine the bond&#x27;s value,<\/p><p>reflecting its actual fundamental value.<\/p><p>Comment 2: Enhancing the number of paths improves the statistical accuracy of the estimate.<\/p><p>Finally, Pasqualone asks Scarletta which term structure model is calibrated to the current term<\/p><p>structure.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Date from Exhibit 1 and 2, the value of the lower one-period forward rate is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 75, "q": "Which of the comments regarding Monte Carlo simulation is incorrect ?", "opts": ["Only Comment 1.", "Only Comment 2", "Both Comments 1 and 2."], "ans": "A", "expl": "Monte Carlo simulations generate a distribution of possible values based on probabilistic assumptions, not a single \"actual fundamental value.\" The method estimates a range of outcomes, not a precise intrinsic value. B is incorrect. Increasing the number of paths reduces sampling error and improves the reliability of the estimate, aligning with statistical principles. C is incorrect. As explained, Comment 2 is accurate regarding improving statistical accuracy with an increased number of paths. Hence, not both comments are incorrect—only Comment 1 has inaccuracies.", "explhtml": "<p>Monte Carlo simulations generate a distribution of possible values based on probabilistic assumptions, not a single &quot;actual fundamental value.&quot; The method estimates a range of outcomes, not a precise intrinsic value.<\/p><p><b>B is incorrect.<\/b> Increasing the number of paths reduces sampling error and improves the reliability of the estimate, aligning with statistical principles.<\/p><p><b>C is incorrect.<\/b> As explained, Comment 2 is accurate regarding improving statistical accuracy with an increased number of paths. Hence, not both comments are incorrect—only Comment 1 has inaccuracies.<\/p><p class=\"los\">CFA Level II, Study session 11, Learning Module 29: The Arbitrage Free Valuation Framework, LOS 29(h): Describe a Monte Carlo forward-rate simulation and its application.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Vito Pasqualone<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Vito Pasqualone is a Fund Manager at Vito Asset Management Ltd (VAM). Sylvia Scarletta is a<\/p><p>fixed-income analyst who recently joined the company. Pasqualone and Scarletta for lunch and<\/p><p>discuss the conditions underlying binomial interest rates. Pasqualone makes the following<\/p><p>statements:<\/p><p>Statement 1: To create a binomial interest rate tree, it is essential to have the following: current<\/p><p>benchmark interest rates, an assumption about interest rate volatility, and a defined process for<\/p><p>interest rate movements. These elements are crucial for accurately modeling future interest rate<\/p><p>paths and valuing interest rate-sensitive securities.<\/p><p>Statement 2: A bond&#x27;s value, determined using a binomial interest rate tree with a relatively high<\/p><p>volatility assumption, will differ from the value obtained by discounting the bond’s cash flows<\/p><p>using current spot rates.<\/p><p>Statement 3: Interest rate volatility in a binomial interest rate tree can be estimated using<\/p><p>historical interest rate volatility data or market prices observed from interest rate derivatives.<\/p><p>After lunch, Pasqualone presents Scarletta with data for a binomial interest rate tree and<\/p><p>calibrations of the binomial interest rate tree shown in exhibits 1 and 2, respectively. He asks<\/p><p>Scarletta to begin calibrating a binomial interest rate tree by first calculating the implied<\/p><p>forward rates using data presented in Exhibits 1 and 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0125.webp\" style=\"max-width:min(100%,559px)\" alt=\"Exhibit 1: Selected Binomial Interest Rate Tree Data Maturity Spot Rate Par Rate 1 3.6000% 3.6000% 2 4.7234% 4.7000% Exhibit 2: Binomial Interest Rate Tree Calibration with Volatility = 30% Time 0 Time 1 6.7836% 3.500% Lower one-period forward rate\"><p>Pasqualone enquires about the benefits of using the Monte Carlo simulation method to simulate<\/p><p>many potential interest rate paths to determine the value of a bond. Scarletta makes the following comments in response:<\/p><p>Comment 1: A Monte Carlo simulation will more accurately determine the bond&#x27;s value,<\/p><p>reflecting its actual fundamental value.<\/p><p>Comment 2: Enhancing the number of paths improves the statistical accuracy of the estimate.<\/p><p>Finally, Pasqualone asks Scarletta which term structure model is calibrated to the current term<\/p><p>structure.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the comments regarding Monte Carlo simulation is incorrect ?<\/p><\/div>", "subj": "fixed"}, {"n": 76, "q": "The response that Scarletta is likely to give Pasqualone regarding term structure models is closest to:", "opts": ["Ho-Lee model", "CIR model", "Vasicek Model."], "ans": "A", "expl": "The Ho-Lee model is an arbitrage-free term structure model explicitly calibrated to match the current term structure of interest rates. This means it ensures that the prices of bonds implied by the model align with observed market prices. The Ho-Lee model achieves this by allowing for deterministic adjustments to the drift term, ensuring consistency with the current yield curve. B is incorrect. The CIR model is an equilibrium model. While it describes interest rate dynamics and helps model mean-reverting processes, it is not directly calibrated to the current term structure. Instead, it is based on assumptions about economic factors and generates a theoretical yield curve rather than aligning with the observed one. C is incorrect. The Vasicek model is also an equilibrium model like the CIR model. While mathematically more straightforward than the CIR model, it similarly does not calibrate to the current term structure. Instead, it assumes constant parameters to model interest rate movements and provides a theoretical yield curve.", "explhtml": "<p>The <b>Ho-Lee model<\/b> is an arbitrage-free term structure model explicitly calibrated to match the current term structure of interest rates. This means it ensures that the prices of bonds implied by the model align with observed market prices. The Ho-Lee model achieves this by allowing for deterministic adjustments to the drift term, ensuring consistency with the current yield curve.<\/p><p><b>B is incorrect.<\/b> The CIR model is an equilibrium model. While it describes interest rate dynamics and helps model mean-reverting processes, it is not directly calibrated to the current term structure. Instead, it is based on assumptions about economic factors and generates a theoretical yield curve rather than aligning with the observed one.<\/p><p><b>C is incorrect.<\/b> The Vasicek model is also an equilibrium model like the CIR model. While mathematically more straightforward than the CIR model, it similarly does not calibrate to the current term structure. Instead, it assumes constant parameters to model interest rate movements and provides a theoretical yield curve.<\/p><p class=\"los\">CFA Level II, Study session 11, Learning Module 29: The Arbitrage Free Valuation Framework, LOS 29(i): Describe term structure models and their use.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Vito Pasqualone<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Vito Pasqualone is a Fund Manager at Vito Asset Management Ltd (VAM). Sylvia Scarletta is a<\/p><p>fixed-income analyst who recently joined the company. Pasqualone and Scarletta for lunch and<\/p><p>discuss the conditions underlying binomial interest rates. Pasqualone makes the following<\/p><p>statements:<\/p><p>Statement 1: To create a binomial interest rate tree, it is essential to have the following: current<\/p><p>benchmark interest rates, an assumption about interest rate volatility, and a defined process for<\/p><p>interest rate movements. These elements are crucial for accurately modeling future interest rate<\/p><p>paths and valuing interest rate-sensitive securities.<\/p><p>Statement 2: A bond&#x27;s value, determined using a binomial interest rate tree with a relatively high<\/p><p>volatility assumption, will differ from the value obtained by discounting the bond’s cash flows<\/p><p>using current spot rates.<\/p><p>Statement 3: Interest rate volatility in a binomial interest rate tree can be estimated using<\/p><p>historical interest rate volatility data or market prices observed from interest rate derivatives.<\/p><p>After lunch, Pasqualone presents Scarletta with data for a binomial interest rate tree and<\/p><p>calibrations of the binomial interest rate tree shown in exhibits 1 and 2, respectively. He asks<\/p><p>Scarletta to begin calibrating a binomial interest rate tree by first calculating the implied<\/p><p>forward rates using data presented in Exhibits 1 and 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0125.webp\" style=\"max-width:min(100%,559px)\" alt=\"Exhibit 1: Selected Binomial Interest Rate Tree Data Maturity Spot Rate Par Rate 1 3.6000% 3.6000% 2 4.7234% 4.7000% Exhibit 2: Binomial Interest Rate Tree Calibration with Volatility = 30% Time 0 Time 1 6.7836% 3.500% Lower one-period forward rate\"><p>Pasqualone enquires about the benefits of using the Monte Carlo simulation method to simulate<\/p><p>many potential interest rate paths to determine the value of a bond. Scarletta makes the following comments in response:<\/p><p>Comment 1: A Monte Carlo simulation will more accurately determine the bond&#x27;s value,<\/p><p>reflecting its actual fundamental value.<\/p><p>Comment 2: Enhancing the number of paths improves the statistical accuracy of the estimate.<\/p><p>Finally, Pasqualone asks Scarletta which term structure model is calibrated to the current term<\/p><p>structure.<\/p><\/div><\/details><div class=\"qtext\"><p>The response that Scarletta is likely to give Pasqualone regarding term structure models is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 77, "q": "The put feature of Bond A is best described as:", "opts": ["American style.", "Bermuda style.", "European style."], "ans": "B", "expl": "A Bermuda-style option can be exercised on specific predetermined dates before expiration. Bond A is putable at par on 1 September 20X2 and 1 September 20X3. This means the bondholder has the right to exercise the put option on these specific dates, aligning perfectly with the characteristics of a Bermuda option. A is incorrect. An American-style option allows the holder to exercise it at any point from the start date up until the expiration date. Bond A can only be put back (or exercised) on specific dates (1 September 20X2 and 1 September 20X3). Since it cannot be exercised at any time up to maturity, it does not fit the definition of an American-style option. C is incorrect. A European-style option can be exercised solely on the expiration date. Bond A allows the holder to exercise the option on two specific dates (1 September 20X2 and 1 September 20X3), which does not match European-style options' single exercise date feature.", "explhtml": "<p>A Bermuda-style option can be exercised on specific predetermined dates before expiration. Bond A is putable at par on 1 September 20X2 and 1 September 20X3. This means the bondholder has the right to exercise the put option on these specific dates, aligning perfectly with the characteristics of a Bermuda option.<\/p><p><b>A is incorrect.<\/b> An American-style option allows the holder to exercise it at any point from the start date up until the expiration date. Bond A can only be put back (or exercised) on specific dates (1 September 20X2 and 1 September 20X3). Since it cannot be exercised at any time up to maturity, it does not fit the definition of an American-style option.<\/p><p><b>C is incorrect.<\/b> A European-style option can be exercised solely on the expiration date. Bond A allows the holder to exercise the option on two specific dates (1 September 20X2 and 1 September 20X3), which does not match European-style options&#x27; single exercise date feature.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(d): Explain how interest rate volatility affects the value of a callable or putable bond.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Marcus Muller<\/summary><div class=\"vig-body\"><p>Marcus Muller is a senior analyst at Konstatinov Investment Management (KIM), an investment<\/p><p>firm specialising in fixed-income trading. On September 1st, 20X1, Muller reviewed three fixed-<\/p><p>rate bonds issued by Sentry Ltd, a local firm. The data on the bonds is presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0128.webp\" style=\"max-width:min(100%,656px)\" alt=\"Exhibit 1: Fixed-Rate Bonds Issued by Sentry Ltd. Bond Type of Bond Coupon Maturity Par Rate Bond A Putable at par on 1 5.5% annual 1 September 20X4 1 Year = 3.55% September 20X2 and 1 September 20X3 Bond B Option-free 5.5% annual 1 September 20X4 2 Year = 3.75% Bond C Callable at par on 1 5.5% annu\"><p>On 23 September 20X1, Muller analysed the convertible bond issued by Sentry Ltd, as shown in<\/p><p>Exhibit 2. On the same day, the option-free value of Sentry’s stock price was £45.67, and the<\/p><p>convertible bond was £2,260.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0129.webp\" style=\"max-width:min(100%,391px)\" alt=\"Exhibit 2: Convertible Bond Issued by Sentry Ltd. Issue Date 10 November 20X1 Conversion Ratio 28 Coupon Rate 3% Maturity Date 10 November 20X1 Issue Price £1, 000\"><\/div><\/details><div class=\"qtext\"><p>The put feature of Bond A is best described as:<\/p><\/div>", "subj": "fixed"}, {"n": 78, "q": "An increase in interest rates would most likely result in:", "opts": ["An increase in the effective duration of Bond A.", "Bond A having more upside potential than Bond C.", "A change in effective convexity of Bond C from negative to positive."], "ans": "B", "expl": "Bond A is a putable bond. The put option is held by the bondholder, providing a floor for the bond's price (at par) when interest rates rise. This feature protects the investor, but it does not cap the bond's price appreciation when interest rates fall. Therefore, it retains significant upside potential. Bond C is a callable bond. The call option is held by the issuer, which caps the bond's price appreciation (at par) when interest rates fall. The issuer is likely to call the bond to refinance at a lower rate, limiting the upside for the bondholder. A is incorrect. As explained above, an increase in interest rates would decrease the effective duration of the putable Bond A, not increase it. C is incorrect. While the negative convexity of a callable bond like Bond C becomes less pronounced as interest rates rise and the call option moves out-of-the-money, its effective convexity does not typically switch from negative to positive. It remains negative, though to a lesser degree.", "explhtml": "<p>Bond A is a putable bond. The put option is held by the bondholder, providing a floor for the bond&#x27;s price (at par) when interest rates rise. This feature protects the investor, but it does not cap the bond&#x27;s price appreciation when interest rates fall. Therefore, it retains significant upside potential. Bond C is a callable bond. The call option is held by the issuer, which caps the bond&#x27;s price appreciation (at par) when interest rates fall. The issuer is likely to call the bond to refinance at a lower rate, limiting the upside for the bondholder.<\/p><p><b>A is incorrect.<\/b> As explained above, an increase in interest rates would decrease the effective duration of the putable Bond A, not increase it.<\/p><p><b>C is incorrect.<\/b> While the negative convexity of a callable bond like Bond C becomes less pronounced as interest rates rise and the call option moves out-of-the-money, its effective convexity does not typically switch from negative to positive. It remains negative, though to a lesser degree.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(d): Explain how interest rate volatility affects the value of a callable or putable bond.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Marcus Muller<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marcus Muller is a senior analyst at Konstatinov Investment Management (KIM), an investment<\/p><p>firm specialising in fixed-income trading. On September 1st, 20X1, Muller reviewed three fixed-<\/p><p>rate bonds issued by Sentry Ltd, a local firm. The data on the bonds is presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0128.webp\" style=\"max-width:min(100%,656px)\" alt=\"Exhibit 1: Fixed-Rate Bonds Issued by Sentry Ltd. Bond Type of Bond Coupon Maturity Par Rate Bond A Putable at par on 1 5.5% annual 1 September 20X4 1 Year = 3.55% September 20X2 and 1 September 20X3 Bond B Option-free 5.5% annual 1 September 20X4 2 Year = 3.75% Bond C Callable at par on 1 5.5% annu\"><p>On 23 September 20X1, Muller analysed the convertible bond issued by Sentry Ltd, as shown in<\/p><p>Exhibit 2. On the same day, the option-free value of Sentry’s stock price was £45.67, and the<\/p><p>convertible bond was £2,260.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0129.webp\" style=\"max-width:min(100%,391px)\" alt=\"Exhibit 2: Convertible Bond Issued by Sentry Ltd. Issue Date 10 November 20X1 Conversion Ratio 28 Coupon Rate 3% Maturity Date 10 November 20X1 Issue Price £1, 000\"><\/div><\/details><div class=\"qtext\"><p>An increase in interest rates would most likely result in:<\/p><\/div>", "subj": "fixed"}, {"n": 79, "q": "The bond most likely to shield investors from a substantial rise in interest rates is:", "opts": ["Bond A", "Bond B", "Bond C"], "ans": "A", "expl": "Bond A is putable, meaning investors have the option to sell the bond back to the issuer at par on specified dates (1 September 20X2 and 1 September 20X3). If interest rates rise significantly, the bondholder can exercise this put option and reinvest the proceeds at the higher prevailing rates. This feature protects rising interest rates, making Bond A the correct answer. B is incorrect. Bond B is an option-free bond, which means it does not have any special features like put or call options. If interest rates rise significantly, the price of Bond B will decline, and investors will have no protection against this adverse effect. This makes Bond B less protective against rising interest rates than Bond A. C is incorrect. Bond C has a callable feature, allowing the issuer to redeem the bond before its maturity on predetermined dates (1 September 20X2 and 1 September 20X3). With rising interest rates, the issuer is less likely to exercise this call option, exposing investors to the same downside risk as a bond without any special features. This callable feature does not protect rising interest rates and can limit the bond's price appreciation if rates fall.", "explhtml": "<p>Bond A is putable, meaning investors have the option to sell the bond back to the issuer at par on specified dates (1 September 20X2 and 1 September 20X3). If interest rates rise significantly, the bondholder can exercise this put option and reinvest the proceeds at the higher prevailing rates. This feature protects rising interest rates, making Bond A the correct answer.<\/p><p><b>B is incorrect.<\/b> Bond B is an option-free bond, which means it does not have any special features like put or call options. If interest rates rise significantly, the price of Bond B will decline, and investors will have no protection against this adverse effect. This makes Bond B less protective against rising interest rates than Bond A.<\/p><p><b>C is incorrect.<\/b> Bond C has a callable feature, allowing the issuer to redeem the bond before its maturity on predetermined dates (1 September 20X2 and 1 September 20X3). With rising interest rates, the issuer is less likely to exercise this call option, exposing investors to the same downside risk as a bond without any special features. This callable feature does not protect rising interest rates and can limit the bond&#x27;s price appreciation if rates fall.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(d): Explain how interest rate volatility affects the value of a callable or putable bond.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Marcus Muller<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marcus Muller is a senior analyst at Konstatinov Investment Management (KIM), an investment<\/p><p>firm specialising in fixed-income trading. On September 1st, 20X1, Muller reviewed three fixed-<\/p><p>rate bonds issued by Sentry Ltd, a local firm. The data on the bonds is presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0128.webp\" style=\"max-width:min(100%,656px)\" alt=\"Exhibit 1: Fixed-Rate Bonds Issued by Sentry Ltd. Bond Type of Bond Coupon Maturity Par Rate Bond A Putable at par on 1 5.5% annual 1 September 20X4 1 Year = 3.55% September 20X2 and 1 September 20X3 Bond B Option-free 5.5% annual 1 September 20X4 2 Year = 3.75% Bond C Callable at par on 1 5.5% annu\"><p>On 23 September 20X1, Muller analysed the convertible bond issued by Sentry Ltd, as shown in<\/p><p>Exhibit 2. On the same day, the option-free value of Sentry’s stock price was £45.67, and the<\/p><p>convertible bond was £2,260.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0129.webp\" style=\"max-width:min(100%,391px)\" alt=\"Exhibit 2: Convertible Bond Issued by Sentry Ltd. Issue Date 10 November 20X1 Conversion Ratio 28 Coupon Rate 3% Maturity Date 10 November 20X1 Issue Price £1, 000\"><\/div><\/details><div class=\"qtext\"><p>The bond most likely to shield investors from a substantial rise in interest rates is:<\/p><\/div>", "subj": "fixed"}, {"n": 80, "q": "The conversion price of the bond in Exhibit 2 is most likely:", "opts": ["£ 28.00", "£ 34.32", "£ 35.71"], "ans": "C", "expl": "The conversion price is converted by dividing the par value of £ 1,000 by the conversion ratio of 28. A and B are incorrect. It does not align with the formula for calculating the conversion price. The par value of £1,000 divided by the conversion ratio of 28 does not equal £28.00. When dividing the par value of £1,000 by the conversion ratio of 28, the result is £35.71, not £34.32.", "explhtml": "<p>The conversion price is converted by dividing the par value of £ 1,000 by the conversion ratio of 28.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0130.webp\" style=\"max-width:min(100%,119px)\" alt=\"1000 = £35.71 28\"><p><b>A and B are incorrect.<\/b> It does not align with the formula for calculating the conversion price. The par value of £1,000 divided by the conversion ratio of 28 does not equal £28.00. When dividing the par value of £1,000 by the conversion ratio of 28, the result is £35.71, not £34.32.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(d): Explain how interest rate volatility affects the value of a callable or putable bond.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Marcus Muller<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marcus Muller is a senior analyst at Konstatinov Investment Management (KIM), an investment<\/p><p>firm specialising in fixed-income trading. On September 1st, 20X1, Muller reviewed three fixed-<\/p><p>rate bonds issued by Sentry Ltd, a local firm. The data on the bonds is presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0128.webp\" style=\"max-width:min(100%,656px)\" alt=\"Exhibit 1: Fixed-Rate Bonds Issued by Sentry Ltd. Bond Type of Bond Coupon Maturity Par Rate Bond A Putable at par on 1 5.5% annual 1 September 20X4 1 Year = 3.55% September 20X2 and 1 September 20X3 Bond B Option-free 5.5% annual 1 September 20X4 2 Year = 3.75% Bond C Callable at par on 1 5.5% annu\"><p>On 23 September 20X1, Muller analysed the convertible bond issued by Sentry Ltd, as shown in<\/p><p>Exhibit 2. On the same day, the option-free value of Sentry’s stock price was £45.67, and the<\/p><p>convertible bond was £2,260.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0129.webp\" style=\"max-width:min(100%,391px)\" alt=\"Exhibit 2: Convertible Bond Issued by Sentry Ltd. Issue Date 10 November 20X1 Conversion Ratio 28 Coupon Rate 3% Maturity Date 10 November 20X1 Issue Price £1, 000\"><\/div><\/details><div class=\"qtext\"><p>The conversion price of the bond in Exhibit 2 is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 81, "q": "Using the information in Exhibits 1 and 2, Bond X’s embedded option value is closest to", "opts": ["$ 0.61", "$0.00", "$ 0.70"], "ans": "A", "expl": "Since Bond X is a callable bond, the value of a call option = Straight bond value - Callable bond value. The value of an option-free bond with a 2.56% coupon using spot rates is The value of a callable bond at par, without any call protection, is $100. The call option value is B and C are incorrect. It incorrectly uses the Par rates instead of the spot rates. The value of a callable bond at par, without any call protection, is $100. The call option value is", "explhtml": "<p>Since Bond X is a callable bond, the value of a call option = Straight bond value - Callable bond value.<\/p><p>The value of an option-free bond with a 2.56% coupon using spot rates is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0132.webp\" style=\"max-width:min(100%,289px)\" alt=\"$2.56 $2.56 $102.56 + + = $100.61 1.021 1.02322 1.023513\"><p>The value of a callable bond at par, without any call protection, is $100. The call option value is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0133.webp\" style=\"max-width:min(100%,195px)\" alt=\"$100.61 −$100 = $0.61\"><p><b>B and C are incorrect.<\/b><\/p><p>It incorrectly uses the Par rates instead of the spot rates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0134.webp\" style=\"max-width:min(100%,457px)\" alt=\"$2.56 $2.56 $102.56 + + = 2.51 + 2.45 + 95.74 = $100.7 1.021 1.023022 1.023213\"><p>The value of a callable bond at par, without any call protection, is $100. The call option value is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0135.webp\" style=\"max-width:min(100%,178px)\" alt=\"$100.7−$100 = $0.7\"><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(b): Explain the relationships between the values of a callable or putable bond, the underlying option free (straight) bond, and the embedded option.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Paul Whitman<\/summary><div class=\"vig-body\"><p>Paul Whitman is an investment adviser working for Oxidane Investment Group. One of his clients<\/p><p>is Clive Smith, who is about to retire and wants to change her portfolio. Whitman sets up a<\/p><p>meeting to discuss this. During the meeting, Smith says, “The outlook of the domestic economy<\/p><p>has been deteriorating, which has affected the equity market. I want to increase my fixed-income<\/p><p>investment and reduce my equity exposure in my portfolio.”<\/p><p>Smith adds,” I prefer investment-grade corporate bonds over government bonds since the<\/p><p>government yields have been low. Economists forecast that the yields will continue to decline<\/p><p>due to negative GDP growth and low employment rate over the last three quarters.” Whitman<\/p><p>prepares one-year forward rates and spot and par rates, which he presents in Exhibit 1. He also<\/p><p>suggests three fixed-rate investment-grade bonds issued by Saxon Group that are being<\/p><p>considered for investment, which data is presented in Exhibit 2.<\/p><p>Exhibit 1: One-Year Forward, Spot and Par Rates (annual coupon payments)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0131.webp\" style=\"max-width:min(100%,481px)\" alt=\"Maturity One-Year Forward Spot Rate Par Rate  1 Year 2.000% 2.000% 2.000% 2 Years 2.502% 2.320% 2.302% 3 Years 2.453% 2.351% 2.321% Exhibit 2: Fixed-Rate Bonds of Saxon Group Bond Bond Type Annual Coupon Bond X Callable Bond: callable at par 2.56% with no protection periods  currently trading at $10\"><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibits 1 and 2, Bond X’s embedded option value is closest to<\/p><\/div>", "subj": "fixed"}, {"n": 82, "q": "Using Exhibit 2 and assuming that Smith’s equity markets outlook and economic forecasts are validated, the bond whose options are most likely to be exercised?", "opts": ["Bond X", "Bond Y", "Bond Z"], "ans": "A", "expl": "If the central bank's actions result in lower interest rates, the yields on Saxon's bonds will likely decline. The call option will become valuable if the yield to maturity on Bond X (which is callable) drops below the 2.56% coupon rate. Consequently, Saxon might choose to call the bond since it would be financially advantageous. B is incorrect. Bond Y is a putable bond, which means the bondholder has the right to put (sell) the bond back to the issuer at specific times. Since Smith's forecast includes lower interest rates, bondholders are less likely to exercise this option because it would not be financially beneficial. If interest rates fall, the value of the bond increases, so investors would rather keep the bond than sell it back at par value. C is incorrect. Bond Z is a convertible bond, which means it can be converted into a specified number of shares of the issuing company’s stock. The decision to exercise this option depends on the stock's performance relative to the bond. Since Bond Z is currently trading \"on the money,\" the central bank's actions resulting in lower interest rates would not necessarily lead to the options being exercised. The bondholder's decision will hinge more on the company's stock performance than interest rate changes.", "explhtml": "<p>If the central bank&#x27;s actions result in lower interest rates, the yields on Saxon&#x27;s bonds will likely decline. The call option will become valuable if the yield to maturity on Bond X (which is callable) drops below the 2.56% coupon rate. Consequently, Saxon might choose to call the bond since it would be financially advantageous.<\/p><p><b>B is incorrect.<\/b> Bond Y is a putable bond, which means the bondholder has the right to put (sell) the bond back to the issuer at specific times. Since Smith&#x27;s forecast includes lower interest rates, bondholders are less likely to exercise this option because it would not be financially beneficial. If interest rates fall, the value of the bond increases, so investors would rather keep the bond than sell it back at par value.<\/p><p><b>C is incorrect.<\/b> Bond Z is a convertible bond, which means it can be converted into a specified number of shares of the issuing company’s stock. The decision to exercise this option depends on the stock&#x27;s performance relative to the bond. Since Bond Z is currently trading &quot;on the money,&quot; the central bank&#x27;s actions resulting in lower interest rates would not necessarily lead to the options being exercised. The bondholder&#x27;s decision will hinge more on the company&#x27;s stock performance than interest rate changes.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(d): Explain how interest rate volatility affects the value of a callable or putable bond.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Paul Whitman<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Whitman is an investment adviser working for Oxidane Investment Group. One of his clients<\/p><p>is Clive Smith, who is about to retire and wants to change her portfolio. Whitman sets up a<\/p><p>meeting to discuss this. During the meeting, Smith says, “The outlook of the domestic economy<\/p><p>has been deteriorating, which has affected the equity market. I want to increase my fixed-income<\/p><p>investment and reduce my equity exposure in my portfolio.”<\/p><p>Smith adds,” I prefer investment-grade corporate bonds over government bonds since the<\/p><p>government yields have been low. Economists forecast that the yields will continue to decline<\/p><p>due to negative GDP growth and low employment rate over the last three quarters.” Whitman<\/p><p>prepares one-year forward rates and spot and par rates, which he presents in Exhibit 1. He also<\/p><p>suggests three fixed-rate investment-grade bonds issued by Saxon Group that are being<\/p><p>considered for investment, which data is presented in Exhibit 2.<\/p><p>Exhibit 1: One-Year Forward, Spot and Par Rates (annual coupon payments)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0131.webp\" style=\"max-width:min(100%,481px)\" alt=\"Maturity One-Year Forward Spot Rate Par Rate  1 Year 2.000% 2.000% 2.000% 2 Years 2.502% 2.320% 2.302% 3 Years 2.453% 2.351% 2.321% Exhibit 2: Fixed-Rate Bonds of Saxon Group Bond Bond Type Annual Coupon Bond X Callable Bond: callable at par 2.56% with no protection periods  currently trading at $10\"><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 2 and assuming that Smith’s equity markets outlook and economic forecasts are validated, the bond whose options are most likely to be exercised?<\/p><\/div>", "subj": "fixed"}, {"n": 83, "q": "Using Exhibit 1 and assuming the forecasted interest rates rise, the bond that is most likely to experience the largest price increase is:", "opts": ["Bond X", "Bond Y", "Bond Z"], "ans": "B", "expl": "In an environment where interest rates are rising, bond prices generally decline, excluding any effects from embedded options. The put option of Bond Y (putable) becomes more valuable as interest rates increase rather than fall. A and C are incorrect. Conversely, when interest rates decrease, the value of the embedded call option in Bond X (callable) increases, exerting an opposing influence on its price.", "explhtml": "<p>In an environment where interest rates are rising, bond prices generally decline, excluding any effects from embedded options. The put option of Bond Y (putable) becomes more valuable as interest rates increase rather than fall.<\/p><p><b>A and C are incorrect.<\/b> Conversely, when interest rates decrease, the value of the embedded call option in Bond X (callable) increases, exerting an opposing influence on its price.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(d): Explain how interest rate volatility affects the value of a callable or putable bond.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Paul Whitman<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Whitman is an investment adviser working for Oxidane Investment Group. One of his clients<\/p><p>is Clive Smith, who is about to retire and wants to change her portfolio. Whitman sets up a<\/p><p>meeting to discuss this. During the meeting, Smith says, “The outlook of the domestic economy<\/p><p>has been deteriorating, which has affected the equity market. I want to increase my fixed-income<\/p><p>investment and reduce my equity exposure in my portfolio.”<\/p><p>Smith adds,” I prefer investment-grade corporate bonds over government bonds since the<\/p><p>government yields have been low. Economists forecast that the yields will continue to decline<\/p><p>due to negative GDP growth and low employment rate over the last three quarters.” Whitman<\/p><p>prepares one-year forward rates and spot and par rates, which he presents in Exhibit 1. He also<\/p><p>suggests three fixed-rate investment-grade bonds issued by Saxon Group that are being<\/p><p>considered for investment, which data is presented in Exhibit 2.<\/p><p>Exhibit 1: One-Year Forward, Spot and Par Rates (annual coupon payments)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0131.webp\" style=\"max-width:min(100%,481px)\" alt=\"Maturity One-Year Forward Spot Rate Par Rate  1 Year 2.000% 2.000% 2.000% 2 Years 2.502% 2.320% 2.302% 3 Years 2.453% 2.351% 2.321% Exhibit 2: Fixed-Rate Bonds of Saxon Group Bond Bond Type Annual Coupon Bond X Callable Bond: callable at par 2.56% with no protection periods  currently trading at $10\"><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1 and assuming the forecasted interest rates rise, the bond that is most likely to experience the largest price increase is:<\/p><\/div>", "subj": "fixed"}, {"n": 84, "q": "Suppose the yield curve is inverted; is the value of the embedded option most likely to be?", "opts": ["Decrease in Bond X", "Decrease in Bond Y", "Increase in both Bond X and Y"], "ans": "B", "expl": "All other factors being constant, the value of a put option diminishes as the yield curve transitions from an upward slope to a flat curve and then to a downward (inverted) slope. Conversely, the value of a call option rises as the yield curve flattens and increases further if the curve inverts. Hence, if the yield curve were to invert, the value of the embedded option in Bond Y (putable) would decline. A and C are incorrect. The value of the embedded option in Bond X (callable) would increase.", "explhtml": "<p>All other factors being constant, the value of a put option diminishes as the yield curve transitions from an upward slope to a flat curve and then to a downward (inverted) slope. Conversely, the value of a call option rises as the yield curve flattens and increases further if the curve inverts. Hence, if the yield curve were to invert, the value of the embedded option in Bond Y (putable) would decline.<\/p><p><b>A and C are incorrect.<\/b> The value o
