. The calculations clearly show that after accounting for the coupon payments and discounting them back at the respective interest rates provided in the tree, the value of the bond is $101.00. The incorrect value in option A might result from improper averaging or incorrect application of the interest rates in the binomial tree. C is incorrect. It proposes that the arbitrage-free price of Bond B is $104.25. This value significantly deviates from the calculated value using the binomial interest rate tree. The overestimation in option C could be due to not properly discounting the future cash flows or misunderstanding the bond's coupon structure and its impact on the bond's value. The correct calculations, as shown, provide a clear pathway to the value of $101.00, making option C an incorrect choice.", "explhtml": "<p>The correct answer is option B, which states that the arbitrage-free price of Bond B is closest to $101.00. To determine this, we use the binomial interest rate tree provided in Exhibit 2. The tree outlines the possible interest rates at different times, which are essential for calculating the present value of future cash flows from the bond. Bond B is a 2-year bond with a par value of $100 and a coupon rate of 5.0%. The bond will make annual coupon payments of $5 (5% of $100).<\/p><p>At Time 1, depending on the interest rate scenario (up or down), the bond values can be calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0079.webp\" style=\"max-width:min(100%,225px)\" alt=\"105 V1U = + 5 = 103.5915 1.065 105 V1D = + 5 = 105.4785 1.045\"><p>Here, $105$ represents the sum of the final year coupon and the par value ($100 + $5), and the denominators are $1 + R$ for each respective rate (6.5% and 4.5%).<\/p><p>At Time 0, the expected value of the bond, considering an equal probability of moving up or down in the interest rate tree, is calculated by discounting the expected value at Time 1 back to the present using the initial rate of 3.5%:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0080.webp\" style=\"max-width:min(100%,311px)\" alt=\"103.5915 105.4785 V0 = 0.5 [ + ] = 101.00 1.035 1.035\"><p>This calculation shows that the present value of Bond B, considering the possible interest rate paths and their associated probabilities, is $101.00.<\/p><p><b>A is incorrect<\/b>. It suggests that the arbitrage-free price of Bond B is $100.50. This value does not align with the calculations based on the binomial interest rate tree. The calculations clearly show that after accounting for the coupon payments and discounting them back at the respective interest rates provided in the tree, the value of the bond is $101.00. The incorrect value in option A might result from improper averaging or incorrect application of the interest rates in the binomial tree.<\/p><p><b>C is incorrect<\/b>. It proposes that the arbitrage-free price of Bond B is $104.25. This value significantly deviates from the calculated value using the binomial interest rate tree. The overestimation in option C could be due to not properly discounting the future cash flows or misunderstanding the bond&#x27;s coupon structure and its impact on the bond&#x27;s value. The correct calculations, as shown, provide a clear pathway to the value of $101.00, making option C an incorrect choice.<\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(d):describe the process of calibrating a binomial interest rate tree to match a specific term structure<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Tracy Pritchard<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tracy Pritchard works as an analyst in the fixed-income branch of an investment bank. Her department prices bonds trading in the market. Pritchard&#x27;s supervisor, Leslie Matthews, requests that a bond issue be valued under different methods.<\/p><p>Matthews first requests that Pritchard calculate the arbitrage-free value of Bond A using a yield-<\/p><p>to-maturity curve. Bond A has a par value of $100, a coupon rate of 8.0%, and a 3-year maturity.<\/p><p>The yield-to-maturity in year 1 is 4.0%, the yield-to-maturity in year 2 is 5.5%, and the yield-to-<\/p><p>maturity in year 3 is 6.0%.<\/p><p>Exhibit 1 -Yield to Maturity Par Rates for One-, Two-, and Three-Year Annual<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0075.webp\" style=\"max-width:min(100%,595px)\" alt=\"Pay Option -Free One-year Two-year Three-year 4.0% 5.5% 6.0%\"><p>Next, Matthews asks Pritchard to price Bond B, a 2-year bond with a par value of $100 and a<\/p><p>coupon rate of 5.0% by using a binomial interest rate tree:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0076.webp\" style=\"max-width:min(100%,294px)\" alt=\"Exhibit 2: Binomial interest rate tree Time 0 Time 1 6.5% ↗ 3.5% ↘ 4.5%\"><p>Matthews asks for the present value of Bond B.<\/p><p>Matthews then asks Pritchard to calibrate this binomial tree to match a specific term structure.<\/p><p>The one-year par rate is 3.5% and the two-year par rate is 4.75%. The interest rate volatility is<\/p><p>20% per year.<\/p><p>After valuing these bonds with interest rate trees, Pritchard wants to understand their general<\/p><p>properties. Pritchard tells Matthews she has heard that interest rate trees describe closely interrelated economic items. Matthews responds with the following comments about them:<\/p><p>Property 1: Interest rate trees generate cash flows dependent on interest rates.<\/p><p>Property 2: Interest rate trees provide interest rates used to determine the present value of cash<\/p><p>flows.<\/p><p>Matthews asks Pritchard to consider another alternative to value bonds. Specifically, she asks<\/p><p>Pritchard to use pathwise valuation to price Bond C, a 2-year bond with a coupon rate of 3% and<\/p><p>a par value of 100.<\/p><p>Here are the paths:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0077.webp\" style=\"max-width:min(100%,244px)\" alt=\"Exhibit 3 - Interest Rate Paths Path Time 0 Time 1 1 3% 3.6% 2 3% 3.6% 3 3% 2.7% 4 3% 2.7%\"><\/div><\/details><div class=\"qtext\"><p>Using the interest rate binomial tree shown in Exhibit 2, the arbitrage-free price of Bond B is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 51, "q": "When calibrating the binomial tree shown in Exhibit 2, the value of the interest rate in the upper node of time 1 is closest to:", "opts": ["4.92%.", "6.85%.", "8.97%."], "ans": "C", "expl": "To determine the interest rate in the upper node of time 1 for the binomial tree, we start by understanding the relationship between the one-year and two-year par rates and the forward rates. The one-year par rate is given as 3.5%, and the two-year par rate is 4.75%. The relationship between these rates can be expressed using the formula for the compound interest for two years: Here, F1,1 represents the one-year forward rate starting one year from now. Solving this equation: Given the volatility (σ) of 20% per year, the forward rates in the binomial tree differ by a factor of e2σ. The upper node forward rate (F1,1U ) can be calculated as: This calculation shows that the interest rate in the upper node of time 1 is closest to 8.97%, which corresponds to option C. A is incorrect. It suggests an interest rate of 4.92%, which is significantly lower than the calculated rate. This discrepancy arises because the option might mistakenly represent the lower node forward rate, which is calculated using F1,1 × e−0.20. This calculation would yield a value closer to 4.92%, but it is not the correct value for the upper node, which is what the question asks for. B is incorrect.is closer to the forward rate without volatility adjustment (6.015%) or might reflect an adjustment using eσ (which would yield approximately 7.35%). However, according to the solution's methodology, the volatility adjustment requires e2σ, resulting in a higher rate. Therefore, 6.85% underestimates the impact of volatility and does not match the calculated upper node rate.", "explhtml": "<p>To determine the interest rate in the upper node of time 1 for the binomial tree, we start by understanding the relationship between the one-year and two-year par rates and the forward rates. The one-year par rate is given as 3.5%, and the two-year par rate is 4.75%. The relationship between these rates can be expressed using the formula for the compound interest for two years:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0081.webp\" style=\"max-width:min(100%,304px)\" alt=\"(1 + 0.0475)2 = (1 + 0.035) × (1 + F1,1)\"><p>Here, F<sub>1,1<\/sub> represents the one-year forward rate starting one year from now. Solving this equation:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0082.webp\" style=\"max-width:min(100%,236px)\" alt=\"1.097256 = 1.035 × (1 + F1,1) 1.097256 1 + F1,1 = 1.035 ≈1.06015 F1,1 ≈0.06015 or 6.015%\"><p>Given the volatility (σ) of 20% per year, the forward rates in the binomial tree differ by a factor of e<sup>2σ<\/sup>. The upper node forward rate (F<sub>1,1U<\/sub> ) can be calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0083.webp\" style=\"max-width:min(100%,352px)\" alt=\"F1,1U = F1,1 × e0.40 F1,1U = 0.06015 × e0.40 ≈0.089733 or 8.97%\"><p>This calculation shows that the interest rate in the upper node of time 1 is closest to 8.97%, which corresponds to option C.<\/p><p><b>A is incorrect<\/b>. It suggests an interest rate of 4.92%, which is significantly lower than the calculated rate. This discrepancy arises because the option might mistakenly represent the lower node forward rate, which is calculated using F<sub>1,1<\/sub> × e<sup>−0.20<\/sup>. This calculation would yield a value closer to 4.92%, but it is not the correct value for the upper node, which is what the question asks for.<\/p><p><b>B is incorrect<\/b>.is closer to the forward rate without volatility adjustment (6.015%) or might reflect an adjustment using e<sup>σ<\/sup> (which would yield approximately 7.35%). However, according to the solution&#x27;s methodology, the volatility adjustment requires e<sup>2σ<\/sup>, resulting in a higher rate. Therefore, 6.85% underestimates the impact of volatility and does not match the calculated upper node rate.<\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(d): Describe the process of calibrating a binomial interest rate tree to match a specific term structure<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Tracy Pritchard<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tracy Pritchard works as an analyst in the fixed-income branch of an investment bank. Her department prices bonds trading in the market. Pritchard&#x27;s supervisor, Leslie Matthews, requests that a bond issue be valued under different methods.<\/p><p>Matthews first requests that Pritchard calculate the arbitrage-free value of Bond A using a yield-<\/p><p>to-maturity curve. Bond A has a par value of $100, a coupon rate of 8.0%, and a 3-year maturity.<\/p><p>The yield-to-maturity in year 1 is 4.0%, the yield-to-maturity in year 2 is 5.5%, and the yield-to-<\/p><p>maturity in year 3 is 6.0%.<\/p><p>Exhibit 1 -Yield to Maturity Par Rates for One-, Two-, and Three-Year Annual<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0075.webp\" style=\"max-width:min(100%,595px)\" alt=\"Pay Option -Free One-year Two-year Three-year 4.0% 5.5% 6.0%\"><p>Next, Matthews asks Pritchard to price Bond B, a 2-year bond with a par value of $100 and a<\/p><p>coupon rate of 5.0% by using a binomial interest rate tree:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0076.webp\" style=\"max-width:min(100%,294px)\" alt=\"Exhibit 2: Binomial interest rate tree Time 0 Time 1 6.5% ↗ 3.5% ↘ 4.5%\"><p>Matthews asks for the present value of Bond B.<\/p><p>Matthews then asks Pritchard to calibrate this binomial tree to match a specific term structure.<\/p><p>The one-year par rate is 3.5% and the two-year par rate is 4.75%. The interest rate volatility is<\/p><p>20% per year.<\/p><p>After valuing these bonds with interest rate trees, Pritchard wants to understand their general<\/p><p>properties. Pritchard tells Matthews she has heard that interest rate trees describe closely interrelated economic items. Matthews responds with the following comments about them:<\/p><p>Property 1: Interest rate trees generate cash flows dependent on interest rates.<\/p><p>Property 2: Interest rate trees provide interest rates used to determine the present value of cash<\/p><p>flows.<\/p><p>Matthews asks Pritchard to consider another alternative to value bonds. Specifically, she asks<\/p><p>Pritchard to use pathwise valuation to price Bond C, a 2-year bond with a coupon rate of 3% and<\/p><p>a par value of 100.<\/p><p>Here are the paths:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0077.webp\" style=\"max-width:min(100%,244px)\" alt=\"Exhibit 3 - Interest Rate Paths Path Time 0 Time 1 1 3% 3.6% 2 3% 3.6% 3 3% 2.7% 4 3% 2.7%\"><\/div><\/details><div class=\"qtext\"><p>When calibrating the binomial tree shown in Exhibit 2, the value of the interest rate in the upper node of time 1 is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 52, "q": "Which of the following is the most accurate assessment of Matthews' statements regarding interest rate trees:", "opts": ["Property 1 and Property 2 are both accurate", "Property 1 is accurate and Property 2 is inaccurate", "Property 1 is inaccurate and Property 2 is accurate"], "ans": "A", "expl": "Property 1 and Property 2 as stated by Matthews accurately describe the functionality and purpose of interest rate trees in bond valuation. Interest rate trees are a crucial tool in financial modeling, particularly in the valuation of fixed-income securities. Property 1 states that interest rate trees generate cash flows dependent on interest rates. This is accurate because the cash flows of a bond, such as coupon payments, are influenced by the interest rates at various nodes of the tree, which represent different potential future interest rate scenarios. These scenarios allow analysts to see how cash flows might change with fluctuations in interest rates. B is incorrect. This option suggests that Property 1 is accurate, but Property 2 is not. However, Property 2 is indeed accurate as it states that interest rate trees provide the interest rates used to determine the present value of cash flows. This is a fundamental aspect of using interest rate trees; they not only simulate different interest rate paths but also facilitate the calculation of the present value of future cash flows under each scenario. By discounting these cash flows at the respective interest rates provided by the tree, analysts can determine a more accurate valuation of the bond under different interest rate conditions. C is incorrect. This option claims that Property 1 is inaccurate while Property 2 is accurate, which is a misinterpretation. As explained, Property 1 is indeed accurate because the cash flows from the bond, such as coupons, are directly influenced by the interest rates at each node of the tree. These rates reflect different potential future market states, which affect the amount and timing of cash flows. Thus, both properties are essential and correct in describing the role of interest rate trees in the valuation process.", "explhtml": "<p>Property 1 and Property 2 as stated by Matthews accurately describe the functionality and purpose of interest rate trees in bond valuation. Interest rate trees are a crucial tool in financial modeling, particularly in the valuation of fixed-income securities. Property 1 states that interest rate trees generate cash flows dependent on interest rates. This is accurate because the cash flows of a bond, such as coupon payments, are influenced by the interest rates at various nodes of the tree, which represent different potential future interest rate scenarios. These scenarios allow analysts to see how cash flows might change with fluctuations in interest rates.<\/p><p><b>B is incorrect<\/b>. This option suggests that Property 1 is accurate, but Property 2 is not. However, Property 2 is indeed accurate as it states that interest rate trees provide the interest rates used to determine the present value of cash flows. This is a fundamental aspect of using interest rate trees; they not only simulate different interest rate paths but also facilitate the calculation of the present value of future cash flows under each scenario. By discounting these cash flows at the respective interest rates provided by the tree, analysts can determine a more accurate valuation of the bond under different interest rate conditions.<\/p><p><b>C is incorrect<\/b>. This option claims that Property 1 is inaccurate while Property 2 is accurate, which is a misinterpretation. As explained, Property 1 is indeed accurate because the cash flows from the bond, such as coupons, are directly influenced by the interest rates at each node of the tree. These rates reflect different potential future market states, which affect the amount and timing of cash flows. Thus, both properties are essential and correct in describing the role of interest rate trees in the valuation process.<\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(d): Describe the process of calibrating a binomial interest rate tree to match a specific term structure<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Tracy Pritchard<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tracy Pritchard works as an analyst in the fixed-income branch of an investment bank. Her department prices bonds trading in the market. Pritchard&#x27;s supervisor, Leslie Matthews, requests that a bond issue be valued under different methods.<\/p><p>Matthews first requests that Pritchard calculate the arbitrage-free value of Bond A using a yield-<\/p><p>to-maturity curve. Bond A has a par value of $100, a coupon rate of 8.0%, and a 3-year maturity.<\/p><p>The yield-to-maturity in year 1 is 4.0%, the yield-to-maturity in year 2 is 5.5%, and the yield-to-<\/p><p>maturity in year 3 is 6.0%.<\/p><p>Exhibit 1 -Yield to Maturity Par Rates for One-, Two-, and Three-Year Annual<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0075.webp\" style=\"max-width:min(100%,595px)\" alt=\"Pay Option -Free One-year Two-year Three-year 4.0% 5.5% 6.0%\"><p>Next, Matthews asks Pritchard to price Bond B, a 2-year bond with a par value of $100 and a<\/p><p>coupon rate of 5.0% by using a binomial interest rate tree:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0076.webp\" style=\"max-width:min(100%,294px)\" alt=\"Exhibit 2: Binomial interest rate tree Time 0 Time 1 6.5% ↗ 3.5% ↘ 4.5%\"><p>Matthews asks for the present value of Bond B.<\/p><p>Matthews then asks Pritchard to calibrate this binomial tree to match a specific term structure.<\/p><p>The one-year par rate is 3.5% and the two-year par rate is 4.75%. The interest rate volatility is<\/p><p>20% per year.<\/p><p>After valuing these bonds with interest rate trees, Pritchard wants to understand their general<\/p><p>properties. Pritchard tells Matthews she has heard that interest rate trees describe closely interrelated economic items. Matthews responds with the following comments about them:<\/p><p>Property 1: Interest rate trees generate cash flows dependent on interest rates.<\/p><p>Property 2: Interest rate trees provide interest rates used to determine the present value of cash<\/p><p>flows.<\/p><p>Matthews asks Pritchard to consider another alternative to value bonds. Specifically, she asks<\/p><p>Pritchard to use pathwise valuation to price Bond C, a 2-year bond with a coupon rate of 3% and<\/p><p>a par value of 100.<\/p><p>Here are the paths:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0077.webp\" style=\"max-width:min(100%,244px)\" alt=\"Exhibit 3 - Interest Rate Paths Path Time 0 Time 1 1 3% 3.6% 2 3% 3.6% 3 3% 2.7% 4 3% 2.7%\"><\/div><\/details><div class=\"qtext\"><p>Which of the following is the most accurate assessment of Matthews&#x27; statements regarding interest rate trees:<\/p><\/div>", "subj": "fixed"}, {"n": 53, "q": "The swap spread for the two-year swap is closest to:", "opts": ["1.52%", "3.54%", "2.44%"], "ans": "C", "expl": "The swap spread is calculated as the difference between the swap rate and the corresponding government bond yield for the same maturity. The swap rate for a given maturity is not a single forward rate but must be derived as the fixed rate that makes the present value of the fixed leg of the swap equal to the present value of the floating leg, which is based on the forward curve. For the two-year swap rate, we use the one-year forward rates for the first and second years: The two-year swap rate (S2) is then calculated as: The corresponding two-year Treasury yield is 0.55%. Therefore, the swap spread for the two-year swap is calculated as follows: Swap spread = Swap rate − Treasury yield = 2.991% −0.55% = 2.441% = 2.44% A is incorrect. It suggests a swap spread of 1.52%. This value does not align with the calculated swap spread of 2.44%. The discrepancy arises because the calculation for option A likely involves incorrect or unrelated data points. The correct calculation requires the use of the two-year forward rate and the corresponding two-year Treasury yield, as detailed above. Any deviation from these specific values leads to an incorrect swap spread, as evidenced by the result of 1.52%, which does not match the correct calculation. B is incorrect. It suggests a swap spread of 3.54%. This value is also incorrect because it does not match the calculated swap spread of 2.44%. The error in this option could stem from a misinterpretation of the forward rates or an incorrect application of the Treasury yields. It is crucial to accurately apply the specified two-year forward rate of 4.51% and the two-year Treasury yield of 0.55% to calculate the correct swap spread. Any other values or assumptions used in the calculation would result in an incorrect swap spread, as demonstrated by the 3.54% figure in option B.", "explhtml": "<p>The swap spread is calculated as the difference between the swap rate and the corresponding government bond yield for the same maturity. The swap rate for a given maturity is not a single forward rate but must be derived as the fixed rate that makes the present value of the fixed leg of the swap equal to the present value of the floating leg, which is based on the forward curve. For the two-year swap rate, we use the one-year forward rates for the first and second years:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0087.webp\" style=\"max-width:min(100%,603px)\" alt=\"Year 1 Forward Rate, f(0,1)=2.50% Year 2 Forward Rate, f(1,1)=3.50% First, we calculate the discount factors: 1 1 P(1) = = = 0.9756 1 + f(0, 1) 1.025 1 1 P(2) = = = 0.9426 (1 + f(0, 1)) × (1 + f(1,1)) 1.025 × 1.035\"><p>The two-year swap rate (S<sub>2<\/sub>) is then calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0088.webp\" style=\"max-width:min(100%,324px)\" alt=\"(f(0, 1) × P(1)) + (f(1, 1) × P(2)) S2 = P(1) × P(2) (0.025 × 0.9756) + (0.035 × 0.9426) S2 = 0.9756 + 0.9426 0.02439 + 0.03299 S2 = = 0.02991 1.91821\"><p>The corresponding two-year Treasury yield is 0.55%. Therefore, the swap spread for the two-year swap is calculated as follows:<\/p><p>Swap spread = Swap rate − Treasury yield = 2.991% −0.55% = 2.441% = 2.44%<\/p><p><b>A is incorrect<\/b>. It suggests a swap spread of 1.52%. This value does not align with the calculated swap spread of 2.44%. The discrepancy arises because the calculation for option A likely involves incorrect or unrelated data points. The correct calculation requires the use of the two-year forward rate and the corresponding two-year Treasury yield, as detailed above. Any deviation from these specific values leads to an incorrect swap spread, as evidenced by the result of 1.52%, which does not match the correct calculation.<\/p><p><b>B is incorrect<\/b>. It suggests a swap spread of 3.54%. This value is also incorrect because it does not match the calculated swap spread of 2.44%. The error in this option could stem from a misinterpretation of the forward rates or an incorrect application of the Treasury yields. It is crucial to accurately apply the specified two-year forward rate of 4.51% and the two-year Treasury yield of 0.55% to calculate the correct swap spread. Any other values or assumptions used in the calculation would result in an incorrect swap spread, as demonstrated by the 3.54% figure in option B.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(f): Calculate and interpret the swap spread for a given maturity<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Tabitha Swanson<\/summary><div class=\"vig-body\"><p>Tabitha Swanson, CFA, is the bond specialist at Brooks Investment. She has compiled the following one-year forward rates from the benchmark default-free spot curve and currency Treasury yield rates. Tabitha is interested in the swap rate curve, as it reflects the credit risk of commercial banks, rather than that of governments. Tabitha prefers the swap curve as a benchmark interest rate curve over a government bond yield curve because the swap market is not government-regulated, making the swap rate curve comparable across countries.<\/p><p>Benchmark spot rate curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0084.webp\" style=\"max-width:min(100%,338px)\" alt=\"Start year, k 1-year forward rate, f(k, 1) 0 2.50% 1 3.50% 2 4.51% 3 5.51% 4 6.52% 5 7.54%\"><p>Treasury yield curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0085.webp\" style=\"max-width:min(100%,276px)\" alt=\"Maturity (years) Treasury yield 1 0.24% 2 0.55% 3 0.87% 5 1.37% 7 1.70% 10 1.96% 20 2.38% 30 2.63%\"><p>Rachel, Tabitha&#x27;s coworker, estimated the Z-spread at which three risky corporate bonds trade<\/p><p>over the Treasury yield curve. Bond Z has an embedded call option.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0086.webp\" style=\"max-width:min(100%,554px)\" alt=\"Bond Face value Time to maturity (years) Coupon rate Z-spread X 100 1.75 2.0% 413 bps Y 100 2 3.0% 406 bps Z 100 2 4.0% 399 bps\"><\/div><\/details><div class=\"qtext\"><p>The swap spread for the two-year swap is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 54, "q": "The swap rate for a two-year tenor swap is closest to:", "opts": ["2.50%.", "3.02%.", "3.50%."], "ans": "B", "expl": "To determine the two-year swap rate, we start by calculating the discount factors from the forward rates. The swap rate is the fixed rate that sets the net present value (NPV) of the swap to zero. This requires discounting future cash flows. We derive discount factors (DF) from the provided one-year forward rates. Year 2 Discount Factor (DF₂) is derived by compounding the first two one-year forward rates. For a two-year swap (n=2): A is incorrect. It suggests a swap rate of 2.50%, which corresponds to the one-year spot rate, not the two-year swap rate. The calculation of the two-year swap rate involves the compounding of the one-year spot rate and the one-year forward rate from year 1, followed by the application of the swap rate formula. The result of this calculation is approximately 3.02%, significantly different from 2.50%, indicating that option A does not reflect the correct swap rate for a two-year tenor. C is incorrect. It suggests a swap rate of 3.50%, which is actually the one-year forward rate starting from year 1, not the swap rate. The swap rate calculation, as detailed, yields a value of approximately 3.02%. The value of 3.50% does not result from any relevant calculation for the two-year swap rate, making option C incorrect.", "explhtml": "<p>To determine the two-year swap rate, we start by calculating the discount factors from the forward rates. The swap rate is the fixed rate that sets the net present value (NPV) of the swap to zero. This requires discounting future cash flows. We derive discount factors (DF) from the provided one-year forward rates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0089.webp\" style=\"max-width:min(100%,281px)\" alt=\"1 1 DF1 = = = 0.97561 1 + f(0, 1) 1.025\"><p>Year 2 Discount Factor (DF<sub>₂<\/sub>) is derived by compounding the first two one-year forward rates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0090.webp\" style=\"max-width:min(100%,432px)\" alt=\"1 1 DF2 = = = 0.9421 (1 + f(0, 1)) × (1 + f(1,1)) 1.025 × 1.035\"><p>For a two-year swap (n=2):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0091.webp\" style=\"max-width:min(100%,304px)\" alt=\"1 −DF2 R = DF1 + DF2 1 −0.9421 R = 0.97561 + 0.9421 = 0.0302 = 3.02%\"><p><b>A is incorrect<\/b>. It suggests a swap rate of 2.50%, which corresponds to the one-year spot rate, not the two-year swap rate. The calculation of the two-year swap rate involves the compounding of the one-year spot rate and the one-year forward rate from year 1, followed by the application of the swap rate formula. The result of this calculation is approximately 3.02%, significantly different from 2.50%, indicating that option A does not reflect the correct swap rate for a two-year tenor.<\/p><p><b>C is incorrect<\/b>. It suggests a swap rate of 3.50%, which is actually the one-year forward rate starting from year 1, not the swap rate. The swap rate calculation, as detailed, yields a value of approximately 3.02%. The value of 3.50% does not result from any relevant calculation for the two-year swap rate, making option C incorrect.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(e): Explain the swap rate curve and why and how market participants use it in valuation<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Tabitha Swanson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tabitha Swanson, CFA, is the bond specialist at Brooks Investment. She has compiled the following one-year forward rates from the benchmark default-free spot curve and currency Treasury yield rates. Tabitha is interested in the swap rate curve, as it reflects the credit risk of commercial banks, rather than that of governments. Tabitha prefers the swap curve as a benchmark interest rate curve over a government bond yield curve because the swap market is not government-regulated, making the swap rate curve comparable across countries.<\/p><p>Benchmark spot rate curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0084.webp\" style=\"max-width:min(100%,338px)\" alt=\"Start year, k 1-year forward rate, f(k, 1) 0 2.50% 1 3.50% 2 4.51% 3 5.51% 4 6.52% 5 7.54%\"><p>Treasury yield curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0085.webp\" style=\"max-width:min(100%,276px)\" alt=\"Maturity (years) Treasury yield 1 0.24% 2 0.55% 3 0.87% 5 1.37% 7 1.70% 10 1.96% 20 2.38% 30 2.63%\"><p>Rachel, Tabitha&#x27;s coworker, estimated the Z-spread at which three risky corporate bonds trade<\/p><p>over the Treasury yield curve. Bond Z has an embedded call option.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0086.webp\" style=\"max-width:min(100%,554px)\" alt=\"Bond Face value Time to maturity (years) Coupon rate Z-spread X 100 1.75 2.0% 413 bps Y 100 2 3.0% 406 bps Z 100 2 4.0% 399 bps\"><\/div><\/details><div class=\"qtext\"><p>The swap rate for a two-year tenor swap is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 55, "q": "Assume the Treasury yield curve is the default-free spot curve. The price of Bond Y is closest to:", "opts": ["97", "100", "103"], "ans": "A", "expl": "To determine the price of Bond Y, we need to discount its future cash flows back to the present value using the appropriate discount rates. The discount rates are calculated by adding the Z-spread to the corresponding Treasury yields. Bond Y has a maturity of 2 years, a coupon rate of 3.0%, and a Z-spread of 406 basis points (or 4.06%). The Treasury yields for the first and second years are 0.24% and 0.55%, respectively. Therefore, the discount rates for the first and second years are 4.30% (0.24% + 4.06%) and 4.61% (0.55% + 4.06%), respectively. The cash flows from Bond Y are $3 (3.0% of $100) at the end of the first year and $103 (3.0% of $100 plus the $100 principal) at the end of the second year. Using these discount rates, the present value of the first cash flow is and the present value of the second cash flow is . Adding these two present values gives us the total price of Bond Y: . B is incorrect. The option of 100 would imply that the bond is priced at par. However, given the high Z-spread, which indicates a significant risk premium over the risk-free rate, the bond's price should be lower than its face value. The calculation clearly shows that after accounting for the higher required return due to increased risk (as indicated by the Z-spread), the present value of the bond's cash flows is less than 100, specifically 97.00. This reflects the market's required compensation for taking on additional risk compared to the default-free Treasury securities. C is incorrect. A price of 103 would suggest that the bond is trading at a premium. This is unlikely given that the bond has a high Z-spread, indicating it carries more risk than the risk-free Treasury bonds. Typically, bonds trade at a premium when they offer a coupon rate significantly higher than the prevailing market rates for similar risk profiles, or when market interest rates have fallen since the bond's issuance. In this case, the bond's coupon rate and the adjusted market rates (including the Z-spread) used for discounting do not support a premium pricing. The calculated price of 97.00 confirms that the bond is trading below par, reflecting its higher risk level.", "explhtml": "<p>To determine the price of Bond Y, we need to discount its future cash flows back to the present value using the appropriate discount rates. The discount rates are calculated by adding the Z-spread to the corresponding Treasury yields. Bond Y has a maturity of 2 years, a coupon rate of 3.0%, and a Z-spread of 406 basis points (or 4.06%). The Treasury yields for the first and second years are 0.24% and 0.55%, respectively. Therefore, the discount rates for the first and second years are 4.30% (0.24% + 4.06%) and 4.61% (0.55% + 4.06%), respectively.<\/p><p>The cash flows from Bond Y are $3 (3.0% of $100) at the end of the first year and $103 (3.0% of $100 plus the $100 principal) at the end of the second year. Using these discount rates, the present value of the first cash flow is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0092.webp\" style=\"max-width:min(100%,150px)\" alt=\"3 1 + 0.0430 = 2.876\"><p>and the present value of the second cash flow is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0093.webp\" style=\"max-width:min(100%,178px)\" alt=\"103 = 94.124 (1 + 0.0461)2\"><p>. Adding these two present values gives us the total price of Bond Y:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0094.webp\" style=\"max-width:min(100%,191px)\" alt=\"2.876+ 94.124 = 97.00\"><p>.<\/p><p><b>B is incorrect<\/b>. The option of 100 would imply that the bond is priced at par. However, given the high Z-spread, which indicates a significant risk premium over the risk-free rate, the bond&#x27;s price should be lower than its face value. The calculation clearly shows that after accounting for the higher required return due to increased risk (as indicated by the Z-spread), the present value of the bond&#x27;s cash flows is less than 100, specifically 97.00. This reflects the market&#x27;s required compensation for taking on additional risk compared to the default-free Treasury securities.<\/p><p><b>C is incorrect<\/b>. A price of 103 would suggest that the bond is trading at a premium. This is unlikely given that the bond has a high Z-spread, indicating it carries more risk than the risk-free Treasury bonds. Typically, bonds trade at a premium when they offer a coupon rate significantly higher than the prevailing market rates for similar risk profiles, or when market interest rates have fallen since the bond&#x27;s issuance. In this case, the bond&#x27;s coupon rate and the adjusted market rates (including the Z-spread) used for discounting do not support a premium pricing. The calculated price of 97.00 confirms that the bond is trading below par, reflecting its higher risk level.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(e):explain the swap rate curve and why and how market participants use it in valuation<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Tabitha Swanson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tabitha Swanson, CFA, is the bond specialist at Brooks Investment. She has compiled the following one-year forward rates from the benchmark default-free spot curve and currency Treasury yield rates. Tabitha is interested in the swap rate curve, as it reflects the credit risk of commercial banks, rather than that of governments. Tabitha prefers the swap curve as a benchmark interest rate curve over a government bond yield curve because the swap market is not government-regulated, making the swap rate curve comparable across countries.<\/p><p>Benchmark spot rate curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0084.webp\" style=\"max-width:min(100%,338px)\" alt=\"Start year, k 1-year forward rate, f(k, 1) 0 2.50% 1 3.50% 2 4.51% 3 5.51% 4 6.52% 5 7.54%\"><p>Treasury yield curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0085.webp\" style=\"max-width:min(100%,276px)\" alt=\"Maturity (years) Treasury yield 1 0.24% 2 0.55% 3 0.87% 5 1.37% 7 1.70% 10 1.96% 20 2.38% 30 2.63%\"><p>Rachel, Tabitha&#x27;s coworker, estimated the Z-spread at which three risky corporate bonds trade<\/p><p>over the Treasury yield curve. Bond Z has an embedded call option.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0086.webp\" style=\"max-width:min(100%,554px)\" alt=\"Bond Face value Time to maturity (years) Coupon rate Z-spread X 100 1.75 2.0% 413 bps Y 100 2 3.0% 406 bps Z 100 2 4.0% 399 bps\"><\/div><\/details><div class=\"qtext\"><p>Assume the Treasury yield curve is the default-free spot curve. The price of Bond Y is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 56, "q": "Bond X currently yields 5.24%. The I-spread for Bond X is closest to:", "opts": ["2.35%", "2.81%", "3.26%"], "ans": "A", "expl": "The I-spread is calculated as the difference between the bond yield and the corresponding swap rate. For Bond X, which has a maturity of 1.75 years, we need to determine the swap rate at this specific maturity. Since the exact swap rate for 1.75 years is not directly available, we employ linear interpolation between the one-year and two-year swap rates. The one-year swap rate is equivalent to the one-year forward rate, which is 2.50%. To find the two-year spot rate, we use the formula for compounding forward rates. The two-year spot rate, S 2, can be calculated using the relationship between the one-year spot rate and the one-year forward rate starting from year 1, f(1, 1), which is 3.50%. Year 2 Discount Factor (DF₂) is derived by compounding the first two one-year forward rates. For a two-year swap (n=2): Now, interpolating to find the 1.75-year swap rate: The I-spread for Bond X is then: B is incorrect. It suggests an I-spread of 2.81%, which does not align with the calculated I-spread of approximately 2.35%. The discrepancy arises from incorrect interpolation or miscalculation of the swap rates. Accurate interpolation and calculation of the swap rates are crucial for determining the precise I-spread. The method used in option B likely involves incorrect assumptions about the rates or the interpolation formula, leading to an overestimated I-spread. C is incorrect. It proposes an I-spread of 3.26%, which is significantly higher than the calculated value of approximately 2.35%. This error could stem from a substantial overestimation of the swap rate or underestimation of the bond yield. The correct approach involves carefully interpolating the swap rates based on the given forward rates and a precise calculation of the difference between the bond yield and the interpolated swap rate. Any deviation from this method can result in an inaccurate I-spread, as seen in option C.", "explhtml": "<p>The I-spread is calculated as the difference between the bond yield and the corresponding swap rate. For Bond X, which has a maturity of 1.75 years, we need to determine the swap rate at this specific maturity. Since the exact swap rate for 1.75 years is not directly available, we employ linear interpolation between the one-year and two-year swap rates. The one-year swap rate is equivalent to the one-year forward rate, which is 2.50%. To find the two-year spot rate, we use the formula for compounding forward rates. The two-year spot rate, S 2, can be calculated using the relationship between the one-year spot rate and the one-year forward rate starting from year 1, f(1, 1), which is 3.50%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0095.webp\" style=\"max-width:min(100%,281px)\" alt=\"1 1 DF1 = = = 0.97561 1 + f(0, 1) 1.025\"><p>Year 2 Discount Factor (DF<sub>₂<\/sub>) is derived by compounding the first two one-year forward rates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0096.webp\" style=\"max-width:min(100%,324px)\" alt=\"1 1 DF1 = = = 0.9421 1 + f(0,1) 1.025 × 1.035\"><p>For a two-year swap (n=2):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0097.webp\" style=\"max-width:min(100%,126px)\" alt=\"1 −DF2 R = DF1 + DF2\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0098.webp\" style=\"max-width:min(100%,88px)\" alt=\"1 0 9421\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0099.webp\" style=\"max-width:min(100%,304px)\" alt=\"1 −0.9421 R = 0.97561 + 0.9421 = 0.0302 = 3.02%\"><p>Now, interpolating to find the 1.75-year swap rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0100.webp\" style=\"max-width:min(100%,353px)\" alt=\"1.75 −1 2.50% + 2 −1 × (3.02% −2.50%) = 2.89%\"><p>The I-spread for Bond X is then:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0101.webp\" style=\"max-width:min(100%,195px)\" alt=\"5.24% −2.89% = 2.35%\"><p><b>B is incorrect<\/b>. It suggests an I-spread of 2.81%, which does not align with the calculated I-spread of approximately 2.35%. The discrepancy arises from incorrect interpolation or miscalculation of the swap rates. Accurate interpolation and calculation of the swap rates are crucial for determining the precise I-spread. The method used in option B likely involves incorrect assumptions about the rates or the interpolation formula, leading to an overestimated I-spread.<\/p><p><b>C is incorrect<\/b>. It proposes an I-spread of 3.26%, which is significantly higher than the calculated value of approximately 2.35%. This error could stem from a substantial overestimation of the swap rate or underestimation of the bond yield. The correct approach involves carefully interpolating the swap rates based on the given forward rates and a precise calculation of the difference between the bond yield and the interpolated swap rate. Any deviation from this method can result in an inaccurate I-spread, as seen in option C.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(e): Explain the swap rate curve and why and how market participants use it in valuation<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Tabitha Swanson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tabitha Swanson, CFA, is the bond specialist at Brooks Investment. She has compiled the following one-year forward rates from the benchmark default-free spot curve and currency Treasury yield rates. Tabitha is interested in the swap rate curve, as it reflects the credit risk of commercial banks, rather than that of governments. Tabitha prefers the swap curve as a benchmark interest rate curve over a government bond yield curve because the swap market is not government-regulated, making the swap rate curve comparable across countries.<\/p><p>Benchmark spot rate curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0084.webp\" style=\"max-width:min(100%,338px)\" alt=\"Start year, k 1-year forward rate, f(k, 1) 0 2.50% 1 3.50% 2 4.51% 3 5.51% 4 6.52% 5 7.54%\"><p>Treasury yield curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0085.webp\" style=\"max-width:min(100%,276px)\" alt=\"Maturity (years) Treasury yield 1 0.24% 2 0.55% 3 0.87% 5 1.37% 7 1.70% 10 1.96% 20 2.38% 30 2.63%\"><p>Rachel, Tabitha&#x27;s coworker, estimated the Z-spread at which three risky corporate bonds trade<\/p><p>over the Treasury yield curve. Bond Z has an embedded call option.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0086.webp\" style=\"max-width:min(100%,554px)\" alt=\"Bond Face value Time to maturity (years) Coupon rate Z-spread X 100 1.75 2.0% 413 bps Y 100 2 3.0% 406 bps Z 100 2 4.0% 399 bps\"><\/div><\/details><div class=\"qtext\"><p>Bond X currently yields 5.24%. The I-spread for Bond X is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 57, "q": "Using Exhibit 1, the spot rate at year five is closest to:", "opts": ["5.56%", "6.02%", "5.69%"], "ans": "C", "expl": "The five year spot rate is calculated as follows: A is incorrect. 5.56% is the par rate at year five, not the spot rate. The par rate is the coupon rate at which a bond's present value of cash flows equals its price. The calculation indicates that the spot rate, which represents the yield of a zero-coupon bond, exceeds the par rate for a five-year maturity. B is incorrect. It overestimates the spot rate for the five years. The correct spot rate calculation, using the given par rates and spot rates for previous years, results in 5.69%. The higher value of 6.02% does not align with the derived spot rate calculated from the provided data and methodology.", "explhtml": "<p>The five year spot rate is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0103.webp\" style=\"max-width:min(100%,396px)\" alt=\"0.0556 0.0556 0.0556 0.0556 1 + 0.0556 1 = + + + + 1.035 1.042 1.0453 1.054 1 + z5 5 1.0556 z5 = 5√ −1 = 0.0569 = 5.69% 0.800414\"><p><b>A is incorrect. <\/b>5.56% is the par rate at year five, not the spot rate. The par rate is the coupon rate at which a bond&#x27;s present value of cash flows equals its price. The calculation indicates that the spot rate, which represents the yield of a zero-coupon bond, exceeds the par rate for a five-year maturity.<\/p><p><b>B is incorrect.<\/b> It overestimates the spot rate for the five years. The correct spot rate calculation, using the given par rates and spot rates for previous years, results in 5.69%. The higher value of 6.02% does not align with the derived spot rate calculated from the provided data and methodology.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(f): calculate and interpret the swap spread for a given maturity.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Ethan Daniel<\/summary><div class=\"vig-body\"><p>Ethan Daniel, CFA, is a fixed-income analyst at Monsoon Investments Limited (MIL). Chris<\/p><p>Evans, a junior analyst, is a trainee in the company currently working with Daniel. This will help<\/p><p>Evans make his trades more profitable and develop the skills needed to become an expert bond<\/p><p>trader. Exhibit 1 presents the spot and par rates based on annual coupon sovereign bonds.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0102.webp\" style=\"max-width:min(100%,514px)\" alt=\"Exhibit 1: Spot and Current Par Rates Maturity Spot Rate Par Rate 1-year 3.50% 3.50% 2-year 4.00% 3.98% 3-year 4.50% 4.49% 4-year 5.00% 4.96% 5-year 5.69% 5.56%\"><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1, the spot rate at year five is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 58, "q": "From the information in Exhibit 1, the market expectation is most likely.", "opts": ["Basis risk", "Deflation", "Inflation"], "ans": "C", "expl": "Exhibit 1 shows spot rates increasing yearly, suggesting that the yield curve is upward-sloping. An upward-sloping yield curve typically indicates that investors expect higher inflation in the future. Higher inflation erodes the purchasing power of money, leading investors to demand higher returns (and thus higher interest rates) for longer-term investments to compensate for the expected rise in prices. A is incorrect. Basis risk refers to the risk that the price of the underlying asset and a futures contract do not move in perfect correlation. It is related to hedging and the discrepancies between spot and futures prices, not to the overall shape of the yield curve or market expectations of inflation. B is incorrect. A deflationary period is characterized by a downward-sloping yield curve or meagre and stable interest rates. The increasing spot rates shown in Exhibit 1 indicate the opposite expectation: that inflation is expected to rise, not fall.", "explhtml": "<p>Exhibit 1 shows spot rates increasing yearly, suggesting that the yield curve is upward-sloping. An upward-sloping yield curve typically indicates that investors expect higher inflation in the future. Higher inflation erodes the purchasing power of money, leading investors to demand higher returns (and thus higher interest rates) for longer-term investments to compensate for the expected rise in prices.<\/p><p><b>A is incorrect.<\/b> Basis risk refers to the risk that the price of the underlying asset and a futures contract do not move in perfect correlation. It is related to hedging and the discrepancies between spot and futures prices, not to the overall shape of the yield curve or market expectations of inflation.<\/p><p><b>B is incorrect.<\/b> A deflationary period is characterized by a downward-sloping yield curve or meagre and stable interest rates. The increasing spot rates shown in Exhibit 1 indicate the opposite expectation: that inflation is expected to rise, not fall.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(c): Describe the assumptions concerning the evolution of spot rates in relation to forward rates implicit in active bond portfolio management.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Ethan Daniel<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ethan Daniel, CFA, is a fixed-income analyst at Monsoon Investments Limited (MIL). Chris<\/p><p>Evans, a junior analyst, is a trainee in the company currently working with Daniel. This will help<\/p><p>Evans make his trades more profitable and develop the skills needed to become an expert bond<\/p><p>trader. Exhibit 1 presents the spot and par rates based on annual coupon sovereign bonds.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0102.webp\" style=\"max-width:min(100%,514px)\" alt=\"Exhibit 1: Spot and Current Par Rates Maturity Spot Rate Par Rate 1-year 3.50% 3.50% 2-year 4.00% 3.98% 3-year 4.50% 4.49% 4-year 5.00% 4.96% 5-year 5.69% 5.56%\"><\/div><\/details><div class=\"qtext\"><p>From the information in Exhibit 1, the market expectation is most likely.<\/p><\/div>", "subj": "fixed"}, {"n": 59, "q": "According to Exhibit 1, the forward rate for a one-year loan starting in four years is closest to:", "opts": ["8.49%", "4.50%", "5.00%"], "ans": "A", "expl": "The forward rate for a one-year loan starting in four years is calculated as follows: B and C are incorrect. It uses the following calculation, which is incorrect.", "explhtml": "<p>The forward rate for a one-year loan starting in four years is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0104.webp\" style=\"max-width:min(100%,279px)\" alt=\"[1 + z4+1]4+1 = [1 + z4]4[1 + f4,1]1 [1.0569]5 = [1.05]4[1 + f4,1] 1.05695 f4,1 = 1.054 −1 = 8.49%\"><p><b>B and C are incorrect.<\/b><\/p><p>It uses the following calculation, which is incorrect.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0105.webp\" style=\"max-width:min(100%,271px)\" alt=\"[1 + z4+1]4+1 = [1 + z4]4[1 + f3]1 [1.045]5 = [1.045]4[1 + f4,1] 1.0455 f4,1 = 1.0454 −1 = 4.50%\"><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(a): Describe relationships among spot rates, forward rates, yield to maturity, expected and realized returns on bonds, and the shape of the yield curve<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Ethan Daniel<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ethan Daniel, CFA, is a fixed-income analyst at Monsoon Investments Limited (MIL). Chris<\/p><p>Evans, a junior analyst, is a trainee in the company currently working with Daniel. This will help<\/p><p>Evans make his trades more profitable and develop the skills needed to become an expert bond<\/p><p>trader. Exhibit 1 presents the spot and par rates based on annual coupon sovereign bonds.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0102.webp\" style=\"max-width:min(100%,514px)\" alt=\"Exhibit 1: Spot and Current Par Rates Maturity Spot Rate Par Rate 1-year 3.50% 3.50% 2-year 4.00% 3.98% 3-year 4.50% 4.49% 4-year 5.00% 4.96% 5-year 5.69% 5.56%\"><\/div><\/details><div class=\"qtext\"><p>According to Exhibit 1, the forward rate for a one-year loan starting in four years is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 60, "q": "From Exhibit 1, which of the following forward rates cannot be determined?", "opts": ["A four-year loan starting in two year.", "A three-year loan starting in two years.", "A two-year loan starting in one year."], "ans": "A", "expl": "This forward rate cannot be determined because it requires the six-year spot rate, which is not provided in Exhibit 1. The calculation for a forward rate starting at time m and lasting for n years (fm,n) uses the formula: Here, m=2 and n=4, so we need z2 (4.00%) and z6. Since z6 is missing, f2,4 cannot be calculated. B is incorrect. This forward rate can be determined using the two-year spot rate (4.00%) and the five-year spot rate (5.69%). Solving for f2,3yields approximately 6.8319%, which is calculable with the given data. C is incorrect. This forward rate can be determined using the one-year spot rate (3.50%) and the three-year spot rate (4.50%). Solving for f1,2yields approximately 5.0036%, which is calculable with the given data.", "explhtml": "<p>This forward rate cannot be determined because it requires the six-year spot rate, which is not provided in Exhibit 1. The calculation for a forward rate starting at time m and lasting for n years (fm,n) uses the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0106.webp\" style=\"max-width:min(100%,299px)\" alt=\"(1 + Zm+n)m+n = (1 + Zm)n × (1 + fm,n)n\"><p>Here, m=2 and n=4, so we need z<sub>2<\/sub> (4.00%) and z<sub>6<\/sub>. Since z<sub>6<\/sub> is missing, f<sub>2,4<\/sub> cannot be calculated.<\/p><p><b>B is incorrect.<\/b> This forward rate can be determined using the two-year spot rate (4.00%) and the five-year spot rate (5.69%). Solving for f<sub>2,3<\/sub>yields approximately 6.8319%, which is calculable with the given data.<\/p><p><b>C is incorrect.<\/b> This forward rate can be determined using the one-year spot rate (3.50%) and the three-year spot rate (4.50%). Solving for f<sub>1,2<\/sub>yields approximately 5.0036%, which is calculable with the given data.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(a): Describe relationships among spot rates, forward rates, yield to maturity, expected and realized returns on bonds, and the shape of the yield curve.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Ethan Daniel<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ethan Daniel, CFA, is a fixed-income analyst at Monsoon Investments Limited (MIL). Chris<\/p><p>Evans, a junior analyst, is a trainee in the company currently working with Daniel. This will help<\/p><p>Evans make his trades more profitable and develop the skills needed to become an expert bond<\/p><p>trader. Exhibit 1 presents the spot and par rates based on annual coupon sovereign bonds.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0102.webp\" style=\"max-width:min(100%,514px)\" alt=\"Exhibit 1: Spot and Current Par Rates Maturity Spot Rate Par Rate 1-year 3.50% 3.50% 2-year 4.00% 3.98% 3-year 4.50% 4.49% 4-year 5.00% 4.96% 5-year 5.69% 5.56%\"><\/div><\/details><div class=\"qtext\"><p>From Exhibit 1, which of the following forward rates cannot be determined?<\/p><\/div>", "subj": "fixed"}, {"n": 61, "q": "Peng’s remarks on the term structure of interest rates are most likely referring to:", "opts": ["Static trade-off theory.", "Liquidity preference theory.", "Segmented markets theory."], "ans": "C", "expl": "Peng's remarks align with the Segmented Markets Theory, which posits that the bond market is divided into segments based on maturity. This theory suggests that the yield curve is shaped by the supply and demand within each market segment, as different investors prefer different maturities. Therefore, yields reflect these preferences, resulting in varying interest rates for bonds of different maturities. A is incorrect. The static trade-off theory is generally related to corporate finance and capital structure, where firms balance the benefits of debt (such as tax shields) against the costs of potential financial distress. It does not pertain to the term structure of interest rates or the segmentation of bond markets by maturity. B is incorrect. While liquidity preference theory does address the term structure of interest rates, it focuses on the idea that investors demand a liquidity premium for holding longer-term bonds due to the additional risk. This results in an upward-sloping yield curve. However, it does not directly address market segmentation by different investor preferences and their impact on yields across various maturities.", "explhtml": "<p>Peng&#x27;s remarks align with the Segmented Markets Theory, which posits that the bond market is divided into segments based on maturity. This theory suggests that the yield curve is shaped by the supply and demand within each market segment, as different investors prefer different maturities. Therefore, yields reflect these preferences, resulting in varying interest rates for bonds of different maturities.<\/p><p><b>A is incorrect.<\/b> The static trade-off theory is generally related to corporate finance and capital structure, where firms balance the benefits of debt (such as tax shields) against the costs of potential financial distress. It does not pertain to the term structure of interest rates or the segmentation of bond markets by maturity.<\/p><p><b>B is incorrect.<\/b> While liquidity preference theory does address the term structure of interest rates, it focuses on the idea that investors demand a liquidity premium for holding longer-term bonds due to the additional risk. This results in an upward-sloping yield curve. However, it does not directly address market segmentation by different investor preferences and their impact on yields across various maturities.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(h): Explain traditional theories of the term structure of interest rates and describe the implications of each theory for forward rates and the shape of the yield curve<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Susan Peng<\/summary><div class=\"vig-body\"><p>Susan Peng is an analyst at Kamado Capital under the supervision of Kenneth Akira, a senior<\/p><p>analyst at the company. Peng meets Akira to review three bonds held by the fund and discuss<\/p><p>interest rates and their effect on the portfolio. The meeting begins with Akira requesting Peng to<\/p><p>share her views on the term structure of interest rates. She responds with the following,<\/p><p>“Yields reflect the supply and demand within each market segment. Investors prefer different<\/p><p>maturities, resulting in distinct segments within the bond market. These preferences influence<\/p><p>the yield curve, resulting in varying interest rates for bonds of different maturities.”<\/p><p>Akira is concerned that yield volatility may affect the portfolio. He requests that Peng break<\/p><p>down the factors that affect long-term and short-term rate volatility. Peng made the following<\/p><p>remarks,<\/p><p>“Long-term rate volatility is primarily associated with uncertainties about the real economy and<\/p><p>inflation, while short-term rate volatility is mainly tied to uncertainties regarding monetary<\/p><p>policy.”<\/p><p>Peng then analyses the interest rate risk portfolio positions in 3-year and 15-year bonds. Her<\/p><p>analysis results in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0107.webp\" style=\"max-width:min(100%,524px)\" alt=\"Exhibit 1: Three-Factor Model of Term Structure Maturity (Years) Factor 3 − Years 15 −Years Curvature 0.309% 0.452% Level −0.324% −0.423% Steepness −0.043% −0.235%\"><p>Akira asks Peng to carry out two analyses.<\/p><p>Analysis I: Determine the expected yield change on a three-year bond due to a one-standard-<\/p><p>deviation decline in both the curvature and steepness factors.<\/p><p>Analysis II: Determine the expected yield change on a 15-year bond due to a three-standard<\/p><p>deviation increase in the curvature factor.<\/p><\/div><\/details><div class=\"qtext\"><p>Peng’s remarks on the term structure of interest rates are most likely referring to:<\/p><\/div>", "subj": "fixed"}, {"n": 62, "q": "Peng’s response regarding factors that affect long-term and short-term rate volatility is most likely.", "opts": ["Correct about long-term rate volatility only.", "Correct regarding both long-term and short-term rate volatility", "Incorrect regarding both long-term and short-term rate volatility."], "ans": "B", "expl": "Peng is correct regarding both statements. Long-term rate volatility is generally influenced by uncertainties in the broader real economy and long-term inflation expectations. These factors affect the fundamental outlook for economic growth and price stability. On the other hand, short-term rate volatility is more directly tied to uncertainties regarding monetary policy, as central banks adjust short-term rates to manage inflation and stabilise the economy in response to current economic conditions. A and C are incorrect. Long-term rate volatility is driven by broader economic and inflation expectations, while short-term rate volatility is more closely tied to central banks' actions and decisions regarding monetary policy.", "explhtml": "<p>Peng is correct regarding both statements.<\/p><p><b>Long-term rate volatility<\/b> is generally influenced by uncertainties in the broader real economy and long-term inflation expectations. These factors affect the fundamental outlook for economic growth and price stability. On the other hand, <b>short-term rate volatility<\/b> is more directly tied to uncertainties regarding monetary policy, as central banks adjust short-term rates to manage inflation and stabilise the economy in response to current economic conditions.<\/p><p><b>A and C are incorrect.<\/b><\/p><p>Long-term rate volatility is driven by broader economic and inflation expectations, while short-term rate volatility is more closely tied to central banks&#x27; actions and decisions regarding monetary policy.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(g): Describe short-term interest rate spreads used to gauge economy-wide credit risk and liquidity risk.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Susan Peng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Susan Peng is an analyst at Kamado Capital under the supervision of Kenneth Akira, a senior<\/p><p>analyst at the company. Peng meets Akira to review three bonds held by the fund and discuss<\/p><p>interest rates and their effect on the portfolio. The meeting begins with Akira requesting Peng to<\/p><p>share her views on the term structure of interest rates. She responds with the following,<\/p><p>“Yields reflect the supply and demand within each market segment. Investors prefer different<\/p><p>maturities, resulting in distinct segments within the bond market. These preferences influence<\/p><p>the yield curve, resulting in varying interest rates for bonds of different maturities.”<\/p><p>Akira is concerned that yield volatility may affect the portfolio. He requests that Peng break<\/p><p>down the factors that affect long-term and short-term rate volatility. Peng made the following<\/p><p>remarks,<\/p><p>“Long-term rate volatility is primarily associated with uncertainties about the real economy and<\/p><p>inflation, while short-term rate volatility is mainly tied to uncertainties regarding monetary<\/p><p>policy.”<\/p><p>Peng then analyses the interest rate risk portfolio positions in 3-year and 15-year bonds. Her<\/p><p>analysis results in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0107.webp\" style=\"max-width:min(100%,524px)\" alt=\"Exhibit 1: Three-Factor Model of Term Structure Maturity (Years) Factor 3 − Years 15 −Years Curvature 0.309% 0.452% Level −0.324% −0.423% Steepness −0.043% −0.235%\"><p>Akira asks Peng to carry out two analyses.<\/p><p>Analysis I: Determine the expected yield change on a three-year bond due to a one-standard-<\/p><p>deviation decline in both the curvature and steepness factors.<\/p><p>Analysis II: Determine the expected yield change on a 15-year bond due to a three-standard<\/p><p>deviation increase in the curvature factor.<\/p><\/div><\/details><div class=\"qtext\"><p>Peng’s response regarding factors that affect long-term and short-term rate volatility is most likely.<\/p><\/div>", "subj": "fixed"}, {"n": 63, "q": "Using Exhibit 1, the results of Analysis I are likely to show the return on the three-year bond:", "opts": ["Increasing by 0.266%", "Decreasing by 0.266%", "Decreasing by 0.352"], "ans": "A", "expl": "To determine the expected yield change on a three-year bond due to a one-standard-deviation decline in both the curvature and steepness factors, we use the values provided in Exhibit 1: Curvature factor: 0.309% Steepness factor: -0.043% The calculation is as follows: B is incorrect. The calculation shows an increase, not a decrease, in the yield due to the curvature factor's positive impact outweighing the steepness factor's negative impact. C is incorrect. This option likely arises from misinterpreting the data or incorrectly combining factors. The correct calculation for the three-year bond does not result in a decrease or the specified value.", "explhtml": "<p>To determine the expected yield change on a three-year bond due to a one-standard-deviation decline in both the curvature and steepness factors, we use the values provided in Exhibit 1:<\/p><p>Curvature factor: 0.309%<\/p><p>Steepness factor: -0.043%<\/p><p>The calculation is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0108.webp\" style=\"max-width:min(100%,481px)\" alt=\"Expected yield change = Curvature factor + Steepness factor 0.309% −0.043% = 0.266%\"><p><b>B is incorrect.<\/b> The calculation shows an increase, not a decrease, in the yield due to the curvature factor&#x27;s positive impact outweighing the steepness factor&#x27;s negative impact.<\/p><p><b>C is incorrect.<\/b> This option likely arises from misinterpreting the data or incorrectly combining factors. The correct calculation for the three-year bond does not result in a decrease or the specified value.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(k): Explain how key economic factors are used to establish a view on benchmark rates, spreads, and yield curve changes.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Susan Peng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Susan Peng is an analyst at Kamado Capital under the supervision of Kenneth Akira, a senior<\/p><p>analyst at the company. Peng meets Akira to review three bonds held by the fund and discuss<\/p><p>interest rates and their effect on the portfolio. The meeting begins with Akira requesting Peng to<\/p><p>share her views on the term structure of interest rates. She responds with the following,<\/p><p>“Yields reflect the supply and demand within each market segment. Investors prefer different<\/p><p>maturities, resulting in distinct segments within the bond market. These preferences influence<\/p><p>the yield curve, resulting in varying interest rates for bonds of different maturities.”<\/p><p>Akira is concerned that yield volatility may affect the portfolio. He requests that Peng break<\/p><p>down the factors that affect long-term and short-term rate volatility. Peng made the following<\/p><p>remarks,<\/p><p>“Long-term rate volatility is primarily associated with uncertainties about the real economy and<\/p><p>inflation, while short-term rate volatility is mainly tied to uncertainties regarding monetary<\/p><p>policy.”<\/p><p>Peng then analyses the interest rate risk portfolio positions in 3-year and 15-year bonds. Her<\/p><p>analysis results in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0107.webp\" style=\"max-width:min(100%,524px)\" alt=\"Exhibit 1: Three-Factor Model of Term Structure Maturity (Years) Factor 3 − Years 15 −Years Curvature 0.309% 0.452% Level −0.324% −0.423% Steepness −0.043% −0.235%\"><p>Akira asks Peng to carry out two analyses.<\/p><p>Analysis I: Determine the expected yield change on a three-year bond due to a one-standard-<\/p><p>deviation decline in both the curvature and steepness factors.<\/p><p>Analysis II: Determine the expected yield change on a 15-year bond due to a three-standard<\/p><p>deviation increase in the curvature factor.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1, the results of Analysis I are likely to show the return on the three-year bond:<\/p><\/div>", "subj": "fixed"}, {"n": 64, "q": "Using Exhibit 1, the results of Analysis II are likely to show the yield change on the fifteen-year bond increasing by:", "opts": ["0.927", "-1.356%", "1.356%"], "ans": "C", "expl": "The yield change on the 15-year bond is calculated using the curvature factor and the three-standard-deviation increase specified in the question: A is incorrect. This value represents the change in the three-year bond yield due to a three-standard-deviation movement in its curvature factor: However, the question pertains to the 15-year bond, not the three-year bond. B is incorrect. This suggests a decrease, but the question specifies a three-standard deviation increase in the curvature factor—the positive curvature factor results in a yield increase, not a decrease, for the 15-year bond.", "explhtml": "<p>The yield change on the 15-year bond is calculated using the curvature factor and the three-standard-deviation increase specified in the question:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0109.webp\" style=\"max-width:min(100%,422px)\" alt=\"Change in 15-year bond yield = 0.452% × 3 = 1.356%\"><p><b>A is incorrect.<\/b> This value represents the change in the three-year bond yield due to a three-standard-deviation movement in its curvature factor:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0110.webp\" style=\"max-width:min(100%,412px)\" alt=\"Change in 3-year bond yield = 0.309% × 3 = 0.927%\"><p>However, the question pertains to the 15-year bond, not the three-year bond.<\/p><p><b>B is incorrect.<\/b> This suggests a decrease, but the question specifies a three-standard deviation increase in the curvature factor—the positive curvature factor results in a yield increase, not a decrease, for the 15-year bond.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(k): Explain how key economic factors are used to establish a view on benchmark rates, spreads, and yield curve changes.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Susan Peng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Susan Peng is an analyst at Kamado Capital under the supervision of Kenneth Akira, a senior<\/p><p>analyst at the company. Peng meets Akira to review three bonds held by the fund and discuss<\/p><p>interest rates and their effect on the portfolio. The meeting begins with Akira requesting Peng to<\/p><p>share her views on the term structure of interest rates. She responds with the following,<\/p><p>“Yields reflect the supply and demand within each market segment. Investors prefer different<\/p><p>maturities, resulting in distinct segments within the bond market. These preferences influence<\/p><p>the yield curve, resulting in varying interest rates for bonds of different maturities.”<\/p><p>Akira is concerned that yield volatility may affect the portfolio. He requests that Peng break<\/p><p>down the factors that affect long-term and short-term rate volatility. Peng made the following<\/p><p>remarks,<\/p><p>“Long-term rate volatility is primarily associated with uncertainties about the real economy and<\/p><p>inflation, while short-term rate volatility is mainly tied to uncertainties regarding monetary<\/p><p>policy.”<\/p><p>Peng then analyses the interest rate risk portfolio positions in 3-year and 15-year bonds. Her<\/p><p>analysis results in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0107.webp\" style=\"max-width:min(100%,524px)\" alt=\"Exhibit 1: Three-Factor Model of Term Structure Maturity (Years) Factor 3 − Years 15 −Years Curvature 0.309% 0.452% Level −0.324% −0.423% Steepness −0.043% −0.235%\"><p>Akira asks Peng to carry out two analyses.<\/p><p>Analysis I: Determine the expected yield change on a three-year bond due to a one-standard-<\/p><p>deviation decline in both the curvature and steepness factors.<\/p><p>Analysis II: Determine the expected yield change on a 15-year bond due to a three-standard<\/p><p>deviation increase in the curvature factor.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1, the results of Analysis II are likely to show the yield change on the fifteen-year bond increasing by:<\/p><\/div>", "subj": "fixed"}, {"n": 65, "q": "Using Exhibit 1, determine the best action that an investor should take if they are to take advantage of the arbitrage opportunity and make a profit:", "opts": ["Buy on NYSE Euronext, sell on Frankfurt.", "Buy on Eurex, sell on NYSE Euronext.", "Buy on Frankfurt, sell on Eurex."], "ans": "A", "expl": "The bond is sold at three different prices, creating an arbitrage opportunity. You can take advantage of this by purchasing the bond on the exchange with the lowest price and immediately selling it on the exchange with the highest price. To profit from an arbitrage opportunity, an investor will buy the bond from the NYSE Euronext at $ 108.7665 and sell on the Frankfurt exchange at $ 109.7972. This will generate a risk-free profit of $1.0307. B is incorrect. Buying on Eurex at $109.1932 and selling on NYSE Euronext at $108.7665 would result in a loss rather than a profit. The bond is more expensive on Eurex than on NYSE Euronext, so this action does not take advantage of the arbitrage opportunity. C is incorrect. Buying on Frankfurt at $109.7972 and selling on Eurex at $109.1932 would also result in a loss. The bond is more expensive on Frankfurt than in Eurex, so this action does not provide a profitable arbitrage opportunity.", "explhtml": "<p>The bond is sold at three different prices, creating an arbitrage opportunity. You can take advantage of this by purchasing the bond on the exchange with the lowest price and immediately selling it on the exchange with the highest price. To profit from an arbitrage opportunity, an investor will buy the bond from the NYSE Euronext at $ 108.7665 and sell on the Frankfurt exchange at $ 109.7972. This will generate a risk-free profit of $1.0307.<\/p><p><b>B is incorrect.<\/b> Buying on Eurex at $109.1932 and selling on NYSE Euronext at $108.7665 would result in a loss rather than a profit. The bond is more expensive on Eurex than on NYSE Euronext, so this action does not take advantage of the arbitrage opportunity.<\/p><p><b>C is incorrect.<\/b> Buying on Frankfurt at $109.7972 and selling on Eurex at $109.1932 would also result in a loss. The bond is more expensive on Frankfurt than in Eurex, so this action does not provide a profitable arbitrage opportunity.<\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage Free Valuation Framework, LOS 2(c): Calculate the arbitrage-free value of an option-free, fixed-rate coupon bond.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · John Hagin<\/summary><div class=\"vig-body\"><p>John Hagin is a Fixed-Income Fund Manager at Equinox Financial Management Ltd. Jessica Page<\/p><p>is a junior analyst under Hagin&#x27;s supervision. Hagin explains the mechanics of the firm&#x27;s<\/p><p>arbitrage-free valuation framework. Using a fictitious bond traded in three exchanges, shown in<\/p><p>Exhibit 1, Hagin requests Page while ignoring transaction costs to identify the bond&#x27;s arbitrage<\/p><p>opportunity.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0111.webp\" style=\"max-width:min(100%,570px)\" alt=\"Exhibit 1: Three-Year, $100 par, 5.00% Coupon, Annual Option-free Bond Frankfurt Eurex NYSE Euronext Price $109.7972 $109.1932 $108.7665\"><p>Hagin also presents the yield to maturity of a one-year, two-year and three-year Exhibit 2.<\/p><p>Exhibit 2: Yield-to-Maturity Par Rates for One-, Two-, and Three-year Annual <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0112.webp\" style=\"max-width:min(100%,596px)\" alt=\"Pay Option-Free Bonds One –year Two-year Three-year 1.50% 1.65% 1.82%\"><p>Hagin also asks Page which term structure model he should use to determine how interest rates<\/p><p>move. Page ma
