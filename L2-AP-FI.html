lazy\" src=\"l2img/ap06/f0042.webp\" style=\"max-width:min(100%,167px)\" alt=\"6.9% −6.7% = 0.2%\"><p>. A positive basis indicates that the CDS spread is higher than the bond spread, contrary to the statement in option A that the basis would be negative. The positive basis suggests that the CDS market is pricing in a higher risk compared to the bond market, which is why option A is incorrect.<\/p><p><b>B is incorrect<\/b>. Basis trading involves exploiting the price differences between a CDS and a corresponding bond. Given that the CDS spread is higher than the bond spread even after the forecasted increase in the bond&#x27;s credit spread, there remains an opportunity for profitable basis trading. TM can engage in basis trading by selling CDS protection at the higher spread (6.9%) while the bond market reflects a lower spread (6.7%). This strategy allows TM to capture the spread differential, thus making basis trading potentially profitable and disproving option B. <\/p><p class=\"los\">Fixed Income, Learning Module 5: Credit Default Swaps, LOS 5(e): Describe the use of CDS to take advantage of valuation disparities among separate markets, such as bonds, loans, equities, and equity-linked instruments.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Naruca Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Naruca Associates, NA, is a credit derivatives analytics firm. The firm specializes in the credit default swap (CDS) sector of the market. As a protection buyer, Casey Greene, a senior analyst at NA, evaluates three CDS contracts entered into by Thrice Associates, a financial services firm. Each CDS provides protection on one entity to which TM has credit exposure.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0034.webp\" style=\"max-width:min(100%,586px)\" alt=\"Exhibit 1: CDS Data A B C Standard fixed coupon (% per annum) 5.0 1.0 5.0 Credit spread (%) 3.5 6.0 5.0 Duration (years) 5 4 1 Reference obligation maturity (years) 5 3 1 60%** Reference’s bond issue (s) outstanding (% of par)* 80% 40% 25%\"><p>Notional principal of CDS/reference obligation ($<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0035.webp\" style=\"max-width:min(100%,577px)\" alt=\"10 12 10 millions) Settlement terms Cash Physical Cash\"><p>*Entities behind CDSs A and B have one outstanding bond issue each, while Entity C has two outstanding issues. ** TM owns this bond issue.<\/p><p>The reference entity covered by CDS B is a member of a high-yield index. Greene believes TM can purchase $350 million worth of protection on the index instead of solely purchasing protection on entity B. In addition, Greene predicts that the credit quality of entity B is highly likely to improve and proposes that TM assume 20% of the credit risk by selling $7 million of single-name CDS protection.<\/p><p>Greene anticipates that entity B’s credit curve will change shape in the following year. He believes going short a 10-year CDS and long a 3-year CDS covering the entity will be profitable.<\/p><p>Greene would like to explore the valuation of CDS C in greater detail and how credit spread changes can influence the future prospects of contract party positions. He collects relevant valuation data (Exhibit 2). Greene anticipates entity B’s credit spread to widen by 170 basis points.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0036.webp\" style=\"max-width:min(100%,354px)\" alt=\"Exhibit 2: Current CDS C Valuation Data\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0037.webp\" style=\"max-width:min(100%,377px)\" alt=\"Coupon payment frequency Quarterly Hazard rate (constant % per annum) 4.0% Reference bond’s credit spread 5.0% CDS credit spread 6.9% Market funding cost (%) 2.5%\"><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 2 and Greene’s credit spread forecast, which of the following conclusions is most appropriate:<\/p><\/div>", "subj": "fixed"}, {"n": 21, "q": "Considering her first two statements, Young is most accurate with regards to:", "opts": ["Statement 1 only.", "Statement 2 only.", "neither Statement 1 nor Statement 2."], "ans": "C", "expl": "Kim Young's statements about the arbitrage-free valuation approach contain inaccuracies that need clarification. The arbitrage-free valuation method is fundamentally based on the principle that the value of a financial asset is determined by the present value of its future cash flows, discounted at appropriate rates that reflect the risk of those cash flows. This method does not inherently involve the process of stripping and reconstitution as Young suggests. Stripping and reconstitution refer to the practice of breaking down a bond into its individual coupon payments and principal repayment, which are then treated as separate zero-coupon bonds. This process is used to understand or exploit pricing discrepancies but is not a defining characteristic of arbitrage-free valuation. A is incorrect. Young's first statement is incorrect because it mischaracterizes the arbitrage-free valuation approach. While stripping and reconstitution can be used as tools within the broader framework of bond valuation, they are not synonymous with the arbitrage-free valuation method itself. The arbitrage-free approach focuses on ensuring that the pricing of securities is consistent with no-arbitrage conditions, primarily through the use of spot rates to discount cash flows. It is a fundamental principle in finance that aims to reflect the true value of securities without the influence of arbitrage opportunities, rather than a specific technique involving the manipulation of bond components. B is incorrect. Young's second statement inaccurately describes the basis of the arbitrage-free valuation framework. While it is true that the law of one price dictates that identical assets should trade at the same price in a frictionless market, Young's statement that they must trade at prices that represent fair value in their respective markets is misleading. The fair value can indeed vary across different markets due to factors such as liquidity, transaction costs, or regulatory conditions. The arbitrage-free valuation framework does not assume that identical assets will necessarily have the same fair value in different markets; rather, it ensures that the prices of financial instruments are consistent with the absence of arbitrage, taking into account the specific market conditions. Therefore, option C is the correct answer as neither of Young's statements accurately reflects the principles of the arbitrage-free valuation approach. ", "explhtml": "<p>Kim Young&#x27;s statements about the arbitrage-free valuation approach contain inaccuracies that need clarification. The arbitrage-free valuation method is fundamentally based on the principle that the value of a financial asset is determined by the present value of its future cash flows, discounted at appropriate rates that reflect the risk of those cash flows. This method does not inherently involve the process of stripping and reconstitution as Young suggests. Stripping and reconstitution refer to the practice of breaking down a bond into its individual coupon payments and principal repayment, which are then treated as separate zero-coupon bonds. This process is used to understand or exploit pricing discrepancies but is not a defining characteristic of arbitrage-free valuation.<\/p><p><b>A is incorrect<\/b>. Young&#x27;s first statement is incorrect because it mischaracterizes the arbitrage-free valuation approach. While stripping and reconstitution can be used as tools within the broader framework of bond valuation, they are not synonymous with the arbitrage-free valuation method itself. The arbitrage-free approach focuses on ensuring that the pricing of securities is consistent with no-arbitrage conditions, primarily through the use of spot rates to discount cash flows. It is a fundamental principle in finance that aims to reflect the true value of securities without the influence of arbitrage opportunities, rather than a specific technique involving the manipulation of bond components.<\/p><p><b>B is incorrect<\/b>. Young&#x27;s second statement inaccurately describes the basis of the arbitrage-free valuation framework. While it is true that the law of one price dictates that identical assets should trade at the same price in a frictionless market, Young&#x27;s statement that they must trade at prices that represent fair value in their respective markets is misleading. The fair value can indeed vary across different markets due to factors such as liquidity, transaction costs, or regulatory conditions. The arbitrage-free valuation framework does not assume that identical assets will necessarily have the same fair value in different markets; rather, it ensures that the prices of financial instruments are consistent with the absence of arbitrage, taking into account the specific market conditions.<\/p><p>Therefore, option C is the correct answer as neither of Young&#x27;s statements accurately reflects the principles of the arbitrage-free valuation approach. <\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage-Free Valuation Framework, LOS 2(a): Explain what is meant by arbitrage-free valuation of a fixed-income instrument;<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Peter de Silva<\/summary><div class=\"vig-body\"><p>Peter de Silva is a fixed-income trader at North Traders, a broker-dealer firm situated in the United Kingdom. While de Silva has always been aware of the importance of the arbitrage-free process in valuing fixed-income securities, he has never applied the approach in practice. To learn more about the technique, he engages Kim Young, a colleague, in a discussion. During the discussion, Young makes the following comments:<\/p><p>Statement 1: The arbitrage-free valuation approach derives security values using a process known as stripping and reconstitution.<\/p><p>Statement 2: The arbitrage-free valuation framework is based on the notion that two otherwise identical assets must trade at prices that represent fair value in their respective markets.<\/p><p>Statement 3: The arbitrage-free valuation-free approach, which involves discounting cash flows using individual spot rates, is restrictive because the process cannot be applied to a category of fixed-income securities.<\/p><p>The trader concludes the discussion by inquiring about the conditions that create the potential for arbitrage opportunities.<\/p><p>A few weeks later, De Silva proceeds to apply the learned techniques. He selects three corporate bonds issued by ARC Manufacturing, a global conglomerate. All three issues mature at par, are mispriced, trade on the LSE, and differ concerning credit ratings. De Silva has collected relevant details concerning the three issues and aims to explore potential arbitrage opportunities (Exhibit 1).<\/p><p>Next, De Silva would like to explore how interest rate volatility affects the valuation of fixed-rate option-free bonds. For his analysis, he selects a four-year, 10% annual coupon-paying bond issued by Dutch Inc. He proceeds to calibrate a binomial interest rate tree (Exhibit 2), corresponding to the benchmark yield curve. He is particularly interested in deriving the value of the bond if interest rates follow the designated path:<\/p><p>Year 1 Path: Highest interest path Year 2 Path: Middle interest rate path Year 3 Path: Second highest interest rate path<\/p><p>Dutch Inc. has actively traded mortgage-backed securities. De Silva is exploring which valuation technique will be most appropriate for this security category.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0043.webp\" style=\"max-width:min(100%,515px)\" alt=\"Exhibit 1 Option-free Corporate Bonds Issued by ARC Manufacturing\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0044.webp\" style=\"max-width:min(100%,357px)\" alt=\"Credit ration A-rated BB-rated B-rated\"><p>Price per 100 par (£)* 99.050 97.145 94.145<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0045.webp\" style=\"max-width:min(100%,371px)\" alt=\"Maturity (years) 5 5 5 Coupon (%) 6.0 6.5 7.0 Yield-to-maturity (%) 6.3 7.2 8.1\"><p>*Represents current market price<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0046.webp\" style=\"max-width:min(100%,625px)\" alt=\"Exhibit 2 Calibrated Binomial Interest Rate Tree to Match Benchmark Yield Curve\"><p>Year 0 Year 1 Year 2 Year 3<\/p><p>1.000% 5.639% 7.546% 9.734%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0047.webp\" style=\"max-width:min(100%,206px)\" alt=\"4.616% 6.178% 7.211% 5.058% 5.904% 4.373%\"><\/div><\/details><div class=\"qtext\"><p>Considering her first two statements, Young is most accurate with regards to:<\/p><\/div>", "subj": "fixed"}, {"n": 22, "q": "In the context of comment 3, spot rate discounting is ‘restrictive’ because the technique cannot be used to value:", "opts": ["Corporate bonds.", "Zero-coupon securities.", "Bonds with embedded options."], "ans": "C", "expl": "The arbitrage-free valuation approach, which involves discounting future cash flows using spot rates corresponding to their respective maturities, is particularly suited for securities with predetermined cash flows. This method is effective for instruments like zero-coupon bonds, where the cash flows are not contingent on future events, and for standard corporate bonds without additional features affecting payouts. However, this valuation method encounters limitations when applied to bonds with embedded options such as callable or puttable bonds. The reason is that the cash flows of these bonds are not fixed but depend on the exercise of the embedded options, which in turn are influenced by changes in interest rates. Therefore, the value of these bonds cannot be accurately determined by simply discounting expected cash flows at corresponding spot rates, as the actual cash flows may vary based on future interest rate movements and decisions by bondholders or issuers regarding the options. Bonds with embedded options, such as callable or puttable bonds, present a challenge for valuation using spot rates alone. The option features introduce variability in the bond's cash flows since the issuer or the bondholder may choose to exercise these options depending on interest rate movements. This variability means that the future cash flows are uncertain and dependent on the path of interest rates, making them unsuitable for straightforward discounting using fixed spot rates without considering the options' impact on the bond's risk and return profile. A is incorrect. The corporate bonds, unless they contain embedded options, typically have fixed cash flows that can be effectively valued using spot rates. The arbitrage-free valuation method is well-suited for these types of bonds as it accurately reflects the present value of their fixed future payments by discounting them at the appropriate spot rates for their respective maturities. B is incorrect. Zero-coupon securities are actually ideal candidates for valuation using the spot rate discounting method. Since zero-coupon bonds do not offer periodic interest payments and only provide a single payment at maturity, their valuation simply involves discounting this maturity value back to the present using the spot rate corresponding to their term to maturity. This process straightforwardly applies the principle of arbitrage-free valuation by using the appropriate discount rate for the time period involved. ", "explhtml": "<p>The arbitrage-free valuation approach, which involves discounting future cash flows using spot rates corresponding to their respective maturities, is particularly suited for securities with predetermined cash flows. This method is effective for instruments like zero-coupon bonds, where the cash flows are not contingent on future events, and for standard corporate bonds without additional features affecting payouts. However, this valuation method encounters limitations when applied to bonds with embedded options such as callable or puttable bonds. The reason is that the cash flows of these bonds are not fixed but depend on the exercise of the embedded options, which in turn are influenced by changes in interest rates. Therefore, the value of these bonds cannot be accurately determined by simply discounting expected cash flows at corresponding spot rates, as the actual cash flows may vary based on future interest rate movements and decisions by bondholders or issuers regarding the options.<\/p><p>Bonds with embedded options, such as callable or puttable bonds, present a challenge for valuation using spot rates alone. The option features introduce variability in the bond&#x27;s cash flows since the issuer or the bondholder may choose to exercise these options depending on interest rate movements. This variability means that the future cash flows are uncertain and dependent on the path of interest rates, making them unsuitable for straightforward discounting using fixed spot rates without considering the options&#x27; impact on the bond&#x27;s risk and return profile.<\/p><p><b>A is incorrect<\/b>. The corporate bonds, unless they contain embedded options, typically have fixed cash flows that can be effectively valued using spot rates. The arbitrage-free valuation method is well-suited for these types of bonds as it accurately reflects the present value of their fixed future payments by discounting them at the appropriate spot rates for their respective maturities.<\/p><p><b>B is incorrect<\/b>. Zero-coupon securities are actually ideal candidates for valuation using the spot rate discounting method. Since zero-coupon bonds do not offer periodic interest payments and only provide a single payment at maturity, their valuation simply involves discounting this maturity value back to the present using the spot rate corresponding to their term to maturity. This process straightforwardly applies the principle of arbitrage-free valuation by using the appropriate discount rate for the time period involved. <\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage-Free Valuation Framework, LOS 2(a): Explain what is meant by arbitrage-free valuation of a fixed-income instrument;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Peter de Silva<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Peter de Silva is a fixed-income trader at North Traders, a broker-dealer firm situated in the United Kingdom. While de Silva has always been aware of the importance of the arbitrage-free process in valuing fixed-income securities, he has never applied the approach in practice. To learn more about the technique, he engages Kim Young, a colleague, in a discussion. During the discussion, Young makes the following comments:<\/p><p>Statement 1: The arbitrage-free valuation approach derives security values using a process known as stripping and reconstitution.<\/p><p>Statement 2: The arbitrage-free valuation framework is based on the notion that two otherwise identical assets must trade at prices that represent fair value in their respective markets.<\/p><p>Statement 3: The arbitrage-free valuation-free approach, which involves discounting cash flows using individual spot rates, is restrictive because the process cannot be applied to a category of fixed-income securities.<\/p><p>The trader concludes the discussion by inquiring about the conditions that create the potential for arbitrage opportunities.<\/p><p>A few weeks later, De Silva proceeds to apply the learned techniques. He selects three corporate bonds issued by ARC Manufacturing, a global conglomerate. All three issues mature at par, are mispriced, trade on the LSE, and differ concerning credit ratings. De Silva has collected relevant details concerning the three issues and aims to explore potential arbitrage opportunities (Exhibit 1).<\/p><p>Next, De Silva would like to explore how interest rate volatility affects the valuation of fixed-rate option-free bonds. For his analysis, he selects a four-year, 10% annual coupon-paying bond issued by Dutch Inc. He proceeds to calibrate a binomial interest rate tree (Exhibit 2), corresponding to the benchmark yield curve. He is particularly interested in deriving the value of the bond if interest rates follow the designated path:<\/p><p>Year 1 Path: Highest interest path Year 2 Path: Middle interest rate path Year 3 Path: Second highest interest rate path<\/p><p>Dutch Inc. has actively traded mortgage-backed securities. De Silva is exploring which valuation technique will be most appropriate for this security category.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0043.webp\" style=\"max-width:min(100%,515px)\" alt=\"Exhibit 1 Option-free Corporate Bonds Issued by ARC Manufacturing\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0044.webp\" style=\"max-width:min(100%,357px)\" alt=\"Credit ration A-rated BB-rated B-rated\"><p>Price per 100 par (£)* 99.050 97.145 94.145<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0045.webp\" style=\"max-width:min(100%,371px)\" alt=\"Maturity (years) 5 5 5 Coupon (%) 6.0 6.5 7.0 Yield-to-maturity (%) 6.3 7.2 8.1\"><p>*Represents current market price<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0046.webp\" style=\"max-width:min(100%,625px)\" alt=\"Exhibit 2 Calibrated Binomial Interest Rate Tree to Match Benchmark Yield Curve\"><p>Year 0 Year 1 Year 2 Year 3<\/p><p>1.000% 5.639% 7.546% 9.734%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0047.webp\" style=\"max-width:min(100%,206px)\" alt=\"4.616% 6.178% 7.211% 5.058% 5.904% 4.373%\"><\/div><\/details><div class=\"qtext\"><p>In the context of comment 3, spot rate discounting is ‘restrictive’ because the technique cannot be used to value:<\/p><\/div>", "subj": "fixed"}, {"n": 23, "q": "The most appropriate response to De Silva’s query is that:", "opts": ["The value additivity principle must not hold.", "A financial asset with a risk-free payoff must trade at a neutral price today.", "Traders are required to commit a net amount equal to a fraction of the asset value."], "ans": "A", "expl": "The option A addresses the fundamental principle of arbitrage opportunities in financial markets, which is the violation of the value additivity principle. In finance, the value additivity principle states that the value of a portfolio is equal to the sum of the values of its individual assets. For arbitrage to exist, this principle must not hold, meaning the combined value of certain assets when bought or sold in a specific combination should differ from their individual summed values. This discrepancy allows traders like De Silva to exploit price inefficiencies by creating a portfolio where the combined value is greater than the sum of its parts, thus generating a profit without any net investment. This is crucial in arbitrage strategies, where the goal is to take advantage of price differences of the same or similar assets across different markets or forms. B is incorrect. This option suggests that a financial asset with a risk-free payoff must trade at a neutral price today, which implies a scenario where no arbitrage opportunities exist because the asset is fairly priced. In the context of arbitrage, traders are looking for mispriced assets where the price does not reflect the true risk-free payoff, allowing them to buy an undervalued asset and sell an overvalued one to secure a risk-free profit. The statement in option B describes a market condition where assets are priced perfectly according to their risk, which contradicts the basic premise of arbitrage. C is incorrect. This option states that traders are required to commit a net amount equal to a fraction of the asset value, which misrepresents the nature of arbitrage. Arbitrage opportunities typically involve zero net investment strategies, where the trader exploits price discrepancies without committing any capital. The essence of arbitrage lies in its ability to provide profit opportunities at no net cost; hence, any initial investment would typically be offset by a corresponding credit or opposing position that nullifies the outlay. This option fails to capture the fundamental characteristic of arbitrage that allows for riskless profit without a net investment. ", "explhtml": "<p>The option A addresses the fundamental principle of arbitrage opportunities in financial markets, which is the violation of the value additivity principle. In finance, the value additivity principle states that the value of a portfolio is equal to the sum of the values of its individual assets. For arbitrage to exist, this principle must not hold, meaning the combined value of certain assets when bought or sold in a specific combination should differ from their individual summed values. This discrepancy allows traders like De Silva to exploit price inefficiencies by creating a portfolio where the combined value is greater than the sum of its parts, thus generating a profit without any net investment. This is crucial in arbitrage strategies, where the goal is to take advantage of price differences of the same or similar assets across different markets or forms.<\/p><p><b>B is incorrect<\/b>. This option suggests that a financial asset with a risk-free payoff must trade at a neutral price today, which implies a scenario where no arbitrage opportunities exist because the asset is fairly priced. In the context of arbitrage, traders are looking for mispriced assets where the price does not reflect the true risk-free payoff, allowing them to buy an undervalued asset and sell an overvalued one to secure a risk-free profit. The statement in option B describes a market condition where assets are priced perfectly according to their risk, which contradicts the basic premise of arbitrage.<\/p><p><b>C is incorrect<\/b>. This option states that traders are required to commit a net amount equal to a fraction of the asset value, which misrepresents the nature of arbitrage. Arbitrage opportunities typically involve zero net investment strategies, where the trader exploits price discrepancies without committing any capital. The essence of arbitrage lies in its ability to provide profit opportunities at no net cost; hence, any initial investment would typically be offset by a corresponding credit or opposing position that nullifies the outlay. This option fails to capture the fundamental characteristic of arbitrage that allows for riskless profit without a net investment. <\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage-Free Valuation Framework, LOS 2(a): Explain what is meant by arbitrage-free valuation of a fixed-income instrument;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Peter de Silva<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Peter de Silva is a fixed-income trader at North Traders, a broker-dealer firm situated in the United Kingdom. While de Silva has always been aware of the importance of the arbitrage-free process in valuing fixed-income securities, he has never applied the approach in practice. To learn more about the technique, he engages Kim Young, a colleague, in a discussion. During the discussion, Young makes the following comments:<\/p><p>Statement 1: The arbitrage-free valuation approach derives security values using a process known as stripping and reconstitution.<\/p><p>Statement 2: The arbitrage-free valuation framework is based on the notion that two otherwise identical assets must trade at prices that represent fair value in their respective markets.<\/p><p>Statement 3: The arbitrage-free valuation-free approach, which involves discounting cash flows using individual spot rates, is restrictive because the process cannot be applied to a category of fixed-income securities.<\/p><p>The trader concludes the discussion by inquiring about the conditions that create the potential for arbitrage opportunities.<\/p><p>A few weeks later, De Silva proceeds to apply the learned techniques. He selects three corporate bonds issued by ARC Manufacturing, a global conglomerate. All three issues mature at par, are mispriced, trade on the LSE, and differ concerning credit ratings. De Silva has collected relevant details concerning the three issues and aims to explore potential arbitrage opportunities (Exhibit 1).<\/p><p>Next, De Silva would like to explore how interest rate volatility affects the valuation of fixed-rate option-free bonds. For his analysis, he selects a four-year, 10% annual coupon-paying bond issued by Dutch Inc. He proceeds to calibrate a binomial interest rate tree (Exhibit 2), corresponding to the benchmark yield curve. He is particularly interested in deriving the value of the bond if interest rates follow the designated path:<\/p><p>Year 1 Path: Highest interest path Year 2 Path: Middle interest rate path Year 3 Path: Second highest interest rate path<\/p><p>Dutch Inc. has actively traded mortgage-backed securities. De Silva is exploring which valuation technique will be most appropriate for this security category.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0043.webp\" style=\"max-width:min(100%,515px)\" alt=\"Exhibit 1 Option-free Corporate Bonds Issued by ARC Manufacturing\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0044.webp\" style=\"max-width:min(100%,357px)\" alt=\"Credit ration A-rated BB-rated B-rated\"><p>Price per 100 par (£)* 99.050 97.145 94.145<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0045.webp\" style=\"max-width:min(100%,371px)\" alt=\"Maturity (years) 5 5 5 Coupon (%) 6.0 6.5 7.0 Yield-to-maturity (%) 6.3 7.2 8.1\"><p>*Represents current market price<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0046.webp\" style=\"max-width:min(100%,625px)\" alt=\"Exhibit 2 Calibrated Binomial Interest Rate Tree to Match Benchmark Yield Curve\"><p>Year 0 Year 1 Year 2 Year 3<\/p><p>1.000% 5.639% 7.546% 9.734%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0047.webp\" style=\"max-width:min(100%,206px)\" alt=\"4.616% 6.178% 7.211% 5.058% 5.904% 4.373%\"><\/div><\/details><div class=\"qtext\"><p>The most appropriate response to De Silva’s query is that:<\/p><\/div>", "subj": "fixed"}, {"n": 24, "q": "Using the data in Exhibit 1, which of the following bonds will maximize arbitrage profits:", "opts": ["A-rated", "BB-rated", "B-rated"], "ans": "C", "expl": "The B-rated bond issued by ARC Manufacturing is identified as the most mispriced security, which makes it the optimal choice for maximizing arbitrage profits. To understand why, we need to compare the market price of each bond to its intrinsic value, calculated using the present value of future cash flows. The intrinsic value is determined by discounting the bond's future cash flows (annual coupon payments and the final principal repayment) at the bond's yield-to-maturity. For the B-rated bond, the calculations are as follows: The market price of the B-rated bond is £94.145, which is significantly lower than its calculated intrinsic value of £95.620. This discrepancy indicates that the bond is underpriced by £1.475, making it an attractive buy for arbitrage. By purchasing the bond at its current market price and potentially selling it at or near its intrinsic value when the market corrects this mispricing, an arbitrageur can realize a profit. A is incorrect. The A-rated bond is overpriced relative to its intrinsic value. The intrinsic value calculation for the A-rated bond is: With a market price of £99.050, the A-rated bond is overpriced by £0.303. Buying an overpriced bond does not provide an opportunity for arbitrage profit, as the price is likely to decrease to match the intrinsic value. B is incorrect. The BB-rated bond is fairly priced, as its market price matches its intrinsic value exactly. The intrinsic value calculation for the BB-rated bond is: Since the market price of £97.145 equals the calculated intrinsic value, there is no mispricing to exploit for arbitrage. Arbitrage opportunities arise from discrepancies between market prices and intrinsic values, which is not the case here. ", "explhtml": "<p>The B-rated bond issued by ARC Manufacturing is identified as the most mispriced security, which makes it the optimal choice for maximizing arbitrage profits. To understand why, we need to compare the market price of each bond to its intrinsic value, calculated using the present value of future cash flows. The intrinsic value is determined by discounting the bond&#x27;s future cash flows (annual coupon payments and the final principal repayment) at the bond&#x27;s yield-to-maturity. For the B-rated bond, the calculations are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0048.webp\" style=\"max-width:min(100%,747px)\" alt=\"7 7 7 7 107 Present Value (PV) = + + + + = 95.620 (1 + 0.081)1 (1 + 0.081)2 (1 + 0.081)3 (1 + 0.081)4 (1 + 0.081)5\"><p>The market price of the B-rated bond is £94.145, which is significantly lower than its calculated intrinsic value of £95.620. This discrepancy indicates that the bond is underpriced by £1.475, making it an attractive buy for arbitrage. By purchasing the bond at its current market price and potentially selling it at or near its intrinsic value when the market corrects this mispricing, an arbitrageur can realize a profit.<\/p><p><b>A is incorrect<\/b>. The A-rated bond is overpriced relative to its intrinsic value. The intrinsic value calculation for the A-rated bond is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0049.webp\" style=\"max-width:min(100%,625px)\" alt=\"6 6 6 6 106 PV = + + + + = 98.747 (1 + 0.063)1 (1 + 0.063)2 (1 + 0.063)3 (1 + 0.063)4 (1 + 0.063)5\"><p>With a market price of £99.050, the A-rated bond is overpriced by £0.303. Buying an overpriced bond does not provide an opportunity for arbitrage profit, as the price is likely to decrease to match the intrinsic value.<\/p><p><b>B is incorrect<\/b>. The BB-rated bond is fairly priced, as its market price matches its intrinsic value exactly. The intrinsic value calculation for the BB-rated bond is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0050.webp\" style=\"max-width:min(100%,625px)\" alt=\"6.5 6.5 6.5 6.5 106.5 PV = + + + + = 97.145 (1 + 0.072)1 (1 + 0.072)2 (1 + 0.072)3 (1 + 0.072)4 (1 + 0.072)5\"><p>Since the market price of £97.145 equals the calculated intrinsic value, there is no mispricing to exploit for arbitrage. Arbitrage opportunities arise from discrepancies between market prices and intrinsic values, which is not the case here. <\/p><p class=\"los\">Fixed Income, Learning Module 2: The Arbitrage-Free Valuation Framework, LOS 2(b): Calculate the arbitrage-free value of an option-free, fixed-rate coupon bond;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Peter de Silva<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Peter de Silva is a fixed-income trader at North Traders, a broker-dealer firm situated in the United Kingdom. While de Silva has always been aware of the importance of the arbitrage-free process in valuing fixed-income securities, he has never applied the approach in practice. To learn more about the technique, he engages Kim Young, a colleague, in a discussion. During the discussion, Young makes the following comments:<\/p><p>Statement 1: The arbitrage-free valuation approach derives security values using a process known as stripping and reconstitution.<\/p><p>Statement 2: The arbitrage-free valuation framework is based on the notion that two otherwise identical assets must trade at prices that represent fair value in their respective markets.<\/p><p>Statement 3: The arbitrage-free valuation-free approach, which involves discounting cash flows using individual spot rates, is restrictive because the process cannot be applied to a category of fixed-income securities.<\/p><p>The trader concludes the discussion by inquiring about the conditions that create the potential for arbitrage opportunities.<\/p><p>A few weeks later, De Silva proceeds to apply the learned techniques. He selects three corporate bonds issued by ARC Manufacturing, a global conglomerate. All three issues mature at par, are mispriced, trade on the LSE, and differ concerning credit ratings. De Silva has collected relevant details concerning the three issues and aims to explore potential arbitrage opportunities (Exhibit 1).<\/p><p>Next, De Silva would like to explore how interest rate volatility affects the valuation of fixed-rate option-free bonds. For his analysis, he selects a four-year, 10% annual coupon-paying bond issued by Dutch Inc. He proceeds to calibrate a binomial interest rate tree (Exhibit 2), corresponding to the benchmark yield curve. He is particularly interested in deriving the value of the bond if interest rates follow the designated path:<\/p><p>Year 1 Path: Highest interest path Year 2 Path: Middle interest rate path Year 3 Path: Second highest interest rate path<\/p><p>Dutch Inc. has actively traded mortgage-backed securities. De Silva is exploring which valuation technique will be most appropriate for this security category.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0043.webp\" style=\"max-width:min(100%,515px)\" alt=\"Exhibit 1 Option-free Corporate Bonds Issued by ARC Manufacturing\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0044.webp\" style=\"max-width:min(100%,357px)\" alt=\"Credit ration A-rated BB-rated B-rated\"><p>Price per 100 par (£)* 99.050 97.145 94.145<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0045.webp\" style=\"max-width:min(100%,371px)\" alt=\"Maturity (years) 5 5 5 Coupon (%) 6.0 6.5 7.0 Yield-to-maturity (%) 6.3 7.2 8.1\"><p>*Represents current market price<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0046.webp\" style=\"max-width:min(100%,625px)\" alt=\"Exhibit 2 Calibrated Binomial Interest Rate Tree to Match Benchmark Yield Curve\"><p>Year 0 Year 1 Year 2 Year 3<\/p><p>1.000% 5.639% 7.546% 9.734%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0047.webp\" style=\"max-width:min(100%,206px)\" alt=\"4.616% 6.178% 7.211% 5.058% 5.904% 4.373%\"><\/div><\/details><div class=\"qtext\"><p>Using the data in Exhibit 1, which of the following bonds will maximize arbitrage profits:<\/p><\/div>", "subj": "fixed"}, {"n": 25, "q": "Based on the steps listed in Exhibit 1, Lewis’ application of the structural model is:", "opts": ["Appropriate.", "Inappropriate, standard statistics cannot be used to estimate model parameters.", "Inappropriate, calibration cannot be used because the value of the SPV’s collateral pool is not observable."], "ans": "B", "expl": "The structural model's parameters cannot be accurately estimated using standard statistical methods when dealing with asset-backed securities (ABS) like those managed by Ski-Lone Asset Management. The primary issue here is the lack of observable market prices for the underlying assets, which in this case are credit card loans. Standard statistical methods typically require a historical price series that reflects a freely trading market where prices adjust to reflect all available information. However, the assets in an ABS are not traded in such markets; they are loans issued by financial institutions, and their valuation does not fluctuate in an open market. Therefore, using historical time-series data to estimate parameters such as mean return or volatility is inappropriate because these metrics assume the existence of market-determined prices. The structural model, therefore, requires a different approach, such as using implied or intrinsic valuation methods that do not rely solely on historical trading data. A is incorrect. Claiming that Donna Lewis's application of the structural model is appropriate is incorrect because the model she uses relies on historical time-series observations of issue prices and standard statistical procedures to estimate model parameters. This approach is flawed for ABS valuation as the underlying assets (credit card loans) do not have observable market prices. Without market prices, the historical data does not reflect the true variability and risk associated with the asset values. Thus, relying on such data can lead to inaccurate estimations of risk and value, which are critical in assessing and managing the credit risk of ABS investments. C is incorrect. The statement that calibration cannot be used because the value of the SPV’s collateral pool is not observable misinterprets the nature of calibration in structural models. Calibration, or the adjustment of model parameters to fit market data or known outcomes, is indeed a viable method for estimating parameters when direct observations are not available. It involves using market proxies or related data that can inform on the behavior of the unobservable assets. In the context of ABS, while direct market prices of the loans are not available, other data, such as default rates, recovery rates, and cash flows, can be used to calibrate the model. Therefore, dismissing calibration outright is incorrect; it is a necessary and useful method in the absence of direct market observations. ", "explhtml": "<p>The structural model&#x27;s parameters cannot be accurately estimated using standard statistical methods when dealing with asset-backed securities (ABS) like those managed by Ski-Lone Asset Management. The primary issue here is the lack of observable market prices for the underlying assets, which in this case are credit card loans. Standard statistical methods typically require a historical price series that reflects a freely trading market where prices adjust to reflect all available information. However, the assets in an ABS are not traded in such markets; they are loans issued by financial institutions, and their valuation does not fluctuate in an open market. Therefore, using historical time-series data to estimate parameters such as mean return or volatility is inappropriate because these metrics assume the existence of market-determined prices. The structural model, therefore, requires a different approach, such as using implied or intrinsic valuation methods that do not rely solely on historical trading data.<\/p><p><b>A is incorrect<\/b>. Claiming that Donna Lewis&#x27;s application of the structural model is appropriate is incorrect because the model she uses relies on historical time-series observations of issue prices and standard statistical procedures to estimate model parameters. This approach is flawed for ABS valuation as the underlying assets (credit card loans) do not have observable market prices. Without market prices, the historical data does not reflect the true variability and risk associated with the asset values. Thus, relying on such data can lead to inaccurate estimations of risk and value, which are critical in assessing and managing the credit risk of ABS investments.<\/p><p><b>C is incorrect<\/b>. The statement that calibration cannot be used because the value of the SPV’s collateral pool is not observable misinterprets the nature of calibration in structural models. Calibration, or the adjustment of model parameters to fit market data or known outcomes, is indeed a viable method for estimating parameters when direct observations are not available. It involves using market proxies or related data that can inform on the behavior of the unobservable assets. In the context of ABS, while direct market prices of the loans are not available, other data, such as default rates, recovery rates, and cash flows, can be used to calibrate the model. Therefore, dismissing calibration outright is incorrect; it is a necessary and useful method in the absence of direct market observations. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(d): Explain structural and reduced-form models of corporate credit risk, including assumptions, strengths, and weaknesses;<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Ski-Lone Asset Management<\/summary><div class=\"vig-body\"><p>Ski-Lone Asset Management is a portfolio management firm that targets high-net-worth clients from affluent backgrounds.<\/p><p>Donna Lewis is Ski-Lone’s in-house credit analyst. She is responsible for overseeing asset-backed security (ABS) investments and monitoring the creditworthiness of the firm’s clients. Her current task involves valuing and assessing the credit risk of an ABS issue backed by a pool of credit card loans. She will be using the structural model to value the bond tranches and outlines the framework for constructing the model (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0051.webp\" style=\"max-width:min(100%,585px)\" alt=\"Exhibit 1: Structural Model Framework Step Develop past time-series observations of the issue’s price. 1 Step Employ statistical procedures to estimate model parameters. 2 Step From the issue prices, compute the standard deviation of security 3 prices.\"><p>Lewis proceeds to derive credit risk measures for the ABS. She calculates the probability of loss, the expected loss, and the present value of the expected loss. Additionally, she assigns a credit rating using a scale commonly applied to corporate and sovereign debt in her country.<\/p><p>After performing the necessary analysis, Lewis is asked by her subordinate why she has not calculated the probability of default.<\/p><p>Next, Lewis evaluates the creditworthiness of three firm clients – Selena, Gabrielle, and Walters (Exhibit 2). The clients are applying for a loan scheme from the country’s national bank, which is to be granted to only one applicant. Lewis would like to determine which client will be successful in their application.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0052.webp\" style=\"max-width:min(100%,476px)\" alt=\"Exhibit 2: Credit-Worthiness Evaluation Net Worth Credit Score Selena $1,500,000 220 Gabrielle $825,000 400 Walters $1,370,000 350\"><p>Lewis notes that while Walters’ sole financial obligation is a residential mortgage loan, both Selena and Gabrielle have borrowings from several financial institutions including auto loans, credit cards, and home equity lines of credit.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the steps listed in Exhibit 1, Lewis’ application of the structural model is:<\/p><\/div>", "subj": "fixed"}, {"n": 26, "q": "With respect to her subordinate’s inquiry, Lewis’ most appropriate response is that the probability of default is unsuitable as a credit risk measure because:", "opts": ["The cash flows to an ABS are complex.", "The SPV or bond tranches are not subject to the default risk of the collateral pool.", "Historical default data is difficult to acquire due to the lack of transparency in the reporting."], "ans": "B", "expl": "It accurately reflects the unique structure of asset-backed securities (ABS) and the role of special purpose vehicles (SPVs) in mitigating direct default risk from the underlying collateral pool. In the context of ABS, the SPV is designed to be bankruptcy remote, meaning it is legally and operationally separate from the originator of the loans. This separation ensures that the financial obligations of the collateral pool do not directly impact the SPV or the bond tranches it issues. Consequently, even if defaults occur in the underlying loans, such as credit card debts in this case, these do not translate directly into defaults of the ABS tranches. Instead, the impact is absorbed by the structure of the ABS, where losses are allocated according to the seniority of tranches, and excess spread can be used to cover losses before affecting payments to senior tranche holders. This structural mitigation is why the probability of default is not a suitable measure for ABS, as the default risk of the collateral does not equate to the default risk of the SPV or its tranches. A is incorrect. The complexity of cash flows in an ABS is indeed a challenge in risk assessment; however, this complexity does not directly relate to the suitability of the probability of default as a measure of credit risk. While complex cash flows require sophisticated modeling to predict the timing and amount of cash flows, this complexity is more about the performance and valuation of the ABS rather than its credit risk in terms of default. The statement in option A does not address the structural aspects of ABS that insulate SPV and tranche holders from direct default risks of the collateral pool. C is incorrect. Although acquiring historical default data can be challenging due to transparency issues, this is not the primary reason why the probability of default is unsuitable for measuring the credit risk of an ABS. The primary issue lies in the structural separation between collateral defaults and their impact on the SPV or bond tranches. Even if historical default data were readily available, it would not necessarily provide a relevant basis for assessing the default risk of the ABS tranches themselves, given the mitigating structural mechanisms in place. Thus, the difficulty in acquiring data does not fundamentally alter the inapplicability of the probability of default as a risk measure for ABS. ", "explhtml": "<p>It accurately reflects the unique structure of asset-backed securities (ABS) and the role of special purpose vehicles (SPVs) in mitigating direct default risk from the underlying collateral pool. In the context of ABS, the SPV is designed to be bankruptcy remote, meaning it is legally and operationally separate from the originator of the loans. This separation ensures that the financial obligations of the collateral pool do not directly impact the SPV or the bond tranches it issues. Consequently, even if defaults occur in the underlying loans, such as credit card debts in this case, these do not translate directly into defaults of the ABS tranches. Instead, the impact is absorbed by the structure of the ABS, where losses are allocated according to the seniority of tranches, and excess spread can be used to cover losses before affecting payments to senior tranche holders. This structural mitigation is why the probability of default is not a suitable measure for ABS, as the default risk of the collateral does not equate to the default risk of the SPV or its tranches.<\/p><p><b>A is incorrect<\/b>. The complexity of cash flows in an ABS is indeed a challenge in risk assessment; however, this complexity does not directly relate to the suitability of the probability of default as a measure of credit risk. While complex cash flows require sophisticated modeling to predict the timing and amount of cash flows, this complexity is more about the performance and valuation of the ABS rather than its credit risk in terms of default. The statement in option A does not address the structural aspects of ABS that insulate SPV and tranche holders from direct default risks of the collateral pool.<\/p><p><b>C is incorrect<\/b>. Although acquiring historical default data can be challenging due to transparency issues, this is not the primary reason why the probability of default is unsuitable for measuring the credit risk of an ABS. The primary issue lies in the structural separation between collateral defaults and their impact on the SPV or bond tranches. Even if historical default data were readily available, it would not necessarily provide a relevant basis for assessing the default risk of the ABS tranches themselves, given the mitigating structural mechanisms in place. Thus, the difficulty in acquiring data does not fundamentally alter the inapplicability of the probability of default as a risk measure for ABS. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(h): Compare the credit analysis required for securitized debt to the credit analysis of corporate debt.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Ski-Lone Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ski-Lone Asset Management is a portfolio management firm that targets high-net-worth clients from affluent backgrounds.<\/p><p>Donna Lewis is Ski-Lone’s in-house credit analyst. She is responsible for overseeing asset-backed security (ABS) investments and monitoring the creditworthiness of the firm’s clients. Her current task involves valuing and assessing the credit risk of an ABS issue backed by a pool of credit card loans. She will be using the structural model to value the bond tranches and outlines the framework for constructing the model (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0051.webp\" style=\"max-width:min(100%,585px)\" alt=\"Exhibit 1: Structural Model Framework Step Develop past time-series observations of the issue’s price. 1 Step Employ statistical procedures to estimate model parameters. 2 Step From the issue prices, compute the standard deviation of security 3 prices.\"><p>Lewis proceeds to derive credit risk measures for the ABS. She calculates the probability of loss, the expected loss, and the present value of the expected loss. Additionally, she assigns a credit rating using a scale commonly applied to corporate and sovereign debt in her country.<\/p><p>After performing the necessary analysis, Lewis is asked by her subordinate why she has not calculated the probability of default.<\/p><p>Next, Lewis evaluates the creditworthiness of three firm clients – Selena, Gabrielle, and Walters (Exhibit 2). The clients are applying for a loan scheme from the country’s national bank, which is to be granted to only one applicant. Lewis would like to determine which client will be successful in their application.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0052.webp\" style=\"max-width:min(100%,476px)\" alt=\"Exhibit 2: Credit-Worthiness Evaluation Net Worth Credit Score Selena $1,500,000 220 Gabrielle $825,000 400 Walters $1,370,000 350\"><p>Lewis notes that while Walters’ sole financial obligation is a residential mortgage loan, both Selena and Gabrielle have borrowings from several financial institutions including auto loans, credit cards, and home equity lines of credit.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to her subordinate’s inquiry, Lewis’ most appropriate response is that the probability of default is unsuitable as a credit risk measure because:<\/p><\/div>", "subj": "fixed"}, {"n": 27, "q": "Based on recent market evidence, is Lewis’ use of the rating scale for measuring the credit risk of the ABS appropriate:", "opts": ["Yes.", "No, there is a possibility that the ABS can be mis-rated.", "No, credit ratings do not incorporate the impact of prepayment on security cash flows."], "ans": "B", "expl": "The use of a rating scale designed for corporate and sovereign debt to measure the credit risk of an ABS can lead to potential misratings. Asset-backed securities (ABS) are inherently different from corporate and sovereign bonds due to their structure and the nature of the underlying assets. ABS are backed by pools of assets such as loans, leases, or receivables, which behave differently under various economic conditions compared to corporate or sovereign debt. The complexity and variability in the performance of these underlying assets can lead to discrepancies in risk assessment when traditional rating scales are applied. The financial crisis of 2007/2008 highlighted significant issues in the rating of structured products like ABS, where many securities were rated higher than their actual credit quality warranted. This misrating contributed to the severity of the crisis, leading to a loss of confidence in the reliability of credit ratings for these instruments. Consequently, credit rating agencies have been prompted to revise their methodologies to better address the unique characteristics of ABS. A is incorrect. Option A suggests that using the rating scale to measure the credit risk of the ABS is appropriate. However, this overlooks the critical differences between ABS and other types of debt securities. ABS involves a pool of underlying assets that may not have a direct correlation with the economic factors affecting corporate or sovereign debt. Moreover, the risk associated with ABS is also influenced by factors such as the quality of the asset pool, the originator's underwriting standards, and the structure of the tranches, which can differ significantly from the factors influencing corporate or sovereign debt. Therefore, applying the same rating scale without adjustments for these differences can lead to inaccurate assessments of the ABS's true credit risk. C is incorrect. While it is true that credit ratings often do not incorporate the impact of prepayment on security cash flows, this statement does not directly address the appropriateness of using the rating scale for measuring the credit risk of the ABS. Prepayment risk is indeed a significant factor in the valuation and risk assessment of ABS, as it can affect the timing and amount of cash flows. However, the primary issue with using traditional rating scales is their failure to adequately capture the unique risks and structural complexities of ABS, rather than simply omitting prepayment considerations. Therefore, while prepayment is a relevant concern, it does not fully justify the inappropriateness of using traditional credit rating scales for ABS. ", "explhtml": "<p>The use of a rating scale designed for corporate and sovereign debt to measure the credit risk of an ABS can lead to potential misratings. Asset-backed securities (ABS) are inherently different from corporate and sovereign bonds due to their structure and the nature of the underlying assets. ABS are backed by pools of assets such as loans, leases, or receivables, which behave differently under various economic conditions compared to corporate or sovereign debt. The complexity and variability in the performance of these underlying assets can lead to discrepancies in risk assessment when traditional rating scales are applied. The financial crisis of 2007/2008 highlighted significant issues in the rating of structured products like ABS, where many securities were rated higher than their actual credit quality warranted. This misrating contributed to the severity of the crisis, leading to a loss of confidence in the reliability of credit ratings for these instruments. Consequently, credit rating agencies have been prompted to revise their methodologies to better address the unique characteristics of ABS.<\/p><p><b>A is incorrect<\/b>. Option A suggests that using the rating scale to measure the credit risk of the ABS is appropriate. However, this overlooks the critical differences between ABS and other types of debt securities. ABS involves a pool of underlying assets that may not have a direct correlation with the economic factors affecting corporate or sovereign debt. Moreover, the risk associated with ABS is also influenced by factors such as the quality of the asset pool, the originator&#x27;s underwriting standards, and the structure of the tranches, which can differ significantly from the factors influencing corporate or sovereign debt. Therefore, applying the same rating scale without adjustments for these differences can lead to inaccurate assessments of the ABS&#x27;s true credit risk.<\/p><p><b>C is incorrect<\/b>. While it is true that credit ratings often do not incorporate the impact of prepayment on security cash flows, this statement does not directly address the appropriateness of using the rating scale for measuring the credit risk of the ABS. Prepayment risk is indeed a significant factor in the valuation and risk assessment of ABS, as it can affect the timing and amount of cash flows. However, the primary issue with using traditional rating scales is their failure to adequately capture the unique risks and structural complexities of ABS, rather than simply omitting prepayment considerations. Therefore, while prepayment is a relevant concern, it does not fully justify the inappropriateness of using traditional credit rating scales for ABS. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(d): Explain structural and reduced-form models of corporate credit risk, including assumptions, strengths, and weaknesses;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Ski-Lone Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ski-Lone Asset Management is a portfolio management firm that targets high-net-worth clients from affluent backgrounds.<\/p><p>Donna Lewis is Ski-Lone’s in-house credit analyst. She is responsible for overseeing asset-backed security (ABS) investments and monitoring the creditworthiness of the firm’s clients. Her current task involves valuing and assessing the credit risk of an ABS issue backed by a pool of credit card loans. She will be using the structural model to value the bond tranches and outlines the framework for constructing the model (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0051.webp\" style=\"max-width:min(100%,585px)\" alt=\"Exhibit 1: Structural Model Framework Step Develop past time-series observations of the issue’s price. 1 Step Employ statistical procedures to estimate model parameters. 2 Step From the issue prices, compute the standard deviation of security 3 prices.\"><p>Lewis proceeds to derive credit risk measures for the ABS. She calculates the probability of loss, the expected loss, and the present value of the expected loss. Additionally, she assigns a credit rating using a scale commonly applied to corporate and sovereign debt in her country.<\/p><p>After performing the necessary analysis, Lewis is asked by her subordinate why she has not calculated the probability of default.<\/p><p>Next, Lewis evaluates the creditworthiness of three firm clients – Selena, Gabrielle, and Walters (Exhibit 2). The clients are applying for a loan scheme from the country’s national bank, which is to be granted to only one applicant. Lewis would like to determine which client will be successful in their application.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0052.webp\" style=\"max-width:min(100%,476px)\" alt=\"Exhibit 2: Credit-Worthiness Evaluation Net Worth Credit Score Selena $1,500,000 220 Gabrielle $825,000 400 Walters $1,370,000 350\"><p>Lewis notes that while Walters’ sole financial obligation is a residential mortgage loan, both Selena and Gabrielle have borrowings from several financial institutions including auto loans, credit cards, and home equity lines of credit.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on recent market evidence, is Lewis’ use of the rating scale for measuring the credit risk of the ABS appropriate:<\/p><\/div>", "subj": "fixed"}, {"n": 28, "q": "Based solely on the data in Exhibit 2, which client is most eligible for the loan:", "opts": ["Selena", "Gabrielle", "Walters"], "ans": "B", "expl": "Gabrielle is the most eligible candidate for the loan based on the data provided in Exhibit 2, which includes net worth and credit scores of the applicants. Gabrielle has a credit score of 400, which is the highest among the three candidates. Credit scores are critical indicators used by banks to assess the creditworthiness of individuals. A higher credit score suggests a lower risk of default, as it reflects a history of consistent debt management and repayment. In contrast to net worth, which represents the current value of an individual's assets minus liabilities, a credit score provides a direct insight into the individual's financial behavior and reliability as a borrower. Therefore, Gabrielle's superior credit score makes her the most favorable candidate for the loan, as it indicates a higher likelihood of her meeting financial obligations and repaying the loan. A is incorrect. Selena, despite having a high net worth of $1,500,000, has a significantly lower credit score of 220 compared to Gabrielle. While net worth is an important factor in determining financial stability, the credit score is a more direct measure of a borrower's credit risk and repayment capacity. A lower credit score indicates a higher risk of default due to potential past financial mismanagement or inconsistencies in meeting debt obligations. Therefore, despite her substantial net worth, Selena's low credit score makes her a less suitable candidate for the loan compared to Gabrielle, whose credit score suggests a more reliable credit history and lower risk of default. C is incorrect. Walters has a net worth of $1,370,000 and a credit score of 350, which places him between Selena and Gabrielle in terms of creditworthiness. Although Walters has a higher credit score than Selena, it still falls short of Gabrielle's score. Additionally, Walters' financial obligations include a residential mortgage loan, which could impact his overall debt-to-income ratio and financial flexibility. While his credit score is relatively high, indicating a moderate level of credit risk, it does not provide the same level of confidence in his creditworthiness as Gabrielle's score does. Thus, despite his substantial net worth and a decent credit score, Walters is not the most eligible candidate compared to Gabrielle, who exhibits a stronger credit profile. ", "explhtml": "<p>Gabrielle is the most eligible candidate for the loan based on the data provided in Exhibit 2, which includes net worth and credit scores of the applicants. Gabrielle has a credit score of 400, which is the highest among the three candidates. Credit scores are critical indicators used by banks to assess the creditworthiness of individuals. A higher credit score suggests a lower risk of default, as it reflects a history of consistent debt management and repayment. In contrast to net worth, which represents the current value of an individual&#x27;s assets minus liabilities, a credit score provides a direct insight into the individual&#x27;s financial behavior and reliability as a borrower. Therefore, Gabrielle&#x27;s superior credit score makes her the most favorable candidate for the loan, as it indicates a higher likelihood of her meeting financial obligations and repaying the loan.<\/p><p><b>A is incorrect<\/b>. Selena, despite having a high net worth of $1,500,000, has a significantly lower credit score of 220 compared to Gabrielle. While net worth is an important factor in determining financial stability, the credit score is a more direct measure of a borrower&#x27;s credit risk and repayment capacity. A lower credit score indicates a higher risk of default due to potential past financial mismanagement or inconsistencies in meeting debt obligations. Therefore, despite her substantial net worth, Selena&#x27;s low credit score makes her a less suitable candidate for the loan compared to Gabrielle, whose credit score suggests a more reliable credit history and lower risk of default.<\/p><p><b>C is incorrect<\/b>. Walters has a net worth of $1,370,000 and a credit score of 350, which places him between Selena and Gabrielle in terms of creditworthiness. Although Walters has a higher credit score than Selena, it still falls short of Gabrielle&#x27;s score. Additionally, Walters&#x27; financial obligations include a residential mortgage loan, which could impact his overall debt-to-income ratio and financial flexibility. While his credit score is relatively high, indicating a moderate level of credit risk, it does not provide the same level of confidence in his creditworthiness as Gabrielle&#x27;s score does. Thus, despite his substantial net worth and a decent credit score, Walters is not the most eligible candidate compared to Gabrielle, who exhibits a stronger credit profile. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(b): Explain credit scoring and credit ratings;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Ski-Lone Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ski-Lone Asset Management is a portfolio management firm that targets high-net-worth clients from affluent backgrounds.<\/p><p>Donna Lewis is Ski-Lone’s in-house credit analyst. She is responsible for overseeing asset-backed security (ABS) investments and monitoring the creditworthiness of the firm’s clients. Her current task involves valuing and assessing the credit risk of an ABS issue backed by a pool of credit card loans. She will be using the structural model to value the bond tranches and outlines the framework for constructing the model (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0051.webp\" style=\"max-width:min(100%,585px)\" alt=\"Exhibit 1: Structural Model Framework Step Develop past time-series observations of the issue’s price. 1 Step Employ statistical procedures to estimate model parameters. 2 Step From the issue prices, compute the standard deviation of security 3 prices.\"><p>Lewis proceeds to derive credit risk measures for the ABS. She calculates the probability of loss, the expected loss, and the present value of the expected loss. Additionally, she assigns a credit rating using a scale commonly applied to corporate and sovereign debt in her country.<\/p><p>After performing the necessary analysis, Lewis is asked by her subordinate why she has not calculated the probability of default.<\/p><p>Next, Lewis evaluates the creditworthiness of three firm clients – Selena, Gabrielle, and Walters (Exhibit 2). The clients are applying for a loan scheme from the country’s national bank, which is to be granted to only one applicant. Lewis would like to determine which client will be successful in their application.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0052.webp\" style=\"max-width:min(100%,476px)\" alt=\"Exhibit 2: Credit-Worthiness Evaluation Net Worth Credit Score Selena $1,500,000 220 Gabrielle $825,000 400 Walters $1,370,000 350\"><p>Lewis notes that while Walters’ sole financial obligation is a residential mortgage loan, both Selena and Gabrielle have borrowings from several financial institutions including auto loans, credit cards, and home equity lines of credit.<\/p><\/div><\/details><div class=\"qtext\"><p>Based solely on the data in Exhibit 2, which client is most eligible for the loan:<\/p><\/div>", "subj": "fixed"}, {"n": 29, "q": "By passing new investments through the defined screens, Davis’ security selection will be most likely consistent with the:", "opts": ["Preferred habitat theory.", "Liquidity preference theory.", "Segmented markets theory."], "ans": "C", "expl": "Davis' security selection strategy for Thelta aligns with the segmented markets theory due to the specific investment criteria and the long-term investment horizon of the fund's investors. The segmented markets theory posits that the bond market is composed of distinct segments based on maturity, where each segment's supply and demand dynamics are determined independently of other segments. This theory suggests that investors have preferences for bonds of specific maturities based on their investment needs and constraints, and they do not typically switch between segments even if yields are higher in other segments. In Thelta's case, the investment criteria restrict the inclusion of securities to those that are local, investment-grade, and have a minimum interest rate of 5%. Additionally, the long-term horizon of the fund's investors further narrows the selection to securities that match this specific maturity preference, thereby segmenting the market according to the fund's specific investment strategy and the preferences of its investors. A is incorrect. The preferred habitat theory, while similar to the segmented markets theory in recognizing that investors have preferred maturity ranges, differs in that it allows for flexibility. According to the preferred habitat theory, investors are willing to deviate from their preferred maturity segments if they are compensated with higher returns for taking on additional risk. In the context of Thelta, there is no indication that the fund is willing to shift its investments outside of long-term securities, even if higher returns were available in other maturity ranges. The strict investment criteria set by Davis do not support the flexibility implied by the preferred habitat theory, making this option incorrect. B is incorrect. The liquidity preference theory suggests that investors require a premium to compensate for the higher risk associated with longer-term investments, primarily due to concerns about liquidity. This theory implies a general preference for shorter maturities unless a sufficient premium is offered for longer maturities. However, Thelta's investment strategy is specifically tailored to long-term investments, dictated by the long-term horizons of its investors, rather than a general preference influenced by liquidity considerations. The strategy does not indicate that Thelta is seeking a premium for investing in long-term securities; rather, it is adhering to a predefined investment mandate that focuses on long-term maturity due to investor preferences. Thus, the liquidity preference theory does not adequately describe the fund's investment process. ", "explhtml": "<p>Davis&#x27; security selection strategy for Thelta aligns with the segmented markets theory due to the specific investment criteria and the long-term investment horizon of the fund&#x27;s investors. The segmented markets theory posits that the bond market is composed of distinct segments based on maturity, where each segment&#x27;s supply and demand dynamics are determined independently of other segments. This theory suggests that investors have preferences for bonds of specific maturities based on their investment needs and constraints, and they do not typically switch between segments even if yields are higher in other segments. In Thelta&#x27;s case, the investment criteria restrict the inclusion of securities to those that are local, investment-grade, and have a minimum interest rate of 5%. Additionally, the long-term horizon of the fund&#x27;s investors further narrows the selection to securities that match this specific maturity preference, thereby segmenting the market according to the fund&#x27;s specific investment strategy and the preferences of its investors.<\/p><p><b>A is incorrect<\/b>. The preferred habitat theory, while similar to the segmented markets theory in recognizing that investors have preferred maturity ranges, differs in that it allows for flexibility. According to the preferred habitat theory, investors are willing to deviate from their preferred maturity segments if they are compensated with higher returns for taking on additional risk. In the context of Thelta, there is no indication that the fund is willing to shift its investments outside of long-term securities, even if higher returns were available in other maturity ranges. The strict investment criteria set by Davis do not support the flexibility implied by the preferred habitat theory, making this option incorrect.<\/p><p><b>B is incorrect<\/b>. The liquidity preference theory suggests that investors require a premium to compensate for the higher risk associated with longer-term investments, primarily due to concerns about liquidity. This theory implies a general preference for shorter maturities unless a sufficient premium is offered for longer maturities. However, Thelta&#x27;s investment strategy is specifically tailored to long-term investments, dictated by the long-term horizons of its investors, rather than a general preference influenced by liquidity considerations. The strategy does not indicate that Thelta is seeking a premium for investing in long-term securities; rather, it is adhering to a predefined investment mandate that focuses on long-term maturity due to investor preferences. Thus, the liquidity preference theory does not adequately describe the fund&#x27;s investment process. <\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(h): Explain traditional theories of the term structure of interest rates and describe the implications of each theory for forward rates and the shape of the yield curve;<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Westgate Associates<\/summary><div class=\"vig-body\"><p>Westgate Associates is a global wealth management firm managing Thelta, a fixed-income fund. Leon Davis is the senior fixed-income manager charged with managing Thelta.<\/p><p>Davis is seeking to expand Thelta. However, any selected security must pass through the following screens prior to its inclusion:<\/p><p>1. The minimum credit rating must be investment grade. 2. The investment universe should comprise solely of local issuers. 3. The quoted interest rate should be a minimum of 5%. 4. The investment horizons of fund investors are long-term and must be considered.<\/p><p>Next, Davis collects data on recent yield changes at particular maturity points on the yield curve and key rate durations of Thelta (Exhibit 1). He intends to use this data to analyze the yield curve for changes in:<\/p><p>1. curvature, 2. level, and 3. steepness.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0053.webp\" style=\"max-width:min(100%,598px)\" alt=\"Maturity 2 4 6 8 10 12 +220 +195 +8 Yield +85 bps +110 bps +95 bps bps bps bps Key  rate 3.6 6.5 7.9 8.2 12.4 13.8 duration\"><p>Davis would like to ensure that the yields of the chosen securities have a minimum impact on portfolio volatility. For this purpose, Davis is attempting to analyze the volatility of interest rates using the following:<\/p><p>1. volatility term structure, and 2. Cox-Ingersoll-Ross model.<\/p><p>In addition, Davis seeks to include zero-coupon default-free securities in the fund’s investment portfolio. The analyzed securities and expected one-period and total holding period returns are summarized below (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0054.webp\" style=\"max-width:min(100%,345px)\" alt=\"Exhibit 2: Structural Model Framework\"><p><b>One-period and Holding Period Returns For Zero-Coupon Securities<\/b><\/p><p>Security Maturity (Years) One-Period Return Total Holding Period Return<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0055.webp\" style=\"max-width:min(100%,503px)\" alt=\"A 1 3.5% 3.5% B 2 3.5% 4.0% C 7 3.5% 6.2% D 12 3.5% 8.3% E 15 3.5% 10.1%\"><\/div><\/details><div class=\"qtext\"><p>By passing new investments through the defined screens, Davis’ security selection will be most likely consistent with the:<\/p><\/div>", "subj": "fixed"}, {"n": 30, "q": "Using the data in Exhibit 1, which of the following interest rate changes has the highest effect on the value of the portfolio:", "opts": ["2-year.", "10-year.", "12-year."], "ans": "B", "expl": "Option B is the correct answer because it involves analyzing the impact of interest rate changes on the value of the portfolio through the co
