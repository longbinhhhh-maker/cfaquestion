ions to focus on the credit risk assessment itself, rather than the complexities introduced by market frictions.<\/p><p><b>B is incorrect<\/b>. While it is true that reduced form models allow for an understanding of a company’s default probability, this is not a distinguishing feature when compared to structural models. Structural models also provide insights into default probability, albeit through a different mechanism based on the firm&#x27;s assets and liabilities (often likened to an options pricing framework). The key difference lies in how each model incorporates external economic factors and business conditions. Reduced form models are specifically noted for their ability to adapt to changes in the business cycle, which is not a primary consideration in structural models. Therefore, stating that reduced form models are preferred for their ability to understand default probability does not capture their unique advantage over structural models. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(e): Calculate the value of a bond and its credit spread, given assumptions about the credit risk parameters;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Gayle Yamada<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gayle Yamada is a fixed-income analyst at Hoyce Marshall, a credit ratings agency. Yamada has been tasked with rating and evaluating Rice Trader (RT) bond issues and has partnered with his associate, Carla Thomas.<\/p><p>Yamada expresses his preference for reduced form models, stating, “Traditional credit models such as credit ratings are inflexible and provide an inaccurate estimate of a loan’s default probability.” Thomas asks why Yamada would prefer the reduced form over structural models for computing credit risk measures.<\/p><p>Yamada begins his analysis by comparing credit risk measures for 3- and 4-year RT issues. He has summarized data concerning the two issues (Exhibit 1). The analysts intend to analyze a $100,000 position in each of the two bonds.<\/p><p>Next, Yamada collects credit-adjusted and risk-free valuations concerning the 3-year bonds issued on January 1, 2012 (Exhibit 2). The two analysts aim to determine the maximum amount an investor would pay to an insurer to convert the issue to a default-free bond.<\/p><p>Yamada and Thomas compare the credit analysis of asset-backed securities (ABS) with corporate bonds. The two individuals agree on the following facts:<\/p><p>Fact 1: The Monte Carlo simulation procedure is commonly used for the valuation of corporate and ABS bonds.<\/p><p>Fact 2: The credit measures used for corporate and ABS bonds are broadly similar.<\/p><p>Fact 3: The complexity of ABS structures may render the use of conventional rating scales, used for corporate bonds, as inappropriate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0021.webp\" style=\"max-width:min(100%,512px)\" alt=\"Exhibit 1 Details Concerning 3 and 4-Year RT Bond Issues 3-Year 4-Year Coupon payment frequency Semi-annual Semi-annual Annual coupon rate 10% 12% Face value $1,000 $1,000 Expected loss (per $1,000 par value) $1.245 $0.939 Default probability (per year) 3.5 2.5\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0022.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><p><b>Credit-Adjusted and Risk-Free Valuations of the 3-Year RT Bond Issue<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0023.webp\" style=\"max-width:min(100%,577px)\" alt=\"Payment Date Credit-Adjusted Valuation Risk-Free Valuation June 30th, 2012 49.953 49.989 December 31st, 2012 48.212 48.677 June 30th, 2013 47.001 47.324 December 31st, 2013 46.196 47.117 June 30th, 2014 44.683 45.722 December 31st, 2014 521.573 673.564 Total 757.618 912.393\"><\/div><\/details><div class=\"qtext\"><p>The most appropriate response to Thomas’ query is that reduced form models:<\/p><\/div>", "subj": "fixed"}, {"n": 11, "q": "Using Exhibit 1, which of the following statements is most likely correct:", "opts": ["The 4-year issue has a higher recovery rate.", "The 3-year issue has a lower loss given default.", "The $939 figure reflects a discount for the time value of money and a risk premium."], "ans": "B", "expl": "The correct answer is option B, which states that the 3-year issue has a lower loss given default. To understand why this is the case, we need to calculate the loss given default for both the 3-year and 4-year bond issues. The formula for loss given default is given by: Using the data from Exhibit 1: - For the 3-year issue: - For the 4-year issue: From these calculations, it is evident that the loss given default for the 3-year issue is lower than that for the 4-year issue. This metric is crucial as it indicates the amount lost in the event of a default, expressed as a percentage of the total exposure at default. A lower loss given default implies a lesser financial impact on the investors in the case of default, making the 3-year issue comparatively safer in terms of potential loss severity. A is incorrect. The statement that the 4-year issue has a higher recovery rate is incorrect because the recovery rate is inversely related to the loss given default. The recovery rate can be calculated as: Using the loss given default values calculated: - For the 3-year issue: - For the 4-year issue: Thus, the 4-year issue actually has a slightly lower recovery rate than the 3-year issue, contradicting the statement in option A. C is incorrect. The statement in option C suggests that the figure \\$939 reflects a discount for the time value of money and a risk premium. However, this interpretation is incorrect because the \\$939 figure represents the expected loss for the 4-year bond issue, which is calculated without considering the time value of money or a risk premium. The expected loss is calculated directly from the product of the default probability and the loss given default, both of which are present values and do not incorporate any discounting or risk adjustments. Therefore, the figure does not include considerations for the time value of money or additional risk premiums. ", "explhtml": "<p>The correct answer is option B, which states that the 3-year issue has a lower loss given default. To understand why this is the case, we need to calculate the loss given default for both the 3-year and 4-year bond issues. The formula for loss given default is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0024.webp\" style=\"max-width:min(100%,320px)\" alt=\"Expected loss Loss given default = Default probability\"><p>Using the data from Exhibit 1:<\/p><p>- For the 3-year issue:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0025.webp\" style=\"max-width:min(100%,366px)\" alt=\"$1.245 Loss given default (3-year) = = $35.571 0.035\"><p>- For the 4-year issue:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0026.webp\" style=\"max-width:min(100%,367px)\" alt=\"$0.939 Loss given default (4-year) = = $37.560 0.025\"><p>From these calculations, it is evident that the loss given default for the 3-year issue is lower than that for the 4-year issue. This metric is crucial as it indicates the amount lost in the event of a default, expressed as a percentage of the total exposure at default. A lower loss given default implies a lesser financial impact on the investors in the case of default, making the 3-year issue comparatively safer in terms of potential loss severity.<\/p><p><b>A is incorrect<\/b>. The statement that the 4-year issue has a higher recovery rate is incorrect because the recovery rate is inversely related to the loss given default. The recovery rate can be calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0027.webp\" style=\"max-width:min(100%,308px)\" alt=\"Recovery rate = 1 −Loss given default\"><p>Using the loss given default values calculated:<\/p><p>- For the 3-year issue:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0028.webp\" style=\"max-width:min(100%,377px)\" alt=\"$35.571 Recovery rate (3-year) = 1 − = 96.443% $1,000\"><p>- For the 4-year issue:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0029.webp\" style=\"max-width:min(100%,377px)\" alt=\"$37.560 Recovery rate (4-year) = 1 − = 96.244% $1,000\"><p>Thus, the 4-year issue actually has a slightly lower recovery rate than the 3-year issue, contradicting the statement in option A.<\/p><p><b>C is incorrect<\/b>. The statement in option C suggests that the figure \\$939 reflects a discount for the time value of money and a risk premium. However, this interpretation is incorrect because the \\$939 figure represents the expected loss for the 4-year bond issue, which is calculated without considering the time value of money or a risk premium. The expected loss is calculated directly from the product of the default probability and the loss given default, both of which are present values and do not incorporate any discounting or risk adjustments. Therefore, the figure does not include considerations for the time value of money or additional risk premiums. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(a): Explain expected exposure, the loss given default, the probability of default, and the credit valuation adjustment;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Gayle Yamada<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gayle Yamada is a fixed-income analyst at Hoyce Marshall, a credit ratings agency. Yamada has been tasked with rating and evaluating Rice Trader (RT) bond issues and has partnered with his associate, Carla Thomas.<\/p><p>Yamada expresses his preference for reduced form models, stating, “Traditional credit models such as credit ratings are inflexible and provide an inaccurate estimate of a loan’s default probability.” Thomas asks why Yamada would prefer the reduced form over structural models for computing credit risk measures.<\/p><p>Yamada begins his analysis by comparing credit risk measures for 3- and 4-year RT issues. He has summarized data concerning the two issues (Exhibit 1). The analysts intend to analyze a $100,000 position in each of the two bonds.<\/p><p>Next, Yamada collects credit-adjusted and risk-free valuations concerning the 3-year bonds issued on January 1, 2012 (Exhibit 2). The two analysts aim to determine the maximum amount an investor would pay to an insurer to convert the issue to a default-free bond.<\/p><p>Yamada and Thomas compare the credit analysis of asset-backed securities (ABS) with corporate bonds. The two individuals agree on the following facts:<\/p><p>Fact 1: The Monte Carlo simulation procedure is commonly used for the valuation of corporate and ABS bonds.<\/p><p>Fact 2: The credit measures used for corporate and ABS bonds are broadly similar.<\/p><p>Fact 3: The complexity of ABS structures may render the use of conventional rating scales, used for corporate bonds, as inappropriate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0021.webp\" style=\"max-width:min(100%,512px)\" alt=\"Exhibit 1 Details Concerning 3 and 4-Year RT Bond Issues 3-Year 4-Year Coupon payment frequency Semi-annual Semi-annual Annual coupon rate 10% 12% Face value $1,000 $1,000 Expected loss (per $1,000 par value) $1.245 $0.939 Default probability (per year) 3.5 2.5\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0022.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><p><b>Credit-Adjusted and Risk-Free Valuations of the 3-Year RT Bond Issue<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0023.webp\" style=\"max-width:min(100%,577px)\" alt=\"Payment Date Credit-Adjusted Valuation Risk-Free Valuation June 30th, 2012 49.953 49.989 December 31st, 2012 48.212 48.677 June 30th, 2013 47.001 47.324 December 31st, 2013 46.196 47.117 June 30th, 2014 44.683 45.722 December 31st, 2014 521.573 673.564 Total 757.618 912.393\"><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1, which of the following statements is most likely correct:<\/p><\/div>", "subj": "fixed"}, {"n": 12, "q": "Using Exhibits 1 and 2, the difference between the largest amount an investor is willing to pay (to a third party) to convert the issue to a default-free bond and the expected loss:", "opts": ["Solely reflects a risk premium.", "Is dominated by a risk premium.", "Is dominated by a discount for the time value of money."], "ans": "C", "expl": "The correct answer is option C, which states that the difference between the largest amount an investor is willing to pay to convert the issue to a default-free bond and the expected loss is dominated by a discount for the time value of money. To understand this, we must analyze the financial data presented in Exhibits 1 and 2. The expected loss on the 3-year RT bond issue is calculated as $1,245 ($1.245 × $1, 000). The maximum amount an investor is willing to pay to eliminate the credit risk, which is the difference between the risk-free valuation and the credit-adjusted valuation of the bond, amounts to $154.775 ($912.393 − $757.618). This difference represents the present value of the expected loss, adjusted for the time value of money. Since the actual expected loss is $1,245 and the present value of this expected loss is only $154.775, it is evident that the major component of this difference is the discount for the time value of money, rather than the risk premium itself. A is incorrect. It suggests that the difference is solely due to a risk premium. This interpretation is incorrect because it overlooks the significant role of the time value of money in the calculation of the present value of expected losses. The time value of money fundamentally impacts how future cash flows, such as potential losses, are valued today. In this scenario, the substantial difference between the expected loss and its present value indicates that the time value of money, rather than the risk premium, is the dominant factor. Therefore, stating that the difference solely reflects a risk premium fails to account for the comprehensive financial dynamics at play. B is incorrect. It claims that the difference is dominated by a risk premium. This is misleading because it minimizes the impact of the time value of money. The calculation of the present value of expected losses clearly shows that the time value of money has a more significant effect on the valuation difference than the risk premium. The risk premium, while a factor in the valuation, does not dominate the calculation. The primary influence is the discounting effect, which is due to the time value of money, substantially reducing the present value of expected future losses compared to their nominal value. ", "explhtml": "<p>The correct answer is option C, which states that the difference between the largest amount an investor is willing to pay to convert the issue to a default-free bond and the expected loss is dominated by a discount for the time value of money. To understand this, we must analyze the financial data presented in Exhibits 1 and 2. The expected loss on the 3-year RT bond issue is calculated as $1,245 ($1.245 × $1, 000). The maximum amount an investor is willing to pay to eliminate the credit risk, which is the difference between the risk-free valuation and the credit-adjusted valuation of the bond, amounts to $154.775 ($912.393 − $757.618). This difference represents the present value of the expected loss, adjusted for the time value of money. Since the actual expected loss is $1,245 and the present value of this expected loss is only $154.775, it is evident that the major component of this difference is the discount for the time value of money, rather than the risk premium itself.<\/p><p><b>A is incorrect<\/b>. It suggests that the difference is solely due to a risk premium. This interpretation is incorrect because it overlooks the significant role of the time value of money in the calculation of the present value of expected losses. The time value of money fundamentally impacts how future cash flows, such as potential losses, are valued today. In this scenario, the substantial difference between the expected loss and its present value indicates that the time value of money, rather than the risk premium, is the dominant factor. Therefore, stating that the difference solely reflects a risk premium fails to account for the comprehensive financial dynamics at play.<\/p><p><b>B is incorrect<\/b>. It claims that the difference is dominated by a risk premium. This is misleading because it minimizes the impact of the time value of money. The calculation of the present value of expected losses clearly shows that the time value of money has a more significant effect on the valuation difference than the risk premium. The risk premium, while a factor in the valuation, does not dominate the calculation. The primary influence is the discounting effect, which is due to the time value of money, substantially reducing the present value of expected future losses compared to their nominal value. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(h): Compare the credit analysis required for securitized debt to the credit analysis of corporate debt<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Gayle Yamada<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gayle Yamada is a fixed-income analyst at Hoyce Marshall, a credit ratings agency. Yamada has been tasked with rating and evaluating Rice Trader (RT) bond issues and has partnered with his associate, Carla Thomas.<\/p><p>Yamada expresses his preference for reduced form models, stating, “Traditional credit models such as credit ratings are inflexible and provide an inaccurate estimate of a loan’s default probability.” Thomas asks why Yamada would prefer the reduced form over structural models for computing credit risk measures.<\/p><p>Yamada begins his analysis by comparing credit risk measures for 3- and 4-year RT issues. He has summarized data concerning the two issues (Exhibit 1). The analysts intend to analyze a $100,000 position in each of the two bonds.<\/p><p>Next, Yamada collects credit-adjusted and risk-free valuations concerning the 3-year bonds issued on January 1, 2012 (Exhibit 2). The two analysts aim to determine the maximum amount an investor would pay to an insurer to convert the issue to a default-free bond.<\/p><p>Yamada and Thomas compare the credit analysis of asset-backed securities (ABS) with corporate bonds. The two individuals agree on the following facts:<\/p><p>Fact 1: The Monte Carlo simulation procedure is commonly used for the valuation of corporate and ABS bonds.<\/p><p>Fact 2: The credit measures used for corporate and ABS bonds are broadly similar.<\/p><p>Fact 3: The complexity of ABS structures may render the use of conventional rating scales, used for corporate bonds, as inappropriate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0021.webp\" style=\"max-width:min(100%,512px)\" alt=\"Exhibit 1 Details Concerning 3 and 4-Year RT Bond Issues 3-Year 4-Year Coupon payment frequency Semi-annual Semi-annual Annual coupon rate 10% 12% Face value $1,000 $1,000 Expected loss (per $1,000 par value) $1.245 $0.939 Default probability (per year) 3.5 2.5\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0022.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><p><b>Credit-Adjusted and Risk-Free Valuations of the 3-Year RT Bond Issue<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0023.webp\" style=\"max-width:min(100%,577px)\" alt=\"Payment Date Credit-Adjusted Valuation Risk-Free Valuation June 30th, 2012 49.953 49.989 December 31st, 2012 48.212 48.677 June 30th, 2013 47.001 47.324 December 31st, 2013 46.196 47.117 June 30th, 2014 44.683 45.722 December 31st, 2014 521.573 673.564 Total 757.618 912.393\"><\/div><\/details><div class=\"qtext\"><p>Using Exhibits 1 and 2, the difference between the largest amount an investor is willing to pay (to a third party) to convert the issue to a default-free bond and the expected loss:<\/p><\/div>", "subj": "fixed"}, {"n": 13, "q": "The most appropriate measure of credit risk for achieving Engle’s objectives is:", "opts": ["Credit scores.", "Loss given default.", "Present value of expected loss."], "ans": "C", "expl": "The most appropriate measure of credit risk for achieving Engle's objectives is the present value of expected losses. This measure effectively incorporates several critical factors that Engle aims to capture in his credit risk assessment. Firstly, it accounts for the current economic conditions by integrating the default probability, which can fluctuate based on economic stability and company performance. Secondly, the present value of expected losses calculation includes the time value of money, a fundamental concept in finance that reflects the idea that money available at the present time is worth more than the same amount in the future due to its potential earning capacity. Lastly, it considers the riskiness of expected cash flows through the loss given default component, which estimates the amount likely to be lost in the event of a default. By combining these elements, the present value of expected losses provides a comprehensive, forward-looking estimate of credit risk that aligns with Engle's objectives. A is incorrect. Credit scores, while useful for a quick assessment of creditworthiness, fall short of Engle's requirements for several reasons. Primarily, credit scores are static indicators that do not necessarily reflect real-time economic conditions or changes in the debtor's financial situation unless they are frequently updated. Moreover, credit scores do not incorporate the time value of money, an essential factor in determining the present worth of future losses. They also do not directly measure the expected losses but rather provide a relative ranking of credit risk, which can be ambiguous and not quantitatively precise. Therefore, relying solely on credit scores could lead to an incomplete and potentially misleading assessment of credit risk. B is incorrect. Loss given default is indeed an important component of credit risk assessment as it estimates the potential loss a lender might face if a borrower defaults. However, on its own, this measure does not fulfill all of Engle's criteria for an ideal credit risk measure. Specifically, it lacks a consideration of the time value of money, which is crucial for understanding the true economic impact of potential future losses. Without integrating this aspect, the loss given default only provides a partial view of the risk landscape, ignoring how the value of these losses changes over time. Consequently, while informative, loss given default alone does not provide a comprehensive tool for credit risk assessment in line with Engle's objectives. ", "explhtml": "<p>The most appropriate measure of credit risk for achieving Engle&#x27;s objectives is the present value of expected losses. This measure effectively incorporates several critical factors that Engle aims to capture in his credit risk assessment. Firstly, it accounts for the current economic conditions by integrating the default probability, which can fluctuate based on economic stability and company performance. Secondly, the present value of expected losses calculation includes the time value of money, a fundamental concept in finance that reflects the idea that money available at the present time is worth more than the same amount in the future due to its potential earning capacity. Lastly, it considers the riskiness of expected cash flows through the loss given default component, which estimates the amount likely to be lost in the event of a default. By combining these elements, the present value of expected losses provides a comprehensive, forward-looking estimate of credit risk that aligns with Engle&#x27;s objectives.<\/p><p><b>A is incorrect.<\/b> Credit scores, while useful for a quick assessment of creditworthiness, fall short of Engle&#x27;s requirements for several reasons. Primarily, credit scores are static indicators that do not necessarily reflect real-time economic conditions or changes in the debtor&#x27;s financial situation unless they are frequently updated. Moreover, credit scores do not incorporate the time value of money, an essential factor in determining the present worth of future losses. They also do not directly measure the expected losses but rather provide a relative ranking of credit risk, which can be ambiguous and not quantitatively precise. Therefore, relying solely on credit scores could lead to an incomplete and potentially misleading assessment of credit risk.<\/p><p><b>B is incorrect.<\/b> Loss given default is indeed an important component of credit risk assessment as it estimates the potential loss a lender might face if a borrower defaults. However, on its own, this measure does not fulfill all of Engle&#x27;s criteria for an ideal credit risk measure. Specifically, it lacks a consideration of the time value of money, which is crucial for understanding the true economic impact of potential future losses. Without integrating this aspect, the loss given default only provides a partial view of the risk landscape, ignoring how the value of these losses changes over time. Consequently, while informative, loss given default alone does not provide a comprehensive tool for credit risk assessment in line with Engle&#x27;s objectives. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(a): Explain expected exposure, the loss given default, the probability of default, and the credit valuation adjustment;<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Mark Engle<\/summary><div class=\"vig-body\"><p>Mark Engle is a credit analyst at SouthMark, a credit ratings firm. Engle is currently involved in generating credit rankings for three corporate debt issuers.<\/p><p>Engle evaluates the credit profiles of the three issuers and derives several credit risk measures such as credit scores, default probability, loss given default, and the present value of expected losses (Exhibit 1). In evaluating credit quality, he aims to select the measure that best captures:<\/p><p>current economic conditions,<\/p><p>the time value of money, and<\/p><p>the riskiness of expected cash flows.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0030.webp\" style=\"max-width:min(100%,592px)\" alt=\"Exhibit 1 Issuer Smithson Carl Jones Alpha Manufacturing plc Ltd Credit score 100 200 600 Default probability 2.15 0.05 1.20 Present value of expected losses $7.50 $12.35 $15.04 Loss given default $9.50 $15.00 $17.60\"><p>Percentage of lender exposure<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0031.webp\" style=\"max-width:min(100%,575px)\" alt=\"20% 25% 50% to credit risk\"><p>Engle’s results are reviewed by his colleague, Jeff Davidson, who has several reservations concerning the use of credit scores for risk assessment. Two of his three concerns are as follows:<\/p><p>Concern 1: Smithson Manufacturing – The issuer has undertaken significant restructuring in its financial structure. This change is unlikely to be reflected in its credit score.<\/p><p>Concern 2: Carl Jones plc – The lender has expressed a strong preference for maintaining stability in credit ratings. Therefore, any ratings generated by the firm are unlikely to be objective.<\/p><p>Tim Gavin is a fixed-income analyst at West Portals, a web-based firm providing consultancy services to credit ratings agencies. Recognizing the limitations associated with the company’s current ratings system, Gavin collaborates with Engle to develop a formal analytical tool for rating assessment. Gavin’s tool is based on the structural model.<\/p><p>In a preliminary discussion, Gavin tells Engle, “I have read that the structural model relies on the equity option analogy, which states that a shareholder&#x27;s wealth is in an economically equivalent position to a European call option holder. What does this imply for a company’s debt holders?”<\/p><p>Gavin demonstrates the application of the structural model by exploring the debt structure of Lockweed Inc., a debt issuer. He aims to derive a value for the company’s debt structure after accounting for default probabilities. He has collected data for valuation (Exhibit 2). He will value the company’s debt structure using the accounting identity, A<sub>t<\/sub> = D(t, T) + S<sub>t<\/sub>.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0032.webp\" style=\"max-width:min(100%,572px)\" alt=\"Exhibit 2 Application of the Structural Model to Value Lockweed Inc.’s Debt Time to maturity (T – t) 3 years\"><p>Probability asset value 3 years from today is = face value of debt 14.51%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0033.webp\" style=\"max-width:min(100%,395px)\" alt=\"N(-d1) 0.097 Face value of debt $850 Asset value today $1,200 Risk-free rate 2.50%\"><p>Gavin concludes his analysis by bringing to Engle’s knowledge the assumptions used in generating the data in Exhibit 2.<\/p><\/div><\/details><div class=\"qtext\"><p>The most appropriate measure of credit risk for achieving Engle’s objectives is:<\/p><\/div>", "subj": "fixed"}, {"n": 14, "q": "Using the data in Exhibit 1, which of the following conclusions concerning the credit risk positions of the three issuers is most appropriate:", "opts": ["Alpha Ltd is twice as risky as Carl Jones plc based on credit scores.", "The cost of removing credit risk is highest for Alpha Ltd.", "A corporate lender should expect to recover the highest amount on the Alpha Limited issue in the event of default."], "ans": "B", "expl": "The correct answer is option B because it focuses on the present value of expected losses, which is a comprehensive measure incorporating both the probability of default and the potential loss amount in the event of a default. In Exhibit 1, Alpha Ltd has the highest present value of expected losses at $15.04, compared to $12.35 for Carl Jones plc and $7.50 for Smithson Manufacturing. This indicates that the cost to mitigate or remove the credit risk associated with Alpha Ltd is higher than that for the other two issuers. The present value of expected losses effectively quantifies the economic burden that a lender would face today if they were to completely eliminate the credit risk of holding the bond. This measure is particularly relevant as it considers the time value of money, aligning with Engle's objective to select a measure that captures current economic conditions and the riskiness of expected cash flows. A is incorrect. The statement in option A suggests a direct quantitative comparison (twice as risky) based on credit scores alone. However, credit scores are ordinal measures and do not provide a scale that quantifies risk in multiples between issuers. They rank issuers from least to most risky but do not indicate how much more risky one issuer is compared to another. Therefore, stating that Alpha Ltd is twice as risky as Carl Jones plc based solely on their credit scores lacks a quantitative basis and misinterprets the nature of ordinal data. C is incorrect. Option C's statement that a corporate lender should expect to recover the highest amount from Alpha Ltd in the event of default is incorrect when analyzing the data provided. Recovery rate, which is crucial in determining the amount recoverable, is calculated as 1 − Loss Given Default. From Exhibit 1, the percentage of lender exposure to credit risk (which can be interpreted as loss given default) for Alpha Ltd is 50%, leading to a recovery rate of  1 − 0.50 = 0.50 or 50%. In contrast, Smithson Manufacturing has a lower percentage of lender exposure at 20%, resulting in a higher recovery rate of 1 − 0.20 = 0.80 or 80%. Thus, a lender should expect to recover more from Smithson Manufacturing than from Alpha Ltd, contrary to what option C suggests. ", "explhtml": "<p>The correct answer is option B because it focuses on the present value of expected losses, which is a comprehensive measure incorporating both the probability of default and the potential loss amount in the event of a default. In Exhibit 1, Alpha Ltd has the highest present value of expected losses at $15.04, compared to $12.35 for Carl Jones plc and $7.50 for Smithson Manufacturing. This indicates that the cost to mitigate or remove the credit risk associated with Alpha Ltd is higher than that for the other two issuers. The present value of expected losses effectively quantifies the economic burden that a lender would face today if they were to completely eliminate the credit risk of holding the bond. This measure is particularly relevant as it considers the time value of money, aligning with Engle&#x27;s objective to select a measure that captures current economic conditions and the riskiness of expected cash flows.<\/p><p><b>A is incorrect<\/b>. The statement in option A suggests a direct quantitative comparison (twice as risky) based on credit scores alone. However, credit scores are ordinal measures and do not provide a scale that quantifies risk in multiples between issuers. They rank issuers from least to most risky but do not indicate how much more risky one issuer is compared to another. Therefore, stating that Alpha Ltd is twice as risky as Carl Jones plc based solely on their credit scores lacks a quantitative basis and misinterprets the nature of ordinal data.<\/p><p><b>C is incorrect<\/b>. Option C&#x27;s statement that a corporate lender should expect to recover the highest amount from Alpha Ltd in the event of default is incorrect when analyzing the data provided. Recovery rate, which is crucial in determining the amount recoverable, is calculated as 1 − Loss Given Default. From Exhibit 1, the percentage of lender exposure to credit risk (which can be interpreted as loss given default) for Alpha Ltd is 50%, leading to a recovery rate of  1 − 0.50 = 0.50 or 50%. In contrast, Smithson Manufacturing has a lower percentage of lender exposure at 20%, resulting in a higher recovery rate of 1 − 0.20 = 0.80 or 80%. Thus, a lender should expect to recover more from Smithson Manufacturing than from Alpha Ltd, contrary to what option C suggests. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(a): Explain expected exposure, the loss given default, the probability of default, and the credit valuation adjustment;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Mark Engle<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mark Engle is a credit analyst at SouthMark, a credit ratings firm. Engle is currently involved in generating credit rankings for three corporate debt issuers.<\/p><p>Engle evaluates the credit profiles of the three issuers and derives several credit risk measures such as credit scores, default probability, loss given default, and the present value of expected losses (Exhibit 1). In evaluating credit quality, he aims to select the measure that best captures:<\/p><p>current economic conditions,<\/p><p>the time value of money, and<\/p><p>the riskiness of expected cash flows.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0030.webp\" style=\"max-width:min(100%,592px)\" alt=\"Exhibit 1 Issuer Smithson Carl Jones Alpha Manufacturing plc Ltd Credit score 100 200 600 Default probability 2.15 0.05 1.20 Present value of expected losses $7.50 $12.35 $15.04 Loss given default $9.50 $15.00 $17.60\"><p>Percentage of lender exposure<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0031.webp\" style=\"max-width:min(100%,575px)\" alt=\"20% 25% 50% to credit risk\"><p>Engle’s results are reviewed by his colleague, Jeff Davidson, who has several reservations concerning the use of credit scores for risk assessment. Two of his three concerns are as follows:<\/p><p>Concern 1: Smithson Manufacturing – The issuer has undertaken significant restructuring in its financial structure. This change is unlikely to be reflected in its credit score.<\/p><p>Concern 2: Carl Jones plc – The lender has expressed a strong preference for maintaining stability in credit ratings. Therefore, any ratings generated by the firm are unlikely to be objective.<\/p><p>Tim Gavin is a fixed-income analyst at West Portals, a web-based firm providing consultancy services to credit ratings agencies. Recognizing the limitations associated with the company’s current ratings system, Gavin collaborates with Engle to develop a formal analytical tool for rating assessment. Gavin’s tool is based on the structural model.<\/p><p>In a preliminary discussion, Gavin tells Engle, “I have read that the structural model relies on the equity option analogy, which states that a shareholder&#x27;s wealth is in an economically equivalent position to a European call option holder. What does this imply for a company’s debt holders?”<\/p><p>Gavin demonstrates the application of the structural model by exploring the debt structure of Lockweed Inc., a debt issuer. He aims to derive a value for the company’s debt structure after accounting for default probabilities. He has collected data for valuation (Exhibit 2). He will value the company’s debt structure using the accounting identity, A<sub>t<\/sub> = D(t, T) + S<sub>t<\/sub>.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0032.webp\" style=\"max-width:min(100%,572px)\" alt=\"Exhibit 2 Application of the Structural Model to Value Lockweed Inc.’s Debt Time to maturity (T – t) 3 years\"><p>Probability asset value 3 years from today is = face value of debt 14.51%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0033.webp\" style=\"max-width:min(100%,395px)\" alt=\"N(-d1) 0.097 Face value of debt $850 Asset value today $1,200 Risk-free rate 2.50%\"><p>Gavin concludes his analysis by bringing to Engle’s knowledge the assumptions used in generating the data in Exhibit 2.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data in Exhibit 1, which of the following conclusions concerning the credit risk positions of the three issuers is most appropriate:<\/p><\/div>", "subj": "fixed"}, {"n": 15, "q": "Which of the following least likely represents a valid concern of using credit scores:", "opts": ["Concern 1 only.", "Concern 2 only.", "Both concerns 1 and 2."], "ans": "A", "expl": "Correct answer is A: Concern 1 only. Concern 1 relates to Smithson Manufacturing, which has undergone significant restructuring in its financial structure. This concern suggests that the credit score may not reflect recent changes. However, credit scores are dynamic and are typically updated to incorporate new financial data as it becomes available. This includes significant changes such as restructuring. Credit scoring models are designed to adapt to changes in a company's financial situation by integrating the latest financial statements and market data. Therefore, the concern that credit scores do not reflect recent financial restructuring is generally unfounded as the scores are recalculated when new financial information is presented. B is incorrect: Concern 2 only. Concern 2 is a valid concern regarding the use of credit scores. It highlights the issue of potential bias in credit ratings, particularly when lenders express a preference for maintaining stability in credit ratings. This preference can lead to pressure on credit rating agencies to issue more favorable ratings than warranted or to resist changing a rating to reflect the true current risk. Such practices can compromise the objectivity and reliability of credit scores, rendering them less effective as a measure of true credit risk. This concern is particularly relevant in environments where regulatory or market pressures unduly influence the credit assessment process. C is incorrect. Both concerns 1 and 2. This option suggests that both concerns are valid criticisms of using credit scores. However, as explained, Concern 1 is not a valid criticism because credit scores are regularly updated to reflect new financial information, including significant restructuring. Therefore, the statement that credit scores fail to reflect such changes is incorrect. On the other hand, Concern 2 does represent a legitimate issue with the use of credit scores, as it points to the potential for bias and lack of objectivity in credit rating processes influenced by external pressures. ", "explhtml": "<p><b>Correct answer is A<\/b>: Concern 1 only.<\/p><p>Concern 1 relates to Smithson Manufacturing, which has undergone significant restructuring in its financial structure. This concern suggests that the credit score may not reflect recent changes. However, credit scores are dynamic and are typically updated to incorporate new financial data as it becomes available. This includes significant changes such as restructuring. Credit scoring models are designed to adapt to changes in a company&#x27;s financial situation by integrating the latest financial statements and market data. Therefore, the concern that credit scores do not reflect recent financial restructuring is generally unfounded as the scores are recalculated when new financial information is presented.<\/p><p><b>B is incorrect<\/b>: Concern 2 only. Concern 2 is a valid concern regarding the use of credit scores. It highlights the issue of potential bias in credit ratings, particularly when lenders express a preference for maintaining stability in credit ratings. This preference can lead to pressure on credit rating agencies to issue more favorable ratings than warranted or to resist changing a rating to reflect the true current risk. Such practices can compromise the objectivity and reliability of credit scores, rendering them less effective as a measure of true credit risk. This concern is particularly relevant in environments where regulatory or market pressures unduly influence the credit assessment process.<\/p><p><b>C is incorrect<\/b>. Both concerns 1 and 2. This option suggests that both concerns are valid criticisms of using credit scores. However, as explained, Concern 1 is not a valid criticism because credit scores are regularly updated to reflect new financial information, including significant restructuring. Therefore, the statement that credit scores fail to reflect such changes is incorrect. On the other hand, Concern 2 does represent a legitimate issue with the use of credit scores, as it points to the potential for bias and lack of objectivity in credit rating processes influenced by external pressures. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(d): Explain structural and reduced-form models of corporate credit risk, including assumptions, strengths, and weaknesses;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Mark Engle<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mark Engle is a credit analyst at SouthMark, a credit ratings firm. Engle is currently involved in generating credit rankings for three corporate debt issuers.<\/p><p>Engle evaluates the credit profiles of the three issuers and derives several credit risk measures such as credit scores, default probability, loss given default, and the present value of expected losses (Exhibit 1). In evaluating credit quality, he aims to select the measure that best captures:<\/p><p>current economic conditions,<\/p><p>the time value of money, and<\/p><p>the riskiness of expected cash flows.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0030.webp\" style=\"max-width:min(100%,592px)\" alt=\"Exhibit 1 Issuer Smithson Carl Jones Alpha Manufacturing plc Ltd Credit score 100 200 600 Default probability 2.15 0.05 1.20 Present value of expected losses $7.50 $12.35 $15.04 Loss given default $9.50 $15.00 $17.60\"><p>Percentage of lender exposure<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0031.webp\" style=\"max-width:min(100%,575px)\" alt=\"20% 25% 50% to credit risk\"><p>Engle’s results are reviewed by his colleague, Jeff Davidson, who has several reservations concerning the use of credit scores for risk assessment. Two of his three concerns are as follows:<\/p><p>Concern 1: Smithson Manufacturing – The issuer has undertaken significant restructuring in its financial structure. This change is unlikely to be reflected in its credit score.<\/p><p>Concern 2: Carl Jones plc – The lender has expressed a strong preference for maintaining stability in credit ratings. Therefore, any ratings generated by the firm are unlikely to be objective.<\/p><p>Tim Gavin is a fixed-income analyst at West Portals, a web-based firm providing consultancy services to credit ratings agencies. Recognizing the limitations associated with the company’s current ratings system, Gavin collaborates with Engle to develop a formal analytical tool for rating assessment. Gavin’s tool is based on the structural model.<\/p><p>In a preliminary discussion, Gavin tells Engle, “I have read that the structural model relies on the equity option analogy, which states that a shareholder&#x27;s wealth is in an economically equivalent position to a European call option holder. What does this imply for a company’s debt holders?”<\/p><p>Gavin demonstrates the application of the structural model by exploring the debt structure of Lockweed Inc., a debt issuer. He aims to derive a value for the company’s debt structure after accounting for default probabilities. He has collected data for valuation (Exhibit 2). He will value the company’s debt structure using the accounting identity, A<sub>t<\/sub> = D(t, T) + S<sub>t<\/sub>.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0032.webp\" style=\"max-width:min(100%,572px)\" alt=\"Exhibit 2 Application of the Structural Model to Value Lockweed Inc.’s Debt Time to maturity (T – t) 3 years\"><p>Probability asset value 3 years from today is = face value of debt 14.51%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0033.webp\" style=\"max-width:min(100%,395px)\" alt=\"N(-d1) 0.097 Face value of debt $850 Asset value today $1,200 Risk-free rate 2.50%\"><p>Gavin concludes his analysis by bringing to Engle’s knowledge the assumptions used in generating the data in Exhibit 2.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following least likely represents a valid concern of using credit scores:<\/p><\/div>", "subj": "fixed"}, {"n": 16, "q": "Engle’s most appropriate response to Gavin’s query is that the company’s debt holders:", "opts": ["Have sold insurance on the company’s assets.", "Have rights that extend to the personal wealth of shareowners.", "Collect the value of a company’s assets if the face value of debt is above the asset value."], "ans": "C", "expl": "Engle's most appropriate response to Gavin's query about the implications of the structural model for debt holders is that they collect the value of a company's assets if the face value of the debt is above the asset value. This understanding is rooted in the structural model of credit risk, which treats the company's equity as a European call option on its assets, with the debt acting as the strike price. If the company's asset value exceeds the face value of the debt at maturity, the debt holders are paid the face value. However, if the asset value is less than the face value of the debt, the debt holders receive the remaining asset value, which may be less than the promised debt repayment. This model highlights the risk to debt holders if the company's assets depreciate below the level of its liabilities. A is incorrect. The option to sell insurance on the company's assets is not an accurate representation of the debt holders' position. In the structural model, while debt holders do face risk similar to an insurer (in terms of covering losses when asset values fall below a certain threshold), they do not actively sell insurance. Instead, they are involuntarily exposed to this risk by virtue of holding debt. The analogy of selling insurance might confuse the passive risk exposure with an active insurance provision, which is not the case in corporate debt structures. B is incorrect. The statement that debt holders have rights extending to the personal wealth of shareholders is fundamentally incorrect due to the principle of limited liability. Shareholders' liability is limited to the capital they have invested in the company. Therefore, in the event that the asset value falls below the debt value, debt holders cannot claim the personal assets of the shareholders. This limitation is a critical aspect of corporate structure, protecting shareholders and defining the boundaries of debt holders' claims solely to the company's assets. ", "explhtml": "<p>Engle&#x27;s most appropriate response to Gavin&#x27;s query about the implications of the structural model for debt holders is that they collect the value of a company&#x27;s assets if the face value of the debt is above the asset value. This understanding is rooted in the structural model of credit risk, which treats the company&#x27;s equity as a European call option on its assets, with the debt acting as the strike price. If the company&#x27;s asset value exceeds the face value of the debt at maturity, the debt holders are paid the face value. However, if the asset value is less than the face value of the debt, the debt holders receive the remaining asset value, which may be less than the promised debt repayment. This model highlights the risk to debt holders if the company&#x27;s assets depreciate below the level of its liabilities.<\/p><p><b>A is incorrect<\/b>. The option to sell insurance on the company&#x27;s assets is not an accurate representation of the debt holders&#x27; position. In the structural model, while debt holders do face risk similar to an insurer (in terms of covering losses when asset values fall below a certain threshold), they do not actively sell insurance. Instead, they are involuntarily exposed to this risk by virtue of holding debt. The analogy of selling insurance might confuse the passive risk exposure with an active insurance provision, which is not the case in corporate debt structures.<\/p><p><b>B is incorrect<\/b>. The statement that debt holders have rights extending to the personal wealth of shareholders is fundamentally incorrect due to the principle of limited liability. Shareholders&#x27; liability is limited to the capital they have invested in the company. Therefore, in the event that the asset value falls below the debt value, debt holders cannot claim the personal assets of the shareholders. This limitation is a critical aspect of corporate structure, protecting shareholders and defining the boundaries of debt holders&#x27; claims solely to the company&#x27;s assets. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(g): Explain the determinants of the term structure of credit spreads and interpret a term structure of credit spreads;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Mark Engle<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mark Engle is a credit analyst at SouthMark, a credit ratings firm. Engle is currently involved in generating credit rankings for three corporate debt issuers.<\/p><p>Engle evaluates the credit profiles of the three issuers and derives several credit risk measures such as credit scores, default probability, loss given default, and the present value of expected losses (Exhibit 1). In evaluating credit quality, he aims to select the measure that best captures:<\/p><p>current economic conditions,<\/p><p>the time value of money, and<\/p><p>the riskiness of expected cash flows.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0030.webp\" style=\"max-width:min(100%,592px)\" alt=\"Exhibit 1 Issuer Smithson Carl Jones Alpha Manufacturing plc Ltd Credit score 100 200 600 Default probability 2.15 0.05 1.20 Present value of expected losses $7.50 $12.35 $15.04 Loss given default $9.50 $15.00 $17.60\"><p>Percentage of lender exposure<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0031.webp\" style=\"max-width:min(100%,575px)\" alt=\"20% 25% 50% to credit risk\"><p>Engle’s results are reviewed by his colleague, Jeff Davidson, who has several reservations concerning the use of credit scores for risk assessment. Two of his three concerns are as follows:<\/p><p>Concern 1: Smithson Manufacturing – The issuer has undertaken significant restructuring in its financial structure. This change is unlikely to be reflected in its credit score.<\/p><p>Concern 2: Carl Jones plc – The lender has expressed a strong preference for maintaining stability in credit ratings. Therefore, any ratings generated by the firm are unlikely to be objective.<\/p><p>Tim Gavin is a fixed-income analyst at West Portals, a web-based firm providing consultancy services to credit ratings agencies. Recognizing the limitations associated with the company’s current ratings system, Gavin collaborates with Engle to develop a formal analytical tool for rating assessment. Gavin’s tool is based on the structural model.<\/p><p>In a preliminary discussion, Gavin tells Engle, “I have read that the structural model relies on the equity option analogy, which states that a shareholder&#x27;s wealth is in an economically equivalent position to a European call option holder. What does this imply for a company’s debt holders?”<\/p><p>Gavin demonstrates the application of the structural model by exploring the debt structure of Lockweed Inc., a debt issuer. He aims to derive a value for the company’s debt structure after accounting for default probabilities. He has collected data for valuation (Exhibit 2). He will value the company’s debt structure using the accounting identity, A<sub>t<\/sub> = D(t, T) + S<sub>t<\/sub>.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0032.webp\" style=\"max-width:min(100%,572px)\" alt=\"Exhibit 2 Application of the Structural Model to Value Lockweed Inc.’s Debt Time to maturity (T – t) 3 years\"><p>Probability asset value 3 years from today is = face value of debt 14.51%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0033.webp\" style=\"max-width:min(100%,395px)\" alt=\"N(-d1) 0.097 Face value of debt $850 Asset value today $1,200 Risk-free rate 2.50%\"><p>Gavin concludes his analysis by bringing to Engle’s knowledge the assumptions used in generating the data in Exhibit 2.<\/p><\/div><\/details><div class=\"qtext\"><p>Engle’s most appropriate response to Gavin’s query is that the company’s debt holders:<\/p><\/div>", "subj": "fixed"}, {"n": 17, "q": "Based on the information presented in Exhibit 1, which contract will entail the payment of an upfront premium from the protection buyer to the seller:", "opts": ["CDS A", "CDS B", "CDS C"], "ans": "B", "expl": "The correct answer is option B. In the context of credit default swaps (CDS), the standard fixed coupon rate and the credit spread are critical in determining whether an upfront premium is required. The standard fixed coupon is the rate agreed upon at the inception of the CDS contract, which the protection buyer pays annually. The credit spread, on the other hand, reflects the perceived risk of default by the reference entity and is expressed as a percentage over a benchmark rate. When the credit spread exceeds the standard fixed coupon, it indicates that the market perceives higher risk than what was estimated at the inception of the CDS. Consequently, the protection buyer must compensate for this increased risk perception by paying an upfront premium to the protection seller. The credit spread for CDS B is 6.0%, which is significantly higher than the standard fixed coupon of 1.0%. This substantial difference suggests that the market's perceived risk of default is significantly higher than initially agreed upon. Therefore, the protection buyer must pay an upfront premium to the protection seller to account for this discrepancy, aligning the cost of protection with the current market assessment of risk. A is incorrect Because the credit spread for CDS A is 3.5%, which is lower than the standard fixed coupon of 5.0%. This scenario implies that the market perceives less risk of default compared to what was estimated when the CDS was structured. As a result, the protection seller compensates the buyer by paying an upfront premium, reflecting the overestimation of risk at the contract's inception. This payment serves to balance the lower-than-expected risk with the higher fixed coupon rate initially agreed upon. C is incorrect Because the credit spread for CDS C is equal to its standard fixed coupon, both at 5.0%. This equality suggests that the market's perception of risk aligns perfectly with the risk estimation at the time of the CDS agreement. Therefore, no adjustment in the form of an upfront premium is necessary, as the initial coupon rate adequately compensates the protection seller for the current level of credit risk associated with the reference entity. ", "explhtml": "<p>The correct answer is option B. In the context of credit default swaps (CDS), the standard fixed coupon rate and the credit spread are critical in determining whether an upfront premium is required. The standard fixed coupon is the rate agreed upon at the inception of the CDS contract, which the protection buyer pays annually. The credit spread, on the other hand, reflects the perceived risk of default by the reference entity and is expressed as a percentage over a benchmark rate. When the credit spread exceeds the standard fixed coupon, it indicates that the market perceives higher risk than what was estimated at the inception of the CDS. Consequently, the protection buyer must compensate for this increased risk perception by paying an upfront premium to the protection seller.<\/p><p>The credit spread for CDS B is 6.0%, which is significantly higher than the standard fixed coupon of 1.0%. This substantial difference suggests that the market&#x27;s perceived risk of default is significantly higher than initially agreed upon. Therefore, the protection buyer must pay an upfront premium to the protection seller to account for this discrepancy, aligning the cost of protection with the current market assessment of risk.<\/p><p><b>A is incorrect<\/b> Because the credit spread for CDS A is 3.5%, which is lower than the standard fixed coupon of 5.0%. This scenario implies that the market perceives less risk of default compared to what was estimated when the CDS was structured. As a result, the protection seller compensates the buyer by paying an upfront premium, reflecting the overestimation of risk at the contract&#x27;s inception. This payment serves to balance the lower-than-expected risk with the higher fixed coupon rate initially agreed upon.<\/p><p><b>C is incorrect<\/b> Because the credit spread for CDS C is equal to its standard fixed coupon, both at 5.0%. This equality suggests that the market&#x27;s perception of risk aligns perfectly with the risk estimation at the time of the CDS agreement. Therefore, no adjustment in the form of an upfront premium is necessary, as the initial coupon rate adequately compensates the protection seller for the current level of credit risk associated with the reference entity. <\/p><p class=\"los\">Fixed Income, Learning Module 5: Credit Default Swaps, LOS 5(b): Describe credit events and settlement protocols with respect to CDS;<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Naruca Associates<\/summary><div class=\"vig-body\"><p>Naruca Associates, NA, is a credit derivatives analytics firm. The firm specializes in the credit default swap (CDS) sector of the market. As a protection buyer, Casey Greene, a senior analyst at NA, evaluates three CDS contracts entered into by Thrice Associates, a financial services firm. Each CDS provides protection on one entity to which TM has credit exposure.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0034.webp\" style=\"max-width:min(100%,586px)\" alt=\"Exhibit 1: CDS Data A B C Standard fixed coupon (% per annum) 5.0 1.0 5.0 Credit spread (%) 3.5 6.0 5.0 Duration (years) 5 4 1 Reference obligation maturity (years) 5 3 1 60%** Reference’s bond issue (s) outstanding (% of par)* 80% 40% 25%\"><p>Notional principal of CDS/reference obligation ($<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0035.webp\" style=\"max-width:min(100%,577px)\" alt=\"10 12 10 millions) Settlement terms Cash Physical Cash\"><p>*Entities behind CDSs A and B have one outstanding bond issue each, while Entity C has two outstanding issues. ** TM owns this bond issue.<\/p><p>The reference entity covered by CDS B is a member of a high-yield index. Greene believes TM can purchase $350 million worth of protection on the index instead of solely purchasing protection on entity B. In addition, Greene predicts that the credit quality of entity B is highly likely to improve and proposes that TM assume 20% of the credit risk by selling $7 million of single-name CDS protection.<\/p><p>Greene anticipates that entity B’s credit curve will change shape in the following year. He believes going short a 10-year CDS and long a 3-year CDS covering the entity will be profitable.<\/p><p>Greene would like to explore the valuation of CDS C in greater detail and how credit spread changes can influence the future prospects of contract party positions. He collects relevant valuation data (Exhibit 2). Greene anticipates entity B’s credit spread to widen by 170 basis points.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0036.webp\" style=\"max-width:min(100%,354px)\" alt=\"Exhibit 2: Current CDS C Valuation Data\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0037.webp\" style=\"max-width:min(100%,377px)\" alt=\"Coupon payment frequency Quarterly Hazard rate (constant % per annum) 4.0% Reference bond’s credit spread 5.0% CDS credit spread 6.9% Market funding cost (%) 2.5%\"><\/div><\/details><div class=\"qtext\"><p>Based on the information presented in Exhibit 1, which contract will entail the payment of an upfront premium from the protection buyer to the seller:<\/p><\/div>", "subj": "fixed"}, {"n": 18, "q": "Using Exhibit 1 and assuming a 75% recovery rate, if a credit event occurs on each reference obligation owned TM will earn the highest proceeds by settling:", "opts": ["CDS A.", "CDS B.", "CDS C."], "ans": "C", "expl": "CDS C yields $10.0 million in total proceeds. As the protection buyer, TM receives a cash settlement from the CDS contract, calculated as the notional amount ($10 million) multiplied by the loss given default (1 - 75% recovery = 25%), resulting in $2.5 million. Crucially, TM owns the underlying bond (as per Exhibit 1's footnote), allowing for the recovery of 75% of its face value ($10 million × 0.75 = $7.5 million). The combined proceeds ($2.5M + $7.5M) = $10.0 million are the highest among all options, leveraging both the CDS payout and bond recovery under the mandated 75% recovery rate. A is incorrect.CDS A generates only $2.5 million, significantly less than CDS C. The cash settlement provides $10 million × (1 - 0.75) = $2.5 million; however, TM does not own the bond (Exhibit 1 indicates no ownership for Entity A). The original answer erroneously included $8 million from the sale of a bond that TM never possessed and used an invalid 20% recovery rate (based on Exhibit 1's 80% bond price), contrary to the question's directive to use a 75% recovery rate. Correctly applied, no bond proceeds exist, leaving only $2.5 million. B is incorrect. Physical settlement nets $12 million × (1 - 0.75) = $3.0 million (notional × loss given default). TM doesn’t own the bond, so no additional recovery occurs. This falls short of CDS C’s $10.0 million. ", "explhtml": "<p>CDS C yields $10.0 million in total proceeds. As the protection buyer, TM receives a cash settlement from the CDS contract, calculated as the notional amount ($10 million) multiplied by the loss given default (1 - 75% recovery = 25%), resulting in $2.5 million. Crucially, TM owns the underlying bond (as per Exhibit 1&#x27;s footnote), allowing for the recovery of 75% of its face value ($10 million × 0.75 = $7.5 million). The combined proceeds ($2.5M + $7.5M) = $10.0 million are the highest among all options, leveraging both the CDS payout and bond recovery under the mandated 75% recovery rate.<\/p><p><b>A is incorrect.<\/b>CDS A generates only $2.5 million, significantly less than CDS C. The cash settlement provides $10 million × (1 - 0.75) = $2.5 million; however, TM does not own the bond (Exhibit 1 indicates no ownership for Entity A). The original answer erroneously included $8 million from the sale of a bond that TM never possessed and used an invalid 20% recovery rate (based on Exhibit 1&#x27;s 80% bond price), contrary to the question&#x27;s directive to use a 75% recovery rate. Correctly applied, no bond proceeds exist, leaving only $2.5 million.<\/p><p><b>B is incorrect<\/b>. Physical settlement nets $12 million × (1 - 0.75) = $3.0 million (notional × loss given default). TM doesn’t own the bond, so no additional recovery occurs. This falls short of CDS C’s $10.0 million. <\/p><p class=\"los\">Fixed Income, Learning Module 5: Credit Default Swaps, LOS 5(b): Describe credit events and settlement protocols with respect to CDS;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Naruca Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Naruca Associates, NA, is a credit derivatives analytics firm. The firm specializes in the credit default swap (CDS) sector of the market. As a protection buyer, Casey Greene, a senior analyst at NA, evaluates three CDS contracts entered into by Thrice Associates, a financial services firm. Each CDS provides protection on one entity to which TM has credit exposure.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0034.webp\" style=\"max-width:min(100%,586px)\" alt=\"Exhibit 1: CDS Data A B C Standard fixed coupon (% per annum) 5.0 1.0 5.0 Credit spread (%) 3.5 6.0 5.0 Duration (years) 5 4 1 Reference obligation maturity (years) 5 3 1 60%** Reference’s bond issue (s) outstanding (% of par)* 80% 40% 25%\"><p>Notional principal of CDS/reference obligation ($<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0035.webp\" style=\"max-width:min(100%,577px)\" alt=\"10 12 10 millions) Settlement terms Cash Physical Cash\"><p>*Entities behind CDSs A and B have one outstanding bond issue each, while Entity C has two outstanding issues. ** TM owns this bond issue.<\/p><p>The reference entity covered by CDS B is a member of a high-yield index. Greene believes TM can purchase $350 million worth of protection on the index instead of solely purchasing protection on entity B. In addition, Greene predicts that the credit quality of entity B is highly likely to improve and proposes that TM assume 20% of the credit risk by selling $7 million of single-name CDS protection.<\/p><p>Greene anticipates that entity B’s credit curve will change shape in the following year. He believes going short a 10-year CDS and long a 3-year CDS covering the entity will be profitable.<\/p><p>Greene would like to explore the valuation of CDS C in greater detail and how credit spread changes can influence the future prospects of contract party positions. He collects relevant valuation data (Exhibit 2). Greene anticipates entity B’s credit spread to widen by 170 basis points.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0036.webp\" style=\"max-width:min(100%,354px)\" alt=\"Exhibit 2: Current CDS C Valuation Data\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0037.webp\" style=\"max-width:min(100%,377px)\" alt=\"Coupon payment frequency Quarterly Hazard rate (constant % per annum) 4.0% Reference bond’s credit spread 5.0% CDS credit spread 6.9% Market funding cost (%) 2.5%\"><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1 and assuming a 75% recovery rate, if a credit event occurs on each reference obligation owned TM will earn the highest proceeds by settling:<\/p><\/div>", "subj": "fixed"}, {"n": 19, "q": "Based on the information presented in Exhibits 1 and 2, if entity C defaults on the first three loan payments, the loss given default is closest to (ignoring remaining loan payments):", "opts": ["$0.3 million.", "$6.3 million.", "$10.3 million."], "ans": "A", "expl": "The correct answer is option A because it accurately calculates the loss given default based on the coupon payments and the recovery rate. The notional principal of CDS C is $10 million, and the coupon payment is calculated as follows: The total coupon payment for the first three quarters, before default, is Given that the cheapest-to-deliver bond is trading at 25% of par, the recovery rate is 25%. Therefore, the loss given default is calculated by considering the unrecovered amount, which is 75% of the total coupon payments: which rounds to approximately $0.3 million, matching option A. B is incorrect. It suggests a loss given default of $6.3 million, which significantly overestimates the actual loss. This miscalculation could stem from incorrectly assessing the notional principal as the loss amount or misunderstanding the recovery rate application. The loss given default specifically pertains to the coupon payments made before the default, not the entire notional value. Furthermore, the calculation must account for the recovery rate, which significantly reduces the actual financial loss. The correct loss calculation focuses solely on the unrecovered portion of the coupon payments, not the total notional or principal amount. C is incorrect. It estimates the loss given default to be $10.3 million, which is not only incorrect but also illogically exceeds the total notional principal of the CDS, which is $10 million. This option likely results from a misunderstanding of the terms involved in calculating loss given default. Loss given default should consider only the payments at risk due to default, adjusted for the recovery rate, rather than assuming a total loss of the notional amount or misapplying the recovery rate. The calculation provided in option A correctly limits the loss to the coupon payments affected by the default and adjusts for the actual recovery, ensuring the loss estimate is both realistic and aligned with the financial mechanisms of a CDS. ", "explhtml": "<p>The correct answer is option A because it accurately calculates the loss given default based on the coupon payments and the recovery rate. The notional principal of CDS C is $10 million, and the coupon payment is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0038.webp\" style=\"max-width:min(100%,520px)\" alt=\"5% Coupon payment = $10 million × = $0.125 million per quarter. 4\"><p>The total coupon payment for the first three quarters, before default, is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0039.webp\" style=\"max-width:min(100%,476px)\" alt=\"Total coupon payment = $0.125 million × 3 = $0.375 million.\"><p>Given that the cheapest-to-deliver bond is trading at 25% of par, the recovery rate is 25%. Therefore, the loss given default is calculated by considering the unrecovered amount, which is 75% of the total coupon payments:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0040.webp\" style=\"max-width:min(100%,529px)\" alt=\"Loss given default = $0.375 million × (1 −0.25) = $0.28125 million,\"><p>which rounds to approximately $0.3 million, matching option A.<\/p><p><b>B is incorrect<\/b>. It suggests a loss given default of $6.3 million, which significantly overestimates the actual loss. This miscalculation could stem from incorrectly assessing the notional principal as the loss amount or misunderstanding the recovery rate application. The loss given default specifically pertains to the coupon payments made before the default, not the entire notional value. Furthermore, the calculation must account for the recovery rate, which significantly reduces the actual financial loss. The correct loss calculation focuses solely on the unrecovered portion of the coupon payments, not the total notional or principal amount.<\/p><p><b>C is incorrect<\/b>. It estimates the loss given default to be $10.3 million, which is not only incorrect but also illogically exceeds the total notional principal of the CDS, which is $10 million. This option likely results from a misunderstanding of the terms involved in calculating loss given default. Loss given default should consider only the payments at risk due to default, adjusted for the recovery rate, rather than assuming a total loss of the notional amount or misapplying the recovery rate. The calculation provided in option A correctly limits the loss to the coupon payments affected by the default and adjusts for the actual recovery, ensuring the loss estimate is both realistic and aligned with the financial mechanisms of a CDS. <\/p><p class=\"los\">Fixed Income, Learning Module 5: Credit Default Swaps, LOS 5(c): Explain the principles underlying, and factors that influence, the market’s pricing of CDS;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Naruca Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Naruca Associates, NA, is a credit derivatives analytics firm. The firm specializes in the credit default swap (CDS) sector of the market. As a protection buyer, Casey Greene, a senior analyst at NA, evaluates three CDS contracts entered into by Thrice Associates, a financial services firm. Each CDS provides protection on one entity to which TM has credit exposure.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0034.webp\" style=\"max-width:min(100%,586px)\" alt=\"Exhibit 1: CDS Data A B C Standard fixed coupon (% per annum) 5.0 1.0 5.0 Credit spread (%) 3.5 6.0 5.0 Duration (years) 5 4 1 Reference obligation maturity (years) 5 3 1 60%** Reference’s bond issue (s) outstanding (% of par)* 80% 40% 25%\"><p>Notional principal of CDS/reference obligation ($<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0035.webp\" style=\"max-width:min(100%,577px)\" alt=\"10 12 10 millions) Settlement terms Cash Physical Cash\"><p>*Entities behind CDSs A and B have one outstanding bond issue each, while Entity C has two outstanding issues. ** TM owns this bond issue.<\/p><p>The reference entity covered by CDS B is a member of a high-yield index. Greene believes TM can purchase $350 million worth of protection on the index instead of solely purchasing protection on entity B. In addition, Greene predicts that the credit quality of entity B is highly likely to improve and proposes that TM assume 20% of the credit risk by selling $7 million of single-name CDS protection.<\/p><p>Greene anticipates that entity B’s credit curve will change shape in the following year. He believes going short a 10-year CDS and long a 3-year CDS covering the entity will be profitable.<\/p><p>Greene would like to explore the valuation of CDS C in greater detail and how credit spread changes can influence the future prospects of contract party positions. He collects relevant valuation data (Exhibit 2). Greene anticipates entity B’s credit spread to widen by 170 basis points.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0036.webp\" style=\"max-width:min(100%,354px)\" alt=\"Exhibit 2: Current CDS C Valuation Data\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0037.webp\" style=\"max-width:min(100%,377px)\" alt=\"Coupon payment frequency Quarterly Hazard rate (constant % per annum) 4.0% Reference bond’s credit spread 5.0% CDS credit spread 6.9% Market funding cost (%) 2.5%\"><\/div><\/details><div class=\"qtext\"><p>Based on the information presented in Exhibits 1 and 2, if entity C defaults on the first three loan payments, the loss given default is closest to (ignoring remaining loan payments):<\/p><\/div>", "subj": "fixed"}, {"n": 20, "q": "Using Exhibit 2 and Greene’s credit spread forecast, which of the following conclusions is most appropriate:", "opts": ["The basis will be negative.", "Basis trading will be unprofitable.", "TM can offset its position by selling protection at a higher premium."], "ans": "C", "expl": "Option C is the correct answer because it leverages the anticipated widening of the credit spread of entity B. According to the data provided, the CDS credit spread is currently at 6.9%, while the reference bond's credit spread is 5.0%. With Greene's forecast of a 170 basis point increase in the credit spread, the new bond credit spread would be . Despite this increase, the CDS spread remains higher at 6.9%. This discrepancy allows Thrice Associates (TM) to sell protection at a higher premium than the current market conditions for the bond. By selling a new CDS contract at a spread closer to or at 6.9%, TM can capitalize on the higher premium, effectively offsetting its position and potentially profiting from the spread differential. A is incorrect. The basis, which is the difference between the CDS spread and the bond spread, is calculated as . A positive basis indicates that the CDS spread is higher than the bond spread, contrary to the statement in option A that the basis would be negative. The positive basis suggests that the CDS market is pricing in a higher risk compared to the bond market, which is why option A is incorrect. B is incorrect. Basis trading involves exploiting the price differences between a CDS and a corresponding bond. Given that the CDS spread is higher than the bond spread even after the forecasted increase in the bond's credit spread, there remains an opportunity for profitable basis trading. TM can engage in basis trading by selling CDS protection at the higher spread (6.9%) while the bond market reflects a lower spread (6.7%). This strategy allows TM to capture the spread differential, thus making basis trading potentially profitable and disproving option B. ", "explhtml": "<p>Option C is the correct answer because it leverages the anticipated widening of the credit spread of entity B. According to the data provided, the CDS credit spread is currently at 6.9%, while the reference bond&#x27;s credit spread is 5.0%. With Greene&#x27;s forecast of a 170 basis point increase in the credit spread, the new bond credit spread would be<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0041.webp\" style=\"max-width:min(100%,167px)\" alt=\"5.0% + 1.7% = 6.7%\"><p>. Despite this increase, the CDS spread remains higher at 6.9%. This discrepancy allows Thrice Associates (TM) to sell protection at a higher premium than the current market conditions for the bond. By selling a new CDS contract at a spread closer to or at 6.9%, TM can capitalize on the higher premium, effectively offsetting its position and potentially profiting from the spread differential.<\/p><p><b>A is incorrect<\/b>. The basis, which is the difference between the CDS spread and the bond spread, is calculated as<\/p><img class=\"pimg\" loading=\"
