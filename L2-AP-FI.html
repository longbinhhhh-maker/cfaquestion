ide protection and thus increasing the bond&#x27;s overall value. Since the scenario specifies that volatility is the only changing factor and it increases, the price of the bond must logically increase to reflect the higher value of the put option, rather than remaining the same.<\/p><p><b>B is incorrect<\/b>. Suggesting that Bond C&#x27;s price would be less than $101.50 per $100 of par value contradicts the fundamental principles of options valuation. An increase in implied volatility generally leads to an increase in the value of options. Since the put option embedded in Bond C provides a safety net against price falls, its increased value due to higher volatility should lead to an increase in the bond&#x27;s price, not a decrease. Therefore, stating that the bond&#x27;s price would decrease ignores the protective effect and the enhanced worth of the put option under higher volatility conditions. <\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3 (d): Explain how interest rate volatility affects the value of a callable or putable bond<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Markus Jang<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Markus Jang, a fixed-income consultant, meets with a client, Alfred George, who manages a fixed-income portfolio. The two are meeting to discuss three default-free bonds, shown below in Exhibit 1. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0060.webp\" style=\"max-width:min(100%,599px)\" alt=\"Exhibit 1: Information on selected bonds X Y Z Annual coupon 5% 5% 5% Par value $100 $100 $100 Time to maturity 3 years 3 years 3 years Callable  and Embedded option(s) None Callable at par putable at par Time to exercise date(s) N/A 2 years 2 years, 3 years\"><p>Before sharing his analysis with George, Jang notes that the current one-year, two-year, and three-year default-free spot rates are 2.5%, 3.0%, and 3.5%.<\/p><p>George also mentions that he is considering purchasing Bond C, a three-year 4.25% annual coupon bond putable at par in one year and two years. The bond is currently trading at $101.50 per $100 of par value with an implied volatility of 10%. He asks Jang to analyze a scenario where all other factors remain, but this bond&#x27;s implied volatility increases by 15%.<\/p><p>George then asks Jang to evaluate the interest rate sensitivities of bonds with embedded options. Jang mentions that effective duration is one of the measures for evaluating the interest rate sensitivity of such bonds. George asks him to calculate the effective duration of two bonds, shown below in Exhibit 2. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0061.webp\" style=\"max-width:min(100%,586px)\" alt=\"Exhibit 2: Information on selected bonds A B Time to maturity 3 years 3 years Annual coupon 5% 4% Current price $99.85 $100.50 Price if yield curve shifts up 50bps $99.55 $100.25 Price if yield curve shifts down 50bps $100.00 $101.20 Embedded option(s) Callable at par Putable at par\"><p>Jang closes the meeting with the following comments on the topic of bond convexity:<\/p><p>Comment 1: &quot;Callable bonds exhibit both positive and negative convexity.&quot;<\/p><p>Comment 2: &quot;Effective convexity is always positive for putable bonds.&quot;<\/p><p>Comment 3: &quot;Option-free bonds exhibit negative convexity.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Bond C&#x27;s price per $100 of par value in the scenario described by George is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 41, "q": "Is Statement 1 most likely correct:", "opts": ["Yes, it is correct.", "No, it is incorrect because the increase in bond value when rates decrease is equal to the decrease in bond value when rates increase by the same amount.", "No, it is incorrect because the increase in bond value when rates decrease is less than the decrease in bond value when rates increase by the same amount."], "ans": "A", "expl": "Option-free bonds, which lack any embedded options, exhibit positive convexity. This characteristic implies that the bond's price sensitivity to interest rate changes is not symmetrical. When interest rates decrease, the price of an option-free bond increases at a rate that is greater than the rate at which the price decreases when interest rates increase by an equivalent amount. This asymmetry is due to the convex nature of the bond's price-yield relationship. Convexity is a measure of the curvature of how bond prices change as yields change. A higher convexity generally means that bond prices are more sensitive to changes in yield, decreasing less when yields rise and increasing more when yields fall. Therefore, Sally's conclusion in Statement 1 aligns with the fundamental properties of bond convexity and the behavior of option-free bonds under varying interest rates. B is incorrect. The statement that the increase in bond value when rates decrease is equal to the decrease in bond value when rates increase by the same amount is a misunderstanding of bond convexity. While duration suggests that bond price changes are linear and symmetric around interest rate movements, convexity introduces a non-linear aspect to these price changes. For option-free bonds, which exhibit positive convexity, the price increase from a drop in interest rates is more pronounced than the price decrease from a corresponding rise in interest rates. This disproves the notion that the changes are equal, as positive convexity means the bond's price curve is steeper for rate decreases than for rate increases. C is incorrect. This option incorrectly states that the increase in bond value when rates decrease is less than the decrease in bond value when rates increase by the same amount. In reality, for option-free bonds with positive convexity, the opposite is true. Positive convexity means that as interest rates decrease, the increase in the bond's price is amplified beyond the proportional change expected from duration alone. Conversely, when interest rates increase, the decrease in the bond's price is mitigated by the bond's convexity. Thus, the price increase when rates decrease is actually greater than the price decrease when rates increase, contrary to what is suggested in option C. ", "explhtml": "<p>Option-free bonds, which lack any embedded options, exhibit positive convexity. This characteristic implies that the bond&#x27;s price sensitivity to interest rate changes is not symmetrical. When interest rates decrease, the price of an option-free bond increases at a rate that is greater than the rate at which the price decreases when interest rates increase by an equivalent amount. This asymmetry is due to the convex nature of the bond&#x27;s price-yield relationship. Convexity is a measure of the curvature of how bond prices change as yields change. A higher convexity generally means that bond prices are more sensitive to changes in yield, decreasing less when yields rise and increasing more when yields fall. Therefore, Sally&#x27;s conclusion in Statement 1 aligns with the fundamental properties of bond convexity and the behavior of option-free bonds under varying interest rates.<\/p><p><b>B is incorrect<\/b>. The statement that the increase in bond value when rates decrease is equal to the decrease in bond value when rates increase by the same amount is a misunderstanding of bond convexity. While duration suggests that bond price changes are linear and symmetric around interest rate movements, convexity introduces a non-linear aspect to these price changes. For option-free bonds, which exhibit positive convexity, the price increase from a drop in interest rates is more pronounced than the price decrease from a corresponding rise in interest rates. This disproves the notion that the changes are equal, as positive convexity means the bond&#x27;s price curve is steeper for rate decreases than for rate increases.<\/p><p><b>C is incorrect<\/b>. This option incorrectly states that the increase in bond value when rates decrease is less than the decrease in bond value when rates increase by the same amount. In reality, for option-free bonds with positive convexity, the opposite is true. Positive convexity means that as interest rates decrease, the increase in the bond&#x27;s price is amplified beyond the proportional change expected from duration alone. Conversely, when interest rates increase, the decrease in the bond&#x27;s price is mitigated by the bond&#x27;s convexity. Thus, the price increase when rates decrease is actually greater than the price decrease when rates increase, contrary to what is suggested in option C. <\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(l): Compare effective convexities of callable, putable, and straight bonds<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Sally McDonald<\/summary><div class=\"vig-body\"><p>Sally McDonald is a new employee at TAS Capital. As part of her training, Sally is required to attend a one-day course on bonds with embedded options. The course is conducted by Rick Steeler, CFA, a senior employee at the firm. Rick presents the concepts in a lecture format and assigns a different problem to each student. Students are encouraged to use spreadsheets to solve problems.<\/p><p>Sally is tasked with estimating the effective convexity of three types of bonds — bonds with no embedded options, callable bonds, and putable bonds. She is also encouraged to calculate the change in bond value as interest rates increase or decrease, to draw general conclusions about the effective convexities of option-free, callable, and putable bonds.<\/p><p>After performing the calculations in a spreadsheet, Sally concludes that the following statement is true about option-free bonds.<\/p><p>Statement 1: If interest rates decrease, the increase in an option-free bond value is greater than the decrease in bond value if interest rates increase by the same amount.<\/p><p>Sally turns her attention to callable and putable bonds. After analyzing how callable and putable bond prices respond to changes in interest rates, Sally makes the following conclusions:<\/p><p>Statement 2: The effective convexity of a callable bond turns negative when the call option is near the money.<\/p><p>Statement 3: Putable bonds exhibit positive convexity regardless of interest rate levels.<\/p><p>Another topic covered in the course is the value of capped or floored floating-rate bonds, or floaters. As an exercise, Sally is asked to use the following binomial interest rate tree to estimate the value of a two-year capped floater with a cap rate of 5% and a two-year floored floater with a floor rate of 4%. Both floaters pay LIBOR set in arrears.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0064.webp\" style=\"max-width:min(100%,341px)\" alt=\"Binomial tree (One-year forward rates) Time 0 Time 1 5.926% 3.424% 3.592%\"><p>At the end of the course, Rick assigns the class an optional reading on ratchet bonds. Being the learner that she is, Sally spends time scouring resources on this type of bond and in the process, takes the following short notes:<\/p><p>A. Ratchet bonds give the issuer the option to lower the coupon when interest rates<\/p><p>decrease.<\/p><p>B. Ratchet bond coupons cannot be reset to the original coupon rate after being reset to a<\/p><p>lower coupon rate.<\/p><p>C. Ratchet bonds give the investor the option to put the bond at par if interest rates<\/p><p>increase.<\/p><\/div><\/details><div class=\"qtext\"><p>Is Statement 1 most likely correct:<\/p><\/div>", "subj": "fixed"}, {"n": 42, "q": "Are Statements 2 and 3 most likely correct:", "opts": ["Both statements are correct", "Only Statement 2 is correct", "Only Statement 3 is correct"], "ans": "A", "expl": "Statement 2 about callable bonds is correct because the effective convexity of a callable bond can indeed turn negative when the call option is near the money. This phenomenon occurs because the presence of the call option limits the bond's price appreciation as interest rates fall. Typically, as interest rates decrease, bond prices increase. However, for a callable bond, if interest rates fall to a level close to where the bond can be called, the price will not rise significantly above the call price. This is because the issuer has the option to redeem the bond at the call price, preventing further price appreciation. This capping effect causes the price curve of the bond to flatten as rates decrease, leading to negative convexity. Negative convexity implies that as interest rates decrease, the duration of the bond decreases, and the sensitivity of the bond's price to changes in interest rates diminishes. B is incorrect. The statement that only Statement 2 is correct overlooks the accuracy of Statement 3 regarding putable bonds. Putable bonds indeed exhibit positive convexity across all interest rate levels. This characteristic stems from the put option embedded in these bonds, which allows the bondholder to sell the bond back to the issuer at a predetermined price. If interest rates rise significantly, the bond's market value may fall below the put price, but the investor can exercise the put option, setting a floor on the bond's price. This option adds value to the bond as interest rates rise, unlike typical bonds where price decreases. The protective feature of the put option ensures that the bond's price depreciation is less severe compared to non-putable bonds, thus maintaining positive convexity. C is incorrect. This option incorrectly suggests that only Statement 3 is correct while dismissing the validity of Statement 2. As explained, both statements are accurate in describing the behaviors of callable and putable bonds under varying interest rate conditions. Disregarding the impact of the call option on the convexity of callable bonds leads to an incomplete understanding of how these financial instruments react to changes in the interest rate environment. Both statements together provide a comprehensive view of how embedded options influence bond convexity, making option A the correct choice. ", "explhtml": "<p>Statement 2 about callable bonds is correct because the effective convexity of a callable bond can indeed turn negative when the call option is near the money. This phenomenon occurs because the presence of the call option limits the bond&#x27;s price appreciation as interest rates fall. Typically, as interest rates decrease, bond prices increase. However, for a callable bond, if interest rates fall to a level close to where the bond can be called, the price will not rise significantly above the call price. This is because the issuer has the option to redeem the bond at the call price, preventing further price appreciation. This capping effect causes the price curve of the bond to flatten as rates decrease, leading to negative convexity. Negative convexity implies that as interest rates decrease, the duration of the bond decreases, and the sensitivity of the bond&#x27;s price to changes in interest rates diminishes.<\/p><p><b>B is incorrect<\/b>. The statement that only Statement 2 is correct overlooks the accuracy of Statement 3 regarding putable bonds. Putable bonds indeed exhibit positive convexity across all interest rate levels. This characteristic stems from the put option embedded in these bonds, which allows the bondholder to sell the bond back to the issuer at a predetermined price. If interest rates rise significantly, the bond&#x27;s market value may fall below the put price, but the investor can exercise the put option, setting a floor on the bond&#x27;s price. This option adds value to the bond as interest rates rise, unlike typical bonds where price decreases. The protective feature of the put option ensures that the bond&#x27;s price depreciation is less severe compared to non-putable bonds, thus maintaining positive convexity.<\/p><p><b>C is incorrect<\/b>. This option incorrectly suggests that only Statement 3 is correct while dismissing the validity of Statement 2. As explained, both statements are accurate in describing the behaviors of callable and putable bonds under varying interest rate conditions. Disregarding the impact of the call option on the convexity of callable bonds leads to an incomplete understanding of how these financial instruments react to changes in the interest rate environment. Both statements together provide a comprehensive view of how embedded options influence bond convexity, making option A the correct choice. <\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(d): Explain how interest rate volatility affects the value of a callable or putable bond<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Sally McDonald<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally McDonald is a new employee at TAS Capital. As part of her training, Sally is required to attend a one-day course on bonds with embedded options. The course is conducted by Rick Steeler, CFA, a senior employee at the firm. Rick presents the concepts in a lecture format and assigns a different problem to each student. Students are encouraged to use spreadsheets to solve problems.<\/p><p>Sally is tasked with estimating the effective convexity of three types of bonds — bonds with no embedded options, callable bonds, and putable bonds. She is also encouraged to calculate the change in bond value as interest rates increase or decrease, to draw general conclusions about the effective convexities of option-free, callable, and putable bonds.<\/p><p>After performing the calculations in a spreadsheet, Sally concludes that the following statement is true about option-free bonds.<\/p><p>Statement 1: If interest rates decrease, the increase in an option-free bond value is greater than the decrease in bond value if interest rates increase by the same amount.<\/p><p>Sally turns her attention to callable and putable bonds. After analyzing how callable and putable bond prices respond to changes in interest rates, Sally makes the following conclusions:<\/p><p>Statement 2: The effective convexity of a callable bond turns negative when the call option is near the money.<\/p><p>Statement 3: Putable bonds exhibit positive convexity regardless of interest rate levels.<\/p><p>Another topic covered in the course is the value of capped or floored floating-rate bonds, or floaters. As an exercise, Sally is asked to use the following binomial interest rate tree to estimate the value of a two-year capped floater with a cap rate of 5% and a two-year floored floater with a floor rate of 4%. Both floaters pay LIBOR set in arrears.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0064.webp\" style=\"max-width:min(100%,341px)\" alt=\"Binomial tree (One-year forward rates) Time 0 Time 1 5.926% 3.424% 3.592%\"><p>At the end of the course, Rick assigns the class an optional reading on ratchet bonds. Being the learner that she is, Sally spends time scouring resources on this type of bond and in the process, takes the following short notes:<\/p><p>A. Ratchet bonds give the issuer the option to lower the coupon when interest rates<\/p><p>decrease.<\/p><p>B. Ratchet bond coupons cannot be reset to the original coupon rate after being reset to a<\/p><p>lower coupon rate.<\/p><p>C. Ratchet bonds give the investor the option to put the bond at par if interest rates<\/p><p>increase.<\/p><\/div><\/details><div class=\"qtext\"><p>Are Statements 2 and 3 most likely correct:<\/p><\/div>", "subj": "fixed"}, {"n": 43, "q": "Which note about ratchet bonds is most likely false:", "opts": ["Note A", "Note B", "Note C"], "ans": "C", "expl": "Ratchet bonds are a type of bond that includes specific features related to the adjustment of coupon rates based on changes in interest rates. Note C suggests that ratchet bonds give the investor the option to put the bond at par if interest rates increase. This statement is misleading because the put option in ratchet bonds is not directly triggered by an increase in interest rates alone. Instead, the put option is contingent upon the coupon being reset. This means that the investor's ability to put the bond at par is activated only if the issuer has adjusted the coupon rate downwards in response to a decrease in interest rates. Therefore, the put option is not a straightforward response to rising interest rates, but rather a response to the issuer's previous action of lowering the coupon rate. A is incorrect. Note A states that ratchet bonds give the issuer the option to lower the coupon when interest rates decrease. This is a correct depiction of one of the features of ratchet bonds. The issuer has the flexibility to adjust the coupon downwards as a response to falling interest rates, which can make the bonds more attractive in a declining rate environment by reducing the issuer's interest payment obligations. This feature is designed to provide issuers with a mechanism to manage their debt costs effectively in varying interest rate scenarios. B is incorrect. Note B claims that ratchet bond coupons cannot be reset to the original coupon rate after being reset to a lower rate. This statement accurately reflects the typical terms of ratchet bonds. Once the coupon rate has been lowered, it cannot be increased again, even if market interest rates rise. This permanent adjustment to a lower rate protects investors from the risk of fluctuating payments, ensuring that once their coupon payments have been reduced, they will not face uncertainty from potential increases in future payments. This characteristic is crucial for investors seeking stability in their investment income. ", "explhtml": "<p>Ratchet bonds are a type of bond that includes specific features related to the adjustment of coupon rates based on changes in interest rates. Note C suggests that ratchet bonds give the investor the option to put the bond at par if interest rates increase. This statement is misleading because the put option in ratchet bonds is not directly triggered by an increase in interest rates alone. Instead, the put option is contingent upon the coupon being reset. This means that the investor&#x27;s ability to put the bond at par is activated only if the issuer has adjusted the coupon rate downwards in response to a decrease in interest rates. Therefore, the put option is not a straightforward response to rising interest rates, but rather a response to the issuer&#x27;s previous action of lowering the coupon rate.<\/p><p><b>A is incorrect<\/b>. Note A states that ratchet bonds give the issuer the option to lower the coupon when interest rates decrease. This is a correct depiction of one of the features of ratchet bonds. The issuer has the flexibility to adjust the coupon downwards as a response to falling interest rates, which can make the bonds more attractive in a declining rate environment by reducing the issuer&#x27;s interest payment obligations. This feature is designed to provide issuers with a mechanism to manage their debt costs effectively in varying interest rate scenarios.<\/p><p><b>B is incorrect<\/b>. Note B claims that ratchet bond coupons cannot be reset to the original coupon rate after being reset to a lower rate. This statement accurately reflects the typical terms of ratchet bonds. Once the coupon rate has been lowered, it cannot be increased again, even if market interest rates rise. This permanent adjustment to a lower rate protects investors from the risk of fluctuating payments, ensuring that once their coupon payments have been reduced, they will not face uncertainty from potential increases in future payments. This characteristic is crucial for investors seeking stability in their investment income. <\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(a): Describe fixed-income securities with embedded options<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Sally McDonald<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally McDonald is a new employee at TAS Capital. As part of her training, Sally is required to attend a one-day course on bonds with embedded options. The course is conducted by Rick Steeler, CFA, a senior employee at the firm. Rick presents the concepts in a lecture format and assigns a different problem to each student. Students are encouraged to use spreadsheets to solve problems.<\/p><p>Sally is tasked with estimating the effective convexity of three types of bonds — bonds with no embedded options, callable bonds, and putable bonds. She is also encouraged to calculate the change in bond value as interest rates increase or decrease, to draw general conclusions about the effective convexities of option-free, callable, and putable bonds.<\/p><p>After performing the calculations in a spreadsheet, Sally concludes that the following statement is true about option-free bonds.<\/p><p>Statement 1: If interest rates decrease, the increase in an option-free bond value is greater than the decrease in bond value if interest rates increase by the same amount.<\/p><p>Sally turns her attention to callable and putable bonds. After analyzing how callable and putable bond prices respond to changes in interest rates, Sally makes the following conclusions:<\/p><p>Statement 2: The effective convexity of a callable bond turns negative when the call option is near the money.<\/p><p>Statement 3: Putable bonds exhibit positive convexity regardless of interest rate levels.<\/p><p>Another topic covered in the course is the value of capped or floored floating-rate bonds, or floaters. As an exercise, Sally is asked to use the following binomial interest rate tree to estimate the value of a two-year capped floater with a cap rate of 5% and a two-year floored floater with a floor rate of 4%. Both floaters pay LIBOR set in arrears.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0064.webp\" style=\"max-width:min(100%,341px)\" alt=\"Binomial tree (One-year forward rates) Time 0 Time 1 5.926% 3.424% 3.592%\"><p>At the end of the course, Rick assigns the class an optional reading on ratchet bonds. Being the learner that she is, Sally spends time scouring resources on this type of bond and in the process, takes the following short notes:<\/p><p>A. Ratchet bonds give the issuer the option to lower the coupon when interest rates<\/p><p>decrease.<\/p><p>B. Ratchet bond coupons cannot be reset to the original coupon rate after being reset to a<\/p><p>lower coupon rate.<\/p><p>C. Ratchet bonds give the investor the option to put the bond at par if interest rates<\/p><p>increase.<\/p><\/div><\/details><div class=\"qtext\"><p>Which note about ratchet bonds is most likely false:<\/p><\/div>", "subj": "fixed"}, {"n": 44, "q": "Assuming a $100 par value, the value of the floor embedded in the two-year floored floater is closest to:", "opts": ["$0.19", "$0.75", "$0.88"], "ans": "B", "expl": "The value of the floor embedded in the two-year floored floater is calculated by considering the impact of the floor on the coupon payments when interest rates fall below the floor rate of 4%. In this scenario, the lower node of the interest rate tree shows a rate of 3.592%, which is below the floor rate. Therefore, the coupon payment is floored at 4% instead of being based on the lower rate of 3.592%. The calculations for the value of the floored floater at different nodes are as follows: At Time 1, the upper node (U) value, V1,U, is calculated using the formula: This calculation assumes that the coupon rate is above the floor and thus remains unaffected by the floor mechanism. At the lower node (L), the coupon is floored at 4%, leading to a coupon payment of 100 × 4% = 4. The value at this node, V1,L, is calculated as: This value is higher than it would have been without the floor, as the actual interest rate of 3.592% would have produced a lower coupon payment. The value at Time 0, V0, is the average of the discounted values from Time 1, adjusted for the coupon payment at Time 0: This calculation shows that the value of the floored floater is higher due to the floor mechanism. The value of the embedded floor is the difference between the value of the floored floater and the value it would have had without the floor, which is assumed to be 100 (the par value). Therefore, the value of the embedded floor is: This confirms that the correct answer is option B, $0.75. A is incorrect. The value of $0.19 is significantly lower than the calculated value of the embedded floor. This discrepancy arises because the calculation for option A likely underestimates the impact of the floor on the bond's value. The floor ensures that the coupon payment does not drop below 4%, which provides a higher cash flow compared to what would be received without the floor when rates are below this threshold. The correct calculation shows a more substantial increase in value due to the floor, justifying a higher valuation of the embedded floor option. C is incorrect. The value of $0.88, although close, is slightly higher than the calculated value of the embedded floor. This overestimation could result from rounding differences or slight variations in the discount factors used. The precise calculations provided show that the increase in value due to the floor is exactly \\$0.75, making option C an overestimate and thus incorrect. ", "explhtml": "<p>The value of the floor embedded in the two-year floored floater is calculated by considering the impact of the floor on the coupon payments when interest rates fall below the floor rate of 4%. In this scenario, the lower node of the interest rate tree shows a rate of 3.592%, which is below the floor rate. Therefore, the coupon payment is floored at 4% instead of being based on the lower rate of 3.592%. The calculations for the value of the floored floater at different nodes are as follows:<\/p><p>At Time 1, the upper node (U) value, V<sub>1,U<\/sub>, is calculated using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0065.webp\" style=\"max-width:min(100%,197px)\" alt=\"100 + 5.926 V1,U = 1.05926 = 100\"><p>This calculation assumes that the coupon rate is above the floor and thus remains unaffected by the floor mechanism.<\/p><p>At the lower node (L), the coupon is floored at 4%, leading to a coupon payment of 100 × 4% = 4. The value at this node, V<sub>1,L<\/sub>, is calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0066.webp\" style=\"max-width:min(100%,193px)\" alt=\"100 + 4 V1,L = 1.03592 = 100.39\"><p>This value is higher than it would have been without the floor, as the actual interest rate of 3.592% would have produced a lower coupon payment.<\/p><p>The value at Time 0, V<sub>0<\/sub>, is the average of the discounted values from Time 1, adjusted for the coupon payment at Time 0:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0067.webp\" style=\"max-width:min(100%,302px)\" alt=\"1 100 + 4 100.39 + 4 V0 = ( + ) = 100.75 2 1.03424 1.03424\"><p>This calculation shows that the value of the floored floater is higher due to the floor mechanism.<\/p><p>The value of the embedded floor is the difference between the value of the floored floater and the value it would have had without the floor, which is assumed to be 100 (the par value). Therefore, the value of the embedded floor is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0068.webp\" style=\"max-width:min(100%,166px)\" alt=\"100.75 −100 = 0.75\"><p>This confirms that the correct answer is option B, $0.75.<\/p><p><b>A is incorrect<\/b>. The value of $0.19 is significantly lower than the calculated value of the embedded floor. This discrepancy arises because the calculation for option A likely underestimates the impact of the floor on the bond&#x27;s value. The floor ensures that the coupon payment does not drop below 4%, which provides a higher cash flow compared to what would be received without the floor when rates are below this threshold. The correct calculation shows a more substantial increase in value due to the floor, justifying a higher valuation of the embedded floor option.<\/p><p><b>C is incorrect<\/b>. The value of $0.88, although close, is slightly higher than the calculated value of the embedded floor. This overestimation could result from rounding differences or slight variations in the discount factors used. The precise calculations provided show that the increase in value due to the floor is exactly \\$0.75, making option C an overestimate and thus incorrect. <\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(m): Calculate the value of a capped or floored floating-rate bond<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Sally McDonald<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally McDonald is a new employee at TAS Capital. As part of her training, Sally is required to attend a one-day course on bonds with embedded options. The course is conducted by Rick Steeler, CFA, a senior employee at the firm. Rick presents the concepts in a lecture format and assigns a different problem to each student. Students are encouraged to use spreadsheets to solve problems.<\/p><p>Sally is tasked with estimating the effective convexity of three types of bonds — bonds with no embedded options, callable bonds, and putable bonds. She is also encouraged to calculate the change in bond value as interest rates increase or decrease, to draw general conclusions about the effective convexities of option-free, callable, and putable bonds.<\/p><p>After performing the calculations in a spreadsheet, Sally concludes that the following statement is true about option-free bonds.<\/p><p>Statement 1: If interest rates decrease, the increase in an option-free bond value is greater than the decrease in bond value if interest rates increase by the same amount.<\/p><p>Sally turns her attention to callable and putable bonds. After analyzing how callable and putable bond prices respond to changes in interest rates, Sally makes the following conclusions:<\/p><p>Statement 2: The effective convexity of a callable bond turns negative when the call option is near the money.<\/p><p>Statement 3: Putable bonds exhibit positive convexity regardless of interest rate levels.<\/p><p>Another topic covered in the course is the value of capped or floored floating-rate bonds, or floaters. As an exercise, Sally is asked to use the following binomial interest rate tree to estimate the value of a two-year capped floater with a cap rate of 5% and a two-year floored floater with a floor rate of 4%. Both floaters pay LIBOR set in arrears.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0064.webp\" style=\"max-width:min(100%,341px)\" alt=\"Binomial tree (One-year forward rates) Time 0 Time 1 5.926% 3.424% 3.592%\"><p>At the end of the course, Rick assigns the class an optional reading on ratchet bonds. Being the learner that she is, Sally spends time scouring resources on this type of bond and in the process, takes the following short notes:<\/p><p>A. Ratchet bonds give the issuer the option to lower the coupon when interest rates<\/p><p>decrease.<\/p><p>B. Ratchet bond coupons cannot be reset to the original coupon rate after being reset to a<\/p><p>lower coupon rate.<\/p><p>C. Ratchet bonds give the investor the option to put the bond at par if interest rates<\/p><p>increase.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming a $100 par value, the value of the floor embedded in the two-year floored floater is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 45, "q": "Based on exhibit 1, Pruitt would most likely conclude that relative to Bond B, Bond A is:", "opts": ["Fairly priced", "Underpriced", "Overpriced"], "ans": "B", "expl": "The option-adjusted spread (OAS) is a measure used to evaluate bonds with embedded options, such as callable bonds. It represents the spread at which a bond's theoretical price, accounting for embedded options, equals its market price. In the context of Exhibit 1, both Bond A and Bond B are callable bonds with similar characteristics, including credit quality and maturity. The OAS for Bond A is 27.5 basis points, while for Bond B, it is 22.8 basis points. Since both bonds are comparable in all major aspects, the higher OAS of Bond A suggests that it compensates the investor more for the same level of risk compared to Bond B. This additional compensation indicates that Bond A is likely underpriced relative to Bond B, as investors are receiving a higher yield for a similar risk, making Bond A a more attractive investment option. A is incorrect. The option of Bond A being fairly priced would imply that its OAS should be closely aligned with that of Bond B, given their similar characteristics. However, Bond A has a higher OAS (27.5 bps) compared to Bond B (22.8 bps). This discrepancy in OAS suggests that Bond A offers a higher yield for the same level of risk, which is indicative of Bond A being underpriced rather than fairly priced. Therefore, suggesting that Bond A is fairly priced overlooks the relative value provided by the higher OAS, which compensates for risks not captured by the market price alone. C is incorrect. Claiming that Bond A is overpriced would mean that it offers less value for the money, which contradicts the information given in Exhibit 1. An overpriced bond would typically have a lower OAS compared to similar bonds, as it would offer less yield for the same or higher risk. In this case, Bond A has a higher OAS than Bond B, indicating that it provides more yield for the same level of risk. This higher yield suggests that Bond A is actually underpriced, as it offers more compensation to the investors relative to Bond B, not less.", "explhtml": "<p>The option-adjusted spread (OAS) is a measure used to evaluate bonds with embedded options, such as callable bonds. It represents the spread at which a bond&#x27;s theoretical price, accounting for embedded options, equals its market price. In the context of Exhibit 1, both Bond A and Bond B are callable bonds with similar characteristics, including credit quality and maturity. The OAS for Bond A is 27.5 basis points, while for Bond B, it is 22.8 basis points. Since both bonds are comparable in all major aspects, the higher OAS of Bond A suggests that it compensates the investor more for the same level of risk compared to Bond B. This additional compensation indicates that Bond A is likely underpriced relative to Bond B, as investors are receiving a higher yield for a similar risk, making Bond A a more attractive investment option.<\/p><p><b>A is incorrect<\/b>. The option of Bond A being fairly priced would imply that its OAS should be closely aligned with that of Bond B, given their similar characteristics. However, Bond A has a higher OAS (27.5 bps) compared to Bond B (22.8 bps). This discrepancy in OAS suggests that Bond A offers a higher yield for the same level of risk, which is indicative of Bond A being underpriced rather than fairly priced. Therefore, suggesting that Bond A is fairly priced overlooks the relative value provided by the higher OAS, which compensates for risks not captured by the market price alone.<\/p><p><b>C is incorrect<\/b>. Claiming that Bond A is overpriced would mean that it offers less value for the money, which contradicts the information given in Exhibit 1. An overpriced bond would typically have a lower OAS compared to similar bonds, as it would offer less yield for the same or higher risk. In this case, Bond A has a higher OAS than Bond B, indicating that it provides more yield for the same level of risk. This higher yield suggests that Bond A is actually underpriced, as it offers more compensation to the investors relative to Bond B, not less.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis of Bonds with Embedded Options, LOS 3(g): explain the calculation and use of option-adjusted spreads<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Ivanna Pruitt<\/summary><div class=\"vig-body\"><p>Ivanna Pruitt is a credit analyst at Bristle Securities, an investment trust that manages high-net-worth individuals&#x27; investment accounts. Senior management at the firm would like to add bonds with embedded options to the firm’s bond portfolio. Pruitt is asked to select a few bonds for this purpose, leveraging her in-depth understanding of fixed income portfolio management. Pruitt first settles for two corporate bonds - A and B. The two are callable at par and have similar characteristics in terms of credit quality, maturity, and call dates. Assuming an interest rate volatility of 10%, Pruitt uses the option-adjusted approach to analyze the bonds. Exhibit 1 below presents her analysis.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0069.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1 Summary results of Pruitt’s Analysis Using the OAS Approach Bond OAS (in bps) Bond A 27.5 Bond B 22.8\"><p>Pruitt also selects two more bonds – C and D – issued by Swans Inc. Swans’ common stock is<\/p><p>currently trading at £25 per share. Thanks to improved performance, the company has witnessed<\/p><p>an improvement in its credit ratings over the last couple of years, largely due to stable<\/p><p>management. Bonds C and D have a floating rate of interest set at 200 basis points above LIBOR.<\/p><p>The two bonds are very similar, with the only exception being that C is a convertible bond.<\/p><p>Exhibit 2 outlines more details about each bond. Both C and D are close to their maturity date.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0070.webp\" style=\"max-width:min(100%,634px)\" alt=\"Exhibit 2 Bonds Issued by Swans Inc. Bond Characteristics Bond C Convertible bond with a conversion price of £23\"><p>Bond D Identical to Bond C except that it does not include a conversion option<\/p><p>In a different assignment, Pruitt will be appraising the AM issue, a 4-year annual coupon-paying<\/p><p>bond.<\/p><p>She is considering two alternative measures for evaluating credit quality – credit ratings and<\/p><p>credit scores. After a thorough analysis, Pruitt opts for credit ratings stating the following<\/p><p>reasons for her preference:<\/p><p>Reason 1: Unlike credit scores, externally generated credit ratings are not subject to pressure which may distort their accuracy. Reason 2: Ratings enable investors to compare the credit risk of one issuer relative to<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0071.webp\" style=\"max-width:min(100%,667px)\" alt=\"the other.\"><p>Reason 3: Rating agencies help reduce unnecessary volatility in debt market prices by ensuring ratings are kept stable over time.<\/p><p>Pruitt’s supervisor, James Richardson, thinks that she should consider the reduced form model<\/p><p>for developing a credit rating for the issue. In a conversation between the two, Richardson states<\/p><p>that:<\/p><p>“The estimation technique used by reduced form models allows flexibility to estimate default<\/p><p>probabilities.”<\/p><p>Pruitt employs the reduced form model to generate a term structure of credit spreads, which she<\/p><p>intends to use to estimate the expected percentage loss per year. She collects coupon bond<\/p><p>prices for twenty bonds in the issue. The maximum maturity bond in the collection is 25 years.<\/p><p>Using these prices, she derives risky zero-coupon bond prices, which are used to compute the<\/p><p>yields on risky AM zero-coupon bonds and riskless zero-coupon government bonds. Exhibit 3<\/p><p>presents a sample of these yields.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0072.webp\" style=\"max-width:min(100%,370px)\" alt=\"Exhibit 3 Zero-coupon Yields Zero-Coupon Government Zero-Coupon AM Bond Yields (%) Bond Yields (%) 2.50 3.82 2.56 3.88 2.58 4.02 2.60 4.05 2.63 4.14\"><\/div><\/details><div class=\"qtext\"><p>Based on exhibit 1, Pruitt would most likely conclude that relative to Bond B, Bond A is:<\/p><\/div>", "subj": "fixed"}, {"n": 46, "q": "The factor that's currently most likely to affect the risk-return characteristics of Bond C is:", "opts": ["Swans' credit spreads", "Interest rate movements", "Swans' common stock price movements"], "ans": "C", "expl": "The risk-return characteristics of Bond C, a convertible bond, are significantly influenced by the price movements of Swans' common stock. This is because the value of a convertible bond is closely tied to the conversion option it holds, which allows the bondholder to convert the bond into a predetermined number of shares of the issuing company's stock. The conversion price for Bond C is set at £23, while the current trading price of Swans' common stock is £25. This situation means that the conversion option is \"in the money,\" as the market price of the shares exceeds the conversion price. Consequently, the bond's value and its risk-return profile are more aligned with the equity characteristics of the underlying stock rather than purely with fixed-income characteristics. This alignment makes the bond's performance more sensitive to changes in the stock price of Swans Inc. Therefore, movements in Swans' common stock price are the most likely factor to affect Bond C's risk-return characteristics at this time. A is incorrect. While credit spreads are an important factor in assessing the risk and return of bonds, they are not the most influential factor for Bond C in the current scenario. Credit spreads reflect the difference in yield between a corporate bond and a risk-free equivalent, primarily influenced by the credit risk of the issuer. Although Swans Inc. has an improved credit rating, the immediate impact of credit spreads on Bond C is overshadowed by the bond's convertible nature. Since the stock price is currently above the conversion price, the bond's performance is more closely tied to the equity market's movements rather than changes in credit spreads alone. B is incorrect. Interest rate movements generally affect the price of bonds; however, for Bond C, this influence is less pronounced compared to the impact of the issuer's stock price movements. Convertible bonds, like Bond C, have a hybrid nature, combining elements of both debt and equity. When the stock price is above the conversion price, as it is in this case, the bond behaves more like a stock. The sensitivity of Bond C to interest rate changes is diminished because the potential for conversion (and thus the link to equity price movements) plays a more dominant role in determining its value and risk-return characteristics.", "explhtml": "<p>The risk-return characteristics of Bond C, a convertible bond, are significantly influenced by the price movements of Swans&#x27; common stock. This is because the value of a convertible bond is closely tied to the conversion option it holds, which allows the bondholder to convert the bond into a predetermined number of shares of the issuing company&#x27;s stock. The conversion price for Bond C is set at £23, while the current trading price of Swans&#x27; common stock is £25. This situation means that the conversion option is &quot;in the money,&quot; as the market price of the shares exceeds the conversion price. Consequently, the bond&#x27;s value and its risk-return profile are more aligned with the equity characteristics of the underlying stock rather than purely with fixed-income characteristics. This alignment makes the bond&#x27;s performance more sensitive to changes in the stock price of Swans Inc. Therefore, movements in Swans&#x27; common stock price are the most likely factor to affect Bond C&#x27;s risk-return characteristics at this time.<\/p><p><b>A is incorrect.<\/b> While credit spreads are an important factor in assessing the risk and return of bonds, they are not the most influential factor for Bond C in the current scenario. Credit spreads reflect the difference in yield between a corporate bond and a risk-free equivalent, primarily influenced by the credit risk of the issuer. Although Swans Inc. has an improved credit rating, the immediate impact of credit spreads on Bond C is overshadowed by the bond&#x27;s convertible nature. Since the stock price is currently above the conversion price, the bond&#x27;s performance is more closely tied to the equity market&#x27;s movements rather than changes in credit spreads alone.<\/p><p><b>B is incorrect.<\/b> Interest rate movements generally affect the price of bonds; however, for Bond C, this influence is less pronounced compared to the impact of the issuer&#x27;s stock price movements. Convertible bonds, like Bond C, have a hybrid nature, combining elements of both debt and equity. When the stock price is above the conversion price, as it is in this case, the bond behaves more like a stock. The sensitivity of Bond C to interest rate changes is diminished because the potential for conversion (and thus the link to equity price movements) plays a more dominant role in determining its value and risk-return characteristics.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis of Bonds with Embedded Options, LOS 3(q): compare the risk–return characteristics of a convertible bond with the risk– return characteristics of a straight bond and of the underlying common stock<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Ivanna Pruitt<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ivanna Pruitt is a credit analyst at Bristle Securities, an investment trust that manages high-net-worth individuals&#x27; investment accounts. Senior management at the firm would like to add bonds with embedded options to the firm’s bond portfolio. Pruitt is asked to select a few bonds for this purpose, leveraging her in-depth understanding of fixed income portfolio management. Pruitt first settles for two corporate bonds - A and B. The two are callable at par and have similar characteristics in terms of credit quality, maturity, and call dates. Assuming an interest rate volatility of 10%, Pruitt uses the option-adjusted approach to analyze the bonds. Exhibit 1 below presents her analysis.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0069.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1 Summary results of Pruitt’s Analysis Using the OAS Approach Bond OAS (in bps) Bond A 27.5 Bond B 22.8\"><p>Pruitt also selects two more bonds – C and D – issued by Swans Inc. Swans’ common stock is<\/p><p>currently trading at £25 per share. Thanks to improved performance, the company has witnessed<\/p><p>an improvement in its credit ratings over the last couple of years, largely due to stable<\/p><p>management. Bonds C and D have a floating rate of interest set at 200 basis points above LIBOR.<\/p><p>The two bonds are very similar, with the only exception being that C is a convertible bond.<\/p><p>Exhibit 2 outlines more details about each bond. Both C and D are close to their maturity date.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0070.webp\" style=\"max-width:min(100%,634px)\" alt=\"Exhibit 2 Bonds Issued by Swans Inc. Bond Characteristics Bond C Convertible bond with a conversion price of £23\"><p>Bond D Identical to Bond C except that it does not include a conversion option<\/p><p>In a different assignment, Pruitt will be appraising the AM issue, a 4-year annual coupon-paying<\/p><p>bond.<\/p><p>She is considering two alternative measures for evaluating credit quality – credit ratings and<\/p><p>credit scores. After a thorough analysis, Pruitt opts for credit ratings stating the following<\/p><p>reasons for her preference:<\/p><p>Reason 1: Unlike credit scores, externally generated credit ratings are not subject to pressure which may distort their accuracy. Reason 2: Ratings enable investors to compare the credit risk of one issuer relative to<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0071.webp\" style=\"max-width:min(100%,667px)\" alt=\"the other.\"><p>Reason 3: Rating agencies help reduce unnecessary volatility in debt market prices by ensuring ratings are kept stable over time.<\/p><p>Pruitt’s supervisor, James Richardson, thinks that she should consider the reduced form model<\/p><p>for developing a credit rating for the issue. In a conversation between the two, Richardson states<\/p><p>that:<\/p><p>“The estimation technique used by reduced form models allows flexibility to estimate default<\/p><p>probabilities.”<\/p><p>Pruitt employs the reduced form model to generate a term structure of credit spreads, which she<\/p><p>intends to use to estimate the expected percentage loss per year. She collects coupon bond<\/p><p>prices for twenty bonds in the issue. The maximum maturity bond in the collection is 25 years.<\/p><p>Using these prices, she derives risky zero-coupon bond prices, which are used to compute the<\/p><p>yields on risky AM zero-coupon bonds and riskless zero-coupon government bonds. Exhibit 3<\/p><p>presents a sample of these yields.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0072.webp\" style=\"max-width:min(100%,370px)\" alt=\"Exhibit 3 Zero-coupon Yields Zero-Coupon Government Zero-Coupon AM Bond Yields (%) Bond Yields (%) 2.50 3.82 2.56 3.88 2.58 4.02 2.60 4.05 2.63 4.14\"><\/div><\/details><div class=\"qtext\"><p>The factor that&#x27;s currently most likely to affect the risk-return characteristics of Bond C is:<\/p><\/div>", "subj": "fixed"}, {"n": 47, "q": "Which reasons(s), as outlined by Pruitt, accurately reflect the strength of using credit ratings:", "opts": ["Reason 2 only", "Reasons 2 and 3 only", "None of the reasons"], "ans": "A", "expl": "Reason 2, as outlined by Pruitt, accurately reflects one of the strengths of using credit ratings. Credit ratings provide a standardized and widely recognized method to assess the creditworthiness of issuers and their financial instruments. This standardization facilitates a comparative analysis of the credit risk associated with different issuers or securities. By providing an ordinal ranking, credit ratings simplify the decision-making process for investors by enabling them to quickly compare the relative riskiness of various debt issuers. This comparison is crucial in a diversified investment portfolio, as it helps in asset allocation and risk management. The ability to compare issuers directly based on their ratings is a fundamental advantage that enhances market efficiency and transparency. B is incorrect. While Reason 2 is valid, Reason 3 does not accurately reflect a strength of using credit ratings. Pruitt mentions that rating agencies help reduce unnecessary volatility in debt market prices by keeping ratings stable over time. However, this stability can be misleading. The infrequent updating of ratings can result in ratings that do not accurately reflect the issuer's current financial condition, especially in rapidly changing economic environments. This lag can lead to inaccurate assessments of credit risk, potentially misleading investors. Stability in ratings might reduce perceived volatility, but it can also delay the reflection of true credit risk in the ratings, which can lead to mispricing of debt securities and inefficient capital allocation. C is incorrect. None of the reasons provided by Pruitt accurately reflect the strengths of using credit ratings, as claimed in option C, is incorrect because Reason 2 does indeed provide a valid strength of credit ratings. It highlights the utility of credit ratings in facilitating comparisons between different issuers, a critical aspect of credit analysis. This comparison enables investors to make informed decisions by providing a clear, albeit sometimes flawed, hierarchy of creditworthiness. Therefore, dismissing all reasons as inaccurate does not align with the benefits provided by Reason 2.", "explhtml": "<p>Reason 2, as outlined by Pruitt, accurately reflects one of the strengths of using credit ratings. Credit ratings provide a standardized and widely recognized method to assess the creditworthiness of issuers and their financial instruments. This standardization facilitates a comparative analysis of the credit risk associated with different issuers or securities. By providing an ordinal ranking, credit ratings simplify the decision-making process for investors by enabling them to quickly compare the relative riskiness of various debt issuers. This comparison is crucial in a diversified investment portfolio, as it helps in asset allocation and risk management. The ability to compare issuers directly based on their ratings is a fundamental advantage that enhances market efficiency and transparency.<\/p><p><b>B is incorrect<\/b>. While Reason 2 is valid, Reason 3 does not accurately reflect a strength of using credit ratings. Pruitt mentions that rating agencies help reduce unnecessary volatility in debt market prices by keeping ratings stable over time. However, this stability can be misleading. The infrequent updating of ratings can result in ratings that do not accurately reflect the issuer&#x27;s current financial condition, especially in rapidly changing economic environments. This lag can lead to inaccurate assessments of credit risk, potentially misleading investors. Stability in ratings might reduce perceived volatility, but it can also delay the reflection of true credit risk in the ratings, which can lead to mispricing of debt securities and inefficient capital allocation.<\/p><p><b>C is incorrect<\/b>. None of the reasons provided by Pruitt accurately reflect the strengths of using credit ratings, as claimed in option C, is incorrect because Reason 2 does indeed provide a valid strength of credit ratings. It highlights the utility of credit ratings in facilitating comparisons between different issuers, a critical aspect of credit analysis. This comparison enables investors to make informed decisions by providing a clear, albeit sometimes flawed, hierarchy of creditworthiness. Therefore, dismissing all reasons as inaccurate does not align with the benefits provided by Reason 2.<\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(b): explain credit scores and credit ratings<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Ivanna Pruitt<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ivanna Pruitt is a credit analyst at Bristle Securities, an investment trust that manages high-net-worth individuals&#x27; investment accounts. Senior management at the firm would like to add bonds with embedded options to the firm’s bond portfolio. Pruitt is asked to select a few bonds for this purpose, leveraging her in-depth understanding of fixed income portfolio management. Pruitt first settles for two corporate bonds - A and B. The two are callable at par and have similar characteristics in terms of credit quality, maturity, and call dates. Assuming an interest rate volatility of 10%, Pruitt uses the option-adjusted approach to analyze the bonds. Exhibit 1 below presents her analysis.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0069.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1 Summary results of Pruitt’s Analysis Using the OAS Approach Bond OAS (in bps) Bond A 27.5 Bond B 22.8\"><p>Pruitt also selects two more bonds – C and D – issued by Swans Inc. Swans’ common stock is<\/p><p>currently trading at £25 per share. Thanks to improved performance, the company has witnessed<\/p><p>an improvement in its credit ratings over the last couple of years, largely due to stable<\/p><p>management. Bonds C and D have a floating rate of interest set at 200 basis points above LIBOR.<\/p><p>The two bonds are very similar, with the only exception being that C is a convertible bond.<\/p><p>Exhibit 2 outlines more details about each bond. Both C and D are close to their maturity date.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0070.webp\" style=\"max-width:min(100%,634px)\" alt=\"Exhibit 2 Bonds Issued by Swans Inc. Bond Characteristics Bond C Convertible bond with a conversion price of £23\"><p>Bond D Identical to Bond C except that it does not include a conversion option<\/p><p>In a different assignment, Pruitt will be appraising the AM issue, a 4-year annual coupon-paying<\/p><p>bond.<\/p><p>She is considering two alternative measures for evaluating credit quality – credit ratings and<\/p><p>credit scores. After a thorough analysis, Pruitt opts for credit ratings stating the following<\/p><p>reasons for her preference:<\/p><p>Reason 1: Unlike credit scores, externally generated credit ratings are not subject to pressure which may distort their accuracy. Reason 2: Ratings enable investors to compare the credit risk of one issuer relative to<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0071.webp\" style=\"max-width:min(100%,667px)\" alt=\"the other.\"><p>Reason 3: Rating agencies help reduce unnecessary volatility in debt market prices by ensuring ratings are kept stable over time.<\/p><p>Pruitt’s supervisor, James Richardson, thinks that she should consider the reduced form model<\/p><p>for developing a credit rating for the issue. In a conversation between the two, Richardson states<\/p><p>that:<\/p><p>“The estimation technique used by reduced form models allows flexibility to estimate default<\/p><p>probabilities.”<\/p><p>Pruitt employs the reduced form model to generate a term structure of credit spreads, which she<\/p><p>intends to use to estimate the expected percentage loss per year. She collects coupon bond<\/p><p>prices for twenty bonds in the issue. The maximum maturity bond in the collection is 25 years.<\/p><p>Using these prices, she derives risky zero-coupon bond prices, which are used to compute the<\/p><p>yields on risky AM zero-coupon bonds and riskless zero-coupon government bonds. Exhibit 3<\/p><p>presents a sample of these yields.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0072.webp\" style=\"max-width:min(100%,370px)\" alt=\"Exhibit 3 Zero-coupon Yields Zero-Coupon Government Zero-Coupon AM Bond Yields (%) Bond Yields (%) 2.50 3.82 2.56 3.88 2.58 4.02 2.60 4.05 2.63 4.14\"><\/div><\/details><div class=\"qtext\"><p>Which reasons(s), as outlined by Pruitt, accurately reflect the strength of using credit ratings:<\/p><\/div>", "subj": "fixed"}, {"n": 48, "q": "Using the data in Exhibit 3, the expected percentage loss is equal to:", "opts": ["0.01067.", "0.01748.", "0.01408."], "ans": "C", "expl": "To calculate the expected percentage loss per year using the data provided in Exhibit 3, we first need to determine the average yields for both the zero-coupon government bonds and the zero-coupon AM bonds. The yields for the zero-coupon government bonds are given as 2.50%, 2.56%, 2.58%, 2.60%, and 2.63%. Calculating the average yield for these government bonds involves summing these percentages and then dividing by the number of yields provided: Similarly, the yields for the zero-coupon AM bonds are 3.82%, 3.88%, 4.02%, 4.05%, and 4.14%. The average yield for these AM bonds is calculated as follows: The expected percentage loss per year is then the difference between the average yield of the AM bonds and the average yield of the government bonds: Expected percentage loss per year = 3.982% −2.574% = 1.408% (or 0.01408) A is incorrect. The calculation for option A results in a value of 0.01067, which does not match the computed expected percentage loss of 1.408% (or 0.01408). This discrepancy arises because the average yield spread calculated does not align with the values provided in the question, indicating a possible miscalculation or misunderstanding of the yield data. B is incorrect. Option B suggests an expected percentage loss of 0.01748, which is higher than the calculated value of 1.408% (or 0.01408). This error could be due to an incorrect averaging of the yields or an incorrect subtraction of the average yields of the AM bonds from the government bonds. It is essential to accurately compute both averages and their difference to arrive at the correct expected loss percentage.", "explhtml": "<p>To calculate the expected percentage loss per year using the data provided in Exhibit 3, we first need to determine the average yields for both the zero-coupon government bonds and the zero-coupon AM bonds. The yields for the zero-coupon government bonds are given as 2.50%, 2.56%, 2.58%, 2.60%, and 2.63%. Calculating the average yield for these government bonds involves summing these percentages and then dividing by the number of yields provided:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0073.webp\" style=\"max-width:min(100%,758px)\" alt=\"2.50% + 2.56% + 2.58% + 2.60% + 2.63% Average yield for zero-coupon government bonds = = 2.574% 5\"><p>Similarly, the yields for the zero-coupon AM bonds are 3.82%, 3.88%, 4.02%, 4.05%, and 4.14%. The average yield for these AM bonds is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0074.webp\" style=\"max-width:min(100%,698px)\" alt=\"3.82% + 3.88% + 4.02% + 4.05% + 4.14% Average yield for zero-coupon AM bonds = = 3.982% 5\"><p>The expected percentage loss per year is then the difference between the average yield of the AM bonds and the average yield of the government bonds:<\/p><p>Expected percentage loss per year = 3.982% −2.574% = 1.408% (or 0.01408)<\/p><p><b>A is incorrect<\/b>. The calculation for option A results in a value of 0.01067, which does not match the computed expected percentage loss of 1.408% (or 0.01408). This discrepancy arises because the average yield spread calculated does not align with the values provided in the question, indicating a possible miscalculation or misunderstanding of the yield data.<\/p><p><b>B is incorrect<\/b>. Option B suggests an expected percentage loss of 0.01748, which is higher than the calculated value of 1.408% (or 0.01408). This error could be due to an incorrect averaging of the yields or an incorrect subtraction of the average yields of the AM bonds from the government bonds. It is essential to accurately compute both averages and their difference to arrive at the correct expected loss percentage.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis of Bonds with Embedded Options, LOS 3(q): compare the risk–return characteristics of a convertible bond with the risk– return characteristics of a straight bond and of the underlying common stock<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Ivanna Pruitt<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ivanna Pruitt is a credit analyst at Bristle Securities, an investment trust that manages high-net-worth individuals&#x27; investment accounts. Senior management at the firm would like to add bonds with embedded options to the firm’s bond portfolio. Pruitt is asked to select a few bonds for this purpose, leveraging her in-depth understanding of fixed income portfolio management. Pruitt first settles for two corporate bonds - A and B. The two are callable at par and have similar characteristics in terms of credit quality, maturity, and call dates. Assuming an interest rate volatility of 10%, Pruitt uses the option-adjusted approach to analyze the bonds. Exhibit 1 below presents her analysis.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0069.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1 Summary results of Pruitt’s Analysis Using the OAS Approach Bond OAS (in bps) Bond A 27.5 Bond B 22.8\"><p>Pruitt also selects two more bonds – C and D – issued by Swans Inc. Swans’ common stock is<\/p><p>currently trading at £25 per share. Thanks to improved performance, the company has witnessed<\/p><p>an improvement in its credit ratings over the last couple of years, largely due to stable<\/p><p>management. Bonds C and D have a floating rate of interest set at 200 basis points above LIBOR.<\/p><p>The two bonds are very similar, with the only exception being that C is a convertible bond.<\/p><p>Exhibit 2 outlines more details about each bond. Both C and D are close to their maturity date.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0070.webp\" style=\"max-width:min(100%,634px)\" alt=\"Exhibit 2 Bonds Issued by Swans Inc. Bond Characteristics Bond C Convertible bond with a conversion price of £23\"><p>Bond D Identical to Bond C except that it does not include a conversion option<\/p><p>In a different assignment, Pruitt will be appraising the AM issue, a 4-year annual coupon-paying<\/p><p>bond.<\/p><p>She is considering two alternative measures for evaluating credit quality – credit ratings and<\/p><p>credit scores. After a thorough analysis, Pruitt opts for credit ratings stating the following<\/p><p>reasons for her preference:<\/p><p>Reason 1: Unlike credit scores, externally generated credit ratings are not subject to pressure which may distort their accuracy. Reason 2: Ratings enable investors to compare the credit risk of one issuer relative to<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0071.webp\" style=\"max-width:min(100%,667px)\" alt=\"the other.\"><p>Reason 3: Rating agencies help reduce unnecessary volatility in debt market prices by ensuring ratings are kept stable over time.<\/p><p>Pruitt’s supervisor, James Richardson, thinks that she should consider the reduced form model<\/p><p>for developing a credit rating for the issue. In a conversation between the two, Richardson states<\/p><p>that:<\/p><p>“The estimation technique used by reduced form models allows flexibility to estimate default<\/p><p>probabilities.”<\/p><p>Pruitt employs the reduced form model to generate a term structure of credit spreads, which she<\/p><p>intends to use to estimate the expected percentage loss per year. She collects coupon bond<\/p><p>prices for twenty bonds in the issue. The maximum maturity bond in the collection is 25 years.<\/p><p>Using these prices, she derives risky zero-coupon bond prices, which are used to compute the<\/p><p>yields on risky AM zero-coupon bonds and riskless zero-coupon government bonds. Exhibit 3<\/p><p>presents a sample of these yields.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0072.webp\" style=\"max-width:min(100%,370px)\" alt=\"Exhibit 3 Zero-coupon Yields Zero-Coupon Government Zero-Coupon AM Bond Yields (%) Bond Yields (%) 2.50 3.82 2.56 3.88 2.58 4.02 2.60 4.05 2.63 4.14\"><\/div><\/details><div class=\"qtext\"><p>Using the data in Exhibit 3, the expected percentage loss is equal to:<\/p><\/div>", "subj": "fixed"}, {"n": 49, "q": "According to the term structure described in Exhibit 1, the arbitrage-free price of Bond A is closest to:", "opts": ["$105.39", "$105.56.", "$105.77."], "ans": "A", "expl": "The correct answer is option A, $105.39. To determine the arbitrage-free price of Bond A, we use the yield-to-maturity rates provided in Exhibit 1. The bond has a par value of $100, a coupon rate of 8%, and matures in 3 years. The cash flows from the bond are $8 in the first two years and $108 in the third year (which includes the final coupon payment and the par value). The present value of each cash flow is calculated using the respective yield-to-maturity for each year. For the bootstrapped spot rate of 6.06173%, the present value is (1.0160086173)3= 90.52. Summing these gives the total present value of Bond A as $105.39. B is incorrect. It suggests a price of $105.56, which is slightly higher than the correct calculation. This discrepancy can arise from a minor error in calculating the present values or the application of incorrect spot rates. The precise calculation using the correct spot rates and the formula for present value, as shown, leads to a total of $105.39, not $105.56. It is crucial to use the exact rates and formulas for each year's cash flow to avoid such errors. C is incorrect. It suggests a price of $105.77, which is even higher than both the correct answer and Option B. This error could result from significantly incorrect assumptions about the interest rates or computational errors in the present value calculations. As demonstrated, the correct application of yield-to-maturity rates and the bootstrapping method accurately reflects the bond's present value. Any deviation from this method, such as using a higher rate or incorrect formula, would result in an inaccurate valuation, as seen in Option C.", "explhtml": "<p>The correct answer is option A, $105.39. To determine the arbitrage-free price of Bond A, we use the yield-to-maturity rates provided in Exhibit 1. The bond has a par value of $100, a coupon rate of 8%, and matures in 3 years. The cash flows from the bond are $8 in the first two years and $108 in the third year (which includes the final coupon payment and the par value). The present value of each cash flow is calculated using the respective yield-to-maturity for each year. For<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0078.webp\" style=\"max-width:min(100%,757px)\" alt=\"Year 1, the present value of the $8 coupon payment is calculated as  the bootstrapped spot rate of 5.54187%, the present value is  (1.0554187)2 8 1.04 8 = 7.18 = 7.69 . For Year 3, using . For Year 2, using\"><p>the bootstrapped spot rate of 6.06173%, the present value is <sub>(1.0<\/sub><sup>1<\/sup><sub>6<\/sub><sup>0<\/sup><sub>0<\/sub><sup>8<\/sup><sub>6173)<\/sub><sub>3<\/sub>= 90.52. Summing these<\/p><p>gives the total present value of Bond A as $105.39.<\/p><p><b>B is incorrect<\/b>. It suggests a price of $105.56, which is slightly higher than the correct calculation. This discrepancy can arise from a minor error in calculating the present values or the application of incorrect spot rates. The precise calculation using the correct spot rates and the formula for present value, as shown, leads to a total of $105.39, not $105.56. It is crucial to use the exact rates and formulas for each year&#x27;s cash flow to avoid such errors.<\/p><p><b>C is incorrect<\/b>. It suggests a price of $105.77, which is even higher than both the correct answer and Option B. This error could result from significantly incorrect assumptions about the interest rates or computational errors in the present value calculations. As demonstrated, the correct application of yield-to-maturity rates and the bootstrapping method accurately reflects the bond&#x27;s present value. Any deviation from this method, such as using a higher rate or incorrect formula, would result in an inaccurate valuation, as seen in Option C.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(b): describe how zero-coupon rates (spot rates) may be obtained from the parcurve by bootstrapping<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Tracy Pritchard<\/summary><div class=\"vig-body\"><p>Tracy Pritchard works as an analyst in the fixed-income branch of an investment bank. Her department prices bonds trading in the market. Pritchard&#x27;s supervisor, Leslie Matthews, requests that a bond issue be valued under different methods.<\/p><p>Matthews first requests that Pritchard calculate the arbitrage-free value of Bond A using a yield-<\/p><p>to-maturity curve. Bond A has a par value of $100, a coupon rate of 8.0%, and a 3-year maturity.<\/p><p>The yield-to-maturity in year 1 is 4.0%, the yield-to-maturity in year 2 is 5.5%, and the yield-to-<\/p><p>maturity in year 3 is 6.0%.<\/p><p>Exhibit 1 -Yield to Maturity Par Rates for One-, Two-, and Three-Year Annual<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0075.webp\" style=\"max-width:min(100%,595px)\" alt=\"Pay Option -Free One-year Two-year Three-year 4.0% 5.5% 6.0%\"><p>Next, Matthews asks Pritchard to price Bond B, a 2-year bond with a par value of $100 and a<\/p><p>coupon rate of 5.0% by using a binomial interest rate tree:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0076.webp\" style=\"max-width:min(100%,294px)\" alt=\"Exhibit 2: Binomial interest rate tree Time 0 Time 1 6.5% ↗ 3.5% ↘ 4.5%\"><p>Matthews asks for the present value of Bond B.<\/p><p>Matthews then asks Pritchard to calibrate this binomial tree to match a specific term structure.<\/p><p>The one-year par rate is 3.5% and the two-year par rate is 4.75%. The interest rate volatility is<\/p><p>20% per year.<\/p><p>After valuing these bonds with interest rate trees, Pritchard wants to understand their general<\/p><p>properties. Pritchard tells Matthews she has heard that interest rate trees describe closely interrelated economic items. Matthews responds with the following comments about them:<\/p><p>Property 1: Interest rate trees generate cash flows dependent on interest rates.<\/p><p>Property 2: Interest rate trees provide interest rates used to determine the present value of cash<\/p><p>flows.<\/p><p>Matthews asks Pritchard to consider another alternative to value bonds. Specifically, she asks<\/p><p>Pritchard to use pathwise valuation to price Bond C, a 2-year bond with a coupon rate of 3% and<\/p><p>a par value of 100.<\/p><p>Here are the paths:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0077.webp\" style=\"max-width:min(100%,244px)\" alt=\"Exhibit 3 - Interest Rate Paths Path Time 0 Time 1 1 3% 3.6% 2 3% 3.6% 3 3% 2.7% 4 3% 2.7%\"><\/div><\/details><div class=\"qtext\"><p>According to the term structure described in Exhibit 1, the arbitrage-free price of Bond A is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 50, "q": "Using the interest rate binomial tree shown in Exhibit 2, the arbitrage-free price of Bond B is closest to:", "opts": ["$100.50.", "$101.00.", "$104.25."], "ans": "B", "expl": "The correct answer is option B, which states that the arbitrage-free price of Bond B is closest to $101.00. To determine this, we use the binomial interest rate tree provided in Exhibit 2. The tree outlines the possible interest rates at different times, which are essential for calculating the present value of future cash flows from the bond. Bond B is a 2-year bond with a par value of $100 and a coupon rate of 5.0%. The bond will make annual coupon payments of $5 (5% of $100). At Time 1, depending on the interest rate scenario (up or down), the bond values can be calculated as follows: Here, $105$ represents the sum of the final year coupon and the par value ($100 + $5), and the denominators are $1 + R$ for each respective rate (6.5% and 4.5%). At Time 0, the expected value of the bond, considering an equal probability of moving up or down in the interest rate tree, is calculated by discounting the expected value at Time 1 back to the present using the initial rate of 3.5%: This calculation shows that the present value of Bond B, considering the possible interest rate paths and their associated probabilities, is $101.00. A is incorrect. It suggests that the arbitrage-free price of Bond B is $100.50. This value does not align with the calculations based on the binomial interest rate tree
