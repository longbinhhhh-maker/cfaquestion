ncept of duration. Duration measures the sensitivity of a bond's price to changes in interest rates, calculated as the weighted average time until cash flows are received, and is typically expressed in years. In the given data, the 10-year maturity bond has a key rate duration of 12.4 years and a yield change of +110 basis points (bps). The impact on the portfolio's value can be calculated using the formula for duration impact: For the 10-year bond, this calculation would be This percentage represents the approximate percentage change in the bond's price due to a 1% change in yield, indicating a significant sensitivity to interest rate changes compared to other maturities. This high sensitivity makes the 10-year bond the most impactful on the portfolio's value in terms of interest rate changes. A is incorrect. The 2-year maturity bond has a lower key rate duration of 3.6 years and a yield change of +220 basis points. Using the duration impact formula, the calculation would be Although the yield change is higher than that of the 10-year bond, the lower duration results in a smaller overall impact on the portfolio's value. This demonstrates that, despite a higher yield change, the effect on the portfolio is less significant due to its shorter duration, which results in less price sensitivity to interest rate changes. C is incorrect. The 12-year maturity bond has the highest key rate duration of 13.8 years among the options, with a yield change of +95 basis points. The duration impact calculation for this bond would be Although this bond has the longest duration, the slightly lower yield change compared to the 10-year bond results in a marginally lesser impact on the portfolio's value. This illustrates that even though the duration is slightly higher, the smaller yield change diminishes its overall effect on the portfolio compared to the 10-year bond. ", "explhtml": "<p>Option B is the correct answer because it involves analyzing the impact of interest rate changes on the value of the portfolio through the concept of duration. Duration measures the sensitivity of a bond&#x27;s price to changes in interest rates, calculated as the weighted average time until cash flows are received, and is typically expressed in years. In the given data, the 10-year maturity bond has a key rate duration of 12.4 years and a yield change of +110 basis points (bps). The impact on the portfolio&#x27;s value can be calculated using the formula for duration impact:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0056.webp\" style=\"max-width:min(100%,370px)\" alt=\"Duration Impact = Duration × Change in Yield.\"><p>For the 10-year bond, this calculation would be<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0057.webp\" style=\"max-width:min(100%,195px)\" alt=\"12.4 × 1.10% = 13.64%.\"><p>This percentage represents the approximate percentage change in the bond&#x27;s price due to a 1% change in yield, indicating a significant sensitivity to interest rate changes compared to other maturities. This high sensitivity makes the 10-year bond the most impactful on the portfolio&#x27;s value in terms of interest rate changes.<\/p><p><b>A is incorrect<\/b>. The 2-year maturity bond has a lower key rate duration of 3.6 years and a yield change of +220 basis points. Using the duration impact formula, the calculation would be<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0058.webp\" style=\"max-width:min(100%,176px)\" alt=\"3.6 × 2.20% = 7.92%.\"><p>Although the yield change is higher than that of the 10-year bond, the lower duration results in a smaller overall impact on the portfolio&#x27;s value. This demonstrates that, despite a higher yield change, the effect on the portfolio is less significant due to its shorter duration, which results in less price sensitivity to interest rate changes.<\/p><p><b>C is incorrect<\/b>. The 12-year maturity bond has the highest key rate duration of 13.8 years among the options, with a yield change of +95 basis points. The duration impact calculation for this bond would be<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0059.webp\" style=\"max-width:min(100%,195px)\" alt=\"13.8 × 0.95% = 13.11%.\"><p>Although this bond has the longest duration, the slightly lower yield change compared to the 10-year bond results in a marginally lesser impact on the portfolio&#x27;s value. This illustrates that even though the duration is slightly higher, the smaller yield change diminishes its overall effect on the portfolio compared to the 10-year bond. <\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(j): Explain the maturity structure of yield volatilities and their effect on price volatility.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Westgate Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Westgate Associates is a global wealth management firm managing Thelta, a fixed-income fund. Leon Davis is the senior fixed-income manager charged with managing Thelta.<\/p><p>Davis is seeking to expand Thelta. However, any selected security must pass through the following screens prior to its inclusion:<\/p><p>1. The minimum credit rating must be investment grade. 2. The investment universe should comprise solely of local issuers. 3. The quoted interest rate should be a minimum of 5%. 4. The investment horizons of fund investors are long-term and must be considered.<\/p><p>Next, Davis collects data on recent yield changes at particular maturity points on the yield curve and key rate durations of Thelta (Exhibit 1). He intends to use this data to analyze the yield curve for changes in:<\/p><p>1. curvature, 2. level, and 3. steepness.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0053.webp\" style=\"max-width:min(100%,598px)\" alt=\"Maturity 2 4 6 8 10 12 +220 +195 +8 Yield +85 bps +110 bps +95 bps bps bps bps Key  rate 3.6 6.5 7.9 8.2 12.4 13.8 duration\"><p>Davis would like to ensure that the yields of the chosen securities have a minimum impact on portfolio volatility. For this purpose, Davis is attempting to analyze the volatility of interest rates using the following:<\/p><p>1. volatility term structure, and 2. Cox-Ingersoll-Ross model.<\/p><p>In addition, Davis seeks to include zero-coupon default-free securities in the fund’s investment portfolio. The analyzed securities and expected one-period and total holding period returns are summarized below (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0054.webp\" style=\"max-width:min(100%,345px)\" alt=\"Exhibit 2: Structural Model Framework\"><p><b>One-period and Holding Period Returns For Zero-Coupon Securities<\/b><\/p><p>Security Maturity (Years) One-Period Return Total Holding Period Return<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0055.webp\" style=\"max-width:min(100%,503px)\" alt=\"A 1 3.5% 3.5% B 2 3.5% 4.0% C 7 3.5% 6.2% D 12 3.5% 8.3% E 15 3.5% 10.1%\"><\/div><\/details><div class=\"qtext\"><p>Using the data in Exhibit 1, which of the following interest rate changes has the highest effect on the value of the portfolio:<\/p><\/div>", "subj": "fixed"}, {"n": 31, "q": "Using term structure volatility, Davis will conclude that the volatility of short-term rates is:", "opts": ["Higher and linked to inflation.", "Higher and linked to monetary policy.", "Lower and linked to economic activity."], "ans": "B", "expl": "The volatility term structure, which Davis is analyzing using the Cox-Ingersoll-Ross model, indicates that the volatility of short-term interest rates is generally higher compared to long-term rates. This heightened volatility in the short-term rates is primarily influenced by the immediate reactions of the market to monetary policy changes. Central banks frequently adjust monetary policies in response to economic indicators, which directly impacts short-term interest rates. These adjustments can lead to sudden and significant fluctuations in short-term rates as market participants react to new information and adjust their expectations for the future. A is incorrect. While inflation does impact interest rates, its influence is more pronounced over the long term rather than in the short term. Inflation expectations are typically built into the long-term interest rates more significantly than into the short-term rates. Short-term rates are more sensitive to immediate policy changes rather than to long-term inflation expectations. Therefore, linking short-term rate volatility primarily to inflation, as suggested in option A, does not accurately reflect the primary drivers of short-term rate changes. C is incorrect. Economic activity does influence interest rates, but its impact is more directly observed in the long-term rates. Long-term interest rates reflect the market's view on the future health of the economy, incorporating expectations of growth, inflation, and other economic variables over an extended period. Short-term rates, by contrast, respond more immediately to policy changes rather than to changes in economic activity, which tend to influence economic conditions more gradually. Thus, stating that short-term rate volatility is lower and linked to economic activity does not align with how interest rates typically respond to economic indicators.", "explhtml": "<p>The volatility term structure, which Davis is analyzing using the Cox-Ingersoll-Ross model, indicates that the volatility of short-term interest rates is generally higher compared to long-term rates. This heightened volatility in the short-term rates is primarily influenced by the immediate reactions of the market to monetary policy changes. Central banks frequently adjust monetary policies in response to economic indicators, which directly impacts short-term interest rates. These adjustments can lead to sudden and significant fluctuations in short-term rates as market participants react to new information and adjust their expectations for the future.<\/p><p><b>A is incorrect.<\/b> While inflation does impact interest rates, its influence is more pronounced over the long term rather than in the short term. Inflation expectations are typically built into the long-term interest rates more significantly than into the short-term rates. Short-term rates are more sensitive to immediate policy changes rather than to long-term inflation expectations. Therefore, linking short-term rate volatility primarily to inflation, as suggested in option A, does not accurately reflect the primary drivers of short-term rate changes.<\/p><p><b>C is incorrect.<\/b> Economic activity does influence interest rates, but its impact is more directly observed in the long-term rates. Long-term interest rates reflect the market&#x27;s view on the future health of the economy, incorporating expectations of growth, inflation, and other economic variables over an extended period. Short-term rates, by contrast, respond more immediately to policy changes rather than to changes in economic activity, which tend to influence economic conditions more gradually. Thus, stating that short-term rate volatility is lower and linked to economic activity does not align with how interest rates typically respond to economic indicators.<\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(j): Explain the maturity structure of yield volatilities and their effect on price volatility.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Westgate Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Westgate Associates is a global wealth management firm managing Thelta, a fixed-income fund. Leon Davis is the senior fixed-income manager charged with managing Thelta.<\/p><p>Davis is seeking to expand Thelta. However, any selected security must pass through the following screens prior to its inclusion:<\/p><p>1. The minimum credit rating must be investment grade. 2. The investment universe should comprise solely of local issuers. 3. The quoted interest rate should be a minimum of 5%. 4. The investment horizons of fund investors are long-term and must be considered.<\/p><p>Next, Davis collects data on recent yield changes at particular maturity points on the yield curve and key rate durations of Thelta (Exhibit 1). He intends to use this data to analyze the yield curve for changes in:<\/p><p>1. curvature, 2. level, and 3. steepness.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0053.webp\" style=\"max-width:min(100%,598px)\" alt=\"Maturity 2 4 6 8 10 12 +220 +195 +8 Yield +85 bps +110 bps +95 bps bps bps bps Key  rate 3.6 6.5 7.9 8.2 12.4 13.8 duration\"><p>Davis would like to ensure that the yields of the chosen securities have a minimum impact on portfolio volatility. For this purpose, Davis is attempting to analyze the volatility of interest rates using the following:<\/p><p>1. volatility term structure, and 2. Cox-Ingersoll-Ross model.<\/p><p>In addition, Davis seeks to include zero-coupon default-free securities in the fund’s investment portfolio. The analyzed securities and expected one-period and total holding period returns are summarized below (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0054.webp\" style=\"max-width:min(100%,345px)\" alt=\"Exhibit 2: Structural Model Framework\"><p><b>One-period and Holding Period Returns For Zero-Coupon Securities<\/b><\/p><p>Security Maturity (Years) One-Period Return Total Holding Period Return<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0055.webp\" style=\"max-width:min(100%,503px)\" alt=\"A 1 3.5% 3.5% B 2 3.5% 4.0% C 7 3.5% 6.2% D 12 3.5% 8.3% E 15 3.5% 10.1%\"><\/div><\/details><div class=\"qtext\"><p>Using term structure volatility, Davis will conclude that the volatility of short-term rates is:<\/p><\/div>", "subj": "fixed"}, {"n": 32, "q": "A shortcoming of the term structure theory used by Davis to arrive at the forecasts in Exhibit 2 is that:", "opts": ["Economic reality is not captured.", "Investors are assumed to be risk neutral.", "The independence of yields at different maturities is not considered."], "ans": "A", "expl": "Davis is utilizing the local expectations theory to derive the forecasts shown in Exhibit 2. This theory posits that the expected future short-term interest rates determine the current long-term rates. In the exhibit, each security, regardless of its maturity, has a one-period return equal to the one-period risk-free rate of 3.5%, as seen with Security A. The total holding period returns increase with maturity, which suggests the addition of risk premiums for longer maturities. The primary shortcoming of this approach is that it does not accurately capture economic reality. Economic reality involves various factors such as changes in monetary policy, inflation expectations, and economic cycles, which can significantly affect interest rates and bond prices. The local expectations theory simplifies these complexities into a single expected rate, which does not vary according to different economic conditions or investor sentiments. This oversimplification can lead to forecasts that do not align well with actual market movements, where long-term bond yields often incorporate risk factors and expectations that differ significantly from short-term bond yields. B is incorrect. The statement that investors are assumed to be risk-neutral pertains to the pure expectations theory of the term structure of interest rates, which suggests that the future interest rates expected by the market determine the current structure of interest rates without any adjustment for risk. However, the local expectations theory, which Davis is using, implicitly includes risk considerations by adjusting the longer-term returns upwards to include risk premiums. This adjustment acknowledges that investors require compensation for the additional risk associated with holding longer-term securities, which contradicts the assumption of risk neutrality. C is incorrect. The statement about the independence of yields at different maturities not being considered is more closely related to the segmented markets theory or the liquidity preference theory, which argue that different segments of the yield curve are determined by distinct sets of supply and demand conditions or by investors' preferences for liquidity, respectively. The local expectations theory, on the other hand, inherently considers the interrelation of yields at different maturities through the expected path of future short-term interest rates. It assumes that the yield for any given maturity is a function of current and expected future short-term rates, thus acknowledging the dependence, rather than independence, of yields across the term structure. ", "explhtml": "<p>Davis is utilizing the local expectations theory to derive the forecasts shown in Exhibit 2. This theory posits that the expected future short-term interest rates determine the current long-term rates. In the exhibit, each security, regardless of its maturity, has a one-period return equal to the one-period risk-free rate of 3.5%, as seen with Security A. The total holding period returns increase with maturity, which suggests the addition of risk premiums for longer maturities. The primary shortcoming of this approach is that it does not accurately capture economic reality. Economic reality involves various factors such as changes in monetary policy, inflation expectations, and economic cycles, which can significantly affect interest rates and bond prices. The local expectations theory simplifies these complexities into a single expected rate, which does not vary according to different economic conditions or investor sentiments. This oversimplification can lead to forecasts that do not align well with actual market movements, where long-term bond yields often incorporate risk factors and expectations that differ significantly from short-term bond yields.<\/p><p><b>B is incorrect<\/b>. The statement that investors are assumed to be risk-neutral pertains to the pure expectations theory of the term structure of interest rates, which suggests that the future interest rates expected by the market determine the current structure of interest rates without any adjustment for risk. However, the local expectations theory, which Davis is using, implicitly includes risk considerations by adjusting the longer-term returns upwards to include risk premiums. This adjustment acknowledges that investors require compensation for the additional risk associated with holding longer-term securities, which contradicts the assumption of risk neutrality.<\/p><p><b>C is incorrect<\/b>. The statement about the independence of yields at different maturities not being considered is more closely related to the segmented markets theory or the liquidity preference theory, which argue that different segments of the yield curve are determined by distinct sets of supply and demand conditions or by investors&#x27; preferences for liquidity, respectively. The local expectations theory, on the other hand, inherently considers the interrelation of yields at different maturities through the expected path of future short-term interest rates. It assumes that the yield for any given maturity is a function of current and expected future short-term rates, thus acknowledging the dependence, rather than independence, of yields across the term structure. <\/p><p class=\"los\">Fixed Income, Learning Module 1: The Term Structure and Interest Rate Dynamics, LOS 1(h): Explain traditional theories of the term structure of interest rates and describe the implications of each theory for forward rates and the shape of the yield curve;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Westgate Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Westgate Associates is a global wealth management firm managing Thelta, a fixed-income fund. Leon Davis is the senior fixed-income manager charged with managing Thelta.<\/p><p>Davis is seeking to expand Thelta. However, any selected security must pass through the following screens prior to its inclusion:<\/p><p>1. The minimum credit rating must be investment grade. 2. The investment universe should comprise solely of local issuers. 3. The quoted interest rate should be a minimum of 5%. 4. The investment horizons of fund investors are long-term and must be considered.<\/p><p>Next, Davis collects data on recent yield changes at particular maturity points on the yield curve and key rate durations of Thelta (Exhibit 1). He intends to use this data to analyze the yield curve for changes in:<\/p><p>1. curvature, 2. level, and 3. steepness.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0053.webp\" style=\"max-width:min(100%,598px)\" alt=\"Maturity 2 4 6 8 10 12 +220 +195 +8 Yield +85 bps +110 bps +95 bps bps bps bps Key  rate 3.6 6.5 7.9 8.2 12.4 13.8 duration\"><p>Davis would like to ensure that the yields of the chosen securities have a minimum impact on portfolio volatility. For this purpose, Davis is attempting to analyze the volatility of interest rates using the following:<\/p><p>1. volatility term structure, and 2. Cox-Ingersoll-Ross model.<\/p><p>In addition, Davis seeks to include zero-coupon default-free securities in the fund’s investment portfolio. The analyzed securities and expected one-period and total holding period returns are summarized below (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0054.webp\" style=\"max-width:min(100%,345px)\" alt=\"Exhibit 2: Structural Model Framework\"><p><b>One-period and Holding Period Returns For Zero-Coupon Securities<\/b><\/p><p>Security Maturity (Years) One-Period Return Total Holding Period Return<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0055.webp\" style=\"max-width:min(100%,503px)\" alt=\"A 1 3.5% 3.5% B 2 3.5% 4.0% C 7 3.5% 6.2% D 12 3.5% 8.3% E 15 3.5% 10.1%\"><\/div><\/details><div class=\"qtext\"><p>A shortcoming of the term structure theory used by Davis to arrive at the forecasts in Exhibit 2 is that:<\/p><\/div>", "subj": "fixed"}, {"n": 33, "q": "Which effective duration relationship presented by Sally is most likely false:", "opts": ["Relationship 1", "Relationship 2", "Relationship 3"], "ans": "B", "expl": "The statement that the effective duration of a fixed-rate callable bond can sometimes be greater than the effective duration of its straight counterpart is generally false. Effective duration measures the sensitivity of a bond's price to changes in interest rates. For callable bonds, the option to call the bond at predetermined times before maturity allows the issuer to redeem the bond when interest rates are favorable, typically when they fall. This option reduces the bond's exposure to further interest rate decreases as the bond will likely be called away in such scenarios, thereby capping the potential price increase that could occur from falling rates. Consequently, the effective duration of a callable bond is typically less than that of a comparable non-callable (straight) bond because the callable bond's price is less sensitive to decreases in interest rates. The presence of the call option generally leads to a contraction of duration compared to its straight counterpart, not an expansion. A is incorrect. The statement that the effective duration of a zero-coupon bond is approximately equal to the maturity of the bond is generally true and thus not a false relationship. Zero-coupon bonds pay no coupons and instead are issued at a discount to their face value, maturing at par. The price of a zero-coupon bond is solely a function of the interest rates and its time to maturity. Since there are no intermediate cash flows before maturity, the bond's sensitivity to interest rate changes (effective duration) is directly related to its time to maturity. As interest rates change, the impact on the bond's price is directly proportional to its remaining time to maturity, making the effective duration of a zero-coupon bond approximately equal to its maturity. C is incorrect. The statement that the effective duration of a fixed-rate putable bond cannot exceed the effective duration of its straight counterpart is generally true. A putable bond includes an option for the holder to force the issuer to buy back the bond at a predetermined price before maturity. This option provides the bondholder protection against rising interest rates, as they can choose to sell the bond back to the issuer and reinvest at higher rates. This feature reduces the bond's sensitivity to interest rate increases, thereby reducing its effective duration compared to a similar bond without the put option. The presence of the put option generally leads to a reduction in duration because the downside risk of rising rates is mitigated. ", "explhtml": "<p>The statement that the effective duration of a fixed-rate callable bond can sometimes be greater than the effective duration of its straight counterpart is generally false. Effective duration measures the sensitivity of a bond&#x27;s price to changes in interest rates. For callable bonds, the option to call the bond at predetermined times before maturity allows the issuer to redeem the bond when interest rates are favorable, typically when they fall. This option reduces the bond&#x27;s exposure to further interest rate decreases as the bond will likely be called away in such scenarios, thereby capping the potential price increase that could occur from falling rates. Consequently, the effective duration of a callable bond is typically less than that of a comparable non-callable (straight) bond because the callable bond&#x27;s price is less sensitive to decreases in interest rates. The presence of the call option generally leads to a contraction of duration compared to its straight counterpart, not an expansion.<\/p><p><b>A is incorrect<\/b>. The statement that the effective duration of a zero-coupon bond is approximately equal to the maturity of the bond is generally true and thus not a false relationship. Zero-coupon bonds pay no coupons and instead are issued at a discount to their face value, maturing at par. The price of a zero-coupon bond is solely a function of the interest rates and its time to maturity. Since there are no intermediate cash flows before maturity, the bond&#x27;s sensitivity to interest rate changes (effective duration) is directly related to its time to maturity. As interest rates change, the impact on the bond&#x27;s price is directly proportional to its remaining time to maturity, making the effective duration of a zero-coupon bond approximately equal to its maturity.<\/p><p><b>C is incorrect<\/b>. The statement that the effective duration of a fixed-rate putable bond cannot exceed the effective duration of its straight counterpart is generally true. A putable bond includes an option for the holder to force the issuer to buy back the bond at a predetermined price before maturity. This option provides the bondholder protection against rising interest rates, as they can choose to sell the bond back to the issuer and reinvest at higher rates. This feature reduces the bond&#x27;s sensitivity to interest rate increases, thereby reducing its effective duration compared to a similar bond without the put option. The presence of the put option generally leads to a reduction in duration because the downside risk of rising rates is mitigated. <\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(b): Explain the relationships between the values of a callable or putable bond, the underlying option-free (straight) bond, and the embedded option<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Andrew Park<\/summary><div class=\"vig-body\"><p>Andrew Park is an intern at ABS Investments. He is being trained by Junichiro Taka, who wishes to discover how much Park knows about how interest rate volatility affects bond values, specifically that of callable or putable bonds. Park explains that an increase in interest rate volatility will increase the price of callable and putable bonds because the value of the embedded options will increase. He also explains that changes in interest rate volatility do not affect the price of option-free bonds.<\/p><p>Taka then asks if Park knows how changes in the yield curve shape affect the value of embedded options within bonds, assuming an upward-sloping yield curve. Park explains that, as an upward-sloping yield curve flattens, an embedded call option increases in value while the value of an embedded put option decreases. <\/p><p>Taka turns his attention to option-adjusted spreads. He explains to Park that the option-adjusted spread (OAS) is a constant spread added to all one-period rates in a risk-free binomial interest rate tree to adjust for the embedded option, ensuring that the calculated bond value matches its market price.<\/p><p>Before introducing Park to the company&#x27;s iterative process to estimate option-adjusted spreads, Taka wants to know if Park understands the relationship between interest rate volatility and option-adjusted spreads. Taka makes the following statements and asks Park to identify the false statement.<\/p><p>Statement 1: If the interest rate volatility assumed when generating the binomial interest rate tree is too high, the OAS computed for a callable bond will be too low.<\/p><p>Statement 2: If the interest rate volatility assumed when generating the binomial interest rate tree is too high, the putable bond will be mistakenly categorized as underpriced.<\/p><p>Statement 3: If the interest rate volatility assumed when generating the binomial interest rate tree is too low, then the callable bond will be mistakenly categorized as overpriced.<\/p><p>Taka thinks it is important that Park understands how effective duration and convexity should be calculated for callable and putable bonds. Taka explains that effective duration and effective convexity are functions of yield change, the initial observed bond price, and two estimated prices: one assuming a yield increase by the yield change and the other assuming a yield decrease by the yield change.<\/p><p>Taka then explains how the two estimated prices are calculated.<\/p><p>Step 1: Use the benchmark yield curve, interest rate volatility assumptions, and current market price to compute the OAS after adjusting for calls and/or puts.<\/p><p>Before Taka could explain the remaining steps, he was interrupted by another intern, Sally, who had a question on the boundaries of effective duration for various bonds. Specifically, Sally wanted to know if the following relationships were true.<\/p><p>Relationship 1: The effective duration of a zero-coupon bond is approximately equal to the maturity of the bond.<\/p><p>Relationship 2: The effective duration of a fixed-rate callable bond can sometimes be greater than the effective duration of its straight counterpart.<\/p><p>Relationship 3: The effective duration of a fixed-rate putable bond cannot exceed the effective duration of its straight counterpart.<\/p><\/div><\/details><div class=\"qtext\"><p>Which effective duration relationship presented by Sally is most likely false:<\/p><\/div>", "subj": "fixed"}, {"n": 34, "q": "Is Taka’s definition of the OAS correct:", "opts": ["Yes, it is correct.", "No, it is incorrect because the OAS is added before adjusting for the embedded option.", "No, it is incorrect because the OAS is subtracted from all one-period rates."], "ans": "A", "expl": "Taka's definition of the Option Adjusted Spread (OAS) is indeed correct. The OAS is a critical component in bond valuation, particularly for bonds with embedded options such as callable or putable bonds. It represents a spread that is added to each node of a risk-free binomial interest rate tree. This adjustment is necessary to ensure that the theoretical value of the bond, calculated using these adjusted rates, aligns with its market price. The purpose of adding the OAS is to account for the option risk embedded in the bond, which affects its risk profile and pricing. By incorporating the OAS, the valuation model acknowledges the influence of options on the bond's overall yield requirements, thereby providing a more accurate reflection of the bond's true market value. This method allows investors and analysts to compare bonds on a level playing field, irrespective of the different risks and benefits associated with embedded options. B is incorrect. The statement that the OAS is added before adjusting for the embedded option is incorrect because the OAS itself is the adjustment for the embedded option. The OAS is not an initial step that precedes option adjustment; rather, it is the mechanism through which the adjustment for the option's impact is made. When calculating the value of a bond using a binomial tree, the OAS is applied to each one-period rate to modify the risk-free rates, thereby integrating the effects of the options into the valuation. This integration helps in accurately reflecting the additional yield that compensates for the option risk, ensuring that the bond's theoretical price matches its market price. C is incorrect. The statement that the OAS is subtracted from all one-period rates is incorrect. In bond valuation, particularly for those with embedded options, the OAS is added to the risk-free rates in the binomial tree, not subtracted. This addition of OAS increases the discount rates used in the valuation, which is necessary to account for the extra risk or potential benefit the options provide to the bondholder. Subtracting the OAS would incorrectly imply that the bond is less risky or less valuable than it actually is, resulting in a valuation that does not accurately reflect market conditions and the inherent risks associated with the options embedded in the bond. ", "explhtml": "<p>Taka&#x27;s definition of the Option Adjusted Spread (OAS) is indeed correct. The OAS is a critical component in bond valuation, particularly for bonds with embedded options such as callable or putable bonds. It represents a spread that is added to each node of a risk-free binomial interest rate tree. This adjustment is necessary to ensure that the theoretical value of the bond, calculated using these adjusted rates, aligns with its market price. The purpose of adding the OAS is to account for the option risk embedded in the bond, which affects its risk profile and pricing. By incorporating the OAS, the valuation model acknowledges the influence of options on the bond&#x27;s overall yield requirements, thereby providing a more accurate reflection of the bond&#x27;s true market value. This method allows investors and analysts to compare bonds on a level playing field, irrespective of the different risks and benefits associated with embedded options.<\/p><p><b>B is incorrect<\/b>. The statement that the OAS is added before adjusting for the embedded option is incorrect because the OAS itself is the adjustment for the embedded option. The OAS is not an initial step that precedes option adjustment; rather, it is the mechanism through which the adjustment for the option&#x27;s impact is made. When calculating the value of a bond using a binomial tree, the OAS is applied to each one-period rate to modify the risk-free rates, thereby integrating the effects of the options into the valuation. This integration helps in accurately reflecting the additional yield that compensates for the option risk, ensuring that the bond&#x27;s theoretical price matches its market price.<\/p><p><b>C is incorrect<\/b>. The statement that the OAS is subtracted from all one-period rates is incorrect. In bond valuation, particularly for those with embedded options, the OAS is added to the risk-free rates in the binomial tree, not subtracted. This addition of OAS increases the discount rates used in the valuation, which is necessary to account for the extra risk or potential benefit the options provide to the bondholder. Subtracting the OAS would incorrectly imply that the bond is less risky or less valuable than it actually is, resulting in a valuation that does not accurately reflect market conditions and the inherent risks associated with the options embedded in the bond. <\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(b): Explain the relationships between the values of a callable or putable bond, the underlying option-free (straight) bond, and the embedded option<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Andrew Park<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrew Park is an intern at ABS Investments. He is being trained by Junichiro Taka, who wishes to discover how much Park knows about how interest rate volatility affects bond values, specifically that of callable or putable bonds. Park explains that an increase in interest rate volatility will increase the price of callable and putable bonds because the value of the embedded options will increase. He also explains that changes in interest rate volatility do not affect the price of option-free bonds.<\/p><p>Taka then asks if Park knows how changes in the yield curve shape affect the value of embedded options within bonds, assuming an upward-sloping yield curve. Park explains that, as an upward-sloping yield curve flattens, an embedded call option increases in value while the value of an embedded put option decreases. <\/p><p>Taka turns his attention to option-adjusted spreads. He explains to Park that the option-adjusted spread (OAS) is a constant spread added to all one-period rates in a risk-free binomial interest rate tree to adjust for the embedded option, ensuring that the calculated bond value matches its market price.<\/p><p>Before introducing Park to the company&#x27;s iterative process to estimate option-adjusted spreads, Taka wants to know if Park understands the relationship between interest rate volatility and option-adjusted spreads. Taka makes the following statements and asks Park to identify the false statement.<\/p><p>Statement 1: If the interest rate volatility assumed when generating the binomial interest rate tree is too high, the OAS computed for a callable bond will be too low.<\/p><p>Statement 2: If the interest rate volatility assumed when generating the binomial interest rate tree is too high, the putable bond will be mistakenly categorized as underpriced.<\/p><p>Statement 3: If the interest rate volatility assumed when generating the binomial interest rate tree is too low, then the callable bond will be mistakenly categorized as overpriced.<\/p><p>Taka thinks it is important that Park understands how effective duration and convexity should be calculated for callable and putable bonds. Taka explains that effective duration and effective convexity are functions of yield change, the initial observed bond price, and two estimated prices: one assuming a yield increase by the yield change and the other assuming a yield decrease by the yield change.<\/p><p>Taka then explains how the two estimated prices are calculated.<\/p><p>Step 1: Use the benchmark yield curve, interest rate volatility assumptions, and current market price to compute the OAS after adjusting for calls and/or puts.<\/p><p>Before Taka could explain the remaining steps, he was interrupted by another intern, Sally, who had a question on the boundaries of effective duration for various bonds. Specifically, Sally wanted to know if the following relationships were true.<\/p><p>Relationship 1: The effective duration of a zero-coupon bond is approximately equal to the maturity of the bond.<\/p><p>Relationship 2: The effective duration of a fixed-rate callable bond can sometimes be greater than the effective duration of its straight counterpart.<\/p><p>Relationship 3: The effective duration of a fixed-rate putable bond cannot exceed the effective duration of its straight counterpart.<\/p><\/div><\/details><div class=\"qtext\"><p>Is Taka’s definition of the OAS correct:<\/p><\/div>", "subj": "fixed"}, {"n": 35, "q": "Which of the statements that Taka made about interest rate volatility and OAS is most likely false:", "opts": ["Statement 1", "Statement 2", "Statement 3"], "ans": "B", "expl": "It addresses the mispricing of putable bonds when the interest rate volatility assumed is too high. In the context of putable bonds, higher interest rate volatility increases the value of the put option embedded in the bond. This is because the put option provides the bondholder with the right to sell the bond back to the issuer at a predetermined price, which becomes more valuable as market uncertainty (volatility) increases. If the volatility assumed in the binomial interest rate tree is too high, it would not lead to the bond being categorized as underpriced; rather, it would likely be overpriced because the value of the put option is exaggerated. This mispricing arises because the higher volatility assumption increases the protective value of the put option, thus increasing the overall bond value more than it should. A is incorrect. Statement 1 suggests that if the interest rate volatility assumed is too high, the OAS computed for a callable bond will be too low. This statement is accurate because the callable bond's value is inversely related to the value of the call option embedded within it. A higher assumed volatility increases the value of the call option (since the issuer has the right to call back the bond in a high volatility environment, which is advantageous), thereby decreasing the bond's value relative to its market price. Consequently, the OAS, which adjusts the theoretical bond price to match the market price, will be lower to compensate for the overvaluation of the call option. C is incorrect. Statement 3 is also true as it correctly describes the impact of underestimating interest rate volatility on the pricing of callable bonds. If the volatility assumed is too low, the value of the call option embedded in the bond is also underestimated. Since the call option provides a benefit to the issuer, underestimating its value means that the bond's overall value is perceived to be higher than it actually is (overpriced). This mispricing occurs because the risk of the issuer calling the bond in a high-volatility environment is not adequately accounted for, resulting in a valuation that does not accurately reflect the true risk-return profile of the bond. ", "explhtml": "<p>It addresses the mispricing of putable bonds when the interest rate volatility assumed is too high. In the context of putable bonds, higher interest rate volatility increases the value of the put option embedded in the bond. This is because the put option provides the bondholder with the right to sell the bond back to the issuer at a predetermined price, which becomes more valuable as market uncertainty (volatility) increases. If the volatility assumed in the binomial interest rate tree is too high, it would not lead to the bond being categorized as underpriced; rather, it would likely be overpriced because the value of the put option is exaggerated. This mispricing arises because the higher volatility assumption increases the protective value of the put option, thus increasing the overall bond value more than it should.<\/p><p><b>A is incorrect<\/b>. Statement 1 suggests that if the interest rate volatility assumed is too high, the OAS computed for a callable bond will be too low. This statement is accurate because the callable bond&#x27;s value is inversely related to the value of the call option embedded within it. A higher assumed volatility increases the value of the call option (since the issuer has the right to call back the bond in a high volatility environment, which is advantageous), thereby decreasing the bond&#x27;s value relative to its market price. Consequently, the OAS, which adjusts the theoretical bond price to match the market price, will be lower to compensate for the overvaluation of the call option.<\/p><p><b>C is incorrect<\/b>. Statement 3 is also true as it correctly describes the impact of underestimating interest rate volatility on the pricing of callable bonds. If the volatility assumed is too low, the value of the call option embedded in the bond is also underestimated. Since the call option provides a benefit to the issuer, underestimating its value means that the bond&#x27;s overall value is perceived to be higher than it actually is (overpriced). This mispricing occurs because the risk of the issuer calling the bond in a high-volatility environment is not adequately accounted for, resulting in a valuation that does not accurately reflect the true risk-return profile of the bond. <\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(e): Explain how changes in the level and shape of the yield curve affect the value of a callable or putable bond<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Andrew Park<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrew Park is an intern at ABS Investments. He is being trained by Junichiro Taka, who wishes to discover how much Park knows about how interest rate volatility affects bond values, specifically that of callable or putable bonds. Park explains that an increase in interest rate volatility will increase the price of callable and putable bonds because the value of the embedded options will increase. He also explains that changes in interest rate volatility do not affect the price of option-free bonds.<\/p><p>Taka then asks if Park knows how changes in the yield curve shape affect the value of embedded options within bonds, assuming an upward-sloping yield curve. Park explains that, as an upward-sloping yield curve flattens, an embedded call option increases in value while the value of an embedded put option decreases. <\/p><p>Taka turns his attention to option-adjusted spreads. He explains to Park that the option-adjusted spread (OAS) is a constant spread added to all one-period rates in a risk-free binomial interest rate tree to adjust for the embedded option, ensuring that the calculated bond value matches its market price.<\/p><p>Before introducing Park to the company&#x27;s iterative process to estimate option-adjusted spreads, Taka wants to know if Park understands the relationship between interest rate volatility and option-adjusted spreads. Taka makes the following statements and asks Park to identify the false statement.<\/p><p>Statement 1: If the interest rate volatility assumed when generating the binomial interest rate tree is too high, the OAS computed for a callable bond will be too low.<\/p><p>Statement 2: If the interest rate volatility assumed when generating the binomial interest rate tree is too high, the putable bond will be mistakenly categorized as underpriced.<\/p><p>Statement 3: If the interest rate volatility assumed when generating the binomial interest rate tree is too low, then the callable bond will be mistakenly categorized as overpriced.<\/p><p>Taka thinks it is important that Park understands how effective duration and convexity should be calculated for callable and putable bonds. Taka explains that effective duration and effective convexity are functions of yield change, the initial observed bond price, and two estimated prices: one assuming a yield increase by the yield change and the other assuming a yield decrease by the yield change.<\/p><p>Taka then explains how the two estimated prices are calculated.<\/p><p>Step 1: Use the benchmark yield curve, interest rate volatility assumptions, and current market price to compute the OAS after adjusting for calls and/or puts.<\/p><p>Before Taka could explain the remaining steps, he was interrupted by another intern, Sally, who had a question on the boundaries of effective duration for various bonds. Specifically, Sally wanted to know if the following relationships were true.<\/p><p>Relationship 1: The effective duration of a zero-coupon bond is approximately equal to the maturity of the bond.<\/p><p>Relationship 2: The effective duration of a fixed-rate callable bond can sometimes be greater than the effective duration of its straight counterpart.<\/p><p>Relationship 3: The effective duration of a fixed-rate putable bond cannot exceed the effective duration of its straight counterpart.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the statements that Taka made about interest rate volatility and OAS is most likely false:<\/p><\/div>", "subj": "fixed"}, {"n": 36, "q": "Park’s explanation of the effect of a flattening yield curve on the value of embedded options is most likely:", "opts": ["Correct.", "Incorrect this will increase the value of an embedded put option.", "Incorrect this will decrease the value of an embedded call option."], "ans": "A", "expl": "Park's explanation regarding the effect of a flattening yield curve on the value of embedded options in bonds is accurate. An upward-sloping yield curve implies that the long-term interest rates are higher than the short-term rates. When the yield curve flattens, it generally means that the long-term rates are decreasing or the short-term rates are increasing, or a combination of both. For a callable bond, the embedded call option becomes more valuable as the likelihood of interest rates decreasing (and hence bond prices increasing) makes it more likely for the issuer to call the bond at a preset price. This is because the issuer would prefer to refinance at a lower rate if possible. Therefore, a flattening yield curve, by potentially lowering long-term rates, increases the value of the call option embedded in a callable bond. B is incorrect. The statement that a flattening yield curve will increase the value of an embedded put option is incorrect because a put option in a bond allows the holder to sell the bond back to the issuer at a predetermined price, which is beneficial when interest rates rise (and bond prices fall). In the scenario of a flattening yield curve due to falling long-term rates, market conditions become less favorable for exercising the put option, as the likelihood of interest rates rising sharply enough to significantly decrease bond prices is reduced. Thus, the value of the put option decreases, contrary to what is suggested in option B. C is incorrect. The statement that a flattening yield curve will decrease the value of an embedded call option is incorrect. As explained, a flattening yield curve often results from decreasing long-term interest rates, which can increase the bond's price, making it more likely for the bond to be called. This increases the value of the call option. Therefore, the flattening of the yield curve actually enhances, rather than diminishes, the value of an embedded call option, making option C incorrect. ", "explhtml": "<p>Park&#x27;s explanation regarding the effect of a flattening yield curve on the value of embedded options in bonds is accurate. An upward-sloping yield curve implies that the long-term interest rates are higher than the short-term rates. When the yield curve flattens, it generally means that the long-term rates are decreasing or the short-term rates are increasing, or a combination of both. For a callable bond, the embedded call option becomes more valuable as the likelihood of interest rates decreasing (and hence bond prices increasing) makes it more likely for the issuer to call the bond at a preset price. This is because the issuer would prefer to refinance at a lower rate if possible. Therefore, a flattening yield curve, by potentially lowering long-term rates, increases the value of the call option embedded in a callable bond.<\/p><p><b>B is incorrect<\/b>. The statement that a flattening yield curve will increase the value of an embedded put option is incorrect because a put option in a bond allows the holder to sell the bond back to the issuer at a predetermined price, which is beneficial when interest rates rise (and bond prices fall). In the scenario of a flattening yield curve due to falling long-term rates, market conditions become less favorable for exercising the put option, as the likelihood of interest rates rising sharply enough to significantly decrease bond prices is reduced. Thus, the value of the put option decreases, contrary to what is suggested in option B.<\/p><p><b>C is incorrect<\/b>. The statement that a flattening yield curve will decrease the value of an embedded call option is incorrect. As explained, a flattening yield curve often results from decreasing long-term interest rates, which can increase the bond&#x27;s price, making it more likely for the bond to be called. This increases the value of the call option. Therefore, the flattening of the yield curve actually enhances, rather than diminishes, the value of an embedded call option, making option C incorrect. <\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(e): Explain how changes in the level and shape of the yield curve affect the value of a callable or putable bond<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Andrew Park<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrew Park is an intern at ABS Investments. He is being trained by Junichiro Taka, who wishes to discover how much Park knows about how interest rate volatility affects bond values, specifically that of callable or putable bonds. Park explains that an increase in interest rate volatility will increase the price of callable and putable bonds because the value of the embedded options will increase. He also explains that changes in interest rate volatility do not affect the price of option-free bonds.<\/p><p>Taka then asks if Park knows how changes in the yield curve shape affect the value of embedded options within bonds, assuming an upward-sloping yield curve. Park explains that, as an upward-sloping yield curve flattens, an embedded call option increases in value while the value of an embedded put option decreases. <\/p><p>Taka turns his attention to option-adjusted spreads. He explains to Park that the option-adjusted spread (OAS) is a constant spread added to all one-period rates in a risk-free binomial interest rate tree to adjust for the embedded option, ensuring that the calculated bond value matches its market price.<\/p><p>Before introducing Park to the company&#x27;s iterative process to estimate option-adjusted spreads, Taka wants to know if Park understands the relationship between interest rate volatility and option-adjusted spreads. Taka makes the following statements and asks Park to identify the false statement.<\/p><p>Statement 1: If the interest rate volatility assumed when generating the binomial interest rate tree is too high, the OAS computed for a callable bond will be too low.<\/p><p>Statement 2: If the interest rate volatility assumed when generating the binomial interest rate tree is too high, the putable bond will be mistakenly categorized as underpriced.<\/p><p>Statement 3: If the interest rate volatility assumed when generating the binomial interest rate tree is too low, then the callable bond will be mistakenly categorized as overpriced.<\/p><p>Taka thinks it is important that Park understands how effective duration and convexity should be calculated for callable and putable bonds. Taka explains that effective duration and effective convexity are functions of yield change, the initial observed bond price, and two estimated prices: one assuming a yield increase by the yield change and the other assuming a yield decrease by the yield change.<\/p><p>Taka then explains how the two estimated prices are calculated.<\/p><p>Step 1: Use the benchmark yield curve, interest rate volatility assumptions, and current market price to compute the OAS after adjusting for calls and/or puts.<\/p><p>Before Taka could explain the remaining steps, he was interrupted by another intern, Sally, who had a question on the boundaries of effective duration for various bonds. Specifically, Sally wanted to know if the following relationships were true.<\/p><p>Relationship 1: The effective duration of a zero-coupon bond is approximately equal to the maturity of the bond.<\/p><p>Relationship 2: The effective duration of a fixed-rate callable bond can sometimes be greater than the effective duration of its straight counterpart.<\/p><p>Relationship 3: The effective duration of a fixed-rate putable bond cannot exceed the effective duration of its straight counterpart.<\/p><\/div><\/details><div class=\"qtext\"><p>Park’s explanation of the effect of a flattening yield curve on the value of embedded options is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 37, "q": "Based on the information presented in Exhibit 1, the price of Bond Y is mostlikely:", "opts": ["Lower than the price of Bond X.", "Higher than the price of Bond X.", "Equal to the price of Bond X."], "ans": "A", "expl": "Bond X, being an option-free bond, offers a straightforward investment where the bondholder receives fixed payments until maturity without any modifications to the terms of the bond. This predictability and security generally make option-free bonds more appealing to conservative investors, thereby allowing these bonds to command a higher price in the market. The absence of any embedded options in Bond X means that the bondholder does not face the risk of the issuer altering the bond's terms to the bondholder's disadvantage. B is incorrect. The presence of a callable option in Bond Y introduces additional risk to the bondholder. This option allows the issuer to repurchase the bond at par value before maturity, typically when interest rates drop, making it cheaper to refinance the debt. This potential action is advantageous to the issuer but not to the bondholder, who faces reinvestment risk and potential loss of future interest payments. Consequently, investors require a higher yield to compensate for this risk, which translates into a lower price for Bond Y compared to Bond X, which does not have such an option. C is incorrect. The statement that Bond Y would be priced equally to Bond X overlooks the significant impact of the callable feature embedded in Bond Y. This feature introduces uncertainty regarding the bond's cash flows, as the issuer may choose to call the bond early under favorable market conditions. This risk is absent in Bond X, making it more valuable. Therefore, the prices of the two bonds cannot be equal, as the callable option in Bond Y diminishes its price relative to an equivalent option-free bond like Bond X. ", "explhtml": "<p>Bond X, being an option-free bond, offers a straightforward investment where the bondholder receives fixed payments until maturity without any modifications to the terms of the bond. This predictability and security generally make option-free bonds more appealing to conservative investors, thereby allowing these bonds to command a higher price in the market. The absence of any embedded options in Bond X means that the bondholder does not face the risk of the issuer altering the bond&#x27;s terms to the bondholder&#x27;s disadvantage.<\/p><p><b>B is incorrect<\/b>. The presence of a callable option in Bond Y introduces additional risk to the bondholder. This option allows the issuer to repurchase the bond at par value before maturity, typically when interest rates drop, making it cheaper to refinance the debt. This potential action is advantageous to the issuer but not to the bondholder, who faces reinvestment risk and potential loss of future interest payments. Consequently, investors require a higher yield to compensate for this risk, which translates into a lower price for Bond Y compared to Bond X, which does not have such an option.<\/p><p><b>C is incorrect<\/b>. The statement that Bond Y would be priced equally to Bond X overlooks the significant impact of the callable feature embedded in Bond Y. This feature introduces uncertainty regarding the bond&#x27;s cash flows, as the issuer may choose to call the bond early under favorable market conditions. This risk is absent in Bond X, making it more valuable. Therefore, the prices of the two bonds cannot be equal, as the callable option in Bond Y diminishes its price relative to an equivalent option-free bond like Bond X. <\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(b): Explain the relationships between the values of a callable or putable bond, the underlying option-free (straight) bond, and the embedded option<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Markus Jang<\/summary><div class=\"vig-body\"><p>Markus Jang, a fixed-income consultant, meets with a client, Alfred George, who manages a fixed-income portfolio. The two are meeting to discuss three default-free bonds, shown below in Exhibit 1. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0060.webp\" style=\"max-width:min(100%,599px)\" alt=\"Exhibit 1: Information on selected bonds X Y Z Annual coupon 5% 5% 5% Par value $100 $100 $100 Time to maturity 3 years 3 years 3 years Callable  and Embedded option(s) None Callable at par putable at par Time to exercise date(s) N/A 2 years 2 years, 3 years\"><p>Before sharing his analysis with George, Jang notes that the current one-year, two-year, and three-year default-free spot rates are 2.5%, 3.0%, and 3.5%.<\/p><p>George also mentions that he is considering purchasing Bond C, a three-year 4.25% annual coupon bond putable at par in one year and two years. The bond is currently trading at $101.50 per $100 of par value with an implied volatility of 10%. He asks Jang to analyze a scenario where all other factors remain, but this bond&#x27;s implied volatility increases by 15%.<\/p><p>George then asks Jang to evaluate the interest rate sensitivities of bonds with embedded options. Jang mentions that effective duration is one of the measures for evaluating the interest rate sensitivity of such bonds. George asks him to calculate the effective duration of two bonds, shown below in Exhibit 2. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0061.webp\" style=\"max-width:min(100%,586px)\" alt=\"Exhibit 2: Information on selected bonds A B Time to maturity 3 years 3 years Annual coupon 5% 4% Current price $99.85 $100.50 Price if yield curve shifts up 50bps $99.55 $100.25 Price if yield curve shifts down 50bps $100.00 $101.20 Embedded option(s) Callable at par Putable at par\"><p>Jang closes the meeting with the following comments on the topic of bond convexity:<\/p><p>Comment 1: &quot;Callable bonds exhibit both positive and negative convexity.&quot;<\/p><p>Comment 2: &quot;Effective convexity is always positive for putable bonds.&quot;<\/p><p>Comment 3: &quot;Option-free bonds exhibit negative convexity.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information presented in Exhibit 1, the price of Bond Y is mostlikely:<\/p><\/div>", "subj": "fixed"}, {"n": 38, "q": "Based on the information presented in Exhibit 2, the effective duration of Bond A is closest to:", "opts": ["0.2254.", "0.4507.", "0.9013."], "ans": "B", "expl": "The effective duration of Bond A can be calculated using the formula for effective duration, which is given by: Where: P V− is the bond price if the yield decreases, P V+ is the bond price if the yield increases, ΔYield is the change in yield (in decimal form), P V0 is the current bond price. From Exhibit 2, we have the following values for Bond A: P V− = \\$100.00 when the yield curve shifts down by 50 basis points, P V+ = \\$99.55 when the yield curve shifts up by 50 basis points, ΔYield = 0.005 (50 basis points = 0.005 in decimal form), P V0 = \\$99.85 (current price of the bond). Plugging these values into the formula, we get: This calculation shows that the effective duration of Bond A is approximately 0.4507, which aligns with option B. A is incorrect. The value 0.2254 does not align with the calculated effective duration of Bond A. The incorrect value may result from a miscalculation or misunderstanding of the formula for effective duration. It is essential to ensure that all values used in the formula are accurate and that the formula is applied correctly. The correct calculation, as shown above, yields a value of 0.4507, not 0.2254. C is incorrect. The value 0.9013 significantly deviates from the calculated effective duration of Bond A. This discrepancy could be due to an error in doubling the actual effective duration or another computational mistake. Effective duration is a measure of the bond's price sensitivity to yield changes, and it is crucial to apply the formula correctly to avoid such significant errors. The correct effective duration, as calculated, is 0.4507, which is exactly half of 0.9013, indicating a possible error in the application of the formula or interpretation of the bond's sensitivity. ", "explhtml": "<p>The effective duration of Bond A can be calculated using the formula for effective duration, which is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0062. ossible error in the application of the formula or interpretation of the bond&#x27;s sensitivity. <\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(d): Explain how interest rate volatility affects the value of a callable or putable bond<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Markus Jang<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Markus Jang, a fixed-income consultant, meets with a client, Alfred George, who manages a fixed-income portfolio. The two are meeting to discuss three default-free bonds, shown below in Exhibit 1. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0060.webp\" style=\"max-width:min(100%,599px)\" alt=\"Exhibit 1: Information on selected bonds X Y Z Annual coupon 5% 5% 5% Par value $100 $100 $100 Time to maturity 3 years 3 years 3 years Callable  and Embedded option(s) None Callable at par putable at par Time to exercise date(s) N/A 2 years 2 years, 3 years\"><p>Before sharing his analysis with George, Jang notes that the current one-year, two-year, and three-year default-free spot rates are 2.5%, 3.0%, and 3.5%.<\/p><p>George also mentions that he is considering purchasing Bond C, a three-year 4.25% annual coupon bond putable at par in one year and two years. The bond is currently trading at $101.50 per $100 of par value with an implied volatility of 10%. He asks Jang to analyze a scenario where all other factors remain, but this bond&#x27;s implied volatility increases by 15%.<\/p><p>George then asks Jang to evaluate the interest rate sensitivities of bonds with embedded options. Jang mentions that effective duration is one of the measures for evaluating the interest rate sensitivity of such bonds. George asks him to calculate the effective duration of two bonds, shown below in Exhibit 2. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0061.webp\" style=\"max-width:min(100%,586px)\" alt=\"Exhibit 2: Information on selected bonds A B Time to maturity 3 years 3 years Annual coupon 5% 4% Current price $99.85 $100.50 Price if yield curve shifts up 50bps $99.55 $100.25 Price if yield curve shifts down 50bps $100.00 $101.20 Embedded option(s) Callable at par Putable at par\"><p>Jang closes the meeting with the following comments on the topic of bond convexity:<\/p><p>Comment 1: &quot;Callable bonds exhibit both positive and negative convexity.&quot;<\/p><p>Comment 2: &quot;Effective convexity is always positive for putable bonds.&quot;<\/p><p>Comment 3: &quot;Option-free bonds exhibit negative convexity.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information presented in Exhibit 2, the effective duration of Bond A is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 39, "q": "Based on Exhibit 1, under a steeply downward-sloping yield curve scenario, Bond Z will most likely:", "opts": ["Be called by the issuer.", "Be put by the bondholders.", "Mature without any of its embedded options being exercised."], "ans": "A", "expl": "Under a steeply downward-sloping yield curve scenario, the interest rates are lower for longer maturities compared to shorter ones. This condition generally leads to an increase in bond prices. Bond Z, which is both callable and putable at par, presents an interesting case for analysis. The issuer of Bond Z has the option to call the bond, which means they can choose to pay off the bond early at the par value. In a scenario where interest rates are declining, the issuer would be motivated to call the bond to refinance the debt at a lower interest rate. This is financially beneficial for the issuer as it reduces the cost of borrowing. By calling the bond, the issuer can reissue new bonds at the current lower rates, thus saving on interest expenses over time. B is incorrect. The option for bondholders to put the bond (sell it back to the issuer at par) becomes attractive when interest rates rise, not when they fall. In the scenario described, with a steeply downward-sloping yield curve, interest rates are decreasing. This decrease in rates generally leads to an increase in bond prices above par. Therefore, it would not be beneficial for bondholders to exercise the put option to sell the bond back at par when they could potentially sell it at a higher price in the market. Additionally, the lower interest rates would make other investment opportunities less attractive, reducing the incentive for bondholders to retrieve their principal investment early. C is incorrect. While it is possible for Bond Z to mature without any of its embedded options being exercised, it is less likely in the given scenario of a steeply downward-sloping yield curve. The economic incentive for the issuer to call the bond in a declining interest rate environment outweighs the likelihood that the bond will reach maturity without exercising the embedded options. The issuer would prefer to reduce future interest payments by calling the bond and refinancing at the current lower rates. This financial decision is driven by the cost savings on interest payments, which would not be as effectively achieved if the bond were to simply mature.", "explhtml": "<p>Under a steeply downward-sloping yield curve scenario, the interest rates are lower for longer maturities compared to shorter ones. This condition generally leads to an increase in bond prices. Bond Z, which is both callable and putable at par, presents an interesting case for analysis. The issuer of Bond Z has the option to call the bond, which means they can choose to pay off the bond early at the par value. In a scenario where interest rates are declining, the issuer would be motivated to call the bond to refinance the debt at a lower interest rate. This is financially beneficial for the issuer as it reduces the cost of borrowing. By calling the bond, the issuer can reissue new bonds at the current lower rates, thus saving on interest expenses over time.<\/p><p><b>B is incorrect<\/b>. The option for bondholders to put the bond (sell it back to the issuer at par) becomes attractive when interest rates rise, not when they fall. In the scenario described, with a steeply downward-sloping yield curve, interest rates are decreasing. This decrease in rates generally leads to an increase in bond prices above par. Therefore, it would not be beneficial for bondholders to exercise the put option to sell the bond back at par when they could potentially sell it at a higher price in the market. Additionally, the lower interest rates would make other investment opportunities less attractive, reducing the incentive for bondholders to retrieve their principal investment early.<\/p><p><b>C is incorrect<\/b>. While it is possible for Bond Z to mature without any of its embedded options being exercised, it is less likely in the given scenario of a steeply downward-sloping yield curve. The economic incentive for the issuer to call the bond in a declining interest rate environment outweighs the likelihood that the bond will reach maturity without exercising the embedded options. The issuer would prefer to reduce future interest payments by calling the bond and refinancing at the current lower rates. This financial decision is driven by the cost savings on interest payments, which would not be as effectively achieved if the bond were to simply mature.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3: Explain how interest rate volatility affects the value of a callable or putable bond<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Markus Jang<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Markus Jang, a fixed-income consultant, meets with a client, Alfred George, who manages a fixed-income portfolio. The two are meeting to discuss three default-free bonds, shown below in Exhibit 1. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0060.webp\" style=\"max-width:min(100%,599px)\" alt=\"Exhibit 1: Information on selected bonds X Y Z Annual coupon 5% 5% 5% Par value $100 $100 $100 Time to maturity 3 years 3 years 3 years Callable  and Embedded option(s) None Callable at par putable at par Time to exercise date(s) N/A 2 years 2 years, 3 years\"><p>Before sharing his analysis with George, Jang notes that the current one-year, two-year, and three-year default-free spot rates are 2.5%, 3.0%, and 3.5%.<\/p><p>George also mentions that he is considering purchasing Bond C, a three-year 4.25% annual coupon bond putable at par in one year and two years. The bond is currently trading at $101.50 per $100 of par value with an implied volatility of 10%. He asks Jang to analyze a scenario where all other factors remain, but this bond&#x27;s implied volatility increases by 15%.<\/p><p>George then asks Jang to evaluate the interest rate sensitivities of bonds with embedded options. Jang mentions that effective duration is one of the measures for evaluating the interest rate sensitivity of such bonds. George asks him to calculate the effective duration of two bonds, shown below in Exhibit 2. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0061.webp\" style=\"max-width:min(100%,586px)\" alt=\"Exhibit 2: Information on selected bonds A B Time to maturity 3 years 3 years Annual coupon 5% 4% Current price $99.85 $100.50 Price if yield curve shifts up 50bps $99.55 $100.25 Price if yield curve shifts down 50bps $100.00 $101.20 Embedded option(s) Callable at par Putable at par\"><p>Jang closes the meeting with the following comments on the topic of bond convexity:<\/p><p>Comment 1: &quot;Callable bonds exhibit both positive and negative convexity.&quot;<\/p><p>Comment 2: &quot;Effective convexity is always positive for putable bonds.&quot;<\/p><p>Comment 3: &quot;Option-free bonds exhibit negative convexity.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, under a steeply downward-sloping yield curve scenario, Bond Z will most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 40, "q": "Bond C's price per $100 of par value in the scenario described by George is most likely:", "opts": ["Equal to $101.50.", "Less than $101.50.", "Greater than $101.50."], "ans": "C", "expl": "The value of a putable bond is derived from the combination of an equivalent option-free bond and the value of the embedded put option. The put option provides the bondholder the right, but not the obligation, to sell the bond back to the issuer at a predetermined price before maturity, which acts as a protective feature against falling bond prices. When the implied volatility increases, the value of the put option also increases because there is a greater probability that the bond prices will move significantly, thus making the option more valuable. In the scenario described, Bond C's implied volatility increases from 10% to 15%. This increase in volatility enhances the value of the put option embedded in the bond. Since all other factors remain constant, the only change affecting the bond's price is the increased value of the put option due to higher volatility. Consequently, the overall value of Bond C will increase, leading to a price greater than $101.50 per $100 of par value. A is incorrect. The statement that Bond C's price would remain equal to $101.50 per $100 of par value under the scenario of increased implied volatility is incorrect because it overlooks the impact of the put option's enhanced value. The put option embedded in Bond C becomes more valuable as volatility increases, providing greater downside protection and thus increasing the bond's overall value. Since the scenario specifies that volatility is the only changing factor and it increases, the price of the bond must logically increase to reflect the higher value of the put option, rather than remaining the same. B is incorrect. Suggesting that Bond C's price would be less than $101.50 per $100 of par value contradicts the fundamental principles of options valuation. An increase in implied volatility generally leads to an increase in the value of options. Since the put option embedded in Bond C provides a safety net against price falls, its increased value due to higher volatility should lead to an increase in the bond's price, not a decrease. Therefore, stating that the bond's price would decrease ignores the protective effect and the enhanced worth of the put option under higher volatility conditions. ", "explhtml": "<p>The value of a putable bond is derived from the combination of an equivalent option-free bond and the value of the embedded put option. The put option provides the bondholder the right, but not the obligation, to sell the bond back to the issuer at a predetermined price before maturity, which acts as a protective feature against falling bond prices. When the implied volatility increases, the value of the put option also increases because there is a greater probability that the bond prices will move significantly, thus making the option more valuable. In the scenario described, Bond C&#x27;s implied volatility increases from 10% to 15%. This increase in volatility enhances the value of the put option embedded in the bond. Since all other factors remain constant, the only change affecting the bond&#x27;s price is the increased value of the put option due to higher volatility. Consequently, the overall value of Bond C will increase, leading to a price greater than $101.50 per $100 of par value.<\/p><p><b>A is incorrect<\/b>. The statement that Bond C&#x27;s price would remain equal to $101.50 per $100 of par value under the scenario of increased implied volatility is incorrect because it overlooks the impact of the put option&#x27;s enhanced value. The put option embedded in Bond C becomes more valuable as volatility increases, providing greater downs
