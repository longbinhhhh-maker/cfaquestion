f the embedded option in Bond X (callable) would increase.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(e): Explain how changes in the level and shape of the yield curve affect the value of a callable or putable bond.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Paul Whitman<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Whitman is an investment adviser working for Oxidane Investment Group. One of his clients<\/p><p>is Clive Smith, who is about to retire and wants to change her portfolio. Whitman sets up a<\/p><p>meeting to discuss this. During the meeting, Smith says, “The outlook of the domestic economy<\/p><p>has been deteriorating, which has affected the equity market. I want to increase my fixed-income<\/p><p>investment and reduce my equity exposure in my portfolio.”<\/p><p>Smith adds,” I prefer investment-grade corporate bonds over government bonds since the<\/p><p>government yields have been low. Economists forecast that the yields will continue to decline<\/p><p>due to negative GDP growth and low employment rate over the last three quarters.” Whitman<\/p><p>prepares one-year forward rates and spot and par rates, which he presents in Exhibit 1. He also<\/p><p>suggests three fixed-rate investment-grade bonds issued by Saxon Group that are being<\/p><p>considered for investment, which data is presented in Exhibit 2.<\/p><p>Exhibit 1: One-Year Forward, Spot and Par Rates (annual coupon payments)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0131.webp\" style=\"max-width:min(100%,481px)\" alt=\"Maturity One-Year Forward Spot Rate Par Rate  1 Year 2.000% 2.000% 2.000% 2 Years 2.502% 2.320% 2.302% 3 Years 2.453% 2.351% 2.321% Exhibit 2: Fixed-Rate Bonds of Saxon Group Bond Bond Type Annual Coupon Bond X Callable Bond: callable at par 2.56% with no protection periods  currently trading at $10\"><\/div><\/details><div class=\"qtext\"><p>Suppose the yield curve is inverted; is the value of the embedded option most likely to be?<\/p><\/div>", "subj": "fixed"}, {"n": 85, "q": "Considering Exhibit 1, May would most likely deduce that, in comparison to Bond A, Bond B is:", "opts": ["Fairly priced.", "Overpriced.", "Underpriced."], "ans": "C", "expl": "The option-adjusted spread (OAS) is the fixed spread added to all one-period forward rates, making the arbitrage-free value of a risky bond equal to its market price. The OAS method is frequently employed to evaluate the relative values of bonds. When two bonds share the same characteristics and credit quality, they should have identical OAS. If there is a discrepancy, the bond with the higher OAS (e.g., Bond B) is probably undervalued (cheap) compared to the bond with the lower OAS (e.g., Bond A). A is incorrect. Bond B has a higher OAS (0.402%) than Bond A (0.355%). If two bonds have the same characteristics and credit quality, they should have the same OAS. Since Bond B has a higher OAS, it indicates that Bond B is likely undervalued or underpriced relative to Bond A. Therefore, Bond B cannot be fairly priced because its OAS suggests it is undervalued compared to Bond A. B is incorrect. Overpricing a bond implies that its market price is higher than its intrinsic value or that it has a lower OAS than another bond with similar characteristics and credit quality. In this case, Bond B has a higher OAS (0.402%) than Bond A (0.355%), suggesting that Bond B is cheaper or undervalued than Bond A. If Bond B were overpriced, its OAS would be lower than Bond A's, not higher. Hence, Bond B cannot be considered overpriced.", "explhtml": "<p>The option-adjusted spread (OAS) is the fixed spread added to all one-period forward rates, making the arbitrage-free value of a risky bond equal to its market price. The OAS method is frequently employed to evaluate the relative values of bonds. When two bonds share the same characteristics and credit quality, they should have identical OAS. If there is a discrepancy, the bond with the higher OAS (e.g., Bond B) is probably undervalued (cheap) compared to the bond with the lower OAS (e.g., Bond A).<\/p><p><b>A is incorrect.<\/b> Bond B has a higher OAS (0.402%) than Bond A (0.355%). If two bonds have the same characteristics and credit quality, they should have the same OAS. Since Bond B has a higher OAS, it indicates that Bond B is likely undervalued or underpriced relative to Bond A. Therefore, Bond B cannot be fairly priced because its OAS suggests it is undervalued compared to Bond A.<\/p><p><b>B is incorrect.<\/b> Overpricing a bond implies that its market price is higher than its intrinsic value or that it has a lower OAS than another bond with similar characteristics and credit quality. In this case, Bond B has a higher OAS (0.402%) than Bond A (0.355%), suggesting that Bond B is cheaper or undervalued than Bond A. If Bond B were overpriced, its OAS would be lower than Bond A&#x27;s, not higher. Hence, Bond B cannot be considered overpriced.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(g): explain the calculation and use of option-adjusted spreads.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · Mary May<\/summary><div class=\"vig-body\"><p>Mary May owns May Investment Limited (MIL), which specializes in managing fixed-income<\/p><p>portfolios. She wants to add embedded option bonds to MIL’s bond portfolio. May requests that<\/p><p>Tai Lung, an analyst at the firm, help her choose and analyze bonds for the firm’s bond portfolio.<\/p><p>Lung begins by selecting two callable at-par corporate bonds with the same maturity, call dates,<\/p><p>and credit quality. Using an option-adjusted spread (OAS) approach and assuming a 12% interest<\/p><p>volatility rate, Lung analyzes the bonds and presents the result in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0136.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Results of Lung’s Analysis Using the OAS Approach Bond OAS (%) Bond A 0.355% Bond B 0.402%\"><p>Lung then selects four more bonds issued by Rowlings Ltd., which are presented in Exhibit 2. All<\/p><p>four bonds have the same credit rating and 5-year maturity. Bonds D and E have the same<\/p><p>characteristics as Bond C, which is option-free. Bonds D and E include an embedded option.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0137.webp\" style=\"max-width:min(100%,618px)\" alt=\"Exhibit 2: Bonds Issued by Rowlings Ltd  Bond Special Provision Coupon Bond C 5% annual Bond D Putable at par at the end of years 2 and 3 5% annual Bond E Callable at par at the end of years 2 and 3 5% annual Bond F One-year reference rate annually in arrears\"><p>The current price of Bond A is 100.69 (% of par). The price (% of par) when shifting the<\/p><p>benchmark yield curve down by 0.40 is 102.87, and the price (% of par) when shifting the<\/p><p>benchmark yield curve up by 0.40% is 99.78.<\/p><\/div><\/details><div class=\"qtext\"><p>Considering Exhibit 1, May would most likely deduce that, in comparison to Bond A, Bond B is:<\/p><\/div>", "subj": "fixed"}, {"n": 86, "q": "Bond F’s effective duration is most likely:", "opts": ["Greater than 3.", "Less than three but greater than 1.", "Close to 1."], "ans": "C", "expl": "The effective duration of a floating-rate bond closely aligns with the time to the next reset. Since Bond F's reset is annual, its effective duration is approximately 1 year. A is incorrect. A floating-rate bond's effective duration is typically closely aligned with the time until its next interest rate reset. Since Bond F's reset occurs annually, it would be unusual for its effective duration to exceed 3 years. An effective duration greater than three would imply a much longer time to reset, which is not the case for Bond F. B is incorrect. While it is true that the effective duration of a bond can vary, a floating-rate bond's effective duration is usually near the time of the next reset. Bond F resets annually, so its effective duration should be close to 1 year, not between 1 and 3 years. The time to the next reset being just 1 year makes it unlikely for the effective duration to be in this range.", "explhtml": "<p>The effective duration of a floating-rate bond closely aligns with the time to the next reset. Since Bond F&#x27;s reset is annual, its effective duration is approximately 1 year.<\/p><p><b>A is incorrect.<\/b> A floating-rate bond&#x27;s effective duration is typically closely aligned with the time until its next interest rate reset. Since Bond F&#x27;s reset occurs annually, it would be unusual for its effective duration to exceed 3 years. An effective duration greater than three would imply a much longer time to reset, which is not the case for Bond F.<\/p><p><b>B is incorrect.<\/b> While it is true that the effective duration of a bond can vary, a floating-rate bond&#x27;s effective duration is usually near the time of the next reset. Bond F resets annually, so its effective duration should be close to 1 year, not between 1 and 3 years. The time to the next reset being just 1 year makes it unlikely for the effective duration to be in this range.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(i): calculate and interpret the effective duration of a callable or putable bond<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · Mary May<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mary May owns May Investment Limited (MIL), which specializes in managing fixed-income<\/p><p>portfolios. She wants to add embedded option bonds to MIL’s bond portfolio. May requests that<\/p><p>Tai Lung, an analyst at the firm, help her choose and analyze bonds for the firm’s bond portfolio.<\/p><p>Lung begins by selecting two callable at-par corporate bonds with the same maturity, call dates,<\/p><p>and credit quality. Using an option-adjusted spread (OAS) approach and assuming a 12% interest<\/p><p>volatility rate, Lung analyzes the bonds and presents the result in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0136.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Results of Lung’s Analysis Using the OAS Approach Bond OAS (%) Bond A 0.355% Bond B 0.402%\"><p>Lung then selects four more bonds issued by Rowlings Ltd., which are presented in Exhibit 2. All<\/p><p>four bonds have the same credit rating and 5-year maturity. Bonds D and E have the same<\/p><p>characteristics as Bond C, which is option-free. Bonds D and E include an embedded option.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0137.webp\" style=\"max-width:min(100%,618px)\" alt=\"Exhibit 2: Bonds Issued by Rowlings Ltd  Bond Special Provision Coupon Bond C 5% annual Bond D Putable at par at the end of years 2 and 3 5% annual Bond E Callable at par at the end of years 2 and 3 5% annual Bond F One-year reference rate annually in arrears\"><p>The current price of Bond A is 100.69 (% of par). The price (% of par) when shifting the<\/p><p>benchmark yield curve down by 0.40 is 102.87, and the price (% of par) when shifting the<\/p><p>benchmark yield curve up by 0.40% is 99.78.<\/p><\/div><\/details><div class=\"qtext\"><p>Bond F’s effective duration is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 87, "q": "In Exhibit 2, the bond that could experience an increase in effective duration if interest rates rise is:", "opts": ["Bond C", "Bond E", "Bond D"], "ans": "B", "expl": "Effective duration measures a bond’s price sensitivity to a 100 bps parallel shift in the benchmark yield curve, assuming no change in the bond’s credit spread. For an option-free bond like Bond C, the effective duration decreases as interest rates rise. When interest rates increase, a call option moves out of the money, enhancing the value of the callable bond and extending its effective duration. Conversely, as interest rates climb, a put option moves into the money, which caps the price decline of the putable bond and reduces its effective duration. Therefore, the bond whose effective duration may lengthen with rising interest rates is the callable bond (Bond E). A is incorrect. Bond C is an option-free bond. According to the principles of effective duration, as interest rates rise, the effective duration of an option-free bond decreases. This means that Bond C will not experience an increase in effective duration with rising interest rates. C is incorrect. Bond D is a putable bond. When interest rates rise, the put option becomes more valuable (moves into the money), which limits the bond's price decline and shortens its effective duration. Therefore, Bond D will not experience an increase in effective duration as interest rates rise.", "explhtml": "<p>Effective duration measures a bond’s price sensitivity to a 100 bps parallel shift in the benchmark yield curve, assuming no change in the bond’s credit spread. For an option-free bond like Bond C, the effective duration decreases as interest rates rise. When interest rates increase, a call option moves out of the money, enhancing the value of the callable bond and extending its effective duration. Conversely, as interest rates climb, a put option moves into the money, which caps the price decline of the putable bond and reduces its effective duration. Therefore, the bond whose effective duration may lengthen with rising interest rates is the callable bond (Bond E).<\/p><p><b>A is incorrect.<\/b> Bond C is an option-free bond. According to the principles of effective duration, as interest rates rise, the effective duration of an option-free bond decreases. This means that Bond C will not experience an increase in effective duration with rising interest rates.<\/p><p><b>C is incorrect.<\/b> Bond D is a putable bond. When interest rates rise, the put option becomes more valuable (moves into the money), which limits the bond&#x27;s price decline and shortens its effective duration. Therefore, Bond D will not experience an increase in effective duration as interest rates rise.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(i): calculate and interpret the effective duration of a callable or putable bond.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · Mary May<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mary May owns May Investment Limited (MIL), which specializes in managing fixed-income<\/p><p>portfolios. She wants to add embedded option bonds to MIL’s bond portfolio. May requests that<\/p><p>Tai Lung, an analyst at the firm, help her choose and analyze bonds for the firm’s bond portfolio.<\/p><p>Lung begins by selecting two callable at-par corporate bonds with the same maturity, call dates,<\/p><p>and credit quality. Using an option-adjusted spread (OAS) approach and assuming a 12% interest<\/p><p>volatility rate, Lung analyzes the bonds and presents the result in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0136.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Results of Lung’s Analysis Using the OAS Approach Bond OAS (%) Bond A 0.355% Bond B 0.402%\"><p>Lung then selects four more bonds issued by Rowlings Ltd., which are presented in Exhibit 2. All<\/p><p>four bonds have the same credit rating and 5-year maturity. Bonds D and E have the same<\/p><p>characteristics as Bond C, which is option-free. Bonds D and E include an embedded option.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0137.webp\" style=\"max-width:min(100%,618px)\" alt=\"Exhibit 2: Bonds Issued by Rowlings Ltd  Bond Special Provision Coupon Bond C 5% annual Bond D Putable at par at the end of years 2 and 3 5% annual Bond E Callable at par at the end of years 2 and 3 5% annual Bond F One-year reference rate annually in arrears\"><p>The current price of Bond A is 100.69 (% of par). The price (% of par) when shifting the<\/p><p>benchmark yield curve down by 0.40 is 102.87, and the price (% of par) when shifting the<\/p><p>benchmark yield curve up by 0.40% is 99.78.<\/p><\/div><\/details><div class=\"qtext\"><p>In Exhibit 2, the bond that could experience an increase in effective duration if interest rates rise is:<\/p><\/div>", "subj": "fixed"}, {"n": 88, "q": "The effective duration for Bond A is closest to:", "opts": ["3.84", "0.35", "5.02"], "ans": "A", "expl": "The effective duration is calculated as follows: B is incorrect. It significantly underestimates the effective duration, which measures the sensitivity of a bond's price to changes in interest rates. Given the calculations, a value of 0.35 is too low to represent this sensitivity accurately. C is incorrect. It overestimates the effective duration, calculated based on changes in the bond's price relative to changes in yield. A value of 5.02 suggests a much higher sensitivity than indicated by the provided data and formula.", "explhtml": "<p>The effective duration is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0138.webp\" style=\"max-width:min(100%,342px)\" alt=\"102.87 −99.78 3.09 EffDur = = = 3.84 2 × 0.004 × 100.69 0.80552\"><p><b>B is incorrect.<\/b> It significantly underestimates the effective duration, which measures the sensitivity of a bond&#x27;s price to changes in interest rates. Given the calculations, a value of 0.35 is too low to represent this sensitivity accurately.<\/p><p><b>C is incorrect.<\/b> It overestimates the effective duration, calculated based on changes in the bond&#x27;s price relative to changes in yield. A value of 5.02 suggests a much higher sensitivity than indicated by the provided data and formula.<\/p><p class=\"los\">Fixed Income, Learning Module 3: Valuation and Analysis: Bonds with Embedded Options, LOS 3(i): calculate and interpret effective duration of a callable or putable bond.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · Mary May<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mary May owns May Investment Limited (MIL), which specializes in managing fixed-income<\/p><p>portfolios. She wants to add embedded option bonds to MIL’s bond portfolio. May requests that<\/p><p>Tai Lung, an analyst at the firm, help her choose and analyze bonds for the firm’s bond portfolio.<\/p><p>Lung begins by selecting two callable at-par corporate bonds with the same maturity, call dates,<\/p><p>and credit quality. Using an option-adjusted spread (OAS) approach and assuming a 12% interest<\/p><p>volatility rate, Lung analyzes the bonds and presents the result in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0136.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Results of Lung’s Analysis Using the OAS Approach Bond OAS (%) Bond A 0.355% Bond B 0.402%\"><p>Lung then selects four more bonds issued by Rowlings Ltd., which are presented in Exhibit 2. All<\/p><p>four bonds have the same credit rating and 5-year maturity. Bonds D and E have the same<\/p><p>characteristics as Bond C, which is option-free. Bonds D and E include an embedded option.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0137.webp\" style=\"max-width:min(100%,618px)\" alt=\"Exhibit 2: Bonds Issued by Rowlings Ltd  Bond Special Provision Coupon Bond C 5% annual Bond D Putable at par at the end of years 2 and 3 5% annual Bond E Callable at par at the end of years 2 and 3 5% annual Bond F One-year reference rate annually in arrears\"><p>The current price of Bond A is 100.69 (% of par). The price (% of par) when shifting the<\/p><p>benchmark yield curve down by 0.40 is 102.87, and the price (% of par) when shifting the<\/p><p>benchmark yield curve up by 0.40% is 99.78.<\/p><\/div><\/details><div class=\"qtext\"><p>The effective duration for Bond A is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 89, "q": "The expected exposure to default loss for Bond X is most likely:", "opts": ["More than Bond Y’s expected exposure.", "Less than Bond Y’s expected exposure.", "The same as Bond Y’s expected exposure."], "ans": "C", "expl": "The expected exposure represents an investor's estimated financial loss if a default event happens, not accounting for any potential recovery. The expected exposure for Bond X and Y amounts to 100 + 6.75 = 106.75. A and B are incorrect. Bonds X and Y have the same anticipated exposure amount of 106.75.", "explhtml": "<p>The expected exposure represents an investor&#x27;s estimated financial loss if a default event happens, not accounting for any potential recovery. The expected exposure for Bond X and Y amounts to 100 + 6.75 = 106.75.<\/p><p><b>A and B are incorrect<\/b>. Bonds X and Y have the same anticipated exposure amount of 106.75.<\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(e): Calculate the value of a bond and its credit spread, given assumptions about the credit risk parameters.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 89–92 · Mitchel Speck<\/summary><div class=\"vig-body\"><p>Mitchel Speck is a bond analyst at Sonne Investment Group. Masha Stratov, a junior analyst at<\/p><p>the firm, works under Speck&#x27;s supervision. Speck and Stratov meet to discuss several bonds held<\/p><p>by the firm. Bonds X and Y are of interest to Speck, which both have a one-year maturity and<\/p><p>currently trade at par. The two bonds have an annual coupon of 6.75%, and the current risk-free<\/p><p>rate is 4%. Comparable credit risk information of bonds with similar characteristics as bonds X<\/p><p>and Y are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0139.webp\" style=\"max-width:min(100%,446px)\" alt=\"Exhibit 1: Comparable Bonds Credit Risk Information Bond Percentage of Bonds that Make Recovery Rate Full Payment and Survive X 97% 35% Y 98% 42%\"><p>Bond Z is a two-year zero-coupon bond. Speck&#x27;s research on similar bonds estimates a 3% risk-<\/p><p>neutral default probability and a 35% recovery rate, assuming conditional probabilities of<\/p><p>default. Stratov presents a detailed analysis of bond Z, which she presents in Exhibit 2. Stratov<\/p><p>assumes a flat 4% yield curve with loss given default, recovery and exposure values expressed<\/p><p>per 100 of par value.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0140.webp\" style=\"max-width:min(100%,682px)\" alt=\"Exhibit 2: Bond Z’s Analysis Date Loss Recovery Exposure Probability Probability Expected PV* of Given of Survival of Default Loss Expected Default Loss\"><p>0<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0141.webp\" style=\"max-width:min(100%,682px)\" alt=\"1 62.98 34.89 97.87 97.00% 3.00% 1.2596 1.2111 2 65.00 35.00 100 95.05% 1.95% 1.2675 1.1719\"><p>PV*-Present value<\/p><\/div><\/details><div class=\"qtext\"><p>The expected exposure to default loss for Bond X is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 90, "q": "Using Exhibit 1, the loss given default for Bond Y is most likely:", "opts": ["More than Bond X’s expected exposure.", "Less than Bond X’s expected exposure.", "The same as Bond X’s expected exposure."], "ans": "B", "expl": "The loss given default is directly related to the expected exposure to default loss and inversely related to the recovery rate. Since Bond Y has a lower recovery rate compared to Bond X and the same expected exposure to default loss (100 + 6.75 = 106.75), it will experience a lower loss given default than Bond X. For Bond X, the loss given default is calculated as  106.75 × (1 − 0.35) = 69.39. Bond Y is calculated as 106.75 × (1 − 0.42) = 61.92. A and C are incorrect. The loss given default is lower for Bond Y (61.92) than Bond X (69.39).", "explhtml": "<p>The loss given default is directly related to the expected exposure to default loss and inversely related to the recovery rate. Since Bond Y has a lower recovery rate compared to Bond X and the same expected exposure to default loss (100 + 6.75 = 106.75), it will experience a lower loss given default than Bond X. For Bond X, the loss given default is calculated as  106.75 × (1 − 0.35) = 69.39. Bond Y is calculated as 106.75 × (1 − 0.42) = 61.92.<\/p><p><b>A and C are incorrect.<\/b> The loss given default is lower for Bond Y (61.92) than Bond X (69.39).<\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(e): calculate the value of a bond and its credit spread, given assumptions about the credit risk parameters.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 89–92 · Mitchel Speck<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mitchel Speck is a bond analyst at Sonne Investment Group. Masha Stratov, a junior analyst at<\/p><p>the firm, works under Speck&#x27;s supervision. Speck and Stratov meet to discuss several bonds held<\/p><p>by the firm. Bonds X and Y are of interest to Speck, which both have a one-year maturity and<\/p><p>currently trade at par. The two bonds have an annual coupon of 6.75%, and the current risk-free<\/p><p>rate is 4%. Comparable credit risk information of bonds with similar characteristics as bonds X<\/p><p>and Y are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0139.webp\" style=\"max-width:min(100%,446px)\" alt=\"Exhibit 1: Comparable Bonds Credit Risk Information Bond Percentage of Bonds that Make Recovery Rate Full Payment and Survive X 97 const CFG = {"title": "AnalystPrep — Fixed Income", "subtitle": "CFA Level II · 92 câu · 23 item sets · AnalystPrep 2026", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0

const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,

  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,

};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->

<style id="qnav-note-css">

</style>
<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}

    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));

    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
