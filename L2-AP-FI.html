<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalystPrep — Fixed Income</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">

</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}

  .vig[open]>summary::before{transform:rotate(90deg)}

  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}

  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
  .expl-html .los{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:12px}
  .expl-html b{color:var(--txt)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);

const DATA = [{"n": 1, "q": "The most appropriate response to Question 1 is that for fixed income the buyer is long while for CDS the buyer of credit protection is:", "opts": ["Long credit exposure.", "Short credit exposure.", "Short call options."], "ans": "B", "expl": "A buyer of credit protection in a single-name Credit Default Swap (CDS) effectively holds a position that is analogous to being short on the credit exposure of the reference entity. This is because the buyer of the CDS pays a periodic premium to the seller and, in return, receives a payoff if the reference entity defaults. The payoff generally compensates for the loss incurred due to the default, minus the recovery rate. Therefore, the buyer of the CDS benefits if the credit quality of the reference entity deteriorates, leading to default or a credit event that triggers the CDS. This is similar to holding a short position because the buyer stands to gain from the worsening of the reference entity's creditworthiness. A is incorrect. Holding a long credit exposure implies that the investor benefits from the improvement in the credit quality of the reference entity, which is the opposite of what happens in a CDS contract for the buyer. In a typical bond investment, an investor holding a long position gains from coupon payments and the eventual return of principal, both of which are contingent on the issuer not defaulting. Thus, a long position in credit exposure would not benefit from the issuer's default, which is a key distinction from the buyer's position in a CDS. C is incorrect. Describing the buyer of credit protection as being short on call options is inaccurate. In option terms, being short on a call option would imply that the holder has an obligation to sell the underlying asset at the strike price if the option is exercised by the buyer. This analogy does not apply to CDS contracts, where the buyer does not have an obligation to purchase the underlying asset but instead receives a payment if a credit event occurs. The correct financial instrument analogy for a CDS buyer is more akin to holding a put option, where the buyer benefits from the decline in the value of the underlying asset. ", "explhtml": "<p>A buyer of credit protection in a single-name Credit Default Swap (CDS) effectively holds a position that is analogous to being short on the credit exposure of the reference entity. This is because the buyer of the CDS pays a periodic premium to the seller and, in return, receives a payoff if the reference entity defaults. The payoff generally compensates for the loss incurred due to the default, minus the recovery rate. Therefore, the buyer of the CDS benefits if the credit quality of the reference entity deteriorates, leading to default or a credit event that triggers the CDS. This is similar to holding a short position because the buyer stands to gain from the worsening of the reference entity&#x27;s creditworthiness.<\/p><p><b>A is incorrect<\/b>. Holding a long credit exposure implies that the investor benefits from the improvement in the credit quality of the reference entity, which is the opposite of what happens in a CDS contract for the buyer. In a typical bond investment, an investor holding a long position gains from coupon payments and the eventual return of principal, both of which are contingent on the issuer not defaulting. Thus, a long position in credit exposure would not benefit from the issuer&#x27;s default, which is a key distinction from the buyer&#x27;s position in a CDS.<\/p><p><b>C is incorrect<\/b>. Describing the buyer of credit protection as being short on call options is inaccurate. In option terms, being short on a call option would imply that the holder has an obligation to sell the underlying asset at the strike price if the option is exercised by the buyer. This analogy does not apply to CDS contracts, where the buyer does not have an obligation to purchase the underlying asset but instead receives a payment if a credit event occurs. The correct financial instrument analogy for a CDS buyer is more akin to holding a put option, where the buyer benefits from the decline in the value of the underlying asset. <\/p><p class=\"los\">Fixed Income, Learning Module 5: Credit Default Swaps, LOS 5(a): Describe credit events and settlement protocols with respect to CDS;<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Carl Mathews<\/summary><div class=\"vig-body\"><p>Carl Mathews is a credit analyst at Sigma Corp. Mathews has been asked to evaluate a credit default swap (CDS) contract entered into by the company with a notional principal of $30 million. The underlying reference obligation is a $30 million, 10% semi-annual coupon-paying subordinated secured bond issued by Lambda Inc. Each bond in the issue is trading at 35% of its par value, with each bond having a par value of $100. In addition to the underlying reference obligation, Lambda Inc. has the following bond issues outstanding:<\/p><p>10% semi-annual coupon-paying senior unsecured bond trading at 40% of par.<\/p><p>10% semi-annual coupon-paying subordinated unsecured bond trading at 20% of par.<\/p><p>The CDS and issue’s credit spread is 5% and 7% respectively.<\/p><p>Mathews holds a meeting with the company’s chief executive officer (CEO) in which he intends to address the following:<\/p><p>Point 1: The pricing and valuation of the CDS covering the Lambda Inc issue.<\/p><p>Point 2: The settlement process of the CDS.<\/p><p>Before responding to the two issues, the CEO poses the following questions to Mathews:<\/p><p>Question 1: “How is a long position in a single-name CDS comparable to a long position on a fixed-income instrument?”<\/p><p>Question 2: “Can the CDS eliminate Sigma Corp’s total exposure to credit risk?”<\/p><p>To address Point 1, Mathews attempts to price the CDS using the data collected in the exhibit below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0007.webp\" style=\"max-width:min(100%,471px)\" alt=\"Exhibit: CDS Pricing Data CDS term to maturity 1 year CDS premium payment frequency Semi-annual\"><p>Conditional default probability (semi-annual) Constant at 4%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0008.webp\" style=\"max-width:min(100%,440px)\" alt=\"Recovery rate 30%\"><p>Mathews concludes the meeting by exploring the company’s settlement preference on the CDS. He shares with the CEO the two settlement methods – physical and cash – and the fact that the company will be inclined towards the method generating the highest payoff.<\/p><\/div><\/details><div class=\"qtext\"><p>The most appropriate response to Question 1 is that for fixed income the buyer is long while for CDS the buyer of credit protection is:<\/p><\/div>", "subj": "fixed"}, {"n": 2, "q": "The most appropriate response to Question 2 is:", "opts": ["Yes.", "No, Sigma Corp will be exposed to the credit risk of the CDS seller.", "No, credit risk exposure to the underlying reference obligation is significantly reduced."], "ans": "B", "expl": "A credit default swap (CDS) is a financial derivative that allows an investor to swap or offset their credit risk with that of another investor. When Sigma Corp enters into a CDS, they are essentially buying protection against the default of Lambda Inc. However, this does not completely eliminate Sigma Corp's credit risk exposure. Instead, it transfers the credit risk from Lambda Inc to the seller of the CDS. If Lambda Inc defaults on its obligations, the seller of the CDS is supposed to compensate Sigma Corp. However, this compensation is only as reliable as the financial stability of the CDS seller. If the CDS seller also faces financial difficulties or defaults, Sigma Corp may not receive the expected compensation and thus remains exposed to credit risk. This exposure to the credit risk of the CDS seller is critical and must be considered when evaluating the effectiveness of a CDS in mitigating credit risk. A is incorrect. The option suggesting that a CDS can eliminate Sigma Corp’s total exposure to credit risk is incorrect because it overlooks the risk associated with the counterparty of the CDS. While the CDS does provide a mechanism to hedge against the credit risk of the reference entity (Lambda Inc), it introduces a new form of risk, which is the creditworthiness of the CDS seller. If the CDS seller defaults, Sigma Corp could still face significant losses. Therefore, the risk is not eliminated but transformed into counterparty risk. C is incorrect. This option understates the residual risk involved in a CDS transaction. While it is true that a CDS can significantly reduce the credit risk exposure to the underlying reference obligation (Lambda Inc), it does not account for the full spectrum of risks involved. The statement fails to address the risk of default by the CDS seller, which could still result in a substantial financial loss for Sigma Corp. The risk is not merely reduced; it is shifted to another party whose financial stability becomes crucial to the effectiveness of the CDS as a risk management tool. ", "explhtml": "<p>A credit default swap (CDS) is a financial derivative that allows an investor to swap or offset their credit risk with that of another investor. When Sigma Corp enters into a CDS, they are essentially buying protection against the default of Lambda Inc. However, this does not completely eliminate Sigma Corp&#x27;s credit risk exposure. Instead, it transfers the credit risk from Lambda Inc to the seller of the CDS. If Lambda Inc defaults on its obligations, the seller of the CDS is supposed to compensate Sigma Corp. However, this compensation is only as reliable as the financial stability of the CDS seller. If the CDS seller also faces financial difficulties or defaults, Sigma Corp may not receive the expected compensation and thus remains exposed to credit risk. This exposure to the credit risk of the CDS seller is critical and must be considered when evaluating the effectiveness of a CDS in mitigating credit risk.<\/p><p><b>A is incorrect<\/b>. The option suggesting that a CDS can eliminate Sigma Corp’s total exposure to credit risk is incorrect because it overlooks the risk associated with the counterparty of the CDS. While the CDS does provide a mechanism to hedge against the credit risk of the reference entity (Lambda Inc), it introduces a new form of risk, which is the creditworthiness of the CDS seller. If the CDS seller defaults, Sigma Corp could still face significant losses. Therefore, the risk is not eliminated but transformed into counterparty risk.<\/p><p><b>C is incorrect<\/b>. This option understates the residual risk involved in a CDS transaction. While it is true that a CDS can significantly reduce the credit risk exposure to the underlying reference obligation (Lambda Inc), it does not account for the full spectrum of risks involved. The statement fails to address the risk of default by the CDS seller, which could still result in a substantial financial loss for Sigma Corp. The risk is not merely reduced; it is shifted to another party whose financial stability becomes crucial to the effectiveness of the CDS as a risk management tool. <\/p><p class=\"los\">Fixed Income, Learning Module 5: Credit Default Swaps, LOS 5(a): Describe credit default swaps (CDS), single-name and index CDS, and the parameters that define a given CDS product;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Carl Mathews<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carl Mathews is a credit analyst at Sigma Corp. Mathews has been asked to evaluate a credit default swap (CDS) contract entered into by the company with a notional principal of $30 million. The underlying reference obligation is a $30 million, 10% semi-annual coupon-paying subordinated secured bond issued by Lambda Inc. Ea vered by the CDS contract is equal to:", "opts": ["$3.08.", "$3.20.", "$5.90."], "ans": "C", "expl": "The expected loss on a single bond covered by the CDS contract can be calculated using the formula for expected loss, which is the product of the loss given default (LGD) and the probability of default. The LGD is calculated by considering the amount that would be lost if the borrower defaults, adjusted by the recovery rate. In this scenario, the recovery rate is 30%, which implies a loss given default of 70% (100% - 30%). For the first semi-annual period, if the borrower defaults, the loss would be on the interest payment of $5 (10% of $100 par value, paid semi-annually), calculated as $5 × 70%= $3.50. For the second semi-annual period, the loss would include both the final interest payment and the principal amount, totaling $105, calculated as $105 × 70%= $73.50. The probability of default in each semi-annual period is given as 4%. However, for the second period, the probability of default is conditional on not defaulting in the first period. Thus, it is calculated as 96% (100% - 4%) times 4%, which equals 3.84%. For the first semi-annual period, if default occurs, the bondholder loses all remaining cash flows —the second coupon of $5 and the principal of $100—plus the first coupon if it is not paid. The total promised cash flows are $110, so the loss given default is $110 × 70% = $77.00. Therefore, the expected loss is calculated as follows: Expected loss = ($77.00 × 4%) + ($73.50 × 3.84%) = $3.08 + $2.82 = $5.90 A is incorrect. It suggests an expected loss of $3.08, which significantly underestimates the total potential loss. This calculation might only consider the loss from one of the periods or miscalculate the probabilities or loss given default. A detailed review of the calculations as outlined shows that the expected loss, when considering both periods and the correct application of probabilities and loss given default, exceeds $3.08, specifically amountin In evaluating the two settlement methods for the credit default swap (CDS) involving Sigma Corp and Lambda Inc, it is crucial to understand the financial implications of each option. When considering cash settlement, Sigma Corp would receive a payment calculated based on the difference between the notional value of the bonds and the recovery rate applied to this value. The recovery rate is 30%, so the cash settlement amount would be calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0009.webp\" style=\"max-width:min(100%,448px)\" alt=\"Cash Settlement = (1 −0.30) × $30 million = $21 million.\"><p>Additionally, Sigma Corp can sell the underlying bonds in the market where they are currently trading at 30% of par. The proceeds from this sale would be:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0010.webp\" style=\"max-width:min(100%,466px)\" alt=\"Proceeds from Bond Sale = 0.30 × $30 million = $9 million.\"><p>Therefore, the total financial benefit from choosing cash settlement would be the sum of the cash settlement and the proceeds from the bond sale, amounting to:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0011.webp\" style=\"max-width:min(100%,437px)\" alt=\"Total Proceeds = $21 million + $9 million = $30 million.\"><p><b>A is incorrect.<\/b> It incorrectly uses 35% of par instead of 30% as indicated in the question. The recovery rate is 30%, so the cash settlement amount would be calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0012.webp\" style=\"max-width:min(100%,448px)\" alt=\"Cash Settlement = (1 −0.30) × $30 million = $21 million.\"><p>Additionally, Sigma Corp can sell the underlying bonds in the market where they are currently trading at 35% of par. The proceeds from this sale would be:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0013.webp\" style=\"max-width:min(100%,489px)\" alt=\"Proceeds from Bond Sale = 0.35 × $30 million = $10.5 million.\"><p>Therefore, the total financial benefit from choosing cash settlement would be the sum of the cash settlement and the proceeds from the bond sale, amounting to:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0014.webp\" style=\"max-width:min(100%,476px)\" alt=\"Total Proceeds = $21 million + $10.5 million = $31.5 million.\"><p><b>B is incorrect<\/b>. Preferring physical delivery in this scenario would involve Sigma Corp delivering the actual bonds to the counterparty and receiving the face value of the bonds, which is \\$30 million. This option does not take advantage of the current market price of the bonds, which is only 30% of the par value. By choosing physical delivery, Sigma Corp would miss out on the additional financial benefit of selling the bonds at market price and receiving the cash settlement calculated based on the recovery rate. Thus, the total financial benefit from physical delivery would be limited to the face value of the bonds, which is less than the total proceeds that can be achieved through cash settlement. <\/p><p class=\"los\">Fixed Income, Learning Module 5: Credit Default Swaps, LOS 5(b): Describe credit events and settlement protocols with respect to CDS;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Carl Mathews<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carl Mathews is a credit analyst at Sigma Corp. Mathews has been asked to evaluate a credit default swap (CDS) contract entered into by the company with a notional principal of $30 million. The underlying reference obligation is a $30 million, 10% semi-annual coupon-paying subordinated secured bond issued by Lambda Inc. Each bond in the issue is trading at 35% of its par value, with each bond having a par value of $100. In addition to the underlying reference obligation, Lambda Inc. has the following bond issues outstanding:<\/p><p>10% semi-annual coupon-paying senior unsecured bond trading at 40% of par.<\/p><p>10% semi-annual coupon-paying subordinated unsecured bond trading at 20% of par.<\/p><p>The CDS and issue’s credit spread is 5% and 7% respectively.<\/p><p>Mathews holds a meeting with the company’s chief executive officer (CEO) in which he intends to address the following:<\/p><p>Point 1: The pricing and valuation of the CDS covering the Lambda Inc issue.<\/p><p>Point 2: The settlement process of the CDS.<\/p><p>Before responding to the two issues, the CEO poses the following questions to Mathews:<\/p><p>Question 1: “How is a long position in a single-name CDS comparable to a long position on a fixed-income instrument?”<\/p><p>Question 2: “Can the CDS eliminate Sigma Corp’s total exposure to credit risk?”<\/p><p>To address Point 1, Mathews attempts to price the CDS using the data collected in the exhibit below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0007.webp\" style=\"max-width:min(100%,471px)\" alt=\"Exhibit: CDS Pricing Data CDS term to maturity 1 year CDS premium payment frequency Semi-annual\"><p>Conditional default probability (semi-annual) Constant at 4%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0008.webp\" style=\"max-width:min(100%,440px)\" alt=\"Recovery rate 30%\"><p>Mathews concludes the meeting by exploring the company’s settlement preference on the CDS. He shares with the CEO the two settlement methods – physical and cash – and the fact that the company will be inclined towards the method generating the highest payoff.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to the two settlement methods and assuming that the cheapest-to-deliver bond is instead selling for 30% of par, Sigma Corp will most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 5, "q": "In the context of the observations listed by Whatmore, which of the following most likely qualifies as a potential credit event?", "opts": ["Observation 1: Yes; Observation 2: No; Observation 3: No", "Observation 1: Yes; Observation 2: No; Observation 3: Yes", "Observation 1: No; Observation 2: Yes; Observation 3: No"], "ans": "C", "expl": "Option C identifies Observation 2 as a potential credit event. In the context of credit default swaps (CDS), a credit event is a specific circumstance that might trigger the protection seller to make a payment to the protection buyer. Observation 2 describes a situation in which ARS Manufacturing may experience significant delays in scheduled interest payments, particularly since the permitted grace period has expired. This delay in payment is a critical indicator of financial distress and is typically recognized as a default event under CDS contracts. Such events are crucial because they directly impact the likelihood of the reference entity (ARS Manufacturing) meeting its debt obligations, thereby increasing the risk to creditors and triggering the CDS. A is incorrect. It incorrectly identifies Observation 1 as a potential credit event. Observation 1 involves the strategic decision to spin off a large division of the company, which is more related to corporate restructuring or succession rather than a direct financial default or inability to meet debt obligations. While significant corporate restructuring can impact a company's financial stability and operational focus, it does not necessarily constitute a credit event in the context of CDS contracts unless it directly leads to financial impairment that prevents debt servicing. In this scenario, there is no indication that the spin-off itself has led to financial distress or inability to meet payment obligations. B is incorrect. It mistakenly identifies both Observations 1 and 3 as potential credit events. As explained, Observation 1 does not directly relate to the financial inability to meet debt obligations. Observation 3, which involves a request by ARS Manufacturing for creditors to reduce the amount of scheduled interest payments, suggests a desire for renegotiation of debt terms, which could be viewed as proactive management of financial obligations rather than an involuntary credit event. In CDS terms, voluntary restructuring or renegotiation efforts, where the company initiates changes to ease its financial burden without being under immediate threat of default, do not typically qualify as credit events. Credit events are generally characterized by involuntary breaches of contract terms, such as missed payments that occur without the consent of the creditor. ", "explhtml": "<p>Option C identifies Observation 2 as a potential credit event. In the context of credit default swaps (CDS), a credit event is a specific circumstance that might trigger the protection seller to make a payment to the protection buyer. Observation 2 describes a situation in which ARS Manufacturing may experience significant delays in scheduled interest payments, particularly since the permitted grace period has expired. This delay in payment is a critical indicator of financial distress and is typically recognized as a default event under CDS contracts. Such events are crucial because they directly impact the likelihood of the reference entity (ARS Manufacturing) meeting its debt obligations, thereby increasing the risk to creditors and triggering the CDS.<\/p><p><b>A is incorrect.<\/b> It incorrectly identifies Observation 1 as a potential credit event. Observation 1 involves the strategic decision to spin off a large division of the company, which is more related to corporate restructuring or succession rather than a direct financial default or inability to meet debt obligations. While significant corporate restructuring can impact a company&#x27;s financial stability and operational focus, it does not necessarily constitute a credit event in the context of CDS contracts unless it directly leads to financial impairment that prevents debt servicing. In this scenario, there is no indication that the spin-off itself has led to financial distress or inability to meet payment obligations.<\/p><p><b>B is incorrect.<\/b> It mistakenly identifies both Observations 1 and 3 as potential credit events. As explained, Observation 1 does not directly relate to the financial inability to meet debt obligations. Observation 3, which involves a request by ARS Manufacturing for creditors to reduce the amount of scheduled interest payments, suggests a desire for renegotiation of debt terms, which could be viewed as proactive management of financial obligations rather than an involuntary credit event. In CDS terms, voluntary restructuring or renegotiation efforts, where the company initiates changes to ease its financial burden without being under immediate threat of default, do not typically qualify as credit events. Credit events are generally characterized by involuntary breaches of contract terms, such as missed payments that occur without the consent of the creditor. <\/p><p class=\"los\">Fixed Income, Learning Module 5: Credit Default Swaps, LOS 5(b): Describe credit events and settlement protocols with respect to CDS;<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Dave Whatmore<\/summary><div class=\"vig-body\"><p>Dave Whatmore is a credit analyst at Supreme Associates. Whatmore is evaluating two credit default swap (CDS) contracts entered into by two of Supreme’s clients - Sky Ltd and Idago Corp. Both clients are lenders of credit.<\/p><p><b>Sky Ltd CDS<\/b> ARS Manufacturing is the reference entity underlying the CDS. The manufacturing concern is Sky Ltd’s sister company and has received corporate financing to execute a product diversification strategy. Serena Taylor is Sky Ltd’s chief investment officer. Taylor has arranged a meeting with Whatmore to determine if a credit event has occurred based on the following observations concerning ARS Manufacturing:<\/p><p>Observation 1: A formal plan has been established to spin off a notably large company division.<\/p><p>Observation 2: Financial difficulties may mean a high delay in scheduled interest payments, especially given that the permitted grace period has elapsed.<\/p><p>Observation 3: ARS has requested its creditors to reduce the amount of scheduled interest payments.<\/p><p>After the conclusion of the meeting, Whatmore collects details on the Sky Ltd CDS contract to price the swap (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0015.webp\" style=\"max-width:min(100%,411px)\" alt=\"Exhibit 1 Present value (PV) of protection leg $150 PV of premium leg $146 Year 1: 2% Year 2: 3% Projected hazard rates Year 3: 4% Year 4: 5% Duration of CDS 6 years Term of loan 7 year Fixed coupon 98 points basis Coupon payment frequency Annual Percentage upfront premium +5% CDS notional principal\"><p>One year after entering into the swap, the credit quality of ARS Manufacturing improved as indicated by an upgrade in ratings. The exhibit below provides revised details concerning the contract (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0016.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><p>Change in spread(bps) -25<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0017.webp\" style=\"max-width:min(100%,212px)\" alt=\"Duration 5\"><p><b>Idago Corp CDS<\/b> The Idago Corp CDS covers a $3.5 million bond issue sold by WestGate which is yields 7%. The CDS contract has a credit spread of 7% while the current LIBOR is 2.5%. Whatmore strongly believes that a basis trade, involving the bond issue and CDS, can capture potential arbitrage profits.<\/p><\/div><\/details><div class=\"qtext\"><p>In the context of the observations listed by Whatmore, which of the following most likely qualifies as a potential credit event?<\/p><\/div>", "subj": "fixed"}, {"n": 6, "q": "Using the data in Exhibit 1, the difference between the two present values most likely implies that:", "opts": ["The credit curve will flatten.", "An upfront payment will be made by the protection seller.", "An upfront payment will be made by the protection buyer."], "ans": "C", "expl": "In a credit default swap (CDS), the present value (PV) of the protection leg represents the expected cost to the protection seller if a credit event occurs, while the PV of the premium leg represents the expected income from the protection buyer over the life of the CDS. According to Exhibit 1, the PV of the protection leg is $150, and the PV of the premium leg is $146. The difference between these values ($150 - $146 = $4) indicates that the protection buyer owes the protection seller an upfront payment to balance the initial value of the contract. This upfront payment compensates the protection seller for taking on the higher expected liability. The calculation of the upfront payment is straightforward: it is the difference between the PV of the protection leg and the PV of the premium leg, which in this case is $4. A is incorrect. The credit curve represents the relationship between credit spreads and the maturity of debt for a given issuer. The difference between the PV of the protection leg and the PV of the premium leg does not directly indicate changes in the shape of the credit curve. Instead, it reflects the immediate financial exchange required to equilibrate the expected values of the obligations and entitlements under the CDS at inception. Therefore, the information given about the present values does not provide any direct insight into the future shape of the credit curve or its flattening. B is incorrect. In the context of CDS contracts, the protection seller receives payments (premiums) from the protection buyer in exchange for agreeing to compensate the buyer in the event of a credit default. When the PV of the protection leg exceeds the PV of the premium leg, it is the protection buyer who must compensate the protection seller for the additional risk assumed, not the other way around. The calculation of the upfront payment being positive ($150 - $146 = $4) clearly indicates that the protection buyer, not the seller, is the one making the upfront payment. ", "explhtml": "<p>In a credit default swap (CDS), the present value (PV) of the protection leg represents the expected cost to the protection seller if a credit event occurs, while the PV of the premium leg represents the expected income from the protection buyer over the life of the CDS. According to Exhibit 1, the PV of the protection leg is $150, and the PV of the premium leg is $146. The difference between these values ($150 - $146 = $4) indicates that the protection buyer owes the protection seller an upfront payment to balance the initial value of the contract. This upfront payment compensates the protection seller for taking on the higher expected liability. The calculation of the upfront payment is straightforward: it is the difference between the PV of the protection leg and the PV of the premium leg, which in this case is $4.<\/p><p><b>A is incorrect<\/b>. The credit curve represents the relationship between credit spreads and the maturity of debt for a given issuer. The difference between the PV of the protection leg and the PV of the premium leg does not directly indicate changes in the shape of the credit curve. Instead, it reflects the immediate financial exchange required to equilibrate the expected values of the obligations and entitlements under the CDS at inception. Therefore, the information given about the present values does not provide any direct insight into the future shape of the credit curve or its flattening.<\/p><p><b>B is incorrect<\/b>. In the context of CDS contracts, the protection seller receives payments (premiums) from the protection buyer in exchange for agreeing to compensate the buyer in the event of a credit default. When the PV of the protection leg exceeds the PV of the premium leg, it is the protection buyer who must compensate the protection seller for the additional risk assumed, not the other way around. The calculation of the upfront payment being positive ($150 - $146 = $4) clearly indicates that the protection buyer, not the seller, is the one making the upfront payment. <\/p><p class=\"los\">Fixed Income, Learning Module 5: Credit Default Swaps, LOS 5(b): Describe credit events and settlement protocols with respect to CDS;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Dave Whatmore<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dave Whatmore is a credit analyst at Supreme Associates. Whatmore is evaluating two credit default swap (CDS) contracts entered into by two of Supreme’s clients - Sky Ltd and Idago Corp. Both clients are lenders of credit.<\/p><p><b>Sky Ltd CDS<\/b> ARS Manufacturing is the reference entity underlying the CDS. The manufacturing concern is Sky Ltd’s sister company and has received corporate financing to execute a product diversification strategy. Serena Taylor is Sky Ltd’s chief investment officer. Taylor has arranged a meeting with Whatmore to determine if a credit event has occurred based on the following observations concerning ARS Manufacturing:<\/p><p>Observation 1: A formal plan has been established to spin off a notably large company division.<\/p><p>Observation 2: Financial difficulties may mean a high delay in scheduled interest payments, especially given that the permitted grace period has elapsed.<\/p><p>Observation 3: ARS has requested its creditors to reduce the amount of scheduled interest payments.<\/p><p>After the conclusion of the meeting, Whatmore collects details on the Sky Ltd CDS contract to price the swap (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0015.webp\" style=\"max-width:min(100%,411px)\" alt=\"Exhibit 1 Present value (PV) of protection leg $150 PV of premium leg $146 Year 1: 2% Year 2: 3% Projected hazard rates Year 3: 4% Year 4: 5% Duration of CDS 6 years Term of loan 7 year Fixed coupon 98 points basis Coupon payment frequency Annual Percentage upfront premium +5% CDS notional principal\"><p>One year after entering into the swap, the credit quality of ARS Manufacturing improved as indicated by an upgrade in ratings. The exhibit below provides revised details concerning the contract (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0016.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><p>Change in spread(bps) -25<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0017.webp\" style=\"max-width:min(100%,212px)\" alt=\"Duration 5\"><p><b>Idago Corp CDS<\/b> The Idago Corp CDS covers a $3.5 million bond issue sold by WestGate which is yields 7%. The CDS contract has a credit spread of 7% while the current LIBOR is 2.5%. Whatmore strongly believes that a basis trade, involving the bond issue and CDS, can capture potential arbitrage profits.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data in Exhibit 1, the difference between the two present values most likely implies that:<\/p><\/div>", "subj": "fixed"}, {"n": 7, "q": "Based on the hazard rates estimated in Exhibit 1, Whatmore expects the credit curve to:", "opts": ["Invert.", "Flatten.", "Slope upwards."], "ans": "C", "expl": "The credit curve is expected to slope upwards. This expectation is based on the projected hazard rates provided in Exhibit 1, which show an increasing trend over the years: Year 1 at 2%, Year 2 at 3%, Year 3 at 4%, and Year 4 at 5%. Hazard rates are used to estimate the probability of default, and an increasing hazard rate indicates a higher probability of default as time progresses. This pattern typically results in an upward-sloping credit curve because the risk of default is perceived to be higher in the later years compared to the earlier years. An upward-sloping credit curve reflects increasing credit spreads or yields over time, which compensates for the increasing risk of default. A is incorrect. It suggests that the credit curve will invert. An inverted credit curve implies that short-term hazard rates are higher than long-term rates, suggesting a higher probability of default in the near term compared to the future. This scenario is contrary to the data provided in Exhibit 1, where the hazard rates increase each year, indicating a lower probability of default in the near term and a higher probability in the later years. Therefore, an inverted curve does not align with the given hazard rate projections. B is incorrect. It suggests that the credit curve will flatten. A flat credit curve implies constant hazard rates over time, indicating equal default probabilities across time periods. However, Exhibit 1 clearly shows that the hazard rates are not constant but increase each year. This trend contradicts the notion of a flat credit curve, in which risk perceptions and credit spreads remain unchanged over time. ", "explhtml": "<p>The credit curve is expected to slope upwards. This expectation is based on the projected hazard rates provided in Exhibit 1, which show an increasing trend over the years: Year 1 at 2%, Year 2 at 3%, Year 3 at 4%, and Year 4 at 5%. Hazard rates are used to estimate the probability of default, and an increasing hazard rate indicates a higher probability of default as time progresses. This pattern typically results in an upward-sloping credit curve because the risk of default is perceived to be higher in the later years compared to the earlier years. An upward-sloping credit curve reflects increasing credit spreads or yields over time, which compensates for the increasing risk of default.<\/p><p><b>A is incorrect<\/b>. It suggests that the credit curve will invert. An inverted credit curve implies that short-term hazard rates are higher than long-term rates, suggesting a higher probability of default in the near term compared to the future. This scenario is contrary to the data provided in Exhibit 1, where the hazard rates increase each year, indicating a lower probability of default in the near term and a higher probability in the later years. Therefore, an inverted curve does not align with the given hazard rate projections.<\/p><p><b>B is incorrect<\/b>. It suggests that the credit curve will flatten. A flat credit curve implies constant hazard rates over time, indicating equal default probabilities across time periods. However, Exhibit 1 clearly shows that the hazard rates are not constant but increase each year. This trend contradicts the notion of a flat credit curve, in which risk perceptions and credit spreads remain unchanged over time. <\/p><p class=\"los\">Fixed Income, Learning Module 5: Credit Default Swaps, LOS 5(d): Describe the use of CDS to manage credit exposures and to express views regarding changes in shape and/or level of the credit curve;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Dave Whatmore<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dave Whatmore is a credit analyst at Supreme Associates. Whatmore is evaluating two credit default swap (CDS) contracts entered into by two of Supreme’s clients - Sky Ltd and Idago Corp. Both clients are lenders of credit.<\/p><p><b>Sky Ltd CDS<\/b> ARS Manufacturing is the reference entity underlying the CDS. The manufacturing concern is Sky Ltd’s sister company and has received corporate financing to execute a product diversification strategy. Serena Taylor is Sky Ltd’s chief investment officer. Taylor has arranged a meeting with Whatmore to determine if a credit event has occurred based on the following observations concerning ARS Manufacturing:<\/p><p>Observation 1: A formal plan has been established to spin off a notably large company division.<\/p><p>Observation 2: Financial difficulties may mean a high delay in scheduled interest payments, especially given that the permitted grace period has elapsed.<\/p><p>Observation 3: ARS has requested its creditors to reduce the amount of scheduled interest payments.<\/p><p>After the conclusion of the meeting, Whatmore collects details on the Sky Ltd CDS contract to price the swap (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0015.webp\" style=\"max-width:min(100%,411px)\" alt=\"Exhibit 1 Present value (PV) of protection leg $150 PV of premium leg $146 Year 1: 2% Year 2: 3% Projected hazard rates Year 3: 4% Year 4: 5% Duration of CDS 6 years Term of loan 7 year Fixed coupon 98 points basis Coupon payment frequency Annual Percentage upfront premium +5% CDS notional principal\"><p>One year after entering into the swap, the credit quality of ARS Manufacturing improved as indicated by an upgrade in ratings. The exhibit below provides revised details concerning the contract (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0016.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><p>Change in spread(bps) -25<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0017.webp\" style=\"max-width:min(100%,212px)\" alt=\"Duration 5\"><p><b>Idago Corp CDS<\/b> The Idago Corp CDS covers a $3.5 million bond issue sold by WestGate which is yields 7%. The CDS contract has a credit spread of 7% while the current LIBOR is 2.5%. Whatmore strongly believes that a basis trade, involving the bond issue and CDS, can capture potential arbitrage profits.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the hazard rates estimated in Exhibit 1, Whatmore expects the credit curve to:<\/p><\/div>", "subj": "fixed"}, {"n": 8, "q": "Using the data in Exhibit 1, the credit spread on the CDS, in basis points, is equal to:", "opts": ["83.33.", "169.43.", "181.33."], "ans": "C", "expl": "To determine the credit spread, we use the formula: From Exhibit 1, the upfront premium is +5% and the duration of the CDS is 6 years. The fixed coupon is given as 98 basis points. First, we convert the upfront premium into an annualized basis point value: Adding this value to the fixed coupon gives: This calculation shows that the total credit spread, considering both the annualized value of the upfront premium and the fixed coupon rate, amounts to 181.33 basis points, confirming that option C is correct. A is incorrect. It suggests that the credit spread is 83.33 basis points. This calculation appears to consider only the annualized value of the upfront premium (83.3333 basis points) and completely disregards the fixed coupon rate of 98 basis points. The credit spread in a CDS contract is the sum of the annualized upfront premium and the fixed coupon rate. Therefore, omitting the fixed coupon rate results in an incorrect and significantly lower credit spread calculation. B is incorrect. It calculates the credit spread as 169.43 basis points. This value is incorrect and does not align with any straightforward calculation from the given data. It seems to be a miscalculation or a typo, as it neither matches the sum of the annualized upfront premium and the fixed coupon (which correctly totals 181.33 basis points) nor any other plausible combination of the given figures. The correct approach is to ensure both components (upfront premium and fixed coupon) are accurately included and calculated, as demonstrated in the explanation for option C. ", "explhtml": "<p>To determine the credit spread, we use the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0018.webp\" style=\"max-width:min(100%,380px)\" alt=\"Upfront premium Credit spread = + Fixed coupon Duration\"><p>From Exhibit 1, the upfront premium is +5% and the duration of the CDS is 6 years. The fixed coupon is given as 98 basis points. First, we convert the upfront premium into an annualized basis point value:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0019.webp\" style=\"max-width:min(100%,701px)\" alt=\"5% Value of upfront premium per year = = 0.0083333 × 100 × 100 = 83.3333 basis points 6\"><p>Adding this value to the fixed coupon gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0020.webp\" style=\"max-width:min(100%,426px)\" alt=\"Credit spread = 83.3333 + 98 = 181.3333 basis points\"><p>This calculation shows that the total credit spread, considering both the annualized value of the upfront premium and the fixed coupon rate, amounts to 181.33 basis points, confirming that option C is correct.<\/p><p><b>A is incorrect<\/b>. It suggests that the credit spread is 83.33 basis points. This calculation appears to consider only the annualized value of the upfront premium (83.3333 basis points) and completely disregards the fixed coupon rate of 98 basis points. The credit spread in a CDS contract is the sum of the annualized upfront premium and the fixed coupon rate. Therefore, omitting the fixed coupon rate results in an incorrect and significantly lower credit spread calculation.<\/p><p><b>B is incorrect<\/b>. It calculates the credit spread as 169.43 basis points. This value is incorrect and does not align with any straightforward calculation from the given data. It seems to be a miscalculation or a typo, as it neither matches the sum of the annualized upfront premium and the fixed coupon (which correctly totals 181.33 basis points) nor any other plausible combination of the given figures. The correct approach is to ensure both components (upfront premium and fixed coupon) are accurately included and calculated, as demonstrated in the explanation for option C. <\/p><p class=\"los\">Fixed Income, Learning Module 5: Credit Default Swaps, LOS 5(d): Describe the use of CDS to manage credit exposures and to express views regarding changes in shape and/or level of the credit curve;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Dave Whatmore<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dave Whatmore is a credit analyst at Supreme Associates. Whatmore is evaluating two credit default swap (CDS) contracts entered into by two of Supreme’s clients - Sky Ltd and Idago Corp. Both clients are lenders of credit.<\/p><p><b>Sky Ltd CDS<\/b> ARS Manufacturing is the reference entity underlying the CDS. The manufacturing concern is Sky Ltd’s sister company and has received corporate financing to execute a product diversification strategy. Serena Taylor is Sky Ltd’s chief investment officer. Taylor has arranged a meeting with Whatmore to determine if a credit event has occurred based on the following observations concerning ARS Manufacturing:<\/p><p>Observation 1: A formal plan has been established to spin off a notably large company division.<\/p><p>Observation 2: Financial difficulties may mean a high delay in scheduled interest payments, especially given that the permitted grace period has elapsed.<\/p><p>Observation 3: ARS has requested its creditors to reduce the amount of scheduled interest payments.<\/p><p>After the conclusion of the meeting, Whatmore collects details on the Sky Ltd CDS contract to price the swap (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0015.webp\" style=\"max-width:min(100%,411px)\" alt=\"Exhibit 1 Present value (PV) of protection leg $150 PV of premium leg $146 Year 1: 2% Year 2: 3% Projected hazard rates Year 3: 4% Year 4: 5% Duration of CDS 6 years Term of loan 7 year Fixed coupon 98 points basis Coupon payment frequency Annual Percentage upfront premium +5% CDS notional principal\"><p>One year after entering into the swap, the credit quality of ARS Manufacturing improved as indicated by an upgrade in ratings. The exhibit below provides revised details concerning the contract (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0016.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><p>Change in spread(bps) -25<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0017.webp\" style=\"max-width:min(100%,212px)\" alt=\"Duration 5\"><p><b>Idago Corp CDS<\/b> The Idago Corp CDS covers a $3.5 million bond issue sold by WestGate which is yields 7%. The CDS contract has a credit spread of 7% while the current LIBOR is 2.5%. Whatmore strongly believes that a basis trade, involving the bond issue and CDS, can capture potential arbitrage profits.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data in Exhibit 1, the credit spread on the CDS, in basis points, is equal to:<\/p><\/div>", "subj": "fixed"}, {"n": 9, "q": "Is Yamada’s justification of his preference for the reduced form model appropriate:", "opts": ["Yes.", "No, reduced form models also use inflexible estimation procedures.", "No, credit ratings do not provide an estimate of default probability."], "ans": "C", "expl": "Yamada's preference for reduced form models over traditional credit models is based on the flexibility and accuracy these models provide in estimating default probabilities. Traditional credit models, such as credit ratings, primarily focus on ranking the creditworthiness of entities based on historical data and qualitative assessments. They do not, however, offer specific probabilities of default, which are crucial for precise risk assessment and management. Reduced form models, in contrast, utilize statistical methods to estimate default intensity directly from market data, allowing for a more dynamic and responsive approach to changes in credit conditions. This method is particularly useful in financial environments where risk factors are continuously evolving, making it essential for credit risk models to adapt quickly to new information. A is incorrect. While Yamada's preference for reduced form models is justified, stating that traditional credit models are inflexible is not entirely accurate. Traditional credit models do provide valuable insights into the creditworthiness of borrowers and are widely used in the industry for their simplicity and the extensive historical data supporting their assessments. However, their main limitation lies in not quantifying the default probability, which is critical for certain financial analyses and investment decisions. Therefore, while traditional models are not without merit, their application is best suited for scenarios where a qualitative assessment is sufficient. B is incorrect. The statement that reduced form models use inflexible estimation procedures is incorrect. Reduced form models are known for their flexibility, primarily because they do not rely on the firm's balance sheet data but instead use market data to estimate default probabilities. This approach allows them to quickly incorporate changes in market conditions and credit quality into their calculations. The flexibility of reduced form models is further enhanced by their use of hazard estimation procedures, which can adjust to varying economic cycles and differing conditions across financial markets. This adaptability makes them highly effective for dynamic and complex financial environments. ", "explhtml": "<p>Yamada&#x27;s preference for reduced form models over traditional credit models is based on the flexibility and accuracy these models provide in estimating default probabilities. Traditional credit models, such as credit ratings, primarily focus on ranking the creditworthiness of entities based on historical data and qualitative assessments. They do not, however, offer specific probabilities of default, which are crucial for precise risk assessment and management. Reduced form models, in contrast, utilize statistical methods to estimate default intensity directly from market data, allowing for a more dynamic and responsive approach to changes in credit conditions. This method is particularly useful in financial environments where risk factors are continuously evolving, making it essential for credit risk models to adapt quickly to new information.<\/p><p><b>A is incorrect<\/b>. While Yamada&#x27;s preference for reduced form models is justified, stating that traditional credit models are inflexible is not entirely accurate. Traditional credit models do provide valuable insights into the creditworthiness of borrowers and are widely used in the industry for their simplicity and the extensive historical data supporting their assessments. However, their main limitation lies in not quantifying the default probability, which is critical for certain financial analyses and investment decisions. Therefore, while traditional models are not without merit, their application is best suited for scenarios where a qualitative assessment is sufficient.<\/p><p><b>B is incorrect<\/b>. The statement that reduced form models use inflexible estimation procedures is incorrect. Reduced form models are known for their flexibility, primarily because they do not rely on the firm&#x27;s balance sheet data but instead use market data to estimate default probabilities. This approach allows them to quickly incorporate changes in market conditions and credit quality into their calculations. The flexibility of reduced form models is further enhanced by their use of hazard estimation procedures, which can adjust to varying economic cycles and differing conditions across financial markets. This adaptability makes them highly effective for dynamic and complex financial environments. <\/p><p class=\"los\">Fixed Income, Learning Module 4: Credit Analysis Models, LOS 4(e): Calculate the value of a bond and its credit spread, given assumptions about the credit risk parameters;<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Gayle Yamada<\/summary><div class=\"vig-body\"><p>Gayle Yamada is a fixed-income analyst at Hoyce Marshall, a credit ratings agency. Yamada has been tasked with rating and evaluating Rice Trader (RT) bond issues and has partnered with his associate, Carla Thomas.<\/p><p>Yamada expresses his preference for reduced form models, stating, “Traditional credit models such as credit ratings are inflexible and provide an inaccurate estimate of a loan’s default probability.” Thomas asks why Yamada would prefer the reduced form over structural models for computing credit risk measures.<\/p><p>Yamada begins his analysis by comparing credit risk measures for 3- and 4-year RT issues. He has summarized data concerning the two issues (Exhibit 1). The analysts intend to analyze a $100,000 position in each of the two bonds.<\/p><p>Next, Yamada collects credit-adjusted and risk-free valuations concerning the 3-year bonds issued on January 1, 2012 (Exhibit 2). The two analysts aim to determine the maximum amount an investor would pay to an insurer to convert the issue to a default-free bond.<\/p><p>Yamada and Thomas compare the credit analysis of asset-backed securities (ABS) with corporate bonds. The two individuals agree on the following facts:<\/p><p>Fact 1: The Monte Carlo simulation procedure is commonly used for the valuation of corporate and ABS bonds.<\/p><p>Fact 2: The credit measures used for corporate and ABS bonds are broadly similar.<\/p><p>Fact 3: The complexity of ABS structures may render the use of conventional rating scales, used for corporate bonds, as inappropriate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0021.webp\" style=\"max-width:min(100%,512px)\" alt=\"Exhibit 1 Details Concerning 3 and 4-Year RT Bond Issues 3-Year 4-Year Coupon payment frequency Semi-annual Semi-annual Annual coupon rate 10% 12% Face value $1,000 $1,000 Expected loss (per $1,000 par value) $1.245 $0.939 Default probability (per year) 3.5 2.5\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0022.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><p><b>Credit-Adjusted and Risk-Free Valuations of the 3-Year RT Bond Issue<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap06/f0023.webp\" style=\"max-width:min(100%,577px)\" alt=\"Payment Date Credit-Adjusted Valuation Risk-Free Valuation June 30th, 2012 49.953 49.989 December 31st, 2012 48.212 48.677 June 30th, 2013 47.001 47.324 December 31st, 2013 46.196 47.117 June 30th, 2014 44.683 45.722 December 31st, 2014 521.573 673.564 Total 757.618 912.393\"><\/div><\/details><div class=\"qtext\"><p>Is Yamada’s justification of his preference for the reduced form model appropriate:<\/p><\/div>", "subj": "fixed"}, {"n": 10, "q": "The most appropriate response to Thomas’ query is that reduced form models:", "opts": ["Do not assume markets are frictionless.", "Allow for an understanding of a company’s default probability.", "Generate credit risk measures which reflect changing business cycles."], "ans": "C", "expl": "Reduced form models are preferred by analysts like Yamada because they offer a more dynamic approach to estimating default probabilities, which is crucial in the ever-changing landscape of business cycles. These models do not rely on the firm's asset structure but instead use external economic indicators and market data to predict default risks. This flexibility allows reduced form models to adapt to economic downturns or upturns, providing a more accurate reflection of a bond's credit risk at any given time. Structural models, in contrast, often assume a constant volatility in asset returns, which may not hold true in volatile markets or during economic shifts. Thus, reduced form models are more adept at incorporating the effects of business cycle changes on default probabilities. A is incorrect. The statement that reduced form models do not assume markets are frictionless is incorrect because, like structural models, reduced form models also generally operate under the assumption of frictionless markets. This assumption simplifies the modeling process by ignoring transaction costs, taxes, and other market imperfections. Both types of models, therefore, typically assume idealized conditions to focus on the credit risk assessment itself, rather than the complexities introduced by market frictions. B is incorrect. While it is true that reduced form models allow for an understanding of a company’s default probability, this is not a distinguishing feature when compared to structural models. Structural models also provide insights into default probability, albeit through a different mechanism based on the firm's assets and liabilities (often likened to an options pricing framework). The key difference lies in how each model incorporates external economic factors and business conditions. Reduced form models are specifically noted for their ability to adapt to changes in the business cycle, which is not a primary consideration in structural models. Therefore, stating that reduced form models are preferred for their ability to understand default probability does not capture their unique advantage over structural models. ", "explhtml": "<p>Reduced form models are preferred by analysts like Yamada because they offer a more dynamic approach to estimating default probabilities, which is crucial in the ever-changing landscape of business cycles. These models do not rely on the firm&#x27;s asset structure but instead use external economic indicators and market data to predict default risks. This flexibility allows reduced form models to adapt to economic downturns or upturns, providing a more accurate reflection of a bond&#x27;s credit risk at any given time. Structural models, in contrast, often assume a constant volatility in asset returns, which may not hold true in volatile markets or during economic shifts. Thus, reduced form models are more adept at incorporating the effects of business cycle changes on default probabilities.<\/p><p><b>A is incorrect<\/b>. The statement that reduced form models do not assume markets are frictionless is incorrect because, like structural models, reduced form models also generally operate under the assumption of frictionless markets. This assumption simplifies the modeling process by ignoring transaction costs, taxes, and other market imperfections. Both types of models, therefore, typically assume idealized condit
