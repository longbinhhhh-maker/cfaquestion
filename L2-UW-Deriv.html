<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

const DATA = [{"n":1,"q":"Based on Exhibit 1, the no-arbitrage price for the 3-year JPY/AUD currency swap is closest to:","opts":["0.127% JPY and 3.633% AUD.","0.238% JPY and 3.394% AUD.","0.241% JPY and 3.507% AUD."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a001.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a001.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Derivatives<\/summary><div class=\"vig-body\"><p>Wang Chen is a swap trader for a large hedge fund. Petra Freund manages a global macro fund for the same firm. Freund wants to speculate on relative interest rate movements in Japan and Australia and asks Chen to price a 3-year, at-market, fixed-for-fixed, annual-payment, pay-JPY, receive-AUD currency swap. Selected data for JPY and AUD interest rates, as well as discount factors for pricing the swap, are contained in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex001.webp\" style=\"max-width:min(100%,595px)\" alt=\"Exhibit\"><p>Freund wants the swap structured so that the notional amounts are exchanged at both initiation and expiration. Exhibit 2 contains selected data on the swap and JPY/AUD exchange rates at the swap&#x27;s initiation:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex002.webp\" style=\"max-width:min(100%,490px)\" alt=\"Exhibit\"><p>One year ago, Freund entered into a pay-fixed, receive-floating USD interest rate swap to speculate on expectations of rising USD interest rates. US interest rates have increased, so she is considering taking profits on the trade. Freund asks Chen to estimate the value of the swap based on the information contained in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex003.webp\" style=\"max-width:min(100%,469px)\" alt=\"Exhibit\"><p>Exhibit 4 shows USD interest rates for valuing the swap:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex004.webp\" style=\"max-width:min(100%,333px)\" alt=\"Exhibit\"><p>Freund&#x27;s fund also holds a quarterly-payment, receive-equity, pay-fixed equity swap based on the S&amp;P 500 Index total return. The swap had a maturity of 1 year when it was initiated 3 months ago, and the first quarterly payment has just occurred. Freund is uncertain about the method for valuing equity swaps and proposes three valuation methods for this swap:<\/p><p><b>Method 1:<\/b> Calculate the difference between the total return over the last 3 months on the S&amp;P index and the interest accrued on the fixed-rate leg over the same period.<\/p><p><b>Method 2:<\/b> Calculate the difference between the PVs of the fixed-rate leg on the existing swap and the fixed-rate leg of an otherwise equivalent, current at-market, S&amp;P 500-return-for-fixed-rate equity swap.<\/p><p><b>Method 3:<\/b> Calculate the difference between the PV of the equity leg, based on the expected total return on the S&amp;P 500 Index, and the PV of the swap&#x27;s fixed-rate leg, based on the coupon set at initiation.<\/p><p>Assume all financial instruments use the 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the no-arbitrage price for the 3-year JPY/AUD currency swap is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q001.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":2,"q":"Assume Freund's hedge fund holds the currency swap until expiration, when the spot exchange rate is JPY/AUD 95.69. Based on Exhibit 2, the notional amount (in JPY millions) the fund must pay at expiration is closest to:","opts":["840.8","925.5","965.9"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a002.webp\" tar based on the S&amp;P 500 Index total return. The swap had a maturity of 1 year when it was initiated 3 months ago, and the first quarterly payment has just occurred. Freund is uncertain about the method for valuing equity swaps and proposes three valuation methods for this swap:<\/p><p><b>Method 1:<\/b> Calculate the difference between the total return over the last 3 months on the S&amp;P index and the interest accrued on the fixed-rate leg over the same period.<\/p><p><b>Method 2:<\/b> Calculate the difference between the PVs of the fixed-rate leg on the existing swap and the fixed-rate leg of an otherwise equivalent, current at-market, S&amp;P 500-return-for-fixed-rate equity swap.<\/p><p><b>Method 3:<\/b> Calculate the difference between the PV of the equity leg, based on the expected total return on the S&amp;P 500 Index, and the PV of the swap&#x27;s fixed-rate leg, based on the coupon set at initiation.<\/p><p>Assume all financial instruments use the 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>Assume Freund&#x27;s hedge fund holds the currency swap until expiration, when the spot exchange rate is JPY/AUD 95.69. Based on Exhibit 2, the notional amount (in JPY millions) the fund must<\/p><p>pay at expiration is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q002.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":3,"q":"Based on Exhibit 3 and Exhibit 4, the no-arbitrage USD value of Freund's interest rate swap is closest to:","opts":["542,293","557,984","603,649"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a003.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a003.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Wang Chen is a swap trader for a large hedge fund. Petra Freund manages a global macro fund for the same firm. Freund wants to speculate on relative interest rate movements in Japan and Australia and asks Chen to price a 3-year, at-market, fixed-for-fixed, annual-payment, pay-JPY, receive-AUD currency swap. Selected data for JPY and AUD interest rates, as well as discount factors for pricing the swap, are contained in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex001.webp\" style=\"max-width:min(100%,595px)\" alt=\"Exhibit\"><p>Freund wants the swap structured so that the notional amounts are exchanged at both initiation and expiration. Exhibit 2 contains selected data on the swap and JPY/AUD exchange rates at the swap&#x27;s initiation:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex002.webp\" style=\"max-width:min(100%,490px)\" alt=\"Exhibit\"><p>One year ago, Freund entered into a pay-fixed, receive-floating USD interest rate swap to speculate on expectations of rising USD interest rates. US interest rates have increased, so she is considering taking profits on the trade. Freund asks Chen to estimate the value of the swap based on the information contained in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex003.webp\" style=\"max-width:min(100%,469px)\" alt=\"Exhibit\"><p>Exhibit 4 shows USD interest rates for valuing the swap:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex004.webp\" style=\"max-width:min(100%,333px)\" alt=\"Exhibit\"><p>Freund&#x27;s fund also holds a quarterly-payment, receive-equity, pay-fixed equity swap based on the S&amp;P 500 Index total return. The swap had a maturity of 1 year when it was initiated 3 months ago, and the first quarterly payment has just occurred. Freund is uncertain about the method for valuing equity swaps and proposes three valuation methods for this swap:<\/p><p><b>Method 1:<\/b> Calculate the difference between the total return over the last 3 months on the S&amp;P index and the interest accrued on the fixed-rate leg over the same period.<\/p><p><b>Method 2:<\/b> Calculate the difference between the PVs of the fixed-rate leg on the existing swap and the fixed-rate leg of an otherwise equivalent, current at-market, S&amp;P 500-return-for-fixed-rate equity swap.<\/p><p><b>Method 3:<\/b> Calculate the difference between the PV of the equity leg, based on the expected total return on the S&amp;P 500 Index, and the PV of the swap&#x27;s fixed-rate leg, based on the coupon set at initiation.<\/p><p>Assume all financial instruments use the 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3 and Exhibit 4, the no-arbitrage USD value of Freund&#x27;s interest rate swap is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q003.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":4,"q":"Which of the methods Freund described regarding the valuation of equity-return-for-fixed-rate equity swaps is correct?","opts":["Method 1","Method 2","Method 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a004.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a004.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Wang Chen is a swap trader for a large hedge fund. Petra Freund manages a global macro fund for the same firm. Freund wants to speculate on relative interest rate movements in Japan and Australia and asks Chen to price a 3-year, at-market, fixed-for-fixed, annual-payment, pay-JPY, receive-AUD currency swap. Selected data for JPY and AUD interest rates, as well as discount factors for pricing the swap, are contained in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex001.webp\" style=\"max-width:min(100%,595px)\" alt=\"Exhibit\"><p>Freund wants the swap structured so that the notional amounts are exchanged at both initiation and expiration. Exhibit 2 contains selected data on the swap and JPY/AUD exchange rates at the swap&#x27;s initiation:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex002.webp\" style=\"max-width:min(100%,490px)\" alt=\"Exhibit\"><p>One year ago, Freund entered into a pay-fixed, receive-floating USD interest rate swap to speculate on expectations of rising USD interest rates. US interest rates have increased, so she is considering taking profits on the trade. Freund asks Chen to estimate the value of the swap based on the information contained in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex003.webp\" style=\"max-width:min(100%,469px)\" alt=\"Exhibit\"><p>Exhibit 4 shows USD interest rates for valuing the swap:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex004.webp\" style=\"max-width:min(100%,333px)\" alt=\"Exhibit\"><p>Freund&#x27;s fund also holds a quarterly-payment, receive-equity, pay-fixed equity swap based on the S&amp;P 500 Index total return. The swap had a maturity of 1 year when it was initiated 3 months ago, and the first quarterly payment has just occurred. Freund is uncertain about the method for valuing equity swaps and proposes three valuation methods for this swap:<\/p><p><b>Method 1:<\/b> Calculate the difference between the total return over the last 3 months on the S&amp;P index and the interest accrued on the fixed-rate leg over the same period.<\/p><p><b>Method 2:<\/b> Calculate the difference between the PVs of the fixed-rate leg on the existing swap and the fixed-rate leg of an otherwise equivalent, current at-market, S&amp;P 500-return-for-fixed-rate equity swap.<\/p><p><b>Method 3:<\/b> Calculate the difference between the PV of the equity leg, based on the expected total return on the S&amp;P 500 Index, and the PV of the swap&#x27;s fixed-rate leg, based on the coupon set at initiation.<\/p><p>Assume all financial instruments use the 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the methods Freund described regarding the valuation of equity-return-for-fixed-rate equity swaps is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q004.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":5,"q":"Based on Exhibit 1, the no-arbitrage 6-month forward price of Bond A is most likely:","opts":["less than its spot price.","equal to its spot price.","greater than its spot price."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a005.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a005.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–10 · Derivatives<\/summary><div class=\"vig-body\"><p>Herman Schmidt is a fund manager working at Rosige Zukunft LLC (RZ), a derivatives trading firm. RZ uses the carry arbitrage model to assess the value of bond forward contracts. Exhibit 1 contains information on several German government bonds that pay coupons once per annum and have five years remaining until maturity. Schmidt directs Hedwig Meyer, an RZ analyst, to price forward contracts on Bond A, Bond B, and Bond C. The 6-month risk-free rate is 1.50% and the 1-year risk-free rate is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex005.webp\" style=\"max-width:min(100%,400px)\" alt=\"Exhibit\"><p>2.00%.<\/p><p>Schmidt and Meyer discuss different methods for valuing interest rate and currency swaps. Exhibit 2 contains information on at-market EUR and CHF interest rate swaps, and the CHF/EUR exchange rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex006.webp\" style=\"max-width:min(100%,619px)\" alt=\"Exhibit\"><p>Schmidt has RZ initiate a fixed-for-fixed EUR/CHF currency swap, agreeing to pay 1.20% in CHF and receive 1.80% in EUR. RZ exchanges the swap notional with the counterparty at contract initiation, paying EUR 10 million and receiving CHF 10.5 million. Six months later, at-market 2.5-year fixed-for-fixed EUR/CHF currency swaps are quoted at 1.60% EUR for 1.40% CHF and the spot CHF/EUR exchange rate is 1.1000.<\/p><p>Schmidt anticipates that the equity of Dash Haber Ltd., a UK clothing retailer, will outperform versus expectations. He decides to use a 1-year, quarterly settled, equity-return-for-fixed-interest rate swap to gain long exposure to Dash Haber equity. Exhibit 3 contains information related to the swap:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex007.webp\" style=\"max-width:min(100%,549px)\" alt=\"Exhibit\"><p>All interest rates are annual compound rates and are based on a 360-day year.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the no-arbitrage 6-month forward price of Bond A is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q005.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":6,"q":"Based on Exhibit 1, the no-arbitrage 1-year forward price of Bond B is closest to:","opts":["99.880","99.939","102.939"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a006.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a006.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–10 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Herman Schmidt is a fund manager working at Rosige Zukunft LLC (RZ), a derivatives trading firm. RZ uses the carry arbitrage model to assess the value of bond forward contracts. Exhibit 1 contains information on several German government bonds that pay coupons once per annum and have five years remaining until maturity. Schmidt directs Hedwig Meyer, an RZ analyst, to price forward contracts on Bond A, Bond B, and Bond C. The 6-month risk-free rate is 1.50% and the 1-year risk-free rate is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex005.webp\" style=\"max-width:min(100%,400px)\" alt=\"Exhibit\"><p>2.00%.<\/p><p>Schmidt and Meyer discuss different methods for valuing interest rate and currency swaps. Exhibit 2 contains information on at-market EUR and CHF interest rate swaps, and the CHF/EUR exchange rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex006.webp\" style=\"max-width:min(100%,619px)\" alt=\"Exhibit\"><p>Schmidt has RZ initiate a fixed-for-fixed EUR/CHF currency swap, agreeing to pay 1.20% in CHF and receive 1.80% in EUR. RZ exchanges the swap notional with the counterparty at contract initiation, paying EUR 10 million and receiving CHF 10.5 million. Six months later, at-market 2.5-year fixed-for-fixed EUR/CHF currency swaps are quoted at 1.60% EUR for 1.40% CHF and the spot CHF/EUR exchange rate is 1.1000.<\/p><p>Schmidt anticipates that the equity of Dash Haber Ltd., a UK clothing retailer, will outperform versus expectations. He decides to use a 1-year, quarterly settled, equity-return-for-fixed-interest rate swap to gain long exposure to Dash Haber equity. Exhibit 3 contains information related to the swap:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex007.webp\" style=\"max-width:min(100%,549px)\" alt=\"Exhibit\"><p>All interest rates ><img loading=\"lazy\" src=\"l2img/uw-deriv/q009.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":10,"q":"Based on Exhibit 3, the no-arbitrage price of the Dash Haber equity-return-for-fixed-interest-rate swap is a coupon rate on the fixed-rate leg closest to:","opts":["3.33%","3.85%","4.05%"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a010.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a010.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–10 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Herman Schmidt is a fund manager working at Rosige Zukunft LLC (RZ), a derivatives trading firm. RZ uses the carry arbitrage model to assess the value of bond forward contracts. Exhibit 1 contains information on several German government bonds that pay coupons once per annum and have five years remaining until maturity. Schmidt directs Hedwig Meyer, an RZ analyst, to price forward contracts on Bond A, Bond B, and Bond C. The 6-month risk-free rate is 1.50% and the 1-year risk-free rate is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex005.webp\" style=\"max-width:min(100%,400px)\" alt=\"Exhibit\"><p>2.00%.<\/p><p>Schmidt and Meyer discuss different methods for valuing interest rate and currency swaps. Exhibit 2 contains information on at-market EUR and CHF interest rate swaps, and the CHF/EUR exchange rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex006.webp\" style=\"max-width:min(100%,619px)\" alt=\"Exhibit\"><p>Schmidt has RZ initiate a fixed-for-fixed EUR/CHF currency swap, agreeing to pay 1.20% in CHF and receive 1.80% in EUR. RZ exchanges the swap notional with the counterparty at contract initiation, paying EUR 10 million and receiving CHF 10.5 million. Six months later, at-market 2.5-year fixed-for-fixed EUR/CHF currency swaps are quoted at 1.60% EUR for 1.40% CHF and the spot CHF/EUR exchange rate is 1.1000.<\/p><p>Schmidt anticipates that the equity of Dash Haber Ltd., a UK clothing retailer, will outperform versus expectations. He decides to use a 1-year, quarterly settled, equity-return-for-fixed-interest rate swap to gain long exposure to Dash Haber equity. Exhibit 3 contains information related to the swap:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex007.webp\" style=\"max-width:min(100%,549px)\" alt=\"Exhibit\"><p>All interest rates are annual compound rates and are based on a 360-day year.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, the no-arbitrage price of the Dash Haber equity-return-for-fixed-interest-rate swap is a coupon rate on the fixed-rate leg closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q010.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":11,"q":"The no-arbitrage forward price on the Euro Stoxx 50 index is most likely:","opts":["less than the spot value.","equal to the spot value.","greater than the spot value."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a011.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a011.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 11–14 · Derivatives<\/summary><div class=\"vig-body\"><p>Johan Marten and Gisele Thierry are equity derivatives traders for an international bank. They discuss the factors underlying no-arbitrage pricing of forward commitment derivatives, focusing on how these factors apply to pricing a 2-year forward contract on the Euro Stoxx 50 Index. The details of this forward contract are:<\/p><p>The current market value of the Euro Stoxx 50 Index is 3900.<\/p><p>The continuously compounded dividend yield on the index is 2.5%.<\/p><p>The continuously compounded risk-free interest rate is 3%.<\/p><p>Thierry&#x27;s previous experience has mostly involved trading equity options, futures, and forwards. She asks Marten to describe the structure and pricing of equity swaps. In response, he makes the following statements:<\/p><p><b>Statement 1:<\/b> Equity swaps are always structured to have:<\/p><p>one equity leg, with a value based on the return of the underlying equity, and<\/p><p>one interest rate leg, with a value based on either a fixed or floating rate.<\/p><p><b>Statement 2:<\/b> The return of the equity leg can be valued on either a total return basis or a price-change-only basis.<\/p><p><b>Statement 3:<\/b> The fixed-rate leg in an equity return-for-fixed interest rate swap is a weighted average of the interest rates used in valuing the equity forward contracts that would replicate the swap&#x27;s cash flows.<\/p><p>Thierry is unsure that she fully understands the relationship between the value of an equity swap and the price of the underlying equity. She asks Marten to explain that relationship, using the receive-equity, pay-fixed interest rate swap on Marticart common stock shown in Exhibit 1. The EUR term structure is flat at 1.5%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex008.webp\" style=\"max-width:min(100%,455px)\" alt=\"Exhibit\"><p>The discount factors relevant for valuing the swap, based on the current term structure, are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex009.webp\" style=\"max-width:min(100%,250px)\" alt=\"Exhibit\"><p>The bank currently holds a position in a Gamboling Corporation common stock pay-equity, receive-fixed interest rate swap. Exhibit 3 contains select information regarding the swap. The swap was initiated 6 months earlier, and the settlement payment for the quarter ending yesterday is due by the close of business today. Thierry asks Marten how the settlement payment is calculated.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex010.webp\" style=\"max-width:min(100%,497px)\" alt=\"Exhibit\"><p>Assume all swap periodic settlement payments use a 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>The no-arbitrage forward price on the Euro Stoxx 50 index is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q011.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":12,"q":"Which of Marten's statements regarding equity swaps is incorrect?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a012.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a012.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 11–14 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Johan Marten and Gisele Thierry are equity derivatives traders for an international bank. They discuss the factors underlying no-arbitrage pricing of forward commitment derivatives, focusing on how these factors apply to pricing a 2-year forward contract on the Euro Stoxx 50 Index. The details of this forward contract are:<\/p><p>The current market value of the Euro Stoxx 50 Index is 3900.<\/p><p>The continuously compounded dividend yield on the index is 2.5%.<\/p><p>The continuously compounded risk-free interest rate is 3%.<\/p><p>Thierry&#x27;s previous experience has mostly involved trading equity options, futures, and forwards. She asks Marten to describe the structure and pricing of equity swaps. In response, he makes the following statements:<\/p><p><b>Statement 1:<\/b> Equity swaps are always structured to have:<\/p><p>one equity leg, with a value based on the return of the underlying equity, and<\/p><p>one interest rate leg, with a value based on either a fixed or floating rate.<\/p><p><b>Statement 2:<\/b> The return of the equity leg can be valued on either a total return basis or a price-change-only basis.<\/p><p><b>Statement 3:<\/b> The fixed-rate leg in an equity return-for-fixed interest rate swap is a weighted average of the interest rates used in valuing the equity forward contracts that would replicate the swap&#x27;s cash flows.<\/p><p>Thierry is unsure that she fully understands the relationship between the value of an equity swap and the price of the underlying equity. She asks Marten to explain that relationship, using the receive-equity, pay-fixed interest rate swap on Marticart common stock shown in Exhibit 1. The EUR term structure is flat at 1.5%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex008.webp\" style=\"max-width:min(100%,455px)\" alt=\"Exhibit\"><p>The discount factors relevant for valuing the swap, based on the current term structure, are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex009.webp\" style=\"max-width:min(100%,250px)\" alt=\"Exhibit\"><p>The bank currently holds a position in a Gamboling Corporation common stock pay-equity, receive-fixed interest rate swap. Exhibit 3 contains select information regarding the swap. The swap was initiated 6 months earlier, and the settlement payment for the quarter ending yesterday is due by the close of business today. Thierry asks Marten how the settlement payment is calculated.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex010.webp\" style=\"max-width:min(100%,497px)\" alt=\"Exhibit\"><p>Assume all swap periodic settlement payments use a 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Marten&#x27;s statements regarding equity swaps is incorrect?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q012.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":13,"q":"Based on Exhibit 1 and Exhibit 2, the price (in €) of Marticart common stock that results in the swap having a value of zero is closest to:","opts":["202.91","208.85","221.51"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a013.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a013.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 11–14 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Johan Marten and Gisele Thierry are equity derivatives traders for an international bank. They discuss the factors underlying no-arbitrage pricing of forward commitment derivatives, focusing on how these factors apply to pricing a 2-year forward contract on the Euro Stoxx 50 Index. The details of this forward contract are:<\/p><p>The current market value of the Euro Stoxx 50 Index is 3900.<\/p><p>The continuously compounded dividend yield on the index is 2.5%.<\/p><p>The continuously compounded risk-free interest rate is 3%.<\/p><p>Thierry&#x27;s previous experience has mostly involved trading equity options, futures, and forwards. She asks Marten to describe the structure and pricing of equity swaps. In response, he makes the following statements:<\/p><p><b>Statement 1:<\/b> Equity swaps are always structured to have:<\/p><p>one equity leg, with a value based on the return of the underlying equity, and<\/p><p>one interest rate leg, with a value based on either a fixed or floating rate.<\/p><p><b>Statement 2:<\/b> The return of the equity leg can be valued on either a total return basis or a price-change-only basis.<\/p><p><b>Statement 3:<\/b> The fixed-rate leg in an equity return-for-fixed interest rate swap is a weighted average of the interest rates used in valuing the equity forward contracts that would replicate the swap&#x27;s cash flows.<\/p><p>Thierry is unsure that she fully understands the relationship between the value of an equity swap and the price of the underlying equity. She asks Marten to explain that relationship, using the receive-equity, pay-fixed interest rate swap on Marticart common stock shown in Exhibit 1. The EUR term structure is flat at 1.5%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex008.webp\" style=\"max-width:min(100%,455px)\" alt=\"Exhibit\"><p>The discount factors relevant for valuing the swap, based on the current term structure, are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex009.webp\" style=\"max-width:min(100%,250px)\" alt=\"Exhibit\"><p>The bank currently holds a position in a Gamboling Corporation common stock pay-equity, receive-fixed interest rate swap. Exhibit 3 contains select information regarding the swap. The swap was initiated 6 months earlier, and the settlement payment for the quarter ending yesterday is due by the close of business today. Thierry asks Marten how the settlement payment is calculated.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex010.webp\" style=\"max-width:min(100%,497px)\" alt=\"Exhibit\"><p>Assume all swap periodic settlement payments use a 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Exhibit 2, the price (in €) of Marticart common stock that results in the swap having a value of zero is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q013.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":14,"q":"Based on Exhibit 3, the amount (in €) the bank owes on the semiannual payment date for the Gamboling equity return-for-fixed interest rate swap is closest to:","opts":["1,250,000","2,500,000","3,250,000"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a014.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a014.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 11–14 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Johan Marten and Gisele Thierry are equity derivatives traders for an international bank. They discuss the factors underlying no-arbitrage pricing of forward commitment derivatives, focusing on how these factors apply to pricing a 2-year forward contract on the Euro Stoxx 50 Index. The details of this forward contract are:<\/p><p>The current market value of the Euro Stoxx 50 Index is 3900.<\/p><p>The continuously compounded dividend yield on the index is 2.5%.<\/p><p>The continuously compounded risk-free interest rate is 3%.<\/p><p>Thierry&#x27;s previous experience has mostly involved trading equity options, futures, and forwards. She asks Marten to describe the structure and pricing of equity swaps. In response, he makes the following statements:<\/p><p><b>Statement 1:<\/b> Equity swaps are always structured to have:<\/p><p>one equity leg, with a value based on the return of the underlying equity, and<\/p><p>one interest rate leg, with a value based on either a fixed or floating rate.<\/p><p><b>Statement 2:<\/b> The return of the equity leg can be valued on either a total return basis or a price-change-only basis.<\/p><p><b>Statement 3:<\/b> The fixed-rate leg in an equity return-for-fixed interest rate swap is a weighted average of the interest rates used in valuing the equity forward contracts that would replicate the swap&#x27;s cash flows.<\/p><p>Thierry is unsure that she fully understands the relationship between the value of an equity swap and the price of the underlying equity. She asks Marten to explain that relationship, using the receive-equity, pay-fixed interest rate swap on Marticart common stock shown in Exhibit 1. The EUR term structure is flat at 1.5%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex008.webp\" style=\"max-width:min(100%,455px)\" alt=\"Exhibit\"><p>The discount factors relevant for valuing the swap, based on the current term structure, are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex009.webp\" style=\"max-width:min(100%,250px)\" alt=\"Exhibit\"><p>The bank currently holds a position in a Gamboling Corporation common stock pay-equity, receive-fixed interest rate swap. Exhibit 3 contains select information regarding the swap. The swap was initiated 6 months earlier, and the settlement payment for the quarter ending yesterday is due by the close of business today. Thierry asks Marten how the settlement payment is calculated.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex010.webp\" style=\"max-width:min(100%,497px)\" alt=\"Exhibit\"><p>Assume all swap periodic settlement payments use a 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, the amount (in €) the bank owes on the semiannual payment date for the Gamboling equity return-for-fixed interest rate swap is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q014.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":15,"q":"Which of Patere's statements describing the valuation of bond forward and futures contracts is (are) correct?","opts":["Only Statement 1","Only Statement 2","Both Statement 1 and Statement 2"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a015.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a015.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 15–20 · Derivatives<\/summary><div class=\"vig-body\"><p>Sondra Schute manages an interest rate and fixed-income trading desk for an international bank. Rick Patere is a recently hired junior analyst supporting the desk. Schute wants to evaluate Patere&#x27;s understanding of forward commitment contracts and asks him to describe the valuation of bond forward and futures contracts. Patere says that forward and futures prices are similar conceptually, but there is a fundamental difference in the valuation of the two types of derivatives:<\/p><p><b>Statement 1:<\/b> The value of a forward contract after initiation is the future value of the difference between the agreed price in the existing contract and the no-arbitrage forward price of a contract initiated today, assuming both contracts are written on the same underlying bond and have the same expiration date.<\/p><p><b>Statement 2:<\/b> The value of a futures contract resets to zero after every trading session since there is a mark-to-market cash settlement equal to the change in the future&#x27;s price from the previous day&#x27;s settlement.<\/p><p>Schute asks Patere to assess the value of a bond futures contract relative to the underlying bond, using a risk-free rate of 1.00% and given the current data shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex011.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>A commercial loan officer has requested a quote for an at-market, pay-fixed, receive-floating 3 × 9 forward rate agreement (FRA) to hedge the interest rate on a future loan to a client. Schute directs Patere to calculate the fixed rate on an at-market FRA and then to describe how the value of the trading desk&#x27;s FRA position will be affected by shifts in the yield curve, as the receive-fixed, pay-floating party. Current reference index interest rate data is shown in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex012.webp\" style=\"max-width:min(100%,350px)\" alt=\"Exhibit\"><p>Exhibit 2:<\/p><p>Schute asks Patere to describe how he would value a pay-fixed, receive-floating, interest rate swap initiated 1 year ago. The swap has 2 years remaining until expiration and a fixed-leg coupon of 3%. Patere identifies two methods to value the swap. The value of the swap is equal to:<\/p><p><b>Method 1:<\/b> The present value of the difference between 3% and the coupon of the fixed-rate leg of a new at-market, annual payment, 2-year swap, assuming the same notional amount and floating-leg reference interest rate as the swap being valued.<\/p><p><b>Method 2:<\/b> The difference between the value of two 2-year annual-pay bonds with par values equal to the swap notional amount, assuming one bond has a 3% fixed-coupon rate and the other has a floating-rate coupon based on the same reference interest rate as the floating leg of the swap.<\/p><p>Schute directs Patere to price a 4-year, at-market interest rate swap based on the information in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex013.webp\" style=\"max-width:min(100%,491px)\" alt=\"Exhibit\"><p>Unless stated otherwise, assume all instruments have annual payment frequencies and use the 30/360 day-count convention, and that all interest rates are stated on an annual compound basis.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Patere&#x27;s statements describing the valuation of bond forward and futures contracts is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q015.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":16,"q":"Based on the information in Exhibit 1, the arbitrage-free bond future's price based on the carry arbitrage model is closest to:","opts":["139.18","139.89","142.59"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a016.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a016.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 15–20 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sondra Schute manages an interest rate and fixed-income trading desk for an international bank. Rick Patere is a recently hired junior analyst supporting the desk. Schute wants to evaluate Patere&#x27;s understanding of forward commitment contracts and asks him to describe the valuation of bond forward and futures contracts. Patere says that forward and futures prices are similar conceptually, but there is a fundamental difference in the valuation of the two types of derivatives:<\/p><p><b>Statement 1:<\/b> The value of a forward contract after initiation is the future value of the difference between the agreed price in the existing contract and the no-arbitrage forward price of a contract initiated today, assuming both contracts are written on the same underlying bond and have the same expiration date.<\/p><p><b>Statement 2:<\/b> The value of a futures contract resets to zero after every trading session since there is a mark-to-market cash settlement equal to the change in the future&#x27;s price from the previous day&#x27;s settlement.<\/p><p>Schute asks Patere to assess the value of a bond futures contract relative to the underlying bond, using a risk-free rate of 1.00% and given the current data shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex011.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>A commercial loan officer has requested a quote for an at-market, pay-fixed, receive-floating 3 × 9 forward rate agreement (FRA) to hedge the interest rate on a future loan to a client. Schute directs Patere to calculate the fixed rate on an at-market FRA and then to describe how the value of the trading desk&#x27;s FRA position will be affected by shifts in the yield curve, as the receive-fixed, pay-floating party. Current reference index interest rate data is shown in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex012.webp\" style=\"max-width:min(100%,350px)\" alt=\"Exhibit\"><p>Exhibit 2:<\/p><p>Schute asks Patere to describe how he would value a pay-fixed, receive-floating, interest rate swap initiated 1 year ago. The swap has 2 years remaining until expiration and a fixed-leg coupon of 3%. Patere identifies two methods to value the swap. The value of the swap is equal to:<\/p><p><b>Method 1:<\/b> The present value of the difference between 3% and the coupon of the fixed-rate leg of a new at-market, annual payment, 2-year swap, assuming the same notional amount and floating-leg reference interest rate as the swap being valued.<\/p><p><b>Method 2:<\/b> The difference between the value of two 2-year annual-pay bonds with par values equal to the swap notional amount, assuming one bond has a 3% fixed-coupon rate and the other has a floating-rate coupon based on the same reference interest rate as the floating leg of the swap.<\/p><p>Schute directs Patere to price a 4-year, at-market interest rate swap based on the information in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex013.webp\" style=\"max-width:min(100%,491px)\" alt=\"Exhibit\"><p>Unless stated otherwise, assume all instruments have annual payment frequencies and use the 30/360 day-count convention, and that all interest rates are stated on an annual compound basis.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information in Exhibit 1, the arbitrage-free bond future&#x27;s price based on the carry arbitrage model is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q016.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":17,"q":"Using the information in Exhibit 2, the no-arbitrage fixed rate on a new 3 × 9 FRA is closest to:","opts":["1.19%","1.75%","1.91%"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a017.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a017.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 15–20 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sondra Schute manages an interest rate and fixed-income trading desk for an international bank. Rick Patere is a recently hired junior analyst supporting the desk. Schute wants to evaluate Patere&#x27;s understanding of forward commitment contracts and asks him to describe the valuation of bond forward and futures contracts. Patere says that forward and futures prices are similar conceptually, but there is a fundamental difference in the valuation of the two types of derivatives:<\/p><p><b>Statement 1:<\/b> The value of a forward contract after initiation is the future value of the difference between the agreed price in the existing contract and the no-arbitrage forward price of a contract initiated today, assuming both contracts are written on the same underlying bond and have the same expiration date.<\/p><p><b>Statement 2:<\/b> The value of a futures contract resets to zero after every trading session since there is a mark-to-market cash settlement equal to the change in the future&#x27;s price from the previous day&#x27;s settlement.<\/p><p>Schute asks Patere to assess the value of a bond futures contract relative to the underlying bond, using a ri
