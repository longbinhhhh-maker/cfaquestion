"l2img/uw-deriv/a039.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 35–40 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Axeron Financial Corporation<\/p><p>Axeron is a proprietary trading firm that invests in securities and derivatives markets around the world. The firm uses the carry arbitrage model to identify when forward commitment derivatives appear to be mispriced relative to the underlying asset.<\/p><p>Nichi Tano, CFA, who manages a derivatives-trading desk for Axeron, is overseeing the training of Ralle Mittan, a new research associate. To assess Mittan&#x27;s familiarity with equity derivatives, Tano asks her to evaluate the accuracy of the following statements regarding otherwise equivalent (ie, same underlying asset, same expiration date) equity futures and forward contracts:<\/p><p><b>Statement 1:<\/b> Long futures and forward positions exhibit the same pattern of cash flows over the time to expiration.<\/p><p><b>Statement 2:<\/b> The no-arbitrage value of futures and forward contracts is the same given the same time to expiration.<\/p><p><b>Statement 3:<\/b> Futures and forward prices decrease by similar amounts if the expected dividends from holding the underlying increase.<\/p><p>After discussing these statements, Tano asks Mittan to describe the elements of the arbitrage carry model and address what effect, if any, an increase in the risk-free rate has on equity forward prices.<\/p><p>Axeron is the pay-fixed/receive-floating party in a 3 × 6 forward rate agreement (FRA) initiated 30 days earlier. Information on this existing FRA and current index rates are presented in Exhibits 1 and 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex020.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex021.webp\" style=\"max-width:min(100%,371px)\" alt=\"Exhibit\"><p>Gahbi Faddal, an Axeron swap trader, gathers the exchange rate and risk-free rate data to evaluate a fixed-for-fixed EUR / GBP currency swap. The terms of the swap and related information are given in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex022.webp\" style=\"max-width:min(100%,529px)\" alt=\"Exhibit\"><p>Axeron is the fixed-rate payer/floating-rate receiver in an annual reset USD interest rate swap. The USD 25,000,000 notional amount contract was created at-market with a 2.50% fixed rate and 4 years to maturity when initiated 1 year ago. Exhibit 4 contains current data for valuing USD fixed-for-floating interest rate swaps.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex023.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><p>Axeron is the equity-return receiver/fixed-rate payer in the swap described in Exhibit 5.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex024.webp\" style=\"max-width:min(100%,450px)\" alt=\"Exhibit\"><p>Unless otherwise noted, assume a 30/360 day-count convention applies to all pricing and valuation questions.<\/p><\/div><\/details><div class=\"qtext\"><p>Given the current at-market 3-year swap rate of 1.89%, the value of the swap Axeron initiated one year ago and pays a 2.50% fixed rate on, is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q039.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":40,"q":"Based on Exhibit 5, for a quarter in which the total rate of return on the underlying equity was -1.50%, the cash flow from Axeron's perspective is closest to:","opts":["-EUR 1,000,000","-EUR 500,000","+EUR 250,000"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a040.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a040.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 35–40 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Axeron Financial Corporation<\/p><p>Axeron is a proprietary trading firm that invests in securities and derivatives markets around the world. The firm uses the carry arbitrage model to identify when forward commitment derivatives appear to be mispriced relative to the underlying asset.<\/p><p>Nichi Tano, CFA, who manages a derivatives-trading desk for Axeron, is overseeing the training of Ralle Mittan, a new research associate. To assess Mittan&#x27;s familiarity with equity derivatives, Tano asks her to evaluate the accuracy of the following statements regarding otherwise equivalent (ie, same underlying asset, same expiration date) equity futures and forward contracts:<\/p><p><b>Statement 1:<\/b> Long futures and forward positions exhibit the same pattern of cash flows over the time to expiration.<\/p><p><b>Statement 2:<\/b> The no-arbitrage value of futures and forward contracts is the same given the same time to expiration.<\/p><p><b>Statement 3:<\/b> Futures and forward prices decrease by similar amounts if the expected dividends from holding the underlying increase.<\/p><p>After discussing these statements, Tano asks Mittan to describe the elements of the arbitrage carry model and address what effect, if any, an increase in the risk-free rate has on equity forward prices.<\/p><p>Axeron is the pay-fixed/receive-floating party in a 3 × 6 forward rate agreement (FRA) initiated 30 days earlier. Information on this existing FRA and current index rates are presented in Exhibits 1 and 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex020.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex021.webp\" style=\"max-width:min(100%,371px)\" alt=\"Exhibit\"><p>Gahbi Faddal, an Axeron swap trader, gathers the exchange rate and risk-free rate data to evaluate a fixed-for-fixed EUR / GBP currency swap. The terms of the swap and related information are given in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex022.webp\" style=\"max-width:min(100%,529px)\" alt=\"Exhibit\"><p>Axeron is the fixed-rate payer/floating-rate receiver in an annual reset USD interest rate swap. The USD 25,000,000 notional amount contract was created at-market with a 2.50% fixed rate and 4 years to maturity when initiated 1 year ago. Exhibit 4 contains current data for valuing USD fixed-for-floating interest rate swaps.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex023.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><p>Axeron is the equity-return receiver/fixed-rate payer in the swap described in Exhibit 5.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex024.webp\" style=\"max-width:min(100%,450px)\" alt=\"Exhibit\"><p>Unless otherwise noted, assume a 30/360 day-count convention applies to all pricing and valuation questions.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 5, for a quarter in which the total rate of return on the underlying equity was -1.50%, the cash flow from Axeron&#x27;s perspective is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q040.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":41,"q":"Which of Trussock's observations regarding the carry arbitrage model is (are) correct?","opts":["Only Observation 1","Only Observation 2","Both Observation 1 and Observation 2"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a041.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a041.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 41–44 · Derivatives<\/summary><div class=\"vig-body\"><p>Antoine Nim manages a bond portfolio for a small hedge fund. He contacts Julia Trussock, a derivatives trader at a bank. Nim intends to use bond forward and futures contracts to adjust portfolio risks and asks Trussock about the carry arbitrage model for pricing derivatives.<\/p><p>Trussock makes two observations regarding no-arbitrage bond forward prices:<\/p><p>Observation 1:Zero-coupon bond forward prices are always greater than their spot prices.<\/p><p>Observation 2:Forward prices for coupon bonds may be either greater or less than their spot prices, depending on the bond&#x27;s current yield relative to the risk-free rate.<\/p><p>Nim expects the European Central Bank (ECB) to raise its policy rate. He goes long a forward contract on a German government bond to profit from the market reaction he anticipates. Information on the contract is contained in Exhibit 1. At the time of the purchase, the government par bond yield curve is flat at 3%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex025.webp\" style=\"max-width:min(100%,445px)\" alt=\"Exhibit\"><p>Later that day, the ECB increases its policy rate as Nim expected. The ECB rate move has resulted in the German government bond yield curve inverting. Exhibit 2 contains information on the current government bond yield curve.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex026.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit\"><p>Nim&#x27;s portfolio contains an off-the-run German government bond that is deliverable against the standardized futures contract. Since the bond&#x27;s coupon rate differs from the futures contract coupon, Nim is uncertain if the futures contract is fairly valued relative to his bond. Nim asks Trussock to explain how to assess the relative fair value of the two instruments. Exhibit 3 contains information on the bond and the standardized futures contract. The 0.75-year risk-free rate is 3.50%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex027.webp\" style=\"max-width:min(100%,638px)\" alt=\"Exhibit\"><p>Another client of Trussock&#x27;s wants to lock in the rate on a 3-month loan to be taken 6 months in the future. Exhibit 4 contains selected data on the market reference rates (MRRs) used for pricing forward rate agreements (FRAs).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex028.webp\" style=\"max-width:min(100%,345px)\" alt=\"Exhibit\"><p>All interest rates are expressed as annual rates, and all instruments use the 30/360 day-count conventions.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Trussock&#x27;s observations regarding the carry arbitrage model is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q041.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":42,"q":"Based on Exhibit 1 and Exhibit 2, the no-arbitrage value of Nim's forward contract on the 5-year government bond is:","opts":["negative.","zero.","positive."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a042.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a042.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 41–44 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Antoine Nim manages a bond portfolio for a small hedge fund. He contacts Julia Trussock, a derivatives trader at a bank. Nim intends to use bond forward and futures contracts to adjust portfolio risks and asks Trussock about the carry arbitrage model for pricing derivatives.<\/p><p>Trussock makes two observations regarding no-arbitrage bond forward prices:<\/p><p>Observation 1:Zero-coupon bond forward prices are always greater than their spot prices.<\/p><p>Observation 2:Forward prices for coupon bonds may be either greater or less than their spot prices, depending on the bond&#x27;s current yield relative to the risk-free rate.<\/p><p>Nim expects the European Central Bank (ECB) to raise its policy rate. He goes long a forward contract on a German government bond to profit from the market reaction he anticipates. Information on the contract is contained in Exhibit 1. At the time of the purchase, the government par bond yield curve is flat at 3%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex025.webp\" style=\"max-width:min(100%,445px)\" alt=\"Exhibit\"><p>Later that day, the ECB increases its policy rate as Nim expected. The ECB rate move has resulted in the German government bond yield curve inverting. Exhibit 2 contains information on the current government bond yield curve.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex026.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit\"><p>Nim&#x27;s portfolio contains an off-the-run German government bond that is deliverable against the standardized futures contract. Since the bond&#x27;s coupon rate differs from the futures contract coupon, Nim is uncertain if the futures contract is fairly valued relative to his bond. Nim asks Trussock to explain how to assess the relative fair value of the two instruments. Exhibit 3 contains information on the bond and the standardized futures contract. The 0.75-year risk-free rate is 3.50%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex027.webp\" style=\"max-width:min(100%,638px)\" alt=\"Exhibit\"><p>Another client of Trussock&#x27;s wants to lock in the rate on a 3-month loan to be taken 6 months in the future. Exhibit 4 contains selected data on the market reference rates (MRRs) used for pricing forward rate agreements (FRAs).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex028.webp\" style=\"max-width:min(100%,345px)\" alt=\"Exhibit\"><p>All interest rates are expressed as annual rates, and all instruments use the 30/360 day-count conventions.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Exhibit 2, the no-arbitrage value of Nim&#x27;s forward contract on the 5-year government bond is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q042.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":43,"q":"Based on Exhibit 3 and the information provided, compared with the quoted futures price implied by the government bond in Nim's portfolio, the bond futures contract is relatively:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a043.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a043.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 41–44 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Antoine Nim manages a bond portfolio for a small hedge fund. He contacts Julia Trussock, a derivatives trader at a bank. Nim intends to use bond forward and futures contracts to adjust portfolio risks and asks Trussock about the carry arbitrage model for pricing derivatives.<\/p><p>Trussock makes two observations regarding no-arbitrage bond forward prices:<\/p><p>Observation 1:Zero-coupon bond forward prices are always greater than their spot prices.<\/p><p>Observation 2:Forward prices for coupon bonds may be either greater or less than their spot prices, depending on the bond&#x27;s current yield relative to the risk-free rate.<\/p><p>Nim expects the European Central Bank (ECB) to raise its policy rate. He goes long a forward contract on a German government bond to profit from the market reaction he anticipates. Information on the contract is contained in Exhibit 1. At the time of the purchase, the government par bond yield curve is flat at 3%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex025.webp\" style=\"max-width:min(100%,445px)\" alt=\"Exhibit\"><p>Later that day, the ECB increases its policy rate as Nim expected. The ECB rate move has resulted in the German government bond yield curve inverting. Exhibit 2 contains information on the current government bond yield curve.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex026.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit\"><p>Nim&#x27;s portfolio contains an off-the-run German government bond that is deliverable against the standardized futures contract. Since the bond&#x27;s coupon rate differs from the futures contract coupon, Nim is uncertain if the futures contract is fairly valued relative to his bond. Nim asks Trussock to explain how to assess the relative fair value of the two instruments. Exhibit 3 contains information on the bond and the standardized futures contract. The 0.75-year risk-free rate is 3.50%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex027.webp\" style=\"max-width:min(100%,638px)\" alt=\"Exhibit\"><p>Another client of Trussock&#x27;s wants to lock in the rate on a 3-month loan to be taken 6 months in the future. Exhibit 4 contains selected data on the market reference rates (MRRs) used for pricing forward rate agreements (FRAs).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex028.webp\" style=\"max-width:min(100%,345px)\" alt=\"Exhibit\"><p>All interest rates are expressed as annual rates, and all instruments use the 30/360 day-count conventions.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3 and the information provided, compared with the quoted futures price implied by the government bond in Nim&#x27;s portfolio, the bond futures contract is relatively:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q043.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":44,"q":"Based on Exhibit 4, Trussock should quote the fixed rate for a 6 × 9 FRA closest to:","opts":["3.05%","3.07%","3.08%"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a044.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a044.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 41–44 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Antoine Nim manages a bond portfolio for a small hedge fund. He contacts Julia Trussock, a derivatives trader at a bank. Nim intends to use bond forward and futures contracts to adjust portfolio risks and asks Trussock about the carry arbitrage model for pricing derivatives.<\/p><p>Trussock makes two observations regarding no-arbitrage bond forward prices:<\/p><p>Observation 1:Zero-coupon bond forward prices are always greater than their spot prices.<\/p><p>Observation 2:Forward prices for coupon bonds may be either greater or less than their spot prices, depending on the bond&#x27;s current yield relative to the risk-free rate.<\/p><p>Nim expects the European Central Bank (ECB) to raise its policy rate. He goes long a forward contract on a German government bond to profit from the market reaction he anticipates. Information on the contract is contained in Exhibit 1. At the time of the purchase, the government par bond yield curve is flat at 3%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex025.webp\" style=\"max-width:min(100%,445px)\" alt=\"Exhibit\"><p>Later that day, the ECB increases its policy rate as Nim expected. The ECB rate move has resulted in the German government bond yield curve inverting. Exhibit 2 contains information on the current government bond yield curve.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex026.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit\"><p>Nim&#x27;s portfolio contains an off-the-run German government bond that is deliverable against the standardized futures contract. Since the bond&#x27;s coupon rate differs from the futures contract coupon, Nim is uncertain if the futures contract is fairly valued relative to his bond. Nim asks Trussock to explain how to assess the relative fair value of the two instruments. Exhibit 3 contains information on the bond and the standardized futures contract. The 0.75-year risk-free rate is 3.50%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex027.webp\" style=\"max-width:min(100%,638px)\" alt=\"Exhibit\"><p>Another client of Trussock&#x27;s wants to lock in the rate on a 3-month loan to be taken 6 months in the future. Exhibit 4 contains selected data on the market reference rates (MRRs) used for pricing forward rate agreements (FRAs).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex028.webp\" style=\"max-width:min(100%,345px)\" alt=\"Exhibit\"><p>All interest rates are expressed as annual rates, and all instruments use the 30/360 day-count conventions.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 4, Trussock should quote the fixed rate for a 6 × 9 FRA closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q044.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":45,"q":"Based on Exhibit 1, a call on one share of Voltrin stock is best replicated by a portfolio consisting of:","opts":["long 0.3538 Voltrin shares and short 0.5100 shares of zero-coupon bonds.","long 0.3750 Voltrin shares and short 0.0250 shares of zero-coupon bonds.","long 0.6462 Voltrin shares and short 0.5100 shares of zero-coupon bonds."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a045.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a045.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 45–48 · Derivatives<\/summary><div class=\"vig-body\"><p>Samir Madeq, an experienced equity derivatives trader at a large bank, has been mentoring Alana Hernan, who was recently hired as a trainee after earning a degree in quantitative finance. Madeq wants to assess Hernan&#x27;s familiarity with the Black-Scholes-Merton (BSM) model and option pricing theory. Madeq asks Hernan to describe how a call option on Voltrin Corporation common stock can be replicated with positions in the underlying shares and risk-free bonds, using the inputs and selected outputs from a BSM valuation of the Voltrin options, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex029.webp\" style=\"max-width:min(100%,609px)\" alt=\"Exhibit\"><p>Madeq then turns the conversation to option Greeks. He asks Hernan to interpret (rho) relative to put options. She responds that put option values are inversely related to interest rate changes and provides two reasons:<\/p><p><b>Reason 1:<\/b> In the context of BSM, interest rates affect option values through their impact on the PV of the exercise price.<\/p><p><b>Reason 2:<\/b> BSM implies that a put option is equivalent to having a delta-weighted short position in the underlying shares. A higher interest rate implies a greater opportunity cost of not earning interest on short-sale proceeds.<\/p><p>Madeq then asks Hernan to describe the meaning of implied volatility and how it is used in assessing option values. In response, Hernan makes three statements regarding implied volatility:<\/p><p><b>Statement 1:<\/b> Implied volatility can be used as an estimate of future asset price volatility and therefore may be more insightful than historical volatility regarding market expectations.<\/p><p><b>Statement 2:<\/b> When investors perceive increased uncertainty about the future, the demand for options increases, resulting in higher option prices and increases in observed implied volatility.<\/p><p><b>Statement 3:<\/b> No-arbitrage pricing ensures that all options on the same underlying will have the same implied volatility regardless of strike price or time to expiration.<\/p><p>Madeq is long 2,500 call options with a 50 exercise price on Demino Corporation common stock. Madeq intends to create a delta-neutral call spread by selling calls with a 40 exercise price. Information concerning Demino common stock and call options is shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex030.webp\" style=\"max-width:min(100%,636px)\" alt=\"Exhibit\"><p>Assume each stock option contract is for one share of the underlying stock.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, a call on one share of Voltrin stock is best replicated by a portfolio consisting of:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q045.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":46,"q":"Which of Hernan's reasons for the positive correlation between interest rates and put option values is (are) correct?","opts":["Only Reason 1","Only Reason 2","Both Reason 1 and Reason 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a046.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a046.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 45–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Samir Madeq, an experienced equity derivatives trader at a large bank, has been mentoring Alana Hernan, who was recently hired as a trainee after earning a degree in quantitative finance. Madeq wants to assess Hernan&#x27;s familiarity with the Black-Scholes-Merton (BSM) model and option pricing theory. Madeq asks Hernan to describe how a call option on Voltrin Corporation common stock can be replicated with positions in the underlying shares and risk-free bonds, using the inputs and selected outputs from a BSM valuation of the Voltrin options, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex029.webp\" style=\"max-width:min(100%,609px)\" alt=\"Exhibit\"><p>Madeq then turns the conversation to option Greeks. He asks Hernan to interpret (rho) relative to put options. She responds that put option values are inversely related to interest rate changes and provides two reasons:<\/p><p><b>Reason 1:<\/b> In the context of BSM, interest rates affect option values through their impact on the PV of the exercise price.<\/p><p><b>Reason 2:<\/b> BSM implies that a put option is equivalent to having a delta-weighted short position in the underlying shares. A higher interest rate implies a greater opportunity cost of not earning interest on short-sale proceeds.<\/p><p>Madeq then asks Hernan to describe the meaning of implied volatility and how it is used in assessing option values. In response, Hernan makes three statements regarding implied volatility:<\/p><p><b>Statement 1:<\/b> Implied volatility can be used as an estimate of future asset price volatility and therefore may be more insightful than historical volatility regarding market expectations.<\/p><p><b>Statement 2:<\/b> When investors perceive increased uncertainty about the future, the demand for options increases, resulting in higher option prices and increases in observed implied volatility.<\/p><p><b>Statement 3:<\/b> No-arbitrage pricing ensures that all options on the same underlying will have the same implied volatility regardless of strike price or time to expiration.<\/p><p>Madeq is long 2,500 call options with a 50 exercise price on Demino Corporation common stock. Madeq intends to create a delta-neutral call spread by selling calls with a 40 exercise price. Information concerning Demino common stock and call options is shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex030.webp\" style=\"max-width:min(100%,636px)\" alt=\"Exhibit\"><p>Assume each stock option contract is for one share of the underlying stock.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Hernan&#x27;s reasons for the positive correlation between interest rates and put option values is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q046.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":47,"q":"Which two of Hernan's statements regarding implied volatility are correct?","opts":["Statements 1 and 2","Statements 1 and 3","Statements 2 and 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a047.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a047.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 45–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Samir Madeq, an experienced equity derivatives trader at a large bank, has been mentoring Alana Hernan, who was recently hired as a trainee after earning a degree in quantitative finance. Madeq wants to assess Hernan&#x27;s familiarity with the Black-Scholes-Merton (BSM) model and option pricing theory. Madeq asks Hernan to describe how a call opt s shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex030.webp\" style=\"max-width:min(100%,636px)\" alt=\"Exhibit\"><p>Assume each stock option contract is for one share of the underlying stock.<\/p><\/div><\/details><div class=\"qtext\"><p>Which two of Hernan&#x27;s statements regarding implied volatility are correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q047.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":48,"q":"Based on Exhibit 2 and the information provided, how many Demino calls with a 40 exercise price must be sold for Madeq to create a delta-neutral position?","opts":["1,364","1,625","1,731"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a048.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a048.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 45–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Samir Madeq, an experienced equity derivatives trader at a large bank, has been mentoring Alana Hernan, who was recently hired as a trainee after earning a degree in quantitative finance. Madeq wants to assess Hernan&#x27;s familiarity with the Black-Scholes-Merton (BSM) model and option pricing theory. Madeq asks Hernan to describe how a call option on Voltrin Corporation common stock can be replicated with positions in the underlying shares and risk-free bonds, using the inputs and selected outputs from a BSM valuation of the Voltrin options, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex029.webp\" style=\"max-width:min(100%,609px)\" alt=\"Exhibit\"><p>Madeq then turns the conversation to option Greeks. He asks Hernan to interpret (rho) relative to put options. She responds that put option values are inversely related to interest rate changes and provides two reasons:<\/p><p><b>Reason 1:<\/b> In the context of BSM, interest rates affect option values through their impact on the PV of the exercise price.<\/p><p><b>Reason 2:<\/b> BSM implies that a put option is equivalent to having a delta-weighted short position in the underlying shares. A higher interest rate implies a greater opportunity cost of not earning interest on short-sale proceeds.<\/p><p>Madeq then asks Hernan to describe the meaning of implied volatility and how it is used in assessing option values. In response, Hernan makes three statements regarding implied volatility:<\/p><p><b>Statement 1:<\/b> Implied volatility can be used as an estimate of future asset price volatility and therefore may be more insightful than historical volatility regarding market expectations.<\/p><p><b>Statement 2:<\/b> When investors perceive increased uncertainty about the future, the demand for options increases, resulting in higher option prices and increases in observed implied volatility.<\/p><p><b>Statement 3:<\/b> No-arbitrage pricing ensures that all options on the same underlying will have the same implied volatility regardless of strike price or time to expiration.<\/p><p>Madeq is long 2,500 call options with a 50 exercise price on Demino Corporation common stock. Madeq intends to create a delta-neutral call spread by selling calls with a 40 exercise price. Information concerning Demino common stock and call options is shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex030.webp\" style=\"max-width:min(100%,636px)\" alt=\"Exhibit\"><p>Assume each stock option contract is for one share of the underlying stock.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and the information provided, how many Demino calls with a 40 exercise price must be sold for Madeq to create a delta-neutral position?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q048.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":49,"q":"Young is short 10,000 shares of High-Grade just before the end of the trading session. If each option contract is for one share of stock, based on the information in Exhibit 1, the number of High-Grade 30 puts Young needs to sell to create a delta-neutral hedge is closest to:","opts":["3,538","15,475","28,265"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a049.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a049.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 49–54 · Derivatives<\/summary><div class=\"vig-body\"><p>Parasail Trading Corp. (Parasail) is a broker-dealer firm with several operating subsidiaries. One Parasail division is a market maker in over-the-counter stocks. Another division conducts proprietary trading in equities and equity options.<\/p><p>Parasail&#x27;s market-making unit operates under tight risk-management policies and requires traders to minimize market exposure by using options to hedge their overnight positions. Kerry Young is the trader responsible for making markets in High-Grade Gold Ltd. (High-Grade) and Pure Platinum Plus Inc. (Pure Platinum).<\/p><p>Young uses the Black-Scholes-Merton (BSM) model to evaluate options on High-Grade and Pure Platinum stock. Neither company pays dividends. All options on both stocks are trading at fair value according to the BSM model.<\/p><p>Options on High-Grade<\/p><p>Exhibit 1 contains the BSM model inputs for the stock price (S), strike price (X), risk-free rate (r), volatility (σ), time to expiration in years (T) and dividend yield (ẟ). The exhibit also contains selected BSM-model outputs.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex031.webp\" style=\"max-width:min(100%,648px)\" alt=\"Exhibit\"><p>Options on Pure Platinum<\/p><p>Young has a significant long position in Pure Platinum shares, which she intends to delta hedge with call options. Exhibit 2 contains information on Pure Platinum shares and options. These options have two months until expiration.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex032.webp\" style=\"max-width:min(100%,553px)\" alt=\"Exhibit\"><p>Options on Code Shift<\/p><p>Lee Philips is a managing director in Parasail&#x27;s proprietary trading business. Parasail currently holds 200,000 shares of Code Shift Programming (Code Shift) common stock. Although Code Shift is now a publicly traded company, the shares were acquired through Parasail&#x27;s participation in a round of venture funding before Code Shift&#x27;s initial public offering. The Code Shift shares are subject to a lockup agreement that expires in six months. Exhibit 3 contains information on Code Shift stock and options.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex033.webp\" style=\"max-width:min(100%,474px)\" alt=\"Exhibit\"><p>Philips intends to sell the Code Shift shares as soon as the lockup period expires. In the interim, Philips decides to sell call options against the shares to generate income. Two different call-writing strategies are being considered:<\/p><p>Strategy A: Sell 200,000 at-the-money (ATM) Code Shift calls having six months until expiration.<\/p><p>Strategy B: Sell 200,000 ATM Code Shift calls that have two months until expiration. When those options expire, sell another 200,000 ATM options that have two months until expiration. When the second group of options expires, sell<\/p><p>another 200,000 ATM calls that have two months until expiration.<\/p><p>Philips also has a 50,000-share short position in Nano Node Semiconductor Inc. (Nano Node). Philips decides to use Nano Node options to construct a delta-neutral hedge that has a positive gamma.<\/p><\/div><\/details><div class=\"qtext\"><p>Young is short 10,000 shares of High-Grade just before the end of the trading session. If each option contract is for one share of stock, based on the information in Exhibit 1, the number of High-Grade 30 puts Young needs to sell to create a delta-neutral hedge is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q049.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":50,"q":"Young intends to sell calls to construct a delta-neutral position in Pure Platinum but is concerned about her ability to manage the position. If each option contract is for one share of stock, and the Pure Platinum stock price increases by £5 over the first few minutes of the next trading session, which of the three options shown in Exhibit 2 will leave the position closest to delta neutral?","opts":["Option 1","Option 2","Option 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a050.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a050.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 49–54 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Parasail Trading Corp. (Parasail) is a broker-dealer firm with several operating subsidiaries. One Parasail division is a market maker in over-the-counter stocks. Another division conducts proprietary trading in equities and equity options.<\/p><p>Parasail&#x27;s market-making unit operates under tight risk-management policies and requires traders to minimize market exposure by using options to hedge their overnight positions. Kerry Young is the trader responsible for making markets in High-Grade Gold Ltd. (High-Grade) and Pure Platinum Plus Inc. (Pure Platinum).<\/p><p>Young uses the Black-Scholes-Merton (BSM) model to evaluate options on High-Grade and Pure Platinum stock. Neither company pays dividends. All options on both stocks are trading at fair value according to the BSM model.<\/p><p>Options on High-Grade<\/p><p>Exhibit 1 contains the BSM model inputs for the stock price (S), strike price (X), risk-free rate (r), volatility (σ), time to expiration in years (T) and dividend yield (ẟ). The exhibit also contains selected BSM-model outputs.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex031.webp\" style=\"max-width:min(100%,648px)\" alt=\"Exhibit\"><p>Options on Pure Platinum<\/p><p>Young has a significant long position in Pure Platinum shares, which she intends to delta hedge with call options. Exhibit 2 contains information on Pure Platinum shares and options. These options have two months until expiration.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex032.webp\" style=\"max-width:min(100%,553px)\" alt=\"Exhibit\"><p>Options on Code Shift<\/p><p>Lee Philips is a managing director in Parasail&#x27;s proprietary trading business. Parasail currently holds 200,000 shares of Code Shift Programming (Code Shift) common stock. Although Code Shift is now a publicly traded company, the shares were acquired through Parasail&#x27;s participation in a round of venture funding before Code Shift&#x27;s initial public offering. The Code Shift shares are subject to a lockup agreement that expires in six months. Exhibit 3 contains information on Code Shift stock and options.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex033.webp\" style=\"max-width:min(100%,474px)\" alt=\"Exhibit\"><p>Philips intends to sell the Code Shift shares as soon as the lockup period expires. In the interim, Philips decides to sell call options against the shares to generate income. Two different call-writing strategies are being considered:<\/p><p>Strategy A: Sell 200,000 at-the-money (ATM) Code Shift calls having six months until expiration.<\/p><p>Strategy B: Sell 200,000 ATM Code Shift calls that have two months until expiration. When those options expire, sell another 200,000 ATM options that have two months until expiration. When the second group of options expires, sell<\/p><p>another 200,000 ATM calls that have two months until expiration.<\/p><p>Philips also has a 50,000-share short position in Nano Node Semiconductor Inc. (Nano Node). Philips decides to use Nano Node options to construct a delta-neutral hedge that has a positive gamma.<\/p><\/div><\/details><div class=\"qtext\"><p>Young intends to sell calls to construct a delta-neutral position in Pure Platinum but is concerned about her ability to manage the position. If each option contract is for one share of stock, and the Pure Platinum stock price increases by £5 over the first few minutes of the next trading session, which of the three options shown in Exhibit 2 will leave the position closest to delta neutral?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q050.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":51,"q":"The values given for the implied volatility of the Pure Platinum options in Exhibit 2 are most appropriately estimated using:","opts":["the BSM model and the market price of Pure Platinum options.","the standard deviation of projected returns on Pure Platinum common stock.","the historic price volatility of the Pure Platinum options with the same strike price."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a051.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a051.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 49–54 · Derivatives ound of venture funding before Code Shift&#x27;s initial public offering. The Code Shift shares are subject to a lockup agreement that expires in six months. Exhibit 3 contains information on Code Shift stock and options.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex033.webp\" style=\"max-width:min(100%,474px)\" alt=\"Exhibit\"><p>Philips intends to sell the Code Shift shares as soon as the lockup period expires. In the interim, Philips decides to sell call options against the shares to generate income. Two different call-writing strategies are being considered:<\/p><p>Strategy A: Sell 200,000 at-the-money (ATM) Code Shift calls having six months until expiration.<\/p><p>Strategy B: Sell 200,000 ATM Code Shift calls that have two months until expiration. When those options expire, sell another 200,000 ATM options that have two months until expiration. When the second group of options expires, sell<\/p><p>another 200,000 ATM calls that have two months until expiration.<\/p><p>Philips also has a 50,000-share short position in Nano Node Semiconductor Inc. (Nano Node). Philips decides to use Nano Node options to construct a delta-neutral hedge that has a positive gamma.<\/p><\/div><\/details><div class=\"qtext\"><p>The values given for the implied volatility of the Pure Platinum options in Exhibit 2 are most appropriately estimated using:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q051.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":52,"q":"Regarding the strategies for writing options on Code Shift shares, which of the following is most likely an advantage of Strategy B over Strategy A? Strategy B has:","opts":["a more positive gamma.","a greater rate of time decay.","less sensitivity to Code Shift stock price changes."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a052.webp\" target=\"_blank\" rel=\"noo =\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex031.webp\" style=\"max-width:min(100%,648px)\" alt=\"Exhibit\"><p>Options on Pure Platinum<\/p><p>Young has a significant long position in Pure Platinum shares, which she intends to delta hedge with call options. Exhibit 2 contains information on Pure Platinum shares and options. These options have two months until expiration.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex032.webp\" style=\"max-width:min(100%,553px)\" alt=\"Exhibit\"><p>Options on Code Shift<\/p><p>Lee Philips is a managing director in Parasail&#x27;s proprietary trading business. Parasail currently holds 200,000 shares of Code Shift Programming (Code Shift) common stock. Although Code Shift is now a publicly traded company, the shares were acquired through Parasail&#x27;s participation in a round of venture funding before Code Shift&#x27;s initial public offering. The Code Shift shares are subject to a lockup agreement that expires in six months. Exhibit 3 contains information on Code Shift stock and options.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex033.webp\" style=\"max-width:min(100%,474px)\" alt=\"Exhibit\"><p>Philips intends to sell the Code Shift shares as soon as the lockup period expires. In the interim, Philips decides to sell call options against the shares to generate income. Two different call-writing strategies are being considered:<\/p><p>Strategy A: Sell 200,000 at-the-money (ATM) Code Shift calls having six months until expiration.<\/p><p>Strategy B: Sell 200,000 ATM Code Shift calls that have two months until expiration. When those options expire, sell another 200,000 ATM options that have two months until expiration. When the second group of options expires, sell<\/p><p>another 200,000 ATM calls that have two months until expiration.<\/p><p>Philips also has a 50,000-share short position in Nano Node Semiconductor Inc. (Nano Node). Philips decides to use Nano Node options to construct a delta-neutral hedge that has a positive gamma.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following trades will most effectively create a delta-neutral hedge with a positive gamma for the short position in Nano Node shares?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q054.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":55,"q":"Based on Exhibits 1 and 2, the 2 × 8 swap Tazenda initiated 1 month earlier has a current value (EUR) closest to:","opts":["223,143","224,881","227,360"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a055.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a055.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 55–58 · Derivatives<\/summary><div class=\"vig-body\"><p>Shanna Zephron is a risk management specialist at an international bank. She advises the bank&#x27;s corporate clients on the use of derivatives to manage interest rate and currency risk. Raymundo Mattis is responsible for overseeing the funding operations for Tazenda Group, a Germany-based multinational. Tazenda entered a EUR pay-fixed, receive-floating forward rate agreement (FRA) 1 month ago. Mattis wants Zephron to calculate the FRA&#x27;s current value. Information on the FRA is contained in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex034.webp\" style=\"max-width:min(100%,488px)\" alt=\"Exhibit\"><p>Exhibit 2 contains information on current EUR market reference rates (MRRs):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex035.webp\" style=\"max-width:min(100%,365px)\" alt=\"Exhibit\"><p>Mattis is also interested in entering a EUR interest rate swap to manage the interest rate risk of a floating-rate bond issued several years earlier. Exhibit 3 contains selected data on the bond:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex036.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Exhibit 4 shows the EUR spot interest rates used in valuing the swap:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex037.webp\" style=\"max-width:min(100%,297px)\" alt=\"Exhibit\"><p>Mattis wants to move some of Tazenda&#x27;s interest rate exposure between CHF and EUR. He asks Zephron for a quote on an at-market receive-fixed-EUR, pay-floating-CHF currency swap. The terms of the swap are shown in Exhibit<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex038.webp\" style=\"max-width:min(100%,464px)\" alt=\"Exhibit\"><p>5:<\/p><p>Mattis wants to make sure he understands the pricing and valuation of the currency swap described in Exhibit 5. Mattis states his understanding of those issues and asks Zephron whether his statements are correct.<\/p><p><b>Statement 1:<\/b> Currency swaps are effectively interest rate swaps with legs denominated in different currencies. Therefore, a fixed-rate leg in an at-market currency swap is the same as the fixed-rate leg of an otherwise equivalent fixed-for-floating interest swap in the same currency.<\/p><p><b>Statement 2:<\/b> The swap&#x27;s value is based on the difference between the value of two 3-year, semiannual-pay bonds that replicate the swap&#x27;s cash flows:<\/p><p>short a EUR 55 million par-value bond with 1.80% fixed coupon, and<\/p><p>long a CHF 50 million par-value bond with a floating-rate coupon that resets at the 6-month CHF MRR. Tazenda needs to raise debt funding for a UK-based subsidiary. Mattis views GBP fixed-rate borrowing costs as relatively attractive. However, the subsidiary primarily holds floating-rate assets. Mattis asks Zephron if a swap can be used to take advantage of attractive fixed-rate funding in GBP while better matching the effective financing rate to the subsidiary&#x27;s asset returns.<\/p><p>All the financial instruments in this scenario use the 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 2, the 2 × 8 swap Tazenda initiated 1 month earlier has a current value (EUR) closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q055.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":56,"q":"Based on Exhibits 3 and 4, the no-arbitrage price of an at-market 2-year fixed-for-floating EUR interest rate swap is closest to:","opts":["2.78%","3.13%","3.16%"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a056.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a056.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 55–58 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Shanna Zephron is a risk management specialist at an international bank. She advises the bank&#x27;s corporate clients on the use of derivatives to manage interest rate and currency risk. Raymundo Mattis is responsible for overseeing the funding operations for Tazenda Group, a Germany-based multinational. Tazenda entered a EUR pay-fixed, receive-floating forward rate agreement (FRA) 1 month ago. Mattis wants Zephron to calculate the FRA&#x27;s current value. Information on the FRA is contained in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex034.webp\" style=\"max-width:min(100%,488px)\" alt=\"Exhibit\"><p>Exhibit 2 contains information on current EUR market reference rates (MRRs):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex035.webp\" style=\"max-width:min(100%,365px)\" alt=\"Exhibit\"><p>Mattis is also interested in entering a EUR interest rate swap to manage the interest rate risk of a floating-rate bond issued several years earlier. Exhibit 3 contains selected data on the bond:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex036.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Exhibit 4 shows the EUR spot interest rates used in valuing the swap:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex037.webp\" style=\"max-width:min(100%,297px)\" alt=\"Exhibit\"><p>Mattis wants to move some of Tazenda&#x27;s interest rate exposure between CHF and EUR. He asks Zephron for a quote on an at-market receive-fixed-EUR, pay-floating-CHF currency swap. The terms of the swap are shown in Exhibit<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex038.webp\" style=\"max-width:min(100%,464px)\" alt=\"Exhibit\"><p>5:<\/p><p>Mattis wants to make sure he understands the pricing and valuation of the currency swap described in Exhibit 5. Mattis states his understanding of those issues and asks Zephron whether his statements are correct.<\/p><p><b>Statement 1:<\/b> Currency swaps are effectively interest rate swaps with legs denominated in different currencies. Therefore, a fixed-rate leg in an at-market currency swap is the same as the fixed-rate leg of an otherwise equivalent fixed-for-floating interest swap in the same currency.<\/p><p><b>Statement 2:<\/b> The swap&#x27;s value is based on the difference between the value of two 3-year, semiannual-pay bonds that replicate the swap&#x27;s cash flows:<\/p><p>short a EUR 55 million par-value bond with 1.80% fixed coupon, and<\/p><p>long a CHF 50 million par-value bond with a floating-rate coupon that resets at the 6-month CHF MRR. Tazenda needs to raise debt funding for a UK-based subsidiary. Mattis views GBP fixed-rate borrowing costs as relatively attractive. However, the subsidiary primarily holds floating-rate assets. Mattis asks Zephron if a swap can be used to take advantage of attractive fixed-rate funding in GBP while better matching the effective financing rate to the subsidiary&#x27;s asset returns.<\/p><p>All the financial instruments in this scenario use the 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 3 and 4, the no-arbitrage price of an at-market 2-year fixed-for-floating EUR interest rate swap is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q056.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":57,"q":"Which of Mattis's statements regarding the pricing and valuation of currency swaps is correct?","opts":["Only Statement 1","Only Statement 2","Neither Statement 1 nor Statement 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a057.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a057.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 55–58 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Shanna Zephron is a risk management specialist at an international bank. She advises the bank&#x27;s corporate clients on the use of derivatives to manage interest rate and currency risk. Raymundo Mattis is responsible for overseeing the funding operations for Tazenda Group, a Germany-based multinational. Tazenda entered a EUR pay-fixed, receive-floating forward rate agreement (FRA) 1 month ago. Mattis wants Zephron to calculate the FRA&#x27;s current value. Information on the FRA is contained in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex034.webp\" style=\"max-width:min(100%,488px)\" alt=\"Exhibit\"><p>Exhibit 2 contains information on current EUR market reference rates (MRRs):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex035.webp\" style=\"max-width:min(100%,365px)\" alt=\"Exhibit\"><p>Mattis is also interested in entering a EUR interest rate swap to manage the interest rate risk of a floating-rate bond issued several years earlier. Exhibit 3 contains selected data on the bond:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex036.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Exhibit 4 shows the EUR spot interest rates used in valuing the swap:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex037.webp\" style=\"max-width:min(100%,297px)\" alt=\"Exhibit\"><p>Mattis wants to move some of Tazenda&#x27;s interest rate exposure between CHF and EUR. He asks Zephron for a quote on an at-market receive-fixed-EUR, pay-floating-CHF currency swap. The terms of the swap are shown in Exhibit<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex038.webp\" style=\"max-width:min(100%,464px)\" alt=\"Exhibit\"><p>5:<\/p><p>Mattis wants to make sure he understands the pricing and valuation of the currency swap described in Exhibit 5. Mattis states his understanding of those issues and asks Zephron whether his statements are correct.<\/p><p><b>Statement 1:<\/b> Currency swaps are effectively interest rate swaps with legs denominated in different currencies. Therefore, a fixed-rate leg in an at-market currency swap is the same as the fixed-rate leg of an otherwise equivalent fixed-for-floating interest swap in the same currency.<\/p><p><b>Statement 2:<\/b> The swap&#x27;s value is based on the difference between the value of two 3-year, semiannual-pay bonds that replicate the swap&#x27;s cash flows:<\/p><p>short a EUR 55 million par-value bond with 1.80% fixed coupon, and<\/p><p>long a CHF 50 million par-value bond with a floating-rate coupon that resets at the 6-month CHF MRR. Tazenda needs to raise debt funding for a UK-based subsidiary. Mattis views GBP fixed-rate borrowing costs as relatively attractive. However, the subsidiary primarily holds floating-rate assets. Mattis asks Zephron if a swap can be used to take advantage of attractive fixed-rate funding in GBP while better matching the effective financing rate to the subsidiary&#x27;s asset returns.<\/p><p>All the financial instruments in this scenario use the 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Mattis&#x27;s statements regarding the pricing and valuation of currency swaps is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q057.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":58,"q":"If Tazenda raises fixed-rate GBP debt and uses a swap to better match the cash flows of its UK subsidiary's assets, which of the following swaps is most appropriate?","opts":["A pay-fixed, receive-floating GBP interest rate swap.","A receive-fixed, pay-floating GBP interest rate swap.","A receive-fixed-GBP, pay-floating-EUR currency swap."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a058.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a058.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 55–58 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Shanna Zephron is a risk management specialist at an international bank. She advises the bank&#x27;s corporate clients on the use of derivatives to manage interest rate and currency risk. Raymundo Mattis is responsible for overseeing the funding operations for Tazenda Group, a Germany-based multinational. Tazenda entered a EUR pay-fixed, receive-floating forward rate agreement (FRA) 1 month ago. Mattis wants Zephron to calculate the FRA&#x27;s current value. Information on the FRA is contained in Exhibit 1:<\/p><img class= ion par-value bond with a floating-rate coupon that resets at the 6-month CHF MRR. Tazenda needs to raise debt funding for a UK-based subsidiary. Mattis views GBP fixed-rate borrowing costs as relatively attractive. However, the subsidiary primarily holds floating-rate assets. Mattis asks Zephron if a swap can be used to take advantage of attractive fixed-rate funding in GBP while better matching the effective financing rate to the subsidiary&#x27;s asset returns.<\/p><p>All the financial instruments in this scenario use the 30/360 day-count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>If Tazenda raises fixed-rate GBP debt and uses a swap to better match the cash flows of its UK subsidiary&#x27;s assets, which of the following swaps is most appropriate?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q058.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":59,"q":"Which of Jall's statements) concerning volatility and the BSM model is (are) correct?","opts":["Only Statement 1","Only Statement 2","Both Statements 1 and 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a059.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a059.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 59–64 · Derivatives<\/summary><div class=\"vig-body\"><p>Mitoshi &amp; Santer Options Advisory for Clients<\/p><p>Mitoshi and Santer LLC (M&amp;S) is a firm that offers advisory services for high-net-worth clients and corporations. Javi Jalli is a senior derivatives consultant at M&amp;S.<\/p><p>Several M&amp;S clients have positions in Elephantine Airlines common stock, which does not pay a dividend. There are no exchange-traded options on Elephantine. Several clients have asked M&amp;S to evaluate over-the-counter (OTC) options on Elephantine shares. M&amp;S uses the Black-Scholes-Merton (BSM) model to evaluate equity options.<\/p><p>Options on Elephantine<\/p><p>Exhibit 1 contains the BSM model inputs and selected BSM model outputs.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex039.webp\" style=\"max-width:min(100%,640px)\" alt=\"Exhibit\"><p>Tim Smith, an employee of an M&amp;S client, contacts Jalli for advice on taking a leveraged position in Elephantine using OTC options. To confirm that his interpretations of BSM are correct, Smith makes several statements regarding volatility and asks Jalli if they are accurate.<\/p><p>Statement 1: The BSM model implies the volatility surface is flat and fixed over time, whereas implied volatility varies across strike prices and expirations and changes over time.<\/p><p>Statement 2: Implied volatility provides a means for comparing the relative value of different options on the same underlying.<\/p><p>Another M&amp;S client, Comper Halle, has a well-diversified equity portfolio in which Elephantine is the largest position. Halle meets with Jalli to discuss M&amp;S&#x27;s use of pricing models to value options and design trading strategies. To verify his understanding of the BSM approach to estimating option values, Halle states several of the assumptions upon which the BSM model is based.<\/p><p>Assumption 1: Options are continuously exercisable from purchase until expiration.<\/p><p>Assumption 2: Traders have full use of the proceeds from short sale of the underlying asset.<\/p><p>Assumption 3: Asset prices exhibit geometric Brownian motion and normally distributed returns.<\/p><p>Halle had requested that M&amp;S get a quote for an Elephantine 50 put to protect the value of his position in the stock. However, Halle is concerned that the put is too expensive and asks Jalli to recommend a less costly strategy to achieve his objective.<\/p><p>Halle asks Jalli about which types of derivatives could be used to manage the market risk of his equity portfolio. They discuss the relative benefits of options in equity indexes, index futures options, and equity swaptions. Jalli describes the models M&amp;S uses to assess the values of the various options.<\/p><p>Swaptions<\/p><p>M&amp;S has been retained by Peak Performance Manufacturing (Peak), an AA-rated company, for advice on debt financing alternatives. Peak is considering the issuance of a five-year fixed-rate bond. M&amp;S suggests that Peak can reduce its effective funding rate by using synthetic noncallable debt that is created by issuing a callable bond and selling a receiver swaption. M&amp;S advisors use the Black model to establish the terms of the swaption.<\/p><p>Exhibit 2 contains relevant interest rate information.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex040.webp\" style=\"max-width:min(100%,671px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of Jall&#x27;s statements) concerning volatility and the BSM model is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q059.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":60,"q":"Based on the information in Exhibit 1, which of the following is the most appropriate approach for valuing an Elaphantine 50 call using the BSM model?","opts":["The stock price multiplied by 0.7186 less the exercise price multiplied by 0.6431","The stock price multiplied by 0.7186 less the present value of the exercise price multiplied by 0.6431","The stock price multiplied by 0.5789 less the present value of the exercise price multiplied by 0.3668"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a060.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a060.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<d el is based.<\/p><p>Assumption 1: Options are continuously exercisable from purchase until expiration.<\/p><p>Assumption 2: Traders have full use of the proceeds from short sale of the underlying asset.<\/p><p>Assumption 3: Asset prices exhibit geometric Brownian motion and normally distributed returns.<\/p><p>Halle had requested that M&amp;S get a quote for an Elephantine 50 put to protect the value of his position in the stock. However, Halle is concerned that the put is too expensive and asks Jalli to recommend a less costly strategy to achieve his objective.<\/p><p>Halle asks Jalli about which types of derivatives could be used to manage the market risk of his equity portfolio. They discuss the relative benefits of options in equity indexes, index futures options, and equity swaptions. Jalli describes the models M&amp;S uses to assess the values of the various options.<\/p><p>Swaptions<\/p><p>M&amp;S has been retained by Peak Performance Manufacturing (Peak), an AA-rated company, for advice on debt financing alternatives. Peak is considering the issuance of a five-year fixed-rate bond. M&amp;S suggests that Peak can reduce its effective funding rate by using synthetic noncallable debt that is created by issuing a callable bond and selling a receiver swaption. M&amp;S advisors use the Black model to establish the terms of the swaption.<\/p><p>Exhibit 2 contains relevant interest rate information.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex040.webp\" style=\"max-width:min(100%,671px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on the information in Exhibit 1, which of the following is the most appropriate approach for valuing an Elaphantine 50 call using the BSM model?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q060.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":61,"q":"Which of Halle's stated assumptions is least likely an assu s least likely an assumption of the BSM model?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q061.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":62,"q":"Based on the information in Exhibit 1, a put on one share of Elephantine stock is best replicated by a portfolio consisting of:","opts":["long 0.3569 shares of a zero-coupon bond and short 0.2814 Elephantine shares.","long 0.6332 shares of a zero-coupon bond and short 0.4211 Elephantine shares.","long 0.6431 shares of a zero-coupon bond and short 0.7186 Elephantine shares."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a062.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a062.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 59–64 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mitoshi &amp; Santer Options Advisory for Clients<\/p><p>Mitoshi and Santer LLC (M&amp;S) is a firm that offers advisory services for high-net-worth clients and corporations. Javi Jalli is a senior derivatives consultant at M&amp;S.<\/p><p>Several M&amp;S clients have positions in Elephantine Airlines common stock, which does not pay a dividend. There are no exchange-traded options on Elephantine. Several clients have asked M&amp;S to evaluate over-the-counter (OTC) options on Elephantine shares. M&amp;S uses the Black-Scholes-Merton (BSM) model to evaluate equity options.<\/p><p>Options on Elephantine<\/p><p>Exhibit 1 contains the BSM model inputs and selected BSM model outputs.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex039.webp\" style=\"max-width:min(100%,640px)\" alt=\"Exhibit\"><p>Tim Smith, an employee of an M&amp;S client, contacts Jalli for advice on taking a leveraged position in Elephantine using OTC options. To confirm that his interpretations of BSM are correct, Smith makes several statements regarding volatility and asks Jalli if they are accurate.<\/p><p>Statement 1: The BSM model implies the volatility surface is flat and fixed over time, whereas implied volatility varies across strike prices and expirations and changes over time.<\/p><p>Statement 2: Implied volatility provides a means for comparing the relative value of different options on the same underlying.<\/p><p>Another M&amp;S client, Comper Halle, has a well-diversified equity portfolio in which Elephantine is the largest position. Halle meets with Jalli to discuss M&amp;S&#x27;s use of pricing models to value options and design trading strategies. To verify his understanding of the BSM approach to estimating option values, Halle states several of the assumptions upon which the BSM model is based.<\/p><p>Assumption 1: Options are continuously exercisable from purchase until expiration.<\/p><p>Assumption 2: Traders have full use of the proceeds from short sale of the underlying asset.<\/p><p>Assumption 3: Asset prices exhibit geometric Brownian motion and normally distributed returns.<\/p><p>Halle had requested that M&amp;S get a quote for an Elephantine 50 put to protect the value of his position in the stock. However, Halle is concerned that the put is too expensive and asks Jalli to recommend a less costly strategy to achieve his objective.<\/p><p>Halle asks Jalli about which types of derivatives could be used to manage the market risk of his equity portfolio. They discuss the relative benefits of options in equity indexes, index futures options, and equity swaptions. Jalli describes the models M&amp;S uses to assess the values of the various options.<\/p><p>Swaptions<\/p><p>M&amp;S has been retained by Peak Performance Manufacturing (Peak), an AA-rated company, for advice on debt financing alternatives. Peak is considering the issuance of a five-year fixed-rate bond. M&amp;S suggests that Peak can reduce its effective funding rate by using synthetic noncallable debt that is created by issuing a callable bond and selling a receiver swaption. M&amp;S advisors use the Black model to establish the terms of the swaption.<\/p><p>Exhibit 2 contains relevant interest rate information.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex040.webp\" style=\"max-width:min(100%,671px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on the information in Exhibit 1, a put on one share of Elephantine stock is best replicated by a portfolio consisting of:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q062.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":63,"q":"The Black model is most appropriate for valuing European call options on which of the following instruments?","opts":["Futures","Equities","Currencies"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a063.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a063.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 59–64 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mitoshi &amp; Santer Options Advisory for Clients<\/p><p>Mitoshi and Santer LLC (M&amp;S) is a firm that offers advisory services for high-net-worth clients and corporations. Javi Jalli is a senior derivatives consultant at M&amp;S.<\/p><p>Several M&amp;S clients have positions in Elephantine Airlines common stock, which does not pay a dividend. There are no exchange-traded options on Elephantine. Several clients have asked M&amp;S to evaluate over-the-counter (OTC) options on Elephantine shares. M&amp;S uses the Black-Scholes-Merton (BSM)
