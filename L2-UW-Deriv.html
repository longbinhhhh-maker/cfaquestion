the 30/360 day-count convention, and that all interest rates are stated on an annual compound basis.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 2, the no-arbitrage fixed rate on a new 3 × 9 FRA is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q017.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":18,"q":"All else equal, 30 days after initiation, the trading desk's 3 × 9 interest rate swap position will incur the greatest loss if the only change to the yield curve is a:","opts":["flattening.","steepening.","parallel upward shift."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a018.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a018.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 15–20 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sondra Schute manages an interest rate and fixed-income trading desk for an international bank. Rick Patere is a recently hired junior analyst supporting the desk. Schute wants to evaluate Patere&#x27;s understanding of forward commitment contracts and asks him to describe the valuation of bond forward and futures contracts. Patere says that forward and futures prices are similar conceptually, but there is a fundamental difference in the valuation of the two types of derivatives:<\/p><p><b>Statement 1:<\/b> The value of a forward contract after initiation is the future value of the difference between the agreed price in the existing contract and the no-arbitrage forward price of a contract initiated today, assuming both contracts are written on the same underlying bond and have the same expiration date.<\/p><p><b>Statement 2:<\/b> The value of a futures contract resets to zero after every trading session since there is a mark-to-market cash settlement equal to the change in the future&#x27;s price from the previous day&#x27;s settlement.<\/p><p>Schute asks Patere to assess the value of a bond futures contract relative to the underlying bond, using a risk-free rate of 1.00% and given the current data shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex011.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>A commercial loan officer has requested a quote for an at-market, pay-fixed, receive-floating 3 × 9 forward rate agreement (FRA) to hedge the interest rate on a future loan to a client. Schute directs Patere to calculate the fixed rate on an at-market FRA and then to describe how the value of the trading desk&#x27;s FRA position will be affected by shifts in the yield curve, as the receive-fixed, pay-floating party. Current reference index interest rate data is shown in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex012.webp\" style=\"max-width:min(100%,350px)\" alt=\"Exhibit\"><p>Exhibit 2:<\/p><p>Schute asks Patere to describe how he would value a pay-fixed, receive-floating, interest rate swap initiated 1 year ago. The swap has 2 years remaining until expiration and a fixed-leg coupon of 3%. Patere identifies two methods to value the swap. The value of the swap is equal to:<\/p><p><b>Method 1:<\/b> The present value of the difference between 3% and the coupon of the fixed-rate leg of a new at-market, annual payment, 2-year swap, assuming the same notional amount and floating-leg reference interest rate as the swap being valued.<\/p><p><b>Method 2:<\/b> The difference between the value of two 2-year annual-pay bonds with par values equal to the swap notional amount, assuming one bond has a 3% fixed-coupon rate and the other has a floating-rate coupon based on the same reference interest rate as the floating leg of the swap.<\/p><p>Schute directs Patere to price a 4-year, at-market interest rate swap based on the information in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex013.webp\" style=\"max-width:min(100%,491px)\" alt=\"Exhibit\"><p>Unless stated otherwise, assume all instruments have annual payment frequencies and use the 30/360 day-count convention, and that all interest rates are stated on an annual compound basis.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, 30 days after initiation, the trading desk&#x27;s 3 × 9 interest rate swap position will incur the greatest loss if the only change to the yield curve is a:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q018.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":19,"q":"Which method(s) described by Patere for valuing the fixed-for-floating interest rate swaps is (are) correct?","opts":["Only Method 1","Only Method 2","Both Method 1 and Method 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a019.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a019.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 15–20 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sondra Schute manages an interest rate and fixed-income trading desk for an international bank. Rick Patere is a recently hired junior analyst supporting the desk. Schute wants to evaluate Patere&#x27;s understanding of forward commitment contracts and asks him to describe the valuation of bond forward and futures contracts. Patere says that forward and futures prices are similar conceptually, but there is a fundamental difference in the valuation of the two types of derivatives:<\/p><p><b>Statement 1:<\/b> The value of a forward contract after initiation is the future value of the difference between the agreed price in the existing contract and the no-arbitrage forward price of a contract initiated today, assuming both contracts are written on the same underlying bond and have the same expiration date.<\/p><p><b>Statement 2:<\/b> The value of a futures contract resets to zero after every trading session since there is a mark-to-market cash settlement equal to the change in the future&#x27;s price from the previous day&#x27;s settlement.<\/p><p>Schute asks Patere to assess the value of a bond futures contract relative to the underlying bond, using a risk-free rate of 1.00% and given the current data shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex011.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>A commercial loan officer has requested a quote for an at-market, pay-fixed, receive-floating 3 × 9 forward rate agreement (FRA) to hedge the interest rate on a future loan to a client. Schute directs Patere to calculate the fixed rate on an at-market FRA and then to describe how the value of the trading desk&#x27;s FRA position will be affected by shifts in the yield curve, as the receive-fixed, pay-floating party. Current reference index interest rate data is shown in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex012.webp\" style=\"max-width:min(100%,350px)\" alt=\"Exhibit\"><p>Exhibit 2:<\/p><p>Schute asks Patere to describe how he would value a pay-fixed, receive-floating, interest rate swap initiated 1 year ago. The swap has 2 years remaining until expiration and a fixed-leg coupon of 3%. Patere identifies two methods to value the swap. The value of the swap is equal to:<\/p><p><b>Method 1:<\/b> The present value of the difference between 3% and the coupon of the fixed-rate leg of a new at-market, annual payment, 2-year swap, assuming the same notional amount and floating-leg reference interest rate as the swap being valued.<\/p><p><b>Method 2:<\/b> The difference between the value of two 2-year annual-pay bonds with par values equal to the swap notional amount, assuming one bond has a 3% fixed-coupon rate and the other has a floating-rate coupon based on the same reference interest rate as the floating leg of the swap.<\/p><p>Schute directs Patere to price a 4-year, at-market interest rate swap based on the information in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex013.webp\" style=\"max-width:min(100%,491px)\" alt=\"Exhibit\"><p>Unless stated otherwise, assume all instruments have annual payment frequencies and use the 30/360 day-count convention, and that all interest rates are stated on an annual compound basis.<\/p><\/div><\/details><div class=\"qtext\"><p>Which method(s) described by Patere for valuing the fixed-for-floating interest rate swaps is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q019.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":20,"q":"Based on Exhibit 3, the fixed rate on the 4-year, fixed-for-floating interest rate swap is closest to:","opts":["2.43%","2.54%","2.64%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a020.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a020.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 15–20 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sondra Schute manages an interest rate and fixed-income trading desk for an international bank. Rick Patere is a recently hired junior analyst supporting the desk. Schute wants to evaluate Patere&#x27;s understanding of forward commitment contracts and asks him to describe the valuation of bond forward and futures contracts. Patere says that forward and futures prices are similar conceptually, but there is a fundamental difference in the valuation of the two types of derivatives:<\/p><p><b>Statement 1:<\/b> The value of a forward contract after initiation is the future value of the difference between the agreed price in the existing contract and the no-arbitrage forward price of a contract initiated today, assuming both contracts are written on the same underlying bond and have the same expiration date.<\/p><p><b>Statement 2:<\/b> The value of a futures contract resets to zero after every trading session since there is a mark-to-market cash settlement equal to the change in the future&#x27;s price from the previous day&#x27;s settlement.<\/p><p>Schute asks Patere to assess the value of a bond futures contract relative to the underlying bond, using a risk-free rate of 1.00% and given the current data shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex011.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>A commercial loan officer has requested a quote for an at-market, pay-fixed, receive-floating 3 × 9 forward rate agreement (FRA) to hedge the interest rate on a future loan to a client. Schute directs Patere to calculate the fixed rate on an at-market FRA and then to describe how the value of the trading desk&#x27;s FRA position will be affected by shifts in the yield curve, as the receive-fixed, pay-floating party. Current reference index interest rate data is shown in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex012.webp\" style=\"max-width:min(100%,350px)\" alt=\"Exhibit\"><p>Exhibit 2:<\/p><p>Schute asks Patere to describe how he would value a pay-fixed, receive-floating, interest rate swap initiated 1 year ago. The swap has 2 years remaining until expiration and a fixed-leg coupon of 3%. Patere identifies two methods to value the swap. The value of the swap is equal to:<\/p><p><b>Method 1:<\/b> The present value of the difference between 3% and the coupon of the fixed-rate leg of a new at-market, annual payment, 2-year swap, assuming the same notional amount and floating-leg reference interest rate as the swap being valued.<\/p><p><b>Method 2:<\/b> The difference between the value of two 2-year annual-pay bonds with par values equal to the swap notional amount, assuming one bond has a 3% fixed-coupon rate and the other has a floating-rate coupon based on the same reference interest rate as the floating leg of the swap.<\/p><p>Schute directs Patere to price a 4-year, at-market interest rate swap based on the information in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex013.webp\" style=\"max-width:min(100%,491px)\" alt=\"Exhibit\"><p>Unless stated otherwise, assume all instruments have annual payment frequencies and use the 30/360 day-count convention, and that all interest rates are stated on an annual compound basis.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, the fixed rate on the 4-year, fixed-for-floating interest rate swap is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q020.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":21,"q":"Based on Exhibit 1, the calculated value (in USD) for the interest rate call is closest to:","opts":["3,116","5,823","5,988"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a021.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a021.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 21–24 · Derivatives<\/summary><div class=\"vig-body\"><p>Alexa Rohm, an option trader at a large hedge fund, is assisted by Brian Bosnik, a derivatives analyst that works at the firm. Rohm directs Bosnik to construct a binomial interest rate tree to value a $1 million notional 2.75% 2-year interest rate call. The binomial tree, based on a 50% probability of an up move, is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex014.webp\" style=\"max-width:min(100%,640px)\" alt=\"Exhibit\"><p>Rohm is considering the use of various option-pricing models to evaluate equity options. She asks Bosnik to provide a general description of how binomial models analyze European option values. In response Bosnik comments on the value of the option from a binomial tree:<\/p><p><b>Comment 1:<\/b> The value of an option is the PV of the expected payoffs.<\/p><p><b>Comment 2:<\/b> The payoffs reflect the cash flows at expiration from the exercise of the option if it is in the money, discounted at the investor&#x27;s required rate of return.<\/p><p><b>Comment 3:<\/b> The PVs of the expected payoffs are weighted by risk-neutral probabilities.<\/p><p>Rohm is long 5,000 shares of Positron Corporation&#x27;s common stock. Near the end of the day&#x27;s trading, she hedges the Positron stock holding by selling Positron equity calls to create a delta-neutral position. Exhibit 2 contains information on Positron stock and options:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex015.webp\" style=\"max-width:min(100%,548px)\" alt=\"Exhibit\"><p>The day after Rohm establishes the delta-neutral position in Positron, its stock opens at $65 per share at the beginning of the trading session.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the calculated value (in USD) for the interest rate call is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q021.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":22,"q":"Which of Bosnik's comments concerning the binomial valuation of a European option are correct?","opts":["Comments 1 and 2","Comments 1 and 3","Comments 2 and 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a022.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a022.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 21–24 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alexa Rohm, an option trader at a large hedge fund, is assisted by Brian Bosnik, a derivatives analyst that works at the firm. Rohm directs Bosnik to construct a binomial interest rate tree to value a $1 million notional 2.75% 2-year interest rate call. The binomial tree, based on a 50% probability of an up move, is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex014.webp\" style=\"max-width:min(100%,640px)\" alt=\"Exhibit\"><p>Rohm is considering the use of various option-pricing models to evaluate equity options. She asks Bosnik to provide a general description of how binomial models analyze European option values. In response Bosnik comments on the value of the option from a binomial tree:<\/p><p><b>Comment 1:<\/b> The value of an option is the PV of the expected payoffs.<\/p><p><b>Comment 2:<\/b> The payoffs reflect the cash flows at expiration from the exercise of the option if it is in the money, discounted at the investor&#x27;s required rate of return.<\/p><p><b>Comment 3:<\/b> The PVs of the expected payoffs are weighted by risk-neutral probabilities.<\/p><p>Rohm is long 5,000 shares of Positron Corporation&#x27;s common stock. Near the end of the day&#x27;s trading, she hedges the Positron stock holding by selling Positron equity calls to create a delta-neutral position. Exhibit 2 contains information on Positron stock and options:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex015.webp\" style=\"max-width:min(100%,548px)\" alt=\"Exhibit\"><p>The day after Rohm establishes the delta-neutral position in Positron, its stock opens at $65 per share at the beginning of the trading session.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Bosnik&#x27;s comments concerning the binomial valuation of a European option are correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q022.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":23,"q":"Based on Exhibit 2, the number of Positron calls that Rohm should have sold to create a delta- neutral position is closest to:","opts":["7,250","9,091","11,111"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a023.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a023.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 21–24 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alexa Rohm, an option trader at a large hedge fund, is assisted by Brian Bosnik, a derivatives analyst that works at the firm. Rohm directs Bosnik to construct a binomial interest rate tree to value a $1 million notional 2.75% 2-year interest rate call. The binomial tree, based on a 50% probability of an up move, is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex014.webp\" style=\"max-width:min(100%,640px)\" alt=\"Exhibit\"><p>Rohm is considering the use of various option-pricing models to evaluate equity options. She asks Bosnik to provide a general description of how binomial models analyze European option values. In response Bosnik comments on the value of the option from a binomial tree:<\/p><p><b>Comment 1:<\/b> The value of an option is the PV of the expected payoffs.<\/p><p><b>Comment 2:<\/b> The payoffs reflect the cash flows at expiration from the exercise of the option if it is in the money, discounted at the investor&#x27;s required rate of return.<\/p><p><b>Comment 3:<\/b> The PVs of the expected payoffs are weighted by risk-neutral probabilities.<\/p><p>Rohm is long 5,000 shares of Positron Corporation&#x27;s common stock. Near the end of the day&#x27;s trading, she hedges the Positron stock holding by selling Positron equity calls to create a delta-neutral position. Exhibit 2 contains information on Positron stock and options:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex015.webp\" style=\"max-width:min(100%,548px)\" alt=\"Exhibit\"><p>The day after Rohm establishes the delta-neutral position in Positron, its stock opens at $65 per share at the beginning of the trading session.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, the number of Positron calls that Rohm should have sold to create a delta- neutral position is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q023.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":24,"q":"Based on Exhibit 2 and the Positron price increase at the beginning of the trading session, the delta of the hedged position most likely:","opts":["decreases.","remains the same.","increases."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a024.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a024.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 21–24 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alexa Rohm, an option trader at a large hedge fund, is assisted by Brian Bosnik, a derivatives analyst that works at the firm. Rohm directs Bosnik to construct a binomial interest rate tree to value a $1 million notional 2.75% 2-year interest rate call. The binomial tree, based on a 50% probability of an up move, is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex014.webp\" style=\"max-width:min(100%,640px)\" alt=\"Exhibit\"><p>Rohm is considering the use of various option-pricing models to evaluate equity options. She asks Bosnik to provide a general description of how binomial models analyze European option values. In response Bosnik comments on the value of the option from a binomial tree:<\/p><p><b>Comment 1:<\/b> The value of an option is the PV of the expected payoffs.<\/p><p><b>Comment 2:<\/b> The payoffs reflect the cash flows at expiration from the exercise of the option if it is in the money, discounted at the investor&#x27;s required rate of return.<\/p><p><b>Comment 3:<\/b> The PVs of the expected payoffs are weighted by risk-neutral probabilities.<\/p><p>Rohm is long 5,000 shares of Positron Corporation&#x27;s common stock. Near the end of the day&#x27;s trading, she hedges the Positron stock holding by selling Positron equity calls to create a delta-neutral position. Exhibit 2 contains information on Positron stock and options:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex015.webp\" style=\"max-width:min(100%,548px)\" alt=\"Exhibit\"><p>The day after Rohm establishes the delta-neutral position in Positron, its stock opens at $65 per share at the beginning of the trading session.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and the Positron price increase at the beginning of the trading session, the delta of the hedged position most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q024.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":25,"q":"Using a 1-period binomial model and the information in Exhibit 1, the value of the call with a $50 exercise price is closest to:","opts":["$2.91","$3.64","$3.75"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a025.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a025.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 25–30 · Derivatives<\/summary><div class=\"vig-body\"><p>Parker Brookes, CFA, works for a portfolio management firm that invests in options to hedge its equity positions. Brookes is analyzing equity options for Alphatron, Inc. and Omegasys Corp. The relevant information for each company is provided in Exhibits 1 and 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex016.webp\" style=\"max-width:min(100%,487px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex017.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><p>Exhibit 3 shows the information for Alphatron options. All the options are European options that expire in one year, and each option allows the holder to purchase or sell one share of Alphatron common stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex018.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><p>Neither Alphatron nor Omegasys currently pays a dividend.<\/p><p>While talking with a colleague, Brookes makes the following statements about the expectations approach for valuing options:<\/p><p><b>Statement 1:<\/b> The expectations approach relies on the investor&#x27;s subjective belief as to how the underlying asset will move.<\/p><p><b>Statement 2:<\/b> The discount rate used for the expectations approach is not adjusted for the investor&#x27;s risk preferences.<\/p><\/div><\/details><div class=\"qtext\"><p>Using a 1-period binomial model and the information in Exhibit 1, the value of the call with a $50 exercise price is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q025.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":26,"q":"Based on Exhibits 1 and 3, if Brookes believes that an arbitrage opportunity exists for the Alphatron call with the $55 strike price, which of the following is the most appropriate way to exploit the opportunity?","opts":["Buy one call option and sell Alphatron stock","Sell one call option and buy Alphatron stock","Sell one call option and sell Alphatron stock"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a026.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a026.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 25–30 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Parker Brookes, CFA, works for a portfolio management firm that invests in options to hedge its equity positions. Brookes is analyzing equity options for Alphatron, Inc. and Omegasys Corp. The relevant information for each company is provided in Exhibits 1 and 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex016.webp\" style=\"max-width:min(100%,487px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex017.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><p>Exhibit 3 shows the information for Alphatron options. All the options are European options that expire in one year, and each option allows the holder to purchase or sell one share of Alphatron common stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex018.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><p>Neither Alphatron nor Omegasys currently pays a dividend.<\/p><p>While talking with a colleague, Brookes makes the following statements about the expectations approach for valuing options:<\/p><p><b>Statement 1:<\/b> The expectations approach relies on the investor&#x27;s subjective belief as to how the underlying asset will move.<\/p><p><b>Statement 2:<\/b> The discount rate used for the expectations approach is not adjusted for the investor&#x27;s risk preferences.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 3, if Brookes believes that an arbitrage opportunity exists for the Alphatron call with the $55 strike price, which of the following is the most appropriate way to exploit the opportunity?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q026.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":27,"q":"Based on Exhibit 2, today's value (in $) of an Omegasys two-year European put option with a $70 strike price is closest to:","opts":["6.49","6.72","6.96"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a027.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a027.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 25–30 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Parker Brookes, CFA, works for a portfolio management firm that invests in options to hedge its equity positions. Brookes is analyzing equity options for Alphatron, Inc. and Omegasys Corp. The relevant information for each company is provided in Exhibits 1 and 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex016.webp\" style=\"max-width:min(100%,487px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex017.webp\" style=\"max-width:m ks for a portfolio management firm that invests in options to hedge its equity positions. Brookes is analyzing equity options for Alphatron, Inc. and Omegasys Corp. The relevant information for each company is provided in Exhibits 1 and 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex016.webp\" style=\"max-width:min(100%,487px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex017.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><p>Exhibit 3 shows the information for Alphatron options. All the options are European options that expire in one year, and each option allows the holder to purchase or sell one share of Alphatron common stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex018.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><p>Neither Alphatron nor Omegasys currently pays a dividend.<\/p><p>While talking with a colleague, Brookes makes the following statements about the expectations approach for valuing options:<\/p><p><b>Statement 1:<\/b> The expectations approach relies on the investor&#x27;s subjective belief as to how the underlying asset will move.<\/p><p><b>Statement 2:<\/b> The discount rate used for the expectations approach is not adjusted for the investor&#x27;s risk preferences.<\/p><\/div><\/details><div class=\"qtext\"><p>Brookes&#x27;s firm holds American-style put and call options on Omegasys; both options have two years until expiry and a strike price of $80. Based on Exhibit 2, it would be advantageous for<\/p><p>Brookes to exercise:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q028.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":29,"q":"Which of Brookes's statements) is correct?","opts":["Statement 1","Statement 2","Neither statement"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a029.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a029.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 25–30 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Parker Brookes, CFA, works for a portfolio management firm that invests in options to hedge its equity positions. Brookes is analyzing equity options for Alphatron, Inc. and Omegasys Corp. The relevant information for each company is provided in Exhibits 1 and 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex016.webp\" style=\"max-width:min(100%,487px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex017.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><p>Exhibit 3 shows the information for Alphatron options. All the options are European options that expire in one year, and each option allows the holder to purchase or sell one share of Alphatron common stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex018.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><p>Neither Alphatron nor Omegasys currently pays a dividend.<\/p><p>While talking with a colleague, Brookes makes the following statements about the expectations approach for valuing options:<\/p><p><b>Statement 1:<\/b> The expectations approach relies on the investor&#x27;s subjective belief as to how the underlying asset will move.<\/p><p><b>Statement 2:<\/b> The discount rate used for the expectations approach is not adjusted for the investor&#x27;s risk preferences.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Brookes&#x27;s statements) is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q029.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":30,"q":"Brookes is analyzing a two-year put with a strike of 88 on Omegasys stock. If the put can be exercised at the end of Year 1, the hedge ratio at Time 0 is closest to:","opts":["-0.50","-0.45","0.50"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a030.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a030.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 25–30 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Parker Brookes, CFA, works for a portfolio management firm that invests in options to hedge its equity positions. Brookes is analyzing equity options for Alphatron, Inc. and Omegasys Corp. The relevant information for each company is provided in Exhibits 1 and 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex016.webp\" style=\"max-width:min(100%,487px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex017.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><p>Exhibit 3 shows the information for Alphatron options. All the options are European options that expire in one year, and each option allows the holder to purchase or sell one share of Alphatron common stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex018.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><p>Neither Alphatron nor Omegasys currently pays a dividend.<\/p><p>While talking with a colleague, Brookes makes the following statements about the expectations approach for valuing options:<\/p><p><b>Statement 1:<\/b> The expectations approach relies on the investor&#x27;s subjective belief as to how the underlying asset will move.<\/p><p><b>Statement 2:<\/b> The discount rate used for the expectations approach is not adjusted for the investor&#x27;s risk preferences.<\/p><\/div><\/details><div class=\"qtext\"><p>Brookes is analyzing a two-year put with a strike of 88 on Omegasys stock. If the put can be exercised at the end of Year 1, the hedge ratio at Time 0 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q030.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":31,"q":"Which of the following positions is most appropriately identified as being equivalent to a pay- fixed, receive-floating FRA?","opts":["Short an interest rate call and long an interest rate put","Long an interest rate call and short an interest rate put","Long an interest rate cap and short an interest rate floor"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a031.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a031.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 31–34 · Derivatives<\/summary><div class=\"vig-body\"><p>Yannes Bolger is a newly hired junior analyst at a derivatives trading firm, working on an interest rate option trading desk managed by Hidemi Okura. To assess Bolger&#x27;s understanding of derivatives, Okura first asks him which combination of interest rate puts and calls is most similar to a pay-fixed, receive-floating forward rate agreement (FRA).<\/p><p>She then asks Bolger to identify which of the strategies below is equivalent to being short an interest rate cap and long an interest rate floor, assuming both options are 1-year contracts based on the 3-month market reference rate (MRR), with quarterly settlement payments, 3% exercise rates, and $1 million notional amounts.<\/p><p><b>Strategy 1:<\/b> Positions in two $1 million par value 1-year bonds that pay interest quarterly: long a floating-rate bond with a coupon rate based on the 3-month MRR, and short a 3% fixed-coupon bond.<\/p><p><b>Strategy 2:<\/b> A 1-year, $1 million notional, quarterly settled, receive-fixed, pay-floating interest rate swap with a 3% fixed-rate leg and a floating-rate leg based on the 3-month MRR.<\/p><p><b>Strategy 3:<\/b> Long a payer swaption on a 1-year, quarterly settled, $1 million notional swap with a 3% fixed-rate leg and a floating-rate leg based on the 3-month MRR.<\/p><p>A corporate client contacts Okura for advice on structuring a debt offering. The client wants to borrow at a fixed cost for a specified maturity but expects interest rates to rise over the next few years. The client believes the bond market is underpricing interest rate options relative to the derivatives market. Therefore, the client asks how interest rate options might be used to achieve the preferred fixed-rate funding for the specified maturity while also reducing financing costs by taking advantage of the mispricing of embedded calls in the bond market.<\/p><p>Another client has requested a quote on a €10 million notional amount, 2-year, 4% European interest rate put. Okura asks Bolger to value the put option using the binomial interest rate tree shown in Exhibit 1. Assume all instruments use a 30/360 day-count convention.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex019.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following positions is most appropriately identified as being equivalent to a pay- fixed, receive-floating FRA?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q031.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":32,"q":"Regarding Okura's question, which strategy is equivalent to being short an interest rate cap and long an interest rate floor?","opts":["Strategy 1","Strategy 2","Strategy 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a032.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a032.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 31–34 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yannes Bolger is a newly hired junior analyst at a derivatives trading firm, working on an interest rate option trading desk managed by Hidemi Okura. To assess Bolger&#x27;s understanding of derivatives, Okura first asks him which combination of interest rate puts and calls is most similar to a pay-fixed, receive-floating forward rate agreement (FRA).<\/p><p>She then asks Bolger to identify which of the strategies below is equivalent to being short an interest rate cap and long an interest rate floor, assuming both options are 1-year contracts based on the 3-month market reference rate (MRR), with quarterly settlement payments, 3% exercise rates, and $1 million notional amounts.<\/p><p><b>Strategy 1:<\/b> Positions in two $1 million par value 1-year bonds that pay interest quarterly: long a floating-rate bond with a coupon rate based on the 3-month MRR, and short a 3% fixed-coupon bond.<\/p><p><b>Strategy 2:<\/b> A 1-year, $1 million notional, quarterly settled, receive-fixed, pay-floating interest rate swap with a 3% fixed-rate leg and a floating-rate leg based on the 3-month MRR.<\/p><p><b>Strategy 3:<\/b> Long a payer swaption on a 1-year, quarterly settled, $1 million notional swap with a 3% fixed-rate leg and a floating-rate leg based on the 3-month MRR.<\/p><p>A corporate client contacts Okura for advice on structuring a debt offering. The client wants to borrow at a fixed cost for a specified maturity but expects interest rates to rise over the next few years. The client believes the bond market is underpricing interest rate options relative to the derivatives market. Therefore, the client asks how interest rate options might be used to achieve the preferred fixed-rate funding for the specified maturity while also reducing financing costs by taking advantage of the mispricing of embedded calls in the bond market.<\/p><p>Another client has requested a quote on a €10 million notional amount, 2-year, 4% European interest rate put. Okura asks Bolger to value the put option using the binomial interest rate tree shown in Exhibit 1. Assume all instruments use a 30/360 day-count convention.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex019.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Regarding Okura&#x27;s question, which strategy is equivalent to being short an interest rate cap and long an interest rate floor?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q032.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":33,"q":"Given an underpricing of options in the corporate bond market, the most effective strategy to achieve the client's goal of borrowing at a fixed cost while reducing borrowing costs is to issue:","opts":["callable bonds and sell a payer swaption.","callable bonds and sell a receiver swaption.","noncallable bonds and buy a receiver swaption."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a033.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a033.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 31–34 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yannes Bolger is a newly hired junior analyst at a derivatives trading firm, working on an interest rate option trading desk managed by Hidemi Okura. To assess Bolger&#x27;s understanding of derivatives, Okura first asks him which combination of interest rate puts and calls is most similar to a pay-fixed, receive-floating forward rate agreement (FRA).<\/p><p>She then asks Bolger to identify which of the strategies below is equivalent to being short an interest rate cap and long an interest rate floor, assuming both options are 1-year contracts based on the 3-month market reference rate (MRR), with quarterly settlement payments, 3% exercise rates, and $1 million notional amounts.<\/p><p><b>Strategy 1:<\/b> Positions in two $1 million par value 1-year bonds that pay interest quarterly: long a floating-rate bond with a coupon rate based on the 3-month MRR, and short a 3% fixed-coupon bond.<\/p><p><b>Strategy 2:<\/b> A 1-year, $1 million notional, quarterly settled, receive-fixed, pay-floating interest rate swap with a 3% fixed-rate leg and a floating-rate leg based on the 3-month MRR.<\/p><p><b>Strategy 3:<\/b> Long a payer swaption on a 1-year, quarterly settled, $1 million notional swap with a 3% fixed-rate leg and a floating-rate leg based on the 3-month MRR.<\/p><p>A corporate client contacts Okura for advice on structuring a debt offering. The client wants to borrow at a fixed cost for a specified maturity but expects interest rates to rise over the next few years. The client believes the bond market is underpricing interest rate options relative to the derivatives market. Therefore, the client asks how interest rate options might be used to achieve the preferred fixed-rate funding for the specified maturity while also reducing financing costs by taking advantage of the mispricing of embedded calls in the bond market.<\/p><p>Another client has requested a quote on a €10 million notional amount, 2-year, 4% European interest rate put. Okura asks Bolger to value the put option using the binomial interest rate tree shown in Exhibit 1. Assume all instruments use a 30/360 day-count convention.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex019.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Given an underpricing of options in the corporate bond market, the most effective strategy to achieve the client&#x27;s goal of borrowing at a fixed cost while reducing borrowing costs is to issue:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q033.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":34,"q":"Based on Exhibit 1, the value of the 2-year 4% interest rate put is closest to:","opts":["€24,430","€25,750","€81,350"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a034.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a034.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 31–34 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yannes Bolger is a newly hired junior analyst at a derivatives trading firm, working on an interest rate option trading desk managed by Hidemi Okura. To assess Bolger&#x27;s understanding of derivatives, Okura first asks him which combination of interest rate puts and calls is most similar to a pay-fixed, receive-floating forward rate agreement (FRA).<\/p><p>She then asks Bolger to identify which of the strategies below is equivalent to being short an interest rate cap and long an interest rate floor, assuming both options are 1-year contracts based on the 3-month market reference rate (MRR), with quarterly settlement payments, 3% exercise rates, and $1 million notional amounts.<\/p><p><b>Strategy 1:<\/b> Positions in two $1 million par value 1-year bonds that pay interest quarterly: long a floating-rate bond with a coupon rate based on the 3-month MRR, and short a 3% fixed-coupon bond.<\/p><p><b>Strategy 2:<\/b> A 1-year, $1 million notional, quarterly settled, receive-fixed, pay-floating interest rate swap with a 3% fixed-rate leg and a floating-rate leg based on the 3-month MRR.<\/p><p><b>Strategy 3:<\/b> Long a payer swaption on a 1-year, quarterly settled, $1 million notional swap with a 3% fixed-rate leg and a floating-rate leg based on the 3-month MRR.<\/p><p>A corporate client contacts Okura for advice on structuring a debt offering. The client wants to borrow at a fixed cost for a specified maturity but expects interest rates to rise over the next few years. The client believes the bond market is underpricing interest rate options relative to the derivatives market. Therefore, the client asks how interest rate options might be used to achieve the preferred fixed-rate funding for the specified maturity while also reducing financing costs by taking advantage of the mispricing of embedded calls in the bond market.<\/p><p>Another client has requested a quote on a €10 million notional amount, 2-year, 4% European interest rate put. Okura asks Bolger to value the put option using the binomial interest rate tree shown in Exhibit 1. Assume all instruments use a 30/360 day-count convention.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex019.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the value of the 2-year 4% interest rate put is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q034.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":35,"q":"Which of the statements concerning futures and forward contracts should Tano most appropriately identify as correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a035.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a035.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 35–40 · Derivatives<\/summary><div class=\"vig-body\"><p>Axeron Financial Corporation<\/p><p>Axeron is a proprietary trading firm that invests in securities and derivatives markets around the world. The firm uses the carry arbitrage model to identify when forward commitment derivatives appear to be mispriced relative to the underlying asset.<\/p><p>Nichi Tano, CFA, who manages a derivatives-trading desk for Axeron, is overseeing the training of Ralle Mittan, a new research associate. To assess Mittan&#x27;s familiarity with equity derivatives, Tano asks her to evaluate the accuracy of the following statements regarding otherwise equivalent (ie, same underlying asset, same expiration date) equity futures and forward contracts:<\/p><p><b>Statement 1:<\/b> Long futures and forward positions exhibit the same pattern of cash flows over the time to expiration.<\/p><p><b>Statement 2:<\/b> The no-arbitrage value of futures and forward contracts is the same given the same time to expiration.<\/p><p><b>Statement 3:<\/b> Futures and forward prices decrease by similar amounts if the expected dividends from holding the underlying increase.<\/p><p>After discussing these statements, Tano asks Mittan to describe the elements of the arbitrage carry model and address what effect, if any, an increase in the risk-free rate has on equity forward prices.<\/p><p>Axeron is the pay-fixed/receive-floating party in a 3 × 6 forward rate agreement (FRA) initiated 30 days earlier. Information on this existing FRA and current index rates are presented in Exhibits 1 and 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex020.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex021.webp\" style=\"max-width:min(100%,371px)\" alt=\"Exhibit\"><p>Gahbi Faddal, an Axeron swap trader, gathers the exchange rate and risk-free rate data to evaluate a fixed-for-fixed EUR / GBP currency swap. The terms of the swap and related information are given in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex022.webp\" style=\"max-width:min(100%,529px)\" alt=\"Exhibit\"><p>Axeron is the fixed-rate payer/floating-rate receiver in an annual reset USD interest rate swap. The USD 25,000,000 notional amount contract was created at-market with a 2.50% fixed rate and 4 years to maturity when initiated 1 year ago. Exhibit 4 contains current data for valuing USD fixed-for-floating interest rate swaps.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex023.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><p>Axeron is the equity-return receiver/fixed-rate payer in the swap described in Exhibit 5.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-deriv/ex024.webp\" style=\"max-width:min(100%,450px)\" alt=\"Exhibit\"><p>Unless otherwise noted, assume a 30/360 day-count convention applies to all pricing and valuation questions.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the statements concerning futures and forward contracts should Tano most appropriately identify as correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-deriv/q035.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":36,"q":"In response to Tano's question, Mittan's most appropriate reply is that, all else equal, if the risk- free rate increases, an equity forward price will:","opts":["decrease.","remain unchanged.","increase."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-deriv/a036.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-deriv/a036.webp\" al
