<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

o is not simply the average of\nthestandard deviations of the individual shares. Investment 2 offers a lower standard deviation of return than the\naverage of its individual components due to the correlations or interactions between the individual securities.\nTherefore, Investment 1's standard deviation is most likely higher, not equal to, or lower than Investment 2's\nstandard deviation.\nB. Incorrect because Investment 2's standard deviation of an equally weighted portfolio is not simply the average of\nthe standard deviations of the individual shares. Investment 2 offers a lower standard deviation of return than the\naverage of its individual components due to the correlations or interactions between the individual securities.\nTherefore, Investment 1's standard deviation is most likely higher, not equal to, or lower than Investment 2's\nstandard deviation.\nsecurity. However, the same does not hold true for the portfolio standard deviation. That is, the standard deviation\nof an equally weighted portfolio is not simply the average of the standard deviations of the individual shares.\nInvestment 2 offers a lower standard deviation of return than the average of its individual components due to the\ncorrelations or interactions between the individual securities.\nPortfolio Management: An Overview\n·describe the portfolio approach to investing", "qhtml": null}, {"n": 18, "q": "Which of the following is a characteristic of both a forward contract and a\ncontingent claim?", "opts": ["The derivative contract has a positive value at contract initiation", "The payoff of the derivative contract is dependent on the payoff of an underlying asset", "Each party of the derivative contract is required to engage in a transaction at a later point in time"], "ans": "B", "expl": "A. Incorrect because forward contracts have zero value at the start.\nB. Correct because a contingent claim is a derivative in which the outcome or payoff is dependent on the outcome or\npayoff of an underlying asset. Although this characteristic is also associated with forward commitments, a\non the performance of the underlying.\nC. Incorrect because forward commitments are contracts entered into at one point in time that require both parties to\ncontingent claim has come to be associated with a right, but not an obligation, to make a final payment contingent\non the performance of the underlying.\nDerivative Instrument and Derivative Market Features\n· describe the basic features of derivative markets, and contrast over-the-counter and exchange-traded derivative\nmarkets\nDiscuss\nFilter\ni\nDiscussion", "qhtml": null}, {"n": 19, "q": "Alternative investments are most likely characterized by:", "opts": ["less transparency than traditional investments.", "a less complex fee structure than traditional investments.", "fewer restrictions on redemptions than traditional investments."], "ans": "A", "expl": "A. Correct because fund investment structures for alternative investments differ substantially from traditional public\nequity and fixed-income fund or ETF investments. For example, alternative funds usually involve less frequent\nstructures.\nC. Incorrect because alternative investments differ from traditional asset classes in\nthat they involve longer time horizons, unique patterns of cash flows, the use of leverage, illiquid positions, more\ncomplex fee structures, different tax and accounting treatment, and so on. Special provisions also exist for the\nlockup and redemption of capital from investors.\nAlternative Investment Features, Methods, and Structures\n· describe features and categories of alternative investments\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 20, "q": "An equity fund manager is considering a market index as the benchmark for his\nportfolio, and has the following preferences:\n○ the index should have a contrarian effect;\n○ shares held by controlling shareholders should be included;\n○ dividends should be included in the weighting of constituent securities; and\n○ the weights of constituent securities should not be arbitrarily determined by the\nindex provider.\nWhich of the following weightings of indexes best meets the fund manager's\npreferences?", "opts": ["Equal", "Fundamental", "Float-adjusted market capitalization"], "ans": "B", "expl": "A. Incorrect because the weights in an equal-weighted index are arbitrarily assigned by the index provider.\nB. Correct because fundamental weighting satisfies the fund manager's preferences. Fundamental indexes use a\nsingle measure, such as total dividends, to weight the constituent securities. Fundamentally weighted indexes\ngenerally will have a contrarian effect in that the portfolio weights will shift away from securities that have increased\nin relative value and toward securities that have fallen in relative value whenever the portfolio is rebalanced. All\nshares are included in a fundamental weighted index.\nexcluded.\nSecurityMarket Indexes\ncompare the different weighting methods used in index construction", "qhtml": null}, {"n": 21, "q": "Which of the following statements about digital assets is most accurate?", "opts": ["Most have an inherent value based on the expected cash flow", "They can be purchased through indirect investment vehicles such as hedge funds", "They are generally recorded in private ledgers maintained by central intermediaries"], "ans": "B", "expl": "cash flow - interest and dividends - they can or are expected to generate.\nB. Correct because the main similarity between digital assets and traditional financial assets is the emergence of\nindirect investment vehicles such as exchange-traded funds and hedge funds that invest both in traditional financial\nassets and in digital assets.\nC. Incorrect because one key difference between digital assets and traditional financial instruments is that traditional\nassets are generally recorded in private ledgers maintained by central intermediaries.\nIntroduction to Digital Assets\nexplain investment features of digital assets and contrast them with other asset classes\nDiscuss\nFilter\ni\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 22, "q": "The value of the company's preferred stock is closest to:", "opts": ["$52.17.", "$54.78.", "$96.92."], "ans": "A", "expl": "A. Correct because the value of the company's preferred stock is given as:\nVo。 = Do/r = $100(0.06)/0.115 = $52.17\nB. Incorrect. It uses D, instead of Do\nV = $100(0.06)(1.05)/0.115 = $54.78\nC. Incorrect. It uses constant growth (where growth is ≠ 0) model;\nV = $100(0.06)(1.05)/(0.115 - 0.05) = $96.92\nEquity Valuation: Concepts and Basic Tools\ncalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAADyCAIAAADGNd8JAACe6UlEQVR42uzddVwU2/s48DPbdHcqEqKCiS12B4Ld2N2KehUVW8ROVEQpEwzsBEFEkJBS6e5ml+35/XG+d3772QWvt+/1Pu8/fOHu7MSZmd1nnnnOGYIkSQQAAAAAAMB/CQ2aAAAAAAAAQBAMAAAAAAAABMF/h9jY2Pr6etg9AAAAAAAAMsEAAAAAAABAEAwAAAAAAAAEwQAAAAAAAEAQDAAAAAAAAATBAAAAAAAAguA/akZSqbSyshIevQEAAAAAAP75GH/UjOLi4ubNm2dubv706dO/d5NCQ0NzcnJSU1M1NDT69+8/ePBgbW3tv2VNmpqaHjx4gBAaPXq0hobGn7eguro6dXV1Gq2FSxqRSFRfX6+rq/v7l/L8+fOysjJbW1snJ6fWLoSqqqr09PQIgmhxgvLycn19/dbeBQAAAAD49wXBUqkUIVRQUBATE9O7d++/a3vevHmzZ88esVgsFosRQhEREadPn379+vXfEniVlZUdOnQIIeTg4PAnBcEhISFhYWH5+fkcDmfBggWTJk1SVlam3nV3d//69atYLG7Tps2AAQOWL1/+mxd06dKls2fPSiSSMWPGtBgEl5SUuLu719bWMhiM/v374w3HuFxucHDwu3fv0tPTtbW1d+7c2atXLzj3AAAAAPA3Iv6oAoaYmJj58+fjv21tbe/evYt+38My7OzsflXgePHiRV9f36amJoQQm802NzdvbGwsKytDCDEYjMmTJ3t6ev6pTZmSkrJly5acnJz27dsfPXrU0tIyKytr4sSJCKHr16936NDhj10cj8c7deqUv7+/4o7Q1NQ8d+7cyZMn5d4yMjI6duyYo6Pjr13Wtm3bwsLCEEKqqqqzZ89evXq17LskSQ4fPryoqEj2RUNDw4sXL7Zr147L5Xbv3l1uhhwOJzExEU4/AAAAAKAfqWPcly9foqKi/uItCQkJwRGwoaHhkiVLDh48uH//fmNjY4SQWCzGMdxfzNDQcMeOHTt27DA1NUV/Qpr51atXOMRfsmSJm5sbfv3q1asIoUePHiGECILo2rXr0qVLDQwMEELl5eVBQUG/YVmVlZV4blOmTJk2bZpiOF5cXIwQ d on the\nconvertiblebond compared with the option-freebond.\nFixed-lncome Cash Flows and Types\ndescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions\nthat benefit issuers and investors\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 24, "q": "A waterfall structure in asset-backed securities is most likely associated with:", "opts": ["credit tranching.", "overcollateralization.", "monoline insurance guarantees."], "ans": "A", "expl": "A. Correct because it is common for securitizations to include a form of internal credit enhancement called\ntranche, and the bond classes differ as to how they will share any losses resulting from defaults of the borrowers\nwhose loans are in the collateral. This type of protection is also commonly referred to as a waterfall structure\nsecure financing. It represents a form of internal credit enhancement because the additional collateral can be used\nto absorb losses.\nbondholders for any losses incurred if the issuer defaults. The major difference between a bank guarantee and a\nsurety bond is that the former is issued by a bank, whereas the latter is issued by a rated and regulated insurance\ninsurance companies or monoline insurers.\nAsset-Backed Security (ABS) Instrument and Market Features\n· describe typical credit enhancement structures used in securitizations\nDiscuss\nFilter", "qhtml": null}, {"n": 25, "q": "All else being equal, non-cumulative preference shares are more risky for\ninvestors than:", "opts": ["cumulative preference shares.", "dividend-paying common shares.", "non-dividend-paying common shares."], "ans": "A", "expl": "A. Correct because cumulative preference shares have lower risk than non-cumulative preference shares because\nthe cumulative feature gives investors the right to receive any unpaid dividends before any dividends can be paid\nto common shareholders.\nB. Incorrect because preference shares are e rating, the lower the perceived risk of default, so the need to\nnotch' the rating to capture the potential difference in loss severity is greatly reduced. For lower-rated credits,\nranking is a bigger consideration in assessing an issue's credit riskiness. Thus, the rating agencies will typically\napplylargerratingadjustments.\nC. Incorrect because as a general rule, the higher the senior unsecured rating, the smaller the notching adjustment\nwill be. The reason behind this is that the higher the rating, the lower the perceived risk of default, so the need to\nnotch' the rating to capture the potential difference in loss severity is greatly reduced. For lower-rated credits,\nhowever, the risk of default is greater and thus the potential difference in loss from a lower (or higher) priority\napply larger rating adjustments.", "qhtml": null}, {"n": 30, "q": "All else being equal, which of the following statements based on the binomial\nmodel is accurate? When the volatility of the underlying increases, the value of a:", "opts": ["put option and the value of a call option on the underlying will increase.", "put option on the underlying will increase while the value of a call option on the underlying will decrease.", "call option on the underlying will increase while the value of a put option on the underlying will decrease."], "ans": "A", "expl": "between C1+ and c1- , leading to a higher option value. Changing the c's to p's leads to the same pricing formula for\nput options as for call options. Therefore both put and call option values will increase.\nB. Incorrect because if volatility increases, the difference between S,+ and S,- increases, which widens the range\nput options as for call options. Therefore both put and call option values will increase when volatility increases.\nC. Incorrect because if volatility increases, the difference between S,+ and S,- increases, which widens the range\nbetween C1+ and c1- , leading to a higher option value. Changing the c's to p's leads to the same pricing formula for\nput options as for call options. Therefore both put and call option values will increase when volatility increases.\nValuing a derivative using a one-period binomial model\n· explain how to value a derivative using a one-period binomial model\nDiscuss\nFilter", "qhtml": null}, {"n": 31, "q": "Which of the following statements about interest rate forward and swap\ncontracts is most accurate? Both interest rate forward and swap contracts:", "opts": ["have symmetric payoff profiles.", "involve an exchange of cash upfront.", "have no counterparty credit exposure."], "ans": "A", "expl": "A. Correct because similarities between interest rate forwards and swaps include the symmetric payoff profile and the\nfact that no cash flow is exchanged upfront. Both interest rate forward and swap contracts involve counterparty\ncredit exposure.\nB. Incorrect because both neither contract involves an upfront exchange of cash. Similarities between interest rate\ninterest rate forward and swap contracts involve counterparty credit exposure.\nC. Incorrect because both contracts are exposed to counterparty credit risk. Similarities between interest rate forwards\nand swaps include the symmetric payoff profile and the fact that no cash flow is exchanged upfront. Both interest\nrate forward and swap contracts involve counterparty credit exposure.\nPricing and Valuation of Interest Rates and Other Swaps\n· describe how swap contracts are similar to but different from a series of forward contracts\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 32, "q": "Convenience yield is primarily associated with which of the following assets?", "opts": ["High-yield bonds", "Dividend-paying stocks", "Commodities in short supply"], "ans": "C", "expl": "A. Incorrect because for most financial assets, convenience yields are either nonexistent or extremely limited. Since a\nbond is a financial asset, it is unlikely to have any significant convenience yield.\nequity is a financial asset, it is unlikely to have any significant convenience yield.\nC. Correct because convenience yields are primarily associated with commodities and generally exist as a result of\nholding the asset. In contrast, for most financial assets, convenience yields are either nonexistent or extremely\nlimited.\nArbitrage, Replication, and the Cost of Carry in Pricing Derivatives\nexplain the difference between the spot and expected future price of an underlying and the cost of carry associated\nwith holding the underlying asset\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 33, "q": "Which of the following asset-backed securities provides the highest level of\nprotection against prepayment risk?", "opts": ["A mortgage pass-through security", "A collateralized mortgage obligation", "A commercial mortgage-backed security"], "ans": "C", "expl": "prepayments. This risk is called prepayment risk.\nit can only distribute the various forms of this risk among different bond classes.\nC. Correct because a critical investment feature that distinguishes CMBS from RMBS is the protection against early\nprepayments available to investors known as call protection. An investor in an RMBS is exposed to considerable\nprepayment risk because the borrower has the right to prepay a loan, in whole or in part, before the scheduled\ntranches to modify or reduce prepayment risk. CMBs investors have considerable call protection, which results in\nCMBS trading more like corporate bonds than RMBS.\nMortgage-Backed Security (MBS) Instrument and Market Features\n· describe characteristics and risks of commercial mortgage-backed securities\nDiscuss\nFilter\n1\nDiscussion", "qhtml": null}, {"n": 34, "q": "A strategy that seeks to profit from investing in companies that are likely to be\nacquired is best described as a(n):", "opts": ["macro strategy.", "event-driven strategy.", "relative value strategy."], "ans": "B", "expl": "made on the basis of expected movements in economic variables. Generally, these funds trade opportunistically in\nfixed-income, equity, currency, and commodity markets. Macro hedge funds use long and short positions to profit\nfrom a view on the overall direction of the market as it is influenced by major economic trends and events.\nB. Correct because event-driven strategies seek to profit from defined catalyst events, typically those that involve\nchanges in corporate structure, such as an acquisition or restructuring. This strategy is considered to be\nlong and short positions in common and preferred stocks, debt securities, and options.\nC. Incorrect because relative value funds seek to profit from a pricing discrepancy, an unusual short-term relationship,\nbetween related securities. The expectation is that the pricing discrepancy will be resolved over time.\nHedge Funds\n· explain investment features of hedge funds and contrast them with other asset classes\nDiscuss\nFilter\n1\nDiscussion", "qhtml": null}, {"n": 35, "q": "Risk management is a process that can most likely be best described as:", "opts": ["minimizing risks while attempting to maximize returns.", "forecasting the level of risk that can meet a defined required return.", "defining a level of risk to be taken with the goal of maximizing the portfolio's value."], "ans": "C", "expl": "A. Incorrect because risk management is actively understanding how to best balance the achievement of goals with\nan acceptable chanceof failure.\nB. Incorrect because risk management is not about predicting risks.\nC. Correct because risk management is the process by which an organization or individual defines the level of risk to\nbe taken, measures the level of risk being taken, and adjusts the latter toward the former, with the goal of\nmaximizing the company's or portfolio's value or the individual's overall satisfaction or utility.\nIntroduction to Risk Management\ndefine risk management\nDiscuss\nFilter\nDiscussion\nWha st accurate? Venture debt is private debt\nfunding provided to:", "opts": ["public companies with the intent to take them private.", "startup or early-stage companies that may have little or negative cash flow.", "mature companies that face bankruptcy or other complications with meeting debt obligations."], "ans": "B", "expl": "A. Incorrect because private equity refers to investment in privately owned companies or in public companies with the\nintent to take them private.\nfirms with little or no cash flow.\nC. Incorrect because for private debt, in addition to private loans or bonds, distressed debt involves public or private\ndebt of corporate issuers believed to be close to or in bankruptcy that could benefit from investors with capital\nrestructuring skills.\nInvestments in Private Capital: Equity and Debt\nexplain features of private debt and its investment characteristics\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 39, "q": "All else being equal, the value of a European put option is most likely inversely\nrelated to the time to expiration when interest rates are high, the time to expiration is\nlong and the put is:", "opts": ["at-the-money.", "deep in-the-money.", "deep out-of-the-money."], "ans": "B", "expl": "A. Incorrect because the value of a European put option can be either directly or inversely related to the time to\nexpiration, the higher the risk-free rate, and the deeper it is in-the-money.\nB. Correct because the value of a European put option can be either directly or inversely related to the time to\nexpiration, the higher the risk-free rate, and the deeper it is in-the-money.\nC. Incorrect because the value of a European put option can be either directly or inversely related to the time to\nexpiration. The direct effect is more common, but the inverse effect can prevail with a put the longer the time to\nexpiration, the higher the risk-free rate, and the deeper it is in-the-money.\nPricing and Valuation of Options\n· identify the factors that determine the value of an option and describe how each factor affects the value of an option\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 40, "q": "An investor who prefers an asset with an uncertain expected payoff of $50 to a\nguaranteed payoff of $50 is best described as:", "opts": ["risk averse.", "risk neutral.", "risk seeking."], "ans": "C", "expl": "A. Incorrect because a risk-averse investor would prefer the guaranteed payoff. The expected value in both cases is\n$50, one with certainty and the other with uncertainty. If an investor chooses the guaranteed outcome, he/she is\nsaid to be risk averse because the investor does not want to take the chance of not getting anything at all.\nB. Incorrect because a risk-neutral investor would be indifferent between the two options and thus should not always\nC. Correct because the expected value in both cases is $50, one with certainty and the other with uncertainty. If an\ninvestor chooses the gamble (the option with uncertainty), then the investor is said to be risk loving or risk seeking.\nPortfolioRisk and Return:Part T\nexplainrisk aversion and its implications for portfolio selection\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 41, "q": "Spot rates are best defined as:", "opts": ["the current yields on coupon bonds at different maturities.", "the yields-to-maturity on coupon bonds at different maturities.", "the yields-to-maturity on zero-coupon bonds at different maturities."], "ans": "C", "expl": "A. Incorrect because yields-to-maturity (not current yields) on a series of default-risk-free zero-coupon (not coupon)\nbonds, are known as spot rates.\nB. Incorrect because yields-to-maturity on a series of default-risk-free zero-coupon (not coupon) bonds, are known as\nspot rates.\nC. Correct because yields-to-maturity on a series of default-risk-free zero-coupon bonds, are known as spot rates.\nSince interest rates vary by maturity and have a term structure, we can price bonds using a sequence of discount\nrates that correspond to the cash flow dates. One such sequence, representing default-risk-free rates, is the spot\ncurve.\nThe Term Structure of Interest Rates: Spot, Par, and Forward Curves\n· define spot rates and the spot curve, and calculate the price of a bond using spot rates\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 42, "q": "All else equal, interest rate risk is lowest for which of the following non-callable\nbonds?", "opts": ["Discount", "Premium", "Zero-coupon"], "ans": "B", "expl": "A. Incorrect because, all else equal, lower-coupon bonds have higher durations and more interest rate risk, so a\ndiscount bond would have higher interest rate risk than a comparable premium bond.\nB. Correct because, all else equal, high-coupon bonds have less interest rate risk (lower duration) than low-coupon\nbonds. Therefore, a bond trading at a premium will have lower interest rate risk than a comparable zero-coupon or\ndiscount bond.\nC. Incorrect because, all else equal, lower-coupon bonds have higher durations and more interest rate risk, so a zero-\ncoupon bond would have the highest interest rate risk.\nYield-Based Bond Duration Measures and Properties\nexplain how a bond's maturity, coupon, and yield level affect its interest rate risk\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 43, "q": "The covariance between Stock 1 and Stock 2 is closest to:", "opts": ["0.0025.", "0.0338.", "0.0675."], "ans": "B", "expl": "A. Incorrect because the variances are used in the calculation of covariance instead of the standard deviations: Covij\n= Pi,jO = 0.0625 × 0.090 x 0.450= 0.0025.\nB. Correct because covariance is calculated as Covi; = Piu,; , where\nPi,j = correlation coefficient between two stocks\nO=variance of returns for Stock 1\no = variance of returns for Stock 2\nPlugging in the values:\nCoVi; = 0.06251/2 × 0.0901/2 x 0.450 = 0.0338\n0.0901/2 x 0.450 = 0.0675.\nLevelICFAProgram—February2025\nQuestion 43 of 90\nVariance of returns for Stock 2\n0.0900\nCorrelation coefficient between Stock 1 and Stock 2\n0.4500\nQ. The covariancebetweenStock 1 andStock 2 is closest to:\nA.0.0025.\nB.0.0338.\nC. 0.0675.\nSolution\nA. Incorrect because the variances are used in the calculation of covariance instead of the standard deviations: Covi,j\n= Puj,0; = 0.0625 × 0.090 x 0.450= 0.0025.\nB. Correct because covariance is calculated as Covi;j = Pi,,; , where\nPi,j = correlation coefficient between two stocks\no;=variance of returns for Stock1\nOj = variance of returns for Stock 2\nPlugging in the values:\nCovi;j = 0.06251/2 x 0.0901/2 × 0.450 = 0.0338\n0.0901/2 x 0.450 = 0.0675.\nPortfolio Risk and Return: Part I\ncalculate and interpret the mean, variance, and covariance (or correlation) of asset returns based on historical data", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAADWCAIAAABaCJgpAADoL0lEQVR42uy9ZZwUx9r+39PjLuvOKizL4rCwu7gsriEkIUHiISEhLicCcU+IEiFAiAAhIbgGd9cVWGVdxn26Z/r/4vqnfnMWkifPOXki59T3BZ9htqe7urqr6qq77vsukSAIzF+PUCgkCIJYLGYYJhgM4gOFQqFQKBQKhfK7IPlrFisUColEomAwyDCMSCSiz4lCoVAoFAqF8p8vgkUikVgsDoVCLMvSh0ShUCgUCoVC+X35i0rMhoYGu90uCALHcaFQiD4nCoVCoVAoFMp/vgh2Op0+n4/4BNPnRKFQKBQKhUL5a4lgElr3O8bY2e12jUbDMIxUKv3tUXGCIHi9XuZnr2Ke5wOBAMdxf0rNBgIBr9f7Jyp44Sr+/bPhM27qagv9b79KKBQKBoM8z9MWSKFQKBQK5e8qggOBAFE2zJ8XSMcwjEgkUiqVKBLLshKJRCaTSaXSP6VIMplMqVSKxWJBEEgV/X0RiUQcxwmC4Pf7f/1x/49SWBAEBDvSkEcKhUKhUCjM3zcwDunMRCIR1M+fomzIRYPBYCgUkslkf4XcaqgQlmVRnr8jeLgsy4pEIqlUKhKJyL1cXbfhjx46+OqXgehjlmX/mun5KBQKhUKhMNQS/BvB+rhEIvlTFDDP87huIBAIBoNSqdTj8XAcB13+J9qnUZ5gMOh2u/+OL0e4kIWrCWr1asl7zWnJ1Qe0exY09QeFQqFQKJS/fWAcz/NVVVV/ipcn8buVSqWwU6pUKqlUCvvln+WV6/f7YT0Vi8VyufxvKoJZlmVZFg7WqFUI3GtOLX6LIwQ5gPpCUCgUCoVCYf7W7hBww926deuUKVNuuOGGL7744g++B0hMjuMg0Xbv3n348OGmpiaWZYcPH96tW7ekpKQ/vmbFYrHZbN61a1coFMrPz09NTf2b rect because the IPS (investment policy statement) should state any legal and regulatory restrictions that\nconstrain how the portfolio is invested. In some countries, such institutional investors as pension funds are subject\nassets that can be invested in securities issued by the plan sponsor, so called self-investment limits.\nexclusion of certain companies, countries, or types of securities from the investable universe as well as the client's\nareheavily regulated.\nBasics of Portfolio Planning and Construction", "qhtml": null}, {"n": 46, "q": "Information-motivated traders are most likely to differ from pure investors in\nthat they:", "opts": ["pay lower transaction fees.", "expect to earn excess returns.", "hold well-diversified portfolios."], "ans": "B", "expl": "A. Incorrect, because transaction fees are unrelated to the motivation for the trades.\nB. Correct, information-motivated traders expect to earn returns in excess of market returns because they trade on\nsecurities they believe the market has over- or undervalued. Unlike pure investors, they expect to earn a return on\ntheir information in addition to the normal return expected for bearing risk. Excess returns are generated when the\nmarket recognizes and corrects the valuation error on such a security.\nC. Incorrect because information-motivated traders arguably hold less diversified portfolios than pure investors\nbecause they focus on securities that are over- or undervalued.\nMarket Organization and Structure\n1explain the main functions of the financial system\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 47, "q": "Which of the following statements regarding certificates of deposit (CDs) is\nmost accurate?", "opts": ["Small-denomination CDs are typically traded among institutional investors.", "Non-negotiable CDs can be sold in the open market prior to the maturity date.", "CDs are available in domestic bond markets as well as in the Eurobond m "inefficient.", "weak-form efficient.", "semi-strong-form."], "ans": "A", "expl": "A. Correct because weak form efficiency implies security prices reflect all past market data and investors cannot\ntrade on price patterns, then the market is not weak form efficient, and consequently cannot be semi-strong or\nstrongform efficient either.\nB. Incorrect because weak form efficiency implies security prices reflect all past market data and investors cannot\ntrade on price patterns, then the market is not weak form efficient, and consequently cannot be semi-strong or\nstrongform efficient either.\nC. Incorrect because weak form efficiency implies security prices reflect all past market data and investors cannot\ntrade on price patterns, then the market is not weak form efficient, and consequently cannot be semi-strong or\nstrongformefficient either.\nMarket Efficiency\n· contrast weak-form, semi-strong-form, and strong-form market efficiency", "qhtml": null}, {"n": 53, "q": "According to put-call forward parity, a fiduciary call is equal to:", "opts": ["a long call and a long risk-free asset.", "a long call, a short forward and a long risk-free bond.", "a long forward, a short call and a short risk-free bond."], "ans": "A", "expl": "A. Correct because we can demonstrate put-call forward parity by comparing a synthetic protective put position to\nthe protective put and fiduciary call positions. Consider a modification of the portfolios used earlier to demonstrate\nput-call parity, as follows: At t = O, an investor purchases a call option (co) on the same underlying with an exercise\nprice of X and a risk-free bond that pays X at t = T. This portfolio is called the fiduciary call\nB. Incorrect because we can demonstrate put-call forward parity by comparing a synthetic protective put position to\nprice of X and a risk-free bond that pays X at t = T. This portfolio is called the fiduciary call. Therefore, a fiduciary\ncall is not a combination of a long call, a short forward and a long risk-free bond.\nC. Incorrect because we can demonstrate put-call forward parity by comparing a synthetic protective put position to\nprice of X and a risk-free bond that pays X at t = T. This portfolio is called the fiduciary call. Therefore, a fiduciary\ncall is not a combination of a long forward, a short call and a short risk-free bond.\nOption Replication Using Put-Call Parity\n· explain put-call forward parity for European options", "qhtml": null}, {"n": 54, "q": "On 1 January, an investor purchases an option-free bond that pays an annual\ncoupon rate of 10% on Dec 31 and matures in ten years at its par value of $100. The\ninvestor plans to sell the bond immediately after receiving the seventh coupon. If the\ncoupons are reinvested at an annual interest rate of 8% over the investor's holding\nperiod, the future value of the reinvested coupon payments at the end of the investor's\nholding period is closest to:", "opts": ["$70.00.", "$75.90.", "$89.23."], "ans": "C", "expl": "A. Incorrect because it computes the future value of the coupon payment by just adding them up.\nB. Incorrect because it uses a reinvestment rate of 10% and a coupon payment of 8.00, as follows:\n06 = 8 + ,(011)8 + z(011)8 + g(011)8 + 4(011)8 + g(011)8 + 9(011)8\nC. Correct because the future value of the reinvested coupon payments is computed as the sum of payments, with\neach payment compounded at reinvestment rate of 8% for the number of years remaining in the holding period.\nThe calculation is as follows:\n10(1.08)6 + 10(1.08)5 + 10(1.08)4 + 10(1.08)3 + 10(1.08)2 + 10(1.08)1 + 10 = 89.23\nInterest Rate Risk and Return\nI calculate and interpret the sources of return from investing in a fixed-rate bond;\nDiscuss\nFilter\ni", "qhtml": null}, {"n": 55, "q": "The holders of common shares of a company are legally entitled to:", "opts": ["receive regular dividends from the company.", "a repayment of the purchase price of their shares.", "a claim on the company's net assets in the event of liquidation."], "ans": "C", "expl": "A. Incorrect because when the company issues equity securities, it is not contractually obligated to repay the amount\nit receives from shareholders, nor is it contractually obligated to make periodic payments to shareholders for the\nuse of their funds.\nB. Incorrect because when the company issues equity securities, it is not contractually obligated to repay the amount\nit receives from shareholders, nor is it contractually obligated to make periodic payments to shareholders for the\nuse of their funds.\nequity security. As a result, investors share in the operating performance of the company, participate in the\ngovernance process through voting rights, and have a claim on the company's net assets in the case of liquidation.\nOverviewof EquitySecurities\ndescribe characteristics of types of equity securities\nDiscuss ①\nFilter\nDiscussion", "qhtml": null}, {"n": 56, "q": "Which of the following sections of an investment policy statement most likely\ndetails the role of the custodian for a client's assets?", "opts": ["Procedures", "Investment Guidelines", "Statement of Duties and Responsibilities"], "ans": "C", "expl": "A. Incorrect because the section on Procedures explains the steps to take to keep the IPS investment policy\nother parties related to the IPS.\ninvestment, if any. It does not detail the roles of other parties related to the investment policy statement.\nC. Correct because the Statement of Duties and Responsibilities details the duties and\nresponsibilities of the client, the custodian of the client's assets, and the investment\nmanagers.\nBasics of Portfolio Planning and Construction\n· describe the major components of an IPS\nDiscuss 6\nFilter\n1", "qhtml": null}, {"n": 57, "q": "A market where buyers and sellers trade only with dealers is most likely a(n):", "opts": ["brokered market.", "order-driven market.", "quote-driven market."], "ans": "C", "expl": "instruments for which finding a buyer or a seller willing to trade is difficult because the instruments are unique and\nthus of interest only to a limited number of people or institutions. Thus, in a brokered market customers are\nconnected by a broker but they directly trade with each other.\nB. Incorrect because order-driven markets arrange trades using rules to match buy orders to sell orders. Because\nrules match buyers to sellers, traders often trade with complete strangers. Thus, in an order-driven market\ncustomers are connected by a trading system but they directly trade with each other.\nC. Correct because in quote-driven markets, customers trade with dealers. Traders call them quote-driven (or price-\nbuyer and seller customers directly trade with dealers and not with each other.\nMarket Organization and Structure\n· describe how securities, contracts, and currencies are traded in quote-driven, order-driven, and brokered markets\nDiscuss ①\nFilter", "qhtml": null}, {"n": 58, "q": "An investor buys a call for $24.70 that has a strike price of $670. If the value at\nexpiration for this call is $47.60, the price of the underlying at expiration is closest to:", "opts": ["$622.40.", "$692.90.", "$717.60."], "ans": "C", "expl": "A. Incorrect because $622.40 is the value of the underlying assuming that this was a put option instead of a call\noption. The payoff to the put buyer at expiration is pt = Max(O, X - St), where X is the exercise price and S is the\nprice of the underlying at expiration. Given the information in the stem we get $47.60 = Max(0,$670 - St) which\nyields S = $670 - $47.60 = $622.40.\nB. Incorrect because $692.90 is the profit from the option position added to the strike price. It is computed as (Ct - co)\n+ X where ct is the value of the option at expiration, co is the purchase price of the option and X is the strike price.\nGiven the information in the stem we get ($47.60 - $24.70) + $670= $692.90.\nHence, S =$ 670 + $47.60 = $717.60.\nForward Commitment and Contingent Claim Features and Instruments\n· determine the value at expiration and profit from a long or a short position in a call or put option\nDiscuss ①\nFilter", "qhtml": null}, {"n": 59, "q": "An investor borrows the maximum amount allowed by the initial margin\nrequirement of 40% to purchase 100 shares of a stock selling at $60 per share. If the\ninvestor sells the stock when its price increases to $70 per share, her return before\ncommissions and interest will be closest to:", "opts": ["16.7%.", "27.8%.", "41.7%."], "ans": "C", "expl": "A. Incorrect. It ignores the margin.\n100x(70-60)\n100x60\n= 16.67%\nB. Incorrect. It takes margin as 60%.\n(70x100)-(60x100x0.4)\n-1\n(60×100x0.6)\n= 27.78%\nC. Correct.\nInvestor's return (%) =\nMarket value of the stock-Loan\nInvestor's equity\n(70x100)-(60x100x0.6)\n(60×100x0.4)\n= 41.67%\nMarket Organization and Structure", "qhtml": null}, {"n": 60, "q": "Which of the following is the most conservative price for valuing a hedge fund's\nshort position?", "opts": ["The bid price", "The ask price", "The average of the bid and ask prices"], "ans": "B", "expl": "A. Incorrect because a more conservative and accurate approach is to use bid prices for long positions and ask prices\nfor short positions because these are more realistic prices at which the positions could be closed.\nB. Correct because a more conservative and accurate approach is to use bid prices for long positions and ask prices\nfor short positions because these are more realistic prices at which the positions could be closed.\nC. Incorrect because the more conservative and accurate approach is to use bid prices for long positions and ask\nprices for short positions because these are more realistic prices at which the positions could be closed. However,\nsome managers use a simplifying approach whereby they take the average of the bid and the ask; this approach is\nnot as accurate and could be misleading.\nAlternative InvestmentPerformance and Returns\n· describe the performance appraisal of alternative investments\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 61, "q": "A bond has a modified duration of 6.2 and an approximate annual convexity of\n328. If yields increase by 30 bps, the expected percentage price change of this bond is\nclosest to:", "opts": ["-2.01%.", "-1.71%.", "-1.56%."], "ans": "B", "expl": "A. Incorrect because the convexity adjustment is subtracted instead of added:\n≠ [-6.2 x 0.003] - [0.5 × 328 × 0.0032)\n= [-0.0186] - [0.001476] = -0.020076, rounded to -2.01%.\nB. Correct because the percentage price change for this bond is:\n%△PV Ful ≈ [-AnnModDur × △Yield] + [0.5 × AnnConvexity × (△Yield)2]\n= [-6.2 × 0.003] + [0.5 × 328 × (0.003)2)\n= [-0.0186] + [0.001476] = -0.017124, rounded to -1.71%.\nC. Incorrect because 0.5 in the convexity adjustment is omitted:\n≠ [-6.2 × 0.003] +[328 × 0.0032]\n= [-0.0186] + [0.002952] = -0.015648, rounded to -1.56%.\nYield-Based Bond Convexity and Portfolio Properties\ncalculate the percentage price change of a bond for a specified change in yield, given the bond's duration and\nconvexity", "qhtml": null}, {"n": 62, "q": "If the market portfolio's standard deviation of returns is 20%, the asset with the\nhighest standard deviation is:", "opts": ["Asset 1.", "Asset 2.", "Asset 3."], "ans": "C", "expl": "A. Incorrect because both, Asset 1 and Asset 2 have lower standard deviations than Asset 3. A candidate may\nchoose this because it has the highest correlation with the market.\nB. Incorrect because both, Asset 1 and Asset 2 have lower standard deviations than Asset 3. A candidate may\nchoose this because it has the highest beta.\nC. Correct because beta is defined as: β; = Pim; / Om , so O; = (β; × om)/ Pi,\nWhere: Pim is the correlation between Asset i and the market portfolio, o, is the standard deviation of Asset i, and\nOm is the standard deviation of the market portfolio.\nAsset 1's standard deviation = (1.000 x 0.2)/0.8 = 0.25\nAsset 2's standard deviation = (1.225 x 0.2)/0.7 = 0.35\nLevelICFAProgram—February2025\nQuestion 62 of 90\nQ. If the market portfolio's standard deviation of returns is 20%, the asset with the highest standard deviation is:\nA. Asset 1.\nB. Asset 2.\nC. Asset 3.\nSolution\nA. Incorrect because both, Asset 1 and Asset 2 have lower standard deviations than Asset 3. A candidate may\nchoose this because it has the highest correlation with the market.\nB. Incorrect because both, Asset 1 and Asset 2 have lower standard deviations than Asset 3. A candidate may\nchoose this because it has the highest beta.\nC. Correct because beta is defined as: β; = Pim; / m , so O; = (β; × om)/ Pi,\nWhere: Pi,m is the correlation between Asset i and the market portfolio, o, is the standard deviation of Asset i, and\nOm is the standard deviation of the market portfolio.\nAsset 1's standard deviation = (1.000 x 0.2)/0.8 = 0.25\nAsset 2's standard deviation = (1.225 × 0.2)/0.7 = 0.35\nAsset 3's standard deviation = (1.125 x 0.2)/0.5 = 0.45\nTherefore, the asset with the highest standard deviation is Asset 3, where standard deviation = 0.45.\nPortfolio Risk and Return: Part Il\ncalculate and interpret beta", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAEkCAIAAACkJSuPAAB1DElEQVR42u3dd0BT1/8+8JOEJJCwlywBFQeguMU9gzhw71XFuveudRTrrrWO1r1r3RMVJ7hwV0VANgjIJswACdn5/XG+vb8UEGnr+rTP66+Q3NzcnNyE5577PueydDodAQAAAAD4L2GjCQAAAAAAIRgAAAAAACH4c3j27JlEIsHHAwAAAADoCQYAAAAAQAgGAAAAAEAIBgAAAABACAYAAAAAQAgGAAAAAITgD7UirVabl5eHS28AAAAAwJfP4EOt6Pnz5xMmTHB2dr558+bnfUsXLlxITk6OiooyMzPr1KlT9+7dLS0tP8uWlJWVXblyhRDSp08fMzOzj/dCKSkphoaG9vb2lR9SqVQSicTa2vqfv0pwcHBOTk7Dhg3btGnzrgOh/Px8GxsbFotV5QK5ubm2trbvehQAAADgfy8Ea7VaQkhaWtqTJ0/atWv3ud7PvXv31qxZo1ar1Wo1IeT+/fs7duy4e/fuZwleOTk5P/zwAyHEy8vrI4XglJSUrVu3PnnyhMVidevWbcaMGS4uLsyj/v7+CQkJarW6Tp06nTt3njFjxt9+oQMHDuzatUuj0fTt27fKEJyVleXv719UVGRgYNCpUyf6ximpVHrixInHjx/HxMRYWloGBAS0bdsW3z0AAAD4jFgfqoDhyZMnEydOpLcbNmwYGBhI/tnFMho1avSXguP+/fv37dtXVlZGC  to futures profits that are reinvested at higher\ninterest rates. With forwards, all the gains are received at expiration and thus there is no gain from reinvestment.\nPricing and Valuation of Futures Contracts\n·explainwhyforward and futuresprices differ\nDiscuss\nFilter", "qhtml": null}, {"n": 69, "q": "In a rising interest rate environment, the risk of a lower bond price is greater than\nthe coupon reinvestment risk when the Macaulay duration of the bond is:", "opts": ["less than the investor's investment horizon.", "equal to the investor's investment horizon.", "greater than the investor's investment horizon."], "ans": "C", "expl": "A. Incorrect because when the investment horizon is greater than the Macaulay duration of a bond, coupon\nreinvestment risk dominates market price risk. The investor's risk is to lower interest rates.\nB. Incorrect because when the investment horizon is equal to the Macaulay duration of a bond, coupon reinvestment\nrisk offsets market price risk.\nC. Correct because when the investment horizon is less than the Macaulay duration of the bond, market price risk\ndominates coupon reinvestment risk. The investor's risk is to higher interest rates.\nInterest Rate Risk and Return\n· describe the relationships among a bond's holding period return, its Macaulay duration, and the investment horizon;\nDiscuss\nFilter", "qhtml": null}, {"n": 70, "q": "An efficient market is best described as one in which:", "opts": ["an active investment strategy is preferred to a passive strategy.", "consistent, superior, risk-adjusted returns, net of all expenses, cannot be achieved.", "the time frame for price adjustment to new information allows many traders to profit."], "ans": "B", "expl": "A. Incorrect because in an efficient market, a passive investment strategy (i.e., buying and holding a broad market\nportfolio) that does not seek superior risk-adjusted returns can be preferred to an active investment strategy\nB. Correct because consistent, superior, risk-adjusted returns (net of all expenses) are not achievable in an eficient\nmarket.\nC. Incorrect because if the time frame of price adjustment allows many traders to earn profits with little risk, then the\nmarket is relatively inefficient rather than efficient.\nMarket Efficiency\n· describe market efficiency and related concepts, including their importance to investment practitioners\nDiscuss\nFilter", "qhtml": null}, {"n": 71, "q": "When presented with new information, if an analyst asks themselves the\nquestion how much does this information change my forecast? then which of the\nfollowing biases is the analyst most likely trying to overcome?", "opts": ["Hindsight bias", "Self-control bias", "Conservatism bias"], "ans": "C", "expl": "A. Incorrect because hindsight bias refers to believing past events as having been predictable and reasonable to\nexpect. Once understood, hindsight bias should be recognizable. FMPs (financial market participants) should ask\nsuch questions as, 'Am I re-writing history or being honest with myself about the mistakes I made?'\nB. Incorrect because self-control bias is a bias in which people fail to act in pursuit of their long-term, overarching\ngoals in favor of short-term satisfaction. In order to overcome such a bias, people should ensure that a proper\ninvestment plan is in place and should have a personal budget.\nC. Correct because conservatism bias is a belief perseverance bias in which people maintain their prior views or\ninformation is presented, the FMP (financial market participant) should ask such questions as, 'How does this\ninformation change my forecast?' or 'What effect does this information have on my forecast?'\nTheBehavioral Biasesof Individuals\n· discuss commonly recognized behavioral biases and their implications for financial decision making", "qhtml": null}, {"n": 72, "q": "The historical results forecasting approach is most appropriate for a company:", "opts": ["making a large acquisition.", "operating in a cyclical industry.", "with a low sensitivity to the business cycle."], "ans": null, "expl": "A. Incorrect because the historical results forecasting approach is also less appropriate for companies that are\nchanging their competitive strategy or restructuring in some way, such as making a large acquisition or divestiture\nthat renders historical results non-comparable.\ncompanies in cyclical industries, because a future period is likely to be at a different point in the business cycle\nthan the current or past period, and so results will differ.\nindustries where the analyst does not expect the industry structure (e.g., Porter's Five Forces, PESTLE influences)\nssn   s  s   u  s   l s o s\nCompany Analysis: Forecasting\n■ explain principles and approaches to forecasting a company's financial results and position", "qhtml": null}, {"n": 73, "q": "Which type of index does not use market capitalization as a weighting method?", "opts": ["A commodity index", "A broad equity market index", "A real estate investment trust (REIT) index"], "ans": "A", "expl": "commodityindexproviderscreatetheirownweightingmethods.\nB. Incorrect because a broad equity market index, as its name suggests, represents an entire given equity market\nand typically includes securities representing more than 90 percent of the selected market. For example, the\nShanghai Stock Exchange Composite Index (SSE) is a market-capitalization-weighted index.\nC. Incorrect because some REITs are market-cap weighted, for example the FTSE EPRA/NAREIT Global Real\nEstate Index uses the float-adjusted market cap weighting method.\nSecurity Market Indexes\ncompare types of security market indexes\nDiscuss\nFilter", "qhtml": null}, {"n": 74, "q": "Two assets are correctly priced according to the CAPM. If the assets have the\nsame expected variance of returns but different expected returns, the two assets must\nhave different levels of:", "opts": ["systematic risk only.", "nonsystematic risk only.", "both systematic risk and non-systematic risk."], "ans": "C", "expl": "A. Incorrect because the two assets also have different levels of nonsystematic risk to maintain the same total\nvariance.\nB. Incorrect because the two assets also have different levels of systematic risk, as indicated by their different levels\nof expected return (according to the CAPM).\nmeasured by beta. Hence, if the two assets have different expected returns and are correctly priced according to\nNonsystematic variance. Although the equality relationship is between variances, you will find frequent references\nto total risk as the sum of systematic risk and nonsystematic risk. The assets must have different levels of\nnonsystematic risk since their total variances are the same but they each have different levels of systematic\nvariance/risk.\nPortfolio Risk and Return: Part 1\nexplain systematic and nonsystematic risk, including why an investor should not expect to receive additional return\nforbearind\n/stematicrisk", "qhtml": null}, {"n": 75, "q": "Which of the following types of private debt is expected to be the riskiest?", "opts": ["Mezzanine debt", "Infrastructure debt", "Senior direct lending"], "ans": "A", "expl": "A. Correct because mezzanine debt is riskier than senior secure debt which is riskier than infrastructure debt.\nBecause of its typically junior ranking and its usually unsecured status, mezzanine debt is riskier than senior\nhierarchy. Typically, private equity, as the riskiest alternative, offers the highest returns, with private debt returns\ndeclining on a continuum down to the safest, most secured form of debt - infrastructure debt.\nreturns declining on a continuum down to the safest, most secured form of debt - infrastructure debt.\nand its usually unsecured status, mezzanine debt is riskier than senior secured debt.\nInvestments in Private Capital: Equity and Debt\n·describe the diversification benefits that private capital can provide", "qhtml": null}, {"n": 76, "q": "An investor bears more risk than initially thought because of the failure to\nconsider the interaction of credit risk and market risk. This type of risk interaction is\nbest described as:", "opts": ["solvency risk.", "wrong-way risk.", "operational risk."], "ans": "B", "expl": "A. Incorrect because solvency risk is the risk that the organization does not survive or succeed because it runs out of\ncash, even though it might otherwise be solvent.\nB. Correct because the investor's expected payoff is lower as a result of facing a credit risk that is compounded by\nmarket risk. Thus, the investor bears much more risk than initially thought as a result of the failure to consider the\ninteraction of the two risks this sort of risk interaction is so common in markets that practitioners have given it a\nvery fitting term - 'wrong-way risk.\nC. Incorrect because operational risk is the risk that arises from inadequate or failed people, systems, and internal\npolicies, procedures, and processes, as well as from external events that are beyond the control of the\norganization but that affect its operations.\nIntroduction to Risk Management\n·identify financial and non-financial sources of risk and describe how they may interact", "qhtml": null}, {"n": 77, "q": "Which of the following is best described as a relative risk objective?", "opts": ["Aiming for a return in the top quartile relative to the peer group", "Requiring returns to be within 5% of the return on the SP 500 index", "Setting the 12-month 95% value at risk (VaR) limit of a portfolio at #10 billion"], "ans": "B", "expl": "A. Incorrect because it is a return objective, not a risk objective. Some institutions also set their return objective\nrelative to a peer group or universe of managers; for example, an endowment aiming for a return that is in the top\nthe private equity universe.\nappropriate risk standards. Here, the risk relative to a benchmark is the tracking error against the SP 5o0 index.\nC. Incorrect because value at risk (VaR) is an absolute risk objective, not a relative risk objective. Measures of\nabsolute riskinclude thevarianceor standarddeviation of returns andvalue at risk.\nBasics of Portfolio Planning and Construction\n· describe risk and return objectives and how they may be developed for a client\nDiscuss ①\nFilter", "qhtml": null}, {"n": 78, "q": "A security is most likely undervalued if its estimated intrinsic value is higher\nthan its:", "opts": ["par value.", "book value.", "market price."], "ans": "C", "expl": "A. Incorrect because undervaluation is defined based on the difference between market price and estimated intrinsic\nvalue, not based on par value and estimated intrinsic value: if the estimated value exceeds the market price, the\nanalyst infers the security is undervalued.\nB. Incorrect because undervaluation is defined based on the difference between market price and estimated intrinsic\nvalue, not based on book value and estimated intrinsic value: if the estimated value exceeds the market price, the\nanalyst infers the security is undervalued.\nC. Correct because if the estimated value exceeds the market price, the analyst infers the security is undervalued.\nEquityValuation: Concepts and Basic Tools\nevaluate whether a security, given its current market price and a value estimate, is overvalued, fairly valued, or\nundervalued by the market\nDiscuss ①\nFilter", "qhtml": null}, {"n": 79, "q": "Using the Gordon growth model, if the analyst's required return is 10%, the\njustified forward P/E for the company is closest to:", "opts": ["15.", "18.", "20."], "ans": "A", "expl": "A. Correct because the justified forward P/E = p / r - g, where p is the dividend payout ratio, r is the required return\nand g is the growth rate. P/E = 0.45 / (0.10 - 0.07) = 0.45 / 0.03 =15.\nB. Incorrect because it uses the earnings retention rate (1 - dividend payout ratio) instead of the dividend payout ratio\nwhen calculating the P/E: 0.55 / (0.10 - 0.07) = 0.55 / 0.03 = 18.333 ~ 18.\nC. Incorrect because it uses the earnings estimate instead of the dividend payout ratio and divides correctly by (r - g)\n= $0.60 / (0.10 - 0.07) = $0.60 / 0.03 = 20.\nEquity Valuation: Concepts and Basic Tools", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAD6CAIAAAAqZl1kAABrJ0lEQVR42u3ddVxU2f8/8DPF0EOnSAmy2IGiKNjd3d2xurYrxqprd8HarQsKJooKohggGCgh3SOdQ07c3x/n4f3Nl9LddfPzev7BY7hz5869Z+7ced/3fZ9zOWVlZQQAAAAA4H8JF00AAAAAAP9rOAzDoBUAAAAAgCATDAAAAACAIBgAAAAAAEEwAAAAAACCYAAAAAAABMEAAAAAAAiCAQAAAAAQBDcgISGhvLwcHw8AAAAA/A8Fwfn5+VKpFB8PAAAAAKAcAgAAAAAAQTAAAAAAAIJgAAAAAAAEwQAAAAAAf1oQXFZW5uPjI5fL/yEbVlxcrFAo8AEDAAAAQG0chmG+yYJevnw5Y8YMQsiLFy90dXX/4NJCQ0MdHBxEItHXv4RhmJSUlJs3b/7yyy/K04VCoa+vr6WlJZf756a9y8rKoqOjS0tLdXR0mjVrJhQK4+Lihg4dSgjx8vJq0aLFt327GTNmZGdn157O4/HmzJkzaNAgsVg8ffp0sVgsk8m0tbW7dOmyZ88eDofz+84oNm/e7OfnRwgZNGjQ7t27a88QHBy8cePG8vJyDofTsmXLEydOaGlp0WffvXt34cKFyMjItLQ0TU3NGTNmTJo0iX0WAAAA4K/H/+ZL9PDwmDdvnp6eHvnLhxbetm3bq1evakyvqqpyd3dfs2bNNw9Da0hOTv7pp58SExMdHR337dtnaWn5p75dYmJiTk5OnUFwbm5uXFzctm3b0tLS6MSSkhI/P78ePXoMHDjwd7zX7du3aQRcn+PHj3t5edGhnRmGiYiI8PT0XLZsGY/HI4SsX78+ISGBzimRSDw8PDIyMn7++Wd8/QAAAID8Z2qCr1+/XiMX+9e4cOHC69evaQmEtrb2oEGD2rVrR596+/bttm3b/uwVYBiGptXZB3w+X1VVVVVVlcaC31bDlSfHjh0LDQ2tMfHw4cPJycm/473evn1LH5iYmHTu3Ln2hl+/fl0ikShPvHr16osXLwghubm5bARMSaXSW7du4bsHAAAA5L+UCS4vLz9//jyHw5k/f/5vqmf4g7y9vemDBw8eWFhYkM+X6SdMmJCUlPTu3buysjINDY2tW7cqFIru3bu7uLjQAonLly8nJCRwuVx3d3dCiEKhSElJ2bNnT3JysoODQ/PmzSdPnqyiosIGfOfOnXv58mVkZKRIJBo5cqSrq6udnR0h5ObNm8XFxYSQgoICb2/vZcuW6ejoDB8+nBBiYGDAvvzEiRNRUVEhISEikWjQoEE9e/Z0cHCgUfLu3bvlcrmtrW2XLl3WrVuXlZVlb2/fs2fPwYMH197eZ8+eKf9bUFDg4uJCCNm/f3/v3r1btmxJCBk4cODGjRu1tLQePHjw008/paambtmy5fTp03WG1IcPH46Ojk5OTlZTU7OxsVm1apWpqSnDMOHh4REREYQQDofTuXPn2p9pTk4O3XA/Pz9ra2uGYUaPHh0VFTVnzpz379/T0w+BQLB48eLZs2cnJSUNHDhQJpM9fPiwd+/e+AYCAADAfyQIpq5cuaJQKH788ce/ZjOqqqrYx2wETAgRiUTff//90qVLCSFhYWHdunW7evWqXC7X1NTs2LEjDW3v3LlDM500CL5+/frZs2eTkpIIISkpKffv35fJZLNnz6YRc2xs7L59++jd7AoKCvbs2e e shares for purposes of receiving the upcoming dividend. Because buyers of a company's\nday the company's share price immediately decreases by the amount of the foregone dividend. Therefore, the\ndividends.\nC. Incorrect because the declaration date is the day that the company issues a statement declaring a specific\ndividend. Next comes the ex-dividend date (or ex- date), the first date that a share trades without (i.e., “ex\") the\nupcoming dividend, all else being equal, on that day the company's share price immediately decreases by the\namount of the foregone dividend. Therefore, the trading day before the ex-date is the last date for an investor to\npurchase shares to be eligible for upcoming dividends.\nEquity Valuation: Concepts and Basic Tools\n· describe dividend payment chronology", "qhtml": null}, {"n": 82, "q": "Which of the following market anomalies describes the consistent\noutperformance of stocks with low P/E ratios?", "opts": ["The size effect", "The value effect", "The earnings surprise anomaly"], "ans": "B", "expl": "A. Incorrect because the size effect results from the observation that equities of small-cap companies (not companies\nwith low price-to-earnings ratios) tend to outperform equities of large-cap companies.\nB. Correct because the value effect is based on the observation that stocks that have below-average price-to-\nearnings (P/E) have consistently outperformed growth stocks over long periods of time.\nC. Incorrect because the earnings surprise anomaly refers to the observation that companies that display the largest\nperformance is displayed by companies with low or negative earnings surprises. Thus, earnings surprise does not\nexplain the outperformance of low P/E stocks.\nMarket Efficiency\ndescribe market anomalies\nDiscuss ①\nFilter\nDiscussion", "qhtml": null}, {"n": 83, "q": "A fiduciary call is equal to which of the following positions?", "opts": ["Long a call and long a risk-free bond", "Long a call, long a risk-free bond,
