<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 41.7 — Guidance for Standards IV(A), IV(B), and IV(C) · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

  .card{border-radius:var(--radius);box-shadow:var(--shadow);

  .stem{font-size:16px;line-height:1.65}

  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}

    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n": 1, "q": "Brendan Duval works as a research analyst for Toby Securities. Duval recommends changing a recommendation from \"sell\" to \"buy\" on Dalton Company. His firm, which manages several mutual funds, may be interested in buying Dalton's stock. He also manages the retirement account that his parents established with Toby. Duval wants to buy shares of Dalton's stock because it is an appropriate investment for his parent's retirement account and obtains approval from his employer to do so. Duval is also thinking about personally investing in Dalton stock. According to CFA Institute Standards of Professional Conduct, which of the following best describes the priority of transactions? Duval should give:", "opts": ["priority to Toby's clients and his employer concurrently, followed by his parent's retirement account, and finally his personal account.", "Toby's clients and his parent's account equal priority, followed by his employer, and then his personal account.", "priority of transactions to Toby's clients, followed by his employer, then his parent's retirement account, and finally his personal account."], "ans": "B", "expl": "According Standard VI(B) Priority of Transactions, Duval should give transactions for clients and employers priority over his personal transactions. Because his parent's retirement account represents a client account at Toby, Duval should treat this account just like any other firm account. His parent's retirement account should neither be given special treatment nor disadvantaged because of an existing family relationship with Duval. If Duval treats his parent's retirement account differently from other accounts at Toby, he would breach his fiduciary duty to his parents.", "explhtml": "<p>According Standard VI(B) Priority of Transactions, Duval should give transactions for clients and employers priority over his personal transactions. Because his parent&#x27;s retirement account represents a client account at Toby, Duval should treat this account just like any other firm account. His parent&#x27;s retirement account should neither be given special treatment nor disadvantaged because of an existing family relationship with Duval. If Duval treats his parent&#x27;s retirement account differently from other accounts at Toby, he would breach his fiduciary duty to his parents.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41.b<\/div><div class=\"qtext\"><p>Brendan Duval works as a research analyst for Toby Securities. Duval recommends changing a recommendation from &quot;sell&quot; to &quot;buy&quot; on Dalton Company. His firm, which manages several mutual funds, may be interested in buying Dalton&#x27;s stock. He also manages the retirement account that his parents established with Toby. Duval wants to buy shares of Dalton&#x27;s stock because it is an appropriate investment for his parent&#x27;s retirement account and obtains approval from his employer to do so. Duval is also thinking about personally investing in Dalton stock. According to CFA Institute Standards of Professional Conduct, which of the following best describes the priority of transactions? Duval should give:<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "Chris Babcock, CFA, a portfolio manager for a large Texas investment firm, has been offered compensation in addition to what her firm pays her. The offer is from one of her clients and the additional compensation will be based on her yearly performance in excess of the market index. Babcock should:", "opts": ["make written disclosure to her other clients before she accepts this offer.", "make written disclosure to all parties involved before she accepts this offer.", "turn down the offer because it represents a clear conflict between this client and Babcock's other clients."], "ans": "B", "expl": "Standard IV(B), Additional Compensation Arrangements, applies in this situation. Standard IV(B) states, \"No gifts, benefits, compensation, or consideration are to be accepted with may create a conflict of interest with the employer's interest unless written consent is received from all parties.\" The key words here are \"written consent\" - members must obtain written consent because such arrangements may affect loyalties and objectivity and create potential conflicts of interest.", "explhtml": "<p>Standard IV(B), Additional Compensation Arrangements, applies in this situation. Standard IV(B) states, &quot;No gifts, benefits, compensation, or consideration are to be accepted with may create a conflict of interest with the employer&#x27;s interest unless written consent is received from all parties.&quot;<\/p><p>The key words here are &quot;written consent&quot; - members must obtain written consent because such arrangements may affect loyalties and objectivity and create potential conflicts of interest.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(B)<\/div><div class=\"qtext\"><p>Chris Babcock, CFA, a portfolio manager for a large Texas investment firm, has been offered compensation in addition to what her firm pays her. The offer is from one of her clients and the additional compensation will be based on her yearly performance in excess of the market index. Babcock should:<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "Wanda Kirby, CFA, recently joined Allegheny Investments as a senior analyst. Because of her extensive experience in the investments business and knowledge of the Code and Standards, Allegheny's management asked her to assume supervisory responsibility. Kirby reviewed Allegheny's existing compliance system and determined that it was inadequate to allow her to clearly discharge her supervisory responsibility. According to CFA Institute Standards, Kirby should:", "opts": ["agree to accept supervisory responsibility provided that Allegheny adopts reasonable procedures to allow her to adequately exercise such responsibility.", "agree to accept supervisory responsibility and to develop reasonable procedures to allow her to adequately exercise such responsibility.", "decline in writing to accept supervisory responsibility until Allegheny adopts reasonable procedures to allow her to adequately exercise such responsibility."], "ans": "C", "expl": "If Kirby clearly cannot discharge supervisory responsibilities because of an inadequate compliance system, she should decline in writing to accept supervisory responsibility until Allegheny adopts reasonable procedures to allow her to adequately exercise such responsibility.", "explhtml": "<p>If Kirby clearly cannot discharge supervisory responsibilities because of an inadequate compliance system, she should decline in writing to accept supervisory responsibility until Allegheny adopts reasonable procedures to allow her to adequately exercise such responsibility.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(C)<\/div><div class=\"qtext\"><p>Wanda Kirby, CFA, recently joined Allegheny Investments as a senior analyst. Because of her extensive experience in the investments business and knowledge of the Code and Standards, Allegheny&#x27;s management asked her to assume supervisory responsibility. Kirby reviewed Allegheny&#x27;s existing compliance system and determined that it was inadequate to allow her to clearly discharge her supervisory responsibility. According to CFA Institute Standards, Kirby should:<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "Which of the following statements regarding employee/employer relationships is NOT correct?", "opts": ["There must be monetary compensation for an employer/employee relationship to exist.", "A written contract may or may not exist between employer and employee.", "An employee is someone in the service of another."], "ans": "A", "expl": "Monetary compensation is not a requirement of the employee/employer relationship.", "explhtml": "<p>Monetary compensation is not a requirement of the employee/employer relationship.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Which of the following statements regarding employee/employer relationships is NOT correct?<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "Martin Tripp, CFA, is vice-president of the equity department at Walker Financial, a large money management firm. Of the twenty analysts in his department for whom he has supervisory responsibility, eight are subject to CFA Institute Standards of Professional Conduct. Tripp believes that he cannot personally evaluate the conduct of the twenty analysts on a continuing basis. Therefore, he plans to delegate some of his supervisory duties to Sarah Green, who is subject to the Standards, and some to Bob Brown, who is not subject to the Standards. According to CFA Institute Standards of Professional Conduct, which of the following statements about Tripp's ability to delegate supervisory duties is most accurate?", "opts": ["Tripp may not delegate any of his supervisory duties to either Green or Brown.", "Tripp may delegate some or all of his supervisory duties only to Green because she is subject to the Standards.", "Tripp may delegate some or all of his supervisory duties to Brown, even though Brown is not subject to the Standards."], "ans": "C", "expl": "Standard IV(C) Responsibilities of Supervisors permits Tripp to delegate supervisory duties to Green, Brown, or both, but such delegation does not relieve Tripp of his supervisory responsibility.", "explhtml": "<p>Standard IV(C) Responsibilities of Supervisors permits Tripp to delegate supervisory duties to Green, Brown, or both, but such delegation does not relieve Tripp of his supervisory responsibility.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(C)<\/div><div class=\"qtext\"><p>Martin Tripp, CFA, is vice-president of the equity department at Walker Financial, a large money management firm. Of the twenty analysts in his department for whom he has supervisory responsibility, eight are subject to CFA Institute Standards of Professional Conduct. Tripp believes that he cannot personally evaluate the conduct of the twenty analysts on a continuing basis. Therefore, he plans to delegate some of his supervisory duties to Sarah Green, who is subject to the Standards, and some to Bob Brown, who is not subject to the Standards. According to CFA Institute Standards of Professional Conduct, which of the following statements about Tripp&#x27;s ability to delegate supervisory duties is most accurate?<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Which of the following statements is most correct concerning a member's obligation to his or her employer under the Code and Standards?", "opts": ["Members are prohibited from making arrangements or preparations to go into competitive business before terminating their relationship with their employer.", "Consent from the employer is necessary to permit independent practice that could result in compensation or other benefits in competition with the member's employer.", "Members are prohibited from undertaking independent practice in competition with their employer."], "ans": "B", "expl": "There is no blanket prohibition against independent practice in competition with a member's employer. The member must obtain permission from the employer. Members may make preparations to go into a competitive business, but may not solicit clients of the employer as long as members are still employed by the employer.", "explhtml": "<p>There is no blanket prohibition against independent practice in competition with a member&#x27;s employer. The member must obtain permission from the employer. Members may make preparations to go into a competitive business, but may not solicit clients of the employer as long as members are still employed by the employer.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Which of the following statements is most correct concerning a member&#x27;s obligation to his or her employer under the Code and Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "An analyst belongs to a nationally recognized charitable organization, which requires dues for membership. The analyst has worked out a deal where he provides money management advice in lieu of paying dues. Which of the following must the analyst do?", "opts": ["Nothing since he is not an employee of the charitable organization.", "Must treat the charitable organization as his employer.", "Resign from the position because the relationship is a conflict with the Standards."], "ans": "B", "expl": "An employee/employer relationship does not necessarily mean monetary compensation for services. If the analyst is performing services for the organization, then the analyst must treat the position as if he were an employee.", "explhtml": "<p>An employee/employer relationship does not necessarily mean monetary compensation for services. If the analyst is performing services for the organization, then the analyst must treat the position as if he were an employee.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>An analyst belongs to a nationally recognized charitable organization, which requires dues for membership. The analyst has worked out a deal where he provides money management advice in lieu of paying dues. Which of the following must the analyst do?<\/p><\/div>", "subj": "ethics"}, {"n": 8, "q": "An analyst working at an investment firm has a client that rents limousines. The client tells the analyst that as long as he is the client's analyst, he can have free use of a limousine several times a year. The analyst needs to:", "opts": ["explicitly refuse such an offer.", "do nothing since the offer is not linked to the performance of the client's portfolio.", "inform his supervisor in writing of the offer if the analyst intends to accept the offer."], "ans": "C", "expl": "Standard IV(B) requires that members disclose to their employer in writing all benefits that they receive in addition to their regular compensation for services they perform on behalf of their employer. They also need to get consent from their employer in writing. The written report to the employer should include the details of any written or oral agreement for extra compensation. The analyst does not have to refuse the offer.", "explhtml": "<p>Standard IV(B) requires that members disclose to their employer in writing all benefits that they receive in addition to their regular compensation for services they perform on behalf of their employer. They also need to get consent from their employer in writing. The written report to the employer should include the details of any written or oral agreement for extra compensation. The analyst does not have to refuse the offer.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(B)<\/div><div class=\"qtext\"><p>An analyst working at an investment firm has a client that rents limousines. The client tells the analyst that as long as he is the client&#x27;s analyst, he can have free use of a limousine several times a year. The analyst needs to:<\/p><\/div>", "subj": "ethics"}, {"n": 9, "q": "Grant Starks, CFA, has been working for Advisors, Inc., for eight years. Starks is about to start his own money management business and has given his two-week notice of his resignation. A few days before his resignation takes effect, a current client of Advisors calls him at his office to inquire about some services for her account at Advisors. During the conversation, Starks tells the client that his new business will have lower commissions than Advisors. Starks has most likely violated the Standard concerning:", "opts": ["avoidance or disclosure of conflicts.", "communication with clients and prospective clients.", "loyalty."], "ans": "C", "expl": "Standard IV(A) Loyalty requires members and candidates who are leaving an employer to act in their employer's interest until their departure takes effect.", "explhtml": "<p>Standard IV(A) Loyalty requires members and candidates who are leaving an employer to act in their employer&#x27;s interest until their departure takes effect.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Grant Starks, CFA, has been working for Advisors, Inc., for eight years. Starks is about to start his own money management business and has given his two-week notice of his resignation. A few days before his resignation takes effect, a current client of Advisors calls him at his office to inquire about some services for her account at Advisors. During the conversation, Starks tells the client that his new business will have lower commissions than Advisors. Starks has most likely violated the Standard concerning:<\/p><\/div>", "subj": "ethics"}, {"n": 10, "q": "Janet Thompson, CFA, is employed as an analyst by Nationwide Securities. According to CFA Institute Standards of Professional Conduct, which of the following statements about Thompson's duty to Nationwide is NOT correct? Thompson must refrain from:", "opts": ["making arrangements to go into a competitive business before terminating her relationship with Nationwide.", "engaging in independent competitive activity that could conflict with the business of Nationwide unless she receives written consent.", "engaging in any conduct that would injure Nationwide."], "ans": "A", "expl": "Standard IV(A) permits Thompson to make preparations to go into a competitive business before terminating her relationship with Nationwide provided that such preparations do not breach her duty of loyalty.", "explhtml": "<p>Standard IV(A) permits Thompson to make preparations to go into a competitive business before terminating her relationship with Nationwide provided that such preparations do not breach her duty of loyalty.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Janet Thompson, CFA, is employed as an analyst by Nationwide Securities. According to CFA Institute Standards of Professional Conduct, which of the following statements about Thompson&#x27;s duty to Nationwide is NOT correct? Thompson must refrain from:<\/p><\/div>", "subj": "ethics"}, {"n": 11, "q": "Chuck Daniels has just been hired to manage a security analysis group for Aaron Asset Management. Daniels performed a similar function at another firm and finds the compliance system at Aaron inadequate. He develops a system that he feels is appropriate, but senior management tells him he will have to wait six months to implement the system. Daniels should:", "opts": ["decline in writing to accept supervisory responsibility until a satisfactory compliance system is put into place.", "protest in writing the delay, listing the potential dangers that can occur.", "resign his position immediately."], "ans": "A", "expl": "According to the Standard on supervisory responsibilities, Daniels should decline in writing to accept supervisory responsibility until a satisfactory compliance system is put into place. ", "explhtml": "<p>According to the Standard on supervisory responsibilities, Daniels should decline in writing to accept supervisory responsibility until a satisfactory compliance system is put into place. <\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41.b<\/div><div class=\"qtext\"><p>Chuck Daniels has just been hired to manage a security analysis group for Aaron Asset Management. Daniels performed a similar function at another firm and finds the compliance system at Aaron inadequate. He develops a system that he feels is appropriate, but senior management tells him he will have to wait six months to implement the system. Daniels should:<\/p><\/div>", "subj": "ethics"}, {"n": 12, "q": "Which of the following statements is most correct under the Code and Standards?", "opts": ["CFA Institute members are prohibited from undertaking independent practice in competition with their employer.", "Members are prohibited from making arrangements or preparations to go into competitive business before terminating their relationship with their employer.", "Consent from the employer is necessary to permit independent practice that could result in compensation or other benefits in competition with the member's employer."], "ans": "C", "expl": "Members are not prohibited from making arrangements or preparations to go into competitive business before terminating their relationship with their employer. CFA Institute members are not prohibited from undertaking independent practice in competition with their employer provided they have consent from their employer. Members must provide notification to their employer describing the types of services to be rendered, the expected duration, and compensation for the services.", "explhtml": "<p>Members are not prohibited from making arrangements or preparations to go into competitive business before terminating their relationship with their employer. CFA Institute members are not prohibited from undertaking independent practice in competition with their employer provided they have consent from their employer. Members must provide notification to their employer describing the types of services to be rendered, the expected duration, and compensation for the services.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Which of the following statements is most correct under the Code and Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 13, "q": "Nancy Korthauer, CFA, has launched a new hedge fund called the Korthauer Tautology Fund but has had trouble hiring analysts who are CFA charterholders as well as with finding clients. She offers a $15,000 incentive bonus to any charterholder who joins the firm with over $1 million in committed client investments. Which of the following interpretations of the Code and Standards is most accurate?", "opts": ["A member or candidate may not solicit current clients away from their current employer.", "A member or candidate may arrange for current clients to switch to the Korthauer Tautology Fund provided clients are informed of the incentive bonus.", "A member or candidate may arrange for current clients to switch to the Korthauer Tautology Fund provided the member or candidate refuses to accept the incentive bonus."], "ans": "A", "expl": "A member or candidate may not solicit current clients away from their current employer under Standard IV(A) \"Loyalty.\"", "explhtml": "<p>A member or candidate may not solicit current clients away from their current employer under Standard IV(A) &quot;Loyalty.&quot;<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Nancy Korthauer, CFA, has launched a new hedge fund called the Korthauer Tautology Fund but has had trouble hiring analysts who are CFA charterholders as well as with finding clients. She offers a $15,000 incentive bonus to any charterholder who joins the firm with over $1 million in committed client investments. Which of the following interpretations of the Code and Standards is most accurate?<\/p><\/div>", "subj": "ethics"}, {"n": 14, "q": "David Saul, CFA, heads the trust department at Savage National Bank. Fairway Enterprises invites Saul to sit on its Board of Directors. In return for his services on the Board, Fairway offers to provide Saul and his family with access to the facilities at Wilmont Country Club at no cost. Saul will not receive any monetary compensation for his services on the Board. According to CFA Institute Standards of Professional Conduct, which of the following actions must Saul take?", "opts": ["Saul must obtain written consent from Savage Bank and Fairway Enterprises if he decides to accept the offer to serve on the Board of Directors.", "Saul must reject the offer to serve on the Board of Directors.", "Saul must disclose in writing to Savage Bank the terms of the offer whether or not he accepts the offer to serve on the Board of Directors."], "ans": "A", "expl": "Standard IV(B) requires that members obtain written consent from all parties involved before accepting monetary compensation or other benefits that they receive for their services that are in addition to compensation or benefits conferred by a member's employer. The phrase \"all parties\" is referring to Saul's employer and Fairway's Board of Directors.", "explhtml": "<p>Standard IV(B) requires that members obtain written consent from all parties involved before accepting monetary compensation or other benefits that they receive for their services that are in addition to compensation or benefits conferred by a member&#x27;s employer. The phrase &quot;all parties&quot; is referring to Saul&#x27;s employer and Fairway&#x27;s Board of Directors.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(B)<\/div><div class=\"qtext\"><p>David Saul, CFA, heads the trust department at Savage National Bank. Fairway Enterprises invites Saul to sit on its Board of Directors. In return for his services on the Board, Fairway offers to provide Saul and his family with access to the facilities at Wilmont Country Club at no cost. Saul will not receive any monetary compensation for his services on the Board. According to CFA Institute Standards of Professional Conduct, which of the following actions must Saul take?<\/p><\/div>", "subj": "ethics"}, {"n": 15, "q": "Michel Marchant, CFA, recently became an independent money manager. After six months, he has only ten clients. To supplement his income, Marchant accepted employment as an advisor at Middleton Financial Advisors. According to Standard IV(A) Loyalty, Marchant is required to:", "opts": ["attempt to bring his existing clients to Middleton.", "obtain permission from Middleton to continue his independent practice.", "inform his existing clients about his new employment at Middleton."], "ans": "B", "expl": "Because Marchant's independent practice may conflict with Middleton's interests, Standard IV(A) Loyalty requires that Marchant obtain permission from Middleton to continue it. Neither of the other choices describes a requirement of Standard IV(A).", "explhtml": "<p>Because Marchant&#x27;s independent practice may conflict with Middleton&#x27;s interests, Standard IV(A) Loyalty requires that Marchant obtain permission from Middleton to continue it. Neither of the other choices describes a requirement of Standard IV(A).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Michel Marchant, CFA, recently became an independent money manager. After six months, he has only ten clients. To supplement his income, Marchant accepted employment as an advisor at Middleton Financial Advisors. According to Standard IV(A) Loyalty, Marchant is required to:<\/p><\/div>", "subj": "ethics"}, {"n": 16, "q": "Which of the following is a violation of the Code and Standards?", "opts": ["Taylor sends out a resume referring to himself as a Level II CFA candidate and indicating his intention to take the Level II test in June.", "Reynolds approves Montpier’s report on Circuit Secrets immediately, but tells his traders to wait a week before buying the stock themselves.", "James has dinner with Taylor and promises to provide Taylor with three weeks off in May to study for the CFA exam and offer some test-taking tips."], "ans": "B", "expl": "An immediate approval of Montpier's report implies that Reynolds did not check the facts or talk to Montpier about the recommendation, which was dependent on the use of insider information. Reynolds violated the Standard relating to supervisory responsibilities. Side work that is not in competition with the intern's firm is not a violation unless the side job interferes with her work for World Class. The statement on Taylor's resume is appropriate, and James' plans to help Taylor are well within the requirements of the Standards.", "explhtml": "<p>An immediate approval of Montpier&#x27;s report implies that Reynolds did not check the facts or talk to Montpier about the recommendation, which was dependent on the use of insider information. Reynolds violated the Standard relating to supervisory responsibilities. Side work that is not in competition with the intern&#x27;s firm is not a violation unless the side job interferes with her work for World Class. The statement on Taylor&#x27;s resume is appropriate, and James&#x27; plans to help Taylor are well within the requirements of the Standards.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 16–19<\/div> <div class=\"pp-topic\">Module 41.7, LOS 41.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 16–19). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following is a violation of the Code and Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 17, "q": "With regard to Standard VII(B)—Reference to CFA Institute, the CFA Designation, and the CFA Program:", "opts": ["neither Montpier nor Taylor is in compliance.", "both Montpier and Taylor are in compliance.", "only Taylor is in compliance."], "ans": "C", "expl": "Both Montpier, as a CFA charterholder, and Taylor, as a CFA candidate, are subject to the Standards. Montpier violated Standard VII(B) by exaggerating the implications of passing the exam in three years. Taylor's comments comply with the Standards.", "explhtml": "<p>Both Montpier, as a CFA charterholder, and Taylor, as a CFA candidate, are subject to the Standards. Montpier violated Standard VII(B) by exaggerating the implications of passing the exam in three years. Taylor&#x27;s comments comply with the Standards.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 16–19<\/div> <div class=\"pp-topic\">Module 41.1, LOS 41.a<\/div><div class=\"qtext\"><p>With regard to Standard VII(B)—Reference to CFA Institute, the CFA Designation, and the CFA Program:<\/p><\/div>", "subj": "ethics"}, {"n": 18, "q": "Which of the following statements regarding Standard IV(A)—Loyalty to Employer is CORRECT?", "opts": ["Neither Taylor nor Montpier is in violation of the Standard.", "By accepting compensation for his role in the medical study, Taylor is violating the Standard.", "Despite getting written permission from her client to consult, Montpier is not in compliance with the Standard."], "ans": "C", "expl": "Montpier needs to get permission from both the client and her employer before she can begin to consult; since she has not received permission from World Class, she is not in compliance. Neither Taylor's use of rivals' research nor his participation in a medical study violate the Standard. Standard IV(A) addresses outside income, not research methods. And while the medical-study payment is certainly income, it is not in competition with his firm, and as such does not violate the Standard.", "explhtml": "<p>Montpier needs to get permission from both the client and her employer before she can begin to consult; since she has not received permission from World Class, she is not in compliance. Neither Taylor&#x27;s use of rivals&#x27; research nor his participation in a medical study violate the Standard. Standard IV(A) addresses outside income, not research methods. And while the medical-study payment is certainly income, it is not in competition with his firm, and as such does not violate the Standard.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 16–19<\/div> <div class=\"pp-topic\">Module 41.7, LOS 41.a<\/div><div class=\"qtext\"><p>Which of the following statements regarding Standard IV(A)—Loyalty to Employer is CORRECT?<\/p><\/div>", "subj": "ethics"}, {"n": 19, "q": "Taylor's actions regarding Breakthrough Corp.:", "opts": ["violate Standard II(A)—Material Nonpublic Information because the information was not in the public domain.", "do not violate Standard II(A)—Material Nonpublic Information because he was only confirming what he already suspected.", "did not violate Standard I(D)—Misconduct because he did not misappropriate the information."], "ans": "A", "expl": "Taylor's use of the material nonpublic information provided to him in confidence by a researcher is a clear violation of Standard II(A). The professional-misconduct Standard prohibits actions that reflect negative on \"professional reputation, integrity, or competence.\" Since Taylor has signed a confidentiality agreement, his violation of the agreement definitely says something about his honesty. Thus, he is in violation of Standard I(D). Standard IV(A) only applies to work in competition with the employer.", "explhtml": "<p>Taylor&#x27;s use of the material nonpublic information provided to him in confidence by a researcher is a clear violation of Standard II(A). The professional-misconduct Standard prohibits actions that reflect negative on &quot;professional reputation, integrity, or competence.&quot; Since Taylor has signed a confidentiality agreement, his violation of the agreement definitely says something about his honesty. Thus, he is in violation of Standard I(D). Standard IV(A) only applies to work in competition with the employer.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 16–19<\/div> <div class=\"pp-topic\">Module 41.3, LOS 41.a<\/div><div class=\"qtext\"><p>Taylor&#x27;s actions regarding Breakthrough Corp.:<\/p><\/div>", "subj": "ethics"}, {"n": 20, "q": "Sue Parsons, CFA, works full-time as an investment advisor for the Malloy Group, an asset management firm. Parsons wants to engage in independent practice in which she would advise individual clients on their portfolios. She would conduct these investment activities only on weekends. She is currently only in the preparation stage and has not started independent practice yet. The Standard concerning loyalty:", "opts": ["requires Parsons to obtain consent from both Malloy and the persons from whom she will engage in independent practice.", "requires Parsons to notify Malloy that she is preparing to engage in independent practice.", "does not require Parsons to notify Malloy of preparing an independent practice."], "ans": "C", "expl": "Standard IV(A) Loyalty distinguishes between \"undertaking independent practice\" and preparing to begin doing so. The Standard requires that Parsons obtain consent from her employer before she engages in independent practice that could result in compensation or other benefit in competition with Malloy. It does not require Parsons to obtain consent when only preparing to go into independent practice.", "explhtml": "<p>Standard IV(A) Loyalty distinguishes between &quot;undertaking independent practice&quot; and preparing to begin doing so. The Standard requires that Parsons obtain consent from her employer before she engages in independent practice that could result in compensation or other benefit in competition with Malloy. It does not require Parsons to obtain consent when only preparing to go into independent practice.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Sue Parsons, CFA, works full-time as an investment advisor for the Malloy Group, an asset management firm. Parsons wants to engage in independent practice in which she would advise individual clients on their portfolios. She would conduct these investment activities only on weekends. She is currently only in the preparation stage and has not started independent practice yet. The Standard concerning loyalty:<\/p><\/div>", "subj": "ethics"}, {"n": 21, "q": "Bill Valley has been working for Advisors, Inc., for several years, and he just joined CFA Institute. Valley's sister just received a large bonus in the form of stock options in Zephyr, Inc. Valley's sister knows nothing about financial assets and offers Valley a week at her holiday home each year in exchange for Valley monitoring Zephyr and the value of her stock options. In order to comply with the Code and Standards, Valley needs to inform Advisors of:", "opts": ["both the use of the holiday home and his sister's options.", "nothing since no money is involved and it is a favor for a family member.", "the compensation in the form of the use of the holiday home only."], "ans": "A", "expl": "According to Standard IV(A), Loyalty to Employer, Valley must inform Advisors of his outside consultation even if it is not for monetary compensation. According to Standard VI(A), Avoid or Disclose Conflicts, Valley must also disclose possible conflicts of interest, and his sister's position qualifies.", "explhtml": "<p>According to Standard IV(A), Loyalty to Employer, Valley must inform Advisors of his outside consultation even if it is not for monetary compensation. According to Standard VI(A), Avoid or Disclose Conflicts, Valley must also disclose possible conflicts of interest, and his sister&#x27;s position qualifies.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Bill Valley has been working for Advisors, Inc., for several years, and he just joined CFA Institute. Valley&#x27;s sister just received a large bonus in the form of stock options in Zephyr, Inc. Valley&#x27;s sister knows nothing about financial assets and offers Valley a week at her holiday home each year in exchange for Valley monitoring Zephyr and the value of her stock options. In order to comply with the Code and Standards, Valley needs to inform Advisors of:<\/p><\/div>", "subj": "ethics"}, {"n": 22, "q": "Nick O'Donnell, CFA, unsuspectingly joins the research team at Wickett & Co., an investment banking firm controlled by organized crime. None of the managers at Wickett are CFA Institute members. Because of his tenuous situation at Wickett, O'Donnell begins making preparations for independent practice. He knows he will be terminated if he informs management at Wickett that he is preparing to leave. Consequently, he determines that \"if he can just hang on for one year, he will likely have a client base sufficient for him to strike out on his own.\" This action is:", "opts": ["not a violation of his duty to employer.", "a violation of his duty to disclose conflicts to his employer.", "a violation of his fiduciary duties."], "ans": "A", "expl": "O'Donnell is required to obtain consent from his employer if he is attempting to practice in competition with his employer. Merely undertaking preparations to leave, which do not violate a duty, is not a violation of the Code and Standards.", "explhtml": "<p>O&#x27;Donnell is required to obtain consent from his employer if he is attempting to practice in competition with his employer. Merely undertaking preparations to leave, which do not violate a duty, is not a violation of the Code and Standards.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Nick O&#x27;Donnell, CFA, unsuspectingly joins the research team at Wickett &amp; Co., an investment banking firm controlled by organized crime. None of the managers at Wickett are CFA Institute members. Because of his tenuous situation at Wickett, O&#x27;Donnell begins making preparations for independent practice. He knows he will be terminated if he informs management at Wickett that he is preparing to leave. Consequently, he determines that &quot;if he can just hang on for one year, he will likely have a client base sufficient for him to strike out on his own.&quot; This action is:<\/p><\/div>", "subj": "ethics"}, {"n": 23, "q": "An analyst belongs to a nationally recognized charitable organization, which requires dues for membership. The analyst has worked out a deal that he provides money management advice in lieu of paying dues. For this arrangement to comply with the standards, the analyst needs consent from:", "opts": ["both his supervisor in the organization and his regular place of work.", "his supervisor in his regular place of work only.", "his supervisor in the organization only."], "ans": "A", "expl": "An employee/employer relationship does not necessarily mean monetary compensation for services. If the analyst is performing services for the organization, then the analyst must treat the position as if he were an employee and obtain consent from both his supervisor in the organization and in his regular place of work.", "explhtml": "<p>An employee/employer relationship does not necessarily mean monetary compensation for services. If the analyst is performing services for the organization, then the analyst must treat the position as if he were an employee and obtain consent from both his supervisor in the organization and in his regular place of work.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(B)<\/div><div class=\"qtext\"><p>An analyst belongs to a nationally recognized charitable organization, which requires dues for membership. The analyst has worked out a deal that he provides money management advice in lieu of paying dues. For this arrangement to comply with the standards, the analyst needs consent from:<\/p><\/div>", "subj": "ethics"}, {"n": 24, "q": "Marc Feldman, a CFA Institute member, is treasurer of zippy.com, and is also Larry Goldman's boss. Feldman is informed of \"accounting irregularities of an unknown origin\" during an audit by zippy's external accounting firm. There are 3 individuals, including Goldman, handling the accounting function. According to the Code and Standards, Feldman should do all of the following EXCEPT:", "opts": ["leave the staff in their current jobs and increase supervision while the external auditors complete their work.", "conduct a thorough investigation of activities.", "terminate the accounting staff immediately and issue a press release describing the situation."], "ans": "C", "expl": "Standard IV(C) spells out responsibilities of supervisors in the Standards of Practice Handbook. Since the investigation is ongoing, it would clearly be inappropriate to terminate the entire accounting staff until their complicity in the wrongdoing is established.", "explhtml": "<p>Standard IV(C) spells out responsibilities of supervisors in the Standards of Practice Handbook. Since the investigation is ongoing, it would clearly be inappropriate to terminate the entire accounting staff until their complicity in the wrongdoing is established.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41.a<\/div><div class=\"qtext\"><p>Marc Feldman, a CFA Institute member, is treasurer of zippy.com, and is also Larry Goldman&#x27;s boss. Feldman is informed of &quot;accounting irregularities of an unknown origin&quot; during an audit by zippy&#x27;s external accounting firm. There are 3 individuals, including Goldman, handling the accounting function. According to the Code and Standards, Feldman should do all of the following EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 25, "q": "Karen Dalby, CFA, volunteers on her church's finance board but receives no cash compensation so she does not report the arrangement to her employer. Board compensation is limited to an annual retreat to Hawaii, but the accommodations are modest. Dalby does not enjoy the retreat and often considers skipping the event entirely. Dalby is most likely:", "opts": ["in violation of Standard IV(B) \"Additional Compensation Arrangements.\"", "in violation of Standard IV(A) \"Loyalty.\"", "not in violation of the Code and Standards."], "ans": "A", "expl": "Dalby is in violation of Standard IV(B) \"Additional Compensation Arrangements.\" Nonmonetary compensation may still create a conflict of interest.", "explhtml": "<p>Dalby is in violation of Standard IV(B) &quot;Additional Compensation Arrangements.&quot; Nonmonetary compensation may still create a conflict of interest.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(B)<\/div><div class=\"qtext\"><p>Karen Dalby, CFA, volunteers on her church&#x27;s finance board but receives no cash compensation so she does not report the arrangement to her employer. Board compensation is limited to an annual retreat to Hawaii, but the accommodations are modest. Dalby does not enjoy the retreat and often considers skipping the event entirely. Dalby is most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 26, "q": "Jess Green, CFA, is the research director for Castle Investment, Inc., and has supervisory responsibility over eight analysts, including three CFA charterholders. Castle has a compliance program in place. According to CFA Institute Standards of Professional Conduct, which of the following is least likely an action that Green should take to adhere to the compliance procedures involving responsibilities of supervisors? Green should:", "opts": ["issue periodic reminders of the procedures to all analysts under his supervision.", "disseminate the contents of the compliance program to the eight analysts.", "incorporate a professional conduct evaluation as part of the performance review only for the three CFA charterholders."], "ans": "C", "expl": "Green should incorporate a professional conduct evaluation as part of his review of all eight analysts under his supervision, not just the three CFA charterholders.", "explhtml": "<p>Green should incorporate a professional conduct evaluation as part of his review of all eight analysts under his supervision, not just the three CFA charterholders.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(C)<\/div><div class=\"qtext\"><p>Jess Green, CFA, is the research director for Castle Investment, Inc., and has supervisory responsibility over eight analysts, including three CFA charterholders. Castle has a compliance program in place. According to CFA Institute Standards of Professional Conduct, which of the following is least likely an action that Green should take to adhere to the compliance procedures involving responsibilities of supervisors? Green should:<\/p><\/div>", "subj": "ethics"}, {"n": 27, "q": "Pamela Gee is a portfolio manager. She is planning to establish her own money management firm. She has already informed her employer, Branford, Inc., about her plans. In her remaining time at Branford, she may:", "opts": ["start the registration of her new company.", "solicit Branford colleagues but not Branford clients.", "inform her current clients about her resignation and let them know how to reach her."], "ans": "A", "expl": "—", "explhtml": "<p>(Không có giải thích trong file gốc.)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Pamela Gee is a portfolio manager. She is planning to establish her own money management firm. She has already informed her employer, Branford, Inc., about her plans. In her remaining time at Branford, she may:<\/p><\/div>", "subj": "ethics"}, {"n": 28, "q": "A firm recently hired Hal Crane, CFA, to be a supervisor in the firm. Crane has reviewed the procedures for complying with the Code and Standards in the company. It is Crane's belief that the procedures need revision in order to be effective. Crane must:", "opts": ["make reasonable efforts to encourage the company to adopt an adequate compliance system.", "exercise his supervisory responsibilities with the greater level of diligence required by the Code and Standards.", "decline supervisory responsibilities in writing until the company adopts an adequate compliance system."], "ans": "C", "expl": "According to Standard IV(C) Responsibilities of Supervisors, if Crane believes the company's compliance procedures are not adequate, Crane should decline supervisory responsibilities in writing until an adequate system is adopted.", "explhtml": "<p>According to Standard IV(C) Responsibilities of Supervisors, if Crane believes the company&#x27;s compliance procedures are not adequate, Crane should decline supervisory responsibilities in writing until an adequate system is adopted.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(C)<\/div><div class=\"qtext\"><p>A firm recently hired Hal Crane, CFA, to be a supervisor in the firm. Crane has reviewed the procedures for complying with the Code and Standards in the company. It is Crane&#x27;s belief that the procedures need revision in order to be effective. Crane must:<\/p><\/div>", "subj": "ethics"}, {"n": 29, "q": "A CFA Institute member, undertaking independent practice that could result in compensation or other benefit:", "opts": ["must notify his employer and clients of the types of service to be rendered and the expected compensation.", "must notify the entities for whom he plans to undertake independent practice of the compensation he receives from his employer.", "must notify his employer of the types of service to be rendered, the expected duration, and the expected compensation."], "ans": "C", "expl": "According to Standard IV(A), Loyalty to Employer, a CFA Institute member, undertaking independent practice that could result in compensation or other benefit, must notify his employer of the types of service to be rendered, the expected duration, and the expected compensation.", "explhtml": "<p>According to Standard IV(A), Loyalty to Employer, a CFA Institute member, undertaking independent practice that could result in compensation or other benefit, must notify his employer of the types of service to be rendered, the expected duration, and the expected compensation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>A CFA Institute member, undertaking independent practice that could result in compensation or other benefit:<\/p><\/div>", "subj": "ethics"}, {"n": 30, "q": "John Hill, CFA, has been working for Advisors, Inc., for eight years. Hill is about to start his own money management business and has given his two weeks' notice of his resignation from Advisors. A few days before his resignation takes effect, Rod Bright, a former client of Advisors, calls Hill at his home about his new firm. Bright says that he is very happy that Hill is leaving Advisors because now he and Hill can resume a professional relationship. Bright says that he would never become a client of Advisors again. Hill promises to call Bright back after he has left Advisors but takes no further action. Hill does not tell Advisors about the call. Hill has most likely:", "opts": ["not violated the Standards.", "violated the Standard concerning avoidance or disclosure of conflicts.", "violated the Standard concerning loyalty to employer."], "ans": "A", "expl": "Based on the information here, Hill has not violated the Standards. The phone call was not with a current client of Advisors, and the individual made it clear that he would not become a client of Advisors. Therefore, there was no breach of loyalty to Advisors by Hill for not acting in his employer's interests, nor is there a conflict of interest.", "explhtml": "<p>Based on the information here, Hill has not violated the Standards. The phone call was not with a current client of Advisors, and the individual made it clear that he would not become a client of Advisors. Therefore, there was no breach of loyalty to Advisors by Hill for not acting in his employer&#x27;s interests, nor is there a conflict of interest.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>John Hill, CFA, has been working for Advisors, Inc., for eight years. Hill is about to start his own money management business and has given his two weeks&#x27; notice of his resignation from Advisors. A few days before his resignation takes effect, Rod Bright, a former client of Advisors, calls Hill at his home about his new firm. Bright says that he is very happy that Hill is leaving Advisors because now he and Hill can resume a professional relationship. Bright says that he would never become a client of Advisors again. Hill promises to call Bright back after he has left Advisors but takes no further action. Hill does not tell Advisors about the call. Hill has most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 31, "q": "Fernando Abrea, CFA was an analyst for Pacific Investments. In October he left Pacific and joined Global Securities as manager of a local office. Abrea's change of employment came about in the following manner: In April, Abrea contacted Global about a possible position he saw advertised in a financial publication and had exploratory meetings with Global. In July, Abrea submitted a strategic plan to Global and signed an agreement to join Global. He then contracted for office space on behalf of Global. On October 15, Abrea's resignation from Pacific became effective. He did not take any client lists from Pacific. On October 16, Abrea mailed a letter that explained his new undertaking with Global to prospective clients, including his former clients at Pacific. With respect to Standard IV(A) Loyalty, Abrea:", "opts": ["violated the Standard by contacting his former clients at Pacific.", "violated the Standard by contracting for office space on behalf of Global.", "did not violate the Standard."], "ans": "C", "expl": "According to Standard IV(A) Loyalty, preparations to leave employment are not prohibited. Even though Abrea engaged in significant preparatory activities prior to beginning his new venture, none of these actions suggest Abrea did not continue to act in Pacific's interests while he was employed by Pacific. Abrea may contact his former clients on behalf of Global after his employment by Pacific has officially ended, as long as he did not misappropriate their contact information from Pacific.", "explhtml": "<p>According to Standard IV(A) Loyalty, preparations to leave employment are not prohibited. Even though Abrea engaged in significant preparatory activities prior to beginning his new venture, none of these actions suggest Abrea did not continue to act in Pacific&#x27;s interests while he was employed by Pacific. Abrea may contact his former clients on behalf of Global after his employment by Pacific has officially ended, as long as he did not misappropriate their contact information from Pacific.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(A)<\/div><div class=\"qtext\"><p>Fernando Abrea, CFA was an analyst for Pacific Investments. In October he left Pacific and joined Global Securities as manager of a local office. Abrea&#x27;s change of employment came about in the following manner:<\/p><p>In April, Abrea contacted Global about a possible position he saw advertised in a financial publication and had exploratory meetings with Global. In July, Abrea submitted a strategic plan to Global and signed an agreement to join Global. He then contracted for office space on behalf of Global. On October 15, Abrea&#x27;s resignation from Pacific became effective. He did not take any client lists from Pacific. On October 16, Abrea mailed a letter that explained his new undertaking with Global to prospective clients, including his former clients at Pacific.<\/p><p>With respect to Standard IV(A) Loyalty, Abrea:<\/p><\/div>", "subj": "ethics"}, {"n": 32, "q": "Regarding the Paris trip, Lindquist:", "opts": ["can accept the gift if he determines, in consultation with his employer, that accepting the gift would not compromise his objectivity.", "cannot accept the gift under any circumstances.", "cannot accept the gift without disclosing it to his employer."], "ans": "B", "expl": "According to Standard I(B) concerning independence and objectivity, Lindquist cannot accept gifts that reasonably could be expected to compromise his independence and objectivity. Acceptance of such a gift would call into question his independence and objectivity; his first obligation is to his clients, not to Boston and Co.", "explhtml": "<p>According to Standard I(B) concerning independence and objectivity, Lindquist cannot accept gifts that reasonably could be expected to compromise his independence and objectivity. Acceptance of such a gift would call into question his independence and objectivity; his first obligation is to his clients, not to Boston and Co.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–37<\/div> <div class=\"pp-topic\">Module 41.7, LOS 41: IV(B)<\/div><div class=\"kq-note\">Câu thuộc item set (câu 32–37). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Regarding the Paris trip, Lindquist:<\/p><\/div>", "subj": "ethics"}, {"n": 33, "q": "With regard to the Chandler portfolio, Lindquist violated:", "opts": ["Standard III(A): Loyalty, Prudence, and Care, but not Standard I(D): Misconduct.", "neither Standard III(C): Suitability, nor Standard III(A): Loyalty, Prudence, and Care.", "Standard III(C): Suitability, but not Standard III(A): Loyalty, Prudence, and Care."], "ans": "B", "expl": "Lindquist's actions conform to Standard III(C): Suitability, Standard V(A): Diligence and Reasonable Basis, and Standard III(A): Loyalty, Prudence, and Care. Lindquist must take into account the risk level of the portfolio in its entirety, not individual securities within the portfolio. Although purchasing index put options is, by itself, inherently risky, in the context of a diversified portfolio it may well conform to a conservative client's risk tolerance by hedging some of the risk of owning equities. Lindquist may rightly determine that such a strategy is consistent with Chandler's investment policy statement. If properly constructed originally and properly explained to the client, no change in the investment policy statement is needed.", "explhtml": "<p>Lindquist&#x27;s actions conform to Standard III(C): Suitability, Standard V(A): Diligence and Reasonable Basis, and Standard III(A): Loyalty, Prudence, and Care. Lindquist must take into account the risk level of the portfolio in its entirety, not individual securities within the portfolio. Although purchasing index put options is, by itself, inherently risky, in the context of a diversified portfolio it may well conform to a conservative client&#x27;s risk tolerance by hedging some of the risk of owning equities. Lindquist may rightly determine that such a strategy is consistent with Chandler&#x27;s investment policy statement. If properly constructed originally and properly explained to the client, no change in the investment policy statement is needed.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–37<\/div> <div class=\"pp-topic\">Module 41.7, LOS 41: IV(B)<\/div><div class=\"qtext\"><p>With regard to the Chandler portfolio, Lindquist violated:<\/p><\/div>", "subj": "ethics"}, {"n": 34, "q": "With regard to Lindquist's seat on the board of Western Inns, he violated:", "opts": ["Standard VI(A): Disclosure of Conflicts, but not Standard IV(B): Additional Compensation Arrangements.", "no standards.", "Standard VI(A): Disclosure of Conflicts, and Standard IV(B): Additional Compensation Arrangements."], "ans": "C", "expl": "Under Standard IV(B), Lindquist is required to disclose in writing to his employer any benefits (monetary or non-monetary) he receives for services that are in addition to compensation or benefits provided by his employer. An informal discussion with his supervisor does not conform to the requirement that the notice be in writing. Under Standard VI(A), he is also required to disclose the arrangement to his clients because a directorship is a conflict of interest that could reasonably be expected to impair his objectivity. He must do so even if he currently holds no shares of Western in his clients' portfolios because it may impair his objectivity in recommending the stock for inclusion in clients' portfolios in the future. Lindquist violated Standard I(B) because clients could reasonably assume his objectivity is in question.", "explhtml": "<p>Under Standard IV(B), Lindquist is required to disclose in writing to his employer any benefits (monetary or non-monetary) he receives for services that are in addition to compensation or benefits provided by his employer. An informal discussion with his supervisor does not conform to the requirement that the notice be in writing. Under Standard VI(A), he is also required to disclose the arrangement to his clients because a directorship is a conflict of interest that could reasonably be expected to impair his objectivity. He must do so even if he currently holds no shares of Western in his clients&#x27; portfolios because it may impair his objectivity in recommending the stock for inclusion in clients&#x27; portfolios in the future. Lindquist violated Standard I(B) because clients could reasonably assume his objectivity is in question.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–37<\/div> <div class=\"pp-topic\">Module 41.7, LOS 41: IV(B)<\/div><div class=\"qtext\"><p>With regard to Lindquist&#x27;s seat on the board of Western Inns, he violated:<\/p><\/div>", "subj": "ethics"}, {"n": 35, "q": "Which of the following standards is most likely violated in Lindquist's use of his experimental version of the Midwestern model?", "opts": ["Standard IV(C): Responsibilities of Supervisors.", "Standard I(C): Misrepresentation (plagiarism).", "Standard V(A): Diligence and Reasonable Basis."], "ans": "C", "expl": "Lindquist's experimental model is not part of the formal research process and has not been adequately researched or tested. So, Lindquist does not have a reasonable basis for his recommendations. Lindquist's supervisor is required to make reasonable efforts to detect and prevent violations of applicable laws and the Code and Standards, but cannot be held responsible for all of Lindquist's actions when there is deliberate deceit involved. Plagiarism is not relevant here, because Lindquist has permission to use the model, and is not misrepresenting the work of others as his own work.", "explhtml": "<p>Lindquist&#x27;s experimental model is not part of the formal research process and has not been adequately researched or tested. So, Lindquist does not have a reasonable basis for his recommendations. Lindquist&#x27;s supervisor is required to make reasonable efforts to detect and prevent violations of applicable laws and the Code and Standards, but cannot be held responsible for all of Lindquist&#x27;s actions when there is deliberate deceit involved. Plagiarism is not relevant here, because Lindquist has permission to use the model, and is not misrepresenting the work of others as his own work.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–37<\/div> <div class=\"pp-topic\">Module 41.7, LOS 41: IV(B)<\/div><div class=\"qtext\"><p>Which of the following standards is most likely violated in Lindquist&#x27;s use of his experimental version of the Midwestern model?<\/p><\/div>", "subj": "ethics"}, {"n": 36, "q": "Lindquist's actions in advertising his investment performance:", "opts": ["conform to standards concerning performance presentation as long as Lindquist does not claim compliance with CFA Institute Global Investment Performance Standards.", "conform to all standards.", "violate Standard III(D): Performance Presentation."], "ans": "C", "expl": "Lindquist failed to conform to Standard III(D) by releasing misleading information concerning his historical performance at Midwestern. KMGR may use a different management style than Midwestern, rendering historical performance of little value to Midwestern clients. Claiming compliance with CFA Institute GIPS would only compound the problem. Misrepresenting performance results as occurring at one firm when they actually occurred at a previous employer is a violation of the presentation standards.", "explhtml": "<p>Lindquist failed to conform to Standard III(D) by releasing misleading information concerning his historical performance at Midwestern. KMGR may use a different management style than Midwestern, rendering historical performance of little value to Midwestern clients. Claiming compliance with CFA Institute GIPS would only compound the problem. Misrepresenting performance results as occurring at one firm when they actually occurred at a previous employer is a violation of the presentation standards.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–37<\/div> <div class=\"pp-topic\">Module 41.7, LOS 41: IV(B)<\/div><div class=\"qtext\"><p>Lindquist&#x27;s actions in advertising his investment performance:<\/p><\/div>", "subj": "ethics"}, {"n": 37, "q": "Regarding the NCAA tickets, what action must Lindquist take to avoid a violation of Standard I(B): Independence and Objectivity?", "opts": ["Informing his employer is sufficient.", "Obtain written consent from all parties involved.", "Disclose his receipt of the tickets to all other clients with the same investment objective as the Olson account."], "ans": "A", "expl": "Lindquist may accept this gift from a client for past performance as long as he informs his employer.", "explhtml": "<p>Lindquist may accept this gift from a client for past performance as long as he informs his employer.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–37<\/div> <div class=\"pp-topic\">Module 41.7, LOS 41: IV(B)<\/div><div class=\"qtext\"><p>Regarding the NCAA tickets, what action must Lindquist take to avoid a violation of Standard I(B): Independence and Objectivity?<\/p><\/div>", "subj": "ethics"}, {"n": 38, "q": "Marc Feldman, CFA, is manager of corporate investor relations for a high-tech startup, zippy.com, in Boise, Idaho. Feldman is well-known in the high tech community in Boise, and Dragon.com has asked if he will help them organize their investor relations function on a consulting basis. They offer him an all-expenses-paid two-week holiday for two on Australia's Gold Coast in payment. Regarding this offer as a CFA Institute member Feldman is:", "opts": ["not allowed to accept such an offer since it effectively places him in competition with his employer.", "allowed to accept the offer only with written approval from zippy and from Dragon.", "allowed to accept the offer only with written approval from zippy."], "ans": "B", "expl": "Under Standard IV(A) Loyalty to Employer, and Standard IV(B) Additional Compensation Arrangements, Feldman is allowed to accept the offer, but only with written permission from both zippy and Dragon.", "explhtml": "<p>Under Standard IV(A) Loyalty to Employer, and Standard IV(B) Additional Compensation Arrangements, Feldman is allowed to accept the offer, but only with written permission from both zippy and Dragon.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41.a<\/div><div class=\"qtext\"><p>Marc Feldman, CFA, is manager of corporate investor relations for a high-tech startup, zippy.com, in Boise, Idaho. Feldman is well-known in the high tech community in Boise, and Dragon.com has asked if he will help them organize their investor relations function on a consulting basis. They offer him an all-expenses-paid two-week holiday for two on Australia&#x27;s Gold Coast in payment. Regarding this offer as a CFA Institute member Feldman is:<\/p><\/div>", "subj": "ethics"}, {"n": 39, "q": "Which of the following statements is most accurate about the Standard concerning the responsibilities of supervisors?", "opts": ["If a supervisor does not make a reasonable effort to detect violations, she is in violation of the Standard even if no violations by her subordinates have occurred.", "If a subordinate violates a securities law, her supervisor is in violation of the Standard.", "If a supervisor makes a reasonable effort to detect violations, but fails to detect a violation that occurs, she has violated the Standard."], "ans": "A", "expl": "Standard IV(C) Responsibilities of Supervisors requires members to make a reasonable effort to detect and prevent violations by their subordinates of applicable laws, regulations, and rules. Violations by subordinates do not necessarily mean the supervisor has violated this Standard if the supervisor has made reasonable efforts to detect and prevent violations", "explhtml": "<p>Standard IV(C) Responsibilities of Supervisors requires members to make a reasonable effort to detect and prevent violations by their subordinates of applicable laws, regulations, and rules. Violations by subordinates do not necessarily mean the supervisor has violated this Standard if the supervisor has made reasonable efforts to detect and prevent violations<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.7, LOS 41: IV(C)<\/div><div class=\"qtext\"><p>Which of the following statements is most accurate about the Standard concerning the responsibilities of supervisors?<\/p><\/div>", "subj": "ethics"}, {"n": 40, "q": "Bill Fence, CFA, supervises a group of research analysts, none of whom have earned the CFA designation (nor are they CFA candidates). On several occasions he has attempted to get his firm to adopt a compliance system to ensure that applicable laws and regulations are followed. However, the firm's principals have never adopted his recommendations. Fence should most appropriately:", "opts": ["take no further action, because by encouraging his firm to adopt a compliance system he has fulfilled his obligations under the Code and Standards.", "refuse supervisory responsibility.", "report the inadequacy by submitting a complaint in writing to the CFA Institute Professional Conduct Program."], "ans": "B", "expl": "According to Standard IV(C), Responsibilities of Supervisors, if the member cannot discharge supervisory responsibilities because of a poor or nonexistent compliance system, the member should decline in writing to accept supervisory responsibility until the firm adopts an adequate system.", "explhtml": "<p>According to Standard IV(C), Responsibilities of Supervisors, if the member cannot discharge supervisory responsibilities because of a poor or nonexistent compliance system, the member should de
