<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "An analyst samples market capitalization (market cap) values from several stocks in an index composed of 250 stocks. From this sample, the standard deviation of market cap is $9.6 billion and the standard error of the mean market cap is $1.2 billion. The number of stocks in the sample is closest to:", "opts": ["8", "31", "64"], "ans": "C", "expl": "A sample is a subset of a population that is selected to represent the characteristics of that population. In this question, the representative\ncharacteristic is the market cap value. Many different sample groups can be drawn from a population; each group will have its own sample mean.\ns\nThe standard error of the sample mean, or X¯¯¯, is the standard deviation of distributions of the various sample means. The standard error of the\nmean decreases with increasing sample size (n). This means that larger sample sizes better represent the population. The sample size can be\nfound by rearranging the equation above.\n(s) (σ)\nNote that for the exam, a question may provide either the sample standard deviation or the population standard deviation . Regardless of\nwhich type of standard deviation is given, the sample size is calculated the same way.\n(Choice A) 8 results from neglecting to square the equation.\n(Choice B) 31 is the result of incorrectly dividing the standard error by the standard deviation and multiplying that quotient by the size of the\npopulation.\nThings to remember:\ns\nThe standard error of the sample mean, or X¯¯¯, is the standard deviation of distributions of the sample means. The standard error decreases as\nthe sample size increases.\nExplain the central limit theorem and its importance for the distribution and standard error of the sample mean", "qhtml": null}, {"n": 2, "q": "A manager attempts to replicate the performance of a bond index through sampling. First the bonds are classified by geography, next they are separated into different maturity categories, finally they are divided into different sectors. After this, the manager combines samples drawn from each subgroup. This process is most accurately described as:", "opts": ["systematic sampling.", "simple random sampling.", "stratified random sampling."], "ans": "C", "expl": "Stratified random sampling is a method that separates a large population into subgroups (ie, strata) based on different criteria. From each\nsubgroup, a sample is drawn. The sample size is proportional to the size of the subgroup within the population. All the samples from the\nsubgroups are combined to form a stratified random sample. This whole process ensures that subpopulations are accurately represented in a\nsample.\nIn this question, the bond index is the population. The manager separates the bonds into different strata based on geography, maturity, and\nsector. The manager then draws a sample from each stratum and combines the results into one stratified random sample.\n(Choice A) The systematic sampling approach is similar to the simple random sampling approach. The difference is that systematic sampling\nselects every kth member. For example, out of 10,000 random numbers, every 10th number will be selected until 100 numbers are chosen.\n(Choice B) A simple random sample is drawn by randomly selecting a subset of a population where each individual member of the population has\nan equal chance of being selected. For example, a manager wants to draw a simple random sample of 100 bonds from a bond population of\n10,000 bonds. The manager can randomly assign each bond a number 1 through 10,000. A software program then generates a random sample\nof 100 numbers.\nThings to remember:\nStratified random sampling is a method that separates a large population into subgroups (strata) based on different criteria. From each subgroup,\nthe size of the drawn sample is based on the proportional weight of the subgroup within the population. All the samples from the subgroups are\ncombined to form a stratified random sample.\nCompare and contrast simple random, stratified random, cluster, convenience, and judgmental sampling and their implications for sampling error\nin an investment problem", "qhtml": null}, {"n": 3, "q": "A sample is drawn from a population. Which of the following best describes all the requirement(s) for the sample mean to be an accurate estimate of the population mean?", "opts": ["The sample size is a least 30.", "The sample size is a least 30 and the population has a finite variance.", "The sample size is at least 30 and the population has a finite variance and is normally distributed."], "ans": "B", "expl": "Analysts using statistical tests need to understand whether sample statistics accurately estimate population parameters. The implication of the\nCentral Limit Theorem is that regardless of the distribution of a population, as long as the sample size is sufficiently large (≥ 30) and the\npopulation variance is finite, the sample mean is an accurate estimate of the population mean (Choices A and C).\nThings to remember:\nThe Central Limit Theorem states that for sample sizes of at least 30 from a population with finite variance, the sample mean is an accurate\nestimate of the population mean, regardless of the distribution of the population.\nExplain the central limit theorem and its importance for the distribution and standard error of the sample mean", "qhtml": null}, {"n": 4, "q": "An analyst is estimating the standard error of the sample mean for a population and compiles the following information: Population variance 12.3 Sample variance 10.7 Sample size 30 The most appropriate estimate of the standard error of the sample mean is closest to:", "opts": ["It can be estimated accurately at 7.5.", "It can be estimated accurately at 480.", "It cannot be estimated accurately since the population is not normally distributed."], "ans": "B", "expl": "The Central Limit Theorem states that for a population of any distribution, if\nsample size is large enough (≥ 30), and\npopulation variance is finite,\nthen the variance of the sample mean (s2) is equal to the population variance (σ2) divided by the sample size (n). Thus, the population variance\nis the product of the sample size and the variance of the sample mean. The Central Limit Theorem implies the variance of the sample mean\ncan be used to estimate the population variance.\nIn this scenario, the population variance is estimated as follows:\n(Choice A) 7.5 is the result of incorrectly dividing s2 by n to obtain σ2. This reverses the places of σ2 and s2 in the correct formula.\n(Choice C) The Central Limit Theorem states that if n ≥ 30 and the population does not have infinite variance, then σ2 can be estimated from s2\nusing σ2 = ns2. There is no requirement that the population be normally distributed.\nThings to remember:\nThe Central Limit Theorem states that for populations of finite variance and sample size greater than or equal to 30, the variance of the same\nmean is equal to the population variance divided by the sample size. The theorem holds that the sample mean is an accurate estimator of the\npopulation mean, given that the above conditions are met.\nExplain the central limit theorem and its importance for the distribution and standard error of the sample mean", "qhtml": null}, {"n": 5, "q": "An analyst takes a number of samples from a nonnormally distributed collection of 3,000 hedge fund returns. The population has a finite variance. Each sample contains 60 hedge fund returns, and the variance of the sample mean is 8. Which of the following best describes the population variance?", "opts": ["It can be estimated accurately at 7.5.", "It can be estimated accurately at 480.", "It cannot be estimated accurately since the population is not normally distributed."], "ans": "B", "expl": "The Central Limit Theorem states that for a population of any distribution, if\nsample size is large enough (≥ 30), and\npopulation variance is finite,\nthen the variance of the sample mean (s2) is equal to the population variance (σ2) divided by the sample size (n). Thus, the population variance\nis the product of the sample size and the variance of the sample mean. The Central Limit Theorem implies the variance of the sample mean\ncan be used to estimate the population variance.\nIn this scenario, the population variance is estimated as follows:\n(Choice A) 7.5 is the result of incorrectly dividing s2 by n to obtain σ2. This reverses the places of σ2 and s2 in the correct formula.\n(Choice C) The Central Limit Theorem states that if n ≥ 30 and the population does not have infinite variance, then σ2 can be estimated from s2\nusing σ2 = ns2. There is no requirement that the population be normally distributed.\nThings to remember:\nThe Central Limit Theorem states that for populations of finite variance and sample size greater than or equal to 30, the variance of the same\nmean is equal to the population variance divided by the sample size. The theorem holds that the sample mean is an accurate estimator of the\npopulation mean, given that the above conditions are met.\nExplain the central limit theorem and its importance for the distribution and standard error of the sample mean", "qhtml": null}, {"n": 6, "q": "The sampling distribution of the mean most accurately captures the distribution of all sample means from:", "opts": ["the same random sample.", "different random samples of the same size.", "different random samples of different sizes."], "ans": "B", "expl": "A sample statistic, such as the sample mean, is a random variable that can take on different values based on the random samples drawn from\nthe same population. The distribution of the sample mean encompasses the distribution of all the distinct possible sample mean values when the\nsample sizes (n) are the same.\nNote: The random samples may overlap, which means that a given observation from the population may be included in more than one sample.\nThis is demonstrated in the table above, where the heights of two individuals are contained in two separate samples.\nThings to remember:\nThe sample distribution of a statistic captures the distribution of all possible values that the statistic can assume based on different samples of the\nsame size drawn from the same population.\nCompare and contrast simple random, stratified random, cluster, convenience, and judgmental sampling and their implications for sampling error\nin an investment problem", "qhtml": null}, {"n": 7, "q": "Simple random sampling most likely:", "opts": ["Produces more precise estimates than stratified random sampling.", "Guarantees that population subdivisions are represented in the sample.", "Gives each member of the population an equal chance of being selected."], "ans": "C", "expl": "Simple random sample\nA sample is a subset of a population designed to represent the characteristics of that population. Samples are often used as a proxy for a\npopulation when calculating the characteristics of that population is too costly, too timely, or otherwise unfeasible. Simple random sampling and\nstratified random sampling are two common methods for selecting a sample.\nThe simple random sampling process involves randomly selecting a sample from a population in which each individual member of the\npopulation has an equal chance of being selected. For example, randomly selecting 200 pencils for quality testing from a population of 10,000\npencils creates a simple random sample.\nThe stratified random sampling process involves splitting a large population into subgroups (ie, strata) based on different criteria. From each\nsubgroup, a sample is drawn. The sample size is proportional to the size of the subgroup within the population. The samples from the subgroups\nare combined to form one stratified random sample. For example, dividing a bond index into different strata based on geography, maturity, and\nsector is considered stratified random sampling.\n(Choice A) Stratified random sampling produces parameter (eg, mean) estimates that are more accurate (ie, contain less variance) than those\nfrom simple random sampling.\n(Choice B) Stratified random sampling, not simple random sampling, ensures that population subdivisions are accurately represented in a\nsample.\nThings to remember:\nThe simple random sampling process randomly selects a sample from a population in which each individual member of the population has an\nequal chance of being selected. Unlike stratified random sampling, it does not ensure that subdivisions are represented in the sample and usually\nproduces less precise estimates.\nCompare and contrast simple random, stratified random, cluster, convenience, and judgmental sampling and their implications for sampling error\nin an investment problem", "qhtml": null}, {"n": 8, "q": "A large private equity fund contains 100 individual companies. If the standard deviation of revenue for all the companies is $2 million, then the standard error for a sample of 36 companies (in USD millions) is closest to:", "opts": ["0.111", "0.200", "0.333"], "ans": "C", "expl": "A sample is a subset of a population that is intended to represent the characteristics of that population. In this question, a sample of 36 companies\nis taken from a population of 100 companies. The representative characteristic is company revenue. Many different sample groups can be\nselected from this population; each group will have its own sample mean for revenue.\nThe standard error is the standard deviation of the various sample means. It can be used to assess the accuracy with which a sample statistic\n(sample mean revenue) represents the population parameter (population mean revenue). The standard error gradually decreases as the sample\nsize approaches the population size. This means that the sample mean deviates less from the population mean (ie, better represents the\npopulation mean) as the sample size increases.\n(σ) (s)\nNote that for the exam, a question may provide either the population standard deviation or sample standard deviation . Regardless of\nwhich type of standard deviation is given, the standard error is calculated the same way.\n(Choice A) 0.111 results from not taking the square root of n in the denominator.\n(Choice B) 0.200 results from incorrectly substituting the square root of the population size, not the sample size, in the denominator.\nThings to remember:\nA sample is a subset of a population that is intended to represent the characteristics of that population. The standard error is the standard\ndeviation of the sample mean. As the size of the sample approaches the size of the population, the standard error becomes smaller.\nExplain the central limit theorem and its importance for the distribution and standard error of the sample mean", "qhtml": null}, {"n": 9, "q": "As the size of a sample drawn from a population increases, the standard error of the sample most likely:", "opts": ["approaches zero.", "produces a wider confidence interval.", "approximates the standard deviation of the population."], "ans": "A", "expl": "The standard error of a sample statistic is the standard deviation of that statistic. According to the central limit theorem, a sample size greater\nthan or equal to 30 taken from a population will be normally distributed with its mean approximately equal to the population's mean.\nThe standard error is calculated by dividing the standard deviation by the square root of the sample size. A larger denominator results in a smaller\nfraction value, so as the sample size increases, the standard error approaches zero.\n(Choice B) A confidence interval represents a range of values that includes an unknown parameter, such as a population mean, with a specified\nprobability. As the sample size becomes larger, the standard error becomes smaller. All else equal, a smaller standard error produces a narrower\nconfidence interval.\n(Choice C) As demonstrated by the standard error formula, the standard error is the sample's standard deviation divided by the square root of the\nsample size, so the standard error of the sample is less than the sample's standard deviation.\nThings to remember:\nThe standard error is the standard deviation of a sample statistic, such as a sample mean. The standard error is inversely related to the size of\nthe sample. As the sample size increases, the standard error approaches zero.\nExplain the central limit theorem and its importance for the distribution and standard error of the sample mean", "qhtml": null}, {"n": 10, "q": "An analyst calculates a mean gross margin percentage of 29.5% from a sample of 50 companies in an industrial fund that contains 1,000 companies. The actual mean gross margin percentage of all the companies in this fund is 30.1%. The discrepancy between the analyst's estimate and the actual value is best described as:", "opts": ["sampling error.", "standard error.", "standard deviation."], "ans": "A", "expl": "Sampling error is the difference between a sample estimate (ie, statistic) and the actual population value (ie, parameter). A sample, by\ndefinition, does not include every member of the population; therefore, a statistical estimate seldom equals the actual value of the population\nparameter. The sample mean gross margin percentage from 50 companies does not equal the actual mean gross margin percentage from the\nentire population of 1,000 companies.\n(Choice B) Standard error is the standard deviation of sample means. It equals the standard deviation divided by the square root of the sample\nsize.\n(Choice C) Standard deviation measures a random variable's dispersion of outcomes around the mean. It equals the square root of the variance.\nThings to remember:\nSampling error is the difference between a sample estimate (ie, statistic) and the actual population value (ie, parameter).\nCompare and contrast simple random, stratified random, cluster, convenience, and judgmental sampling and their implications for sampling error\nin an investment problem", "qhtml": null}];
const CFG = {"title": "Wiley · Estimation and Inference", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Quantitative Methods · 10 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
