and returns on equity (ROE). The resulting regression equation is used to determine a predicted P/E ratio for the subject company using the subject company&#x27;s most recent year-end data. Swift has developed the following model, which has an R-squared of 81%, for the meatpacking industry (16 companies):<\/p><p>predicted P/E = 2.74 + 8.21(payout ratio) + 14.21(g) + 2.81(ROE)<\/p><div class=\"tbl\"><table><tr><td>(STD error)<\/td><td>(2.11)<\/td><td>(6.52)<\/td><td>(9.24)<\/td><td>(2.10)<\/td><\/tr><\/table><\/div><p>After Swift presents the model to Armor, she points out that models of this nature are subject to limitations. In particular, multicollinearity, which appears to be present in the meatpacking industry model, can create great difficulty in interpreting the effects of the individual coefficients of the model. Swift continues by stating that in spite of this limitation, models of this nature generally have known and significant predictive power across different periods, although not across different stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>Armor has been asked to identify the relative valuation merits of the three stocks. Which of the following statements is correct?<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "Based on Exhibit 1, which company has the lowest predicted P/E utilizing the meatpacking industry model presented by Swift?", "opts": ["Able Corporation.", "Baker, Inc.", "Charles Company."], "ans": "B", "expl": "Based on the model presented, the predicted P/E ratios can be calculated as: Able: 2.74 + 8.21(1.00 / 2.50) + 14.21(0.15) + 2.81(0.25) = 8.85 Baker: 2.74 + 8.21(1.60 / 4.80) + 14.21(0.10) + 2.81(0.15) = 7.32 Charles: 2.74 + 8.21(2.50 / 4.00) + 14.21(0.03) + 2.81(0.08) = 8.52 For Further Reference: (Study Session 11, Module 29.1, LOS 29.e)", "explhtml": "<p>Based on the model presented, the predicted P/E ratios can be calculated as:<\/p><p>Able: 2.74 + 8.21(1.00 / 2.50) + 14.21(0.15) + 2.81(0.25) = 8.85<\/p><p>Baker: 2.74 + 8.21(1.60 / 4.80) + 14.21(0.10) + 2.81(0.15) = 7.32<\/p><p>Charles: 2.74 + 8.21(2.50 / 4.00) + 14.21(0.03) + 2.81(0.08) = 8.52<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 29.1, LOS 29.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Armor, CFA, is a new stock analyst for Pedad Investments. One tool that Pedad uses to compare stock valuations is the dividend discount model (DDM). In particular, the firm evaluates stocks in terms of &quot;justified&quot; multiples of sales and book value. These multiples are based on algebraic manipulation of the DDM. Over time, these multiples seem to provide a good check on the market valuation of a stock relative to the company&#x27;s fundamentals. Any stock that is currently priced below its value based on a justified multiple of sales or book value is considered attractive for purchase by Pedad portfolio managers. Exhibit 1 contains financial information from the year just ended for three stable companies in the meatpacking industry: Able Corporation, Baker, Inc., and Charles Company, from which Armor will derive his valuation estimates.<\/p><p><b>Exhibit 1: Selected Financial Information<\/b><\/p><p>Able Corporation Baker, Inc. Charles Company<\/p><div class=\"tbl\"><table><tr><td>Revenue/share<\/td><td>$115.00<\/td><td>$52.80<\/td><td>$25.75<\/td><\/tr><tr><td>EPS<\/td><td>$2.50<\/td><td>$4.80<\/td><td>$4.00<\/td><\/tr><tr><td>DPS<\/td><td>$1.00<\/td><td>$1.60<\/td><td>$2.50<\/td><\/tr><tr><td>ROE<\/td><td>25%<\/td><td>15%<\/td><td>8%<\/td><\/tr><tr><td>Book value per share<\/td><td>$10.00<\/td><td>$32.00<\/td><td>$50.00<\/td><\/tr><tr><td>Stock price per share (current)<\/td><td>$60.00<\/td><td>$70.00<\/td><td>$35.50<\/td><\/tr><tr><td>Required return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><p>One of Pedad&#x27;s other equity analysts, Marie Swift, CFA, recently held a meeting with Armor to discuss a relatively new model the firm is implementing to determine the P/E ratios of companies that Pedad researches. Swift explains that the model utilizes a cross-sectional regression using the previous year-end data of a group of comparable companies&#x27; P/E ratios against their dividend payout ratios (payout ratio), sustainable growth rates (g), and returns on equity (ROE). The resulting regression equation is used to determine a predicted P/E ratio for the subject company using the subject company&#x27;s most recent year-end data. Swift has developed the following model, which has an R-squared of 81%, for the meatpacking industry (16 companies):<\/p><p>predicted P/E = 2.74 + 8.21(payout ratio) + 14.21(g) + 2.81(ROE)<\/p><div class=\"tbl\"><table><tr><td>(STD error)<\/td><td>(2.11)<\/td><td>(6.52)<\/td><td>(9.24)<\/td><td>(2.10)<\/td><\/tr><\/table><\/div><p>After Swift presents the model to Armor, she points out that models of this nature are subject to limitations. In particular, multicollinearity, which appears to be present in the meatpacking industry model, can create great difficulty in interpreting the effects of the individual coefficients of the model. Swift continues by stating that in spite of this limitation, models of this nature generally have known and significant predictive power across different periods, although not across different stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which company has the lowest predicted P/E utilizing the meatpacking industry model presented by Swift?<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "Evaluate Swift's comments regarding multicollinearity and predictive power. Which of the following comments is correct?", "opts": ["Only the comment about multicollinearity is correct.", "Only the comment about predictive power is correct.", "Both comments are correct."], "ans": "A", "expl": "Swift has correctly stated that if multicollinearity is present in a model, the interpretation of the individual regression coefficients becomes problematic. The existence of multicollinearity is generally signaled by a high R-squared value and low t-statistics on the regression coefficients. The t-stat for the coefficients for payout ratio, g, and ROE can be calculated as (8.21 / 6.52) = 1.26, (14.21 / 9.24) = 1.54, and (2.81 / 2.10) = 1.34, respectively. Note that all of these t-stats are well below the approximate critical value of 2, indicating they are statistically insignificant. With the high R-squared of 81% and insignificant t-stats, it appears that multicollinearity is indeed present in this model. Swift's comment regarding predictive power is incorrect. Cross-sectional regressions have unknown predictive power outside the specific sample and time period used to generate the regression. For Further Reference: (Study Session 2, Module 5.8, LOS 5.l)", "explhtml": "<p>Swift has correctly stated that if multicollinearity is present in a model, the interpretation of the individual regression coefficients becomes problematic. The existence of multicollinearity is generally signaled by a high R-squared value and low t-statistics on the regression coefficients. The t-stat for the coefficients for payout ratio, g, and ROE can be calculated as (8.21 / 6.52) = 1.26, (14.21 / 9.24) = 1.54, and (2.81 / 2.10) = 1.34, respectively. Note that all of these t-stats are well below the approximate critical value of 2, indicating they are statistically insignificant. With the high R-squared of 81% and insignificant t-stats, it appears that multicollinearity is indeed present in this model. Swift&#x27;s comment regarding predictive power is incorrect. Cross-sectional regressions have unknown predictive power outside the specific sample and time period used to generate the regression.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 5.8, LOS 5.l)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Armor, CFA, is a new stock analyst for Pedad Investments. One tool that Pedad uses to compare stock valuations is the dividend discount model (DDM). In particular, the firm evaluates stocks in terms of &quot;justified&quot; multiples of sales and book value. These multiples are based on algebraic manipulation of the DDM. Over time, these multiples seem to provide a good check on the market valuation of a stock relative to the company&#x27;s fundamentals. Any stock that is currently priced below its value based on a justified multiple of sales or book value is considered attractive for purchase by Pedad portfolio managers. Exhibit 1 contains financial information from the year just ended for three stable companies in the meatpacking industry: Able Corporation, Baker, Inc., and Charles Company, from which Armor will derive his valuation estimates.<\/p><p><b>Exhibit 1: Selected Financial Information<\/b><\/p><p>Able Corporation Baker, Inc. Charles Company<\/p><div class=\"tbl\"><table><tr><td>Revenue/share<\/td><td>$115.00<\/td><td>$52.80<\/td><td>$25.75<\/td><\/tr><tr><td>EPS<\/td><td>$2.50<\/td><td>$4.80<\/td><td>$4.00<\/td><\/tr><tr><td>DPS<\/td><td>$1.00<\/td><td>$1.60<\/td><td>$2.50<\/td><\/tr><tr><td>ROE<\/td><td>25%<\/td><td>15%<\/td><td>8%<\/td><\/tr><tr><td>Book value per share<\/td><td>$10.00<\/td><td>$32.00<\/td><td>$50.00<\/td><\/tr><tr><td>Stock price per share (current)<\/td><td>$60.00<\/td><td>$70.00<\/td><td>$35.50<\/td><\/tr><tr><td>Required return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><p>One of Pedad&#x27;s other equity analysts, Marie Swift, CFA, recently held a meeting with Armor to discuss a relatively new model the firm is implementing to determine the P/E ratios of companies that Pedad researches. Swift explains that the model utilizes a cross-sectional regression using the previous year-end data of a group of comparable companies&#x27; P/E ratios against their dividend payout ratios (payout ratio), sustainable growth rates (g), and returns on equity (ROE). The resulting regression equation is used to determine a predicted P/E ratio for the subject company using the subject company&#x27;s most recent year-end data. Swift has developed the following model, which has an R-squared of 81%, for the meatpacking industry (16 companies):<\/p><p>predicted P/E = 2.74 + 8.21(payout ratio) + 14.21(g) + 2.81(ROE)<\/p><div class=\"tbl\"><table><tr><td>(STD error)<\/td><td>(2.11)<\/td><td>(6.52)<\/td><td>(9.24)<\/td><td>(2.10)<\/td><\/tr><\/table><\/div><p>After Swift presents the model to Armor, she points out that models of this nature are subject to limitations. In particular, multicollinearity, which appears to be present in the meatpacking industry model, can create great difficulty in interpreting the effects of the individual coefficients of the model. Swift continues by stating that in spite of this limitation, models of this nature generally have known and significant predictive power across different periods, although not across different stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>Evaluate Swift&#x27;s comments regarding multicollinearity and predictive power. Which of the following comments is correct?<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "Hellens's claim regarding the 2-year forward contract on the 5-year, risk-free, zero coupon bond is most accurately described as:", "opts": ["incorrect, as the quoted price is roughly in line with the forward pricing model.", "incorrect, as the quoted price is much lower than the forward pricing model would suggest.", "correct."], "ans": "A", "expl": "To obtain F , first calculate the 2-year discount factor P and the 7-year discount factor P . (2,5) 2 7 For Further Reference: (Study Session 12, Module 32.1, LOS 32.b)", "explhtml": "<div class=\"tbl\"><table><tr><td>To obtain F<\/td><td>, first calculate the 2-year discount factor P  and the 7-year discount factor P .<\/td><td><\/td><\/tr><tr><td>(2,5)<\/td><td>2<\/td><td>7<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 32.1, LOS 32.b)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<\/summary><div class=\"vig-body\"><p>Ande Lindstrom is currently in the final year of his undergraduate degree in finance and is preparing to take the Level I CFA exam in December. To keep on top of the material, Lindstrom runs a website for his peers who are also planning to sit for the CFA exam.<\/p><p>Lindstrom is currently reviewing several submissions from classmates on the subject of fixed-income instruments. These submissions are especially topical because the U.S. central bank raised target rate in the previous month. Lindstrom intends to post the spot rate curve shown in Exhibit 1, which is derived from U.S. Treasuries, along with any articles he agrees with.<\/p><p><b>Exhibit 1: U.S. Treasuries Spot Curve<\/b><\/p><div class=\"tbl\"><table><tr><td>Maturity (years)<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>10<\/td><td>20<\/td><td>30<\/td><\/tr><tr><td>Spot Rate (%)<\/td><td>0.25<\/td><td>0.36<\/td><td>0.90<\/td><td>1.49<\/td><td>2.27<\/td><td>2.94<\/td><td>3.52<\/td><td>4.00<\/td><\/tr><\/table><\/div><p>Joe Hellens, a fellow Level I candidate, has submitted an article claiming that some banks are still offering forward rates that do not fully account for the new spot curve. As a result, Hellens claims that there are arbitrage opportunities. Upon analyzing a particular bank&#x27;s offering of a 2-year forward contract on a risk-free, 5-year, zero coupon bond, Hellens states that &quot;the quoted forward price of $0.8608 per $1 is higher than it should be under the forward pricing model and, hence, arbitrage profits could be made.&quot;<\/p><p>Lindstrom is always wary of posting articles on to the website that could be interpreted as investment advice. Instead, he prefers instructional articles that allow the reader to carry out their own research. In place of Hellens&#x27;s article on potential arbitrage opportunities (the profits of which he feels would be eliminated by transaction costs), Lindstrom intends to use the comment addressing active bond management shown in Exhibit 2.<\/p><p><b>Exhibit 2: Active Bond Management<\/b><\/p><p>&quot;Active bond managers will seek to outperform the market by anticipating interest rate movements that are not in line with current spot and forward rates. For example, the price of a 1-year forward contract on a 1- year, zero coupon, risk-free bond will remain unchanged if the future 1-year spot rate in one year is equal to the current 2-year spot rate. If it is not, there may be an opportunity for active managers to outperform the market.&quot;<\/p><p>Dan Gorman has submitted an article for Lindstrom&#x27;s review on the topic of the swap curve. Lindstrom is aware of the curve but unsure about how it is used in computing swap spreads and in bond valuation generally. Extracts from Gorman&#x27;s article are shown in Exhibit 3.<\/p><p><b>Exhibit 3: Swap Curves and Spreads<\/b><\/p><p>&quot;Swap spreads make use of the swap curve. Swap curves are a popular benchmark for the time value of money as they have at least two key advantages over the government yield curve:<\/p><p>Advantage One: Some countries do not have a liquid government bond market for maturities over one year. In those markets, the swap curve is an essential benchmark.<\/p><p>Advantage Two: Retail banks generally have familiarity with the swap market because they hedge assets and liabilities on their balance sheet with swaps. For this reason, the swap rate makes a useful benchmark for the time value of money for them.&quot;<\/p><p>Swap curves can also be used to calculate the swap spread, which is an increasingly popular indicator of credit spreads in the markets. The swap spread is defined as:<\/p><p>&quot;The spread paid by the floating-rate payer of an interest rate swap over the rate of the on-the-run government security with the same maturity.&quot;<\/p><p>The swap spread is a useful indicator of credit risk in the markets and can be used in conjunction with the TED, LIBOR- OIS, and Z-spreads to get an in-depth view of the state of the fixed-income markets. An investor can use these other three spreads as follows:<\/p><p>Z-spread: Calculated as the constant basis point spread added to the implied spot yield curve so that the discounted cash flows of a bond equal its market price. For a risky bond, the Z-spread is a more accurate measure of compensation for credit and liquidity risk than the swap spread.<\/p><p>TED spread: Calculated as the difference between LIBOR and the yield on a maturity-matched T-bill. TED spread gives better insight into the supply and demand conditions in the market at a given maturity as opposed to the swap spread, which focuses more on the risks in the banking system.<\/p><p>LIBOR-OIS spread: Calculated as the difference between LIBOR and the overnight indexed swap rate. It is considered a good indicator of the risk and liquidity inherent in the money markets.<\/p><p>Finally, Lindstrom has received an email from one of his professors praising his work on the website but also offering some constructive criticism. An extract from the email is shown in Exhibit 4.<\/p><p><b>Exhibit 4: Email<\/b><\/p><p>&quot;…I would suggest one area you could look at improving is the portion on term structure theories. Personally I would remove the theory stating that lenders and borrowers influence the shape of the yield curve and that the yield of each maturity sector is determined independently.<\/p><p>I suggest instead that you take a look at the following equilibrium term structure model, which calculates the change in the short term interest rate (dr) over small increments of time (dt):<\/p><p>It is a formula I personally use when modelling rates, typically with r = 3%, b = 8%, a = 0.40, σ = 20%.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Hellens&#x27;s claim regarding the 2-year forward contract on the 5-year, risk-free, zero coupon bond is most accurately described as:<\/p><\/div>", "subj": "fixed"}, {"n": 38, "q": "Lindstrom's comment in Exhibit 2 on active bond management is most likely:", "opts": ["correct.", "incorrect, as the forward price will be unchanged if the 1-year spot rate occurring in one year is equal to the current 1-year forward rate one year from now [f (1,1)].", "incorrect, as the forward price will be unchanged if the 1-year spot rate occurring in one year is equal to the current 1-year spot rate."], "ans": "B", "expl": "Spot rates should evolve in line with the current forward rates. For Further Reference: (Study Session 12, Module 32.1, LOS 32.c)", "explhtml": "<p>Spot rates should evolve in line with the current forward rates.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 32.1, LOS 32.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ande Lindstrom is currently in the final year of his undergraduate degree in finance and is preparing to take the Level I CFA exam in December. To keep on top of the material, Lindstrom runs a website for his peers who are also planning to sit for the CFA exam.<\/p><p>Lindstrom is currently reviewing several submissions from classmates on the subject of fixed-income instruments. These submissions are especially topical because the U.S. central bank raised target rate in the previous month. Lindstrom intends to post the spot rate curve shown in Exhibit 1, which is derived from U.S. Treasuries, along with any articles he agrees with.<\/p><p><b>Exhibit 1: U.S. Treasuries Spot Curve<\/b><\/p><div class=\"tbl\"><table><tr><td>Maturity (years)<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>10<\/td><td>20<\/td><td>30<\/td><\/tr><tr><td>Spot Rate (%)<\/td><td>0.25<\/td><td>0.36<\/td><td>0.90<\/td><td>1.49<\/td><td>2.27<\/td><td>2.94<\/td><td>3.52<\/td><td>4.00<\/td><\/tr><\/table><\/div><p>Joe Hellens, a fellow Level I candidate, has submitted an article claiming that some banks are still offering forward rates that do not fully account for the new spot curve. As a result, Hellens claims that there are arbitrage opportunities. Upon analyzing a particular bank&#x27;s offering of a 2-year forward contract on a risk-free, 5-year, zero coupon bond, Hellens states that &quot;the quoted forward price of $0.8608 per $1 is higher than it should be under the forward pricing model and, hence, arbitrage profits could be made.&quot;<\/p><p>Lindstrom is always wary of posting articles on to the website that could be interpreted as investment advice. Instead, he prefers instructional articles that allow the reader to carry out their own research. In place of Hellens&#x27;s article on potential arbitrage opportunities (the profits of which he feels would be eliminated by transaction costs), Lindstrom intends to use the comment addressing active bond management shown in Exhibit 2.<\/p><p><b>Exhibit 2: Active Bond Management<\/b><\/p><p>&quot;Active bond managers will seek to outperform the market by anticipating interest rate movements that are not in line with current spot and forward rates. For example, the price of a 1-year forward contract on a 1- year, zero coupon, risk-free bond will remain unchanged if the future 1-year spot rate in one year is equal to the current 2-year spot rate. If it is not, there may be an opportunity for active managers to outperform the market.&quot;<\/p><p>Dan Gorman has submitted an article for Lindstrom&#x27;s review on the topic of the swap curve. Lindstrom is aware of the curve but unsure about how it is used in computing swap spreads and in bond valuation generally. Extracts from Gorman&#x27;s article are shown in Exhibit 3.<\/p><p><b>Exhibit 3: Swap Curves and Spreads<\/b><\/p><p>&quot;Swap spreads make use of the swap curve. Swap curves are a popular benchmark for the time value of money as they have at least two key advantages over the government yield curve:<\/p><p>Advantage One: Some countries do not have a liquid government bond market for maturities over one year. In those markets, the swap curve is an essential benchmark.<\/p><p>Advantage Two: Retail banks generally have familiarity with the swap market because they hedge assets and liabilities on their balance sheet with swaps. For this reason, the swap rate makes a useful benchmark for the time value of money for them.&quot;<\/p><p>Swap curves can also be used to calculate the swap spread, which is an increasingly popular indicator of credit spreads in the markets. The swap spread is defined as:<\/p><p>&quot;The spread paid by the floating-rate payer of an interest rate swap over the rate of the on-the-run government security with the same maturity.&quot;<\/p><p>The swap spread is a useful indicator of credit risk in the markets and can be used in conjunction with the TED, LIBOR- OIS, and Z-spreads to get an in-depth view of the state of the fixed-income markets. An investor can use these other three spreads as follows:<\/p><p>Z-spread: Calculated as the constant basis point spread added to the implied spot yield curve so that the discounted cash flows of a bond equal its market price. For a risky bond, the Z-spread is a more accurate measure of compensation for credit and liquidity risk than the swap spread.<\/p><p>TED spread: Calculated as the difference between LIBOR and the yield on a maturity-matched T-bill. TED spread gives better insight into the supply and demand conditions in the market at a given maturity as opposed to the swap spread, which focuses more on the risks in the banking system.<\/p><p>LIBOR-OIS spread: Calculated as the difference between LIBOR and the overnight indexed swap rate. It is considered a good indicator of the risk and liquidity inherent in the money markets.<\/p><p>Finally, Lindstrom has received an email from one of his professors praising his work on the website but also offering some constructive criticism. An extract from the email is shown in Exhibit 4.<\/p><p><b>Exhibit 4: Email<\/b><\/p><p>&quot;…I would suggest one area you could look at improving is the portion on term structure theories. Personally I would remove the theory stating that lenders and borrowers influence the shape of the yield curve and that the yield of each maturity sector is determined independently.<\/p><p>I suggest instead that you take a look at the following equilibrium term structure model, which calculates the change in the short term interest rate (dr) over small increments of time (dt):<\/p><p>It is a formula I personally use when modelling rates, typically with r = 3%, b = 8%, a = 0.40, σ = 20%.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Lindstrom&#x27;s comment in Exhibit 2 on active bond management is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 39, "q": "Which of the advantages of swap curves listed in Exhibit 3 is accurate?", "opts": ["Advantage one only.", "Advantage two only.", "Both advantages one and two are accurate."], "ans": "A", "expl": "Retail banks typically have little exposure to swaps and, consequently, they typically use the government yield curve. The swap curve is more commonly used by wholesale banks. For Further Reference: (Study Session 12, Module 32.2, LOS 32.e)", "explhtml": "<p>Retail banks typically have little exposure to swaps and, consequently, they typically use the government yield curve. The swap curve is more commonly used by wholesale banks.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 32.2, LOS 32.e)<\/p>", "qhtml": "<details class=\"vig\"> ocating the exclusion of:", "opts": ["the segmented markets theory in favor of the Cox-Ingersoll-Ross model, with a mean reverting, short-term interest rate of 8%.", "the preferred habitat theory in favor of the Vasicek model, with a mean reverting, short-term interest rate of 3%.", "the segmented markets theory in favor of the Cox-Ingersoll-Ross model, with a mean reverting, short-term interest rate of 2%."], "ans": "A", "expl": "The segmented markets theory and the preferred habitat theory both state that rates are influenced by lenders and borrowers, but it is the segmented markets theory that proposes that the maturity sectors are independent. The \"b\" term in the Cox-Ingersoll-Ross model is the mean reverting level for the short-term interest rate. For Further Reference: (Study Session 12, Module 32.5, LOS 32.i, 32.j)", "explhtml": "<p>The segmented markets theory and the preferred habitat theory both state that rates are influenced by lenders and borrowers, but it is the segmented markets theory that proposes that the maturity sectors are independent. The &quot;b&quot; term in the Cox-Ingersoll-Ross model is the mean reverting level for the short-term interest rate.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 32.5, LOS 32.i, 32.j)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ande Lindstrom is currently in the final year of his undergraduate degree in finance and is preparing to take the Level I CFA exam in December. To keep on top of the material, Lindstrom runs a website for his peers who are also planning to sit for the CFA exam.<\/p><p>Lindstrom is currently reviewing several submissions from classmates on the subject of fixed-income instruments. These submissions are especially topical because the U.S. central bank raised target rate in the previous month. Lindstrom intends to post the spot rate curve shown in Exhibit 1, which is derived from U.S. Treasuries, along with any articles he agrees with.<\/p><p><b>Exhibit 1: U.S. Treasuries Spot Curve<\/b><\/p><div class=\"tbl\"><table><tr><td>Maturity (years)<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>10<\/td><td>20<\/td><td>30<\/td><\/tr><tr><td>Spot Rate (%)<\/td><td>0.25<\/td><td>0.36<\/td><td>0.90<\/td><td>1.49<\/td><td>2.27<\/td><td>2.94<\/td><td>3.52<\/td><td>4.00<\/td><\/tr><\/table><\/div><p>Joe Hellens, a fellow Level I candidate, has submitted an article claiming that some banks are still offering forward rates that do not fully account for the new spot curve. As a result, Hellens claims that there are arbitrage opportunities. Upon analyzing a particular bank&#x27;s offering of a 2-year forward contract on a risk-free, 5-year, zero coupon bond, Hellens states that &quot;the quoted forward price of $0.8608 per $1 is higher than it should be under the forward pricing model and, hence, arbitrage profits could be made.&quot;<\/p><p>Lindstrom is always wary of posting articles on to the website that could be interpreted as investment advice. Instead, he prefers instructional articles that allow the reader to carry out their own research. In place of Hellens&#x27;s article on potential arbitrage opportunities (the profits of which he feels would be eliminated by transaction costs), Lindstrom intends to use the comment addressing active bond management shown in Exhibit 2.<\/p><p><b>Exhibit 2: Active Bond Management<\/b><\/p><p>&quot;Active bond managers will seek to outperform the market by anticipating interest rate movements that are not in line with current spot and forward rates. For example, the price of a 1-year forward contract on a 1- year, zero coupon, risk-free bond will remain unchanged if the future 1-year spot rate in one year is equal to the current 2-year spot rate. If it is not, there may be an opportunity for active managers to outperform the market.&quot;<\/p><p>Dan Gorman has submitted an article for Lindstrom&#x27;s review on the topic of the swap curve. Lindstrom is aware of the curve but unsure about how it is used in computing swap spreads and in bond valuation generally. Extracts from Gorman&#x27;s article are shown in Exhibit 3.<\/p><p><b>Exhibit 3: Swap Curves and Spreads<\/b><\/p><p>&quot;Swap spreads make use of the swap curve. Swap curves are a popular benchmark for the time value of money as they have at least two key advantages over the government yield curve:<\/p><p>Advantage One: Some countries do not have a liquid government bond market for maturities over one year. In those markets, the swap curve is an essential benchmark.<\/p><p>Advantage Two: Retail banks generally have familiarity with the swap market because they hedge assets and liabilities on their balance sheet with swaps. For this reason, the swap rate makes a useful benchmark for the time value of money for them.&quot;<\/p><p>Swap curves can also be used to calculate the swap spread, which is an increasingly popular indicator of credit spreads in the markets. The swap spread is defined as:<\/p><p>&quot;The spread paid by the floating-rate payer of an interest rate swap over the rate of the on-the-run government security with the same maturity.&quot;<\/p><p>The swap spread is a useful indicator of credit risk in the markets and can be used in conjunction with the TED, LIBOR- OIS, and Z-spreads to get an in-depth view of the state of the fixed-income markets. An investor can use these other three spreads as follows:<\/p><p>Z-spread: Calculated as the constant basis point spread added to the implied spot yield curve so that the discounted cash flows of a bond equal its market price. For a risky bond, the Z-spread is a more accurate measure of compensation for credit and liquidity risk than the swap spread.<\/p><p>TED spread: Calculated as the difference between LIBOR and the yield on a maturity-matched T-bill. TED spread gives better insight into the supply and demand conditions in the market at a given maturity as opposed to the swap spread, which focuses more on the risks in the banking system.<\/p><p>LIBOR-OIS spread: Calculated as the difference between LIBOR and the overnight indexed swap rate. It is considered a good indicator of the risk and liquidity inherent in the money markets.<\/p><p>Finally, Lindstrom has received an email from one of his professors praising his work on the website but also offering some constructive criticism. An extract from the email is shown in Exhibit 4.<\/p><p><b>Exhibit 4: Email<\/b><\/p><p>&quot;…I would suggest one area you could look at improving is the portion on term structure theories. Personally I would remove the theory stating that lenders and borrowers influence the shape of the yield curve and that the yield of each maturity sector is determined independently.<\/p><p>I suggest instead that you take a look at the following equilibrium term structure model, which calculates the change in the short term interest rate (dr) over small increments of time (dt):<\/p><p>It is a formula I personally use when modelling rates, typically with r = 3%, b = 8%, a = 0.40, σ = 20%.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>The professor who sent the email in Exhibit 4 is most likely advocating the exclusion of:<\/p><\/div>", "subj": "fixed"}, {"n": 43, "q": "Which of the following positions is most likely to achieve the CFO's objective for the $68 million bond outstanding?", "opts": ["Pay fixed interest rate swap with quarterly settlement.", "Pay floating interest rate swap with quarterly settlement.", "Long FRA on 90-day LIBOR."], "ans": "B", "expl": "The CFO is looking to reduce the duration of the fixed-rate bond. The risk here is that market interest rates drop below 6.25%, but we're stuck still paying 6.25%. We can reduce this specific risk by effectively changing that fixed payment into a floating payment. A pay floating and receive fixed swap is most likely to achieve this objective. For Further Reference: (Study Session 14, Module 37.7, LOS 37.c)", "explhtml": "<p>The CFO is looking to reduce the duration of the fixed-rate bond. The risk here is that market interest rates drop below 6.25%, but we&#x27;re stuck still paying 6.25%. We can reduce this specific risk by effectively changing that fixed payment into a floating payment. A pay floating and receive fixed swap is most likely to achieve this objective.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.7, LOS 37.c)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<\/summary><div class=\"vig-body\"><p>Jon Garton, CFA, is an equity analyst covering several industry sectors for a boutique U.S. investment firm. Currently Garton is reviewing a reply that he received from the CFO of TorkSpark, Inc., a manufacturer of automotive parts.<\/p><p>Garton had noticed that the most recent quarterly filing by TorkSpark showed an increase in the volume of derivative transactions that showed gains and losses either in the income statement or in other comprehensive income. This is the third quarter in a row that Garton has observed such an increase, and in a recent analyst call, Garton asked the CFO to give some explanation for such an increase.<\/p><p>Extracts from the CFO&#x27;s reply are shown in Exhibit 1.<\/p><p><b>Exhibit 1: TorkSpark CFO comments<\/b><\/p><p>&quot;TorkSpark currently has a $68 million bond outstanding that is not due to mature until 2028. The coupon payments are fixed at 6.25% and paid quarterly. A decision was taken recently to try to reduce the interest rate risk on the bond.<\/p><p>The board also identified a need to address the financing of TorkSpark Plc., our wholly owned subsidiary in the UK. In order to raise the 175 million GBP needed to fund an expansion of the operations, the board leveraged its relationship with the Lobman Starn banking group here in the United States.<\/p><p>TorkSpark borrowed 250 million USD and set up a USD-GBP currency swap with a swap dealer based in Europe. Unfortunately, the dealer experienced some issues trying to hedge their position, so TorkSpark agreed to settle the swap at the PV of future payments only 170 days after origination.<\/p><p>The only other currency derivative TorkSpark used in the period was a currency forward contract that was used to hedge the risk on an unusually large EUR receipt. Due to TorkSpark discontinuing a product line, Redaux SA, a frequent customer, agreed to pay a large sum for all remaining stock. Due to continued political turbulence in the Eurozone, TorkSpark opted to hedge 60% of the EUR receivable.&quot; Garton is familiar with Torkspark&#x27;s euro currency forward contract because it was discussed in detail in the analyst call. The currency forward lead to a large loss that was offset by a gain on the receivable in other comprehensive income in the financial statements. Details of the contract are shown in Exhibit 2.<\/p><p><b>Exhibit 2: Currency Forward Contract<\/b><\/p><div class=\"tbl\"><table><tr><td>Contract length:<\/td><td>90 days<\/td><\/tr><tr><td>90-day forward rate at origination:<\/td><td>€/$0.89239<\/td><\/tr><tr><td>Spot rate at origination:<\/td><td>€/$0.89298<\/td><\/tr><tr><td>90-day forward rate at expiry:<\/td><td>€/$0.84256<\/td><\/tr><tr><td>Spot rate at expiry:<\/td><td>€/$0.84487<\/td><\/tr><tr><td>Loss at settlement date:<\/td><td>$189,083<\/td><\/tr><\/table><\/div><p>Garton is not convinced that all the derivatives transactions reflected in TorkSpark&#x27;s financial statements are purely for hedging. He believes that there are significant exposures to both interest rate and currency risk for the next six quarters. As a result, Garton intends to suggest that his firm hedge their holding of TorkSpark stock using exchange-traded options.<\/p><p>Garton collects the following information about TorkSpark:<\/p><p>1. One-year, at-the-money calls with exercise price of $60 are highly liquid. 2. Over the year, the stock price can increase to $72 or decline to $50. 3. The risk-free rate is 3%.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following positions is most likely to achieve the CFO&#x27;s objective for the $68 million bond outstanding?<\/p><\/div>", "subj": "derivatives"}, {"n": 44, "q": "In order to hedge exposure to the currency swap described by the CFO, the swap dealer would least appropriately:", "opts": ["borrow GBP.", "borrow USD.", "lend USD."], "ans": "B", "expl": "TorkSpark has borrowed USD and thus should engage in a USD for GBP swap. At initiation, TorkSpark would exchange USD principal for GBP principal. During the life of the swap, Torkspark would pay GBP interest and the swap dealer would pay USD interest. In order to hedge these flows, the dealer could enter into a GBP for USD swap. Alternately, the dealer could lend USD and borrow GBP. For Further Reference: (Study Session 14, Module 37.8, LOS 37.c)", "explhtml": "<p>TorkSpark has borrowed USD and thus should engage in a USD for GBP swap. At initiation, TorkSpark would exchange USD principal for GBP principal. During the life of the swap, Torkspark would pay GBP interest and the swap dealer would pay USD interest. In order to hedge these flows, the dealer could enter into a GBP for USD swap. Alternately, the dealer could lend USD and borrow GBP.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.8, LOS 37.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Garton, CFA, is an equity analyst covering several industry sectors for a boutique U.S. investment firm. Currently Garton is reviewing a reply that he received from the CFO of TorkSpark, Inc., a manufacturer of automotive parts.<\/p><p>Garton had noticed that the most recent quarterly filing by TorkSpark showed an increase in the volume of derivative transactions that showed gains and losses either in the income statement or in other comprehensive income. This is the third quarter in a row that Garton has observed such an increase, and in a recent analyst call, Garton asked the CFO to give some explanation for such an increase.<\/p><p>Extracts from the CFO&#x27;s reply are shown in Exhibit 1.<\/p><p><b>Exhibit 1: TorkSpark CFO comments<\/b><\/p><p>&quot;TorkSpark currently has a $68 million bond outstanding that is not due to mature until 2028. The coupon payments are fixed at 6.25% and paid quarterly. A decision was taken recently to try to reduce the interest rate risk on the bond.<\/p><p>The board also identified a need to address the financing of TorkSpark Plc., our wholly owned subsidiary in the UK. In order to raise the 175 million GBP needed to fund an expansion of the operations, the board leveraged its relationship with the Lobman Starn banking group here in the United States.<\/p><p>TorkSpark borrowed 250 million USD and set up a USD-GBP currency swap with a swap dealer based in Europe. Unfortunately, the dealer experienced some issues trying to hedge their position, so TorkSpark agreed to settle the swap at the PV of future payments only 170 days after origination.<\/p><p>The only other currency derivative TorkSpark used in the period was a currency forward contract that was used to hedge the risk on an unusually large EUR receipt. Due to TorkSpark discontinuing a product line, Redaux SA, a frequent customer, agreed to pay a large sum for all remaining stock. Due to continued political turbulence in the Eurozone, TorkSpark opted to hedge 60% of the EUR receivable.&quot; Garton is familiar with Torkspark&#x27;s euro currency forward contract because it was discussed in detail in the analyst call. The currency forward lead to a large loss that was offset by a gain on the receivable in other comprehensive income in the financial statements. Details of the contract are shown in Exhibit 2.<\/p><p><b>Exhibit 2: Currency Forward Contract<\/b><\/p><div class=\"tbl\"><table><tr><td>Contract length:<\/td><td>90 days<\/td><\/tr><tr><td>90-day forward rate at origination:<\/td><td>€/$0.89239<\/td><\/tr><tr><td>Spot rate at origination:<\/td><td>€/$0.89298<\/td><\/tr><tr><td>90-day forward rate at expiry:<\/td><td>€/$0.84256<\/td><\/tr><tr><td>Spot rate at expiry:<\/td><td>€/$0.84487<\/td><\/tr><tr><td>Loss at settlement date:<\/td><td>$189,083<\/td><\/tr><\/table><\/div><p>Garton is not convinced that all the derivatives transactions reflected in TorkSpark&#x27;s financial statements are purely for hedging. He believes that there are significant exposures to both interest rate and currency risk for the next six quarters. As a result, Garton intends to suggest that his firm hedge their holding of TorkSpark stock using exchange-traded options.<\/p><p>Garton collects the following information about TorkSpark:<\/p><p>1. One-year, at-the-money calls with exercise price of $60 are highly liquid. 2. Over the year, the stock price can increase to $72 or decline to $50. 3. The risk-free rate is 3%.<\/p><\/div><\/details><div class=\"qtext\"><p>In order to hedge exposure to the currency swap described by the CFO, the swap dealer would least appropriately:<\/p><\/div>", "subj": "derivatives"}, {"n": 45, "q": "The value of the euro receivable due from Redaux is closest to:", "opts": ["€1,800,000.", "€3,000,000.", "€5,000,000."], "ans": "C", "expl": "$/€ spot rate at expiry = 1 / 0.84487 = 1.18361 $/€ $/€ forward rate at initiation = 1 / 0.89239 = 1.12059 $/€ $ loss per € = 1.12059 − 1.18361 = $0.06302 Loss on forward contract (given) = $189,083 Total € hedged = 189,083 / 0.06302 = €3,000,365. Given 60% hedged, Total € receivable = 3,000,365 / 0.6 = €5,000,608 For Further Reference: (Study Session 14, Module 37.6, LOS 37.a)", "explhtml": "<p>$/€ spot rate at expiry = 1 / 0.84487 = 1.18361 $/€<\/p><p>$/€ forward rate at initiation = 1 / 0.89239 = 1.12059 $/€<\/p><p>$ loss per € = 1.12059 − 1.18361 = $0.06302<\/p><p>Loss on forward contract (given) = $189,083<\/p><p>Total € hedged = 189,083 / 0.06302 = €3,000,365.<\/p><p>Given 60% hedged, Total € receivable = 3,000,365 / 0.6 = €5,000,608<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.6, LOS 37.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Garton, CFA, is an equity analyst covering several industry sectors for a boutique U.S. investment firm. Currently Garton is reviewing a reply that he received from the CFO of TorkSpark, Inc., a manufacturer of automotive parts.<\/p><p>Garton had noticed that the most recent quarterly filing by TorkSpark showed an increase in the volume of derivative transactions that showed gains and losses either in the income statement or in other comprehensive income. This is the third quarter in a row that Garton has observed such an increase, and in a recent analyst call, Garton asked the CFO to give some explanation for such an increase.<\/p><p>Extracts from the CFO&#x27;s reply are shown in Exhibit 1.<\/p><p><b>Exhibit 1: TorkSpark CFO comments<\/b><\/p><p>&quot;TorkSpark currently has a $68 million bond outstanding that is not due to mature until 2028. The coupon payments are fixed at 6.25% and paid quarterly. A decision was taken recently to try to reduce the interest rate risk on the bond.<\/p><p>The board also identified a need to address the financing of TorkSpark Plc., our wholly owned subsidiary in the UK. In order to raise the 175 million GBP needed to fund an expansion of the operations, the board leveraged its relationship with the Lobman Starn banking group here in the United States.<\/p><p>TorkSpark borrowed 250 million USD and set up a USD-GBP currency swap with a swap dealer based in Europe. Unfortunately, the dealer experienced some issues trying to hedge their position, so TorkSpark agreed to settle the swap at the PV of future payments only 170 days after origination.<\/p><p>The only other currency derivative TorkSpark used in the period was a currency forward contract that was used to hedge the risk on an unusually large EUR receipt. Due to TorkSpark discontinuing a product line, Redaux SA, a frequent customer, agreed to pay a large sum for all remaining stock. Due to continued political turbulence in the Eurozone, TorkSpark opted to hedge 60% of the EUR receivable.&quot; Garton is familiar with Torkspark&#x27;s euro currency forward contract because it was discussed in detail in the analyst call. The currency forward lead to a large loss that was offset by a gain on the receivable in other comprehensive income in the financial statements. Details of the contract are shown in Exhibit 2.<\/p><p><b>Exhibit 2: Currency Forward Contract<\/b><\/p><div class=\"tbl\"><table><tr><td>Contract length:<\/td><td>90 days<\/td><\/tr><tr><td>90-day forward rate at origination:<\/td><td>€/$0.89239<\/td><\/tr><tr><td>Spot rate at origination:<\/td><td>€/$0.89298<\/td><\/tr><tr><td>90-day forward rate at expiry:<\/td><td>€/$0.84256<\/td><\/tr><tr><td>Spot rate at expiry:<\/td><td>€/$0.84487<\/td><\/tr><tr><td>Loss at settlement date:<\/td><td>$189,083<\/td><\/tr><\/table><\/div><p>Garton is not convinced that all the derivatives transactions reflected in TorkSpark&#x27;s financial statements are purely for hedging. He believes that there are significant exposures to both interest rate and currency risk for the next six quarters. As a result, Garton intends to suggest that his firm hedge their holding of TorkSpark stock using exchange-traded options.<\/p><p>Garton collects the following information about TorkSpark:<\/p><p>1. One-year, at-the-money calls with exercise price of $60 are highly liquid. 2. Over the year, the stock price can increase to $72 or decline to $50. 3. The risk-free rate is 3%.<\/p><\/div><\/details><div class=\"qtext\"><p>The value of the euro receivable due from Redaux is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 46, "q": "The optimal hedge ratio for a call option on TorkSpark's stock is closest to:", "opts": ["0.55.", "0.67.", "0.75."], "ans": "A", "expl": "Call option hedge ratio = For Further Reference: (Study Session 14, Module 38.2, LOS 38.c)", "explhtml": "<p>Call option hedge ratio = <\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 38.2, LOS 38.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Garton, CFA, is an equity analyst covering several industry sectors for a boutique U.S. investment firm. Currently Garton is reviewing a reply that he received from the CFO of TorkSpark, Inc., a manufacturer of automotive parts.<\/p><p>Garton had noticed that the most recent quarterly filing by TorkSpark showed an increase in the volume of derivative transactions that showed gains and losses either in the income statement or in other comprehensive income. This is the third quarter in a row that Garton has observed such an increase, and in a recent analyst call, Garton asked the CFO to give some explanation for such an increase.<\/p><p>Extracts from the CFO&#x27;s reply are shown in Exhibit 1.<\/p><p><b>Exhibit 1: TorkSpark CFO comments<\/b><\/p><p>&quot;TorkSpark currently has a $68 million bond outstanding that is not due to mature until 2028. The coupon payments are fixed at 6.25% and paid quarterly. A decision was taken recently to try to reduce the interest rate risk on the bond.<\/p><p>The board also identified a need to address the financing of TorkSpark Plc., our wholly owned subsidiary in the UK. In order to raise the 175 million GBP needed to fund an expansion of the operations, the board leveraged its relationship with the Lobman Starn banking group here in the United States.<\/p><p>TorkSpark borrowed 250 million USD and set up a USD-GBP currency swap with a swap dealer based in Europe. Unfortunately, the dealer experienced some issues trying to hedge their position, so TorkSpark agreed to settle the swap at the PV of future payments only 170 days after origination.<\/p><p>The only other currency derivative TorkSpark used in the period was a currency forward contract that was used to hedge the risk on an unusually large EUR receipt. Due to TorkSpark discontinuing a product line, Redaux SA, a frequent customer, agreed to pay a large sum for all remaining stock. Due to continued political turbulence in the Eurozone, TorkSpark opted to hedge 60% of the EUR receivable.&quot; Garton is familiar with Torkspark&#x27;s euro currency forward contract because it was discussed in detail in the analyst call. The currency forward lead to a large loss that was offset by a gain on the receivable in other comprehensive income in the financial statements. Details of the contract are shown in Exhibit 2.<\/p><p><b>Exhibit 2: Currency Forward Contract<\/b><\/p><div class=\"tbl\"><table><tr><td>Contract length:<\/td><td>90 days<\/td><\/tr><tr><td>90-day forward rate at origination:<\/td><td>€/$0.89239<\/td><\/tr><tr><td>Spot rate at origination:<\/td><td>€/$0.89298<\/td><\/tr><tr><td>90-day forward rate at expiry:<\/td><td>€/$0.84256<\/td><\/tr><tr><td>Spot rate at expiry:<\/td><td>€/$0.84487<\/td><\/tr><tr><td>Loss at settlement date:<\/td><td>$189,083<\/td><\/tr><\/table><\/div><p>Garton is not convinced that all the derivatives transactions reflected in TorkSpark&#x27;s financial statements are purely for hedging. He believes that there are significant exposures to both interest rate and currency risk for the next six quarters. As a result, Garton intends to suggest that his firm hedge their holding of TorkSpark stock using exchange-traded options.<\/p><p>Garton collects t  quarter in a row that Garton has observed such an increase, and in a recent analyst call, Garton asked the CFO to give some explanation for such an increase.<\/p><p>Extracts from the CFO&#x27;s reply are shown in Exhibit 1.<\/p><p><b>Exhibit 1: TorkSpark CFO comments<\/b><\/p><p>&quot;TorkSpark currently has a $68 million bond outstanding that is not due to mature until 2028. The coupon payments are fixed at 6.25% and paid quarterly. A decision was taken recently to try to reduce the interest rate risk on the bond.<\/p><p>The board also identified a need to address the financing of TorkSpark Plc., our wholly owned subsidiary in the UK. In order to raise the 175 million GBP needed to fund an expansion of the operations, the board leveraged its relationship with the Lobman Starn banking group here in the United States.<\/p><p>TorkSpark borrowed 250 million USD and set up a USD-GBP currency swap with a swap dealer based in Europe. Unfortunately, the dealer experienced some issues trying to hedge their position, so TorkSpark agreed to settle the swap at the PV of future payments only 170 days after origination.<\/p><p>The only other currency derivative TorkSpark used in the period was a currency forward contract that was used to hedge the risk on an unusually large EUR receipt. Due to TorkSpark discontinuing a product line, Redaux SA, a frequent customer, agreed to pay a large sum for all remaining stock. Due to continued political turbulence in the Eurozone, TorkSpark opted to hedge 60% of the EUR receivable.&quot; Garton is familiar with Torkspark&#x27;s euro currency forward contract because it was discussed in detail in the analyst call. The currency forward lead to a large loss that was offset by a gain on the receivable in other comprehensive income in the financial statements. Details of the contract are shown in Exhibit 2.<\/p><p><b>Exhibit 2: Currency Forward Contract<\/b><\/p><div class=\"tbl\"><table><tr><td>Contract length:<\/td><td>90 days<\/td><\/tr><tr>< k. Due to continued political turbulence in the Eurozone, TorkSpark opted to hedge 60% of the EUR receivable.&quot; Garton is familiar with Torkspark&#x27;s euro currency forward contract because it was discussed in detail in the analyst call. The currency forward lead to a large loss that was offset by a gain on the receivable in other comprehensive income in the financial statements. Details of the contract are shown in Exhibit 2.<\/p><p><b>Exhibit 2: Currency Forward Contract<\/b><\/p><div class=\"tbl\"><table><tr><td>Contract length:<\/td><td>90 days<\/td><\/tr><tr><td>90-day forward rate at origination:<\/td><td>€/$0.89239<\/td><\/tr><tr><td>Spot rate at origination:<\/td><td>€/$0.89298<\/td><\/tr><tr><td>90-day forward rate at expiry:<\/td><td>€/$0.84256<\/td><\/tr><tr><td>Spot rate at expiry:<\/td><td>€/$0.84487<\/td><\/tr><tr><td>Loss at settlement date:<\/td><td>$189,083<\/td><\/tr><\/table><\/div><p>Garton is not convinced that all the derivatives transactions reflected in TorkSpark&#x27;s financial statements are purely for hedging. He believes that there are significant exposures to both interest rate and currency risk for the next six quarters. As a result, Garton intends to suggest that his firm hedge their holding of TorkSpark stock using exchange-traded options.<\/p><p>Garton collects the following information about TorkSpark:<\/p><p>1. One-year, at-the-money calls with exercise price of $60 are highly liquid. 2. Over the year, the stock price can increase to $72 or decline to $50. 3. The risk-free rate is 3%.<\/p><\/div><\/details><div class=\"qtext\"><p>If Garton wants to hedge the firm&#x27;s position in TorkSpark stock using put options, the resulting portfolio&#x27;s gamma would most likely be:<\/p><\/div>", "subj": "derivatives"}, {"n": 49, "q": "Based on the information in Exhibit 1, the REIT sector that represents the least desirable investment is:", "opts": ["industrial.", "office.", "apartments."], "ans": "A", "expl": "For industrial properties, the most important factor affecting economic value is retail sales growth, which is expected to be low in West Lundia. The most important factor affecting economic value for apartment REITs are job creation and population growth, which are both expected to be high. For office properties, the most important factor is job creation, which is expected to be high. For Further Reference: (Study Session 15, Module 40.1, LOS 40.c)", "explhtml": "<p>For industrial properties, the most important factor affecting economic value is retail sales growth, which is expected to be low in West Lundia. The most important factor affecting economic value for apartment REITs are job creation and population growth, which are both expected to be high. For office properties, the most important factor is job creation, which is expected to be high.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 15, Module 40.1, LOS 40.c)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Karen Westin, Kei Shinoya, and Carlos Perez, partners at PacRim Investment Consultants, are advising a client, the West Lundia Government Employees Pension Plan (WLGE), a large public pension fund. In a previous meeting with the pension board of WLGE, the PacRim team made a recommendation to increase the fund&#x27;s exposure to domestic real estate. Because of the WLGE plan&#x27;s large size and in-house expertise, the pension fund has the capacity to invest in and manage a wide variety of real estate investments. The currency in West Lundia is the West Lundian Dollar (WL$).<\/p><p>West Lundian Commercial Real Estate Market Expectations<\/p><p>Commercial real estate prices have experienced a moderate increase over the past year after a decade of unusually slow growth. Demand is expected to exceed supply over the next 10 years. The current average commercial mortgage rate of 3.75% is low by historical standards and is expected to stay relatively low for at least seven more years. The West Lundian economy is expected to enjoy an above average growth rate.<\/p><p><b>Exhibit 1: West Lundia&#x27;s Economic Outlook<\/b><\/p><p>Expected Annual Growth Rate Relative to Other Developed Countries<\/p><div class=\"tbl\"><table><tr><td>Job creation<\/td><td>3.0%<\/td><td>High<\/td><\/tr><tr><td>Population<\/td><td>1.8%<\/td><td>High<\/td><\/tr><tr><td>Retail sales<\/td><td>1.5%<\/td><td>Low<\/td><\/tr><tr><td>Inflation<\/td><td>0.5%<\/td><td>Low<\/td><\/tr><\/table><\/div><p>Because of the favorable real estate conditions, the consensus was to consider equity investments in real estate. Three options under consideration are:<\/p><div class=\"tbl\"><table><tr><td>Option 1: <\/td><td>Direct investment, in an existing office building.<\/td><\/tr><tr><td>Option 2: <\/td><td>Investment in a public equity REIT.<\/td><\/tr><tr><td>Option 3: <\/td><td>Equity investment in a public REOC.<\/td><\/tr><tr><td>Option 1: Direct Investment<\/td><td><\/td><\/tr><tr><td>Expected NOI Years 1–7<\/td><td>WL$ 7.0 MM<\/td><\/tr><tr><td>Expected NOI Year 8<\/td><td>WL$ 8.5 MM<\/td><\/tr><tr><td>Required return on equity investment<\/td><td>10%<\/td><\/tr><tr><td>NOI growth rate after 8 years<\/td><td>3.25%<\/td><\/tr><tr><td>Option 2: REIT<\/td><td><\/td><\/tr><tr><td>Recent NOI<\/td><td>WL$ 140.0 MM<\/td><\/tr><tr><td>Non-cash rents<\/td><td>WL$ 5.0 MM<\/td><\/tr><tr><td>Full year adjustment for acquisition<\/td><td>WL$ 5.0 MM<\/td><\/tr><tr><td>Other assets<\/td><td>WL$ 50.0 MM<\/td><\/tr><tr><td>Total liabilities<\/td><td>WL$ 300.0 MM<\/td><\/tr><tr><td>Current market price per share<\/td><td>WL$ 125.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>15 MM<\/td><\/tr><tr><td>Going-in cap rate<\/td><td>7.00%<\/td><\/tr><tr><td>NOI growth rate<\/td><td>2.50%<\/td><\/tr><tr><td>Option 3: REOC<\/td><td><\/td><\/tr><tr><td>Expected AFFO in Year 7<\/td><td>WL$ 13.5 MM<\/td><\/tr><tr><td>Holding period<\/td><td>7 years<\/td><\/tr><tr><td>Present value of all dividends for 7 years<\/td><td>WL$ 39.7 MM<\/td><\/tr><tr><td>Shares outstanding<\/td><td>1.0 MM<\/td><\/tr><tr><td>Cap rate<\/td><td>7.0%<\/td><\/tr><tr><td>Growth rate (from Year 8)<\/td><td>2.50%<\/td><\/tr><\/table><\/div><p><b>Additional Information:<\/b><\/p><p>1. The office building under consideration has existing tenants with long-term leases that will expire in seven years. 2. The REOC terminal value at the end of seven years is to be based on a price-to-AFFO multiple of 12x.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information in Exhibit 1, the REIT sector that represents the least desirable investment is:<\/p><\/div>", "subj": "alternatives"}, {"n": 50, "q": "The estimated value of the office building (Option 1) using the discounted cash flow approach is closest to:", "opts": ["WL$ 89 million.", "WL$ 93 million.", "WL$ 99 million."], "ans": "C", "expl": "There are two components to this valuation. The first component is the cash flows for the first seven years. The second component is the terminal value. PV of CFs in Years 1–7: PMT = 7.0; I/Y = 10; N = 7. The PV = WL$34.08 million. PV of terminal value: An appropriate terminal cap rate can be calculated using the following equation: cap rate = discount rate − growth rate = 10% − 3.25% = 6.75%. The terminal value is calculated using the following inputs: WL$8.5 million divided by the terminal cap rate of 6.75%. The value in Year 7 is WL$125.93 million, discounting this value to the present: FV = WL$125.93 million; N = 7, I/Y = 10 results in a present value of WL$64.62 million. WL$34.08 + WL$64.62 = WL$98.7 million. For Further Reference: (Study Session 15, Module 39.3, LOS 39.g)", "explhtml": "<p>There are two components to this valuation. The first component is the cash flows for the first seven years. The second component is the terminal value.<\/p><p>PV of CFs in Years 1–7:<\/p><p>PMT = 7.0; I/Y = 10; N = 7. The
