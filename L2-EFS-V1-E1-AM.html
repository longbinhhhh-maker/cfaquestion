tion) of the portfolio and assuming a distribution for portfolio risk factors. A historical simulation would instead identify actual returns from the portfolio and identify the 5th percentile.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 45.1, LOS 45.b)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Sally Sishek, CFA, works as a freelance risk management consultant in the United States. Recently, she was contacted by BlueCanopy Investments (BCI), an asset management firm that recently experienced a significant financial loss after what it described as a &quot;serious failure in multiple risk management processes.&quot;<\/p><p>Sishek has had an initial meeting with Jon Bagwell, the chief investment officer of BCI, who is leading the review of risk management following the resignation of BCI&#x27;s chief risk officer (CRO) last month.<\/p><p>Bagwell has concerns that the CRO relied too heavily on VaR as a risk measure, rather than also implementing other complimentary controls.<\/p><p>Sishek is reviewing the VaR analysis carried out by the recently departed CRO. Some of the calculations involved are shown in Exhibit 1.<\/p><p><b>Exhibit 1: VaR Calculations<\/b><\/p><p>Portfolio EGF Internal Ref:0300201 5% VaR<\/p><div class=\"tbl\"><table><tr><td>Inputs:<\/td><td>Mean annual return<\/td><td>9.4%<\/td><\/tr><tr><td>Annual volatility<\/td><td>14.2%<\/td><td><\/td><\/tr><\/table><\/div><p><b>Assumptions:<\/b><\/p><p>250 trading days per year. Risk factors are normally distributed. Mean and volatility calculated using historical data over a 3-year lookback period. The historical standard deviation has been adjusted upward to reflect the long-term expectations relative to the lookback period.<\/p><p>5% Annual VaR = [9.4% − (1.65 × 14.2%)] = –14%<\/p><p>5% Daily VaR = [0.0376% − (1.65 × 0.0568%)] = –0.056%<\/p><p>Sishek has some concerns about the calculations as well as the firm&#x27;s use of VaR. Bagwell admits that he has very little idea how the VaR calculations were currently used to manage risk. Sishek suggests that in the short term, the firm should immediately implement at least the following recommendation:<\/p><p>Risk Management Recommendation<\/p><p>Impose a daily 1% VaR limit of (for example) $2,000,000 on a portfolio. Monitor the portfolio for any signs of trending and liquidate the portfolio if cumulative monthly losses exceed $7,500,000.<\/p><p>She also intends to provide a list of typical risk management measures that traditional asset managers employ and agreed to put together a case study on how each of these measures could be implemented. The list she will provide is shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Typical risk measures employed by traditional asset managers include:<\/p><p>1. Beta sensitivity: useful for equity only 2. Active share: a measure of similarity to a benchmark 3. Surplus-at-risk: an application of VaR 4. Maximum drawdown: percentage of portfolio redeemed at peak times<\/p><p>Bagwell states that he is concerned about risks associated with the ETFs that BCI has been investing in. Sishek makes the following statements about the risks of investing in ETFs:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Some ETF legal structures expose the investors to counterparty risk.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Settlement risk is a key concern for foreign equity ETFs that invest in American depository<\/td><\/tr><tr><td>receipts (ADRs).<\/td><td><\/td><\/tr><\/table><\/div><p>Bagwell also revealed that he has some concerns over the trading methods authorized (and, in some cases, used) by the outgoing CRO. A recent internal audit of transactions carried out under his authorization revealed several instances of high frequency trading that auditors were uncomfortable with.<\/p><p>Multiple instances of trading patterns were flagged in an audit report as having a &quot;high risk of inviting regulatory scrutiny.&quot; An example is outlined in Exhibit 3.<\/p><p><b>Exhibit 3: High Frequency Trading Patterns<\/b><\/p><p>The pattern of trading by Trader [B] over the period 8th June to 12th June suggests strongly that Trader [B] may be wash trading.<\/p><\/div><\/details><div class=\"qtext\"><p>In Exhibit 1, the annual VaR is most accurately described as being calculated using:<\/p><\/div>", "subj": "portfolio"}, {"n": 56, "q": "The calculated percentage value for daily VaR in Exhibit 1 is most likely:", "opts": ["correct given the assumptions and method described.", "too high given the assumptions and method described.", "too low given the assumptions and method described."], "ans": "C", "expl": "To calculate the daily VaR from an annual VaR, the mean and standard deviation must be adjusted using the 250 trading days described. The mean has been correctly calculated as 9.4% / 250 = 0.0376% The standard deviation, however, should be divided by This would result in a 5% daily VaR = [0.0376% − (1.65 × 0.898%)] = –1.44%. For Further Reference: (Study Session 16, Module 45.1, LOS 45.c)", "explhtml": "<p>To calculate the daily VaR from an annual VaR, the mean and standard deviation must be adjusted using the 250 trading days described.<\/p><p>The mean has been correctly calculated as 9.4% / 250 = 0.0376%<\/p><p>The standard deviation, however, should be divided by <\/p><p>This would result in a 5% daily VaR = [0.0376% − (1.65 × 0.898%)] = –1.44%.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 45.1, LOS 45.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Sishek, CFA, works as a freelance risk management consultant in the United States. Recently, she was contacted by BlueCanopy Investments (BCI), an asset management firm that recently experienced a significant financial loss after what it described as a &quot;serious failure in multiple risk management processes.&quot;<\/p><p>Sishek has had an initial meeting with Jon Bagwell, the chief investment officer of BCI, who is leading the review of risk management following the resignation of BCI&#x27;s chief risk officer (CRO) last month.<\/p><p>Bagwell has concerns that the CRO relied too heavily on VaR as a risk measure, rather than also implementing other complimentary controls.<\/p><p>Sishek is reviewing the VaR analysis carried out by the recently departed CRO. Some of the calculations involved are shown in Exhibit 1.<\/p><p><b>Exhibit 1: VaR Calculations<\/b><\/p><p>Portfolio EGF Internal Ref:0300201 5% VaR<\/p><div class=\"tbl\"><table><tr><td>Inputs:<\/td><td>Mean annual return<\/td><td>9.4%<\/td><\/tr><tr><td>Annual volatility<\/td><td>14.2%<\/td><td><\/td><\/tr><\/table><\/div><p><b>Assumptions:<\/b><\/p><p>250 trading days per year. Risk factors are normally distributed. Mean and volatility calculated using historical data over a 3-year lookback period. The historical standard deviation has been adjusted upward to reflect the long-term expectations relative to the lookback period.<\/p><p>5% Annual VaR = [9.4% − (1.65 × 14.2%)] = –14%<\/p><p>5% Daily VaR = [0.0376% − (1.65 × 0.0568%)] = –0.056%<\/p><p>Sishek has some concerns about the calculations as well as the firm&#x27;s use of VaR. Bagwell admits that he has very little idea how the VaR calculations were currently used to manage risk. Sishek suggests that in the short term, the firm should immediately implement at least the following recommendation:<\/p><p>Risk Management Recommendation<\/p><p>Impose a daily 1% VaR limit of (for example) $2,000,000 on a portfolio. Monitor the portfolio for any signs of trending and liquidate the portfolio if cumulative monthly losses exceed $7,500,000.<\/p><p>She also intends to provide a list of typical risk management measures that traditional asset managers employ and agreed to put together a case study on how each of these measures could be implemented. The list she will provide is shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Typical risk measures employed by traditional asset managers include:<\/p><p>1. Beta sensitivity: useful for equity only 2. Active share: a measure of similarity to a benchmark 3. Surplus-at-risk: an application of VaR 4. Maximum drawdown: percentage of portfolio redeemed at peak times<\/p><p>Bagwell states that he is concerned about risks associated with the ETFs that BCI has been investing in. Sishek makes the following statements about the risks of investing in ETFs:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Some ETF legal structures expose the investors to counterparty risk.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Settlement risk is a key concern for foreign equity ETFs that invest in American depository<\/td><\/tr><tr><td>receipts (ADRs).<\/td><td><\/td><\/tr><\/table><\/div><p>Bagwell also revealed that he has some concerns over the trading methods authorized (and, in some cases, used) by the outgoing CRO. A recent internal audit of transactions carried out under his authorization revealed several instances of high frequency trading that auditors were uncomfortable with.<\/p><p>Multiple instances of trading patterns were flagged in an audit report as having a &quot;high risk of inviting regulatory scrutiny.&quot; An example is outlined in Exhibit 3.<\/p><p><b>Exhibit 3: High Frequency Trading Patterns<\/b><\/p><p>The pattern of trading by Trader [B] over the period 8th June to 12th June suggests strongly that Trader [B] may be wash trading.<\/p><\/div><\/details><div class=\"qtext\"><p>The calculated percentage value for daily VaR in Exhibit 1 is most likely:<\/p><\/div>", "subj": "portfolio"}, {"n": 57, "q": "Sishek's short-term risk management recommendation is best described as an example of:", "opts": ["risk budgeting.", "a stop loss limit.", "a position limit."], "ans": "B", "expl": "Liquidating a position when losses exceed a certain amount is an example of a stop loss limit. For Further Reference: (Study Session 16, Module 45.5, LOS 45.k)", "explhtml": "<p>Liquidating a position when losses exceed a certain amount is an example of a stop loss limit.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 45.5, LOS 45.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Sishek, CFA, works as a freelance risk management consultant in the United States. Recently, she was contacted by BlueCanopy Investments (BCI), an asset management firm that recently experienced a significant financial loss after what it described as a &quot;serious failure in multiple risk management processes.&quot;<\/p><p>Sishek has had an initial meeting with Jon Bagwell, the chief investment officer of BCI, who is leading the review of risk management following the resignation of BCI&#x27;s chief risk officer (CRO) last month.<\/p><p>Bagwell has concerns that the CRO relied too heavily on VaR as a risk measure, rather than also implementing other complimentary controls.<\/p><p>Sishek is reviewing the VaR analysis carried out by the recently departed CRO. Some of the calculations involved are shown in Exhibit 1.<\/p><p><b>Exhibit 1: VaR Calculations<\/b><\/p><p>Portfolio EGF Internal Ref:0300201 5% VaR<\/p><div class=\"tbl\"><table><tr><td>Inputs:<\/td><td>Mean annual return<\/td><td>9.4%<\/td><\/tr><tr><td>Annual volatility<\/td><td>14.2%<\/td><td><\/td><\/tr><\/table><\/div><p><b>Assumptions:<\/b><\/p><p>250 trading days per year. Risk factors are normally distributed. Mean and volatility calculated using historical data over a 3-year lookback period. The historical standard deviation has been adjusted upward to reflect the long-term expectations relative to the lookback period.<\/p><p>5% Annual VaR = [9.4% − (1.65 × 14.2%)] = –14%<\/p><p>5% Daily VaR = [0.0376% − (1.65 × 0.0568%)] = –0.056%<\/p><p>Sishek has some concerns about the calculations as well as the firm&#x27;s use of VaR. Bagwell admits that he has very little idea how the VaR calculations were currently used to manage risk. Sishek suggests that in the short term, the firm should immediately implement at least the following recommendation:<\/p><p>Risk Management Recommendation<\/p><p>Impose a daily 1% VaR limit of (for example) $2,000,000 on a portfolio. Monitor the portfolio for any signs of trending and liquidate the portfolio if cumulative monthly losses exceed $7,500,000.<\/p><p>She also intends to provide a list of typical risk management measures that traditional asset managers employ and agreed to put together a case study on how each of these measures could be implemented. The list she will provide is shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Typical risk measures employed by traditional asset managers include:<\/p><p>1. Beta sensitivity: useful for equity only 2. Active share: a measure of similarity to a benchmark 3. Surplus-at-risk: an application of VaR 4. Maximum drawdown: percentage of portfolio redeemed at peak times<\/p><p>Bagwell states that he is concerned about risks associated with the ETFs that BCI has been investing in. Sishek makes the following statements about the risks of investing in ETFs:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Some ETF legal structures expose the investors to counterparty risk.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Settlement risk is a key concern for foreign equity ETFs that invest in American depository<\/td><\/tr><tr><td>receipts (ADRs).<\/td><td><\/td><\/tr><\/table><\/div><p>Bagwell also revealed that he has some concerns over the trading methods authorized (and, in some cases, used) by the outgoing CRO. A recent internal audit of transactions carried out under his authorization revealed several instances of high frequency trading that auditors were uncomfortable with.<\/p><p>Multiple instances of trading patterns were flagged in an audit report as having a &quot;high risk of inviting regulatory scrutiny.&quot; An example is outlined in Exhibit 3.<\/p><p><b>Exhibit 3: High Frequency Trading Patterns<\/b><\/p><p>The pattern of trading by Trader [B] over the period 8th June to 12th June suggests strongly that Trader [B] may be wash trading.<\/p><\/div><\/details><div class=\"qtext\"><p>Sishek&#x27;s short-term risk management recommendation is best described as an example of:<\/p><\/div>", "subj": "portfolio"}, {"n": 58, "q": "The description of measures given by Sishek in Exhibit 2 is inaccurate with respect to:", "opts": ["active share because it does not require the use of a benchmark.", "surplus-at-risk because it is not an application of VaR.", "maximum drawdown because it is not a measure of redemptions."], "ans": "C", "expl": "Maximum drawdown is most commonly defined as the worst peak-to-trough decline in a portfolio's returns, or the worst- returning month or quarter for a portfolio. Maximum drawdown is an important risk measure for hedge funds. Redemption risk is a measure for open-end funds of the percentage of a portfolio could be redeemed at peak times. For Further Reference: (Study Session 16, Module 45.3, LOS 45.h)", "explhtml": "<p>Maximum drawdown is most commonly defined as the worst peak-to-trough decline in a portfolio&#x27;s returns, or the worst- returning month or quarter for a portfolio. Maximum drawdown is an important risk measure for hedge funds. Redemption risk is a measure for open-end funds of the percentage of a portfolio could be redeemed at peak times.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 45.3, LOS 45.h)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Sishek, CFA, works as a freelance risk management consultant in the United States. Recently, she was contacted by BlueCanopy Investments (BCI), an asset management firm that recently experienced a significant financial loss after what it described as a &quot;serious failure in multiple risk management processes.&quot;<\/p><p>Sishek has had an initial meeting with Jon Bagwell, the chief investment officer of BCI, who is leading the review of risk management following the resignation of BCI&#x27;s chief risk officer (CRO) last month.<\/p><p>Bagwell has concerns that the CRO relied too heavily on VaR as a risk measure, rather than also implementing other complimentary controls.<\/p><p>Sishek is reviewing the VaR analysis carried out by the recently departed CRO. Some of the calculations involved are shown in Exhibit 1.<\/p><p><b>Exhibit 1: VaR Calculations<\/b><\/p><p>Portfolio EGF Internal Ref:0300201 5% VaR<\/p><div class=\"tbl\"><table><tr><td>Inputs:<\/td><td>Mean annual return<\/td><td>9.4%<\/td><\/tr><tr><td>Annual volatility<\/td><td>14.2%<\/td><td><\/td><\/tr><\/table><\/div><p><b>Assumptions:<\/b><\/p><p>250 trading days per year. Risk factors are normally distributed. Mean and volatility calculated using historical data over a 3-year lookback period. The historical standard deviation has been adjusted upward to reflect the long-term expectations relative to the lookback period.<\/p><p>5% Annual VaR = [9.4% − (1.65 × 14.2%)] = –14%<\/p><p>5% Daily VaR = [0.0376% − (1.65 × 0.0568%)] = –0.056%<\/p><p>Sishek has some concerns about the calculations as well as the firm&#x27;s use of VaR. Bagwell admits that he has very little idea how the VaR calculations were currently used to manage risk. Sishek suggests that in the short term, the firm should immediately implement at least the following recommendation:<\/p><p>Risk Management Recommendation<\/p><p>Impose a daily 1% VaR limit of (for example) $2,000,000 on a portfolio. Monitor the portfolio for any signs of trending and liquidate the portfolio if cumulative monthly losses exceed $7,500,000.<\/p><p>She also intends to provide a list of typical risk management measures that traditional asset managers employ and agreed to put together a case study on how each of these measures could be implemented. The list she will provide is shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Typical risk measures employed by traditional asset managers include:<\/p><p>1. Beta sensitivity: useful for equity only 2. Active share: a measure of similarity to a benchmark 3. Surplus-at-risk: an application of VaR 4. Maximum drawdown: percentage of portfolio redeemed at peak times<\/p><p>Bagwell states that he is concerned about risks associated with the ETFs that BCI has been investing in. Sishek makes the following statements about the risks of investing in ETFs:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Some ETF legal structures expose the investors to counterparty risk.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Settlement risk is a key concern for foreign equity ETFs that invest in American depository<\/td><\/tr><tr><td>receipts (ADRs).<\/td><td><\/td><\/tr><\/table><\/div><p>Bagwell also revealed that he has some concerns over the trading methods authorized (and, in some cases, used) by the outgoing CRO. A recent internal audit of transactions carried out under his authorization revealed several instances of high frequency trading that auditors were uncomfortable with.<\/p><p>Multiple instances of trading patterns were flagged in an audit report as having a &quot;high risk of inviting regulatory scrutiny.&quot; An example is outlined in Exhibit 3.<\/p><p><b>Exhibit 3: High Frequency Trading Patterns<\/b><\/p><p>The pattern of trading by Trader [B] over the period 8th June to 12th June suggests strongly that Trader [B] may be wash trading.<\/p><\/div><\/details><div class=\"qtext\"><p>The description of measures given by Sishek in Exhibit 2 is inaccurate with respect to:<\/p><\/div>", "subj": "portfolio"}, {"n": 59, "q": "Which of Sishek's statements about risks of investing in ETF are accurate?", "opts": ["Only statement 1 is correct.", "Only statement 2 is correct.", "Both statements are correct."], "ans": "A", "expl": "Statement 1 is correct. Some ETF legal structures expose investors to counterparty risk: the invested amount could be lost in the event of counterparty failure. Statement 2 is incorrect. Settlement risk is applicable for ETFs that use OTC derivative contracts, however ADRs are exchange-traded. For Further Reference: (Study Session 16, Module 43.3, LOS 43.g)", "explhtml": "<p>Statement 1 is correct. Some ETF legal structures expose investors to counterparty risk: the invested amount could be lost in the event of counterparty failure. Statement 2 is incorrect. Settlement risk is applicable for ETFs that use OTC derivative contracts, however ADRs are exchange-traded.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 43.3, LOS 43.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Sishek, CFA, works as a freelance risk management consultant in the United States. Recently, she was contacted by BlueCanopy Investments (BCI), an asset management firm that recently experienced a significant financial loss after what it described as a &quot;serious failure in multiple risk management processes.&quot;<\/p><p>Sishek has had an initial meeting with Jon Bagwell, the chief investment officer of BCI, who is leading the review of risk management following the resignation of BCI&#x27;s chief risk officer (CRO) last month.<\/p><p>Bagwell has concerns that the CRO relied too heavily on VaR as a risk measure, rather than also implementing other complimentary controls.<\/p><p>Sishek is reviewing the VaR analysis carried out by the recently departed CRO. Some of the calculations involved are shown in Exhibit 1.<\/p><p><b>Exhibit 1: VaR Calculations<\/b><\/p><p>Portfolio EGF Internal Ref:0300201 5% VaR<\/p><div class=\"tbl\"><table><tr><td>Inputs:<\/td><td>Mean annual return<\/td><td>9.4%<\/td><\/tr><tr><td>Annual volatility<\/td><td>14.2%<\/td><td><\/td><\/tr><\/table><\/div><p><b>Assumptions:<\/b><\/p><p>250 trading days per year. Risk factors are normally distributed. Mean and volatility calculated using historical data over a 3-year lookback period. The historical standard deviation has been adjusted upward to reflect the long-term expectations relative to the lookback period.<\/p><p>5% Annual VaR = [9.4% − (1.65 × 14.2%)] = –14%<\/p><p>5% Daily VaR = [0.0376% − (1.65 × 0.0568%)] = –0.056%<\/p><p>Sishek has some concerns about the calculations as well as the firm&#x27;s use of VaR. Bagwell admits that he has very little idea how the VaR calculations were currently used to manage risk. Sishek suggests that in the short term, the firm should immediately implement at least the following recommendation:<\/p><p>Risk Management Recommendation<\/p><p>Impose a daily 1% VaR limit of (for example) $2,000,000 on a portfolio. Monitor the portfolio for any signs of trending and liquidate the portfolio if cumulative monthly losses exceed $7,500,000.<\/p><p>She also intends to provide a list of typical risk management measures that traditional asset managers employ and agreed to put together a case study on how each of these measures could be implemented. The list she will provide is shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Typical risk measures employed by traditional asset managers include:<\/p><p>1. Beta sensitivity: useful for equity only 2. Active share: a measure of similarity to a benchmark 3. Surplus-at-risk: an application of VaR 4. Maximum drawdown: percentage of portfolio redeemed at peak times<\/p><p>Bagwell states that he is concerned about risks associated with the ETFs that BCI has been investing in. Sishek makes the following statements about the risks of investing in ETFs:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Some ETF legal structures expose the investors to counterparty risk.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Settlement risk is a key concern for foreign equity ETFs that invest in American depository<\/td><\/tr><tr><td>receipts (ADRs).<\/td><td><\/td><\/tr><\/table><\/div><p>Bagwell also revealed that he has some concerns over the trading methods authorized (and, in some cases, used) by the outgoing CRO. A recent internal audit of transactions carried out under his authorization revealed several instances of high frequency trading that auditors were uncomfortable with.<\/p><p>Multiple instances of trading patterns were flagged in an audit report as having a &quot;high risk of inviting regulatory scrutiny.&quot; An example is outlined in Exhibit 3.<\/p><p><b>Exhibit 3: High Frequency Trading Patterns<\/b><\/p><p>The pattern of trading by Trader [B] over the period 8th June to 12th June suggests strongly that Trader [B] may be wash trading.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Sishek&#x27;s statements about risks of investing in ETF are accurate?<\/p><\/div>", "subj": "portfolio"}, {"n": 60, "q": "The activity described in Exhibit 3 is most likely to involve:", "opts": ["placing a legitimate trade on one side of the market and several illegitimate orders at different prices on the other side.", "executing simultaneous buy and sell orders on the same financial instrument.", "entering large quantities of fictitious orders into the market and instantaneously canceling them."], "ans": "B", "expl": "Wash trading is a kind of market manipulation where the investor buys and sells the same financial instrument simultaneously, in order to simulate demand in the instrument by boosting trading volume. Placing a legitimate trade on one side of the market and several bogus orders on the other side of the market is known as layering. Entering large quantities of fictitious orders into the market and instantaneously canceling them is known as quote stuffing. For Further Reference: (Study Session 17, Module 48.4, LOS 48.j)", "explhtml": "<p>Wash trading is a kind of market manipulation where the investor buys and sells the same financial instrument simultaneously, in order to simulate demand in the instrument by boosting trading volume. Placing a legitimate trade on one side of the market and several bogus orders on the other side of the market is known as layering. Entering large quantities of fictitious orders into the market and instantaneously canceling them is known as quote stuffing.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 48.4, LOS 48.j)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Sishek, CFA, works as a freelance risk management consultant in the United States. Recently, she was contacted by BlueCanopy Investments (BCI), an asset management firm that recently experienced a significant financial loss after what it described as a &quot;serious failure in multiple risk management processes.&quot;<\/p><p>Sishek has had an initial meeting with Jon Bagwell, the chief investment officer of BCI, who is leading the review of risk management following the resignation of BCI&#x27;s chief risk officer (CRO) last month.<\/p><p>Bagwell has concerns that the CRO relied too heavily on VaR as a risk measure, rather than also implementing other complimentary controls.<\/p><p>Sishek is reviewing the VaR analysis carried out by the recently departed CRO. Some of the calculations involved are shown in Exhibit 1.<\/p><p><b>Exhibit 1: VaR Calculations<\/b><\/p><p>Portfolio EGF Internal Ref:0300201 5% VaR<\/p><div class=\"tbl\"><table><tr><td>Inputs:<\/td><td>Mean annual return<\/td><td>9.4%<\/td><\/tr><tr><td>Annual volatility<\/td><td>14.2%<\/td><td><\/td><\/tr><\/table><\/div><p><b>Assumptions:<\/b><\/p><p>250 trading days per year. Risk factors are normally distributed. Mean and volatility calculated using historical data over a 3-year lookback period. The historical standard deviation has been adjusted upward to reflect the long-term expectations relative to the lookback period.<\/p><p>5% Annual VaR = [9.4% − (1.65 × 14.2%)] = –14%<\/p><p>5% Daily VaR = [0.0376% − (1.65 × 0.0568%)] = –0.056%<\/p><p>Sishek has some concerns about the calculations as well as the firm&#x27;s use of VaR. Bagwell admits that he has very little idea how the VaR calculations were currently used to manage risk. Sishek suggests that in the short term, the firm should immediately implement at least the following recommendation:<\/p><p>Risk Management Recommendation<\/p><p>Impose a daily 1% VaR limit of (for example) $2,000,000 on a portfolio. Monitor the portfolio for any signs of trending and liquidate the portfolio if cumulative monthly losses exceed $7,500,000.<\/p><p>She also intends to provide a list of typical risk management measures that traditional asset managers employ and agreed to put together a case study on how each of these measures could be implemented. The list she will provide is shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Typical risk measures employed by traditional asset managers include:<\/p><p>1. Beta sensitivity: useful for equity only 2. Active share: a measure of similarity to a benchmark 3. Surplus-at-risk: an application of VaR 4. Maximum drawdown: percentage of portfolio redeemed at peak times<\/p><p>Bagwell states that he is concerned about risks associated with the ETFs that BCI has been investing in. Sishek makes the following statements about the risks of investing in ETFs:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Some ETF legal structures expose the investors to counterparty risk.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Settlement risk is a key concern for foreign equity ETFs that invest in American depository<\/td><\/tr><tr><td>receipts (ADRs).<\/td><td><\/td><\/tr><\/table><\/div><p>Bagwell also revealed that he has some concerns over the trading methods authorized (and, in some cases, used) by the outgoing CRO. A recent internal audit of transactions carried out under his authorization revealed several instances of high frequency trading that auditors were uncomfortable with.<\/p><p>Multiple instances of trading patterns were flagged in an audit report as having a &quot;high risk of inviting regulatory scrutiny.&quot; An example is outlined in Exhibit 3.<\/p><p><b>Exhibit 3: High Frequency Trading Patterns<\/b><\/p><p>The pattern of trading by Trader [B] over the period 8th June to 12th June suggests strongly that Trader [B] may be wash trading.<\/p><\/div><\/details><div class=\"qtext\"><p>The activity described in Exhibit 3 is most likely to involve:<\/p><\/div>", "subj": "portfolio"}];
const CFG = {"title": "Extra Full Syllabus V1 · Exam 1 — Morning (AM)", "subtitle": "CFA Level II · 60 câu · 3 giờ", "minutes": 180, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }

}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");

    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");

    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;

      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;

function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);

function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"

  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }

  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";

}

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

(function(){

    var emoji=document.getElementById('rEmoji');

      emoji.textContent='💪';
    }

  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  if(graded) window.showGradedResult();

  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

(function(){

    var r=panel.getBoundingClientRect();

    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);

})();

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
