at a fairly constant rate over time and decides to estimate the linear trend in sales for the industry using quarterly data over the past 15 years, starting with Quarter 1 of 2004 and ending with Quarter 4 of 2018. On January 1, 2019, Shears estimates the following model:<\/p><p>sales  = b  + b t + e  (1)<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t<\/td><\/tr><tr><td>where:<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>sales = quarterly sales (measured in $ millions) for the specialty retail industry<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>b  = intercept term<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>0<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>b  = slope<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>1<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>t = time variable (quarter number)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>e = random error<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Exhibit 1 provides the results of the linear trend regression.<\/p><p><b>Exhibit 1: Linear Trend Regression<\/b><\/p><p>Coefficient Standard Error<\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>10.0<\/td><td>3.50<\/td><\/tr><tr><td>Trend<\/td><td>16.0<\/td><td>6.55<\/td><\/tr><\/table><\/div><p>Shears also estimates an autoregressive model of order one, AR(1), using the changes in quarterly sales data for the industry from the first quarter of 2004 through the fourth quarter of 2018. He obtains the following results for his AR(1) model:<\/p><div class=\"tbl\"><table><tr><td>∆sales  = b  + b ∆sales<\/td><td> + e<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t–1<\/td><td>t<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: AR(1) Model for Changes in Industry Sales<\/b><\/p><p>Coefficient Standard Error<\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>20.00<\/td><td>2.15<\/td><\/tr><tr><td>Lag 1<\/td><td>0.10<\/td><td>0.04<\/td><\/tr><\/table><\/div><p>The autocorrelations for the first four lags from Shears&#x27;s AR(1) model are provided in Exhibit 3:<\/p><p><b>Exhibit 3: Autocorrelations From the AR(1) Model<\/b><\/p><p>Lag Autocorrelation p-Value<\/p><div class=\"tbl\"><table><tr><td>1<\/td><td>–0.032<\/td><td>0.38<\/td><\/tr><tr><td>2<\/td><td>–0.200<\/td><td>0.16<\/td><\/tr><tr><td>3<\/td><td>–0.065<\/td><td>0.23<\/td><\/tr><tr><td>4<\/td><td>0.470<\/td><td>0.02<\/td><\/tr><\/table><\/div><p>Shears also derives a regression using the residuals from the AR(1) model. He regresses the squared residuals (or estimated errors) against the lagged squared residuals. The results of this regression are reported in Exhibit 4.<\/p><p><b>Exhibit 4: Squared Residuals Regression<\/b><\/p><p>Coefficient Standard Error p-Value<\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>3.00<\/td><td>0.577<\/td><td>0.01<\/td><\/tr><tr><td>Lagged residual squared<\/td><td>0.28<\/td><td>0.185<\/td><td>0.31<\/td><\/tr><\/table><\/div><p>Quarterly sales for the Specialty Retail Industry during 2018 were:<\/p><p><b>Exhibit 5: 2018 Quarterly Industry Sales<\/b><\/p><div class=\"tbl\"><table><tr><td>Quarter<\/td><td>Sales (in millions)<\/td><\/tr><tr><td>Quarter 1, 2018<\/td><td>900<\/td><\/tr><tr><td>Quarter 2, 2018<\/td><td>925<\/td><\/tr><tr><td>Quarter 3, 2018<\/td><td>950<\/td><\/tr><tr><td>Quarter 4, 2018<\/td><td>1,000<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the historical data provided in Exhibit 5, the two-period-ahead forecast of the change in industry sales is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 13, "q": "Based on finding 1, the snack food industry is engaging in regulatory:", "opts": ["capture.", "arbitrage.", "competition."], "ans": "B", "expl": "The snack foods industry, a regulated entity, has found a way to exploit the differences in regulations among the three states and is engaging in regulatory arbitrage. Regulatory competition is a result of actions taken by regulators to attract certain entities. Regulatory capture is the idea that regulatory bodies are influenced or controlled by the regulated industry. For Further Reference: (Study Session 4, Module 12.1, LOS 12.f)", "explhtml": "<p>The snack foods industry, a regulated entity, has found a way to exploit the differences in regulations among the three states and is engaging in regulatory arbitrage. Regulatory competition is a result of actions taken by regulators to attract certain entities. Regulatory capture is the idea that regulatory bodies are influenced or controlled by the regulated industry.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 12.1, LOS 12.f)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<\/summary><div class=\"vig-body\"><p>Tristanya is a developed country with three states, West Tristanya (West), Central Tristanya (Central), and East Tristanya (East). Tristanya is a stable democracy with elected representatives, appointed judges, and an elected prime minister. All three states have approximately the same population and geographical area. Tristanya&#x27;s savings rates are above the global average, and economic development has been mostly financed with domestic savings. The currency in Tristanya is the Tristanya dollar with a symbol of T$. The financial markets are highly liquid and function efficiently. Tristanya&#x27;s foreign trade is a significant part of the economy, and because of this, Tristanya has continued to push for lower trade barriers. Similar to other developed nations, population growth rate in Tristanya is low and capital stock is high.<\/p><p>The three states adhere to all federal regulations but differ significantly on some policies that are not covered by federal laws. The states also have their own agencies for regional administration of state-specific regulations. Any jurisdictional issue is resolved in federal courts.<\/p><p>The government of Tristanya is increasing its efforts to boost labor productivity. Some of the proposals under consideration include:<\/p><p>1. Increased education funding for elementary and middle schools. 2. Increased tax credits for private research and development expenditures. 3. Increased depreciation allowances for tax purposes.<\/p><p>At a recent congressional hearing, Mr. Adel Mahi, the chief economic adviser to the prime minister, stated that Tristanya&#x27;s capital accumulation affects the size of the Tristanyan GDP but not its growth rate.<\/p><p>All commercial and financial market regulations are the domain of federal agencies and government recognized self- regulatory organizations (SROs). In this regard, the federal government tends to set minimum standards and allows each state to create agencies to enforce their regulations.<\/p><p>Fuel costs have become an issue in Tristanya as demand for gasoline is expected to increase. Mandated fuel additives, specifically corn ethanol, are used to increase supply, and minimum fuel economy standards have been imposed to curtail demand.<\/p><p>East has the highest obesity rates among the three states. To control the state government&#x27;s health care expenditure, East&#x27;s government is implementing an additional tax on all sweet snack foods manufactured in the state. The tax is also known as the &quot;sweet tax.&quot; Another regulation, the &quot;supersize drinks ban,&quot; will prohibit restaurants in East from selling large portion sizes of carbonated beverages.<\/p><p>The most common form of sweetener in Tristanya is corn syrup. The agricultural industry has benefited from excess demand for corn to produce corn syrup and ethanol. Even after implementation of the &quot;sweet tax,&quot; the demand for corn is expected to remain high.<\/p><p>West has the highest gasoline usage per capita, and reducing gasoline consumption is a policy goal for that state&#x27;s government. West also has the most stringent environmental regulations and has recently raised their standards for minimum fuel economy for automobiles. Juanita Estrada, an analyst, is assigned to assess the impact of all the regulatory changes on economic growth. Estrada lists the following findings from her analysis:<\/p><div class=\"tbl\"><table><tr><td>Finding 1: <\/td><td>The snack food industry is in the process of relocating manufacturing of sweet snack foods to<\/td><\/tr><tr><td>West and Central and relocating manufacturing of salty snack foods to East.<\/td><td><\/td><\/tr><tr><td>Finding 2: <\/td><td>After West raised that state&#x27;s fuel economy standards, the average miles driven per capita<\/td><\/tr><tr><td>increased.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on finding 1, the snack food industry is engaging in regulatory:<\/p><\/div>", "subj": "economics"}, {"n": 14, "q": "Which Tristanyan industry is most likely to shrink due to the regulatory changes in the East?", "opts": ["Snacks.", "Agriculture.", "Carbonated beverages."], "ans": "C", "expl": "The carbonated beverages industry is likely to be hurt by the elimination of bigger sizes of drinks. The snack industry can avoid the new manufacturing tax in East by moving manufacture of sweet snacks to the other two states. The demand for corn is expected to remain fairly high so the regulatory changes in East are unlikely to have a major impact on the Tristanyan agricultural industry. For Further Reference: (Study Session 4, Module 12.1, LOS 12.i)", "explhtml": "<p>The carbonated beverages industry is likely to be hurt by the elimination of bigger sizes of drinks. The snack industry can avoid the new manufacturing tax in East by moving manufacture of sweet snacks to the other two states. The demand for corn is expected to remain fairly high so the regulatory changes in East are unlikely to have a major impact on the Tristanyan agricultural industry.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 12.1, L  the highest obesity rates among the three states. To control the state government&#x27;s health care expenditure, East&#x27;s government is implementing an additional tax on all sweet snack foods manufactured in the state. The tax is also known as the &quot;sweet tax.&quot; Another regulation, the &quot;supersize drinks ban,&quot; will prohibit restaurants in East from selling large portion sizes of carbonated beverages.<\/p><p>The most common form of sweetener in Tristanya is corn syrup. The agricultural industry has benefited from excess demand for corn to produce corn syrup and ethanol. Even after implementation of the &quot;sweet tax,&quot; the demand for corn is expected to remain high.<\/p><p>West has the highest gasoline usage per capita, and reducing gasoline consumption is a policy goal for that state&#x27;s government. West also has the most stringent environmental regulations and has recently raised their standards for minimum fuel economy for automobiles. Juanita Estrada, an analyst, is assigned to assess the impact of all the regulatory changes on economic growth. Estrada lists the following findings from her analysis:<\/p><div class=\"tbl\"><table><tr><td>Finding 1: <\/td><td>The snack food industry is in the process of relocating manufacturing of sweet snack foods to<\/td><\/tr><tr><td>West and Central and relocating manufacturing of salty snack foods to East.<\/td><td><\/td><\/tr><tr><td>Finding 2: <\/td><td>After West raised that state&#x27;s fuel economy standards, the average miles driven per capita<\/td><\/tr><tr><td>increased.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The cost associated with finding 2 is:<\/p><\/div>", "subj": "economics"}, {"n": 16, "q": "The government proposal that would most likely lead to the highest increase in labor productivity is:", "opts": ["Proposal 1.", "Proposal 2.", "Proposal 3."], "ans": "B", "expl": "In order for developed countries to grow, technological development is critical. Proposal 2 most clearly addresses this need. Proposal 1 would be more effective if the focus was on post-secondary education, as developed nations benefit more from innovation and less from applying technology. Proposal 3 is unlikely to have a major impact on labor productivity, as developed nations have high capital-to-labor ratios, and incentives to further increase capital will have relatively little effect on labor productivity. For Further Reference: (Study Session 4, Module 11.2, LOS 11.h)", "explhtml": "<p>In order for developed countries to grow, technological development is critical. Proposal 2 most clearly addresses this need. Proposal 1 would be more effective if the focus was on post-secondary education, as developed nations benefit more from innovation and less from applying technology. Proposal 3 is unlikely to have a major impact on labor productivity, as developed nations have high capital-to-labor ratios, and incentives to further increase capital will have relatively little effect on labor productivity.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 11.2, LOS 11.h)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tristanya is a developed country with three states, West Tristanya (West), Central Tristanya (Central), and East Tristanya (East). Tristanya is a stable democracy with elected representatives, appointed judges, and an elected prime minister. All three states have approximately the same population and geographical area. Tristanya&#x27;s savings rates are above the global average, and economic development has been mostly financed with domestic savings. The currency in Tristanya is the Tristanya dollar with a symbol of T$. The financial markets are highly liquid and function efficiently. Tristanya&#x27;s foreign trade is a significant part of the economy, and because of this, Tristanya has continued to push for lower trade barriers. Similar to other developed nations, population growth rate in Tristanya is low and capital stock is high.<\/p><p>The three states adhere to all federal regulations but differ significantly on some policies that are not covered by federal laws. The states also have their own agencies for regional administration of state-specific regulations. Any jurisdictional issue is resolved in federal courts.<\/p><p>The government of Tristanya is increasing its efforts to boost labor productivity. Some of the proposals under consideration include:<\/p><p>1. Increased education funding for elementary and middle schools. 2. Increased tax credits for private research and development expenditures. 3. Increased depreciation allowances for tax purposes.<\/p><p>At a recent congressional hearing, Mr. Adel Mahi, the chief economic adviser to the prime minister, stated that Tristanya&#x27;s capital accumulation affects the size of the Tristanyan GDP but not its growth rate.<\/p><p>All commercial and financial market regulations are the domain of federal agencies and government recognized self- regulatory organizations (SROs). In this regard, the federal government tends to set minimum standards and allows each state to create agencies to enforce their regulations.<\/p><p>Fuel costs have become an issue in Tristanya as demand for gasoline is expected to increase. Mandated fuel additives, specifically corn ethanol, are used to increase supply, and minimum fuel economy standards have been imposed to curtail demand.<\/p><p>East has the highest obesity rates among the three states. To control the state government&#x27;s health care expenditure, East&#x27;s government is implementing an additional tax on all sweet snack foods manufactured in the state. The tax is also known as the &quot;sweet tax.&quot; Another regulation, the &quot;supersize drinks ban,&quot; will prohibit restaurants in East from selling large portion size a<\/td><\/tr><tr><td>increased.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Mahi&#x27;s statement is consistent with:<\/p><\/div>", "subj": "economics"}, {"n": 18, "q": "The objectives of regulators in financial markets is least likely to include:", "opts": ["low inflation.", "prudential supervision.", "promotion of economic growth."], "ans": "A", "expl": "The objectives of regulators in financial markets include prudential supervision, financial stability, market integrity, and economic growth. Low inflation is likely to be an objective of the central bank. For Further Reference: (Study Session 4, Module 12.1, LOS 12.b)", "explhtml": "<p>The objectives of regulators in financial markets include prudential supervision, financial stability, market integrity, and economic growth. Low inflation is likely to be an objective of the central bank.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 12.1, LOS 12.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tristanya is a developed country with three states, West Tristanya (West), Central Tristanya (Central), and East Tristanya (East). Tristanya is a stable democracy with elected representatives, appointed judges, and an elected prime minister. All three states have approximately the same population and geographical area. Tristanya&#x27;s savings rates are above the global average, and economic development has been mostly financed with domestic savings. The currency in Tristanya is the Tristanya dollar with a symbol of T$. The financial markets are highly liquid and function efficiently. Tristanya&#x27;s foreign trade is a significant part of the economy, and because of this, Tristanya has continued to push for lower trade barriers. Similar to other developed nations, population growth rate in Tristanya is low and capital stock is high.<\/p><p>The three states adhere to all federal regulations but differ significantly on some policies that are not covered by federal laws. The states also have their own agencies for regional administration of state-specific regulations. Any jurisdictional issue is resolved in federal courts.<\/p><p>The government of Tristanya is increasing its efforts to boost labor productivity. Some of the proposals under consideration include:<\/p><p>1. Increased education funding for elementary and middle schools. 2. Increased tax credits for private research and development expenditures. 3. Increased depreciation allowances for tax purposes.<\/p><p>At a recent congressional hearing, Mr. Adel Mahi, the chief economic adviser to the prime minister, stated that Tristanya&#x27;s capital accumulation affects the size of the Tristanyan GDP but not its growth rate.<\/p><p>All commercial and financial market regulations are the domain of federal agencies and government recognized self- regulatory organizations (SROs). In this regard, the federal government tends to set minimum standards and allows each state to create agencies to enforce their regulations.<\/p><p>Fuel costs have become an issue in Tristanya as demand for gasoline is expected to increase. Mandated fuel additives, specifically corn ethanol, are used to increase supply, and minimum fuel economy standards have been imposed to curtail demand.<\/p><p>East has the highest obesity rates among the three states. To control the state government&#x27;s health care expenditure, East&#x27;s government is implementing an additional tax on all sweet snack foods manufactured in the state. The tax is also known as the &quot;sweet tax.&quot; Another regulation, the &quot;supersize drinks ban,&quot; will prohibit restaurants in East from selling large portion sizes of carbonated beverages.<\/p><p>The most common form of sweetener in Tristanya is corn syrup. The agricultural industry has benefited from excess demand for corn to produce corn syrup and ethanol. Even after implementation of the &quot;sweet tax,&quot; the demand for corn is expected to remain high.<\/p><p>West has the highest gasoline usage per capita, and reducing gasoline consumption is a policy goal for that state&#x27;s government. West also has the most stringent environmental regulations and has recently raised their standards for minimum fuel economy for automobiles. Juanita Estrada, an analyst, is assigned to assess the impact of all the regulatory changes on economic growth. Estrada lists the following findings from her analysis:<\/p><div class=\"tbl\"><table><tr><td>Finding 1: <\/td><td>The snack food industry is in the process of relocating manufacturing of sweet snack foods to<\/td><\/tr><tr><td>West and Central and relocating manufacturing of salty snack foods to East.<\/td><td><\/td><\/tr><tr><td>Finding 2: <\/td><td>After West raised that state&#x27;s fuel economy standards, the average miles driven per capita<\/td><\/tr><tr><td>increased.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The objectives of regulators in financial markets is least likely to include:<\/p><\/div>", "subj": "economics"}, {"n": 19, "q": "The carrying value of Viper's investment portfolio as of December 31, 2019, is closest to:", "opts": ["$16.6 million.", "$17.2 million.", "$17.5 million."], "ans": "B", "expl": "Pinto bonds are reported on the balance sheet at amortized cost. At the end of 2019, the Pinto bonds have a carrying value of $9,260,000 (9,200,000 issue price + 60,000 discount amortization). The amortized discount is equal to the $60,000 difference between the interest expense of $460,000 (9,200,000 × 5%) and the $400,000 coupon payment (10,000,000 × 4%). FVPL securities are reported on the balance sheet at fair value. At the end of 2019, the fair value of the Vega bonds was $7,941,591 (N = 39, I = 2, PMT = 175,000, FV = 7,000,000, Solve for PV). Thus, at the end of 2019, the investment portfolio is reported at $17.2 million (9,260,000 Pinto bond + 7,941,591 Vega bond). For Further Reference: (Study Session 5, Module 13.1, LOS 13.a)", "explhtml": "<p>Pinto bonds are reported on the balance sheet at amortized cost. At the end of 2019, the Pinto bonds have a carrying value of $9,260,000 (9,200,000 issue price + 60,000 discount amortization). The amortized discount is equal to the $60,000 difference between the interest expense of $460,000 (9,200,000 × 5%) and the $400,000 coupon payment (10,000,000 × 4%).<\/p><p>FVPL securities are reported on the balance sheet at fair value. At the end of 2019, the fair value of the Vega bonds was $7,941,591 (N = 39, I = 2, PMT = 175,000, FV = 7,000,000, Solve for PV).<\/p><p>Thus, at the end of 2019, the investment portfolio is reported at $17.2 million (9,260,000 Pinto bond + 7,941,591 Vega bond).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.1, LOS 13.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Viper Motor Company, a publicly traded automobile manufacturer located in Detroit, Michigan, periodically invests its excess cash in low-risk fixed-income securities. At the end of 2019, Viper&#x27;s investment portfolio consisted of two separate bond investments: Pinto Corporation and Vega Incorporated.<\/p><p>On January 2, 2019, Viper purchased $10 million of Pinto&#x27;s 4% annual coupon bonds at 92% of par. The bonds were priced to yield 5%. Viper classified the bonds as amortized cost securities. At the end of 2019, the bonds had a fair value of $9.6 million.<\/p><p>On July 1, 2019, Viper purchased $7 million of Vega&#x27;s 5% semiannual coupon mortgage bonds at par. The bonds mature in 20 years. At the end of 2019, the market rate of interest for similar bonds was 4%. Viper classifies these bonds as fair value through profit or loss securities.<\/p><p>Neither of the bond investments were sold by Viper in 2019.<\/p><p>On January 1, 2020, Viper purchased a 60% controlling interest in Gremlin Corporation for $900 million. Viper paid for the acquisition with shares of its common stock.<\/p><p>Exhibit 1 contains Viper&#x27;s and Gremlin&#x27;s preacquisition balance sheet data.<\/p><p><b>Exhibit 1: Preacquisition Balance Sheet Data<\/b><\/p><div class=\"tbl\"><table><tr><td>Viper<\/td><td>Gremlin<\/td><\/tr><\/table><\/div><p>In millions Book Value Fair Value Book Value Fair Value<\/p><div class=\"tbl\"><table><tr><td>Current assets<\/td><td>$9,000<\/td><td>$9,000<\/td><td>$500<\/td><td>$700<\/td><\/tr><tr><td>Noncurrent assets<\/td><td>7,500<\/td><td>7,800<\/td><td>900<\/td><td>950<\/td><\/tr><tr><td>$16,500<\/td><td>$1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current liabilities<\/td><td>$3,000<\/td><td>$3,000<\/td><td>$250<\/td><td>$250<\/td><\/tr><tr><td>Long-term debt<\/td><td>7,700<\/td><td>7,500<\/td><td>400<\/td><td>300<\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>5,800<\/td><td>750<\/td><td><\/td><td><\/td><\/tr><tr><td>$16,500<\/td><td>$1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Exhibit 2 contains selected information from Viper&#x27;s financial statement footnotes.<\/p><p><b>Exhibit 2: Selected Footnote Information—Viper Motor Company<\/b><\/p><p>In millions<\/p><p>At the end of 2020, the carrying value of Viper&#x27;s investment in Gremlin was $1,425, including goodwill. On that date, the fair value of Gremlin was $1,475, and the fair value of Gremlin&#x27;s identifiable net assets was $1,350. The recoverable amount was estimated at $1,430.<\/p><\/div><\/details><div class=\"qtext\"><p>The carrying value of Viper&#x27;s investment portfolio as of December 31, 2019, is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 20, "q": "If Viper had initially classified its Vega bond investment as fair value through OCI, which of the following best describes the most likely effect for the year ended 2019?", "opts": ["Lower asset turnover.", "Higher return on equity.", "Lower net profit margin."], "ans": "C", "expl": "A $941,591 unrealized gain (7,941,591 FV − 7,000,000 BV) was included in Viper's net income because the Vega bonds were classified as FVPL securities. Had the Vega bonds been classified as FVOCI, the unrealized gain would have been reported as a component of stockholders' equity. In that case, net profit margin would have been lower (lower numerator). For Further Reference: (Study Session 5, Module 13.1, LOS 13.a)", "explhtml": "<p>A $941,591 unrealized gain (7,941,591 FV − 7,000,000 BV) was included in Viper&#x27;s net income because the Vega bonds were classified as FVPL securities. Had the Vega bonds been classified as FVOCI, the unrealized gain would have been reported as a component of stockholders&#x27; equity. In that case, net profit margin would have been lower (lower numerator).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.1, LOS 13.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Viper Motor Company, a publicly traded automobile manufacturer located in Detroit, Michigan, periodically invests its excess cash in low-risk fixed-income securities. At the end of 2019, Viper&#x27;s investment portfolio consisted of two separate bond investments: Pinto Corporation and Vega Incorporated.<\/p><p>On January 2, 2019, Viper purchased $10 million of Pinto&#x27;s 4% annual coupon bonds at 92% of par. The bonds were priced to yield 5%. Viper classified the bonds as amortized cost securities. At the end of 2019, the bonds had a fair value of $9.6 million.<\/p><p>On July 1, 2019, Viper purchased $7 million of Vega&#x27;s 5% semiannual coupon mortgage bonds at par. The bonds mature in 20 years. At the end of 2019, the market rate of interest for similar bonds was 4%. Viper classifies these bonds as fair value through profit or loss securities.<\/p><p>Neither of the bond investments were sold by Viper in 2019.<\/p><p>On January 1, 2020, Viper purchased a 60% controlling interest in Gremlin Corporation for $900 million. Viper paid for the acquisition with shares of its common stock.<\/p><p>Exhibit 1 contains Viper&#x27;s and Gremlin&#x27;s preacquisition balance sheet data.<\/p><p><b>Exhibit 1: Preacquisition Balance Sheet Data<\/b><\/p><div class=\"tbl\"><table><tr><td>Viper<\/td><td>Gremlin<\/td><\/tr><\/table><\/div><p>In millions Book Value Fair Value Book Value Fair Value<\/p><div class=\"tbl\"><table><tr><td>Current assets<\/td><td>$9,000<\/td><td>$9,000<\/td><td>$500<\/td><td>$700<\/td><\/tr><tr><td>Noncurrent assets<\/td><td>7,500<\/td><td>7,800<\/td><td>900<\/td><td>950<\/td><\/tr><tr><td>$16,500<\/td><td>$1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current liabilities<\/td><td>$3,000<\/td><td>$3,000<\/td><td>$250<\/td><td>$250<\/td><\/tr><tr><td>Long-term debt<\/td><td>7,700<\/td><td>7,500<\/td><td>400<\/td><td>300<\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>5,800<\/td><td>750<\/td><td><\/td><td><\/td><\/tr><tr><td>$16,500<\/td><td>$1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Exhibit 2 contains selected information from Viper&#x27;s financial statement footnotes.<\/p><p><b>Exhibit 2: Selected Footnote Information—Viper Motor Company<\/b><\/p><p>In millions<\/p><p>At the end of 2020, the carrying value of Viper&#x27;s investment in Gremlin was $1,425, including goodwill. On that date, the fair value of Gremlin was $1,475, and the fair value of Gremlin&#x27;s identifiable net assets was $1,350. The recoverable amount was estimated at $1,430.<\/p><\/div><\/details><div class=\"qtext\"><p>If Viper had initially classified its Vega bond investment as fair value through OCI, which of the following best describes the most likely effect for the year ended 2019?<\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "What is the appropriate adjustment, if any, if the Pinto bonds are reclassified as fair value through profit or loss securities during 2020?", "opts": ["The difference between the fair value and the carrying value on the date of reclassification is recognized in Viper’s income statement.", "Any unrealized gain or loss, as of the date of reclassification, is immediately recognized in Viper’s OCI.", "No adjustment is necessary because reclassification to/from fair value through profit or loss is strictly prohibited."], "ans": "A", "expl": "Reclassifying an amortized cost security to FVPL involves stating the investment on the balance sheet at fair value and recognizing the difference in the fair value and the carrying value in the income statement. For Further Reference: (Study Session 5, Module 13.1, LOS 13.a)", "explhtml": "<p>Reclassifying an amortized cost security to FVPL involves stating the investment on the balance sheet at fair value and recognizing the difference in the fair value and the carrying value in the income statement.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.1, LOS 13.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Viper Motor Company, a publicly traded automobile manufacturer located in Detroit, Michigan, periodically invests its excess cash in low-risk fixed-income securities. At the end of 2019, Viper&#x27;s investment portfolio consisted of two separate bond investments: Pinto Corporation and Vega Incorporated.<\/p><p>On January 2, 2019, Viper purchased $10 million of Pinto&#x27;s 4% annual coupon bonds at 92% of par. The bonds were priced to yield 5%. Viper classified the bonds as amortized cost securities. At the end of 2019, the bonds had a fair value of $9.6 million.<\/p><p>On July 1, 2019, Viper purchased $7 million of Vega&#x27;s 5% semiannual coupon mortgage bonds at par. The bonds mature in 20 years. At the end of 2019, the market rate of interest for similar bonds was 4%. Viper classifies these bonds as fair value through profit or loss securities.<\/p><p>Neither of the bond investments were sold by Viper in 2019.<\/p><p>On January 1, 2020, Viper purchased a 60% controlling interest in Gremlin Corporation for $900 million. Viper paid for the acquisition with shares of its common stock.<\/p><p>Exhibit 1 contains Viper&#x27;s and Gremlin&#x27;s preacquisition balance sheet data.<\/p><p><b>Exhibit 1: Preacquisition Balance Sheet Data<\/b><\/p><div class=\"tbl\"><table><tr><td>Viper<\/td><td>Gremlin<\/td><\/tr><\/table><\/div><p>In millions Book Value Fair Value Book Value Fair Value<\/p><div class=\"tbl\"><table><tr><td>Current assets<\/td><td>$9,000<\/td><td>$9,000<\/td><td>$500<\/td><td>$700<\/td><\/tr><tr><td>Noncurrent assets<\/td><td>7,500<\/td><td>7,800<\/td><td>900<\/td><td>950<\/td><\/tr><tr><td>$16,500<\/td><td>$1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current liabilities<\/td><td>$3,000<\/td><td>$3,000<\/td><td>$250<\/td><td>$250<\/td><\/tr><tr><td>Long-term debt<\/td><td>7,700<\/td><td>7,500<\/td><td>400<\/td><td>300<\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>5,800<\/td><td>750<\/td><td><\/td><td><\/td><\/tr><tr><td>$16,500<\/td><td>$1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Exhibit 2 contains selected information from Viper&#x27;s financial statement footnotes.<\/p><p><b>Exhibit 2: Selected Footnote Information—Viper Motor Company<\/b><\/p><p>In millions<\/p><p>At the end of 2020, the carrying value of Viper&#x27;s investment in Gremlin was $1,425, including goodwill. On that date, the fair value of Gremlin was $1,475, and the fair value of Gremlin&#x27;s identifiable net assets was $1,350. The recoverable amount was estimated at $1,430.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the appropriate adjustment, if any, if the Pinto bonds are reclassified as fair value through profit or loss securities during 2020?<\/p><\/div>", "subj": "fsa"}, {"n": 22, "q": "The amount of goodwill Viper should report in its consolidated balance sheet immediately after the acquisition of Gremlin is closest to:", "opts": ["$250 million under the partial goodwill method.", "$350 million under the pooling method.", "$400 million under the full goodwill method."], "ans": "C", "expl": "Full goodwill method (in millions) Fair value of Gremlin $1,500 (900 purchase price / 60% ownership interest) Less: Fair value of Gremlin's identifiable net assets 1,100 (700 CA + 950 NCA − 250 CL − 300 LTD) Goodwill $400 Partial goodwill method (in millions) Purchase price $900 Less: Pro-rata share of Gremlin's identifiable net assets at (700 CA + 950 NCA − 250 CL − 300 LTD) × 660 FV 60% Goodwill $240 Goodwill is not created under the pooling method. For Further Reference: (Study Session 5, Module 13.7, LOS 13.b)", "explhtml": "<p>Full goodwill method (in millions)<\/p><div class=\"tbl\"><table><tr><td>Fair value of Gremlin<\/td><td>$1,500 (900 purchase price / 60% ownership interest)<\/td><\/tr><tr><td>Less: Fair value of Gremlin&#x27;s identifiable net assets<\/td><td>1,100 (700 CA + 950 NCA − 250 CL − 300 LTD)<\/td><\/tr><tr><td>Goodwill<\/td><td>$400<\/td><\/tr><\/table><\/div><p>Partial goodwill method (in millions)<\/p><div class=\"tbl\"><table><tr><td>Purchase price<\/td><td>$900<\/td><\/tr><tr><td>Less: Pro-rata share of Gremlin&#x27;s identifiable net assets at<\/td><td>(700 CA + 950 NCA − 250 CL − 300 LTD) ×<\/td><\/tr><tr><td>660 <\/td><td><\/td><\/tr><tr><td>FV<\/td><td>60%<\/td><\/tr><tr><td>Goodwill<\/td><td>$240<\/td><\/tr><\/table><\/div><p>Goodwill is not created under the pooling method.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.7, LOS 13.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Viper Motor Company, a publicly traded automobile manufacturer located in Detroit, Michigan, periodically invests its excess cash in low-risk fixed-income securities. At the end of 2019, Viper&#x27;s investment portfolio consisted of two separate bond investments: Pinto Corporation and Vega Incorporated.<\/p><p>On January 2, 2019, Viper purchased $10 million of Pinto&#x27;s 4% annual coupon bonds at 92% of par. The bonds were priced to yield 5%. Viper classified the bonds as amortized cost securities. At the end of 2019, the bonds had a fair value of $9.6 million.<\/p><p>On July 1, 2019, Viper purchased $7 million of Vega&#x27;s 5% semiannual coupon mortgage bonds at par. The bonds mature in 20 years. At the end of 2019, the market rate of interest for similar bonds was 4%. Viper classifies these bonds as fair value through profit or loss securities.<\/p><p>Neither of the bond investments were sold by Viper in 2019.<\/p><p>On January 1, 2020, Viper purchased a 60% controlling interest in Gremlin Corporation for $900 million. Viper paid for the acquisition with shares of its common stock.<\/p><p>Exhibit 1 contains Viper&#x27;s and Gremlin&#x27;s preacquisition balance sheet data.<\/p><p><b>Exhibit 1: Preacquisition Balance Sheet Data<\/b><\/p><div class=\"tbl\"><table><tr><td>Viper<\/td><td>Gremlin<\/td><\/tr><\/table><\/div><p>In millions Book Value Fair Value Book Value Fair Value<\/p><div class=\"tbl\"><table><tr><td>Current assets<\/td><td>$9,000<\/td><td>$9,000<\/td><td>$500<\/td><td>$700<\/td><\/tr><tr><td>Noncurrent assets<\/td><td>7,500<\/td><td>7,800<\/td><td>900<\/td><td>950<\/td><\/tr><tr><td>$16,500<\/td><td>$1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current liabilities<\/td><td>$3,000<\/td><td>$3,000<\/td><td>$250<\/td><td>$250<\/td><\/tr><tr><td>Long-term debt<\/td><td>7,700<\/td><td>7,500<\/td><td>400<\/td><td>300<\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>5,800<\/td><td>750<\/td><td><\/td><td><\/td><\/tr><tr><td>$16,500<\/td><td>$1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Exhibit 2 contains selected information from Viper&#x27;s financial statement footnotes.<\/p><p><b>Exhibit 2: Selected Footnote Information—Viper Motor Company<\/b><\/p><p>In millions<\/p><p>At the end of 2020, the carrying value of Viper&#x27;s investment in Gremlin was $1,425, including goodwill. On that date, the fair value of Gremlin was $1,475, and the fair value of Gremlin&#x27;s identifiable net assets was $1,350. The recoverable amount was estimated at $1,430.<\/p><\/div><\/details><div class=\"qtext\"><p>The amount of goodwill Viper should report in its consolidated balance sheet immediately after the acquisition of Gremlin is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 23, "q": "According to U.S. GAAP, Viper's long-term debt-to-equity ratio, calculated immediately after the acquisition, is closest to:", "opts": ["1.07.", "1.10.", "1.12."], "ans": "B", "expl": "Viper's post-acquisition LTD is $8,000 million [7,700 million BV of Viper + 300 million fair value (FV) of Gremlin debt]. Viper's post-acquisition equity is equal to $7,300 million (5,800 million Viper pre-acquisition equity + 900 million FV of shares used to acquire Gremlin + 600 million noncontrolling interest). Under U.S. GAAP, the noncontrolling interest is based on the full goodwill method (1,500 million FV of Gremlin × 40% noncontrolling interest). Thus, the long-term debt-to- equity ratio is 1.10 (8,000 million LTD / 7,300 million equity). For Further Reference: (Study Session 5, Module 13.7, LOS 13.b, 13.c)", "explhtml": "<p>Viper&#x27;s post-acquisition LTD is $8,000 million [7,700 million BV of Viper + 300 million fair value (FV) of Gremlin debt]. Viper&#x27;s post-acquisition equity is equal to $7,300 million (5,800 million Viper pre-acquisition equity + 900 million FV of shares used to acquire Gremlin + 600 million noncontrolling interest). Under U.S. GAAP, the noncontrolling interest is based on the full goodwill method (1,500 million FV of Gremlin × 40% noncontrolling interest). Thus, the long-term debt-to- equity ratio is 1.10 (8,000 million LTD / 7,300 million equity).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.7, LOS 13.b, 13.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Viper Motor Company, a publicly traded automobile manufacturer located in Detroit, Michigan, periodically invests its excess cash in low-risk fixed-income securities. At the end of 2019, Viper&#x27;s investment portfolio consisted of two separate bond investments: Pinto Corporation and Vega Incorporated.<\/p><p>On January 2, 2019, Viper purchased $10 million of Pinto&#x27;s 4% annual coupon bonds at 92% of par. The bonds were priced to yield 5%. Viper classified the bonds as amortized cost securities. At the end of 2019, the bonds had a fair value of $9.6 million.<\/p><p>On July 1, 2019, Viper purchased $7 million of Vega&#x27;s 5% semiannual coupon mortgage bonds at par. The bonds mature in 20 years. At the end of 2019, the market rate of interest for similar bonds was 4%. Viper classifies these bonds as fair value through profit or loss securities.<\/p><p>Neither of the bond investments were sold by Viper in 2019.<\/p><p>On January 1, 2020, Viper purchased a 60% controlling interest in Gremlin Corporation for $900 million. Viper paid for the acquisition with shares of its common stock.<\/p><p>Exhibit 1 contains Viper&#x27;s and Gremlin&#x27;s preacquisition balance sheet data.<\/p><p><b>Exhibit 1: Preacquisition Balance Sheet Data<\/b><\/p><div class=\"tbl\"><table><tr><td>Viper<\/td><td>Gremlin<\/td><\/tr><\/table><\/div><p>In millions Book Value Fair Value  impairment loss is recognized because the $1,430 million recoverable amount exceeds the $1,425 million carrying value. For Further Reference: (Study Session 5, Module 13.2, LOS 13.b)", "explhtml": "<p>According to U.S. GAAP, the goodwill is not impaired because the $1,475 million fair value of Gremlin exceeds the $1,425 million carrying value. Thus, no impairment loss is recognized.<\/p><p>Under IFRS, no impairment loss is recognized because the $1,430 million recoverable amount exceeds the $1,425 million carrying value.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.2, LOS 13.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Viper Motor Company, a publicly traded automobile manufacturer located in Detroit, Michigan, periodically invests its excess cash in low-risk fixed-income securities. At the end of 2019, Viper&#x27;s investment portfolio consisted of two separate bond investments: Pinto Corporation and Vega Incorporated.<\/p><p>On January 2, 2019, Viper purchased $10 million of Pinto&#x27;s 4% annual coupon bonds at 92% of par. The bonds were priced to yield 5%. Viper classified the bonds as amortized cost securities. At the end of 2019, the bonds had a fair value of $9.6 million.<\/p><p>On July 1, 2019, Viper purchased $7 million of Vega&#x27;s 5% semiannual coupon mortgage bonds at par. The bonds mature in 20 years. At the end of 2019, the market rate of interest for similar bonds was 4%. Viper classifies these bonds as fair value through profit or loss securities.<\/p><p>Neither of the bond investments were sold by Viper in 2019.<\/p><p>On January 1, 2020, Viper purchased a 60% controlling interest in Gremlin Corporation for $900 million. Viper paid for the acquisition with shares of its common stock.<\/p><p>Exhibit 1 contains Viper&#x27;s and Gremlin&#x27;s preacquisition balance sheet data.<\/p><p><b>Exhibit 1: Preacquisition Balance Sheet Data<\/b><\/p><div class=\"tbl\"><table><tr><td>Viper<\/td><td>Gremlin<\/td><\/tr><\/table><\/div><p>In millions Book Value Fair Value Book Value Fair Value<\/p><div class=\"tbl\"><table><tr><td>Current assets<\/td><td>$9,000<\/td><td>$9,000<\/td><td>$500<\/td><td>$700<\/td><\/tr><tr><td>Noncurrent assets<\/td><td>7,500<\/td><td>7,800<\/td><td>900<\/td><td>950<\/td><\/tr><tr><td>$16,500<\/td><td>$1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current liabilities<\/td><td>$3,000<\/td><td>$3,000<\/td><td>$250<\/td><td>$250<\/td><\/tr><tr><td>Long-term debt<\/td><td>7,700<\/td><td>7,500<\/td><td>400<\/td><td>300<\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>5,800<\/td><td>750<\/td><td><\/td><td><\/td><\/tr><tr><td>$16,500<\/td><td>$1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Exhibit 2 contains selected information from Viper&#x27;s financial statement footnotes.<\/p><p><b>Exhibit 2: Selected Footnote Information—Viper Motor Company<\/b><\/p><p>In millions<\/p><p>At the end of 2020, the carrying value of Viper&#x27;s investment in Gremlin was $1,425, including goodwill. On that date, the fair value of Gremlin was $1,475, and the fair value of Gremlin&#x27;s identifiable net assets was $1,350. The recoverable amount was estimated at $1,430.<\/p><\/div><\/details><div class=\"qtext\"><p>Using only the information contained in Exhibit 2, which of the following statements is most accurate when presenting Viper&#x27;s consolidated income statement for the year ended 2020?<\/p><\/div>", "subj": "fsa"}, {"n": 25, "q": "When applying the financial analysis framework to Delicious, which of the following is the best example of an input Scott should use when establishing the purpose and context of the analysis?", "opts": ["The audited financial statements of Delicious prepared in conformance with either U.S. GAAP or IFRS.", "Ratio analysis adjusted for differences between U.S. accounting standards and international accounting standards.", "Review of the pension fund’s guidelines related to developing the specific work product."], "ans": "C", "expl": "The institutional guidelines related to developing the specific work product is an input source in the first phase (defining the purpose and context of the analysis). Audited financial statements are an example of an input in the data collection phase. Ratio analysis is an example of the output from the data processing phase. For Further Reference: (Study Session 6, Module 18.1, LOS 18.a)", "explhtml": "<p>The institutional guidelines related to developing the specific work product is an input source in the first phase (defining the purpose and context of the analysis). Audited financial statements are an example of an input in the data collection phase. Ratio analysis is an example of the output from the data processing phase.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 6, Module 18.1, LOS 18.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Delicious Candy Company (Delicious) is a leading manufacturer and distributor of quality confectionery products throughout Europe and Mexico. Delicious is a publicly traded firm located in Italy and has been in business over 60 years. Delicious complies with International Financial Reporting Standards (IFRS).<\/p><p>Caleb Scott, an equity analyst with a large pension fund, has been asked to complete a comprehensive analysis of Delicious in order to evaluate the possibility of a future investment.<\/p><p>Scott compiles the selected financial data found in Exhibit 1 and learns that Delicious owns a 30% equity interest in a supplier located in the United States. Delicious uses the equity method to account for its investment in the U.S. associate. The associate prepares its financial statements in accordance with U.S. Generally Accepted Accounting Principles (GAAP).<\/p><p><b>Exhibit 1: Selected Financial Data—Delicious Candy Company<\/b><\/p><div class=\"tbl\"><table><tr><td>In millions<\/td><td>2017<\/td><td>2016<\/td><\/tr><\/table><\/div><p>Income Statement<\/p><div class=\"tbl\"><table><tr><td>Revenue<\/td><td>€60,229 €55,137<\/td><td><\/td><td><\/td><\/tr><tr><td>Earnings before interest and tax<\/td><td>7,990<\/td><td>7,077<\/td><td><\/td><\/tr><tr><td>Earnings before tax<\/td><td>7,570<\/td><td>6,779<\/td><td><\/td><\/tr><tr><td>Income from associate<\/td><td>a<\/td><td>354<\/td><td>270<\/td><\/tr><tr><td>Net income<\/td><td>6,501<\/td><td>5,625<\/td><td><\/td><\/tr><\/table><\/div><p>Balance sheet<\/p><div class=\"tbl\"><table><tr><td>Total assets<\/td><td>b<\/td><td>€56,396<\/td><td>€53,111<\/td><\/tr><tr><td>Investment in associate<\/td><td>5,504<\/td><td>5,193<\/td><td><\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>c<\/td><td>30,371<\/td><td>29,595<\/td><\/tr><tr><td>a<\/td><td> Not included in EBIT or EBT.<\/td><td><\/td><td><\/td><\/tr><tr><td>b<\/td><td> Total assets were €45,597 at the end of 2015.<\/td><td><\/td><td><\/td><\/tr><tr><td>c<\/td><td> Stockholders&#x27; equity was €27,881 at the end of 2015.<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Scott reads the Delicious&#x27;s revenue recognition footnote found in Exhibit 2.<\/p><p><b>Exhibit 2: Revenue Recognition Footnote<\/b><\/p><p>In millions<\/p><p>Revenue is recognized, net of returns and allowances, when the goods are shipped to customers and collectibility is assured. Several customers remit payment before delivery in order to receive additional discounts. Delicious reports these amounts as unearned revenue until the goods are shipped. Unearned revenue was €7,201 at the end of 2017, €2,514 at the end of 2016, and €1,711 at the end of 2015.<\/p><p>Delicious operates two geographic segments: Europe and Mexico. Selected financial information for each segment is found in Exhibit 3.<\/p><p><b>Exhibit 3: Selected Financial Information by Segment<\/b><\/p><div class=\"tbl\"><table><tr><td>In millions<\/td><td>EBIT<\/td><td>Revenue Total CapEx Total Assets<\/td><td><\/td><td><\/td><\/tr><tr><td>Europe<\/td><td>€7,203<\/td><td>€50,463<\/td><td>€4,452<\/td><td>€36,642<\/td><\/tr><tr><td>Mexico<\/td><td>€787<\/td><td>€9,766<\/td><td>€8,269<\/td><td>€14,250<\/td><\/tr><\/table><\/div><p>Scott wants to determine whether the cash flow is of high quality.<\/p><p>Scott gathers the information in Exhibit 4 to determine the implied &quot;stand-alone&quot; value of Delicious without regard to the value of its U.S. associate.<\/p><p><b>Exhibit 4: Selected 2017 Market Capitalization Data<\/b><\/p><p>In millions except exchange rates Delicious Associate<\/p><div class=\"tbl\"><table><tr><td>Market capitalization<\/td><td>€97,525<\/td><td>$32,330<\/td><\/tr><tr><td>Current exchange rate (€ per $)<\/td><td>€0.70<\/td><td><\/td><\/tr><tr><td>Average exchange rate (€ per $)<\/td><td>€0.73<\/td><td><\/td><\/tr><\/table><\/div><p>Delicious financial statements include an investment of €60 million in debt securities, which are reported as fair value through profit or loss securities.<\/p><\/div><\/details><div class=\"qtext\"><p>When applying the financial analysis framework to Delicious, which of the following is the best example of an input Scott should use when establishing the purpose and context of the analysis?<\/p><\/div>", "subj": "fsa"}, {"n": 26, "q": "If Delicious reported the investment in debt securities as fair value through OCI securities instead of as fair value through profit or loss securities, the impact on Delicious's financial statement would be:", "opts": ["to decrease total assets.", "to increase total assets.", "no change to total assets."], "ans": "C", "expl": "If Delicious reported the investment in debt securities as fair value through OCI instead of fair value through profit or loss, its total assets would be unchanged, because both methods report the bonds at fair value on the balance sheet. Net income would, however, differ with unrealized gains or loss reported in income statement under fair value through profit or loss classification while being reported in OCI under fair value through OCI classification. For Further Reference: (Study Session 5, Module 13.1, LOS 13.a)", "explhtml": "<p>If Delicious reported the investment in debt securities as fair value through OCI instead of fair value through profit or loss, its total assets would be unchanged, because both methods report the bonds at fair value on the balance sheet. Net income would, however, differ with unrealized gains or loss reported in income statement under fair value through profit or loss classification while being reported in OCI under fair value through OCI classification.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.1, LOS 13.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Delicious Candy Company (Delicious) is a leading manufacturer and distributor of quality confectionery products throughout Europe and Mexico. Delicious is a publicly traded firm located in Italy and has been in business over 60 years. Delicious complies with International Financial Reporting Standards (IFRS).<\/p><p>Caleb Scott, an equity analyst with a large pension fund, has been asked to complete a comprehensive analysis of Delicious in order to evaluate the possibility of a future investment.<\/p><p>Scott compiles the selected financial data found in Exhibit 1 and learns that Delicious owns a 30% equity interest in a supplier located in the United States. Delicious uses the equity method to account for its investment in the U.S. associate. The associate prepares its financial statements in accordance with U.S. Generally Accepted Accounting Principles (GAAP).<\/p><p><b>Exhibit 1: Selected Financial Data—Delicious Candy Company<\/b><\/p><div class=\"tbl\"><table><tr><td>In millions<\/td><td>2017<\/td><td>2016<\/td><\/tr><\/table><\/div><p>Income Statement<\/p><div class=\"tbl\"><table><tr><td>Revenue<\/td><td>€60,229 €55,137<\/td><td><\/td><td><\/td><\/tr><tr><td>Earnings before interest and tax<\/td><td>7,990<\/td><td>7,077<\/td><td><\/td><\/tr><tr><td>Earnings before tax<\/td><td>7,570<\/td><td>6,779<\/td><td><\/td><\/tr><tr><td>Income from associate<\/td><td>a<\/td><td>354<\/td><td>270<\/td><\/tr><tr><td>Net income<\/td><td>6,501<\/td><td>5,625<\/td><td><\/td><\/tr><\/table><\/div><p>Balance sheet<\/p><div class=\"tbl\"><table><tr><td>Total assets<\/td><td>b<\/td><td>€56,396<\/td><td>€53,111<\/td><\/tr><tr><td>Investment in associate<\/td><td>5,504<\/td><td>5,193<\/td><td><\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>c<\/td><td>30,371<\/td><td>29,595<\/td><\/tr><tr><td>a<\/td><td> Not included in EBIT or EBT.<\/td><td><\/td><td><\/td><\/tr><tr><td>b<\/td><td> Total assets were €45,597 at the end of 2015.<\/td><td><\/td><td><\/td><\/tr><tr><td>c<\/td><td> Stockholders&#x27; equity was €27,881 at the end of 2015.<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Scott reads the Delicious&#x27;s revenue recognition footnote found in Exhibit 2.<\/p><p><b>Exhibit 2: Revenue Recognition Footnote<\/b><\/p><p>In millions<\/p><p>Revenue is recognized, net of returns and allowances, when the goods are shipped to customers and collectibility is assured. Several customers remit payment before delivery in order to receive additional discounts. Delicious reports these amounts as unearned revenue until the goods are shipped. Unearned revenue was €7,201 at the end of 2017, €2,514 at the end of 2016, and €1,711 at the end of 2015.<\/p><p>Delicious operates two geographic segments: Europe and Mexico. Selected financial information for each segment is found in Exhibit 3.<\/p><p><b>Exhibit 3: Selected Financial Info \/td><td>€0.73<\/td><td><\/td><\/tr><\/table><\/div><p>Delicious financial statements include an investment of €60 million in debt securities, which are reported as fair value through profit or loss securities.<\/p><\/div><\/details><div class=\"qtext\"><p>High quality cash flow is most likely to be characterized by:<\/p><\/div>", "subj": "fsa"}, {"n": 30, "q": "Using the data found in Exhibit 1 and Exhibit 4, Delicious's implied P/E multiple without regard to its U.S. associate is closest to:", "opts": ["14.0.", "14.8.", "15.1."], "ans": "B", "expl": "Delicious's implied value without its U.S. associate is €90,736 [€97,525 Delicious market cap − €6,789 share of associate's market cap ($32,330 × 30% × €0.70 / $ current exchange rate)]. Delicious's net income without associate is €6,147 (€6,501 net income − €354 pro-rata share of income from associate). Implied P/E = 14.8 (€90,736 Delicious implied value without associate / €6,147 Delicious net income without associate). For Further Reference: (Study Session 6, Module 18.6, LOS 18.e)", "explhtml": "<p>Delicious&#x27;s implied value without its U.S. associate is €90,736 [€97,525 Delicious market cap − €6,789 share of associate&#x27;s market cap ($32,330 × 30% × €0.70 / $ current exchange rate)].<\/p><p>Delicious&#x27;s net income without associate is €6,147 (€6,501 net income − €354 pro-rata share of income from associate).<\/p><p>Implied P/E = 14.8 (€90,736 Delicious implied value without associate / €6,147 Delicious net income without associate).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 6, Module 18.6, LOS 18.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Delicious Candy Company (Delicious) is a leading manufacturer and distributor of quality confectionery products throughout Europe and Mexico. Delicious is a publicly traded firm located in Italy and has been in business over 60 years. Delicious complies with International Financial Reporting Standards (IFRS).<\/p><p>Caleb Scott, an equity analyst with a large pension fund, has been asked to complete a comprehensive analysis of Delicious in order to evaluate the possibility of a future investment.<\/p><p>Scott compiles the selected financial data found in Exhibit 1 and learns that Delicious owns a 30% equity interest in a supplier located in the United States. Delicious uses the equity method to account for its investment in the U.S. associate. The associate prepares its financial statements in accordance with U.S. Generally Accepted Accounting Principles (GAAP).<\/p><p><b>Exhibit 1: Selected Financial Data—Delicious Candy Company<\/b><\/p><div class=\"tbl\"><table><tr><td>In millions<\/td><td>2017<\/td><td>2016<\/td><\/tr><\/table><\/div><p>Income Statement<\/p><div class=\"tbl\"><table><tr><td>Revenue<\/td><td>€60,229 €55,137<\/td><td><\/td><td><\/td><\/tr><tr><td>Earnings before interest and tax<\/td><td>7,990<\/td><td>7,077<\/td><td><\/td><\/tr><tr><td>Earnings before tax<\/td><td>7,570<\/td><td>6,779<\/td><td><\/td><\/tr><tr><td>Income from associate<\/td><td>a<\/td><td>354<\/td><td>270<\/td><\/tr><tr><td>Net income<\/td><td>6,501<\/td><td>5,625<\/td><td><\/td><\/tr><\/table><\/div><p>Balance sheet<\/p><div class=\"tbl\"><table><tr><td>Total assets<\/td><td>b<\/td><td>€56,396<\/td><td>€53,111<\/td><\/tr><tr><td>Investment in associate<\/td><td>5,504<\/td><td>5,193<\/td><td><\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>c<\/td><td>30,371<\/td><td>29,595<\/td><\/tr><tr><td>a<\/td><td> Not included in EBIT or EBT.<\/td><td><\/td><td><\/td><\/tr><tr><td>b<\/td><td> Total assets were €45,597 at the end of 2015.<\/td><td><\/td><td><\/td><\/tr><tr><td>c<\/td><td> Stockholders&#x27; equity was €27,881 at the end of 2015.<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Scott reads the Delicious&#x27;s revenue recognition footnote found in Exhibit 2.<\/p><p><b>Exhibit 2: Revenue Recognition Footnote<\/b><\/p><p>In millions<\/p><p>Revenue is recognized, net of returns and allowances, when the goods are shipped to customers and collectibility is assured. Several customers remit payment before delivery in order to receive additional discounts. Delicious reports these amounts as unearned revenue until the goods are shipped. Unearned revenue was €7,201 at the end of 2017, €2,514 at the end of 2016, and €1,711 at the end of 2015.<\/p><p>Delicious operates two geographic segments: Europe and Mexico. Selected financial information for each segment is found in Exhibit 3.<\/p><p><b>Exhibit 3: Selected Financial Information by Segment<\/b><\/p><div class=\"tbl\"><table><tr><td>In millions<\/td><td>EBIT<\/td><td>Revenue Total CapEx Total Assets<\/td><td><\/td><td><\/td><\/tr><tr><td>Europe<\/td><td>€7,203<\/td><td>€50,463<\/td><td>€4,452<\/td><td>€36,642<\/td><\/tr><tr><td>Mexico<\/td><td>€787<\/td><td>€9,766<\/td><td>€8,269<\/td><td>€14,250<\/td><\/tr><\/table><\/div><p>Scott wants to determine whether the cash flow is of high quality.<\/p><p>Scott gathers the information in Exhibit 4 to determine the implied &quot;stand-alone&quot; value of Delicious without regard to the value of its U.S. associate.<\/p><p><b>Exhibit 4: Selected 2017 Market Capitalization Data<\/b><\/p><p>In millions except exchange rates Delicious Associate<\/p><div class=\"tbl\"><table><tr><td>Market capitalization<\/td><td>€97,525<\/td><td>$32,330<\/td><\/tr><tr><td>Current exchange rate (€ per $)<\/td><td>€0.70<\/td><td><\/td><\/tr><tr><td>Average exchange rate (€ per $)<\/td><td>€0.73<\/td><td><\/td><\/tr><\/table><\/div><p>Delicious financial statements include an investment of €60 million in debt securities, which are reported as fair value through profit or loss securities.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data found in Exhibit 1 and Exhibit 4, Delicious&#x27;s implied P/E multiple without regard to its U.S. associate is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 31, "q": "Based on Exhibit 1, which stock is the most undervalued by applying the justified price-to-book value method?", "opts": ["Able Corporation.", "Baker, Inc.", "Charles Company."], "ans": "B", "expl": "The justified price-to-book value (P/B) ratio is calculated as: P/B = (ROE − g) / (r − g) where: growth rate: g = ROE × (1 − payout) Able: g = 0.25 × (1 − 1.00 / 2.50) = 0.15 Baker: g = 0.15 × (1 − 1.60 / 4.80) = 0.10 Charles: g = 0.08 × (1 − 2.50 / 4.00) = 0.03 Justified price-to-book value (P/B): Able: P/B = (0.25 − 0.15) / (0.20 − 0.15) = 2, implying price = 2 × 10 = $20 Baker: P/B = (0.15 − 0.10) / (0.12 − 0.10) = 2.5, implying price = 2.5 × 32 = $80 Charles: P/B = (0.08 − 0.03) / (0.10 − 0.03) = 0.71, implying price = 0.71 × 50 = $35.5 Able sells for $60, triple its value; Baker sells for $70, 12% below its value; and Charles sells for $35.5, right at its value. For Further Reference: (Study Session 11, Module 29.4, LOS 29.h, 29.j)", "explhtml": "<p>The justified price-to-book value (P/B) ratio is calculated as:<\/p><p>P/B = (ROE − g) / (r − g)<\/p><p>where:<\/p><p>growth rate: g = ROE × (1 − payout)<\/p><p>Able: g = 0.25 × (1 − 1.00 / 2.50) = 0.15<\/p><p>Baker: g = 0.15 × (1 − 1.60 / 4.80) = 0.10<\/p><p>Charles: g = 0.08 × (1 − 2.50 / 4.00) = 0.03<\/p><p>Justified price-to-book value (P/B):<\/p><p>Able: P/B = (0.25 − 0.15) / (0.20 − 0.15) = 2, implying price = 2 × 10 = $20<\/p><p>Baker: P/B = (0.15 − 0.10) / (0.12 − 0.10) = 2.5, implying price = 2.5 × 32 = $80<\/p><p>Charles: P/B = (0.08 − 0.03) / (0.10 − 0.03) = 0.71, implying price = 0.71 × 50 = $35.5<\/p><p>Able sells for $60, triple its value; Baker sells for $70, 12% below its value; and Charles sells for $35.5, right at its value.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 29.4, LOS 29.h, 29.j)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<\/summary><div class=\"vig-body\"><p>George Armor, CFA, is a new stock analyst for Pedad Investments. One tool that Pedad uses to compare stock valuations is the dividend discount model (DDM). In particular, the firm evaluates stocks in terms of &quot;justified&quot; multiples of sales and book value. These multiples are based on algebraic manipulation of the DDM. Over time, these multiples seem to provide a good check on the market valuation of a stock relative to the company&#x27;s fundamentals. Any stock that is currently priced below its value based on a justified multiple of sales or book value is considered attractive for purchase by Pedad portfolio managers. Exhibit 1 contains financial information from the year just ended for three stable companies in the meatpacking industry: Able Corporation, Baker, Inc., and Charles Company, from which Armor will derive his valuation estimates.<\/p><p><b>Exhibit 1: Selected Financial Information<\/b><\/p><p>Able Corporation Baker, Inc. Charles Company<\/p><div class=\"tbl\"><table><tr><td>Revenue/share<\/td><td>$115.00<\/td><td>$52.80<\/td><td>$25.75<\/td><\/tr><tr><td>EPS<\/td><td>$2.50<\/td><td>$4.80<\/td><td>$4.00<\/td><\/tr><tr><td>DPS<\/td><td>$1.00<\/td><td>$1.60<\/td><td>$2.50<\/td><\/tr><tr><td>ROE<\/td><td>25%<\/td><td>15%<\/td><td>8%<\/td><\/tr><tr><td>Book value per share<\/td><td>$10.00<\/td><td>$32.00<\/td><td>$50.00<\/td><\/tr><tr><td>Stock price per share (current)<\/td><td>$60.00<\/td><td>$70.00<\/td><td>$35.50<\/td><\/tr><tr><td>Required return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><p>One of Pedad&#x27;s other equity analysts, Marie Swift, CFA, recently held a meeting with Armor to discuss a relatively new model the firm is implementing to determine the P/E ratios of companies that Pedad researches. Swift explains that the model utilizes a cross-sectional regression using the previous year-end data of a group of comparable companies&#x27; P/E ratios against their dividend payout ratios (payout ratio), sustainable growth rates (g), and returns on equity (ROE). The resulting regression equation is used to determine a predicted P/E ratio for the subject company using the subject company&#x27;s most recent year-end data. Swift has developed the following model, which has an R-squared of 81%, for the meatpacking industry (16 companies):<\/p><p>predicted P/E = 2.74 + 8.21(payout ratio) + 14.21(g) + 2.81(ROE)<\/p><div class=\"tbl\"><table><tr><td>(STD error)<\/td><td>(2.11)<\/td><td>(6.52)<\/td><td>(9.24)<\/td><td>(2.10)<\/td><\/tr><\/table><\/div><p>After Swift presents the model to Armor, she points out that models of this nature are subject to limitations. In particular, multicollinearity, which appears to be present in the meatpacking industry model, can create great difficulty in interpreting the effects of the individual coefficients of the model. Swift continues by stating that in spite of this limitation, models of this nature generally have known and significant predictive power across different periods, although not across different stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which stock is the most undervalued by applying the justified price-to-book value method?<\/p><\/div>", "subj": "equity"}, {"n": 32, "q": "Based on Exhibit 1, the justified price-to-sales ratio of Baker, Inc., is closest to:", "opts": ["1.5.", "1.7.", "1.9."], "ans": "B", "expl": "The justified price-to-sales (P/S) ratio is calculated as: P/S = [profit margin × payout ratio × (1 + g)] / (r − g) Baker: P/S = [(4.80 / 52.80) × (1.60 / 4.80) × (1 + 0.10)] / (0.12 − 0.10) = 1.67 For Further Reference: (Study Session 11, Module 29.4, LOS 29.h)", "explhtml": "<p>The justified price-to-sales (P/S) ratio is calculated as:<\/p><p>P/S = [profit margin × payout ratio × (1 + g)] / (r − g)<\/p><p>Baker: P/S = [(4.80 / 52.80) × (1.60 / 4.80) × (1 + 0.10)] / (0.12 − 0.10) = 1.67<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 29.4, LOS 29.h)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Armor, CFA, is a new stock analyst for Pedad Investments. One tool that Pedad uses to compare stock valuations is the dividend discount model (DDM). In particular, the firm evaluates stocks in terms of &quot;justified&quot; multiples of sales and book value. These multiples are based on algebraic manipulation of the DDM. Over time, these multiples seem to provide a good check on the market valuation of a stock relative to the company&#x27;s fundamentals. Any stock that is currently priced below its value based on a justified multiple of sales or book value is considered attractive for purchase by Pedad portfolio managers. Exhibit 1 contains financial information from the year just ended for three stable companies in the meatpacking industry: Able Corporation, Baker, Inc., and Charles Company, from which Armor will derive his valuation estimates.<\/p><p><b>Exhibit 1: Selected Financial Information<\/b><\/p><p>Able Corporation Baker, Inc. Charles Company<\/p><div class=\"tbl\"><table><tr><td>Revenue/share<\/td><td>$115.00<\/td><td>$52.80<\/td><td>$25.75<\/td><\/tr><tr><td>EPS<\/td><td>$2.50<\/td><td>$4.80<\/td><td>$4.00<\/td><\/tr><tr><td>DPS<\/td><td>$1.00<\/td><td>$1.60<\/td><td>$2.50<\/td><\/tr><tr><td>ROE<\/td><td>25%<\/td><td>15%<\/td><td>8%<\/td><\/tr><tr><td>Book value per share<\/td><td>$10.00<\/td><td>$32.00<\/td><td>$50.00<\/td><\/tr><tr><td>Stock price per share (current)<\/td><td>$60.00<\/td><td>$70.00<\/td><td>$35.50<\/td><\/tr><tr><td>Required return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><p>One of Pedad&#x27;s other equity analysts, Marie Swift, CFA, recently held a meeting with Armor to discuss a relatively new model the firm is implementing to determine the P/E ratios of companies that Pedad researches. Swift explains that the model utilizes a cross-sectional regression using the previous year-end data of a group of comparable companies&#x27; P/E ratios against their dividend payout ratios (payout ratio), sustainable growth rates (g), and returns on equity (ROE). The resulting regression equation is used to determine a predicted P/E ratio for the subject company using the subject company&#x27;s most recent year-end data. Swift has developed the following model, which has an R-squared of 81%, for the meatpacking industry (16 companies):<\/p><p>predicted P/E = 2.74 + 8.21(payout ratio) + 14.21(g) + 2.81(ROE)<\/p><div class=\"tbl\"><table><tr><td>(STD error)<\/td><td>(2.11)<\/td><td>(6.52)<\/td><td>(9.24)<\/td><td>(2.10)<\/td><\/tr><\/table><\/div><p>After Swift presents the model to Armor, she points out that models of this nature are subject to limitations. In particular, multicollinearity, which appears to be present in the meatpacking industry model, can create great difficulty in interpreting the effects of the individual coefficients of the model. Swift continues by stating that in spite of this limitation, models of this nature generally have known and significant predictive power across different periods, although not across different stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the justified price-to-sales ratio of Baker, Inc., is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 33, "q": "If valuation is based on the justified price-to-sales ratio, Armor should conclude that Able Corporation is:", "opts": ["overvalued; the stock trades at more than double its value based on a justified price-to-sales ratio.", "overvalued relative to Baker, but undervalued relative to Charles.", "undervalued; the stock trades at less than half its value based on a justified price- to-sales ratio."], "ans": "A", "expl": "Able Corporation should sell for [(2.50 / 115) × (1.00 / 2.50) × (1 + 0.15)] / (0.20 − 0.15) = 0.20 × sales, or $23/share. The current market price of $60 is 161% overvalued. Baker trades for $70 versus a value of 1.67 × 52.8 = $88, a discount of 20%. Charles trades for $35.50 versus a value of 1.43 × 25.75 = 37, a negligible discount of 4%. For Further Reference: (Study Session 11, Module 29.4, LOS 29.i)", "explhtml": "<p>Able Corporation should sell for [(2.50 / 115) × (1.00 / 2.50) × (1 + 0.15)] / (0.20 − 0.15) = 0.20 × sales, or $23/share. The current market price of $60 is 161% overvalued. Baker trades for $70 versus a value of 1.67 × 52.8 = $88, a discount of 20%. Charles trades for $35.50 versus a value of 1.43 × 25.75 = 37, a negligible discount of 4%.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 29.4, LOS 29.i)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Armor, CFA, is a new stock analyst for Pedad Investments. One tool that Pedad uses to compare stock valuations is the dividend discount model (DDM). In particular, the firm evaluates stocks in terms of &quot;justified&quot; multiples of sales and book value. These multiples are based on algebraic manipulation of the DDM. Over time, these multiples seem to provide a good check on the market valuation of a stock relative to the company&#x27;s fundamentals. Any stock that is currently priced below its value based on a justified multiple of sales or book value is considered attractive for purchase by Pedad portfolio managers. Exhibit 1 contains financial information from the year just ended for three stable companies in the meatpacking industry: Able Corporation, Baker, Inc., and Charles Company, from which Armor will derive his valuation estimates.<\/p><p><b>Exhibit 1: Selected Financial Information<\/b><\/p><p>Able Corporation Baker, Inc. Charles Company<\/p><div class=\"tbl\"><table><tr><td>Revenue/share<\/td><td>$115.00<\/td><td>$52.80<\/td><td>$25.75<\/td><\/tr><tr><td>EPS<\/td><td>$2.50<\/td><td>$4.80<\/td><td>$4.00<\/td><\/tr><tr><td>DPS<\/td><td>$1.00<\/td><td>$1.60<\/td><td>$2.50<\/td><\/tr><tr><td>ROE<\/td><td>25%<\/td><td>15%<\/td><td>8%<\/td><\/tr><tr><td>Book value per share<\/td><td>$10.00<\/td><td>$32.00<\/td><td>$50.00<\/td><\/tr><tr><td>Stock price per share (current)<\/td><td>$60.00<\/td><td>$70.00<\/td><td>$35.50<\/td><\/tr><tr><td>Required return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><p>One of Pedad&#x27;s other equity analysts, Marie Swift, CFA, recently held a meeting with Armor to discuss a relatively new model the firm is implementing to determine the P/E ratios of companies that Pedad researches. Swift explains that the model utilizes a cross-sectional regression using the previous year-end data of a group of comparable companies&#x27; P/E ratios against their dividend payout ratios (payout ratio), sustainable growth rates (g), and returns on equity (ROE). The resulting regression equation is used to determine a predicted P/E ratio for the subject company using the subject company&#x27;s most recent year-end data. Swift has developed the following model, which has an R-squared of 81%, for the meatpacking industry (16 companies):<\/p><p>predicted P/E = 2.74 + 8.21(payout ratio) + 14.21(g) + 2.81(ROE)<\/p><div class=\"tbl\"><table><tr><td>(STD error)<\/td><td>(2.11)<\/td><td>(6.52)<\/td><td>(9.24)<\/td><td>(2.10)<\/td><\/tr><\/table><\/div><p>After Swift presents the model to Armor, she points out that models of this nature are subject to limitations. In particular, multicollinearity, which appears to be present in the meatpacking industry model, can create great difficulty in interpreting the effects of the individual coefficients of the model. Swift continues by stating that in spite of this limitation, models of this nature generally have known and significant predictive power across different periods, although not across different stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>If valuation is based on the justified price-to-sales ratio, Armor should conclude that Able Corporation is:<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "Armor has been asked to identify the relative valuation merits of the three stocks. Which of the following statements is correct?", "opts": ["Able Corporation is the best investment because it has the highest ROE.", "Charles Company is the best investment because the stock is priced below book value.", "Able Corporation’s earnings should grow the fastest due to its high ROE and retention ratio."], "ans": "C", "expl": "A high ROE does not make a company a good investment, nor does a high book value. However, Able Corporation does have the highest potential growth rate. Because the justified values for Charles Company are near the market price, there does not appear to be any problem with the valuation inputs (e.g., required return). The similarity between the justified P/B value and the market price of Charles indicates that it is fairly priced and not an especially attractive investment. For Further Reference: (Study Session 11, Module 29.2, LOS 29.i)", "explhtml": "<p>A high ROE does not make a company a good investment, nor does a high book value. However, Able Corporation does have the highest potential growth rate. Because the justified values for Charles Company are near the market price, there does not appear to be any problem with the valuation inputs (e.g., required return). The similarity between the justified P/B value and the market price of Charles indicates that it is fairly priced and not an especially attractive investment.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 29.2, LOS 29.i)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Armor, CFA,
