<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n": 1, "q": "Did Sampson and/or Lawson violate the CFA Institute Standards of Professional Conduct with respect to presenting the TIM biographies to the client?", "opts": ["Yes, both Sampson and Lawson violated the Standards.", "Yes, Sampson violated the Standards, while Lawson did not.", "Neither Sampson nor Lawson violated the Standards, because such outsourcing is permitted."], "ans": "A", "expl": "Standard I(C). Both Sampson and Lawson have violated Standard I(C) – Professionalism – Misrepresentation. When Sampson prepared biographies with Shadow Mountain Wealth Management Team included in them, she was obviously trying to convey the image that TIM personnel are employees of the bank trust department. This does not portray the correct business relationship between Shadow Mountain and TIM. TIM is an outsourcer to Shadow Mountain and a contract investment management provider, not an employee. Sampson is attempting to create a misleading view of the service level and investment expertise that clients could rightly expect. While Lawson was not a party to preparing such misleading business cards and marketing materials, he participated in the misrepresentation by agreeing to go ahead with the client presentation. For Further Reference: (Study Session 1, Module 2.2, LOS 2.a)", "explhtml": "<p>Standard I(C). Both Sampson and Lawson have violated Standard I(C) – Professionalism – Misrepresentation. When Sampson prepared biographies with Shadow Mountain Wealth Management Team included in them, she was obviously trying to convey the image that TIM personnel are employees of the bank trust department. This does not portray the correct business relationship between Shadow Mountain and TIM. TIM is an outsourcer to Shadow Mountain and a contract investment management provider, not an employee. Sampson is attempting to create a misleading view of the service level and investment expertise that clients could rightly expect. While Lawson was not a party to preparing such misleading business cards and marketing materials, he participated in the misrepresentation by agreeing to go ahead with the client presentation.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.2, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<\/summary><div class=\"vig-body\"><p>For the past 15 years, Susan Luna, CFA, Kyle Lawson, CFA, and Matt Miller, CFA, have worked together as equity analysts and then equity portfolio managers in the investment management division (BIMCO) of Broadway Life Insurance Company. For the past five years, the three associates have worked together managing the BIMCO Aggressive Growth Fund (BAGF). During their management tenure, the BAGF had excellent performance and was well recognized in the financial press.<\/p><p>Just over one year ago, Broadway Life was acquired by a larger company, Gobble Insurance, and as part of the consolidation process, BIMCO was closed. The closure allowed Luna, Lawson, and Miller to start their own investment management firm, Trio Investment Management LLC (TIM). TIM focuses on the small capitalization growth equities area. This is the same investment focus as the BAGF, but TIM will have individually managed accounts. Several cases have arisen calling for interpretation as to consistency with CFA Institute Standards of Professional Conduct.<\/p><p><b>Case 1<\/b><\/p><p>TIM markets its investment management services by contracting with small, local bank trust departments. One of the newest bank trust clients for TIM is Shadow Mountain Bank and Trust. Judy Sampson, CFA, the trust officer for Shadow Mountain, has scheduled a meeting with a potential client. When Lawson arrives for the client meeting, he finds that all the TIM marketing material, including biographies of TIM portfolio managers, has been relabeled by Sampson as the Shadow Mountain Wealth Management Team. Sampson has also added the performance of BAGF into the current TIM Equity Composite Index portfolio and relabeled the resultant combined graph, the Shadow Mountain Equity Composite Index. Sampson states that making such changes would probably please clients and improve the chances of acquiring additional trust management accounts for Shadow Mountain and TIM. Lawson goes along and makes the presentation to the potential client using the Shadow Mountain marketing material and the relabeled BAGF/TIM equity performance record.<\/p><p><b>Case 2<\/b><\/p><p>Susan Luna of TIM is meeting with Sol Wurtzel, an institutional salesman for Turn Byer, a large national brokerage firm. Luna complains that TIM&#x27;s technology costs are too high, especially their outside software services costs. TIM currently subscribes to two investment-related software services. The first software vendor is StockCal Software Services (StockCal), which provides valuation and stock-charting capabilities that TIM uses in its equity research and selection process. The other vendor is Add-Invest Software (Add-Invest), a software program providing account management and performance evaluation reporting, which TIM uses in developing monthly reports for all clients. In response to Luna, Wurtzel suggests that Turn Byer has an excellent soft dollar trading desk and would be willing to offer to cover TIM&#x27;s StockCal and Add-Invest expenses through soft dollar commissions. Luna then reviews TIM&#x27;s projected commission dollars for the year and decides there are more than enough soft dollars to pay the StockCal, AGF, and Add-Invest Software bills combined. Luna believes she can be assured of excellent trade execution from Turn Byer and improved profitability for TIM because of the increased use of soft dollars. Luna then directs that the StockCal and Add-Invest software services be paid for with soft dollar or client brokerage dollars.<\/p><p><b>Case 3<\/b><\/p><p>Sol Wurtzel, the equity salesman for Turn Byer, has referred several clients to TIM over the past year. In fact, Wurtzel referrals currently account for almost 20% of the assets managed by TIM. The principals of TIM decide to reward Wurtzel, either by doubling the commissions paid on trades executed through Turn Byer on Wurtzel&#x27;s referral accounts, or by paying Wurtzel a cash referral fee for each additional TIM account opened by a Wurtzel referral. The principals agree that any cash referral fee would need to be disclosed to clients in advance.<\/p><p><b>Case 4<\/b><\/p><p>Luna notes that her clients have become increasingly aware of the directed client brokerage/soft dollar commissions issue. At a recent meeting with one of her large pension clients, Service Workers Union Local No. 1418, the subject of directed commissions came up. Upon learning of the commission dollars available to their account, the Union trustees directed Luna to use their client brokerage of approximately $25,000 to donate to a think tank called the Hoover Study Center of Unions at Samford University. Service Workers trustees believe the Hoover study will increase the public awareness of the benefits unions offer to their members and increase union membership. Luna concurs with the trustee&#x27;s judgment on increasing union enrollment as a great goal, and follows the client&#x27;s instructions and makes the $25,000 contribution to the Hoover Study Center. Another client, Rosa Lutz, has asked Luna to credit the soft dollar client brokerage proceeds from her personal retirement accounts to Roswell Academy, to update their computer lab. Luna agrees that a new computer lab for Roswell Academy is greatly needed, and she allocates $10,000 of Lutz&#x27;s commission dollars to Roswell Academy.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Sampson and/or Lawson violate the CFA Institute Standards of Professional Conduct with respect to presenting the TIM biographies to the client?<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "Sampson's use of the relabeled BAGF investment performance record violates CFA Institute Standards:", "opts": ["only if Sampson fails to include written disclosures as to the true source and nature of the performance record.", "only if Sampson does not have written permission from Gobble Insurance to use the performance data.", "unless Sampson includes written disclosures as to the true source and nature of the performance record and has written permission from Gobble Insurance to use the performance data."], "ans": "A", "expl": "Standards I(C) and III(D). Including the BAGF performance is a violation of Standard I(C) – Professionalism – Misrepresentation and Standard III(D) – Duties to Clients – Performance Presentation. When Sampson combines the BAGF performance record with the TIM Composite Equity Composite, this gives potential clients a misleading impression of TIM's long-term equity management performance. The use of this performance data might be acceptable if full disclosure were made as to the source and nature of the data. For Further Reference: (Study Session 1, Module 2.6, LOS 2.a)", "explhtml": "<p>Standards I(C) and III(D). Including the BAGF performance is a violation of Standard I(C) – Professionalism – Misrepresentation and Standard III(D) – Duties to Clients – Performance Presentation. When Sampson combines the BAGF performance record with the TIM Composite Equity Composite, this gives potential clients a misleading impression of TIM&#x27;s long-term equity management performance. The use of this performance data might be acceptable if full disclosure were made as to the source and nature of the data.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.6, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>For the past 15 years, Susan Luna, CFA, Kyle Lawson, CFA, and Matt Miller, CFA, have worked together as equity analysts and then equity portfolio managers in the investment management division (BIMCO) of Broadway Life Insurance Company. For the past five years, the three associates have worked together managing the BIMCO Aggressive Growth Fund (BAGF). During their management tenure, the BAGF had excellent performance and was well recognized in the financial press.<\/p><p>Just over one year ago, Broadway Life was acquired by a larger company, Gobble Insurance, and as part of the consolidation process, BIMCO was closed. The closure allowed Luna, Lawson, and Miller to start their own investment management firm, Trio Investment Management LLC (TIM). TIM focuses on the small capitalization growth equities area. This is the same investment focus as the BAGF, but TIM will have individually managed accounts. Several cases have arisen calling for interpretation as to consistency with CFA Institute Standards of Professional Conduct.<\/p><p><b>Case 1<\/b><\/p><p>TIM markets its investment management services by contracting with small, local bank trust departments. One of the newest bank trust clients for TIM is Shadow Mountain Bank and Trust. Judy Sampson, CFA, the trust officer for Shadow Mountain, has scheduled a meeting with a potential client. When Lawson arrives for the client meeting, he finds that all the TIM marketing material, including biographies of TIM portfolio managers, has been relabeled by Sampson as the Shadow Mountain Wealth Management Team. Sampson has also added the performance of BAGF into the current TIM Equity Composite Index portfolio and relabeled the resultant combined graph, the Shadow Mountain Equity Composite Index. Sampson states that making such changes would probably please clients and improve the chances of acquiring additional trust management accounts for Shadow Mountain and TIM. Lawson goes along and makes the presentation to the potential client using the Shadow Mountain marketing material and the relabeled BAGF/TIM equity performance record.<\/p><p><b>Case 2<\/b><\/p><p>Susan Luna of TIM is meeting with Sol Wurtzel, an institutional salesman for Turn Byer, a large national brokerage firm. Luna complains that TIM&#x27;s technology costs are too high, especially their outside software services costs. TIM currently subscribes to two investment-related software services. The first software vendor is StockCal Software Services (StockCal), which provides valuation and stock-charting capabilities that TIM uses in its equity research and selection process. The other vendor is Add-Invest Software (Add-Invest), a software program providing account management and performance evaluation reporting, which TIM uses in developing monthly reports for all clients. In response to Luna, Wurtzel suggests that Turn Byer has an excellent soft dollar trading desk and would be willing to offer to cover TIM&#x27;s StockCal and Add-Invest expenses through soft dollar commissions. Luna then reviews TIM&#x27;s projected commission dollars for the year and decides there are more than enough soft dollars to pay the StockCal, AGF, and Add-Invest Software bills combined. Luna believes she can be assured of excellent trade execution from Turn Byer and improved profitability for TIM because of the increased use of soft dollars. Luna then directs that the StockCal and Add-Invest software services be paid for with soft dollar or client brokerage dollars.<\/p><p><b>Case 3<\/b><\/p><p>Sol Wurtzel, the equity salesman for Turn Byer, has referred several clients to TIM over the past year. In fact, Wurtzel referrals currently account for almost 20% of the assets managed by TIM. The principals of TIM decide to reward Wurtzel, either by doubling the commissions paid on trades executed through Turn Byer on Wurtzel&#x27;s referral accounts, or by paying Wurtzel a cash referral fee for each additional TIM account opened by a Wurtzel referral. The principals agree that any cash referral fee would need to be disclosed to clients in advance.<\/p><p><b>Case 4<\/b><\/p><p>Luna notes that her clients have become increasingly aware of the directed client brokerage/soft dollar commissions issue. At a recent meeting with one of her large pension clients, Service Workers Union Local No. 1418, the subject of directed commissions came up. Upon learning of the commission dollars available to their account, the Union trustees directed Luna to use their client brokerage of approximately $25,000 to donate to a think tank called the Hoover Study Center of Unions at Samford University. Service Workers trustees believe the Hoover study will increase the public awareness of the benefits unions offer to their members and increase union membership. Luna concurs with the trustee&#x27;s judgment on increasing union enrollment as a great goal, and follows the client&#x27;s instructions and makes the $25,000 contribution to the Hoover Study Center. Another client, Rosa Lutz, has asked Luna to credit the soft dollar client brokerage proceeds from her personal retirement accounts to Roswell Academy, to update their computer lab. Luna agrees that a new computer lab for Roswell Academy is greatly needed, and she allocates $10,000 of Lutz&#x27;s commission dollars to Roswell Academy.<\/p><\/div><\/details><div class=\"qtext\"><p>Sampson&#x27;s use of the relabeled BAGF investment performance record violates CFA Institute Standards:<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "Did Luna violate the CFA Institute Standards of Professional Conduct by using soft dollar commissions to pay TIM's software subscription costs to StockCal and/or Add-Invest?", "opts": ["Both StockCal and Add-Invest software services may be paid for with soft dollars.", "Neither StockCal nor Add-Invest software may be paid for with soft dollars.", "It is acceptable to use soft dollars to pay for the StockCal software but not the Add-Invest software."], "ans": "C", "expl": "Standard III(A). Luna has violated the CFA Institute Standards of Professional Conduct – Standard III(A) Duties to Clients – Loyalty, Prudence, and Care. Client brokerage is the property or asset of the client and not TIM. Client brokerage should be used only for research products or services that are directly related to the investment decision-making process and not the management costs of the firm. In this case, Luna should disclose to TIM's clients that their brokerage may be used to purchase research. In addition, Luna should seek to ensure that Turn Byer is providing the best execution for TIM's clients. StockCal is clearly providing equity research products/services that aid TIM in the investment decision-making process and not the general operation or management costs of the firm. StockCal may therefore be properly paid for with client brokerage soft dollars, and this is not a violation of the Standards or Code. However, Add-Invest Software provides TIM's clients with portfolio accounting and performance measurement services and is not related to the investment decision-making process. Therefore, Luna is misusing client resources when she uses client brokerage to purchase Add- Invest Software. Add-Invest is clearly a business expense of TIM and should rightly be paid for by the firm and not the clients. The product or service received must provide proper assistance to the investment manager in following through with his investment decision-making responsibilities. For Further Reference: (Study Session 1, Module 2.4, LOS 2.a)", "explhtml": "<p>Standard III(A). Luna has violated the CFA Institute Standards of Professional Conduct – Standard III(A) Duties to Clients – Loyalty, Prudence, and Care. Client brokerage is the property or asset of the client and not TIM. Client brokerage should be used only for research products or services that are directly related to the investment decision-making process and not the management costs of the firm. In this case, Luna should disclose to TIM&#x27;s clients that their brokerage may be used to purchase research. In addition, Luna should seek to ensure that Turn Byer is providing the best execution for TIM&#x27;s clients. StockCal is clearly providing equity research products/services that aid TIM in the investment decision-making process and not the general operation or management costs of the firm. StockCal may therefore be properly paid for with client brokerage soft dollars, and this is not a violation of the Standards or Code. However, Add-Invest Software provides TIM&#x27;s clients with portfolio accounting and performance measurement services and is not related to the investment decision-making process. Therefore, Luna is misusing client resources when she uses client brokerage to purchase Add- Invest Software. Add-Invest is clearly a business expense of TIM and should rightly be paid for by the firm and not the clients. The product or service received must provide proper assistance to the investment manager in following through with his investment decision-making responsibilities.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.4, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>For the past 15 years, Susan Luna, CFA, Kyle Lawson, CFA, and Matt Miller, CFA, have worked together as equity analysts and then equity portfolio managers in the investment management division (BIMCO) of Broadway Life Insurance Company. For the past five years, the three associates have worked together managing the BIMCO Aggressive Growth Fund (BAGF). During their management tenure, the BAGF had excellent performance and was well recognized in the financial press.<\/p><p>Just over one year ago, Broadway Life was acquired by a larger company, Gobble Insurance, and as part of the consolidation process, BIMCO was closed. The closure allowed Luna, Lawson, and Miller to start their own investment management firm, Trio t and performance evaluation reporting, which TIM uses in developing monthly reports for all clients. In response to Luna, Wurtzel suggests that Turn Byer has an excellent soft dollar trading desk and would be willing to offer to cover TIM&#x27;s StockCal and Add-Invest expenses through soft dollar commissions. Luna then reviews TIM&#x27;s projected commission dollars for the year and decides there are more than enough soft dollars to pay the StockCal, AGF, and Add-Invest Software bills combined. Luna believes she can be assured of excellent trade execution from Turn Byer and improved profitability for TIM because of the increased use of soft dollars. Luna then directs that the StockCal and Add-Invest software services be paid for with soft dollar or client brokerage dollars.<\/p><p><b>Case 3<\/b><\/p><p>Sol Wurtzel, the equity salesman for Turn Byer, has referred several clients to TIM over the past year. In fact, Wurtzel referrals currently account for almost 20% of the assets managed by TIM. The principals of TIM decide to reward Wurtzel, either by doubling the commissions paid on trades executed through Turn Byer on Wurtzel&#x27;s referral accounts, or by paying Wurtzel a cash referral fee for each additional TIM account opened by a Wurtzel referral. The principals agree that any cash referral fee would need to be disclosed to clients in advance.<\/p><p><b>Case 4<\/b><\/p><p>Luna notes that her clients have become increasingly aware of the directed client brokerage/soft dollar commissions issue. At a recent meeting with one of her large pension clients, Service Workers Union Local No. 1418, the subject of directed commissions came up. Upon learning of the commission dollars available to their account, the Union trustees directed Luna to use their client brokerage of approximately $25,000 to donate to a think tank called the Hoover Study Center of Unions at Samford University. Service Workers trustees believe the Hoover study will increase the public awareness of the benefits unions offer to their members and increase union membership. Luna concurs with the trustee&#x27;s judgment on increasing union enrollment as a great goal, and follows the client&#x27;s instructions and makes the $25,000 contribution to the Hoover Study Center. Another client, Rosa Lutz, has asked Luna to credit the soft dollar client brokerage proceeds from her personal retirement accounts to Roswell Academy, to update their computer lab. Luna agrees that a new computer lab for Roswell Academy is greatly needed, and she allocates $10,000 of Lutz&#x27;s commission dollars to Roswell Academy.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Luna violate the CFA Institute Standards of Professional Conduct by using soft dollar commissions to pay TIM&#x27;s software subscription costs to StockCal and/or Add-Invest?<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "Would either compensation arrangement to reward Wurtzel for client referrals violate the CFA Institute Standards of Professional Conduct?", "opts": ["Both compensation arrangements would be violations, regardless of any disclosures to clients.", "The increased commissions plan would be a violation, while the cash referral fees would not be a violation.", "Both compensation arrangements are allowed, as long as they are fully disclosed, in advance, to all clients and prospective clients."], "ans": "B", "expl": "Standard III(A). The increased commission would be a violation, but the cash referral fee would not. Doubling the commission paid to Wurtzel would be a violation of Standard III(A) Duties to Clients – Loyalty, Prudence, and Care. Client brokerage is strictly an asset of the client and must be used for the benefit of clients in research that will assist the investment manager in the investment decision-making process. Client brokerage cannot be used as a reward for bringing clients to TIM and to do so is a misappropriation of client assets. Cash referral fees are acceptable, so long as the referral arrangement is fully disclosed to the clients in advance of opening their accounts. The case mentions that this disclosure will be made. This disclosure allows the client to evaluate any potential conflict(s) of interest in the referral process. For Further Reference: (Study Session 1, Module 2.4, LOS 2.a)", "explhtml": "<p>Standard III(A). The increased commission would be a violation, but the cash referral fee would not. Doubling the commission paid to Wurtzel would be a violation of Standard III(A) Duties to Clients – Loyalty, Prudence, and Care. Client brokerage is strictly an asset of the client and must be used for the benefit of clients in research that will assist the investment manager in the investment decision-making process. Client brokerage cannot be used as a reward for bringing clients to TIM and to do so is a misappropriation of client assets. Cash referral fees are acceptable, so long as the referral arrangement is fully disclosed to the clients in advance of opening their accounts. The case mentions that this disclosure will be made. This disclosure allows the client to evaluate any potential conflict(s) of interest in the referral process.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.4, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>For the past 15 years, Susan Luna, CFA, Kyle Lawson, CFA, and Matt Miller, CFA, have worked together as equity analysts and then equity portfolio managers in the investment management division (BIMCO) of Broadway Life Insurance Company. For the past five years, the three associates have worked together managing the BIMCO Aggressive Growth Fund (BAGF). During their management tenure, the BAGF had excellent performance and was well recognized in the financial press.<\/p><p>Just over one year ago, Broadway Life was acquired by a larger company, Gobble Insurance, and as part of the consolidation process, BIMCO was closed. The closure allowed Luna, Lawson, and Miller to start their own investment management firm, Trio Investment Management LLC (TIM). TIM focuses on the small capitalization growth equities area. This is the same investment focus as the BAGF, but TIM will have individually managed accounts. Several cases have arisen calling for interpretation as to consistency with CFA Institute Standards of Professional Conduct.<\/p><p><b>Case 1<\/b><\/p><p>TIM markets its investment management services by contracting with small, local bank trust departments. One of the newest bank trust clients for TIM is Shadow Mountain Bank and Trust. Judy Sampson, CFA, the trust officer for Shadow Mountain, has scheduled a meeting with a potential client. When Lawson arrives for the client meeting, he finds that all the TIM marketing material, including biographies of TIM portfolio managers, has been relabeled by Sampson as the Shadow Mountain Wealth Management Team. Sampson has also added the performance of BAGF into the current TIM Equity Composite Index portfolio and relabeled the resultant combined graph, the Shadow Mountain Equity Composite Index. Sampson states that making such changes would probably please clients and improve the chances of acquiring additional trust management accounts for Shadow Mountain and TIM. Lawson goes along and makes the presentation to the potential client using the Shadow Mountain marketing material and the relabeled BAGF/TIM equity performance record.<\/p><p><b>Case 2<\/b><\/p><p>Susan Luna of TIM is meeting with Sol Wurtzel, an institutional salesman for Turn Byer, a large national brokerage firm. Luna complains that TIM&#x27;s technology costs are too high, especially their outside software services costs. TIM currently subscribes to two investment-related software services. The first software vendor is StockCal Software Services (StockCal), which provides valuation and stock-charting capabilities that TIM uses in its equity research and selection process. The other vendor is Add-Invest Software (Add-Invest), a software program providing account management and performance evaluation reporting, which TIM uses in developing monthly reports for all clients. In response to Luna, Wurtzel suggests that Turn Byer has an excellent soft dollar trading desk and would be willing to offer to cover TIM&#x27;s StockCal and Add-Invest expenses through soft dollar commissions. Luna then reviews TIM&#x27;s projected commission dollars for the year and decides there are more than enough soft dollars to pay the StockCal, AGF, and Add-Invest Software bills combined. Luna believes she can be assured of excellent trade execution from Turn Byer and improved profitability for TIM because of the increased use of soft dollars. Luna then directs that the StockCal and Add-Invest software services be paid for with soft dollar or client brokerage dollars.<\/p><p><b>Case 3<\/b><\/p><p>Sol Wurtzel, the equity salesman for Turn Byer, has referred several clients to TIM over the past year. In fact, Wurtzel referrals currently account for almost 20% of the assets managed by TIM. The principals of TIM decide to reward Wurtzel, either by doubling the commissions paid on trades executed through Turn Byer on Wurtzel&#x27;s referral accounts, or by paying Wurtzel a cash referral fee for each additional TIM account opened by a Wurtzel referral. The principals agree that any cash referral fee would need to be disclosed to clients in advance.<\/p><p><b>Case 4<\/b><\/p><p>Luna notes that her clients have become increasingly aware of the directed client brokerage/soft dollar commissions issue. At a recent meeting with one of her large pension clients, Service Workers Union Local No. 1418, the subject of directed commissions came up. Upon learning of the commission dollars available to their account, the Union trustees directed Luna to use their client brokerage of approximately $25,000 to donate to a think tank called the Hoover Study Center of Unions at Samford University. Service Workers trustees believe the Hoover study will increase the public awareness of the benefits unions offer to their members and increase union membership. Luna concurs with the trustee&#x27;s judgment on increasing union enrollment as a great goal, and follows the client&#x27;s instructions and makes the $25,000 contribution to the Hoover Study Center. Another client, Rosa Lutz, has asked Luna to credit the soft dollar client brokerage proceeds from her personal retirement accounts to Roswell Academy, to update their computer lab. Luna agrees that a new computer lab for Roswell Academy is greatly needed, and she allocates $10,000 of Lutz&#x27;s commission dollars to Roswell Academy.<\/p><\/div><\/details><div class=\"qtext\"><p>Would either compensation arrangement to reward Wurtzel for client referrals violate the CFA Institute Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "Is the use of client brokerage to make the $25,000 educational contribution to the Hoover Study Center of Unions a violation of the CFA Institute Standards of Professional Conduct?", "opts": ["Yes, because TIM must ensure that client brokerage fees are directed to the benefit of the client.", "Yes, because client brokerage must only be used to pay for goods and services directly related to the investment decision-making process.", "No, because the client brokerage has been spent at the specific direction of the client."], "ans": "A", "expl": "Standard III(A). In making a $25,000 contribution to the Hoover Study Center of Unions, Luna has violated Standard III(A) Duties to Clients – Loyalty, Prudence, and Care, which states that Members and Candidates must act for the benefit of their clients and place their clients' interest before their employers' or their own interest. In relationship with clients, Members and Candidates must determine applicable fiduciary duty and must comply with such duty to the persons and interests to whom it is owed. The contribution to the Hoover Study Center of Unions, authorized by the trustees of the union, brings into question this acting for the benefit of the client. Despite providing guidance and governance for the union, trustees are not the client of the union fund; rather, the members of the union and their beneficiaries are the clients of the fund. By making a $25,000 contribution from the client brokerage, Luna and the trustees have used funds that rightly belong to the members of the union and they have done so without direct compensation to the union members. Luna should not have authorized the pension account to make the contribution and having done so violated her duty to loyally guard the assets of her clients as a fiduciary. Luna has an obligation to follow the Code and Standards. Client brokerage is the property of the client, not the trustee or fiduciary representing the client. For Further Reference: (Study Session 1, Module 2.4, LOS 2.a)", "explhtml": "<p>Standard III(A). In making a $25,000 contribution to the Hoover Study Center of Unions, Luna has violated Standard III(A) Duties to Clients – Loyalty, Prudence, and Care, which states that Members and Candidates must act for the benefit of their clients and place their clients&#x27; interest before their employers&#x27; or their own interest. In relationship with clients, Members and Candidates must determine applicable fiduciary duty and must comply with such duty to the persons and interests to whom it is owed. The contribution to the Hoover Study Center of Unions, authorized by the trustees of the union, brings into question this acting for the benefit of the client. Despite providing guidance and governance for the union, trustees are not the client of the union fund; rather, the members of the union and their beneficiaries are the clients of the fund. By making a $25,000 contribution from the client brokerage, Luna and the trustees have used funds that rightly belong to the members of the union and they have done so without direct compensation to the union members. Luna should not have authorized the pension account to make the contribution and having done so violated her duty to loyally guard the assets of her clients as a fiduciary. Luna has an obligation to follow the Code and Standards. Client brokerage is the property of the client, not the trustee or fiduciary representing the client.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.4, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>For the past 15 years, Susan Luna, CFA, Kyle Lawson, CFA, and Matt Miller, CFA, have worked together as equity analysts and then equity portfolio managers in the investment management division (BIMCO) of Broadway Life Insurance Company. For the past five years, the three associates have worked together managing the BIMCO Aggressive Growth Fund (BAGF). During their management tenure, the BAGF had excellent performance and was well recognized in the financial press.<\/p><p>Just over one year ago, Broadway Life was acquired by a larger company, Gobble Insurance, and as part of the consolidation process, BIMCO was closed. The closure allowed Luna, Lawson, and Miller to start their own investment management firm, Trio Investment Management LLC (TIM). TIM focuses on the small capitalization growth equities area. This is the same investment focus as the BAGF, but TIM will have individually managed accounts. Several cases have arisen calling for interpretation as to consistency with CFA Institute Standards of Professional Conduct.<\/p><p><b>Case 1<\/b><\/p><p>TIM markets its investment management services by contracting with small, local bank trust departments. One of the newest bank trust clients for TIM is Shadow Mountain Bank and Trust. Judy Sampson, CFA, the trust officer for Shadow Mountain, has scheduled a meeting with a potential client. When Lawson arrives for the client meeting, he finds that all the TIM marketing material, including biographies of TIM portfolio managers, has been relabeled by Sampson as the Shadow Mountain Wealth Management Team. Sampson has also added the performance of BAGF into the current TIM Equity Composite Index portfolio and relabeled the resultant combined graph, the Shadow Mountain Equity Composite Index. Sampson states that making such changes would probably please clients and improve the chances of acquiring additional trust management accounts for Shadow Mountain and TIM. Lawson goes along and makes the presentation to the potential client using the Shadow Mountain marketing material and the relabeled BAGF/TIM equity performance record.<\/p><p><b>Case 2<\/b><\/p><p>Susan Luna of TIM is meeting with Sol Wurtzel, an institutional salesman for Turn Byer, a large national brokerage firm. Luna complains that TIM&#x27;s technology costs are too high, especially their outside software services costs. TIM currently subscribes to two investment-related software services. The first software vendor is StockCal Software Services (StockCal), which provides valuation and stock-charting capabilities that TIM uses in its equity research and selection process. The other vendor is Add-Invest Software (Add-Invest), a software program providing account management and performance evaluation reporting, which TIM uses in developing monthly reports for all clients. In response to Luna, Wurtzel suggests that Turn Byer has an excellent soft dollar trading desk and would be willing to offer to cover TIM&#x27;s StockCal and Add-Invest expenses through soft dollar commissions. Luna then reviews TIM&#x27;s projected commission dollars for the year and decides there are more than enough soft dollars to pay the StockCal, AGF, and Add-Invest Software bills combined. Luna believes she can be assured of excellent trade execution from Turn Byer and improved profitability for TIM because of the increased use of soft dollars. Luna then directs that the StockCal and Add-Invest software services be paid for with soft dollar or client brokerage dollars.<\/p><p><b>Case 3<\/b><\/p><p>Sol Wurtzel, the equity salesman for Turn Byer, has referred several clients to TIM over the past year. In fact, Wurtzel referrals currently account for almost 20% of the assets managed by TIM. The principals of TIM decide to reward Wurtzel, either by doubling the commissions paid on trades executed through Turn Byer on Wurtzel&#x27;s referral accounts, or by paying Wurtzel a cash referral fee for each additional TIM account opened by a Wurtzel referral. The principals agree that any cash referral fee would need to be disclosed to clients in advance.<\/p><p><b>Case 4<\/b><\/p><p>Luna notes that her clients have become increasingly aware of the directed client brokerage/soft dollar commissions issue. At a recent meeting with one of her large pension clients, Service Workers Union Local No. 1418, the subject of directed commissions came up. Upon learning of the commission dollars available to their account, the Union trustees directed Luna to use their client brokerage of approximately $25,000 to donate to a think tank called the Hoover Study Center of Unions at Samford University. Service Workers trustees believe the Hoover study will increase the public awareness of the benefits unions offer to their members and increase union membership. Luna concurs with the trustee&#x27;s judgment on increasing union enrollment as a great goal, and follows the client&#x27;s instructions and makes the $25,000 contribution to the Hoover Study Center. Another client, Rosa Lutz, has asked Luna to credit the soft dollar client brokerage proceeds from her personal retirement accounts to Roswell Academy, to update their computer lab. Luna agrees that a new computer lab for Roswell Academy is greatly needed, and she allocates $10,000 of Lutz&#x27;s commission dollars to Roswell Academy.<\/p><\/div><\/details><div class=\"qtext\"><p>Is the use of client brokerage to make the $25,000 educational contribution to the Hoover Study Center of Unions a violation of the CFA Institute Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Is the use of client brokerage to make the $10,000 contribution to the Roswell Academy a violation of the CFA Institute Standards of Professional Conduct?", "opts": ["Yes, because client brokerage must only be used to pay for goods and services directly related to the investment decision-making process.", "Yes, because client brokerage of tax-deferred accounts cannot be used to make charitable contributions.", "No, because the client brokerage has been spent at the specific direction of the client."], "ans": "C", "expl": "Standard III(A). In this case, Lutz is the client and, therefore, the direct owner of the client brokerage. If Lutz's desire is to give the soft dollar client brokerage asset to the Roswell Academy, she is free to do so because it is her asset. She is sole owner of her own retirement account. Luna, by following the wishes of the client, is complying with her duty of loyalty. Thus, there is no violation of Standard III(A) Duties to Clients – Loyalty, Prudence, and Care, in the case of the $10,000 contribution to Roswell Academy. For Further Reference: (Study Session 1, Module 2.4, LOS 2.a)", "explhtml": "<p>Standard III(A). In this case, Lutz is the client and, therefore, the direct owner of the client brokerage. If Lutz&#x27;s desire is to give the soft dollar client brokerage asset to the Roswell Academy, she is free to do so because it is her asset. She is sole owner of her own retirement account. Luna, by following the wishes of the client, is complying with her duty of loyalty. Thus, there is no violation of Standard III(A) Duties to Clients – Loyalty, Prudence, and Care, i referrals currently account for almost 20% of the assets managed by TIM. The principals of TIM decide to reward Wurtzel, either by doubling the commissions paid on trades executed through Turn Byer on Wurtzel&#x27;s referral accounts, or by paying Wurtzel a cash referral fee for each additional TIM account opened by a Wurtzel referral. The principals agree that any cash referral fee would need to be disclosed to clients in advance.<\/p><p><b>Case 4<\/b><\/p><p>Luna notes that her clients have become increasingly aware of the directed client brokerage/soft dollar commissions issue. At a recent meeting with one of her large pension clients, Service Workers Union Local No. 1418, the subject of directed commissions came up. Upon learning of the commission dollars available to their account, the Union trustees directed Luna to use their client brokerage of approximately $25,000 to donate to a think tank called the Hoover Study Center of Unions at Samford University. Service Workers trustees believe the Hoover study will increase the public awareness of the benefits unions offer to their members and increase union membership. Luna concurs with the trustee&#x27;s judgment on increasing union enrollment as a great goal, and follows the client&#x27;s instructions and makes the $25,000 contribution to the Hoover Study Center. Another client, Rosa Lutz, has asked Luna to credit the soft dollar client brokerage proceeds from her personal retirement accounts to Roswell Academy, to update their computer lab. Luna agrees that a new computer lab for Roswell Academy is greatly needed, and she allocates $10,000 of Lutz&#x27;s commission dollars to Roswell Academy.<\/p><\/div><\/details><div class=\"qtext\"><p>Is the use of client brokerage to make the $10,000 contribution to the Roswell Academy a violation of the CFA Institute Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Shears's supervisor, Sam Kite, expresses concern that equation (1) might be misspecified. Specifically, Kite refers to the finding that \"sales have been increasing at a fairly constant rate over time.\" Which of the following data transformations should be applied to the dependent variable in equation (1) to best address Kite's concern?", "opts": ["Lagged transformation.", "Logarithmic transformation.", "First difference transformation."], "ans": "B", "expl": "A logarithmic transformation of the dependent variable is the most appropriate transformation to apply when the variable grows at a constant rate over time: ln(sales) = a + b t + e * * The slope of this equation equals the nominal constant rate. The effective rate equals e − 1. b* For Further Reference: (Study Session 2, Module 6.1, LOS 6.b)", "explhtml": "<p>A logarithmic transformation of the dependent variable is the most appropriate transformation to apply when the variable grows at a constant rate over time:<\/p><div class=\"tbl\"><table><tr><td>ln(sales) = a  + b t + e<\/td><td>*<\/td><td>*<\/td><\/tr><tr><td>The slope of this equation equals the nominal constant rate. The effective rate equals e  − 1.<\/td><td>b*<\/td><td><\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 6.1, LOS 6.b)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>William Shears, CFA, has been assigned the task of predicting sales for the specialty retail industry. Shears finds that sales have been increasing at a fairly constant rate over time and decides to estimate the linear trend in sales for the industry using quarterly data over the past 15 years, starting with Quarter 1 of 2004 and ending with Quarter 4 of 2018. On January 1, 2019, Shears estimates the following model:<\/p><p>sales  = b  + b t + e  (1)<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t<\/td><\/tr><tr><td>where:<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>sales = quarterly sales (measured in $ millions) for the specialty retail industry<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>b  = intercept term<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>0<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>b  = slope<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>1<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>t = time variable (quarter number)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>e = random error<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Exhibit 1 provides the results of the linear trend regression.<\/p><p><b>Exhibit 1: Linear Trend Regression<\/b><\/p><p>Coefficient Standard Error<\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>10.0<\/td><td>3.50<\/td><\/tr><tr><td>Trend<\/td><td>16.0<\/td><td>6.55<\/td><\/tr><\/table><\/div><p>Shears also estimates an autoregressive model of order one, AR(1), using the changes in quarterly sales data for the industry from the first quarter of 2004 through the fourth quarter of 2018. He obtains the following results for his AR(1) model:<\/p><div class=\"tbl\"><table><tr><td>∆sales  = b  + b ∆sales<\/td><td> + e<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t–1<\/td><td>t<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: AR(1) Model for Changes in Industry Sales<\/b><\/p><p>Coefficient Standard Error<\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>20.00<\/td><td>2.15<\/td><\/tr><tr><td>Lag 1<\/td><td>0.10<\/td><td>0.04<\/td><\/tr><\/table><\/div><p>The autocorrelations for the first four lags from Shears&#x27;s AR(1) model are provided in Exhibit 3:<\/p><p><b>Exhibit 3: Autocorrelations From the AR(1) Model<\/b><\/p><p>Lag Autocorrelation p-Value<\/p><div class=\"tbl\"><table><tr><td>1<\/td><td>–0.032<\/td><td>0.38<\/td><\/tr><tr><td>2<\/td><td>–0.200<\/td><td>0.16<\/td><\/tr><tr><td>3<\/td><td>–0.065<\/td><td>0.23<\/td><\/tr><tr><td>4<\/td><td>0.470<\/td><td>0.02<\/td><\/tr><\/table><\/div><p>Shears also derives a regression using the residuals from the AR(1) model. He regresses the squared residuals (or estimated errors) against the lagged squared residuals. The results of this regression are reported in Exhibit 4.<\/p><p><b>Exhibit 4: Squared Residuals Regression<\/b><\/p><p>Coefficient Standard Error p-Value<\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>3.00<\/td><td>0.577<\/td><td>0.01<\/td><\/tr><tr><td>Lagged residual squared<\/td><td>0.28<\/td><td>0.185<\/td><td>0.31<\/td><\/tr><\/table><\/div><p>Quarterly sales for the Specialty Retail Industry during 2018 were:<\/p><p><b>Exhibit 5: 2018 Quarterly Industry Sales<\/b><\/p><div class=\"tbl\"><table><tr><td>Quarter<\/td><td>Sales (in millions)<\/td><\/tr><tr><td>Quarter 1, 2018<\/td><td>900<\/td><\/tr><tr><td>Quarter 2, 2018<\/td><td>925<\/td><\/tr><tr><td>Quarter 3, 2018<\/td><td>950<\/td><\/tr><tr><td>Quarter 4, 2018<\/td><td>1,000<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Shears&#x27;s supervisor, Sam Kite, expresses concern that equation (1) might be misspecified. Specifically, Kite refers to the finding that &quot;sales have been increasing at a fairly constant rate over time.&quot;<\/p><p>Which of the following data transformations should be applied to the dependent variable in equation (1) to best address Kite&#x27;s concern?<\/p><\/div>", "subj": "quant"}, {"n": 8, "q": "Using the results for the linear trend equation in Exhibit 1, the specialty retail industry sales forecast for Quarter 1 of 2019 is closest to:", "opts": ["$26 million.", "$976 million.", "$986 million."], "ans": "C", "expl": "Quarter 1 of 2019 is the 61st quarter (starting with Quarter 1 of 2004): sales = 10 + 16(61) = $986 million. For Further Reference: (Study Session 2, Module 6.1, LOS 6.b)", "explhtml": "<p>Quarter 1 of 2019 is the 61st quarter (starting with Quarter 1 of 2004): sales = 10 + 16(61) = $986 million.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 6.1, LOS 6.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>William Shears, CFA, has been assigned the task of predicting sales for the specialty retail industry. Shears finds that sales have been increasing at a fairly constant rate over time and decides to estimate the linear trend in sales for the industry using quarterly data over the past 15 years, starting with Quarter 1 of 2004 and ending with Quarter 4 of 2018. On January 1, 2019, Shears estimates the following model:<\/p><p>sales  = b  + b t + e  (1)<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t<\/td><\/tr><tr><td>where:<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>sales = quarterly sales (measured in $ millions) for the specialty retail industry<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>b  = intercept term<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>0<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>b  = slope<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>1<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>t = time variable (quarter number)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>e = random error<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Exhibit 1 provides the results of the linear trend regression.<\/p><p><b>Exhibit 1: Linear Trend Regression<\/b><\/p><p>Coefficient Standard Error<\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>10.0<\/td><td>3.50<\/td><\/tr><tr><td>Trend<\/td><td>16.0<\/td><td>6.55<\/td><\/tr><\/table><\/div><p>Shears also estimates an autoregressive model of order one, AR(1), using the changes in quarterly sales data for the industry from the first quarter of 2004 through the fourth quarter of 2018. He obtains the following results for his AR(1) model:<\/p><div class=\"tbl\"><table><tr><td>∆sales  = b  + b ∆sales<\/td><td> + e<\/td><td><\/td><t
